card: BT10-111
name: "Shoutmon (King Version)"
kind: digimon
level: 4
color: [red]
cost: 5
dp: 4000
traits: [Mini Dragon, Xros Heart]
alt_paths:
  - kind: digixros
    materials:
      - filter: { trait_has: "Xros Heart" }
        repeat: { min: 1, max: 1 }
    cost:
      formula:
        base: 5
        per: material_count
        delta: -2

effects:
  - when: on_play
    optional: true
    process:
      - select_trash:
          of: you
          bind_as: pick
          filter: { has_alt_path: digixros }
          prompt: "Return a DigiXros card to hand"
      - add_to_hand_from_trash: { of: you, card: pick }

  # Whole-clause raw_rust: registers a turn-scoped DigiXros wildcard modifier.
  - kind: raw_rust
    fn: bt10_111_arm_digixros_wildcard_for_turn
    triggers:
      - on_play

  - kind: grant_keyword
    keyword: MaterialSave
    value: 1

  - scope: inherited
    kind: aura
    active_when:
      all_of:
        - on_field: true
        - source_name_contains: "Shoutmon"
    target: { permanent: carrier }
    dp_modifier: 2000
