name: desktop-release

on:
  push:
    tags:
      # Real releases — build + publish to the alpha updater channel.
      - 'desktop-v*'
      # CI-only builds — build the matrix but NOT publish (the publish job is
      # gated to desktop-v* below). Lets us benchmark the build by pushing a
      # tag like `desktop-ci-1` without shipping anything to users.
      - 'desktop-ci-*'
  # Manual trigger for CI testing: runs the build job only (the publish job is
  # gated to tag pushes), so we can exercise/benchmark the build without
  # shipping a release to the alpha updater channel. Usable from the Actions
  # tab once this trigger lands on the default branch.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # fail-fast off: let the Windows leg run to completion even when the
      # Linux leg fails, so each iteration yields signal from both targets.
      fail-fast: false
      matrix:
        include:
          # NOTE: src-tauri is a cargo WORKSPACE member, so bundles land in
          # the workspace-root target/, not code/src-tauri/target/.
          # `bundles` limits `cargo tauri build` to the single artifact we ship
          # per platform — skipping the .deb/.rpm (Linux) and .msi (Windows)
          # bundles that the publish step never uploads.
          - runner: windows-latest
            target: windows-x86_64
            bundles: nsis
            bundle_glob: 'target/release/bundle/nsis/*-setup.exe'
          - runner: ubuntu-latest
            target: linux-x86_64
            bundles: appimage
            bundle_glob: 'target/release/bundle/appimage/*.AppImage'
    runs-on: ${{ matrix.runner }}
    steps:
      # No submodules: the desktop app builds entirely from the cargo workspace
      # under code/. DCGO (the only submodule) is a multi-GB Unity checkout used
      # for engine reference/recording, never linked into the desktop bundle.
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Cache the whole workspace target/ — the Tauri bundle (and all of
          # digimon-engine's deps) build into the workspace-root target/, not
          # code/src-tauri/target/, so the narrower scope missed most artifacts.
          workspaces: '. -> target'
          cache-on-failure: true
          key: phase7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: code/frontend/package-lock.json

      - name: Install Linux system deps
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      - name: Install frontend deps
        working-directory: code/frontend
        run: npm ci

      # No explicit frontend build step: `cargo tauri build` runs the
      # `beforeBuildCommand` (`npm run build:desktop`) itself, and the prod URLs
      # are baked in via code/frontend/.env.desktop (loaded by `--mode desktop`),
      # not CI env. A separate `npm run build` here just built the bundle twice.

      - name: Install Tauri CLI (prebuilt binary)
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Build + sign Tauri bundle
        working-directory: code/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Collect artifact paths
        id: collect
        shell: bash
        run: |
          INSTALLER=$(ls ${{ matrix.bundle_glob }} | head -n1)
          echo "installer=$INSTALLER" >> "$GITHUB_OUTPUT"
          echo "signature=${INSTALLER}.sig" >> "$GITHUB_OUTPUT"
          echo "Installer: $INSTALLER"
          ls -lh "$INSTALLER" "${INSTALLER}.sig"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            ${{ steps.collect.outputs.installer }}
            ${{ steps.collect.outputs.signature }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    # Only publish a real release on a desktop-v* tag push. Manual
    # workflow_dispatch runs build the matrix above but skip publishing.
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch annotated tag object
        shell: bash
        run: |
          # actions/checkout fetches the tag as a lightweight ref pointing at
          # the commit, so `git tag -l --format='%(contents)'` returns the
          # MERGE COMMIT message instead of the curated tag body (the 0.1.0
          # manifest shipped "Merge pull request #614..." as its notes).
          # Force-fetch the real annotated tag object, then verify we got one.
          git fetch origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" --force
          echo "tag object type: $(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Resolve version + engine_commit + notes
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#desktop-v}"
          ENGINE_COMMIT=$(git rev-parse --short HEAD)
          # Prefer the tag annotation (`git tag -a -m "..."`); fall back to
          # the templated .github/RELEASE_NOTES.md (with {{VERSION}} replaced)
          # which is the pre-existing convention from the prior workflow.
          # Only trust %(contents) when the ref is a real annotated tag object
          # (type "tag") — on a lightweight tag it returns the commit message.
          NOTES=""
          if [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ]; then
            NOTES=$(git tag -l --format='%(contents)' "$TAG")
          fi
          if [ -z "$NOTES" ] && [ -f .github/RELEASE_NOTES.md ]; then
            NOTES=$(sed "s/{{VERSION}}/$VERSION/g" .github/RELEASE_NOTES.md)
          fi
          if [ -z "$NOTES" ]; then NOTES="Release $VERSION"; fi
          # Default min_version to X.Y.0 for an X.Y.Z[-suffix] tag.
          # Bump via PATCH /admin/releases/{id} {"min_version": "..."} afterward
          # when you need the kill-switch semantics.
          MAJ_MIN=$(echo "$VERSION" | sed -E 's/([0-9]+\.[0-9]+)\..*/\1.0/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "engine_commit=$ENGINE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "min_version=$MAJ_MIN" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release on hosted API
        id: create
        env:
          HOSTED_API_URL: ${{ secrets.HOSTED_API_URL }}
          CI_ADMIN_TOKEN: ${{ secrets.CI_ADMIN_TOKEN }}
          # Step outputs must reach the script via env, never inline ${{ }}
          # inside run: — the notes contain backticks (e.g. `...msi` in
          # RELEASE_NOTES.md) that bash executes as command substitution,
          # which broke the desktop-v0.3.0 publish.
          VERSION: ${{ steps.meta.outputs.version }}
          ENGINE_COMMIT: ${{ steps.meta.outputs.engine_commit }}
          MIN_VERSION: ${{ steps.meta.outputs.min_version }}
          NOTES: ${{ steps.meta.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(jq -n \
            --arg version "$VERSION" \
            --arg engine_commit "$ENGINE_COMMIT" \
            --arg min_version "$MIN_VERSION" \
            --arg notes "$NOTES" \
            '{
               version: $version,
               channel: "alpha",
               engine_commit: $engine_commit,
               min_version: $min_version,
               release_notes: $notes,
               targets: ["windows-x86_64", "linux-x86_64"]
             }')
          curl -fsS -X POST "$HOSTED_API_URL/admin/releases" \
            -H "Authorization: Bearer $CI_ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" > /tmp/create.json
          RELEASE_ID=$(jq -r '.release_id' /tmp/create.json)
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Created release $RELEASE_ID"

      - name: Upload artifacts and confirm
        env:
          HOSTED_API_URL: ${{ secrets.HOSTED_API_URL }}
          CI_ADMIN_TOKEN: ${{ secrets.CI_ADMIN_TOKEN }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          for row in $(jq -c '.artifacts[]' /tmp/create.json); do
            TARGET=$(echo "$row" | jq -r '.target')
            URL=$(echo "$row" | jq -r '.upload_url')
            FILENAME=$(echo "$row" | jq -r '.filename')
            ART_DIR="artifacts/desktop-$TARGET"
            case "$TARGET" in
              windows-x86_64) LOCAL=$(ls "$ART_DIR"/*-setup.exe | head -n1) ;;
              linux-x86_64)   LOCAL=$(ls "$ART_DIR"/*.AppImage  | head -n1) ;;
              *) echo "unknown target $TARGET" >&2; exit 1 ;;
            esac
            SIG_FILE="${LOCAL}.sig"
            echo "Uploading $LOCAL -> Spaces"
            curl -fsS -X PUT --data-binary "@${LOCAL}" \
              -H "Content-Type: application/octet-stream" \
              -H "x-amz-acl: public-read" \
              "$URL"
            SIG_B64=$(cat "$SIG_FILE" | tr -d '\n')
            echo "Confirming $TARGET"
            curl -fsS -X POST \
              "$HOSTED_API_URL/admin/releases/$RELEASE_ID/artifacts/$TARGET/confirm" \
              -H "Authorization: Bearer $CI_ADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg sig "$SIG_B64" '{signature_b64: $sig}')"
          done

      - name: Publish release
        env:
          HOSTED_API_URL: ${{ secrets.HOSTED_API_URL }}
          CI_ADMIN_TOKEN: ${{ secrets.CI_ADMIN_TOKEN }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
        run: |
          curl -fsS -X POST \
            "$HOSTED_API_URL/admin/releases/$RELEASE_ID/publish" \
            -H "Authorization: Bearer $CI_ADMIN_TOKEN"

      - name: Create GitHub release entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env, not inline ${{ }} — see "Create release on hosted API".
          VERSION: ${{ steps.meta.outputs.version }}
          NOTES: ${{ steps.meta.outputs.notes }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Desktop $VERSION" \
            --notes "$NOTES" \
            artifacts/desktop-windows-x86_64/* \
            artifacts/desktop-linux-x86_64/*
