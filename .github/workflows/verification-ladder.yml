name: Verification Ladder

on:
  pull_request:
    paths:
      - 'code/digimon-engine/**'
      - 'code/digimon-dsl/**'
      - 'code/tools/**'
      - 'qa/impact/**'
      - 'qa/replay-goldens/**'
      - 'qa/rules/**'
      - 'qa/verification/**'
      - 'scripts/verify'
      - 'scripts/nextest_rust_min_stack.py'
      - '.config/nextest.toml'
      - '.github/workflows/verification-ladder.yml'
  push:
    branches: ["main"]
    paths:
      - 'code/digimon-engine/**'
      - 'code/digimon-dsl/**'
      - 'code/tools/**'
      - 'qa/impact/**'
      - 'qa/replay-goldens/**'
      - 'qa/rules/**'
      - 'qa/verification/**'
      - 'scripts/verify'
      - 'scripts/nextest_rust_min_stack.py'
      - '.config/nextest.toml'
      - '.github/workflows/verification-ladder.yml'
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

jobs:
  tier-1:
    name: Tier 1 fast semantic canaries
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        run: python -m pip install pytest pyyaml
      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-verification-ladder-${{ hashFiles('Cargo.lock', 'code/digimon-engine/Cargo.toml', 'code/digimon-dsl/Cargo.toml') }}
      - name: Run tier 1
        env:
          RUST_MIN_STACK: "268435456"
        run: python scripts/verify --tier 1

  tier-2:
    name: Tier 2 scoped behavior
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        run: python -m pip install pytest pyyaml
      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-verification-ladder-${{ hashFiles('Cargo.lock', 'code/digimon-engine/Cargo.toml', 'code/digimon-dsl/Cargo.toml') }}
      - name: Run tier 2
        env:
          RUST_MIN_STACK: "268435456"
          RUST_TEST_THREADS: "1"
        run: python scripts/verify --tier 2

  tier-3:
    name: Tier 3 nightly seal
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        run: python -m pip install pytest pyyaml
      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-verification-ladder-${{ hashFiles('Cargo.lock', 'code/digimon-engine/Cargo.toml', 'code/digimon-dsl/Cargo.toml') }}
      - name: Run tier 3
        env:
          RUST_MIN_STACK: "268435456"
          RUST_TEST_THREADS: "1"
        run: python scripts/verify --tier 3 --continue-on-failure
