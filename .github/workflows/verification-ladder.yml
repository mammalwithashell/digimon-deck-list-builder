name: Verification Ladder

on:
  pull_request:
    paths:
      - 'code/digimon-engine/**'
      - 'code/digimon-dsl/**'
      - 'code/tools/**'
      - 'qa/impact/**'
      - 'qa/replay-goldens/**'
      - 'qa/rules/**'
      - 'qa/verification/**'
      - 'scripts/verify'
      - 'scripts/nextest_rust_min_stack.py'
      - '.config/nextest.toml'
      - '.github/workflows/verification-ladder.yml'
      - 'qa/qa-reports/exam-verdicts/**'
      - 'qa/exam-clause-text.json'
      - 'data/deck_library.json'
      - 'data/oracle_readiness.json'
      - 'code/digimon_gym/agents/card_admissibility.py'
      - 'code/digimon_gym/agents/gauntlet.py'
      - 'code/data_paths.py'
      - 'data/mechanics_readiness.json'
      - 'data/card_admissibility.json'
      - 'data/tested_cards.json'
      - 'qa/qa-reports/validated_cards*.json'
      - 'data/cards.json'
      - 'data/card_official.json'
      - 'data/card_overrides.json'
  push:
    branches: ["main"]
    paths:
      - 'code/digimon-engine/**'
      - 'code/digimon-dsl/**'
      - 'code/tools/**'
      - 'qa/impact/**'
      - 'qa/replay-goldens/**'
      - 'qa/rules/**'
      - 'qa/verification/**'
      - 'scripts/verify'
      - 'scripts/nextest_rust_min_stack.py'
      - '.config/nextest.toml'
      - '.github/workflows/verification-ladder.yml'
      - 'qa/qa-reports/exam-verdicts/**'
      - 'qa/exam-clause-text.json'
      - 'data/deck_library.json'
      - 'data/oracle_readiness.json'
      - 'code/digimon_gym/agents/card_admissibility.py'
      - 'code/digimon_gym/agents/gauntlet.py'
      - 'code/data_paths.py'
      - 'data/mechanics_readiness.json'
      - 'data/card_admissibility.json'
      - 'data/tested_cards.json'
      - 'qa/qa-reports/validated_cards*.json'
      - 'data/cards.json'
      - 'data/card_official.json'
      - 'data/card_overrides.json'
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

jobs:
  tier-1:
    name: Tier 1 fast semantic canaries
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        run: python -m pip install pytest pyyaml
      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-verification-ladder-${{ hashFiles('Cargo.lock', 'code/digimon-engine/Cargo.toml', 'code/digimon-dsl/Cargo.toml') }}
      - name: Run tier 1
        env:
          RUST_MIN_STACK: "268435456"
        run: python scripts/verify --tier 1

  card-admissibility:
    # scripts/verify tier 0 skips the admissibility drift check where no
    # `digimon_engine` wheel is installed (bare runners). This job builds the wheel
    # and runs the check unskipped, so the committed data/card_admissibility.json
    # cannot go stale unnoticed.
    name: Card admissibility artifact is fresh
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Exactly what `import digimon_gym.agents.gauntlet` pulls in beyond the stdlib
      # (verified via sys.modules): numpy, gymnasium, and the digimon_engine wheel built
      # below. requirements-training.txt is deliberately not used: it adds torch/SB3.
      - name: Install maturin and the gauntlet's imports
        run: python -m pip install maturin numpy gymnasium
      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-card-admissibility-${{ hashFiles('Cargo.lock', 'code/digimon-engine/Cargo.toml', 'code/digimon-dsl/Cargo.toml') }}
      - name: Build and install the engine wheel
        run: |
          cd code/digimon-engine-py
          maturin build --out "$RUNNER_TEMP/wheels"
          python -m pip install "$RUNNER_TEMP"/wheels/*.whl
      - name: Check data/card_admissibility.json
        run: PYTHONPATH=code python -m digimon_gym.agents.card_admissibility --check

  tier-2:
    name: Tier 2 scoped behavior
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        run: python -m pip install pytest pyyaml
      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-verification-ladder-${{ hashFiles('Cargo.lock', 'code/digimon-engine/Cargo.toml', 'code/digimon-dsl/Cargo.toml') }}
      - name: Run tier 2
        env:
          RUST_MIN_STACK: "268435456"
          RUST_TEST_THREADS: "1"
        run: python scripts/verify --tier 2

  tier-3:
    name: Tier 3 nightly seal
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        run: python -m pip install pytest pyyaml
      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-verification-ladder-${{ hashFiles('Cargo.lock', 'code/digimon-engine/Cargo.toml', 'code/digimon-dsl/Cargo.toml') }}
      - name: Run tier 3
        env:
          RUST_MIN_STACK: "268435456"
          RUST_TEST_THREADS: "1"
        run: python scripts/verify --tier 3 --continue-on-failure
