name: Engine Clone-Safety & Both-Path Guard

# make-engine-cloneable task 1.4 — keep BOTH execution paths green during the
# closure-executor → resumable-data-VM transition.
#
# The resumable VM (`run_resume` over `ResumeFrame`/`ResumeSelectKind`) and the
# legacy closure executor (`resolve_generic_selection`'s `sel.callback` branch)
# coexist behind a per-installer switch until the whole selection surface is
# migrated (tasks 3.1 / 6.1). The `cards_behavioral` suite exercises BOTH paths
# at once — resume-flipped installers route through `pending_selection_resume`,
# the not-yet-flipped ones still route through the closure — so a green run is
# the parity gate D6 calls for. The engine lib tests carry the clone-guard
# (`resume::tests::game_clone_is_independent_and_replays_identically` and the
# per-installer `*_clones_faithfully_*` analogues) that prove `Game: Clone` stays
# independent + replays identically.
#
# Migration tracker (the doc half of task 1.4):
#   openspec/changes/make-engine-cloneable/migration-playbook.md
#   openspec/changes/make-engine-cloneable/tasks.md (§3.1 batch log)
#   .claude/plans/make-engine-cloneable-remaining-installers.md

on:
  pull_request:
    paths:
      - 'code/digimon-engine/**'
      - 'code/digimon-dsl/**'
      - '.github/workflows/engine-clone-safety.yml'
  push:
    branches: ["main"]
    paths:
      - 'code/digimon-engine/**'
      - 'code/digimon-dsl/**'
      - '.github/workflows/engine-clone-safety.yml'

jobs:
  clone-safety-and-both-path:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install lld linker
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lld

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-engine-clone-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'code/digimon-engine/Cargo.toml', 'code/digimon-dsl/Cargo.toml') }}

      # The clone-independence / clone-replays-identically guard tests live in
      # the engine lib (`src/resume.rs` #[cfg(test)] mod) alongside the
      # per-installer `*_clones_faithfully_*` analogues.
      - name: Clone-safety guard (engine lib unit tests)
        env:
          RUST_MIN_STACK: "268435456"
        run: cargo test -p digimon-engine --lib

      # The full per-card behavioral suite is the both-path parity gate: it runs
      # resume-flipped installers through the data VM and the rest through the
      # legacy closure executor in the same process.
      - name: Compile both-path parity suite
        env:
          RUST_MIN_STACK: "268435456"
        run: cargo test -p digimon-engine --test cards_behavioral --no-run

      - name: Both-path parity (all cards)
        env:
          RUST_MIN_STACK: "268435456"
        run: cargo test -p digimon-engine --test cards_behavioral -- --test-threads=8

      # Compile and run the DSL behavioral, archetype, judge-quiz, and
      # selection-pilot suites together so Cargo builds all four binaries in
      # parallel across all runner cores.
      - name: DSL, archetype, judge-quiz, and selection suites
        env:
          RUST_MIN_STACK: "268435456"
        run: >
          cargo test -p digimon-engine
          --test dsl --test archetypes --test judge_quiz --test selection
          --no-fail-fast -- --test-threads=8

      # Clone-fuzz — random real-deck playouts (starter pairs + an Appmon
      # link pair) that CLONE at every decision, resolve both copies, and
      # fingerprint-compare (plus ship-of-Theseus swaps). Scale with
      # CLONE_FUZZ_GAMES.
      - name: Clone-fuzz (per-decision fork faithfulness on real playouts)
        env:
          RUST_MIN_STACK: "268435456"
          CLONE_FUZZ_GAMES: "12"
        run: cargo test -p digimon-engine --test clone_fuzz --features dsl-yaml-loader

      # Continuously verify both debug cache differential oracles
      # (`effects_cache` and `tick_declarative_effects`) across all 3 deck
      # pairs (including Appmon link/App-Fusion) on every PR, reusing the
      # already-compiled `clone_fuzz` binary.
      - name: Cache differential oracle check (clone_fuzz, DIGIMON_VERIFY_CACHES=1)
        env:
          RUST_MIN_STACK: "268435456"
          CLONE_FUZZ_GAMES: "3"
          DIGIMON_VERIFY_CACHES: "1"
        run: cargo test -p digimon-engine --test clone_fuzz --features dsl-yaml-loader
