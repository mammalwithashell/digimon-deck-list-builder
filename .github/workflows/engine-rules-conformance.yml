name: Engine Rules Conformance

# Why this is its own workflow (not a second job in engine-clone-safety.yml):
# engine-clone-safety.yml is the make-engine-cloneable gate -- its single job,
# its path filter and its header all say "Game: Clone stays faithful". This
# workflow guards a different property -- that the rules-conformance deliverable
# and the curated integration-test binaries of `digimon-engine` keep compiling
# and passing -- and it also fires on rules-ledger / rules-doc edits that the
# clone-safety filter has no reason to watch. Separate files also give the two
# gates independent caches, required-check names and re-run buttons, and the
# two run in parallel.
#
# Why it exists: before this, only lib + cards_behavioral + dsl + archetypes +
# judge_quiz + selection + clone_fuzz ran in CI (plus the PR-only
# verification-ladder tier 1: rules_conformance / rules_faq /
# keyword_semantics_matrix). Every other `tests/*.rs` and `tests/<dir>/main.rs`
# binary rotted unnoticed -- five stale tests had accumulated in
# blocker_current_defender, force_attack_effect_tail_order and timing_dispatch
# by the time the rules-conformance campaign looked. This workflow (PR gate) plus
# engine-binary-rot.yml (nightly) now run them all.
#
# NOT duplicated here (already gated by engine-clone-safety.yml): cards_behavioral,
# dsl, archetypes, judge_quiz, selection, clone_fuzz and the engine lib tests.
# bench_engine_throughput is a `--release` benchmark, not a test.
#
# This workflow is the PR gate: the rules ledger checks, the rules_conformance
# deliverable, the binaries named by the campaign and every other
# `tests/<dir>/main.rs` binary, listed explicitly (31 binaries). The ~176
# one-file top-level `tests/*.rs` regression binaries are too slow to build
# per PR (each links its own executable); they run from engine-binary-rot.yml
# nightly, on push to main and on demand.
#
# Every cargo step uses --no-fail-fast and every step after the cache step
# runs `if: !cancelled()`, so one red suite never hides the others.

on:
  pull_request:
    paths:
      - 'code/digimon-engine/**'
      - 'code/digimon-dsl/**'
      - 'code/tools/rules/**'
      - 'qa/rules/**'
      - 'docs/digimon-rules/**'
      - '.github/workflows/engine-rules-conformance.yml'
  push:
    branches: ["main"]
    paths:
      - 'code/digimon-engine/**'
      - 'code/digimon-dsl/**'
      - 'code/tools/rules/**'
      - 'qa/rules/**'
      - 'docs/digimon-rules/**'
      - '.github/workflows/engine-rules-conformance.yml'

jobs:
  rules-conformance-and-core-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install pyyaml

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-engine-rules-core-${{ hashFiles('Cargo.lock', 'code/digimon-engine/Cargo.toml', 'code/digimon-dsl/Cargo.toml') }}

      # Cheap and first: fails in seconds, before any Rust compile.
      # build_obligations --check: the committed qa/rules obligations JSON is
      # exactly a fresh parse of docs/digimon-rules/cr-4.3.txt (the
      # 1,119-rule denominator).
      - name: Rules obligations ledger is fresh
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: code
        run: python -m tools.rules.build_obligations --check

      # coverage_report --check: every test a `proven` obligation names really
      # exists in the Rust suites; prints the denominator.
      - name: Rules coverage ledger names only real tests
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: code
        run: python -m tools.rules.coverage_report --check

      # --- The rules-conformance deliverable --------------------------------
      # rules_conformance: chapter-indexed (ch11..ch17) conformance suite for
      #   Comprehensive Rules 4.3 -- the proof side of the obligations ledger.
      # rules_faq: generated official-Q&A conformance cases.
      # keyword_semantics_matrix: per-keyword optional/mandatory table vs engine.
      - name: Rules conformance suites
        if: ${{ !cancelled() }}
        env:
          RUST_MIN_STACK: "268435456"
        run: >
          cargo test -p digimon-engine
          --test rules_conformance --test rules_faq --test keyword_semantics_matrix
          --no-fail-fast -- --test-threads=8

      # --- Binaries that rotted outside CI -----------------------------------
      # timing_dispatch: trigger timing / dispatch ordering (simultaneous
      #   triggers, turn-player ordering, once-per-condition).
      # cost_hooks: cost-modification / cost-payment hook seams.
      # blocker_current_defender: <Blocker> acts on the CURRENT defender.
      # force_attack_effect_tail_order: forced-attack effect tails resolve in
      #   rule order relative to the attack.
      - name: Timing, cost and attack-order regressions
        if: ${{ !cancelled() }}
        env:
          RUST_MIN_STACK: "268435456"
        run: >
          cargo test -p digimon-engine
          --test timing_dispatch --test cost_hooks
          --test blocker_current_defender --test force_attack_effect_tail_order
          --no-fail-fast -- --test-threads=8

      # combat: attack state machine + interrupts (Alliance/Counter/Block).
      # mask_and_tensor: action-mask + observation-tensor contracts.
      # keyword_phase_d/e/f: keyword machinery by implementation phase.
      # effect_context: the EffectContext card-scripting API surface.
      # replacements: replacement-effect pipeline (would-X substitutions).
      - name: Combat, mask/tensor, keyword phases, effect context, replacements
        if: ${{ !cancelled() }}
        env:
          RUST_MIN_STACK: "268435456"
        run: >
          cargo test -p digimon-engine
          --test combat --test mask_and_tensor
          --test keyword_phase_d --test keyword_phase_e --test keyword_phase_f
          --test effect_context --test replacements
          --no-fail-fast -- --test-threads=8

      # phase_flow: turn/phase state machine.  effects / effect_source_kind:
      # effect execution + source attribution.  event_emission: event stream.
      # deletion_batching: batched permanent deletion (CLAUDE.md rule 25).
      # option_flow: Option-card play/use flow.  flood_gates: floodgate /
      # prohibition effects.  dual_cards: DUAL-card handling.  policies:
      # built-in agent policies.  infra: determinism guard + harness infra.
      - name: Engine domain suites (phase flow, effects, events, deletion, options, ...)
        if: ${{ !cancelled() }}
        env:
          RUST_MIN_STACK: "268435456"
        run: >
          cargo test -p digimon-engine
          --test phase_flow --test effects --test effect_source_kind
          --test event_emission --test deletion_batching --test option_flow
          --test flood_gates --test dual_cards --test policies --test infra
          --no-fail-fast -- --test-threads=8

      # deck_tools: deck parse/validate.  ffi_parity / onnx_parity: binding and
      # ONNX observation parity.  determinization / search / selfplay: the
      # add-determinized-search stack (infoset sampling, PUCT, self-play).
      # invariant_fuzz: random-playout invariant checker (~90 s).
      - name: Tooling, parity and search suites
        if: ${{ !cancelled() }}
        env:
          RUST_MIN_STACK: "268435456"
        run: >
          cargo test -p digimon-engine
          --test deck_tools --test ffi_parity --test onnx_parity
          --test determinization --test search --test selfplay
          --test invariant_fuzz
          --no-fail-fast -- --test-threads=8
