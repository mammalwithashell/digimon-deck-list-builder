name: Landing page

# Deploys code/landing/ (static, no build step) to GitHub Pages.
# The page resolves download links client-side from the GitHub releases
# API, so it never needs redeploying for a new desktop release.

on:
  push:
    branches: [main]
    paths:
      - "code/landing/**"
      - ".github/workflows/landing-page.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: code/landing
      - id: deployment
        uses: actions/deploy-pages@v4
