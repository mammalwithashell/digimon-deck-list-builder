name: Search scheduler recovery

on:
  pull_request:
    paths:
      - code/tools/selfplay_scheduler.py
      - code/tools/run_selfplay_generation.py
      - code/tests/rl/test_selfplay_scheduler.py
      - code/tests/rl/test_search_generation_contract.py
      - code/tools/search_quality_study.py
      - code/tests/rl/test_search_quality_study.py
      - code/tools/search_budget_confirmation.py
      - code/tests/rl/test_search_budget_confirmation.py
      - code/digimon_gym/agents/card_eval.py
      - .github/workflows/search-scheduler.yml
  push:
    branches: [main]
    paths:
      - code/tools/selfplay_scheduler.py
      - code/tools/run_selfplay_generation.py
      - code/tests/rl/test_selfplay_scheduler.py
      - code/tests/rl/test_search_generation_contract.py
      - code/tools/search_quality_study.py
      - code/tests/rl/test_search_quality_study.py
      - code/tools/search_budget_confirmation.py
      - code/tests/rl/test_search_budget_confirmation.py
      - code/digimon_gym/agents/card_eval.py
      - .github/workflows/search-scheduler.yml

permissions:
  contents: read

jobs:
  recovery:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONPATH: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest code/tests/rl/test_selfplay_scheduler.py code/tests/rl/test_search_generation_contract.py code/tests/rl/test_search_quality_study.py code/tests/rl/test_search_budget_confirmation.py -q
