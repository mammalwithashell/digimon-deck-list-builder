name: "Basic Attack: attack security and verify attacker suspends"
description: |
  Place Cendrillmon (EX11-024, DP=12000) on P1 field with turn_played=-1
  to bypass summoning sickness. Attack the player (security check).
  Cendrillmon has high enough DP to survive most security battles.
  Verify it becomes suspended after attacking.

setup:
  deck1_archetype: "Puppets"
  deck2_archetype: "Puppets"
  memory: 10
  first_player: 1
  player1:
    field:
      - card_ids: ["EX11-024"]
        is_suspended: false
        turn_played: -1

actions:
  - find: "Attack player with Cendrillmon"
  - auto_resolve: true

assertions:
  - is_suspended:
      player: 1
      card: "EX11-024"
  - not_game_over: true
