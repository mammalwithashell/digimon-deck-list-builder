name: "Basic Play: play a Lv.4 Digimon from hand"
description: |
  Play BT16-055 (Namakemon, cost 4) from hand.
  Verify it appears on the field and memory is deducted.

setup:
  deck1_archetype: "Puppets"
  deck2_archetype: "Puppets"
  memory: 10
  first_player: 1
  starting_hand1: ["BT16-055"]

actions:
  - find: "Play Namakemon from hand"
  - auto_resolve: true

assertions:
  - zone_contains:
      player: 1
      zone: field
      card: "BT16-055"
  - memory_range:
      min: -100
      max: 6
  - not_game_over: true
