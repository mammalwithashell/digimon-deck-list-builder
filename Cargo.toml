[workspace]
members = [
    "code/digimon-dsl",
    "code/digimon-engine",
    "code/digimon-engine-cli",
    "code/digimon-engine-mcp",
    "code/digimon-engine-py",
    "code/src-tauri",
    "code/tools/dsl-schema-export",
    "code/tools/dsl-lint",
    "code/tools/action-space-export",
    "code/tools/dcgo-replay",
    "code/tools/dcgo-harness",
    "code/tools/archetype-static-tests",
]
resolver = "2"

# Release builds strip debug symbols from every workspace binary. The shipped
# desktop bundle (digimon-tcg) is the main beneficiary — stripping shaves tens
# of MB of symbol tables off the release binary at negligible build cost.
# `strip` is not per-package overridable, so it lives at the workspace root.
# More aggressive size knobs (lto, opt-level = "z", panic = "abort",
# codegen-units = 1) trade build time for size and are left off by default.
[profile.release]
strip = true

# Optimize dev/test builds while keeping compile/link times and binary sizes
# lean:
# - `opt-level = 1` keeps simulation-heavy tests fast (combined with lazy DSL
#   pack loading, O(1) DebugRunner overlays, and opt-in cache oracles) while
#   cutting LLVM codegen time on large test crates like `cards_behavioral`.
# - `debug = "line-tables-only"` preserves full file:line backtraces on panics
#   and assertion failures while shrinking `.rlib`/test binaries ~5x (~300 MB ->
#   ~50 MB each), slashing linker I/O and CI target-cache bloat.
# - `debug-assertions` deliberately stays ON (the dev default). The codebase
#   uses `debug_assert!` for real invariants.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Keep build scripts and build-dependencies (`build.rs` compiling ~5,000 YAML
# card specs into `cards.pack`) at `opt-level = 2` so `build.rs` stays fast.
[profile.dev.build-override]
opt-level = 2

# Optimize third-party dependencies without debuginfo (fast serde/regex/hash at
# test runtime, smaller `.rlib`s and faster linking).
[profile.dev.package."*"]
opt-level = 2
debug = 0

# `digimon-dsl` is a schema/compiler crate, never on the per-step simulation
# hot path once `cards.pack` is embedded. Compiling it at `opt-level = 0`
# shaves significant time off cold and incremental dev/test builds.
[profile.dev.package.digimon-dsl]
opt-level = 0
