[package]
name = "archetype-static-tests"
version = "0.1.0"
edition = "2021"
description = "Static archetype-level invariant checks (deck legality, coverage gate, smoke games, combo presence) for the digimon engine. Part of the add-archetype-interaction-test-author change."

[lib]
path = "src/lib.rs"

[[bin]]
name = "archetype-static-tests"
path = "src/main.rs"

[dependencies]
# The engine the checks construct + smoke against. Default features required
# (mirrors dcgo-replay / action-space-export).
digimon-engine = { path = "../../digimon-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
