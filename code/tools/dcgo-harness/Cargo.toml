[package]
name = "dcgo-harness"
version = "0.1.0"
edition = "2021"
description = "Submits DCGO harness jobs, reports queue status, and triages the resulting recording corpus. Phase 1 of the DCGO automation harness."

[lib]
path = "src/lib.rs"

[[bin]]
name = "dcgo-harness"
path = "src/main.rs"

[dependencies]
dcgo-replay = { path = "../dcgo-replay" }
digimon-engine = { path = "../../digimon-engine" }
action-space-export = { path = "../action-space-export" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
