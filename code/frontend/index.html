<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digimon TCG Simulator</title>
    <!-- Pre-paint theme bootstrap (add-desktop-design-system): set data-theme
         before first paint so there's no flash of the wrong theme. The storage
         key MUST match THEME_STORAGE_KEY in src/design/theme/themeStore.ts. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('desktop.theme');
          if (t !== 'dark' && t !== 'light') {
            t = 'dark';
            localStorage.setItem('desktop.theme', t);
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <!-- Pre-paint motion bootstrap (add-effects-and-motion-settings): set
         data-motion before first paint so animation gating is flash-free. The
         storage key MUST match MOTION_STORAGE_KEY in src/stores/uiStore.ts.
         Unlike the theme bootstrap this does NOT persist the derived default —
         leaving it unset keeps the OS prefers-reduced-motion hint driving the
         default until the user makes an explicit choice. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('desktop.motion');
          if (m !== 'full' && m !== 'reduced' && m !== 'off') {
            var reduce = false;
            try {
              reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            } catch (e) {}
            m = reduce ? 'reduced' : 'full';
          }
          document.documentElement.setAttribute('data-motion', m);
        } catch (e) {
          document.documentElement.setAttribute('data-motion', 'full');
        }
      })();
    </script>
  </head>
  <body class="bg-gray-900 text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
