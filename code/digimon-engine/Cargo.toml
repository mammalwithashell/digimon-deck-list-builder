[package]
name = "digimon-engine"
version = "0.1.0"
edition = "2021"
description = "Headless Digimon TCG game engine for RL training and desktop play"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
ort = { version = "2.0.0-rc.10", default-features = false, features = ["ndarray", "std", "download-binaries", "tls-rustls"] }
ndarray = "0.17"

# DSL lives in a separate leaf crate so build.rs can depend on it.
digimon-dsl = { path = "../digimon-dsl", optional = true }
serde_yml = { version = "0.0.12", optional = true }

[features]
default = ["dsl-yaml-loader", "test-helpers"]
dsl-yaml-loader = ["dep:digimon-dsl", "dep:serde_yml"]
# Test-only helpers (e.g. `DebugRunner::transfer_control`) gated behind this
# flag. On by default so integration tests can use them without an explicit
# `--features` flag; production callers who care can `default-features = false`.
test-helpers = []

[build-dependencies]
digimon-dsl = { path = "../digimon-dsl" }

[dev-dependencies]
# serde_yml is used directly in DSL test files (e.g. serde_yml::from_str).
serde_yml = "0.0.12"
strum = "0.26"

# Tests are grouped by domain into 7 binaries. Each binary's entry point is
# `tests/<domain>/main.rs`; sibling files are `mod`-imported and supply the
# `#[test]` fns. Run a single domain with `cargo test --test <domain>`.
#
# Cargo does not auto-discover `tests/<dir>/main.rs`, so each domain needs
# an explicit `[[test]]` entry here. When adding a new domain directory,
# add a matching entry below.

[[test]]
name = "combat"
path = "tests/combat/main.rs"

[[test]]
name = "deletion_batching"
path = "tests/deletion_batching/main.rs"

[[test]]
name = "event_emission"
path = "tests/event_emission/main.rs"

[[test]]
name = "selection"
path = "tests/selection/main.rs"

[[test]]
name = "mask_and_tensor"
path = "tests/mask_and_tensor/main.rs"

[[test]]
name = "phase_flow"
path = "tests/phase_flow/main.rs"

[[test]]
name = "effects"
path = "tests/effects/main.rs"

[[test]]
name = "infra"
path = "tests/infra/main.rs"

[[test]]
name = "cards_behavioral"
path = "tests/cards_behavioral/main.rs"

[[test]]
name = "archetypes"
path = "tests/archetypes/main.rs"

[[test]]
name = "onnx_parity"
path = "tests/onnx_parity/main.rs"

[[test]]
name = "deck_tools"
path = "tests/deck_tools/main.rs"

[[test]]
name = "ffi_parity"
path = "tests/ffi_parity/main.rs"

[[test]]
name = "policies"
path = "tests/policies/main.rs"

[[test]]
name = "cost_hooks"
path = "tests/cost_hooks/main.rs"

[[test]]
name = "flood_gates"
path = "tests/flood_gates/main.rs"

[[test]]
name = "replacements"
path = "tests/replacements/main.rs"

[[test]]
name = "option_flow"
path = "tests/option_flow/main.rs"

[[test]]
name = "dsl"
path = "tests/dsl/main.rs"
required-features = ["dsl-yaml-loader"]

[[test]]
name = "judge_quiz"
path = "tests/judge_quiz/main.rs"
required-features = ["dsl-yaml-loader"]

[[test]]
name = "debug_runner_dsl"
path = "tests/debug_runner_dsl.rs"
required-features = ["dsl-yaml-loader"]

[[test]]
name = "effect_context"
path = "tests/effect_context/main.rs"

[[test]]
name = "keyword_phase_d"
path = "tests/keyword_phase_d/main.rs"

[[test]]
name = "keyword_phase_e"
path = "tests/keyword_phase_e/main.rs"

[[test]]
name = "keyword_phase_f"
path = "tests/keyword_phase_f/main.rs"

[[test]]
name = "dual_cards"
path = "tests/dual_cards/main.rs"

[[test]]
name = "effect_source_kind"
path = "tests/effect_source_kind/main.rs"

[[test]]
name = "owner_routing_live"
path = "tests/owner_routing_live.rs"
required-features = ["test-helpers"]
