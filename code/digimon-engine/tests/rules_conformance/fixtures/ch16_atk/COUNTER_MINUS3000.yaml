# COUNTER_MINUS3000 -- Digimon, Lv.3, red, 3000 DP, play cost 3.
#   [Counter] 1 of your opponent's Digimon gets -3000 DP for the turn.
# Changes the DP of the Digimon <Alliance> suspended, after the suspension
# (§16-24-4).
card: COUNTER_MINUS3000
name: Sapparrymon
kind: digimon
level: 3
color: [red]
cost: 3
dp: 3000
effects:
  - when: counter
    summary: "[Counter] 1 of your opponent's Digimon gets -3000 DP for the turn."
    process:
      - select_opponent_permanent:
          bind_as: victim
          filter: { kind: digimon }
          prompt: "1 of your opponent's Digimon gets -3000 DP for the turn"
      - add_dp_modifier:
          target: victim
          value: -3000
          expiry: end_of_turn
