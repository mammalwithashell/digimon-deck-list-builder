# PLAY_RET_LE_SEC -- Tamer, red, play cost 3.
#   [Your Turn] When one of your Digimon is played, return 1 of your
#   opponent's Digimon with a level less than or equal to the number of your
#   security cards to the hand.
# "the number of your security cards" is an unspecified reference made during
# processing (§15-8-3-7), not part of the trigger condition.
card: PLAY_RET_LE_SEC
name: Bastion Tamer
kind: tamer
color: [red]
cost: 3
effects:
  - when: on_any_digimon_played
    active_when: { your_turn: true }
    condition:
      all_of:
        - event_target_owner: you
        - event_target_kind: digimon
    summary: "[Your Turn] When one of your Digimon is played, return 1 of your opponent's Digimon with a level less than or equal to the number of your security cards to the hand."
    process:
      - select_opponent_permanent:
          bind_as: bounce
          filter:
            all_of:
              - kind: digimon
              - level_lte:
                  formula:
                    base: 0
                    per:
                      card_count_in_zone: { zone: security, of: you }
                    delta: 1
          prompt: "Return 1 of your opponent's Digimon with a level less than or equal to the number of your security cards to the hand"
      - return_to_hand: { target: bounce }
