# OD_REPLAY_SRC -- Digimon, Lv.4, red, 4000 DP, play cost 5.
# The §15-8-3-9-4 example text:
#   [On Deletion] When this Digimon has digivolution cards, you may play this
#   card from your trash without paying the cost.
# A removal trigger: "has digivolution cards" is referenced in the state when
# the effect triggered, i.e. upon deletion (§15-8-3-9-4).
card: OD_REPLAY_SRC
name: Phoenixmon Jr
kind: digimon
level: 4
color: [red]
cost: 5
dp: 4000
effects:
  - when: on_deletion
    optional: true
    condition: { event_target_has_digivolution_cards: true }
    summary: "[On Deletion] When this Digimon has digivolution cards, you may play this card from your trash without paying the cost."
    process:
      - play_from_trash_free: { of: you, hand_index: self }
