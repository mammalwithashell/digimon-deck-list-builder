# OBS_OPP_PLAY_LE4K -- Tamer, red, play cost 3.
#   [All Turns] When your opponent plays a Digimon with 4000 DP or less, gain
#   1 memory.
# "a Digimon with 4000 DP or less" qualifies the trigger condition (the event),
# so all of it is the `trigger_if:` qualifier, decided when the play triggers
# the effect (§15-8-3-1, §15-8-3-4); there is no processing condition.
card: OBS_OPP_PLAY_LE4K
name: Gatekeeper Tamer
kind: tamer
color: [red]
cost: 3
effects:
  - when: on_any_digimon_played
    trigger_if:
      all_of:
        - event_target_owner: opponent
        - event_target_kind: digimon
        - event_target_dp_lte: 4000
    summary: "[All Turns] When your opponent plays a Digimon with 4000 DP or less, gain 1 memory."
    process:
      - gain_memory: 1
