# MAIN_DEL1 -- Option, red, use cost 0.
# The §15-8-5-4 example cause:
#   [Main] Delete 1 of your opponent's Digimon.
card: MAIN_DEL1
name: Strike Down
kind: option
color: [red]
cost: 0
effects:
  - when: main_from_hand
    summary: "[Main] Delete 1 of your opponent's Digimon."
    process:
      - select_opponent_permanent:
          bind_as: victim
          filter: { kind: digimon }
          prompt: "Delete 1 of your opponent's Digimon"
      - delete_permanent: { target: victim }
