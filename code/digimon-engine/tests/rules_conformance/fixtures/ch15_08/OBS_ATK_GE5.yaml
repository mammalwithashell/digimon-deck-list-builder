# OBS_ATK_GE5 -- Tamer, red, play cost 3.
#   [Your Turn] When one of your Digimon attacks, if that Digimon is level 5
#   or higher, gain 1 memory.
# "one of your Digimon attacks" is the trigger condition (`active_when`);
# "if that Digimon is level 5 or higher" is a processing condition, authored
# as a body `if:` (the shape of the §15-8-3-9-3 example, `OBS_OPP_PLAY_LVL`)
# and read when the effect is processed (§15-8-3-9-3).
card: OBS_ATK_GE5
name: Gauger
kind: tamer
color: [red]
cost: 3
effects:
  - when: on_ally_attack
    active_when:
      all_of:
        - your_turn: true
        - event_target_owner: you
    summary: "[Your Turn] When one of your Digimon attacks, if that Digimon is level 5 or higher, gain 1 memory."
    process:
      - if:
          condition: { event_target_level_gte: 5 }
          then:
            - gain_memory: 1
