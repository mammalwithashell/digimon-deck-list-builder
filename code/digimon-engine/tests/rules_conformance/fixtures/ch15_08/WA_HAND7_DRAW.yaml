# WA_HAND7_DRAW -- Digimon, Lv.4, red, 6000 DP, play cost 5.
#   [When Attacking] <Draw 1>.
#   [When Attacking] If your hand has 7 or fewer cards, <Draw 1>.
# The second clause's processing condition is authored in `active_when`
# (the BT26-019 shape); it is still read when the effect is processed
# (§15-8-3-9-3), not frozen when it triggered.
card: WA_HAND7_DRAW
name: Mailermon
kind: digimon
level: 4
color: [red]
cost: 5
dp: 6000
effects:
  - when: when_attacking
    summary: "[When Attacking] <Draw 1>"
    process:
      - draw: { of: you, count: 1 }
  - when: when_attacking
    active_when:
      count_lte:
        filter: { owner: you, zone: [hand] }
        n: 7
    summary: "[When Attacking] If your hand has 7 or fewer cards, <Draw 1>"
    process:
      - draw: { of: you, count: 1 }
