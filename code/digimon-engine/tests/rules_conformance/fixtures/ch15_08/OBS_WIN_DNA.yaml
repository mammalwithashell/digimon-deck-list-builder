# OBS_WIN_DNA -- Tamer, red, play cost 3.
#   [All Turns] When any of your Digimon win a battle, 1 of your [TS] trait
#   Digimon and 1 of your level 3 Digimon DNA digivolve into a level 6
#   Digimon card in your hand without paying the cost, ignoring DNA
#   digivolution requirements.
# Turns the battle winner into a new Digimon (§8-2-2-1) before a sibling
# "wins a battle" observer activates (the §15-8-3-8 DNA test).
card: OBS_WIN_DNA
name: Fuser
kind: tamer
color: [red]
cost: 3
effects:
  - when: on_ally_won_battle
    trigger_if:
      all_of:
        - event_winner_owner: you
    summary: "[All Turns] When any of your Digimon win a battle, 1 of your [TS] trait Digimon and 1 of your level 3 Digimon DNA digivolve into a level 6 Digimon card in your hand without paying the cost, ignoring DNA digivolution requirements."
    process:
      - select_own_permanent:
          bind_as: dna_a
          filter:
            all_of:
              - kind: digimon
              - trait_has: TS
          prompt: "Select 1 of your [TS] trait Digimon to DNA digivolve"
      - select_own_permanent:
          bind_as: dna_b
          filter:
            all_of:
              - kind: digimon
              - level_eq: 3
          prompt: "Select 1 of your level 3 Digimon to DNA digivolve"
      - select_hand:
          of: you
          bind_as: dna_card
          filter:
            all_of:
              - kind: digimon
              - level_eq: 6
          prompt: "Select a level 6 Digimon card in your hand to DNA digivolve into"
      - effect_initiated_dna_digivolve:
          target_a: dna_a
          target_b: dna_b
          from_hand: dna_card
          cost: 0
          ignore_requirements: true
