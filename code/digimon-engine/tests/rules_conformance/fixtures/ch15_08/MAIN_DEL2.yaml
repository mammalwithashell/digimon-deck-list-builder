# MAIN_DEL2 -- Option, red, use cost 0.
#   [Main] Delete 1 of your opponent's Digimon. Then, delete 1 of your
#   opponent's Digimon.
# One cause ([Main]) that attempts two deletions (§15-8-5-4).
card: MAIN_DEL2
name: Double Strike
kind: option
color: [red]
cost: 0
effects:
  - when: main_from_hand
    summary: "[Main] Delete 1 of your opponent's Digimon. Then, delete 1 of your opponent's Digimon."
    process:
      - select_opponent_permanent:
          bind_as: first
          filter: { kind: digimon }
          prompt: "Delete 1 of your opponent's Digimon"
      - delete_permanent: { target: first }
      - select_opponent_permanent:
          bind_as: second
          filter: { kind: digimon }
          prompt: "Then, delete 1 of your opponent's Digimon"
      - delete_permanent: { target: second }
