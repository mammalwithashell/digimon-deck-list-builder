# OP_DIGI_LV3 -- Digimon, Lv.3, red, 3000 DP, play cost 3.
#   [On Play] This Digimon may digivolve into a level 4 Digimon card in your
#   hand without paying the cost.
# The "may" lives in the optional hand pick (declining skips the digivolve).
card: OP_DIGI_LV3
name: Sproutmon
kind: digimon
level: 3
color: [red]
cost: 3
dp: 3000
effects:
  - when: on_play
    summary: "[On Play] This Digimon may digivolve into a level 4 Digimon card in your hand without paying the cost."
    process:
      - select_hand:
          of: you
          bind_as: up
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_eq: 4
              - can_digivolve_onto: source
          prompt: "This Digimon may digivolve into a level 4 Digimon card in your hand without paying the cost"
      - if:
          condition: { binding_present: up }
          then:
            - effect_initiated_digivolve:
                target: source
                from_hand: up
                cost: free
                ignore_requirements: false
