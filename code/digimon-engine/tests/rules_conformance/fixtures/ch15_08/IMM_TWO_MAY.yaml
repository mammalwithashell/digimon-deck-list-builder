# IMM_TWO_MAY -- Digimon, Lv.3, red, 3000 DP, play cost 3.
#   [All Turns] When this Digimon would be deleted, you may gain 1 memory.
#   [All Turns] When this Digimon would be deleted, you may <Draw 1> (Draw 1
#   card from your deck.)
# Two immediate-type effects ("would", §15-8-5-1) on one subject, neither of
# which prevents the deletion: within ONE deletion event each can be activated
# once (§15-8-5-4).
card: IMM_TWO_MAY
name: Doublegaspmon
kind: digimon
level: 3
color: [red]
cost: 3
dp: 3000
effects:
  - kind: replacement
    timing: when_would_be_deleted
    optional: true
    summary: "[All Turns] When this Digimon would be deleted, you may gain 1 memory."
    process:
      - gain_memory: 1
  - kind: replacement
    timing: when_would_be_deleted
    optional: true
    summary: "[All Turns] When this Digimon would be deleted, you may <Draw 1> (Draw 1 card from your deck.)"
    process:
      - draw: { of: you, count: 1 }
