# RET_PLAYED -- Tamer, red, play cost 3.
#   [Your Turn] When one of your Digimon is played, return that Digimon to the
#   hand.
card: RET_PLAYED
name: Recall Tamer
kind: tamer
color: [red]
cost: 3
effects:
  - when: on_any_digimon_played
    active_when: { your_turn: true }
    condition:
      all_of:
        - event_target_owner: you
        - event_target_kind: digimon
    summary: "[Your Turn] When one of your Digimon is played, return that Digimon to the hand."
    process:
      - return_to_hand: { target: event_target }
---
# OD_RECOVER_LE3 -- Digimon, Lv.3, yellow, 2000 DP, play cost 4.
# Same text as BT2-034 Salamon (official Q&A Q1009 rules on two copies):
#   [On Deletion] If you have 3 or fewer security cards, <Recovery +1 (Deck)>.
#   (Place the top card of your deck on top of your security stack.)
card: OD_RECOVER_LE3
name: Recovermon
kind: digimon
level: 3
color: [yellow]
cost: 4
dp: 2000
effects:
  - when: on_deletion
    condition: { security_count_lte: 3 }
    summary: "[On Deletion] If you have 3 or fewer security cards, <Recovery +1 (Deck)> (Place the top card of your deck on top of your security stack.)"
    process:
      - recover: { of: you, count: 1 }
