# OBS_TOP_TRASH_MEM -- Tamer, red, play cost 3.
#   [All Turns] When the top stacked card of one of your Digimon is trashed,
#   gain 1 memory.
# Counts the trashings of a <De-Digivolve>, which trashes "starting with the
# top card" (§16-12-1): each card it trashes is the top stacked card at that
# moment. Printed wording as on BT21-094 ("When the top stacked card of ...
# is trashed"); DCGO fires `EffectTiming.WhenTopCardTrashed` ONCE per
# <De-Digivolve> instance, with every trashed card in its hashtable
# (`CardController.cs` `IDegeneration`, ~L5372-5385).
# AUTHORING NOTE: the DSL has no top-card-trashed timing
# (G-DSL-TOP-CARD-TRASHED-TIMING): the engine routes every stack trash,
# De-Digivolve's top-card trashes included (`game_actions/helpers.rs`
# `de_digivolve_core`, `fire_digivolution_card_trashed`), through
# `on_digivolution_card_trashed`. In the scenarios that use this card the
# only stack trashes are De-Digivolve's, so the clause fires exactly when the
# printed condition is met.
card: OBS_TOP_TRASH_MEM
name: Watch Tamer
kind: tamer
color: [red]
cost: 3
effects:
  - when: on_digivolution_card_trashed
    active_when: { all_turns: true }
    condition:
      event_host_is_own_digimon: true
    summary: "[All Turns] When the top stacked card of one of your Digimon is trashed, gain 1 memory."
    process:
      - gain_memory: 1
