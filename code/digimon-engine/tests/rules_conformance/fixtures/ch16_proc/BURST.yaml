# BURST -- Digimon, Lv.4, red, 5000 DP, play cost 5.
#   [Main] <Digi-Burst 1> (Trash 1 of this Digimon's digivolution cards to
#   activate the effect below.) ・Gain 2 memory.
# The §16-14 keyword card (production idiom: the `digi_burst` step, BT4-072).
card: BURST
name: Burstmon
kind: digimon
level: 4
color: [red]
cost: 5
dp: 5000
effects:
  - when: main_on_field
    summary: "[Main] <Digi-Burst 1> (Trash 1 of this Digimon's digivolution cards to activate the effect below.) ・Gain 2 memory."
    process:
      - digi_burst:
          count: 1
          bind_as: burst_source
          prompt: "Trash 1 of this Digimon's digivolution cards for <Digi-Burst 1>"
          then:
            - gain_memory: 2
