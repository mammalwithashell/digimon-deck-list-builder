# OBS_SRC_TRASH_MEM -- Tamer, red, play cost 3.
#   [All Turns] When cards are trashed from the digivolution cards of one of
#   your Digimon, gain 1 memory.
# Counts the "trashed" events of a <De-Digivolve> (§16-12-5: cards trashed by
# 1 instance are trashed at the same time; §16-12-7: separate instances are
# processed separately).
card: OBS_SRC_TRASH_MEM
name: Loss Tamer
kind: tamer
color: [red]
cost: 3
effects:
  - when: on_digivolution_card_trashed
    active_when: { all_turns: true }
    condition:
      event_host_is_own_digimon: true
    summary: "[All Turns] When cards are trashed from the digivolution cards of one of your Digimon, gain 1 memory."
    process:
      - gain_memory: 1
