# DEDIGI1_OPT -- Option, red, use cost 0.
#   [Main] <De-Digivolve 1> 1 of your opponent's Digimon.
# The single-card control for §16-12-4.
card: DEDIGI1_OPT
name: Unwind One
kind: option
color: [red]
cost: 0
effects:
  - when: main_from_hand
    summary: "[Main] <De-Digivolve 1> 1 of your opponent's Digimon."
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "<De-Digivolve 1> 1 of your opponent's Digimon"
      - de_digivolve: { target: target, amount: 1 }
