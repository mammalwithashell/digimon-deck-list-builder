# WA_DEL4K -- Digimon, Lv.4, red, 6000 DP, play cost 5.
#   [When Attacking] Delete 1 of your opponent's Digimon with 4000 DP or less.
card: WA_DEL4K
name: Strikeattackmon
kind: digimon
level: 4
color: [red]
cost: 5
dp: 6000
effects:
  - when: when_attacking
    summary: "[When Attacking] Delete 1 of your opponent's Digimon with 4000 DP or less."
    process:
      - select_opponent_permanent:
          bind_as: victim
          filter:
            all_of:
              - kind: digimon
              - dp_lte: 4000
          prompt: "Delete 1 of your opponent's Digimon with 4000 DP or less"
      - delete_permanent: { target: victim }
