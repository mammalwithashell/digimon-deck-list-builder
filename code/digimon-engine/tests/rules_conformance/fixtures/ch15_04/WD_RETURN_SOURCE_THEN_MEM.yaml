# WD_RETURN_SOURCE_THEN_MEM -- Digimon, Lv.4, red, 4000 DP, play cost 4.
#   [When Digivolving] Return 1 of this Digimon's digivolution cards to the
#   bottom of the deck. Then, gain 1 memory.
# A deck add (a batch-window event) by a step whose return drains the effect
# queue directly (`fire_digivolution_card_returned_to_deck_bottom`), inside an
# effect resumed after its source pick: the deck-add observers must wait for
# the whole effect (§15-8-3-2) -- the fallback window flush's deferred-scope
# guard test.
card: WD_RETURN_SOURCE_THEN_MEM
name: Returnmon
kind: digimon
level: 4
color: [red]
cost: 4
dp: 4000
effects:
  - when: when_digivolving
    summary: "[When Digivolving] Return 1 of this Digimon's digivolution cards to the bottom of the deck. Then, gain 1 memory."
    process:
      - select_own_sources:
          from: source
          bind_as: returned
          min: 1
          max: 1
          filter: {}
          prompt: "Return 1 of this Digimon's digivolution cards to the bottom of the deck"
      - return_selected_sources_to_deck:
          source_refs: returned
          position: bottom
      - gain_memory: 1
