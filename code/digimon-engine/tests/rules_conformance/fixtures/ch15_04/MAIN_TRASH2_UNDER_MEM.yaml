# MAIN_TRASH2_UNDER_MEM -- Option, red, use cost 0.
#   [Main] By trashing 2 bottom face-down cards from under any of your
#   Tamers, gain 1 memory.
# The shape of Cougarmon (BT25-035)'s "by trashing 2 bottom face-down cards
# from under any of your Tamers": one processing condition paid with 2 cards,
# "2 from one Tamer" or "1 from each of two" (the §15-5-2 test).
card: MAIN_TRASH2_UNDER_MEM
name: Double Undertrash
kind: option
color: [red]
cost: 0
effects:
  - when: main_from_hand
    summary: "[Main] By trashing 2 bottom face-down cards from under any of your Tamers, gain 1 memory."
    process:
      - trash_bottom_face_down_sources_under_tamers: { of: you, count: 2 }
      - gain_memory: 1
