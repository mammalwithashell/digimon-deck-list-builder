# DELAY_SHIFT_GUARD -- Option, red, play cost 2.
#   [All Turns] When one of your Digimon would be deleted other than by one of
#   your effects, <Delay> (By trashing this card after the placing turn,
#   activate the effect below.)
#   ・By digivolving that Digimon into a Digimon card with [Shiftmon] in its
#   name in the hand without paying the cost, prevent that deletion.
# The Return to the Primogenitor (BT17-097) <Delay> replacement without its
# [Free] trait gate: an immediate effect that digivolves the Digimon inside
# the deleting effect's processing.
card: DELAY_SHIFT_GUARD
name: Shift Guard
kind: option
color: [red]
cost: 2
effects:
  - kind: replacement
    timing: when_would_be_deleted
    active_when:
      all_of:
        - all_turns: true
        - replacement_subject_is_mine: true
        - none_of:
            - replacement_cause: own_effect
    summary: "[All Turns] When one of your Digimon would be deleted other than by one of your effects, <Delay>. ・By digivolving that Digimon into a Digimon card with [Shiftmon] in its name in the hand without paying the cost, prevent that deletion."
    cost:
      delay_self: true
    choose:
      from: hand
      card_filter:
        name_contains: "Shiftmon"
      min: 1
      max: 1
    outcome: prevent
    then:
      - digivolve_without_cost:
          target: replacement_subject
          card: chosen
