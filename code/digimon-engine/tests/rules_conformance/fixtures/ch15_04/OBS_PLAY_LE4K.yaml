# OBS_PLAY_LE4K -- Tamer, red, play cost 3.
#   [Your Turn] When one of your Digimon with 4000 DP or less is played, gain
#   1 memory.
# "with 4000 DP or less" qualifies the trigger condition (the event), not a
# processing condition ("if" / "while", §15-6-1): `trigger_if:`, decided when
# the play triggers the effect and re-checked at activation (§15-4-4-5).
card: OBS_PLAY_LE4K
name: Scout Tamer
kind: tamer
color: [red]
cost: 3
effects:
  - when: on_any_digimon_played
    active_when: { your_turn: true }
    trigger_if:
      all_of:
        - event_target_owner: you
        - event_target_kind: digimon
        - event_target_dp_lte: 4000
    summary: "[Your Turn] When one of your Digimon with 4000 DP or less is played, gain 1 memory."
    process:
      - gain_memory: 1
