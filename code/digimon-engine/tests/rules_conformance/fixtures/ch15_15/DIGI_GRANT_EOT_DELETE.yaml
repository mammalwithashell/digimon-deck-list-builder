# DIGI_GRANT_EOT_DELETE -- Digimon, Lv.4, purple, 4000 DP, play cost 4.
#   [On Play] 1 of your opponent's Digimon gains "[End of Your Turn] Delete
#   this Digimon." until the end of their turn.
# A gained triggered effect (§15-15-5-4), with the Lilithmon (EX6-057)
# production idiom (`grant_triggered_effect`, body `delete_permanent: carrier`).
card: DIGI_GRANT_EOT_DELETE
name: Cursemon
kind: digimon
level: 4
color: [purple]
cost: 4
dp: 4000
effects:
  - when: on_play
    summary: "[On Play] 1 of your opponent's Digimon gains \"[End of Your Turn] Delete this Digimon.\" until the end of their turn."
    process:
      - select_opponent_permanent:
          bind_as: cursed
          filter: { kind: digimon }
          prompt: "1 of your opponent's Digimon gains \"[End of Your Turn] Delete this Digimon.\" until the end of their turn"
      - grant_triggered_effect:
          target: cursed
          timing: end_of_your_turn
          expiry: end_of_opponents_turn
          body:
            - delete_permanent: { target: carrier }
