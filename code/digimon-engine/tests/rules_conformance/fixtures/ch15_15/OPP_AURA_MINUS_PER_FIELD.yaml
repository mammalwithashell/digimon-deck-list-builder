# OPP_AURA_MINUS_PER_FIELD -- Digimon, Lv.4, red, 4000 DP, play cost 4.
#   [All Turns] All of your opponent's Digimon get -1000 DP for each Digimon
#   and Tamer you have.
# A FORMULA-valued aura on the opponent's Digimon: its value is computed live
# inside `effective_dp` (`Game::live_declarative_formula_sum`), not stored as
# a modifier entry, so it must go through the same read-time gate as a stored
# modifier (the <Progress> shield and the immunity suppression;
# G-ENGINE-PROGRESS-SHIELD-BYPASSED-BY-TIMING-DISABLE-AND-FORMULA-AURAS).
card: OPP_AURA_MINUS_PER_FIELD
name: Pressuremon
kind: digimon
level: 4
color: [red]
cost: 4
dp: 4000
effects:
  - kind: aura
    target: { of: opponent, kind: digimon }
    dp_modifier:
      base: 0
      per:
        card_count_in_zone:
          of: you
          zone: battle_area
      delta: -1000
    summary: "[All Turns] All of your opponent's Digimon get -1000 DP for each Digimon and Tamer you have."
