# DIGI_MINUS_3K -- Digimon, Lv.4, red, 4000 DP, play cost 4.
#   [On Play] 1 of your opponent's Digimon gets -3000 DP until the end of
#   their turn.
# A Digimon effect (§15-2-1-1).
card: DIGI_MINUS_3K
name: Hexmon Jr.
kind: digimon
level: 4
color: [red]
cost: 4
dp: 4000
effects:
  - when: on_play
    summary: "[On Play] 1 of your opponent's Digimon gets -3000 DP until the end of their turn."
    process:
      - select_opponent_permanent:
          bind_as: victim
          filter: { kind: digimon }
          prompt: "1 of your opponent's Digimon gets -3000 DP until the end of their turn"
      - add_dp_modifier:
          target: victim
          value: -3000
          expiry: end_of_opponents_turn
