# DIGI_GRANT_KW_SA_MINUS1 -- Digimon, Lv.4, red, 4000 DP, play cost 4.
#   [On Play] 1 of your opponent's Digimon gains <Security A. -1> until the
#   end of their turn.
# The §15-15-5-4 example effect authored as a KEYWORD grant (`grant_keyword`,
# the registry path), beside DIGI_GRANT_SA_MINUS1's modifier idiom: the two
# paths must agree on when a gained <Security A. -1> is had
# (G-ENGINE-UNAFFECTED-KEYWORD-GRANT-INSTALL-SKIP).
card: DIGI_GRANT_KW_SA_MINUS1
name: Shortstrikemon ACE
kind: digimon
level: 4
color: [red]
cost: 4
dp: 4000
effects:
  - when: on_play
    summary: "[On Play] 1 of your opponent's Digimon gains <Security A. -1> until the end of their turn."
    process:
      - select_opponent_permanent:
          bind_as: victim
          filter: { kind: digimon }
          prompt: "1 of your opponent's Digimon gains <Security A. -1> until the end of their turn"
      - grant_keyword:
          target: victim
          keyword: SecurityAttackMinus
          value: 1
          expiry: end_of_opponents_turn
