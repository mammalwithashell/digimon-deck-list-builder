# TOKEN_OD_MINUS_3K -- Digimon TOKEN, Lv.3, purple, 3000 DP.
#   [On Deletion] 1 of your opponent's Digimon gets -3000 DP for the turn.
# A YAML-authored token whose [On Deletion] CHOOSES, then applies: the -3000
# DP runs in a context rebuilt after the choice, when the token has already
# left the game (§4-21-5) and is in no zone. Its effect is still a Digimon
# effect (§15-2-1-1; G-ENGINE-DEPARTED-TOKEN-CONTEXT-FALLS-BACK-TO-RULE).
card: TOKEN_OD_MINUS_3K
name: Shade Token
kind: token
level: 3
color: [purple]
cost: 0
dp: 3000
effects:
  - when: on_deletion
    summary: "[On Deletion] 1 of your opponent's Digimon gets -3000 DP for the turn."
    process:
      - select_opponent_permanent:
          bind_as: victim
          filter: { kind: digimon }
          prompt: "1 of your opponent's Digimon gets -3000 DP for the turn"
      - add_dp_modifier:
          target: victim
          value: -3000
          expiry: end_of_turn
