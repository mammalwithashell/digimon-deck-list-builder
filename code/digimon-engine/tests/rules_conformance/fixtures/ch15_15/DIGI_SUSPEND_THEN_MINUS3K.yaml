# DIGI_SUSPEND_THEN_MINUS3K -- Digimon, Lv.4, red, 4000 DP, play cost 4.
#   [On Play] Suspend 1 of your opponent's Digimon. Then, that Digimon gets
#   -3000 DP for the turn.
# One effect that first affects a Digimon, then affects it again.
card: DIGI_SUSPEND_THEN_MINUS3K
name: Pinmon
kind: digimon
level: 4
color: [red]
cost: 4
dp: 4000
effects:
  - when: on_play
    summary: "[On Play] Suspend 1 of your opponent's Digimon. Then, that Digimon gets -3000 DP for the turn."
    process:
      - select_opponent_permanent:
          bind_as: victim
          filter: { kind: digimon }
          prompt: "Suspend 1 of your opponent's Digimon"
      - suspend: { target: victim }
      - add_dp_modifier:
          target: victim
          value: -3000
          expiry: end_of_turn
