#   in battle, it checks security before the attack ends.)
#   [Your Turn] This Digimon gains <Piercing>.
# Two <Piercing> instances on one Digimon during its owner's turn (§16-7-5).
card: PIERCING_X2
name: Twinlancemon
kind: digimon
level: 5
color: [red]
cost: 7
dp: 7000
effects:
  - kind: grant_keyword
