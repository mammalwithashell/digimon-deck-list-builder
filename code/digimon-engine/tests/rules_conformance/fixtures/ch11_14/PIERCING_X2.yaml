    summary: "<Piercing> (When this Digimon attacks and deletes your opponent's Digimon in battle, it checks security before the attack ends.)"
  - kind: grant_keyword
    keyword: Piercing
    active_when: { your_turn: true }
    summary: "[Your Turn] This Digimon gains <Piercing>."
