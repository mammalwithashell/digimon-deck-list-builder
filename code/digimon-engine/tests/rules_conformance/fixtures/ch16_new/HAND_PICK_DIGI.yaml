# HAND_PICK_DIGI -- Option, red, use cost 0.
#   [Main] Trash 1 level 6 Digimon card with the [Artsy] trait from your hand.
# References a hand card AS A DIGIMON CARD, by a Digimon-information property
# (level 6) and the [Artsy] trait (§4-6-5-1/-2).
card: HAND_PICK_DIGI
name: Roster Audit
kind: option
color: [red]
cost: 0
effects:
  - when: main_from_hand
    summary: "[Main] Trash 1 level 6 Digimon card with the [Artsy] trait from your hand."
    process:
      - select_hand:
          of: you
          bind_as: pick
          filter:
            all_of:
              - kind: digimon
              - level_eq: 6
              - trait_has: Artsy
          prompt: "Trash 1 level 6 Digimon card with the [Artsy] trait from your hand"
      - trash_from_hand_by_index: { of: you, hand_index: pick }
