#   <Succession> on its topmost [Basemon] digivolution card.)
# The §16-47 keyword card. There is no `Keyword::Succession`: the keyword is
# the DSL `kind: succession` clause (BT26-032 Ceresmon idiom).
card: SUCC_TOP
name: Heirmon
kind: digimon
level: 6
color: [red]
cost: 12
dp: 12000
alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: red }
    cost: 3
effects:
  - kind: succession
    filter: { name_is: "Basemon" }
    summary: "<Succession ([Basemon])> (This Digimon gains all effects other than <Succession> on its topmost [Basemon] digivolution card.)"
