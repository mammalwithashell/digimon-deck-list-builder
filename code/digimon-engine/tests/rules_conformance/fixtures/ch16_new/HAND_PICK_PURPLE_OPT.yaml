# HAND_PICK_PURPLE_OPT -- Option, red, use cost 0.
#   [Main] Trash 1 purple Option card from your hand.
# References a hand card AS AN OPTION CARD by an Option-information property
# (the purple color of a DUAL card's Option information, §4-6-6-2).
card: HAND_PICK_PURPLE_OPT
name: Violet Audit
kind: option
color: [red]
cost: 0
effects:
  - when: main_from_hand
    summary: "[Main] Trash 1 purple Option card from your hand."
    process:
      - select_hand:
          of: you
          bind_as: pick
          filter:
            all_of:
              - kind: option
              - color_is: purple
          prompt: "Trash 1 purple Option card from your hand"
      - trash_from_hand_by_index: { of: you, hand_index: pick }
