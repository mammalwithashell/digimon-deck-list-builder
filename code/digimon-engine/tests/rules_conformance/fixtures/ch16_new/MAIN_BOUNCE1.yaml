# MAIN_BOUNCE1 -- Option, red, use cost 0.
#   [Main] Return 1 of your opponent's Digimon to the hand.
# A cause that makes a Digimon leave the battle area other than by deletion.
card: MAIN_BOUNCE1
name: Recall
kind: option
color: [red]
cost: 0
effects:
  - when: main_from_hand
    summary: "[Main] Return 1 of your opponent's Digimon to the hand."
    process:
      - select_opponent_permanent:
          bind_as: victim
          filter: { kind: digimon }
          prompt: "Return 1 of your opponent's Digimon to the hand"
      - return_to_hand: { target: victim }
