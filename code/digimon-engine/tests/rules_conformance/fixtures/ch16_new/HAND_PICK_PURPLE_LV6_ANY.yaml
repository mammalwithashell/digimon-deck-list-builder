# HAND_PICK_PURPLE_LV6_ANY -- Option, red, use cost 0.
#   [Main] Trash 1 purple Lv.6 card from your hand.
# An UNQUALIFIED reference whose two properties must both hold on ONE
# information of a DUAL card (§4-6-1): DUAL_ARTS' Option information is purple
# but has no level; its Digimon information is Lv.6 but red.
card: HAND_PICK_PURPLE_LV6_ANY
name: Any purple Lv.6 Audit
kind: option
color: [red]
cost: 0
effects:
  - when: main_from_hand
    summary: "[Main] Trash 1 purple Lv.6 card from your hand."
    process:
      - select_hand:
          of: you
          bind_as: pick
          filter:
            all_of:
              - color_is: purple
              - level_eq: 6
          prompt: "Trash 1 purple Lv.6 card from your hand"
      - trash_from_hand_by_index: { of: you, hand_index: pick }
