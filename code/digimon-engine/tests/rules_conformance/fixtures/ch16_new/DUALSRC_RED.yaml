# DUALSRC_RED -- Digimon, Lv.5, red, 7000 DP, play cost 7.
#   [When Attacking] If this Digimon has a red card in its digivolution cards,
#   gain 3 memory.
# Counts its own digivolution cards (`self_source_count`). The reference names
# neither category, so a DUAL card among them is read through its Digimon
# information only (§4-6-1, §4-6-5-2; owner ruling W5 (b)).
card: DUALSRC_RED
name: Source Counter RED
kind: digimon
level: 5
color: [red]
cost: 7
dp: 7000
effects:
  - when: when_attacking
    summary: "[When Attacking] If this Digimon has a red card in its digivolution cards, gain 3 memory."
    process:
      - if:
          condition:
            self_source_count:
              filter: { color_is: red }
              op: gte
              value: 1
          then:
            - gain_memory: 3
