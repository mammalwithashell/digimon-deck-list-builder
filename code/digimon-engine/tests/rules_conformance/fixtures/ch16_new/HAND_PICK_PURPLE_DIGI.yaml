# HAND_PICK_PURPLE_DIGI -- Option, red, use cost 0.
#   [Main] Trash 1 purple Digimon card from your hand.
# A DUAL card whose Digimon information is not purple must NOT match, even
# when its Option information is purple (§4-6-5-2).
card: HAND_PICK_PURPLE_DIGI
name: Violet Roster
kind: option
color: [red]
cost: 0
effects:
  - when: main_from_hand
    summary: "[Main] Trash 1 purple Digimon card from your hand."
    process:
      - select_hand:
          of: you
          bind_as: pick
          filter:
            all_of:
              - kind: digimon
              - color_is: purple
          prompt: "Trash 1 purple Digimon card from your hand"
      - trash_from_hand_by_index: { of: you, hand_index: pick }
