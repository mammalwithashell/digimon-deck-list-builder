# SRC_PICK_PURPLE_ANY -- Option, red, use cost 0.
#   [Main] Trash 1 purple card from the digivolution cards of 1 of your
#   opponent's Digimon.
# An UNQUALIFIED color reference over digivolution cards. A DUAL card under a
# Digimon is on the field, where it is treated as a Digimon and can't be
# referenced as an Option card (§4-6-3): only its Digimon information (red for
# DUAL_ARTS) is read.
card: SRC_PICK_PURPLE_ANY
name: Any purple Source Audit
kind: option
color: [red]
cost: 0
effects:
  - when: main_from_hand
    summary: "[Main] Trash 1 purple card from the digivolution cards of 1 of your opponent's Digimon."
    process:
      - select_opponent_permanent:
          bind_as: opp_stack
          filter: { kind: digimon }
          prompt: "Choose an opponent Digimon"
      - select_opponent_sources:
          target: opp_stack
          min: 1
          max: 1
          filter: { color_is: purple }
          bind_as: picked
          prompt: "Trash 1 purple digivolution card"
          then:
            - trash_selected_sources: { source_refs: picked }
