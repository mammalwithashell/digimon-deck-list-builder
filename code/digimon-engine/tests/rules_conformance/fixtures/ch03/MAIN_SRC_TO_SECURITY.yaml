# MAIN_SRC_TO_SECURITY -- Option, red, use cost 0.
#   [Main] Place 1 card from under 1 of your Tamers at the top of your
#   security stack.
# No face is specified, so the card is placed face down (§3-1-3-5).
card: MAIN_SRC_TO_SECURITY
name: Undersecurity
kind: option
color: [red]
cost: 0
effects:
  - when: main_from_hand
    summary: "[Main] Place 1 card from under 1 of your Tamers at the top of your security stack."
    process:
      - select_own_sources:
          filter: { host_kind_is: tamer }
          min: 1
          max: 1
          bind_as: pick
          prompt: "Place 1 card from under 1 of your Tamers at the top of your security stack"
          then:
            - place_on_security:
                of: you
                source: { card: { binding: pick } }
                position: top
                face_up: false
