# OP_TRASH1_UNDER_MEM -- Digimon, Lv.3, red, 3000 DP, play cost 3.
#   [On Play] By trashing the bottom face-down card from under any of your
#   Tamers, gain 1 memory.
# The one-card shape of Pinamon (BT26-005)'s "by trashing the bottom
# face-down card from under any of your Tamers": an optional processing
# condition (§15-7-1) whose payability the engine derives (§15-7-4).
card: OP_TRASH1_UNDER_MEM
name: Undertithemon One
kind: digimon
level: 3
color: [red]
cost: 3
dp: 3000
effects:
  - when: on_play
    optional: true
    summary: "[On Play] By trashing the bottom face-down card from under any of your Tamers, gain 1 memory."
    process:
      - trash_bottom_face_down_source_under_tamer: { of: you }
      - gain_memory: 1
