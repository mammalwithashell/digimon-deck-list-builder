# MAIN_TWO -- Option, red, use cost 0.
#   [Main] 1 of your opponent's Digimon gets -3000 DP for the turn.
#   [Main] Gain 1 memory.
# An Option with TWO [Main] effects (the BT1-090 / BT22-013 idiom: two
# `main_from_hand` clauses). §9-1-5 trashes the card as soon as its 1st
# [Main] has been resolved; the 2nd [Main] resolves after that, as the
# pending effect of a card in the trash.
card: MAIN_TWO
name: Double Sap
kind: option
color: [red]
cost: 0
effects:
  - when: main_from_hand
    summary: "[Main] 1 of your opponent's Digimon gets -3000 DP for the turn."
    process:
      - select_opponent_permanent:
          bind_as: victim
          filter: { kind: digimon }
          prompt: "1 of your opponent's Digimon gets -3000 DP for the turn"
      - add_dp_modifier:
          target: victim
          value: -3000
          expiry: end_of_turn
  - when: main_from_hand
    summary: "[Main] Gain 1 memory."
    process:
      - gain_memory: 1
