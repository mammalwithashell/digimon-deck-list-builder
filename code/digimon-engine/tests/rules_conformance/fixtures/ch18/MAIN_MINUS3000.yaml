# MAIN_MINUS3000 -- Option, red, use cost 0.
#   [Main] 1 of your opponent's Digimon gets -3000 DP for the turn.
card: MAIN_MINUS3000
name: Sap Strength
kind: option
color: [red]
cost: 0
effects:
  - when: main_from_hand
    summary: "[Main] 1 of your opponent's Digimon gets -3000 DP for the turn."
    process:
      - select_opponent_permanent:
          bind_as: victim
          filter: { kind: digimon }
          prompt: "1 of your opponent's Digimon gets -3000 DP for the turn"
      - add_dp_modifier:
          target: victim
          value: -3000
          expiry: end_of_turn
