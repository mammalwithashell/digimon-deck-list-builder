# LOOP_FLIP_MAY -- Digimon, Lv.3, red, 3000 DP, play cost 3.
#   [On Play] Suspend this Digimon.
#   [All Turns] When this Digimon suspends, trash the top card of your deck.
#   Then, unsuspend it.
#   [All Turns] When this Digimon unsuspends, you may suspend it.
# An infinite loop (§18-3-1) its owner can stop (§18-3-3): each
# "you may suspend it" lets them repeat the loop once more or end it. Each
# suspension trashes one deck card, so the deck count witnesses how many times
# the loop actually ran.
card: LOOP_FLIP_MAY
name: Hesitamon
kind: digimon
level: 3
color: [red]
cost: 3
dp: 3000
effects:
  - when: on_play
    summary: "[On Play] Suspend this Digimon."
    process:
      - suspend: { target: source }
  - when: on_suspend
    active_when: { all_turns: true }
    condition:
      event_permanent_is_source: true
    summary: "[All Turns] When this Digimon suspends, trash the top card of your deck. Then, unsuspend it."
    process:
      - trash_from_top: { of: you, count: 1 }
      - unsuspend: { target: source }
  - when: on_unsuspend
    active_when: { all_turns: true }
    optional: true
    condition:
      event_permanent_is_source: true
    summary: "[All Turns] When this Digimon unsuspends, you may suspend it."
    process:
      - suspend: { target: source }
