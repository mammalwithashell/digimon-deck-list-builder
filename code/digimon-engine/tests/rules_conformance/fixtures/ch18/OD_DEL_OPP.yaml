# OD_DEL_OPP -- Digimon, Lv.3, red, 3000 DP, play cost 3.
#   [On Deletion] Delete 1 of your opponent's Digimon.
card: OD_DEL_OPP
name: Grudgemon
kind: digimon
level: 3
color: [red]
cost: 3
dp: 3000
effects:
  - when: on_deletion
    summary: "[On Deletion] Delete 1 of your opponent's Digimon."
    process:
      - select_opponent_permanent:
          bind_as: victim
          filter: { kind: digimon }
          prompt: "Delete 1 of your opponent's Digimon"
      - delete_permanent: { target: victim }
