# LOOP_TWIN_GUARD -- Digimon, Lv.4, yellow, 4000 DP, play cost 4.
#   [On Play] Delete this Digimon.
#   [All Turns] When this Digimon would be deleted, it isn't deleted. Then,
#   suspend it.
#   [All Turns] When this Digimon would be deleted, it isn't deleted.
#   [All Turns] When this Digimon suspends, unsuspend it.
#   [All Turns] When this Digimon unsuspends, delete it.
# An infinite loop (§18-3-1) whose every repetition raises two mandatory
# immediate-type effects on the same deletion: the player must ORDER them
# (§15-8-5-3), a forced decision that cannot stop the loop (§18-3-2).
card: LOOP_TWIN_GUARD
name: Bulwarkmon Twin
kind: digimon
level: 4
color: [yellow]
cost: 4
dp: 4000
effects:
  - when: on_play
    summary: "[On Play] Delete this Digimon."
    process:
      - delete_permanent: { target: source }
  - kind: replacement
    timing: when_would_be_deleted
    summary: "[All Turns] When this Digimon would be deleted, it isn't deleted. Then, suspend it."
    process:
      - cancel_replacement: {}
      - suspend: { target: source }
  - kind: replacement
    timing: when_would_be_deleted
    summary: "[All Turns] When this Digimon would be deleted, it isn't deleted."
    process:
      - cancel_replacement: {}
  - when: on_suspend
    active_when: { all_turns: true }
    condition:
      event_permanent_is_source: true
    summary: "[All Turns] When this Digimon suspends, unsuspend it."
    process:
      - unsuspend: { target: source }
  - when: on_unsuspend
    active_when: { all_turns: true }
    condition:
      event_permanent_is_source: true
    summary: "[All Turns] When this Digimon unsuspends, delete it."
    process:
      - delete_permanent: { target: source }
