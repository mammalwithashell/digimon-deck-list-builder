# LOOP_FLIP_PICK -- Digimon, Lv.3, red, 3000 DP, play cost 3.
#   [On Play] Suspend this Digimon.
#   [All Turns] When this Digimon suspends, unsuspend 1 of your Digimon.
#   [All Turns] When this Digimon unsuspends, suspend it.
# An infinite loop (§18-3-1) with a decision in every repetition that cannot
# stop it: with this Digimon its controller's only Digimon, "unsuspend 1 of
# your Digimon" is a mandatory pick with a single option. Neither player has
# the ability to stop the loop (§18-3-2).
card: LOOP_FLIP_PICK
name: Twitchmon
kind: digimon
level: 3
color: [red]
cost: 3
dp: 3000
effects:
  - when: on_play
    summary: "[On Play] Suspend this Digimon."
    process:
      - suspend: { target: source }
  - when: on_suspend
    active_when: { all_turns: true }
    condition:
      event_permanent_is_source: true
    summary: "[All Turns] When this Digimon suspends, unsuspend 1 of your Digimon."
    process:
      - select_own_permanent:
          bind_as: pick
          filter: { kind: digimon }
          prompt: "Unsuspend 1 of your Digimon"
      - unsuspend: { target: pick }
  - when: on_unsuspend
    active_when: { all_turns: true }
    condition:
      event_permanent_is_source: true
    summary: "[All Turns] When this Digimon unsuspends, suspend it."
    process:
      - suspend: { target: source }
