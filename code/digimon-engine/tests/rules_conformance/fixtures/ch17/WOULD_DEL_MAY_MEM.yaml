# WOULD_DEL_MAY_MEM -- Digimon, Lv.3, red, 3000 DP, play cost 3.
#   [All Turns] When this Digimon would be deleted, you may gain 1 memory.
# An immediate-type effect ("would", §15-8-5-1) that does not prevent the
# deletion. Being optional, it parks a decision right before the deletion,
# while the Digimon is still in the battle area, so a test can read the
# Digimon's state at the moment it is deleted.
card: WOULD_DEL_MAY_MEM
name: Witnessmon
kind: digimon
level: 3
color: [red]
cost: 3
dp: 3000
effects:
  - kind: replacement
    timing: when_would_be_deleted
    optional: true
    summary: "[All Turns] When this Digimon would be deleted, you may gain 1 memory."
    process:
      - gain_memory: 1
