# OP_MINUS3000_SA_MINUS1 -- Digimon, Lv.4, red, 5000 DP, play cost 4.
#   Digivolve: red Lv.3, cost 2.
# The §17-1-2-2 example text:
#   [On Play] [When Digivolving] 1 of your opponent's Digimon gets -3000 DP
#   and <Security A. -1> until the end of their turn.
card: OP_MINUS3000_SA_MINUS1
name: Weakenmon
kind: digimon
level: 4
color: [red]
cost: 4
dp: 5000
alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: red }
    cost: 2
effects:
  - when: [on_play, when_digivolving]
    summary: "[On Play] [When Digivolving] 1 of your opponent's Digimon gets -3000 DP and <Security A. -1> until the end of their turn."
    process:
      - select_opponent_permanent:
          bind_as: victim
          filter: { kind: digimon }
          prompt: "1 of your opponent's Digimon gets -3000 DP and <Security A. -1> until the end of their turn"
      - add_dp_modifier:
          target: victim
          value: -3000
          expiry: end_of_opponents_turn
      - add_modifier:
          target: victim
          modifier: SecurityAttackChange
          value: -1
          expiry: end_of_opponents_turn
