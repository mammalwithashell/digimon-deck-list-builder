# SEC_MAY_DEL -- Digimon, Lv.4, red, 5000 DP, play cost 5.
#   [All Turns] [Once Per Turn] When your security stack is removed from, you
#   may delete 1 of your opponent's Digimon.
# The whole effect is one "you may" folded into its pick (Q1818 shape).
card: SEC_MAY_DEL
name: Maydelmon
kind: digimon
level: 4
color: [red]
cost: 5
dp: 5000
effects:
  - when: on_own_security_removed
    active_when: { all_turns: true }
    once_per_turn: true
    optional: true
    summary: "[All Turns] [Once Per Turn] When your security stack is removed from, you may delete 1 of your opponent's Digimon."
    process:
      - select_opponent_permanent:
          bind_as: victim
          optional: true
          filter: { kind: digimon }
          prompt: "You may delete 1 of your opponent's Digimon"
      - delete_permanent: { target: victim }
