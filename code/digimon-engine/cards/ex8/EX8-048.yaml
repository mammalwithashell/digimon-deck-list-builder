card: EX8-048
name: Landramon
kind: digimon
level: 4
color: [black]
cost: 4
dp: 4000
traits: [Mineral, LIBERATOR]
attribute: Virus
alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: black }
    cost: 2

effects:
  # ─── Clause 1: [When Digivolving] ───────────────────────────────────────────
  #
  # Printed text: "If you have 1 or fewer Tamers, you may play 1 [Close] from
  # your hand without paying the cost."
  #
  # optional: true — "you may" makes this player-optional.
  # condition: count_lte with tamer kind in battle_area ≤ 1 gates activation.
  # process: select_hand filtered to exact name "Close" → play_from_hand_free.
  # Pattern: identical shape to BT21-017 Dimetromon (same archetype, same clause).
  - when: when_digivolving
    optional: true
    summary: "If ≤1 Tamer, you may play 1 [Close] from hand without paying the cost"
    condition:
      count_lte:
        filter: { of: you, zone: [battle_area], kind: tamer }
        n: 1
    process:
      - select_hand:
          of: you
          bind_as: pick
          optional: true
          filter:
            name_is: "Close"
          prompt: "Play 1 [Close] from your hand without paying the cost"
      - play_from_hand_free: { of: you, hand_index: pick }
  - scope: inherited
    when: on_digivolution_card_trashed
    condition:
      all_of:
        - event_target_owner: you
        - trashed_source_card_id_is: EX8-048
        - any_of:
            - host_permanent_trait_has: Mineral
            - host_permanent_trait_has: Rock
        - any_permanent:
            of: opponent
            zone: [battle_area]
            kind: digimon
            play_cost_lte: 4
    summary: "When this source is trashed from a Mineral/Rock Digimon, delete an opponent Digimon cost 4 or less"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon, play_cost_lte: 4 }
          prompt: "Choose 1 opponent Digimon with play cost 4 or less"
      - delete_permanent: { target: target }
