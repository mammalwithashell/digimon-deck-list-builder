card: EX8-047
name: Sunarizamon
kind: digimon
level: 3
color: [black]
cost: 3
dp: 1000
traits: [Reptile, LIBERATOR]
attribute: Virus
alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 0

# ─── Clause 0: [On Play] reveal/search two-pick ──────────────────────────────
#
# "[On Play] Reveal the top 3 cards of your deck. Add 1 card with the
# [Mineral] or [Rock] trait and 1 card with the [LIBERATOR] trait among
# them to the hand. Return the rest to the bottom of the deck."
#
# Authored via `select_reveal_buckets` matching the canonical
# BT24-031 Elecmon pattern for "Add 1 [X] and 1 [Y]" two-pick reveals.
# The printed text contains no "may", so both picks are mandatory when
# eligible candidates exist; the engine surfaces a single combined
# bucket prompt and falls through cleanly to `place_remainder_on_deck`
# when a bucket has zero eligible candidates (natural fizzle).
#
# Previous revision (2026-05-17 — Phase 2 Track E) used two sequential
# `choose_from_reveal { optional: true }` calls, which incorrectly let
# the player decline picks even when eligible cards existed. See
# `openspec/changes/fix-qa-bugs-aura-tick-reveal-picks` and the
# `dsl-card-scripting-vocabulary` spec's `choose_from_reveal { optional:
# true } requires printed-text "may"` requirement for the rule
# motivating this rewrite.
effects:
  - when: on_play
    summary: "[On Play] Reveal top 3; add 1 Mineral/Rock and 1 LIBERATOR to hand; rest to bottom"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          buckets:
            - bind_as: mineral_rock_pick
              min: 1
              max: 1
              filter:
                any_of:
                  - trait_has: Mineral
                  - trait_has: Rock
            - bind_as: liberator_pick
              min: 1
              max: 1
              filter: { trait_has: LIBERATOR }
          no_duplicate_cards: true
          prompt: "Add 1 [Mineral] or [Rock] and 1 [LIBERATOR] trait card"
      - add_to_hand_from_reveal: { of: you, card: mineral_rock_pick }
      - add_to_hand_from_reveal: { of: you, card: liberator_pick }
      - place_remainder_on_deck: { of: you, position: bottom }

  - scope: inherited
    when: on_digivolution_card_trashed
    condition:
      all_of:
        - event_target_owner: you
        - trashed_source_card_id_is: EX8-047
        - any_of:
            - host_permanent_trait_has: Mineral
            - host_permanent_trait_has: Rock
        - any_permanent:
            of: opponent
            zone: [battle_area]
            kind: digimon
            play_cost_lte: 4
    summary: "When this source is trashed from a Mineral/Rock Digimon, delete an opponent Digimon cost 4 or less"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon, play_cost_lte: 4 }
          prompt: "Choose 1 opponent Digimon with play cost 4 or less"
      - delete_permanent: { target: target }
