card: EX8-047
name: Sunarizamon
kind: digimon
level: 3
color: [black]
cost: 3
dp: 1000
traits: [Reptile, LIBERATOR]
attribute: Virus
alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 0

# ─── Clause 0: [On Play] reveal/search two-pick ──────────────────────────────
#
# "[On Play] Reveal the top 3 cards of your deck. Add 1 card with the
# [Mineral] or [Rock] trait and 1 card with the [LIBERATOR] trait among
# them to the hand. Return the rest to the bottom of the deck."
#
# Phase 2 Track E (2026-05-17): authored via two sequential
# `choose_from_reveal` picks (Mineral/Rock first, then LIBERATOR) followed
# by `order_remainder { destinations: [deck_bottom] }`. Both picks are
# optional — if no candidate matches the filter, the pick is skipped (the
# revealed card stays in the pool until order_remainder routes it).
#
# Equivalent to P-206's main reveal clause structure with a different
# filter pair.
effects:
  - when: on_play
    optional: false
    summary: "[On Play] Reveal top 3; add 1 Mineral/Rock and 1 LIBERATOR to hand; rest to bottom"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - choose_from_reveal:
          of: you
          filter:
            any_of:
              - trait_has: Mineral
              - trait_has: Rock
          destination: hand
          bind_as: mineral_rock_pick
          prompt: "Add 1 Mineral or Rock card to your hand"
          optional: true
      - choose_from_reveal:
          of: you
          filter: { trait_has: LIBERATOR }
          destination: hand
          bind_as: liberator_pick
          prompt: "Add 1 LIBERATOR card to your hand"
          optional: true
      - order_remainder:
          of: you
          destinations: [deck_bottom]

  - scope: inherited
    when: on_digivolution_card_trashed
    condition:
      all_of:
        - event_target_owner: you
        - trashed_source_card_id_is: EX8-047
        - any_of:
            - host_permanent_trait_has: Mineral
            - host_permanent_trait_has: Rock
        - any_permanent:
            of: opponent
            zone: [battle_area]
            kind: digimon
            play_cost_lte: 4
    summary: "When this source is trashed from a Mineral/Rock Digimon, delete an opponent Digimon cost 4 or less"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon, play_cost_lte: 4 }
          prompt: "Choose 1 opponent Digimon with play cost 4 or less"
      - delete_permanent: { target: target }
