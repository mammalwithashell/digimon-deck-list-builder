# EX8-006 DemiMeramon — Digi-Egg, Purple, Lv.2. Traits: Flame, NSo (form In-Training).
#
# Printed text (official Bandai DB, data/card_bundles/EX8-006.md):
#   Inherited Effect
#   [When Attacking] [Once Per Turn] If this Digimon has the [NSo] trait, by
#   trashing 1 card in your hand, delete 1 of your opponent's level 3 Digimon.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/EX8/Purple/EX8_006.cs
#   (OnAllyAttack, inherited, OPT hash "WhenAttacking_EX8_006").
#   CanActivateCondition: on the battle area, the permanent's TOP card
#   ContainsTraits("NSo"), and the owner's hand is non-empty. Body: a hand pick
#   in Discard mode with `canNoSelect: true` (the "by trashing" cost may be
#   declined); only when a card was trashed does a MANDATORY pick of an opponent
#   level-3 Digimon follow (canNoSelect: false) and delete it. The per-turn use is
#   consumed by activating, even when the cost is declined (no RemoveUse).
#
# DSL: inherited `when_attacking` + once_per_turn; the trait gate is a clause
# `condition: source_permanent_trait_has: NSo` (the carrier's merged top-card
# traits, CR 4.3 §6 "has the trait"); the optional cost is the
# `select_hand ... optional: true, cost: true` + `trash_from_hand_by_index`
# idiom (declining aborts the rest of the clause: CR 4.3 §15-7-2), then the
# delete over `level_eq: 3` opponent Digimon (an empty candidate set silently
# skips the pick).

card: EX8-006
name: DemiMeramon
kind: digi_egg
level: 2
color: [purple]
traits: [Flame, NSo]

effects:
  - scope: inherited
    when: when_attacking
    once_per_turn: true
    condition: { source_permanent_trait_has: NSo }
    summary: "[Inherited][When Attacking][Once Per Turn] If this Digimon has the [NSo] trait, by trashing 1 card in your hand, delete 1 of your opponent's level 3 Digimon"
    process:
      - select_hand:
          of: you
          bind_as: cost_card
          optional: true
          cost: true
          filter: {}
          prompt: "You may trash 1 card in your hand to delete 1 of your opponent's level 3 Digimon"
      - trash_from_hand_by_index: { of: you, hand_index: cost_card }
      - select_opponent_permanent:
          bind_as: victim
          filter:
            all_of:
              - kind: digimon
              - level_eq: 3
          prompt: "Delete 1 of your opponent's level 3 Digimon"
      - delete_permanent: { target: victim }
