card: EX8-055
name: Pyramidimon
kind: digimon
level: 6
color: [black]
cost: 12
dp: 12000
traits: [Mineral, LIBERATOR]
attribute: Virus
alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: black }
    cost: 4

# Authoritative card text (EX8-055.json / cards.json — verbatim):
#
#   ＜Fragment (3)＞
#
#   [When Digivolving] [When Attacking]
#   By trashing any 3 digivolution cards with the [Mineral] or [Rock] trait
#   from your Digimon, this Digimon unsuspends and gains ＜Security A. +1＞
#   for the turn.
#
#   [End of Your Turn] [Once Per Turn]
#   You may place up to 3 cards with the [Mineral] or [Rock] trait from your
#   trash as this Digimon's bottom digivolution cards.
#
# ─── Clause A: [WD][WA] trash 3 Mineral/Rock sources → unsuspend + SecurityA+1 ─
#
# "By trashing any 3 digivolution cards with the [Mineral] or [Rock] trait
#  from your Digimon, this Digimon unsuspends and gains <Security A. +1>
#  for the turn."
#
# Cost: select exactly 3 Mineral/Rock trait source cards from any of your own
# Digimon's digivolution stacks (no `from:` restricts to the carrier — all
# own Digimon's stacks are scanned). If fewer than 3 qualify, the SourceMulti
# silently skips per no-approximations silent-skip contract.
#
# Effect (inside `then:` block, runs only after full cost is paid):
#   1. trash_selected_sources
#   2. unsuspend this Digimon  (`target: source`)
#   3. SecurityAttackChange +1 for the turn (`expiry: end_of_turn`)
#
# "For the turn" = until end of the current turn = `expiry: end_of_turn`.
#
# ─── Clause B: [End of Your Turn][OPT] place up to 3 Mineral/Rock from trash ──
#
# "You may place up to 3 cards with the [Mineral] or [Rock] trait from your
#  trash as this Digimon's bottom digivolution cards."
#
# Timing: `when: end_of_your_turn`, `once_per_turn: true`, `optional: true`.
#
# One `select_count_capped_multi` (trash, max 3, optional_zero) + one batched
# `place_cards_as_bottom_sources` — DCGO's single SelectCardEffect (maxCount 3,
# canEndNotMax) + one AddDigivolutionCardsBottom. (Formerly three sequential
# optional picks, which re-asked after a PASS — found by invariant_fuzz seed
# 20260708003; same fix as EX10-033 Clause A.)
#
# ─── Implementation status ───────────────────────────────────────────────────
#
# | Card-text element                                               | Status      |
# |-----------------------------------------------------------------|-------------|
# | <Fragment (3)> keyword                                          | IMPLEMENTED |
# | [WD][WA] trash 3 Mineral/Rock sources from your Digimon (cost) | IMPLEMENTED |
# | [WD][WA] this Digimon unsuspends                               | IMPLEMENTED |
# | [WD][WA] SecurityAttackChange +1 for the turn                  | IMPLEMENTED |
# | [EOT][OPT] place up to 3 Mineral/Rock from trash as sources    | IMPLEMENTED |

effects:
  # ─── Fragment (3) ─────────────────────────────────────────────────────────
  - kind: grant_keyword
    keyword: Fragment
    value: 3

  # ─── Clause A: [When Digivolving][When Attacking] source-trash → unsuspend + SecurityA+1 ─
  #
  # Cost: trash exactly 3 Mineral/Rock trait cards from any of your Digimon's
  # digivolution stacks. Effect: unsuspend this Digimon + SecurityAttackChange +1
  # until end of turn. Both effects are inside `then:` so they only run if the
  # full cost is paid.
  - when: [when_digivolving, when_attacking]
    summary: "[WD][WA] Trash 3 Mineral/Rock sources from your Digimon → unsuspend + SecurityA+1 for the turn"
    process:
      - select_own_sources:
          filter:
            any_of:
              - trait_has: Mineral
              - trait_has: Rock
          min: 3
          max: 3
          bind_as: cost_sources
          prompt: "Trash any 3 [Mineral] or [Rock] digivolution cards from your Digimon to unsuspend and gain Security A. +1"
          then:
            # Step 1: Trash the selected source cards.
            - trash_selected_sources: { source_refs: cost_sources }
            # Step 2: Unsuspend this Digimon.
            - unsuspend: { target: source }
            # Step 3: SecurityAttackChange +1 until end of this turn.
            - add_modifier:
                target: source
                modifier: SecurityAttackChange
                value: 1
                expiry: end_of_turn

  # ─── Clause B: [End of Your Turn][OPT] place up to 3 Mineral/Rock from trash ─
  #
  # "You may place up to 3 [Mineral] or [Rock] trait cards from your trash as
  #  this Digimon's bottom digivolution cards."
  #
  # One `select_count_capped_multi` (max 3, optional_zero) + one batched
  # `place_cards_as_bottom_sources`: the player may stop at 0, 1, 2 or 3.
  - when: end_of_your_turn
    once_per_turn: true
    optional: true
    summary: "[EOT][OPT] Place up to 3 Mineral/Rock cards from trash as this Digimon's bottom sources"
    process:
      # "up to 3" is ONE multi-pick (DCGO SelectCardEffect maxCount 3,
      # canEndNotMax, canNoSelect) placed by ONE AddDigivolutionCardsBottom.
      # Three sequential optional picks re-asked after a PASS (a phantom
      # decision, rule 17) and split the placement into three events.
      - select_count_capped_multi:
          of: you
          zone: trash
          max: 3
          filter:
            any_of:
              - trait_has: Mineral
              - trait_has: Rock
          bind_as: placed
          prompt: "Choose up to 3 [Mineral] or [Rock] cards from your trash to place as this Digimon's bottom sources"
          optional_zero: true
      - place_cards_as_bottom_sources: { cards: placed, target: source }
