# EX8-057 DemiDevimon — Digimon, Purple, Lv.3, cost 3, 1000 DP. Traits: Evil,
# NSo. Attribute: Virus (form Rookie).
#
# Printed text (official Bandai DB, data/card_bundles/EX8-057.md):
#   [Digivolve] Purple Lv.2: Cost 0
#   [Digivolve] Lv.2 w/[NSo] trait: Cost 0
#   [On Play] Reveal the top 3 cards of your deck. Add 1 card with the [NSo]
#     trait and 1 card with the [Fallen Angel] trait among them to the hand.
#     Return the rest to the bottom of the deck.
#   Inherited Effect
#   [When Attacking] [Once Per Turn] <Draw 1> and trash 1 card in your hand.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/EX8/Purple/EX8_057.cs
#   - Alt digivolve: top card level 2 AND EqualsTraits("NSo"), cost 0.
#   - [On Play]: SimplifiedRevealDeckTopCardsAndSelect(3) with two AddHand
#     conditions (EqualsTraits("NSo") then EqualsTraits("Fallen Angel"), 1 each),
#     the rest to the deck bottom. A card already taken for the first condition
#     is not offered for the second (BT19-017 sister idiom: `no_duplicate_cards`).
#   - Inherited [When Attacking] OPT: Draw 1, then (hand non-empty) a MANDATORY
#     discard of 1 card (canNoSelect: false).

card: EX8-057
name: DemiDevimon
kind: digimon
level: 3
color: [purple]
cost: 3
dp: 1000
traits: [Evil, NSo]
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: purple }
    cost: 0
  - kind: digivolve
    from:
      all_of:
        - level_eq: 2
        - trait_has: NSo
    cost: 0

effects:
  - when: on_play
    summary: "[On Play] Reveal 3; add 1 [NSo] card and 1 [Fallen Angel] card to the hand; the rest to the deck bottom"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          no_duplicate_cards: true
          buckets:
            - bind_as: nso_pick
              min: 1
              max: 1
              filter: { trait_has: NSo }
            - bind_as: angel_pick
              min: 1
              max: 1
              filter: { trait_has: "Fallen Angel" }
          prompt: "Select 1 card with the [NSo] trait and 1 card with the [Fallen Angel] trait"
      - add_to_hand_from_reveal: { of: you, card: nso_pick }
      - add_to_hand_from_reveal: { of: you, card: angel_pick }
      - place_remainder_on_deck: { of: you, position: bottom }

  - scope: inherited
    when: when_attacking
    once_per_turn: true
    summary: "[Inherited][When Attacking][Once Per Turn] <Draw 1> and trash 1 card in your hand"
    process:
      - draw: { of: you, count: 1 }
      - select_hand:
          of: you
          bind_as: discard
          filter: {}
          prompt: "Trash 1 card in your hand"
      - trash_from_hand_by_index: { of: you, hand_index: discard }
