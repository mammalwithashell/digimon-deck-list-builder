card: EX8-046
name: Gotsumon
kind: digimon
level: 3
color: [black]
cost: 3
dp: 1000
traits: [Rock]
attribute: Data
alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 0

effects:
  - when: on_deletion
    optional: true
    condition:
      count_gte:
        filter:
          of: you
          zone: [hand]
          any_of:
            - trait_has: Mineral
            - trait_has: Rock
        n: 1
    summary: "[On Deletion] Trash a Mineral/Rock card from hand to Draw 2"
    process:
      - select_hand:
          of: you
          bind_as: discard
          optional: true
          filter:
            any_of:
              - trait_has: Mineral
              - trait_has: Rock
          prompt: "Trash 1 Mineral/Rock card from hand"
      - trash_from_hand_by_index: { of: you, hand_index: discard }
      - draw: { of: you, count: 2 }

  - scope: inherited
    kind: grant_keyword
    keyword: Blocker
    summary: "Inherited <Blocker>"
