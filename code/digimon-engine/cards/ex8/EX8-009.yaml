# EX8-009 Guilmon (X Antibody) — Digimon, Lv.3, Red/Purple, DP 2000, Cost 3.
# Traits: Dark Dragon, X Antibody. Form: Rookie. Attribute: Virus. Rarity: R.
#
# Printed card text (card image EX8-009.webp + official Bandai DB bundle
# data/card_bundles/EX8-009.md, authoritative):
#
#   Evo box: Lv.2 from red OR purple: Cost 1 — one red/purple SPLIT circle
#     (official DB lists "Red Lv.2 / cost 1" AND "Purple Lv.2 / cost 1").
#   Evo box: "Digivolve [Gigimon]/[Guilmon]: Cost 0"
#
#   [On Play] [When Digivolving] Reveal the top 3 cards of your deck. Add 1
#   card with [Growlmon] or [Gallantmon] in its name and 1 [X Antibody] among
#   them to the hand. Return the rest to the bottom of the deck.
#
#   Inherited Effect: [Your Turn] [Once Per Turn] When any of your opponent's
#   Digimon are deleted, gain 1 memory.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/EX8/Red/EX8_009.cs
#
# ─── DCGO crosscheck ─────────────────────────────────────────────────────────
#
# Alternate Digivolution Requirement (EffectTiming.None):
#   AddSelfDigivolutionRequirementStaticEffect(permanentCondition:
#   TopCard.EqualsCardName("Guilmon") || EqualsCardName("Gigimon"),
#   digivolutionCost: 0, ignoreDigivolutionRequirement: false) — EXACT-name
#   gate (so "Guilmon (X Antibody)" itself is NOT a [Guilmon]) → one alt path
#   with `any_of: [name_is Guilmon, name_is Gigimon]`. [Gigimon] is a Digi-Egg
#   (EX13-001) that only exists in the breeding area, so the route must work on
#   a breeding-area base (recorded DCGO PvP game, 2026-11).
#
# On Play / When Digivolving (OnEnterFieldAnyone, two ActivateClasses sharing a
#   body): SimplifiedRevealDeckTopCardsAndSelect(revealCount: 3,
#   [0] ContainsCardName("Growlmon") || ContainsCardName("Gallantmon"),
#       AddHand, maxCount 1;
#   [1] EqualsCardName("X Antibody"), AddHand, maxCount 1;
#   remainingCardsPlace: DeckBottom).
#   - Bucket 0 matches ANY card kind (no IsDigimon gate) → name_contains.
#   - "[X Antibody]" is a card NAME matched exactly (EqualsCardName) →
#     name_is.
#   - canNoSelect defaults to FALSE: each add is mandatory when a matching card
#     was revealed (EX11-014 / EX7-016 idiom: min 1, no PASS). A revealed card
#     fills only one bucket (`no_duplicate_cards`).
#
# Inherited memory gain (OnDestroyedAnyone, inherited, OPT hash
#   "Memory+1_EX8_009"): CanUse = self on battle area as Digimon, owner's turn,
#   a deleted permanent is an opponent battle-area Digimon (no cause gate).
#   Body: AddMemory(1) — mandatory (no "may").
#
# ─── Clause layout ───────────────────────────────────────────────────────────
#
# Clause 1 — [On Play] [When Digivolving] reveal 3 → two buckets → bottom.
# Clause 2 — Inherited [Your Turn][OPT] opp Digimon deleted → gain 1 memory.

card: EX8-009
name: Guilmon (X Antibody)
kind: digimon
level: 3
color: [red, purple]
cost: 3
dp: 2000
traits: [Dark Dragon, X Antibody]
form: Rookie
attribute: Virus

alt_paths:
  # Printed standard evo box: a red/purple SPLIT circle — Lv.2 from red OR
  # purple, cost 1 (official DB: "Red Lv.2 / cost 1" + "Purple Lv.2 / cost 1").
  - kind: digivolve
    from: { level_eq: 2, color_is: red }
    cost: 1
  - kind: digivolve
    from: { level_eq: 2, color_is: purple }
    cost: 1
  # Printed alt evo box: "Digivolve [Gigimon]/[Guilmon]: Cost 0". DCGO gates on
  # EqualsCardName("Guilmon") || EqualsCardName("Gigimon") — exact names, no
  # level/colour restriction.
  - kind: digivolve
    from:
      any_of:
        - name_is: Guilmon
        - name_is: Gigimon
    cost: 0

effects:
  # ─── Clause 1: [On Play] [When Digivolving] reveal 3, add 1 [Growlmon]/
  #     [Gallantmon]-named card and 1 [X Antibody], rest to deck bottom ───────
  - text: "[On Play] [When Digivolving] Reveal the top 3 cards of your deck. Add 1 card with [Growlmon] or [Gallantmon] in its name and 1 [X Antibody] among them to the hand. Return the rest to the bottom of the deck."
    when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Reveal 3; add 1 [Growlmon]/[Gallantmon]-named card and 1 [X Antibody]; rest to deck bottom"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          no_duplicate_cards: true
          buckets:
            - bind_as: dragon_pick
              min: 1
              max: 1
              filter:
                any_of:
                  - name_contains: Growlmon
                  - name_contains: Gallantmon
            - bind_as: x_antibody_pick
              min: 1
              max: 1
              filter: { name_is: "X Antibody" }
          prompt: "Select 1 card with [Growlmon] or [Gallantmon] in its name and 1 [X Antibody]"
      - add_to_hand_from_reveal: { of: you, card: dragon_pick }
      - add_to_hand_from_reveal: { of: you, card: x_antibody_pick }
      - place_remainder_on_deck: { of: you, position: bottom }

  # ─── Clause 2: Inherited [Your Turn][OPT] opp Digimon deleted → +1 memory ───
  - text: "[Your Turn] [Once Per Turn] When any of your opponent's Digimon are deleted, gain 1 memory."
    scope: inherited
    when: on_any_deletion
    once_per_turn: true
    active_when: { your_turn: true }
    summary: "[Inherited][Your Turn][Once Per Turn] When any of your opponent's Digimon are deleted, gain 1 memory"
    trigger_if:
      all_of:
        - event_target_owner: opponent
        - event_target_kind: digimon
    process:
      - gain_memory: 1
