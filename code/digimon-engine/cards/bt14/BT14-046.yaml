# BT14-046 Togemon — Digimon, Lv.4, Green, DP 3000, Cost 4.
# Traits: Vegetation. Form: Champion. Attribute: Data.
# Digivolve: green Lv.3 / cost 2 (official DB + image + DCGO BT14_046.asset).
#
# Printed text (official Bandai DB, data/card_bundles/BT14-046.md; image agrees):
#   [Your Turn][Once Per Turn] When you would play a green Tamer card from your
#   hand, by suspending 1 of your green Digimon, reduce the play cost by 3.
#   Inherited: [Your Turn][Once Per Turn] When this Digimon would digivolve, if
#   you have a green Tamer, reduce the digivolution cost by 1.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT14/Green/BT14_046.cs
#   - Clause 1: BeforePayCost ActivateClass (maxCountPerTurn 1, isOptional):
#     CanUse = on battle area, IsOwnerTurn, CanTriggerWhenPermanentWouldPlay
#     (green Tamer in the owner's HAND); CanActivate = an own green Digimon that
#     can pay a suspend cost. SelectPermanentEffect (canNoSelect) →
#     SuspendPermanentsClass by this effect → only if it really suspended:
#     ChangeCost -3 for a green Tamer from Root.Hand.
#   - Inherited: ChangeCostClass -1 (maxCountPerTurn 1, inherited): on battle
#     area, IsOwnerTurn, an own green Tamer on the field, applied to a
#     digivolution onto THIS permanent.
#
# Modeling:
#   - Clause 1 — `kind: cost_reduction` hosted on the field (the BT22-094 /
#     BT25-088 `when_any_ally_played` shape) with an interactive `pay_cost`
#     (the EX8-074 / BT13-083 select → act shape): `optional: true` ("by
#     suspending" is an optional processing condition, §15-7-1),
#     `once_per_turn`, `active_when: your_turn`, `when_any_ally_played` a green
#     Tamer (the cost target is the controller's own play), `cost_target_from_hand`
#     ("from your hand"), and the §15-7-4 payability gate (an unsuspended own
#     green Digimon — Togemon itself qualifies). amount 3.
#   - Clause 2 — inherited `cost_reduction` on this permanent's digivolve
#     (`source_is_cost_target_permanent`, the BT11-061 / BT21-056 idiom), gated
#     on an own green Tamer in the battle area; mandatory; OPT.

card: BT14-046
name: Togemon
kind: digimon
level: 4
color: [green]
cost: 4
dp: 3000
traits: [Vegetation]
form: Champion
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: green }
    cost: 2

effects:
  - kind: cost_reduction
    reduction_timing: before_pay_cost
    active_when: { your_turn: true }
    when_any_ally_played:
      all_of:
        - kind: tamer
        - color_is: green
    condition:
      all_of:
        - cost_target_from_hand: true
        - any_permanent:
            of: you
            zone: [battle_area]
            kind: digimon
            color_is: green
            is_unsuspended: true
    optional: true
    once_per_turn: true
    amount: 3
    pay_cost:
      - select_own_permanent:
          bind_as: suspend_cost
          filter:
            all_of:
              - kind: digimon
              - color_is: green
              - is_unsuspended: true
          prompt: "Suspend 1 of your green Digimon to reduce the green Tamer's play cost by 3"
      - suspend: { target: suspend_cost }
    summary: "[Your Turn][Once Per Turn] When you would play a green Tamer card from your hand, by suspending 1 of your green Digimon, reduce the play cost by 3"

  - kind: cost_reduction
    scope: inherited
    reduction_timing: before_pay_cost
    active_when:
      all_of:
        - your_turn: true
        - source_is_cost_target_permanent: true
        - any_permanent:
            of: you
            zone: [battle_area]
            kind: tamer
            color_is: green
    once_per_turn: true
    amount: 1
    summary: "[Your Turn][Once Per Turn] When this Digimon would digivolve, if you have a green Tamer, reduce the digivolution cost by 1"
