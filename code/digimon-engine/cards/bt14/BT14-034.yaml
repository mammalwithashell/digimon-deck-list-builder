# BT14-034 Sukamon — Digimon, Lv.4, Yellow/Black, DP 1000, Cost 3.
# Traits: Abnormal. Form: Champion. Attribute: Virus.
#
# Printed text (official Bandai DB bundle data/card_bundles/BT14-034.md,
# authoritative; DCGO BT14_034.cs cross-checked):
#
#   Evo box: Yellow Lv.3 / cost 2 OR Black Lv.3 / cost 2 (two circles).
#   [Security] At the end of the battle, play this card without paying the cost.
#   Inherited: [On Deletion] 1 of your opponent's Digimon gets -3000 DP for the
#   turn.
#
# ─── DCGO crosscheck ─────────────────────────────────────────────────────────
#
# [Security] (EffectTiming.SecuritySkill): the shared factory
#   `PlaySelfDigimonAfterBattleSecurityEffect` -> `on_security` +
#   `play_from_security` (BT24-036 / BT21-043 / BT25-036 idiom; the engine holds
#   the play until the battle ends).
#
# Inherited [On Deletion] (OnDestroyedAnyone, SetIsInheritedEffect(true),
#   isOptional: false): `canNoSelect: false`, `ChangeDigimonDP(-3000,
#   UntilEachTurnEnd)` on 1 opponent Digimon -> mandatory pick +
#   `add_dp_modifier` with `expiry: end_of_turn` (BT24-036 idiom).

card: BT14-034
name: Sukamon
kind: digimon
level: 4
color: [yellow, black]
cost: 3
dp: 1000
traits: [Abnormal]
form: Champion
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 2
  - kind: digivolve
    from: { level_eq: 3, color_is: black }
    cost: 2

effects:
  - text: "[Security] At the end of the battle, play this card without paying the cost."
    when: on_security
    summary: "[Security] At the end of the battle, play this card without paying the cost"
    process:
      - play_from_security: {}

  - text: "[On Deletion] 1 of your opponent's Digimon gets -3000 DP for the turn."
    when: on_deletion
    scope: inherited
    summary: "Inherited [On Deletion] 1 of your opponent's Digimon gets -3000 DP for the turn"
    condition:
      any_permanent:
        of: opponent
        zone: [battle_area]
        kind: digimon
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: tgt
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to get -3000 DP for the turn"
      - add_dp_modifier:
          target: tgt
          value: -3000
          expiry: end_of_turn
