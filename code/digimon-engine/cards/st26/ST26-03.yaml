card: ST26-03
name: Tenkomon
kind: digimon
level: 4
color: [blue]
cost: 4
dp: 5000
# (Rule) Trait: Has [Ice-Snow] Type.
traits: [Mysterious Beast, ALYSION, Ice-Snow]
form: Champion
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: blue }
    cost: 2

effects:
  - when: [on_play, when_digivolving]
    text: "[On Play] [When Digivolving] If you have 1 or fewer Tamers, you may play 1 [Valner Dragnogh] from your hand without paying the cost."
    condition:
      count_lte:
        filter: { of: you, zone: [battle_area], kind: tamer }
        n: 1
    summary: "[On Play][When Digivolving] If you have 1 or fewer Tamers, you may play 1 [Valner Dragnogh] from hand without paying the cost"
    process:
      - select_hand:
          of: you
          bind_as: tamer_card
          optional: true
          filter: { name_is: "Valner Dragnogh", can_play_from_effect_without_cost: true }
          prompt: "You may play 1 [Valner Dragnogh] from your hand without paying the cost"
      - play_from_hand_free: { of: you, hand_index: tamer_card }

  - scope: inherited
    text: "[End of Attack] [Once Per Turn] Gain 1 memory."
    when: end_of_attack
    once_per_turn: true
    summary: "Inherited [End of Attack][OPT] Gain 1 memory"
    process:
      - gain_memory: 1
