card: ST26-02
name: Renamon
kind: digimon
level: 3
color: [blue]
cost: 3
dp: 1000
# (Rule) Trait: Has [Ice-Snow] Type.
traits: [Beastkin, ALYSION, Ice-Snow]
form: Rookie
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: blue }
    cost: 0

effects:
  - when: [on_move, on_play]
    text: "[When Moving] [On Play] Trash the bottom digivolution card of 1 of your opponent's Digimon. Then, if your opponent has no Digimon with digivolution cards, ＜Draw 1＞."
    timing_conditions:
      - when: on_move
        condition: { event_permanent_is_source: true }
    summary: "[When Moving][On Play] Trash the bottom digivolution card of 1 opposing Digimon; then if opponent has no Digimon with digivolution cards, Draw 1"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: victim
          filter: { kind: digimon }
          prompt: "Trash the bottom digivolution card of 1 of your opponent's Digimon"
      - trash_bottom_sources: { target: victim, count: 1 }
      - if:
          condition:
            not:
              any_permanent: { of: opponent, zone: [battle_area], kind: digimon, materials_count_gte: 1 }
          then:
            - draw: { of: you, count: 1 }

  - scope: inherited
    text: "[When Attacking] If this Digimon has the [Ice-Snow] trait, you may change the attack target to 1 of your opponent's unsuspended Digimon with the fewest digivolution cards."
    when: when_attacking
    optional: true
    condition: { trait_has: Ice-Snow }
    summary: "Inherited [When Attacking] If this Digimon is [Ice-Snow], you may change the attack target to 1 opposing unsuspended Digimon with the fewest digivolution cards"
    process:
      - select_opponent_permanent:
          bind_as: defender
          optional: true
          filter: { kind: digimon, is_unsuspended: true }
          selector: lowest_material_count_redirection
          prompt: "Choose a new attack target among the opponent's unsuspended Digimon with the fewest digivolution cards"
      - redirect_attack_target: { new_target: defender, optional: false }
