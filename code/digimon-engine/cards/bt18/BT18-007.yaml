# BT18-007 Gazimon — Digimon, Lv.3, Red/Purple, DP 1000, Cost 3.
# Traits: Mammal. Attribute: Virus.
#
# Printed card text (data/card_bundles/BT18-007.md — official Bandai DB):
#   [On Play] Reveal the top 3 cards of your deck. Add 1 card with
#   [Millenniummon] in its name and 1 card with the [Composite] or
#   [Wicked God] trait among them to the hand. Return the rest to the
#   bottom of the deck.
#   Inherited Effect: ＜Retaliation＞ (When only this Digimon is deleted in
#   battle, delete the Digimon it battled.)
#   Official Q&A: "Yes, you must add as many cards to your hand as possible."
#     -> both buckets are mandatory whenever a matching card exists.
#
# Digivolution: two standard mono-color Lv.2 circles (Red / cost 1, Purple /
# cost 1) plus a special condition: [Digivolve] [Pagumon]: Cost 0.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT18/Red/BT18_007.cs
#
# DCGO crosscheck:
#   - Digivolution Condition (timing None): AddSelfDigivolutionRequirementStaticEffect
#     (TopCard.EqualsCardName("Pagumon"), cost 0) -> alt_paths digivolve
#     from { name_is: Pagumon }, cost 0.
#   - On Play (OnEnterFieldAnyone): SimplifiedRevealDeckTopCardsAndSelect(revealCount: 3,
#     two SimplifiedSelectCardConditionClass buckets each maxCount 1 -> AddHand,
#     remainingCardsPlace: DeckBottom) -> select_reveal_buckets pattern
#     (BT17-009 exemplar), bucket 0 filtered by name_contains "Millenniummon",
#     bucket 1 filtered by trait_has Composite OR Wicked God. min:1 on each
#     bucket clamps to the number of eligible matches actually present in the
#     reveal (0..1), matching DCGO's mandatory-if-present + maxCount 1 shape.
#   - Retaliation - ESS (OnDestroyedAnyone): RetaliationSelfEffect(isInheritedEffect: true)
#     -> scope: inherited, kind: grant_keyword, keyword: Retaliation.

card: BT18-007
name: Gazimon
kind: digimon
level: 3
color: [red, purple]
cost: 3
dp: 1000
traits: [Mammal]
attribute: Virus

alt_paths:
  # Standard circle: Red Lv.2 / cost 1.
  - kind: digivolve
    from:
      all_of:
        - level_eq: 2
        - color_is: red
    cost: 1
  # Standard circle: Purple Lv.2 / cost 1.
  - kind: digivolve
    from:
      all_of:
        - level_eq: 2
        - color_is: purple
    cost: 1
  # Special digivolution condition: [Digivolve] [Pagumon]: Cost 0.
  - kind: digivolve
    from: { name_is: "Pagumon" }
    cost: 0

effects:
  - when: on_play
    summary: "[On Play] Reveal top 3; add 1 [Millenniummon]-named card and 1 [Composite]/[Wicked God]-trait card to hand; rest to bottom"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          buckets:
            - bind_as: millenniummon_pick
              min: 1
              max: 1
              filter:
                name_contains: "Millenniummon"
            - bind_as: trait_pick
              min: 1
              max: 1
              filter:
                any_of:
                  - trait_has: Composite
                  - trait_has: "Wicked God"
          no_duplicate_cards: true
          prompt: "Select 1 card with [Millenniummon] in its name and 1 card with the [Composite] or [Wicked God] trait"
      - add_to_hand_from_reveal: { of: you, card: millenniummon_pick }
      - add_to_hand_from_reveal: { of: you, card: trait_pick }
      - place_remainder_on_deck: { of: you, position: bottom }

  - scope: inherited
    kind: grant_keyword
    keyword: Retaliation
    summary: "Inherited <Retaliation>"
