card: BT18-099
name: "Fist of Athena"
kind: option
color: [purple, black]
cost: 3

use_requirement:
  any_field_permanent:
    of: you
    all_of:
      - kind: digimon
      - any_of:
          - name_contains: Knightmon
          - rules_text_contains: Knightmon

effects:
  - text: 'While you have a Digimon with [Knightmon] in its text, you may ignore this card''s color requirements. [Main] Until the end of your opponent''s turn, give 1 of their Digimon "[Start of Your Main Phase] This Digimon attacks." Then, place this card in the battle area.'
    when: main_from_hand
    summary: "[Main] Grant 1 opponent Digimon '[Start of Your Main Phase] This Digimon attacks.' until end of opponent's turn; place self in battle area"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: taunt_target
          filter: { kind: digimon }
          prompt: "Give 1 of your opponent's Digimon '[Start of Your Main Phase] This Digimon attacks.'"
      - grant_triggered_effect:
          target: taunt_target
          timing: start_of_your_main_phase
          expiry: end_of_opponents_turn
          body:
            - force_attack:
                attacker: carrier
                targets: any
                prompt: "This Digimon attacks"
      - place_self_as_delay_option: {}

  - text: "[All Turns] When attack targets change, ＜Delay＞. ・1 of your Digimon gains ＜Piercing＞ and ＜Security A. +1＞ until the end of your turn."
    kind: delay
    trigger: on_attack_target_change
    active_when: { all_turns: true }
    summary: "[All Turns] When attack target changes, <Delay> 1 of your Digimon gains <Piercing> and <Security A. +1> until end of your turn"
    process:
      - select_own_permanent:
          optional: false
          bind_as: buffed
          filter: { kind: digimon }
          prompt: "1 of your Digimon gains <Piercing> and <Security A. +1> until the end of your turn"
      - grant_keyword: { target: buffed, keyword: Piercing, expiry: end_of_your_turn }
      - grant_keyword: { target: buffed, keyword: SecurityAttackPlus, value: 1, expiry: end_of_your_turn }

  - text: "[Security] You may play 1 level 5 or lower Digimon card with [Knightmon] in its text from your trash without paying the cost. Then, place this card in the battle area."
    scope: inherited
    when: on_security
    summary: "[Security] May play 1 Lv.5 or lower [Knightmon]-text Digimon from trash free, then place self in battle area"
    process:
      - select_trash:
          of: you
          bind_as: revived
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_lte: 5
              - any_of:
                  - name_contains: Knightmon
                  - rules_text_contains: Knightmon
              - can_play_from_effect_without_cost: true
          prompt: "You may play 1 level 5 or lower Digimon card with [Knightmon] in its text from your trash without paying the cost"
      - if:
          condition: { binding_present: revived }
          then:
            - play_from_trash_free: { of: you, hand_index: revived }
      - place_self_as_delay_option: {}
