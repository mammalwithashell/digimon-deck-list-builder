# Official observation 80da24a136d15f6ba9fb480564eeeb7cff2ef4ea3aae0cc8d64dfc0346b3c6ac.
# BT18-076.webp confirms both native Lv3/Tamer circles and named routes.
# DCGO BT18/Purple/BT18_076.cs: inherited play never cancels the original leave.
card: BT18-076
name: Loweemon
kind: digimon
level: 4
color: [purple, yellow]
cost: 5
dp: 5000
form: Hybrid
attribute: Variable
traits: [Warrior]
alt_paths:
  - kind: digivolve
    from:
      kind: digimon
      level_eq: 3
      any_of: [{ color_is: purple }, { color_is: yellow }]
    cost: 3
  - kind: digivolve
    from:
      kind: tamer
      any_of: [{ color_is: purple }, { color_is: yellow }]
    cost: 3
  - kind: digivolve
    from: { name_is: "Koichi Kimura" }
    cost: 2
  - kind: digivolve
    from: { name_is: KaiserLeomon }
    cost: 0
effects:
  - when: when_digivolving
    process:
      - draw: { of: you, count: 1 }
      - select_hand:
          of: you
          bind_as: discarded
          filter: {}
          optional: false
          prompt: Trash 1 card in your hand
      - trash_from_hand_by_index: { of: you, hand_index: discarded }
  - when: when_attacking
    process:
      - select_own_permanent:
          bind_as: host
          optional: true
          filter:
            all_of:
              - any_of: [{ kind: digimon }, { kind: tamer }]
              - has_digivolve_candidate:
                  of: you
                  zone: [trash]
                  cost: printed
                  filter:
                    all_of:
                      - kind: digimon
                      - trait_has: Hybrid
                      - any_of: [{ color_is: purple }, { color_is: yellow }]
          prompt: Choose 1 of your Digimon or Tamers to digivolve
      - select_trash:
          of: you
          bind_as: hybrid
          optional: true
          filter:
            all_of:
              - kind: digimon
              - trait_has: Hybrid
              - any_of: [{ color_is: purple }, { color_is: yellow }]
              - can_digivolve_onto_with_cost: { target: host, cost: printed }
          prompt: Choose a purple or yellow Hybrid to digivolve at its digivolution cost
      - effect_initiated_digivolve:
          target: host
          source: hybrid
          cost: printed
          ignore_requirements: false
  - scope: inherited
    kind: replacement
    trigger: when_would_leave_battle_area
    optional: true
    active_when:
      none_of: [{ replacement_cause: own_effect }]
    process:
      - select_material:
          of_permanent: replacement_subject
          optional: true
          bind_as: tamer
          filter:
            all_of:
              - kind: tamer
              - has_inherited: {}
              - can_play_from_effect_without_cost: true
          prompt: Play 1 Tamer with inherited effects from this Digimon's digivolution cards
      - play_from_materials:
          target: replacement_subject
          source_index: tamer
          cost_delta: free
