# BT16-001 Poromon — Digi-Egg Lv.2, Red, cost 0. Traits: Mini Bird. In-Training.
#
# Printed text (data/card_bundles/BT16-001.md, official Bandai DB):
#   Inherited: [When Attacking][Once Per Turn] If this Digimon has 2 or more
#   colors, delete 1 of your opponent's Digimon with 2000 DP or less.
#
# DCGO: DCGO/Assets/Scripts/CardEffect/BT16/Red/BT16_001.cs
#   inherited OnAllyAttack, maxCount 1; the colour count is the attacker's top
#   card (`self_color_count_gte`, evaluated on the carrier's top card colors,
#   BT16-002 / BT16-004 idiom). The delete target is a mandatory pick once the
#   condition holds.
card: BT16-001
name: Poromon
kind: digi_egg
level: 2
color: [red]
cost: 0
traits: [Mini Bird]
form: In-Training
effects:
  - text: "[When Attacking] [Once Per Turn] If this Digimon has 2 or more colors, delete 1 of your opponent's Digimon with 2000 DP or less."
    scope: inherited
    when: when_attacking
    once_per_turn: true
    condition: { self_color_count_gte: 2 }
    summary: "[When Attacking][OPT] If this Digimon has 2 or more colors, delete 1 of your opponent's Digimon with 2000 DP or less (inherited)"
    process:
      - select_opponent_permanent:
          bind_as: victim
          filter:
            all_of:
              - kind: digimon
              - dp_lte: 2000
          prompt: "Delete 1 of your opponent's Digimon with 2000 DP or less"
      - delete_permanent: { target: victim }
