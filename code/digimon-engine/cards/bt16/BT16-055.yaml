card: BT16-055
name: Namakemon
kind: digimon
level: 4
color: [black]
cost: 4
dp: 4000
traits: [Puppet]
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: black }
    cost: 2
  - kind: digivolve
    from: { name_is: "Pulsemon" }
    cost: 2

effects:
  # Printed high-security branch:
  # "If you have 3 or more security cards, until the end of your opponent's turn,
  # 1 of your Digimon can't have its DP reduced by your opponent's effects and
  # isn't affected by <De-Digivolve> effects."
  #
  # PUPPETS-G024 — narrow opponent-effect protection:
  #   - ImmuneFromDPMinus: filters negative ChangeDp modifiers in effective_dp
  #     (combat.rs). Covers "DP reduced by your opponent's effects" — since DP
  #     reduction is always a negative ChangeDp applied by an opponent effect in
  #     practice, this is the correct narrow primitive.
  #   - CannotBeDeDigivolved: already has default_passive_cause_filter returning
  #     ReplacementCause::OpponentEffect (modifiers.rs:484), so it is inherently
  #     opponent-scoped. Covers "isn't affected by <De-Digivolve> effects."
  #   Both expire at end_of_opponents_turn. Selection is mandatory (printed text
  #   says "1 of your Digimon" with no optional marker).
  - when: [on_play, when_digivolving]
    condition: { security_count_gte: 3 }
    summary: "At 3 or more security, 1 of your Digimon can't have DP reduced or be De-Digivolved by opponent effects until opponent's turn ends"
    process:
      - select_own_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 of your Digimon to protect from DP reduction and De-Digivolve"
      - add_modifier:
          target: target
          modifier: ImmuneFromDPMinus
          value: 0
          expiry: end_of_opponents_turn
      - add_modifier:
          target: target
          modifier: CannotBeDeDigivolved
          value: 0
          expiry: end_of_opponents_turn

  - when: [on_play, when_digivolving]
    condition: { security_count_lte: 3 }
    summary: "At 3 or fewer security, 1 of your Digimon gains Blocker and Reboot until your opponent's turn ends"
    process:
      - select_own_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 of your Digimon to gain Blocker and Reboot"
      - grant_keyword:
          target: target
          keyword: Blocker
          expiry: end_of_opponents_turn
      - grant_keyword:
          target: target
          keyword: Reboot
          expiry: end_of_opponents_turn

  # Inherited: "[All Turns] While this Digimon has [Pulsemon] in its text,
  # it gets +1000 DP."
  # active_when guards on rules_text_contains — checked against the carrier
  # permanent's printed rules text via source_permanent on the read context.
  # dp_modifier_fn: 1000 (Literal formula) is picked up live by
  # live_declarative_formula_sum so effective_dp reflects the bonus without
  # requiring a declarative tick.
  - scope: inherited
    kind: aura
    active_when: { all_turns: true, rules_text_contains: "[Pulsemon]" }
    dp_modifier_fn: 1000
