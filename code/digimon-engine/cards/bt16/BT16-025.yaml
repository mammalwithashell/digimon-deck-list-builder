# BT16-025: printed image and official text have ONE [When Digivolving] effect.
# Suspend resolves first; its Then DNA-only lock is not a separately ordered trigger.
# DCGO BT16/Blue/BT16_025.cs: IsJogress is inside the same WD coroutine.
card: BT16-025
name: Paildramon
kind: digimon
level: 5
color: [blue, green]
cost: 8
dp: 8000
traits: [Dragonkin]

alt_paths:
  - kind: digivolve
    from: { level_eq: 4 }
    cost: 4
  - kind: dna_digivolve
    materials:
      - { level_eq: 4, color_is: blue }
      - { level_eq: 4, color_is: green }
    cost: 0

effects:
  # ─── Clause 0: <Partition (Blue Lv.4 & Green Lv.4)> ─────────────────────────
  # Declarative. DCGO: PartitionSelfEffect(isInheritedEffect: false).
  - kind: partition
    summary: "<Partition (Blue Lv.4 & Green Lv.4)>"
    sources:
      - { level_eq: 4, color_is: blue }
      - { level_eq: 4, color_is: green }
    exclude_cause: [own_effect, battle]

  # ─── Clause 1a: [When Digivolving] suspend all opp Digimon ≤ source stack ────
  #
  # "[When Digivolving] Suspend all of your opponent's Digimon with as many or
  # fewer digivolution cards as this Digimon." — printed text.
  #
  # DCGO: opponentSuspendable = opponentDigimon.Where(p =>
  #   p.DigivolutionCards.Count <= card.PermanentOfThisCard().DigivolutionCards.Count)
  #
  # Authored with `materials_count_lte: { formula: { source_material_count: {} } }`:
  # `source_material_count` resolves the SOURCE permanent's digivolution-card count
  # at resolution time, and `materials_count_lte` filters each candidate by its own
  # digivolution-card count. Both counts are `card_sources.len() - 1` (top card
  # excluded), so the comparison is exactly "as many or fewer digivolution cards".
  - when: when_digivolving
    summary: "[WD] Suspend qualifying opposing Digimon; then, if DNA digivolving, prevent opposing Digimon unsuspending"
    process:
      - for_each:
          over:
            all_of:
              - of: opponent
              - zone: [battle_area]
              - kind: digimon
              - materials_count_lte: { formula: { source_material_count: {} } }
          bind_as: digi
          body:
            - suspend: { target: digi }

      - if:
          condition: { dna_origin: true }
          then:
            - add_player_modifier:
                target_player: opponent
                modifier: CannotUnsuspend
                expiry: end_of_opponents_turn


  # ─── Clause 2: [When Attacking][OPT] suspend 1 opp unsuspended ───────────────
  #
  # Suspend 1 of your opponent's unsuspended Digimon (optional: `optional: true`
  # on the selection skips the step when no unsuspended Digimon are present,
  # matching DCGO's `canNoSelect: true` when no eligible targets exist).
  #
  # "If this effect didn't suspend, unsuspend this Digimon" — authored with
  # `effect_suspended_any_opponent_digimon: false`, which branches on the
  # effect's result log (whether the suspend mutation actually applied to an
  # opponent Digimon), not merely whether a target was selected. This is the
  # faithful printed-text reading: the fallback fires whenever no opponent
  # Digimon was suspended this resolution.
  - when: when_attacking
    once_per_turn: true
    optional: true
    summary: "[WA][OPT] Suspend 1 opp unsuspended Digimon; if it didn't suspend, unsuspend this Digimon"
    process:
      - select_opponent_permanent:
          bind_as: wa_target
          filter:
            all_of:
              - kind: digimon
              - is_unsuspended: true
          optional: true
          prompt: "Suspend 1 of your opponent's unsuspended Digimon"
      - suspend: { target: wa_target }
      - if:
          condition: { effect_suspended_any_opponent_digimon: false }
          then:
            - unsuspend: { target: source }

  # ─── Clause 3: Inherited <Partition (Blue Lv.4 & Green Lv.4)> ────────────────
  # Declarative inherited. DCGO: PartitionSelfEffect(isInheritedEffect: true).
  - kind: partition
    scope: inherited
    summary: "Inherited <Partition (Blue Lv.4 & Green Lv.4)>"
    sources:
      - { level_eq: 4, color_is: blue }
      - { level_eq: 4, color_is: green }
    exclude_cause: [own_effect, battle]
