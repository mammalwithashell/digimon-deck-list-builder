# BT16-027 Imperialdramon: Fighter Mode — Digimon, Lv.6, Blue/Green, DP 13000, Cost 8.
# Traits: Ancient Dragonkin
# Evo: Lv.5 Blue / Cost 5
#
# Printed card text (cards.json):
#
# [Hand] [Counter] <Blast Digivolve>
#   (Your Digimon may digivolve into this card without paying the cost.)
#
# [On Play] [When Digivolving]
#   Return 1 of your opponent's Digimon with as many or fewer digivolution cards
#   as this Digimon to the bottom of the deck.
#
# [End of Attack] [Once Per Turn]
#   Unsuspend this Digimon. Then, if [Imperialdramon: Dragon Mode] is in this
#   Digimon's digivolution cards, return 1 of your opponent's suspended Digimon
#   to the bottom of the deck.
#
# Inherited effect:
#   Ace Overflow <-4> (As this card moves from the field or under a card to an
#   area other than those, lose 4 memory.)
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT16/Blue/BT16_027.cs
#
# Clause layout:
#   Alt-path 1: Standard digivolve (Lv.5 Blue / Cost 5, per evo_costs in cards.json).
#   Alt-path 2: Activated digivolve from [Imperialdramon: Dragon Mode] on field / Cost 2.
#               DCGO: AddSelfDigivolutionRequirementStaticEffect (permanentCondition: TopCard
#               EqualsCardName("Imperialdramon: Dragon Mode"), digivolutionCost: 2).
#   Alt-path 3: Burst digivolve (Blast Digivolve keyword — [Hand][Counter], cost 0).
#               DCGO: BlastDigivolveEffect at OnCounterTiming.
#   Clause 1:   <Blast Digivolve> keyword grant (face-up declarative).
#   Clause 2:   BLOCKED — [On Play][When Digivolving] return-to-bottom filtered by
#               ≤ digi-cards-as-this. See G-PRED-STACK-SIZE-LTE-SOURCE below.
#   Clause 3:   IMPLEMENTED — [End of Attack][OPT] unsuspend self + conditional
#               return when Imperialdramon: Dragon Mode is in this Digimon's
#               digivolution cards. Uses runtime-supported
#               `self_digivolution_contains_name`.
#   Inherited:  Ace Overflow <-4> via top-level `ace_overflow` field.
#
# ─── DSL Gap: G-PRED-STACK-SIZE-LTE-SOURCE  [Clause 2] ───────────────────────────
#
# Effect text: "Return 1 of your opponent's Digimon with as many or fewer
#   digivolution cards as this Digimon to the bottom of the deck."
#
# The filter on the opponent's target permanent requires:
#   target.card_sources.len() <= source.card_sources.len()
# (where source is this Digimon's permanent).
#
# The DSL predicate `stack_size_lte` takes a literal `u8` (parsed at compile time
# from the YAML). There is no `stack_size_lte_source` or `stack_size_lte_binding`
# variant that compares the target's stack size against the source's stack size at
# runtime.
#
# The DCGO condition:
#   `permanent.DigivolutionCards.Count <= card.PermanentOfThisCard().DigivolutionCards.Count`
# is a dynamic runtime comparison between two permanent stack sizes.
#
# Proposed DSL syntax (to file in qa/dsl-vocab-gaps.md):
#   filter:
#     stack_size_lte_source: true   # target.card_sources.len() <= ctx.source.card_sources.len()
# OR (more general):
#   filter:
#     stack_size_lte_binding: <binding_name>   # compare against a bound integer
#
# Lowers to engine API: The predicate evaluator already has access to
# `ctx.source_permanent()` via `ReadEffectContext`; adding a new leaf that compares
# the candidate's `card_sources.len()` against the source's is straightforward.
#
# Until this gap closes, Clause 2 is BLOCKED. Authoring the clause without the
# dynamic predicate would select any opponent Digimon regardless of stack size —
# violating the printed text and the no-approximations policy.
#
# Stub (commented — uncomment + adjust when G-PRED-STACK-SIZE-LTE-SOURCE closes):
#
# - when: [on_play, when_digivolving]
#   summary: "[On Play][When Digivolving] Return 1 opp Digimon with ≤ digi-cards as this to bottom of deck"
#   condition:
#     any_permanent:
#       of: opponent
#       zone: [battle_area]
#       kind: digimon
#       stack_size_lte_source: true        # ← BLOCKED: predicate not in DSL
#   process:
#     - select_opponent_permanent:
#         bind_as: target
#         filter:
#           all_of:
#             - kind: digimon
#             - stack_size_lte_source: true  # ← BLOCKED: predicate not in DSL
#         prompt: "Return 1 of your opponent's Digimon with as many or fewer digivolution cards as this Digimon to the bottom of the deck"
#     - return_to_deck:
#         target: target
#         position: bottom
#         include_sources: false
#
# ─── Implemented: Clause 3 source-name conditional ─────────────────────────────
#
# Effect text: "Unsuspend this Digimon. Then, if [Imperialdramon: Dragon Mode]
#   is in this Digimon's digivolution cards, return 1 of your opponent's
#   suspended Digimon to the bottom of the deck."
#
# `self_digivolution_contains_name` is now runtime-supported and scans this
# permanent's digivolution stack for the named source card. The target choice is
# still exposed through `select_opponent_permanent`; only suspended opponent
# Digimon are legal action IDs.

card: BT16-027
name: "Imperialdramon: Fighter Mode"
kind: digimon
level: 6
color: [blue, green]
cost: 8
dp: 13000
traits: [Ancient Dragonkin]

# ─── Inherited: Ace Overflow <-4> ────────────────────────────────────────────
# "Ace Overflow <-4> (As this card moves from the field or under a card to an
#  area other than those, lose 4 memory.)"
ace_overflow: -4

# ─── Alt-paths ────────────────────────────────────────────────────────────────
# 1) Standard digivolve: Lv.5 Blue / Cost 5 (per evo_costs in cards.json).
# 2) Activated digivolve: from [Imperialdramon: Dragon Mode] on own field / Cost 2.
#    DCGO: AddSelfDigivolutionRequirementStaticEffect at EffectTiming.None,
#    permanentCondition: TopCard.EqualsCardName("Imperialdramon: Dragon Mode"),
#    digivolutionCost: 2, ignoreDigivolutionRequirement: false.
# 3) Burst digivolve: Blast Digivolve ([Hand][Counter], cost 0, any own Digimon).
#    DCGO: BlastDigivolveEffect at EffectTiming.OnCounterTiming.
alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: blue }
    cost: 5

  - kind: activated_digivolve
    from:
      of: you
      zone: [battle_area]
      name_contains: "Imperialdramon: Dragon Mode"
    cost: 2

  - kind: burst_digivolve
    marker: true
    cost: 0

effects:
  # ─── Clause 1 — <Blast Digivolve> (face-up declarative keyword) ───────────────
  # "[Hand] [Counter] <Blast Digivolve>
  #  (Your Digimon may digivolve into this card without paying the cost.)"
  # DCGO: BlastDigivolveEffect at OnCounterTiming.
  - kind: grant_keyword
    keyword: BlastDigivolve

  # ─── Clause 2 — BLOCKED [On Play][When Digivolving] return ≤-digi-card opp ────
  # "[On Play] [When Digivolving] Return 1 of your opponent's Digimon with as
  #  many or fewer digivolution cards as this Digimon to the bottom of the deck."
  #
  # BLOCKED: G-PRED-STACK-SIZE-LTE-SOURCE — see header comment.
  # The DSL `stack_size_lte` predicate takes a literal u8, not a dynamic
  # runtime comparison against the source permanent's card_sources count.
  # Authoring this clause without the predicate would yield an over-permissive
  # selection — any opponent Digimon regardless of stack size — violating
  # the printed text and the no-approximations policy.

  # ─── Clause 3 — [End of Attack][OPT] unsuspend + conditional return ───────────
  # "[End of Attack] [Once Per Turn] Unsuspend this Digimon. Then, if
  #  [Imperialdramon: Dragon Mode] is in this Digimon's digivolution cards,
  #  return 1 of your opponent's suspended Digimon to the bottom of the deck."
  - when: end_of_attack
    once_per_turn: true
    summary: "[End of Attack][OPT] Unsuspend self; if Dragon Mode in digi-cards, return 1 opp suspended Digimon to bottom"
    process:
      - unsuspend: { target: source }
      - if:
          condition:
            self_digivolution_contains_name: "Imperialdramon: Dragon Mode"
          then:
            - select_opponent_permanent:
                bind_as: opp_suspended
                filter:
                  all_of:
                    - kind: digimon
                    - is_suspended: true
                prompt: "Return 1 of your opponent's suspended Digimon to the bottom of the deck"
            - return_to_deck:
                target: opp_suspended
                position: bottom
                include_sources: false
