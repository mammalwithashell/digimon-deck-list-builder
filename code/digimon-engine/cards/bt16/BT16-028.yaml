# BT16-028 Imperialdramon: Dragon Mode — Digimon, Lv.6, Blue/Green, DP 12000, Cost 12.
# Traits: Ancient Dragon
# Attribute: Free
# Evo: Lv.5 Blue / Cost 4 (printed evo_costs in cards.json)
#
# Printed card text (data/cards.json effect_description_eng — verbatim):
#
#   [When Digivolving] 1 of your opponent's Digimon or Tamers can't unsuspend
#   until the end of their turn. Then, by suspending 1 of their Digimon or
#   Tamers, unsuspend 1 of your Digimon.
#
#   [All Turns] When an effect plays or digivolves an opponent's Digimon,
#   if you have a Tamer, this Digimon may digivolve into
#   [Imperialdramon: Fighter Mode] in the hand without paying the cost.
#
# Inherited effect text: (none)
#
# DCGO C# reference:
#   DCGO/Assets/Scripts/CardEffect/BT16/Blue/BT16_028.cs
#
# ─── Alt-path note (DCGO vs printed) ─────────────────────────────────────────
#
# DCGO `EffectTiming.None` registers an AddSelfDigivolutionRequirementStaticEffect
# from Paildramon or Dinobeemon at cost 3. This is an unprinted DCGO alt-source.
# The printed `evo_costs` in cards.json shows only `{ level: 5, color: blue, cost: 4 }`.
# Per source-priority policy (printed text wins over DCGO), we encode only the
# printed standard digivolve path. If a future erratum adds the Paildramon/
# Dinobeemon alt-source, the YAML can be extended.
#
# ─── Clause 0 — [When Digivolving] CannotUnsuspend + alt-cost-suspend-then-unsuspend ─
#
# Two-part effect triggered when this Digimon digivolves:
#
# PART A — CannotUnsuspend:
#   "1 of your opponent's Digimon or Tamers can't unsuspend until the end of
#   their turn."
#
#   DCGO: SelectPermanentEffect over opp battle-area (canNoSelect: false, Mode.Custom),
#   then GainCanNotUnsuspend(targetPermanent=selectedPermanent,
#   effectDuration=UntilOpponentTurnEnd). The selection is mandatory if any eligible
#   target exists; if no opp Digimon/Tamer is present, the HasMatchConditionPermanent
#   guard skips the selection.
#
#   DSL modelling:
#     - select_opponent_permanent (filter: any_of[digimon, tamer], optional: false)
#     - add_modifier: CannotUnsuspend, expiry: end_of_opponents_turn
#   IMPLEMENTED. Same `any_of: [kind: digimon, kind: tamer]` pattern as EX9-019
#   (BT17-027, BT24-040 idiom). BT16-025 uses the same `CannotUnsuspend` modifier
#   at `on_dna_digivolve` as a bulk effect over all opponents.
#
# PART B — "by suspending ... unsuspend" (alternate-cost branch):
#   "Then, by suspending 1 of their Digimon or Tamers, unsuspend 1 of your Digimon."
#
#   DCGO: Second selection (canNoSelect: true, Mode.Tap) over opp unsuspended
#   Digimon/Tamers; if the player chose to suspend (suspendedPermanent != null),
#   a THIRD selection (canNoSelect: false, Mode.UnTap) over own SUSPENDED Digimon.
#   The unsuspend-own ONLY fires when the opp-suspend was chosen and completed.
#   The "by" construction is a conditional cost: pay (suspend opp) → reward (unsuspend own).
#
#   BLOCKED — G-DSL-IF-NO-TARGET:
#   The DSL has no binding-result flag for optional selections. After
#   `select_opponent_permanent` with `optional: true`, the step either binds a target
#   or silently skips. There is no `if { condition: { binding_present: suspend_target } }`
#   or equivalent to conditionally execute the own-unsuspend arm only when the suspend
#   cost was paid. Authoring the unsuspend unconditionally would violate no-approximations
#   (the player could get a free unsuspend without paying the suspend cost).
#
# ─── Clause 1 — [All Turns] On effect-play/digivolve opp Digimon → conditional free digivolve ─
#
# "When an effect plays or digivolves an opponent's Digimon, if you have a Tamer,
#  this Digimon may digivolve into [Imperialdramon: Fighter Mode] in the hand
#  without paying the cost."
#
# DCGO:
#   - CanUseCondition: IsExistOnBattleAreaDigimon(card)
#       && (CanTriggerOnPermanentPlay(hashtable, IsOpponentDigimon)     ← entry trigger
#           || CanTriggerWhenPermanentDigivolving(hashtable, IsOpponentDigimon))  ← digivolve trigger
#       && IsByEffect(hashtable, null)                 ← effect-initiated filter
#       && HasMatchConditionOwnersPermanent(HasTamer)  ← you have a Tamer
#       && HandCards.Count(HasFighterMode) >= 1        ← Fighter Mode is in hand
#   - isOptional: true (SetUpActivateClass(..., -1, true, ...))
#   - Body: DigivolveIntoHandOrTrashCard(
#       targetPermanent=card.PermanentOfThisCard(),  ← self
#       cardCondition=HasFighterMode, payCost=false,
#       ignoreDigivolutionRequirementFixedCost=-1,
#       isHand=true, ignoreSelection=true)            ← auto-select (no pick prompt)
#
#   Track A update (2026-05-08): `event_is_effect_initiated` now maps to the
#   trigger payload's effect-origin flag for `OnEnterFieldAnyone` and
#   `OnDigivolve`, so this clause is authored below. The follow-up hand pick is
#   still exposed as a selection, which is stricter than DCGO's auto-select and
#   keeps the no-hidden-choice contract intact when multiple Fighter Modes exist.
#
# ─── Implementation status ────────────────────────────────────────────────────
#
# | Card-text element                                                  | Status            |
# |-------------------------------------------------------------------|-------------------|
# | Standard digivolve Lv.5 Blue / Cost 4                             | IMPLEMENTED       |
# | [When Digivolving] Select 1 opp Digimon/Tamer → CannotUnsuspend   | IMPLEMENTED       |
# | [When Digivolving] By suspending opp → unsuspend own Digimon      | BLOCKED — G-DSL-IF-NO-TARGET |
# | [All Turns] Effect-play/digivolve opp Digimon → conditional free  | IMPLEMENTED       |
# |   digivolve self into Fighter Mode from hand                      |                   |
#
# Gaps:
#   G-DSL-IF-NO-TARGET: No DSL control-flow form that branches on whether a
#     prior optional selection produced a target vs. produced nothing. Tracked in
#     qa/archetype-qa/engine-gaps.md.
#
#   G-IS-EFFECT-INITIATED: Closed for this card's OnEnterFieldAnyone/OnDigivolve
#     observer shape by Track A on 2026-05-08.

card: BT16-028
name: "Imperialdramon: Dragon Mode"
kind: digimon
level: 6
color: [blue, green]
cost: 12
dp: 12000
traits: [Ancient Dragon]

# ─── Alt-path: Standard digivolve Lv.5 Blue / Cost 4 ─────────────────────────
# Printed evo_costs: [{ card_color: 1 (blue), level: 5, memory_cost: 4 }].
# The DCGO Paildramon/Dinobeemon alt-source (cost 3) is unprinted and omitted.
alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: blue }
    cost: 4

effects:
  # ─── Clause 0a: [When Digivolving] Select 1 opp Digimon/Tamer → CannotUnsuspend ─
  #
  # "1 of your opponent's Digimon or Tamers can't unsuspend until the end of
  # their turn."
  #
  # DCGO: canNoSelect: false (mandatory pick when targets exist), Mode.Custom.
  # The HasMatchConditionPermanent guard means if no opp Digimon/Tamer is present,
  # the step silently no-ops. DSL: select_opponent_permanent with optional: false
  # (mandatory when a target exists; the step produces no binding and skips the
  # modifier when no targets exist — this is the natural DSL behavior).
  #
  # IMPLEMENTED. Same `any_of: [kind: digimon, kind: tamer]` + CannotUnsuspend
  # pattern established by EX9-019 (CannotSuspend) and BT16-025 (CannotUnsuspend
  # on on_dna_digivolve bulk). expiry: end_of_opponents_turn maps to
  # EffectDuration.UntilOpponentTurnEnd in DCGO.
  - when: when_digivolving
    summary: "[When Digivolving] 1 opp Digimon/Tamer can't unsuspend until end of their turn; then by suspending opp, unsuspend own Digimon (suspend→unsuspend arm BLOCKED: G-DSL-IF-NO-TARGET)"
    process:
      # Part A: CannotUnsuspend target
      - select_opponent_permanent:
          bind_as: lock_target
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          prompt: "Choose 1 opponent Digimon or Tamer — can't unsuspend until end of their turn"
      - add_modifier:
          target: lock_target
          modifier: CannotUnsuspend
          value: 1
          expiry: end_of_opponents_turn
      # Part B: "By suspending 1 of their Digimon or Tamers, unsuspend 1 of your Digimon"
      # BLOCKED: G-DSL-IF-NO-TARGET — see header comment.
      # The suspend-cost step below can be expressed, but the conditional unsuspend-reward
      # cannot be made to fire ONLY when the suspend was paid. Authoring both steps
      # sequentially would unsuspend unconditionally (even when the player declines the
      # optional suspend), violating the "by" cost semantics.
      #
      # When G-DSL-IF-NO-TARGET closes, replace this comment with:
      #   - select_opponent_permanent:
      #       bind_as: suspend_cost
      #       optional: true
      #       filter:
      #         all_of:
      #           - is_unsuspended: true
      #           - any_of:
      #               - kind: digimon
      #               - kind: tamer
      #       prompt: "By suspending 1 opponent Digimon or Tamer, unsuspend 1 of your Digimon"
      #   - suspend: { target: suspend_cost }
      #   - if:
      #       condition: { binding_present: suspend_cost }   # ← not yet a DSL predicate
      #       then:
      #         - select_own_permanent:
      #             bind_as: unsuspend_target
      #             filter:
      #               all_of:
      #                 - kind: digimon
      #                 - is_suspended: true
      #             prompt: "Choose 1 of your suspended Digimon to unsuspend"
      #         - unsuspend: { target: unsuspend_target }

  # ─── Clause 1: [All Turns] effect-play/digivolve opp Digimon → conditional free digivolve ─
  - when: [on_enter_field_anyone, on_digivolve]
    optional: true
    active_when: { all_turns: true }
    summary: "[All Turns] When effect plays/digivolves opp Digimon + own Tamer, may free-digivolve self into Fighter Mode"
    condition:
      all_of:
        - event_target_owner: opponent
        - event_target_kind: digimon
        - event_is_effect_initiated: true
        - any_permanent:
            of: you
            zone: [battle_area]
            kind: tamer
    process:
      - select_hand:
          of: you
          bind_as: fighter
          filter:
            all_of:
              - kind: digimon
              - name_contains: "Imperialdramon: Fighter Mode"
          prompt: "Digivolve into Imperialdramon: Fighter Mode"
      - effect_initiated_digivolve:
          target: source
          from_hand: fighter
          cost: 0
          ignore_requirements: true
