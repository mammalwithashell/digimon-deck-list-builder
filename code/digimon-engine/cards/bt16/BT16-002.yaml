# BT16-002 DemiVeemon — Digi-Egg, Lv.2, Blue. Traits: Baby Dragon.
#
# Printed text (official Bandai DB, data/card_bundles/BT16-002.md):
#   Inherited Effect [All Turns] While this Digimon has 2 or more colors,
#   it gets +1000 DP.
#
# DCGO: DCGO/Assets/Scripts/CardEffect/BT16/Blue/BT16_002.cs —
#   ChangeSelfDPStaticEffect(1000, isInheritedEffect: true) gated on
#   `PermanentOfThisCard().TopCard.CardColors.Count >= 2`.
# `self_color_count_gte` evaluates the carrier's top-card colors — the same
# test DCGO uses (BT16-004 / BT12-031 idiom).
card: BT16-002
name: DemiVeemon
kind: digi_egg
level: 2
color: [blue]
cost: 0
traits: [Baby Dragon]
form: In-Training

effects:
  - scope: inherited
    kind: aura
    active_when: { all_turns: true }
    target: {}
    while_condition:
      self_color_count_gte: 2
    dp_modifier: 1000
    summary: "[All Turns] While this Digimon has 2 or more colors, it gets +1000 DP"
