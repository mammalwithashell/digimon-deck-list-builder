# BT16-085 Davis Motomiya & Ken Ichijoji — Tamer, Blue + Green, Cost 4.
#
# Printed card text (data/cards.json effect_text):
#
#   [Start of Your Main Phase] You may play 1 [Veemon] or [Wormmon] from your
#   hand without paying the cost. At the next end of your opponent's turn,
#   return it to the hand.
#
#   [Your Turn] When one of your Digimon digivolves into a blue or green
#   Digimon, by suspending this Tamer, gain 1 memory. If DNA digivolving,
#   trash any 3 digivolution cards under your opponent's Digimon.
#
# Inherited / Security text (cards.json inherited_text):
#   Security Effect [Security] Play this card without paying the cost.
#
# DCGO C# reference:
#   DCGO/Assets/Scripts/CardEffect/BT16/Blue/BT16_085.cs
#
# ─── Clause 0 — [Start of Your Main Phase] free-play Veemon/Wormmon + delayed return
#
# DCGO (BT16_085.cs:39-191): EffectTiming.OnStartMainPhase activate;
#   CanActivateCondition: IsExistOnBattleArea + hand has >= 1 Veemon/Wormmon card
#   that can be legally played. CanSelectCardCondition: card name contains "Veemon"
#   or "Wormmon" AND CanPlayAsNewPermanent(payCost=false). After PlayPermanentCards
#   resolves, the played permanent's handle is stored and an
#   UntilOpponentTurnEndEffects.Add() installs a bounce-to-hand effect on that
#   permanent for EffectTiming.OnEndTurn (when opp is turn player = opponent's EOT).
#   isOptional: true (outer activation can be declined; inner canNoSelect: true).
#
# DSL mapping:
#   - `when: start_of_your_main_phase` — correct timing.
#   - `optional: true` — "You may" makes the outer activation declinable.
#   - Free-play: `select_hand` with name filter + `play_from_hand_free`.
#
# DSL GAP — `play_from_hand_free` does NOT produce a PermanentHandle binding
# [G-PLAY-FROM-HAND-FREE-BIND-AS]:
#
#   The "return it to the hand" step requires referencing the just-played
#   permanent inside a `schedule_delayed` body. `play_from_hand_free` records
#   the played permanent in the effect result log, but `CompiledStep::
#   PlayFromHandFree` still has no `bind_as` field (or equivalent played-
#   permanent binding), and `schedule_delayed` only captures named bindings that
#   were present in the caller's `Bindings` map at schedule time. After
#   `play_from_hand_free` runs, no named binding points to the new permanent.
#   `return_to_hand` requires a `target: <PermanentHandle-binding>`, so the
#   delayed return step cannot be expressed.
#
#   Required fix: add `bind_as: Option<String>` to `PlayFromHandFreeArgs` (DSL)
#   and `CompiledStep::PlayFromHandFree` (compiled), then in `play_digivolve.rs`
#   insert `bindings.insert_permanent(bind_as, handle)` if the play succeeded.
#   Once that field exists, the schedule_delayed body can use `return_to_hand:
#   { target: played }` with `played` resolved from the captured bindings.
#
#   Until resolved, the delayed-return step is OMITTED. The free-play half is
#   implemented; the return obligation is not enforced. Test
#   `bt16_085_start_of_main_played_digimon_returns_at_opponent_eot` is
#   Historical test note only; G-PLAY-FROM-HAND-FREE-BIND-AS is resolved for
#   this card's free-play binding flow.
#
# ─── Clause 1 — [Your Turn] digivolve observer, suspend-tamer cost, +1 memory;
#                DNA sub-condition: trash 3 opp Digimon digi-cards
#
# DCGO (BT16_085.cs; not included in scout block, inferred from card text +
# sister Tamers BT17-081 / AD1-010):
#   - Timing: OnEnterFieldAnyone gate + CanTriggerWhenPermanentDigivolving =
#     `on_digivolve` in DSL, restricted to owner's turn ([Your Turn]).
#   - Event-card color filter ("into a blue or green Digimon"):
#     DCGO would check the new top card's color set for blue or green.
#   - Optional activation cost: "by suspending this Tamer".
#   - Immediate body: gain 1 memory.
#   - DNA sub-condition body: trash any 3 digi-cards under one of the
#     opponent's Digimon.
#
# DSL substrate (now available — all of Clause 1 is implemented):
#
#   `event_card_color_has: [blue, green]` — intersection ("has") predicate over
#   the triggering digivolve card's color list. Expresses the "into a blue or
#   green Digimon" gate faithfully (multi-color cards including blue/green
#   qualify). Formerly G-EVENT-CARD-COLOR-IS.
#
#   `select_opponent_sources` — opponent-side mirror of `select_own_sources`;
#   `target:` restricts the picker to one opponent permanent's digivolution
#   cards. Combined with `trash_selected_sources` it expresses "trash any 3
#   digivolution cards under your opponent's Digimon". Formerly
#   G-SELECT-OPPONENT-SOURCES.
#
#   `dna_origin: true` — evaluated by the engine; gates the DNA sub-clause.
#
# Implementation:
#   - Observer timing + optional suspend cost + gain 1 memory.
#   - Color gate `event_card_color_has: [blue, green]`.
#   - DNA sub-clause: select 1 opponent Digimon, then any 3 of its digivolution
#     cards, and trash them.
#
# ─── Clause 2 — [Security] Play this card without paying the cost ─────────────
#
# Standard play_from_security pattern (cf. BT17-081, BT22-089).
# Mandatory per rules §16.

card: BT16-085
name: Davis Motomiya & Ken Ichijoji
kind: tamer
color: [blue, green]
cost: 4

effects:
  # ─── Clause 0 — [Start of Your Main Phase] free-play Veemon or Wormmon ──────
  #
  # Printed: "[Start of Your Main Phase] You may play 1 [Veemon] or [Wormmon]
  # from your hand without paying the cost. At the next end of your opponent's
  # turn, return it to the hand."
  #
  # `optional: true` — "You may" makes the activation declinable.
  #
  # Condition: this tamer must be on the field. The start-of-main timing
  # already implies it is the controller's turn. Additional CanActivateCondition
  # check: at least one Veemon or Wormmon card in hand (DCGO-consistent gate to
  # avoid presenting an empty selection prompt). Encoded as count_gte over
  # matching hand cards. If no qualifying card exists the trigger silently
  # declines — consistent with sister tamers BT22-089 and AD1-010.
  #
  # IMPLEMENTED (Phase 2 Track H): free-play AND delayed return.
  # `bind_as` on `play_from_hand_free` (G-PLAY-FROM-HAND-FREE-BIND-AS)
  # exposes the just-played permanent handle so a follow-up
  # `schedule_delayed` body can `return_to_hand` the same card at the
  # end of the opponent's next turn.
  - when: start_of_your_main_phase
    optional: true
    summary: "[SoMP][OPT] Free-play 1 Veemon or Wormmon from hand; return at next opp EOT"
    condition:
      count_gte:
        filter:
          of: you
          zone: [hand]
          any_of:
            - name_contains: "Veemon"
            - name_contains: "Wormmon"
        n: 1
    process:
      # Select 1 Veemon or Wormmon from own hand (optional — player may decline).
      - select_hand:
          of: you
          bind_as: pick
          optional: true
          filter:
            any_of:
              - name_contains: "Veemon"
              - name_contains: "Wormmon"
          prompt: "Play 1 [Veemon] or [Wormmon] from your hand without paying the cost"
      # Play the selected card for free and bind its permanent handle so the
      # scheduled return below can target the exact permanent that was just played.
      - play_from_hand_free: { of: you, hand_index: pick, bind_as: played }
      # Return that same permanent to hand at the next end-of-opponent's-turn.
      - schedule_delayed:
          when: end_of_opponents_next_turn
          body:
            - return_to_hand: { target: { permanent: played } }

  # ─── Clause 1 — [Your Turn] digivolve observer; suspend tamer → +1 memory ───
  #
  # Printed: "[Your Turn] When one of your Digimon digivolves into a blue or
  # green Digimon, by suspending this Tamer, gain 1 memory. If DNA digivolving,
  # trash any 3 digivolution cards under your opponent's Digimon."
  #
  # `optional: true` — "by suspending this Tamer" is the activation cost that
  # the player may decline (same idiom as BT17-081 and AD1-010).
  # `active_when: { your_turn: true }` — [Your Turn] scoping.
  #
  # Condition:
  #   - `event_target_owner: you` — the digivolving permanent belongs to the
  #     controller (mirrors DCGO IsOwnerBattleArea gate).
  #   - `event_target_kind: digimon` — must be a Digimon, not a Tamer.
  #   - `event_card_color_has: [blue, green]` — the new top card (the
  #     digivolving result) must have blue or green among its colors. The
  #     predicate uses intersection ("has") semantics, so a multi-color card
  #     including blue or green qualifies, faithful to "into a blue or green
  #     Digimon".
  #
  # Cost: suspend this Tamer (`target: source` resolves to the tamer's own
  # source_permanent via CompiledBindingRef::Source). Tamer must be unsuspended
  # for the cost to be payable; DCGO's `CanActivateCondition` implicitly gates
  # on the tamer being on-field and not already suspended (engine will decline
  # to suspend an already-suspended permanent).
  #
  # DNA sub-clause: "If DNA digivolving, trash any 3 digivolution cards under
  # your opponent's Digimon." Authored with an `if { dna_origin: true }` branch:
  # the player picks one opponent Digimon, then picks any 3 of its digivolution
  # cards via `select_opponent_sources` (target-restricted to that permanent),
  # which are trashed by the `trash_selected_sources` follow-up.
  - when: on_digivolve
    optional: true
    active_when: { your_turn: true }
    summary: "[Your Turn][OPT] On own Digimon digivolve into blue/green, suspend self → +1 memory; if DNA, trash 3 opp digi-cards"
    condition:
      all_of:
        - event_target_owner: you
        - event_target_kind: digimon
        - event_card_color_has: [blue, green]
    process:
      # Cost: suspend this Tamer.
      - suspend: { target: source }
      # Immediate effect: gain 1 memory.
      - gain_memory: 1
      # DNA sub-clause: trash any 3 digivolution cards under one opponent Digimon.
      - if:
          condition: { dna_origin: true }
          then:
            - select_opponent_permanent:
                bind_as: opp_stack
                filter: { kind: digimon }
                prompt: "Choose an opponent Digimon to trash 3 digivolution cards from"
            - select_opponent_sources:
                target: opp_stack
                min: 3
                max: 3
                bind_as: trashed_sources
                prompt: "Trash any 3 digivolution cards under that Digimon"
                then:
                  - trash_selected_sources: { source_refs: trashed_sources }

  # ─── Clause 2 — [Security] Play this card without paying the cost ───────────
  #
  # Printed (inherited_text): "Security Effect [Security] Play this card without
  # paying the cost."
  #
  # Standard tamer security-play pattern (cf. BT17-081, BT22-089, BT13-101,
  # BT18-087). Mandatory — no [Security] effect has an opt-out per rules §16.
  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
