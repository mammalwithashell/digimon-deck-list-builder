card: BT16-082
name: Ukkomon
kind: digimon
level: 3
color: [white]
cost: 3
dp: 2000
traits: [Ancient Fairy]
alt_paths:
  - kind: digivolve
    from: { level_eq: 2 }
    cost: 1

# [Your Turn] [Once Per Turn] When one of your Digimon moves from the breeding
# area to the battle area, reveal the top 3 cards of your deck. Add 1 Digimon
# card or Tamer card among them to the hand. Return the rest to the bottom of
# the deck. Then, you may hatch in your breeding area.
effects:
  - when: on_move
    once_per_turn: true
    active_when: { your_turn: true }
    condition: { event_target_owner: you }
    summary: "Your Turn/OPT: on move, reveal 3, add Digimon/Tamer, may hatch"
    process:
      - reveal_top_deck: { of: you, count: 3 }
      - select_reveal:
          of: you
          bind_as: picked
          optional: false
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          prompt: "Add 1 Digimon or Tamer card to hand"
      - add_to_hand_from_reveal: { of: you, card: picked }
      - place_remainder_on_deck: { of: you, position: bottom }
      - if:
          condition: { can_hatch: you }
          then:
            - select_effect_choice:
                bind_as: do_hatch
                labels: ["Hatch", "Don't hatch"]
                prompt: "You may hatch in your breeding area"
            - if:
                condition: { equals: [do_hatch, 0] }
                then:
                  - hatch: { of: you }
