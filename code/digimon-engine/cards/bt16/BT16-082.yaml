card: BT16-082
name: Ukkomon
kind: digimon
level: 3
color: [white]
cost: 3
dp: 2000
traits: [Ancient Fairy]
# Printed digivolve circle (card image BT16-082.webp — visual tiebreak for
# circles): a RAINBOW (any-colour) "Lv.2: cost 1" circle. The official-DB
# mirror can't represent a rainbow circle (no rows) and cards.json
# approximates it as red-only; the colour-free level gate below is the
# faithful authoring (allowlisted in tests/alt_path_printed_cost_guard.rs).
alt_paths:
  - kind: digivolve
    from: { level_eq: 2 }
    cost: 1

# [Your Turn] [Once Per Turn] When one of your Digimon moves from the breeding
# area to the battle area, reveal the top 3 cards of your deck. Add 1 Digimon
# card or Tamer card among them to the hand. Return the rest to the bottom of
# the deck. Then, you may hatch in your breeding area.
#
# Condition gates (per DCGO BT16_082.cs CanUseCondition / PermanentCondition):
#   1. `event_target_owner: you` — "one of your" (moved permanent is owned by
#      the controller). The OnMove dispatch in effect_queue.rs already restricts
#      scans to the mover's own battle area; this predicate is a defensive gate
#      that also makes the intent explicit.
#   2. `event_target_kind: digimon` — printed text says "your Digimon", not
#      "your permanent". DCGO's PermanentCondition checks
#      IsPermanentExistsOnOwnerBattleAreaDigimon. In practice only Digimon can
#      be in the breeding area (game_actions::move_from_breeding requires
#      level >= 3 which Tamers/Options never have), so this predicate never
#      fires differently, but it is the faithful encoding of the printed text.
effects:
  - when: on_move
    once_per_turn: true
    active_when: { your_turn: true }
    condition:
      all_of:
        - event_target_owner: you
        - event_target_kind: digimon
    summary: "Your Turn/OPT: on move (your Digimon), reveal 3, add Digimon/Tamer, may hatch"
    process:
      - reveal_top_deck: { of: you, count: 3 }
      - select_reveal:
          of: you
          bind_as: picked
          optional: false
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          prompt: "Add 1 Digimon or Tamer card to hand"
      - add_to_hand_from_reveal: { of: you, card: picked }
      - place_remainder_on_deck: { of: you, position: bottom }
      - if:
          condition: { can_hatch: you }
          then:
            - select_effect_choice:
                bind_as: do_hatch
                labels: ["Hatch", "Don't hatch"]
                prompt: "You may hatch in your breeding area"
            - if:
                condition: { equals: [do_hatch, 0] }
                then:
                  - hatch: { of: you }
