card: BT3-090
name: Mastemon
kind: digimon
level: 6
color: [purple]
cost: 12
dp: 12000
form: Mega
attribute: Vaccine
traits: [Angel]

effects:
  - text: "[When Digivolving] Trash 1 card from the top of both players' security stacks. Then, you may play 1 purple or yellow Digimon card with a level of 4 or less from your trash without paying its memory cost."
    when: when_digivolving
    summary: "[When Digivolving] Trash top security of both players; then you may play 1 Lv.4 or lower purple/yellow Digimon from trash for free"
    process:
      - trash_top_security: { of: you, count: 1 }
      - trash_top_security: { of: opponent, count: 1 }
      - select_trash:
          of: you
          optional: true
          bind_as: revived
          filter:
            all_of:
              - kind: digimon
              - any_of:
                  - color_is: purple
                  - color_is: yellow
              - level_lte: 4
              - can_play_from_effect_without_cost: true
          prompt: "You may play 1 purple or yellow level 4 or lower Digimon from your trash without paying its memory cost"
      - play_from_trash_free:
          of: you
          hand_index: revived
