card: BT3-057
name: MegaGargomon
kind: digimon
level: 6
color: [green]
cost: 12
dp: 11000
form: Mega
attribute: Vaccine
traits: [Machine]

effects:
  - text: "[When Digivolving] Suspend 1 of your opponent's Digimon. It doesn't unsuspend during your opponent's next unsuspend phase."
    when: when_digivolving
    summary: "[When Digivolving] Suspend 1 opponent Digimon; it can't unsuspend during opponent's next unsuspend phase"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to suspend"
      - suspend: { target: target }
      - add_modifier:
          target: target
          modifier: CannotUnsuspendInUnsuspendPhase
          value: 1
          expiry: end_of_opponents_next_turn

  - text: "[Your Turn] While your opponent has a suspended Digimon in play, this Digimon gains ＜Security A. +1＞ (This Digimon checks 1 additional security card.)"
    kind: aura
    active_when:
      all_of:
        - your_turn: true
        - any_permanent:
            of: opponent
            zone: [battle_area]
            kind: digimon
            is_suspended: true
    target: {}
    security_attack: 1
    summary: "[Your Turn] While opponent has a suspended Digimon, this Digimon gains <Security A. +1>"
