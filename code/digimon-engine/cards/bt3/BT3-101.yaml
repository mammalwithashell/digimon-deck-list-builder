card: BT3-101
name: Bifrost
kind: option
color: [yellow]
cost: 3

effects:
  - text: "[Main] 1 of your opponent's Digimon gets -3000 DP and ＜Security A. -1＞ (This Digimon checks 1 additional security card.) until the end of your opponent's next turn."
    when: main_from_hand
    summary: "[Main] 1 of your opponent's Digimon gets -3000 DP and <Security A. -1> until the end of your opponent's next turn"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to get -3000 DP and <Security A. -1>"
      - add_dp_modifier:
          target: target
          value: -3000
          expiry: end_of_opponents_next_turn
      - add_modifier:
          target: target
          modifier: SecurityAttackChange
          value: -1
          expiry: end_of_opponents_next_turn

  - text: "[Security] 1 of your opponent's Digimon gets -3000 DP and ＜Security A. -1＞ for the turn. (This Digimon checks 1 additional security card.)"
    when: on_security
    summary: "[Security] 1 of your opponent's Digimon gets -3000 DP and <Security A. -1> for the turn"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to get -3000 DP and <Security A. -1> for the turn"
      - add_dp_modifier:
          target: target
          value: -3000
          expiry: end_of_turn
      - add_modifier:
          target: target
          modifier: SecurityAttackChange
          value: -1
          expiry: end_of_turn
