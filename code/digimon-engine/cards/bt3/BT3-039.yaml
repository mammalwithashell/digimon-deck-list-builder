card: BT3-039
name: Angewomon
kind: digimon
level: 5
color: [yellow]
cost: 7
dp: 6000
form: Ultimate
attribute: Vaccine
traits: [Archangel]

effects:
  - text: "[When Digivolving] 1 of your opponent's Digimon gains ＜Security A. -2＞ (This Digimon checks 2 additional security cards.) until the end of their turn."
    when: when_digivolving
    summary: "[When Digivolving] 1 of your opponent's Digimon gains <Security A. -2> until the end of their turn"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to gain <Security A. -2> until the end of their turn"
      - grant_keyword:
          target: target
          keyword: SecurityAttackMinus
          value: 2
          expiry: end_of_opponents_turn

  - text: "[When Attacking] If you have 3 or fewer security cards, you may play 1 yellow level 3 Digimon card from your hand without paying the cost."
    scope: inherited
    when: when_attacking
    condition: { security_count_lte: 3 }
    summary: "[When Attacking] If you have 3 or fewer security cards, you may play 1 yellow level 3 Digimon card from your hand without paying the cost"
    process:
      - select_hand:
          optional: true
          of: you
          bind_as: play_card
          filter:
            all_of:
              - kind: digimon
              - color_is: yellow
              - level_eq: 3
              - can_play_from_effect_without_cost: true
          prompt: "You may play 1 yellow level 3 Digimon card from your hand without paying the cost"
          then:
            - play_from_hand_free: { of: you, hand_index: play_card }
