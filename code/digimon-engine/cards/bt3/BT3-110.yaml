card: BT3-110
name: Necrophobia
kind: option
color: [purple]
cost: 5

effects:
  - text: "[Main] Play 1 level 5 purple Digimon card from your trash without paying its memory cost. Any [On Play] effects on Digimon played with this effect don't activate."
    when: main_from_hand
    summary: "[Main] Play 1 Lv.5 purple Digimon from your trash for free (its [On Play] effects don't activate)"
    process:
      - select_trash:
          of: you
          optional: false
          bind_as: revived
          filter:
            all_of:
              - kind: digimon
              - level_eq: 5
              - color_is: purple
              - can_play_from_effect_without_cost: true
          prompt: "Play 1 level 5 purple Digimon card from your trash without paying its memory cost"
      - play_from_trash_free:
          of: you
          hand_index: revived
          suppress_on_play: true

  - text: "[Security] Activate this card's [Main] effects."
    when: on_security
    summary: "[Security] Activate this card's [Main] effects"
    process:
      - select_trash:
          of: you
          optional: false
          bind_as: revived
          filter:
            all_of:
              - kind: digimon
              - level_eq: 5
              - color_is: purple
              - can_play_from_effect_without_cost: true
          prompt: "Play 1 level 5 purple Digimon card from your trash without paying its memory cost"
      - play_from_trash_free:
          of: you
          hand_index: revived
          suppress_on_play: true
