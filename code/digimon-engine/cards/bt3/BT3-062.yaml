card: BT3-062
name: Ludomon
kind: digimon
level: 3
color: [black]
cost: 3
dp: 1000
form: Rookie
attribute: Data
traits: [Armor, Legend-Arms]

effects:
  - text: "[On Play] Reveal the top 5 cards of your deck. Add 1 [RagnaLoardmon] Digimon card and 1 Digimon card with the [Legend-Arms] trait among them to your hand. Place the remaining cards on the bottom of your deck in any order."
    when: on_play
    summary: "[On Play] Reveal top 5; add 1 [RagnaLoardmon] and 1 [Legend-Arms] Digimon to hand; rest to deck bottom"
    process:
      - reveal_top_deck: { of: you, count: 5, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          buckets:
            - bind_as: ragna_pick
              min: 1
              max: 1
              filter:
                all_of:
                  - kind: digimon
                  - name_is: RagnaLoardmon
            - bind_as: legend_pick
              min: 1
              max: 1
              filter:
                all_of:
                  - kind: digimon
                  - trait_has: Legend-Arms
          no_duplicate_cards: true
          prompt: "Add 1 [RagnaLoardmon] Digimon card and 1 Digimon card with the [Legend-Arms] trait to your hand"
      - add_to_hand_from_reveal: { of: you, card: ragna_pick }
      - add_to_hand_from_reveal: { of: you, card: legend_pick }
      - place_remainder_on_deck: { of: you, position: bottom }
