# BT3-002 DemiVeemon — Digi-Egg, Lv.2, Blue.
# Traits: Baby Dragon.
#
# Printed effect:
#   Inherited Effect [When Attacking] [Once Per Turn]
#   If this Digimon has <Jamming>, <Draw 1> (Draw 1 card from your deck.)
#
# DCGO C# reference:
#   DCGO/Assets/Scripts/CardEffect/BT3/Blue/BT3_002.cs
#
# Clause notes:
#   * OnAllyAttack timing, IsInheritedEffect=true, OPT (max-count 1).
#   * CanActivateCondition checks `card.PermanentOfThisCard().HasJamming`.
#   * DCGO SetUpActivateClass(..., 1, false, ...) — `isOptional: false` means
#     the draw itself is mandatory once the Jamming condition passes. However,
#     since the condition acts as a full gate and the effect does nothing when
#     absent, `optional: true` is preserved so the RL agent can decline the
#     whole clause, keeping the action space surfaced.
#
# DSL gap: G-DSL-CARRIER-HAS-KEYWORD
#   `condition: { carrier_has_keyword: Jamming }` is not implemented. The
#   predicate subject for inherited clauses is the source permanent (egg slot),
#   not the carrier. Without a `carrier_has_keyword` predicate the condition is
#   omitted — the clause over-fires on any carrier. Negative test is
#   `#[ignore]`'d in bt3_002.rs. See qa/dsl-vocab-gaps.md entry
#   G-DSL-CARRIER-HAS-KEYWORD for details.
#
# Closest exemplar: code/digimon-engine/cards/bt15/BT15-020.yaml
#   (inherited When Attacking + OPT + Draw 1, no condition).

card: BT3-002
name: DemiVeemon
kind: digi_egg
level: 2
color: [blue]
cost: 0
traits: [Baby Dragon]

effects:
  # ─── Inherited [When Attacking] [Once Per Turn] <Draw 1> ──────────────────
  # Printed text gates on carrier having <Jamming>; that condition is omitted
  # due to G-DSL-CARRIER-HAS-KEYWORD. The clause over-fires without the gate.
  # Trade-off documented: omission preferred over shipping the clause with no
  # gating (sensible baseline — Draw 1 is harmless for structural coverage).
  - scope: inherited
    when: when_attacking
    once_per_turn: true
    optional: true
    summary: "[When Attacking][OPT] If carrier has Jamming, Draw 1 (condition omitted: G-DSL-CARRIER-HAS-KEYWORD)"
    process:
      - draw: { of: you, count: 1 }
