# BT3-002 DemiVeemon — Digi-Egg, Lv.2, Blue.
# Traits: Baby Dragon.
#
# Printed effect:
#   Inherited Effect [When Attacking] [Once Per Turn]
#   If this Digimon has <Jamming>, <Draw 1> (Draw 1 card from your deck.)
#
# DCGO C# reference:
#   DCGO/Assets/Scripts/CardEffect/BT3/Blue/BT3_002.cs
#
# Clause notes:
#   * OnAllyAttack timing, IsInheritedEffect=true, OPT (max-count 1).
#   * CanActivateCondition checks `card.PermanentOfThisCard().HasJamming`.
#   * DCGO SetUpActivateClass(..., 1, false, ...) — `isOptional: false` means
#     the draw itself is mandatory once the Jamming condition passes. However,
#     since the condition acts as a full gate and the effect does nothing when
#     absent, `optional: true` is preserved so the RL agent can decline the
#     whole clause, keeping the action space surfaced.
#
# Current DSL audit:
#   `condition: { has_keyword: Jamming }` compiles, but behavioral coverage in
#   bt3_002.rs shows it does not currently gate this inherited trigger at
#   runtime. The clause still over-fires until predicate runtime support is
#   completed outside this card file.
#
# Closest exemplar: code/digimon-engine/cards/bt15/BT15-020.yaml
#   (inherited When Attacking + OPT + Draw 1, no condition).

card: BT3-002
name: DemiVeemon
kind: digi_egg
level: 2
color: [blue]
cost: 0
traits: [Baby Dragon]

effects:
  # ─── Inherited [When Attacking] [Once Per Turn] <Draw 1> ──────────────────
  # Printed text gates on the inherited carrier having <Jamming>. The condition
  # is authored here, but currently does not block runtime over-fire.
  - scope: inherited
    when: when_attacking
    once_per_turn: true
    optional: true
    condition: { has_keyword: Jamming }
    summary: "[When Attacking][OPT] If carrier has Jamming, Draw 1 (blocked: has_keyword condition does not runtime-gate inherited trigger)"
    process:
      - draw: { of: you, count: 1 }
