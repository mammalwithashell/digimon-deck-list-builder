# BT3-002 DemiVeemon — Digi-Egg, Lv.2, Blue.
# Traits: Baby Dragon.
#
# Printed effect:
#   Inherited Effect [When Attacking] [Once Per Turn]
#   If this Digimon has <Jamming>, <Draw 1> (Draw 1 card from your deck.)
#
# DCGO C# reference:
#   DCGO/Assets/Scripts/CardEffect/BT3/Blue/BT3_002.cs
#
# Clause notes:
#   * OnAllyAttack timing, IsInheritedEffect=true, OPT (max-count 1).
#   * CanActivateCondition checks `card.PermanentOfThisCard().HasJamming`.
#   * DCGO SetUpActivateClass(..., 1, false, ...) — `isOptional: false` means
#     the draw itself is mandatory once the Jamming condition passes. However,
#     since the condition acts as a full gate and the effect does nothing when
#     absent, `optional: true` is preserved so the RL agent can decline the
#     whole clause, keeping the action space surfaced.
#
# DSL audit (verified):
#   `condition: { has_keyword: Jamming }` correctly gates this inherited trigger
#   at runtime. `has_keyword` resolves against the CARRIER permanent for
#   inherited clauses (`enqueue_from_permanent` sets `source_permanent` to the
#   carrier handle), so the draw fires only when the carrier has <Jamming> and is
#   suppressed otherwise. Positive + negative behavioral coverage in bt3_002.rs.
#
# Closest exemplar: code/digimon-engine/cards/bt15/BT15-020.yaml
#   (inherited When Attacking + OPT + Draw 1, no condition).

card: BT3-002
name: DemiVeemon
kind: digi_egg
level: 2
color: [blue]
cost: 0
traits: [Baby Dragon]

effects:
  # ─── Inherited [When Attacking] [Once Per Turn] <Draw 1> ──────────────────
  # Printed text gates on the inherited carrier having <Jamming>. `has_keyword`
  # resolves against the carrier permanent for inherited clauses, so this
  # condition correctly suppresses the draw when the carrier lacks <Jamming>.
  - scope: inherited
    when: when_attacking
    once_per_turn: true
    optional: true
    condition: { has_keyword: Jamming }
    summary: "[When Attacking][OPT] If carrier has Jamming, Draw 1"
    process:
      - draw: { of: you, count: 1 }
