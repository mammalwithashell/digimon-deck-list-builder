card: BT3-099
name: "We Have to Stop Fighting!"
kind: option
color: [blue]
cost: 2

effects:
  - text: "[Main] Neither player's Digimon can be deleted in battle for the turn."
    when: main_from_hand
    summary: "[Main] Neither player's Digimon can be deleted in battle for the turn"
    process:
      - add_modifier:
          continuous: true
          target: { of: any, kind: digimon }
          modifier: CannotBeDestroyedByBattle
          value: 1
          expiry: end_of_turn

  - text: "[Security] Add this card to your hand."
    when: on_security
    summary: "[Security] Add this card to your hand"
    process:
      - add_this_option_to_hand: {}
