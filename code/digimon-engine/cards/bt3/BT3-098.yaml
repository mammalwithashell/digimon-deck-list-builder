card: BT3-098
name: Plasma Stake
kind: option
color: [red]
cost: 4

effects:
  - text: "[Main] Delete 1 of your opponent's Digimon with 13000 DP or more."
    when: main_from_hand
    summary: "[Main] Delete 1 of your opponent's Digimon with 13000 DP or more"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter:
            all_of:
              - kind: digimon
              - dp_gte: 13000
          prompt: "Choose 1 of your opponent's Digimon with 13000 DP or more to delete"
      - delete_permanent: { target: target }

  - text: "[Security] Activate this card's [Main] effects."
    when: on_security
    summary: "[Security] Activate this card's [Main] effects"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter:
            all_of:
              - kind: digimon
              - dp_gte: 13000
          prompt: "Choose 1 of your opponent's Digimon with 13000 DP or more to delete"
      - delete_permanent: { target: target }
