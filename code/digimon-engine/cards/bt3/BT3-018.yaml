card: BT3-018
name: BlitzGreymon
kind: digimon
level: 6
color: [red]
cost: 12
dp: 12000
form: Mega
attribute: Virus
traits: [Cyborg]

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: black }
    cost: 4

effects:
  - text: "＜Piercing＞ (When this Digimon attacks and deletes an opponent's Digimon and survives the battle, it performs any security checks it normally would.)"
    kind: grant_keyword
    keyword: Piercing
    summary: "<Piercing>"

  - text: "[When Digivolving] ＜De-Digivolve 2＞ 1 of your opponent's Digimon. (Trash up to 2 cards from the top. You can't trash past level 3 cards.)"
    when: when_digivolving
    summary: "[When Digivolving] <De-Digivolve 2> 1 of your opponent's Digimon"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to <De-Digivolve 2>"
      - de_digivolve:
          target: target
          amount: 2
          stop_at_level: 3
