# ST24-03 Gaogamon — Digimon, Lv.4, Blue, DP 5000, Cost 4.
# Traits: Beast, DATA SQUAD.
# Printed digivolve box: [Digivolve] Lv.3 w/[DATA SQUAD] trait: Cost 2
#   (image / DCGO AddSelfDigivolutionRequirementStaticEffect — OMITTED from the
#    cards.json effect text).
#
# Printed card text (data/cards.json — verbatim):
#   [On Play] [When Digivolving] You may return 1 of your opponent's level 3
#     Digimon to the hand. Then, you may place the top card of your deck face
#     down under any of your [DATA SQUAD] trait Tamers.
#   Inherited: [When Attacking] [Once Per Turn] If your hand has 7 or fewer
#     cards, ＜Draw 1＞.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/ST24/Blue/ST24_03.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
#
# Alt-digivolve (timing None): AddSelfDigivolutionRequirementStaticEffect(
#   level 3, TopCard EqualsTraits("DATA SQUAD"), cost 2). → alt_paths.
# Shared OP/WD (optional: false):
#   1. Optional (canNoSelect:true, Mode.Bounce) bounce 1 opponent Lv.3 Digimon
#      to hand. → select_opponent_permanent { kind: digimon, level_eq: 3,
#      optional } + return_to_hand.
#   2. THEN, INDEPENDENT of the bounce: if deck non-empty AND a DATA SQUAD Tamer
#      exists, optional (canNoSelect:true) pick a DATA SQUAD Tamer → place
#      deck-top face-down under it. (DCGO gates the place on LibraryCards.Count
#      > 1, a DCGO off-by-one quirk; faithful card text is "top card of your
#      deck" whenever the deck is non-empty — we gate deck non-empty.)
# Inherited (OnAllyAttack, maxPerTurn 1, isInheritedEffect): IsOwnerTurn +
#   HandCards.Count <= 7 → DrawClass 1. → scope: inherited, when_attacking,
#   once_per_turn, active_when your_turn, condition hand count_lte 7, draw 1.

card: ST24-03
name: "Gaogamon"
kind: digimon
level: 4
color: [blue]
cost: 4
dp: 5000
traits: [Beast, DATA SQUAD]

# Alt-digivolve: Lv.3 with the [DATA SQUAD] trait / cost 2.
alt_paths:
  - kind: digivolve
    from: { level_eq: 3, trait_has: "DATA SQUAD" }
    cost: 2

effects:
  # ─── [On Play][When Digivolving] (A) optional bounce 1 opp Lv.3 Digimon, then
  #     (B) optional place deck-top FD under a [DATA SQUAD] Tamer (independent) ──
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] You may return 1 opponent Lv.3 Digimon to hand; then you may place the deck-top face down under a [DATA SQUAD] Tamer"
    process:
      # "You may return 1 of your opponent's level 3 Digimon to the hand." — the
      # optional pick carries the "may". continue_on_decline keeps the clause
      # running on a PASS so the INDEPENDENT place leg below still fires (DCGO's
      # canNoSelect:true bounce resolves with an empty list and the coroutine
      # continues to the place step).
      - select_opponent_permanent:
          bind_as: bounce_target
          optional: true
          continue_on_decline: true
          filter:
            all_of:
              - kind: digimon
              - level_eq: 3
          prompt: "You may return 1 of your opponent's level 3 Digimon to the hand"
      - if:
          condition: { binding_present: bounce_target }
          then:
            - return_to_hand: { target: bounce_target }
      # "Then, you may place the top card of your deck face down under any of
      # your [DATA SQUAD] trait Tamers." — runs INDEPENDENTLY of the bounce
      # (even if the bounce was declined). Gated on deck non-empty AND a DATA
      # SQUAD Tamer existing.
      - if:
          condition:
            all_of:
              - count_gte:
                  filter: { of: you, zone: [deck] }
                  n: 1
              - any_permanent:
                  of: you
                  zone: [battle_area]
                  kind: tamer
                  trait_has: "DATA SQUAD"
          then:
            - select_own_permanent:
                bind_as: ds_tamer
                optional: true
                filter:
                  all_of:
                    - kind: tamer
                    - trait_has: "DATA SQUAD"
                prompt: "You may place the top card of your deck face down under a [DATA SQUAD] Tamer"
            - if:
                condition: { binding_present: ds_tamer }
                then:
                  - place_as_bottom_source:
                      source: { deck_top: you }
                      target: ds_tamer
                      face_down: true

  # ─── Inherited [When Attacking][OPT] if hand ≤7, <Draw 1> ───────────────────
  - scope: inherited
    when: when_attacking
    once_per_turn: true
    active_when: { your_turn: true }
    condition:
      count_lte:
        filter: { of: you, zone: [hand] }
        n: 7
    summary: "Inherited [When Attacking][OPT] If your hand has 7 or fewer cards, <Draw 1>"
    process:
      - draw: { of: you, count: 1 }
