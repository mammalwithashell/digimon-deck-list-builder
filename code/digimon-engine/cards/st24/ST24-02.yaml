# ST24-02 Gaomon — Digimon, Lv.3, Blue, DP 2000, Cost 3.
# Traits: Beast, DATA SQUAD.
# Printed digivolve box: [Digivolve] Lv.2 w/[DATA SQUAD] trait: Cost 0
#   (image / DCGO AddSelfDigivolutionRequirementStaticEffect — OMITTED from the
#    cards.json effect text).
#
# Printed card text (data/cards.json — verbatim):
#   [On Play] By placing 1 card from your hand face down under any of your Tamers
#     with the [DATA SQUAD] trait, ＜Draw 2＞ (Draw 2 cards from your deck.)
#   Inherited: [When Attacking] [Once Per Turn] If your hand has 7 or fewer
#     cards, ＜Draw 1＞ (Draw 1 card from your deck.)
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/ST24/Blue/ST24_02.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
#
# Alt-digivolve (timing None): AddSelfDigivolutionRequirementStaticEffect(
#   level 2, TopCard EqualsTraits("DATA SQUAD"), cost 0). → alt_paths digivolve
#   from level 2 + DATA SQUAD trait, cost 0.
# On Play (OnEnterFieldAnyone): CanActivate gated on hand non-empty AND a
#   [DATA SQUAD] Tamer existing.
#   - SelectHandEffect maxCount 1, canNoSelect:true, canTargetCondition _=>true
#     (ANY hand card). → optional select_hand { } (no filter).
#   - If a card was selected: SelectPermanentEffect over IsOwnTamerCondition
#     (own Tamer, TopCard EqualsTraits "DATA SQUAD"), maxCount 1, canNoSelect:true.
#   - If a Tamer was selected: AddDigivolutionCardsBottom(isFacedown true) →
#     DrawClass(card.Owner, 2). → place_selected_card_under_tamer + draw 2.
#   Both selects optional; the "By placing … , <Draw 2>" cost-then-payoff shape
#   means the Draw fires ONLY when the placement happens. binding_present guards
#   reproduce that.
# Inherited (OnAllyAttack, maxPerTurn 1, isInheritedEffect): CanUse = IsOwnerTurn
#   && CanTriggerOnAttack; CanActivate = HandCards.Count <= 7. → DrawClass 1.
#   → scope: inherited, when_attacking, once_per_turn, active_when your_turn,
#     condition hand count_lte 7, process draw 1.
#
# Sister card: ST23-10 Pristimon (On Play body, trait-swapped).

card: ST24-02
name: "Gaomon"
kind: digimon
level: 3
color: [blue]
cost: 3
dp: 2000
traits: [Beast, DATA SQUAD]

# Alt-digivolve: Lv.2 with the [DATA SQUAD] trait / cost 0.
alt_paths:
  - kind: digivolve
    from: { level_eq: 2, trait_has: "DATA SQUAD" }
    cost: 0

effects:
  # ─── [On Play] By placing 1 hand card face-down under a [DATA SQUAD] Tamer,
  #     <Draw 2> ───────────────────────────────────────────────────────────────
  - when: on_play
    condition:
      all_of:
        - count_gte:
            filter: { of: you, zone: [hand] }
            n: 1
        - any_permanent:
            of: you
            zone: [battle_area]
            kind: tamer
            trait_has: "DATA SQUAD"
    summary: "[On Play] By placing 1 card from your hand face down under a [DATA SQUAD] Tamer, <Draw 2>"
    process:
      - select_hand:
          of: you
          bind_as: stash
          optional: true
          filter: {}
          prompt: "Place 1 card from your hand face down under a [DATA SQUAD] Tamer"
      - if:
          condition: { binding_present: stash }
          then:
            - select_own_permanent:
                bind_as: tamer
                optional: true
                filter:
                  all_of:
                    - kind: tamer
                    - trait_has: "DATA SQUAD"
                prompt: "Choose a [DATA SQUAD] Tamer to place the card under"
            - if:
                condition: { binding_present: tamer }
                then:
                  - place_selected_card_under_tamer:
                      card: stash
                      tamer: tamer
                      face_down: true
                  - draw: { of: you, count: 2 }

  # ─── Inherited [When Attacking][OPT] if hand ≤7, <Draw 1> ───────────────────
  - scope: inherited
    when: when_attacking
    once_per_turn: true
    active_when: { your_turn: true }
    condition:
      count_lte:
        filter: { of: you, zone: [hand] }
        n: 7
    summary: "Inherited [When Attacking][OPT] If your hand has 7 or fewer cards, <Draw 1>"
    process:
      - draw: { of: you, count: 1 }
