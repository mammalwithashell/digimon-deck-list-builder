# ST24-06 RizeGreymon — Digimon, Lv.5, Yellow/Red, DP 8000, Cost 7.
# Traits: Cyborg, DATA SQUAD. Attribute: Vaccine.
# Printed digivolve boxes:
#   [Digivolve] from [GeoGreymon] (any level): Cost 3   (DCGO AddSelf… EqualsCardName)
#   [Digivolve] Lv.4 w/[DATA SQUAD] trait: Cost 3        (DCGO AddSelf… level 4 + trait)
#   (Standard Lv.4 yellow / cost 4 box loaded from cards.json evo_costs.)
#
# Printed card text (data/cards.json — verbatim, confirmed vs DCGO ST24_06.cs):
#   [On Play] [When Digivolving] [When Attacking] [Once Per Turn] 1 of your
#     opponent's Digimon gets -5000 DP for the turn. Then, by trashing 2 bottom
#     face-down cards from under any of your Tamers, you may play or use 1
#     [DATA SQUAD] trait card with a play or use cost of 5 or less from your hand
#     without paying the cost.
#   Inherited: [All Turns] [Once Per Turn] When this Digimon with [ShineGreymon]
#     in its name or the [DATA SQUAD] trait would leave the battle area, by
#     trashing the bottom face-down card from under any of your Tamers, it
#     doesn't leave.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/ST24/Yellow/ST24_06.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
# Alt-digivolve #1 (timing None): EqualsCardName("GeoGreymon"), cost 3, no level.
#   → alt_paths digivolve from name_contains "GeoGreymon", cost 3.
# Alt-digivolve #2 (timing None): level 4 + EqualsTraits("DATA SQUAD"), cost 3.
#   → alt_paths digivolve from level_eq 4 + trait_has "DATA SQUAD", cost 3.
# Shared OP/WD/WA (ActivateClassesForSharedEffects, optional:false,
#   maxCountPerTurn 1, single hash → once_per_turn across all 3 timings):
#   1. maxCount = min(1, opp-Digimon count), canNoSelect:false → MANDATORY pick
#      when one exists: -5000 DP UntilEachTurnEnd (end_of_turn). →
#      select_opponent_permanent {kind:digimon} + add_dp_modifier -5000.
#   2. THEN, gated ONLY on total ≥2 face-down sources under Tamers (DCGO: (a
#      Tamer ≥2) OR (>1 Tamers ≥1) ≡ total ≥2): "by trashing 2 bottom face-down
#      cards … you may play or use 1 [DATA SQUAD] card with play/use cost ≤5 for
#      free." DCGO SharedActivateCoroutine pays the trash FIRST: a canNoSelect
#      Tamer pick (selecting none = decline) → trashed = true → `if (trashed)` a
#      canNoSelect SelectHandEffect. CR 4.3 15-7-1/15-7-2: the optional
#      processing condition is chosen and executed before what follows it; 15-7-5:
#      it may be paid even when the follow-up can't be executed (no eligible hand
#      card); 15-7-3 + official Q&A: it can't be paid in part (hence the ≥2 gate).
#      → select_effect_choice ["Trash 2 face-down cards", "Don't"] (ST24-10 idiom;
#      the "Don't" label lets the replay's yes/no fold recognise the decline) →
#      trash_bottom_face_down_sources_under_tamers {count:2} (multi-Tamer
#      distributable: 2-from-1 or 1-from-2) → optional select_hand (the "may";
#      PASS keeps the trash paid) with CanSelectCardCondition = DATA SQUAD ∧
#      GetCostItself≤5 ∧ ((IsOption ∧ !CanNotPlayThisOption) ∨ (HasPlayCost ∧
#      CanPlayAsNewPermanent)) = `can_play_or_use_from_effect: true` (no Digi-Egg —
#      ST24-01, BT25-002, BT26-002, BT26-005, EX13-003 — and no unplayable /
#      unusable card is offered) → play_or_use_from_hand cost_delta free (PlayOptionCards /
#      PlayPermanentCards payCost:false; the unified verb routes by kind).
#      Fixed 2026-11-12 (DCGO PvP replay audit): the old YAML picked the hand card
#      first, paid the trash only on a pick, and refused the trash without a
#      matching hand card — so the Tamers' trash triggers (e.g. ST24-13) could
#      never fire from a bare payment.
# Inherited (WhenRemoveField, isInheritedEffect, maxPerTurn 1, optional): a
#   carrier with [ShineGreymon] in name OR the [DATA SQUAD] trait would leave,
#   gated on a Tamer carrying a face-down source → trash 1 bottom FD under a Tamer
#   → willBeRemoveField=false + Hide* (cancel the leave). → scope:inherited,
#   kind:replacement, when_would_leave_battle_area, optional, once_per_turn,
#   active_when replacement_subject_is_mine + (name ShineGreymon | trait DATA
#   SQUAD); process trash_bottom_face_down_source_under_tamer + cancel_replacement.
#   (ST24-10 inherited idiom, name-swapped Rosemon→ShineGreymon.)

card: ST24-06
name: "RizeGreymon"
kind: digimon
level: 5
color: [yellow, red]
cost: 7
dp: 8000
traits: [Cyborg, DATA SQUAD]
attribute: Vaccine

# Alt-digivolve boxes (DCGO AddSelfDigivolutionRequirementStaticEffect ×2).
alt_paths:
  # [Digivolve] from [GeoGreymon] (any level): cost 3.
  - kind: digivolve
    from: { name_contains: "GeoGreymon" }
    cost: 3
  # [Digivolve] Lv.4 with the [DATA SQUAD] trait: cost 3.
  - kind: digivolve
    from: { level_eq: 4, trait_has: "DATA SQUAD" }
    cost: 3

effects:
  # ─── [OP][WD][WA][OPT] -5000 DP to 1 opp Digimon; then trash 2 FD under
  #     Tamers → may play/use a [DATA SQUAD] hand card (cost ≤5) for free ───────
  - when: [on_play, when_digivolving, when_attacking]
    once_per_turn: true
    summary: "[OP][WD][WA][OPT] 1 opp Digimon -5000 DP for the turn; then trash 2 FD under Tamers to play/use a [DATA SQUAD] hand card (play/use cost ≤5) for free"
    process:
      # "1 of your opponent's Digimon gets -5000 DP for the turn." — DCGO
      # canNoSelect:false → mandatory when a target exists; short-circuits when
      # none do.
      - select_opponent_permanent:
          bind_as: dp_target
          filter: { kind: digimon }
          prompt: "1 of your opponent's Digimon gets -5000 DP for the turn"
      - add_dp_modifier:
          target: dp_target
          value: -5000
          expiry: end_of_turn
      # "Then, by trashing 2 bottom face-down cards from under any of your
      # Tamers, you may play or use 1 [DATA SQUAD] trait card with a play or use
      # cost of 5 or less from your hand without paying the cost." The trash is
      # the optional processing condition: chosen and paid FIRST (CR 4.3 15-7-1),
      # payable even with no eligible hand card (15-7-5), never in part (15-7-3).
      # Gated only on ≥2 face-down sources (DCGO ST24_06.cs; ST24-10 idiom).
      - if:
          condition: { face_down_sources_under_tamers_gte: 2 }
          then:
            - select_effect_choice:
                bind_as: pay_trash
                labels: ["Trash 2 face-down cards", "Don't"]
                prompt: "Trash 2 bottom face-down cards from under your Tamers to play or use a [DATA SQUAD] card for free?"
            - if:
                condition: { equals: [pay_trash, 0] }
                then:
                  - trash_bottom_face_down_sources_under_tamers: { of: you, count: 2 }
                  # "you may play or use …" — optional select_hand carries the
                  # decline; PASS leaves the trash paid (DCGO canNoSelect:true).
                  # Only cards that can actually be played or used are offered
                  # (DCGO CanSelectCardCondition: `(IsOption &&
                  # !CanNotPlayThisOption) || (HasPlayCost &&
                  # CanPlayAsNewPermanent(card, false, activateClass))`): never a
                  # Digi-Egg (no play cost, CR 4.3 7-1-1 — e.g. Koromon ST24-01),
                  # never a Digimon/Tamer an effect forbids playing or with no
                  # free slot, never an Option while Options can't be used.
                  - select_hand:
                      of: you
                      bind_as: ds_pick
                      optional: true
                      filter:
                        all_of:
                          - trait_has: "DATA SQUAD"
                          - play_or_use_cost_lte: 5
                          - can_play_or_use_from_effect: true
                      prompt: "Play or use 1 [DATA SQUAD] card (play/use cost ≤5) from your hand without paying the cost"
                  - if:
                      condition: { binding_present: ds_pick }
                      then:
                        # "play or use … without paying the cost." Unified verb
                        # routes by kind (Digimon/Tamer play, Option use, Dual
                        # face-choice).
                        - play_or_use_from_hand:
                            of: you
                            hand_index: ds_pick
                            cost_delta: free

  # ─── Inherited [All Turns][OPT] ShineGreymon-name / DATA SQUAD carrier would
  #     leave → trash 1 bottom FD under a Tamer → it doesn't leave ──────────────
  - scope: inherited
    kind: replacement
    trigger: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    # 'When this Digimon with ... would leave': carrier only (DCGO ST24_06.cs
    # CanTriggerWhenRemoveField(hashtable, card)); `replacement_subject_is_mine`
    # made it cover other permanents. Audit 2026-11-11.
    active_when:
      # Self-only: DCGO CanTriggerWhenRemoveField(hashtable, card) is
      # `permanent.cardSources.Contains(card)`. `replacement_subject_is_mine` would
      # make this a cross-permanent trigger (any of my permanents leaving).
      all_of:
        - is_source: true
        - replacement_subject_is_mine: true
        - any_of:
            - source_name_contains: "ShineGreymon"
            - source_permanent_trait_has: "DATA SQUAD"
    summary: "Inherited [All Turns][OPT] When this [ShineGreymon]-name / [DATA SQUAD] Digimon would leave, by trashing a bottom face-down card under a Tamer, it doesn't leave"
    process:
      - trash_bottom_face_down_source_under_tamer: { of: you }
      - cancel_replacement: {}
