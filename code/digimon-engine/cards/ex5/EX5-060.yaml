card: EX5-060
name: "Dragomon"
kind: digimon
level: 5
color: [purple]
cost: 7
dp: 7000
traits: [Aquabeast]
form: Ultimate
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: purple }
    cost: 3

effects:
  # â”€â”€â”€ Clause 1 â€” [On Play][When Digivolving] â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Your opponent plays 1 level 4 or lower Digimon card from their trash suspended without paying the cost. [On Play] effects on Digimon played by this effect don't activate"
    process:
      - as_selecting_player:
          of: opponent
          body:
            - select_trash:
                of: opponent
                bind_as: opp_pick
                filter:
                  all_of:
                    - kind: digimon
                    - level_lte: 4
                    - can_play_from_effect_without_cost: true
                prompt: "Play 1 level 4 or lower Digimon card from your trash suspended without paying the cost"
            - play_from_trash_free:
                of: opponent
                hand_index: opp_pick
                suspended: true
                suppress_on_play: true

  # â”€â”€â”€ Clause 2 â€” [All Turns][Once Per Turn] effect-play recursion â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - when: on_any_digimon_played
    once_per_turn: true
    optional: true
    trigger_if:
      all_of:
        - event_target_owner: opponent
        - event_target_kind: digimon
        - event_is_effect_initiated: true
    summary: "[All Turns][Once Per Turn] When an effect plays an opponent's Digimon, you may play 1 purple Digimon card with a level less than or equal to it from your trash without paying the cost"
    process:
      - select_trash:
          of: you
          bind_as: recur_pick
          filter:
            all_of:
              - kind: digimon
              - color_is: purple
              - level_lte:
                  formula:
                    event_target_level: {}
          prompt: "You may play 1 purple Digimon card with a level less than or equal to it from your trash without paying the cost"
      - play_from_trash_free:
          of: you
          hand_index: recur_pick

