# EX5-062 Anubismon — Digimon, Lv.6, Purple, DP 12000, Cost 12.
# Trait: Shaman. Form: Mega. Attribute: Vaccine.
# Printed digivolve box: Purple Lv.5 / cost 4.
#
# Printed card text (official Bandai DB — data/card_bundles/EX5-062.md; card
# image agrees):
#   [When Digivolving] [Main] [Once Per Turn] You may trash up to 3 cards in
#     your hand. Then, play 1 purple Digimon card from your trash with the play
#     cost reduced by 3. For each card trashed by this effect, further reduce
#     it by 1.
#   [Your Turn] When an effect plays one of your Digimon, delete 1 of your
#     opponent's level 5 or lower Digimon. If this effect didn't delete,
#     <Draw 1>.
#   Official Q&A: trashing 2 cards from the hand reduces the play cost by 5.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/EX5/Purple/EX5_062.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
# [When Digivolving] + [Main]: two ActivateClasses sharing SetHashString
#   "PlayDigimon_EX5_062", maxCountPerTurn 1, optional false → ONE clause
#   `when: [when_digivolving, main_on_field]` + once_per_turn (one shared
#   counter, G-OPT-MULTI-TIMING-SHARED-LOCKOUT).
#   [Main] CanUseCondition: on the battle area AND (hand >= 1 OR a playable
#   purple Digimon card in the trash) → a `timing_conditions` gate on the
#   `main_on_field` timing only ([When Digivolving] has no such gate).
#   Body: SelectHandEffect maxCount min(3, hand), canNoSelect true,
#   Mode.Discard (one discard batch) → discardedCount. Authored as up to three
#   chained optional `select_hand` + `trash_from_hand_by_index` picks inside
#   the same effect body (so the discards still form ONE OnDiscardHand batch);
#   declining any pick stops the trashing — every subset DCGO's multi-pick can
#   reach is reachable. Then a MANDATORY (canNoSelect false) trash pick of 1
#   purple Digimon card → PlayPermanentCards(payCost true, Root.Trash) with
#   the play cost reduced by 3 + discardedCount (ChangeCostClass, clamped at
#   0). The number trashed is read back from which picks were bound
#   (reduce 3 / 4 / 5 / 6).
# [Your Turn] (OnEnterFieldAnyone; CanUse: on the battle area, a played
#   permanent is one of the owner's battle-area Digimon, IsByEffect,
#   IsOwnerTurn; not optional, no per-turn cap): if an opponent Digimon with
#   HasLevel && Level <= 5 exists, a mandatory pick → delete; failureProcess
#   (nothing deleted) → Draw 1.
#   → `on_any_digimon_played` + `active_when: your_turn` + `trigger_if`
#   event_target_owner you / kind digimon / effect-initiated (EX5-060
#   precedent); select_opponent_permanent → delete_permanent; then
#   `effect_deleted_any_opponent_digimon: false` → draw (EX13-010 idiom).

card: EX5-062
name: Anubismon
kind: digimon
level: 6
color: [purple]
cost: 12
dp: 12000
traits: [Shaman]
form: Mega
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: purple }
    cost: 4

effects:
  # ─── [When Digivolving][Main][OPT] may trash up to 3 hand cards; then play
  #     1 purple Digimon from the trash, cost -3 and -1 per card trashed ─────
  - when: [when_digivolving, main_on_field]
    once_per_turn: true
    timing_conditions:
      - when: main_on_field
        condition:
          any_of:
            - count_gte:
                filter: { of: you, zone: [hand] }
                n: 1
            - count_gte:
                filter:
                  of: you
                  zone: [trash]
                  kind: digimon
                  color_is: purple
                n: 1
    summary: "[When Digivolving][Main][Once Per Turn] You may trash up to 3 cards in your hand. Then, play 1 purple Digimon card from your trash with the play cost reduced by 3, and by 1 more for each card trashed by this effect"
    process:
      - select_hand:
          of: you
          bind_as: trashed_1
          optional: true
          filter: {}
          prompt: "You may trash up to 3 cards in your hand (1st card)"
      - if:
          condition: { binding_present: trashed_1 }
          then:
            - trash_from_hand_by_index: { of: you, hand_index: trashed_1 }
            - select_hand:
                of: you
                bind_as: trashed_2
                optional: true
                filter: {}
                prompt: "You may trash up to 3 cards in your hand (2nd card)"
            - if:
                condition: { binding_present: trashed_2 }
                then:
                  - trash_from_hand_by_index: { of: you, hand_index: trashed_2 }
                  - select_hand:
                      of: you
                      bind_as: trashed_3
                      optional: true
                      filter: {}
                      prompt: "You may trash up to 3 cards in your hand (3rd card)"
                  - trash_from_hand_by_index: { of: you, hand_index: trashed_3 }
      - select_trash:
          of: you
          bind_as: revived
          filter:
            all_of:
              - kind: digimon
              - color_is: purple
          prompt: "Play 1 purple Digimon card from your trash with the play cost reduced by 3 (and 1 more per card trashed)"
      - if:
          condition: { binding_present: trashed_3 }
          then:
            - play_from_trash: { of: you, hand_index: revived, cost_delta: { reduce: 6 } }
          else:
            - if:
                condition: { binding_present: trashed_2 }
                then:
                  - play_from_trash: { of: you, hand_index: revived, cost_delta: { reduce: 5 } }
                else:
                  - if:
                      condition: { binding_present: trashed_1 }
                      then:
                        - play_from_trash: { of: you, hand_index: revived, cost_delta: { reduce: 4 } }
                      else:
                        - play_from_trash: { of: you, hand_index: revived, cost_delta: { reduce: 3 } }

  # ─── [Your Turn] when an effect plays one of your Digimon, delete 1 of your
  #     opponent's level 5 or lower Digimon; if nothing was deleted, <Draw 1> ─
  - when: on_any_digimon_played
    active_when:
      your_turn: true
    trigger_if:
      all_of:
        - event_target_owner: you
        - event_target_kind: digimon
        - event_is_effect_initiated: true
    summary: "[Your Turn] When an effect plays one of your Digimon, delete 1 of your opponent's level 5 or lower Digimon. If this effect didn't delete, <Draw 1>"
    process:
      - select_opponent_permanent:
          bind_as: victim
          filter:
            all_of:
              - kind: digimon
              - level_lte: 5
          prompt: "Delete 1 of your opponent's level 5 or lower Digimon"
      - delete_permanent: { target: victim }
      - if:
          condition: { effect_deleted_any_opponent_digimon: false }
          then:
            - draw: { of: you, count: 1 }
