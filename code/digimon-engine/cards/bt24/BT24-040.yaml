card: BT24-040
name: Venusmon
kind: digimon
level: 6
color: [yellow, blue]
cost: 12
dp: 12000
traits: [Shaman, Olympos XII, Iliad, TS]
alt_paths:
  - kind: digivolve
    from:
      all_of:
        - level_eq: 5
        - trait_has: TS
    cost: 3

effects:
  - kind: cost_reduction
    reduction_timing: before_pay_cost
    when_playing_this: true
    condition: { security_count_lte: 3 }
    amount: 5
    summary: "When played at <=3 security, reduce play cost by 5"

  - when: [on_play, when_digivolving]
    summary: "Trash all sources of 1 opponent Digimon, then lock 2 opponent Digimon/Tamers"
    process:
      - select_opponent_permanent:
          bind_as: source_stack
          filter: { kind: digimon }
          prompt: "Trash all digivolution cards of 1 opponent Digimon"
      - trash_all_sources: { target: source_stack }
      - select_opponent_permanent:
          bind_as: lock_1
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          prompt: "Choose an opponent Digimon or Tamer to lock"
      - add_modifier:
          target: lock_1
          modifier: CannotSuspend
          value: 1
          expiry: end_of_opponents_turn
      - add_modifier:
          target: lock_1
          modifier: CannotActivateWhenDigivolvingEffects
          value: 1
          expiry: end_of_opponents_turn
      - select_opponent_permanent:
          bind_as: lock_2
          filter:
            all_of:
              - any_of:
                  - kind: digimon
                  - kind: tamer
              - not_in_binding: lock_1
          prompt: "Choose another opponent Digimon or Tamer to lock"
      - add_modifier:
          target: lock_2
          modifier: CannotSuspend
          value: 1
          expiry: end_of_opponents_turn
      - add_modifier:
          target: lock_2
          modifier: CannotActivateWhenDigivolvingEffects
          value: 1
          expiry: end_of_opponents_turn

  - kind: replacement
    timing: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    active_when:
      all_of:
        - replacement_subject_is_mine: true
        - kind: digimon
        - trait_has: TS
        - none_of:
            - replacement_cause: own_effect
    summary: "[All Turns][OPT] Place another sourceless Digimon as bottom security so your TS Digimon does not leave"
    # Destination (OWNER RULING 2026-10-20, binding): the printed text names no
    # player's security stack, so the chosen Digimon goes to the bottom of ITS
    # OWNER's security (§3-1-3-8) — your own sourceless Digimon recovers you;
    # an opponent's goes to the bottom of the OPPONENT's security. Either
    # player's Digimon may be chosen: the printed "1 other Digimon" is
    # unqualified and DCGO `CanPlaceToSecurityCondition` has no owner filter;
    # Q5781 defines "other" (other than the Digimon that would leave, also when
    # several leave at once). DCGO places into the owner's stack too
    # (`PlacePermanentInSecurityAndProcessAccordingToResult` ->
    # `IPutSecurityPermanent` -> `CardObjectController.AddSecurityCard` ->
    # `cardSource.Owner.SecurityCards`), so the ruling, §3-1-3-8 and DCGO
    # agree: `to_owner: true`. The leave is cancelled only if the placement
    # was processed (§15-7-1): a token or Digi-Egg cost body meets the
    # condition without entering security (§15-1-9: "will be met even if the
    # card isn't actually placed in that area due to Digi-Egg card or token
    # rules"; DCGO `IPutSecurityPermanent` sets IsPlacedSecurity before its
    # token branch). The chosen Digimon's own would-leave shield (e.g. its
    # controller's <Guard>) may stop it, and then the [TS] Digimon leaves
    # (§15-7-2).
    # `owner_can_add_security: true`: a Digimon whose owner can't add security
    # by effects can't be placed there, so it can't be chosen (§15-7-4, Ver.
    # 4.3); with no other payable body the replacement isn't offered.
    # dcgo_quirk: DCGO still offers and selects it (`CanPlaceToSecurityCondition`
    # has no owner check) and `IPutSecurityPermanent` then fails on
    # `TopCard.Owner.CanAddSecurity`; the PDF governs.
    process:
      - select_any_permanent:
          bind_as: cost_body
          filter:
            all_of:
              - kind: digimon
              - materials_count_lte: 0
              - owner_can_add_security: true
              - not_in_binding: replacement_subject
          prompt: "Place another sourceless Digimon as bottom security"
      - place_on_security:
          source: { permanent: cost_body }
          to_owner: true
          position: bottom
          disposition: cancel
