# BT24-069 Vilemon — Digimon, Lv.4, Purple, DP 4000, Cost 4.
# Traits: Evil. Form: Champion. Attribute: Virus.
# Standard digivolve (cards.json evo_costs / official DB): Lv.3 Purple / Cost 2.
#
# Printed card text (data/card_bundles/BT24-069.md — verbatim):
#   [When Moving] [When Digivolving] Trash 1 card in your hand. Then, your
#     opponent may trash 1 card in their hand. If your opponent didn't trash
#     with this effect, trash the top 2 cards of your opponent's deck.
#   [All Turns] While your opponent has 10 or more cards in their trash, this
#     Digimon gains <Blocker> and +2000 DP.
#   Inherited: [When Attacking] [Once Per Turn] Trash the top card of both
#     players' decks.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT24/Purple/BT24_069.cs
#
# Modeling notes:
# - Shared WM / WD body (`SharedActivateCoroutine`), mandatory clause:
#     1. (hand >= 1) the controller's MANDATORY `SelectHandEffect` discard of
#        any 1 card (canNoSelect false);
#     2. (opponent hand >= 1) the OPPONENT's `SelectHandEffect` discard,
#        `canNoSelect: true` - the opponent is the chooser and may decline;
#     3. if the opponent did not trash (declined, or had no hand), trash the
#        top 2 cards of the opponent's deck.
#   When Moving is gated on the moving permanent being THIS Digimon
#   (`CanTriggerOnMove(PermanentCondition: permanent == this)`).
# - [All Turns] static: Blocker AND +2000 DP, both while the opponent's trash
#   holds >= 10 cards (DCGO `Condition()` shared by the two static effects).
#   Authored as two self auras gated by the same `active_when`.
# - Inherited [When Attacking][OPT]: unconditional mill 1 of both decks.

card: BT24-069
name: Vilemon
kind: digimon
level: 4
color: [purple]
cost: 4
dp: 4000
traits: [Evil]
form: Champion
attribute: Virus

effects:
  - when: [on_move, when_digivolving]
    timing_conditions:
      - when: on_move
        condition: { event_permanent_is_source: true }
    optional: false
    summary: "[When Moving][When Digivolving] Trash 1 card in your hand. Then your opponent may trash 1 card in their hand; if they didn't, trash the top 2 cards of their deck"
    process:
      - select_hand:
          of: you
          bind_as: own_trash
          filter: {}
          prompt: "Trash 1 card from your hand"
      - trash_from_hand_by_index: { of: you, hand_index: own_trash }
      # The OPPONENT chooses (DCGO `selectPlayer: card.Owner.Enemy`,
      # `canNoSelect: true`); the pick, its trash and the mill fallback share
      # the `as_selecting_player` body so the binding flows to the `if`.
      - as_selecting_player:
          of: opponent
          body:
            - select_hand:
                of: opponent
                bind_as: opp_trash
                optional: true
                filter: {}
                prompt: "You may trash 1 card from your hand (otherwise the top 2 cards of your deck are trashed)"
            - if:
                condition: { binding_present: opp_trash }
                then:
                  - trash_from_hand_by_index: { of: opponent, hand_index: opp_trash }
                else:
                  - trash_from_top: { of: opponent, count: 2 }

  - kind: aura
    target: {}
    active_when:
      count_gte:
        filter: { of: opponent, zone: [trash] }
        n: 10
    grant_keyword: { keyword: Blocker }
    summary: "[All Turns] While your opponent has 10 or more cards in their trash, this Digimon gains <Blocker>"

  - kind: aura
    target: {}
    active_when:
      count_gte:
        filter: { of: opponent, zone: [trash] }
        n: 10
    dp_modifier: 2000
    summary: "[All Turns] While your opponent has 10 or more cards in their trash, this Digimon gets +2000 DP"

  - scope: inherited
    when: when_attacking
    once_per_turn: true
    optional: false
    summary: "[Inherited][When Attacking][OPT] Trash the top card of both players' decks"
    process:
      - trash_from_top: { of: you, count: 1 }
      - trash_from_top: { of: opponent, count: 1 }
