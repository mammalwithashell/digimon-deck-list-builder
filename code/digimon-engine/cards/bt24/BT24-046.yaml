card: BT24-046
name: Garurumon
kind: digimon
level: 4
color: [green, blue]
cost: 4
dp: 4000
traits: [Beast, Iliad, TS]

alt_paths:
  # Printed split circle: Green|Blue Lv.3 / cost 3 — one entry per colour.
  - kind: digivolve
    from: { level_eq: 3, color_is: green }
    cost: 3
  - kind: digivolve
    from: { level_eq: 3, color_is: blue }
    cost: 3
  - kind: digivolve
    from:
      any_color: true
      all_of:
        - level_eq: 3
        - any_of:
            - name_contains: "Gabumon"
            - trait_has: TS
    cost: 2

effects:
  - text: "＜Jamming＞"
    kind: grant_keyword
    keyword: Jamming

  - text: "[On Play] [When Digivolving] Suspend 1 of your opponent's Digimon."
    when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Suspend 1 of your opponent's Digimon"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "Suspend 1 of your opponent's Digimon"
      - suspend: { target: target }

  - text: "[When Attacking] [Once Per Turn] Suspend 1 of your opponent's Digimon."
    scope: inherited
    when: when_attacking
    once_per_turn: true
    summary: "[Inherited][When Attacking][OPT] Suspend 1 of your opponent's Digimon"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: inherited_target
          filter: { kind: digimon }
          prompt: "Suspend 1 of your opponent's Digimon"
      - suspend: { target: inherited_target }
