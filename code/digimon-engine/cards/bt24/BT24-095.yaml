card: BT24-095
name: "Sonic Shot"
kind: option
color: [green]
cost: 3
traits: [TS]
use_requirement:
  any_field_permanent:
    of: you
    any_of:
      - all_of:
          - kind: digimon
          - trait_has: TS
      - all_of:
          - kind: tamer
          - trait_has: TS

effects:
  - kind: flood_gate
    active_when:
      any_field_permanent:
        of: you
        any_of:
          - all_of:
              - kind: digimon
              - trait_has: TS
          - all_of:
              - kind: tamer
              - trait_has: TS
    modifier: IgnoreColorRequirement
    target: { card_number_is: "BT24-095" }
    summary: "While you have a TS Digimon or Tamer, ignore color requirements for this card"

  - when: main_from_hand
    summary: "[Main] Suspend 1 opponent Digimon or Tamer; it cannot unsuspend next unsuspend phase; then optionally link this card"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          prompt: "Choose 1 opponent Digimon or Tamer to suspend"
      - suspend: { target: target }
      - add_modifier:
          target: target
          modifier: CannotUnsuspend
          value: 1
          expiry: end_of_opponents_turn
      - link_to_own_digimon:
          optional: true
          free: true
          filter:
            all_of:
              - kind: digimon
              - trait_has: TS

  - scope: inherited
    when: on_security
    summary: "[Security] Activate [Main] effects: suspend 1 opponent Digimon or Tamer; it cannot unsuspend; then optionally link this card"
    process:
      - select_opponent_permanent:
          bind_as: sec_target
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          prompt: "Choose 1 opponent Digimon or Tamer to suspend"
      - suspend: { target: sec_target }
      - add_modifier:
          target: sec_target
          modifier: CannotUnsuspend
          value: 1
          expiry: end_of_opponents_turn
      - link_to_own_digimon:
          optional: true
          free: true
          filter:
            all_of:
              - kind: digimon
              - trait_has: TS

  - kind: link_requirement
    scope: inherited
    cost: 3
    filter:
      kind: digimon
      trait_has: TS
    summary: "[Link] [TS] trait: Cost 3"

  # ─── Link Effect: [When Attacking][Once Per Turn] bounce a suspended Digimon ─
  # Card face + bundle "### Link Effect"; DCGO BT24_095.cs "Link ESS"
  # (OnAllyAttack, SetIsLinkedEffect, maxCountPerTurn 1, not optional,
  # SelectPermanentEffect Mode.Bounce canNoSelect false over opponent
  # Digimon with IsSuspended). Same idiom as BT24-097's linked ESS.
  - scope: linked
    when: when_attacking
    once_per_turn: true
    summary: "[Link][When Attacking][Once Per Turn] Return 1 of your opponent's suspended Digimon to the hand"
    process:
      - select_opponent_permanent:
          bind_as: wa_bounce
          filter:
            all_of:
              - kind: digimon
              - is_suspended: true
          prompt: "Return 1 of your opponent's suspended Digimon to the hand"
      - return_to_hand: { target: wa_bounce }

  # ─── Link DP +2000 (card-face link box) ─────────────────────────────────
  - scope: linked
    kind: aura
    target: {}
    dp_modifier: 2000
    summary: "[Link] +2000 DP to the linked Digimon (host)"
