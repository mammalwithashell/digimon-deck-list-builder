card: BT24-034
name: Aegiomon
kind: digimon
level: 4
form: Champion
color: [yellow]
cost: 5
dp: 5000
traits: [Shaman, Iliad, TS]
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 2
  - kind: digivolve
    from:
      all_of:
        - level_eq: 3
        - trait_has: TS
    cost: 2

effects:
  - kind: grant_keyword
    keyword: Barrier

  - scope: inherited
    kind: grant_keyword
    keyword: Barrier

  - when: [on_move, on_play, when_digivolving]
    # [When Moving] is self-scoped ("when THIS Digimon moves from breeding");
    # the engine's on_move dispatch is a board-wide observer scan, so gate the
    # on_move timing on the moved permanent being this Digimon (EX11-038 idiom).
    timing_conditions:
      - when: on_move
        condition: { event_permanent_is_source: true }
    # "By adding your top security card to the hand, you may play 1 [TS] Tamer":
    # DCGO BT24_034.cs asks the OptionalSkill (isOptional true) whenever this
    # is on the battle area and security > 0 (`SharedCanActivateCondition`, no
    # hand check) -- §15-7-5: the "By X" cost may be paid even if the result
    # can't happen. The cost is paid FIRST; only then is the hand checked, so a
    # [TS] Tamer that arrives from the security card is playable. The Tamer
    # pick is declinable (SelectHandEffect canNoSelect: true).
    #
    # KNOWN GAP (not a candidate-filter issue): DCGO BT24_034.cs:72 offers the
    # Tamer pick only if the security card actually reached the hand
    # (`HandCards.Contains(topCard)`) -- CR 4.3 15-7-1 / 15-7-2: if the "By X"
    # part isn't executed, the part after it can't be. The steps below always
    # go on to the pick, which differs only when a replacement effect stops the
    # security card from reaching the hand. Needs a "by-cost succeeded" gate.
    optional: true
    condition: { security_count_gte: 1 }
    summary: "[When Moving][On Play][When Digivolving] By adding your top security card to the hand, you may play 1 TS Tamer from hand free, excluding names of your Tamers"
    process:
      - add_top_security_to_hand: { of: you }
      - select_hand:
          of: you
          bind_as: pick
          optional: true
          filter:
            all_of:
              - kind: tamer
              - trait_has: TS
              - name_not_shared_by_field_tamer: { of: you }
              # DCGO BT24_034.cs:47-63 ValidTamer CanPlayAsNewPermanent: a free
              # slot, no "can't play" lock (CR 4.3 1-3-11-1).
              - can_play_from_effect_without_cost: true
          prompt: "You may play 1 TS Tamer from your hand without paying the cost"
      - play_from_hand_free: { of: you, hand_index: pick }
