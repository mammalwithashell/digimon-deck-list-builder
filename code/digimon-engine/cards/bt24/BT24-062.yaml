effects:
  # ─── Inherited: target lock on the controller's turn ─────────────────────
  #
  # "[Your Turn] This Digimon's attack target can't change." Installs
  # `ModifierType::CannotSwitchAttackTarget` on the carrier each declarative
  # tick when its controller is the turn player. Track D consult sites read it
  # in `try_enter_block` (early-return, suppressing the Block window),
  # `try_enter_raid_retarget` (suppressing Raid retarget), and
  # `apply_attack_target_substitution` (no-op for replacement / redirect_attack
  # retargets).
  #
  # `target: { is_source_permanent: true }` installs on the carrier itself (no
  # board scan + aux self-identity predicate). `scope: both` emits the gate from
  # BOTH the active-top (face_up) and digivolution-source (inherited) positions,
  # so the carrier resolves to this card's own permanent when it is the top, or
  # to the host when it is a source — matching the former raw_rust
  # `bt24_062_attack_target_lock` exactly, without the escape hatch.
  - kind: flood_gate
    scope: both
    active_when: { your_turn: true }
    target: { is_source_permanent: true }
    modifier: CannotSwitchAttackTarget

  # ─── Omitted clauses ──────────────────────────────────────────────────────
  #
  # `<Blocker>` and `<Armor Purge>` parse from printed text via the keyword
  # parser (see `card_data::parse_printed_keywords`); no DSL clause needed.
  #
  # [End of Attack][End of Opponent's Turn][Once Per Turn] play card from
  # stack — not implemented in this fixture. The behavioral fixture targets
  # the inherited target-lock clause specifically, since that exercises the
  # Track C taxonomy + Track D combat consult sites landed on 2026-05-06 /
  # 2026-05-07. Full implementation requires an additional select-from-
  # digivolution-stack flow which is orthogonal to the modifier surface.
