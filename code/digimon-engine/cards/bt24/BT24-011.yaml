card: BT24-011
name: Cyclonemon
kind: digimon
level: 4
color: [red]
cost: 5
dp: 5000
traits: [Dragonkin, Iliad, TS]

# Digivolution: Lv.3 / 2 memory (standard path)
# Alt-digivolve: any Lv.3 with TS trait / 2 memory (DCGO: AddSelfDigivolutionRequirementStaticEffect)
alt_paths:
  # Printed circle: Red Lv.3 / cost 2. The colour is part of the
  # requirement; a gate without `color_is` digivolves from any colour.
  - kind: digivolve
    from: { level_eq: 3, color_is: red }
    cost: 2
  - kind: digivolve
    from: { any_color: true, level_eq: 3, trait_has: TS }
    cost: 2
    ignore_requirements: true

effects:
  # Clause 1 — own Rush (face-up)
  # DCGO: RushSelfStaticEffect(isInheritedEffect: false)
  - text: "＜Rush＞"
    kind: grant_keyword
    keyword: Rush

  # Clause 2 — own Raid (face-up)
  # DCGO: RaidSelfEffect(isInheritedEffect: false)
  - text: "＜Raid＞"
    kind: grant_keyword
    keyword: Raid

  # Clause 3 — inherited Raid
  # DCGO: RaidSelfEffect(isInheritedEffect: true)
  - text: "＜Raid＞ (When this Digimon attacks, you may change the attack target to 1 of your opponent's unsuspended Digimon with the highest DP.)"
    scope: inherited
    kind: grant_keyword
    keyword: Raid
