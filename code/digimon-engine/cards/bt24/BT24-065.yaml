# BT24-065 Diaboromon (X Antibody) — Digimon, Lv.6, Black, DP 13000, Cost 13.
# Traits: [Unidentified, X Antibody]. Unknown. Form: Mega.
#
# Printed (official Bandai DB bundle data/card_bundles/BT24-065.md):
#   Digivolve: Black Lv.5 / cost 5.
#   "[Digivolve] [Diaboromon]: Cost 2" (alt route, any level).
#   <Overclock ([Unidentified] Trait)> <Blocker>
#   [When Digivolving] To 1 of your opponent's Digimon, <De-Digivolve 1> for each
#     of your Digimon. Then, delete all of your opponent's Digimon with the
#     highest play cost.
#   [All Turns] [Once Per Turn] When any of your Digimon with [Diaboromon] in
#     their names would leave the battle area, you may play 1 [Diaboromon] from
#     your hand or this Digimon's digivolution cards without paying the cost.
#
# DCGO: DCGO/Assets/Scripts/CardEffect/BT24/Black/BT24_065.cs
#   - Alt route: `AddSelfDigivolutionRequirementStaticEffect(TopCard.
#     EqualsCardName("Diaboromon"), cost 2)` -> exact `name_is` on the host.
#   - Overclock with trait "Unidentified"; Blocker.
#   - WD (mandatory): count = own Digimon, taken BEFORE the pick. ONE mandatory
#     pick of an opponent Digimon (`canNoSelect: false`), then <De-Digivolve 1>
#     `count` times on it (SEPARATE instances, CR 4.3 16-12-7), then
#     `DestroyPermanentsClass` over the opponent's Digimon for which
#     `IsMaxCost(.., IsDigimonOnly: true)` holds, evaluated AFTER the
#     de-digivolves (the highest play cost is read from the new top cards).
#     The delete sits inside the pick callback, so it only runs when the
#     opponent had a Digimon to pick (with none, the delete set is empty too).
#   - [All Turns] OPT: `WhenRemoveField` (a "would leave" window, NOT a
#     prevention: the leaving Digimon still leaves) for any own Digimon whose
#     top card has [Diaboromon] in its name; `isOptional: true`. Body: choose
#     hand / own digivolution cards when both hold an exactly-named [Diaboromon]
#     that `CanPlayAsNewPermanent`, then `PlayPermanentCards(payCost: false)`.
#
# Regression (hunt2 cluster alt-digivolve-cost-cards): shipped only as a .json
# stub, so a Lv.5 [Diaboromon] could not digivolve into it for cost 2 and an
# off-colour [Diaboromon] base (e.g. the Lv.6 [Diaboromon] EX6-043) had no legal
# digivolve at all (illegal_action).
#
# Substrate widened for this card: `aggregate: { selector: highest_play_cost }`
# (mirror of `lowest_play_cost`), G-DSL-HIGHEST-PLAY-COST-AGGREGATE.

card: BT24-065
name: Diaboromon (X Antibody)
kind: digimon
level: 6
color: [black]
cost: 13
dp: 13000
traits: [Unidentified, X Antibody]
form: Mega
attribute: Unknown

alt_paths:
  # Printed circle: Black Lv.5 / cost 5.
  - kind: digivolve
    from: { level_eq: 5, color_is: black }
    cost: 5
  # "[Digivolve] [Diaboromon]: Cost 2".
  - kind: digivolve
    from: { name_is: "Diaboromon" }
    cost: 2

effects:
  # <Overclock ([Unidentified] Trait)>: at the end of your turn, by deleting 1 of
  # your Tokens or other [Unidentified] trait Digimon, this Digimon attacks a
  # player without suspending.
  - kind: grant_keyword
    keyword: Overclock
    overclock_cost_filter:
      any_of:
        - kind: token
        - all_of:
            - kind: digimon
            - trait_has: Unidentified

  - kind: grant_keyword
    keyword: Blocker
    summary: "<Blocker>"

  - when: when_digivolving
    summary: "[When Digivolving] To 1 of your opponent's Digimon, <De-Digivolve 1> for each of your Digimon. Then, delete all of your opponent's Digimon with the highest play cost"
    process:
      - select_opponent_permanent:
          bind_as: dd_target
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to <De-Digivolve 1> for each of your Digimon"
      - de_digivolve:
          target: dd_target
          amount:
            base: 0
            per:
              card_count_in_zone:
                zone: battle_area
                of: you
                filter: { kind: digimon }
            delta: 1
      - delete_all_permanents:
          over:
            of: opponent
            zone: [battle_area]
            kind: digimon
            play_cost_gte:
              aggregate:
                selector: highest_play_cost
                scope: opponent

  # [All Turns][OPT] When any of your [Diaboromon]-name Digimon would leave the
  # battle area, you may play 1 [Diaboromon] from hand or this Digimon's
  # digivolution cards without paying the cost. Not a prevention: no
  # `cancel_replacement`, the Digimon still leaves afterwards.
  - kind: replacement
    trigger: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    active_when:
      all_of:
        - replacement_subject_is_mine: true
        - kind: digimon
        - name_contains: "Diaboromon"
    summary: "[All Turns][Once Per Turn] When any of your Digimon with [Diaboromon] in their names would leave the battle area, you may play 1 [Diaboromon] from your hand or this Digimon's digivolution cards without paying the cost"
    process:
      - select_union_zone:
          of: you
          zones: [hand, material]
          material_of: source
          bind_as: diaboromon
          optional: true
          cost: false
          filter:
            all_of:
              - kind: digimon
              - name_is: "Diaboromon"
              - can_play_from_effect_without_cost: true
          prompt: "You may play 1 [Diaboromon] from your hand or this Digimon's digivolution cards without paying the cost"
      - play_union_bound_free: { binding: diaboromon }
