card: BT24-100
name: "In-Between Theater"
kind: option
color: [white]
cost: 3
traits: [TS]
use_requirement:
  any_permanent:
    of: you
    zone: [battle_area]
    any_of:
      - all_of:
          - kind: digimon
          - trait_has: TS
      - all_of:
          - kind: tamer
          - trait_has: TS

effects:
  - kind: flood_gate
    active_when:
      any_of:
        - any_permanent:
            of: you
            kind: digimon
            trait_has: TS
        - any_permanent:
            of: you
            kind: tamer
            trait_has: TS
    modifier: IgnoreColorRequirement
    target: { card_number_is: "BT24-100" }
    summary: "While you have a TS Digimon or Tamer, ignore color requirements for this card"

  - when: main_from_hand
    summary: "[Main] Reveal top 3; add 1 TS card; bottom the rest; place this card in battle area"
    process:
      - reveal_top_deck:
          of: you
          count: 3
      - select_reveal:
          of: you
          bind_as: picked
          optional: true
          filter:
            trait_has: TS
          prompt: "Add 1 card with the [TS] trait to your hand"
      - add_to_hand_from_reveal: { of: you, card: picked }
      - place_remainder_on_deck: { of: you, position: bottom }
      - place_self_as_delay_option: {}

  - kind: delay
    # TRIGGER CORRECTION (2026-08-24): was `end_of_your_next_turn`, which
    # lowers to a turn-keyed AUTO-FIRE at the end of the controller's next
    # turn. The printed timing is `[Main]`, and DCGO registers this clause at
    # `EffectTiming.OnDeclaration` -- its [Main] activated-declaration timing --
    # so it is a player-activated §16-16 Delay, not a schedule. `trigger: delayed`
    # lowers to `DelayTrigger::MainPhaseActivated`, which surfaces a [Main]
    # mask bit; NOT activating is the §16-16-2 decline, and the option stays on
    # the field (§16-16-1: "while a card with this effect is in the battle area").
    # The old wiring both fired it at the wrong time and gave the player no say.
    trigger: delayed
    summary: "[Main]<Delay> Gain 2 memory"
    process:
      - gain_memory: 2

  - scope: inherited
    when: on_security
    summary: "[Security] Place this card in the battle area"
    process:
      - place_self_as_delay_option: {}
