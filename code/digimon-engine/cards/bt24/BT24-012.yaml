card: BT24-012
name: Dimetromon
kind: digimon
level: 4
color: [red]
cost: 4
dp: 4000
traits: [Reptile, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 3 }
    cost: 2

effects:
  # Clause (a) — <Blocker>
  # DCGO: BlockerSelfStaticEffect(isInheritedEffect=false, card, null)
  - kind: grant_keyword
    keyword: Blocker

  # Clause (b) — [All Turns] When any of your OTHER Digimon with [Reptile] or
  # [Dragonkin] trait would leave the battle area by your opponent's effects,
  # by returning THIS Digimon to the hand, they don't leave.
  #
  # DCGO: ActivateClass on EffectTiming.WhenRemoveField, isOptional=true,
  #   OtherDigimon() = on owner's battle area, != PermanentOfThisCard(),
  #   has Reptile or Dragonkin trait;
  #   CanUseCondition gated on IsOpponentEffect(cardEffect, card);
  #   ActivateCoroutine = BouncePeremanentAndProcessAccordingToResult of
  #   { PermanentOfThisCard() }, then SuccessProcess sets willBeRemoveField=false.
  #
  # Pure-DSL `kind: replacement` (G-EVENT-TARGET-OWNER RESOLVED 2026-05-21):
  #   - `replacement_subject_is_mine: true` — the leaving permanent must belong
  #     to Dimetromon's controller ("your other Digimon").
  #   - `replacement_cause: opponent_effect` — "by your opponent's effects".
  #   - `other: true` — excludes Dimetromon itself ("your OTHER Digimon"); since
  #     the leaving subject is matched against the source permanent, `other`
  #     drops a self-leave even though Dimetromon also has the Reptile trait.
  #   - `kind: digimon` + Reptile/Dragonkin trait — the protected subject set.
  # Cost: `return_to_hand: { target: source }` bounces THIS Digimon to hand;
  # `cancel_replacement` then keeps the leaving ally on the field. Optional —
  # the player may accept (pay the bounce cost) or decline (ally leaves).
  - kind: replacement
    trigger: when_would_leave_battle_area
    optional: true
    summary: "[All Turns] When your other Reptile/Dragonkin Digimon would leave by opponent's effects, return this Digimon to hand so they don't leave"
    active_when:
      all_of:
        - replacement_subject_is_mine: true
        - replacement_cause: opponent_effect
        - kind: digimon
        - other: true
        - any_of:
            - trait_has: Reptile
            - trait_has: Dragonkin
    process:
      - return_to_hand: { target: source }
      - cancel_replacement: {}

  # Clause (c) — [Inherited] [Your Turn] [Once Per Turn]
  # When your opponent's security stack is removed from, gain 1 memory.
  #
  # DCGO: ActivateClass with SetHashString("GainMemory_BT24-012"),
  #        CanTriggerWhenLoseSecurity checks player == card.Owner.Enemy
  #        (opponent's security), IsOwnerTurn, SetIsInheritedEffect(true),
  #        SetUpActivateClass(max=1 OPT).
  - scope: inherited
    when: on_opponent_security_removed
    once_per_turn: true
    active_when: { your_turn: true }
    summary: "[Inherited][Your Turn][OPT] Opponent's security removed → gain 1 memory"
    process:
      - gain_memory: 1
