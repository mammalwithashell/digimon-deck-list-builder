card: BT24-088
name: Asuna Shiroki
kind: tamer
color: [purple]
cost: 3
traits: [TS]

effects:
  - when: start_of_your_turn
    optional: true
    condition: { memory_lte: 4 }
    summary: "[Start of Your Turn] If memory <=4, return this Tamer to deck bottom to play Asuna or a level 4 or lower TS/Three Musketeers-text Digimon from trash free"
    process:
      - activation_cost: { return_self_to_deck_bottom: true }
      - select_trash:
          of: you
          bind_as: pick
          optional: true
          filter:
            any_of:
              - name_is: "Asuna Shiroki"
              - all_of:
                  - kind: digimon
                  - level_lte: 4
                  - any_of:
                      - trait_has: TS
                      - effect_text_contains: "Three Musketeers"
          prompt: "Play 1 [Asuna Shiroki] or level 4 or lower TS/Three Musketeers-text Digimon from your trash without paying the cost"
      - play_from_trash_free: { of: you, hand_index: pick }

  - when: on_play
    optional: true
    condition:
      count_gte:
        filter:
          of: you
          zone: [hand]
          any_of:
            - trait_has: TS
            - effect_text_contains: "Three Musketeers"
        n: 1
    summary: "[On Play] By trashing 1 TS or Three Musketeers-text card from hand, Draw 2"
    process:
      - select_hand:
          of: you
          bind_as: discard
          optional: true
          filter:
            any_of:
              - trait_has: TS
              - effect_text_contains: "Three Musketeers"
          prompt: "Trash 1 TS or Three Musketeers-text card from your hand"
      - trash_from_hand_by_index: { of: you, hand_index: discard }
      - draw: { of: you, count: 2 }

  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
