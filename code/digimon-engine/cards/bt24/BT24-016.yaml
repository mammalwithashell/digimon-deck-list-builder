card: BT24-016
name: Lamiamon
kind: digimon
level: 5
color: [red]
cost: 7
dp: 7000
traits: [Dragonkin, LIBERATOR]

# Standard digivolution from any Lv4 (cost 3 from battlearea).
# Alt activated-digivolve path: [Hand][Main] requires Owen Dreadnought in
# play. AltPathSpec now carries a `condition:` field (G-ALT-PATH-CONDITION
# RESOLVED 2026-05-15 — see qa/resolved-gaps.md) consumed by the
# Digivolve route in dna_digivolve.rs. The Owen gate is NOT wired here:
# authoring the predicate for this card is card-local follow-up.
# Currently the gate is partially enforced by the `from:` filter
# (Elizamon must be on field) and the `extra_cost` select_trash
# (Dimetromon must be in trash); Owen presence is not checked.
alt_paths:
  - kind: digivolve
    from: { level_eq: 4 }
    cost: 3

  - kind: activated_digivolve
    from:
      of: you
      zone: [battle_area]
      name_contains: "Elizamon"
    cost: 3
    ignore_requirements: true
    extra_cost:
      - select_trash:
          of: you
          bind_as: source
          filter: { name_contains: "Dimetromon" }
          prompt: "Select a Dimetromon from trash to place as bottom source"
      - place_as_bottom_source:
          source: source
          target: { binding: activated_digivolve_target }

effects:
  # Clause 3: [When Digivolving][When Attacking][OPT]
  # Opponent places 1 card from hand as their bottom security card,
  # then you trash their top security card.
  # Card text says opponent places (not optional for them), then you trash.
  - when: [when_digivolving, when_attacking]
    once_per_turn: true
    process:
      - as_selecting_player:
          of: opponent
          body:
            - select_hand:
                of: opponent
                bind_as: pick
                filter: {}
                prompt: "Place a card from your hand as your bottom security card"
      - place_on_security:
          of: opponent
          source: { binding: pick, zone: hand }
          position: bottom
          face_up: false
      - trash_top_security: { of: opponent }

  # Clause 4: Inherited [All Turns][OPT] OnOpponentSecurityRemoved
  # You may play 1 5000 DP or lower Reptile or Dragonkin Digimon from
  # your hand without paying its cost.
  - scope: inherited
    when: on_opponent_security_removed
    once_per_turn: true
    optional: true
    active_when: { all_turns: true }
    process:
      - select_hand:
          of: you
          bind_as: pick
          filter:
            all_of:
              - kind: digimon
              - dp_lte: 5000
              - any_of:
                  - trait_has: Reptile
                  - trait_has: Dragonkin
          prompt: "Play a Reptile / Dragonkin Digimon (5000 DP or lower) without paying its cost"
      - play_from_hand_free: { of: you, hand_index: pick }
