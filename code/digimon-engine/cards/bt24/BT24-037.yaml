card: BT24-037
name: Silphymon
kind: digimon
level: 5
color: [yellow, red]
cost: 8
dp: 8000
traits: [Beastkin, Iliad, TS]

alt_paths:
  # Printed split circle: Yellow|Red Lv.4 / cost 4 — one entry per colour.
  - kind: digivolve
    from: { level_eq: 4, color_is: yellow }
    cost: 4
  - kind: digivolve
    from: { level_eq: 4, color_is: red }
    cost: 4

  - kind: digivolve
    from: { any_color: true, level_eq: 4, trait_has: TS }
    cost: 3

  - kind: dna_digivolve
    materials:
      - { level_eq: 4, color_is: yellow }
      - level_eq: 4
        any_of:
          - color_is: red
          - color_is: green
    cost: 0

effects:
  # [On Play] [When Digivolving] 1 opponent Digimon gets -5000 DP for the turn.
  # Then, 1 of your Digimon may attack. DCGO uses a SelectAttackEffect-style
  # continuation; Rust exposes a PASS-able attacker selection and resumes the
  # centralized attack flow after the attack closes.
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] -5000 DP, then 1 own Digimon may attack"
    condition:
      any_permanent:
        of: opponent
        zone: [battle_area]
        kind: digimon
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: debuffed
          filter: { kind: digimon }
          prompt: "1 of your opponent's Digimon gets -5000 DP for the turn"
      - add_dp_modifier:
          target: debuffed
          value: -5000
          expiry: end_of_turn
      - optional:
          - select_own_permanent:
              bind_as: attacker
              # DCGO BT24_037.cs CanSelectAttackPermanentCondition: CanAttack.
              filter: { kind: digimon, can_attack: { targets: any } }
              prompt: "Select 1 of your Digimon that may attack"
              optional: true
          - may_attack_now:
              attacker: attacker
              targets: any
              optional: true

  # If DNA digivolving, 1 of your Digimon gains Security A. +1 and +5000 DP
  # for the turn. This separate clause is gated by the DNA-origin event context.
  - when: when_digivolving
    summary: "If DNA digivolving, 1 own Digimon gains Security A. +1 and +5000 DP"
    condition:
      all_of:
        - event_target_owner: you
        - dna_origin: true
    process:
      - select_own_permanent:
          optional: false
          bind_as: boosted
          filter: { kind: digimon }
          prompt: "1 of your Digimon gains Security A. +1 and +5000 DP for the turn"
      - grant_keyword:
          target: boosted
          keyword: SecurityAttackPlus
          value: 1
          expiry: end_of_turn
      - add_dp_modifier:
          target: boosted
          value: 5000
          expiry: end_of_turn

  # ─── [All Turns][Once Per Turn] would leave → play a Lv.4- source (own) ─────
  #
  # Printed twice on the card face (main box and inherited box), identical
  # text; DCGO BT24_037.cs registers two WhenRemoveField ActivateClasses with
  # separate hash keys (BT24_037_AT / BT24_037_AT_ESS) and maxCountPerTurn 1
  # each, so each copy has its own [Once Per Turn] count.
  #   CanUseCondition: this card's permanent would leave AND NOT
  #     IsByEffect(effect owned by this card's owner) -> "other than by your
  #     effects" = none_of replacement_cause own_effect.
  #   Candidate: IsDigimon && Level <= 4 && (Yellow || Red || HasTSTraits)
  #     && CanPlayAsNewPermanent(payCost false) -> the filter below; an
  #     unplayable card is never offered, and with none the replacement is
  #     not offered (preflight on the required pick).
  #   Optional activation (isOptional true) is the printed "you may"; the
  #   pick after accepting is the play (DCGO canNoSelect would only spend the
  #   use with nothing played, the same as declining minus the OPT use).
  # The play does not stop the leave (no "it doesn't leave" clause; the
  # BT18-063 / AD1-003 non-cancelling idiom).
  - kind: replacement
    trigger: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    active_when:
      all_of:
        - is_source: true
        - replacement_subject_is_mine: true
        - kind: digimon
        - none_of:
            - replacement_cause: own_effect
    summary: "[All Turns][Once Per Turn] When this Digimon would leave the battle area other than by your effects, you may play 1 level 4 or lower yellow, red or [TS] trait Digimon card from its digivolution cards without paying the cost"
    process:
      - select_material:
          optional: false
          of_permanent: replacement_subject
          bind_as: silphy_play
          filter:
            all_of:
              - kind: digimon
              - level_lte: 4
              - any_of:
                  - color_is: yellow
                  - color_is: red
                  - trait_has: TS
              - can_play_from_effect_without_cost: true
          prompt: "Play 1 level 4 or lower yellow, red or [TS] trait Digimon card from this Digimon's digivolution cards without paying the cost"
      - play_from_materials:
          target: replacement_subject
          source_index: silphy_play
          cost_delta: free

  # ─── Inherited: the same clause on the Digimon that carries Silphymon ───────
  - scope: inherited
    kind: replacement
    trigger: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    active_when:
      all_of:
        - is_source: true
        - replacement_subject_is_mine: true
        - kind: digimon
        - none_of:
            - replacement_cause: own_effect
    summary: "[Inherited][All Turns][Once Per Turn] When this Digimon would leave the battle area other than by your effects, you may play 1 level 4 or lower yellow, red or [TS] trait Digimon card from its digivolution cards without paying the cost"
    process:
      - select_material:
          optional: false
          of_permanent: replacement_subject
          bind_as: silphy_play
          filter:
            all_of:
              - kind: digimon
              - level_lte: 4
              - any_of:
                  - color_is: yellow
                  - color_is: red
                  - trait_has: TS
              - can_play_from_effect_without_cost: true
          prompt: "Play 1 level 4 or lower yellow, red or [TS] trait Digimon card from this Digimon's digivolution cards without paying the cost"
      - play_from_materials:
          target: replacement_subject
          source_index: silphy_play
          cost_delta: free
