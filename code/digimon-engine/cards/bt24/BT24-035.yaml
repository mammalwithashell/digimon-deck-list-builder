card: BT24-035
name: Gatomon
kind: digimon
level: 4
color: [yellow]
cost: 4
dp: 4000
traits: [Holy Beast, Iliad, TS]
attribute: Vaccine

alt_paths:
  # Printed split circle: Yellow|Red Lv.3 / cost 2 — one entry per colour.
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 2
  - kind: digivolve
    from: { level_eq: 3, color_is: red }
    cost: 2
  - kind: digivolve
    from:
      any_color: true
      all_of:
        - level_eq: 3
        - trait_has: TS
    cost: 2

effects:
  - text: "[On Play] [When Digivolving] 1 of your opponent's Digimon gets -3000 DP for the turn. Then, if it's your turn, 2 of your Digimon may DNA digivolve into [Silphymon] in the hand."
    when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] -3000 DP, then if your turn may DNA into Silphymon"
    condition:
      any_permanent:
        of: opponent
        zone: [battle_area]
        kind: digimon
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: debuffed
          filter: { kind: digimon }
          prompt: "1 of your opponent's Digimon gets -3000 DP for the turn"
      - add_dp_modifier:
          target: debuffed
          value: -3000
          expiry: end_of_turn
      - if:
          condition:
            all_of:
              - your_turn: true
              - count_gte:
                  filter:
                    of: you
                    zone: [hand]
                    kind: digimon
                    name_is: "Silphymon"
                  n: 1
              - count_gte:
                  filter:
                    of: you
                    zone: [battle_area]
                    kind: digimon
                    level_eq: 4
                    color_is: yellow
                  n: 1
              - count_gte:
                  filter:
                    of: you
                    zone: [battle_area]
                    kind: digimon
                    level_eq: 4
                    any_of:
                      - color_is: red
                      - color_is: green
                  n: 1
          # game-audit 2026-11-11 / DCGO CanPlayJogress: the hand pick offers
          # only a [Silphymon] that can DNA digivolve right now (DCGO
          # `CanPlayJogress(true)`), and the pair picks use that card's own
          # DNA requirement (`dna_field_pair`). The pair filters used to
          # hard-code BT24-037's Yellow Lv.4 + Red/Green Lv.4 recipe, which
          # offered pairs other Silphymon printings (BT8-015 / BT16-012: Red
          # Lv.4 + Yellow Lv.4) cannot DNA from, and offered BT3-014 (no DNA
          # requirement at all) in the hand pick.
          then:
            - optional:
                - select_hand:
                    of: you
                    bind_as: dna_card
                    optional: true
                    filter:
                      all_of:
                        - kind: digimon
                        - name_is: "Silphymon"
                        - dna_field_pair: { role: result }
                    prompt: "Select [Silphymon] in hand to DNA digivolve into"
                - if:
                    condition: { binding_present: dna_card }
                    then:
                      - select_dna_pair:
                          left_filter:
                            all_of:
                              - kind: digimon
                              - of: you
                              - dna_field_pair: { role: first, result: dna_card }
                          right_filter:
                            all_of:
                              - kind: digimon
                              - of: you
                              - dna_field_pair: { role: second, result: dna_card, first: dna_src_a }
                          bind_left_as: dna_src_a
                          bind_right_as: dna_src_b
                          prompt: "Select 2 of your Digimon to DNA digivolve into [Silphymon]"
                          optional: true
                      - if:
                          condition: { binding_present: dna_src_a }
                          then:
                            - effect_initiated_dna_digivolve:
                                target_a: dna_src_a
                                target_b: dna_src_b
                                from_hand: dna_card
                                cost: 0
                                ignore_requirements: false

  - text: "＜Barrier＞ (When this Digimon would be deleted in battle, by trashing your top security card, it isn't deleted.)"
    scope: inherited
    kind: grant_keyword
    keyword: Barrier
    summary: "Inherited <Barrier>"
