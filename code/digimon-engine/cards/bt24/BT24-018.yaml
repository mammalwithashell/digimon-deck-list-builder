card: BT24-018
name: Styracomon
kind: digimon
level: 7
color: [red]
cost: 14
dp: 14000
traits: [Dragonkin, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 6, color_is: red }
    cost: 4
  # Printed alt evo box: "[Digivolve] While you have [Owen Dreadnought],
  # [Lamiamon]: Cost 6". DCGO BT24_018.cs: `permanentCondition:
  # targetPermanent.TopCard.EqualsCardName("Lamiamon")` (the digivolve SOURCE
  # — exact name, no level/color restriction) gated by `condition:
  # HasMatchConditionOwnersPermanent(HasOwenDreadnought)` (an [Owen
  # Dreadnought] on YOUR battle area — a condition, NOT a second
  # digivolve-from path). Same Owen gate idiom as sibling BT24-016.
  - kind: digivolve
    from: { name_is: "Lamiamon" }
    cost: 6
    condition:
      any_permanent:
        of: you
        zone: [battle_area]
        kind: tamer
        name_is: "Owen Dreadnought"

effects:
  # Clause (a) — Progress keyword
  - kind: grant_keyword
    keyword: Progress

  # Clause (b) — Piercing keyword
  - kind: grant_keyword
    keyword: Piercing

  # Clause (c) — Blocker keyword
  - kind: grant_keyword
    keyword: Blocker

  # Clause (d) — Armor Purge keyword
  - kind: grant_keyword
    keyword: ArmorPurge

  # Clause (e) — [When Digivolving]
  # "You may trash any 1 of your opponent's security cards.
  #  Then, this Digimon may unsuspend."
  #
  # The printed clause has two independent "may" sub-actions, modelled as two
  # separate `when_digivolving` clauses so each keeps its own optionality
  # (they fire in clause order — trash first, then unsuspend):
  #
  #   e1: "You may trash any 1 of your opponent's security cards" —
  #       select_security (of: opponent, optional) → trash_selected_security.
  #       G-TRASH-SELECTED-SECURITY resolved 2026-05-21: the
  #       `trash_selected_security` verb consumes a `select_security` binding
  #       and `EffectContext::trash_security_card` trashes that exact card
  #       (addressed by a stable handle, so any security position works — not
  #       just the top). When the opponent has no security cards
  #       `select_security` installs no prompt and the clause silently no-ops.
  #       The filter `any_of: [digimon, tamer, option]` matches every card
  #       that can be in a security stack ("any 1").
  #
  #   e2: "Then, this Digimon may unsuspend" — `optional: true` clause whose
  #       accept/decline gate is the printed "may". `target: source` resolves
  #       to the Styracomon permanent (`self`/SelfRef would resolve to the
  #       Card, not the Permanent — see dsl_cards/binding_ref.rs).
  - when: when_digivolving
    optional: true
    summary: "[When Digivolving] You may trash any 1 of your opponent's security cards"
    process:
      - select_security:
          of: opponent
          bind_as: sec_to_trash
          optional: true
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
              - kind: option
          prompt: "You may trash any 1 of your opponent's security cards"
      - trash_selected_security:
          of: opponent
          card: sec_to_trash
  - when: when_digivolving
    optional: true
    summary: "[When Digivolving] This Digimon may unsuspend"
    process:
      - unsuspend: { target: source }

  # Clause (f) — [All Turns][Once Per Turn]
  # "When your opponent's security stack is removed from, you may delete 1 of
  #  their Digimon."
  # on_opponent_security_removed fires in the attacker's battle area, so it is
  # reachable on both turns; `all_turns: true` is the explicit [All Turns] tag.
  - when: on_opponent_security_removed
    active_when: { all_turns: true }
    once_per_turn: true
    optional: true
    summary: "[All Turns][OPT] Opponent security removed → may delete 1 opp Digimon"
    process:
      - select_opponent_permanent:
          bind_as: tgt
          filter: { kind: digimon }
          prompt: "Delete 1 of your opponent's Digimon"
      - delete_permanent: { target: tgt }

  # Clause (g) — [All Turns][Once Per Turn]
  # "When any of your [Reptile] or [Dragonkin] trait Digimon would leave the
  #  battle area, by deleting 1 of your opponent's lowest DP Digimon, they
  #  don't leave."
  #
  # Replacement clause (kind: replacement, trigger: when_would_leave_battle_area).
  # `replacement_subject_is_mine: true` scopes the leaving subject to the
  # controller's own permanents (G-EVENT-TARGET-OWNER — RESOLVED). Card text
  # has NO "by your opponent's effects" gate, so this fires on ANY removal
  # cause (no `replacement_cause` predicate). The cost — "by deleting 1 of
  # your opponent's lowest DP Digimon" — uses the lowest_dp aggregate filter
  # (G-PRED-DP-LTE — RESOLVED). When the opponent has no Digimon the cost is
  # unpayable and the replacement prompt does not install.
  - kind: replacement
    trigger: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    active_when:
      all_of:
        - replacement_subject_is_mine: true
        - kind: digimon
        - any_of:
            - trait_has: Reptile
            - trait_has: Dragonkin
    summary: "[All Turns][OPT] By deleting opp lowest-DP Digimon, your Reptile/Dragonkin doesn't leave"
    process:
      - select_opponent_permanent:
          bind_as: lowest_dp_cost
          filter: { kind: digimon }
          selector: lowest_dp
          prompt: "Delete 1 of your opponent's lowest DP Digimon"
      - delete_permanent: { target: lowest_dp_cost }
      - cancel_replacement: {}
