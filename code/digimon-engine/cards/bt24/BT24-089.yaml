card: BT24-089
name: "Unique Emblem: Blazing Conductor"
kind: option
color: [red]
cost: 3
traits: [LIBERATOR]

# ─── Clause 0: [Main] ─────────────────────────────────────────────────────────
#
# "[Main] You may play 1 [Elizamon] or [Owen Dreadnought] from your hand or
# trash without paying the cost. Then, place this card in the battle area."
#
# Printed text: "you may" → the play target is optional (the union-zone pick is
#   declinable). The clause itself is not optional (Option [Main] effects always
#   resolve when the Option is played; only the inner play is "may").
# DCGO: SelectHandEffect / SelectCardEffect both have canNoSelect = true, and a
#   "From hand" / "From trash" location prompt fires only when both zones hold an
#   eligible card. The DSL `select_union_zone` step models hand ∪ trash as a
#   single masked, origin-preserving choice — strictly more faithful than the
#   DCGO zone-then-card two-step (both reach the same legal-target set and
#   replay each card from its true origin zone).
#
# "Then, place this card in the battle area." — option-as-permanent placement,
#   expressed with `place_self_as_delay_option: {}` (G-PLACE-SELF-AS-OPTION-PERMANENT,
#   resolved 2026-05-02). The step is the Main process tail, after the optional
#   Elizamon/Owen play.
#
# ─── Clause 1: [Your Turn] When any of your [Owen Dreadnought]s suspend ───────
#
# "＜Delay＞ (By trashing this card after the placing turn, activate the
# effect below.)
# ・1 of your [Reptile] or [Dragonkin] Digimon may digivolve into a Digimon
# card with the [Reptile] or [Dragonkin] trait and the [LIBERATOR] trait in
# the hand with the digivolution cost reduced by 3."
#
# Event-gated Delay (G-DELAY-EVENT-GATED, suspend-timing slice resolved
#   2026-05-02; this is the same gap previously tracked card-locally as
#   G-DELAY-SUSPEND-CONDITION). `kind: delay` lowers `trigger: on_suspend` plus
#   `active_when` to `DelayTrigger::OnEvent(EffectTiming::OnSuspend)` and gates
#   activation until after the placing turn when an [Owen Dreadnought] you own
#   suspends. Same shape as BT22-098 Unique Emblem: Fable Waltz (Arisa suspend).
# Delay body: optional select of a Reptile/Dragonkin Digimon base, then a
#   Reptile-or-Dragonkin + LIBERATOR Digimon card from hand, then
#   `effect_initiated_digivolve` with the digivolution cost reduced by 3.
#   DCGO trashes BT24-089 as the Delay's cost before running the body.
#
# ─── Clause 2: Inherited [Security] ──────────────────────────────────────────
#
# "Security Effect [Security] Activate this card's [Main] effects."
# → Mirrors the [Main] clause: union-zone play of Elizamon/Owen Dreadnought
#   for free, then `place_self_as_delay_option`.
# DCGO: `AddActivateMainOptionSecurityEffect` — the security trigger re-runs the
#   same Main process (the inner play stays "may"/optional).

effects:
  # ─── Clause 0: [Main] ─────────────────────────────────────────────────────
  - when: main_from_hand
    optional: false
    summary: "[Main] You may play 1 Elizamon or Owen Dreadnought from hand or trash free; place this in battle area"
    process:
      - select_union_zone:
          of: you
          zones: [hand, trash]
          # DCGO BT24_089.cs:34-39: names && CanPlayAsNewPermanent(payCost: false).
          filter:
            can_play_from_effect_without_cost: true
            any_of:
              - name_is: Elizamon
              - name_is: Owen Dreadnought
          bind_as: pick
          optional: true
          prompt: "You may play 1 [Elizamon] or [Owen Dreadnought] from your hand or trash without paying the cost"
      - play_union_bound_free:
          binding: pick
      - place_self_as_delay_option: {}

  # ─── Clause 1: [Your Turn] Delay on Owen Dreadnought suspend ──────────────
  - kind: delay
    trigger: on_suspend
    active_when:
      your_turn: true
      event_target_owner: you
      event_card_name_contains: "Owen Dreadnought"
    summary: "[Your Turn] When your Owen Dreadnought suspends, Delay: Reptile/Dragonkin may digivolve into Reptile/Dragonkin+LIBERATOR in hand, cost -3"
    process:
      - select_own_permanent:
          bind_as: target
          optional: true
          filter:
            all_of:
              - kind: digimon
              - zone: [battle_area]
              - any_of:
                  - trait_has: Reptile
                  - trait_has: Dragonkin
          prompt: "Choose 1 of your [Reptile] or [Dragonkin] Digimon to digivolve"
      - select_hand:
          of: you
          bind_as: evo
          # "may digivolve": DCGO DigivolveIntoHandOrTrashCard's hand pick is
          # declinable (isOptional defaults to true -> canNoSelect,
          # CardEffectCommons.cs:834, 1057).
          optional: true
          # DCGO DigivolveIntoHandOrTrashCard(payCost: true, reduce 3)
          # (BT24_089.cs:243-255; CardEffectCommons.cs:859-882) filters on a
          # route onto the chosen Digimon (!CanNotEvolve, CanPlayCardTargetFrame).
          # It does NOT filter on cost: CanPlayCardTargetFrame only checks
          # memory for an empty frame (CardSource.cs:1150-1161), so DCGO offers
          # an unaffordable card and fails the digivolve at commit
          # (CardController.cs:1008-1014, playFailed). We also require the
          # reduced cost to be payable (CR 4.3 1-3-11-1: a digivolve that can't
          # be paid can't be declared), matching our own commit refusal.
          filter:
            all_of:
              - kind: digimon
              - trait_has: LIBERATOR
              - any_of:
                  - trait_has: Reptile
                  - trait_has: Dragonkin
              - can_digivolve_onto_with_cost: { target: target, cost: { reduce: 3 } }
          prompt: "Choose a [Reptile] or [Dragonkin] and [LIBERATOR] Digimon card to digivolve into"
      - effect_initiated_digivolve:
          target: target
          from_hand: evo
          cost: { reduce: 3 }
          ignore_requirements: false

  # ─── Clause 2: Inherited [Security] ───────────────────────────────────────
  - scope: inherited
    when: on_security
    optional: false
    summary: "[Security] Activate [Main] effects: play 1 Elizamon or Owen Dreadnought from hand or trash free, then place in battle area"
    process:
      - select_union_zone:
          of: you
          zones: [hand, trash]
          # DCGO BT24_089.cs:34-39: names && CanPlayAsNewPermanent(payCost: false).
          filter:
            can_play_from_effect_without_cost: true
            any_of:
              - name_is: Elizamon
              - name_is: Owen Dreadnought
          bind_as: sec_pick
          optional: true
          prompt: "You may play 1 [Elizamon] or [Owen Dreadnought] from your hand or trash without paying the cost"
      - play_union_bound_free:
          binding: sec_pick
      - place_self_as_delay_option: {}
