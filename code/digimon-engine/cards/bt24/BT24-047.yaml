card: BT24-047
name: Kokatorimon
kind: digimon
level: 4
color: [green]
cost: 4
dp: 4000
traits: [Giant Bird]
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: green }
    cost: 2

effects:
  # [On Play] [When Digivolving] You may suspend 1 Digimon. If this effect
  # suspended your Digimon, 1 of your Digimon with [Avian] or [Bird] in any
  # of its traits or the [Vortex Warriors] trait unsuspends. If this effect
  # unsuspended, that Digimon may attack.
  - text: "[On Play] [When Digivolving] You may suspend 1 Digimon. If this effect suspended your Digimon, 1 of your Digimon with [Avian] or [Bird] in any of its traits or the [Vortex Warriors] trait unsuspends. If this effect unsuspended, that Digimon may attack."
    when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] May suspend; if yours, unsuspend eligible Digimon and it may attack"
    process:
      - select_any_permanent:
          bind_as: suspended
          filter: { kind: digimon }
          prompt: "You may suspend 1 Digimon"
          optional: true
      - suspend: { target: suspended }
      - if:
          condition:
            effect_suspended_any_own_digimon: true
          then:
            - select_own_permanent:
                optional: false
                bind_as: unsuspended
                filter:
                  all_of:
                    - kind: digimon
                    - is_suspended: true
                    - any_of:
                        - trait_contains: Avian
                        - trait_contains: Bird
                        - trait_has: Vortex Warriors
                prompt: "Unsuspend 1 Avian, Bird or Vortex Warriors Digimon"
            - unsuspend: { target: unsuspended }
            - may_attack_now:
                attacker: unsuspended
                targets: any
                optional: true

  # [All Turns] [Once Per Turn] When this Digimon deletes your opponent's
  # Digimon in battle, gain 1 memory. End-of-battle deletion payloads do not
  # yet expose the deleting attacker/defender pair to inherited DSL predicates,
  # so this inherited clause remains tracked as card-body follow-up rather
  # than hidden approximation.

  # ─── Inherited [All Turns][Once Per Turn] battle deletion → gain 1 memory ─
  # Card face + bundle: "[All Turns] [Once Per Turn] When this Digimon deletes
  # your opponent's Digimon in battle, gain 1 memory." DCGO BT24_047.cs
  # (OnEndBattle, SetIsInheritedEffect, maxCountPerTurn 1, not optional):
  # CanTriggerWhenDeleteOpponentDigimonByBattle(winner = the permanent holding
  # this card, loser = an opponent permanent) and the carrier still on the
  # battle area. BT25-054 idiom: on_any_deletion + source_deleted_battle_opponent.
  - text: "[All Turns] [Once Per Turn] When this Digimon deletes your opponent's Digimon in battle, gain 1 memory."
    scope: inherited
    when: [on_any_deletion]
    once_per_turn: true
    active_when: { all_turns: true }
    condition: { source_deleted_battle_opponent: true }
    summary: "[Inherited][All Turns][Once Per Turn] When this Digimon deletes your opponent's Digimon in battle, gain 1 memory"
    process:
      - gain_memory: 1
