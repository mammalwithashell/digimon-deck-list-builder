# BT24-009 Shamanmon — Digimon, Lv.3, Red/Purple, DP 1000, Cost 3.
# Traits: Demon, Titan, TS. Form: Rookie. Attribute: Virus.
# Printed digivolve box (official Bandai DB — data/card_bundles/BT24-009.md):
#   Red Lv.2 / cost 1; Purple Lv.2 / cost 1 (cards.json evo_costs drops the
#   Purple circle — authored explicitly below);
#   [Digivolve] [Tsunomon]/Lv.2 w/[TS] trait: Cost 0.
#
# Printed card text (official Bandai DB):
#   [On Play] By trashing 1 card with the [Demon], [Shaman] or [Titan] trait
#     from your hand, <Draw 2>.
#   Inherited: [Your Turn] [Once Per Turn] When your hand is trashed from, this
#     [Demon] or [Titan] trait Digimon may digivolve into [Titamon] or a
#     [Titan] trait Digimon card in the trash with the digivolution cost
#     reduced by 1.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT24/Red/BT24_009.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
# Alt-digivolve: TopCard.EqualsCardName("Tsunomon") || (IsLevel2 &&
#   HasTSTraits), cost 0, ignoreDigivolutionRequirement false.
#   → one alt_path `any_of: [name_is Tsunomon, all_of [level_eq 2, TS]]`.
# [On Play] (OnEnterFieldAnyone, maxPerTurn -1, isOptional false; CanActivate
#   = on battle area && hand >= 1): SelectHandEffect(Discard, filter Demon |
#   Shaman | Titan, canNoSelect: true) → if discarded, DrawClass 2.
#   → condition: a [Demon]/[Shaman]/[Titan] card in hand; optional
#   `select_hand cost: true` over that filter (declining aborts the clause —
#   no draw) → trash_from_hand_by_index → draw 2.
#   The hand trash is effect-caused, so it fires `on_discard_hand` for the
#   owner's inherited "when your hand is trashed from" observers.
# Inherited (OnDiscardHand, maxPerTurn 1, isOptional true, inherited;
#   CanUse = on battle area && CanTriggerOnTrashHand(owner == you) &&
#   IsOwnerTurn; CanActivate = a trash Digimon named [Titamon] or with [Titan]
#   that can digivolve onto this permanent AND the host TopCard has [Demon]
#   or [Titan]): DigivolveIntoHandOrTrashCard(isHand false, payCost, reduce 1).
#   → on_discard_hand + active_when your_turn + event_discard_player you;
#   once_per_turn; condition any_of source_permanent_trait_has Demon/Titan
#   (the printed "this [Demon] or [Titan] trait Digimon" = DCGO TopCard
#   check); optional trash pick (can_digivolve_from_source) →
#   effect_initiated_digivolve cost -1; refund_opt when nothing was picked
#   (DCGO never activates without a candidate, so the OPT is not consumed).
#   Same body as BT26-066 Salamon.

card: BT24-009
name: Shamanmon
kind: digimon
level: 3
color: [red, purple]
cost: 3
dp: 1000
traits: [Demon, Titan, TS]
form: Rookie
attribute: Virus

alt_paths:
  # Standard Red Lv.2 / cost 1 circle (also in cards.json evo_costs; authored
  # explicitly so the compiled card carries it — the DSL-compiled CardData
  # does not read cards.json evo_costs).
  - kind: digivolve
    from: { level_eq: 2, color_is: red }
    cost: 1
  # Standard Purple Lv.2 / cost 1 circle (dropped by cards.json evo_costs).
  - kind: digivolve
    from: { level_eq: 2, color_is: purple }
    cost: 1
  # [Digivolve] [Tsunomon]/Lv.2 w/[TS] trait: Cost 0.
  - kind: digivolve
    from:
      any_of:
        - name_is: "Tsunomon"
        - all_of:
            - level_eq: 2
            - trait_has: TS
    cost: 0

effects:
  # ─── [On Play] By trashing 1 [Demon]/[Shaman]/[Titan] card from hand,
  #     <Draw 2> ────────────────────────────────────────────────────────────
  - when: on_play
    condition:
      count_gte:
        filter:
          of: you
          zone: [hand]
          any_of:
            - trait_has: Demon
            - trait_has: Shaman
            - trait_has: Titan
        n: 1
    summary: "[On Play] By trashing 1 card with the [Demon], [Shaman] or [Titan] trait from your hand, <Draw 2>"
    process:
      - select_hand:
          of: you
          bind_as: cost_card
          optional: true
          cost: true
          filter:
            any_of:
              - trait_has: Demon
              - trait_has: Shaman
              - trait_has: Titan
          prompt: "Trash 1 [Demon]/[Shaman]/[Titan] card from your hand to <Draw 2>"
      - trash_from_hand_by_index: { of: you, hand_index: cost_card }
      - draw: { of: you, count: 2 }

  # ─── Inherited [Your Turn][OPT] your hand is trashed from → this [Demon] or
  #     [Titan] Digimon may digivolve into [Titamon] / a [Titan] trash card,
  #     cost -1 (BT26-066 idiom; trait gate widened to Demon OR Titan) ───────
  - scope: inherited
    when: on_discard_hand
    once_per_turn: true
    active_when:
      all_of:
        - your_turn: true
        - event_discard_player: you
    condition:
      any_of:
        - source_permanent_trait_has: Demon
        - source_permanent_trait_has: Titan
    summary: "[Inherited][Your Turn][Once Per Turn] When your hand is trashed from, this [Demon] or [Titan] Digimon may digivolve into [Titamon] or a [Titan] Digimon card in the trash with the cost reduced by 1"
    process:
      - select_union_zone:
          of: you
          zones: [trash]
          optional: true
          bind_as: evo
          filter:
            all_of:
              - kind: digimon
              - can_digivolve_from_source: true
              - any_of:
                  - name_is: "Titamon"
                  - trait_has: Titan
          prompt: "This Digimon may digivolve into [Titamon] or a [Titan] Digimon card in your trash with the cost reduced by 1"
      - if:
          condition: { binding_present: evo }
          then:
            - effect_initiated_digivolve:
                target: source
                source: evo
                cost: { reduce: 1 }
          else:
            - refund_opt: {}
