# EX12-072 Metal Empire — Option, Black, Use cost 2. Traits: ME.
#
# Printed text (the card image, DCGO EX12_072.cs):
#   <Use Req. ([ME] trait)>
#   [Security] [All Turns] All of your [ME] trait Digimon gain <Guard>.
#   [Main] Add your bottom security card to the hand and place this card face up
#   as the bottom security card.
#   Security Effect: [Security] You may play 1 level 5 or lower [ME] trait
#   Digimon card from your hand without paying the cost.
#
# NOTE: data/cards.json prints the security effect as "play cost 5 or lower
# [ME] trait card from your hand or trash" which the card face and DCGO
# (EX12_072.cs SecuritySkill: IsDigimon && Level <= 5 && ME, hand only) both
# contradict; the card face governs, so this spec follows it.
#
# Sister card: EX12-069 Virus Busters (same Use Req. / Main / Security shape).
# Guard aura: BT26-100 / EX13-063 idiom (`kind: aura`, `scope: security`).

card: EX12-072
name: Metal Empire
kind: option
color: [black]
cost: 2
traits: [ME]

use_requirement:
  any_field_permanent:
    of: you
    any_of:
      - kind: digimon
      - kind: tamer
    trait_has: "ME"

effects:
  - kind: flood_gate
    scope: face_up
    active_when: { your_turn: true }
    modifier: IgnoreColorRequirement
    target: { card_number_is: "EX12-072" }
    summary: "<Use Req. ([ME] trait)> — ignore this card's color requirements"

  - kind: aura
    scope: security
    active_when: { all_turns: true }
    target:
      owner: you
      zone: [battle_area]
      kind: digimon
      trait_has: ME
    grant_keyword: { keyword: Guard }
    summary: "[Security][All Turns] All of your [ME] trait Digimon gain <Guard>"

  - when: main_from_hand
    summary: "[Main] Add your bottom security card to the hand and place this card face up as the bottom security card"
    process:
      - add_bottom_security_to_hand: { of: you }
      - place_on_security:
          source: self_option
          position: bottom
          face_up: true

  - scope: inherited
    when: on_security
    optional: true
    summary: "[Security] You may play 1 level 5 or lower [ME] trait Digimon from your hand without paying the cost"
    process:
      - select_hand:
          of: you
          bind_as: me_free
          optional: true
          filter:
            all_of:
              - kind: digimon
              - trait_has: ME
              - level_lte: 5
              # DCGO EX12_072.cs: `CanPlayAsNewPermanent(card, payCost: false,
              # activateClass)` — a free slot, no play prohibition, never a
              # DUAL or Digi-Egg (CR 4.3 4-6-2, 7-1-1).
              - can_play_from_effect_without_cost: true
          prompt: "Play 1 level 5 or lower [ME] trait Digimon card from your hand without paying the cost"
      - play_from_hand_free:
          of: you
          hand_index: me_free
