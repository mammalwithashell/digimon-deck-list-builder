card: EX12-021
name: Gabumon
kind: digimon
level: 3
color: [blue]
cost: 3
dp: 2000
traits: [Reptile, VB]
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: blue }
    cost: 0
  - kind: digivolve
    from:
      all_of:
        - level_eq: 2
        - any_of:
            - name_contains: Tsunomon
            - trait_has: VB
    cost: 0

effects:
  - when: start_of_your_main_phase
    condition:
      count_gte:
        filter:
          of: you
          zone: [hand]
          any_of:
            - name_contains: Garurumon
            - trait_has: VB
        n: 1
    summary: "[Start of Your Main Phase] By trashing 1 [Garurumon]-name or [VB] card from hand, draw 1 and gain 1 memory"
    process:
      - select_hand:
          of: you
          bind_as: discard
          optional: true
          cost: true
          filter:
            any_of:
              - name_contains: Garurumon
              - trait_has: VB
          prompt: "Trash 1 [Garurumon]-name or [VB] card from hand to draw 1 and gain 1 memory"
      - if:
          condition: { binding_present: discard }
          then:
            - trash_from_hand_by_index: { of: you, hand_index: discard }
            - draw: { of: you, count: 1 }
            - gain_memory: 1

  - scope: inherited
    when: when_attacking
    once_per_turn: true
    active_when: { your_turn: true }
    condition:
      count_lte:
        filter: { of: you, zone: [hand] }
        n: 7
    summary: "[Inherited][When Attacking][OPT] If your hand has 7 or fewer cards, draw 1"
    process:
      - draw: { of: you, count: 1 }
