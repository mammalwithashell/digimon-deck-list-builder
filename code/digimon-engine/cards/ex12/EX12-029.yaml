card: EX12-029
name: Sagomon
kind: digimon
level: 5
color: [blue, yellow]
cost: 7
dp: 7000
traits: [Wizard, Shambala, SW]
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: blue }
    cost: 4
  - kind: digivolve
    from: { level_eq: 4, trait_has: Shambala }
    cost: 3

effects:
  - kind: grant_keyword
    keyword: Blocker
    summary: "<Blocker>"

  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] 1 opponent Digimon or Tamer can't suspend until their turn ends; then 1 other [SW] Digimon may gain Alliance and attack"
    process:
      - select_opponent_permanent:
          bind_as: lock_target
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          prompt: "Choose 1 opponent Digimon or Tamer that can't suspend until their turn ends"
      - add_modifier:
          target: lock_target
          modifier: CannotSuspend
          value: 1
          expiry: end_of_opponents_turn
      - select_own_permanent:
          bind_as: sw_attacker
          optional: true
          filter:
            all_of:
              - kind: digimon
              - trait_has: SW
              - other: true
          prompt: "Choose 1 other [SW] Digimon to gain Alliance and attack"
      - if:
          condition: { binding_present: sw_attacker }
          then:
            - grant_keyword:
                target: sw_attacker
                keyword: Alliance
                expiry: end_of_turn
            - may_attack_now:
                attacker: sw_attacker
                targets: any
                optional: true

  - scope: inherited
    when: when_attacking
    once_per_turn: true
    optional: true
    summary: "[Inherited][When Attacking][OPT] Trash bottom 2 sources of 1 opponent Digimon; then 1 sourceless opponent Digimon can't suspend until their turn ends"
    process:
      - select_opponent_permanent:
          bind_as: source_target
          optional: true
          filter: { kind: digimon }
          prompt: "Trash the bottom 2 digivolution cards of 1 opponent Digimon"
      - if:
          condition: { binding_present: source_target }
          then:
            - trash_bottom_sources: { target: source_target, count: 2 }
            - select_opponent_permanent:
                bind_as: lock_target
                filter:
                  all_of:
                    - kind: digimon
                    - materials_count_lte: 0
                prompt: "Choose 1 sourceless opponent Digimon that can't suspend until their turn ends"
            - add_modifier:
                target: lock_target
                modifier: CannotSuspend
                value: 1
                expiry: end_of_opponents_turn
