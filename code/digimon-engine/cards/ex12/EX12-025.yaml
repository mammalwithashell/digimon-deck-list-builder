card: EX12-025
name: Gawappamon
kind: digimon
level: 4
color: [blue]
cost: 5
dp: 5000
traits: [Cyborg, Shambala, SW]
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: blue }
    cost: 2
  - kind: digivolve
    from: { level_eq: 3, trait_has: Shambala }
    cost: 2

effects:
  - kind: grant_keyword
    keyword: Blocker
    summary: "<Blocker>"

  - when: [on_play, on_deletion]
    summary: "[On Play][On Deletion] You may return 1 opponent level 4 or lower Digimon to hand"
    process:
      - select_opponent_permanent:
          bind_as: bounce_target
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_lte: 4
          prompt: "Return 1 opponent level 4 or lower Digimon to hand"
      - if:
          condition: { binding_present: bounce_target }
          then:
            - return_to_hand: { target: bounce_target }

  - scope: inherited
    when: when_attacking
    once_per_turn: true
    active_when: { your_turn: true }
    condition:
      count_lte:
        filter: { of: you, zone: [hand] }
        n: 7
    summary: "[Inherited][When Attacking][OPT] If your hand has 7 or fewer cards, draw 1"
    process:
      - draw: { of: you, count: 1 }
