card: EX12-018
name: Siriusmon
kind: dual
level: 6
color: [red, yellow]
cost: 5
dp: 12000
traits: ["Light Dragon", VB]
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: red }
    cost: 4
  - kind: digivolve
    from: { level_eq: 5, color_is: yellow }
    cost: 4
  - kind: digivolve
    from:
      all_of:
        - level_eq: 5
        - any_of:
            - in_text_contains: Gammamon
            - trait_has: VB
    cost: 3

dual:
  digimon:
    level: 6
    dp: 12000
    colors: [red, yellow]
    traits: ["Light Dragon", VB]
    effect_text: "<Progress> <Piercing> <Security A. +1>. [When Digivolving][When Attacking][Once Per Turn] You may place up to 2 Digimon cards with [Gammamon] in text or [VB] from hand or trash as this Digimon's top or bottom digivolution cards. If placed, 1 opponent Digimon gets -2000 DP per source until their turn ends."
    inherited_text: ""
    effects:
      - kind: grant_keyword
        keyword: Progress

      - kind: grant_keyword
        keyword: Piercing

      - kind: grant_keyword
        keyword: SecurityAttackPlus
        value: 1

      - when: [when_digivolving, when_attacking]
        once_per_turn: true
        summary: "[When Digivolving][When Attacking][OPT] Place up to 2 [Gammamon-text]/[VB] Digimon cards from hand/trash as top/bottom sources; if placed, -2000 DP per source"
        # Printed: "place up to 2 Digimon cards ... from your hand or trash" - ONE choice of up to 2
        # cards over both zones, so 1 from the hand and 1 from the trash is legal. DCGO EX12_018.cs:84-164
        # reaches the same picks through a "Where from?" menu loop (hand / trash / don't place any, repeated
        # while fewer than 2 are chosen, `maxCount = 2 - chosen`); the menu is DCGO UI, not card text, so the
        # engine asks the one pick (min 0 = "you may"; the replay folds DCGO's loop onto it). Then top or
        # bottom once for all of them (:166-180). Stacking order (CR 4.3 3-1-3-3 / 3-1-3-4: placed at the
        # same time, in the order the player chooses) is the pick order top-down, as DCGO: on top it
        # reverses the picks before AddDigivolutionCardsTop (:183-192, Permanent.cs:1145 inserts each at
        # index 1), so the first pick is topmost; at the bottom it appends in pick order (:194-196,
        # Permanent.cs:1247), so the last pick is bottommost.
        process:
          - select_zone_cards:
              zones: [hand, trash]
              filter:
                all_of:
                - kind: digimon
                - any_of:
                    - in_text_contains: Gammamon
                    - trait_has: VB
              min: 0
              max: 2
              bind_as: placed
              prompt: "You may place up to 2 Digimon cards with [Gammamon] in their text or the [VB] trait from your hand or trash as this Digimon's top or bottom digivolution cards"
          - if:
              condition: { binding_present: placed }
              then:
                - select_effect_choice:
                    bind_as: position
                    labels: ["Top of digivolution sources", "Bottom of digivolution sources"]
                    prompt: "Place the selected cards as this Digimon's top or bottom digivolution cards?"
                - if:
                    condition: { equals: [position, 0] }
                    then:
                      - place_cards_as_top_sources:
                          cards: placed
                          target: source
                    else:
                      - place_cards_as_bottom_sources:
                          cards: placed
                          target: source
          - if:
              condition: { binding_present: placed }
              then:
                - select_opponent_permanent:
                    bind_as: dp_target
                    filter: { kind: digimon }
                    prompt: "1 opponent Digimon gets -2000 DP for each of this Digimon's digivolution cards"
                - add_dp_modifier:
                    target: dp_target
                    value:
                      formula:
                        base: 0
                        per:
                          source_stack_count: {}
                        delta: -2000
                    expiry: end_of_opponents_turn
  option:
    use_cost: 5
    colors: [red]
    # <Use Req.> (CR 16-42-3; DCGO CardEffectFactory.UseRequirements): one
    # of your Digimon or Tamers in the battle area or breeding area meets
    # the condition (an Option on the field does not count).
    use_requirement:
      any_field_permanent:
        of: you
        any_of:
          - kind: digimon
          - kind: tamer
        trait_has: "VB"
    effect_text: "Use Requirement: [VB] trait. [Main] Delete 1 of your opponent's highest DP Digimon. Then, 1 of your Digimon may attack."
    security_text: ""
    arts_digivolve: true
    effects:
      - when: main
        summary: "[Main] Delete 1 opponent highest-DP Digimon; then 1 of your Digimon may attack"
        process:
          - select_opponent_permanent:
              bind_as: victim
              selector: highest_dp
              filter: { kind: digimon }
              prompt: "Delete 1 of your opponent's highest DP Digimon"
          - delete_permanent: { target: victim }
          - if:
              condition:
                any_permanent:
                  of: you
                  kind: digimon
                  can_attack: { targets: any }
              then:
                - select_effect_choice:
                    bind_as: main_attack_choice
                    labels: ["Attack", "Decline"]
                    prompt: "1 of your Digimon may attack"
                - if:
                    condition: { equals: [main_attack_choice, 0] }
                    then:
                      - select_own_permanent:
                          bind_as: attack_target
                          # DCGO EX12_018.cs: IsPermanentExistsOnOwnerBattleAreaDigimon && CanAttack.
                          filter: { kind: digimon, can_attack: { targets: any } }
                          prompt: "Choose 1 of your Digimon to attack"
                      - may_attack_now:
                          attacker: attack_target
                          targets: any
                          optional: true
