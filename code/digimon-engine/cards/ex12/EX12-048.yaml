card: EX12-048
name: SeitenGokuumon
kind: digimon
level: 6
color: [yellow, red]
cost: 5
dp: 12000
traits: [Tathāgata, Shambala, SW]
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: yellow }
    cost: 5
  - kind: digivolve
    from: { level_eq: 5, color_is: red }
    cost: 5
  - kind: digivolve
    from: { level_eq: 5, color_is: blue }
    cost: 5

effects:
  - kind: grant_keyword
    keyword: Rush
    summary: "<Rush>"
  - kind: grant_keyword
    keyword: Raid
    summary: "<Raid>"
  - kind: grant_keyword
    keyword: Piercing
    summary: "<Piercing>"
  - kind: grant_keyword
    keyword: SecurityAttackPlus
    value: 1
    summary: "<Security A. +1>"

  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Opponent Digimon gets -8000 DP and -3000 per level 5 source; then this may attack"
    process:
      - select_opponent_permanent:
          bind_as: dp_target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon to get DP minus"
      - add_dp_modifier:
          target: dp_target
          value:
            formula:
              base: -8000
              per:
                source_stack_count:
                  filter: { level_eq: 5 }
              delta: -3000
          expiry: end_of_opponents_turn
      - may_attack_now:
          attacker: source
          targets: any
          optional: true

  - kind: replacement
    trigger: when_would_leave_battle_area
    optional: true
    active_when:
      all_of:
        - replacement_subject_is_mine: true
        - none_of:
            - replacement_cause: own_effect
    summary: "[All Turns] When this would leave other than by your effects, play up to 2 level 5 [Gokuumon-text]/[SW] sources free"
    process:
      - select_material:
          of_permanent: replacement_subject
          bind_as: first_source
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_eq: 5
              - any_of:
                  - in_text_contains: Gokuumon
                  - trait_has: SW
          prompt: "Play 1 level 5 [Gokuumon-text]/[SW] source"
      - play_from_materials:
          target: replacement_subject
          source_index: first_source
          cost_delta: free
      - select_material:
          of_permanent: replacement_subject
          bind_as: second_source
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_eq: 5
              - any_of:
                  - in_text_contains: Gokuumon
                  - trait_has: SW
          prompt: "Play another level 5 [Gokuumon-text]/[SW] source"
      - play_from_materials:
          target: replacement_subject
          source_index: second_source
          cost_delta: free
