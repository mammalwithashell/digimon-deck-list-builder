card: EX12-026
name: Shellmon
kind: digimon
level: 4
color: [blue]
cost: 5
dp: 5000
traits: [Mollusk, Shambala, TB]
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: blue }
    cost: 2
  - kind: digivolve
    from: { level_eq: 3, trait_has: Shambala }
    cost: 2

effects:
  - kind: grant_keyword
    keyword: Blocker
    summary: "<Blocker>"

  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Trash bottom 2 sources of 1 opponent Digimon; then 1 opponent Digimon with 1 or fewer sources can't attack or block"
    process:
      - select_opponent_permanent:
          bind_as: source_target
          filter: { kind: digimon }
          prompt: "Trash the bottom 2 digivolution cards of 1 opponent Digimon"
      - trash_bottom_sources: { target: source_target, count: 2 }
      - select_opponent_permanent:
          bind_as: lock_target
          filter:
            all_of:
              - kind: digimon
              - materials_count_lte: 1
          prompt: "Choose 1 opponent Digimon with 1 or fewer sources"
      - add_modifier:
          target: lock_target
          modifier: CannotAttack
          value: 1
          expiry: end_of_opponents_turn
      - add_modifier:
          target: lock_target
          modifier: CannotBlock
          value: 1
          expiry: end_of_opponents_turn

  - scope: inherited
    when: when_attacking
    once_per_turn: true
    active_when: { your_turn: true }
    condition:
      count_lte:
        filter: { of: you, zone: [hand] }
        n: 7
    summary: "[Inherited][When Attacking][OPT] If your hand has 7 or fewer cards, draw 1"
    process:
      - draw: { of: you, count: 1 }
