card: EX12-026
name: Shellmon
kind: digimon
level: 4
form: Champion
color: [blue]
cost: 5
dp: 5000
traits: [Mollusk, Shambala, TB, Aquatic]
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: blue }
    cost: 2
  - kind: digivolve
    from: { any_color: true, level_eq: 3, trait_has: Shambala }
    cost: 2

effects:
  - text: "＜Blocker＞"
    kind: grant_keyword
    keyword: Blocker
    summary: "<Blocker>"

  - text: "[On Play] [When Digivolving] Trash the bottom 2 digivolution cards of 1 of your opponent's Digimon. Then, 1 of their Digimon with 1 or fewer digivolution cards can't attack or block until their turn ends."
    when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Trash bottom 2 sources of 1 opponent Digimon; then 1 opponent Digimon with 1 or fewer sources can't attack or block"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: source_target
          # DCGO EX12_026.cs:48-56 `CanSelectPermanentCondition`:
          # `IsPermanentExistsOnOpponentBattleAreaDigimon && permanent.DigivolutionCards.Count >= 1`.
          # When no opponent Digimon has digivolution cards, the first pick is
          # skipped and the "Then" lock clause still resolves.
          filter:
            all_of:
              - kind: digimon
              - materials_count_gte: 1
          prompt: "Trash the bottom 2 digivolution cards of 1 opponent Digimon"
      - trash_bottom_sources: { target: source_target, count: 2 }
      - select_opponent_permanent:
          optional: false
          bind_as: lock_target
          filter:
            all_of:
              - kind: digimon
              - materials_count_lte: 1
          prompt: "Choose 1 opponent Digimon with 1 or fewer sources"
      - add_modifier:
          target: lock_target
          modifier: CannotAttack
          value: 1
          expiry: end_of_opponents_turn
      - add_modifier:
          target: lock_target
          modifier: CannotBlock
          value: 1
          expiry: end_of_opponents_turn

  - text: "[When Attacking] [Once Per Turn] If your hand has 7 or fewer cards, ＜Draw 1＞."
    scope: inherited
    when: when_attacking
    once_per_turn: true
    active_when: { your_turn: true }
    # Hand count is a processing condition, not a trigger qualifier (CR 4.3
    # 15-8-3-9; DCGO EX12_026.cs:141-161 tests `HandCards.Count <= 7` inside
    # `ActivateCoroutine` and calls `RemoveUse()` when unmet). Matches EX12-021.
    summary: "[Inherited][When Attacking][OPT] If your hand has 7 or fewer cards, draw 1"
    process:
      - if:
          condition:
            count_lte:
              filter: { of: you, zone: [hand] }
              n: 7
          then:
            - draw: { of: you, count: 1 }
          else:
            - refund_opt: {}
