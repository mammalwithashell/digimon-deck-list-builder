card: EX12-002
name: Mococomon
kind: digi_egg
level: 2
color: [yellow]
cost: 0
traits: [Smoke, Shambala, SW]

effects:
  - scope: inherited
    when: on_ally_played
    once_per_turn: true
    active_when: { your_turn: true }
    condition:
      all_of:
        - event_target_owner: you
        - event_target_kind: digimon
        - event_target_trait_has: SW
        - event_target_is_source: false
    summary: "[Your Turn][OPT] When another [SW] Digimon is played, this Digimon may digivolve into an [SW] hand card with cost reduced by 2"
    process:
      - select_hand:
          of: you
          bind_as: sw_evo
          optional: true
          filter:
            all_of:
              - kind: digimon
              - trait_has: SW
          prompt: "Digivolve into an [SW] trait Digimon card in your hand with the cost reduced by 2"
      - if:
          condition: { binding_present: sw_evo }
          then:
            - effect_initiated_digivolve:
                target: source
                from_hand: sw_evo
                cost: { reduce: 2 }
