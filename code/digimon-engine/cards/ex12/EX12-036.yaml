card: EX12-036
name: Ryugumon
kind: digimon
level: 6
color: [blue, yellow]
cost: 12
dp: 12000
traits: [Mollusk, Sanmyojin, Tentei Hachibushu, Shambala]
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: blue }
    cost: 4
  - kind: digivolve
    from: { level_eq: 5, color_is: yellow }
    cost: 4
  - kind: digivolve
    from:
      all_of:
        - level_eq: 5
        - any_of:
            - trait_has: Aquatic
            - trait_has: Shambala
    cost: 3

effects:
  - kind: grant_keyword
    keyword: Barrier
    summary: "<Barrier>"
  - kind: grant_keyword
    keyword: Evade
    summary: "<Evade>"

  - kind: replacement
    trigger: when_would_leave_battle_area
    optional: true
    active_when:
      all_of:
        - replacement_subject_is_mine: true
        - none_of:
            - replacement_cause: battle
    summary: "<Decode (Lv.5 or lower Aqua/Sea Animal/TB)> play 1 matching source when this would leave outside battle"
    process:
      - select_material:
          of_permanent: replacement_subject
          bind_as: decode_source
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_lte: 5
              - any_of:
                  - trait_contains: Aqua
                  - trait_contains: "Sea Animal"
                  - trait_has: TB
          prompt: "Decode: play 1 level 5 or lower [Aqua]/[Sea Animal]/[TB] source"
      - play_from_materials:
          target: replacement_subject
          source_index: decode_source
          cost_delta: free

  - when: [on_play, when_digivolving, when_attacking]
    once_per_turn: true
    summary: "[OP][WD][WA][OPT] Place a matching level 6 or lower hand card as bottom source; 1 own Digimon may unsuspend"
    process:
      - select_hand:
          of: you
          bind_as: bottom_card
          optional: true
          cost: true
          filter:
            all_of:
              - level_lte: 6
              - any_of:
                  - trait_contains: Aqua
                  - trait_contains: "Sea Animal"
                  - trait_has: TB
          prompt: "Place 1 level 6 or lower [Aqua]/[Sea Animal]/[TB] card from hand as this Digimon's bottom source"
      - if:
          condition: { binding_present: bottom_card }
          then:
            - place_as_bottom_source:
                source: bottom_card
                target: source
            - select_own_permanent:
                bind_as: unsuspend_target
                optional: true
                filter:
                  all_of:
                    - kind: digimon
                    - is_suspended: true
                prompt: "Choose 1 of your Digimon to unsuspend"
            - unsuspend: { target: unsuspend_target }

  - when: [on_ally_played, on_digivolve]
    once_per_turn: true
    active_when:
      all_of:
        - all_turns: true
        - event_target_owner: you
    summary: "[All Turns][OPT] When any of your Digimon are played or digivolve, 1 opponent Digimon can't activate WD effects or suspend until their turn ends"
    process:
      - select_opponent_permanent:
          bind_as: lock_target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon to lock"
      - add_modifier:
          target: lock_target
          modifier: CannotActivateWhenDigivolvingEffects
          value: 1
          expiry: end_of_opponents_turn
      - add_modifier:
          target: lock_target
          modifier: CannotSuspend
          value: 1
          expiry: end_of_opponents_turn
