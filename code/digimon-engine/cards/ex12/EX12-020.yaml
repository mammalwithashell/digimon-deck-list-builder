card: EX12-020
name: Gasamon
kind: digimon
level: 3
color: [blue]
cost: 3
dp: 2000
traits: [Mollusk, Shambala, TB]
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: blue }
    cost: 0
  - kind: digivolve
    from: { level_eq: 2, trait_has: Shambala }
    cost: 0

effects:
  - kind: cost_reduction
    reduction_timing: before_pay_cost
    active_when:
      all_of:
        - your_turn: true
        - source_is_cost_target_permanent: true
        - cost_target:
            all_of:
              - kind: digimon
              - trait_has: TB
    amount: 1
    summary: "[Your Turn] When this Digimon would digivolve into a [TB] Digimon, reduce the cost by 1"

  - scope: inherited
    when: when_attacking
    once_per_turn: true
    active_when: { your_turn: true }
    condition:
      count_lte:
        filter: { of: you, zone: [hand] }
        n: 7
    summary: "[Inherited][When Attacking][OPT] If your hand has 7 or fewer cards, draw 1"
    process:
      - draw: { of: you, count: 1 }
