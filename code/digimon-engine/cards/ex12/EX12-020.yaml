card: EX12-020
name: Gasamon
kind: digimon
level: 3
form: Rookie
color: [blue]
cost: 3
dp: 2000
traits: [Mollusk, Shambala, TB]
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: blue }
    cost: 0
  - kind: digivolve
    from: { any_color: true, level_eq: 2, trait_has: Shambala }
    cost: 0

effects:
  - text: "[Your Turn] When this Digimon would digivolve into a Digimon card with the [TB] trait, reduce the cost by 1."
    kind: cost_reduction
    reduction_timing: before_pay_cost
    active_when:
      all_of:
        - your_turn: true
        - source_is_cost_target_permanent: true
        - cost_target:
            all_of:
              - kind: digimon
              - trait_has: TB
    amount: 1
    summary: "[Your Turn] When this Digimon would digivolve into a [TB] Digimon, reduce the cost by 1"

  - text: "[When Attacking] [Once Per Turn] If your hand has 7 or fewer cards, ＜Draw 1＞."
    scope: inherited
    when: when_attacking
    once_per_turn: true
    active_when: { your_turn: true }
    # Hand count is a processing condition, not a trigger qualifier (CR 4.3
    # 15-8-3-9; DCGO EX12_020.cs:80-100 tests `HandCards.Count <= 7` inside
    # `ActivateCoroutine` and calls `RemoveUse()` when unmet). Matches EX12-021.
    summary: "[Inherited][When Attacking][OPT] If your hand has 7 or fewer cards, draw 1"
    process:
      - if:
          condition:
            count_lte:
              filter: { of: you, zone: [hand] }
              n: 7
          then:
            - draw: { of: you, count: 1 }
          else:
            - refund_opt: {}
