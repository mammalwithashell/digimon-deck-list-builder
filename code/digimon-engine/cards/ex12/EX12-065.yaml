card: EX12-065
name: Kaguyamon
kind: digimon
level: 6
color: [purple, green]
cost: 12
dp: 12000
traits: [Puppet, Sanmyojin, Tentei Hachibushu, Shambala]
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: purple }
    cost: 4
  - kind: digivolve
    from: { level_eq: 5, color_is: green }
    cost: 4

effects:
  - kind: grant_keyword
    keyword: Fortitude
    summary: "<Fortitude>"

  - when: [on_play, when_digivolving, when_attacking]
    once_per_turn: true
    optional: true
    summary: "[OP][WD][WA][OPT] Play 1 play-cost-5-or-lower [Puppet]/[Shambala] card from trash free"
    process:
      - select_trash:
          of: you
          bind_as: revive_pick
          optional: true
          filter:
            all_of:
              - kind: digimon
              - play_cost_lte: 5
              - any_of:
                  - trait_has: Puppet
                  - trait_has: Shambala
          prompt: "Play 1 play cost 5 or lower [Puppet] or [Shambala] card from trash without paying the cost"
      - play_from_trash_free: { of: you, hand_index: revive_pick }

  - kind: aura
    active_when: { all_turns: true }
    target:
      owner: you
      kind: digimon
      any_of:
        - trait_has: Puppet
        - trait_has: TB
    grant_keyword: { keyword: Blocker }
    summary: "[All Turns] Your [Puppet]/[TB] Digimon gain <Blocker>"

  - kind: aura
    active_when: { all_turns: true }
    target:
      owner: you
      kind: digimon
      any_of:
        - trait_has: Puppet
        - trait_has: TB
    grant_keyword: { keyword: Retaliation }
    summary: "[All Turns] Your [Puppet]/[TB] Digimon gain <Retaliation>"

  - when: on_deletion
    summary: "[On Deletion] Return opponent's lowest-level Digimon to the bottom of the deck"
    process:
      - select_opponent_permanent:
          bind_as: bottom_target
          filter:
            all_of:
              - kind: digimon
              - level_matches_aggregate: { selector: lowest_level, of: opponent }
          prompt: "Return 1 of your opponent's lowest level Digimon to the bottom of the deck"
      - return_to_deck: { target: bottom_target, position: bottom }
