card: EX12-074
name: Genshi Continent & Ashino Island
kind: option
color: [white]
cost: 3
traits: [Shambala, SW, TB]

# <Use Req.> (CR 16-42-3; DCGO CardEffectFactory.UseRequirements): one
# of your Digimon or Tamers in the battle area or breeding area meets
# the condition (an Option on the field does not count).
use_requirement:
  any_field_permanent:
    of: you
    any_of:
      - kind: digimon
      - kind: tamer
    trait_has: "Shambala"

effects:
  - scope: security
    when: on_ally_attack
    once_per_turn: true
    optional: true
    active_when:
      your_turn: true
    trigger_if:
      all_of:
        - event_target_owner: you
        - event_target_trait_has: Shambala
    summary: "[Security][Your Turn][OPT] When your [Shambala] Digimon attacks, it may digivolve into a [Shambala] Digimon in hand with cost reduced by 1"
    process:
      - select_hand:
          of: you
          bind_as: shambala_evo
          optional: true
          filter:
            all_of:
              - kind: digimon
              - trait_has: Shambala
              # DCGO's `DigivolveIntoHandOrTrashCard` (CardEffectCommons.cs) offers
              # hand cards with a digivolution route onto the attacker
              # (`CanPlayCardTargetFrame`) and opens no pick when there are none;
              # the effect still triggers and is accepted (its
              # CanActivateCondition only needs a [Shambala] card in hand).
              # KNOWN DCGO DIVERGENCE on affordability (rules over DCGO): for an
              # occupied frame DCGO's check is route-only -- the
              # `MaxMemoryCost < cost` refusal (CardSource.cs:1150-1162) runs
              # only for an EMPTY frame, and `CanEvolve`/`EvoCosts`
              # (CardSource.cs:1269-1290) never compare cost to memory -- so DCGO
              # also offers unaffordable cards. We exclude them: CR 4.3 1-3-11-1,
              # and our effect digivolve refuses them
              # (Game::can_effect_digivolve_from_source_with_cost).
              - can_digivolve_onto_with_cost: { target: event_target, cost: { reduce: 1 } }
          prompt: "Digivolve the attacking [Shambala] Digimon into a [Shambala] Digimon in hand with the cost reduced by 1"
      - effect_initiated_digivolve:
          target: event_target
          from_hand: shambala_evo
          cost: { reduce: 1 }
          ignore_requirements: false

  - when: main_from_hand
    summary: "[Main] Add bottom security to hand, place this card face up as bottom security, then may play 1 [Shambala] card from hand with cost reduced by 3"
    process:
      - add_bottom_security_to_hand: { of: you }
      - place_on_security:
          source: self_option
          position: bottom
          face_up: true
      - select_hand:
          of: you
          bind_as: shambala_play
          optional: true
          filter:
            all_of:
              - any_of:
                  - kind: digimon
                  - kind: tamer
              - trait_has: Shambala
              # DCGO EX12_074.cs:88-92: CanPlayAsNewPermanent(payCost: true,
              # fixedCost: cost - 3) -- free frame, no play prohibition, and the
              # reduced cost payable (CR 4.3 1-3-11-1).
              - can_play_from_effect_without_cost: true
              - affordable_with_cost: { reduce: 3 }
          prompt: "Play 1 [Shambala] card from your hand with the play cost reduced by 3"
      - play_from_hand:
          of: you
          hand_index: shambala_play
          cost_delta: { reduce: 3 }

  - scope: inherited
    when: on_security
    optional: true
    summary: "[Security] You may play 1 play cost 5 or lower [Shambala] card from hand or trash free"
    process:
      - select_union_zone:
          of: you
          zones: [hand, trash]
          bind_as: shambala_free
          optional: true
          filter:
            all_of:
              - any_of:
                  - kind: digimon
                  - kind: tamer
              - trait_has: Shambala
              - play_cost_lte: 5
              # DCGO EX12_074.cs:129-135: HasPlayCost && CanPlayAsNewPermanent(
              # payCost: false); no pick when neither zone has one (:139-142).
              - can_play_from_effect_without_cost: true
          prompt: "Play 1 play cost 5 or lower [Shambala] card from your hand or trash without paying the cost"
      - play_union_bound_free:
          binding: shambala_free
