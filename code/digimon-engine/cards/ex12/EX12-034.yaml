card: EX12-034
name: Erlangmon
kind: digimon
level: 6
color: [blue, black]
cost: 12
dp: 12000
traits: [Shaman, Saneiketsu, Tentei Hachibushu, Shambala]
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: blue }
    cost: 4
  - kind: digivolve
    from: { level_eq: 5, color_is: black }
    cost: 4
  - kind: digivolve
    from: { level_eq: 5, trait_has: Shambala }
    cost: 3

effects:
  - when: [on_play, when_digivolving]
    optional: true
    summary: "[On Play][When Digivolving] You may play 1 [Kotenken] Token"
    process:
      - play_token:
          controller: you
          token_name: kotenken

  - when: on_ally_played
    once_per_turn: true
    active_when: { all_turns: true }
    trigger_if:
      event_target_kind: digimon
    summary: "[All Turns][OPT] When any of your Digimon are played, return opponent's lowest-level Digimon to deck bottom"
    process:
      - select_opponent_permanent:
          bind_as: bottom_target
          filter:
            all_of:
              - kind: digimon
              - level_matches_aggregate: { selector: lowest_level, of: opponent }
          prompt: "Return 1 of your opponent's lowest level Digimon to the bottom of the deck"
      - return_to_deck: { target: bottom_target, position: bottom }

  - kind: replacement
    trigger: when_would_leave_battle_area
    once_per_turn: true
    optional: true
    active_when:
      all_of:
        - all_turns: true
        - replacement_subject_is_mine: true
        - kind: digimon
    summary: "[All Turns][OPT] When any own Digimon would leave, play 1 level 5 or lower [SW] from hand or this Digimon's sources free"
    # DCGO EX12_034.cs ActivateCoroutine: offers "Play from hand" only when the
    # hand holds a playable card, "Play from this Digimon's Digivolution Cards"
    # only when its sources do, plus "Don't play"; if nothing is played the
    # [Once Per Turn] use is refunded (RemoveUse). Deck audit 2026-11-10: both
    # zones were always offered and the OPT was spent on an empty pick.
    # The card pick inside a zone is mandatory: DCGO lets you decline it
    # (PlayByEffect canNoSelect) and then refunds, which is the same outcome
    # as "Don't play"; an optional pick here ended the clause before the
    # refund ran.
    process:
      - select_effect_choice:
          bind_as: play_zone
          labels: ["Hand", "Sources", "Don't play"]
          legal_when:
            - count_gte:
                filter:
                  of: you
                  zone: [hand]
                  all_of:
                    - kind: digimon
                    - level_lte: 5
                    - trait_has: SW
                n: 1
            - count_gte:
                filter:
                  of: you
                  zone: [material]
                  all_of:
                    - kind: digimon
                    - level_lte: 5
                    - trait_has: SW
                n: 1
            - all_turns: true
          prompt: "Play a level 5 or lower [SW] card from hand or this Digimon's digivolution cards?"
      - if:
          condition: { equals: [play_zone, 0] }
          then:
            - select_hand:
                of: you
                bind_as: sw_hand
                filter:
                  all_of:
                    - kind: digimon
                    - level_lte: 5
                    - trait_has: SW
                prompt: "Play 1 level 5 or lower [SW] Digimon from hand without paying the cost"
            - play_from_hand_free: { of: you, hand_index: sw_hand }
      - if:
          condition: { equals: [play_zone, 1] }
          then:
            - select_material:
                of_permanent: source
                bind_as: sw_source
                filter:
                  all_of:
                    - kind: digimon
                    - level_lte: 5
                    - trait_has: SW
                prompt: "Play 1 level 5 or lower [SW] Digimon from this Digimon's sources without paying the cost"
            - play_from_materials:
                target: source
                source_index: sw_source
                cost_delta: free
      - if:
          condition:
            all_of:
              - binding_absent: sw_hand
              - binding_absent: sw_source
          then:
            - refund_opt: {}
