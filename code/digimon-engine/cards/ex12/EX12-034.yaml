card: EX12-034
name: Erlangmon
kind: digimon
level: 6
color: [blue, black]
cost: 12
dp: 12000
traits: [Shaman, Saneiketsu, Tentei Hachibushu, Shambala, SW]
attribute: Vaccine  # card face: Mega | Vaccine | .../Shambala/SW (cards.json said Data)

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: blue }
    cost: 4
  - kind: digivolve
    from: { level_eq: 5, color_is: black }
    cost: 4
  - kind: digivolve
    from: { level_eq: 5, trait_has: Shambala }
    cost: 3

effects:
  - when: [on_play, when_digivolving]
    optional: true
    summary: "[On Play][When Digivolving] You may play 1 [Kotenken] Token"
    process:
      - play_token:
          controller: you
          token_name: kotenken

  - when: on_ally_played
    once_per_turn: true
    active_when: { all_turns: true }
    trigger_if:
      event_target_kind: digimon
    summary: "[All Turns][OPT] When any of your Digimon are played, return opponent's lowest-level Digimon to deck bottom"
    process:
      - select_opponent_permanent:
          bind_as: bottom_target
          filter:
            all_of:
              - kind: digimon
              - level_matches_aggregate: { selector: lowest_level, of: opponent }
          prompt: "Return 1 of your opponent's lowest level Digimon to the bottom of the deck"
      - return_to_deck: { target: bottom_target, position: bottom }

  - kind: replacement
    trigger: when_would_leave_battle_area
    once_per_turn: true
    optional: true
    active_when:
      all_of:
        - all_turns: true
        - replacement_subject_is_mine: true
        - kind: digimon
    summary: "[All Turns][OPT] When any own Digimon would leave, play 1 level 5 or lower [SW] from hand or this Digimon's sources free"
    # DCGO EX12_034.cs ActivateCoroutine: offers "Play from hand" only when the
    # hand holds a playable card, "Play from this Digimon's Digivolution Cards"
    # only when its sources do, plus "Don't play". Here the clause is
    # `optional: true` ("you may play"), so the player first accepts or
    # declines the replacement. Declining keeps the [Once Per Turn] (official
    # Q1818). Accepting is choosing to activate, so it uses the [Once Per Turn]
    # even if "Don't play" is then chosen or nothing is playable: CR 4.3
    # 15-14-1-4, "even if the effect's processing can't be executed". DCGO
    # refunds that use (RemoveUse when nothing was played); the rules text
    # decides, so there is no refund here (bug scan: 4 turns over the cap).
    # Both the zone offer and the pick use DCGO's CanSelectCardCondition
    # (EX12_034.cs:146-152), which requires CanPlayAsNewPermanent(payCost:
    # false): a card under a play prohibition or with no free frame is never
    # offered, and a zone holding only such cards is not offered.
    # The card pick inside a zone is mandatory: "Don't play" is the one
    # opt-out after accepting (DCGO also lets you decline the pick,
    # PlayByEffect canNoSelect, with the same outcome).
    process:
      - select_effect_choice:
          bind_as: play_zone
          labels: ["Hand", "Sources", "Don't play"]
          legal_when:
            - count_gte:
                filter:
                  of: you
                  zone: [hand]
                  all_of:
                    - kind: digimon
                    - level_lte: 5
                    - trait_has: SW
                    - can_play_from_effect_without_cost: true
                n: 1
            - count_gte:
                filter:
                  of: you
                  zone: [material]
                  all_of:
                    - kind: digimon
                    - level_lte: 5
                    - trait_has: SW
                    - can_play_from_effect_without_cost: true
                n: 1
            - all_turns: true
          prompt: "Play a level 5 or lower [SW] card from hand or this Digimon's digivolution cards?"
      - if:
          condition: { equals: [play_zone, 0] }
          then:
            - select_hand:
                of: you
                bind_as: sw_hand
                filter:
                  all_of:
                    - kind: digimon
                    - level_lte: 5
                    - trait_has: SW
                    - can_play_from_effect_without_cost: true
                prompt: "Play 1 level 5 or lower [SW] Digimon from hand without paying the cost"
            - play_from_hand_free: { of: you, hand_index: sw_hand }
      - if:
          condition: { equals: [play_zone, 1] }
          then:
            - select_material:
                of_permanent: source
                bind_as: sw_source
                filter:
                  all_of:
                    - kind: digimon
                    - level_lte: 5
                    - trait_has: SW
                    - can_play_from_effect_without_cost: true
                prompt: "Play 1 level 5 or lower [SW] Digimon from this Digimon's sources without paying the cost"
            - play_from_materials:
                target: source
                source_index: sw_source
                cost_delta: free
