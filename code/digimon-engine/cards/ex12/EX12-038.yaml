# EX12-038 Kokuwamon — Digimon, Lv.3, Yellow, DP 2000, Cost 3.
# Traits: Machine, ME. Attribute: Data. Digivolve: Yellow Lv.2 / 0;
# Lv.2 with an [ME] trait / 0.
#
# Printed text (data/cards.json, DCGO EX12_038.cs):
#   [On Play] By trashing 1 card with the [Mutant] or [ME] trait from your
#   hand, <Draw 2>.
#   Inherited: [When Attacking] [Once Per Turn] 1 of your opponent's Digimon
#   gets -2000 DP for the turn.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/EX12/Yellow/EX12_038.cs
#   On Play: isSkippable, hand pick canNoSelect:true (Mode.Discard), Draw 2 only
#   if trashed. Inherited: OnAllyAttack, OPT (hash EX12_038_Inherited), the
#   target pick is mandatory (canNoSelect:false), -2000 UntilEachTurnEnd.

card: EX12-038
name: Kokuwamon
kind: digimon
level: 3
color: [yellow]
cost: 3
dp: 2000
traits: [Machine, ME]
attribute: Data

alt_paths:
  # Printed split circle: Yellow|Black Lv.2 / cost 0 — one entry per colour.
  - kind: digivolve
    from: { level_eq: 2, color_is: yellow }
    cost: 0
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 0
  - kind: digivolve
    from:
      any_color: true
      all_of:
        - level_eq: 2
        - trait_has: ME
    cost: 0

effects:
  - when: on_play
    condition:
      count_gte:
        filter:
          of: you
          zone: [hand]
          any_of:
            - trait_has: Mutant
            - trait_has: ME
        n: 1
    summary: "[On Play] By trashing 1 [Mutant]/[ME] trait card from your hand, <Draw 2>"
    process:
      - select_hand:
          of: you
          bind_as: discard
          optional: true
          cost: true
          filter:
            any_of:
              - trait_has: Mutant
              - trait_has: ME
          prompt: "Trash 1 [Mutant]/[ME] trait card from your hand to <Draw 2>"
      - if:
          condition: { binding_present: discard }
          then:
            - trash_from_hand_by_index: { of: you, hand_index: discard }
            - draw: { of: you, count: 2 }

  - scope: inherited
    when: when_attacking
    once_per_turn: true
    active_when: { your_turn: true }
    summary: "[Inherited][When Attacking][OPT] 1 of your opponent's Digimon gets -2000 DP for the turn"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: dp_target
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to get -2000 DP for the turn"
      - add_dp_modifier:
          target: dp_target
          value: -2000
          expiry: end_of_turn
