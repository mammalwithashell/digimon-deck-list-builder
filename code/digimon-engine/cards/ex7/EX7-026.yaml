card: EX7-026
name: Starmon
kind: digimon
level: 4
color: [yellow]
cost: 4
dp: 4000
traits: [Mutant, NSp, Data]
alt_paths:
  - kind: digivolve
    from: { all_of: [{level_eq: 3}, {color_is: yellow}] }
    cost: 2
  - kind: digivolve
    from: { any_color: true, all_of: [{level_eq: 3}, {trait_has: NSp}] }
    cost: 2
effects:
  - text: "[On Play] [When Digivolving] 1 of your opponent's Digimon gets -3000 DP for the turn."
    when: [on_play, when_digivolving]
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter: {kind: digimon}
          prompt: "1 opponent Digimon gets -3000 DP for the turn"
      - add_dp_modifier: {target: target, value: -3000, expiry: end_of_turn}
  - text: "＜Barrier＞ (When this Digimon would be deleted in battle, by trashing your top security card, it isn't deleted.)"
    kind: grant_keyword
    scope: inherited
    keyword: Barrier
