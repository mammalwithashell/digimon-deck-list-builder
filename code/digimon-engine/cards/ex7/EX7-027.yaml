card: EX7-027
name: Chaperomon
kind: digimon
level: 5
color: [yellow]
cost: 7
dp: 7000
traits: [Puppet, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: yellow }
    cost: 3

effects:
  - kind: grant_keyword
    keyword: Overclock
    overclock_cost_filter:
      any_of:
        - kind: token
        - all_of:
            - kind: digimon
            - trait_has: Puppet

  - when: when_digivolving
    optional: true
    summary: "You may play 1 level 3 Puppet Digimon from hand free"
    process:
      - select_hand:
          of: you
          bind_as: pick
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_eq: 3
              - trait_has: Puppet
          prompt: "Play 1 level 3 Puppet Digimon from hand"
      - play_from_hand_free: { of: you, hand_index: pick }

  - kind: replacement
    scope: inherited
    trigger: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    active_when:
      all_of:
        - replacement_subject_is_mine: true
        - kind: digimon
        - none_of:
            - replacement_cause: own_effect
    summary: "[All Turns][OPT] Delete 1 Token or other Puppet Digimon so this Digimon doesn't leave"
    process:
      - select_own_permanent:
          bind_as: prevent_cost
          filter:
            all_of:
              - other: true
              - any_of:
                  - kind: token
                  - all_of:
                      - kind: digimon
                      - trait_has: Puppet
          prompt: "Delete 1 of your Tokens or other Puppet Digimon"
      - delete_permanent: { target: prevent_cost }
      - cancel_replacement: {}
