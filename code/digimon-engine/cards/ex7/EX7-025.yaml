        n: 1
    process:
      - select_hand:
          of: you
          bind_as: arisa
          optional: true
          filter: { name_contains: "Arisa Kinosaki" }
          prompt: "Play 1 Arisa Kinosaki from hand"
      - play_from_hand_free: { of: you, hand_index: arisa }

