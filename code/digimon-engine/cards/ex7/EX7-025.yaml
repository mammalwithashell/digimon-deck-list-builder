card: EX7-025
name: ShoeShoemon
kind: digimon
level: 4
color: [yellow]
cost: 4
dp: 4000
traits: [Puppet, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 2

effects:
  - when: when_digivolving
    optional: true
    summary: "If you have 1 or fewer Tamers, you may play Arisa Kinosaki from hand free"
    condition:
      count_lte:
        filter: { of: you, zone: [battle_area], kind: tamer }
        n: 1
    process:
      - select_hand:
          of: you
          bind_as: arisa
          optional: true
          filter: { name_contains: "Arisa Kinosaki" }
          prompt: "Play 1 Arisa Kinosaki from hand"
      - play_from_hand_free: { of: you, hand_index: arisa }

  # Inherited [Your Turn] "All of your opponent's security Digimon get -3000 DP".
  # PUPPETS-G008: lowers via `applies_to_opponent_security_dp: true` to
  # `EffectBuilder::applies_to_opponent_security_dp()` so the -3000 DP rides
  # under the attacker's stack and surfaces during the security battle.
  - kind: aura
    scope: inherited
    active_when: { your_turn: true }
    dp_modifier: -3000
    applies_to_opponent_security_dp: true
    summary: "[Inherited][Your Turn] All opponent security Digimon get -3000 DP"
