# EX1-014 ExVeemon — Digimon, Lv.4, Blue, DP 4000, Cost 5.
# Traits: Mythical Dragon
# Evo: Lv.3 Blue / cost 2 (printed evo_costs; standard path, not an alt_path).
#
# Printed card text (cards.json effect_description_eng):
#   ＜Jamming＞ (This Digimon can't be deleted in battles against Security Digimon.)
#
# Inherited effect text:
#   [Your Turn] While this Digimon has [Imperialdramon] in its name or [Free]
#   trait, it gains ＜Jamming＞
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/EX1/Blue/EX1_014.cs
#
# ─── Clause layout ────────────────────────────────────────────────────────────
#
#   Clause 0:  ＜Jamming＞ (face-up printed keyword)              IMPLEMENTED
#   Clause 1:  [Inherited][Your Turn] conditional Jamming aura    IMPLEMENTED
#              - name arm (carrier has [Imperialdramon] in name): IMPLEMENTED
#              - trait arm (carrier top card has [Free] trait):   IMPLEMENTED
#
# ─── Clause 0 — ＜Jamming＞ (face-up) ────────────────────────────────────────
#
# Printed: "＜Jamming＞ (This Digimon can't be deleted in battles against
# Security Digimon.)"
# DCGO: JammingSelfStaticEffect(isInheritedEffect: false, card: card,
#   condition: null).
# DSL: `kind: grant_keyword / keyword: Jamming` — unconditional face-up grant.
# Identical lowering to BT23-018 Garurumon Clause 1 and AD1-010 Clause 3
# (face-up form).
#
# ─── Clause 1 — [Inherited][Your Turn] conditional ＜Jamming＞ ───────────────
#
# Printed: "[Your Turn] While this Digimon has [Imperialdramon] in its name or
# [Free] trait, it gains ＜Jamming＞"
#
# DCGO (EX1_014.cs, EffectTiming.None, JammingSelfStaticEffect,
#   isInheritedEffect: true):
#   condition():
#     IsExistOnBattleArea(card)
#     && IsOwnerTurn(card)
#     && (card.PermanentOfThisCard().TopCard.ContainsCardName("Imperialdramon")
#         || card.PermanentOfThisCard().TopCard.CardTraits.Contains("Free"))
#
# ─── Name arm: source_name_contains ──────────────────────────────────────────
#
# `source_name_contains: "Imperialdramon"` reads the carrier's name: its TOP
# card's rules name (synthesized identity) — DCGO
# `TopCard.ContainsCardName("Imperialdramon")`. Official Q&A Q3225 (EX1-038,
# the same "[Imperialdramon] in its name or [Free] in its traits" shape)
# treats the name as the top card's: once the top card is trashed the Digimon
# is "without ... [Imperialdramon] in its name". FIX
# (G-DSL-CARRIER-NAME-READS-DIGIVOLUTION-CARDS, 2026-10-17): was
# `self_digivolution_contains_name`, which also scanned the digivolution cards
# and over-granted <Jamming> when an [Imperialdramon] card sat under a
# non-Imperialdramon top card.
#
# DSL lowering: `scope: inherited / kind: aura` with `target: {}` so the keyword
# applies only to the carrier permanent whose stack contains this card.
#
# ─── Trait arm: [Free] trait ─────────────────────────────────────────────────
#
# Implemented through `source_permanent_trait_has: "Free"`, evaluated against
# the carrier permanent's top-card traits from the inherited clause context.

card: EX1-014
name: ExVeemon
kind: digimon
level: 4
color: [blue]
cost: 5
dp: 4000
traits: [Mythical Dragon]

effects:
  # ─── Clause 0 — ＜Jamming＞ (face-up printed keyword) ──────────────────────
  # "This Digimon can't be deleted in battles against Security Digimon."
  # DCGO: JammingSelfStaticEffect(isInheritedEffect: false, condition: null).
  # Unconditional face-up keyword grant.
  - kind: grant_keyword
    keyword: Jamming
    summary: "<Jamming>"

  # ─── Clause 1 — [Inherited][Your Turn] conditional ＜Jamming＞ ──────────────
  #
  # `target: {}` under inherited scope targets the carrier permanent. The
  # active condition mirrors DCGO's owner-turn gate plus carrier top card name
  # or trait checks.
  - scope: inherited
    kind: aura
    active_when:
      all_of:
        - your_turn: true
        - any_of:
            - source_name_contains: "Imperialdramon"
            - source_permanent_trait_has: "Free"
    target: {}
    grant_keyword: { keyword: Jamming }
    summary: "[Inherited][Your Turn] Carrier gains Jamming while it has Imperialdramon in its name or the Free trait"
