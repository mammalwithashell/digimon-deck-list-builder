# BT25-049 Armalizamon — Digimon, Lv.4, Green, DP 4000, Cost 4.
# Traits: Reptile, Glowing Dawn, BEATBREAK. Standard digivolution: Lv.3 green / cost 2.
#
# Printed card text (data/cards.json — verbatim, confirmed vs DCGO):
#   [On Play] [When Digivolving] You may suspend 1 of your opponent's Digimon.
#   [Your Turn] [Once Per Turn] When you would use an Option card with the
#     [Glowing Dawn] trait, by trashing the bottom face-down card under any of
#     your Tamers, reduce the cost by 3.
#   Inherited: ＜Piercing＞ (When this Digimon attacks and deletes an opponent's
#     Digimon in battle, it checks security before the attack ends.)
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT25/Green/BT25_049.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
#
# Alt-digivolve — AddSelfDigivolutionRequirementStaticEffect(level: 3, TopCard
#   HasGlowingDawnTraits, cost 2). → alt_paths digivolve from level 3 + Glowing
#   Dawn trait, cost 2.
# Clause 1 (shared OP/WD, optional select canNoSelect: true): SelectPermanent
#   Mode.Tap over opponent Digimon. → optional select_opponent_permanent
#   { kind: digimon } + suspend.
# Clause 2 (BeforePayCost) — NOW IMPLEMENTED (2026-06-15):
#   "[Your Turn][Once Per Turn] When you would USE a [Glowing Dawn] Option card,
#   by trashing the bottom face-down card under any Tamer, reduce the cost by 3."
#   DCGO ActivateClass keyed on CanTriggerWhenPermanentWouldPlay(CardCondition =
#   HasUseCost && HasGlowingDawnTraits && owner), gated IsOwnerTurn + a Tamer
#   carrying a face-down source; SetIsSkippable(true) + the Tamer pick
#   `canNoSelect: CanNoSelect(...)` → the player may decline to pay → no
#   reduction, so the reducer is modelled `optional: true` (the accept gate IS
#   DCGO's skippable/can-no-select decline, exposed to the RL action space).
#   maxCountPerTurn 1 → once_per_turn. Payoff ChangeCost -3 over the Glowing-Dawn
#   Option being used.
#   → kind: cost_reduction + when_any_ally_played { kind: option, trait_has:
#     Glowing Dawn } + active_when { your_turn } + optional + once_per_turn +
#     amount 3 + pay_cost [trash_bottom_face_down_source_under_tamer]. The
#     `kind: option` filter scopes the trigger to Option-USE (a digivolve/play
#     of a Digimon never carries an Option cost-target). The interactive pay_cost
#     parks; the engine credits the -3 behind the parked pay_cost on the
#     Option-use path (game_actions/options.rs::
#     try_prompt_interactive_option_use_cost_reducer,
#     G-COST-REDUCTION-INTERACTIVE-PAY-COST closed for the Option-use path).
# Inherited (OnDetermineDoSecurityCheck): PierceSelfEffect(isInheritedEffect) →
#   scope: inherited + grant_keyword Piercing.

card: BT25-049
name: "Armalizamon"
kind: digimon
level: 4
color: [green]
cost: 4
dp: 4000
traits: [Reptile, Glowing Dawn, BEATBREAK]

# Alt-digivolve: Lv.3 with the [Glowing Dawn] trait / cost 2.
alt_paths:
  - kind: digivolve
    from:
      all_of:
        - level_eq: 3
        - trait_has: "Glowing Dawn"
    cost: 2

effects:
  # ─── [On Play][When Digivolving] You may suspend 1 opponent Digimon ────────
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] You may suspend 1 of your opponent's Digimon"
    process:
      - select_opponent_permanent:
          bind_as: tgt
          optional: true
          filter:
            all_of:
              - kind: digimon
              - is_suspended: false
          prompt: "You may suspend 1 of your opponent's Digimon"
      - suspend: { target: tgt }

  # ─── [Your Turn][Once Per Turn] When you would use a [Glowing Dawn] Option,
  #     by trashing a bottom face-down card under a Tamer, reduce the cost by 3 ─
  - kind: cost_reduction
    reduction_timing: before_pay_cost
    active_when: { your_turn: true }
    when_any_ally_played:
      all_of:
        - kind: option
        - trait_has: "Glowing Dawn"
    optional: true
    once_per_turn: true
    amount: 3
    pay_cost:
      - trash_bottom_face_down_source_under_tamer: { of: you }
    summary: "[Your Turn][Once Per Turn] When you would use a [Glowing Dawn] Option card, by trashing a bottom face-down card under a Tamer, reduce the cost by 3"

  # ─── Inherited <Piercing> ──────────────────────────────────────────────────
  - scope: inherited
    kind: grant_keyword
    keyword: Piercing
    summary: "Inherited <Piercing>"
