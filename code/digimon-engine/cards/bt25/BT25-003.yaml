# BT25-003 Frimon — Digi-Egg, Lv.2, Yellow, Cost 0.
# Traits: Lesser, Glowing Dawn, BEATBREAK. Form: In-Training.
#
# Printed card text (official bundle data/card_bundles/BT25-003.md):
#   The FACE has NO effect.
#   Inherited Effect [When Attacking] [Once Per Turn] By trashing your top
#     security card, this Digimon may digivolve into a [Glowing Dawn] trait card
#     in the hand with the cost reduced by 1.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT25/Yellow/BT25_002.cs —
#   the file is misnamed; it holds `class BT25_003` (`// Frimon`). Inherited
#   OnAllyAttack clause:
#   - SetUpActivateClass(CanActivateCondition, ActivateCoroutine, 1, true, ...)
#     → [Once Per Turn], optional (the initial Yes/No is the opt-in to pay the
#     "By trashing your top security card" condition);
#   - CanActivateCondition = IsExistOnBattleAreaDigimon && SecurityCards.Any()
#     — ONLY the cost's payability; no payoff check;
#   - ActivateCoroutine: IDestroySecurity(fromTop: true) unconditionally, then
#     if a [Glowing Dawn] card is in hand, DigivolveIntoHandOrTrashCard(payCost:
#     true, reduceCostTuple: (1, null), isHand: true). That helper's pick is
#     optional (isOptional = true → canNoSelect) and offers only IsDigimon &&
#     cardCondition && !CanNotEvolve(target) && CanPlayCardTargetFrame(PayCost:
#     true, ...) (Script/CardEffectCommons.cs:859-881).
#
# ─── Clause crosscheck (CR 4.3) ──────────────────────────────────────────────
#
# Inherited [When Attacking][Once Per Turn]:
#   - "By trashing your top security card" — an optional processing condition
#     (15-7-1): `optional: true`, and the trash is the first body step, so the
#     outer accept/decline prompt is the opt-in. Declining drops the effect
#     before its [Once Per Turn] use is recorded (DCGO skippable Yes/No).
#   - 15-7-4: with no security card the condition can't be executed and can't
#     be chosen → `security_count_gte: 1` (the clause's only gate).
#   - 15-7-5: the player may trash the top security card even when the
#     digivolve after it can't be executed (no [Glowing Dawn] Digimon in hand,
#     or none payable). The trash is NOT gated on a payoff — it is a real,
#     game-changing choice (e.g. it fires "when security is removed" effects).
#   - 15-7-2: the digivolve only happens after the trash was executed.
#   - "this Digimon may digivolve into a [Glowing Dawn] trait card in the hand"
#     — still optional after paying (optional select_hand, DCGO canNoSelect).
#     The candidates are only cards that can digivolve onto this Digimon and
#     whose cost reduced by 1 can be paid (CR 4.3 1-3-11-1; DCGO helper filter).
#   - "with the cost reduced by 1" — paid digivolution cost minus 1; honors
#     digivolution requirements, so cost: { reduce: 1 }, ignore_requirements
#     stays false. target: source = the carrier the egg sits beneath.

card: BT25-003
name: "Frimon"
kind: digi_egg
level: 2
color: [yellow]
cost: 0
traits: [Lesser, Glowing Dawn, BEATBREAK]
form: In-Training

effects:
  # ─── Inherited [When Attacking][OPT] By trashing your top security card,
  #     may digivolve into a [Glowing Dawn] hand card with the cost reduced by 1
  - scope: inherited
    when: when_attacking
    once_per_turn: true
    # The opt-in to pay "By trashing your top security card" (CR 4.3 15-7-1).
    optional: true
    # CR 4.3 15-7-4: choosable only when a security card exists. No payoff
    # gate (15-7-5; DCGO CanActivateCondition).
    condition: { security_count_gte: 1 }
    summary: "Inherited [When Attacking][OPT] By trashing your top security card, may digivolve into a [Glowing Dawn] hand card with the cost reduced by 1"
    process:
      # "By trashing your top security card" — executed once the player opts in.
      - trash_top_security: { of: you }
      # "this Digimon may digivolve into a [Glowing Dawn] trait card in the
      # hand" — optional pick; only cards that meet the digivolution
      # requirements onto this Digimon AND whose cost reduced by 1 is payable
      # (CR 4.3 1-3-11-1; DCGO DigivolveIntoHandOrTrashCard filter).
      - select_hand:
          of: you
          bind_as: gd_evo
          optional: true
          filter:
            trait_has: "Glowing Dawn"
            can_digivolve_onto_with_cost: { target: source, cost: { reduce: 1 } }
          prompt: "Digivolve into a [Glowing Dawn] trait card in your hand with the cost reduced by 1"
      - if:
          condition: { binding_present: gd_evo }
          then:
            # "with the cost reduced by 1" — paid, requirements honored.
            - effect_initiated_digivolve:
                target: source
                from_hand: gd_evo
                cost: { reduce: 1 }
