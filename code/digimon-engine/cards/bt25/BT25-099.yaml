# BT25-099 Gear Forest Village — Option, Green/Black, Cost 3.
# Traits: Iliad, TS.
#
# Printed card text (data/cards.json effect_description_eng — verbatim):
#
#   While you have no face-up security cards, you can ignore this card's color
#   requirements.
#   [Security] [Your Turn] All of your green or black [TS] trait Digimon gain
#   ＜Alliance＞ (When this Digimon attacks, by suspending 1 of your other
#   Digimon, add the suspended Digimon's DP to this Digimon and it gains
#   ＜Security A. +1＞ for the attack.) While you have [Bacchusmon] or [Ceresmon],
#   they also gain ＜Piercing＞ (When this Digimon attacks and deletes an
#   opponent's Digimon in battle, it checks security before the attack ends.)
#   [Main] Add your bottom security card to the hand and place this card face up
#   as the bottom security card. Then, you may play 1 green or black [TS] trait
#   Digimon card from your hand with the cost reduced by 3.
#
# Inherited (Security) effect (inherited_effect_description_eng):
#   [Security] You may play 1 level 4 or lower green or black [TS] trait Digimon
#   card from your hand or trash without paying the cost.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT25/Green/BT25_099.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
#
# Sister of BT25-095 (Paradise Colosseum) / BT25-094 (Cosmic Area). Structure
# is identical; the differences are: target colours (green/black), the security
# aura grants <Alliance> (combat keyword), and the conditional security keyword
# is <Piercing> gated on Bacchusmon / Ceresmon.
#
# Region "Ignore Color Requirement" (None): IgnoreColorConditionClass gated on
#   `owner.SecurityCards.Count(!IsFlipped) == 0`. → `kind: flood_gate`,
#   `modifier: IgnoreColorRequirement`, `target: { card_number_is: BT25-099 }`,
#   `active_when: { face_up_security_count_lte: 0 }`. Mirrored on `use_requirement`.
#
# Region "Alliance" (OnAllyAttack): AllianceStaticEffect over owner battle-area
#   Digimon that are (Green || Black) && HasTSTraits, gated on in-security. →
#   `kind: aura`, `scope: security`, `grant_keyword: Alliance`, target
#   green/black TS own battle-area Digimon. (Alliance is a `has_keyword`-gated
#   combat keyword — the aura grant suffices.)
#
# Region "Piercing" (None): PiercingStaticEffect over the same target set, gated
#   on in-security AND owner has a permanent named "Bacchusmon" OR "Ceresmon". →
#   `kind: aura`, `scope: security`, `grant_keyword: Piercing`, same target,
#   plus an `active_when` existential for a Bacchusmon/Ceresmon-named own
#   permanent. (Piercing is also a `has_keyword`-gated combat keyword.)
#
# Region "Main Effect" (OptionSkill): ReplaceBottomSecurityWithFaceUpOption-
#   Effect(card) then SelectHandEffect over green/black TS Digimon, PlayForCost
#   with reduced cost (3, null), canNoSelect: true. (BT25-095 idiom.)
#
# Region "Security Effect" (SecuritySkill): SelectHand/SelectCard over level 4-
#   green/black TS Digimon from hand OR trash, PlayForFree, canNoSelect: true.
#   (BT25-095 idiom.)
#
# ─── Implementation status (faithfulness diff) ───────────────────────────────
#
# | Card-text element                                                  | Status |
# |--------------------------------------------------------------------|--------|
# | Ignore colour requirements while no face-up security               | IMPLEMENTED (use_requirement + flood_gate) |
# | [Security][Your Turn] green/black TS gain <Alliance>               | IMPLEMENTED (security aura grant_keyword Alliance) |
# | [Security][Your Turn] + <Piercing> while Bacchusmon/Ceresmon       | IMPLEMENTED (security aura grant_keyword Piercing, conditional) |
# | [Main] add bottom sec to hand + place self face-up + play green/black TS -3 | IMPLEMENTED (add_bottom_security_to_hand + place_self_option_at_security + play_from_hand reduce 3) |
# | [Security][Inherited] play lvl4- green/black TS from hand/trash free | IMPLEMENTED (select_union_zone + play_union_bound_free) |

card: BT25-099
name: "Gear Forest Village"
kind: option
color: [green, black]
cost: 3
traits: [Iliad, TS]

use_requirement:
  face_up_security_count_lte: 0

effects:
  # ─── Color-ignore floodgate (no face-up security) ──────────────────────────
  - kind: flood_gate
    active_when:
      face_up_security_count_lte: 0
    modifier: IgnoreColorRequirement
    target: { card_number_is: "BT25-099" }
    summary: "While you have no face-up security cards, ignore color requirements for this card"

  # ─── [Security][Your Turn] green/black TS gain <Alliance> ──────────────────
  - kind: aura
    scope: security
    active_when: { all_turns: true }
    target:
      owner: you
      zone: [battle_area]
      kind: digimon
      trait_has: TS
      any_of:
        - color_is: green
        - color_is: black
    grant_keyword: { keyword: Alliance }
    summary: "[Security][Your Turn] Your green/black [TS] Digimon gain <Alliance>"

  # ─── [Security][Your Turn] + <Piercing> while Bacchusmon or Ceresmon ───────
  - kind: aura
    scope: security
    active_when:
      all_of:
        - all_turns: true
        - any_permanent:
            of: you
            zone: [battle_area]
            kind: digimon
            any_of:
              - name_is: "Bacchusmon"
              - name_is: "Ceresmon"
    target:
      owner: you
      zone: [battle_area]
      kind: digimon
      trait_has: TS
      any_of:
        - color_is: green
        - color_is: black
    grant_keyword: { keyword: Piercing }
    summary: "[Security][Your Turn] With Bacchusmon or Ceresmon, your green/black [TS] Digimon gain <Piercing>"

  # ─── [Main] replace bottom security with self + play green/black TS -3 ─────
  - when: main_from_hand
    summary: "[Main] Add bottom security to hand, place this face-up as bottom security, then may play a green/black TS Digimon for -3"
    process:
      - add_bottom_security_to_hand: { of: you }
      - place_self_option_at_security:
          position: bottom
          face: up
      - select_hand:
          of: you
          bind_as: picked_digimon
          optional: true
          filter:
            all_of:
              - kind: digimon
              - trait_has: TS
              - any_of:
                  - color_is: green
                  - color_is: black
          prompt: "You may play 1 green or black [TS] Digimon card from hand with the play cost reduced by 3"
      - play_from_hand:
          of: you
          hand_index: picked_digimon
          cost_delta: { reduce: 3 }

  # ─── [Security][Inherited] play lvl4- green/black TS from hand/trash free ───
  - scope: inherited
    when: on_security
    optional: true
    summary: "[Security][Inherited] You may play 1 level 4 or lower green/black TS Digimon from hand or trash free"
    process:
      - select_union_zone:
          of: you
          zones: [hand, trash]
          bind_as: picked
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_lte: 4
              - trait_has: TS
              - any_of:
                  - color_is: green
                  - color_is: black
          prompt: "You may play 1 level 4 or lower green or black [TS] Digimon from hand or trash without paying the cost"
      - play_union_bound_free:
          binding: picked
