# BT25-050 Kiwimon — Digimon, Lv.4, Green, DP 4000, Cost 4.
# Traits: Vegetation, Iliad, TS.
#
# Printed card text (data/cards.json effect_description_eng — verbatim):
#
#   [On Play] [When Digivolving] You may suspend 1 Digimon. Then, if there are
#   2 or more suspended Digimon, 1 of your opponent's Digimon can't unsuspend
#   until their turn ends.
#
# Inherited:
#   [Your Turn] All of your Digimon get +1000 DP.
#
# Printed digivolve box (xros_req): "[Digivolve] Lv.3 w/[TS] trait: Cost 2"
# (cards.json evo_costs empty — the only digivolve path is the alt-source).
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT25/Green/BT25_050.cs
#
# DCGO crosscheck: Region "Shared OP/WD" — Step 1 optional suspend of ANY
# battle-area Digimon (canNoSelect: true). Step 2 gate SuspendedDigimon >= 2
# (both players) AND opp Digimon exists → MANDATORY pick of 1 opp Digimon →
# GainCanNotUnsuspend(UntilOpponentTurnEnd). Region "ESS" (inherited):
# ChangeDPStaticEffect(+1000) over OWNER's Digimon, owner-turn gated.

card: BT25-050
name: Kiwimon
kind: digimon
level: 4
color: [green]
cost: 4
dp: 4000
traits: [Vegetation, Iliad, TS]

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, trait_has: TS }
    cost: 2

effects:
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] May suspend 1 Digimon; then if 2+ suspended Digimon, 1 opp Digimon can't unsuspend until their turn ends"
    process:
      - select_any_permanent:
          bind_as: suspend_target
          optional: true
          filter:
            all_of:
              - kind: digimon
              - zone: [battle_area]
          prompt: "You may suspend 1 Digimon"
      - suspend: { target: suspend_target }
      - if:
          condition:
            count_gte:
              filter:
                all_of:
                  - zone: [battle_area]
                  - kind: digimon
                  - is_suspended: true
              n: 2
          then:
            - select_opponent_permanent:
                bind_as: lock_target
                filter: { kind: digimon }
                prompt: "Choose 1 opponent Digimon that can't unsuspend until end of their turn"
            - add_modifier:
                target: lock_target
                modifier: CannotUnsuspend
                value: 1
                expiry: end_of_opponents_turn

  - kind: aura
    scope: inherited
    active_when: { your_turn: true }
    summary: "Inherited [Your Turn] All of your Digimon get +1000 DP"
    target:
      owner: you
      zone: [battle_area]
      kind: digimon
    dp_modifier: 1000
