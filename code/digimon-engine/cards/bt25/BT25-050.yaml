# BT25-050 Kiwimon — Digimon, Lv.4, Green, DP 4000, Cost 4.
# Traits (official DB): Ancient Bird / Iliad / TS + (Rule) Trait: Has [Vegetation] Type.
# Printed: [On Play][When Digivolving] You may suspend 1 Digimon. Then, if there are 2 or
#   more suspended Digimon, 1 of your opponent's Digimon can't unsuspend until their turn ends.
# Inherited: [Your Turn] All of your Digimon get +1000 DP.
# Digivolve (official DB): standard circle Green Lv.3 / cost 2; alt Lv.3 w/[TS] / cost 2
# (cards.json evo_costs empty; card_overrides carries the green circle).
# DCGO: DCGO/Assets/Scripts/CardEffect/BT25/Green/BT25_050.cs
#   Shared OP/WD: Step1 optional suspend ANY battle-area Digimon (canNoSelect true).
#   Step2 gate SuspendedDigimon>=2 (both players) AND opp Digimon exists -> MANDATORY
#   pick 1 opp Digimon -> GainCanNotUnsuspend(UntilOpponentTurnEnd).
#   ESS inherited: ChangeDPStaticEffect(+1000) over owner Digimon, owner-turn.
#
# The count gate is board-wide ("2 or more suspended Digimon" — DCGO counts both
# players), so its `count_gte` filter carries `owner: any` (count_gte defaults to
# `owner: you`). The earlier "G-ENGINE-IF-AFTER-SELECTION-NOT-RESUMED" BLOCKED
# diagnosis was a misread of exactly this default: the trailing `if` step did run,
# but counted only the controller's suspended Digimon. Fixed 2026-10-03.
card: BT25-050
name: Kiwimon
kind: digimon
level: 4
color: [green]
cost: 4
dp: 4000
traits: [Ancient Bird, Iliad, TS, Vegetation]
alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: green }
    cost: 2
  - kind: digivolve
    from: { level_eq: 3, trait_has: TS }
    cost: 2
effects:
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] May suspend 1 Digimon; then if 2+ suspended Digimon, 1 opp Digimon can't unsuspend until their turn ends"
    process:
      - select_any_permanent:
          bind_as: suspend_target
          optional: true
          # DCGO canNoSelect: a PASS continues to the "2+ suspended" check.
          continue_on_decline: true
          filter:
            all_of:
              - kind: digimon
              - zone: [battle_area]
          prompt: "You may suspend 1 Digimon"
      - suspend: { target: suspend_target }
      - if:
          condition:
            count_gte:
              filter:
                owner: any
                zone: [battle_area]
                kind: digimon
                is_suspended: true
              n: 2
          then:
            - select_opponent_permanent:
                bind_as: lock_target
                filter: { kind: digimon }
                prompt: "Choose 1 opponent Digimon that can't unsuspend until end of their turn"
            - add_modifier:
                target: lock_target
                modifier: CannotUnsuspend
                value: 1
                expiry: end_of_opponents_turn
  - kind: aura
    scope: inherited
    active_when: { your_turn: true }
    summary: "Inherited [Your Turn] All of your Digimon get +1000 DP"
    target:
      owner: you
      zone: [battle_area]
      kind: digimon
    dp_modifier: 1000
