# BT25-050 Kiwimon — Digimon, Lv.4, Green, DP 4000, Cost 4. Traits: Vegetation, Iliad, TS.
# Printed: [On Play][When Digivolving] You may suspend 1 Digimon. Then, if there are 2 or
#   more suspended Digimon, 1 of your opponent's Digimon can't unsuspend until their turn ends.
# Inherited: [Your Turn] All of your Digimon get +1000 DP.
# Digivolve box: Lv.3 w/[TS] / cost 2 (cards.json evo_costs empty).
# DCGO: DCGO/Assets/Scripts/CardEffect/BT25/Green/BT25_050.cs
#   Shared OP/WD: Step1 optional suspend ANY battle-area Digimon (canNoSelect true).
#   Step2 gate SuspendedDigimon>=2 (both players) AND opp Digimon exists -> MANDATORY
#   pick 1 opp Digimon -> GainCanNotUnsuspend(UntilOpponentTurnEnd).
#   ESS inherited: ChangeDPStaticEffect(+1000) over owner Digimon, owner-turn.
#
# KNOWN ENGINE GAP (G-ENGINE-IF-AFTER-SELECTION-NOT-RESUMED): the count-gated lock
# `if` step below DOES NOT FIRE at runtime. When the process resumes after the
# interactive `select_any_permanent` (suspend) resolves, the engine does not execute
# the trailing conditional (`if`) step — so the "Then, if 2+ suspended..." consequence
# is silently skipped. Proven in tests/cards_behavioral/bt25/bt25_050.rs: an
# UNCONDITIONAL lock after the suspend fires correctly; the same lock wrapped in
# `if { count_gte ... }` never installs. The clause is authored faithfully (the
# count gate is REQUIRED — locking unconditionally would lock even with <2 suspended,
# which is unfaithful), and held BLOCKED until the gap closes rather than shipping the
# unconditional (wrong) lock. Gap logged to docs/RUST_ENGINE_GAPS.md.
card: BT25-050
name: Kiwimon
kind: digimon
level: 4
color: [green]
cost: 4
dp: 4000
traits: [Vegetation, Iliad, TS]
alt_paths:
  - kind: digivolve
    from: { level_eq: 3, trait_has: TS }
    cost: 2
effects:
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] May suspend 1 Digimon; then if 2+ suspended Digimon, 1 opp Digimon can't unsuspend until their turn ends"
    process:
      - select_any_permanent:
          bind_as: suspend_target
          optional: true
          filter:
            all_of:
              - kind: digimon
              - zone: [battle_area]
          prompt: "You may suspend 1 Digimon"
      - suspend: { target: suspend_target }
      - if:
          condition:
            count_gte:
              filter:
                all_of:
                  - zone: [battle_area]
                  - kind: digimon
                  - is_suspended: true
              n: 2
          then:
            - select_opponent_permanent:
                bind_as: lock_target
                filter: { kind: digimon }
                prompt: "Choose 1 opponent Digimon that can't unsuspend until end of their turn"
            - add_modifier:
                target: lock_target
                modifier: CannotUnsuspend
                value: 1
                expiry: end_of_opponents_turn
  - kind: aura
    scope: inherited
    active_when: { your_turn: true }
    summary: "Inherited [Your Turn] All of your Digimon get +1000 DP"
    target:
      owner: you
      zone: [battle_area]
      kind: digimon
    dp_modifier: 1000
