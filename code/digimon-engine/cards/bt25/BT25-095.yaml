# BT25-095 Paradise Colosseum — Option, Red/Green, Cost 3.
# Traits: Iliad, TS.
#
# Printed card text (data/cards.json effect_description_eng — verbatim):
#
#   While you have no face-up security cards, you can ignore this card's color
#   requirements.
#   [Security] [All Turns] All of your red or green [TS] trait Digimon get +2000
#   DP. While you have [Marsmon] or [Callismon], they also gain ＜Rush＞ (This
#   Digimon can attack the turn it comes into play.)
#   [Main] Add your bottom security card to the hand and place this card face up
#   as the bottom security card. Then, you may play 1 red or green [TS] trait
#   Digimon card from your hand with the cost reduced by 3.
#
# Inherited (Security) effect (inherited_effect_description_eng):
#   [Security] You may play 1 level 4 or lower red or green [TS] trait Digimon
#   card from your hand or trash without paying the cost.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT25/Red/BT25_095.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
#
# This card is the red/green sister of BT24-090 (Abyss Sanctuary: Throne Room),
# which is blue/yellow. Structure is identical; the differences are: target
# colours (red/green vs blue/yellow), the security aura is +2000 DP (vs Blocker),
# the conditional security keyword is Rush (vs Alliance), gated on Marsmon /
# Callismon (vs Neptunemon / Venusmon), and the Main reduced play is -3.
#
# Region "Ignore Color Requirement" (None): IgnoreColorConditionClass gated on
#   `owner.SecurityCards.Count(!IsFlipped) == 0`. → `kind: flood_gate`,
#   `modifier: IgnoreColorRequirement`, `target: { card_number_is: BT25-095 }`,
#   `active_when: { face_up_security_count_lte: 0 }`. Mirrored on `use_requirement`
#   so the option can be played ignoring colour while no face-up security exists.
#
# Region "All Turns - Security DP" (None): ChangeDPStaticEffect(+2000),
#   permanentCondition = owner battle-area Digimon that are (Red || Green) &&
#   HasTSTraits, gated on `IsExistInSecurity(card, false)` (this card is in the
#   security stack, face-down). → `kind: aura`, `scope: security`,
#   `dp_modifier: 2000`, target red/green TS own battle-area Digimon.
#
# Region "Rush" (None): RushStaticEffect over the same target set, gated on
#   in-security AND owner has a permanent named "Marsmon" OR "Callismon". →
#   `kind: aura`, `scope: security`, `grant_keyword: Rush`, same target, plus an
#   `active_when` existential for a Marsmon/Callismon-named own permanent.
#
# Region "Main Effect" (OptionSkill): ReplaceBottomSecurityWithFaceUpOption-
#   Effect(card) then SelectHandEffect over red/green TS Digimon, PlayForCost
#   with reduced cost (3, null), canNoSelect: true. → `when: main_from_hand`,
#   `add_bottom_security_to_hand` + `place_self_option_at_security` (bottom,
#   face up) + optional `select_hand` (red/green TS Digimon) + `play_from_hand`
#   with `cost_delta: { reduce: 3 }`. (BT24-090 idiom.)
#
# Region "Security Effect" (SecuritySkill): SelectHand/SelectCard over level 4-
#   red/green TS Digimon from hand OR trash, PlayForFree, canNoSelect: true. →
#   `scope: inherited`, `when: on_security`, `optional: true`,
#   `select_union_zone` (hand, trash) + `play_union_bound_free`. (BT24-090 idiom.)
#
# ─── Implementation status (faithfulness diff) ───────────────────────────────
#
# | Card-text element                                                  | Status |
# |--------------------------------------------------------------------|--------|
# | Ignore colour requirements while no face-up security               | IMPLEMENTED (use_requirement + flood_gate) |
# | [Security][All Turns] red/green TS +2000 DP                        | IMPLEMENTED (security aura dp_modifier 2000) |
# | [Security][All Turns] + <Rush> while Marsmon/Callismon             | IMPLEMENTED (security aura grant_keyword Rush, conditional) |
# | [Main] add bottom sec to hand + place self face-up + play red/green TS -3 | IMPLEMENTED (add_bottom_security_to_hand + place_self_option_at_security + play_from_hand reduce 3) |
# | [Security][Inherited] play lvl4- red/green TS from hand/trash free | IMPLEMENTED (select_union_zone + play_union_bound_free) |

card: BT25-095
name: "Paradise Colosseum"
kind: option
color: [red, green]
cost: 3
traits: [Iliad, TS]

use_requirement:
  face_up_security_count_lte: 0

effects:
  # ─── Color-ignore floodgate (no face-up security) ──────────────────────────
  - kind: flood_gate
    active_when:
      face_up_security_count_lte: 0
    modifier: IgnoreColorRequirement
    target: { card_number_is: "BT25-095" }
    summary: "While you have no face-up security cards, ignore color requirements for this card"

  # ─── [Security][All Turns] red/green TS get +2000 DP ───────────────────────
  - kind: aura
    scope: security
    active_when: { all_turns: true }
    target:
      owner: you
      zone: [battle_area]
      kind: digimon
      trait_has: TS
      any_of:
        - color_is: red
        - color_is: green
    dp_modifier: 2000
    summary: "[Security][All Turns] Your red/green [TS] Digimon get +2000 DP"

  # ─── [Security][All Turns] + <Rush> while Marsmon or Callismon ─────────────
  - kind: aura
    scope: security
    active_when:
      all_of:
        - all_turns: true
        - any_permanent:
            of: you
            zone: [battle_area]
            kind: digimon
            any_of:
              - name_is: "Marsmon"
              - name_is: "Callismon"
    target:
      owner: you
      zone: [battle_area]
      kind: digimon
      trait_has: TS
      any_of:
        - color_is: red
        - color_is: green
    grant_keyword: { keyword: Rush }
    summary: "[Security][All Turns] With Marsmon or Callismon, your red/green [TS] Digimon gain <Rush>"

  # ─── [Main] replace bottom security with self + play red/green TS -3 ───────
  - when: main_from_hand
    summary: "[Main] Add bottom security to hand, place this face-up as bottom security, then may play a red/green TS Digimon for -3"
    process:
      - add_bottom_security_to_hand: { of: you }
      - place_on_security:
          source: self_option
          position: bottom
          face_up: true
      - select_hand:
          of: you
          bind_as: picked_digimon
          optional: true
          filter:
            all_of:
              - kind: digimon
              - trait_has: TS
              - any_of:
                  - color_is: red
                  - color_is: green
          prompt: "You may play 1 red or green [TS] Digimon card from hand with the play cost reduced by 3"
      - play_from_hand:
          of: you
          hand_index: picked_digimon
          cost_delta: { reduce: 3 }

  # ─── [Security][Inherited] play lvl4- red/green TS from hand/trash free ────
  - scope: inherited
    when: on_security
    optional: true
    summary: "[Security][Inherited] You may play 1 level 4 or lower red/green TS Digimon from hand or trash free"
    process:
      - select_union_zone:
          of: you
          zones: [hand, trash]
          bind_as: picked
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_lte: 4
              - trait_has: TS
              - any_of:
                  - color_is: red
                  - color_is: green
          prompt: "You may play 1 level 4 or lower red or green [TS] Digimon from hand or trash without paying the cost"
      - play_union_bound_free:
          binding: picked
