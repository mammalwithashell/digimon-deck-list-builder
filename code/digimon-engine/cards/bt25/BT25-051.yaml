# BT25-051 Grizzlymon — Digimon, Lv.4, Green/Yellow, DP 4000, Cost 4.
# Traits: Beast, Iliad, TS. Attribute: Vaccine.
#
# Printed card text (data/cards.json — verbatim):
#
#   ＜Blocker＞ (This Digimon can block in the blocker timing.)
#   [On Play] [When Digivolving] 1 of your Digimon with [Beast], [Animal] or
#   [Sovereign], other than [Sea Animal] trait, in any of its traits or the
#   [Shaman] or [TS] trait gets +3000 DP until your opponent's turn ends.
#
# Inherited Effect:
#   [All Turns] [Once Per Turn] When this Digimon wins a battle, ＜Draw 1＞
#   (Draw 1 card from your deck.)
#
# Digivolve: printed evo_costs list a Lv.3 Green cost-3 alternate path; DCGO adds
# a self digivolution requirement gated on `TopCard.HasTSTraits` at level 3 for
# cost 2 (ignoreDigivolutionRequirement: false).
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT25/Green/BT25_051.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
#
# Clause "Alternative Digivolve Condition" — EffectTiming.None,
#   AddSelfDigivolutionRequirementStaticEffect(TopCard.HasTSTraits, 2, false,
#   level: 3). → alt_paths digivolve from { level_eq: 3, trait_has: TS } cost 2.
#
# Clause "Blocker" — EffectTiming.None BlockerSelfStaticEffect(isInheritedEffect:
#   false). → kind: grant_keyword, keyword: Blocker (self, face-up).
#
# Clause "Shared OP/WD" — ActivateClassesForSharedEffects(onPlay: true,
#   whenDigivolving: true, optional: false). Mandatory (canNoSelect: false):
#   canTargetCondition = own battle-area Digimon with (HasBeastTraits || Shaman
#   || HasTSTraits). After select: ChangeDigimonDP(+3000, UntilOpponentTurnEnd).
#   → when: [on_play, when_digivolving], condition any_permanent (eligible own
#     Digimon exists), select_own_permanent (Beast/Animal/Sovereign not Sea
#     Animal OR Shaman/TS) → add_dp_modifier 3000 expiry: end_of_opponents_turn.
#
# Clause "ESS - Win Battle" — EffectTiming.OnEndBattle, OPT, isInheritedEffect:
#   true, CanTriggerWhenWinBattle → Draw 1. → scope: inherited, when:
#   on_any_deletion, condition: source_deleted_battle_opponent, once_per_turn,
#   draw 1.

card: BT25-051
name: Grizzlymon
kind: digimon
level: 4
color: [green, yellow]
cost: 4
dp: 4000
traits: [Beast, Iliad, TS]
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, trait_has: TS }
    cost: 2

effects:
  # ─── Clause 0: <Blocker> (self) ─────────────────────────────────────────────
  - kind: grant_keyword
    keyword: Blocker

  # ─── Clause 1: [On Play][When Digivolving] +3000 DP until opp turn ends ──────
  - when: [on_play, when_digivolving]
    summary: "[OnPlay/WhenDigivolving] 1 of your [Beast]/[Animal]/[Sovereign] (not [Sea Animal]) or [Shaman]/[TS] Digimon gets +3000 DP until your opponent's turn ends"
    condition:
      any_permanent:
        of: you
        zone: [battle_area]
        kind: digimon
        any_of:
          - all_of:
              - any_of:
                  - trait_has: Beast
                  - trait_has: Animal
                  - trait_has: Sovereign
              - none_of:
                  - trait_has: Sea Animal
          - trait_has: Shaman
          - trait_has: TS
    process:
      - select_own_permanent:
          bind_as: tgt
          filter:
            all_of:
              - kind: digimon
              - any_of:
                  - all_of:
                      - any_of:
                          - trait_has: Beast
                          - trait_has: Animal
                          - trait_has: Sovereign
                      - none_of:
                          - trait_has: Sea Animal
                  - trait_has: Shaman
                  - trait_has: TS
          prompt: "Select 1 of your Digimon to gain +3000 DP until your opponent's turn ends"
      - add_dp_modifier:
          target: tgt
          value: 3000
          expiry: end_of_opponents_turn

  # ─── Clause 2: Inherited [All Turns][OPT] on winning a battle, draw 1 ────────
  - scope: inherited
    when: on_any_deletion
    once_per_turn: true
    condition: { source_deleted_battle_opponent: true }
    summary: "[Inherited][All Turns][OPT] When this Digimon wins a battle, draw 1"
    process:
      - draw: { of: you, count: 1 }
