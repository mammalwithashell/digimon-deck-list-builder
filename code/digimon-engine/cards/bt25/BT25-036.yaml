# BT25-036 Craftmon — Digimon, Lv.4, Yellow, DP 5000, Cost 5.
# Trait line (card image — authoritative): Sup./Appmon | Tool | Design.
#   → traits: ["Sup.", Appmon, Tool, Design], attribute: Tool. ("Sup." is the
#     Appmon Grade: Superior form; convention per BT21-059/070/071.)
#
# Card image (authoritative printed text) + DCGO BT25_036.cs:
#   Digivolve circles (image, 2026-07-10 audit — both cost 2):
#     Circle #1 (yellow ring): "Lv.3 / 2" — standard circle, Yellow Lv.3, cost 2.
#       Official Bandai DB (data/card_bundles/BT25-036.md): "Yellow Lv.3 / cost 2".
#       → alt_paths digivolve from { level_eq: 3, color_is: yellow } cost 2.
#     Circle #2 (rainbow ring): "Stnd. / 2" — grade circle, any-colour [Stnd.]
#       form, cost 2. DCGO AddSelfDigivolutionRequirementStaticEffect(
#       HasStandardAppTraits == EqualsTraits("Stnd."), cost 2) — trait gate
#       ONLY, no level/colour gate.
#       → alt_paths digivolve from { trait_has: "Stnd." } cost 2.
#   [App Fusion] [Kabemon] & [Gomimon] & [Ecomon] & [Puzzlemon]: Cost 0.
#     If 2 such cards are linked together, stack the link card on top and
#     digivolve.
#       → alt_paths app_fusion, materials name_in [Kabemon,Gomimon,Ecomon,
#         Puzzlemon], cost 0. (DCGO AddAppfuseMethodByName.)
#   [Link] [Appmon] trait: Cost 2
#       → kind: link_condition, cost 2, host filter trait_has Appmon.
#   Link box DP: "+3000" (image + official DB "Link DP: DP+3000"; DCGO applies
#     it via the generic LinkEffect factory)
#       → scope: linked, kind: aura, dp_modifier 3000 (BT21-018 §1.2 pattern).
#   [Security] At the end of the battle, play this card without paying the cost.
#       → when: on_security, play_from_security (Digimon after-battle play —
#         same pattern as BT21-015, identical printed text).
#   [On Play] [When Digivolving] Add your top security card to the hand. Then,
#     <Recovery +1>.  (mandatory shared OP/WD effect.)
#       → when: [on_play, when_digivolving]; add_top_security_to_hand + recover 1.
#   [When Linking] By trashing 1 [Appmon] trait card from your hand, <Draw 2>.
#       → scope: linked, when: when_linked; optional cost (trash 1 Appmon) gated
#         payoff draw 2. (DCGO WhenLinked, SetIsLinkedEffect(true), skippable.)
#   (NO inherited clause — the lower box IS the [When Linking] link effect;
#    cards.json's "inherited" field mis-slots it. See in-body NOTE.)
#
# ─── Re-adjudication 2026-06-07 (prior verdict: BLOCKED engine / App Fuse) ────
# App Fusion is now implemented end-to-end (alt_paths app_fusion →
# app_fusion_digivolve_route_for_card → digivolve route that stacks the card on
# top and drains the host's linked cards under it). The prior
# G-DSL-WHEN-LINKED-TIMING block was already resolved (when: when_linked). So
# every printed clause is now faithful — the card is UNBLOCKED.

card: BT25-036
name: Craftmon
kind: digimon
level: 4
color: [yellow]
cost: 5
dp: 5000
# Card image trait line: "Sup./Appmon | Tool | Design" — the Sup. grade and the
# Tool attribute are traits too (dropped by the lossy cards.json ingest; sibling
# convention BT21-059/070/071).
traits: ["Sup.", Appmon, Tool, Design]
attribute: Tool

alt_paths:
  # ─── Printed standard circle: Yellow Lv.3 / Cost 2 ──────────────────────────
  # Card image circle #1 (yellow ring, "Lv.3 / 2"); official Bandai DB
  # (data/card_bundles/BT25-036.md): "Yellow Lv.3 / cost 2".
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 2
  # ─── Printed grade circle: [Stnd.] form / Cost 2 (rainbow — any colour) ─────
  # Card image circle #2 ("Stnd. / 2"). DCGO:
  # AddSelfDigivolutionRequirementStaticEffect(HasStandardAppTraits, cost 2) —
  # HasStandardAppTraits == EqualsTraits("Stnd."); trait gate ONLY (no level or
  # colour gate; the prior `level_eq: 2` was drift).
  - kind: digivolve
    from: { trait_has: "Stnd." }
    cost: 2
  # ─── [App Fusion] Kabemon & Gomimon & Ecomon & Puzzlemon: Cost 0 ───────────
  - kind: app_fusion
    materials:
      - filter:
          name_in: [Kabemon, Gomimon, Ecomon, Puzzlemon]
    cost: 0

effects:
  # ─── Self link-condition: link onto an [Appmon] host for cost 2 ────────────
  - kind: link_condition
    cost: 2
    filter: { trait_has: Appmon }

  # ─── Link box DP: +3000 to the host while this card is linked ───────────────
  # Printed in the link box: "+3000" (official DB "Link DP: DP+3000"). While
  # Craftmon is linked, the host permanent gets +3000 DP. scope:linked aura
  # (target: {} = the host permanent) — BT21-018 / BT25-007 pattern; this was
  # one of the shipped BT25 link cards that omitted the clause (known drift).
  - scope: linked
    kind: aura
    target: {}
    dp_modifier: 3000
    summary: "[Link] +3000 DP to the linked Digimon (host)"

  # ─── [Security] play self for free at end of battle ────────────────────────
  - when: on_security
    summary: "[Security] At the end of the battle, play this card without paying the cost"
    process:
      - play_from_security: {}

  # ─── [On Play][When Digivolving] add top security to hand, then Recovery +1 ─
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Add your top security card to the hand; then <Recovery +1>"
    process:
      - add_top_security_to_hand: { of: you }
      - recover: { of: you, count: 1 }

  # ─── [When Linking] trash 1 [Appmon] from hand → Draw 2 ────────────────────
  # NOTE: the card prints exactly ONE "By trashing 1 [Appmon]... Draw 2" box,
  # prefixed [When Linking] (the linked effect; DCGO `WhenLinked`,
  # `SetIsLinkedEffect(true)`). cards.json's `inherited_effect_description_eng`
  # is a mis-slot of THIS same clause (same pattern as BT25-045) — there is NO
  # separate inherited clause in DCGO, so none is authored here.
  - scope: linked
    when: when_linked
    summary: "[When Linking] By trashing 1 [Appmon] card from your hand, draw 2"
    process:
      - select_hand:
          of: you
          bind_as: trash_pick
          optional: true
          filter: { trait_has: Appmon }
          prompt: "Trash 1 [Appmon] card from your hand to draw 2"
      - if:
          condition: { binding_present: trash_pick }
          then:
            - trash_from_hand_by_index: { of: you, hand_index: trash_pick }
            - draw: { of: you, count: 2 }
