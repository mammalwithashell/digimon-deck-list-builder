# BT25-072 Shutmon — Digimon, Lv.5, Black/Purple, DP 7000, Cost 7.
# Trait line (official Bandai DB / card image): Ult./Appmon | Tool | Forced Termination.
#
# Printed sources: data/card_bundles/BT25-072.md (authoritative) + card image.
# Digivolve circles (card image): one split Black/Purple "Lv.4 / cost 4"
# circle (the official DB lists it as two standard rows: Black Lv.4/4 AND
# Purple Lv.4/4) plus a rainbow-ring "Sup. / cost 3" circle (any colour,
# Appmon Super-grade form gate).
#
# Printed clauses (official bundle + card image + DCGO BT25_072.cs):
#   1. Standard circles: Black Lv.4 / cost 4 AND Purple Lv.4 / cost 4.
#   2. "Sup. / cost 3" circle — DCGO
#      AddSelfDigivolutionRequirementStaticEffect(HasSuperAppTraits, 3);
#      HasSuperAppTraits = EqualsTraits("Sup.") — NO level gate, NO colour
#      gate. (Was mis-authored as { level_eq: 4, trait_has: Super App } —
#      "Super App" matches no production card; the trait merge carries "Sup.".)
#   3. [App Fusion] [Logamon] & [Timemon]: Cost 0 — "If 2 such cards are
#      linked together, stack the link card on top and digivolve."
#      DCGO AddAppfuseMethodByName(["Logamon","Timemon"]). (Previously OMITTED
#      as BLOCKED; the app_fusion alt-play primitive has since landed —
#      BT25-052/BT25-056 precedent.)
#   4. <Link> [Appmon] trait: Cost 3 — DCGO
#      AddSelfLinkConditionStaticEffect(HasAppmonTraits, linkCost 3).
#   5. Link box "DP +4000" — host gets +4000 DP while this card is linked.
#      Applied by DCGO's data-driven link system, not per-card C#; authored as
#      a scope:linked dp aura per pool convention (BT21-009/BT25-056/BT25-061).
#      (Was MISSING.)
#   6. <Jamming> (self, non-inherited).
#   7. Shared [On Play]/[When Digivolving]/[When Attacking] (DCGO optional:
#      false / isSkippable: true — the trigger fires, the link is declinable):
#      "If it's your turn, you may link 1 [Social], [Tool] or [Game] trait
#      Digimon card from your trash or this Digimon's digivolution cards to
#      this Digimon with the cost reduced by 2."
#      → link_cards from [trash, self_sources], cost: { reduce: 2 } (printed
#      "-2" on the linked card's link cost; see LinkCardsCost in
#      digimon-dsl/src/step.rs — was authored `free`, `reduce` is faithful).
#   8. [All Turns] [Once Per Turn] "When this Digimon gets linked, 1 of your
#      opponent's Digimon or Tamers can't digivolve until their turn ends."
#      Mandatory when a target exists (DCGO canNoSelect: false).
#   9. Link box [When Linking] (DCGO SetIsLinkedEffect(true)): "2 of your
#      opponent's Digimon or Tamers can't unsuspend until their turn ends."
#      DCGO maxCount = min(2, available), canNoSelect: false,
#      canEndNotMax: false → mandatory, full count.
#
# Known shared simplification (same as siblings BT25-052/056/089): DCGO
# additionally gates link candidates on CanLinkToTargetPermanent (the
# candidate's own link condition must accept this host); the DSL predicate
# vocabulary has no candidate-linkability leaf yet, so the filter is
# trait/kind-only.

card: BT25-072
name: Shutmon
kind: digimon
level: 5
color: [black, purple]
cost: 7
dp: 7000
traits: ["Ult.", Appmon, Tool, Forced Termination] # form Ult./Appmon + attribute Tool + type Forced Termination (production trait merge)
attribute: Tool # printed Attribute: Tool (was mis-authored Virus)

alt_paths:
  # ─── Printed standard circles: split Black/Purple Lv.4 / cost 4 ─────────────
  # Official DB lists the split circle as two standard rows (Black Lv.4/4 AND
  # Purple Lv.4/4). Authored as equal-cost alt_paths per pool convention
  # (backfills DebugRunner fixtures' evo_costs; production dedupes against the
  # cards.json rows) — same shape as BT25-056's split green/yellow circle.
  - kind: digivolve
    from: { level_eq: 4, color_is: black }
    cost: 4
  - kind: digivolve
    from: { level_eq: 4, color_is: purple }
    cost: 4

  # ─── Printed "Sup. / cost 3" circle (any colour) ────────────────────────────
  # DCGO: AddSelfDigivolutionRequirementStaticEffect(HasSuperAppTraits, 3);
  # HasSuperAppTraits = EqualsTraits("Sup.") — no level/colour gate.
  - kind: digivolve
    from: { trait_has: "Sup." }
    cost: 3

  # ─── [App Fusion] [Logamon] & [Timemon]: Cost 0 ─────────────────────────────
  # Printed: "If 2 such cards are linked together, stack the link card on top
  # and digivolve." DCGO: AddAppfuseMethodByName(["Logamon","Timemon"]).
  - kind: app_fusion
    materials:
      - filter:
          name_in: [Logamon, Timemon]
    cost: 0

effects:
  # ─── Self link-condition: <Link> [Appmon] trait: Cost 3 ─────────────────────
  - kind: link_condition
    cost: 3
    filter: { trait_has: Appmon }

  # ─── Link box DP "+4000" (card image + official DB "Link DP: DP+4000") ──────
  # Applies to the host while this card is linked (target: {} = the host).
  - scope: linked
    kind: aura
    target: {}
    dp_modifier: 4000
    summary: "[Link] +4000 DP to the linked Digimon (host)"

  # ─── <Jamming> (self) ───────────────────────────────────────────────────────
  - kind: grant_keyword
    keyword: Jamming

  # ─── Shared [On Play]/[When Digivolving]/[When Attacking] self-link ─────────
  # Printed: "If it's your turn, you may link 1 [Social], [Tool] or [Game]
  # trait Digimon card from your trash or this Digimon's digivolution cards to
  # this Digimon with the cost reduced by 2."
  - when: [on_play, when_digivolving, when_attacking]
    active_when: { your_turn: true }
    summary: "[OP/WD/WA] If your turn, you may link 1 [Social]/[Tool]/[Game] Digimon card from trash or digivolution cards to this Digimon (-2)"
    process:
      - link_cards:
          from: [trash, self_sources]
          filter:
            all_of:
              - kind: digimon
              - any_of:
                  - trait_has: Social
                  - trait_has: Tool
                  - trait_has: Game
          to: self
          count: { up_to: 1 } # "you may link 1" — declinable (DCGO isSkippable)
          cost: { reduce: 2 } # printed "-2" on the linked card's link cost

  # ─── [All Turns][Once Per Turn] When this gets linked: deny-digivolve 1 opp ─
  # Printed: "[All Turns] [Once Per Turn] When this Digimon gets linked, 1 of
  # your opponent's Digimon or Tamers can't digivolve until their turn ends."
  # Mandatory when a target exists (DCGO canNoSelect: false).
  - when: when_card_linked_to_this
    once_per_turn: true
    summary: "[All Turns][OPT] When this Digimon gets linked, 1 opp Digimon/Tamer can't digivolve until their turn ends"
    process:
      - select_opponent_permanent:
          bind_as: deny_target
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          prompt: "1 opponent Digimon or Tamer can't digivolve until their turn ends"
      - add_modifier:
          target: deny_target
          modifier: CannotDigivolve
          value: 1
          expiry: end_of_opponents_turn

  # ─── [When Linking] (link-source effect): 2 opp can't unsuspend until turn end ──
  # Printed: "2 of your opponent's Digimon or Tamers can't unsuspend until
  # their turn ends." Mandatory, capped at available targets (DCGO maxCount =
  # min(2, available), canNoSelect: false, canEndNotMax: false).
  - scope: linked
    when: when_linked
    summary: "[When Linking] 2 of your opponent's Digimon or Tamers can't unsuspend until their turn ends"
    process:
      - select_count_capped_multi:
          of: opponent
          zone: battle_area
          max: 2
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          bind_as: lock_targets
          prompt: "2 opponent Digimon or Tamers can't unsuspend until their turn ends"
          optional_zero: false
      - per_selected:
          selection: lock_targets
          bind_as: locked
          body:
            - add_modifier:
                target: { binding: locked }
                modifier: CannotUnsuspend
                value: 1
                expiry: end_of_opponents_turn
