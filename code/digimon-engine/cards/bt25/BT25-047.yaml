# BT25-047 Floramon — Digimon, Lv.3, Green, DP 2000, Cost 3.
# Traits: Vegetation, Iliad, TS. Attribute: Data.
# [On Play] Reveal top 3; add 1 [Vegetation] or [Shaman] trait card and 1 [TS]
# trait card among them to the hand. Return the rest to the bottom of the deck.
# Inherited [Your Turn] All of your Digimon get +1000 DP.
# Alt-digivolve Lv.2 w/[TS] trait / Cost 0.
# DCGO: DCGO/Assets/Scripts/CardEffect/BT25/Green/BT25_047.cs
card: BT25-047
name: Floramon
kind: digimon
level: 3
color: [green]
cost: 3
dp: 2000
traits: [Vegetation, Iliad, TS]
attribute: Data
alt_paths:
  - kind: digivolve
    from:
      all_of:
        - level_eq: 2
        - trait_has: TS
    cost: 0
effects:
  - when: on_play
    summary: "[On Play] Reveal 3; add one [Vegetation]/[Shaman] and one [TS] card to hand; rest to bottom"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          buckets:
            - bind_as: veg_pick
              min: 1
              max: 1
              filter:
                any_of:
                  - trait_has: Vegetation
                  - trait_has: Shaman
            - bind_as: ts_pick
              min: 1
              max: 1
              filter: { trait_has: TS }
          no_duplicate_cards: true
          prompt: "Add 1 [Vegetation]/[Shaman] and 1 [TS] trait card to your hand"
      - add_to_hand_from_reveal: { of: you, card: veg_pick }
      - add_to_hand_from_reveal: { of: you, card: ts_pick }
      - place_remainder_on_deck: { of: you, position: bottom }
  # Inherited [Your Turn] All of your Digimon get +1000 DP.
  - kind: aura
    scope: inherited
    active_when: { your_turn: true }
    target: { kind: digimon, owner: you }
    dp_modifier: 1000
    summary: "[Your Turn] All of your Digimon get +1000 DP"
