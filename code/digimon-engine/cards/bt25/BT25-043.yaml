# BT25-043 Habakirimon — Digimon (BEATBREAK), Lv.6, Yellow, DP 12000, Cost 6.
# Traits: Shaman, Glowing Dawn, BEATBREAK. Attribute: Virus.
# Standard digivolution: Lv.5 Yellow / cost 4 (printed evo_costs).
#
# Printed card text (card image BT25-043 — authoritative for printed text):
#   [When Digivolving] [When Attacking] [Once Per Turn] <Recovery +1> (Place the
#   top card of your deck as your top security card.) Then, by trashing the top
#   security card of 1 player with the most security cards, this Digimon
#   unsuspends.
#   [All Turns] [Once Per Turn] When any of your [Glowing Dawn] trait Digimon
#   would leave the battle area, by trashing your top security card, they don't
#   leave.
# Option side (Habakiri): Use Req [Glowing Dawn]; [Main] 1 opp Digimon -8000 DP,
#   then by trashing your top security all opp Digimon -5000 DP; Arts Digivolve.
#   → BEATBREAK Option side OMITTED (PARTIAL), see G-DSL-BEATBREAK-ARTS-OPTION.
# Printed evo box (xros_req): "[Digivolve] Lv.5 w/[Glowing Dawn] trait: Cost 3".
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT25/Yellow/BT25_043.cs
#
# Implementation status (faithfulness diff):
# | Std digivolve Lv.5 Yellow / Cost 4                  | IMPLEMENTED (evo_costs) |
# | Alt-source Lv.5 [Glowing Dawn] / Cost 3            | IMPLEMENTED (alt_paths) |
# | [WD][WA][OPT] Recovery +1                           | IMPLEMENTED (recover) |
# | [WD][WA][OPT] trash most-sec player's top → unsuspend | IMPLEMENTED (gated 3-way choice) |
# | [All Turns][OPT] GlowingDawn would-leave → trash sec → stay | IMPLEMENTED (replacement) |
# | Option [Main] DP debuffs + Arts Digivolve          | OMITTED — G-DSL-BEATBREAK-ARTS-OPTION → PARTIAL |

card: BT25-043
name: Habakirimon
kind: digimon
level: 6
color: [yellow]
cost: 6
dp: 12000
traits: [Shaman, Glowing Dawn, BEATBREAK]
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: yellow }
    cost: 4
  - kind: digivolve
    from: { level_eq: 5, trait_has: "Glowing Dawn" }
    cost: 3

effects:
  - when: [when_digivolving, when_attacking]
    once_per_turn: true
    summary: "[WD][WA][OPT] <Recovery +1>; then by trashing the top security of the player with the most security, this Digimon unsuspends"
    process:
      - recover: { of: you, count: 1 }
      - select_effect_choice:
          bind_as: who
          labels:
            - "Trash your own top security card"
            - "Trash your opponent's top security card"
            - "Don't trash security"
          prompt: "Trash 1 player's top security card to unsuspend this Digimon?"
      - if:
          condition:
            all_of:
              - equals: [who, 0]
              - security_count_gte: 1
              - security_count_gte:
                  formula:
                    base: 0
                    per:
                      card_count_in_zone:
                        of: opponent
                        zone: security
                    delta: 1
          then:
            - trash_top_security: { of: you }
            - unsuspend: { target: self }
      - if:
          condition:
            all_of:
              - equals: [who, 1]
              - opponent_security_count_gte: 1
              - opponent_security_count_gte:
                  formula:
                    base: 0
                    per:
                      card_count_in_zone:
                        of: you
                        zone: security
                    delta: 1
          then:
            - trash_top_security: { of: opponent }
            - unsuspend: { target: self }

  - kind: replacement
    trigger: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    active_when:
      all_of:
        - replacement_subject_is_mine: true
        - kind: digimon
        - trait_has: "Glowing Dawn"
        - any_permanent:
            of: you
            zone: [security]
    summary: "[All Turns][OPT] When your [Glowing Dawn] Digimon would leave, by trashing your top security card, they don't leave"
    process:
      - trash_top_security: { of: you }
      - cancel_replacement: {}
