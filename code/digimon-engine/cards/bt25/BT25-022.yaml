# BT25-022 Lunamon — Digimon, Lv.3, Blue, DP 2000, Cost 3.
# Traits: Mammal, Iliad, TS. Attribute: Data.
# [On Play] Reveal top 3; add 1 [Iliad] and 1 [TS] to hand; rest to bottom.
# Inherited <Jamming>. Alt-digivolve Lv.2 Blue or Lv.2 [TS] / Cost 0.
# DCGO: DCGO/Assets/Scripts/CardEffect/BT25/Blue/BT25_022.cs
card: BT25-022
name: Lunamon
kind: digimon
level: 3
color: [blue]
cost: 3
dp: 2000
traits: [Mammal, Iliad, TS]
attribute: Data
alt_paths:
  - kind: digivolve
    from:
      all_of:
        - level_eq: 2
        - color_is: blue
    cost: 0
  - kind: digivolve
    from:
      all_of:
        - level_eq: 2
        - trait_has: TS
    cost: 0
effects:
  - when: on_play
    summary: "[On Play] Reveal 3; add one [Iliad] and one [TS] card to hand; rest to bottom"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          buckets:
            - bind_as: iliad_pick
              min: 1
              max: 1
              filter: { trait_has: Iliad }
            - bind_as: ts_pick
              min: 1
              max: 1
              filter: { trait_has: TS }
          no_duplicate_cards: true
          prompt: "Add 1 [Iliad] and 1 [TS] trait card to your hand"
      - add_to_hand_from_reveal: { of: you, card: iliad_pick }
      - add_to_hand_from_reveal: { of: you, card: ts_pick }
      - place_remainder_on_deck: { of: you, position: bottom }
  - scope: inherited
    kind: grant_keyword
    keyword: Jamming
