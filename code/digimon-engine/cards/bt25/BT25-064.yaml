# BT25-064 ToyAgumon — Digimon, Lv.3, Black, DP 2000, Cost 3.
# Traits: Puppet, Iliad, TS. Attribute: Vaccine.
# [On Play] Reveal top 3; add 1 Option card and 1 [TS] trait card among them to
# the hand. Return the rest to the bottom of the deck.
# Inherited <Reboot>.
# Alt-digivolve Lv.2 w/[TS] trait / Cost 0.
# DCGO: DCGO/Assets/Scripts/CardEffect/BT25/Black/BT25_064.cs
card: BT25-064
name: ToyAgumon
kind: digimon
level: 3
color: [black]
cost: 3
dp: 2000
traits: [Puppet, Iliad, TS]
attribute: Vaccine
alt_paths:
  - kind: digivolve
    from:
      all_of:
        - level_eq: 2
        - trait_has: TS
    cost: 0
effects:
  - when: on_play
    summary: "[On Play] Reveal 3; add one Option and one [TS] card to hand; rest to bottom"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          buckets:
            - bind_as: option_pick
              min: 1
              max: 1
              filter: { kind: option }
            - bind_as: ts_pick
              min: 1
              max: 1
              filter: { trait_has: TS }
          no_duplicate_cards: true
          prompt: "Add 1 Option card and 1 [TS] trait card to your hand"
      - add_to_hand_from_reveal: { of: you, card: option_pick }
      - add_to_hand_from_reveal: { of: you, card: ts_pick }
      - place_remainder_on_deck: { of: you, position: bottom }
  # Inherited <Reboot>.
  - kind: grant_keyword
    scope: inherited
    keyword: Reboot
    summary: "Inherited <Reboot>"
