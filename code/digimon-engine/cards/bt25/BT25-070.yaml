# BT25-070 Logamon — Digimon, Lv.4, Purple, DP 6000, Cost 5.
# Trait line: Logging (App Name) — Game/Appmon. (per DCGO HasAppmonTraits host.)
#
# DCGO BT25_070.cs (authoritative):
#   - AddSelfDigivolutionRequirementStaticEffect(HasStandardAppTraits, cost 2) — alt-digivolve.
#   - AddSelfLinkConditionStaticEffect(HasAppmonTraits, linkCost 2) — self link-condition.
#   - App Fusion (Offmon & Hackmon) — BLOCKED (no App Fuse primitive). OMITTED.
#   - [Main][OPT][Once Per Turn]: link 1 [Social]/[Tool]/[Game] Digimon card from
#     your trash or this Digimon's digivolution cards to THIS Digimon, cost -1.
#   - [Your Turn][OPT][Once Per Turn] When this Digimon gets linked: delete 1 opp
#     Digimon with play cost 4 or less.
#   - [When Linking] (link-source / inherited): 1 opp Digimon/Tamer can't
#     unsuspend until their turn ends.
#
# Cost-modeling note: "reduced by 1" reduces the linked card's own link cost;
# DSL fixtures carry no engine link cost, so we model the paid cost as cost: 0
# (see BT25-072/056). The flat ChangeLinkCost path covers any nonzero residual.

card: BT25-070
name: Logamon
kind: digimon
level: 4
color: [purple]
cost: 5
dp: 6000
traits: [Logging, Appmon]

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, trait_has: Standard App }
    cost: 2

effects:
  # ─── Self link-condition: link onto an [Appmon] host for cost 2 ─────────────
  - kind: link_condition
    cost: 2
    filter: { trait_has: Appmon }

  # ─── [Main][OPT][Once Per Turn] link from trash/sources to this (-1) ────────
  - when: main_on_field
    once_per_turn: true
    summary: "[Main][OPT] You may link 1 [Social]/[Tool]/[Game] Digimon card from trash or digivolution cards to this Digimon (-1)"
    process:
      - link_cards:
          from: [trash, self_sources]
          filter:
            all_of:
              - kind: digimon
              - any_of:
                  - trait_has: Social
                  - trait_has: Tool
                  - trait_has: Game
          to: self
          count: { up_to: 1 }
          cost: free

  # ─── [Your Turn][OPT] When linked: delete 1 opp Digimon cost <= 4 ───────────
  - when: when_card_linked_to_this
    once_per_turn: true
    active_when: { your_turn: true }
    summary: "[Your Turn][OPT] When this Digimon gets linked, delete 1 opp Digimon with play cost 4 or less"
    process:
      - select_opponent_permanent:
          bind_as: del_target
          filter:
            all_of:
              - kind: digimon
              - play_cost_lte: 4
          prompt: "Delete 1 of your opponent's Digimon with a play cost of 4 or less"
      - delete_permanent: { target: del_target }

  # ─── [When Linking] (link-source): 1 opp can't unsuspend until turn end ─────
  - scope: linked
    when: when_linked
    summary: "[When Linking] 1 of your opponent's Digimon or Tamers can't unsuspend until their turn ends"
    process:
      - select_opponent_permanent:
          bind_as: lock_target
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          prompt: "1 opponent Digimon or Tamer can't unsuspend until their turn ends"
      - add_modifier:
          target: lock_target
          modifier: CannotUnsuspend
          value: 1
          expiry: end_of_opponents_turn
