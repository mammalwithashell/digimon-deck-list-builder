# BT25-011 Aquilamon — Digimon, Lv.4, Red/Green, DP 4000, Cost 4.
# Traits: Giant Bird, Iliad, TS.
#
# Printed card text (data/cards.json effect_description_eng — verbatim):
#
#   ＜Raid＞ (When this Digimon attacks, you may switch the target of attack to 1
#   of your opponent's unsuspended Digimon with the highest DP.)
#   [On Play] [When Digivolving] Suspend 1 of your opponent's Digimon. Then, if
#   it's your turn, 2 of your Digimon may DNA digivolve into [Silphymon] in the
#   hand.
#
# Inherited: [Your Turn] This Digimon gets +2000 DP.
#
# Printed evo box (cards.json evo_costs): Lv.3 Red / cost 3.
# Printed digivolve boxes (DCGO): [Hawkmon] (name) / cost 2 ignore-req; Lv.3
#   [TS] / cost 2 ignore-req.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT25/Red/BT25_011.cs
#
# DCGO crosscheck:
#   Region "Raid" (OnAllyAttack) → grant_keyword Raid.
#   Region "OP/WD Shared": 1. if opp Digimon exists, MANDATORY suspend (Tap,
#   canNoSelect false). 2. if IsOwnerTurn: DNADigivolvePermanentsIntoHandOrTrash
#   with CanSelectDNACard = Silphymon (in HAND), payCost true, isHand true.
#   Region "Inherit" (None, inherited): ChangeSelfDPStaticEffect(+2000, owner
#   turn).
#
# Modelling note: the DNA-into-hand clause follows the EX12-017 / AD1-012
# `dna_field_pair` idiom: `select_hand` offers only a [Silphymon] (exact name,
# DCGO `EqualsCardName("Silphymon")`) that can DNA digivolve right now
# (`CanPlayJogress(true)`), so no dead prompt opens when no legal Silphymon or
# field pair exists; `select_dna_pair` offers only matching materials. Gated on
# `your_turn` ("if it's your turn").

card: BT25-011
name: Aquilamon
kind: digimon
level: 4
color: [red, green]
cost: 4
dp: 4000
traits: [Giant Bird, Iliad, TS]

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: red }
    cost: 3
  # Printed split circle: Red|Yellow Lv.3 / cost 3 — one entry per colour.
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 3
  - kind: digivolve
    from: { name_is: "Hawkmon" }
    cost: 2
    ignore_requirements: true
  - kind: digivolve
    from: { any_color: true, level_eq: 3, trait_has: TS }
    cost: 2
    ignore_requirements: true

effects:
  - text: "＜Raid＞"
    kind: grant_keyword
    keyword: Raid
    summary: "<Raid>"

  - text: "[On Play] [When Digivolving] Suspend 1 of your opponent's Digimon. Then, if it's your turn, 2 of your Digimon may DNA digivolve into [Silphymon] in the hand."
    when: [on_play, when_digivolving]
    summary: "[OP][WD] Suspend 1 opp Digimon; then if your turn, 2 of your Digimon may DNA digivolve into [Silphymon] in hand"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: suspend_target
          filter: { kind: digimon }
          prompt: "Suspend 1 of your opponent's Digimon"
      - suspend: { target: suspend_target }
      - if:
          condition: { your_turn: true }
          then:
            - select_hand:
                of: you
                bind_as: dna_card
                optional: true
                filter:
                  all_of:
                    - kind: digimon
                    - name_is: "Silphymon"
                    - dna_field_pair: { role: result }
                prompt: "Select [Silphymon] in hand to DNA digivolve into"
            - if:
                condition: { binding_present: dna_card }
                then:
                  - select_dna_pair:
                      left_filter:
                        all_of:
                          - kind: digimon
                          - of: you
                          - dna_field_pair: { role: first, result: dna_card }
                      right_filter:
                        all_of:
                          - kind: digimon
                          - of: you
                          - dna_field_pair: { role: second, result: dna_card, first: dna_a }
                      bind_left_as: dna_a
                      bind_right_as: dna_b
                      prompt: "Select 2 of your Digimon to DNA digivolve into [Silphymon]"
                      optional: true
                  - if:
                      condition: { binding_present: dna_a }
                      then:
                        - effect_initiated_dna_digivolve:
                            target_a: dna_a
                            target_b: dna_b
                            from_hand: dna_card
                            cost: printed
                            ignore_requirements: false

  - text: "[Your Turn] This Digimon gets +2000 DP."
    kind: aura
    scope: inherited
    active_when: { your_turn: true }
    target: {}
    dp_modifier: 2000
    summary: "Inherited [Your Turn] This Digimon gets +2000 DP"
