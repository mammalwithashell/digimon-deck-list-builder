# BT25-011 Aquilamon — Digimon, Lv.4, Red/Green, DP 4000, Cost 4.
# Traits: Giant Bird, Iliad, TS.
#
# Printed card text (data/cards.json effect_description_eng — verbatim):
#
#   ＜Raid＞ (When this Digimon attacks, you may switch the target of attack to 1
#   of your opponent's unsuspended Digimon with the highest DP.)
#   [On Play] [When Digivolving] Suspend 1 of your opponent's Digimon. Then, if
#   it's your turn, 2 of your Digimon may DNA digivolve into [Silphymon] in the
#   hand.
#
# Inherited: [Your Turn] This Digimon gets +2000 DP.
#
# Printed evo box (cards.json evo_costs): Lv.3 Red / cost 3.
# Printed digivolve boxes (DCGO): [Hawkmon] (name) / cost 2 ignore-req; Lv.3
#   [TS] / cost 2 ignore-req.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT25/Red/BT25_011.cs
#
# DCGO crosscheck:
#   Region "Raid" (OnAllyAttack) → grant_keyword Raid.
#   Region "OP/WD Shared": 1. if opp Digimon exists, MANDATORY suspend (Tap,
#   canNoSelect false). 2. if IsOwnerTurn: DNADigivolvePermanentsIntoHandOrTrash
#   with CanSelectDNACard = Silphymon (in HAND), payCost true, isHand true.
#   Region "Inherit" (None, inherited): ChangeSelfDPStaticEffect(+2000, owner
#   turn).
#
# Modelling note: the DNA-into-hand clause uses `may_dna_digivolve_now`. The
# first material is a free-selected own Digimon bound as `anchor`; the second
# (`partner_filter`) is another own Digimon; the result (`target_filter`) is a
# [Silphymon] Digimon card pulled from the owner's hand. The whole DNA is
# optional ("may"), gated on your_turn ("if it's your turn").

card: BT25-011
name: Aquilamon
kind: digimon
level: 4
color: [red, green]
cost: 4
dp: 4000
traits: [Giant Bird, Iliad, TS]

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: red }
    cost: 3
  - kind: digivolve
    from: { name_contains: "Hawkmon" }
    cost: 2
    ignore_requirements: true
  - kind: digivolve
    from: { level_eq: 3, trait_has: TS }
    cost: 2
    ignore_requirements: true

effects:
  - kind: grant_keyword
    keyword: Raid
    summary: "<Raid>"

  - when: [on_play, when_digivolving]
    summary: "[OP][WD] Suspend 1 opp Digimon; then if your turn, 2 of your Digimon may DNA digivolve into [Silphymon] in hand"
    process:
      - select_opponent_permanent:
          bind_as: suspend_target
          filter: { kind: digimon }
          prompt: "Suspend 1 of your opponent's Digimon"
      - suspend: { target: suspend_target }
      - if:
          condition: { your_turn: true }
          then:
            - select_own_permanent:
                bind_as: dna_anchor
                optional: true
                filter:
                  all_of:
                    - kind: digimon
                    - zone: [battle_area]
                prompt: "Choose the first of 2 of your Digimon to DNA digivolve into [Silphymon]"
            - may_dna_digivolve_now:
                anchor: { binding: dna_anchor }
                partner_filter:
                  all_of:
                    - of: you
                    - kind: digimon
                target_filter:
                  all_of:
                    - of: you
                    - kind: digimon
                    - name_contains: "Silphymon"
                cost: 0
                ignore_requirements: false
                optional: true
                prompt: "DNA digivolve 2 of your Digimon into [Silphymon] in the hand?"

  - kind: aura
    scope: inherited
    active_when: { your_turn: true }
    target: {}
    dp_modifier: 2000
    summary: "Inherited [Your Turn] This Digimon gets +2000 DP"
