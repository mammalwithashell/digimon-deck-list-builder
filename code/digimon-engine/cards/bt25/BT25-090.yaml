# BT25-090 Tomoro Tenma — Tamer, Green, Cost 4.
# Traits: Glowing Dawn, BEATBREAK.
#
# Printed card text (data/cards.json — verbatim, confirmed vs DCGO):
#   [Start of Your Turn] If you have 2 or less memory, set it to 3.
#   [All Turns] When any Digimon suspend, by suspending this Tamer, you may
#     place the top 2 cards of your deck face down under this Tamer.
#   [Your Turn] [Once Per Turn] When you would use [Glowing Dawn] trait Option
#     cards, by trashing the bottom face-down card from under any of your
#     Tamers, reduce the cost by 1.
#   Inherited: [Security] Play this card without paying the cost.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT25/Green/BT25_090.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
#
# Clause 1 (OnStartTurn): SetMemoryTo3TamerEffect → start_of_your_turn +
#   condition memory_lte: 2 + set_memory: 3.
# Clause 2 (OnTappedAnyone): "When any Digimon suspend" — CanTriggerWhenPermanent
#   Suspends gated on PermanentCondition = IsPermanentExistsOnBattleAreaDigimon
#   (ANY Digimon, either player). Cost "by suspending this Tamer" →
#   activation_cost { suspend_self }. Payoff "you may place top 2 face down" →
#   clause-level optional + two place_as_bottom_source { deck_top } face_down.
#   active_when { all_turns, event_target_kind: digimon } gates the trigger to a
#   Digimon suspending (not a Tamer). DCGO's 3-way menu (place-2 / suspend-only /
#   no) reduces to optional suspend-self+place-2; declining = "No".
# Clause 3 (BeforePayCost) — NOW IMPLEMENTED (2026-06-15):
#   "[Your Turn][Once Per Turn] When you would USE a [Glowing Dawn] Option card,
#   by trashing the bottom face-down card under any Tamer, reduce the cost by 1."
#   Same shape as BT25-049 clause 2 (Option-USE keyed), amount 1 instead of 3.
#   DCGO keys on CanTriggerWhenPermanentWouldPlay over a Glowing-Dawn Option
#   with a use cost; the Tamer pick is skippable/can-no-select → the player may
#   decline → no reduction, so the reducer is modelled `optional: true` (the
#   accept gate IS the decline, exposed to the RL action space). maxCountPerTurn
#   1 → once_per_turn.
#   → kind: cost_reduction + when_any_ally_played { kind: option, trait_has:
#     Glowing Dawn } + active_when { your_turn } + optional + once_per_turn +
#     amount 1 + pay_cost [trash_bottom_face_down_source_under_tamer]. The
#     interactive pay_cost parks; the engine credits the -1 behind the parked
#     pay_cost on the Option-use path
#     (game_actions/options.rs::try_prompt_interactive_option_use_cost_reducer,
#     G-COST-REDUCTION-INTERACTIVE-PAY-COST closed for the Option-use path).
# Inherited (SecuritySkill): PlaySelfTamerSecurityEffect → play_from_security.

card: BT25-090
name: "Tomoro Tenma"
kind: tamer
color: [green]
cost: 4
traits: [Glowing Dawn, BEATBREAK]

effects:
  # ─── [Start of Your Turn] If memory <= 2, set it to 3 ──────────────────────
  - when: start_of_your_turn
    condition: { memory_lte: 2 }
    summary: "[Start of Your Turn] If you have 2 or less memory, set it to 3"
    process:
      - set_memory: 3

  # ─── [All Turns] When any Digimon suspends: may suspend self → place top 2 ──
  - when: on_suspend
    optional: true
    active_when:
      all_of:
        - all_turns: true
        - event_target_kind: digimon
    summary: "[All Turns] When any Digimon suspend, by suspending this Tamer you may place the top 2 deck cards face down under this Tamer"
    process:
      - activation_cost: { suspend_self: true }
      - place_as_bottom_source:
          source: { deck_top: you }
          target: source
          face_down: true
      - place_as_bottom_source:
          source: { deck_top: you }
          target: source
          face_down: true

  # ─── [Your Turn][Once Per Turn] When you would use a [Glowing Dawn] Option,
  #     by trashing a bottom face-down card under a Tamer, reduce the cost by 1 ─
  - kind: cost_reduction
    reduction_timing: before_pay_cost
    active_when: { your_turn: true }
    when_any_ally_played:
      all_of:
        - kind: option
        - trait_has: "Glowing Dawn"
    optional: true
    once_per_turn: true
    amount: 1
    pay_cost:
      - trash_bottom_face_down_source_under_tamer: { of: you }
    summary: "[Your Turn][Once Per Turn] When you would use a [Glowing Dawn] Option card, by trashing a bottom face-down card under a Tamer, reduce the cost by 1"

  # ─── [Security] Play this card without paying the cost ─────────────────────
  # (cards.json files this under inherited_effect_description for Tamers; the
  # Tamer security effect is authored as a plain on_security clause — the
  # BT25-088 / BT25-091 idiom.)
  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
