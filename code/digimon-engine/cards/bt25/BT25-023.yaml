# BT25-023 Gaogamon — Digimon, Lv.4, Blue, DP 6000, Cost 5.
# Traits: Beast, DATA SQUAD. Attribute: Data.
#
# Printed card text (data/cards.json — verbatim):
#
#   [On Play] [When Digivolving] If you have 1 or fewer Tamers, you may play 1
#   [Thomas H. Norstein] from your hand without paying the cost.
#
# Inherited Effect:
#   [When Attacking] [Once Per Turn] Both players ＜Draw 1＞ (Draw 1 card from
#   your deck.)
#
# Digivolve: printed evo_costs list a Lv.3 Blue cost-2 alternate path; DCGO adds
# a self digivolution requirement gated on `TopCard.EqualsTraits("DATA SQUAD")`
# at level 3 for cost 2.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT25/Blue/BT25_023.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
#
# Clause "Alt Digivolution Condition" — EffectTiming.None,
#   AddSelfDigivolutionRequirementStaticEffect(TopCard.EqualsTraits("DATA
#   SQUAD"), 2, false, level: 3). → alt_paths digivolve from { level_eq: 3,
#   trait_has: "DATA SQUAD" } cost 2.
#
# Clause "Shared OP/WD" — ActivateClassesForSharedEffects(onPlay: true,
#   whenDigivolving: true, optional: false). additionalActivateCondition:
#   own Tamer-permanent count <= 1. Body: SelectHandEffect Mode.PlayForFree,
#   canTargetCondition = EqualsCardName("Thomas H. Norstein") && CanPlayAsNew,
#   maxCount: 1, canNoSelect: true ("you may"). → when: [on_play,
#   when_digivolving], optional: true (the "may"), active_when: own Tamer count
#   <= 1; select_hand (name "Thomas H. Norstein") → play_from_hand_free.
#
# Clause "WA - Inherited" — EffectTiming.OnAllyAttack, OPT, isInheritedEffect:
#   true. Both players Draw 1 (no LibraryCards guard here, but draw on empty
#   deck is a safe no-op). → scope: inherited, when: when_attacking,
#   once_per_turn: true, draw you then opponent.

card: BT25-023
name: Gaogamon
kind: digimon
level: 4
color: [blue]
cost: 5
dp: 6000
traits: [Beast, DATA SQUAD]
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, trait_has: "DATA SQUAD" }
    cost: 2

effects:
  # ─── Clause 0: [On Play][When Digivolving] may play Thomas H. Norstein free ──
  - when: [on_play, when_digivolving]
    optional: true
    active_when:
      count_lte:
        filter:
          owner: you
          zone: [battle_area]
          kind: tamer
        n: 1
    summary: "[OnPlay/WhenDigivolving] If <=1 Tamers, may play 1 [Thomas H. Norstein] from hand without paying the cost"
    process:
      - select_hand:
          of: you
          bind_as: thomas
          filter:
            name_is: "Thomas H. Norstein"
          prompt: "Play 1 [Thomas H. Norstein] from your hand without paying the cost"
      - play_from_hand_free: { of: you, hand_index: thomas }

  # ─── Clause 1: Inherited [When Attacking][OPT] both players draw 1 ───────────
  - scope: inherited
    when: when_attacking
    once_per_turn: true
    summary: "[Inherited][When Attacking][OPT] Both players draw 1"
    process:
      - draw: { of: you, count: 1 }
      - draw: { of: opponent, count: 1 }
