# BT8-084 Kimeramon — Digimon, Lv.5, White, DP 8000, Cost 8.
# Traits: Composite. Attribute: Data. Form: Ultimate.
#
# Printed card text (official Bandai DB — data/card_bundles/BT8-084.md,
# verbatim; cross-checked against the card image BT8-084.webp):
#
#   [DNA Digivolve] 0 from Lv.4 + Lv.4
#     Digivolve unsuspended with the 2 specified Digimon stacked on top of
#     each other.
#
#   [When Digivolving] You may place 1 level 5 or lower Digimon card from
#   your trash under this Digimon as its bottom digivolution card. Then, up
#   to 4 of your opponent's Digimon get -1000 DP for each of this Digimon's
#   colors until the end of your opponent's next turn.
#   [Your Turn] This Digimon is treated as also having the colors of its
#   digivolution cards. While this Digimon has 4 or more colors, it gets
#   +4000 DP.
#
# Official Q&A (data/card_bundles/BT8-084.md): the color treatment is
# ADDITIVE — with a red and a green source, this white card is treated as a
# 3-color white/red/green card.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT8/White/BT8_084.cs
#
# ─── DCGO crosscheck (clause-by-clause) ──────────────────────────────────────
#
# DNA (EffectTiming.None, AddJogressConditionClass):
#   Two JogressConditionElements, each: own battle-area Digimon whose
#   Levels_ForJogress contains 4. JogressCondition(cost: 0). The printed
#   black-text "Digivolve unsuspended with the 2 specified Digimon stacked"
#   -> `stacks_unsuspended: true`, matching AD1-025's authored shape.
#
# [When Digivolving] (EffectTiming.OnEnterFieldAnyone, ActivateClass,
# CanTriggerWhenDigivolving; body gated on being an own battle-area Digimon):
#
#   Part 1 — optional place-from-trash (AUTHORED below):
#     SelectCardEffect over own trash, `canNoSelect: () => true` (a genuine
#     "you may" — declining skips ONLY the placement, not the rest of the
#     coroutine), maxCount Min(1, matches), CanSelectCardCondition =
#     IsDigimon && HasLevel && Level <= 5. On a pick:
#     `AddDigivolutionCardsBottom` — the BOTTOM digivolution-card position
#     (`place_as_bottom_source`; contrast EX9-074's AddDigivolutionCardsTop /
#     `place_as_top_source`).
#
#   Part 2 — up-to-4 DP-minus (GAP-BLOCKED, NOT AUTHORED):
#     `minusDP = 1000 * card.PermanentOfThisCard().TopCard.CardColors.Count`
#     computed AFTER the Part-1 placement. Because the [Your Turn]
#     ChangeCardColorClass (below) is active during the controller's turn,
#     `TopCard.CardColors` at this point is the UNION of the printed white
#     and every non-flipped digivolution card's colors. Then
#     SelectPermanentEffect over opponent battle-area Digimon,
#     maxCount Min(4, matches), `canNoSelect: false` (must pick >= 1 when a
#     candidate exists), `canEndNotMax: true` (may stop before 4 — the
#     printed "up to 4"), each pick DP-changed by -minusDP with
#     EffectDuration.UntilOpponentTurnEnd (-> `end_of_opponents_next_turn`).
#     Skipped entirely when no opponent Digimon exists (DCGO's
#     `HasMatchConditionPermanent` guard).
#
#     Everything here EXCEPT the amount is expressible today
#     (`select_count_capped_multi { of: opponent, zone: battle_area, min: 1,
#     max: 4, optional_zero: false }` + `per_selected` + `add_dp_modifier {
#     expiry: end_of_opponents_next_turn }`). The AMOUNT is not:
#     G-DSL-SOURCE-STACK-UNION-COLOR-COUNT — there is no source-anchored
#     formula for "distinct colors across the carrier's top card + its
#     non-flipped digivolution sources" (the union incl. top).
#       - `source_color_count` (FormulaSpec + PerSelector) counts SOURCES
#         ONLY: it misses the printed white whenever no source is white —
#         undercounting the debuff by 1000 in the common case.
#       - `digivolution_color_count` is the right union but anchors at the
#         formula TARGET, which inside `add_dp_modifier` is the opponent
#         Digimon receiving the debuff — the wrong permanent.
#     Authoring the leg with either would be a silent approximation, so the
#     leg is omitted and the gap is logged (qa/dsl-vocab-gaps.md). The
#     behavioral test carries a tripwire pinning that no approximated
#     substitute ships.
#
# [Your Turn] treated-as-colors (EffectTiming.None, ChangeCardColorClass —
# GAP-BLOCKED, NOT AUTHORED):
#   While on the battle area during the owner's turn with >= 1 digivolution
#   card, the top card's CardColors gains every color of every non-flipped
#   digivolution card (additive union). This is a CROSS-CARD-VISIBLE
#   continuous identity change (any effect reading this permanent's colors
#   sees the union). G-ENGINE-ADDITIVE-COLOR-TREATMENT — the engine's
#   `Permanent::synth_identity` only honors the replace-style
#   `ChangeBaseCardColor` modifier; `ModifierType::AddColor` exists in the
#   enum but has no reader and no DSL install surface, and no aura payload
#   can carry a dynamic "union of source colors" color list.
#
# [Your Turn] 4-color +4000 DP (EffectTiming.None,
# ChangeSelfDPStaticEffect(4000) — GAP-BLOCKED, NOT AUTHORED):
#   Condition: IsExistOnBattleArea && IsOwnerTurn &&
#   `TopCard.CardColors.Count >= 4` — i.e. the union-incl-top count under
#   the treatment above. G-DSL-OWN-STACK-COLOR-COUNT-GTE — the existing
#   no-subject carrier predicate `own_source_stack_color_count_gte` (EX9-074)
#   counts source colors EXCLUDING the top card, so "white top + 3-color
#   sources = 4 colors" (which must qualify) would be missed;
#   `self_color_count_gte` reads only the synthesized top-card colors (a
#   constant 1 here without the color treatment). Neither is the printed
#   gate. Would be authorable as a self-aura
#   `active_when: { your_turn: true, own_stack_color_count_gte: 4 }` +
#   `dp_modifier: 4000` once the union-incl-top sibling leaf lands.
#
# ─── Implementation status ────────────────────────────────────────────────────
#
# | Card-text element                                                  | Status |
# |--------------------------------------------------------------------|--------|
# | [DNA Digivolve] 0 from Lv.4 + Lv.4, stacked unsuspended            | IMPLEMENTED |
# | [WD] you may place 1 Lv.5- Digimon from trash as BOTTOM digi card  | IMPLEMENTED (place_as_bottom_source) |
# | [WD] up to 4 opp Digimon -1000 DP x this Digimon's colors,         | BLOCKED (G-DSL-SOURCE-STACK-UNION-COLOR-COUNT) |
# |      until end of opponent's next turn                             |        |
# | [Your Turn] treated as also having digivolution-card colors        | BLOCKED (G-ENGINE-ADDITIVE-COLOR-TREATMENT) |
# | [Your Turn] while 4+ colors: +4000 DP                              | BLOCKED (G-DSL-OWN-STACK-COLOR-COUNT-GTE) |

card: BT8-084
name: Kimeramon
kind: digimon
level: 5
color: [white]
cost: 8
dp: 8000
traits: [Composite]
form: Ultimate
attribute: Data

# [DNA Digivolve] 0 from Lv.4 + Lv.4 — printed black-text DNA condition
# (DCGO AddJogressConditionClass: two own battle-area Digimon whose
# Levels_ForJogress contains 4; cost 0; result stacked unsuspended).
alt_paths:
  - kind: dna_digivolve
    materials:
      - { level_eq: 4 }
      - { level_eq: 4 }
    cost: 0
    stacks_unsuspended: true

effects:
  # ─── [When Digivolving] optional bottom-source placement ──────────────────
  #
  # Printed: "You may place 1 level 5 or lower Digimon card from your trash
  # under this Digimon as its bottom digivolution card."
  #
  # A genuine "you may" pick (DCGO canNoSelect: () => true) that is NOT a
  # cost — `optional: true` with no `cost: true`, so declining skips only
  # the placement; zero eligible trash cards short-circuits with no prompt
  # (DCGO's HasMatchConditionOwnersCardInTrash guard around Part 1 only).
  # Position: `place_as_bottom_source` = DCGO AddDigivolutionCardsBottom =
  # the printed BOTTOM digivolution-card slot.
  #
  # The printed "Then, up to 4 of your opponent's Digimon get -1000 DP for
  # each of this Digimon's colors ..." tail is GAP-BLOCKED
  # (G-DSL-SOURCE-STACK-UNION-COLOR-COUNT — see the header) and deliberately
  # NOT authored; when the union-incl-top color-count formula lands, append
  # the select_count_capped_multi + per_selected + add_dp_modifier steps
  # documented in the header to THIS clause (it is one DCGO coroutine).
  - when: when_digivolving
    summary: "[When Digivolving] You may place 1 level 5 or lower Digimon card from your trash under this Digimon as its bottom digivolution card (DP-minus tail gap-blocked)"
    process:
      - select_trash:
          of: you
          bind_as: material
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_lte: 5
          prompt: "You may place 1 level 5 or lower Digimon card from your trash under this Digimon as its bottom digivolution card"
      - place_as_bottom_source:
          source: material
          target: source
