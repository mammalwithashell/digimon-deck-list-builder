# BT8-084 Kimeramon — Digimon, Lv.5, White, DP 8000, Cost 8.
# Traits: Composite. Attribute: Data. Form: Ultimate.
#
# Printed card text (official Bandai DB — data/card_bundles/BT8-084.md,
# verbatim; cross-checked against the card image BT8-084.webp):
#
#   [DNA Digivolve] 0 from Lv.4 + Lv.4
#     Digivolve unsuspended with the 2 specified Digimon stacked on top of
#     each other.
#
#   [When Digivolving] You may place 1 level 5 or lower Digimon card from
#   your trash under this Digimon as its bottom digivolution card. Then, up
#   to 4 of your opponent's Digimon get -1000 DP for each of this Digimon's
#   colors until the end of your opponent's next turn.
#   [Your Turn] This Digimon is treated as also having the colors of its
#   digivolution cards. While this Digimon has 4 or more colors, it gets
#   +4000 DP.
#
# Official Q&A (data/card_bundles/BT8-084.md): the color treatment is
# ADDITIVE — with a red and a green source, this white card is treated as a
# 3-color white/red/green card.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT8/White/BT8_084.cs
#
# ─── DCGO crosscheck (clause-by-clause) ──────────────────────────────────────
#
# DNA (EffectTiming.None, AddJogressConditionClass):
#   Two JogressConditionElements, each: own battle-area Digimon whose
#   Levels_ForJogress contains 4. JogressCondition(cost: 0). The printed
#   black-text "Digivolve unsuspended with the 2 specified Digimon stacked"
#   -> `stacks_unsuspended: true`, matching AD1-025's authored shape.
#
# [When Digivolving] (EffectTiming.OnEnterFieldAnyone, ActivateClass,
# CanTriggerWhenDigivolving; body gated on being an own battle-area Digimon):
#
#   Part 1 — optional place-from-trash (AUTHORED below):
#     SelectCardEffect over own trash, `canNoSelect: () => true` (a genuine
#     "you may" — declining skips ONLY the placement, not the rest of the
#     coroutine), maxCount Min(1, matches), CanSelectCardCondition =
#     IsDigimon && HasLevel && Level <= 5. On a pick:
#     `AddDigivolutionCardsBottom` — the BOTTOM digivolution-card position
#     (`place_as_bottom_source`; contrast EX9-074's AddDigivolutionCardsTop /
#     `place_as_top_source`).
#
#   Part 2 — up-to-4 DP-minus (AUTHORED below):
#     `minusDP = 1000 * card.PermanentOfThisCard().TopCard.CardColors.Count`
#     computed AFTER the Part-1 placement. Because the [Your Turn]
#     ChangeCardColorClass (below) is active during the controller's turn,
#     `TopCard.CardColors` at this point is the UNION of the printed white
#     and every non-flipped digivolution card's colors. Then
#     SelectPermanentEffect over opponent battle-area Digimon,
#     maxCount Min(4, matches), `canNoSelect: false`, `canEndNotMax: true`,
#     each pick DP-changed by -minusDP with EffectDuration.UntilOpponentTurnEnd.
#     Skipped when no opponent Digimon exists (HasMatchConditionPermanent).
#     Amount: `per: source_rules_color_count` — the carrier's synthesized
#     rules colors (G-DSL-SOURCE-STACK-UNION-COLOR-COUNT, RESOLVED).
#
# [Your Turn] treated-as-colors (EffectTiming.None, ChangeCardColorClass —
# AUTHORED below as a self-aura `modifier: AddColor`):
#   While on the battle area during the owner's turn with >= 1 digivolution
#   card, the top card's CardColors gains every color of every non-flipped
#   digivolution card (additive union), visible to every color read of this
#   permanent. `Permanent::synth_identity` reads `AddColor` additively after
#   `ChangeBaseCardColor` (G-ENGINE-ADDITIVE-COLOR-TREATMENT, RESOLVED).
#
# [Your Turn] 4-color +4000 DP (EffectTiming.None,
# ChangeSelfDPStaticEffect(4000) — AUTHORED below):
#   Condition: IsExistOnBattleArea && IsOwnerTurn &&
#   `TopCard.CardColors.Count >= 4` — the synthesized colors after the
#   treatment, i.e. `self_color_count_gte: 4` on the carrier
#   (G-DSL-OWN-STACK-COLOR-COUNT-GTE, RESOLVED — collapses into the
#   ordinary synth-color read once the treatment exists).
#
# ─── Implementation status ────────────────────────────────────────────────────
#
# | Card-text element                                                  | Status |
# |--------------------------------------------------------------------|--------|
# | [DNA Digivolve] 0 from Lv.4 + Lv.4, stacked unsuspended            | IMPLEMENTED |
# | [WD] you may place 1 Lv.5- Digimon from trash as BOTTOM digi card  | IMPLEMENTED (place_as_bottom_source) |
# | [WD] up to 4 opp Digimon -1000 DP x this Digimon's colors,         | IMPLEMENTED (source_rules_color_count) |
# |      until end of opponent's next turn                             |        |
# | [Your Turn] treated as also having digivolution-card colors        | IMPLEMENTED (AddColor self-aura) |
# | [Your Turn] while 4+ colors: +4000 DP                              | IMPLEMENTED (self_color_count_gte) |

card: BT8-084
name: Kimeramon
kind: digimon
level: 5
color: [white]
cost: 8
dp: 8000
traits: [Composite]
form: Ultimate
attribute: Data

# [DNA Digivolve] 0 from Lv.4 + Lv.4 — printed black-text DNA condition
# (DCGO AddJogressConditionClass: two own battle-area Digimon whose
# Levels_ForJogress contains 4; cost 0; result stacked unsuspended).
alt_paths:
  - kind: dna_digivolve
    materials:
      - { level_eq: 4 }
      - { level_eq: 4 }
    cost: 0
    stacks_unsuspended: true

effects:
  # ─── [When Digivolving] bottom-source placement, then up-to-4 DP-minus ────
  #
  # Printed: "You may place 1 level 5 or lower Digimon card from your trash
  # under this Digimon as its bottom digivolution card. Then, up to 4 of
  # your opponent's Digimon get -1000 DP for each of this Digimon's colors
  # until the end of your opponent's next turn."
  #
  # Part 1 — a genuine "you may" pick (DCGO canNoSelect: () => true) that is
  # NOT a cost — `optional: true` with no `cost: true`, so declining skips
  # only the placement; zero eligible trash cards short-circuits with no
  # prompt (DCGO's HasMatchConditionOwnersCardInTrash guard around Part 1
  # only). Position: `place_as_bottom_source` = DCGO
  # AddDigivolutionCardsBottom = the printed BOTTOM digivolution-card slot.
  #
  # Part 2 — DCGO SelectPermanentEffect over opponent battle-area Digimon,
  # maxCount Min(4, matches), canNoSelect: false (>= 1 pick when a candidate
  # exists -> `min: 1`, `optional_zero: false`), canEndNotMax: true (the
  # printed "up to 4" -> `max: 4`); skipped when the opponent has no Digimon
  # (HasMatchConditionPermanent guard). Amount = 1000 x
  # `TopCard.CardColors.Count`, read AFTER the placement with the [Your
  # Turn] color treatment live -> `per: source_rules_color_count` (the
  # carrier's synthesized rules colors, incl. the AddColor union below).
  # Duration EffectDuration.UntilOpponentTurnEnd -> end_of_opponents_next_turn.
  - when: when_digivolving
    summary: "[When Digivolving] You may place 1 level 5 or lower Digimon card from your trash under this Digimon as its bottom digivolution card. Then, up to 4 of your opponent's Digimon get -1000 DP for each of this Digimon's colors until the end of your opponent's next turn."
    process:
      - select_trash:
          of: you
          bind_as: material
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_lte: 5
          prompt: "You may place 1 level 5 or lower Digimon card from your trash under this Digimon as its bottom digivolution card"
      - place_as_bottom_source:
          source: material
          target: source
      - select_count_capped_multi:
          of: opponent
          zone: battle_area
          min: 1
          max: 4
          filter: { kind: digimon }
          bind_as: dp_targets
          optional_zero: false
          prompt: "Choose up to 4 of your opponent's Digimon to get -1000 DP for each of this Digimon's colors"
      - per_selected:
          selection: dp_targets
          bind_as: dp_target
          body:
            - add_dp_modifier:
                target: { binding: dp_target }
                value:
                  formula:
                    base: 0
                    per: source_rules_color_count
                    delta: -1000
                expiry: end_of_opponents_next_turn

  # ─── [Your Turn] treated as also having the digivolution cards' colors ────
  #
  # DCGO ChangeCardColorClass (IsExistOnBattleArea && IsOwnerTurn && >= 1
  # digivolution card): appends every NON-FLIPPED digivolution card's colors
  # to the top card's CardColors. `modifier: AddColor` with no payload is the
  # engine's "gain the colors of its digivolution cards" treatment, read live
  # by `Permanent::synth_identity` (with zero sources it gains nothing, which
  # is DCGO's `DigivolutionCards.Count >= 1` guard). Official Q&A: white +
  # red + green sources = a 3-color white/red/green card.
  - kind: aura
    target: {}
    active_when: { your_turn: true }
    modifier: AddColor
    summary: "[Your Turn] This Digimon is treated as also having the colors of its digivolution cards"

  # ─── [Your Turn] While this Digimon has 4 or more colors: +4000 DP ───────
  #
  # DCGO ChangeSelfDPStaticEffect(4000), condition IsOwnerTurn &&
  # `TopCard.CardColors.Count >= 4` — the colors AFTER the treatment above,
  # which `self_color_count_gte` reads from the synthesized identity.
  - kind: aura
    target: {}
    active_when:
      your_turn: true
      self_color_count_gte: 4
    dp_modifier: 4000
    summary: "[Your Turn] While this Digimon has 4 or more colors, it gets +4000 DP"
