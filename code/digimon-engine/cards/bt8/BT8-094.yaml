card: BT8-094
name: "Digimon Emperor"
kind: tamer
color: [black]
cost: 3

# ─── Clause A: [All Turns] opponent's Lv.5-or-lower deletion observer ───────
#
# Printed text: "When one of your opponent's level 5 or lower Digimon is
# deleted, you may suspend this Tamer to <Draw 1>."
#
# Uses `event_target_level_lte` against the deleted-object snapshot so Lv.6+
# deletions do not offer the suspend cost. `optional: true` ensures the
# activation-cost prompt exposes PASS before this Tamer is suspended.
#
# ─── Clause B: [Opponent's Turn] opponent's Lv.3 breeding-move observer ───────
#
# Printed text: "When one of your opponent's level 3 Digimon is moved from
# their breeding area to their battle area, gain 2 memory."
#
# `on_move` dispatch carries the moved permanent as the event target.
# `event_target_owner: opponent` scopes to the opponent's board and
# `event_target_level_eq: 3` pins the printed Lv.3 requirement.

effects:
  - when: on_any_deletion
    active_when: { all_turns: true }
    optional: true
    summary: "[All Turns] When opponent's Lv.5 or lower Digimon is deleted, may suspend self to Draw 1"
    condition:
      all_of:
        - event_target_owner: opponent
        - event_target_kind: digimon
        - event_target_level_lte: 5
        - source_is_unsuspended: true
    process:
      - activation_cost: { suspend_self: true }
      - draw: { of: you, count: 1 }

  - when: on_move
    active_when: { opponents_turn: true }
    summary: "[Opponent's Turn] When opponent's Lv.3 Digimon moves from breeding, gain 2 memory"
    condition:
      all_of:
        - event_target_owner: opponent
        - event_target_kind: digimon
        - event_target_level_eq: 3
    process:
      - gain_memory: 2

  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
