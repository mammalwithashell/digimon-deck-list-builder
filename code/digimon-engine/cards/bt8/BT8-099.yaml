card: BT8-099
name: "Giga Death"
kind: option
color: [blue, green]
cost: 9

effects:
  - text: "[Main] Suspend 1 of your opponent's Digimon. Then, return up to 10 of your opponent's suspended Digimon to the bottom of the deck."
    when: main_from_hand
    summary: "[Main] Suspend 1 opponent Digimon, then return up to 10 opponent suspended Digimon to bottom of deck"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: susp_target
          filter: { kind: digimon }
          prompt: "Suspend 1 of your opponent's Digimon"
      - suspend: { target: susp_target }
      - select_opponent_permanent:
          optional: true
          bind_as: ret1
          filter: { all_of: [{ kind: digimon }, { is_suspended: true }] }
          prompt: "Return up to 10 of your opponent's suspended Digimon to the bottom of the deck (1/10)"
      - if:
          condition: { binding_present: ret1 }
          then:
            - return_to_deck: { target: ret1, position: bottom }
            - select_opponent_permanent:
                optional: true
                bind_as: ret2
                filter: { all_of: [{ kind: digimon }, { is_suspended: true }] }
                prompt: "Return up to 10 of your opponent's suspended Digimon to the bottom of the deck (2/10)"
