  - text: "[Security] Suspend 1 of your opponent's Digimon. Then, return 1 of your opponent's suspended Digimon to the bottom of the deck."
    scope: inherited
    when: on_security
    summary: "[Security] Suspend 1 opponent Digimon, then return 1 opponent suspended Digimon to bottom of deck"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: susp_target
          filter: { kind: digimon }
