card: EX6-016
name: Salamon
kind: digimon
level: 3
color: [yellow]
cost: 3
dp: 1000
traits: [Mammal]
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: yellow }
    cost: 0

effects:
  - when: start_of_your_main_phase
    condition:
      any_of:
        - any_permanent:
            of: you
            zone: [battle_area]
            kind: digimon
            color_is: purple
        - any_permanent:
            of: you
            zone: [battle_area]
            kind: tamer
            color_is: purple
    summary: "[Start of Your Main Phase] If you have a purple Digimon or Tamer, gain 1 memory"
    process:
      - gain_memory: 1

  - scope: inherited
    when: when_attacking
    once_per_turn: true
    condition:
      any_permanent:
        of: opponent
        zone: [battle_area]
        kind: digimon
    summary: "[When Attacking][OPT] 1 opponent Digimon gets -2000 DP for the turn"
    process:
      - select_opponent_permanent:
          bind_as: dp_target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon to get -2000 DP"
      - add_dp_modifier:
          target: dp_target
          value: -2000
          expiry: end_of_turn
