# Printed EX6-063 image and official bundle; DCGO EX6_063.cs agrees.
card: EX6-063
name: T.K. Takaishi & Kari Kamiya
kind: tamer
color: [yellow]
cost: 4

effects:
  - when: [start_of_your_main_phase, on_play]
    summary: "1 of your yellow Digimon gains Barrier until the end of your opponent's turn"
    process:
      - select_own_permanent:
          bind_as: target
          filter:
            all_of:
              - kind: digimon
              - color_is: yellow
          prompt: "Choose 1 of your yellow Digimon to gain Barrier"
      - grant_keyword:
          target: target
          keyword: Barrier
          expiry: end_of_opponents_turn

  - when: [on_enter_field_anyone, on_digivolve]
    active_when: { your_turn: true }
    optional: true
    trigger_if:
      all_of:
        - event_target_owner: you
        - event_card_kind: digimon
    condition:
      all_of:
        - source_is_unsuspended: true
        - any_of:
            - event_card_trait_has: Angel
            - event_card_trait_has: Archangel
            - event_card_trait_has: Three Great Angels
    summary: "[Your Turn] When your Angel, Archangel or Three Great Angels Digimon is played or digivolves, by suspending this Tamer, gain 1 memory"
    process:
      - activation_cost: { suspend_self: true }
      - gain_memory: 1

  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
