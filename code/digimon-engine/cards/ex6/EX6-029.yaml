card: EX6-029
name: Mastemon
kind: digimon
level: 6
color: [yellow, purple]
cost: 7
dp: 12000
traits: [Angel]
attribute: Vaccine
ace_overflow: -4

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: yellow }
    cost: 4
  - kind: blast_dna_digivolve
    materials:
      - { kind: digimon, name_is: "Angewomon" }
      - { kind: digimon, name_is: "LadyDevimon" }
    cost: 0
    stacks_unsuspended: true

effects:
  - kind: grant_keyword
    keyword: BlastDigivolve

  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Play Lv.5 or lower Angel/Archangel/Fallen Angel from hand or trash; if DNA, bottom-security another Digimon and trash opponent security to 4"
    process:
      - select_union_zone:
          of: you
          zones: [hand, trash]
          optional: true
          bind_as: angel_pick
          filter:
            all_of:
              - kind: digimon
              - level_lte: 5
              - any_of:
                  - trait_has: Angel
                  - trait_has: Archangel
                  - trait_has: "Fallen Angel"
          prompt: "Play 1 Lv.5 or lower Angel, Archangel, or Fallen Angel from your hand or trash"
      - play_union_bound_free:
          binding: angel_pick
          bind_as: angel_played
      - if:
          condition: { dna_origin: true }
          then:
            - select_any_permanent:
                bind_as: other_digimon
                filter:
                  all_of:
                    - kind: digimon
                    - other: true
                prompt: "Place 1 other Digimon at the bottom of its owner's security stack"
            - place_permanent_on_owners_security:
                target: other_digimon
                position: bottom
                face: down
            - trash_top_security:
                of: opponent
                count:
                  base: -4
                  per:
                    card_count_in_zone:
                      zone: security
                      of: opponent
                  delta: 1
