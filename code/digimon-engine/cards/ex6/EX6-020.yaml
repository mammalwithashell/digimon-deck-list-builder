card: EX6-020
name: Gatomon
kind: digimon
level: 4
color: [yellow]
cost: 4
dp: 4000
traits: [Holy Beast]
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 2

effects:
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Reveal 3; add an Angel-line card and Mirei Mikagura"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          buckets:
            - bind_as: angel_line_pick
              min: 1
              max: 1
              filter:
                any_of:
                  - trait_has: Angel
                  - trait_has: Archangel
                  - trait_has: Fallen Angel
            - bind_as: mirei_pick
              min: 1
              max: 1
              filter:
                name_contains: "Mirei Mikagura"
          no_duplicate_cards: true
          prompt: "Select an Angel-line card and Mirei Mikagura"
      - add_to_hand_from_reveal: { of: you, card: angel_line_pick }
      - add_to_hand_from_reveal: { of: you, card: mirei_pick }
      - place_remainder_on_deck: { of: you, position: bottom }

  - scope: inherited
    when: when_attacking
    once_per_turn: true
    condition:
      any_permanent:
        of: opponent
        zone: [battle_area]
        kind: digimon
    summary: "[When Attacking][OPT] 1 opponent Digimon gets -2000 DP for the turn"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Give 1 opponent Digimon -2000 DP"
      - add_dp_modifier:
          target: target
          value: -2000
          expiry: end_of_turn
