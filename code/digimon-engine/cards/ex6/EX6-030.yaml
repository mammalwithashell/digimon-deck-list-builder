card: EX6-030
name: Dominimon
kind: digimon
level: 6
color: [yellow]
cost: 12
dp: 12000
traits: [Dominion]
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: yellow }
    cost: 4

effects:
  - when: when_digivolving
    summary: "[When Digivolving] Play 1 level 5 or lower Angel/Archangel from security; shuffle; -7000 DP"
    process:
      - select_security:
          of: you
          bind_as: sec_digimon
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_lte: 5
              - any_of:
                  - trait_has: Angel
                  - trait_has: Archangel
          prompt: "Play 1 level 5 or lower Angel or Archangel Digimon from security"
      - if:
          condition: { binding_present: sec_digimon }
          then:
            - play_security_card: { of: you, card: sec_digimon }
      - shuffle_security: { of: you }
      - select_opponent_permanent:
          bind_as: dp_target
          filter: { kind: digimon }
          prompt: "Select 1 opponent Digimon to get -7000 DP"
      - add_dp_modifier:
          target: dp_target
          value: -7000
          expiry: end_of_turn

  - kind: replacement
    timing: when_would_leave_battle_area
    optional: true
    active_when:
      all_of:
        - replacement_subject_is_mine: true
        - kind: digimon
        - any_of:
            - trait_has: Angel
            - trait_has: Archangel
            - trait_has: Three Great Angels
        - none_of:
            - replacement_cause: own_effect
            - replacement_cause: battle
        - security_count_gte: 1
    summary: "[All Turns] By trashing top security, prevent an Angel/Archangel/Three Great Angels Digimon from leaving"
    process:
      - trash_top_security_and_cancel_replacement: { of: you }
