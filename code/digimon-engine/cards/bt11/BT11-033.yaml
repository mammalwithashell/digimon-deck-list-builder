# BT11-033 MirageGaogamon — Digimon, Lv.6, Blue, DP 12000, Cost 12.
# Traits: Beast Knight
# Standard digivolve: Lv.5 Blue / cost 4 (printed default, from card metadata).
#
# Printed card text (authoritative):
#
#   [When Digivolving] Return 1 of your opponent's level 5 or lower Digimon to
#   its owner's hand. If no Digimon was returned by this effect, your opponent
#   adds the top card of their security stack to their hand.
#   [All Turns] [Once Per Turn] When an effect adds cards to your opponent's
#   hand, gain 1 memory for every 4 cards in your opponent's hand.
#
# (No inherited effect, no security effect.)
#
# DCGO reference: DCGO/Assets/Scripts/CardEffect/BT11/Blue/BT11_033.cs
#
# ─── Clause layout ───────────────────────────────────────────────────────────
# Clause 1 (triggered) — [When Digivolving]:
#   - select_opponent_permanent: opp Digimon with level <= 5 (mandatory pick
#     when a target exists — DCGO canNoSelect: false, maxCount = min(1, count)).
#   - return_to_hand: the selected Digimon (to its owner's hand).
#   - if effect_returned_any_card == false:  ← "If no Digimon was returned"
#       add_top_security_to_hand: { of: opponent }  ← opponent adds THEIR top
#       security to THEIR own hand (DCGO: enemy SecurityCards[0] → AddHandCards
#       on the enemy + ReduceSecurity on the enemy).
#
# Clause 2 (triggered) — [All Turns][Once Per Turn] memory observer: OMITTED.
#   "When an EFFECT adds cards to your opponent's hand, gain 1 memory for every
#    4 cards in your opponent's hand." DCGO: EffectTiming.OnAddHand gated by
#    CanTriggerWhenAddHand(player == Owner.Enemy, cardEffect != null) — i.e.
#    effect-initiated adds to the opponent's hand only (not normal draws) —
#    rewarding floor(Owner.Enemy.HandCards.Count / 4), OPT-locked.
#
#   BLOCKED (no-approximations): the engine's EffectTiming::OnAddToHand is
#   never dispatched and the DSL TriggerWhen enum has no on_add_to_hand token,
#   so "observe an effect adding cards to the opponent's hand" is unexpressible.
#   The memory ARITHMETIC is already composable (gain_memory_fn + a floor_div of
#   card_count_in_zone{ zone: hand, of: opponent } by 4); only the TRIGGER is
#   missing. See docs/RUST_ENGINE_GAPS.md (G-ON-ADD-TO-HAND-OBSERVER) and
#   qa/dsl-vocab-gaps.md. When the observer timing lands, append:
#
#     - when: on_add_to_hand          # effect-initiated adds to opponent hand
#       active_when: { ... }          # [All Turns]
#       once_per_turn: true
#       condition: { event_add_to_hand_player: opponent, event_is_effect_initiated: true }
#       process:
#         - gain_memory_fn:
#             formula:
#               floor_div:
#                 - { base: 0, per: { card_count_in_zone: { zone: hand, of: opponent } }, delta: 1 }
#                 - 4

card: BT11-033
name: MirageGaogamon
kind: digimon
level: 6
color: [blue]
cost: 12
dp: 12000
traits: ["Beast Knight"]

# Standard Lv.5 Blue / cost 4 digivolve (printed default).
alt_paths:
  - kind: digivolve
    from:
      all_of:
        - level_eq: 5
        - color_is: blue
    cost: 4

effects:
  # ─── Clause 1 — [When Digivolving] ─────────────────────────────────────────
  - when: when_digivolving
    summary: "[When Digivolving] Return 1 opp Lv.5-or-lower Digimon to hand; if none returned, opponent adds their top security to hand"
    process:
      - select_opponent_permanent:
          bind_as: returned
          filter:
            all_of:
              - kind: digimon
              - level_lte: 5
          prompt: "Return 1 of your opponent's level 5 or lower Digimon to its owner's hand"
      - return_to_hand: { target: returned }
      - if:
          condition: { effect_returned_any_card: false }
          then:
            - add_top_security_to_hand: { of: opponent }
