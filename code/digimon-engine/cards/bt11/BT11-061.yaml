# BT11-061 Vemmon — Digimon, Lv.3, Black, DP 1000, Cost 3.
# Traits: Unknown. Attribute: Unknown. Form: Rookie.
#
# Printed card text (card image BT11-061.webp — authoritative; cross-checked
# data/card_bundles/BT11-061.md [official Bandai DB] + data/cards.json):
#
#   You can include up to 50 copies of cards with this card's card number in
#   your deck.
#   [Main] By suspending this Digimon, reveal the top 3 cards of your deck.
#   Add up to 1 [Snatchmon], [Destromon], [Galacticmon], or [Fusionize] among
#   them to your hand, and place 1 [Vemmon] among them under this Digimon as
#   its bottom digivolution card. Place the rest at the bottom of your deck
#   in any order.
#
# Inherited Effect:
#   [Your Turn][Once Per Turn] When this Digimon would digivolve into
#   [Destromon] or [Galacticmon], reduce the digivolution cost by 1.
#
# Official Q&A (data/card_bundles/BT11-061.md):
#   "Yes, you can place 1 [Vemmon] as a digivolution card even when none of
#   those cards are among the revealed cards." — the hand-bucket and the
#   bottom-source bucket are INDEPENDENT: a failed/empty hand-bucket pick does
#   not block the Vemmon bottom-source bucket, and vice versa.
#
# Digivolution requirements (official Bandai DB / data/card_bundles/BT11-061.md):
#   Standard: Black Lv.2 / cost 0 (evo_costs).
#
# Deck rule: "You can include up to 50 copies of cards with this card's card
# number in your deck." — the digimoncard.io API drops this rule text on
# ingest; `data/card_overrides.json` patches `max_count_in_deck: 50` directly
# (G-DECK-COPY-LIMIT-RAISE). No DSL clause encodes it — deck-legality is a
# `deck_tools`/validator concern, not a card-effect concern.
#
# DCGO C# reference (read from BASE repo per rule 29 — DO NOT init worktree
# submodule): DCGO/Assets/Scripts/CardEffect/BT11/Black/BT11_061.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
#
# Clause 1 ([Main], EffectTiming.OnDeclaration): `ActivateClass` with
#   `CanUseCondition`: `IsExistOnBattleArea(card) &&
#   CardEffectCommons.CanActivateSuspendCostEffect(card)` — the printed
#   "by suspending this Digimon" cost requires the carrier be on the battle
#   area AND currently unsuspended (the suspend-cost activation gate).
#   `ActivateCoroutine`:
#     1. `SuspendPermanentsClass(card.PermanentOfThisCard()).Tap()` — pays the
#        suspend cost FIRST (unconditional, not itself declinable — the whole
#        [Main] activation is what's optional, matching every other
#        battle-area suspend-cost Main ability in the pool).
#     2. `SimplifiedRevealDeckTopCardsAndSelect(revealCount: 3, ...)` with TWO
#        `SimplifiedSelectCardConditionClass` entries processed in order:
#        - Bucket A (`mode: AddHand, maxCount: 1`): `canTargetCondition` =
#          `CardNames.Contains("Snatchmon"|"Destromon"|"Galacticmon"|
#          "Fusionize")` — no `kind` restriction (Fusionize is an Option
#          card, the other three are Digimon; the printed text filters by
#          NAME only).
#        - Bucket B (`mode: Custom, maxCount: 1`, `SelectCardCoroutine`):
#          `canTargetCondition` = `CardNames.Contains("Vemmon") &&
#          IsExistOnBattleArea(card)` (guards against the carrier having left
#          play mid-resolution) → `AddDigivolutionCardsBottom` places the
#          picked Vemmon under THIS Digimon as its bottom digivolution card.
#     3. `remainingCardsPlace: RemainingCardsPlace.DeckBottom` — every
#        unpicked revealed card (from either bucket, or all 3 if both buckets
#        are declined/empty) goes to the bottom of the deck. DCGO does not
#        expose a top/bottom choice or an explicit re-order prompt for the
#        remainder ("in any order" is flavor text for the engine's internal
#        placement, not a player-facing choice — no RULES_CONTEXT rule
#        requires exposing a trivial same-zone permutation with no
#        information asymmetry).
#   The two buckets are genuinely independent (official Q&A above): DCGO's
#   `SimplifiedRevealDeckTopCardsAndSelect` runs each
#   `SimplifiedSelectCardConditionClass` as its own `canNoSelect`-style
#   optional pick over the shared reveal pool, with no cross-bucket
#   forced-pick coupling.
#
# Clause 2 (inherited, digivolution-cost -1): TWO cooperating DCGO pieces,
#   both `SetIsInheritedEffect(true)`:
#     - `activateClass2` (EffectTiming.OnEnterFieldAnyone, background/no-UI,
#       MaxCountPerTurn 1, hash "DigivolutionCost-1_BT11_061"): gates on
#       `IsOwnerTurn` + `CanTriggerWhenDigivolving` + "this card is not among
#       the evo-root tops" (i.e. this Vemmon source is being dug UNDER by the
#       new digivolution, not itself the new top — G-DIGIVOLVE-COST-TARGET's
#       "buried, not top" precondition, shared with BT21-056) + the NEW top
#       card's `TopCard.CardNames.Contains("Destromon"|"Galacticmon")`. This
#       is the OPT tripwire feeding the shared `MaxCountPerTurn` counter.
#     - `changeCostClass` (EffectTiming.None = BeforePayCost): `CanUseCondition`
#       = `IsExistOnBattleArea` + `IsOwnerTurn` + NOT
#       `isOverMaxCountPerTurn(activateClass2, 1)`. `ChangeCost`: -1 when
#       `CardSourceCondition` (the card being digivolved INTO is Destromon or
#       Galacticmon) AND `PermanentsCondition` (the target permanent IS this
#       card's own carrier). Net visible effect: "-1 when digivolving THIS
#       Vemmon (buried or not) into Destromon/Galacticmon, once per turn,
#       your turn only".
#
# ─── DSL modelling notes ─────────────────────────────────────────────────────
#
# Clause 1: `when: main_on_field`, no `once_per_turn` (DCGO's
#   `SetUpActivateClass(..., -1, false, ...)` = unlimited activations per
#   turn — no [Once Per Turn] tag on the printed [Main] text). Clause-level
#   `condition: { source_is_unsuspended: true }` encodes
#   `CanActivateSuspendCostEffect` (the mask does not auto-gate `main_on_field`
#   on suspension state — the P-224/ST4-14 precedent explicitly authors this
#   as a `condition`/predicate leaf). Process:
#     1. `suspend: { target: source }` — the unconditional "by suspending
#        this Digimon" cost (EX9-060/EX4-061/P-224 idiom: `source` resolves
#        to `CompiledBindingRef::Source` → `ctx.source_permanent`, re-
#        resolved by stable card identity so it survives mid-body shifts).
#     2. `reveal_top_deck { of: you, count: 3, bind_as: revealed }`.
#     3. `select_reveal_buckets` with TWO independent buckets over the same
#        `revealed` pool (BT11-105 Fusionize precedent for the longhand
#        multi-bucket idiom — the `reveal_search` composite is NOT used here
#        because its `RevealSearchDest` enum only supports
#        Hand/Trash/Deck, not `BottomSourceOf`, which bucket B needs):
#        - Bucket `hand_pick` (`min: 0, max: 1`): `any_of: [name_is:
#          Snatchmon, name_is: Destromon, name_is: Galacticmon, name_is:
#          Fusionize]` — no `kind` filter (Fusionize is an Option card).
#        - Bucket `vemmon_pick` (`min: 0, max: 1`): `name_is: "Vemmon"`.
#     4. `add_to_hand_from_reveal { of: you, card: hand_pick }` — bucket A's
#        pick (already a `CardList`, `add_to_hand_from_reveal` iterates it
#        directly per `resolved_cards()`).
#     5. `per_selected { selection: vemmon_pick, bind_as: vemmon_card, body:
#        [place_as_bottom_source { source: vemmon_card, target: source }] }`
#        — bucket B's pick needs `per_selected` (not a direct
#        `place_as_bottom_source: { source: vemmon_pick }`) because
#        `PlaceAsBottomSource`'s executor resolves `source` via
#        `resolve_card_source_ref`, which only recognizes a single `Card`
#        binding — NOT a bucket's `CardList` binding (confirmed against
#        `code/digimon-engine/src/dsl_cards/step/play_digivolve.rs`
#        `resolve_card_source_ref`, whose match arms cover
#        `HandIndex`/`TrashIndex`/`Card`/`SourceRefs` but fall through `_ =>
#        None` for `CardList`). `per_selected` over a `CardList` binding
#        unwraps each element and rebinds it as a plain `Card` per iteration
#        (`code/digimon-engine/src/dsl_cards/step/iteration.rs`), so this is
#        the correct idiom — the `vemmon_pick` bucket's `max: 1` bounds the
#        loop to 0 or 1 iterations, matching "place 1 [Vemmon]".
#     6. `per_selected { selection: revealed, bind_as: rest, body:
#        [return_to_deck_from_reveal { of: you, card: rest, position: bottom
#        }] }` — the remainder tail (BT11-105 precedent, swapping
#        `trash_from_reveal` for `return_to_deck_from_reveal` since this
#        card's remainder goes to the deck bottom, not trash).
#        `return_to_deck_from_reveal`/`trash_from_reveal`/
#        `add_to_hand_from_reveal` are all safe no-ops on a card handle that
#        has already left `revealed_cards` (moved out by an earlier bucket
#        move) — confirmed via `Game::trash_from_reveal`'s
#        `position()`-then-bail shape, mirrored by
#        `return_to_deck_from_reveal` — so iterating the FULL original
#        `revealed` binding over both already-moved and still-present cards
#        is safe and matches the BT11-105 idiom exactly.
#
# Clause 2: `kind: cost_reduction`, `scope: inherited`, `once_per_turn: true`,
#   `active_when: { all_of: [your_turn: true, source_is_cost_target_permanent:
#   true, cost_target: { any_of: [name_is: Destromon, name_is: Galacticmon] }
#   ] }`, `amount: 1` — the proven Phase 2 Track H substrate
#   (BT21-011/BT21-056/P-117 exemplars). `source_is_cost_target_permanent`
#   encodes "this Digimon" being the one digivolving (buried or top,
#   regardless of position — matches DCGO's `PermanentsCondition` check
#   against the carrier permanent, not the source card's stack position);
#   `cost_target` with exact `name_is` (not `name_contains` / text-scan)
#   matches the printed text's plain card names, unlike BT21-056's own
#   different-Vemmon-printing "[Vemmon] in its text" whole-card-scan wording.

card: BT11-061
name: Vemmon
kind: digimon
level: 3
color: [black]
cost: 3
dp: 1000
traits: [Unknown]
attribute: Unknown

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 0

effects:
  # ─── Clause 1 — [Main] suspend-cost reveal-and-bucket-pick ─────────────────
  - when: main_on_field
    summary: "[Main] By suspending this Digimon, reveal top 3: add up to 1 [Snatchmon]/[Destromon]/[Galacticmon]/[Fusionize] to hand, place 1 [Vemmon] as bottom source, rest to deck bottom"
    condition:
      source_is_unsuspended: true
    process:
      # Cost: suspend this Digimon (unconditional, paid before the reveal).
      - suspend: { target: source }
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      # Two INDEPENDENT optional buckets over the same reveal pool (official
      # Q&A: Vemmon can be placed even if none of the other 4 names appear).
      - select_reveal_buckets:
          from: revealed
          buckets:
            - bind_as: hand_pick
              min: 0
              max: 1
              filter:
                any_of:
                  - name_is: "Snatchmon"
                  - name_is: "Destromon"
                  - name_is: "Galacticmon"
                  - name_is: "Fusionize"
            - bind_as: vemmon_pick
              min: 0
              max: 1
              filter:
                name_is: "Vemmon"
          prompt: "Choose up to 1 [Snatchmon]/[Destromon]/[Galacticmon]/[Fusionize] to add to hand, then up to 1 [Vemmon] to place as this Digimon's bottom digivolution card"
      - add_to_hand_from_reveal: { of: you, card: hand_pick }
      - per_selected:
          selection: vemmon_pick
          bind_as: vemmon_card
          body:
            - place_as_bottom_source:
                source: vemmon_card
                target: source
      - per_selected:
          selection: revealed
          bind_as: rest
          body:
            - return_to_deck_from_reveal:
                of: you
                card: rest
                position: bottom

  # ─── Clause 2 — Inherited [Your Turn][OPT] digivolve-cost -1 ───────────────
  - kind: cost_reduction
    scope: inherited
    reduction_timing: before_pay_cost
    active_when:
      all_of:
        - your_turn: true
        - source_is_cost_target_permanent: true
        - cost_target:
            any_of:
              - name_is: "Destromon"
              - name_is: "Galacticmon"
    once_per_turn: true
    amount: 1
    summary: "[Your Turn][OPT] Inherited: when this Digimon would digivolve into [Destromon] or [Galacticmon], reduce the digivolution cost by 1"
