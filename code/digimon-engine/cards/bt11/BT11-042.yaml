card: BT11-042
name: Angewomon
kind: digimon
level: 5
color: [yellow]
cost: 7
dp: 6000
traits: [Archangel]
attribute: Vaccine
alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: yellow }
    cost: 3

effects:
  - when: when_digivolving
    summary: "[When Digivolving] May add Angel/Archangel/Fallen Angel from security; if added, recover; shuffle security"
    process:
      - select_security:
          of: you
          bind_as: sec_pick
          optional: true
          filter:
            all_of:
              - any_of:
                  - trait_has: Angel
                  - trait_has: Archangel
                  - trait_has: Fallen Angel
          prompt: "Add 1 Angel, Archangel, or Fallen Angel from security to hand"
      - if:
          condition: { binding_present: sec_pick }
          then:
            - add_to_hand_from_security: { of: you, card: sec_pick }
            - recover: { of: you, count: 1 }
      - shuffle_security: { of: you }

  - when: on_ally_played
    once_per_turn: true
    active_when: { your_turn: true }
    condition:
      all_of:
        - event_target_owner: you
        - any_of:
            - event_target_name_contains: "LadyDevimon"
            - event_target_name_contains: "Mirei Mikagura"
    summary: "[Your Turn][OPT] When you play LadyDevimon or Mirei, gain 1 memory"
    process:
      - gain_memory: 1

  - scope: inherited
    kind: aura
    active_when:
      all_of:
        - opponents_turn: true
        - any_permanent:
            of: you
            kind: digimon
            color_is: purple
    target:
      owner: you
      zone: [battle_area]
      kind: digimon
      any_of:
        - trait_has: Angel
        - trait_has: Archangel
        - trait_has: Fallen Angel
    grant_keyword: { keyword: Blocker }
