card: BT11-032
name: UlforceVeedramon
kind: digimon
level: 6
form: Mega
attribute: Vaccine
color: [blue]
cost: 12
dp: 12000
traits: [Holy Warrior, Royal Knight]

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: blue }
    cost: 4

effects:
  - text: "[When Digivolving] You may play 1 blue Tamer card from your hand without paying the cost."
    when: when_digivolving
    optional: true
    summary: "[WD] May play 1 blue Tamer from hand free"
    process:
      - select_hand:
          of: you
          bind_as: tamer_card
          optional: true
          filter:
            all_of:
              - kind: tamer
              - color_is: blue
              - can_play_from_effect_without_cost: true
          prompt: "You may play 1 blue Tamer card from your hand without paying the cost"
      - if:
          condition: { binding_present: tamer_card }
          then:
            - play_from_hand_free: { of: you, hand_index: tamer_card }

  - text: "[Your Turn] When any of your blue Tamers are played, this Digimon unsuspends."
    when: on_ally_played
    active_when: { your_turn: true }
    trigger_if:
      all_of:
        - event_target_owner: you
        - event_target_kind: tamer
        - event_target_color_any_of: [blue]
    summary: "[Your Turn] When any of your blue Tamers are played, unsuspend this Digimon"
    process:
      - unsuspend: { target: source }

  - text: "[Your Turn][Once Per Turn] When this Digimon unsuspends, return 1 of your opponent's level 3 or lower Digimon to the hand. For each of your blue Tamers, add 1 to this effect's level maximum."
    when: on_unsuspend
    once_per_turn: true
    active_when: { your_turn: true }
    trigger_if: { event_permanent_is_source: true }
    summary: "[Your Turn][OPT] When this Digimon unsuspends, bounce 1 opponent Digimon with Lv <= 3 + blue Tamers"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: bounced
          filter:
            all_of:
              - kind: digimon
              - level_lte:
                  formula:
                    base: 3
                    per:
                      card_count_in_zone:
                        of: you
                        zone: battle_area
                        filter:
                          all_of:
                            - kind: tamer
                            - color_is: blue
                    delta: 1
          prompt: "Return 1 of your opponent's Digimon within the level maximum to the hand"
      - return_to_hand: { target: bounced }
