card: EX9-067
name: Mirai Kinosaki
kind: tamer
color: [yellow]
cost: 3
traits: [LIBERATOR]

effects:
  - when: on_play
    summary: "Reveal top 3; add 1 Puppet or LIBERATOR card; bottom the rest"
    process:
      - reveal_top_deck: { of: you, count: 3 }
      - select_reveal:
          of: you
          bind_as: pick
          optional: false
          filter:
            any_of:
              - trait_has: Puppet
              - trait_has: LIBERATOR
          prompt: "Add 1 Puppet or LIBERATOR card"
      - add_to_hand_from_reveal: { of: you, card: pick }
      - place_remainder_on_deck: { of: you, position: bottom }

  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}

  # [Your Turn] when any of your Digimon digivolve into Puppet, return this Tamer
  # to deck bottom to play Arisa/Puppet from hand at -3 cost. This remains blocked
  # on Puppet event-context/provenance coverage and the reduced-cost play rider.
