card: EX9-067
name: Mirai Kinosaki
kind: tamer
color: [yellow]
cost: 3
traits: [LIBERATOR]

effects:
  - text: "[On Play] Reveal the top 3 cards of your deck. Add 1 card with the [Puppet] or [LIBERATOR] trait among them to the hand. Return the rest to the bottom of the deck."
    when: on_play
    summary: "Reveal top 3; add 1 Puppet or LIBERATOR card; bottom the rest"
    process:
      - reveal_top_deck: { of: you, count: 3 }
      - select_reveal:
          of: you
          bind_as: pick
          optional: false
          filter:
            any_of:
              - trait_has: Puppet
              - trait_has: LIBERATOR
          prompt: "Add 1 Puppet or LIBERATOR card"
      - add_to_hand_from_reveal: { of: you, card: pick }
      - place_remainder_on_deck: { of: you, position: bottom }

  - text: "[Security] Play this card without paying the cost."
    when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}

  # ─── [Your Turn] a Digimon of yours digivolves into a [Puppet] → by returning
  #     this Tamer to the deck bottom, you may play Arisa Kinosaki / a [Puppet]
  #     Digimon from hand with its play cost reduced by 3 ───────────────────────
  #
  # Printed: "[Your Turn] When any of your Digimon digivolve into a [Puppet]
  # trait Digimon, by returning this Tamer to the bottom of the deck, you may
  # play 1 [Arisa Kinosaki] or 1 [Puppet] trait Digimon card from your hand with
  # the play cost reduced by 3."
  #
  # DCGO EX9_067.cs ("Your Turn" region): `CanTriggerWhenPermanentDigivolving`
  # keyed on an own battle-area Digimon whose TopCard has [Puppet] — the event
  # is the digivolution having HAPPENED (effect-initiated digivolves count),
  # not the would-digivolve interrupt. `isOptional: true`; CanActivate = this
  # Tamer on the battle area + owner's turn. Body: DeckBottomBounce this Tamer
  # (the "by returning" cost, paid on acceptance), then a `canNoSelect: true`
  # SelectHandEffect over {Tamer named "Arisa Kinosaki"} | {Digimon with
  # [Puppet]}, then `PlayPermanentCards(payCost: true, fixedCost: base - 3)`.
  #
  # → `when: on_digivolve` (fires for hand / effect / DNA digivolves) +
  #   `event_card_trait_has: Puppet` on the digivolved-into card + the
  #   BT22-088 `activation_cost: return_self_to_deck_bottom` cost, then
  #   `select_hand` + `play_from_hand { cost_delta: { reduce: 3 } }` (the
  #   BT15-096 reduced-cost play rider; the pick filter carries the same
  #   `affordable_with_cost` / `can_play_from_effect_without_cost` so an
  #   unplayable card is not a legal pick, CR 4.3 1-3-2).
  - text: "[Your Turn] When any of your Digimon digivolve into a [Puppet] trait Digimon, by returning this Tamer to the bottom of the deck, you may play 1 [Arisa Kinosaki] or 1 [Puppet] trait Digimon card from your hand with the play cost reduced by 3."
    when: on_digivolve
    optional: true
    active_when: { your_turn: true }
    trigger_if:
      all_of:
        - event_target_owner: you
        - event_card_kind: digimon
        - event_card_trait_has: Puppet
    summary: "[Your Turn] When your Digimon digivolve into a [Puppet], by returning this Tamer to deck bottom, you may play 1 [Arisa Kinosaki] or [Puppet] Digimon from hand with play cost -3"
    process:
      - activation_cost: { return_self_to_deck_bottom: true }
      - select_hand:
          of: you
          bind_as: play_pick
          optional: true
          filter:
            all_of:
              - any_of:
                  - all_of:
                      - kind: tamer
                      - name_is: "Arisa Kinosaki"
                  - all_of:
                      - kind: digimon
                      - trait_has: Puppet
              - can_play_from_effect_without_cost: true
              - affordable_with_cost: { reduce: 3 }
          prompt: "You may play 1 [Arisa Kinosaki] or [Puppet] Digimon from your hand with the play cost reduced by 3"
      - play_from_hand:
          of: you
          hand_index: play_pick
          cost_delta: { reduce: 3 }
