card: EX9-032
name: Karakurumon
kind: digimon
level: 5
color: [yellow, purple]
cost: 7
dp: 7000
traits: [Puppet, LIBERATOR]
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: yellow }
    cost: 4

  - kind: digivolve
    from: { level_eq: 4, trait_has: Puppet }
    cost: 3
    ignore_requirements: true

effects:
  # [On Play] [When Digivolving] delete-cost self-digivolve is omitted.
  # Current DSL/runtime loses a stable `self` binding if the selected cost body
  # is before this permanent in battle-area order, and the process may still
  # prompt without a legal cost body. Keep ignored tests in ex9_032.rs until
  # the costed self-digivolve sequence has stable source-permanent provenance.

  - kind: replacement
    scope: inherited
    trigger: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    active_when:
      all_of:
        - replacement_subject_is_mine: true
        - kind: digimon
        - none_of:
            - replacement_cause: own_effect
    summary: "[All Turns][OPT] Delete 1 Token or other Puppet Digimon so this Digimon doesn't leave"
    process:
      - select_own_permanent:
          bind_as: prevent_cost
          filter:
            all_of:
              - other: true
              - any_of:
                  - kind: token
                  - all_of:
                      - kind: digimon
                      - trait_has: Puppet
          prompt: "Delete 1 of your Tokens or other Puppet Digimon"
      - delete_permanent: { target: prevent_cost }
      - cancel_replacement: {}
