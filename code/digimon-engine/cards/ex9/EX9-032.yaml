card: EX9-032
name: Karakurumon
kind: digimon
level: 5
color: [yellow, purple]
cost: 7
dp: 7000
traits: [Puppet, LIBERATOR]
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: yellow }
    cost: 4

  - kind: digivolve
    from: { level_eq: 4, trait_has: Puppet }
    cost: 3
    ignore_requirements: true

effects:
  # ─── Clause 1 — [On Play] [When Digivolving] costed free Puppet hand digivolve ─
  #
  # Printed text:
  #   "[On Play] [When Digivolving] By deleting 1 of your Tokens or other
  #    [Puppet] trait Digimon, this Digimon may digivolve into a Digimon card
  #    with the [Puppet] trait in the hand without paying the cost."
  #
  # The cost body deletion can shift battle-area indices before
  # `effect_initiated_digivolve { target: source }` resolves. Audit (2026-05-15)
  # flagged the substrate as UNCLEAR — write the body and unignore tests in
  # ex9_032.rs to confirm whether `ctx.source_permanent` stays stable across
  # the cost-payment deletion, or to surface the concrete failure mode.
  - when: [on_play, when_digivolving]
    optional: true
    summary: "[OnPlay/WhenDigivolving] Delete 1 Token/other Puppet, free-digivolve into a Puppet hand card"
    process:
      - select_own_permanent:
          bind_as: cost_body
          optional: true
          filter:
            all_of:
              - other: true
              - any_of:
                  - kind: token
                  - all_of:
                      - kind: digimon
                      - trait_has: Puppet
          prompt: "Delete 1 of your Tokens or other Puppet Digimon"
      - delete_permanent: { target: cost_body }
      - select_hand:
          of: you
          bind_as: evo
          filter:
            all_of:
              - kind: digimon
              - trait_has: Puppet
          prompt: "Free-digivolve into a Puppet Digimon card"
      - effect_initiated_digivolve:
          target: source
          from_hand: evo
          cost: 0
          ignore_requirements: true

  - kind: replacement
    scope: inherited
    trigger: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    active_when:
      all_of:
        - replacement_subject_is_mine: true
        - kind: digimon
        - none_of:
            - replacement_cause: own_effect
    summary: "[All Turns][OPT] Delete 1 Token or other Puppet Digimon so this Digimon doesn't leave"
    process:
      - select_own_permanent:
          bind_as: prevent_cost
          filter:
            all_of:
              - other: true
              - any_of:
                  - kind: token
                  - all_of:
                      - kind: digimon
                      - trait_has: Puppet
          prompt: "Delete 1 of your Tokens or other Puppet Digimon"
      - delete_permanent: { target: prevent_cost }
      - cancel_replacement: {}
