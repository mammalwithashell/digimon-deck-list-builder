card: EX9-033
name: Kaguyamon
kind: digimon
level: 6
color: [yellow, purple]
cost: 12
dp: 12000
traits: [Puppet, LIBERATOR]
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: yellow }
    cost: 4

  - kind: digivolve
    from: { level_eq: 5, trait_has: Puppet }
    cost: 3
    ignore_requirements: true

effects:
  - kind: aura
    target:
      owner: you
      zone: [battle_area]
      any_of:
        - kind: token
        - all_of:
            - kind: digimon
            - trait_has: Puppet
    grant_keyword:
      keyword: Alliance

  - kind: aura
    target:
      owner: you
      zone: [battle_area]
      any_of:
        - kind: token
        - all_of:
            - kind: digimon
            - trait_has: Puppet
    grant_keyword:
      keyword: Blocker

  - when: end_of_your_turn
    once_per_turn: true
    optional: true
    summary: "You may play 1 level 4 or lower Puppet Digimon from trash without paying the cost"
    process:
      - select_trash:
          of: you
          bind_as: puppet
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_lte: 4
              - trait_has: Puppet
          prompt: "Play 1 level 4 or lower Puppet Digimon from trash"
      - play_from_trash_free:
          of: you
          hand_index: puppet
