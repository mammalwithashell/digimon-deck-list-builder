# EX9-066 Tai Kamiya & Matt Ishida — Tamer, Cost 4, Red+Blue.
#
# Printed effect (cards.json effect_description_eng):
#   [On Play] You may return 1 Digimon card with [Greymon], [Garurumon] or
#   [Omnimon] in its name from your trash to the hand. If this effect didn't
#   return, ＜Draw 1＞ (Draw 1 card from your deck.)
#   [All Turns] When any of your Digimon are played or digivolve, by suspending
#   this Tamer, gain 1 memory if you have a Digimon with [Greymon] in its name.
#   Then, gain 1 memory if you have a Digimon with [Garurumon] in its name.
#
# Inherited / Security text (cards.json inherited_effect_description_eng):
#   Security Effect [Security] Play this card without paying the cost.
#
# DCGO C# reference:
#   DCGO/Assets/Scripts/CardEffect/EX9/Red/EX9_066.cs
#
# ─── Clause 1 — [On Play] return-from-trash ELSE draw 1 ────────────────────────
#
# DCGO (EX9_066.cs:14-87): single ActivateClass on EffectTiming.OnEnterFieldAnyone
# gated only by CanTriggerOnPlay (no [When Digivolving] half — distinct from the
# AD1-001 trash-recursion clause). `SetUpActivateClass(..., isOptional: false)`
# (`false` at param index 4) — the OUTER activation is MANDATORY. The optionality
# is purely on the inner SelectCardEffect:
#
#   selectCardEffect.SetUp(
#       canTargetCondition: ReturnCard (Greymon|Garurumon|Omnimon name),
#       canNoSelect: () => true,            ← player may decline the pick
#       maxCount: 1,
#       mode: SelectCardEffect.Mode.AddHand,
#       root: SelectCardEffect.Root.Trash,
#       ...);
#
# The SelectCardEffect is only entered when
# `HasMatchConditionOwnersCardInTrash(card, ReturnCard)` is true. After the
# (skipped or executed) selection coroutine returns, DCGO reads a local
# `cardAdded` flag set inside `SelectCardCoroutine` only if `sources.Count > 0`,
# and if `!cardAdded` runs `DrawClass(card.Owner, 1, ...).Draw()`.
#
# Mapped exactly (2026-11-12): an optional `select_trash` (a decline continues), then
# `binding_present: pick` -> return it, `binding_absent: pick` -> <Draw 1>. With no eligible card
# the optional pick asks nothing and the draw runs, as in DCGO. (The earlier always-on
# Return/Draw branch choice dropped the draw when the return branch returned nothing.)
#
# Cost-2 test note: this clause is NOT marked `optional: true` at the clause
# level because DCGO's outer `isOptional: false` means the player cannot skip
# the [On Play] entirely. The inner `select_effect_choice` enforces the binary
# decision (Return vs Draw); within branch 0, the trash pick is `optional: true`
# so an empty-eligible-pool degrades gracefully.
#
# ─── Clause 2 — [All Turns] on play/digivolve observer ─────────────────────────
#
# DCGO (EX9_066.cs:91-148): single ActivateClass on EffectTiming.OnEnterFieldAnyone
# gated with both `CanTriggerOnPermanentPlay` and
# `CanTriggerWhenPermanentDigivolving`, both filtered to a permanent that is on
# the OWNER's battle area AND IsDigimon (`IsPermanentExistsOnOwnerBattleAreaDigimon`).
# `SetUpActivateClass(..., isOptional: true)` — the outer activation is OPTIONAL
# ("by suspending this Tamer" is the cost; declining the prompt avoids the cost).
# Body: tap (suspend) self first, then independently checks for own
# [Greymon]-named (+1 memory) and own [Garurumon]-named (+1 memory) Digimon.
#
# This clause is structurally identical to BT17-081 clause 1 — see that file
# for the full DCGO mapping commentary. The only difference vs BT17-081 is the
# printed wording order ("gain 1 memory if you have... Then, gain 1 memory if
# you have..." vs BT17-081's "if you have..., gain 1 memory. If you have...,
# gain 1 memory."), which is semantically identical: two independent
# board-state checks at resolution time.
#
# DSL mapping (mirrors BT17-081 clause 1 verbatim):
#   - `when: [on_enter_field_anyone, on_digivolve]` covers play+digivolve halves.
#   - `active_when: { all_turns: true }` per [All Turns] scoping.
#   - `condition: event_target_owner: you AND event_target_kind: digimon` —
#     DCGO `IsPermanentExistsOnOwnerBattleAreaDigimon`. Tamer entries do NOT
#     satisfy this gate (printed text scopes to "your **Digimon**").
#   - `optional: true` — "by suspending this Tamer" makes the outer activation
#     declinable.
#   - Cost step: `suspend: { target: source }` (BT17-081 / BT24-082 idiom).
#   - Body: two independent `if any_permanent` checks (Greymon / Garurumon),
#     each running `gain_memory: 1` when satisfied.
#
# Same gap status applies as BT17-081: G-ENTERING-PERMANENT-TRAIT is partially
# closed for hand-played battle-area permanents and hand-driven
# `Game::digivolve_from_hand` (2026-04-29). DNA digivolve, effect-initiated
# digivolve, and breeding-area observer fan-out remain open.
#
# ─── Clause 3 — [Security] Play this card without paying the cost ─────────────
#
# DCGO (EX9_066.cs:152-159): EffectTiming.SecuritySkill →
# CardEffectFactory.PlaySelfTamerSecurityEffect(card). Standard security-play
# pattern. DSL: `when: on_security`, `play_from_security: {}` (BT17-081 /
# BT22-084 / BT18-087 idiom).

card: EX9-066
name: Tai Kamiya & Matt Ishida
kind: tamer
color: [red, blue]
cost: 4

effects:
  # ─── Clause 1: [On Play] return-from-trash ELSE draw 1 ─────────────────────
  # DCGO EX9_066.cs: a mandatory [On Play]; when the trash holds an eligible card it opens ONE optional trash
  # pick (SelectCardEffect, canNoSelect), and draws when nothing was added (`cardAdded`). No eligible card: no
  # prompt, draw. The optional pick IS the choice; there is no separate "return or draw" question.
  - when: on_play
    summary: "[On Play] May return Greymon/Garurumon/Omnimon-named card from trash; if didn't return, draw 1"
    process:
      - select_trash:
          of: you
          bind_as: pick
          optional: true
          filter:
            all_of:
              - kind: digimon
              - any_of:
                  - name_contains: "Greymon"
                  - name_contains: "Garurumon"
                  - name_contains: "Omnimon"
          prompt: "You may return 1 [Greymon/Garurumon/Omnimon] Digimon card from your trash to the hand"
      - if:
          condition: { binding_present: pick }
          then:
            - add_to_hand_from_trash: { of: you, card: pick }
      # "If this effect didn't return, <Draw 1>"
      - if:
          condition: { binding_absent: pick }
          then:
            - draw: { of: you, count: 1 }

  # ─── Clause 2: [All Turns] on own Digimon play/digivolve ───────────────────
  - when: [on_enter_field_anyone, on_digivolve]
    optional: true
    active_when: { all_turns: true }
    summary: "[All Turns] On own Digimon play/digivolve, suspend self → +1 memory per Greymon and per Garurumon on own field"
    trigger_if:
      all_of:
        - event_target_owner: you
        - event_target_kind: digimon
    process:
      # Cost: suspend this Tamer ("by suspending this Tamer"). `source` resolves
      # to CompiledBindingRef::Source → ctx.source_permanent (the Tamer).
      - suspend: { target: source }
      # Greymon check: independently grant +1 memory if any own [Greymon]-named
      # Digimon is on the field at resolution time.
      - if:
          condition:
            any_permanent:
              of: you
              zone: [battle_area]
              kind: digimon
              name_contains: "Greymon"
          then:
            - gain_memory: 1
      # Garurumon check: same, independent of the Greymon check.
      - if:
          condition:
            any_permanent:
              of: you
              zone: [battle_area]
              kind: digimon
              name_contains: "Garurumon"
          then:
            - gain_memory: 1

  # ─── Clause 3: [Security] Play this card without paying the cost ───────────
  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
