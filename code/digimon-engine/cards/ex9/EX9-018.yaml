card: EX9-018
name: MetalMamemon
kind: digimon
level: 5
form: Ultimate
attribute: Data
color: [blue, black]
cost: 7
dp: 7000
traits: [Cyborg, DM, "Ver.2"]

alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: blue }
    cost: 4
  - kind: digivolve
    from: { level_eq: 4, color_is: black }
    cost: 4
  - kind: digivolve
    from: { any_color: true, name_is: Mamemon }
    cost: 1
  - kind: digivolve
    from: { any_color: true, level_eq: 4, trait_has: DM }
    cost: 3

effects:
  - text: "When this card would be played, by trashing 1 [Cyborg] or [Ver.2] trait card from your hand, reduce the play cost by 2."
    kind: cost_reduction
    when_playing_this: true
    amount: 2
    optional: true
    pay_cost:
      - select_hand:
          of: you
          bind_as: cost_discard
          optional: true
          filter:
            any_of:
              - trait_has: Cyborg
              - trait_has: "Ver.2"
          prompt: "By trashing 1 [Cyborg] or [Ver.2] trait card from your hand, reduce the play cost by 2"
      - trash_from_hand_by_index: { of: you, hand_index: cost_discard }
    summary: "When played, by trashing 1 [Cyborg]/[Ver.2] card from hand, reduce play cost by 2"

  - text: "[On Play] [When Digivolving] By placing 1 Digimon card from your trash face down as this Digimon's bottom digivolution card, from 1 of your opponent's Digimon, trash any 1 digivolution card for each of this Digimon's face-down digivolution cards. Then, return 1 of their Digimon with no digivolution cards to the bottom of the deck."
    when: [on_play, when_digivolving]
    summary: "[OP][WD] May place 1 Digimon from trash face down under self to strip 1 source per face-down source from 1 opp Digimon; then bottom 1 opp Digimon with 0 sources"
    process:
      - select_trash:
          of: you
          bind_as: fd_pick
          optional: true
          filter: { kind: digimon }
          prompt: "By placing 1 Digimon card from your trash face down as this Digimon's bottom digivolution card, strip opponent's digivolution cards"
      - if:
          condition: { binding_present: fd_pick }
          then:
            - place_as_bottom_source:
                source: fd_pick
                target: source
                face_down: true
            - select_opponent_sources:
                min:
                  formula:
                    base: 0
                    per:
                      source_stack_count:
                        filter: { is_face_down: true }
                    delta: 1
                max:
                  formula:
                    base: 0
                    per:
                      source_stack_count:
                        filter: { is_face_down: true }
                    delta: 1
                clamp_to_available: true
                bind_as: stripped
                prompt: "Trash 1 digivolution card for each of this Digimon's face-down digivolution cards"
                then:
                  - trash_selected_sources: { source_refs: stripped }
      - select_opponent_permanent:
          optional: false
          bind_as: bottom_target
          filter:
            all_of:
              - kind: digimon
              - materials_count_lte: 0
          prompt: "Return 1 of your opponent's Digimon with no digivolution cards to the bottom of the deck"
      - return_to_deck: { target: bottom_target, position: bottom }

  - text: "[End of Your Turn] [Once Per Turn] 1 of your Digimon unsuspends."
    scope: inherited
    when: end_of_your_turn
    once_per_turn: true
    summary: "[Inherited][End of Your Turn][OPT] Unsuspend 1 of your Digimon"
    process:
      - select_own_permanent:
          optional: false
          bind_as: unsusp
          filter: { kind: digimon }
          prompt: "1 of your Digimon unsuspends"
      - unsuspend: { target: unsusp }
