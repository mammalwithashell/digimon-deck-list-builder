card: EX9-024
name: Hanimon
kind: digimon
level: 3
color: [yellow, purple]
cost: 3
dp: 1000
traits: [Puppet, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: yellow }
    cost: 1
  - kind: digivolve
    from: { name_contains: "Kyaromon" }
    cost: 0

effects:
  - when: on_play
    optional: true
    summary: "By trashing 1 card in hand, you may return 1 Puppet Digimon from trash to hand"
    condition:
      count_gte:
        filter: { of: you, zone: [hand] }
        n: 1
    process:
      - select_hand:
          of: you
          bind_as: discard
          optional: true
          filter: {}
          prompt: "Trash 1 card from your hand"
      - trash_from_hand_by_index: { of: you, hand_index: discard }
      - select_trash:
          of: you
          bind_as: pick
          optional: true
          filter:
            all_of:
              - kind: digimon
              - trait_has: Puppet
          prompt: "Return 1 Puppet Digimon from trash to hand"
      - add_to_hand_from_trash: { of: you, card: pick }

  - scope: inherited
    when: on_opponent_attack
    once_per_turn: true
    active_when: { opponents_turn: true }
    summary: "Opponent's Turn OPT: by deleting this Digimon, end the attack"
    process:
      - select_effect_choice:
          labels: ["Delete this Digimon and end the attack", "Decline"]
          bind_as: cancel_choice
          prompt: "Delete this Digimon to end the attack?"
      - if:
          condition: { equals: [cancel_choice, 0] }
          then:
            - delete_permanent: { target: this }
            - end_attack: true
