card: EX9-008
name: Biyomon
kind: digimon
level: 3
color: [red]
cost: 3
dp: 1000
traits: [Bird, DM, Ver.4]

# Standard digivolution: Lv2 Red / Cost 0.
# Alt-digivolve (xros_req): Lv2 with [DM] trait / Cost 0.
alt_paths:
  # Printed circle: Red Lv.2 / cost 0. The colour is part of the
  # requirement; a gate without `color_is` digivolves from any colour.
  - kind: digivolve
    from: { level_eq: 2, color_is: red }
    cost: 0

  - kind: digivolve
    from: { level_eq: 2, trait_has: DM }
    cost: 0
    ignore_requirements: true

effects:
  # <Training> — printed keyword declared through the shared grant_keyword DSL.
  - text: "＜Training＞ (In the main phase, by suspending this Digimon, place your deck's top card face down as this Digimon's bottom digivolution card. This effect can also activate in the breeding area.)"
    kind: grant_keyword
    keyword: Training

  # Inherited <Raid>.
  - text: "＜Raid＞ (When this Digimon attacks, you may change the attack target to 1 of your opponent's unsuspended Digimon with the highest DP.)"
    scope: inherited
    kind: grant_keyword
    keyword: Raid
