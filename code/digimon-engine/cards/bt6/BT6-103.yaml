# BT6-103 Blasted Disaster — Option, Green, Cost 6. Traits: (none).
#
# Printed card text (official Bandai DB — data/card_bundles/BT6-103.md):
#   [Main] Suspend all of your opponent's Digimon. Then, gain 1 memory for
#     each of your opponent's suspended Digimon.
#   Security Effect: [Security] Suspend 1 of your opponent's Digimon.
#   (cards.json files the Security text under inherited_effect_description_eng,
#   the API-ingest shape for Option security effects; scope inherited +
#   on_security below, the BT6-105 / P-236 idiom.)
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT6/Green/BT6_103.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
# [Main] (OptionSkill, mandatory): every opponent battle-area Digimon that is
#   not immune to this effect → one SuspendPermanentsClass(list).Tap() (a
#   Digimon under CannotSuspend is silently skipped by the executor); then
#   AddMemory(Enemy.GetBattleAreaDigimons().Count(IsSuspended)) — counts every
#   suspended opponent Digimon, including one that already was.
#   → for_each over the opponent's battle-area Digimon + suspend (BT21-052 /
#   BT12-057 idiom; the per-permanent OnSuspend events of one resolving effect
#   collapse per observer, G-ENGINE-ON-SUSPEND-BATCH) → gain_memory_fn over
#   card_count_in_zone { of: opponent, battle_area, suspended Digimon }
#   (BT12-057 idiom), read after the suspends.
# [Security] (SecuritySkill): if an opponent Digimon exists, a mandatory
#   (canNoSelect: false) pick of 1 opponent Digimon, Mode.Tap.
#   → select_opponent_permanent { kind: digimon } + suspend.

card: BT6-103
name: "Blasted Disaster"
kind: option
color: [green]
cost: 6

effects:
  # ─── [Main] Suspend all opponent Digimon; +1 memory per suspended one ──────
  - when: main_from_hand
    summary: "[Main] Suspend all of your opponent's Digimon. Then, gain 1 memory for each of your opponent's suspended Digimon"
    process:
      - for_each:
          over:
            all_of:
              - of: opponent
              - zone: [battle_area]
              - kind: digimon
          bind_as: opp_digimon
          body:
            - suspend: { target: opp_digimon }
      - gain_memory_fn:
          formula:
            base: 0
            per:
              card_count_in_zone:
                of: opponent
                zone: battle_area
                filter:
                  all_of:
                    - kind: digimon
                    - is_suspended: true
            delta: 1

  # ─── [Security] Suspend 1 of your opponent's Digimon ───────────────────────
  - scope: inherited
    when: on_security
    summary: "[Security] Suspend 1 of your opponent's Digimon"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Suspend 1 of your opponent's Digimon"
      - suspend: { target: target }
