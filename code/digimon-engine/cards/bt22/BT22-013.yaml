# BT22-013 WarGreymon — Digimon, Lv.6, Red, DP 12000, Cost 12.
# Traits: Dragonkin, CS.
# Attribute: Vaccine
# Evo: Lv.5 Red / cost 4
#
# Printed card text (data/cards.json):
#
#   [Hand] [Main] If you have [Nokia Shiramine], 1 of your [Agumon] digivolves
#   into this card for a digivolution cost of 6, ignoring digivolution
#   requirements.
#
#   [When Digivolving] Activate 1 of the effects below:
#   ・1 of your [Gabumon] may digivolve into [MetalGarurumon] in the hand,
#     ignoring digivolution requirements and without paying the cost.
#   ・Delete 1 of your opponent's Digimon with the lowest DP.
#
# Inherited:
#   Inherited Effect [When Attacking] [Once Per Turn]
#     If this Digimon has [Omnimon] in its name, trash your opponent's top
#     security card.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT22/Red/BT22_013.cs
#
# ─── DCGO crosscheck ─────────────────────────────────────────────────────────
#
# DCGO BT22_013.cs registers FOUR clauses:
#
#   (1) `EffectTiming.None` →
#       `CardEffectFactory.AddSelfDigivolutionRequirementStaticEffect(
#           permanentCondition: Lv5 && (CS-trait || Greymon-name),
#           digivolutionCost: 3,
#           ignoreDigivolutionRequirement: false)`
#       NOTE: this is the printed standard-evolution alt-path expressed
#       declaratively as a static add-evolution-source. Matches printed
#       evo cost block { lv5 / red / cost 4 } — DCGO uses cost 3, but
#       printed cards.json shows the published evolution cost of 4. DCGO
#       value is treated as the implementation-side reference for the
#       Greymon-name / CS-trait alt-source filter; printed cost 4 wins per
#       source priority. The encoded `from: { level_eq: 5 }, cost: 4`
#       captures the printed text. (DCGO's narrower
#       `Greymon-name || CS-trait` filter is NOT a printed-text constraint;
#       printed text shows only the standard cost block.)
#
#   (2) `EffectTiming.OnDeclaration` activate (the [Hand][Main] activated
#       digivolve from Agumon at fixed cost 6, ignoring requirements).
#       `CanUseCondition`: card-on-hand && HasMatchConditionPermanent(Nokia
#       on owner's field) && HasMatchConditionPermanent(Agumon on owner's
#       field who can be a digivolve target at fixedCost: 6 with
#       IgnoreRequirement.All). Coroutine: SelectPermanentEffect filters to
#       Agumon-named own permanents → DigivolveIntoHandOrTrashCard with
#       payCost=true, ignoreDigivolutionRequirementFixedCost=6,
#       isHand=true, isOptional=false (after the player activates the
#       [Main] entry, the resolution is not declinable mid-flow), failure
#       OnFail = trash this card.
#
#       In DSL terms this is now modelled as the `effects:` clause
#       `when: main_from_hand` (NOT an `activated_digivolve` alt-path —
#       that alt-path kind had no engine execution route,
#       G-ACTIVATED-DIGIVOLVE-EXECUTION). The `condition:` enforces BOTH
#       the Nokia "If you have [Nokia Shiramine]" precondition AND the
#       Agumon-target existence; the body selects the Agumon and calls
#       `effect_initiated_digivolve { from_hand: self, cost: 6,
#       ignore_requirements: true }`. Mirrors BT24-016 Lamiamon clause 1.
#
#   (3) `EffectTiming.OnEnterFieldAnyone` activate — the [When Digivolving]
#       branch-choice. `CanUseCondition` =
#       `CardEffectCommons.CanTriggerWhenDigivolving(hashtable, card)` — this
#       gates on the actual Digivolving timing (not OnPlay). DCGO presents
#       a 2-option SelectionElement<int>:
#         0: "1 of your [Gabumon] may digivolve into [MetalGarurumon] in
#            your hand"
#         1: "Delete 1 of your opponent's Digimon with the lowest DP"
#       Branch 0 path: SelectPermanentEffect over own field for Gabumon-
#       named permanents that can host MetalGarurumon → DigivolveIntoHand
#       OrTrashCard with payCost=false, ignoreDigivolution
#       RequirementFixedCost=0, IgnoreRequirement.All. Branch 1 path:
#       SelectPermanentEffect over opponent's lowest-DP Digimon (mode:
#       Destroy).
#
#       The clause itself is mandatory once triggered (the "Activate 1"
#       choice MUST be made if either sub-path is legal); the inner
#       Branch 0 hand-target pick is `canNoSelect: true` (DCGO line 237) —
#       i.e. picking branch 0 may resolve to no-op. Branch 1 is
#       `canNoSelect: false` (DCGO line 285) — once branch 1 is chosen,
#       the player must delete a target. This matches printed text:
#       "Activate 1 of the effects below" + "1 of your [Gabumon] MAY
#       digivolve" (branch 0 sub-pick optional) vs "Delete 1" (branch 1
#       sub-pick mandatory).
#
#   (4) `EffectTiming.OnAllyAttack` inherited. `SetIsInheritedEffect(true)`,
#       `SetUpActivateClass(..., 1, false, ...)` (the `1` is OPT slot;
#       `false` = not isOptional → the trash is mandatory if the
#       conditional gate matches). `SetHashString("TrashSecurity_BT22_013")`
#       — OPT bucket key. `CanUseCondition`: IsExistOnBattleAreaDigimon &&
#       CanTriggerOnAttack. `CanActivateCondition`:
#       IsExistOnBattleAreaDigimon &&
#       `card.PermanentOfThisCard().TopCard.ContainsCardName("Omnimon")` —
#       the gate is on the actual top card of the carrier permanent, NOT
#       on this card's own printed name. So the inherited only fires when
#       BT22-013 is buried under an Omnimon-named top card.
#
# ─── Printed cost vs DCGO `digivolutionCost: 3` divergence (Clause 1) ────────
#
# Printed cards.json `evo_costs` for BT22-013 shows `{ level: 5, color: red,
# memory_cost: 4 }` — the published Lv.5/Red digivolution cost is 4. DCGO's
# `AddSelfDigivolutionRequirementStaticEffect(... digivolutionCost: 3 ...)`
# adds a Lv.5 + (CS-trait || Greymon-name) source at cost 3, narrower than
# the printed cost block. Per source priority (printed text wins over DCGO),
# we encode the printed standard alt-path: `from: { level_eq: 5 }` at cost 4.
#
# The DCGO Lv.5 + CS/Greymon source-at-cost-3 is treated as an unprinted
# implementation alt-source; it's not a printed text element so we do NOT
# encode it in YAML. If a future erratum aligns printed and DCGO costs, the
# alt-path can be tightened to `from: { level_eq: 5, any_of: [...] }`.
#
# ─── [Hand][Main] Nokia jump — modelled as a `main_from_hand` clause ─────────
#
# The printed "[Hand][Main] If you have [Nokia Shiramine], 1 of your [Agumon]
# digivolves into this card for cost 6, ignoring reqs" is the `effects:` clause
# `when: main_from_hand` (clause 1), NOT an `activated_digivolve` alt-path —
# that alt-path kind had no engine execution route (G-ACTIVATED-DIGIVOLVE-
# EXECUTION). Its `condition:` enforces the Nokia gate (which an alt-path
# `condition:` could not), mirroring BT24-016 Lamiamon clause 1.
#
# ─── Branch 0: chained perm→hand→effect_initiated_digivolve (Clause 3) ──────
#                    [G-EFFECT-INITIATED-DIGIVOLVE-FROM-HAND-WITH-PERMANENT-TARGET — RESOLVED]
#
# Branch 0 of [When Digivolving] mirrors BT17-015 branch 1 exactly: select
# own Gabumon permanent → select MetalGarurumon in hand → effect_initiated_
# digivolve. G-EFFECT-INITIATED-DIGIVOLVE-FROM-HAND-WITH-PERMANENT-TARGET is
# RESOLVED (qa/resolved-gaps.md): the `select_own_permanent + select_hand +
# effect_initiated_digivolve(target: <binding>)` chain now runs to completion —
# the hand-pick prompt installs after the permanent pick, and the digivolve
# executes. Branch 0 behavioral test is active and green (0 ignored).
#
# ─── `source_name_contains` predicate (Inherited)  [G-DSL-SOURCE-NAME-CONTAINS — RESOLVED] ─
#
# Same as BT17-015 inherited [When Attacking][OPT]: the
# `source_name_contains: "Omnimon"` predicate is evaluated by the engine at
# `code/digimon-engine/src/dsl_cards/predicate.rs` (via
# `subject_or_source_permanent` falling back to `rctx.source_permanent()`).
# G-DSL-SOURCE-NAME-CONTAINS is RESOLVED (qa/resolved-gaps.md): the gate
# correctly blocks the inherited when the top-card name does NOT contain
# "Omnimon". Negative-case test (BT22-013 alone at top) and positive-case
# test (Omnimon on top of BT22-013) are both active and green (0 ignored).
#
# ─── Branch 1 sub-pick: `dp_lte: { aggregate: { selector: lowest_dp } }` ────
#
# Branch 1 ("Delete 1 of your opponent's Digimon with the lowest DP") uses
# the same `dp_lte: { aggregate: { selector: lowest_dp, scope: opponent } }`
# pattern that BT24-017 (Medusamon) [When Digivolving] uses. G-PRED-DP-LTE is
# RESOLVED (qa/resolved-gaps.md): `dp_lte` on permanents IS now evaluated by
# the engine predicate evaluator. The select prompt correctly filters to only
# the lowest-DP opponent Digimon. The YAML is correct against the spec, and the
# behavioral test asserting lowest-DP-only behavior is active and green.
#
# ─── No-approximations note: branch 0 inner optionality ──────────────────────
#
# Per DCGO line 237 (`canNoSelect: true` on the Gabumon-pick), branch 0's
# permanent pick is opt-out (the player MAY decline to digivolve, even after
# choosing branch 0). The DSL `select_own_permanent` step does not natively
# support `optional: true` on the permanent pick, so the branch 0 sub-pick
# is encoded as mandatory; DCGO's "may" is folded into the branch-choice
# itself (via `select_effect_choice`). Faithfulness micro-issue: a player
# who chose branch 0 cannot back out without picking a Gabumon. Not test-
# asserted; this is consistent with how BT17-015 encodes the equivalent
# branch.

card: BT22-013
name: WarGreymon
kind: digimon
level: 6
color: [red]
cost: 12
dp: 12000
traits: [Dragonkin, CS]

alt_paths:
  # Standard digivolution from any Lv.5 (printed Lv.5/Red, cost 4).
  - kind: digivolve
    from: { level_eq: 5 }
    cost: 4

effects:
  # ─── Clause 1 — [Hand][Main] Nokia jump (main_from_hand) ──────────────────
  #
  # Printed: "[Hand][Main] If you have [Nokia Shiramine], 1 of your [Agumon]
  # digivolves into this card for a digivolution cost of 6, ignoring
  # digivolution requirements."
  #
  # Re-modelled (gap-closure plan) from the retired `kind: activated_digivolve`
  # alt-path onto a `main_from_hand` triggered clause (mirrors BT24-016
  # Lamiamon clause 1). The engine masks a Hand [Main] action for any hand
  # card with a `MainFromHand` effect whose `condition:` passes;
  # `activate_hand_main` runs it. The Nokia "If you have [Nokia Shiramine]"
  # precondition — which the alt-path `condition:` could not enforce — is the
  # `main_from_hand` `condition:` gate here, so the action is offered ONLY when
  # Nokia Shiramine is on your battle area AND an [Agumon] target exists.
  - when: main_from_hand
    summary: "[Hand][Main] If you have Nokia Shiramine: 1 of your Agumon digivolves into this card for cost 6, ignoring reqs"
    condition:
      all_of:
        - any_permanent:
            of: you
            zone: [battle_area]
            kind: tamer
            name_is: "Nokia Shiramine"
        - any_permanent:
            of: you
            zone: [battle_area]
            kind: digimon
            name_contains: "Agumon"
    process:
      - select_own_permanent:
          bind_as: base
          filter:
            all_of:
              - kind: digimon
              - name_contains: "Agumon"
          prompt: "Choose an Agumon to digivolve into WarGreymon (cost 6, ignore reqs)"
      - effect_initiated_digivolve:
          target: base
          from_hand: self
          cost: 6
          ignore_requirements: true

  # ─── Clause 2 — [When Digivolving] branch-choice ─────────────────────────
  #
  # Printed: "[When Digivolving] Activate 1 of the effects below:
  #   ・1 of your [Gabumon] may digivolve into [MetalGarurumon] in the hand,
  #     ignoring digivolution requirements and without paying the cost.
  #   ・Delete 1 of your opponent's Digimon with the lowest DP."
  #
  # Mandatory (not optional) clause. Inner branch 0 chains a permanent pick
  # then a hand pick into effect_initiated_digivolve — same shape as
  # BT17-015 branch 1. G-EFFECT-INITIATED-DIGIVOLVE-FROM-HAND-WITH-PERMANENT-
  # TARGET is RESOLVED: the full chain runs to completion and branch 0 is
  # exercised by the active behavioral test.
  #
  # Inner branch 1 uses dp_lte: { aggregate: lowest_dp } — same pattern as
  # BT24-017 / BT24-040. G-PRED-DP-LTE is RESOLVED: dp_lte is now evaluated,
  # lowest-DP filter honored, and the behavioral test asserts this directly.
  - when: when_digivolving
    summary: "[When Digivolving] Choose: digivolve Gabumon→MetalGarurumon free OR delete opp's lowest-DP Digimon"
    process:
      - select_effect_choice:
          bind_as: branch
          labels:
            - "Digivolve Gabumon into MetalGarurumon (free, ignore reqs)"
            - "Delete opponent's lowest-DP Digimon"
          prompt: "Choose effect"
      - if:
          condition: { equals: [branch, 0] }
          then:
            - select_own_permanent:
                bind_as: base
                filter: { name_contains: "Gabumon" }
                prompt: "Choose your Gabumon"
            - select_hand:
                of: you
                bind_as: evo
                filter: { name_contains: "MetalGarurumon" }
                prompt: "Digivolve into MetalGarurumon (free, ignore reqs)"
            - effect_initiated_digivolve:
                target: base
                from_hand: evo
                cost: 0
                ignore_requirements: true
      - if:
          condition: { equals: [branch, 1] }
          then:
            - select_opponent_permanent:
                bind_as: victim
                filter:
                  all_of:
                    - kind: digimon
                    - dp_lte:
                        aggregate:
                          selector: lowest_dp
                          scope: opponent
                prompt: "Delete opponent's lowest-DP Digimon"
            - delete_permanent: { target: victim }

  # ─── Inherited [When Attacking][OPT] — Omnimon-name → trash top sec ──────
  #
  # Printed: "[When Attacking] [Once Per Turn] If this Digimon has [Omnimon]
  # in its name, trash your opponent's top security card."
  #
  # Same shape as BT17-015 inherited clause. `source_name_contains: "Omnimon"`
  # is evaluated by the engine predicate path (predicate.rs, via
  # subject_or_source_permanent). G-DSL-SOURCE-NAME-CONTAINS is RESOLVED:
  # the gate correctly blocks the inherited when the top card is not
  # Omnimon-named. Negative test is active and green (0 ignored).
  - scope: inherited
    when: when_attacking
    once_per_turn: true
    condition: { source_name_contains: "Omnimon" }
    process:
      - trash_top_security: { of: opponent }
