card: BT22-040
name: Cendrillmon
kind: digimon
level: 6
color: [yellow]
cost: 11
dp: 11000
traits: [Puppet, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: yellow }
    cost: 3

effects:
  - kind: grant_keyword
    keyword: Overclock
    overclock_cost_filter:
      any_of:
        - kind: token
        - all_of:
            - kind: digimon
            - trait_has: Puppet

  - when: [on_play, when_digivolving]
    summary: "You may play 1 Familiar Token"
    process:
      - select_effect_choice:
          labels: ["Play Familiar Token", "Decline"]
          bind_as: token_choice
          prompt: "Play 1 Familiar Token?"
      - if:
          condition: { equals: [token_choice, 0] }
          then:
            - play_token:
                controller: you
                token_name: familiar

  - when: on_any_deletion
    active_when: { all_turns: true }
    once_per_turn: true
    summary: "When any of your other Digimon are deleted, you may activate this Digimon's When Digivolving effect"
    condition:
      all_of:
        - event_target_owner: you
        - any_of:
            - event_target_kind: digimon
            - event_target_kind: token
        - event_permanent_is_source: false
    process:
      - refire_effect:
          source: source
          timing: when_digivolving
          optional: true
