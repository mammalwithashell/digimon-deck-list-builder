card: BT22-041
name: Kentaurosmon
kind: digimon
level: 6
color: [yellow]
cost: 12
dp: 12000
traits: [Holy Warrior, Royal Knight, CS]
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: yellow }
    cost: 4
  - kind: digivolve
    from: { level_eq: 5, trait_has: CS }
    cost: 3


effects:
  # ─── Cost reduction: -6 when total security in BOTH stacks <= 6 ──────────────
  # own_count + opp_count <= 6  ⟺  own_count <= 6 - opp_count, encoded as
  # security_count_lte (own) <= (6 - card_count_in_zone(opponent, security)).
  # BT25-044 Junomon idiom.
  - kind: cost_reduction
    reduction_timing: before_pay_cost
    when_playing_this: true
    amount: 6
    condition:
      security_count_lte:
        formula:
          base: 6
          per:
            card_count_in_zone:
              of: opponent
              zone: security
          delta: -1
    summary: "When played, if both players' security stacks total 6 or fewer, reduce play cost by 6"

  - kind: grant_keyword
    keyword: Blocker
  - kind: grant_keyword
    keyword: Barrier

  - when: [on_play, when_digivolving]
    optional: true
    summary: "[On Play][When Digivolving] You may place 1 yellow card from hand as top security"
    process:
      - select_hand:
          of: you
          bind_as: pick
          optional: true
          filter: { color_is: yellow }
          prompt: "Place 1 yellow card from your hand as your top security card"
      - place_on_security:
          of: you
          source: { card: { binding: pick, zone: hand } }
          position: top
          face_up: false

  # ─── [All Turns][Once Per Turn] self-suspend → trash top security → unsuspend ─
  #
  # "When this Digimon suspends, by trashing your top security card, it
  # unsuspends."
  #
  # event_permanent_is_source gates the OnSuspend observer to THIS exact
  # Kentaurosmon being suspended (the BT23-077 Sistermon Ciel pattern); another
  # permanent suspending does not over-fire it. optional: true → "by trashing"
  # is an opt-in cost, surfaced as an accept/decline prompt (the AD1-014 "may
  # unsuspend" idiom). security_count_gte: 1 suppresses the prompt when there is
  # no top security card to pay the cost. On accept: trash the top security card
  # (the cost), then unsuspend this Digimon.
  - when: on_suspend
    active_when: { all_turns: true }
    once_per_turn: true
    optional: true
    condition:
      all_of:
        - event_permanent_is_source: true
        - security_count_gte: 1
    summary: "[All Turns][Once Per Turn] When this Digimon suspends, by trashing your top security card, it unsuspends"
    process:
      - trash_top_security: { of: you }
      - unsuspend: { target: source }
