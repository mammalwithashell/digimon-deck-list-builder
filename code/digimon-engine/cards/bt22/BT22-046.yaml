# BT22-046 Gargomon — Digimon, Lv.4, Green/Yellow, DP 6000, Cost 5.
# Traits: Beastkin, CS. Form: Champion. Attribute: Vaccine.
#
# Printed text (official Bandai DB bundle data/card_bundles/BT22-046.md,
# authoritative — cards.json's effect line is garbled; DCGO BT22_046.cs
# cross-checked):
#
#   Evo box: Lv.3 Green / cost 3 OR Lv.3 Yellow / cost 3 (two circles).
#   Evo box: "Digivolve Lv.3 w/[CS] trait: Cost 2".
#
#   [When Digivolving] If you have 1 or fewer Tamers, you may play 1 Tamer card
#   with the [CS] trait from your hand without paying the cost.
#
#   Inherited Effect: [All Turns] This Digimon gets +1000 DP.
#
# ─── DCGO crosscheck ─────────────────────────────────────────────────────────
#
# Alt digivolution (EffectTiming.None): AddSelfDigivolutionRequirement
#   StaticEffect(TopCard.IsLevel3 && HasCSTraits, digivolutionCost: 2). A
#   Green/Yellow Lv.3 [CS] Digimon satisfies the circle (cost 3) AND the alt
#   (cost 2): the cost-choice prompt fires.
#
# [When Digivolving] (OnEnterFieldAnyone + CanTriggerWhenDigivolving,
#   isOptional: true): CanActivate = IsOwnerTurn && hand has a legal [CS] Tamer
#   && own Tamers (battle-area permanents where IsTamer) <= 1. The pick is
#   optional (canNoSelect: true) and is gated on `CanPlayAsNewPermanent(card,
#   payCost: false)` (CR 4.3 1-3-11-1) → BT22-022 Veedramon sibling idiom:
#   `count_lte` clause condition over own Tamers, optional `select_hand` over
#   `can_play_from_effect_without_cost` CS Tamers, `play_from_hand_free`.
#
# Inherited [All Turns] +1000 DP: ChangeSelfDPStaticEffect(1000, inherited,
#   IsExistOnBattleArea) → `kind: aura, scope: inherited, target: {}`.

card: BT22-046
name: Gargomon
kind: digimon
level: 4
color: [green, yellow]
cost: 5
dp: 6000
traits: [Beastkin, CS]
attribute: Vaccine
form: Champion

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: green }
    cost: 3
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 3
  # Printed alt evo box: "Digivolve Lv.3 w/[CS] trait: Cost 2".
  - kind: digivolve
    from: { level_eq: 3, trait_has: CS }
    cost: 2

effects:
  - when: when_digivolving
    summary: "[When Digivolving] If you have 1 or fewer Tamers, you may play 1 [CS] trait Tamer card from your hand without paying the cost"
    condition:
      count_lte:
        filter: { of: you, zone: [battle_area], kind: tamer }
        n: 1
    process:
      - select_hand:
          of: you
          bind_as: tamer
          optional: true
          filter:
            all_of:
              - kind: tamer
              - trait_has: CS
              - can_play_from_effect_without_cost: true
          prompt: "You may play 1 Tamer card with the [CS] trait from your hand without paying the cost"
      - if:
          condition: { binding_present: tamer }
          then:
            - play_from_hand_free: { of: you, hand_index: tamer }

  - scope: inherited
    kind: aura
    active_when: { all_turns: true }
    target: {}
    dp_modifier: 1000
    summary: "[Inherited][All Turns] This Digimon gets +1000 DP"
