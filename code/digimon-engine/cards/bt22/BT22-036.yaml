card: BT22-036
name: Chaperomon
kind: digimon
level: 5
color: [yellow]
cost: 7
dp: 7000
attribute: Virus
traits: [Puppet, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: yellow }
    cost: 3

effects:
  - kind: grant_keyword
    keyword: Overclock
    overclock_cost_filter:
      any_of:
        - kind: token
        - all_of:
                  - kind: digimon
                  - trait_has: Puppet

  # [Hand][Main] If you have [Arisa Kinosaki], by placing 1 [ShoeShoemon]
  # from your trash as any of your [Shoemon]'s bottom digivolution card, it
  # digivolves into this card for a digivolution cost of 3, ignoring
  # digivolution requirements. (PUPPETS-G020.)
  #
  # The `condition:` is the hand-[Main] activation-mask preflight: the action
  # bit only appears when Arisa is in play, a Shoemon permanent is on the
  # field, and a [ShoeShoemon] card exists in trash (the placement cost must
  # be payable). `name_is` is exact-match so "ShoeShoemon" never satisfies a
  # "Shoemon" gate and vice versa.
  - when: main_from_hand
    summary: "[Hand][Main] Place a ShoeShoemon from trash under a Shoemon, then digivolve into this card for cost 3 ignoring requirements"
    condition:
      all_of:
        - any_field_permanent:
            of: you
            predicate: { name_is: "Arisa Kinosaki" }
        - any_field_permanent:
            of: you
            predicate: { kind: digimon, name_is: "Shoemon" }
        - count_gte:
            filter:
              owner: you
              zone: [trash]
              name_is: "ShoeShoemon"
            n: 1
    process:
      - select_trash:
          of: you
          bind_as: shoeshoemon
          filter: { name_is: "ShoeShoemon" }
          prompt: "Choose 1 ShoeShoemon from your trash"
      - select_own_permanent:
          bind_as: shoemon
          filter: { kind: digimon, name_is: "Shoemon" }
          prompt: "Choose 1 of your Shoemon to place ShoeShoemon under and digivolve"
      - place_as_bottom_source: { source: shoeshoemon, target: shoemon }
      - effect_initiated_digivolve:
          target: shoemon
          from_hand: self
          cost: 3
          ignore_requirements: true

  # Inherited [All Turns][Once Per Turn] leave-prevention. Mirrors DCGO's
  # WhenRemoveField inherited Substitute handler: the carrier is the threatened
  # subject, and this source card is the attribution.
  - kind: replacement
    scope: inherited
    trigger: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    active_when:
      all_of:
        - replacement_subject_is_mine: true
        - kind: digimon
        - none_of:
            - replacement_cause: own_effect
    summary: "[All Turns][OPT] Delete 1 Token or other Puppet Digimon so this Digimon doesn't leave"
    process:
      - select_own_permanent:
          bind_as: prevent_cost
          filter:
            all_of:
              - other: true
              - any_of:
                  - kind: token
                  - all_of:
                      - kind: digimon
                      - trait_has: Puppet
          prompt: "Delete 1 of your Tokens or other Puppet Digimon"
      - delete_permanent: { target: prevent_cost }
      - cancel_replacement: {}
