card: BT22-036
name: Chaperomon
kind: digimon
level: 5
color: [yellow]
cost: 7
dp: 7000
attribute: Virus
traits: [Puppet, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: yellow }
    cost: 3

effects:
  - kind: grant_keyword
    keyword: Overclock
    overclock_cost_filter:
      any_of:
        - kind: token
        - all_of:
                  - kind: digimon
                  - trait_has: Puppet

  # The [Hand][Main] effect is omitted rather than approximated. The current
  # hand-action mask can gate on Arisa/Shoemon permanents, but this card also
  # needs the hand effect to be hidden when no [ShoeShoemon] exists in trash.
  # Keep the ignored tests in bt22_036.rs until that preflight is proven.
  #
  # Inherited [All Turns][Once Per Turn] leave-prevention. Mirrors DCGO's
  # WhenRemoveField inherited Substitute handler: the carrier is the threatened
  # subject, and this source card is the attribution.
  - kind: replacement
    scope: inherited
    trigger: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    active_when:
      all_of:
        - replacement_subject_is_mine: true
        - kind: digimon
        - none_of:
            - replacement_cause: own_effect
    summary: "[All Turns][OPT] Delete 1 Token or other Puppet Digimon so this Digimon doesn't leave"
    process:
      - select_own_permanent:
          bind_as: prevent_cost
          filter:
            all_of:
              - other: true
              - any_of:
                  - kind: token
                  - all_of:
                      - kind: digimon
                      - trait_has: Puppet
          prompt: "Delete 1 of your Tokens or other Puppet Digimon"
      - delete_permanent: { target: prevent_cost }
      - cancel_replacement: {}
