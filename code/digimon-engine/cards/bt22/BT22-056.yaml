# BT22-056 Guardromon -- Digimon, Lv.4, Black/Yellow, DP 5000, Cost 5.
# Traits: Machine, CS. Form: Champion. Attribute: Free.
#
# Printed text (official Bandai DB, data/card_bundles/BT22-056.md; DCGO
# BT22_056.cs cross-checked):
#
#   Evo box: Black Lv.3 / cost 3 OR Yellow Lv.3 / cost 3 (two circles).
#   Evo box: "Digivolve Lv.3 w/[CS] trait: Cost 2".
#
#   [On Play] [When Digivolving] 1 of your opponent's Digimon gets -3000 DP for
#   the turn. Then, if this Digimon's stack has 2 or more same-level cards,
#   <De-Digivolve 1> 1 of your opponent's Digimon.
#
#   Inherited Effect: [Opponent's Turn] This Digimon gets +2000 DP.
#
#   Official Q&A: "2 or more cards with the same level among all of the stacked
#   cards. Examples include when a level 5 Digimon has a level 5 digivolution
#   card or when a level 6 Digimon has 2 level 5 digivolution cards." -- the
#   Digimon's own top card counts.
#
# ─── DCGO crosscheck ─────────────────────────────────────────────────────────
#
# Alt digivolution (EffectTiming.None): AddSelfDigivolutionRequirementStatic
#   Effect(TopCard.IsLevel3 && HasCSTraits, digivolutionCost: 2). A Black/Yellow
#   Lv.3 [CS] Digimon satisfies a circle (cost 3) AND the alt (cost 2): the
#   cost-choice prompt fires (same shape as BT22-046 Gargomon).
#
# [On Play] and [When Digivolving] are two ActivateClasses with identical
#   bodies, both mandatory (`isOptional: false`):
#   1. If the opponent has a Digimon: select 1 (canNoSelect: false) and give it
#      -3000 DP until the end of the turn.
#   2. If the opponent STILL has a Digimon (the -3000 may have deleted the
#      only one, CR 4.3 17-1-3-1) and
#      `StackCards.Filter(!IsFlipped).GroupBy(Level).Any(Count >= 2)`: select 1
#      (canNoSelect: false) and <De-Digivolve 1> it.
#   -> `when: [on_play, when_digivolving]`, a mandatory opponent pick, the
#      `-3000` modifier, then an `if` on the new top-card-inclusive stack leaf
#      `self_stack_same_level_count_gte` (G-DSL-SELF-STACK-SAME-LEVEL-COUNT)
#      guarding the second mandatory pick + `de_digivolve`.
#
# Inherited [Opponent's Turn] +2000 DP: ChangeSelfDPStaticEffect(2000,
#   inherited, IsOpponentTurn) -> `kind: aura, scope: inherited`.

card: BT22-056
name: Guardromon
kind: digimon
level: 4
color: [black, yellow]
cost: 5
dp: 5000
traits: [Machine, CS]
attribute: Free
form: Champion

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: black }
    cost: 3
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 3
  # Printed alt evo box: "Digivolve Lv.3 w/[CS] trait: Cost 2".
  - kind: digivolve
    from: { level_eq: 3, trait_has: CS }
    cost: 2

effects:
  - text: "[On Play] [When Digivolving] 1 of your opponent's Digimon gets -3000 DP for the turn. Then, if this Digimon's stack has 2 or more same-level cards, ＜De-Digivolve 1＞ 1 of your opponent's Digimon."
    when: [on_play, when_digivolving]
    summary: "[On Play] [When Digivolving] 1 opponent Digimon gets -3000 DP for the turn; then if this stack has 2+ same-level cards, <De-Digivolve 1> 1 opponent Digimon"
    process:
      - if:
          condition:
            any_permanent:
              of: opponent
              zone: [battle_area]
              kind: digimon
          then:
            - select_opponent_permanent:
                bind_as: weakened
                filter: { kind: digimon }
                prompt: "1 of your opponent's Digimon gets -3000 DP for the turn"
            - add_dp_modifier: { target: weakened, value: -3000, expiry: end_of_turn }
      - if:
          condition:
            all_of:
              - self_stack_same_level_count_gte: 2
              - any_permanent:
                  of: opponent
                  zone: [battle_area]
                  kind: digimon
          then:
            - select_opponent_permanent:
                bind_as: dedigivolved
                filter: { kind: digimon }
                prompt: "<De-Digivolve 1> 1 of your opponent's Digimon"
            - de_digivolve:
                target: dedigivolved
                amount: 1
                stop_at_level: 3

  - text: "[Opponent's Turn] This Digimon gets +2000 DP."
    scope: inherited
    kind: aura
    active_when: { opponents_turn: true }
    target: {}
    dp_modifier: 2000
    summary: "[Inherited][Opponent's Turn] This Digimon gets +2000 DP"
