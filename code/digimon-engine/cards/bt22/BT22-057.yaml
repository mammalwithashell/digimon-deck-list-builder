# BT22-057 Kurisarimon — Digimon, Lv.4, Black, 5000 DP, play cost 5.
# Traits: Unidentified, CS. Digivolve: Black Lv.3 / cost 2; Lv.3 w/[CS] trait / cost 2.
#
# Printed text (official Bandai DB, data/card_bundles/BT22-057.md):
#   [When Digivolving] If you have 1 or fewer Tamers, you may play 1 [Arata
#   Sanada] from your hand without paying the cost.
#   Inherited: [All Turns] [Once Per Turn] When this Digimon with [Diaboromon]
#   in its text would leave the battle area, by deleting 1 of your other
#   [Diaboromon], it doesn't leave.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT22/Black/BT22_057.cs
#   - Alt digivolve: base Lv.3 with [CS], cost 2 (requirements kept).
#   - [When Digivolving], optional: CanActivate = on the battle area, a Tamer
#     named [Arata Sanada] (ContainsCardName) in hand that can be played, and
#     <= 1 own Tamer permanents; SelectHandEffect (canNoSelect true) then
#     PlayPermanentCards(payCost false).
#   - Inherited would-leave substitute: identical to BT22-053 (see there).

card: BT22-057
name: Kurisarimon
kind: digimon
level: 4
color: [black]
cost: 5
dp: 5000
traits: [Unidentified, CS]
form: Champion
attribute: Unknown

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: black }
    cost: 2
  - kind: digivolve
    from: { any_color: true, level_eq: 3, trait_has: CS }
    cost: 2

effects:
  - text: "[When Digivolving] If you have 1 or fewer Tamers, you may play 1 [Arata Sanada] from your hand without paying the cost."
    when: when_digivolving
    optional: true
    condition:
      all_of:
        - count_lte:
            filter: { of: you, zone: [battle_area], kind: tamer }
            n: 1
        - count_gte:
            filter:
              of: you
              zone: [hand]
              all_of:
                - kind: tamer
                - name_is: "Arata Sanada"
                - can_play_from_effect_without_cost: true
            n: 1
    summary: "[When Digivolving] If you have 1 or fewer Tamers, you may play 1 [Arata Sanada] from your hand without paying the cost"
    process:
      - select_hand:
          optional: false
          of: you
          bind_as: arata
          filter:
            all_of:
              - kind: tamer
              - name_is: "Arata Sanada"
              - can_play_from_effect_without_cost: true
          prompt: "Play 1 [Arata Sanada] without paying the cost"
      - play_from_hand_free: { of: you, hand_index: arata }

  - text: "[All Turns] [Once Per Turn] When this Digimon with [Diaboromon] in its text would leave the battle area, by deleting 1 of your other [Diaboromon], it doesn't leave."
    kind: replacement
    scope: inherited
    trigger: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    active_when:
      all_of:
        - all_turns: true
        - in_text_contains: Diaboromon
    summary: "Inherited [All Turns][OPT] When this Digimon with [Diaboromon] in its text would leave the battle area, by deleting 1 of your other [Diaboromon], it doesn't leave"
    process:
      - select_own_permanent:
          optional: false
          bind_as: prevent_cost
          filter:
            all_of:
              - other: true
              - kind: digimon
              - name_is: Diaboromon
          prompt: "Delete 1 of your other [Diaboromon]"
      - delete_permanent: { target: prevent_cost }
      - cancel_replacement: {}

