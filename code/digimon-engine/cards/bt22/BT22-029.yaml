card: BT22-029
name: Shoemon
kind: digimon
level: 3
color: [yellow]
cost: 3
dp: 1000
traits: [Puppet, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: yellow }
    cost: 0

effects:
  - when: [on_play, on_deletion]
    summary: "1 of your Puppet Digimon gains Blocker until your opponent's turn ends"
    process:
      - select_own_permanent:
          bind_as: target
          filter:
            all_of:
              - kind: digimon
              - trait_has: Puppet
          prompt: "Choose 1 of your Puppet Digimon to gain Blocker"
      - grant_keyword:
          target: target
          keyword: Blocker
          expiry: end_of_opponents_turn

  - scope: inherited
    when: when_attacking
    once_per_turn: true
    summary: "[When Attacking][OPT] 1 opponent Digimon gets -2000 DP for the turn"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon to get -2000 DP"
      - add_dp_modifier:
          target: target
          value: -2000
          expiry: end_of_turn
