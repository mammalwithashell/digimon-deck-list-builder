card: BT22-042
name: Nyabootmon
kind: digimon
level: 7
color: [yellow]
cost: 14
dp: 14000
traits: [Puppet, LIBERATOR]
alt_paths:
  - kind: digivolve
    from:
      all_of:
        - level_eq: 6
        - color_is: yellow
    cost: 4

  # Conditional alt-digivolve: "[Digivolve] While you have [Arisa Kinosaki],
  # [Chaperomon]: Cost 6." Digivolve from a [Chaperomon] for 6 memory, legal
  # ONLY while the controller has an [Arisa Kinosaki].
  #
  # G-ALT-PATH-CONDITION (RESOLVED 2026-05-15 — see qa/resolved-gaps.md):
  # `AltPathSpec.condition` is consumed by the Digivolve route in
  # dna_digivolve.rs::find_matching_alt_path, evaluated after the `from:`
  # source-filter check. The Arisa gate is authored here as a `count_gte`
  # over the controller's battle area.
  - kind: digivolve
    from:
      name_contains: "Chaperomon"
    cost: 6
    condition:
      count_gte:
        filter:
          of: you
          zone: [battle_area]
          all_of:
            - kind: tamer
            - name_contains: "Arisa Kinosaki"
        n: 1

effects:
  - kind: grant_keyword
    keyword: Overclock
    overclock_cost_filter:
      any_of:
        - kind: token
        - all_of:
            - kind: digimon
            - trait_has: Puppet

  - when: when_digivolving
    summary: "You may play 1 level 4 or lower Puppet Digimon from hand; then -3000 DP per own Digimon"
    process:
      - if:
          condition:
            count_gte:
              filter:
                of: you
                zone: [hand]
                all_of:
                  - kind: digimon
                  - level_lte: 4
                  - trait_has: Puppet
              n: 1
          then:
            - select_effect_choice:
                labels: ["Play Puppet Digimon", "Decline"]
                bind_as: puppet_choice
                prompt: "Play 1 level 4 or lower [Puppet] Digimon from hand?"
            - if:
                condition: { equals: [puppet_choice, 0] }
                then:
                  - select_hand:
                      of: you
                      bind_as: puppet
                      filter:
                        all_of:
                          - kind: digimon
                          - level_lte: 4
                          - trait_has: Puppet
                      prompt: "Play 1 level 4 or lower [Puppet] Digimon from hand"
                  - play_from_hand_free: { of: you, hand_index: puppet }
      - select_opponent_permanent:
          bind_as: dp_target
          filter: { kind: digimon }
          prompt: "Give -3000 DP per own Digimon"
      - add_dp_modifier:
          target: dp_target
          value:
            formula:
              base: 0
              per:
                card_count_in_zone:
                  of: you
                  zone: battle_area
                  filter: { kind: digimon }
              delta: -3000
          expiry: end_of_opponents_turn

  - when: on_any_deletion
    active_when: { all_turns: true }
    once_per_turn: true
    summary: "When any of your other Digimon are deleted, you may activate this Digimon's When Digivolving effect"
    condition:
      all_of:
        - event_target_owner: you
        - any_of:
            - event_target_kind: digimon
            - event_target_kind: token
        - event_permanent_is_source: false
    process:
      - refire_effect:
          source: source
          timing: when_digivolving
          optional: true
