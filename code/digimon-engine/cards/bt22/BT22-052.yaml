card: BT22-052
name: Leopardmon
kind: digimon
level: 6
color: [green]
cost: 7
dp: 12000
traits: [Holy Warrior, Royal Knight, CS]
attribute: Data
ace_overflow: -4

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: green }
    cost: 4
  - kind: digivolve
    from: { level_eq: 5, trait_has: CS }
    cost: 3
  - kind: burst_digivolve
    marker: true
    cost: 0

effects:
  - kind: grant_keyword
    keyword: BlastDigivolve

  - when: [on_play, when_digivolving]
    optional: true
    summary: "[On Play][When Digivolving] Play 1 5000 DP or lower Digimon from hand; your level 3+ Digimon gain Blocker"
    process:
      - select_hand:
          of: you
          bind_as: pick
          optional: true
          # DCGO BT22_052.cs:86-94 / :164-172 CanSelectCondition =
          # CanSelectCardCondition (:43-57, Digimon, DP <= 5000) &&
          # CanPlayAsNewPermanent: no DUAL (CR 4.3 7-1-1 no play cost + 4-6-2), free slot, no play
          # prohibition.
          filter:
            all_of:
              - kind: digimon
              - dp_lte: 5000
              - can_play_from_effect_without_cost: true
          prompt: "Play 1 5000 DP or lower Digimon card from your hand"
      - play_from_hand_free: { of: you, hand_index: pick }
      - for_each:
          over:
            all_of:
              - kind: digimon
              - of: you
              - zone: [battle_area]
              - level_gte: 3
          bind_as: ally
          body:
            - grant_keyword:
                target: ally
                keyword: Blocker
                expiry: end_of_opponents_turn

  # [All Turns][Once Per Turn] When any of your other Digimon would leave the
  # battle area, gain 2 memory. This is a non-cancelling would-leave
  # subscriber: it runs the side effect and leaves the original move
  # unmodified.
  - kind: replacement
    timing: when_would_leave_battle_area
    once_per_turn: true
    summary: "[All Turns][Once Per Turn] other own Digimon would leave -> gain 2 memory"
    active_when:
      all_of:
        - replacement_subject_is_mine: true
        - kind: digimon
        - other: true
    process:
      - gain_memory: 2
