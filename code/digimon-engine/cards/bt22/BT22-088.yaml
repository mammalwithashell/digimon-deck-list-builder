card: BT22-088
name: Arisa Kinosaki
kind: tamer
color: [yellow]
cost: 3
traits: [LIBERATOR]

# Printed text:
# [Start of Your Main Phase] By returning this Tamer to the bottom of the
# deck, you may play 1 [Arisa Kinosaki] from your hand without paying the
# cost. Then, if you don't have a Digimon, you may play 1 [Shoemon] from your
# trash without paying the cost.
#
# [All Turns] When any of your Tokens or [Puppet] trait Digimon are played, by
# suspending this Tamer, <Draw 1>.
#
# Security Effect [Security] Play this card without paying the cost.
#
# Supported faithfully:
# - Security plays this Tamer without paying the cost.
# - All Turns own Token/Puppet played observer with a Track B
#   `activation_cost: { suspend_self: true }` cost-pay before Draw 1.
# - Start of Your Main Phase: optional trigger; activation_cost:
#   { return_self_to_deck_bottom: true }; then optionally play 1 exact-name
#   [Arisa Kinosaki] from hand free; then if no Digimon on field, optionally
#   play 1 exact-name [Shoemon] from trash free. (PUPPETS-G028 closure.)

effects:
  - when: start_of_your_main_phase
    optional: true
    summary: "[Start of Your Main Phase] By returning this Tamer to deck bottom, may play 1 [Arisa Kinosaki] from hand free, then if no Digimon may play 1 [Shoemon] from trash free"
    process:
      - activation_cost: { return_self_to_deck_bottom: true }
      - select_hand:
          of: you
          bind_as: arisa_pick
          optional: true
          filter:
            name_is: "Arisa Kinosaki"
          prompt: "Play 1 [Arisa Kinosaki] from your hand without paying the cost"
      - play_from_hand_free:
          of: you
          hand_index: arisa_pick
      - if:
          condition:
            no_permanent:
              of: you
              kind: digimon
          then:
            - select_trash:
                of: you
                bind_as: shoemon_pick
                optional: true
                filter:
                  name_is: "Shoemon"
                prompt: "Play 1 [Shoemon] from your trash without paying the cost"
            - play_from_trash_free:
                of: you
                hand_index: shoemon_pick

  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}

  - when: on_any_digimon_played
    active_when: { all_turns: true }
    summary: "[All Turns] When your Token/Puppet is played, suspend this Tamer to Draw 1"
    condition:
      all_of:
        - event_target_owner: you
        - any_of:
            - event_target_kind: token
            - all_of:
                - event_target_kind: digimon
                - event_target_trait_has: Puppet
    process:
      - activation_cost: { suspend_self: true }
      - draw: { of: you, count: 1 }
