# BT22-054 Hagurumon — Digimon, Lv.3, Black/Yellow, DP 1000, Cost 3.
# Traits: Machine, CS. Form: Rookie. Attribute: Virus.
#
# Printed text (official Bandai DB bundle data/card_bundles/BT22-054.md,
# authoritative; DCGO BT22_054.cs cross-checked):
#
#   Evo box: Lv.2 Black / cost 1 OR Lv.2 Yellow / cost 1; "Digivolve Lv.2
#   w/[CS] trait: Cost 0".
#   [Your Turn] [Once Per Turn] When effects place Digimon cards with the [CS]
#   trait in this Digimon's digivolution cards, 1 of your opponent's Digimon
#   gets -3000 DP for the turn.
#   Inherited Effect: [Main] [Once Per Turn] By placing this [CS] trait
#   Digimon's top stacked card as its bottom digivolution card, <Draw 1>.
#
# Palmon (BT22-044) sibling: alt route (TopCard.IsLevel2 && HasCSTraits, cost
# 0), OnAddDigivolutionCards trigger (mandatory, OPT 1, IsOwnerTurn, an
# opposing Digimon exists, the pick canNoSelect: false; ChangeDigimonDP -3000
# UntilEachTurnEnd), CS-top inherited [Main] rotate + Draw 1.

card: BT22-054
name: Hagurumon
kind: digimon
level: 3
color: [black, yellow]
cost: 3
dp: 1000
traits: [Machine, CS]
attribute: Virus
form: Rookie

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 1
  - kind: digivolve
    from: { level_eq: 2, color_is: yellow }
    cost: 1
  - kind: digivolve
    from: { any_color: true, level_eq: 2, trait_has: CS }
    cost: 0

effects:
  - text: "[Your Turn] [Once Per Turn] When effects place Digimon cards with the [CS] trait in this Digimon's digivolution cards, 1 of your opponent's Digimon gets -3000 DP for the turn."
    when: on_add_digivolution_cards
    once_per_turn: true
    active_when: { your_turn: true }
    trigger_if:
      all_of:
        - event_host_permanent_is_source: true
        - event_added_card_any:
            all_of:
              - kind: digimon
              - trait_has: CS
    condition:
      any_permanent: { of: opponent, zone: [battle_area], kind: digimon }
    summary: "[Your Turn][Once Per Turn] When effects place [CS] trait Digimon cards in this Digimon's digivolution cards, 1 of your opponent's Digimon gets -3000 DP for the turn"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "1 of your opponent's Digimon gets -3000 DP for the turn"
      - add_dp_modifier:
          target: target
          value: -3000
          expiry: end_of_turn

  - scope: inherited
    when: main_on_field
    once_per_turn: true
    condition:
      all_of:
        - materials_count_gte: 1
        - source_permanent_trait_has: CS
    summary: "[Inherited][Main][Once Per Turn] By placing this [CS] trait Digimon's top stacked card as its bottom digivolution card, <Draw 1>"
    process:
      - place_top_source_as_bottom: { target: source }
      - draw: { of: you, count: 1 }
