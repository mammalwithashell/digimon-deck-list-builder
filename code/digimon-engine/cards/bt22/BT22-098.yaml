card: BT22-098
name: "Unique Emblem: Fable Waltz"
kind: option
color: [yellow]
cost: 3
traits: [LIBERATOR]

# Printed text:
# [Main] You may play 1 [Shoemon] or [Arisa Kinosaki] from your hand or trash
# without paying the cost. Then, place this card in the battle area.
#
# [Your Turn] When any of your [Arisa Kinosaki] suspend, <Delay> (By trashing
# this card after the placing turn, activate the effect below.)
# 1 of your [Puppet] trait Digimon may digivolve into a [Puppet] and
# [LIBERATOR] trait Digimon card in the hand with the digivolution cost reduced
# by 3.
#
# Supported faithfully here:
# - [Main] union-zone (hand ∪ trash) play: the target choice is visible, optional,
#   filtered to [Shoemon] or [Arisa Kinosaki], and plays the selected card from its
#   true origin zone without paying its cost. (PUPPETS-G014 substrate landed in Task 7.)
# - Battle-area Delay placement via the standard delayed-option pipeline.
# - Event-gated Delay activation after the placing turn when your Arisa Kinosaki
#   suspends, with visible Puppet base and Puppet+LIBERATOR hand-evolution
#   selections before effect_initiated_digivolve with cost reduced by 3.
# - [Security] mirrors the [Main] union-zone play.
#
# Omitted rather than approximated:
# - "Then, place this card in the battle area" after the [Main] free play is blocked
#   by PUPPETS-G009: integrated Option Main resolution with pending optional play
#   plus post-resolution battle-area placement.
# - Security battle-area placement mirrors the same PUPPETS-G009 gap.

effects:
  - when: main_from_hand
    optional: false
    summary: "[Main] You may play 1 Shoemon or Arisa Kinosaki from hand or trash free"
    process:
      - select_union_zone:
          of: you
          zones: [hand, trash]
          filter:
            any_of:
              - name_is: Shoemon
              - name_is: Arisa Kinosaki
          bind_as: pick
          optional: true
          prompt: "You may play 1 [Shoemon] or [Arisa Kinosaki] from your hand or trash without paying the cost"
      - play_union_bound_free:
          binding: pick

  - scope: inherited
    when: on_security
    optional: false
    summary: "[Security] Activate [Main] union-zone play (Shoemon or Arisa Kinosaki from hand or trash)"
    process:
      - select_union_zone:
          of: you
          zones: [hand, trash]
          filter:
            any_of:
              - name_is: Shoemon
              - name_is: Arisa Kinosaki
          bind_as: sec_pick
          optional: true
          prompt: "You may play 1 [Shoemon] or [Arisa Kinosaki] from your hand or trash without paying the cost"
      - play_union_bound_free:
          binding: sec_pick

  - kind: delay
    trigger: on_suspend
    active_when:
      your_turn: true
      event_target_owner: you
      event_card_name_contains: "Arisa Kinosaki"
    summary: "[Your Turn] When your Arisa Kinosaki suspends, Delay: Puppet may digivolve into Puppet+LIBERATOR in hand, cost -3"
    process:
      - select_own_permanent:
          bind_as: target
          optional: true
          filter:
            all_of:
              - kind: digimon
              - trait_has: Puppet
              - zone: [battle_area]
          prompt: "Choose 1 of your [Puppet] Digimon to digivolve"
      - select_hand:
          of: you
          bind_as: evo
          optional: false
          filter:
            all_of:
              - kind: digimon
              - trait_has: Puppet
              - trait_has: LIBERATOR
          prompt: "Choose a [Puppet] and [LIBERATOR] Digimon card to digivolve into"
      - effect_initiated_digivolve:
          target: target
          from_hand: evo
          cost: { reduce: 3 }
          ignore_requirements: false
