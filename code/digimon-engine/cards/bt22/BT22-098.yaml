card: BT22-098
name: "Unique Emblem: Fable Waltz"
kind: option
color: [yellow]
cost: 3
traits: [LIBERATOR]

# Printed text:
# [Main] You may play 1 [Shoemon] or [Arisa Kinosaki] from your hand or trash
# without paying the cost. Then, place this card in the battle area.
#
# [Your Turn] When any of your [Arisa Kinosaki] suspend, <Delay> (By trashing
# this card after the placing turn, activate the effect below.)
# 1 of your [Puppet] trait Digimon may digivolve into a [Puppet] and
# [LIBERATOR] trait Digimon card in the hand with the digivolution cost reduced
# by 3.
#
# Fully implemented (no omitted slices):
# - [Main] union-zone (hand ∪ trash) play: the target choice is visible, optional,
#   filtered to [Shoemon] or [Arisa Kinosaki], and plays the selected card from its
#   true origin zone without paying its cost. (PUPPETS-G014, closed 2026-05-20.)
# - "Then, place this card in the battle area": BT22-098 carries a `kind: delay`
#   clause, so the Option pipeline classifies it as a Delay Option and places it
#   in the battle area automatically after the [Main] body resolves — including
#   when the [Main] body parks the union-zone selection and the pipeline returns
#   `Pending` (PUPPETS-G009 / the integrated-resolution shape tracked as
#   PUPPETS-G033; the engine path is proven by P-105 / LM-054 and verified here).
# - Event-gated Delay activation after the placing turn when your Arisa Kinosaki
#   suspends, with visible Puppet base and Puppet+LIBERATOR hand-evolution
#   selections before effect_initiated_digivolve with cost reduced by 3.
# - [Security] re-runs the [Main] union-zone play, then places this card in the
#   battle area via `place_self_as_delay_option` (the security pipeline does not
#   auto-place, so the placement tail is authored explicitly).

effects:
  # [Main] union-zone free play. No explicit placement step: BT22-098 is a Delay
  # Option (see the `kind: delay` clause below), so the Option pipeline places it
  # in the battle area automatically once this [Main] body resolves — which is
  # the "Then, place this card in the battle area" tail.
  - when: main_from_hand
    optional: false
    summary: "[Main] You may play 1 Shoemon or Arisa Kinosaki from hand or trash free; pipeline then places self in battle area"
    process:
      - select_union_zone:
          of: you
          zones: [hand, trash]
          filter:
            any_of:
              - name_is: Shoemon
              - name_is: Arisa Kinosaki
          bind_as: pick
          optional: true
          prompt: "You may play 1 [Shoemon] or [Arisa Kinosaki] from your hand or trash without paying the cost"
      - play_union_bound_free:
          binding: pick

  - scope: inherited
    when: on_security
    optional: false
    summary: "[Security] Activate [Main]: union-zone play (Shoemon/Arisa from hand or trash), then place self in battle area"
    process:
      - select_union_zone:
          of: you
          zones: [hand, trash]
          filter:
            any_of:
              - name_is: Shoemon
              - name_is: Arisa Kinosaki
          bind_as: sec_pick
          optional: true
          prompt: "You may play 1 [Shoemon] or [Arisa Kinosaki] from your hand or trash without paying the cost"
      - play_union_bound_free:
          binding: sec_pick
      - place_self_as_delay_option: {}

  - kind: delay
    trigger: on_suspend
    active_when:
      your_turn: true
      event_target_owner: you
      event_card_name_contains: "Arisa Kinosaki"
    summary: "[Your Turn] When your Arisa Kinosaki suspends, Delay: Puppet may digivolve into Puppet+LIBERATOR in hand, cost -3"
    process:
      - select_own_permanent:
          bind_as: target
          optional: true
          filter:
            all_of:
              - kind: digimon
              - trait_has: Puppet
              - zone: [battle_area]
          prompt: "Choose 1 of your [Puppet] Digimon to digivolve"
      - select_hand:
          of: you
          bind_as: evo
          optional: false
          filter:
            all_of:
              - kind: digimon
              - trait_has: Puppet
              - trait_has: LIBERATOR
          prompt: "Choose a [Puppet] and [LIBERATOR] Digimon card to digivolve into"
      - effect_initiated_digivolve:
          target: target
          from_hand: evo
          cost: { reduce: 3 }
          ignore_requirements: false
