# BT22-015 Omnimon — Digimon, Lv.7, Red+White, DP 15000, Cost 15.
# Traits: Holy Warrior, Royal Knight, CS.
# Evo: Lv.6 Red / Cost 6
# DNA Digivolve: Lv.6 w/[Greymon]-name + Lv.6 w/[Garurumon]-name / Cost 0
#
# Printed card text (data/cards.json):
#
#   ＜Blocker＞
#   ＜Decode (Red/Black Lv.3)＞
#     (When this Digimon would leave the battle area other than in battle,
#      you may play 1 Red or Black Level 3 Digimon card from its digivolution
#      cards without paying the cost.)
#   ＜Decode (Blue/Yellow Lv.3)＞
#   [On Play] [When Attacking] Delete 1 of your opponent's Digimon with the
#     lowest DP.
#   [When Digivolving] For every 2 same-level cards this Digimon's stack has,
#     return 1 of your opponent's Digimon to the bottom of the deck. Then,
#     this Digimon may attack.
#
# Inherited / Security: (none)
#
# DCGO C# reference:
#   DCGO/Assets/Scripts/CardEffect/BT22/Red/BT22_015.cs
#
# ─── DCGO crosscheck ─────────────────────────────────────────────────────────
#
# Five primary blocks:
#
#   1. Alternate Digivolution (EffectTiming.None) —
#      AddSelfDigivolutionRequirementStaticEffect with permCondition =
#      `TopCard.IsLevel6 && TopCard.HasCSTraits`, digivolutionCost: 5,
#      ignoreDigivolutionRequirement: false. This is a CS-trait-narrowed
#      cost-5 alt-source on Lv.6 ANY-color. Printed evo cost block in
#      cards.json shows Lv.6/Red/cost 6 — DCGO's CS-narrowed cost-5 source
#      is an extra source not on the printed card; per source priority
#      (printed text > DCGO), we encode the printed standard alt-path
#      `from: { level_eq: 6, color_is: red }, cost: 6` and treat the DCGO
#      CS-trait alt-source as an unprinted implementation alt-source not
#      authored in YAML.
#
#   2. DNA Digivolution (EffectTiming.None) — AddJogressConditionClass
#      registering the DNA recipe: PermanentCondition1 = ContainsCardName
#      ("Greymon") + Lv.6, PermanentCondition2 = ContainsCardName("Garurumon")
#      + Lv.6, JogressCondition cost = 0. Authored as
#      `kind: dna_digivolve` alt-path with materials filtered by
#      `name_contains` and `level_eq: 6`. `stacks_unsuspended: true`.
#
#   3. Static Effects (EffectTiming.None) —
#      • BlockerSelfStaticEffect → `kind: grant_keyword, keyword: Blocker`.
#      • DecodeSelfEffect (Red/Black) — sourceCondition = (Red || Black) &&
#        IsLevel3.
#      • DecodeSelfEffect (Blue/Yellow) — sourceCondition = (Blue || Yellow)
#        && IsLevel3.
#
#      The two Decode clauses are implemented as optional non-cancelling
#      replacement subscribers. The engine's generic `Keyword::Decode`
#      replacement REDIRECTS the leaving permanent to the controller's hand,
#      but BT22-015's printed Decode is different: it lets the controller
#      PLAY a color/level-matching source from THIS card's digivolution
#      sources without paying the cost, then the original leave proceeds.
#
#   4. On Play (EffectTiming.OnEnterFieldAnyone) — ActivateClass with
#      CanTriggerOnPlay. Body = SelectPermanentEffect over IsOpponentsDigimon
#      AND IsMinDP, mode Destroy, maxCount: 1, canNoSelect: false. Outer
#      isOptional: false (printed has no "may"). Mandatory delete of opp's
#      lowest-DP Digimon.
#
#   5. When Attacking (EffectTiming.OnAllyAttack) — same shape as block 4
#      with CanTriggerOnAttack. Mandatory delete of opp's lowest-DP Digimon.
#
#   6. When Digivolving (EffectTiming.OnEnterFieldAnyone +
#      CanTriggerWhenDigivolving) — body computes targetCount =
#      sum(per_level_count / 2) over THIS permanent's StackCards by level
#      bucket. Then SelectPermanentEffect over IsOpponentsDigimon, mode
#      PutLibraryBottom, maxCount = min(targetCount, opp Digimon count),
#      canNoSelect: false. After the bottom-deck selection: if THIS card is
#      still on the battle area and CanAttack(activateClass), present a
#      SelectAttackEffect with canAttackPlayerCondition = () => true and
#      defenderCondition = (perm) => true (any defender allowed).
#
#      The "Then, this Digimon may attack" is a may_attack_now (RESOLVED
#      2026-05-03) primitive — `targets: any`, `optional: true`. The
#      bottom-deck repeat-count target selection is resolved via formula
#      `max:` on `select_count_capped_multi`.
#
# ─── Source-priority audit (printed text vs DCGO) ────────────────────────────
#
# Printed text says "1 Red or Black Level 3 Digimon card from its
# digivolution cards" — both colour-pair Decode clauses select from THIS
# card's own digivolution sources. DCGO's DecodeSelfEffect with
# sourceCondition matches the printed colour/level filters exactly.
#
# Printed [On Play] / [When Attacking] are mandatory ("Delete 1 ..." not
# "you may delete"). DCGO confirms isOptional: false on both ActivateClass
# blocks. → no `optional` flag on the clauses, but `optional: true` on the
# select if no legal target — DCGO uses CanActivateCondition to gate; we
# use the engine's auto-skip when no legal targets exist.
#
# Printed [When Digivolving] uses "may attack" for the inner attack —
# `optional: true` on the may_attack_now. The bottom-deck step itself is
# mandatory once the digivolve resolves ("return 1 of your opponent's
# Digimon" — no "may" on that arm).
#
# ─── Resolved — Decode (play L3 source) [G-DECODE-PLAY-FROM-OWN-DIGIVOLUTION-SOURCES] ─
#
# The printed Decode clauses are an entirely different shape from the
# generic `Keyword::Decode` (which redirects the leaving permanent to its
# controller's hand). BT22-015's Decode:
#   - Triggers on the "would leave the battle area other than in battle"
#     timing (replacement-style observer).
#   - Body: optionally PLAY a card from THIS permanent's digivolution
#     SOURCES (i.e. the stack of cards under the top), filtered by colour
#     and level (Red/Black L3 for one clause, Blue/Yellow L3 for the
#     other), without paying the cost.
#   - Does NOT redirect the leaving permanent — the leave proceeds as
#     normal AFTER the optional play.
#
# Closed 2026-05-07 for BT22-015 using `kind: replacement` +
# `when_would_leave_battle_area`, a non-battle cause filter, color/level
# gated `select_material`, and `play_from_materials` consuming the selected
# source-card binding. Because the process does not set a replacement
# outcome, it runs as a side-effect and the original leave continues.
#
# ─── Resolved — Same-level pairs → repeat-count select [G-FORMULA-SAME-LEVEL-PAIRS-REPEAT-TARGET] ─
#
# `CompiledPerSelector::SameLevelPairsInSources` is RESOLVED for the
# narrow formula leaf (computes `sum(count / 2)` per level bucket over the
# carrier's source stack — qa/dsl-vocab-gaps.md 2026-05-02). The remaining
# count-bound piece is RESOLVED on 2026-05-07 by allowing
# `select_count_capped_multi.max` to be `{ formula: ... }` and by supporting
# `zone: battle_area` as a permanent-list pick. The body consumes the bound
# list with `per_selected` and `return_to_deck: { position: bottom }`.
#
# ─── Implementation status (faithfulness diff) ───────────────────────────────
#
# | Card-text element                                              | Status |
# |----------------------------------------------------------------|--------|
# | Standard digivolve Lv.6 Red / Cost 6                            | IMPLEMENTED (alt_paths kind: digivolve) |
# | DNA digivolve Lv.6 Greymon-name + Lv.6 Garurumon-name / Cost 0  | IMPLEMENTED (alt_paths kind: dna_digivolve) |
# | <Blocker>                                                       | IMPLEMENTED (grant_keyword) |
# | <Decode (Red/Black Lv.3)>                                       | IMPLEMENTED (`replacement` + Red/Black Lv.3 `select_material`) |
# | <Decode (Blue/Yellow Lv.3)>                                     | IMPLEMENTED (`replacement` + Blue/Yellow Lv.3 `select_material`) |
# | [On Play] Delete 1 opp Digimon with lowest DP                    | PARTIAL (G-PRED-DP-LTE — predicate parses but evaluator does not narrow targets to lowest-DP only) |
# | [When Attacking] Delete 1 opp Digimon with lowest DP             | PARTIAL (G-PRED-DP-LTE — same as above) |
# | [When Digivolving] Bottom-deck N opp Digimon (N = same-level pairs) | IMPLEMENTED (`select_count_capped_multi.max.formula`) |
# | [When Digivolving] "Then, this Digimon may attack"               | IMPLEMENTED (may_attack_now, optional: true, targets: any) |

card: BT22-015
name: Omnimon
kind: digimon
level: 7
color: [red, white]
cost: 15
dp: 15000
traits: [Holy Warrior, Royal Knight, CS]

alt_paths:
  # Standard digivolve: Lv.6 Red / Cost 6 (per cards.json evo_costs).
  - kind: digivolve
    from: { level_eq: 6, color_is: red }
    cost: 6

  # Printed alt digivolve: Lv.6 w/[CS] trait / Cost 5.
  # From official Bandai DB (data/card_bundles/BT22-015.md) and printed card image.
  # This is a cheaper route than the standard Lv.6 Red / Cost 6.
  - kind: digivolve
    from: { level_eq: 6, trait_has: CS }
    cost: 5

  # DNA digivolve: Lv.6 Greymon-named + Lv.6 Garurumon-named / Cost 0.
  # Per cards.json `dna_costs` and DCGO BT22_015.cs lines 51-99 GetJogress.
  # `stacks_unsuspended: true` per DNA-digivolve convention (BT17-078 idiom).
  - kind: dna_digivolve
    materials:
      - { level_eq: 6, name_contains: "Greymon" }
      - { level_eq: 6, name_contains: "Garurumon" }
    cost: 0
    stacks_unsuspended: true

effects:
  # ─── Static keyword: <Blocker> ────────────────────────────────────────────
  # DCGO BT22_015.cs:108 — BlockerSelfStaticEffect at None timing,
  # isInheritedEffect: false. Standard face-up declarative.
  - kind: grant_keyword
    keyword: Blocker

  # ─── <Decode (Red/Black Lv.3)> ─────────────────────────────────────────────
  # Printed: "When this Digimon would leave the battle area other than in
  # battle, you may play 1 Red or Black Level 3 Digimon card from its
  # digivolution cards without paying the cost."
  # This is a non-cancelling replacement subscriber: accepting the optional
  # play runs the side-effect, then the original leave event proceeds.
  - kind: replacement
    trigger: when_would_leave_battle_area
    optional: true
    active_when:
      none_of:
        - replacement_cause: battle
    summary: "<Decode (Red/Black Lv.3)> play a matching source when this Digimon would leave outside battle"
    process:
      - select_material:
          of_permanent: replacement_subject
          bind_as: decode_source
          filter:
            all_of:
              - kind: digimon
              - level_eq: 3
              - any_of:
                  - color_is: red
                  - color_is: black
          prompt: "Choose a Red or Black Lv.3 source to play"
      - play_from_materials:
          target: replacement_subject
          source_index: decode_source
          cost_delta: free

  # ─── <Decode (Blue/Yellow Lv.3)> ───────────────────────────────────────────
  # Same non-cancelling replacement shape as Red/Black — different colour gate.
  - kind: replacement
    trigger: when_would_leave_battle_area
    optional: true
    active_when:
      none_of:
        - replacement_cause: battle
    summary: "<Decode (Blue/Yellow Lv.3)> play a matching source when this Digimon would leave outside battle"
    process:
      - select_material:
          of_permanent: replacement_subject
          bind_as: decode_source
          filter:
            all_of:
              - kind: digimon
              - level_eq: 3
              - any_of:
                  - color_is: blue
                  - color_is: yellow
          prompt: "Choose a Blue or Yellow Lv.3 source to play"
      - play_from_materials:
          target: replacement_subject
          source_index: decode_source
          cost_delta: free

  # ─── Clause — [On Play] Delete 1 opp Digimon with lowest DP ────────────────
  #
  # Printed: "[On Play] [When Attacking] Delete 1 of your opponent's Digimon
  # with the lowest DP."
  #
  # DCGO BT22_015.cs:145-194 (On Play) and 197-247 (When Attacking) —
  # identical body shape on different timings. Both mandatory (isOptional:
  # false), both filter the target to opp Digimon AND IsMinDP.
  #
  # G-PRED-DP-LTE: `dp_lte: { aggregate: { selector: lowest_dp, scope:
  # opponent } }` predicate is parsed and compiled but not yet evaluated for
  # permanents (sister cards BT24-017 / BT22-013). Until the gap closes the
  # select prompt offers all opp Digimon rather than only the lowest-DP one.
  # The YAML faithfully encodes the printed filter; the evaluator gap is
  # cross-card.
  - when: [on_play, when_attacking]
    summary: "[On Play][When Attacking] Delete 1 opp Digimon with lowest DP"
    process:
      - select_opponent_permanent:
          bind_as: victim
          filter:
            all_of:
              - kind: digimon
              - dp_lte:
                  aggregate:
                    selector: lowest_dp
                    scope: opponent
          prompt: "Delete opponent's lowest-DP Digimon"
      - delete_permanent: { target: victim }

  # ─── Clause — [When Digivolving] same-level pair count → bottom-deck + may attack ─
  #
  # Printed: "[When Digivolving] For every 2 same-level cards this Digimon's
  # stack has, return 1 of your opponent's Digimon to the bottom of the deck.
  # Then, this Digimon may attack."
  #
  # DCGO BT22_015.cs:251-337 — single ActivateClass at OnEnterFieldAnyone
  # gated on CanTriggerWhenDigivolving. Body:
  #   1. Compute targetCount = sum(per_level_count / 2) across THIS
  #      permanent's StackCards by level bucket.
  #   2. SelectPermanentEffect over opp Digimon, maxCount = min(targetCount,
  #      opp Digimon count), canNoSelect: false, mode PutLibraryBottom.
  #   3. After bottom-deck step: if THIS card still on the battle area and
  #      CanAttack(activateClass), SelectAttackEffect with
  #      canAttackPlayerCondition: () => true, defenderCondition: any.
  #
  - when: when_digivolving
    summary: "[When Digivolving] Bottom-deck opponent Digimon per same-level pairs; then this Digimon may attack"
    process:
      - select_count_capped_multi:
          of: opponent
          zone: battle_area
          max:
            formula:
              base: 0
              per: same_level_pairs_in_sources
              delta: 1
          filter: { kind: digimon }
          bind_as: bottoms
          prompt: "Choose opponent Digimon to return to the bottom of the deck"
          optional_zero: false
      - per_selected:
          selection: bottoms
          bind_as: b
          body:
            - return_to_deck:
                target: b
                position: bottom
      # "Then, this Digimon may attack" — DCGO defenderCondition is `any`
      # (perm → true) and canAttackPlayerCondition is `() => true`, so the
      # attack target is unrestricted (player or any opp Digimon).
      # `optional: true` per printed "may attack".
      - may_attack_now:
          attacker: source
          targets: any
          optional: true
