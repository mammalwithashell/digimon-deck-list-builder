card: BT22-009
name: Effecmon
kind: digimon
level: 4
color: [red]
cost: 4
dp: 4000
traits: ["Effect (App Name)"]
form: Sup.
attribute: Entertainment
alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: red }
    cost: 2
  # Second digivolve circle on the card face: "Stnd. 2" — digivolve onto a
  # Digimon with the [Stnd.] form-trait for cost 2 (DCGO BT22_009.cs
  # AddSelfDigivolutionRequirementStaticEffect EqualsTraits("Stnd.")). Sibling
  # ST22-12 models the same "Stnd." circle this way.
  - kind: digivolve
    from: { trait_has: "Stnd." }
    cost: 2

effects:
  - when: on_security
    summary: "[Security] At the end of the battle, play this card without paying the cost"
    process:
      - play_from_security: {}

  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Delete 1 opponent Digimon with 4000 DP or less"
    condition:
      any_permanent:
        of: opponent
        zone: [battle_area]
        kind: digimon
        dp_lte: 4000
    process:
      - select_opponent_permanent:
          bind_as: target
          filter:
            all_of:
              - kind: digimon
              - dp_lte: 4000
          prompt: "Delete 1 opponent Digimon with 4000 DP or less"
      - delete_permanent: { target: target }

  # Omitted:
  # [Link] [Appmon] trait: Cost 2 / [When Linking] Delete 1 opponent Digimon with
  # 4000 DP or less. Link Requirements are omitted pending Link/plug-in action
  # support (attachment lifecycle + WhenLinked timing). See # Gap: G-LINK-REQUIREMENTS.
