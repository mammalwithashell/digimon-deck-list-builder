card: BT22-009
name: Effecmon
kind: digimon
level: 4
color: [red]
cost: 4
dp: 4000
# Card face trait line: "Sup./Appmon | Entertainment | Effect"; cards.json
# type_eng carries "Effect (App Name)" and "Effect", form_eng "Sup." and
# "Appmon" (production reads cards.json).
traits: ["Effect (App Name)", Effect, Appmon]
form: Sup.
attribute: Entertainment
alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: red }
    cost: 2
  # Second digivolve circle on the card face: "Stnd. 2" — digivolve onto a
  # Digimon with the [Stnd.] form-trait for cost 2 (DCGO BT22_009.cs
  # AddSelfDigivolutionRequirementStaticEffect EqualsTraits("Stnd.")). Sibling
  # ST22-12 models the same "Stnd." circle this way.
  - kind: digivolve
    from: { trait_has: "Stnd." }
    cost: 2

effects:
  - text: "[Security] At the end of the battle, play this card without paying the cost."
    when: on_security
    summary: "[Security] At the end of the battle, play this card without paying the cost"
    process:
      - play_from_security: {}

  - text: "[On Play] [When Digivolving] Delete 1 of your opponent's Digimon with 4000 DP or less."
    when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Delete 1 opponent Digimon with 4000 DP or less"
    condition:
      any_permanent:
        of: opponent
        zone: [battle_area]
        kind: digimon
        dp_lte: 4000
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter:
            all_of:
              - kind: digimon
              - dp_lte: 4000
          prompt: "Delete 1 opponent Digimon with 4000 DP or less"
      - delete_permanent: { target: target }

  # ─── Link box (card face BT22-009.webp; official bundle Link Condition /
  #     Link DP / Link Effect; cards.json drops it) ─────────────────────────
  # <Link> [Appmon] trait: Cost 2 -- DCGO BT22_009.cs
  # AddSelfLinkConditionStaticEffect(TopCard.HasAppmonTraits, linkCost: 2)
  # (BT21-018 idiom).
  - text: "＜Link＞ [Appmon] trait: Cost 2"
    kind: link_condition
    cost: 2
    filter: { trait_has: Appmon }

  # Link DP +3000 while linked (scope:linked aura, BT21-018 idiom).
  - text: "+3000 DP"
    scope: linked
    kind: aura
    target: {}
    dp_modifier: 3000
    summary: "[Link] +3000 DP to the linked Digimon (host)"

  # [When Linking] Delete 1 of your opponent's Digimon with 4000 DP or less.
  # DCGO WhenLinked, SetIsLinkedEffect(true), not optional, canNoSelect false;
  # the DP cap is MaxDP_DeleteEffect(4000) (the same cap as [On Play] above).
  - text: "[When Linking] Delete 1 of your opponent's Digimon with 4000 DP or less."
    scope: linked
    when: when_linked
    summary: "[When Linking] Delete 1 of your opponent's Digimon with 4000 DP or less"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: link_target
          filter:
            all_of:
              - kind: digimon
              - dp_lte: 4000
          prompt: "Delete 1 of your opponent's Digimon with 4000 DP or less"
      - delete_permanent: { target: link_target }
