card: BT22-002
name: Kyaromon
kind: digi_egg
level: 2
color: [blue]
cost: 0
traits: [Lesser, LIBERATOR]
form: In-Training

effects:
  - scope: inherited
    when: on_any_deletion
    active_when: { your_turn: true }
    once_per_turn: true
    summary: "[Your Turn][OPT] When your Token or other Puppet Digimon is deleted, Draw 1"
    condition:
      all_of:
        - event_target_owner: you
        - any_of:
            - event_target_kind: token
            - all_of:
                - event_target_kind: digimon
                - event_target_trait_has: Puppet
                - event_permanent_is_source: false
    process:
      - draw: { of: you, count: 1 }
