card: BT22-032
name: ShoeShoemon
kind: digimon
level: 4
color: [yellow]
cost: 5
dp: 5000
traits: [Puppet, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 2

effects:
  - when: on_deletion
    optional: true
    summary: "You may play 1 level 3 Puppet Digimon from hand without paying the cost"
    process:
      - select_hand:
          of: you
          bind_as: pick
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_eq: 3
              - trait_has: Puppet
          prompt: "Play 1 level 3 Puppet Digimon from hand"
      - play_from_hand_free: { of: you, hand_index: pick }

  - scope: inherited
    when: when_attacking
    once_per_turn: true
    summary: "[When Attacking][OPT] 1 opponent Digimon gets -2000 DP for the turn"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon to get -2000 DP"
      - add_dp_modifier:
          target: target
          value: -2000
          expiry: end_of_turn
