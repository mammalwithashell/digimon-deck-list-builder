card: BT15-084
name: Kari Kamiya
kind: tamer
color: [yellow]
cost: 4

effects:
  - when: start_of_your_turn
    summary: "[Start of Your Turn] If memory is 2 or less, set it to 3"
    condition: { memory_lte: 2 }
    process:
      - set_memory: 3

  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}

  # ─── [All Turns] own-security-removed → suspend self → opp Security A. -1 ─────
  #
  # "When an effect removes cards from your security stack, by suspending this
  # Tamer, 1 of your opponent's Digimon gains <Security A. -1> until the end of
  # their turn." DCGO BT15_084.cs OnLoseSecurity ActivateClass: player-activated
  # (optional), source_is_unsuspended gate, SuspendPermanentsClass([self]) cost,
  # then mandatory opponent-Digimon SecurityAttackChange(-1, UntilOpponentTurnEnd).
  - when: on_own_security_removed
    active_when: { all_turns: true }
    optional: true
    condition:
      all_of:
        - source_is_unsuspended: true
        - any_permanent:
            of: opponent
            zone: [battle_area]
            kind: digimon
    summary: "[All Turns] When your security is removed, by suspending this Tamer, 1 opponent Digimon gets Security A. -1 until their turn ends"
    process:
      - activation_cost: { suspend_self: true }
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon to get Security A. -1 until their turn ends"
      - add_modifier:
          target: target
          modifier: SecurityAttackChange
          value: -1
          expiry: end_of_opponents_turn

  # ─── [Security-trash] this card effect-trashed from security → opp Sec A. -1 ──
  #
  # "When an effect trashes this card from the security stack, 1 of your
  # opponent's Digimon gains <Security A. -1> until the end of their turn."
  # DCGO BT15_084.cs OnDiscardSecurity: MANDATORY (canNoSelect:false), gated on
  # HasMatchConditionPermanent (>=1 opponent Digimon). scope:security +
  # on_discard_security (BT25-040 idiom).
  - when: on_discard_security
    scope: security
    summary: "[Security-trash] When an effect trashes this from security, 1 opp Digimon gets Security A. -1 until their turn ends"
    condition:
      count_gte:
        filter: { of: opponent, zone: [battle_area], kind: digimon }
        n: 1
    process:
      - select_opponent_permanent:
          bind_as: sa_target
          filter: { kind: digimon }
          prompt: "1 of your opponent's Digimon gets [Security A. -1] until the end of their turn"
      - add_modifier:
          target: sa_target
          modifier: SecurityAttackChange
          value: -1
          expiry: end_of_opponents_turn
