card: ST25-04
name: Reptilimon
kind: digimon
level: 5
color: [red]
cost: 7
dp: 7000
traits: [Dragon Warrior, ALYSION]
form: Ultimate
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: red }
    cost: 3
  - kind: digivolve
    from: { any_color: true, level_eq: 4, in_text_contains: Gemmon }
    cost: 3

effects:
  - kind: grant_keyword
    text: "＜Engage＞"
    keyword: Engage

  - when: [on_play, when_digivolving]
    text: "[On Play] [When Digivolving] 1 of your Digimon gets +3000 DP for the turn. Then, if that Digimon has 12000 DP or more, it also gains ＜Security A. +1＞."
    summary: "[On Play][When Digivolving] 1 of your Digimon gets +3000 DP for the turn; if it has 12000+ DP, it also gains <Security A. +1> for the turn"
    process:
      - select_own_permanent:
          optional: false
          bind_as: boosted
          filter: { kind: digimon }
          prompt: "1 of your Digimon gets +3000 DP for the turn"
      - add_dp_modifier: { target: boosted, value: 3000, expiry: end_of_turn }
      - if:
          condition:
            any_permanent:
              of: you
              zone: [battle_area]
              of_permanent: boosted
              dp_gte: 12000
          then:
            - add_modifier:
                target: boosted
                modifier: SecurityAttackChange
                value: 1
                expiry: end_of_turn

  - scope: inherited
    text: "[Your Turn] This Digimon with [Gemmon] in its text gains ＜Engage＞."
    kind: grant_keyword
    keyword: Engage
    active_when: { your_turn: true, in_text_contains: Gemmon }
    summary: "Inherited [Your Turn] This Digimon with [Gemmon] in its text gains <Engage>"
