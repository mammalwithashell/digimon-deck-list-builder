card: ST25-06
name: Kanata Hondo
kind: tamer
color: [red]
cost: 4
traits: [ALYSION]

effects:
  - when: start_of_your_turn
    text: "[Start of Your Turn] If you have 2 or less memory, set it to 3."
    condition: { memory_lte: 2 }
    summary: "[Start of Your Turn] If you have 2 or less memory, set it to 3"
    process:
      - set_memory: 3

  - when: [on_ally_played, on_digivolve]
    text: "[Your Turn] When your Digimon are played or digivolve, if any of them have the [ALYSION] trait, by suspending this Tamer, for the turn, 1 of your Digimon isn't affected by your opponent's Option effects and gets +3000 DP."
    optional: true
    active_when: { your_turn: true }
    trigger_if: { event_target_owner: you, event_target_kind: digimon, event_target_trait_has: ALYSION }
    condition: { source_is_unsuspended: true }
    summary: "[Your Turn] When your [ALYSION] Digimon is played or digivolves, suspend this Tamer to give 1 of your Digimon Option immunity and +3000 DP for the turn"
    process:
      - activation_cost: { suspend_self: true }
      - select_own_permanent:
          optional: false
          bind_as: protected
          filter: { kind: digimon }
          prompt: "1 of your Digimon isn't affected by opponent's Option effects and gets +3000 DP for the turn"
      - grant_effect_immunity:
          target: protected
          source_kind: option
          source_controller: opponent
          expiry: end_of_turn
      - add_dp_modifier: { target: protected, value: 3000, expiry: end_of_turn }

  - when: on_security
    text: "[Security] Play this card without paying the cost."
    process:
      - play_from_security: {}
