card: ST25-03
name: Liskmon
kind: digimon
level: 4
color: [red]
cost: 4
dp: 5000
traits: [Bird Dragon, ALYSION]
form: Champion
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: red }
    cost: 2
  - kind: digivolve
    from: { any_color: true, level_eq: 3, in_text_contains: Gemmon }
    cost: 2

effects:
  - when: [on_play, when_digivolving]
    text: "[On Play] [When Digivolving] If you have 1 or fewer Tamers, you may play 1 [Kanata Hondo] from your hand without paying the cost."
    condition:
      count_lte:
        filter: { of: you, zone: [battle_area], kind: tamer }
        n: 1
    summary: "[On Play][When Digivolving] If you have 1 or fewer Tamers, you may play 1 [Kanata Hondo] from hand without paying the cost"
    process:
      - select_hand:
          of: you
          bind_as: tamer_card
          optional: true
          filter: { name_is: "Kanata Hondo", can_play_from_effect_without_cost: true }
          prompt: "You may play 1 [Kanata Hondo] from your hand without paying the cost"
      - play_from_hand_free: { of: you, hand_index: tamer_card }

  - scope: inherited
    text: "＜Raid＞"
    kind: grant_keyword
    keyword: Raid
    summary: "Inherited <Raid>"
