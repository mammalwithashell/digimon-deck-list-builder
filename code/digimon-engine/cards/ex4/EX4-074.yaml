card: EX4-074
name: "ShineGreymon: Ruin Mode"
kind: digimon
level: 7
color: [purple, yellow]
cost: 14
dp: 15000
traits: ["Light Dragon"]
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 6, color_is: purple }
    cost: 5
  - kind: digivolve
    from: { name_contains: "ShineGreymon" }
    cost: 4

# ─── Clause 1 — [When Digivolving] [On Deletion] mass opponent DP debuff ─────
#
# Printed text:
#   "[When Digivolving] [On Deletion] Until the end of your opponent's next
#    turn, all of your opponent's Digimon get -5000DP."
#
# `expiry: end_of_opponents_next_turn` is faithful for BOTH timings: the engine
# auto-computes `ModifierEntry.pending_skips` at install time
# (`modifiers::pending_skips_for_install`, consumed by `EffectContext::
# add_modifier`). An `[On Deletion]` that fires during the opponent's turn
# installs with `pending_skips: 1`, so it skips that turn-end and expires at
# the end of the opponent's NEXT turn; a `[When Digivolving]` install on the
# controller's own turn installs with `pending_skips: 0` and expires at the
# first (= next) opponent turn-end. Tamers carry no DP and are excluded by the
# `kind: digimon` target filter.

# ─── Clause 2 — [End of Attack] self-delete + opp delete + Recovery + hatch ──
#
# Printed text:
#   "[End of Attack] Delete this Digimon and 1 of your opponent's Digimon, and
#    <Recovery +1 (Deck)>. Then, if you have a Tamer in play, hatch 1 Digi-Egg
#    card to an empty space in your breeding area."
#
# Audit (2026-05-15) flagged the chain as UNCLEAR — "All individual verbs
# exist; the EX4-074 mandatory chain likely works with existing primitives
# but needs proof via behavioral test." This clause is the first-test target.
#
# Mandatory-continuation note: the opp Digimon delete is mandatory but
# `select_opponent_permanent` with no candidates would stall. The card text
# is ambiguous on what happens with no opp target — official rulings treat
# mandatory targets-as-much-as-possible (rule 7.6) so the rest of the chain
# still resolves. `optional: true` on the select step lets it pass cleanly
# when no targets exist while still requiring a choice when targets do.
effects:
  - when: [when_digivolving, on_deletion]
    summary: "[When Digivolving][On Deletion] All opponent Digimon -5000 DP until end of opponent's next turn"
    process:
      - add_modifier:
          target: { of: opponent, kind: digimon }
          modifier: ChangeDp
          value: -5000
          expiry: end_of_opponents_next_turn

  - when: end_of_attack
    summary: "[End of Attack] Self-delete, delete 1 opp Digimon, Recovery +1, hatch if Tamer in play"
    process:
      - delete_permanent: { target: source }
      - select_opponent_permanent:
          bind_as: opp_target
          optional: true
          filter:
            kind: digimon
          prompt: "Delete 1 of your opponent's Digimon"
      - delete_permanent: { target: opp_target }
      - recover: { of: you, count: 1 }
      - if:
          condition:
            all_of:
              - any_field_permanent: { of: you, kind: tamer }
              - can_hatch: you
          then:
            - hatch: { of: you }
