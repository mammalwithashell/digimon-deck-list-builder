# Official Bandai EX4-019 entry and printed image checked 2026-11-22:
# https://world.digimoncard.com/cards/index.php?card_no=EX4-019&search=true
# Base and Event Pack 10 printings agree; no card-specific Q&A is listed.
# A bounded exact-Mirage-deck prerequisite, separate from BT27 ingestion.
card: EX4-019
name: MachGaogamon
kind: digimon
level: 5
color: [blue]
cost: 7
dp: 7000
form: Ultimate
attribute: Data
traits: [Cyborg]
alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: blue }
    cost: 3

effects:
  - when: when_digivolving
    summary: "[When Digivolving] Return 1 of your opponent's level 4 or lower Digimon to its owner's hand."
    process:
      - select_opponent_permanent:
          bind_as: bounced
          filter: { kind: digimon, level_lte: 4 }
          prompt: "Return 1 of your opponent's level 4 or lower Digimon to its owner's hand"
      - return_to_hand: { target: bounced }
  - scope: inherited
    when: when_attacking
    once_per_turn: true
    condition:
      count_gte:
        filter: { of: opponent, zone: [hand] }
        n: 8
    summary: "[Inherited] [When Attacking] [Once Per Turn] If your opponent has 8 or more cards in their hand, unsuspend this Digimon."
    process:
      - unsuspend: { target: source }
