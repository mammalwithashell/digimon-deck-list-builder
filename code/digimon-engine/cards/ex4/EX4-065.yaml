card: EX4-065
name: Trident Gaia
kind: option
color: [red, green]
cost: 8

effects:
  - when: main_from_hand
    summary: "[Main] Delete 1 opponent Digimon with the highest DP"
    process:
      - select_opponent_permanent:
          bind_as: victim
          filter:
            all_of:
              - kind: digimon
              - dp_gte:
                  aggregate:
                    selector: highest_dp
                    scope: opponent
          prompt: "Delete 1 opponent Digimon with the highest DP"
      - delete_permanent: { target: victim }

  - when: on_security
    summary: "[Security] Activate this card's Main effect"
    process:
      - select_opponent_permanent:
          bind_as: victim
          filter:
            all_of:
              - kind: digimon
              - dp_gte:
                  aggregate:
                    selector: highest_dp
                    scope: opponent
          prompt: "Delete 1 opponent Digimon with the highest DP"
      - delete_permanent: { target: victim }

  # Omitted (G-HIGHEST-DP-DELETE-WITH-EFFECT-PAYLOAD):
  # "If a Digimon with 13000 DP or more is deleted by this effect, trash the
  # top card of your opponent's security stack." The effect-deleted result
  # payload is bare-bool only (`effect_deleted_any_opponent_digimon`); the
  # result log (`EffectResultLog.deleted`) stores only `PermanentHandle`s with
  # no DP snapshot, and post-deletion the carrier has moved to trash so a live
  # DP read is unavailable. Needs a deleted-permanent DP threshold on the
  # effect-deleted payload before this conditional tail can be authored.
