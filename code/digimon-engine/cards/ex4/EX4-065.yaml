card: EX4-065
name: Trident Gaia
kind: option
color: [red, green]
cost: 8

effects:
  - when: main_from_hand
    summary: "[Main] Delete 1 opp Digimon with the highest DP; if a 13000+-DP Digimon was deleted by this effect, trash opp top security"
    process:
      - select_opponent_permanent:
          bind_as: victim
          filter:
            all_of:
              - kind: digimon
              - dp_gte:
                  aggregate:
                    selector: highest_dp
                    scope: opponent
          prompt: "Delete 1 opponent Digimon with the highest DP"
      - delete_permanent: { target: victim }
      # "If a Digimon with 13000 DP or more is deleted by this effect, trash
      # the top card of your opponent's security stack." Keyed on the
      # PRE-REMOVAL DP of what WAS deleted (DCGO EX4_065.cs:71 uses
      # `DPJustBeforeRemoveField >= 13000`), not on the live target — the
      # carrier is in trash by the time this rider evaluates (rule 25).
      - if:
          condition: { effect_deleted_opponent_digimon_dp_gte: 13000 }
          then:
            - trash_top_security: { of: opponent }

  - when: on_security
    summary: "[Security] Activate this card's Main effect (delete highest-DP; 13000+-DP deletion trashes opp top security)"
    process:
      - select_opponent_permanent:
          bind_as: victim
          filter:
            all_of:
              - kind: digimon
              - dp_gte:
                  aggregate:
                    selector: highest_dp
                    scope: opponent
          prompt: "Delete 1 opponent Digimon with the highest DP"
      - delete_permanent: { target: victim }
      - if:
          condition: { effect_deleted_opponent_digimon_dp_gte: 13000 }
          then:
            - trash_top_security: { of: opponent }
