card: EX4-011
name: ChaosGallantmon
kind: digimon
level: 6
form: Mega
attribute: Virus
color: [red, purple]
cost: 12
dp: 12000
traits: [Dark Knight]

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: red }
    cost: 4
  - kind: digivolve
    from: { level_eq: 5, color_is: purple }
    cost: 4
  - kind: digivolve
    from: { any_color: true, level_eq: 5, name_contains: WarGrowlmon }
    cost: 3

effects:
  - text: "[Trash][End of Your Turn] By deleting 1 of your Digimon with digivolution cards and [Gallantmon] in its name, you may play this card without paying the cost."
    scope: trash
    when: end_of_your_turn
    optional: true
    condition:
      any_permanent:
        of: you
        zone: [battle_area]
        all_of:
          - kind: digimon
          - materials_count_gte: 1
          - name_contains: Gallantmon
    summary: "[Trash][End of Your Turn] By deleting 1 of your [Gallantmon] with digivolution cards, play this card free"
    process:
      - select_own_permanent:
          optional: true
          bind_as: sac
          filter:
            all_of:
              - kind: digimon
              - materials_count_gte: 1
              - name_contains: Gallantmon
          prompt: "Delete 1 of your Digimon with digivolution cards and [Gallantmon] in its name to play this card"
      - if:
          condition: { binding_present: sac }
          then:
            - delete_permanent: { target: sac }
            - play_from_trash_free: { of: you, hand_index: source }

  - text: "[On Play] Delete 1 of your opponent's Digimon with 7000 DP or less. For every 10 total cards in both players' trashes, add 2000 to the maximum this DP-based deletion effect can delete."
    when: on_play
    summary: "[On Play] Delete 1 opponent Digimon with DP <= 7000 + 2000*(total_trash/10)"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: victim
          filter:
            all_of:
              - kind: digimon
              - dp_lte:
                  formula:
                    base: 7000
                    per: { shared_trash_count: {} }
                    bucket: 10
                    delta: 2000
          prompt: "Delete 1 of your opponent's Digimon within the DP deletion maximum"
      - delete_permanent: { target: victim }
