# EX4-060 Omnimon Alter-S — Digimon, Lv.7, White, DP 15000, Cost 15.
# Traits: Holy Warrior.
# Evo: Lv.6 Blue / Cost 6
# DNA Digivolve: Lv.6 Blue + Lv.6 Red / Cost 0
#
# Printed card text (data/cards.json — verbatim):
#
#   [When Digivolving] Delete 1 of your opponent's Digimon with 8000 DP or
#     less, and return 1 of your opponent's level 6 or higher Digimon to the
#     bottom of its owner's deck.
#   [All Turns] When this Digimon would leave the battle area other than by
#     one of your effects, play 1 [BlitzGreymon] and 1 [CresGarurumon] from
#     this Digimon's digivolution cards without paying the costs. Then, place
#     this Digimon at the bottom of your security stack face down.
#
# Inherited / Security: (none)
#
# DCGO C# reference:
#   DCGO/Assets/Scripts/CardEffect/EX4/White/EX4_060.cs
#
# ─── Source-priority cross-check (printed text + RULES_CONTEXT.md > DCGO) ───
#
# Printed text governs. DCGO matches the printed text on every clause:
#
# Block 1 (DCGO None timing) — AddJogressConditionClass:
#   - PermanentCondition1: Lv.6 + Blue
#   - PermanentCondition2: Lv.6 + Red
#   - cost: 0
#   Authored as `kind: dna_digivolve` alt-path with `level_eq: 6 + color_is`
#   filters and `stacks_unsuspended: true` (DNA-digivolve convention; mirrors
#   BT17-078, BT22-015).
#
# Block 2 (DCGO OnEnterFieldAnyone, gated by CanTriggerWhenDigivolving) —
#   ActivateClass with isOptional: false ("delete 1 of your opponent's
#   Digimon with 8000 DP or less, and return 1 of your opponent's level 6 or
#   higher Digimon" — printed text has no "may"). Body is two SEQUENTIAL
#   SelectPermanentEffect calls within the same ActivateCoroutine:
#     - First select: opp Digimon with DP <= 8000, mode Destroy, maxCount 1,
#       canNoSelect: false (mandatory if a legal target exists).
#     - Second select: opp Digimon with Level >= 6 (and TopCard.HasLevel),
#       mode PutLibraryBottom, maxCount 1, canNoSelect: false.
#   The two selects run independently — each is gated by its own
#   HasMatchConditionPermanent check, so if the field has only an 8000-DP
#   target the delete fires and the bottom-deck silently no-ops, and vice
#   versa.
#
# Block 3 (DCGO WhenRemoveField) — ActivateClass with hash
#   "PlayAndPutSecurity_EX4_060". CanUseCondition gates:
#     - IsExistOnBattleArea(card)
#     - CanTriggerWhenRemoveField(hashtable, card)
#     - !IsByEffect(hashtable, IsOwnerEffect(...)) — "other than by one of
#       your effects"
#   Body:
#     1. SelectCardEffect over THIS permanent's `DigivolutionCards` list,
#        filtered by `CardNames.Contains("BlitzGreymon")` AND
#        `CanPlayAsNewPermanent(payCost: false)`. canNoSelect: () => false.
#     2. SelectCardEffect over THIS permanent's `DigivolutionCards` list,
#        filtered by `CardNames.Contains("CresGarurumon")` AND
#        `CanPlayAsNewPermanent(payCost: false)`. canNoSelect: () => false.
#     3. PlayPermanentCards(selectedCards, payCost: false, isTapped: false,
#        root: DigivolutionCards, activateETB: true) — plays the picked
#        cards without paying the costs.
#     4. If THIS card is still on the battle area, IPutSecurityPermanent
#        with toTop: false → places the leaving Digimon face-down on the
#        bottom of its controller's security stack.
#   `isOptional` flag: this is a forced replacement-style trigger fired on
#   "would leave" — DCGO does not show `isOptional: true` on the outer
#   ActivateClass for this clause, and printed text reads "play 1 [X] and
#   1 [Y]" without "you may" — i.e. MANDATORY when triggered. The internal
#   per-card SelectCardEffect with canNoSelect: () => false reinforces
#   this: if a candidate exists, the player MUST pick it. The whole clause
#   only no-fires when the cause IS one of the controller's own effects
#   (the "other than by one of your effects" gate).
#
# ─── Implementation status (faithfulness diff) ───────────────────────────────
#
# | Card-text element                                                | Status |
# |------------------------------------------------------------------|--------|
# | Standard digivolve Lv.6 Blue / Cost 6                             | IMPLEMENTED (alt_paths kind: digivolve) |
# | DNA digivolve Lv.6 Blue + Lv.6 Red / Cost 0                       | IMPLEMENTED (alt_paths kind: dna_digivolve) |
# | [When Digivolving] Delete 1 opp Digimon DP <= 8000                | IMPLEMENTED (select_opponent_permanent dp_lte: 8000 + delete_permanent) |
# | [When Digivolving] Return 1 opp Digimon Lv >= 6 to deck bottom    | IMPLEMENTED (select_opponent_permanent level_gte: 6 + return_to_deck position: bottom) |
# | [All Turns] On leave-other-than-own-effect, play BlitzGreymon + CresGarurumon from own digivolution cards free | BLOCKED — G-PLAY-FROM-OWN-DIGIVOLUTION-SOURCES |
# | [All Turns] Then, place this Digimon at the bottom of own security stack face down | BLOCKED — G-PLACE-SELF-AT-SECURITY-BOTTOM |
#
# ─── DSL-GAP — Play card from own digivolution sources [G-PLAY-FROM-OWN-DIGIVOLUTION-SOURCES] ─
#
# (NEW — same shape as G-DECODE-PLAY-FROM-OWN-DIGIVOLUTION-SOURCES surfaced
# by BT22-015's printed Decode clauses; restated here as a standalone gap
# because EX4-060's "play 1 [BlitzGreymon] and 1 [CresGarurumon] from this
# Digimon's digivolution cards" reaches the SAME engine primitive even
# though it is not gated on the Decode keyword.)
#
# Printed text: "play 1 [BlitzGreymon] and 1 [CresGarurumon] from this
# Digimon's digivolution cards without paying the costs."
#
# DCGO models this with a SelectCardEffect whose `customRootCardList` is
# `card.PermanentOfThisCard().DigivolutionCards` — i.e. it picks a card
# from THIS permanent's source stack, then PlayPermanentCards routes that
# card from `Root.DigivolutionCards` into the controller's battle area.
#
# The DSL has no equivalent step. `select_hand` / `select_trash` /
# `select_opponent_permanent` / `select_own_permanent` cover hand, trash,
# and battle area; there is no `select_self_digivolution_source` /
# `select_source_card` step that binds a card from THIS permanent's
# digivolution stack and feeds it to a `play_*_free` step. Even if a
# bind-step existed, the existing `play_from_hand_free` / `play_from_trash_free`
# verbs require zone-specific HandIndex / TrashIndex bindings — there is
# no `play_from_own_digivolution_free` step that consumes a source-stack
# binding and routes the played card from the source stack.
#
# Closing this gap requires:
#   A. New DSL bind step `select_self_digivolution_source` that binds a
#      `(SourceIndex)` handle inside THIS permanent's digivolution stack,
#      filtered by an inline `card_filter:` (kind/name/level/etc.).
#   B. New DSL play step `play_from_own_digivolution_free` that consumes
#      such a binding, removes the source from the stack, and plays it as
#      a new Permanent with payCost: false.
#   OR equivalently a single combined verb
#   `play_from_own_digivolution_cards: { filter: ..., free: true,
#    optional: false }` that fuses the two.
#
# Engine substrate likely needed: `EffectContext::play_from_own_digivolution_cards(
#   source_perm: PermanentHandle, candidate_filter: ..., pay_cost: bool)` →
# probably (a) walk the carrier's source stack to find candidates, (b)
# install a SelectionKind variant that surfaces the source picks, (c) on
# resolution remove the picked source from the stack and use the existing
# play-as-new-permanent path with payCost overridden.
#
# Also blocks: BT22-015 Decode (Red/Black Lv.3) + Decode (Blue/Yellow Lv.3)
# clauses — sibling gap surface (different trigger, same primitive needed).
#
# Until the gap closes the entire "play 1 [BlitzGreymon] and 1 [CresGarurumon]"
# arm of [All Turns] is OMITTED. Per no-approximations the visible behavior is
# faithful to the cause-IS-own-effect branch (where the outer trigger does
# not fire at all). When the cause is opponent-effect / battle / security,
# DCGO would offer the play-from-stack picks; today the YAML's outer
# replacement clause itself is OMITTED entirely (the second BLOCKED gap
# below makes it impossible to author the second arm meaningfully even if
# this gap closed in isolation — see [G-PLACE-SELF-AT-SECURITY-BOTTOM]).
#
# ─── DSL-GAP — Place self at bottom of own security stack [G-PLACE-SELF-AT-SECURITY-BOTTOM] ─
#
# (NEW — sibling of the existing engine-side "Zone-manipulation: security
# stack operations" gap in `docs/RUST_ENGINE_GAPS.md` which calls out
# `place_security_bottom(player, card)` as missing. EX4-060 surfaces the
# DSL half of that gap PLUS the "place SELF" specialisation.)
#
# Printed text: "Then, place this Digimon at the bottom of your security
# stack face down." DCGO models this with `IPutSecurityPermanent(card,
# CardEffectHashtable, toTop: false).PutSecurity()` — places THIS
# permanent (top card + its sources) at the bottom of the controller's
# security stack face-down.
#
# The DSL has no `place_self_at_security_bottom` step. Existing self-
# disposition primitives:
#   - `place_self_as_delay_option` → places an Option-card self into the
#     battle area as a Delay permanent (BT17-095, P-035 idiom).
#   - `add_this_option_to_hand` → routes an Option from security-resolution
#     staging to hand.
# Neither covers "this Digimon → my security bottom face-down".
#
# A related but distinct existing primitive is
# `place_permanent_bottom_security_and_cancel_replacement` (used by
# BT24-040), which targets ANOTHER permanent (selected via a binding) and
# fires inside a replacement clause, cancelling the replacement so the
# leave does NOT happen. EX4-060's printed text is the OPPOSITE: the leave
# proceeds (the leaving Digimon arrives at the security bottom face-down
# instead of the trash). DCGO does NOT cancel the WhenRemoveField event
# (the IPutSecurityPermanent path uses `toTop: false` after the cards-from-
# stack play resolves; the leaving permanent's destination is rerouted
# from trash to bottom-security).
#
# Closing this gap requires:
#   A. New DSL step `place_self_at_security_bottom: {}` that, when fired
#      from a `kind: replacement` clause whose `replacement_subject` IS
#      this permanent, reroutes the leaving permanent's destination from
#      trash to the controller's security stack bottom face-down.
#   B. Engine substrate: `EffectContext::place_self_at_security_bottom(
#      &mut self)` that (a) consumes the leaving permanent (top + sources),
#      (b) consults the player-scoped `CannotAddSecurityByEffect` modifier
#      gate from the existing engine gap at docs/RUST_ENGINE_GAPS.md
#      (when source_player != target_player), (c) places the bundle at the
#      bottom of the controller's security stack face-down, (d) fires
#      `OnAddToSecurity` if any such observer exists, (e) updates
#      `face_up_security` bookkeeping (the placed bundle is face-down by
#      printed text, so this slot stays unset).
#   C. Replacement-outcome semantics: the leave proceeds (default Proceed),
#      but with destination rerouted. Today's replacement clauses default
#      to Proceed-with-trash; this needs a new Proceed-with-rerouted-zone
#      outcome variant (or the step internally consumes the leave and
#      routes the cards itself, in which case the outer replacement still
#      "proceeds" but the cards are gone-to-security before trash).
#
# Until the gap closes the [All Turns] clause's tail "place this Digimon at
# the bottom of your security stack face down" is unrepresentable. Combined
# with G-PLAY-FROM-OWN-DIGIVOLUTION-SOURCES (the head arm), the entire
# [All Turns] clause is OMITTED from `effects:`. Per no-approximations no
# stub is authored; tests for the [All Turns] clause are #[ignore]'d under
# both gap tags.
#
# Also blocks: any future card whose printed text reads "place this Digimon
# at the bottom of your security stack" or "place this card on top of your
# security stack" as a self-disposition reroute. DCGO grep for
# `IPutSecurityPermanent(card.PermanentOfThisCard()` returns multiple
# entries beyond EX4-060 (notably various endgame-style "place-self-as-
# security" recovery effects).

card: EX4-060
name: "Omnimon Alter-S"
kind: digimon
level: 7
color: [white]
cost: 15
dp: 15000
traits: [Holy Warrior]

# ─── Alt-paths ────────────────────────────────────────────────────────────────
# 1) Standard digivolve: Lv.6 Blue / Cost 6 (per evo_costs in cards.json).
# 2) DNA digivolve: Lv.6 Blue + Lv.6 Red / Cost 0 (per dna_costs in cards.json;
#    DCGO EX4_060.cs lines 27-100 GetJogress).
alt_paths:
  - kind: digivolve
    from: { level_eq: 6, color_is: blue }
    cost: 6

  - kind: dna_digivolve
    materials:
      - { level_eq: 6, color_is: blue }
      - { level_eq: 6, color_is: red }
    cost: 0
    stacks_unsuspended: true

effects:
  # ─── Clause 1 — [When Digivolving] delete-then-return ─────────────────────
  #
  # Printed: "[When Digivolving] Delete 1 of your opponent's Digimon with
  # 8000 DP or less, and return 1 of your opponent's level 6 or higher
  # Digimon to the bottom of its owner's deck."
  #
  # DCGO EX4_060.cs lines 103-213 — single ActivateClass at OnEnterFieldAnyone
  # gated by CanTriggerWhenDigivolving. Both arms are mandatory (isOptional:
  # false). The two selects are sequential within ActivateCoroutine and each
  # is independently gated by HasMatchConditionPermanent — so if only one of
  # the two filters has a legal target, only that arm fires.
  #
  # G-PRED-DP-LTE: literal `dp_lte: 8000` (NOT the aggregate-form
  # `lowest_dp` variant) — this is the simple "DP <= literal" filter, which
  # IS evaluated for permanents (sister cards: BT8-097, BT13-012, BT18-087,
  # BT21-015, BT21-025 all use the same literal form successfully). The
  # `lowest_dp` aggregate variant is the one that's blocked (BT22-015,
  # BT22-013, BT24-017); the literal-DP path is fully wired.
  - when: when_digivolving
    summary: "[When Digivolving] Delete 1 opp Digimon DP<=8000, then return 1 opp Lv>=6 Digimon to bottom of deck"
    process:
      # First arm: mandatory delete of an opp Digimon with DP <= 8000.
      # If no legal target exists, the engine's existential guard skips
      # this select silently (matches DCGO's HasMatchConditionPermanent
      # gate at line 169).
      - select_opponent_permanent:
          bind_as: del_target
          filter:
            all_of:
              - kind: digimon
              - dp_lte: 8000
          prompt: "Delete 1 opponent Digimon with DP 8000 or less"
      - delete_permanent: { target: del_target }
      # Second arm: mandatory return-to-deck-bottom of an opp Digimon
      # with Level >= 6. Independent of the first arm — fires whether or
      # not the first arm found a legal target. DCGO line 191 gates on
      # its OWN HasMatchConditionPermanent.
      - select_opponent_permanent:
          bind_as: return_target
          filter:
            all_of:
              - kind: digimon
              - level_gte: 6
          prompt: "Return 1 opponent Digimon with Level 6+ to the bottom of its owner's deck"
      - return_to_deck:
          target: return_target
          position: bottom

  # ─── BLOCKED Clause 2 — [All Turns] leave-other-than-own-effect ───────────
  #
  # Printed: "[All Turns] When this Digimon would leave the battle area
  # other than by one of your effects, play 1 [BlitzGreymon] and 1
  # [CresGarurumon] from this Digimon's digivolution cards without paying
  # the costs. Then, place this Digimon at the bottom of your security
  # stack face down."
  #
  # BLOCKED on TWO new gaps surfaced by this card:
  #   - G-PLAY-FROM-OWN-DIGIVOLUTION-SOURCES: no DSL verb / step for "play
  #     a named card from THIS permanent's digivolution cards without
  #     paying the cost". The candidate root list (own digivolution
  #     stack), the bind step (no `select_self_digivolution_source`
  #     verb), and the play step (no `play_from_own_digivolution_free`)
  #     are all absent. Sibling gap to BT22-015's
  #     G-DECODE-PLAY-FROM-OWN-DIGIVOLUTION-SOURCES.
  #   - G-PLACE-SELF-AT-SECURITY-BOTTOM: no DSL verb / step for "place this
  #     leaving Digimon at the bottom of own security stack face down" as
  #     a self-disposition reroute on a replacement clause whose subject
  #     IS this permanent. Sibling to the engine-gap "Zone-manipulation:
  #     security stack operations" entry that covers `place_security_bottom`
  #     for ANY card.
  #
  # Per no-approximations, the entire clause is OMITTED. The visible
  # behavior is faithful to the cause-IS-own-effect branch (where the outer
  # trigger does not fire at all per DCGO's `!IsByEffect(IsOwnerEffect)`
  # gate). For all other leave causes (opp effect, battle, security check,
  # cost), DCGO would fire the clause and reroute; today the YAML omits
  # the entire clause. Tests for this clause are #[ignore]'d under both
  # gap tags.
  #
  # Authoring stub (commented; uncomment + adjust when both gaps close):
