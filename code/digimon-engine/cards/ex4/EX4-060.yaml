# EX4-060 Omnimon Alter-S — Digimon, Lv.7, White, DP 15000, Cost 15.
# Traits: Holy Warrior.
# Evo: Lv.6 Blue / Cost 6
# DNA Digivolve: Lv.6 Blue + Lv.6 Red / Cost 0
#
# Printed card text (data/cards.json — verbatim):
#
#   [When Digivolving] Delete 1 of your opponent's Digimon with 8000 DP or
#     less, and return 1 of your opponent's level 6 or higher Digimon to the
#     bottom of its owner's deck.
#   [All Turns] When this Digimon would leave the battle area other than by
#     one of your effects, play 1 [BlitzGreymon] and 1 [CresGarurumon] from
#     this Digimon's digivolution cards without paying the costs. Then, place
#     this Digimon at the bottom of your security stack face down.
#
# Inherited / Security: (none)
#
# DCGO C# reference:
#   DCGO/Assets/Scripts/CardEffect/EX4/White/EX4_060.cs
#
# ─── Source-priority cross-check (printed text + RULES_CONTEXT.md > DCGO) ───
#
# Printed text governs. DCGO matches the printed text on every clause:
#
# Block 1 (DCGO None timing) — AddJogressConditionClass:
#   - PermanentCondition1: Lv.6 + Blue
#   - PermanentCondition2: Lv.6 + Red
#   - cost: 0
#   Authored as `kind: dna_digivolve` alt-path with `level_eq: 6 + color_is`
#   filters and `stacks_unsuspended: true` (DNA-digivolve convention; mirrors
#   BT17-078, BT22-015).
#
# Block 2 (DCGO OnEnterFieldAnyone, gated by CanTriggerWhenDigivolving) —
#   ActivateClass with isOptional: false ("delete 1 of your opponent's
#   Digimon with 8000 DP or less, and return 1 of your opponent's level 6 or
#   higher Digimon" — printed text has no "may"). Body is two SEQUENTIAL
#   SelectPermanentEffect calls within the same ActivateCoroutine:
#     - First select: opp Digimon with DP <= 8000, mode Destroy, maxCount 1,
#       canNoSelect: false (mandatory if a legal target exists).
#     - Second select: opp Digimon with Level >= 6 (and TopCard.HasLevel),
#       mode PutLibraryBottom, maxCount 1, canNoSelect: false.
#   The two selects run independently — each is gated by its own
#   HasMatchConditionPermanent check, so if the field has only an 8000-DP
#   target the delete fires and the bottom-deck silently no-ops, and vice
#   versa.
#
# Block 3 (DCGO WhenRemoveField) — ActivateClass with hash
#   "PlayAndPutSecurity_EX4_060". CanUseCondition gates:
#     - IsExistOnBattleArea(card)
#     - CanTriggerWhenRemoveField(hashtable, card)
#     - !IsByEffect(hashtable, IsOwnerEffect(...)) — "other than by one of
#       your effects"
#   Body:
#     1. SelectCardEffect over THIS permanent's `DigivolutionCards` list,
#        filtered by `CardNames.Contains("BlitzGreymon")` AND
#        `CanPlayAsNewPermanent(payCost: false)`. canNoSelect: () => false.
#     2. SelectCardEffect over THIS permanent's `DigivolutionCards` list,
#        filtered by `CardNames.Contains("CresGarurumon")` AND
#        `CanPlayAsNewPermanent(payCost: false)`. canNoSelect: () => false.
#     3. PlayPermanentCards(selectedCards, payCost: false, isTapped: false,
#        root: DigivolutionCards, activateETB: true) — plays the picked
#        cards without paying the costs.
#     4. If THIS card is still on the battle area, IPutSecurityPermanent
#        with toTop: false → places the leaving Digimon face-down on the
#        bottom of its controller's security stack.
#   `isOptional` flag: this is a forced replacement-style trigger fired on
#   "would leave" — DCGO does not show `isOptional: true` on the outer
#   ActivateClass for this clause, and printed text reads "play 1 [X] and
#   1 [Y]" without "you may" — i.e. MANDATORY when triggered. The internal
#   per-card SelectCardEffect with canNoSelect: () => false reinforces
#   this: if a candidate exists, the player MUST pick it. The whole clause
#   only no-fires when the cause IS one of the controller's own effects
#   (the "other than by one of your effects" gate).
#
# ─── Implementation status (faithfulness diff) ───────────────────────────────
#
# | Card-text element                                                | Status |
# |------------------------------------------------------------------|--------|
# | Standard digivolve Lv.6 Blue / Cost 6                             | IMPLEMENTED (alt_paths kind: digivolve) |
# | DNA digivolve Lv.6 Blue + Lv.6 Red / Cost 0                       | IMPLEMENTED (alt_paths kind: dna_digivolve) |
# | [When Digivolving] Delete 1 opp Digimon DP <= 8000                | IMPLEMENTED (select_opponent_permanent dp_lte: 8000 + delete_permanent) |
# | [When Digivolving] Return 1 opp Digimon Lv >= 6 to deck bottom    | IMPLEMENTED (select_opponent_permanent level_gte: 6 + return_to_deck position: bottom) |
# | [All Turns] On leave-other-than-own-effect, play BlitzGreymon + CresGarurumon from own digivolution cards free | IMPLEMENTED via select_material + play_from_materials |
# | [All Turns] Then, place this Digimon at the bottom of own security stack face down | IMPLEMENTED via replacement security placement helper |
#
# ─── DSL-GAP — Play card from own digivolution sources [G-PLAY-FROM-OWN-DIGIVOLUTION-SOURCES] ─
# Closed 2026-05-08:
#   - Source plays use sequential `select_material` + `play_from_materials`
#     steps. Each pick is surfaced through `pending_selection`.
#   - The self-security tail uses
#     `place_permanent_on_security_and_handle_replacement` targeting
#     `replacement_subject` with `position: bottom` and `face_up: false`.
#   - Verification: `cargo test --manifest-path code/digimon-engine/Cargo.toml --test cards_behavioral -- ex4_060`.

card: EX4-060
name: "Omnimon Alter-S"
kind: digimon
level: 7
color: [white]
cost: 15
dp: 15000
traits: [Holy Warrior]

# ─── Alt-paths ────────────────────────────────────────────────────────────────
# 1) Standard digivolve: Lv.6 Blue / Cost 6 (per evo_costs in cards.json).
# 2) DNA digivolve: Lv.6 Blue + Lv.6 Red / Cost 0 (per dna_costs in cards.json;
#    DCGO EX4_060.cs lines 27-100 GetJogress).
alt_paths:
  - kind: digivolve
    from: { level_eq: 6, color_is: blue }
    cost: 6

  - kind: dna_digivolve
    materials:
      - { level_eq: 6, color_is: blue }
      - { level_eq: 6, color_is: red }
    cost: 0
    stacks_unsuspended: true

effects:
  # ─── Clause 1 — [When Digivolving] delete-then-return ─────────────────────
  #
  # Printed: "[When Digivolving] Delete 1 of your opponent's Digimon with
  # 8000 DP or less, and return 1 of your opponent's level 6 or higher
  # Digimon to the bottom of its owner's deck."
  #
  # DCGO EX4_060.cs lines 103-213 — single ActivateClass at OnEnterFieldAnyone
  # gated by CanTriggerWhenDigivolving. Both arms are mandatory (isOptional:
  # false). The two selects are sequential within ActivateCoroutine and each
  # is independently gated by HasMatchConditionPermanent — so if only one of
  # the two filters has a legal target, only that arm fires.
  #
  # G-PRED-DP-LTE: literal `dp_lte: 8000` (NOT the aggregate-form
  # `lowest_dp` variant) — this is the simple "DP <= literal" filter, which
  # IS evaluated for permanents (sister cards: BT8-097, BT13-012, BT18-087,
  # BT21-015, BT21-025 all use the same literal form successfully). The
  # `lowest_dp` aggregate variant is the one that's blocked (BT22-015,
  # BT22-013, BT24-017); the literal-DP path is fully wired.
  - when: when_digivolving
    summary: "[When Digivolving] Delete 1 opp Digimon DP<=8000, then return 1 opp Lv>=6 Digimon to bottom of deck"
    process:
      # First arm: mandatory delete of an opp Digimon with DP <= 8000.
      # If no legal target exists, the engine's existential guard skips
      # this select silently (matches DCGO's HasMatchConditionPermanent
      # gate at line 169).
      - select_opponent_permanent:
          bind_as: del_target
          filter:
            all_of:
              - kind: digimon
              - dp_lte: 8000
          prompt: "Delete 1 opponent Digimon with DP 8000 or less"
      - delete_permanent: { target: del_target }
      # Second arm: mandatory return-to-deck-bottom of an opp Digimon
      # with Level >= 6. Independent of the first arm — fires whether or
      # not the first arm found a legal target. DCGO line 191 gates on
      # its OWN HasMatchConditionPermanent.
      - select_opponent_permanent:
          bind_as: return_target
          filter:
            all_of:
              - kind: digimon
              - level_gte: 6
          prompt: "Return 1 opponent Digimon with Level 6+ to the bottom of its owner's deck"
      - return_to_deck:
          target: return_target
          position: bottom

  # ─── Clause 2 — [All Turns] leave-other-than-own-effect ───────────────────
  #
  # Printed: "[All Turns] When this Digimon would leave the battle area
  # other than by one of your effects, play 1 [BlitzGreymon] and 1
  # [CresGarurumon] from this Digimon's digivolution cards without paying
  # the costs. Then, place this Digimon at the bottom of your security
  # stack face down."
  #
  # Implemented 2026-05-08. DCGO EX4_060.cs selects BlitzGreymon, then
  # CresGarurumon, from this permanent's DigivolutionCards and plays the
  # selected cards free before `IPutSecurityPermanent(... toTop:false)`.
  # The Rust DSL mirrors that with sequential `select_material` steps, then
  # consumes the active replacement by placing `replacement_subject` at the
  # bottom of security face-down.
  - kind: replacement
    trigger: when_would_leave_battle_area
    active_when:
      none_of:
        - replacement_cause: own_effect
    summary: "[All Turns] On leave-other-than-own-effect, play BlitzGreymon + CresGarurumon from own digivolution cards free; then place self at security bottom face down"
    process:
      - select_material:
          of_permanent: replacement_subject
          bind_as: blitz_source
          filter:
            all_of:
              - kind: digimon
              - name_contains: "BlitzGreymon"
          prompt: "Select 1 [BlitzGreymon] from this Digimon's digivolution cards to play"
      - play_from_materials:
          target: replacement_subject
          source_index: blitz_source
          cost_delta: free
      - select_material:
          of_permanent: replacement_subject
          bind_as: cres_source
          filter:
            all_of:
              - kind: digimon
              - name_contains: "CresGarurumon"
          prompt: "Select 1 [CresGarurumon] from this Digimon's digivolution cards to play"
      - play_from_materials:
          target: replacement_subject
          source_index: cres_source
          cost_delta: free
      - place_on_security:
          source: { permanent: replacement_subject }
          of: you
          position: bottom
          face_up: false
          disposition: handle
