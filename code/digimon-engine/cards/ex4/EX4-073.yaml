# EX4-073 Omnimon Alter-B — Digimon, Lv.7, Black, DP 15000, Cost 15.
# Traits: Holy Warrior. Attribute: Virus.
# Evo: Lv.6 Black / Cost 5
# Special evo (xros_req): Lv.7 w/[Omnimon] in name / Cost 2
#
# Printed card text (data/cards.json — verbatim):
#
#   [When Digivolving] ＜De-Digivolve 3＞ 1 of your opponent's Digimon. (Trash up
#     to 3 cards from the top. You can't trash past level 3 cards.) Then, delete
#     up to 6 play cost's total worth of their Digimon.
#   [When Attacking] By trashing up to 3 level 6 or higher cards in this
#     Digimon's digivolution cards, for each card trashed, activate the effect
#     below. Then, if you trashed 3 cards, trash the top 2 cards of your
#     opponent's security stack.
#   ・Delete 1 of your opponent's Digimon or Tamers with the lowest play cost.
#
# Inherited / Security: (none)
#
# DCGO C# reference:
#   DCGO/Assets/Scripts/CardEffect/EX4/Black/EX4_073.cs
#
# ─── Source-priority cross-check (printed text + RULES_CONTEXT.md > DCGO) ───
#
# Printed text governs. DCGO matches the printed text on every clause:
#
# Block A (DCGO None timing) — AddSelfDigivolutionRequirementStaticEffect:
#   - PermanentCondition: top has [Omnimon] in name AND HasLevel AND Level == 7
#   - digivolutionCost: 2, ignoreDigivolutionRequirement: false
#   Authored as `kind: digivolve` alt-path with `level_eq: 7` + `name_contains:
#   Omnimon` filter and `cost: 2` (matches xros_req printed text).
#
# Block B (DCGO OnEnterFieldAnyone, gated by CanTriggerWhenDigivolving) —
#   ActivateClass at OnEnterFieldAnyone with isOptional: false ("Then, delete
#   up to 6 play cost's total worth" — printed text says "delete up to" so the
#   second arm is OPTIONAL in the picks-zero sense even though the outer
#   ActivateClass is mandatory). DCGO body:
#     - First select: opp Digimon, mode Custom (de-digivolve coroutine),
#       maxCount Min(1, candidates), canNoSelect: false. Body = IDegeneration
#       3 (with stop-at-Lv3 baked into IDegeneration).
#     - Second select: opp Digimon with HasPlayCost AND TopCard.GetCostItself
#       <= 6, mode Destroy, multi-pick with canEndSelectCondition enforcing
#       running play_cost sum <= 6. canEndNotMax: true (player can stop early
#       below max). canNoSelect: false BUT the canEndNotMax+running-sum
#       semantics let the player pick zero through canEndSelect. Each
#       candidate's GetCostItself <= 6 is a per-card cap (no single Digimon
#       costing more than 6 is selectable at all).
#
# Block C (DCGO OnAllyAttack) — ActivateClass with isOptional: true.
#   Body:
#     - SelectCardEffect over THIS permanent's `DigivolutionCards` filtered
#       by `cardSource.Level >= 6 AND HasLevel`. canNoSelect: () => true,
#       canEndNotMax: true. maxCount Min(3, candidates).
#     - For each card picked: TrashDigivolutionCards.
#     - For each trashed card (loop trashCount times): SelectPermanentEffect
#       over opp permanents matching `IsMinCost(perm, Enemy, false)` (the
#       `false` means filter to BOTH Digimon AND Tamers, lowest play cost).
#       maxCount Min(1, candidates), canNoSelect: false. Mode Destroy.
#     - If trashCount == 3: IDestroySecurity(opp, 2, fromTop: true).
#
# ─── Implementation status (faithfulness diff) ───────────────────────────────
#
# | Card-text element                                                            | Status |
# |------------------------------------------------------------------------------|--------|
# | Standard digivolve Lv.6 Black / Cost 5                                       | IMPLEMENTED (alt_paths kind: digivolve) |
# | Special digivolve Lv.7 w/[Omnimon] in name / Cost 2                          | IMPLEMENTED (alt_paths kind: digivolve, ignore_requirements: false matches DCGO) |
# | [When Digivolving] <De-Digivolve 3> 1 opp Digimon                            | IMPLEMENTED (select + de_digivolve amount:3 stop_at_level:3) |
# | [When Digivolving] Then, delete up to 6 play cost's total worth opp Digimon  | BLOCKED — G-MULTI-SELECT-OPP-PLAY-COST-SUM (NEW) |
# | [When Attacking] Trash up to 3 own Lv≥6 digivolution sources                 | BLOCKED — G-DSL-SELECT-OWN-SOURCES-FILTER (NEW) |
# | [When Attacking] Per trash: delete 1 opp Digimon/Tamer with lowest play cost | BLOCKED — G-PLAY-COST-AGGREGATE (sibling of G-PLAY-COST-LTE; aggregate "lowest play cost" predicate missing — same gap surfaced by BT9-112 clause C, which uses a per-card raw_rust escape hatch we are not authorising for this card) |
# | [When Attacking] If trashed 3, trash top 2 opp security                      | IMPLEMENTED form available (lose_security with formula) but blocked by trash-count binding from sources |
#
# ─── DSL-GAP — Multi-select of opponent permanents by running PLAY-COST sum cap [G-MULTI-SELECT-OPP-PLAY-COST-SUM] ─
#
# (NEW — sibling of `G-MULTI-SELECT-OPP-DP-SUM` already tracked in
# qa/archetype-qa/engine-gaps.md. The existing engine API
# `EffectContext::select_opponent_permanents_by_dp_budget` and the DSL step
# `select_opponent_dp_budget` cap by DP. EX4-073's printed text caps the
# running sum by PLAY COST, not DP.)
#
# Printed text: "delete up to 6 play cost's total worth of their Digimon"
#
# DCGO models this with a SelectPermanentEffect whose
# `canTargetCondition_ByPreSelecetedList` enforces `sumCost + permanent.TopCard
# .GetCostItself <= 6` and `canEndSelectCondition` enforces the same on the
# completed pick set. Each candidate is also pre-filtered by
# `permanent.TopCard.GetCostItself <= 6` (no single Digimon over the cap).
#
# The DSL has only `select_opponent_dp_budget` (lowers to
# `EffectContext::select_opponent_permanents_by_dp_budget`). There is no
# `select_opponent_play_cost_budget` step or
# `select_opponent_permanents_by_play_cost_budget` engine API. The
# action-mask + tensor wiring for `SelectionKind::DpBudget` keys off
# `effective_dp(handle)` (selection.rs:144); a play-cost sibling needs its
# own SelectionKind variant (e.g. `PlayCostBudget { remaining: i32, picked: u8 }`)
# that keys off `card_data.play_cost`, plus mirrored mask/tensor handling and
# DSL parsing.
#
# Closing this gap requires:
#   A. New engine API `EffectContext::select_opponent_permanents_by_play_cost_budget(
#      prompt, cost_budget, min_picks, candidate_filter, callback)`.
#   B. New SelectionKind variant `PlayCostBudget { remaining: i32, picked: u8 }`
#      mirroring `DpBudget` semantics but reading `card_data.play_cost`.
#   C. New DSL step `select_opponent_play_cost_budget: { play_cost_budget: 6,
#      min_picks: 0, prompt: "...", then: [...] }` that lowers to the new API.
#   D. Action-space mask + tensor wiring updates analogous to the existing
#      `DpBudget` paths in `code/digimon-engine/src/action/` and `tensor.rs`.
#
# Until the gap closes the entire "delete up to 6 play cost's total worth of
# their Digimon" arm of [When Digivolving] is OMITTED. Per no-approximations
# (and consistent with G-DP-BUDGET-MULTI-SELECT BLOCKED handling in
# qa/dsl-vocab-gaps.md) no raw_rust escape hatch is authorised here — the
# clause is cleanly BLOCKED until the engine substrate lands.
#
# Tests for this clause are #[ignore]'d under G-MULTI-SELECT-OPP-PLAY-COST-SUM.
#
# ─── DSL-GAP — Filter on select_own_sources [G-DSL-SELECT-OWN-SOURCES-FILTER] ─
#
# (NEW — surfaces a missing filter clause on the existing
# `select_own_sources` DSL verb. The verb itself was added when
# G-ROCKS-SOURCE-SELECTION-DSL closed; the underlying engine API
# `EffectContext::select_own_sources` already accepts a `candidate_filter`
# closure but the DSL `SelectOwnSourcesArgs` exposes only `min`/`max`/
# `bind_as`/`prompt`/`then` — no `filter:` field. The lowering at
# `code/digimon-engine/src/dsl_cards/step/selections.rs:1330` passes
# `|_game, _source| true` as the accept-all candidate filter.)
#
# Printed text: "By trashing up to 3 level 6 or higher cards in this Digimon's
# digivolution cards"
#
# DCGO models this with a SelectCardEffect whose CanSelectCardCondition is
# `cardSource.Level >= 6 AND HasLevel AND !cardSource.CanNotTrashFromDigivolutionCards
# (activateClass)`. The level filter is per-source and authoritative for
# eligibility (you can't pick a Lv3-or-lower source).
#
# Closing this gap requires:
#   A. Add `filter: PredicateSpec` (or `filter: CardPredicateSpec`) to
#      `SelectOwnSourcesArgs` in `code/digimon-dsl/src/step.rs`.
#   B. Compile path: thread the parsed predicate through
#      `CompiledStep::SelectOwnSources` (currently doesn't carry a filter
#      payload).
#   C. Lowering: `install_select_own_sources` (selections.rs:1330) builds a
#      `move |game, source_handle| { eval_card_predicate_against_source(...) }`
#      closure from the compiled filter and passes it to
#      `ctx.select_own_sources` instead of accept-all.
#   D. Predicate evaluator: a small `eval_card_predicate_against_source(game,
#      source_handle, &predicate)` function that mirrors `eval_card_fields`
#      for non-permanent CardSource references (level / color / kind / name
#      filters all read from the underlying CardData on the source stack).
#
# Until the gap closes the [When Attacking] outer "trash up to 3 Lv≥6 sources"
# step is unrepresentable in faithful form (an unfiltered `select_own_sources`
# would let the player trash Lv≤5 sources, which the printed text forbids).
# Per no-approximations the entire [When Attacking] clause is OMITTED.
#
# Also blocks: BT5-092 (Omnimon Zwart) "trash 1 Lv6 source from this Digimon"
# and any future Lv-gated source-trash pattern.
#
# Tests for this clause are #[ignore]'d under G-DSL-SELECT-OWN-SOURCES-FILTER
# (and G-PLAY-COST-AGGREGATE — see below — which independently blocks the
# "lowest play cost" inner per-trash effect).
#
# ─── DSL-GAP — Aggregate "lowest play cost" predicate [G-PLAY-COST-AGGREGATE] ─
#
# (NEW — sibling of `G-PLAY-COST-LTE` which closed for the LITERAL form
# `play_cost_lte: <int>` on 2026-05-01. This entry covers the AGGREGATE
# variant analogous to `lowest_dp` / `highest_dp` / `lowest_level`.)
#
# Printed text: "Delete 1 of your opponent's Digimon or Tamers with the lowest
# play cost."
#
# DCGO uses `CardEffectCommons.IsMinCost(perm, owner.Enemy, false)` — a
# board-aggregate filter that returns true iff the candidate's play_cost
# equals the minimum play_cost across all opp battle-area permanents (Digimon
# OR Tamer; the `false` arg includes Tamers in the comparison set).
#
# The DSL `PredicateSpec` exposes `dp_lte`, `dp_gte`, `lowest_dp` (closed
# group) and `play_cost_lte` (closed by P-189). It does not expose
# `lowest_play_cost` / `highest_play_cost` aggregate variants — same shape as
# the long-blocked BT9-112 clause C "delete all opp Digimon with the lowest
# play cost" which had to fall back to a per-card raw_rust escape hatch
# (`bt9_112_delete_lowest_cost_digimon`).
#
# Closing this gap requires:
#   A. Add `lowest_play_cost: bool` (and optionally `highest_play_cost: bool`)
#      to `PredicateSpec` in `code/digimon-dsl/src/predicate.rs`. Mirrors the
#      `lowest_dp` / `highest_dp` shape.
#   B. Compile path: thread through `CompiledPredicate` enum.
#   C. Engine evaluator: extend `eval_predicate_with_bindings` /
#      `existential_any` aggregate scan in
#      `code/digimon-engine/src/dsl_cards/predicate.rs` to compute
#      `min_play_cost = filter_set.iter().filter_map(card_data.play_cost).min()`
#      then return `card_data.play_cost == Some(min_play_cost)`.
#
# Until the gap closes the inner "Delete 1 ... with the lowest play cost" arm
# of [When Attacking] is unrepresentable. Combined with
# G-DSL-SELECT-OWN-SOURCES-FILTER (the outer trash-source step) the entire
# [When Attacking] clause is OMITTED.
#
# Per no-approximations no raw_rust hatch is authored; the BT9-112 precedent
# (which has a raw_rust hatch for the same primitive) is grandfathered but
# new authorings should not extend it. When G-PLAY-COST-AGGREGATE closes,
# BT9-112 clause C should also be migrated off raw_rust to the native
# `lowest_play_cost` predicate.
#
# Tests for this clause are #[ignore]'d under G-PLAY-COST-AGGREGATE.

card: EX4-073
name: "Omnimon Alter-B"
kind: digimon
level: 7
color: [black]
cost: 15
dp: 15000
traits: [Holy Warrior]

# ─── Alt-paths ────────────────────────────────────────────────────────────────
# 1) Standard digivolve: Lv.6 Black / Cost 5 (per evo_costs in cards.json).
# 2) Special digivolve: Lv.7 w/[Omnimon] in name / Cost 2 (per xros_req).
#    DCGO: AddSelfDigivolutionRequirementStaticEffect with PermanentCondition
#    `top.ContainsCardName("Omnimon") && top.HasLevel && permanent.Level == 7`,
#    digivolutionCost: 2, ignoreDigivolutionRequirement: false. The
#    `ignoreDigivolutionRequirement: false` arg means this digivolve still
#    obeys other digivolution gates (e.g. CannotDigivolve modifiers); it does
#    NOT mean the digivolution requirement is enforced — it IS the
#    requirement. So we author with the standard `from:` filter (no
#    `ignore_requirements: true`).
alt_paths:
  - kind: digivolve
    from: { level_eq: 6, color_is: black }
    cost: 5

  - kind: digivolve
    from:
      all_of:
        - level_eq: 7
        - name_contains: "Omnimon"
    cost: 2

effects:
  # ─── Clause B (PARTIAL) — [When Digivolving] <De-Digivolve 3> 1 opp Digimon ──
  #
  # Printed: "[When Digivolving] <De-Digivolve 3> 1 of your opponent's Digimon.
  # (Trash up to 3 cards from the top. You can't trash past level 3 cards.)
  # Then, delete up to 6 play cost's total worth of their Digimon."
  #
  # DCGO: single ActivateClass at OnEnterFieldAnyone gated by
  # CanTriggerWhenDigivolving. Two sequential SelectPermanentEffect calls
  # within ActivateCoroutine, each independently gated by
  # HasMatchConditionPermanent — printed text grammatically reads as one
  # mandatory sentence ("Then, ...") but each arm independently no-ops if no
  # legal target exists.
  #
  # Arm 1 (IMPLEMENTED): mandatory <De-Digivolve 3> on 1 opp Digimon.
  # Standard DSL pattern: select_opponent_permanent + de_digivolve target with
  # amount: 3 stop_at_level: 3. The "stop at level 3" parenthetical is
  # IDegeneration's built-in floor — the engine `de_digivolve` step takes
  # `stop_at_level: 3` matching DCGO's IDegeneration behavior (BT9-112 uses
  # the same shape with amount: 1).
  #
  # Arm 2 (BLOCKED — G-MULTI-SELECT-OPP-PLAY-COST-SUM): "delete up to 6 play
  # cost's total worth of their Digimon" requires the play-cost-budget
  # multi-select primitive that does not yet exist (only DP-budget exists).
  # The arm is OMITTED rather than approximated. When the gap closes, append
  # the second arm to this clause's process list:
  #
  #   - select_opponent_play_cost_budget:                  # ← BLOCKED
  #       play_cost_budget: 6
  #       min_picks: 0
  #       prompt: "Delete opponent Digimon with total play cost ≤ 6"
  #       # The inner step list of select_opponent_play_cost_budget should
  #       # auto-delete each picked permanent (mirrors existing dp_budget
  #       # behaviour — selection mode is Destroy).
  #
  # Per no-approximations, no single-pick fallback approximation is added
  # (BT17-018 has one but it's grandfathered; new authorings should not
  # extend it).
  - when: when_digivolving
    summary: "[When Digivolving] <De-Digivolve 3> 1 opp Digimon (delete-up-to-6-cost arm BLOCKED on G-MULTI-SELECT-OPP-PLAY-COST-SUM)"
    condition:
      any_permanent:
        of: opponent
        zone: [battle_area]
        kind: digimon
    process:
      # Arm 1: <De-Digivolve 3> on 1 opp Digimon. Mandatory if a legal target
      # exists (DCGO canNoSelect: false, maxCount: Min(1, candidates)).
      - select_opponent_permanent:
          bind_as: dd_target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon — De-Digivolve 3 (trash up to 3 sources, can't trash past Lv3)"
      - de_digivolve:
          target: dd_target
          amount: 3
          stop_at_level: 3
      # Arm 2: BLOCKED — see G-MULTI-SELECT-OPP-PLAY-COST-SUM above.

  # ─── Clause C (BLOCKED) — [When Attacking] trash sources / lowest-cost / sec ─
  #
  # Printed: "[When Attacking] By trashing up to 3 level 6 or higher cards in
  # this Digimon's digivolution cards, for each card trashed, activate the
  # effect below. Then, if you trashed 3 cards, trash the top 2 cards of your
  # opponent's security stack.
  # ・Delete 1 of your opponent's Digimon or Tamers with the lowest play cost."
  #
  # DCGO: ActivateClass at OnAllyAttack with isOptional: true. Three nested
  # operations:
  #   1. SelectCardEffect over THIS permanent's DigivolutionCards filtered by
  #      `Level >= 6 AND HasLevel`, max 3, canNoSelect+canEndNotMax true.
  #      → BLOCKED: G-DSL-SELECT-OWN-SOURCES-FILTER.
  #   2. ITrashDigivolutionCards on selected sources.
  #   3. For each trashed source (1..=trashCount loops):
  #      SelectPermanentEffect over opp permanents matching IsMinCost(perm,
  #      Enemy, false) (Digimon OR Tamer with min play_cost), maxCount
  #      Min(1, candidates), canNoSelect: false.
  #      → BLOCKED: G-PLAY-COST-AGGREGATE (no `lowest_play_cost` predicate).
  #   4. If trashCount == 3: IDestroySecurity(opp, 2, fromTop: true).
  #      → Even if standalone steps existed (lose_security with formula does
  #      lower), the trashCount binding from step 1 isn't surfaced from the
  #      blocked source-select, so the conditional cannot be authored either.
  #
  # The entire clause is OMITTED. Per no-approximations no partial / single-
  # pick / count-only fallback is authored. When all three gaps close, the
  # clause should be authored along these lines (illustrative; subject to
  # final DSL syntax once the gaps close):
  #
  #   - when: when_attacking
  #     optional: true
  #     summary: "[When Attacking] Trash up to 3 Lv≥6 sources; per-trash delete lowest-cost opp permanent; if 3 trashed, trash 2 opp security"
  #     condition:
  #       any_source:                                       # ← may need a new aggregate predicate
  #         of: source
  #         filter: { level_gte: 6 }
  #     process:
  #       - select_own_sources:                             # ← needs G-DSL-SELECT-OWN-SOURCES-FILTER closed
  #           target: source
  #           min: 0
  #           max: 3
  #           filter: { level_gte: 6 }
  #           bind_as: trashed_sources
  #           prompt: "Select up to 3 Lv≥6 digivolution cards to trash"
  #       - trash_selected_sources: { source_refs: trashed_sources }
  #       - for_each:
  #           over: { binding: trashed_sources }            # ← needs for_each over a source_refs binding
  #           bind_as: _ignore
  #           body:
  #             - if:
  #                 condition:
  #                   any_permanent:
  #                     of: opponent
  #                     zone: [battle_area]
  #                     filter: { lowest_play_cost: true }   # ← needs G-PLAY-COST-AGGREGATE closed
  #                 then:
  #                   - select_opponent_permanent:
  #                       bind_as: low_cost
  #                       filter:
  #                         any_of:
  #                           - kind: digimon
  #                           - kind: tamer
  #                         all_of:
  #                           - lowest_play_cost: true
  #                       prompt: "Delete 1 opponent Digimon/Tamer with the lowest play cost"
  #                   - delete_permanent: { target: low_cost }
  #       - if:
  #           condition:
  #             count_eq:
  #               binding: trashed_sources
  #               n: 3
  #           then:
  #             - lose_security:
  #                 of: opponent
  #                 amount: 2
