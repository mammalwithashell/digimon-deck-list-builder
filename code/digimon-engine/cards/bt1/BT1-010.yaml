card: BT1-010
name: Agumon
kind: digimon
level: 3
color: [red]
cost: 3
dp: 2000
traits: [Reptile]
form: Rookie
attribute: Vaccine

effects:
  - text: "[On Play] Reveal the top 5 cards of your deck. Add 1 Tamer card among them to your hand. Place the rest at the bottom of the deck in any order."
    when: on_play
    summary: "[On Play] Reveal top 5; add 1 Tamer to hand; place rest at bottom of deck"
    process:
      - reveal_top_deck: { of: you, count: 5, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          buckets:
            - bind_as: tamer_pick
              min: 1
              max: 1
              filter: { kind: tamer }
          prompt: "Add 1 Tamer card to your hand"
      - add_to_hand_from_reveal: { of: you, card: tamer_pick }
      - place_remainder_on_deck: { of: you, position: bottom }
