card: BT1-110
name: Flower Cannon
kind: option
color: [green]
cost: 2

effects:
  - text: "[Main] Suspend 1 of your opponent's Digimon."
    when: main_from_hand
    summary: "[Main] Suspend 1 of your opponent's Digimon"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to suspend"
      - suspend: { target: target }

  - text: "[Security] Suspend all of your opponent's Digimon without ＜Blocker＞."
    when: on_security
    summary: "[Security] Suspend all of your opponent's Digimon without <Blocker>"
    process:
      - for_each:
          over:
            of: opponent
            zone: [battle_area]
            kind: digimon
            not: { has_keyword: Blocker }
          bind_as: opp_digimon
          body:
            - suspend: { target: opp_digimon }
