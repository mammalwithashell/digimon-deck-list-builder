card: BT1-103
name: Testament
kind: option
color: [yellow]
cost: 3

effects:
  - text: "[Main] Until the end of your opponent's next turn, 1 of your Digimon gains ＜Blocker＞ (This Digimon can block in the blocker timing.)."
    when: main_from_hand
    summary: "[Main] Until end of opponent's next turn, 1 of your Digimon gains <Blocker>"
    process:
      - select_own_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 of your Digimon to gain <Blocker> until the end of your opponent's next turn"
      - grant_keyword:
          target: target
          keyword: Blocker
          expiry: end_of_opponents_turn

  - text: "[Security] ＜Draw 1＞ (Draw 1 card from your deck.) Then, add this card to your hand."
    when: on_security
    summary: "[Security] Draw 1, then add this card to your hand"
    process:
      - draw: { of: you, count: 1 }
      - add_this_option_to_hand: {}
