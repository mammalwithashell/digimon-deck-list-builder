card: BT1-062
name: SlashAngemon
kind: digimon
level: 6
color: [yellow]
cost: 11
dp: 8000
form: Mega
attribute: Vaccine
traits: [Authority]

effects:
  - text: "[When Digivolving] 1 of your opponent's Digimon gets -8000 DP for the turn."
    when: when_digivolving
    summary: "[When Digivolving] 1 of your opponent's Digimon gets -8000 DP for the turn"
    process:
      - select_opponent_permanent:
          filter: { kind: digimon }
          bind_as: victim
          optional: false
          prompt: "Choose 1 of your opponent's Digimon to get -8000 DP for the turn"
      - add_dp_modifier:
          target: victim
          value: -8000
          expiry: end_of_turn
