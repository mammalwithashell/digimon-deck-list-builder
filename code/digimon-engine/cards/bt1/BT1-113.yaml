card: BT1-113
name: Forbidden Temptation
kind: option
color: [green]
cost: 4

effects:
  - text: "[Main] Until the end of your opponent's next turn, 1 of your opponent's Digimon can't attack or block."
    when: main_from_hand
    summary: "[Main] Until end of opponent's next turn, 1 of your opponent's Digimon can't attack or block"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon that can't attack or block"
      - add_modifier:
          target: target
          modifier: CannotAttack
          value: 0
          expiry: end_of_opponents_turn
      - add_modifier:
          target: target
          modifier: CannotBlock
          value: 0
          expiry: end_of_opponents_turn

  - text: "[Security] Your opponent's Digimon don't unsuspend during their next unsuspend phase."
    when: on_security
    summary: "[Security] Opponent's Digimon don't unsuspend during their next unsuspend phase"
    process:
      - add_player_modifier:
          target_player: opponent
          modifier: CannotUnsuspendInUnsuspendPhase
          value: 1
          expiry: end_of_opponents_next_turn
