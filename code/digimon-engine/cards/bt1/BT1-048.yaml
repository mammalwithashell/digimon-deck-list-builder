      - reveal_search:
          of: you
          count: 4
          buckets:
            - optional: false
              filter:
                all_of:
                  - kind: tamer
                  - color_is: yellow
              to: hand
              max: 4
              prompt: "Add all yellow Tamer cards to your hand"
          remainder: bottom
