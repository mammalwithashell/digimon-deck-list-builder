card: BT1-082
name: Rosemon
kind: digimon
level: 6
color: [green]
cost: 12
dp: 11000
form: Mega
attribute: Data
traits: [Fairy]

effects:
  - text: "[Opponent's Turn] When an opponent's Digimon attacks a player, if this Digimon is suspended, suspend 1 of your opponent's Digimon."
    when: on_opponent_attack
    active_when: { opponents_turn: true }
    trigger_if: { event_target_is_player: true }
    condition: { not: { source_is_unsuspended: true } }
    summary: "[Opponent's Turn] When an opponent's Digimon attacks a player, if this Digimon is suspended, suspend 1 of your opponent's Digimon"
    process:
      - select_opponent_permanent:
          bind_as: victim
          optional: false
          filter: { kind: digimon }
          prompt: "Suspend 1 of your opponent's Digimon"
      - suspend: { target: victim }
