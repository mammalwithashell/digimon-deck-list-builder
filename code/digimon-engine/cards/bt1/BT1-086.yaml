card: BT1-086
name: Matt Ishida
kind: tamer
color: [blue]
cost: 4

effects:
  - text: "[Start of Your Turn] If you have 2 or less memory, set it to 3."
    when: start_of_your_turn
    summary: "[Start of Your Turn] If you have 2 or less memory, set it to 3"
    condition: { memory_lte: 2 }
    process:
      - set_memory: 3

  - text: "[Your Turn] When you play a blue Digimon, you can suspend this Tamer to trash the bottom digivolution card of 1 of your opponent's Digimon."
    when: on_ally_played
    optional: true
    active_when: { your_turn: true }
    trigger_if:
      all_of:
        - event_target_owner: you
        - any_of:
            - event_card_kind: digimon
            - event_card_kind: token
        - event_card_color_has: [blue]
    condition:
      source_is_unsuspended: true
    summary: "[Your Turn] When you play a blue Digimon, you may suspend this Tamer to trash the bottom digivolution card of 1 of your opponent's Digimon"
    process:
      - activation_cost: { suspend_self: true }
      - select_opponent_permanent:
          bind_as: victim
          optional: false
          filter: { kind: digimon }
          prompt: "Trash the bottom digivolution card of 1 of your opponent's Digimon"
      - trash_bottom_sources: { target: victim, count: 1 }

  - text: "[Security] Play this card without paying the cost."
    when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
