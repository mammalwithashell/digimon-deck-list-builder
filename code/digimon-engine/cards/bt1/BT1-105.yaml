card: BT1-105
name: Blast Fire
kind: option
color: [yellow]
cost: 4

effects:
  - text: "[Main] Change the original DP of 1 of your opponent's Digimon to 3000 until the end of your opponent's next turn."
    when: main_from_hand
    summary: "[Main] Change the original DP of 1 opponent Digimon to 3000 until end of opponent's next turn"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to change its original DP to 3000"
      - add_modifier:
          target: target
          modifier: ChangeOriginDP
          value: 0
          payload: { dp: 3000 }
          expiry: end_of_opponents_turn
