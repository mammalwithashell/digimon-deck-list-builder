card: BT1-106
name: "Symphony No.1 <Polyphony>"
kind: option
color: [yellow]
cost: 5

effects:
  - text: "[Main] 1 of your opponent's Digimon gets -7000 DP for the turn."
    when: main_from_hand
    summary: "[Main] 1 of your opponent's Digimon gets -7000 DP for the turn"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to get -7000 DP for the turn"
      - add_dp_modifier:
          target: target
          value: -7000
          expiry: end_of_turn
