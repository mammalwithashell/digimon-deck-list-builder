card: BT1-089
name: Mimi Tachikawa
kind: tamer
color: [green]
cost: 4

effects:
  - text: "[Start of Your Turn] If you have 2 or less memory, set it to 3."
    when: start_of_your_turn
    summary: "[Start of Your Turn] If you have 2 or less memory, set it to 3"
    condition: { memory_lte: 2 }
    process:
      - set_memory: 3

  - text: "[Main] If you have a level 5 or higher green Digimon in play, by suspending this Tamer, hatch 1 Digi-Egg card to an empty space in your breeding area, or move 1 level 3 or higher Digimon from your breeding area to your battle area."
    when: main_on_field
    condition:
      all_of:
        - source_is_unsuspended: true
        - any_permanent:
            of: you
            zone: [battle_area]
            kind: digimon
            color_is: green
            level_gte: 5
        - any_of:
            - can_hatch: you
            - any_permanent:
                of: you
                zone: [breeding]
                kind: digimon
                level_gte: 3
                can_move_from_breeding_by_effect: true
    summary: "[Main] If you have a Lv.5+ green Digimon in play, suspend this Tamer to hatch or move a Lv.3+ Digimon from breeding"
    process:
      - activation_cost: { suspend_self: true }
      - if:
          condition: { can_hatch: you }
          then:
            - hatch: { of: you }
          else:
            - if:
                condition:
                  any_permanent:
                    of: you
                    zone: [breeding]
                    kind: digimon
                    level_gte: 3
                    can_move_from_breeding_by_effect: true
                then:
                  - move_from_breeding: { of: you }

  - text: "[Security] Play this card without paying the cost."
    when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
