card: BT1-094
name: Oblivion Bird
kind: option
color: [red]
cost: 5

effects:
  - text: "[Main] Delete 1 of your opponent's Digimon with ＜Blocker＞."
    when: main_from_hand
    summary: "[Main] Delete 1 of your opponent's Digimon with <Blocker>"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter:
            all_of:
              - kind: digimon
              - has_keyword: Blocker
          prompt: "Delete 1 of your opponent's Digimon with <Blocker>"
      - delete_permanent: { target: target }

  - text: "[Security] Activate this card's [Main] effects."
    when: on_security
    summary: "[Security] Activate this card's [Main] effects"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter:
            all_of:
              - kind: digimon
              - has_keyword: Blocker
          prompt: "Delete 1 of your opponent's Digimon with <Blocker>"
      - delete_permanent: { target: target }
