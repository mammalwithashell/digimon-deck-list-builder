    process:
      - select_opponent_permanent:
          filter: { kind: digimon }
          bind_as: victim
          optional: false
          prompt: "Choose 1 of your opponent's Digimon to get -3000 DP for the turn"
      - add_dp_modifier:
          target: victim
          value: -3000
          expiry: end_of_turn
