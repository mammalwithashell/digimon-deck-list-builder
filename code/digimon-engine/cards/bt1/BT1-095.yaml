card: BT1-095
name: Brave Shield
kind: option
color: [red]
cost: 5

effects:
  - text: "[Main] Unsuspend 1 of your Digimon. Until the end of your opponent's next turn, that Digimon gains ＜Blocker＞ (This Digimon can block in the blocker timing.)"
    when: main_from_hand
    summary: "[Main] Unsuspend 1 of your Digimon; until end of opponent's next turn, it gains <Blocker>"
    process:
      - select_own_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "Unsuspend 1 of your Digimon and grant it <Blocker>"
      - unsuspend: { target: target }
      - grant_keyword:
          target: target
          keyword: Blocker
          expiry: end_of_opponents_turn

  - text: "[Security] Unsuspend 1 of your Digimon. That Digimon gains ＜Blocker＞ for the turn. (This Digimon can block in the blocker timing..)"
    when: on_security
    summary: "[Security] Unsuspend 1 of your Digimon; it gains <Blocker> for the turn"
    process:
      - select_own_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "Unsuspend 1 of your Digimon and grant it <Blocker> for the turn"
      - unsuspend: { target: target }
      - grant_keyword:
          target: target
          keyword: Blocker
          expiry: end_of_turn
