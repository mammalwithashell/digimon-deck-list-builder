card: BT1-108
name: Horn Buster
kind: option
color: [green]
cost: 1

effects:
  - text: "[Main] 1 of your Digimon gets +3000 DP for the turn."
    when: main_from_hand
    summary: "[Main] 1 of your Digimon gets +3000 DP for the turn"
    process:
      - select_own_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 of your Digimon to get +3000 DP for the turn"
      - add_dp_modifier:
          target: target
          value: 3000
          expiry: end_of_turn

  - text: "[Security] Suspend 1 of your opponent's Digimon. Then add this card to its owner's hand."
    when: on_security
    summary: "[Security] Suspend 1 of your opponent's Digimon, then add this card to its owner's hand"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to suspend"
      - suspend: { target: target }
      - add_this_option_to_hand: {}
