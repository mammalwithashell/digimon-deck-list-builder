card: BT1-054
name: Liamon
kind: digimon
level: 4
color: [yellow]
cost: 4
dp: 4000
form: Champion
attribute: Vaccine
traits: [Holy Beast]

effects:
  - text: "[When Attacking] If you have 3 or more memory, 1 of your opponent's Digimon gets -2000 DP for the turn."
    when: when_attacking
    condition: { memory_gte: 3 }
    summary: "[When Attacking] If you have 3 or more memory, 1 of your opponent's Digimon gets -2000 DP for the turn"
    process:
      - select_opponent_permanent:
          filter: { kind: digimon }
          bind_as: victim
          optional: false
          prompt: "Choose 1 of your opponent's Digimon to get -2000 DP for the turn"
      - add_dp_modifier:
          target: victim
          value: -2000
          expiry: end_of_turn
