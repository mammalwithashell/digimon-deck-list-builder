traits: [Fairy]

effects:
  - text: "[When Attacking] Suspend 1 of your opponent's Digimon without ＜Blocker＞."
    scope: inherited
    when: when_attacking
    summary: "[When Attacking] Suspend 1 of your opponent's Digimon without <Blocker>"
    process:
      - select_opponent_permanent:
          bind_as: victim
          optional: false
          filter:
            all_of:
              - kind: digimon
              - not: { has_keyword: Blocker }
          prompt: "Suspend 1 of your opponent's Digimon without <Blocker>"
      - suspend: { target: victim }
