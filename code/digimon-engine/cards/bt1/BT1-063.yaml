      - recover: { of: you, count: 1 }

  - text: "[Your Turn] While you have 3 or more security cards, this Digimon gains ＜Security A. +1＞ (This Digimon checks 1 additional security card.)"
    kind: aura
    active_when:
      all_of:
        - your_turn: true
        - security_count_gte: 3
    target: { is_source_permanent: true }
    grant_keyword: { keyword: SecurityAttackPlus, value: 1 }
    summary: "[Your Turn] While you have 3 or more security cards, this Digimon gains <Security A. +1>"
