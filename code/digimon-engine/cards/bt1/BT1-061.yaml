card: BT1-061
name: Mistymon
kind: digimon
level: 5
color: [yellow]
cost: 7
dp: 7000
form: Ultimate
attribute: Virus
traits: [Magic Warrior]

effects:
  - text: "[On Play] 2 of your opponent's Digimon get -3000 DP for the turn."
    when: on_play
    summary: "[On Play] 2 of your opponent's Digimon get -3000 DP for the turn"
    process:
      - select_count_capped_multi:
          of: opponent
          zone: battle_area
          max: 2
          clamp_to_available: true
          optional_zero: false
          filter: { kind: digimon }
          bind_as: victims
          prompt: "Choose 2 of your opponent's Digimon to get -3000 DP for the turn"
      - per_selected:
          selection: victims
          bind_as: victim
          body:
            - add_dp_modifier:
                target: victim
                value: -3000
                expiry: end_of_turn
