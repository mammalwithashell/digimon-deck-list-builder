card: BD02-01
name: Viximon
kind: digi_egg
level: 2
color: [blue]
cost: 0
traits: [Lesser, ALYSION]
form: In-Training

effects:
  - scope: inherited
    text: "[All Turns] [Once Per Turn] When effects trash your opponent's Digimon's digivolution cards, if this Digimon has the [ALYSION] trait, ＜Draw 1＞"
    when: on_digivolution_card_trashed
    once_per_turn: true
    active_when: { all_turns: true }
    trigger_if:
      all_of:
        - any_permanent:
            of: opponent
            zone: [battle_area]
            kind: digimon
            is_event_host: true
        - any_of:
            - event_cause: own_effect
            - event_cause: opponent_effect
            - event_cause: cost
    condition: { trait_has: ALYSION }
    summary: "Inherited [All Turns][OPT] When effects trash opponent's Digimon's digivolution cards, if this Digimon has [ALYSION] trait, Draw 1"
    process:
      - draw: { of: you, count: 1 }
