card: BT5-008
name: Gaossmon
kind: digimon
level: 3
color: [red]
cost: 3
dp: 2000
traits: [Reptile]

# ─── Clause 1: [Your Turn] Your other [Gaossmon] all get +3000 DP ───────────
#
# DCGO (BT5_008.cs): ChangeDPStaticEffect with:
#   - permanent != card.PermanentOfThisCard()  → self-exclusion (`other: true`)
#   - TopCard.CardNames.Contains("Gaossmon")   → name filter (`name_contains`)
#   - IsOwnerTurn condition                    → `active_when: { your_turn: true }`
#   - changeValue: 3000                        → `dp_modifier: 3000`
#
# Lowers to a process-backed declarative aura. `Game::tick_declarative_effects`
# scans face-up field sources, evaluates `active_when`, then installs +3000
# ChangeDp on every battle-area permanent matching the `target` predicate.
# `other: true` excludes BT5-008's own permanent (G-OTHER-PREDICATE-UNEVALUATED,
# resolved Group 6); `name_contains` matches the printed "[Gaossmon]" filter.
#
# ─── Clause 2: [Opponent's Turn] Your opponent can't reduce digivolution costs ─
#
# DCGO (BT5_008.cs): CannotReduceCostClass with:
#   - PlayerCondition: player == card.Owner.Enemy  → `target_player: opponent`
#   - isPermanent: true                            → permanent player-level modifier
#   - IsOpponentTurn condition                     → `active_when: { opponents_turn: true }`
#
# Lowers to a player-scoped declarative flood gate. The same declarative tick
# installs `CannotReduceDigivolveCost` on the opponent; the engine's cost-calc
# path then suppresses that player's digivolution-cost reducers while leaving
# ordinary digivolution and play-cost reducers untouched
# (G-PLAYER-FLOOD-GATE-DSL, resolved Group 6 — raw_rust placeholder removed).

effects:
  # ─── Clause 1: [Your Turn] other Gaossmon +3000 DP ─────────────────────────
  - kind: aura
    summary: "[Your Turn] Your other [Gaossmon] get +3000 DP"
    active_when: { your_turn: true }
    target:
      owner: you
      zone: [battle_area]
      name_contains: "Gaossmon"
      other: true
    dp_modifier: 3000

  # ─── Clause 2: [Opponent's Turn] Opponent can't reduce digivolve costs ─────
  - kind: flood_gate
    summary: "[Opponent's Turn] Opponent can't reduce digivolution costs"
    active_when: { opponents_turn: true }
    target_player: opponent
    modifier: CannotReduceDigivolveCost
