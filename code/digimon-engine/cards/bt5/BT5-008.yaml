card: BT5-008
name: Gaossmon
kind: digimon
level: 3
color: [red]
cost: 3
dp: 2000
traits: [Reptile]

# ─── Clause 1: [Your Turn] Your other [Gaossmon] all get +3000 DP ───────────
#
# DCGO: ChangeDPStaticEffect with:
#   - permanent != card.PermanentOfThisCard()  (self-exclusion, `other: true`)
#   - TopCard.CardNames.Contains("Gaossmon")   (name filter)
#   - IsOwnerTurn condition                    (active_when: your_turn)
#   - Amount: 3000
#
# DSL shape: kind: aura, active_when: { your_turn: true },
#   target: { owner: you, zone: [battle_area], name_contains: "Gaossmon", other: true },
#   dp_modifier: 3000
#
# KNOWN GAP — G-DECLARATIVE-KEYWORD (primary blocker):
#   `EffectTiming::Declarative` is never enqueued or fired anywhere in the engine.
#   The filtered aura lowers to an `Effect::declarative(card).process(|ctx| { ctx.add_dp_modifier(...) })`,
#   but that process closure is NEVER called. As a result, the ChangeDp modifier is never
#   installed in the modifier registry at runtime. All behavioral aura tests are #[ignore]'d.
#   See qa/archetype-qa/engine-gaps.md [G-DECLARATIVE-KEYWORD].
#
# KNOWN GAP — G-OTHER-PREDICATE-UNEVALUATED (secondary — blocked until G-DECLARATIVE-KEYWORD closes):
#   The `other: true` field in `PredicateSpec` compiles to `CompiledPredicate.other`
#   but `eval_permanent_fields` in `dsl_cards/predicate.rs` does NOT check `pred.other`.
#   As a result, even once G-DECLARATIVE-KEYWORD is fixed, BT5-008 will also buff itself
#   (over-fires), violating the printed text.
#   The self-exclusion behavioral test is `#[ignore]`'d with this gap tag until
#   `eval_permanent_fields` gains an `if pred.other == Some(true) && handle == source_handle { return false }` check.
#
# ─── Clause 2: [Opponent's Turn] Your opponent can't reduce digivolution costs ─
#
# DCGO: CannotReduceCostClass with:
#   - Target: card.Owner.Enemy (opponent player)
#   - isPermanent: true (permanent player-level modifier)
#   - IsOpponentTurn condition
#
# BLOCKED — G-PLAYER-FLOOD-GATE-DSL:
#   The DSL `kind: flood_gate` lowers to `lower_flood_gate.rs` which calls
#   `ctx.add_modifier(h, ...)` — permanent-level only. There is no `add_player_modifier`
#   pathway in the DSL or EffectContext API. The engine enforcement for digivolve cost
#   reduction uses `modifiers.player_has(acting_player, ModifierType::CannotReducePlayCost)`
#   (which covers ALL cost types — play AND digivolve — in `scan_before_pay_cost_reduction`).
#   A separate `CannotReduceDigivolveCost` variant is needed if the card should block
#   only digivolve reductions, but the current engine conflates both under
#   `CannotReducePlayCost`. Until either:
#     (a) a `player_targeted_flood_gate` DSL step with `add_player_modifier` support is added, OR
#     (b) `EffectContext::add_player_modifier` is exposed for raw_rust usage,
#   this clause cannot be expressed in DSL.
#
# Placeholder: raw_rust no-op `bt5_008_opp_cannot_reduce_digivolve_cost` (declarative, returns vec![]).
# Tracked in qa/dsl-vocab-gaps.md under G-PLAYER-FLOOD-GATE-DSL and qa/archetype-qa/engine-gaps.md.

effects:
  # ─── Clause 1: [Your Turn] other Gaossmon +3000 DP ─────────────────────────
  - kind: aura
    summary: "[Your Turn] Your other [Gaossmon] get +3000 DP"
    active_when: { your_turn: true }
    target:
      owner: you
      zone: [battle_area]
      name_contains: "Gaossmon"
      other: true
    dp_modifier: 3000

  # ─── Clause 2: [Opponent's Turn] Opponent can't reduce digivolve costs — BLOCKED ─
  #
  # No-op placeholder. See gap commentary above.
  # Real effect: while BT5-008 is face-up on field during opponent's turn, install
  # a player-level CannotReduceDigivolveCost modifier on the opponent player.
  # Requires: DSL add_player_modifier step + CannotReduceDigivolveCost enforcement.
  - kind: raw_rust
    fn: bt5_008_opp_cannot_reduce_digivolve_cost
    summary: "[Opponent's Turn] Opponent can't reduce digivolution costs (BLOCKED — G-PLAYER-FLOOD-GATE-DSL)"
