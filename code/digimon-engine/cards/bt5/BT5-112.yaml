card: BT5-112
name: "Omnimon Zwart Defeat"
kind: digimon
level: 7
color: [white, purple]
cost: 15
dp: 13000
traits: [Holy Warrior]
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 6, color_is: black }
    cost: 3
  - kind: digivolve
    from: { level_eq: 6, color_is: purple }
    cost: 3

effects:
  - when: on_security
    summary: "[Security] Play this card without battling and without paying the cost"
    process:
      - play_from_security: {}

  - when: when_digivolving
    summary: "[When Digivolving] Delete 1 of your opponent's Tamers"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: tamer }
          prompt: "Delete 1 of your opponent's Tamers"
      - delete_permanent: { target: target }

  - when: on_deletion
    summary: "[On Deletion] Delete 1 of your opponent's Digimon"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Delete 1 of your opponent's Digimon"
      - delete_permanent: { target: target }
