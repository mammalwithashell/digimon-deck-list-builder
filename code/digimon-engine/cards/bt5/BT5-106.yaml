card: BT5-106
name: Demonic Disaster
kind: option
color: [purple]
cost: 1

effects:
  # Supported slice:
  # [Main] You may delete 1 of your Digimon to unsuspend 1 of your purple Digimon.
  #
  # The printed "You may" is surfaced through the optional sacrifice selection.
  # After a sacrifice is chosen and deleted, the follow-up purple Digimon
  # selection remains player-visible even when only one legal target exists.
  - when: main_from_hand
    summary: "Delete 1 of your Digimon to unsuspend 1 purple Digimon"
    process:
      - select_own_permanent:
          bind_as: sacrifice
          optional: true
          filter: { kind: digimon }
          prompt: "Delete 1 of your Digimon"
      - delete_permanent: { target: sacrifice }
      - select_own_permanent:
          bind_as: target
          filter:
            all_of:
              - kind: digimon
              - color_is: purple
              - is_suspended: true
          prompt: "Unsuspend 1 of your purple Digimon"
      - unsuspend: { target: target }

  # [Security] You may play 1 level 3 purple Digimon card from your trash
  # without paying its memory cost. Any [On Play] effects on Digimon played
  # with this effect don't activate.
  #
  # The printed "You may" is surfaced through the optional trash selection.
  # `play_from_trash: { cost_delta: free }` plays the chosen Digimon without
  # paying its memory cost. `suppress_on_play: true` carries PUPPETS-G030
  # provenance so ONLY the just-played Digimon's [On Play] effects are
  # skipped — sibling permanents are unaffected.
  - when: on_security
    summary: "[Security] Play 1 lvl-3 purple Digimon from trash free, On Play suppressed"
    process:
      - select_trash:
          of: you
          bind_as: revived
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_eq: 3
              - color_is: purple
          prompt: "Play 1 level 3 purple Digimon from your trash"
      - play_from_trash:
          of: you
          hand_index: revived
          cost_delta: free
          suppress_on_play: true
