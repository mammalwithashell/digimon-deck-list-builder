# BT5-092 Nokia Shiramine — Tamer, White, Cost 3.
#
# Printed card text (cards.json):
#   [On Play] You may play 1 [Agumon] or [Gabumon] from your hand without
#     paying the cost.
#   [Your Turn] When one of your Digimon would digivolve into a Digimon card
#     in your hand with [Greymon], [Garurumon] or [Omnimon] in its name, by
#     suspending this Tamer, reduce the digivolution cost by 1.
#
# Inherited (Security):
#   [Security] Play this card without paying the cost.
#
# DCGO C# reference:
#   DCGO/Assets/Scripts/CardEffect/BT5/White/BT5_092.cs
#
# Clause map:
#   Clause 1: [On Play]   — optional select_hand Agumon/Gabumon → play_from_hand_free
#   Clause 2: [Your Turn] — cost reduction on ally-Digimon digivolve INTO a
#                            Greymon/Garurumon/Omnimon-named hand Digimon, paid
#                            for by suspending this Tamer (BLOCKED — see below)
#   Clause 3: [Security]  — play_from_security (this Tamer plays itself for free)
#
# ─── Clause 2 — CLOSED 2026-05-20 (G-COST-REDUCTION-DIGIVOLVE-INTO) ──────────
#
# `CostReductionBody` now exposes `when_any_ally_digivolves_into:
# <PredicateSpec>` — a digivolution-target-keyed trigger that fires only for
# a DIGIVOLVE cost (not a play) whose target card (the card being digivolved
# INTO) matches the predicate. The engine threads the digivolve cost-target
# hand-card AND a `cost_is_digivolve` flag through `EffectReadContext`, so
# the predicate inspects the target card's name.
#
# The "by suspending this Tamer" cost is authored as `pay_cost: [suspend:
# { target: source }]`. The lowering recognises a single self-targeted
# suspend as the "suspend-self cost" idiom and routes it through
# `suspend_self_as_cost`, which FAILS (and so cancels the reduction) when
# the Tamer is already suspended. `scan_before_pay_cost_reduction` honours a
# pay-cost-bearing reducer when a real digivolve cost-target is present.
#
# Same root gap as BT23-005 (`when_this_digivolves_into`); BT5-092 covers
# the "ANY of your Digimon" source form.

card: BT5-092
name: Nokia Shiramine
kind: tamer
color: [white]
cost: 3

effects:
  # ─── Clause 1: [On Play] You may play 1 [Agumon]/[Gabumon] free ────────────
  #
  # DCGO BT5_092.cs:15-106 — OnEnterFieldAnyone ActivateClass with
  # SetUpActivateClass(..., isOptional: true, ...) and SelectHandEffect.SetUp
  # (canNoSelect: true, maxCount: 1). Filter: cardSource.CardNames.Contains
  # ("Agumon") || cardSource.CardNames.Contains("Gabumon"). Played via
  # CardEffectCommons.PlayPermanentCards(payCost: false).
  #
  # The "you may" wording maps to the CLAUSE-LEVEL `optional: true`.
  # G-OUTER-OPTIONAL-NOT-INSTALLED (closed 2026-05-19): a lone optional
  # trigger now installs an explicit outer accept/decline prompt before its
  # body runs. The inner `select_hand` is therefore MANDATORY (`optional:
  # false`) — once the player accepts the outer prompt they must pick an
  # eligible card if one exists. Previously the inner `select_hand` was
  # ALSO marked `optional: true`, which masked the missing outer-prompt
  # gap; relying on the clause-level optional is the faithful shape.
  #
  # Cross-reference: same shape as BT22-084 (Nokia Shiramine Lv.5) clause 2
  # and BT5-091 Tai Kamiya — see qa/archetype-qa/dsl/ implementations.
  - when: on_play
    optional: true
    summary: "[On Play] You may play 1 [Agumon] or [Gabumon] from your hand free"
    process:
      - select_hand:
          of: you
          bind_as: pick
          optional: false
          filter:
            any_of:
              - name_contains: "Agumon"
              - name_contains: "Gabumon"
          prompt: "Play 1 [Agumon] or [Gabumon] from hand for free"
      - play_from_hand_free: { of: you, hand_index: pick }

  # ─── Clause 2: [Your Turn] cost reduction on digivolve into ─────────────────
  #             Greymon/Garurumon/Omnimon-named hand card.
  #
  # Printed: "[Your Turn] When one of your Digimon would digivolve into a
  # Digimon card in your hand with [Greymon], [Garurumon] or [Omnimon] in its
  # name, by suspending this Tamer, reduce the digivolution cost by 1."
  #
  # DCGO BT5_092.cs:108-269 — BeforePayCost ActivateClass that, when
  # CanTriggerWhenPermanentWouldDigivolve fires for an OWNER battle-area
  # permanent digivolving into a hand card with HasGreymonName ||
  # ContainsCardName("Omnimon") || HasGarurumonName, suspends this Tamer
  # (CanActivateSuspendCostEffect) then applies Cost -= 1.
  #
  # G-COST-REDUCTION-DIGIVOLVE-INTO (closed 2026-05-20):
  #   - `when_any_ally_digivolves_into` fires only for a DIGIVOLVE cost whose
  #     target card matches the name predicate.
  #   - `pay_cost: [suspend: { target: source }]` is the "by suspending this
  #     Tamer" cost — recognised as the suspend-self idiom; it FAILS (and so
  #     cancels the reduction) when Nokia is already suspended.
  #   - `active_when: { your_turn: true }` enforces the printed [Your Turn].
  #   - Not optional: the reduction applies whenever the cost is payable.
  - kind: cost_reduction
    scope: face_up
    reduction_timing: before_pay_cost
    active_when: { your_turn: true }
    when_any_ally_digivolves_into:
      any_of:
        - name_contains: "Greymon"
        - name_contains: "Garurumon"
        - name_contains: "Omnimon"
    pay_cost:
      - suspend: { target: source }
    amount: 1
    summary: "[Your Turn] Suspend self → -1 digivolve cost when an ally digivolves into a Greymon/Garurumon/Omnimon-named hand card"

  # ─── Clause 3: [Security] Play this card without paying the cost ───────────
  #
  # DCGO BT5_092.cs:271-274 — SecuritySkill timing,
  # CardEffectFactory.PlaySelfTamerSecurityEffect(card). Same primitive used
  # by BT5-093 (Tai & Matt), BT22-084 (Nokia Lv.5), BT9-092 (Cool Boy) and
  # other "play self from security" Tamers. Resolved precedent
  # G-PLACE-SELF-AS-OPTION-PERMANENT (engine-gaps.md, 2026-04-27).
  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
