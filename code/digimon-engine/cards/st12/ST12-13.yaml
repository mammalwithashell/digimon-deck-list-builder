# Printed image/official bundle: identity rule, no inherited effect.
card: ST12-13
name: Sistermon Ciel
kind: digimon
level: 4
color: [white]
cost: 4
dp: 5000
traits: [Puppet]
form: Champion
attribute: [Data, Virus]
also_treated_as: [Sistermon Noir]

effects:
  - when: on_play
    summary: "[On Play] Reveal 3; add 1 Huckmon or Royal Knight card; trash the rest"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal:
          of: you
          bind_as: picked
          optional: false
          filter:
            any_of:
              - name_contains: Huckmon
              - trait_has: Royal Knight
          prompt: "Add 1 Huckmon or Royal Knight card"
      - add_to_hand_from_reveal: { of: you, card: picked }
      - per_selected:
          selection: revealed
          bind_as: rest
          body:
            - trash_from_reveal: { of: you, card: rest }

  - kind: aura
    active_when: { all_turns: true }
    target:
      owner: you
      zone: [battle_area]
      kind: digimon
      any_of:
        - name_contains: Huckmon
        - trait_has: Royal Knight
    grant_keyword: { keyword: Reboot }
    summary: "[All Turns] Your Huckmon or Royal Knight Digimon gain Reboot"
