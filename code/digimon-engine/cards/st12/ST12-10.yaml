card: ST12-10
name: Jesmon
kind: digimon
level: 6
form: Mega
attribute: Data
color: [red]
cost: 12
dp: 12000
traits: [Holy Warrior, Royal Knight]

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: red }
    cost: 4

effects:
  - text: "[When Digivolving] ＜Blitz＞"
    when: when_digivolving
    summary: "[When Digivolving] <Blitz>"
    process:
      - grant_keyword:
          target: source
          keyword: Blitz
          expiry: end_of_turn

  - text: "[When Attacking] You may play 1 Digimon card with [Sistermon] in its name from your hand without paying its memory cost."
    when: when_attacking
    optional: true
    summary: "[When Attacking] May play 1 [Sistermon] Digimon from hand free"
    process:
      - select_hand:
          of: you
          bind_as: sis
          optional: true
          filter:
            all_of:
              - kind: digimon
              - name_contains: Sistermon
              - can_play_from_effect_without_cost: true
          prompt: "You may play 1 Digimon card with [Sistermon] in its name from your hand without paying its memory cost"
      - if:
          condition: { binding_present: sis }
          then:
            - play_from_hand_free: { of: you, hand_index: sis }

  - text: "[Your Turn][Once Per Turn] When you play another Digimon by an effect, this Digimon gets +3000 DP and gains ＜Security Attack +1＞ for the turn."
    when: on_ally_played
    once_per_turn: true
    active_when: { your_turn: true }
    trigger_if:
      all_of:
        - event_target_owner: you
        - event_target_kind: digimon
        - event_is_effect_initiated: true
        - not:
            event_permanent_is_source: true
    summary: "[Your Turn][OPT] When you play another Digimon by effect, +3000 DP and <Security A. +1> for the turn"
    process:
      - add_dp_modifier:
          target: source
          value: 3000
          expiry: end_of_turn
      - grant_keyword:
          target: source
          keyword: SecurityAttackPlus
          value: 1
          expiry: end_of_turn
