card: ED01-02
name: Yukinamon
kind: digimon
level: 6
color: [blue]
cost: 13
dp: 13000
traits: [Ice-Snow, ALYSION]
form: Mega
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: blue }
    cost: 5

effects:
  - kind: grant_keyword
    text: "＜Blocker＞"
    keyword: Blocker

  - when: when_digivolving
    text: "[When Digivolving] Trash all digivolution cards of 1 of your opponent's Digimon. Then, 1 of their Digimon can't attack until their turn ends."
    summary: "[When Digivolving] Trash all digivolution cards of 1 opposing Digimon, then 1 opposing Digimon can't attack until their turn ends"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: stripped
          filter: { kind: digimon }
          prompt: "Trash all digivolution cards of 1 of your opponent's Digimon"
      - trash_all_sources: { target: stripped }
      - select_opponent_permanent:
          optional: false
          bind_as: locked
          filter: { kind: digimon }
          prompt: "1 of your opponent's Digimon can't attack until their turn ends"
      - add_modifier:
          target: locked
          modifier: CannotAttack
          value: 1
          expiry: end_of_opponents_turn

  - when: on_any_deletion
    text: "[All Turns] [Once Per Turn] When any of your opponent's Digimon with as many digivolution cards as this Digimon or fewer are deleted, if you have [Valner Dragnogh], trash their top security card."
    once_per_turn: true
    active_when: { all_turns: true }
    trigger_if:
      all_of:
        - event_target_owner: opponent
        - event_target_kind: digimon
        - event_target_materials_count_lte:
            formula:
              source_material_count: {}
    condition:
      any_permanent: { of: you, zone: [battle_area], name_is: "Valner Dragnogh" }
    summary: "[All Turns][OPT] When an opposing Digimon with <= this Digimon's digivolution cards is deleted, if you have [Valner Dragnogh], trash their top security card"
    process:
      - trash_top_security: { of: opponent }
