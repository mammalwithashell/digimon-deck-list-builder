# BT26-061 Chiropmon — Digimon, Lv.3, Purple, DP 2000, Cost 3.
# Traits: Mammal, Glowing Dawn, BEATBREAK. Form: Rookie. Attribute: Virus.
# Printed digivolve box: Purple Lv.2 / cost 0; [Digivolve] Lv.2 w/[Glowing
#   Dawn] trait: Cost 0.
#
# Printed card text (official Bandai DB — data/card_bundles/BT26-061.md):
#   [On Play] Reveal the top 3 cards of your deck. Add 1 [Glowing Dawn] trait
#     card and 1 purple [BEATBREAK] trait card among them to the hand. Return
#     the rest to the bottom of the deck.
#   Inherited: [When Attacking] [Once Per Turn] <Draw 1> and trash 1 card in
#     your hand.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT26/Purple/BT26_061.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
# Alt-digivolve (timing None): level 2 + TopCard EqualsTraits("Glowing Dawn"),
#   cost 0. → alt_paths digivolve from level 2 + Glowing Dawn trait, cost 0.
# On Play (OnEnterFieldAnyone, not optional): SimplifiedRevealDeckTopCardsAnd
#   Select(revealCount 3; bucket EqualsTraits("Glowing Dawn") max 1 AddHand;
#   bucket HasCardColor(Purple) && EqualsTraits("BEATBREAK") max 1 AddHand;
#   remainder DeckBottom). → BT25-032 Liollmon idiom: reveal_top_deck 3 +
#   two-bucket select_reveal_buckets (no_duplicate_cards: DCGO removes each
#   chosen card from the revealed pool before the next bucket, RevealLibrary
#   .cs) + add both + place_remainder_on_deck bottom.
# Inherited (OnAllyAttack, maxCount 1, not optional): Draw 1 → if hand >= 1 a
#   MANDATORY (canNoSelect:false) Discard pick. → scope inherited,
#   when_attacking, once_per_turn; draw + select_hand + trash_from_hand_by_index.

card: BT26-061
name: "Chiropmon"
kind: digimon
level: 3
color: [purple]
cost: 3
dp: 2000
traits: [Mammal, Glowing Dawn, BEATBREAK]
form: Rookie
attribute: Virus

alt_paths:
  - kind: digivolve
    from:
      all_of:
        - level_eq: 2
        - trait_has: "Glowing Dawn"
    cost: 0

effects:
  # ─── [On Play] Reveal 3; add 1 Glowing Dawn + 1 purple BEATBREAK; rest bottom
  - when: on_play
    summary: "[On Play] Reveal the top 3 cards of your deck. Add 1 [Glowing Dawn] trait card and 1 purple [BEATBREAK] trait card among them to the hand. Return the rest to the bottom of the deck"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          buckets:
            - bind_as: gd_pick
              min: 1
              max: 1
              filter: { trait_has: "Glowing Dawn" }
            - bind_as: bb_pick
              min: 1
              max: 1
              filter:
                all_of:
                  - trait_has: "BEATBREAK"
                  - color_is: purple
          no_duplicate_cards: true
          prompt: "Add 1 [Glowing Dawn] and 1 purple [BEATBREAK] trait card to your hand"
      - add_to_hand_from_reveal: { of: you, card: gd_pick }
      - add_to_hand_from_reveal: { of: you, card: bb_pick }
      - place_remainder_on_deck: { of: you, position: bottom }

  # ─── Inherited [When Attacking] [Once Per Turn] <Draw 1> + trash 1 hand card
  - scope: inherited
    when: when_attacking
    once_per_turn: true
    summary: "Inherited [When Attacking] [Once Per Turn] <Draw 1> and trash 1 card in your hand"
    process:
      - draw: { of: you, count: 1 }
      - select_hand:
          of: you
          bind_as: discard
          filter: {}
          prompt: "Trash 1 card in your hand"
      - trash_from_hand_by_index: { of: you, hand_index: discard }
