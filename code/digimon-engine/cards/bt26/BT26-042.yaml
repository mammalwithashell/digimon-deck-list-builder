# BT26-042 Okuwamon — Digimon, Lv.5, Green, DP 7000, Cost 7.
# Traits: Insectoid, Titan, TS. Form: Ultimate. Attribute: Virus.
# Printed digivolve box: Green Lv.4 / cost 3; [Digivolve] Lv.4 w/[Insectoid]/
#   [TS] trait: Cost 3.
#
# Printed card text (official Bandai DB — data/card_bundles/BT26-042.md):
#   [On Play] [When Digivolving] Suspend 1 of your opponent's Digimon or Tamers.
#     Then, 1 of their Digimon or Tamers can't unsuspend until their turn ends.
#   [On Play] [When Attacking] [Once Per Turn] Until your opponent's turn ends,
#     1 of your [Insectoid] or [Titan] trait Digimon gains <Piercing> and +3000
#     DP.
#   Inherited: [All Turns] [Once Per Turn] When this Digimon deletes your
#     opponent's Digimon in battle, trash their top security card.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT26/Green/BT26_042.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
# Alt-digivolve: level 4, TopCard EqualsTraits Insectoid || HasTSTraits, cost 3.
# Shared A OP/WD (optional false): only if an opponent Digimon/Tamer exists:
#   canNoSelect:false Tap pick of 1 opp Digimon/Tamer; then canNoSelect:false
#   pick of 1 opp Digimon/Tamer → GainCanNotUnsuspend(UntilOpponentTurnEnd).
#   → mandatory select_opponent_permanent + suspend, then mandatory
#   select_opponent_permanent + CannotUnsuspend end_of_opponents_turn
#   (BT25-053 / BT26-044 idiom).
# Shared B OP/WA (optional false, maxCountPerTurn 1, ONE shared hash across
#   both timings): canNoSelect:false pick of 1 own Insectoid/Titan Digimon →
#   GainPierce + ChangeDigimonDP(+3000), both UntilOpponentTurnEnd.
#   → one clause `when: [on_play, when_attacking]` + once_per_turn (one
#   shared counter) + select_own_permanent + grant_keyword Piercing +
#   add_dp_modifier, end_of_opponents_turn.
# Inherited (OnEndBattle, CanTriggerWhenDeleteOpponentDigimonByBattle(winner
#   contains this card, loser = opponent's, isOnlyWinnerSurvive), OPT, no turn
#   gate): IDestroySecurity(enemy, 1, fromTop). → on_any_deletion +
#   source_deleted_battle_opponent + trash_top_security (BT25-054 Clause C).

card: BT26-042
name: "Okuwamon"
kind: digimon
level: 5
color: [green]
cost: 7
dp: 7000
traits: [Insectoid, Titan, TS]
form: Ultimate
attribute: Virus

alt_paths:
  - kind: digivolve
    from:
      all_of:
        - level_eq: 4
        - any_of:
            - trait_has: "Insectoid"
            - trait_has: "TS"
    cost: 3

effects:
  # ─── [On Play][When Digivolving] suspend 1 opp Digimon/Tamer; then 1 opp
  #     Digimon/Tamer can't unsuspend until their turn ends ─────────────────
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Suspend 1 of your opponent's Digimon or Tamers. Then, 1 of their Digimon or Tamers can't unsuspend until their turn ends"
    process:
      - select_opponent_permanent:
          bind_as: susp
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          prompt: "Suspend 1 of your opponent's Digimon or Tamers"
      - suspend: { target: susp }
      - select_opponent_permanent:
          bind_as: lock_target
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          prompt: "1 of your opponent's Digimon or Tamers can't unsuspend until their turn ends"
      - add_modifier:
          target: lock_target
          modifier: CannotUnsuspend
          value: 1
          expiry: end_of_opponents_turn

  # ─── [On Play][When Attacking][OPT] 1 own [Insectoid]/[Titan] Digimon gains
  #     <Piercing> and +3000 DP until opp turn ends ─────────────────────────
  - when: [on_play, when_attacking]
    once_per_turn: true
    summary: "[On Play][When Attacking][Once Per Turn] Until your opponent's turn ends, 1 of your [Insectoid]/[Titan] Digimon gains <Piercing> and +3000 DP"
    process:
      - select_own_permanent:
          bind_as: buff
          filter:
            all_of:
              - kind: digimon
              - any_of:
                  - trait_has: "Insectoid"
                  - trait_has: "Titan"
          prompt: "1 of your [Insectoid]/[Titan] Digimon gains <Piercing> and +3000 DP until your opponent's turn ends"
      - grant_keyword:
          target: buff
          keyword: Piercing
          expiry: end_of_opponents_turn
      - add_dp_modifier:
          target: buff
          value: 3000
          expiry: end_of_opponents_turn

  # ─── Inherited [All Turns][OPT] deletes an opp Digimon in battle → trash
  #     their top security card ────────────────────────────────────────────
  - scope: inherited
    when: on_any_deletion
    once_per_turn: true
    active_when: { all_turns: true }
    condition: { source_deleted_battle_opponent: true }
    summary: "Inherited [All Turns][OPT] When this Digimon deletes your opponent's Digimon in battle, trash their top security card"
    process:
      - trash_top_security: { of: opponent }
