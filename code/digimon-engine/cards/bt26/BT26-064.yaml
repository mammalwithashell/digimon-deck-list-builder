# BT26-064 DemiDevimon — Digimon, Lv.3, Purple, DP 2000, Cost 3.
# Traits: Evil, Iliad, ADAMAS, TS. Form: Rookie. Attribute: Virus.
# Printed digivolve box: Purple Lv.2 / cost 0; [Digivolve] Lv.2 w/[TS] trait:
#   Cost 0.
#
# Printed card text (official Bandai DB — data/card_bundles/BT26-064.md):
#   [On Play] Reveal the top 3 cards of your deck. Add 1 card with the
#     [Fallen Angel], [Undead], [Wizard] or [Demon Lord] trait and 1 card with
#     the [TS] trait among them to the hand. Return the rest to the bottom of
#     the deck.
#   Inherited: [When Attacking] [Once Per Turn] <Draw 1> and trash 1 card in
#     your hand.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT26/Purple/BT26_064.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
# Alt-digivolve: AddSelfDigivolutionRequirementStaticEffect(level 2,
#   TopCard.HasTSTraits (= EqualsTraits "TS"), cost 0) → alt_paths.
# On Play (OnEnterFieldAnyone + CanTriggerOnPlay): SimplifiedRevealDeckTop
#   CardsAndSelect(3) with two AddHand buckets, maxCount 1 each, in order:
#   EqualsTraits Fallen Angel / Undead / Wizard / Demon Lord, then HasTSTraits;
#   remainder → deck bottom. Not optional. → reveal + two-bucket select (min 1
#   each, no duplicate card) + deck-bottom remainder (BT26-065 Falcomon idiom).
#   EqualsTraits is an exact trait match → `trait_has`.
# Inherited (OnAllyAttack, maxPerTurn 1, no IsOwnerTurn gate): DrawClass 1,
#   then if hand >= 1 a canNoSelect:false SelectHandEffect Discard 1.
#   → when_attacking, once_per_turn, draw 1 + mandatory select_hand + trash.

card: BT26-064
name: "DemiDevimon"
kind: digimon
level: 3
color: [purple]
cost: 3
dp: 2000
traits: [Evil, Iliad, ADAMAS, TS]
form: Rookie
attribute: Virus

alt_paths:
  - kind: digivolve
    from:
      all_of:
        - level_eq: 2
        - trait_has: TS
    cost: 0

effects:
  # ─── [On Play] reveal 3: add 1 [Fallen Angel]/[Undead]/[Wizard]/[Demon Lord]
  #     card and 1 [TS] card; rest to the bottom ─────────────────────────────
  - when: on_play
    summary: "[On Play] Reveal 3; add 1 [Fallen Angel]/[Undead]/[Wizard]/[Demon Lord] card and 1 [TS] card to hand; rest to deck bottom"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          no_duplicate_cards: true
          buckets:
            - bind_as: dark_pick
              min: 1
              max: 1
              filter:
                any_of:
                  - trait_has: "Fallen Angel"
                  - trait_has: Undead
                  - trait_has: Wizard
                  - trait_has: "Demon Lord"
            - bind_as: ts_pick
              min: 1
              max: 1
              filter:
                trait_has: TS
          prompt: "Add 1 [Fallen Angel]/[Undead]/[Wizard]/[Demon Lord] card and 1 [TS] card to the hand"
      - add_to_hand_from_reveal: { of: you, card: dark_pick }
      - add_to_hand_from_reveal: { of: you, card: ts_pick }
      - place_remainder_on_deck: { of: you, position: bottom }

  # ─── Inherited [When Attacking][OPT] <Draw 1> and trash 1 card in hand ─────
  - scope: inherited
    when: when_attacking
    once_per_turn: true
    summary: "Inherited [When Attacking][OPT] <Draw 1> and trash 1 card in your hand"
    process:
      - draw: { of: you, count: 1 }
      - select_hand:
          of: you
          bind_as: discard
          filter: {}
          prompt: "Trash 1 card in your hand"
      - trash_from_hand_by_index: { of: you, hand_index: discard }
