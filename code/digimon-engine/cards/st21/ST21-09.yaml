# ST21-09 Lillymon — Lv.5, Green, Fairy / ADVENTURE, Ultimate, Data,
# DP 7000, Cost 7.
#
# Printed card text (official Bandai DB, data/card_bundles/ST21-09.md):
#
#   [On Play] [When Digivolving] Suspend all of your opponent's 5000 DP or
#   lower Digimon. Then, for every 2 colors your Tamers have, return 1 of
#   their suspended Digimon to the bottom of the deck.
#   [Your Turn] [Once Per Turn] When your other Digimon are played or
#   digivolve, if any of them have the [ADVENTURE] trait, 1 of your Digimon
#   gains <Alliance> for the turn. Then, 1 of your Digimon may attack.
#
#   Inherited:  <Alliance>
#
#   Digivolve box (xros_req): "[Digivolve] Lv.4 w/[ADVENTURE] trait: Cost 3"
#   Standard evo circle:      Green Lv.4, Cost 3
#
# Official Q&A (bundle): the <Alliance> grant cannot be declined -- "You must
# give to 1 of your Digimon."
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/ST21/Green/ST21_09.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
#
# Alt requirement (EffectTiming.None): permanentCondition =
#   HasAdventureTraits && Level == 4, cost 3, requirements respected
#   -> second alt_path (first alt_path = the printed green Lv.4 circle).
#
# [On Play] / [When Digivolving] (two OnEnterFieldAnyone ActivateClasses,
#   isOptional false): (1) SuspendPermanentsClass over EVERY opponent
#   battle-area Digimon with DP <= 5000 -- no choice, all of them; (2) if any
#   opponent Digimon is suspended (including ones suspended before this
#   effect) and your Tamers have >= 2 colours, a SelectPermanentEffect in
#   PutLibraryBottom mode with maxCount = min(#suspended opponent Digimon,
#   Tamer colours / 2), canNoSelect false, canEndNotMax false -- i.e. the
#   player must pick EXACTLY that many suspended Digimon and each goes to the
#   bottom of its owner's deck. "Tamer colours" counts ALL of your Tamers.
#   -> for_each + suspend, then select_count_capped_multi (clamp_to_available:
#   true, optional_zero: false) -> per_selected return_to_deck (bottom).
#   (BT22-015 / AD1-025 idiom.)
#
# [Your Turn][OPT]: identical to ST21-06 -- see that file for the DCGO
#   crosscheck. trigger_if carries the trigger qualifier (own, non-source
#   Digimon with [ADVENTURE]); the Alliance grant is mandatory, the attack
#   pick is optional ("may").
#
# Inherited <Alliance>: AllianceSelfEffect(inherited).

card: ST21-09
name: Lillymon
kind: digimon
level: 5
form: Ultimate
color: [green]
cost: 7
dp: 7000
traits: [Fairy, ADVENTURE]
attribute: Data

alt_paths:
  # Standard evolution circle: Green Lv.4, cost 3.
  - kind: digivolve
    from: { level_eq: 4, color_is: green }
    cost: 3

  # xros_req box: "[Digivolve] Lv.4 w/[ADVENTURE] trait: Cost 3".
  - kind: digivolve
    from: { level_eq: 4, trait_has: ADVENTURE }
    cost: 3

effects:
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Suspend all opponent Digimon with 5000 DP or less; then return 1 suspended opponent Digimon per 2 Tamer colors to the bottom of the deck"
    process:
      - for_each:
          over:
            of: opponent
            zone: [battle_area]
            kind: digimon
            dp_lte: 5000
          bind_as: weak_digimon
          body:
            - suspend: { target: weak_digimon }
      - select_count_capped_multi:
          of: opponent
          zone: battle_area
          max:
            formula:
              floor_div:
                - base: 0
                  per:
                    distinct_colors_count:
                      of: you
                      zone: battle_area
                      filter: { kind: tamer }
                  delta: 1
                - 2
          clamp_to_available: true
          filter:
            all_of:
              - kind: digimon
              - is_suspended: true
          bind_as: bottomed
          prompt: "Choose 1 suspended opponent Digimon per 2 Tamer colors to return to the bottom of the deck"
          optional_zero: false
      - per_selected:
          selection: bottomed
          bind_as: bottomed_digimon
          body:
            - return_to_deck:
                target: bottomed_digimon
                position: bottom

  - when: [on_ally_played, on_digivolve]
    active_when: { your_turn: true }
    once_per_turn: true
    trigger_if:
      all_of:
        - event_target_owner: you
        - event_target_kind: digimon
        - event_target_is_source: false
        - event_target_trait_has: ADVENTURE
    summary: "[Your Turn][OPT] When your other Digimon are played or digivolve, if any has [ADVENTURE]: 1 of your Digimon gains <Alliance> for the turn; then 1 of your Digimon may attack"
    process:
      # "1 of your Digimon gains <Alliance> for the turn" -- mandatory
      # (Official Q&A: "You must give to 1 of your Digimon").
      - select_own_permanent:
          bind_as: alliance_target
          filter: { kind: digimon }
          prompt: "Choose 1 of your Digimon to gain <Alliance> for the turn"
      - grant_keyword:
          target: alliance_target
          keyword: Alliance
          expiry: end_of_turn
      # "Then, 1 of your Digimon may attack."
      - select_own_permanent:
          bind_as: attacker
          optional: true
          filter: { kind: digimon, can_attack: { targets: any } }
          prompt: "1 of your Digimon may attack"
      - may_attack_now:
          attacker: attacker
          targets: any
          optional: true

  - scope: inherited
    kind: grant_keyword
    keyword: Alliance
    summary: "Inherited <Alliance>"
