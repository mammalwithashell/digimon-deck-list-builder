# ST21-06 MagnaAngemon — Lv.5, Yellow, Archangel / ADVENTURE, Ultimate, Vaccine,
# DP 7000, Cost 7.
#
# Printed card text (official Bandai DB, data/card_bundles/ST21-06.md):
#
#   [On Play] [When Digivolving] Place 1 of your opponent's 6000 DP or lower
#   Digimon as the top security card. For every 2 colors your Tamers have, add
#   2000 to this effect's DP maximum.
#   [Your Turn] [Once Per Turn] When your other Digimon are played or
#   digivolve, if any of them have the [ADVENTURE] trait, 1 of your Digimon
#   gains <Alliance> for the turn. Then, 1 of your Digimon may attack.
#
#   Inherited:  <Alliance>
#
#   Digivolve box (xros_req): "[Digivolve] Lv.4 w/[ADVENTURE] trait: Cost 3"
#   Standard evo circle:      Yellow Lv.4, Cost 3
#
# Official Q&A (bundle): the <Alliance> grant cannot be declined -- "You must
# give to 1 of your Digimon."
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/ST21/Yellow/ST21_06.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
#
# Alt requirement (EffectTiming.None): AddSelfDigivolutionRequirementStaticEffect
#   permanentCondition = HasAdventureTraits && Level == 4, cost 3,
#   ignoreDigivolutionRequirement = false  -> second alt_path below. The
#   standard yellow Lv.4 / cost 3 circle is authored as the first alt_path
#   (established convention: alt_path_printed_cost_guard.rs).
#
# [On Play] / [When Digivolving] (two OnEnterFieldAnyone ActivateClasses,
#   isOptional false):
#   CanSelectPermanentCondition = opponent battle-area Digimon with
#   DP <= 6000 + 2000 * (distinct Tamer colors / 2) (integer division).
#   SelectPermanentEffect canNoSelect false (mandatory), maxCount 1, then
#   IPutSecurityPermanent(permanent, toTop: true) -- the card goes into its
#   OWNER's security stack. -> select_opponent_permanent + place_on_security
#   (source: permanent, to_owner: true, position: top).
#   "For every 2 colors your Tamers have" counts ALL of your Tamers' colors
#   (not trait-filtered): floor(distinct_colors / 2) * 2000. The DSL has no
#   `add` compound, so 6000 + 2000*k is authored as 6000 - (k * -2000).
#
# [Your Turn][OPT] (OnEnterFieldAnyone, maxCount 1, IsOwnerTurn):
#   triggers when ANOTHER of your Digimon is played or digivolves; the
#   [ADVENTURE] check reads the Digimon's top card (Official Q&A: the check
#   reads the Digimon after it digivolves). DCGO's resolution then (1) selects
#   1 of your Digimon to gain <Alliance> until end of turn (mandatory,
#   canNoSelect false, any Digimon incl. this one) and (2) selects 1 of your
#   Digimon that can attack (canNoSelect true -- "may") which then attacks
#   (SelectAttackEffect over any legal target). If neither half did anything
#   DCGO refunds the use (RemoveUse); the Alliance half always runs (this
#   Digimon is always a legal recipient), so no refund step is needed.
#   -> `trigger_if` carries the trigger qualifier (owner / Digimon / not this
#   Digimon / ADVENTURE) so a non-ADVENTURE play never spends the once-per-turn
#   use; `active_when: your_turn` carries [Your Turn]. The two halves are two
#   player-visible selections (grant recipient, then optional attacker) +
#   may_attack_now (EX12-014 / AD1-009 idiom: `can_attack` filter).
#
# Inherited <Alliance>: EffectTiming.OnAllyAttack AllianceSelfEffect(inherited)
#   -> `scope: inherited` grant_keyword Alliance.

card: ST21-06
name: MagnaAngemon
kind: digimon
level: 5
form: Ultimate
color: [yellow]
cost: 7
dp: 7000
traits: [Archangel, ADVENTURE]
attribute: Vaccine

alt_paths:
  # Standard evolution circle: Yellow Lv.4, cost 3.
  - kind: digivolve
    from: { level_eq: 4, color_is: yellow }
    cost: 3

  # xros_req box: "[Digivolve] Lv.4 w/[ADVENTURE] trait: Cost 3".
  - kind: digivolve
    from: { level_eq: 4, trait_has: ADVENTURE }
    cost: 3

effects:
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Place 1 of your opponent's Digimon (DP <= 6000 + 2000 per 2 Tamer colors) as the top security card"
    process:
      - select_opponent_permanent:
          bind_as: security_target
          filter:
            all_of:
              - kind: digimon
              - dp_lte:
                  formula:
                    subtract:
                      - 6000
                      - multiply:
                          - floor_div:
                              - base: 0
                                per:
                                  distinct_colors_count:
                                    of: you
                                    zone: battle_area
                                    filter: { kind: tamer }
                                delta: 1
                              - 2
                          - -2000
          prompt: "Place 1 of your opponent's 6000 DP or lower Digimon (+2000 per 2 Tamer colors) as the top security card"
      - place_on_security:
          source: { permanent: security_target }
          to_owner: true
          position: top

  - when: [on_ally_played, on_digivolve]
    active_when: { your_turn: true }
    once_per_turn: true
    trigger_if:
      all_of:
        - event_target_owner: you
        - event_target_kind: digimon
        - event_target_is_source: false
        - event_target_trait_has: ADVENTURE
    summary: "[Your Turn][OPT] When your other Digimon are played or digivolve, if any has [ADVENTURE]: 1 of your Digimon gains <Alliance> for the turn; then 1 of your Digimon may attack"
    process:
      # "1 of your Digimon gains <Alliance> for the turn" -- mandatory
      # (Official Q&A: "You must give to 1 of your Digimon").
      - select_own_permanent:
          bind_as: alliance_target
          filter: { kind: digimon }
          prompt: "Choose 1 of your Digimon to gain <Alliance> for the turn"
      - grant_keyword:
          target: alliance_target
          keyword: Alliance
          expiry: end_of_turn
      # "Then, 1 of your Digimon may attack." -- DCGO canNoSelect true and the
      # candidate gate is Permanent.CanAttack(activateClass).
      - select_own_permanent:
          bind_as: attacker
          optional: true
          filter: { kind: digimon, can_attack: { targets: any } }
          prompt: "1 of your Digimon may attack"
      - may_attack_now:
          attacker: attacker
          targets: any
          optional: true

  - scope: inherited
    kind: grant_keyword
    keyword: Alliance
    summary: "Inherited <Alliance>"
