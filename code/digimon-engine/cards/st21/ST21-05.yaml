# ST21-05 Angemon — Lv4, Yellow, Angel / ADVENTURE, Champion / Vaccine,
# DP 4000, Cost 4.
#
# Printed card text (official bundle data/card_bundles/ST21-05.md):
#
#   Digivolve: Yellow Lv.3 / cost 2.
#   [Digivolve] Lv.3 w/[ADVENTURE] trait: Cost 2
#
#   [When Digivolving] If you have 1 or fewer Tamers, you may play 1 Tamer
#   card with the [ADVENTURE] trait from your hand without paying the cost.
#
#   Inherited: [When Attacking] [Once Per Turn] 1 of your opponent's Digimon
#   gets -2000 DP for the turn.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/ST21/Yellow/ST21_05.cs
#   - Alt requirement: Lv3 && HasAdventureTraits, cost 2.
#   - [When Digivolving] optional; CanActivate: an ADVENTURE Tamer in hand and
#     own battle-area Tamer count <= 1; SelectHandEffect(canNoSelect: true,
#     maxCount 1) → PlayPermanentCards(payCost: false).
#   - Inherited OnAllyAttack, maxCount 1 (OPT), not optional: pick 1 opponent
#     Digimon (canNoSelect: false) → ChangeDigimonDP(-2000, UntilEachTurnEnd).
#
# Verdict: IMPLEMENTED.

card: ST21-05
name: Angemon
kind: digimon
level: 4
color: [yellow]
cost: 4
dp: 4000
traits: [Angel, ADVENTURE]
form: Champion
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 2
  - kind: digivolve
    from: { level_eq: 3, trait_has: ADVENTURE }
    cost: 2

effects:
  - when: when_digivolving
    summary: "[When Digivolving] If you have 1 or fewer Tamers, may play 1 [ADVENTURE] Tamer from hand for free"
    condition:
      count_lte:
        filter:
          of: you
          zone: [battle_area]
          kind: tamer
        n: 1
    process:
      - select_hand:
          of: you
          bind_as: adv_tamer
          optional: true
          filter:
            all_of:
              - kind: tamer
              - trait_has: ADVENTURE
          prompt: "Play 1 [ADVENTURE] Tamer card from your hand without paying the cost"
      - play_from_hand_free: { of: you, hand_index: adv_tamer }

  - scope: inherited
    when: when_attacking
    once_per_turn: true
    summary: "[Inherited][When Attacking][Once Per Turn] 1 opponent Digimon gets -2000 DP for the turn"
    process:
      - select_opponent_permanent:
          bind_as: dp_target
          filter: { kind: digimon }
          prompt: "1 of your opponent's Digimon gets -2000 DP for the turn"
      - add_dp_modifier:
          target: dp_target
          value: -2000
          expiry: end_of_turn
