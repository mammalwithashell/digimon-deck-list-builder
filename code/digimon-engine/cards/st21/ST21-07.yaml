# ST21-07 Palmon — Lv.3, Green, Vegetation / ADVENTURE, Rookie, Data,
# DP 1000, Cost 3.
#
# Printed card text (official Bandai DB, data/card_bundles/ST21-07.md):
#
#   [On Play] By trashing 1 card with the [ADVENTURE] trait in your hand,
#   <Draw 2> (Draw 2 cards from your deck.)
#
#   Inherited:  [All Turns] This Digimon gets +1000 DP.
#
#   Digivolve box (xros_req): "[Digivolve] Lv.2 w/[ADVENTURE] trait: Cost 0"
#   Standard evo circle:      Green Lv.2, Cost 0
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/ST21/Green/ST21_07.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
#
# Alt requirement (EffectTiming.None): permanentCondition =
#   HasAdventureTraits && Level == 2, cost 0, requirements respected
#   -> second alt_path (first alt_path = the printed green Lv.2 circle).
#
# [On Play] (OnEnterFieldAnyone, isOptional TRUE): CanActivateCondition needs
#   at least one [ADVENTURE] card in hand. The body is a SelectHandEffect in
#   Discard mode with canNoSelect TRUE; DrawClass(2) runs only when a card was
#   actually discarded (afterSelectCardCoroutine with cardSources.Count > 0).
#   Printed "By trashing ..." makes the trash the activation cost: declining
#   the pick draws nothing. -> optional clause + `select_hand` (optional,
#   `cost: true` aborts the tail on decline) + trash + draw 2
#   (BT20-007 idiom). The `count_gte` condition mirrors CanActivateCondition.
#
# Inherited [All Turns] +1000 DP: ChangeSelfDPStaticEffect(1000, inherited,
#   condition null) -> `scope: inherited` aura, `active_when: all_turns`.

card: ST21-07
name: Palmon
kind: digimon
level: 3
form: Rookie
color: [green]
cost: 3
dp: 1000
traits: [Vegetation, ADVENTURE]
attribute: Data

alt_paths:
  # Standard evolution circle: Green Lv.2, cost 0.
  - kind: digivolve
    from: { level_eq: 2, color_is: green }
    cost: 0

  # xros_req box: "[Digivolve] Lv.2 w/[ADVENTURE] trait: Cost 0".
  - kind: digivolve
    from: { level_eq: 2, trait_has: ADVENTURE }
    cost: 0

effects:
  - when: on_play
    optional: true
    condition:
      count_gte:
        filter:
          of: you
          zone: [hand]
          trait_has: ADVENTURE
        n: 1
    summary: "[On Play] By trashing 1 [ADVENTURE] card in your hand, <Draw 2>"
    process:
      - select_hand:
          of: you
          bind_as: trash_pick
          optional: true
          cost: true
          filter: { trait_has: ADVENTURE }
          prompt: "Trash 1 card with the [ADVENTURE] trait from your hand to <Draw 2>"
      - trash_from_hand_by_index: { of: you, hand_index: trash_pick }
      - draw: { of: you, count: 2 }

  - scope: inherited
    kind: aura
    active_when: { all_turns: true }
    target: {}
    dp_modifier: 1000
    summary: "[Inherited][All Turns] This Digimon gets +1000 DP"
