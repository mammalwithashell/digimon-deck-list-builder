# ST21-11 MetalGarurumon — Digimon, Lv.6, Purple/Blue, DP 12000, Cost 7.
# Traits: Cyborg, ADVENTURE. Attribute: Data.
#
# Printed text (official observation, data/card_official.json +
# data/card_bundles/ST21-11.md):
#   Standard digivolve: Purple Lv.5 / Cost 4, Blue Lv.5 / Cost 4
#   [Digivolve] Lv.5 w/[ADVENTURE] trait: Cost 3
#   {Hand} [Counter] <Blast Digivolve> (Your Digimon may digivolve into this
#     card without paying the cost.)
#   [On Play] [When Digivolving] Return 1 of your opponent's level 4 or lower
#     Digimon to the bottom of the deck. For every 2 colors your Tamers have,
#     add 1 to this effect's level maximum.
#   [When Attacking] [Once Per Turn] You may play 1 level 4 or lower Digimon
#     card from your trash without paying the cost.
#   Special Rule: <Overflow (-4)>
#
# Standard circles (Purple Lv.5 / 4, Blue Lv.5 / 4) come from data/cards.json
# evo_costs, which carries both; no alt_paths entry is authored for them
# (same convention as the other ST20/ST21/BT21 ADVENTURE cards).
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/ST21/Purple/ST21_11.cs
#   - Alt digivolve: Level == 5 && HasAdventureTraits, cost 3.
#   - OnCounterTiming: BlastDigivolveEffect → burst_digivolve marker cost 0
#     (ST20-11 WarGreymon sibling idiom).
#   - OP / WD: SelectPermanentEffect Mode.PutLibraryBottom canNoSelect false
#     over opponent Digimon with Level <= 4 + (unique colours across own
#     battle-area Tamers / 2) (integer division).
#     4 + floor(c / 2) == floor((8 + c) / 2) for c >= 0, which is what the
#     `floor_div` formula below evaluates (same distinct_colors_count selector
#     as ST20-11 / AD1-014). Only the Digimon card itself goes to the deck
#     bottom (printed text lacks "and all of its digivolution cards" — default
#     `include_sources: false`, ST22-12 / BT25-056 convention).
#   - WA: OnAllyAttack maxUsableCount 1, isOptional; SelectCardEffect
#     Root.Trash canNoSelect true, IsDigimon && Level <= 4 → PlayPermanentCards
#     payCost false.
#   - Overflow (-4): ace_overflow: -4 (ST20-11 idiom).

card: ST21-11
name: MetalGarurumon
kind: digimon
level: 6
color: [purple, blue]
cost: 7
dp: 12000
traits: [Cyborg, ADVENTURE]
attribute: Data

ace_overflow: -4

alt_paths:
  # [Digivolve] Lv.5 w/[ADVENTURE] trait: Cost 3.
  - kind: digivolve
    from: { level_eq: 5, trait_has: ADVENTURE }
    cost: 3
  # {Hand} [Counter] <Blast Digivolve>.
  - kind: burst_digivolve
    marker: true
    cost: 0

effects:
  # ─── [On Play][When Digivolving] bottom-deck 1 opp Digimon, scaling level ─
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Return 1 of your opponent's level 4 (+1 per 2 Tamer colors) or lower Digimon to the bottom of the deck"
    process:
      - select_opponent_permanent:
          bind_as: bounce_target
          filter:
            all_of:
              - kind: digimon
              - level_lte:
                  formula:
                    floor_div:
                      - base: 8
                        per:
                          distinct_colors_count:
                            of: you
                            zone: battle_area
                            filter: { kind: tamer }
                        delta: 1
                      - 2
          prompt: "Return 1 of your opponent's level 4 or lower Digimon to the bottom of the deck (+1 level per 2 of your Tamers' colors)"
      - return_to_deck: { target: bounce_target, position: bottom }

  # ─── [When Attacking][OPT] you may play 1 Lv.4- Digimon from trash free ───
  - when: when_attacking
    once_per_turn: true
    optional: true
    summary: "[When Attacking][Once Per Turn] You may play 1 level 4 or lower Digimon card from your trash without paying the cost"
    process:
      - select_trash:
          of: you
          bind_as: revive_pick
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_lte: 4
          prompt: "You may play 1 level 4 or lower Digimon card from your trash without paying the cost"
      - play_from_trash_free: { of: you, hand_index: revive_pick }
