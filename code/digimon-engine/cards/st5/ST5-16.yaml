card: ST5-16
name: Dark Side Attack
kind: option
color: [black]
cost: 5

effects:
  - when: main_from_hand
    summary: "[Main] Delete 1 opponent Digimon with play cost 7 or less"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon, play_cost_lte: 7 }
          prompt: "Choose 1 opponent Digimon with play cost 7 or less"
      - delete_permanent: { target: target }

  - when: on_security
    summary: "[Security] Activate this card's Main effect"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon, play_cost_lte: 7 }
          prompt: "Choose 1 opponent Digimon with play cost 7 or less"
      - delete_permanent: { target: target }
