# ST20-15 Island of Adventure — Option, White, Cost 2.
# Traits: ADVENTURE.
#
# Printed card text (data/cards.json — verbatim):
#
#   While you have no face-up [Island of Adventure] security cards, you can
#     ignore this card's color requirements.
#   [Security] [All Turns] All of your level 3 or higher Digimon get +2000 DP.
#   [Main] Add your top security card to the hand. Then, place this card face
#     up as the top security card.
#
# Inherited (Security):
#   Security Effect [Security] You may play 1 Tamer card from your hand
#     without paying the cost.
#
# DCGO C# reference:
#   DCGO/Assets/Scripts/CardEffect/ST20/White/ST20_15.cs
#
# ─── DCGO crosscheck ─────────────────────────────────────────────────────────
#
# Block 1 (`EffectTiming.None`) — IgnoreColorConditionClass:
#   - CanUseCondition: `!card.Owner.SecurityCards.Any(c =>
#       c.EqualsCardName("Island of Adventure") && !c.IsFlipped)`
#     → fires while NO face-up Island of Adventure card exists in own security.
#   - CardCondition: `cardSource == card` → only THIS card's color req is
#     bypassed (not other cards).
#
# Block 2 (`EffectTiming.None`) — ChangeDPStaticEffect, isInheritedEffect=false:
#   - CanUseCondition: `CardEffectCommons.IsExistInSecurity(card, false)`
#     → fires while THIS card sits face-up in security (the source-zone is
#     the controller's own security stack, NOT the battle area).
#   - PermanentCondition: own battle-area Digimon, TopCard.HasLevel,
#     Level >= 3.
#   - changeValue: +2000 DP.
#
# Block 3 (`EffectTiming.OptionSkill`, [Main]) —
#   `CardEffectFactory.ReplaceTopSecurityWithFaceUpOptionMainEffect(card)`:
#   - Step A: add the controller's top security card to hand (mirrors
#     `add_top_security_to_hand` API).
#   - Step B: place THIS Option card (currently in hand, being played) as
#     the controller's NEW top security card, FACE UP.
#
# Block 4 (`EffectTiming.SecuritySkill`, inherited) — ActivateClass:
#   - isOptional: true (`canNoSelect: true` on the SelectHandEffect).
#   - CanSelectCardCondition: `cardSource.IsTamer && CanPlayAsNewPermanent(...,
#     payCost: false, ...)`
#   - PlayPermanentCards(payCost: false, isTapped: false, root: Hand,
#     activateETB: true).
#
# ─── Source-priority cross-check (printed text + RULES_CONTEXT.md > DCGO) ───
#
# Printed text governs and DCGO matches on every clause:
#   - Color bypass is conditional on "no face-up [Island of Adventure] in
#     own security" — printed text and DCGO `IsFlipped` check agree.
#   - Security-zone DP aura: printed `[Security] [All Turns]` tag means the
#     source stays in security and the effect is continuous; DCGO
#     `IsExistInSecurity(card, false)` confirms the source-zone gate.
#     `false` = "must be face-up in security" (DCGO convention; the second
#     argument is the includeFaceDown flag inverted).
#   - [Main] body: printed "Add your top security card to the hand. Then,
#     place this card face up as the top security card." DCGO uses the
#     `ReplaceTopSecurityWithFaceUpOptionMainEffect` factory which performs
#     both steps atomically.
#   - Security inherited: printed "You may play 1 Tamer card from your hand
#     without paying the cost." DCGO `canNoSelect: true` confirms the "may"
#     optional gate.
#
# ─── Implementation status (faithfulness diff) ───────────────────────────────
#
# | Card-text element                                                | Status |
# |------------------------------------------------------------------|--------|
# | Color bypass while NO face-up [Island of Adventure] in security  | IMPLEMENTED — `no_face_up_security_named` predicate (G-PRED-NO-FACE-UP-SECURITY-NAMED CLOSED) |
# | [Security][All Turns] +2000 DP to own Lv3+ Digimon (security src)| IMPLEMENTED — `kind: aura, scope: security` (G-SECURITY-ZONE-AURA-SOURCE CLOSED — see clause 1) |
# | [Main] Add top security card to hand                              | IMPLEMENTED — `add_top_security_to_hand` |
# | [Main] "Then, place this card face up as the top security card"   | IMPLEMENTED — `place_self_option_at_security` |
# | [Security] (inherited) optional play 1 Tamer from hand free       | IMPLEMENTED |
#
# ─── DSL-GAP — Predicate "no face-up security card with name X" [G-PRED-NO-FACE-UP-SECURITY-NAMED] ──
#
# Printed text: "While you have no face-up [Island of Adventure] security
# cards, you can ignore this card's color requirements." DCGO models this
# with `!card.Owner.SecurityCards.Any(c => c.EqualsCardName("Island of
# Adventure") && !c.IsFlipped)` — i.e. examines every card in the
# controller's security stack and rejects only face-up ones whose name
# matches.
#
# The DSL has no predicate that combines: (a) the security zone, (b) a
# face-up filter (per RULES_CONTEXT.md §16 face-down security cards are
# "hidden" — the printed text "face-up" is a deliberate qualifier), and (c)
# a name / card-id filter on individual security cards. The closest
# existing primitives:
#   - `security_count_lte` / `security_count_gte` — total count predicates
#     only; no per-card filter.
#   - `any_permanent { zone: [security], ... }` — `Zone::Security` exists in
#     the DSL enum, but the predicate evaluator's any_permanent path is
#     wired primarily for battle-area zone scans; security cards are NOT
#     `Permanent` instances (they are raw `Card`s in `Player.security`),
#     so even if the zone constraint is honored the predicate would silently
#     evaluate to false. AND there is no `is_face_up` / `face_up: true`
#     leaf to discriminate face-up from face-down security cards.
#
# Closing this gap requires a new `PredicateSpec` leaf such as
# `face_up_security_card_count` { card_number_is | name_is, of: PlayerRef,
# count_eq | count_lte | count_gte: u8 }` (or simply
# `no_face_up_security_named: { card_number_is: "X", of: you }`), plus a
# matching `eval_predicate_with_bindings` arm that walks
# `player.security` and counts entries satisfying the face-up flag and the
# id filter.
#
# Workaround applied today: `no_permanent { of: you, zone: [security],
# card_number_is: "ST20-15" }`. This is structurally faithful to the
# "named-card-not-in-own-security" intent but:
#   (i) silently over-fires while ANY [Island of Adventure] sits face-up
#       OR face-down in security (over-grants the bypass when an
#       Island-of-Adventure was placed face-down via, e.g., another
#       effect's "place X as security face-down" — rare in practice but
#       possible).
#   (ii) silently UNDER-fires if the predicate evaluator's any_permanent
#        zone-filter never matches Card-only security entries (very likely
#        — see notes above), in which case the gate is permanently OPEN
#        and color bypass always applies (over-firing). Both directions
#        are unfaithful to printed text.
#
# Because the gate's failure mode is BOTH-DIRECTIONS over-firing (in the
# common evaluator-evaluates-false sub-case the bypass always applies; in
# the evaluator-evaluates-true sub-case the bypass is suppressed), there
# is no way to author a "safe" partial workaround. Per no-approximations
# the workaround is documented + tests gated under the gap tag, and the
# YAML clause is authored against printed text so that the future
# evaluator + predicate fix slots in cleanly.
#
# Engine-side note: G-IGNORE-COLOR-MASK was RESOLVED 2026-05-02; the
# `IgnoreColorRequirement` modifier IS now consulted by the action mask
# (`code/digimon-engine/src/action/mask.rs`). So a fully-correct gate
# would actually toggle the Option's playability when the security pile
# changes — the gap is purely the predicate side.
#
# Also blocks: any future "[While you have no face-up <name> security
# cards] X" or "[While you have a face-up <name> security card] X" form.
# DCGO grep for `SecurityCards.Any(... IsFlipped ...)` returns multiple
# entries (mirror cards in companion sets / Adventure-trait family).
#
# ─── Track E closure — Place self at TOP of own security stack face-up (Option flavor) ──
#
# Printed text: "Then, place this card face up as the top security card."
# DCGO performs this inside `ReplaceTopSecurityWithFaceUpOptionMainEffect`
# which calls `IPutSecurityPermanent(... toTop: true, isFlipped: false)`
# (or equivalent face-up placement) AFTER the head step removed the
# previous top security card to hand.
#
# Track E landed the exact Option-card flavor as
# `place_self_option_at_security: { position: top, face: up }`, which consumes
# the in-flight Option from `pending_option` so normal Option disposal does not
# also trash it.
#
#   (a) ST20-15 is an OPTION card (`kind: option`), not a Digimon
#       Permanent. EX9-021 / EX4-060 surface the gap for a leaving /
#       attacking Digimon permanent (top + sources go to security as a
#       bundle). ST20-15's "self" is the Option card currently being PLAYED
#       from hand — there is no source-stack to bundle, just a single
#       card to route from MainEffectDrain staging directly to security
#       top.
#
#   (b) ST20-15 specifies "face up" while EX4-060 places face-down at
#       bottom. EX9-021's "place this Digimon as your top security card"
#       defaults to face-up per printed text (the orientation is implicit
#       for top placements). So ST20-15 + EX9-021 cover the (top, face-up)
#       axis; EX4-060 covers (bottom, face-down).
#
# Verification for the reusable verb lives in
# `code/digimon-engine/tests/dsl/zone_movement_verbs.rs`; this card fixture
# proves the production YAML uses the same printed two-step body.
#
# ─── G-SECURITY-ZONE-AURA-SOURCE — [Security][All Turns] aura, security source (CLOSED) ──
#
# Printed text: "[Security] [All Turns] All of your level 3 or higher
# Digimon get +2000 DP." The `[Security]` tag is a SOURCE-ZONE qualifier
# (per RULES_CONTEXT.md §16) — the effect is continuous (`[All Turns]`)
# and the source must be face-up in this player's security stack for the
# effect to be active. DCGO models it with
# `CardEffectCommons.IsExistInSecurity(card, false)` on the
# `ChangeDPStaticEffect` `condition`, exactly the source-zone gate.
#
# RESOLVED (Track H §5): `Game::tick_declarative_effects` now ALSO iterates
# every face-up security card on both players (`game.rs` ~2129) and
# dispatches its declarative effects with `source_permanent = None`. A
# filter-aura (`kind: aura` with a non-empty `target`) lowers to a
# `materializes_declarative_state` process that scans the battle areas and
# installs declarative DP modifiers — it never needs a battle-area
# `source_permanent`, so the security-source dispatch path executes it
# correctly. Sister fixture: BT21-095 Wind Guardians (`scope: security`
# `grant_keyword` aura). Cleanup is automatic — each tick clears
# materialized declaratives and re-installs only from face-up sources, so a
# face-down flip / Recovery / trash of ST20-15 evicts the buff on the next
# tick.
#
# Authored below as clause 1: `kind: aura, scope: security` with
# `target: { owner: you, kind: digimon, level_gte: 3 }` + `dp_modifier: 2000`.
# `owner: you` resolves against the security card's controller (the aura
# source's owner) — mirrors DCGO "All of YOUR ... Digimon" and excludes the
# opponent's Lv3+ Digimon. No `active_when` gate: printed `[All Turns]` is
# unconditional while the source sits face-up (the face-up gate is the
# tick-loop's `face_up_security` membership check, not a predicate).

card: ST20-15
name: "Island of Adventure"
kind: option
color: [white]
cost: 2
traits: [ADVENTURE]

# Card-level Option-use requirement (G-PRED-NO-FACE-UP-SECURITY-NAMED).
# Printed: "While you have no face-up [Island of Adventure] security cards,
# you can ignore this card's color requirements." This is the FROM-HAND
# play-time bypass — `use_requirement` lowers onto the [Main] clause's
# `option_color_requirement_bypass` condition, which the action mask
# consults in `option_use_requirement_or_color_available`. It is
# card-scoped (only THIS card's color requirement is bypassed), mirroring
# DCGO `IgnoreColorConditionClass.SetUpIgnoreColorConditionClass(
# cardCondition: cardSource == card)`. The same predicate also gates the
# field-side `flood_gate` clause below.
use_requirement:
  no_face_up_security_named:
    of: you
    card_number_is: "ST20-15"

effects:
  # ─── Clause 0: Color bypass while NO face-up [Island of Adventure] in security ─
  #
  # Printed: "While you have no face-up [Island of Adventure] security cards,
  # you can ignore this card's color requirements."
  #
  # Mirror of BT22-099 / BT23-096 / EX7-074 / P-151 flood_gate shape but
  # with the gate negated AND scoped to OWN security (not own field).
  #
  # The G-IGNORE-COLOR-MASK gap was RESOLVED 2026-05-02 — runtime enforcement
  # lives in `code/digimon-engine/src/action/mask.rs` and the same helper
  # gates `play_option_from_hand`.
  #
  # G-PRED-NO-FACE-UP-SECURITY-NAMED CLOSED: the `no_face_up_security_named`
  # predicate leaf walks `Player.security` and counts only cards whose
  # `card_index` is in `Player.face_up_security`, exactly mirroring DCGO's
  # `!card.Owner.SecurityCards.Any(c => c.EqualsCardName("Island of
  # Adventure") && !c.IsFlipped)`. Face-down [Island of Adventure] security
  # cards do NOT close the gate (printed "face-up" qualifier honored).
  - kind: flood_gate
    active_when:
      no_face_up_security_named:
        of: you
        card_number_is: "ST20-15"
    modifier: IgnoreColorRequirement
    target: { card_number_is: "ST20-15" }
    summary: "While no face-up [Island of Adventure] in own security, ignore color requirements for this card"

  # ─── Clause 1: [Security][All Turns] +2000 DP to own Lv3+ Digimon ─────────────
  #
  # Printed: "[Security] [All Turns] All of your level 3 or higher Digimon
  # get +2000 DP."
  #
  # G-SECURITY-ZONE-AURA-SOURCE CLOSED — see gap header above. While
  # ST20-15 sits FACE-UP in its owner's security stack, the security-zone
  # tick path (`Game::tick_declarative_effects`) dispatches this filter-aura
  # each tick; the materialized-declarative clear+re-install model evicts the
  # buff automatically if the card leaves security or is flipped face-down.
  # `owner: you` is evaluated against the aura source's controller (the
  # security card's owner) and excludes the opponent's Digimon.
  - kind: aura
    scope: security
    target:
      owner: you
      kind: digimon
      level_gte: 3
    dp_modifier: 2000
    summary: "[Security][All Turns] Own Lv3+ Digimon get +2000 DP"

  # ─── Clause 2: [Main] Add top security to hand; then place self at security top face up ─
  - when: main_from_hand
    optional: false
    summary: "[Main] Add top security to hand; then place self face up as top security"
    process:
      - add_top_security_to_hand: { of: you }
      - place_on_security:
          source: self_option
          position: top
          face_up: true

  # ─── Clause 3: [Security] (inherited) optional play 1 Tamer from hand free ────
  #
  # Printed inherited (security): "Security Effect [Security] You may play 1
  # Tamer card from your hand without paying the cost."
  #
  # Standard select_hand → play_from_hand_free pattern (sister cards: see
  # the on_security clauses on BT17-093, BT18-087, BT22-084, ST21-13 for
  # the play-self idiom; this clause picks a DIFFERENT hand card per the
  # printed text rather than the security-resolving card itself).
  #
  # `optional: true` mirrors DCGO `canNoSelect: true` on the SelectHandEffect
  # (the player may decline the play entirely).
  #
  # `kind: tamer` filter mirrors DCGO `cardSource.IsTamer && CanPlayAsNewPermanent
  # (..., payCost: false, ...)`. The play step inherits free play (no cost
  # check) per DCGO `payCost: false`.
  - scope: inherited
    when: on_security
    optional: true
    summary: "[Security][Inherited] You may play 1 Tamer from hand free"
    process:
      - select_hand:
          of: you
          bind_as: picked_tamer
          optional: true
          filter:
            kind: tamer
          prompt: "Play 1 Tamer card from your hand without paying its cost"
      - play_from_hand_free:
          of: you
          hand_index: picked_tamer
