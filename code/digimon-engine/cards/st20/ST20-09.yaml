# ST20-09 MegaKabuterimon — Lv5, Green, Insectoid / ADVENTURE, Vaccine, DP 7000, Cost 7.
#
# Printed text (data/card_bundles/ST20-09.md, official Bandai DB):
#
#   [On Play] [When Digivolving] 1 of your Digimon unsuspends. Then, for every
#   2 colors your Tamers with the [ADVENTURE] trait have, suspend 1 of your
#   opponent's Digimon.
#   [Your Turn] [Once Per Turn] When your other Digimon are played or
#   digivolve, if any of them have the [ADVENTURE] trait, 1 of your Digimon
#   gains <Alliance> for the turn. Then, 1 of your Digimon may attack.
#   Inherited: <Alliance>
#
#   Digivolve circle:  Green Lv.4 / cost 3   (evo_costs)
#   Digivolve box:     "[Digivolve] Lv.4 w/[ADVENTURE] trait: Cost 3" (xros_req)
#
# DCGO reference: DCGO/Assets/Scripts/CardEffect/ST20/Green/ST20_09.cs
#
#   - EffectTiming.None AddSelfDigivolutionRequirementStaticEffect:
#     permanentCondition = Lv.4 && HasAdventureTraits, cost 3,
#     ignoreDigivolutionRequirement false (alt-source requirement; the
#     digivolve circle's colour gate is replaced by the trait gate).
#   - Shared On Play / When Digivolving body: SelectPermanentEffect Mode.UnTap
#     over the owner's Digimon (maxCount 1, canNoSelect FALSE -> mandatory),
#     then if an opponent Digimon exists and TamerTwoColourCount() > 0, a
#     SelectPermanentEffect Mode.Tap over opponent Digimon with
#     maxCount = min(opponent Digimon, TamerTwoColourCount()), canNoSelect
#     false, canEndNotMax false (exactly that many, mandatory).
#     TamerTwoColourCount = (#distinct colours among the owner's battle-area
#     Tamers whose top card HasAdventureTraits) / 2, integer division.
#   - [Your Turn][OPT] (maxCount 1): trigger = owner's turn AND (a Digimon
#     other than this one was played OR digivolved on the owner's side);
#     activation requires the played/digivolved permanent to have the
#     [ADVENTURE] trait. Body: SelectPermanentEffect over own Digimon,
#     canNoSelect FALSE -> GainAlliance (UntilEachTurnEnd) [mandatory, and the
#     official Q&A says "you must give to 1 of your Digimon"]; then a second
#     SelectPermanentEffect (canNoSelect TRUE) over own Digimon that
#     CanAttack -> SelectAttackEffect.
#   - Inherited AllianceSelfEffect.
#
# DSL mapping:
#   - alt_paths: the printed Green Lv.4 circle + the xros_req Lv.4 [ADVENTURE]
#     route (both cost 3, requirements respected; ST20-10 idiom).
#   - Clause 1 `when: [on_play, when_digivolving]`: mandatory
#     `select_own_permanent` (can_unsuspend: true -> an already-unsuspended
#     Digimon stays selectable, exactly like DCGO) + `unsuspend`; then a
#     `select_count_capped_multi` over the opponent's Digimon with
#     `max = floor(distinct ADVENTURE-Tamer colours / 2)` and
#     `clamp_to_available: true` (DCGO canEndNotMax:false semantics) +
#     `per_selected` -> `suspend`.
#   - Clause 2 `when: [on_ally_played, on_digivolve]`, once_per_turn,
#     your-turn gated, trigger_if filtered to "other" own [ADVENTURE]
#     Digimon (EX12-036 observer idiom + EX13-064 "may attack" idiom).
#   - Clause 3 `scope: inherited` `grant_keyword: Alliance` (ST20-10 idiom).

card: ST20-09
name: MegaKabuterimon
kind: digimon
level: 5
color: [green]
cost: 7
dp: 7000
traits: [Insectoid, ADVENTURE]
form: Ultimate
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: green }
    cost: 3

  - kind: digivolve
    from: { level_eq: 4, trait_has: ADVENTURE }
    cost: 3

effects:
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] 1 of your Digimon unsuspends; then suspend 1 opponent Digimon per 2 colors of your [ADVENTURE] Tamers"
    process:
      - select_own_permanent:
          bind_as: unsuspend_target
          filter:
            all_of:
              - kind: digimon
              - can_unsuspend: true
          prompt: "Choose 1 of your Digimon to unsuspend"
      - unsuspend: { target: unsuspend_target }
      - select_count_capped_multi:
          of: opponent
          zone: battle_area
          max:
            formula:
              floor_div:
                - base: 0
                  per:
                    distinct_colors_count:
                      of: you
                      zone: battle_area
                      filter:
                        all_of:
                          - kind: tamer
                          - trait_has: ADVENTURE
                  delta: 1
                - 2
          clamp_to_available: true
          filter: { kind: digimon }
          bind_as: suspend_targets
          prompt: "Choose 1 of your opponent's Digimon to suspend for every 2 colors your [ADVENTURE] Tamers have"
          optional_zero: false
      - per_selected:
          selection: suspend_targets
          bind_as: suspend_target
          body:
            - suspend: { target: suspend_target }

  - when: [on_ally_played, on_digivolve]
    once_per_turn: true
    active_when: { your_turn: true }
    trigger_if:
      all_of:
        - event_target_owner: you
        - event_target_kind: digimon
        - event_target_is_source: false
        - event_target_trait_has: ADVENTURE
    summary: "[Your Turn][OPT] When your other Digimon are played or digivolve, if any have [ADVENTURE], 1 of your Digimon gains <Alliance> for the turn; then 1 of your Digimon may attack"
    process:
      - select_own_permanent:
          bind_as: alliance_target
          filter: { kind: digimon }
          prompt: "Choose 1 of your Digimon to gain <Alliance> for the turn"
      - grant_keyword:
          target: alliance_target
          keyword: Alliance
          expiry: end_of_turn
      - select_own_permanent:
          bind_as: attacker
          optional: true
          filter: { kind: digimon, can_attack: { targets: any } }
          prompt: "1 of your Digimon may attack"
      - may_attack_now:
          attacker: attacker
          targets: any

  - scope: inherited
    kind: grant_keyword
    keyword: Alliance
    summary: "Inherited <Alliance>"
