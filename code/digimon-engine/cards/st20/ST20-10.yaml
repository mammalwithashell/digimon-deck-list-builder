# ST20-10 Agumon — Lv3, Black, Reptile / ADVENTURE / Hero, DP 1000, Cost 3.
#
# Printed card text (data/cards.json):
#
#   [Your Turn] While your opponent has a Digimon with 10000 DP or more, or
#   your Tamers have 3 or more total colors, this Digimon can digivolve into
#   [WarGreymon] in the hand for a digivolution cost of 4, ignoring
#   digivolution requirements.
#
#   Inherited:  ＜Reboot＞ (Unsuspend this Digimon during your opponent's
#                          unsuspend phase.)
#
#   Digivolve box (xros_req): "[Digivolve] Lv.2 w/[ADVENTURE]/[Hero] trait:
#                              Cost 0"
#   Standard evo_costs:       Lv.2 Black, Cost 0.
#
# DCGO C# reference:
#   DCGO/Assets/Scripts/CardEffect/ST20/Black/ST20_10.cs
#
# DCGO declares three EffectTiming.None static effects:
#
#   1. AddSelfDigivolutionRequirementStaticEffect — alt-source: any colour,
#      Lv2 with HasAdventureTraits || HasHeroTraits, digivolutionCost=0,
#      ignoreDigivolutionRequirement=false. This corresponds to the printed
#      [Digivolve] xros_req box.
#
#   2. AddSelfDigivolutionRequirementStaticEffect — "Warp Digivolution" —
#      gated on Condition: ownerTurn && self-on-field &&
#      ((opponent has Digimon with DP>=10000) || (own Tamers have >=3 distinct
#      colours)).
#      permanentCondition: target == self (so "this Digimon" is the source).
#      cardCondition: target hand card is named "WarGreymon".
#      digivolutionCost=4, ignoreDigivolutionRequirement=true.
#
#   3. RebootSelfStaticEffect — inherited <Reboot>.
#
# ─── Implementation status ───────────────────────────────────────────────────
#
# All three clauses lower cleanly to the DSL surface. The three DSL gaps that
# previously blocked clause 2 (warp into WarGreymon) are all RESOLVED:
#
#   (A) G-ALT-PATH-DIRECTION-INTO (RESOLVED) — `AltPathSpec` gained a
#       `direction:` field. `direction: into` flips the semantic: the
#       alt-path lives on the SOURCE card (the carrier permanent) and `from:`
#       filters the destination hand-card candidate. Exactly the
#       "this card may digivolve into X in hand" shape.
#
#   (B) G-ALT-PATH-CONDITION (RESOLVED) — `AltPathSpec` carries a
#       `condition:` field, consumed by the Digivolve route in
#       `dna_digivolve.rs`. The "while opponent has 10000+ DP Digimon OR your
#       Tamers have 3+ colours" gate attaches here.
#
#   (C) G-DSL-DISTINCT-TAMER-COLORS (RESOLVED 2026-05-19) — the
#       `distinct_tamer_colors_gte` predicate leaf counts the distinct colors
#       across the observer's battle-area Tamers. The 3-tamer-colour disjunct
#       of clause 2's gate uses it directly. The 10000+ DP disjunct uses
#       `dp_gte` inside an `any_permanent` existential (evaluated for
#       permanents via `eval_dp_constraints`).
#
# Verdict: IMPLEMENTED — all three clauses authored.

card: ST20-10
name: Agumon
kind: digimon
level: 3
color: [black]
cost: 3
dp: 1000
traits: [Reptile, ADVENTURE, Hero]

# Standard digivolve: Lv2 Black, cost 0 (printed `evo_costs`).
# Alt-source (xros_req box): Lv2 with ADVENTURE or Hero trait, cost 0.
# DCGO ST20_10.cs region "Alternate Digivolution Requirement" (lines 14-23):
#   permanentCondition = (HasAdventureTraits || HasHeroTraits) && Level == 2
#   digivolutionCost = 0, ignoreDigivolutionRequirement = false.
# Note: requirement-respecting (`ignore_requirements: false`); the trait
# filter REPLACES the standard colour gate but the standard cost-checking
# still applies.
alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 0

  - kind: digivolve
    from:
      any_of:
        - { level_eq: 2, trait_has: ADVENTURE }
        - { level_eq: 2, trait_has: Hero }
    cost: 0

  # ─── Clause 2 — [Your Turn] Warp into WarGreymon for cost 4 ──────────────
  #
  # Printed: "[Your Turn] While your opponent has a Digimon with 10000 DP or
  # more, or your Tamers have 3 or more total colors, this Digimon can
  # digivolve into [WarGreymon] in the hand for a digivolution cost of 4,
  # ignoring digivolution requirements."
  #
  # DCGO ST20_10.cs "Warp Digivolution" AddSelfDigivolutionRequirementStatic-
  # Effect: source = self (this Digimon), target hand card name "WarGreymon",
  # digivolutionCost 4, ignoreDigivolutionRequirement true, gated on
  # ownerTurn && self-on-field && (opp DP>=10000 || own Tamers >=3 colours).
  #
  # `direction: into` — the alt-path lives on the SOURCE card (ST20-10) and
  # `from:` filters the destination HAND card (the WarGreymon). `condition:`
  # attaches the [Your Turn] + disjunctive board-state gate. `your_turn: true`
  # also implies self-is-on-field is satisfied by the route lookup (the path
  # only resolves when ST20-10 is the digivolve base permanent).
  - kind: digivolve
    direction: into
    from:
      zone: [hand]
      of: you
      name_is: "WarGreymon"
    cost: 4
    ignore_requirements: true
    condition:
      all_of:
        - your_turn: true
        - any_of:
            # "your opponent has a Digimon with 10000 DP or more"
            - any_permanent:
                of: opponent
                zone: [battle_area]
                kind: digimon
                dp_gte: 10000
            # "or your Tamers have 3 or more total colors"
            - distinct_tamer_colors_gte: 3

effects:
  # ─── Inherited: <Reboot> ────────────────────────────────────────────────
  #
  # DCGO ST20_10.cs region "Reboot - ESS" (lines 79-83):
  #   CardEffectFactory.RebootSelfStaticEffect(isInheritedEffect: true,
  #                                            card: card, condition: null)
  #
  # Same idiom as EX10-010 ("- kind: grant_keyword, keyword: Reboot") but
  # with `scope: inherited` so the keyword grant flows from the digivolution
  # stack to the carrier (resolved via game.has_keyword() stack-walk; same
  # mechanism as ST1-07's inherited <Security A. +1>).
  - scope: inherited
    kind: grant_keyword
    keyword: Reboot
    summary: "Inherited <Reboot>"
  # Clause 2 (warp into WarGreymon) is authored as the third entry in the
  # `alt_paths:` block above (`direction: into`), not as an `effects:` clause.
