# ST20-13 Tai Kamiya & Izzy Izumi — Tamer, Black+Green, Cost 3. Traits: ADVENTURE.
# Text: official bundle data/card_bundles/ST20-13.md (image checked); Q&A: two
# such Tamers reduce the play cost by a total of 2.
# DCGO: ST20/Black/ST20_13.cs — BeforePayCost reducer identical to ST20_12
# (isOptional, IsOwnerTurn, CanActivateSuspendCostEffect, own ADVENTURE Digimon
# from hand → suspend self, cost -1); BlockerStaticEffect(own battle-area Digimon
# with ADVENTURE top card, IsOpponentTurn); PlaySelfTamerSecurityEffect.
# Reducer = ST21-13 clause 1; aura = BT24-041 opponents_turn Blocker idiom.
card: ST20-13
name: "Tai Kamiya & Izzy Izumi"
kind: tamer
color: [black, green]
cost: 3
traits: [ADVENTURE]

effects:
  # [Your Turn] When any Digimon cards with the [ADVENTURE] trait would be played
  # from your hand, by suspending this Tamer, reduce the play cost by 1.
  - kind: cost_reduction
    reduction_timing: before_pay_cost
    active_when: { your_turn: true }
    optional: true
    when_any_ally_played:
      all_of:
        - kind: digimon
        - trait_has: ADVENTURE
    amount: 1
    summary: "[Your Turn] Suspend this Tamer: -1 play cost on your [ADVENTURE] Digimon"
    pay_cost:
      - suspend: { target: source }

  # [Opponent's Turn] All of your Digimon with the [ADVENTURE] trait gain <Blocker>.
  - kind: aura
    active_when: { opponents_turn: true }
    target:
      owner: you
      zone: [battle_area]
      kind: digimon
      trait_has: ADVENTURE
    grant_keyword: { keyword: Blocker }
    summary: "[Opponent's Turn] Your [ADVENTURE] Digimon gain <Blocker>"

  # [Security] Play this card without paying the cost.
  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
