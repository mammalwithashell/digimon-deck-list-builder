# ST20-13 Tai Kamiya & Izzy Izumi — Tamer, Black/Green, Cost 3, [ADVENTURE].
#
# Printed text (data/card_bundles/ST20-13.md, official Bandai DB):
#
#   [Your Turn] When any Digimon cards with the [ADVENTURE] trait would be
#   played from your hand, by suspending this Tamer, reduce the play cost by 1.
#   [Opponent's Turn] All of your Digimon with the [ADVENTURE] trait gain
#   <Blocker>.
#   Security Effect: [Security] Play this card without paying the cost.
#
# DCGO reference: DCGO/Assets/Scripts/CardEffect/ST20/Black/ST20_13.cs
#
#   - BeforePayCost: identical to ST20-12's cost reduction (optional; suspend
#     this Tamer; -1 play cost for an owner's [ADVENTURE] Digimon in hand).
#   - EffectTiming.None BlockerStaticEffect: PermanentCondition = owner's
#     battle-area Digimon whose TopCard HasAdventureTraits; condition = on
#     battle area && IsOpponentTurn; not inherited.
#   - SecuritySkill: PlaySelfTamerSecurityEffect.
#
# DSL mapping (siblings: ST21-13 cost reduction, BT20-059 opponent's-turn
# Blocker aura): `kind: cost_reduction`, `kind: aura` with
# `active_when: { opponents_turn: true }` + `grant_keyword: Blocker`,
# and `when: on_security` + `play_from_security`.

card: ST20-13
name: "Tai Kamiya & Izzy Izumi"
kind: tamer
color: [black, green]
cost: 3
traits: [ADVENTURE]

effects:
  - kind: cost_reduction
    reduction_timing: before_pay_cost
    active_when: { your_turn: true }
    optional: true
    when_any_ally_played:
      all_of:
        - kind: digimon
        - trait_has: ADVENTURE
    condition:
      any_permanent:
        of: you
        zone: [battle_area]
        card_number_is: "ST20-13"
        is_unsuspended: true
    amount: 1
    summary: "[Your Turn] When any [ADVENTURE] Digimon cards would be played from your hand, by suspending this Tamer, reduce the play cost by 1"
    pay_cost:
      - suspend: { target: source }

  - kind: aura
    active_when: { opponents_turn: true }
    target:
      owner: you
      kind: digimon
      trait_has: ADVENTURE
    grant_keyword: { keyword: Blocker }
    summary: "[Opponent's Turn] All of your Digimon with the [ADVENTURE] trait gain <Blocker>"

  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
