card: ST20-05
name: Gatomon
kind: digimon
level: 4
color: [yellow]
cost: 4
dp: 4000
traits: [Holy Beast, ADVENTURE]
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 2
  - kind: digivolve
    from:
      all_of:
        - level_eq: 3
        - trait_has: ADVENTURE
    cost: 2

effects:
  - when: on_security
    summary: "[Security] At the end of the battle, play this card without paying the cost"
    process:
      - play_from_security: {}

  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Give 2 opponent Digimon Security Attack -1 until their turn ends"
    process:
      - select_count_capped_multi:
          of: opponent
          zone: battle_area
          bind_as: targets
          max: 2
          filter: { kind: digimon }
          prompt: "Select up to 2 opponent Digimon to get Security Attack -1"
          optional_zero: true
      - per_selected:
          selection: targets
          bind_as: locked
          body:
            - add_modifier:
                target: { binding: locked }
                modifier: SecurityAttackChange
                value: -1
                expiry: end_of_opponents_turn

  - scope: inherited
    when: when_attacking
    once_per_turn: true
    summary: "[When Attacking][OPT] 1 opponent Digimon gets -2000 DP for the turn"
    process:
      - select_opponent_permanent:
          bind_as: dp_target
          filter: { kind: digimon }
          prompt: "Select 1 opponent Digimon to get -2000 DP"
      - add_dp_modifier:
          target: dp_target
          value: -2000
          expiry: end_of_turn
