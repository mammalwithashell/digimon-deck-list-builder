card: BT10-061
name: "SkullKnightmon: Mighty Axe Mode"
kind: digimon
level: 4
form: Champion
attribute: Virus
color: [black]
cost: 4
dp: 5000
traits: [Enhancement, Twilight]
also_treated_as: [SkullKnightmon, DeadlyAxemon]

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: black }
    cost: 3
  - kind: digixros
    materials:
      - filter: { name_is: SkullKnightmon }
        zones: [hand, battle_area]
        cost_delta: -1
      - filter: { name_is: DeadlyAxemon }
        zones: [hand, battle_area]
        cost_delta: -1
    cost: 4

effects:
  - text: "[On Play] Reveal the top 3 cards of your deck. Add 1 card with [Knightmon] in its name, 1 [DeadlyAxemon], or 1 [Nene Amano] among them to your hand. Trash the rest. Then, if DigiXrosing with 2 cards, delete 1 of your opponent's Digimon with a play cost of 4 or less."
    when: on_play
    summary: "[On Play] Reveal top 3; add 1 [Knightmon]-named/[DeadlyAxemon]/[Nene Amano] to hand; trash rest; if DigiXros with 2, delete opp cost <=4 Digimon"
    process:
      - reveal_top_deck: { of: you, count: 3 }
      - select_reveal:
          of: you
          bind_as: picked
          optional: false
          filter:
            any_of:
              - name_contains: Knightmon
              - name_is: DeadlyAxemon
              - name_is: "Nene Amano"
          prompt: "Add 1 card with [Knightmon] in its name, 1 [DeadlyAxemon], or 1 [Nene Amano] to your hand"
      - add_to_hand_from_reveal: { of: you, card: picked }
      - for_each:

          over: { zone: [reveal] }

          bind_as: rest

          body:

            - trash_from_reveal: { of: you, card: rest }
      - if:
          condition: { self_source_count: { op: gte, value: 2 } }
          then:
            - select_opponent_permanent:
                optional: false
                bind_as: victim
                filter:
                  all_of:
                    - kind: digimon
                    - play_cost_lte: 4
                prompt: "Delete 1 of your opponent's Digimon with a play cost of 4 or less"
            - delete_permanent: { target: victim }
