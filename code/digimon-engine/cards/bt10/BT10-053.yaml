# BT10-053 Ajatarmon — Digimon, Lv.5, Green, Cost 8, DP 7000.
# Traits: Vegetation. Form: Ultimate. Attribute: Vaccine.
# Digivolve: green Lv.4 / cost 3 (official DB + image + DCGO BT10_053.asset).
#
# Printed text (official Bandai DB, data/card_bundles/BT10-053.md; image agrees):
#   [Main][Once Per Turn] By suspending 1 of your green Digimon, you may play
#   1 Digimon card with [Vegetation], [Plant], or [Fairy] in one of its traits
#   and 3000 DP or less from your hand without paying its play cost.
#   Inherited: [Your Turn][Once Per Turn] When an effect suspends one of your
#   Digimon, gain 1 memory.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT10/Green/BT10_053.cs
#   - [Main] (OnDeclaration, maxCountPerTurn 1): SelectPermanentEffect over own
#     green Digimon (canNoSelect) → if unsuspended & can suspend:
#     SuspendPermanentsClass by THIS effect → only if it became suspended:
#     SelectHandEffect (canNoSelect) Digimon with Plant/Fairy traits and
#     DP <= 3000 → PlayPermanentCards(payCost false).
#   - Inherited: OnTappedAnyone, IsOwnerTurn, own Digimon, IsByEffect,
#     maxCountPerTurn 1 → AddMemory(1). isOptional false.
#
# Official Q&A: Q1977 Ajatarmon may suspend itself; Q1978 an attack
# declaration's suspension is not "by an effect".
#
# Rules: §15-6-3 — the [Main] can't be activated when its processing condition
# can't be met. DCGO lets it be declared while only suspended green Digimon
# exist (picking one then resolves nothing); the `condition` (an UNSUSPENDED own
# green Digimon, §15-7-4) is the rules-faithful gate. Body identical to
# BT10-048's [When Digivolving]; see that file for the modeling notes.

card: BT10-053
name: Ajatarmon
kind: digimon
level: 5
color: [green]
cost: 8
dp: 7000
traits: [Vegetation]
form: Ultimate
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: green }
    cost: 3

effects:
  - when: main_on_field
    once_per_turn: true
    condition:
      any_permanent:
        of: you
        zone: [battle_area]
        kind: digimon
        color_is: green
        is_unsuspended: true
    summary: "[Main][Once Per Turn] By suspending 1 of your green Digimon, you may play 1 Digimon card with [Vegetation], [Plant], or [Fairy] in one of its traits and 3000 DP or less from your hand without paying its play cost"
    process:
      - select_own_permanent:
          bind_as: suspend_cost
          optional: true
          filter:
            all_of:
              - kind: digimon
              - color_is: green
              - is_unsuspended: true
          prompt: "You may suspend 1 of your green Digimon"
      - if:
          condition: { binding_present: suspend_cost }
          then:
            - suspend: { target: suspend_cost }
            - if:
                condition: { effect_suspended_any_own_digimon: true }
                then:
                  - select_hand:
                      of: you
                      bind_as: play_pick
                      optional: true
                      filter:
                        all_of:
                          - kind: digimon
                          - dp_lte: 3000
                          - any_of:
                              - trait_contains: Vegetation
                              - trait_contains: Plant
                              - trait_contains: Fairy
                      prompt: "You may play 1 Digimon card with [Vegetation], [Plant], or [Fairy] in one of its traits and 3000 DP or less without paying its play cost"
                  - play_from_hand_free: { of: you, hand_index: play_pick }

  - scope: inherited
    when: on_suspend
    once_per_turn: true
    active_when: { your_turn: true }
    trigger_if:
      all_of:
        - event_target_owner: you
        - event_target_kind: digimon
        - event_is_effect_initiated: true
    summary: "[Your Turn][Once Per Turn] When an effect suspends one of your Digimon, gain 1 memory"
    process:
      - gain_memory: 1
