# BT10-048 Sunflowmon — Digimon, Lv.4, Green, Cost 4, DP 3000.
# Traits: Vegetation. Form: Champion. Attribute: Data.
#
# Digivolve: green Lv.3 / cost 2 — the ONLY circle on the card image and in
# DCGO's BT10_048.asset. cards.json and the official mirror
# (data/card_official.json) also list a green Lv.3 / cost 0 circle that the
# card does not print; data/card_overrides.json + cards.json are corrected to
# the single printed circle in the same commit.
#
# Printed text (official Bandai DB, data/card_bundles/BT10-048.md; image agrees):
#   [When Digivolving] By suspending 1 of your green Digimon, you may play 1
#   Digimon card with [Vegetation], [Plant], or [Fairy] in one of its traits
#   and 3000 DP or less from your hand without paying its play cost.
#   Inherited: [Your Turn][Once Per Turn] When an effect suspends one of your
#   Digimon, <Draw 1>. (Draw 1 card from your deck.)
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT10/Green/BT10_048.cs
#   - WD: isOptional; CanActivate needs an own green Digimon that can pay a
#     suspend cost (itself included). SelectPermanentEffect (canNoSelect) →
#     SuspendPermanentsClass by THIS effect → only if the target really became
#     suspended: SelectHandEffect (canNoSelect) over Digimon with
#     HasPlantTraits (Vegetation/Plant substring) or HasFairyTraits and
#     DP <= 3000 that can be played → PlayPermanentCards(payCost false).
#   - Inherited: OnTappedAnyone, IsOwnerTurn, own Digimon, IsByEffect,
#     maxCountPerTurn 1 → Draw 1. isOptional false.
#
# Rules: "By suspending ..." is an optional processing condition (§15-7-1);
# if it isn't executed the play can't happen (§15-7-2); it can't be chosen when
# no green Digimon of yours can suspend (§15-7-4 — the clause `condition`); it
# may be executed even when no hand card qualifies (§15-7-5 — the suspend pick
# is not gated on the hand).
#
# Modeling: optional own-permanent pick (decline = the whole effect is
# declined) → suspend → `effect_suspended_any_own_digimon` (DCGO's IsSuspended
# re-check: the suspend actually happened) → optional hand pick ("you may
# play") → `play_from_hand_free`. "in one of its traits" = `trait_contains`
# (DCGO ContainsTraits substring). The inherited clause is the EX6-004 /
# EX4-002 Kokomon shape.

card: BT10-048
name: Sunflowmon
kind: digimon
level: 4
color: [green]
cost: 4
dp: 3000
traits: [Vegetation]
form: Champion
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: green }
    cost: 2

effects:
  - when: when_digivolving
    optional: true
    condition:
      any_permanent:
        of: you
        zone: [battle_area]
        kind: digimon
        color_is: green
        is_unsuspended: true
    summary: "[When Digivolving] By suspending 1 of your green Digimon, you may play 1 Digimon card with [Vegetation], [Plant], or [Fairy] in one of its traits and 3000 DP or less from your hand without paying its play cost"
    process:
      - select_own_permanent:
          bind_as: suspend_cost
          optional: true
          filter:
            all_of:
              - kind: digimon
              - color_is: green
              - is_unsuspended: true
          prompt: "You may suspend 1 of your green Digimon"
      - if:
          condition: { binding_present: suspend_cost }
          then:
            - suspend: { target: suspend_cost }
            - if:
                condition: { effect_suspended_any_own_digimon: true }
                then:
                  - select_hand:
                      of: you
                      bind_as: play_pick
                      optional: true
                      filter:
                        all_of:
                          - kind: digimon
                          - dp_lte: 3000
                          - any_of:
                              - trait_contains: Vegetation
                              - trait_contains: Plant
                              - trait_contains: Fairy
                      prompt: "You may play 1 Digimon card with [Vegetation], [Plant], or [Fairy] in one of its traits and 3000 DP or less without paying its play cost"
                  - play_from_hand_free: { of: you, hand_index: play_pick }

  - scope: inherited
    when: on_suspend
    once_per_turn: true
    active_when: { your_turn: true }
    trigger_if:
      all_of:
        - event_target_owner: you
        - event_target_kind: digimon
        - event_is_effect_initiated: true
    summary: "[Your Turn][Once Per Turn] When an effect suspends one of your Digimon, <Draw 1>"
    process:
      - draw: { of: you, count: 1 }
