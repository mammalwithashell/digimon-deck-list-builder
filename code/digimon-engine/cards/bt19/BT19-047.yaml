card: BT19-047
name: Ballistamon
kind: digimon
level: 4
color: [black]
cost: 4
dp: 4000
traits: [Machine, Xros Heart]
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: black }
    cost: 3

effects:
  - kind: grant_keyword
    keyword: Save
    summary: "<Save>"

  - when: on_play
    summary: "[On Play] May digivolve into AtlurBallistamon under your Tamers without paying the cost"
    process:
      - select_under_tamer_sources:
          min: 0
          max: 1
          filter:
            name_contains: AtlurBallistamon
          bind_as: evo_source
          prompt: "Choose AtlurBallistamon under your Tamers to digivolve into"
          then:
            - effect_initiated_digivolve:
                target: source
                source: evo_source
                cost: free

  - scope: inherited
    kind: grant_keyword
    active_when:
      all_of:
        - opponents_turn: true
        - source_permanent_trait_has: "Xros Heart"
    keyword: Blocker
    summary: "Inherited: Xros Heart carrier gains Blocker on opponent's turn"
