# Printed image + official bundle BT19-042; DCGO BT19_042.cs confirms shared OPT.
# CR4.3 15-7-4/5: security payment optional, opponent empty security doesn't prevent it.
card: BT19-042
name: Dynasmon (X Antibody)
kind: digimon
level: 6
color: [yellow, red]
cost: 12
dp: 12000
traits: [Holy Warrior, X Antibody, Royal Knight]
form: Mega
attribute: Data
alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: yellow }
    cost: 4
  - kind: digivolve
    from: { level_eq: 5, color_is: red }
    cost: 4
  - kind: digivolve
    from: { name_is: Dynasmon }
    cost: 1

effects:
  - kind: grant_keyword
    keyword: Raid
  - kind: grant_keyword
    keyword: Blocker
  - when: [when_digivolving, when_attacking]
    optional: true
    once_per_turn: true
    active_when:
      all_of:
        - security_count_gte: 1
        - self_source_count:
            filter:
              any_of:
                - name_is: Dynasmon
                - name_is: X Antibody
            op: gte
            value: 1
    summary: "[When Digivolving][When Attacking][OPT] With Dynasmon/X Antibody source, by trashing top security, trash their top security and gain +6000 DP until their turn ends"
    process:
      - trash_top_security: { of: you, bind_count_as: paid_security }
      - if:
          condition: { equals: [paid_security, 1] }
          then:
            - trash_top_security: { of: opponent }
            - add_dp_modifier:
                target: source
                value: 6000
                expiry: end_of_opponents_turn
  - when: end_of_your_turn
    condition: { security_count_lte: 2 }
    summary: "[End of Your Turn] With 2 or fewer security cards, Recovery +1 Deck"
    process:
      - recover: { of: you, count: 1 }
