# BT19-070 Kimeramon — Digimon, Lv.5, Purple/Red, Cost 8, DP 8000.
# Traits: Composite. Attribute: Data.
#
# Printed card text (data/card_bundles/BT19-070.md — official Bandai DB,
# matches data/cards.json `effect_description_eng`):
#
#   [On Play] [When Digivolving] By deleting 1 of your Digimon, delete 1 of
#     your opponent's level 3 Digimon, 1 of their level 4 Digimon, and 1 of
#     their level 5 Digimon.
#   [On Deletion] By deleting 1 of your level 4 or lower purple or red
#     Digimon, you may play 1 [Machinedramon] from your trash without paying
#     the cost.
#
# Inherited Effect: <Security A. +1> (This Digimon checks 1 additional
#   security card.)
#
# Special digivolve condition (official Bandai DB): [Digivolve] Lv.4 w/
#   [Composite] trait: Cost 3.
# Standard digivolve circles (evo_costs in cards.json — not modeled here):
#   Purple Lv.4 / cost 4, Red Lv.4 / cost 4.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT19/Purple/BT19_070.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
#
# Alternate Digivolution (EffectTiming.None) —
#   AddSelfDigivolutionRequirementStaticEffect(PermanentCondition: TopCard.
#   IsLevel4 && ContainsTraits("Composite"), digivolutionCost: 3) →
#   alt_paths: kind: digivolve, from: { level_eq: 4, trait_has: Composite },
#   cost: 3.
#
# [On Play] / [When Digivolving] (both fire on OnEnterFieldAnyone,
#   SetUpActivateClass(..., -1, canDoNoAction: true, ...) → optional clause,
#   NOT once-per-turn):
#   1. SelectPermanentEffect over own battle-area Digimon, canNoSelect: true
#      → optional own-delete cost (select_own_permanent, optional: true).
#      Declining ends the clause (selectedPermanent == null skips
#      SuccessProcess) — modeled by making this the clause's first process
#      step so the inner PASS IS the decline path (no separate outer
#      accept/decline prompt installs; G-OUTER-OPTIONAL-NOT-INSTALLED).
#   2. On success: three SEQUENTIAL, INDEPENDENT SelectPermanentEffect picks
#      over the opponent's battle area, each gated by
#      HasMatchConditionPermanent(level == N) for N = 3, 4, 5. Each pick is
#      canNoSelect: false (mandatory once reached) but the WHOLE STEP is
#      skipped when no permanent at that level exists. Modeled as three
#      chained select_opponent_permanent (non-optional) + delete_permanent
#      pairs — the engine's install_select_opponent_permanent already
#      short-circuits (no prompt installs, tail does not run) when
#      candidates is empty, matching DCGO's per-level guard exactly with no
#      explicit `if` needed.
#
# [On Deletion] (EffectTiming.OnDestroyedAnyone):
#   1. SelectPermanentEffect over own battle-area Digimon with Level <= 4 and
#      (Purple || Red), canNoSelect: true → optional own-delete cost.
#   2. On success: SelectCardEffect over trash, EqualsCardName(
#      "Machinedramon"), canNoSelect: () => true → SEPARATELY optional
#      ("you may play") free play from trash. Modeled with `optional: true`
#      on the select_trash step so declining it independently skips the
#      play without re-deleting the own Digimon (the cost already resolved).
#
# Security Attack — ESS (EffectTiming.None):
#   ChangeSelfSAttackStaticEffect(changeValue: 1, isInheritedEffect: true) →
#   scope: inherited, kind: grant_keyword, keyword: SecurityAttackPlus,
#   value: 1.

card: BT19-070
name: Kimeramon
kind: digimon
level: 5
color: [purple, red]
cost: 8
dp: 8000
traits: [Composite]
attribute: Data

alt_paths:
  - kind: digivolve
    from:
      all_of:
        - level_eq: 4
        - trait_has: "Composite"
    cost: 3
  # DigiXros -1: 3 Lv.4 [Composite] trait Digimon cards with different card
  # numbers (DCGO AddDigiXrosConditionClass, 3 elements, reduceCostPerCard = 1,
  # CanTargetConditionByPreSelectedList dedupes on CardID). Dropped by the
  # lossy cards.json xros_req; sourced from the card image + BT19_070.cs.
  - kind: digixros
    materials:
      - filter:
          all_of:
            - kind: digimon
            - level_eq: 4
            - trait_has: "Composite"
        repeat: { min: 3, max: 3 }
        distinct_by: card_number
        cost_delta: -1
    cost: 8

effects:
  # ─── [On Play] / [When Digivolving] ────────────────────────────────────────
  #
  # "By deleting 1 of your Digimon, delete 1 of your opponent's level 3
  # Digimon, 1 of their level 4 Digimon, and 1 of their level 5 Digimon."
  - when: [on_play, when_digivolving]
    optional: true
    summary: "[On Play][When Digivolving] By deleting 1 of your Digimon, delete 1 opponent level 3, 1 level 4, and 1 level 5 Digimon"
    process:
      # Optional own-delete cost — the first step's own PASS is the decline
      # path for the whole clause (no separate outer confirm installs).
      - select_own_permanent:
          bind_as: own_target
          optional: true
          filter: { kind: digimon }
          prompt: "By deleting 1 of your Digimon, delete 1 of your opponent's level 3, level 4, and level 5 Digimon"
      - delete_permanent: { target: own_target }
      # Three independent, level-filtered opponent deletes. Each
      # select_opponent_permanent self-skips (no prompt, no delete) when no
      # candidate at that level exists — matching DCGO's per-level
      # HasMatchConditionPermanent guard with no explicit `if` needed.
      - select_opponent_permanent:
          bind_as: opp_l3
          filter:
            all_of:
              - kind: digimon
              - level_eq: 3
          prompt: "Delete 1 of your opponent's level 3 Digimon"
      - delete_permanent: { target: opp_l3 }
      - select_opponent_permanent:
          bind_as: opp_l4
          filter:
            all_of:
              - kind: digimon
              - level_eq: 4
          prompt: "Delete 1 of your opponent's level 4 Digimon"
      - delete_permanent: { target: opp_l4 }
      - select_opponent_permanent:
          bind_as: opp_l5
          filter:
            all_of:
              - kind: digimon
              - level_eq: 5
          prompt: "Delete 1 of your opponent's level 5 Digimon"
      - delete_permanent: { target: opp_l5 }

  # ─── [On Deletion] ──────────────────────────────────────────────────────────
  #
  # "By deleting 1 of your level 4 or lower purple or red Digimon, you may
  # play 1 [Machinedramon] from your trash without paying the cost."
  - when: on_deletion
    optional: true
    summary: "[On Deletion] By deleting 1 of your level 4 or lower purple or red Digimon, you may play 1 [Machinedramon] from trash free"
    process:
      # Optional own-delete cost, restricted to level <= 4 purple/red
      # Digimon. Declining is the whole clause's decline path.
      - select_own_permanent:
          bind_as: sac_target
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_lte: 4
              - any_of:
                  - color_is: purple
                  - color_is: red
          prompt: "By deleting 1 of your level 4 or lower purple or red Digimon, you may play 1 [Machinedramon] from your trash without paying the cost"
      - delete_permanent: { target: sac_target }
      # Separately optional ("you may play") free play of Machinedramon by
      # exact name from trash.
      - select_trash:
          of: you
          bind_as: mach_pick
          optional: true
          filter:
            all_of:
              - kind: digimon
              - name_is: "Machinedramon"
          prompt: "You may play 1 [Machinedramon] from your trash without paying the cost"
      - play_from_trash_free: { of: you, hand_index: mach_pick }

  # ─── Inherited <Security A. +1> ─────────────────────────────────────────────
  - scope: inherited
    kind: grant_keyword
    keyword: SecurityAttackPlus
    value: 1
