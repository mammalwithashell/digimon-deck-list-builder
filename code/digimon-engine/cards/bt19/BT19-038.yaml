card: BT19-038
name: JaegerDorulumon
kind: digimon
level: 5
color: [yellow, green]
cost: 7
dp: 7000
traits: [Beastkin, Xros Heart]
attribute: Virus

digixros_aliases: [Dorulumon]

alt_paths:
  - kind: digivolve
    from:
      all_of:
        - level_eq: 4
        - trait_has: "Xros Heart"
    cost: 3

effects:
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Suspend 1 opponent Digimon, then lock 1 opponent Digimon"
    process:
      - select_opponent_permanent:
          bind_as: suspend_target
          filter: { kind: digimon }
          prompt: "Suspend 1 of your opponent's Digimon"
      - suspend: { target: suspend_target }
      - select_opponent_permanent:
          bind_as: lock_target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon to prevent When Digivolving effects and unsuspend"
      - add_modifier:
          target: lock_target
          modifier: CannotActivateWhenDigivolvingEffects
          value: 1
          expiry: end_of_opponents_turn
      - add_modifier:
          target: lock_target
          modifier: CannotUnsuspend
          value: 1
          expiry: end_of_opponents_turn

  - when: on_deletion
    summary: "[On Deletion] Place 1 Xros Heart/Blue Flare Digimon from hand or trash under one of your Tamers"
    process:
      - select_own_permanent:
          bind_as: tamer
          optional: true
          filter: { kind: tamer }
          prompt: "Choose a Tamer to place a card under"
      - if:
          condition: { binding_present: tamer }
          then:
            - select_union_zone:
                of: you
                zones: [hand, trash]
                bind_as: stash
                filter:
                  all_of:
                    - kind: digimon
                    - any_of:
                        - trait_has: "Xros Heart"
                        - trait_has: "Blue Flare"
                prompt: "Place 1 Xros Heart or Blue Flare Digimon from hand or trash under the Tamer"
            - place_selected_card_under_tamer:
                card: stash
                tamer: tamer

  - scope: inherited
    kind: grant_keyword
    active_when:
      all_of:
        - your_turn: true
        - source_permanent_trait_has: "Xros Heart"
    keyword: Piercing
    summary: "Inherited: Xros Heart carrier gains Piercing on your turn"
