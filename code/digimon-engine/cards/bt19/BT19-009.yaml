card: BT19-009
name: Growlmon
kind: digimon
level: 4
form: Champion
attribute: Virus
color: [red]
cost: 5
dp: 5000
traits: [Dark Dragon]

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: red }
    cost: 2

effects:
  - text: "[When Digivolving] If you have 1 or fewer Tamers, you may play 1 [Takato Matsuki] from your hand without paying the cost."
    when: when_digivolving
    optional: true
    condition:
      count_lte:
        filter: { of: you, zone: [battle_area], kind: tamer }
        n: 1
    summary: "[When Digivolving] If <=1 Tamer, may play 1 [Takato Matsuki] from hand free"
    process:
      - select_hand:
          of: you
          bind_as: takato
          optional: true
          filter:
            all_of:
              - name_is: "Takato Matsuki"
              - can_play_from_effect_without_cost: true
          prompt: "You may play 1 [Takato Matsuki] from your hand without paying the cost"
      - if:
          condition: { binding_present: takato }
          then:
            - play_from_hand_free: { of: you, hand_index: takato }

  - text: "[All Turns] While you have 0 or less memory, add 2000 to this Digimon's DP deletion effects' maximums."
    kind: aura
    scope: inherited
    active_when:
      all_of:
        - all_turns: true
        - memory_lte: 0
    target: {}
    modifier: ChangeDPDeleteEffectMaxDP
    modifier_value: 2000
    summary: "[Inherited][All Turns] While memory <= 0, add 2000 to DP deletion effects' maximums"
