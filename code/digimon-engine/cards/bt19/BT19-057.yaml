card: BT19-057
name: Sparrowmon
kind: digimon
level: 3
color: [black, purple]
cost: 4
dp: 2000
traits: [Avian, Twilight, Xros Heart]
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 1
  - kind: digivolve
    from:
      all_of:
        - level_eq: 2
        - any_of:
            - trait_has: Twilight
            - trait_has: "Xros Heart"
    cost: 0

effects:
  - when: when_attacking
    summary: "[When Attacking] May digivolve into RaptorSparrowmon under your Tamers without paying the cost"
    process:
      - select_under_tamer_sources:
          min: 0
          max: 1
          filter:
            name_contains: RaptorSparrowmon
          bind_as: evo_source
          prompt: "Choose RaptorSparrowmon under your Tamers to digivolve into"
          then:
            - effect_initiated_digivolve:
                target: source
                source: evo_source
                cost: free

  - scope: inherited
    kind: grant_keyword
    active_when:
      all_of:
        - your_turn: true
        - source_permanent_trait_has: "Xros Heart"
    keyword: Collision
    summary: "Inherited: Xros Heart carrier gains Collision on your turn"
