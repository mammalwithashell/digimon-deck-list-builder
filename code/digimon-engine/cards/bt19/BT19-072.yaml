card: BT19-072
name: LordKnightmon
kind: digimon
level: 6
color: [purple, white]
cost: 11
dp: 11000
traits: ["Holy Warrior", "Royal Knight"]
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: purple }
    cost: 3

effects:
  - when: [on_play, when_digivolving]
    optional: true
    summary: "[On Play][When Digivolving] You may play 1 level 4 or lower Digimon from trash free"
    process:
      - select_trash:
          of: you
          bind_as: trash_pick
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_lte: 4
          prompt: "Play 1 level 4 or lower Digimon from trash"
      - play_from_trash_free: { of: you, hand_index: trash_pick }

