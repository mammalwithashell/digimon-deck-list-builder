card: BT19-055
name: Monitamon
kind: digimon
level: 3
form: Rookie
attribute: Data
color: [black]
cost: 3
dp: 1000
traits: [CRT, Twilight, Xros Heart]

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 0

effects:
  - text: "[On Deletion] Reveal the top 3 cards of your deck. Among them, add 1 card with [Knightmon] in its text or the [Twilight] trait to the hand and place 1 such card under your Tamers. Return the rest to the bottom of the deck."
    when: on_deletion
    summary: "[On Deletion] Reveal top 3; add 1 [Knightmon]-text/[Twilight] to hand and place 1 under a Tamer; rest to bottom"
    process:
      - reveal_top_deck: { of: you, count: 3 }
      - select_reveal:
          of: you
          bind_as: to_hand
          optional: false
          filter:
            any_of:
              - name_contains: Knightmon
              - rules_text_contains: Knightmon
              - trait_has: Twilight
          prompt: "Add 1 card with [Knightmon] in its text or the [Twilight] trait to your hand"
      - add_to_hand_from_reveal: { of: you, card: to_hand }
      - if:
          condition:
            any_permanent:
              of: you
              zone: [battle_area]
              kind: tamer
          then:
            - select_reveal:
                of: you
                bind_as: to_tamer
                optional: false
                filter:
                  any_of:
                    - name_contains: Knightmon
                    - rules_text_contains: Knightmon
                    - trait_has: Twilight
                prompt: "Place 1 card with [Knightmon] in its text or the [Twilight] trait under one of your Tamers"
            - if:
                condition: { binding_present: to_tamer }
                then:
                  - select_own_permanent:
                      optional: false
                      bind_as: tamer_host
                      filter: { kind: tamer }
                      prompt: "Choose 1 of your Tamers to place the revealed card under"
                  - place_as_bottom_source: { source: to_tamer, target: tamer_host }
      - place_remainder_on_deck: { of: you, position: bottom }

  - text: "＜Reboot＞"
    kind: grant_keyword
    scope: inherited
    keyword: Reboot
    summary: "[Inherited] <Reboot>"
