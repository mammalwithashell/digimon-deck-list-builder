card: BT19-075
name: MoonMillenniummon
kind: digimon
level: 7
color: [purple]
cost: 15
dp: 15000
traits: [Wicked God]
alt_paths:
  - kind: digivolve
    from: { level_eq: 6, color_is: purple }
    cost: 5
  - kind: digivolve
    from: { name_contains: "Millenniummon" }
    cost: 2

# Printed text:
# [On Play] [When Digivolving] Your opponent trashes cards in their hand until
# they have 5 left. For every 2 cards trashed by this effect, delete 1 of your
# opponent's Tamers.
# [All Turns] When this Digimon would leave the battle area, by deleting 1 of
# your Digimon with the [Composite] trait Digimon, it doesn't leave.
# [All Turns] [Once Per Turn] When other Digimon or Tamers are deleted, trash
# your opponent's top security card.
#
# Track E slice: the forced opponent hand-reduction verb + the Tamer-deletion
# result-count rider are now native YAML (G-DSL-TRASH-COUNT-RESULT-BINDING).
# Remaining card-local gaps:
# - Leave replacement needs Composite self-side delete cost plus replacement cancel.
# - Deleted observer body needs broad OnAnyDeletion fan-out/card-local tests.

effects:
  # ─── [On Play][When Digivolving] shared — trash to 5, delete floor(N/2) Tamers ─
  #
  # DCGO BT19_075.cs (two identical OnEnterFieldAnyone blocks):
  #   1. Opponent trashes `hand - 5` cards (mandatory, canNoSelect:false).
  #   2. `maxDeletes = min(floor(trashed/2), opponentTamerCount)`; the CARD's
  #      controller picks that many opponent Tamers to delete (mandatory), only
  #      when `trashed >= 2`.
  #
  # `bind_count_as: trashed` records the number ACTUALLY trashed; the downstream
  # `select_count_capped_multi.max` reads `floor(trashed / 2)`. When that is 0
  # (fewer than 2 trashed, or the no-op path) the select cleanly no-ops, matching
  # DCGO's `trashed.Count >= 2` guard. `clamp_to_available: true` mirrors
  # `min(.., opponentTamerCount)`.
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Opponent trashes hand to 5; delete 1 opp Tamer per 2 trashed"
    process:
      - trash_opponent_hand_to_count:
          opponent: opponent
          target_count: 5
          bind_count_as: trashed
      - select_count_capped_multi:
          of: opponent
          zone: battle_area
          max:
            formula:
              floor_div:
                - { binding_value: trashed }
                - 2
          clamp_to_available: true
          filter: { kind: tamer }
          bind_as: doomed_tamers
          prompt: "Choose opponent Tamers to delete"
          optional_zero: false
      - per_selected:
          selection: doomed_tamers
          bind_as: t
          body:
            - delete_permanent: { target: t }
