card: ST6-10
name: SkullSatamon
kind: digimon
level: 5
color: [purple]
cost: 6
dp: 7000
traits: [Undead]
form: Ultimate
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: purple }
    cost: 3

effects:
  - when: when_digivolving
    optional: true
    summary: "[When Digivolving] You may return 1 purple Digimon card from trash to hand"
    process:
      - select_trash:
          of: you
          bind_as: digimon_pick
          optional: true
          filter:
            all_of:
              - kind: digimon
              - color_is: purple
          prompt: "Return 1 purple Digimon card from your trash to your hand"
      - add_to_hand_from_trash: { of: you, card: digimon_pick }
