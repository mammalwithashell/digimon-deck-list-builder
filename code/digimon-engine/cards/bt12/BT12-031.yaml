# BT12-031 Imperialdramon: Fighter Mode — Digimon, Lv.6, Blue/Green, DP 13000, Cost 13.
# Traits: Ancient Dragonkin
# Evo: Lv.5 / Cost 5 (printed evo_costs: card_color: 1, level: 5, memory_cost: 5)
#
# Printed card text (data/cards.json — verbatim):
#
#   [When Digivolving] Suspend all of your opponent's Digimon with no
#   digivolution cards. Then, return 1 of your opponent's suspended Digimon to
#   its owner's hand. By returning 1 [Imperialdramon: Dragon Mode] from this
#   Digimon's digivolution cards to its owner's hand, return all of your
#   opponent's suspended Digimon at the bottom of their owners' decks instead.
#
#   [All Turns] This Digimon gets +1000 DP for each color in its digivolution
#   cards. While there are 2 or more colors in its digivolution cards, it gains
#   ＜Security A. +1＞ and ＜Blocker＞.
#
# Inherited effect text: (none)
#
# DCGO C# reference:
#   DCGO/Assets/Scripts/CardEffect/BT12/Blue/BT12_031.cs
#
# ─── Clause layout ────────────────────────────────────────────────────────────
#
# Clause 0 — [When Digivolving] suspend + return composite:
#   0a. for_each over opp Digimon with no divi-cards → suspend: IMPLEMENTED
#   0b. Return 1 opp suspended Digimon to hand: IMPLEMENTED
#   0c. Alt-cost: By returning 1 [Dragon Mode] from own divi-cards → return ALL
#       suspended to bottom of decks instead: BLOCKED G-DSL-COST-RETURN-SELF-DIGI-CARD-BY-NAME
#       (narrowed: selected own source refs cannot currently be returned to hand)
#
# Clause 1 — [All Turns] DP formula + conditional keyword aura:
#   1a. +1000 DP for each color in its digi cards: IMPLEMENTED
#   1b. While 2+ colors → Security A. +1 and Blocker: IMPLEMENTED via
#       `while_condition: { self_color_count_gte: 2 }`
#
# ─── Implementation status ────────────────────────────────────────────────────
#
# | Card-text element                                          | Status                 |
# |------------------------------------------------------------|-----------------------|
# | [When Digivolving] Suspend all opp Digimon with no digi-cards | IMPLEMENTED        |
# | [When Digivolving] Return 1 opp suspended Digimon to hand  | IMPLEMENTED           |
# | Alt-cost: Return Dragon Mode from digi-cards → return ALL to bottom | IMPLEMENTED   |
# | [All Turns] +1000 DP per color in digi-cards               | IMPLEMENTED           |
# | [All Turns] While 2+ colors: Security A. +1 + Blocker      | IMPLEMENTED           |
#
# ─── Alt-cost return-source-by-name-to-hand [G-DSL-COST-RETURN-SELF-DIGI-CARD-BY-NAME — CLOSED]
#
# Printed text (alt-cost branch):
#   "By returning 1 [Imperialdramon: Dragon Mode] from this Digimon's
#    digivolution cards to its owner's hand, return all of your opponent's
#    suspended Digimon at the bottom of their owners' decks instead."
#
# DCGO BT12_031.cs (EffectTiming.OnEnterFieldAnyone coroutine):
#   - CanSelectCardCondition gates on: cardSource.Owner == card.Owner &&
#       cardSource.CardNames.Contains("Imperialdramon: Dragon Mode") (with
#       space/colon variations for DCGO naming quirks).
#   - SelectCardEffect: canNoSelect: () => true (optional — player may skip).
#   - If player selects a Dragon Mode source card:
#       • AfterSelectCardCoroutine: return the selected source card to hand.
#       • Then: SelectPermanentEffect over ALL currently-suspended opp Digimon,
#         mode: BottomDeck (not Bounce). This replaces the Bounce step below.
#   - If player declines (canNoSelect → no card selected):
#       • SelectPermanentEffect over 1 opp suspended Digimon, mode: Bounce.
#
# Closure (2026-05-21, G-DSL-COST-RETURN-SELF-DIGI-CARD-BY-NAME):
#   - `return_selected_sources_to_hand` verb added — returns each
#     `select_own_sources`-bound digivolution source card to its OWNER's hand
#     (`EffectContext::return_card_source_to_hand`; a return, not a trash, so
#     no `OnDigivolutionCardTrashed` fires).
#   - The optional Dragon Mode pick is a `select_own_sources` with
#     `from: source`, `name_contains: "Imperialdramon: Dragon Mode"`,
#     `min: 0`, `max: 1`. Its `then:` tail branches on
#     `binding_count_eq: { dragon_mode_source, 1 }` — a count check (not
#     `binding_present`) because `select_own_sources` with `min: 0` inserts an
#     empty `SourceRefs` binding on decline, which `binding_present` would
#     read as present. count == 1 ⇒ alt outcome; count == 0 ⇒ base outcome.
#   - The base "return 1 opp suspended Digimon to hand" therefore moved INTO
#     the else branch — it is the fall-through outcome when the alt-cost is
#     declined, exactly as DCGO sequences it (the alt-cost replaces it).
#
# ─── Clause 1b — Self color-count conditional aura [self_color_count_gte] ─────
#
# Printed text (conditional aura):
#   "While there are 2 or more colors in its digivolution cards, it gains
#   ＜Security A. +1＞ and ＜Blocker＞."
#
# DCGO (EffectTiming.None declarative block):
#   ChangeSelfSAttackStaticEffect(changeValue: 1) and BlockerSelfStaticEffect
#   conditioned on the permanent's digivolution-stack color count >= 2.
#
# Authored as a self-aura with `while_condition: { self_color_count_gte: 2 }`,
# `security_attack: 1`, and `grant_keyword: { keyword: Blocker }`.
# `lower_self_while_condition` evaluates the `while_condition` predicate against
# the carrier permanent (PredicateSubject::Permanent), so `self_color_count_gte`
# resolves the permanent's synthesized top-card colors.
#
# Faithfulness note: `self_color_count_gte` counts the top card's distinct
# colors; DCGO's `DigivolutionColorCount` counts the full digivolution-stack
# color union. For BT12-031 these are always equal: the carrier of this
# self-aura always has BT12-031 (blue + green = 2 colors) as its top card, so
# both the top-card count and the full-stack union are permanently >= 2. The
# aura is therefore always active for any in-play BT12-031 — matching DCGO's
# behavior exactly for every reachable game state of this card.
#
# ─── Clause 0 — [When Digivolving] notes ─────────────────────────────────────
#
# DCGO (EffectTiming.OnEnterFieldAnyone, CanTriggerWhenDigivolving):
#   Step 1: Scan ALL opponent Digimon for HasNoDigivolutionCards. For each
#     match: SuspendPermanentsClass.Tap() (suspend without CanNotBe checks
#     on the effect, but with CanNotBeAffected on the permanent). This is a
#     for-each suspension — no selection, no order.
#   Step 2: SelectPermanentEffect over opp IsSuspended Digimon, maxCount 1,
#     canNoSelect: false (mandatory — Bounce mode). The printed "Then, return
#     1..." uses mandatory DCGO params.
#   Step 3 (optional alt-cost): SelectCardEffect over own digi-cards named
#     "Imperialdramon: Dragon Mode", canNoSelect: () => true (opt-in). If
#     player returns Dragon Mode → AfterSelectCard returns it to hand →
#     SelectPermanentEffect(BottomDeck, ALL suspended). Replaces step 2.
#
# Step 1 maps to `for_each` over `{ of: opponent, zone: [battle_area],
#   all_of: [kind: digimon, stack_size_lte: 1] }` → `suspend`.
#
# `stack_size_lte: 1` matches permanents with exactly 1 card_source (only the
# top card, no digivolution sources below it). The engine defines
# `Permanent::stack_size() = card_sources.len()`, and a freshly-played Digimon
# with no digivolution cards has `card_sources.len() == 1`.
#
# Step 3 (the optional Dragon Mode alt-cost) is offered BEFORE the base
# return-1-to-hand: a `select_own_sources` (min 0, max 1) over this Digimon's
# own digivolution sources named "Imperialdramon: Dragon Mode". Its `then:`
# branches:
#   - count == 1 (Dragon Mode picked): `return_selected_sources_to_hand` the
#     source, then `for_each` over ALL opp suspended Digimon →
#     `return_to_deck { position: bottom }` (the alt outcome — replaces step 2).
#   - count == 0 (declined / no Dragon Mode source): the base step 2 runs —
#     `select_opponent_permanent { is_suspended, kind: digimon } → return_to_hand`.
#
# ─── Clause 1a — [All Turns] +1000 DP per color in digi-cards ────────────────
#
# DCGO (EffectTiming.None, ChangeSelfDPStaticEffect):
#   changeValue closure = DigivolutionColorCount * 1000. The formula
#   `DigivolutionColorCount` counts distinct colors across all card_sources
#   in the stack (top card + all digivolution sources). This is the SAME
#   formula primitive used by BT18-102.yaml (Susanoomon) in its `dp_lte`
#   filter formula.
#
# DSL: `kind: aura, target: {} (self), active_when: { all_turns: true },
#   dp_modifier_fn: { base: 0, per: digivolution_color_count, delta: 1000 }`.
# `digivolution_color_count` is `CompiledPerSelector::DigivolutionColorCount`
# (formula.rs:134), evaluated at `formula_eval.rs:323-336` as a u8 bitmask
# popcount across the permanent's card_sources. For a self-aura, the formula
# is evaluated with `self_only == true` (lower_aura.rs:163-165), so it reads
# the source permanent's own stack — exactly the printed "in its digi cards".

card: BT12-031
name: "Imperialdramon: Fighter Mode"
kind: digimon
level: 6
color: [blue, green]
cost: 13
dp: 13000
traits: [Ancient Dragonkin]

effects:
  # ─── Clause 0 — [When Digivolving] suspend + return ──────────────────────────
  #
  # Printed: "[When Digivolving] Suspend all of your opponent's Digimon with no
  # digivolution cards. Then, return 1 of your opponent's suspended Digimon to
  # its owner's hand. By returning 1 [Imperialdramon: Dragon Mode] from this
  # Digimon's digivolution cards to its owner's hand, return all of your
  # opponent's suspended Digimon at the bottom of their owners' decks instead."
  #
  # Step A — for_each over opp Digimon with no divi-cards → suspend:
  #   `stack_size_lte: 1` = exactly 1 card_source (the top card only, no
  #   digivolution cards below it) — i.e., "no digivolution cards."
  #   DCGO uses `permanent.HasNoDigivolutionCards` which is defined as
  #   `DigivolutionCards.Count == 0`; the engine equivalent is
  #   `card_sources.len() == 1` (stack_size == 1).
  #
  # Step B — optional alt-cost Dragon Mode pick (offered before the base
  #   return-1-to-hand, matching DCGO's SelectCardEffect canNoSelect: () => true):
  #   `select_own_sources` (min 0, max 1) over THIS Digimon's own digivolution
  #   sources named "Imperialdramon: Dragon Mode". The `then:` tail branches on
  #   `binding_count_eq: { dragon_mode_source, 1 }`:
  #     - count == 1 (alt-cost paid): `return_selected_sources_to_hand` the
  #       Dragon Mode source to its owner's hand, then `for_each` over ALL opp
  #       suspended Digimon → `return_to_deck { position: bottom }`.
  #     - count == 0 (declined / no Dragon Mode source available): the base
  #       "return 1 opp suspended Digimon to hand" runs — `select_opponent_permanent`
  #       (mandatory, matching DCGO canNoSelect: false) → `return_to_hand`.
  #
  #   `binding_count_eq` (not `binding_present`) is required: a `select_own_sources`
  #   with `min: 0` inserts an empty `SourceRefs` binding on decline, which
  #   `binding_present` reads as present. The count check is the faithful gate.
  - when: when_digivolving
    summary: "[When Digivolving] Suspend all opp Digimon with no digi-cards; optionally return Dragon Mode source → bottom-deck all opp suspended, else return 1 opp suspended Digimon to hand"
    process:
      # Step A: suspend all opp Digimon with no digivolution cards.
      # `for_each` over opponent battle-area Digimon with stack_size_lte: 1.
      - for_each:
          over:
            all_of:
              - of: opponent
              - zone: [battle_area]
              - kind: digimon
              - stack_size_lte: 1
          bind_as: no_digi_target
          body:
            - suspend: { target: no_digi_target }

      # Step B: optional alt-cost — offer to return 1 [Imperialdramon: Dragon
      # Mode] from this Digimon's own digivolution cards to its owner's hand.
      # `select_own_sources` SKIPS its `then:` tail entirely when there are no
      # own source candidates (selections.rs `has_own_source_candidates`
      # gate), so the alt-cost-paid outcome lives in `then:`, but the base
      # outcome (Step C below) is a SEPARATE top-level step gated on the
      # binding count — it must run whether or not Step B was even offered.
      - select_own_sources:
          from: source
          min: 0
          max: 1
          filter:
            name_contains: "Imperialdramon: Dragon Mode"
          bind_as: dragon_mode_source
          prompt: "By returning 1 [Imperialdramon: Dragon Mode] from this Digimon's digivolution cards to its owner's hand, return all opponent's suspended Digimon to the bottom of their decks instead"
          then:
            - if:
                condition:
                  binding_count_eq:
                    binding: dragon_mode_source
                    n: 1
                then:
                  # Alt-cost paid: return the Dragon Mode source to its
                  # owner's hand, then bottom-deck ALL opp suspended Digimon.
                  - return_selected_sources_to_hand:
                      source_refs: dragon_mode_source
                  - for_each:
                      over:
                        all_of:
                          - of: opponent
                          - zone: [battle_area]
                          - kind: digimon
                          - is_suspended: true
                      bind_as: all_suspended
                      body:
                        - return_to_deck:
                            target: all_suspended
                            position: bottom

      # Step C: base outcome — return 1 opp suspended Digimon to its owner's
      # hand. Runs only when the alt-cost was NOT paid: `binding_count_eq` with
      # n: 0 is true both when `dragon_mode_source` is absent (Step B skipped —
      # no own source candidates) and when it is present-but-empty (the
      # optional pick was declined). When the alt-cost WAS paid the binding
      # holds 1 ref, count != 0, and this base outcome is skipped — the
      # printed "instead" replacement semantics.
      - if:
          condition:
            binding_count_eq:
              binding: dragon_mode_source
              n: 0
          then:
            - select_opponent_permanent:
                bind_as: suspended_target
                filter:
                  all_of:
                    - kind: digimon
                    - is_suspended: true
                prompt: "Return 1 of your opponent's suspended Digimon to its owner's hand"
            - return_to_hand: { target: suspended_target }

  # ─── Clause 1a — [All Turns] +1000 DP per color in digi-cards ───────────────
  #
  # Printed text:
  #   "[All Turns] This Digimon gets +1000 DP for each color in its
  #    digivolution cards."
  #
  # DSL: self-aura with `dp_modifier_fn` using `digivolution_color_count`.
  # The formula evaluates as `distinct-color-count across card_sources * 1000`.
  # DCGO: ChangeSelfDPStaticEffect(changeValue: DigivolutionColorCount * 1000).
  # Lower: `self_only == true` in `dynamic_formula_fn` ensures the formula
  # reads the SOURCE permanent's own stack (not filtered by target predicate).
  #
  # NOTE on `active_when`: DCGO uses `EffectTiming.None` (declarative), which
  # is always active. The printed "[All Turns]" mirrors DCGO behavior:
  # active_when: { all_turns: true } in the DSL. However for self-auras, the
  # condition closure is installed by `builder.condition(...)` (lower_aura.rs:48)
  # which evaluates `active_when` as a PredicateSubject::None predicate at tick
  # time. The `all_turns` predicate always returns true. This is correct.
  - kind: aura
    target: {}
    active_when: { all_turns: true }
    dp_modifier_fn:
      base: 0
      per: digivolution_color_count
      delta: 1000
    summary: "[All Turns] +1000 DP per color in own digi-cards (DigivolutionColorCount formula)"

  # ─── Clause 1b — [All Turns] While 2+ colors: Security A. +1 + Blocker ───────
  #
  # Printed text:
  #   "While there are 2 or more colors in its digivolution cards, it gains
  #    ＜Security A. +1＞ and ＜Blocker＞."
  #
  # Self-aura installed once at field-entry (OnPlay / OnDigivolve) with
  # `Expiry::UntilCondition` carrying `self_color_count_gte: 2`. The
  # `while_condition` predicate is evaluated against the carrier permanent
  # (PredicateSubject::Permanent), so `self_color_count_gte` reads the
  # synthesized top-card colors. BT12-031's top card is permanently blue+green
  # (2 colors), so the condition holds for every reachable state — identical to
  # DCGO's full-stack `DigivolutionColorCount >= 2` for this card. Both the
  # flat `security_attack: 1` and the Blocker keyword install under the one
  # `while_condition` gate.
  - kind: aura
    target: {}
    while_condition:
      self_color_count_gte: 2
    security_attack: 1
    grant_keyword:
      keyword: Blocker
    summary: "[All Turns] While 2+ colors in digi-cards: Security A. +1 and Blocker"
