card: BT12-059
name: Agumon
kind: digimon
level: 3
color: [black, red]
cost: 3
dp: 2000
traits: [Reptile]

# ─── Alternate Digivolution Path ─────────────────────────────────────────────
#
# Printed alt-digivolve: "[Digivolve] [Koromon]: Cost 0".
# DCGO (BT12_059.cs, EffectTiming.None, AddSelfDigivolutionRequirementStaticEffect):
#   permanentCondition: targetPermanent.TopCard.CardNames.Contains("Koromon")
#   digivolutionCost: 0, ignoreDigivolutionRequirement: false
#
# When the digivolution source's top card name contains "Koromon", you may
# digivolve into BT12-059 for cost 0 (normal level/color requirements still
# apply through the engine — `ignore_requirements` is false in DCGO, so we omit
# the override here). The standard Lv2/Black/cost-1 path is the printed
# `evo_costs` entry and is handled by the engine's default digivolution flow.
alt_paths:
  - kind: digivolve
    from: { name_contains: "Koromon" }
    cost: 0

effects:
  # ─── Clause 1 — [On Play] reveal 4 + two-bucket selection ────────────────
  #
  # Printed text:
  #   "[On Play] Reveal the top 4 cards of your deck. Add 1 Digimon card with
  #   [Greymon] or [Omnimon] in its name and 1 Tamer card with [Tai Kamiya]
  #   in its name among them to your hand. Place the remaining cards at the
  #   bottom of your deck in any order."
  #
  # DCGO (BT12_059.cs, EffectTiming.OnEnterFieldAnyone):
  #   - SimplifiedRevealDeckTopCardsAndSelect(revealCount: 4, ...)
  #   - Bucket 1 (CanSelectCardCondition):  IsDigimon && (HasGreymonName ||
  #                                          ContainsCardName("Omnimon")),
  #                                          message "Select 1 Digimon card
  #                                          with [Greymon] or [Omnimon] in
  #                                          its name.", maxCount 1.
  #   - Bucket 2 (CanSelectCardCondition1): IsTamer && ContainsCardName("Tai Kamiya"),
  #                                          message "Select 1 Tamer card with
  #                                          [Tai Kamiya] in its name.",
  #                                          maxCount 1.
  #   - mutualConditions: true → no card may satisfy both buckets.
  #     `no_duplicate_cards: true` enforces this.
  #   - remainingCardsPlace: DeckBottom → trailing
  #     `place_remainder_on_deck { position: bottom }` step.
  #
  # CanActivateCondition: IsExistOnBattleArea(card) && Owner.LibraryCards.Count >= 1.
  # The "library has any cards" guard is implicit in `reveal_top_deck` (it
  # reveals up to `count`, capped at deck size), so no explicit DSL condition
  # is needed.
  - when: on_play
    summary: "[On Play] Reveal 4; add one Greymon/Omnimon Digimon and one Tai Kamiya Tamer"
    process:
      - reveal_top_deck: { of: you, count: 4, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          buckets:
            - bind_as: greymon_or_omnimon_pick
              min: 1
              max: 1
              filter:
                all_of:
                  - kind: digimon
                  - any_of:
                      - name_contains: "Greymon"
                      - name_contains: "Omnimon"
            - bind_as: tai_kamiya_pick
              min: 1
              max: 1
              filter:
                all_of:
                  - kind: tamer
                  - name_contains: "Tai Kamiya"
          no_duplicate_cards: true
          prompt: "Select 1 [Greymon]/[Omnimon] Digimon and 1 [Tai Kamiya] Tamer"
      - add_to_hand_from_reveal: { of: you, card: greymon_or_omnimon_pick }
      - add_to_hand_from_reveal: { of: you, card: tai_kamiya_pick }
      - place_remainder_on_deck: { of: you, position: bottom }

  # ─── Clause 2 — Inherited [All Turns] +1000 DP if name contains Greymon/Omnimon ─
  #
  # Printed text (inherited):
  #   "[All Turns] While this Digimon has [Greymon] or [Omnimon] in its name,
  #   it gets +1000 DP."
  #
  # DCGO (BT12_059.cs, EffectTiming.None, ChangeSelfDPStaticEffect):
  #   - isInheritedEffect: true
  #   - changeValue: +1000
  #   - condition: IsExistOnBattleArea(card)
  #               && (card.PermanentOfThisCard().TopCard.HasGreymonName
  #                   || card.PermanentOfThisCard().TopCard.ContainsCardName("Omnimon"))
  #
  # DSL mapping:
  #   - `scope: inherited` — the effect is active when BT12-059 is a source
  #     under another permanent.
  #   - `target: {}` — self aura: the +1000 DP attaches to the carrier (the
  #     permanent BT12-059 is stacked under), via the static `dp_modifier`
  #     field that `Game::source_dp_contribution` reads.
  #   - `active_when` uses `self_digivolution_contains_name` to scan the
  #     carrier's full source stack for a card whose name contains
  #     "Greymon" or "Omnimon". Because BT12-059 itself is named "Agumon",
  #     the predicate is only satisfied when a Greymon-named or Omnimon-named
  #     card has digivolved on top of (or as a material in the stack of)
  #     BT12-059 — exactly the DCGO `TopCard.HasGreymonName` semantics for
  #     this Lv3 source slot.
  #   - `all_turns: true` encodes the [All Turns] scope.
  - scope: inherited
    kind: aura
    active_when:
      all_of:
        - all_turns: true
        - any_of:
            - self_digivolution_contains_name: "Greymon"
            - self_digivolution_contains_name: "Omnimon"
    target: {}
    dp_modifier: 1000
    summary: "[Inherited][All Turns] +1000 DP while carrier name contains Greymon or Omnimon"
