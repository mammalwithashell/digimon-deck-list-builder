# BT12-021 Veemon — Digimon, Lv.3, Blue, DP 1000, Cost 3.
# Traits: Mini Dragon.
# Standard digivolution: Lv2 Blue / Cost 0 (printed evo_costs).
#
# Printed effect text (cards.json effect_text):
#
#   [On Play] Reveal the top 3 cards of your deck. Add 1 Digimon card with
#   [Imperialdramon] in its name or the [Free] trait and 1 Tamer card with
#   [Davis Motomiya] in its name among them to your hand. Place the rest at
#   the bottom of your deck in any order.
#
# Printed inherited effect text (cards.json inherited_text):
#
#   [End of Your Turn] This Digimon and any of your other Digimon may DNA
#   digivolve into a Digimon card in the hand.
#
# DCGO C# reference:
#   DCGO/Assets/Scripts/CardEffect/BT12/Blue/BT12_021.cs
#
# ─── DCGO crosscheck ────────────────────────────────────────────────────────
#
# Clause 1 — `EffectTiming.OnEnterFieldAnyone` activate gated by
#   `CardEffectCommons.CanTriggerOnPlay(hashtable, card)` AND
#   `IsExistOnBattleArea(card) && Owner.LibraryCards.Count >= 1`.
#   Coroutine: `SimplifiedRevealDeckTopCardsAndSelect(revealCount: 3, ...)` with
#   two buckets:
#     - Bucket 1: `IsDigimon && (ContainsCardName("Imperialdramon") ||
#         CardTraits.Contains("Free"))`,
#         message "Select 1 Digimon card with [Imperialdramon] in its name
#         or a [Free] trait.", mode AddHand, maxCount 1.
#     - Bucket 2: `IsTamer && ContainsCardName("Davis Motomiya")`,
#         message "Select 1 Tamer card with [Davis Motomiya] in its name.",
#         mode AddHand, maxCount 1.
#     - `mutualConditions: true` → no card may satisfy both buckets
#       (`no_duplicate_cards: true`).
#     - `remainingCardsPlace: RemainingCardsPlace.DeckBottom`.
#   `SetUpActivateClass(..., -1, false, ...)` — outer trigger NOT optional.
#
# Clause 2 — `EffectTiming.OnEndTurn` with `SetIsInheritedEffect(true)`.
#   `SetUpActivateClass(..., -1, true, ...)` — isOptional: true.
#   `DNADigivolvePermanentsIntoHandOrTrashCard(...)` with `isHand: true`.
#   Encoded via the resolved `alt_path_registration` declarative
#   (RESOLVED 2026-05-02 in qa/dsl-vocab-gaps.md).
#
# ─── Source-priority audit (printed text vs DCGO) ───────────────────────────
#
# Clause 1: Printed has no "you may" → outer trigger mandatory. DCGO
# `isOptional: false` confirms. Each bucket is mandatory IF a matching card
# is in the reveal (DCGO single-bucket maxCount: 1 with no canNoSelect);
# resolves silently when no candidate exists. `min: 1, max: 1` per bucket
# captures this.
#
# Clause 2: Printed "may DNA digivolve" → optional. DCGO `isOptional: true`.
# Encoded via `alt_path_registration` declarative — DNA digivolve is always
# an opt-in player action through the alt-path framework.
#
# ─── Sister cards ────────────────────────────────────────────────────────────
#
# Clause 1 shape: mirrors BT12-059 (Agumon) — same reveal-N two-bucket
# pattern but reveals 3 instead of 4 and places remainder at bottom
# (not top). The [Imperialdramon] OR [Free] bucket uses `any_of` over
# `name_contains` and `trait_has`, consistent with the DCGO
# `ContainsCardName("Imperialdramon") || CardTraits.Contains("Free")`
# predicate.
#
# Clause 2 shape: identical to BT17-019 (Gabumon, Matt Ishida) —
# inherited [End of Your Turn] DNA digivolve registration via
# `alt_path_registration`.

card: BT12-021
name: Veemon
kind: digimon
level: 3
color: [blue]
cost: 3
dp: 1000
traits: [Mini Dragon]

effects:
  # ─── Clause 1: [On Play] reveal-3, two buckets, bottom remainder ──────────
  #
  # Printed text:
  #   "[On Play] Reveal the top 3 cards of your deck. Add 1 Digimon card with
  #   [Imperialdramon] in its name or the [Free] trait and 1 Tamer card with
  #   [Davis Motomiya] in its name among them to your hand. Place the rest at
  #   the bottom of your deck in any order."
  #
  # Bucket 1: Digimon with [Imperialdramon] in name OR [Free] trait.
  # Bucket 2: Tamer with [Davis Motomiya] in name.
  # `no_duplicate_cards: true` enforces DCGO's `mutualConditions: true`.
  # `place_remainder_on_deck { position: bottom }` — remainder to bottom.
  - when: on_play
    summary: "[On Play] Reveal 3; add one Imperialdramon/Free Digimon and one Davis Motomiya Tamer; bottom the rest"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          buckets:
            - bind_as: imperialdramon_or_free_pick
              min: 1
              max: 1
              filter:
                all_of:
                  - kind: digimon
                  - any_of:
                      - name_contains: "Imperialdramon"
                      - trait_has: "Free"
            - bind_as: davis_motomiya_pick
              min: 1
              max: 1
              filter:
                all_of:
                  - kind: tamer
                  - name_contains: "Davis Motomiya"
          no_duplicate_cards: true
          prompt: "Select 1 [Imperialdramon] or [Free] Digimon and 1 [Davis Motomiya] Tamer"
      - add_to_hand_from_reveal: { of: you, card: imperialdramon_or_free_pick }
      - add_to_hand_from_reveal: { of: you, card: davis_motomiya_pick }
      - place_remainder_on_deck: { of: you, position: bottom }

  # ─── Clause 2 — Inherited [End of Your Turn] inline DNA digivolve ─────────
  #
  # Printed: "[End of Your Turn] This Digimon and any of your other Digimon
  # may DNA digivolve into a Digimon card in the hand."
  #
  # G-DSL-EOT-DNA-INLINE (2026-05-24): authored via `may_dna_digivolve_now`
  # step so the DNA-digivolve choice surfaces AT end-of-turn (matches DCGO
  # `EffectTiming.OnEndTurn` activate). Predecessor `alt_path_registration
  # { kind: dna_digivolve }` (resolved 2026-05-02) registered a next-turn
  # alt-path and so could not satisfy the printed "AT end of turn" surface.
  # Target filter is open (any own Digimon card in hand) per printed text —
  # no name restriction.
  - when: end_of_your_turn
    scope: inherited
    optional: true
    summary: "[EoT] This Digimon and any of your other Digimon may DNA digivolve into a Digimon card in the hand"
    process:
      - may_dna_digivolve_now:
          partner_filter:
            all_of:
              - of: you
              - kind: digimon
          target_filter:
            all_of:
              - of: you
              - kind: digimon
          cost: 0
          ignore_requirements: true
          optional: true
          prompt: "DNA digivolve at end of turn?"
