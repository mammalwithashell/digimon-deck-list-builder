card: BT12-055
name: Dinobeemon
kind: digimon
level: 5
form: Ultimate
attribute: Free
color: [green, blue]
cost: 8
dp: 8000
traits: [Mutant]

alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: green }
    cost: 4
  - kind: digivolve
    from: { level_eq: 4, color_is: blue }
    cost: 4
  - kind: dna_digivolve
    materials:
      - { level_eq: 4, color_is: blue }
      - { level_eq: 4, color_is: green }
    cost: 0
    stacks_unsuspended: true

effects:
  - text: "[When Digivolving] If DNA digivolving, suspend 1 of your opponent's Digimon, and this Digimon gets +3000 DP for the turn. Then, this Digimon may attack an opponent's Digimon."
    when: when_digivolving
    condition: { dna_origin: true }
    summary: "[WD] If DNA digivolving, suspend 1 opponent Digimon, +3000 DP for turn, then may attack an opponent's Digimon"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: susp_target
          filter: { kind: digimon }
          prompt: "Suspend 1 of your opponent's Digimon"
      - suspend: { target: susp_target }
      - add_dp_modifier:
          target: source
          value: 3000
          expiry: end_of_turn
      - may_attack_now:
          attacker: source
          targets: digimon
          optional: true

  - text: "[Your Turn][Once Per Turn] When one of your Digimon with [Imperialdramon] in its name or the [Free] trait deletes an opponent's Digimon in battle, trash the top card of your opponent's security stack."
    scope: inherited
    when: on_ally_won_battle
    once_per_turn: true
    active_when: { your_turn: true }
    trigger_if:
      event_battle_deleter:
        owner: you
        kind: digimon
        any_of:
          - name_contains: Imperialdramon
          - trait_has: Free
    summary: "[Inherited][Your Turn][OPT] When your [Imperialdramon]/[Free] Digimon deletes an opponent Digimon in battle, trash opp top security"
    process:
      - trash_top_security: { of: opponent, count: 1 }
