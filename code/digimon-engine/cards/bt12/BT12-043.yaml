# BT12-043 ShineGreymon — Digimon, Lv.6, Yellow/Red, DP 12000, Cost 12.
# Traits: Light Dragon. Form: Mega. Attribute: Vaccine.
# Standard digivolve (official Bandai DB, data/card_bundles/BT12-043.md):
#   Yellow Lv.5 / cost 4, Red Lv.5 / cost 4.
#
# Printed card text (official — data/card_bundles/BT12-043.md, verbatim):
#
#   Digivolve: 3 from Lv.5 w/[RizeGreymon] in name
#
#   [When Digivolving] For each yellow and/or red Tamer you have in play,
#   1 of your opponent's Digimon and all of your opponent's Security
#   Digimon get -3000 DP for the turn.
#   [Your Turn] All of your [Marcus Damon] in play get +3000 DP and gain
#   ＜Security A. +1＞ (This Digimon checks 1 additional security card.)
#
# Official Q&A (data/card_bundles/BT12-043.md):
#   "No, you can't [choose 2]. You choose 1 of your opponent's Digimon,
#   then that Digimon and all security Digimon get -3000 DP for each of
#   your yellow or red Tamers." — confirms exactly ONE opponent Digimon is
#   selected; the security debuff is a separate, unconditional half of the
#   same clause (both scaled by the same per-Tamer count).
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT12/Yellow/BT12_043.cs
#
# ─── DCGO crosscheck (per clause) ───────────────────────────────────────────
#
# Region `EffectTiming.None` — `AddSelfDigivolutionRequirementStaticEffect(
#   permanentCondition: TopCard.ContainsCardName("RizeGreymon") &&
#   TopCard.HasLevel && TopCard.Level == 5, digivolutionCost: 3,
#   ignoreDigivolutionRequirement: false)`.
#   → alt_paths: kind: digivolve, from: { level_eq: 5,
#     name_contains: "RizeGreymon" }, cost: 3.
#
# Region `EffectTiming.OnEnterFieldAnyone` — `ActivateClass`:
#   `CanUseCondition` = `CanTriggerWhenDigivolving` (fires on THIS
#   permanent's own digivolution).
#   `CanActivateCondition`: `IsExistOnBattleArea(card)` AND count of own
#   battle-area permanents that are Tamers AND (Yellow OR Red colored) >= 1.
#   `ActivateCoroutine`: recompute `count` (same predicate); `minusDP =
#   3000 * count`.
#     (a) If ANY opponent battle-area Digimon exists
#         (`HasMatchConditionPermanent`), install a MANDATORY
#         (`canNoSelect: false`, `maxCount: Min(1, candidateCount)`) single
#         selection over opponent battle-area Digimon, then
#         `ChangeDigimonDP(targetPermanent, -minusDP,
#         EffectDuration.UntilEachTurnEnd)`.
#     (b) THEN, UNCONDITIONALLY (not gated on (a) having a candidate or
#         having fired) — `ChangeSecurityDigimonCardDPPlayerEffect(
#         cardCondition: cardSource.Owner == card.Owner.Enemy, -minusDP,
#         EffectDuration.UntilEachTurnEnd)`: every opponent Security
#         Digimon gets -minusDP for the turn.
#   → when: when_digivolving; condition: any_permanent{of: you, kind:
#     tamer, any_of[color_is: yellow, color_is: red]}; process:
#     [select_opponent_permanent(mandatory, kind: digimon) ->
#     add_dp_modifier(formula, expiry: end_of_turn),
#     add_player_modifier(target_player: opponent, modifier:
#     ChangeOwnSecurityDigimonDp, value: formula, expiry: end_of_turn)].
#   `UntilEachTurnEnd` → `expiry: end_of_turn` (ST1-14 / BT25-018 idiom).
#   The top-level `select_opponent_permanent` + `add_dp_modifier` pair
#   silently no-ops when no opponent Digimon candidate exists (BT12-016 /
#   AD1-016 idiom — "empty mandatory select is skipped"), matching DCGO's
#   `HasMatchConditionPermanent` gate on the select alone; the
#   `add_player_modifier` step below it is unconditional and always runs
#   once the outer Tamer-count gate holds, matching DCGO's unconditional
#   (b).
#
# Region `EffectTiming.None` x2 — two separate DCGO static effects, both
#   gated by `IsExistOnBattleArea(card) && IsOwnerTurn(card)`, with
#   `permanentCondition` = own battle-area permanent whose top card's
#   `CardNames` contains "Marcus Damon" (DCGO also checks the no-space
#   "MarcusDamon" alias — a defensive C#-side alternate spelling, not a
#   second printed name; the printed name "Marcus Damon" is the only
#   authoritative match target):
#     - `CardEffectFactory.ChangeDPStaticEffect(changeValue: 3000, ...)`
#       → declarative Aura: active_when: { your_turn: true }, target: {
#         owner: you, name_contains: "Marcus Damon" }, dp_modifier: 3000.
#     - `CardEffectFactory.ChangeSAttackStaticEffect(changeValue: 1, ...)`
#       → declarative Aura: active_when: { your_turn: true }, target: {
#         owner: you, name_contains: "Marcus Damon" }, grant_keyword: {
#         keyword: SecurityAttackPlus, value: 1 }.
#   Authored as two separate clauses (BT5-093 idiom) rather than merging
#   dp_modifier + grant_keyword into one clause — mirrors DCGO's two
#   independent static-effect installs faithfully.
#
# ─── Implementation status (faithfulness diff) ──────────────────────────────
#
# | Card-text element                                                | Status |
# |--------------------------------------------------------------------|------|
# | Std digivolve Yellow Lv.5 / cost 4, Red Lv.5 / cost 4             | PARTIAL — data gap, not this YAML: data/cards.json evo_costs carries ONLY the Yellow Lv.5/cost4 circle (API-ingest drop, same class as the BG Imperial evo-cost colour gap); Red circle missing until data/card_overrides.json is patched. Standard digivolve is data-driven (not authored here) per sibling convention (BT12-016 et al.) |
# | Alt-digivolve: 3 from Lv.5 w/[RizeGreymon] in name                | IMPLEMENTED (alt_paths digivolve, name_contains, cost 3) |
# | [WD] gate: >=1 own yellow/red Tamer                                | IMPLEMENTED (condition: any_permanent tamer + color any_of) |
# | [WD] select+debuff 1 opp Digimon -3000×count DP for the turn      | IMPLEMENTED (select_opponent_permanent + add_dp_modifier formula, expiry end_of_turn) |
# | [WD] all opp Security Digimon -3000×count DP for the turn         | IMPLEMENTED (add_player_modifier ChangeOwnSecurityDigimonDp, target_player: opponent, formula, expiry end_of_turn) |
# | [Your Turn] own [Marcus Damon] +3000 DP                           | IMPLEMENTED (declarative Aura, active_when your_turn, name_contains) |
# | [Your Turn] own [Marcus Damon] gain <Security A. +1>              | IMPLEMENTED (declarative Aura, grant_keyword SecurityAttackPlus 1) |

card: BT12-043
name: ShineGreymon
kind: digimon
level: 6
color: [yellow, red]
cost: 12
dp: 12000
traits: [Light Dragon]
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from:
      all_of:
        - level_eq: 5
        - name_contains: "RizeGreymon"
    cost: 3

effects:
  # ─── [When Digivolving] gated on >=1 own yellow/red Tamer ────────────────
  # For each yellow and/or red Tamer you have in play:
  #   (a) select 1 opp Digimon (mandatory when a candidate exists) and give
  #       it -3000×count DP for the turn;
  #   (b) unconditionally give all opp Security Digimon -3000×count DP for
  #       the turn.
  - when: when_digivolving
    summary: "[When Digivolving] For each yellow/red Tamer you control, give 1 opp Digimon and all opp Security Digimon -3000 DP for the turn"
    condition:
      any_permanent:
        of: you
        zone: [battle_area]
        kind: tamer
        any_of:
          - color_is: yellow
          - color_is: red
    process:
      # (a) Mandatory single-target debuff — silently skipped if the
      # opponent has no battle-area Digimon (BT12-016 / AD1-016 idiom).
      - select_opponent_permanent:
          bind_as: dp_target
          filter: { kind: digimon }
          prompt: "Give -3000 DP per your yellow/red Tamer to 1 opponent Digimon"
      - add_dp_modifier:
          target: dp_target
          value:
            formula:
              base: 0
              per:
                card_count_in_zone:
                  of: you
                  zone: battle_area
                  filter:
                    all_of:
                      - kind: tamer
                      - any_of:
                          - color_is: yellow
                          - color_is: red
              delta: -3000
          expiry: end_of_turn
      # (b) Unconditional opponent-security debuff (fires regardless of
      # whether (a) had a candidate — matches DCGO's independent second call).
      - add_player_modifier:
          target_player: opponent
          modifier: ChangeOwnSecurityDigimonDp
          value:
            formula:
              base: 0
              per:
                card_count_in_zone:
                  of: you
                  zone: battle_area
                  filter:
                    all_of:
                      - kind: tamer
                      - any_of:
                          - color_is: yellow
                          - color_is: red
              delta: -3000
          expiry: end_of_turn

  # ─── [Your Turn] own [Marcus Damon] +3000 DP ──────────────────────────────
  - kind: aura
    summary: "[Your Turn] Your [Marcus Damon] get +3000 DP"
    active_when: { your_turn: true }
    target:
      owner: you
      zone: [battle_area]
      name_contains: "Marcus Damon"
    dp_modifier: 3000

  # ─── [Your Turn] own [Marcus Damon] gain <Security A. +1> ─────────────────
  - kind: aura
    summary: "[Your Turn] Your [Marcus Damon] gain <Security A. +1>"
    active_when: { your_turn: true }
    target:
      owner: you
      zone: [battle_area]
      name_contains: "Marcus Damon"
    grant_keyword: { keyword: SecurityAttackPlus, value: 1 }
