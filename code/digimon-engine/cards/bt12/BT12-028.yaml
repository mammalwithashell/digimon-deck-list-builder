name: Paildramon
kind: digimon
level: 5
color: [blue, green]
cost: 8
dp: 8000
traits: [Dragonkin]

# ─── Card text (authoritative: data/cards.json) ──────────────────────────────
#
# Effect:
#   [When Digivolving] Trash the top 3 digivolution cards of all of your
#   opponent's Digimon. Then, if DNA digivolving, 2 of your opponent's Digimon
#   with no digivolution cards can't attack until the end of your opponent's
#   turn.
#
# Inherited Effect:
#   [End of Attack] If this Digimon has [Imperialdramon] in its name or [Free]
#   trait, gain 1 memory.
#
# ─── DCGO C# reference ───────────────────────────────────────────────────────
#
# DCGO/Assets/Scripts/CardEffect/BT12/Blue/BT12_028.cs
#
# ─── Implementation status ───────────────────────────────────────────────────
#
# Clause 0a ([When Digivolving] trash top 3 divi-cards from all opp Digimon):
#   DSL VERB AVAILABLE as of 2026-05-09 via Track E
#   `trash_top_n_digivolution_cards_of_each`, but this card remains a
#   structural fixture until its DNA-origin follow-up and inherited predicate
#   gaps are resolved together.
#
# Clause 0b ([When Digivolving] DNA sub-condition → CannotAttack):
#   BLOCKED on G-DSL-IS-DNA-DIGIVOLVING (qa/dsl-vocab-gaps.md).
#   DSL has no `is_dna_digivolving` predicate; engine TriggerSource::Digivolved
#   has no `via_dna` flag. Omitted per no-approximations.
#
# Clause 1 ([Inherited][End of Attack] conditional gain memory):
#   BLOCKED on G-DSL-SOURCE-NAME-CONTAINS (qa/dsl-vocab-gaps.md).
#   `source_name_contains` and `source_permanent_trait_has` parse and compile
#   but are not evaluated at runtime (always-false / silent no-op). Omitted
#   per no-approximations.
#
# ─── DNA digivolve definition (EffectTiming.None block) ──────────────────────
#
# DCGO defines the DNA conditions at EffectTiming.None via
# AddJogressConditionClass — requires a Lv4 Blue source + a Lv4 Green source.
# The standard evo_costs array encodes the printed Lv4/Blue/Cost-4 path.
# The dual-material DNA path (Lv4-Blue + Lv4-Green) is encoded as a
# dna_digivolve alt-path.
#
# DCGO PermanentCondition1: TopCard.Colors.Contains(Blue) && Levels_ForJogress(card).Contains(4)
# DCGO PermanentCondition2: TopCard.Colors.Contains(Green) && Levels_ForJogress(card).Contains(4)
alt_paths:
  - kind: dna_digivolve
    materials:
      - { color_is: blue,  level_eq: 4 }
      - { color_is: green, level_eq: 4 }
    cost: 0

