card: BT12-028
name: Paildramon
kind: digimon
level: 5
color: [blue, green]
cost: 8
dp: 8000
traits: [Dragonkin]

# ─── Card text (authoritative: data/cards.json) ──────────────────────────────
#
# Effect:
#   [When Digivolving] Trash the top 3 digivolution cards of all of your
#   opponent's Digimon. Then, if DNA digivolving, 2 of your opponent's Digimon
#   with no digivolution cards can't attack until the end of your opponent's
#   turn.
#
# Inherited Effect:
#   [End of Attack] If this Digimon has [Imperialdramon] in its name or [Free]
#   trait, gain 1 memory.
#
# ─── DCGO C# reference ───────────────────────────────────────────────────────
#
# DCGO/Assets/Scripts/CardEffect/BT12/Blue/BT12_028.cs
#
# ─── Implementation status ───────────────────────────────────────────────────
#
# Clause 0a ([When Digivolving] trash top 3 divi-cards from all opp Digimon):
#   IMPLEMENTED via Track E `trash_top_n_digivolution_cards_of_each`.
#
# Clause 0b ([When Digivolving] DNA sub-condition → CannotAttack):
#   IMPLEMENTED via `dna_origin: true`, `select_count_capped_multi`, and
#   `CannotAttack` expiring at `end_of_opponents_turn`.
#
# Clause 1 ([Inherited][End of Attack] conditional gain memory):
#   IMPLEMENTED via `source_name_contains` and `source_permanent_trait_has`,
#   evaluated against the carrier permanent in inherited context.
#
# ─── DNA digivolve definition (EffectTiming.None block) ──────────────────────
#
# DCGO defines the DNA conditions at EffectTiming.None via
# AddJogressConditionClass — requires a Lv4 Blue source + a Lv4 Green source.
# The standard evo_costs array encodes the printed Lv4/Blue/Cost-4 path.
# The dual-material DNA path (Lv4-Blue + Lv4-Green) is encoded as a
# dna_digivolve alt-path.
#
# DCGO PermanentCondition1: TopCard.Colors.Contains(Blue) && Levels_ForJogress(card).Contains(4)
# DCGO PermanentCondition2: TopCard.Colors.Contains(Green) && Levels_ForJogress(card).Contains(4)
alt_paths:
  - kind: dna_digivolve
    materials:
      - { color_is: blue,  level_eq: 4 }
      - { color_is: green, level_eq: 4 }
    cost: 0

effects:
  # ─── Clause 0 — [When Digivolving] source trash, then DNA-only attack lock ─
  #
  # DCGO trashes the top 3 digivolution cards from each opponent Digimon, then
  # if the trigger came from Jogress/DNA, selects up to 2 opponent Digimon with
  # no digivolution cards and applies CannotAttack until opponent turn end.
  - when: when_digivolving
    summary: "[When Digivolving] Trash top 3 opp sources; if DNA, up to 2 no-source opp Digimon can't attack"
    process:
      - trash_top_n_digivolution_cards_of_each:
          of: opponent
          n: 3
      - if:
          condition: { dna_origin: true }
          then:
            - select_count_capped_multi:
                of: opponent
                zone: battle_area
                max: 2
                filter:
                  all_of:
                    - kind: digimon
                    - stack_size_lte: 1
                bind_as: no_digi_targets
                prompt: "Select up to 2 opponent Digimon with no digivolution cards"
                optional_zero: false
            - per_selected:
                selection: no_digi_targets
                bind_as: tgt
                body:
                  - add_modifier:
                      target: { binding: tgt }
                      modifier: CannotAttack
                      value: 1
                      expiry: end_of_opponents_turn

  #
  # ─── Clause 1 — Inherited [End of Attack] conditional gain memory ─────────
  #
  # Printed text:
  #   "[End of Attack] If this Digimon has [Imperialdramon] in its name or
  #   [Free] trait, gain 1 memory."
  #
  # "This Digimon" in an inherited context = the carrier (the permanent that
  # has BT12-028 in its digivolution stack). The condition checks the
  # carrier's TOP card: name contains "Imperialdramon" OR trait includes "Free".
  #
  # DCGO (EffectTiming.OnEndAttack, isInheritedEffect: true):
  #   CanActivateCondition:
  #     carrier.TopCard.ContainsCardName("Imperialdramon")
  #     || carrier.TopCard.TypeTexts.Contains(TypeText.Free)
  #   ActivateCoroutine: GainMemory(+1)
  #
  - scope: inherited
    when: end_of_attack
    condition:
      any_of:
        - source_name_contains: "Imperialdramon"
        - source_permanent_trait_has: "Free"
    process:
      - gain_memory: 1
    summary: "[Inherited][End of Attack] If carrier has Imperialdramon in name or Free trait, +1 memory"
