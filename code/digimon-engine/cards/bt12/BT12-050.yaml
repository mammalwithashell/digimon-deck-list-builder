# BT12-050 Stingmon — Digimon, Lv.4, Green, DP 4000, Cost 4.
# Traits: Insectoid.
# Evo: Lv.3 Green / Cost 2 (printed default).
#
# Printed card text (cards.json):
#
#   Effect: [Your Turn] When this Digimon would DNA digivolve into a blue
#   Digimon card, gain 1 memory.
#
#   Inherited Effect: [Your Turn] While this Digimon has [Imperialdramon] in
#   its name or the [Free] trait, it gains ＜Piercing＞ (When this Digimon
#   attacks and deletes an opponent's Digimon and survives the battle, it
#   performs any security checks it normally would.).
#
# DCGO C# reference:
#   DCGO/Assets/Scripts/CardEffect/BT12/Green/BT12_050.cs
#
# ─── Clause layout ────────────────────────────────────────────────────────────
#
#   Clause 0 (own effect): IMPLEMENTED
#     "[Your Turn] When this Digimon would DNA digivolve into a blue Digimon
#     card, gain 1 memory."
#     DCGO: EffectTiming.BeforePayCost with CanTriggerWhenPermanentWouldDigivolveOfCard
#     + IsJogress + target card must be blue Digimon. This is a BeforePayCost
#     triggered gain_memory effect gated on the digivolve target's color.
#     Historical blocker G-BEFORE-PAY-COST-DIGIVOLVE-TARGET +
#     G-BEFORE-PAY-COST-GAIN-MEMORY closed in Phase 2 Track H. Authored as a
#     `before_pay_cost_observe` clause gated by `dna_origin`,
#     `source_is_cost_target_permanent`, and a blue Digimon `cost_target`.
#     Structurally identical to BT12-022 clause 0 (green→blue swap only).
#     See qa/dsl-vocab-gaps.md entries for the resolved history.
#
#   Clause 1 (inherited): IMPLEMENTED
#     "[Your Turn] While this Digimon has [Imperialdramon] in its name or the
#     [Free] trait, it gains <Piercing>"
#     DCGO: EffectTiming.OnDetermineDoSecurityCheck, PierceSelfEffect(isInheritedEffect: true),
#     Condition: IsExistOnBattleArea && IsOwnerTurn &&
#       (PermanentOfThisCard().TopCard.ContainsCardName("Imperialdramon")
#        || PermanentOfThisCard().TopCard.CardTraits.Contains("Free"))
#     Implemented as an inherited self-aura (`target: {}`) gated by your turn
#     and either carrier name contains [Imperialdramon] or carrier top-card
#     trait includes [Free].
#     Structurally identical to BT12-022 clause 1 (Jamming→Piercing swap only).

card: BT12-050
name: Stingmon
kind: digimon
level: 4
color: [green]
cost: 4
dp: 4000
traits: [Insectoid]

effects:
  # ─── Clause 0 — IMPLEMENTED [Phase 2 Track H] ────────────────────────────────
  #
  # "[Your Turn] When this Digimon would DNA digivolve into a blue Digimon
  #  card, gain 1 memory."
  #
  # Closed by Phase 2 Track H — green→blue swap from BT12-022's clause 0.
  # See `code/digimon-engine/cards/bt12/BT12-022.yaml` for substrate context.
  #
  - when: before_pay_cost_observe
    active_when:
      all_of:
        - your_turn: true
        - dna_origin: true
        - source_is_cost_target_permanent: true
        - cost_target: { color_is: blue, kind: digimon }
    summary: "[Your Turn] When DNA digivolving into a blue Digimon card, gain 1 memory"
    process:
      - gain_memory: 1

  # ─── Clause 1 — Inherited [Your Turn] <Piercing> (conditional) ─────────────
  #
  # Printed text:
  #   "[Your Turn] While this Digimon has [Imperialdramon] in its name or the
  #    [Free] trait, it gains ＜Piercing＞"
  #
  # DCGO BT12_050.cs Condition(): IsOwnerTurn && (TopCard.ContainsCardName(
  #   "Imperialdramon") || TopCard.CardTraits.Contains("Free")). BOTH checks are
  #   on the carrier's TOP CARD only.
  #   FIX (G-FIX-BT12-INHERIT-TOPCARD-NAME, 2026-06-02): name check now uses
  #   `source_name_contains` (carrier top-card name, top-only) instead of
  #   `self_digivolution_contains_name`, which scanned top + ALL sources and
  #   over-granted Piercing when [Imperialdramon] was a buried source. Mirrors
  #   the BT12-022 Jamming fix.
  - scope: inherited
    kind: aura
    target: {}
    grant_keyword: { keyword: Piercing }
    active_when:
      all_of:
        - your_turn: true
        - any_of:
            - source_name_contains: "Imperialdramon"
            - source_permanent_trait_has: "Free"
    summary: "[Inherited][Your Turn] Carrier gains <Piercing> if its TOP CARD has [Imperialdramon] in name or the [Free] trait"
