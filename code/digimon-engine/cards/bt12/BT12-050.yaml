# BT12-050 Stingmon — Digimon, Lv.4, Green, DP 4000, Cost 4.
# Traits: Insectoid.
# Evo: Lv.3 Green / Cost 2 (printed default).
#
# Printed card text (cards.json):
#
#   Effect: [Your Turn] When this Digimon would DNA digivolve into a blue
#   Digimon card, gain 1 memory.
#
#   Inherited Effect: [Your Turn] While this Digimon has [Imperialdramon] in
#   its name or the [Free] trait, it gains ＜Piercing＞ (When this Digimon
#   attacks and deletes an opponent's Digimon and survives the battle, it
#   performs any security checks it normally would.).
#
# DCGO C# reference:
#   DCGO/Assets/Scripts/CardEffect/BT12/Green/BT12_050.cs
#
# ─── Clause layout ────────────────────────────────────────────────────────────
#
#   Clause 0 (own effect): BLOCKED
#     "[Your Turn] When this Digimon would DNA digivolve into a blue Digimon
#     card, gain 1 memory."
#     DCGO: EffectTiming.BeforePayCost with CanTriggerWhenPermanentWouldDigivolveOfCard
#     + IsJogress + target card must be blue Digimon. This is a BeforePayCost
#     triggered gain_memory effect gated on the digivolve target's color.
#     BLOCKED on G-BEFORE-PAY-COST-DIGIVOLVE-TARGET (already in qa/dsl-vocab-gaps.md)
#     for the DNA-digivolve-target thread, PLUS G-BEFORE-PAY-COST-GAIN-MEMORY —
#     BeforePayCost triggered effects currently only model `cost_reduction` in
#     CostReductionBody; there is no triggered form for `gain_memory` at
#     BeforePayCost timing.
#     Structurally identical to BT12-022 clause 0 (green→blue swap only).
#     See qa/dsl-vocab-gaps.md entries for these gaps.
#
#   Clause 1 (inherited): PARTIAL
#     "[Your Turn] While this Digimon has [Imperialdramon] in its name or the
#     [Free] trait, it gains <Piercing>"
#     DCGO: EffectTiming.OnDetermineDoSecurityCheck, PierceSelfEffect(isInheritedEffect: true),
#     Condition: IsExistOnBattleArea && IsOwnerTurn &&
#       (PermanentOfThisCard().TopCard.ContainsCardName("Imperialdramon")
#        || PermanentOfThisCard().TopCard.CardTraits.Contains("Free"))
#     Shipped as `kind: grant_keyword` (scope: inherited) with `active_when`
#     carrying the condition. The `active_when` is compiled but NOT consumed
#     by `lower_grant_keyword::lower` — so the Piercing is granted unconditionally
#     to any carrier. Over-fires for carriers without [Imperialdramon] in name
#     or [Free] trait. The negative-condition test is #[ignore]'d under
#     G-DSL-GRANT-KEYWORD-ACTIVE-WHEN-NOT-CONSUMED.
#     Structurally identical to BT12-022 clause 1 (Jamming→Piercing swap only).
#     The carrier-name condition would additionally require G-DSL-SELF-NAME-CONTAINS
#     (BoolPredicate that checks the carrier top-card name from an inherited
#     clause context). The carrier-trait condition would require
#     `source_permanent_trait_has` to be evaluated in predicate.rs.

card: BT12-050
name: Stingmon
kind: digimon
level: 4
color: [green]
cost: 4
dp: 4000
traits: [Insectoid]

effects:
  # ─── Clause 0 — BLOCKED ──────────────────────────────────────────────────────
  #
  # "[Your Turn] When this Digimon would DNA digivolve into a blue Digimon
  #  card, gain 1 memory."
  #
  # BLOCKED on G-BEFORE-PAY-COST-DIGIVOLVE-TARGET (BeforePayCost trigger with
  # target-card predicate threading) and G-BEFORE-PAY-COST-GAIN-MEMORY (no
  # triggered gain_memory form at BeforePayCost timing). Both gaps filed in
  # qa/dsl-vocab-gaps.md. See card header for full analysis.
  # Structurally identical to BT12-022 clause 0 (green→blue swap only).
  #
  # Stub (commented — uncomment when both gaps close):
  #
  # - scope: own
  #   kind: before_pay_cost_trigger    # NEW form — triggered effect at BeforePayCost
  #   when_this_digivolves_into:
  #     target_color_is: blue          # NEW: G-BEFORE-PAY-COST-DIGIVOLVE-TARGET
  #     target_kind_is: digimon
  #     dna_only: true                 # G-BEFORE-PAY-COST-DIGIVOLVE-TARGET
  #   active_when: { your_turn: true }
  #   process:
  #     - gain_memory: 1              # needs triggered form, not cost_reduction

  # ─── Clause 1 — Inherited [Your Turn] <Piercing> (conditional, over-fires) ──
  #
  # Printed text:
  #   "[Your Turn] While this Digimon has [Imperialdramon] in its name or the
  #    [Free] trait, it gains ＜Piercing＞"
  #
  # DCGO: PierceSelfEffect(isInheritedEffect: true), condition checks
  #   carrier's TopCard name or trait. Shipped with `active_when` encoding the
  #   name condition via `self_digivolution_contains_name` and a `your_turn`
  #   gate, but `active_when` is NOT consumed by the lowering (see header).
  #   Trait branch (source_permanent_trait_has: "Free") also silently dropped.
  #   Net effect: Piercing is granted unconditionally to every carrier at
  #   any turn — over-fires for non-Imperialdramon/non-Free carriers and
  #   on opponent's turn. Negative tests are #[ignore]'d under
  #   G-DSL-GRANT-KEYWORD-ACTIVE-WHEN-NOT-CONSUMED.
  - scope: inherited
    kind: grant_keyword
    keyword: Piercing
    active_when:
      all_of:
        - your_turn: true
        - any_of:
            - self_digivolution_contains_name: "Imperialdramon"
            - source_permanent_trait_has: "Free"
    summary: "[Inherited][Your Turn] Carrier gains <Piercing> if name has [Imperialdramon] or [Free] trait (active_when over-fires: G-DSL-GRANT-KEYWORD-ACTIVE-WHEN-NOT-CONSUMED)"
