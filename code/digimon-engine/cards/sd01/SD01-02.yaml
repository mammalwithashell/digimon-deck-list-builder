card: SD01-02
name: Gemmon
kind: digimon
level: 3
color: [red]
cost: 3
dp: 1000
traits: [Mythical Beast, ALYSION]
form: Rookie
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: red }
    cost: 0

effects:
  - when: on_play
    text: "[On Play] Reveal the top 5 cards of your deck. Add 1 red [ALYSION] trait card among them to the hand. Return the rest to the bottom of the deck."
    summary: "[On Play] Reveal top 5; add 1 red [ALYSION] card to hand; return rest to deck bottom"
    process:
      - reveal_top_deck: { of: you, count: 5, bind_as: revealed }
      - select_reveal:
          of: you
          optional: false
          bind_as: picked
          filter: { color_is: red, trait_has: ALYSION }
          prompt: "Add 1 red [ALYSION] trait card to your hand"
      - add_to_hand_from_reveal: { of: you, card: picked }
      - place_remainder_on_deck: { of: you, position: bottom }

  - scope: inherited
    text: "[Your Turn] This Digimon gets +1000 DP."
    kind: aura
    target: {}
    active_when: { your_turn: true }
    dp_modifier: 1000
    summary: "Inherited [Your Turn] This Digimon gets +1000 DP"
