card: SD01-07
name: "Crimson Impale"
kind: option
color: [red]
cost: 1
traits: [ALYSION]

effects:
  - when: main_from_hand
    text: "[Main] 1 of your Digimon with the [ALYSION] trait can also attack your opponent's unsuspended Digimon for the turn."
    summary: "[Main] 1 of your [ALYSION] Digimon can also attack opponent's unsuspended Digimon for the turn"
    process:
      - select_own_permanent:
          optional: false
          bind_as: chosen
          filter: { kind: digimon, trait_has: ALYSION }
          prompt: "1 of your [ALYSION] trait Digimon can also attack your opponent's unsuspended Digimon for the turn"
      - add_modifier:
          target: chosen
          modifier: CanAttackUnsuspended
          value: 1
          expiry: end_of_turn

  - when: on_security
    text: "[Security] Add this card to the hand."
    summary: "[Security] Add this card to the hand"
    process:
      - add_this_option_to_hand: {}
