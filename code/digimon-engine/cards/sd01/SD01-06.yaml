    modifier_value: 2000
    summary: "[Your Turn] Add 2000 to your [ALYSION] trait Digimon's DP deletion effects' maximums"

  - when: on_security
    text: "[Security] Play this card without paying the cost."
    process:
      - play_from_security: {}
