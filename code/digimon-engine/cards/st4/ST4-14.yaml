card: ST4-14
name: Izzy Izumi
kind: tamer
color: [green]
cost: 2

effects:
  - text: "[Your Turn] When one of your opponent's Digimon becomes suspended, you may suspend this Tamer to gain 1 memory."
    when: on_suspend
    optional: true
    active_when: { your_turn: true }
    condition:
      source_is_unsuspended: true
    trigger_if:
      all_of:
        - event_target_owner: opponent
        - event_target_kind: digimon
    summary: "[Your Turn][OPT] When an opponent Digimon becomes suspended, suspend this Tamer to gain 1 memory"
    process:
      - activation_cost: { suspend_self: true }
      - gain_memory: 1

  - text: "[Security] Play this card without paying its memory cost."
    when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
