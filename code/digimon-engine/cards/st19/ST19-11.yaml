card: ST19-11
name: Chaperomon
kind: digimon
level: 5
color: [yellow]
cost: 7
dp: 7000
traits: [Puppet, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: yellow }
    cost: 3

effects:
  - when: [on_play, when_digivolving]
    summary: "1 opponent Digimon gets -3000 DP for the turn; if 3+ total Digimon increase by another -3000"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon to get DP reduced"
      - add_dp_modifier:
          target: target
          value: -3000
          expiry: end_of_turn
      # "If there are 3 or more Digimon, increase the DP reduction of this
      # effect by -3000." Counts Digimon across BOTH battle areas (owner: any).
      # The `target` binding is still in scope for the inner add_dp_modifier.
      - if:
          condition:
            count_gte:
              filter: { kind: digimon, owner: any }
              n: 3
          then:
            - add_dp_modifier:
                target: target
                value: -3000
                expiry: end_of_turn

  - kind: replacement
    scope: inherited
    trigger: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    active_when:
      all_of:
        - replacement_subject_is_mine: true
        - kind: digimon
        - none_of:
            - replacement_cause: own_effect
    summary: "[All Turns][OPT] Delete 1 Token or other Puppet Digimon so this Digimon doesn't leave"
    process:
      - select_own_permanent:
          bind_as: prevent_cost
          filter:
            all_of:
              - other: true
              - any_of:
                  - kind: token
                  - all_of:
                      - kind: digimon
                      - trait_has: Puppet
          prompt: "Delete 1 of your Tokens or other Puppet Digimon"
      - delete_permanent: { target: prevent_cost }
      - cancel_replacement: {}
