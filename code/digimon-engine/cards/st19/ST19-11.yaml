card: ST19-11
name: Chaperomon
kind: digimon
level: 5
color: [yellow]
cost: 7
dp: 7000
traits: [Puppet, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: yellow }
    cost: 3

effects:
  - when: [on_play, when_digivolving]
    summary: "1 opponent Digimon gets -3000 DP for the turn"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon to get DP reduced"
      - add_dp_modifier:
          target: target
          value: -3000
          expiry: end_of_turn

