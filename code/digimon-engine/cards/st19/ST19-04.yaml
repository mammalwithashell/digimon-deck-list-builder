card: ST19-04
name: PawnChessmon
kind: digimon
level: 3
color: [yellow, black]
cost: 3
dp: 2000
traits: [Puppet]
alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: yellow }
    cost: 1
  # Printed split circle: Yellow|Black Lv.2 / cost 1 — one entry per colour.
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 1

effects:
  - text: "[On Play] By trashing 1 card with the [Puppet] trait in your hand, ＜Draw 2＞. (Draw 2 cards from your deck.)"
    when: on_play
    optional: true
    summary: "By trashing a Puppet card from hand, Draw 2"
    condition:
      count_gte:
        filter:
          of: you
          zone: [hand]
          trait_has: Puppet
        n: 1
    process:
      # cost: true — the printed text is "by trashing 1 Puppet card [...], Draw 2".
      # Declining the cost prompt aborts both the trash AND the draw.
      - select_hand:
          of: you
          bind_as: discard
          optional: true
          cost: true
          filter: { trait_has: Puppet }
          prompt: "Trash 1 Puppet card from hand"
      - trash_from_hand_by_index: { of: you, hand_index: discard }
      - draw: { of: you, count: 2 }

  - text: "＜Reboot＞ (This Digimon also unsuspends in your opponent's unsuspend phase.)"
    scope: inherited
    kind: grant_keyword
    keyword: Reboot
