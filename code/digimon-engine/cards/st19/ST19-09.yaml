card: ST19-09
name: Pandamon
kind: digimon
level: 5
color: [yellow]
cost: 6
dp: 7000
traits: [Puppet]
alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: yellow }
    cost: 3

effects:
  - kind: grant_keyword
    keyword: Blocker

  - when: on_deletion
    optional: true
    summary: "You may play 1 level 3 Puppet Digimon from hand without paying the cost"
    process:
      - select_hand:
          of: you
          bind_as: target
          optional: true
          # DCGO ST19_09.cs:44-51: IsDigimon && IsLevel3 && Puppet &&
          # CanPlayAsNewPermanent(payCost: false) -- no DUAL (CR 4.3 7-1-1, 4-6-2,
          # e.g. Sistermon Blanc (Awakened) EX13-065), a free slot, no
          # effect-play lock (CR 4.3 1-3-11-1). Select-hand audit 2026-11-13.
          filter:
            all_of:
              - kind: digimon
              - level_eq: 3
              - trait_has: Puppet
              - can_play_from_effect_without_cost: true
          prompt: "Play 1 level 3 Puppet Digimon from hand"
      - play_from_hand_free:
          of: you
          hand_index: target
