card: ST19-08
name: ShoeShoemon
kind: digimon
level: 4
color: [yellow]
cost: 6
dp: 5000
traits: [Puppet, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 2

effects:
  - kind: grant_keyword
    keyword: Overclock
    overclock_cost_filter:
      any_of:
        - kind: token
        - all_of:
            - kind: digimon
            - trait_has: Puppet

  # [Security] You may play 1 [LIBERATOR] card with play cost 4 or less from
  # hand or trash free. (PUPPETS-G014 substrate landed in Task 7.)
  - when: on_security
    optional: true
    summary: "[Security] You may play 1 [LIBERATOR] card with play cost 4 or less from hand or trash without paying the cost"
    process:
      - select_union_zone:
          of: you
          zones: [hand, trash]
          filter:
            all_of:
              - trait_has: LIBERATOR
              - play_cost_lte: 4
          bind_as: picked
          optional: true
          prompt: "You may play 1 [LIBERATOR] card with play cost 4 or less from your hand or trash without paying the cost"
      - play_union_bound_free:
          binding: picked

  # Inherited [Your Turn] all opponent security Digimon get -3000 DP.
  # BLOCKED: G-OPPONENT-SECURITY-DP-AURA / PUPPETS-G008. The engine has
  # EffectBuilder::applies_to_opponent_security_dp(), but the DSL cannot
  # express an inherited opponent-security-Digimon DP aura yet.
