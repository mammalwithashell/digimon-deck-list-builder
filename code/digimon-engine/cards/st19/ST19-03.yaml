card: ST19-03
name: Shoemon
kind: digimon
level: 3
color: [yellow]
cost: 3
dp: 1000
traits: [Puppet, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: yellow }
    cost: 0

effects:
  - when: on_play
    summary: "Reveal top 3; add 1 Puppet and 1 LIBERATOR; bottom the rest"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          no_duplicate_cards: true
          buckets:
            - bind_as: puppet_pick
              filter: { trait_has: Puppet }
              min: 1
              max: 1
            - bind_as: liberator_pick
              filter: { trait_has: LIBERATOR }
              min: 1
              max: 1
      - add_to_hand_from_reveal: { of: you, card: puppet_pick }
      - add_to_hand_from_reveal: { of: you, card: liberator_pick }
      - place_remainder_on_deck: { of: you, position: bottom }

  # Inherited [Your Turn] "All of your opponent's security Digimon get -3000 DP".
  # PUPPETS-G008: lowers via `applies_to_opponent_security_dp: true` to
  # `EffectBuilder::applies_to_opponent_security_dp()` so the -3000 DP rides
  # under the attacker's stack and surfaces during the security battle's
  # `attacker_security_dp_adjustment`.
  - kind: aura
    scope: inherited
    active_when: { your_turn: true }
    dp_modifier: -3000
    applies_to_opponent_security_dp: true
    summary: "[Inherited][Your Turn] All opponent security Digimon get -3000 DP"
