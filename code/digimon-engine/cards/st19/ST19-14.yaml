card: ST19-14
name: Arisa Kinosaki
kind: tamer
color: [yellow]
cost: 4
traits: [LIBERATOR]

effects:
  - when: start_of_your_turn
    summary: "[Start of Your Turn] If memory is 2 or less, set it to 3"
    condition: { memory_lte: 2 }
    process:
      - set_memory: 3

  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}

  # [Your Turn] When effects play one of your Tokens or Puppet Digimon, by
  # suspending this Tamer, 1 of those Digimon gains Rush for the turn.
  - when: on_any_digimon_played
    active_when: { your_turn: true }
    summary: "[Your Turn] When effects play your Token/Puppet, suspend this Tamer so it gains Rush"
    condition:
      all_of:
        - event_is_effect_initiated: true
        - event_target_owner: you
        - any_of:
            - event_target_kind: token
            - all_of:
                - event_target_kind: digimon
                - event_target_trait_has: Puppet
        - any_permanent:
            of: you
            zone: [battle_area]
            card_number_is: "ST19-14"
            is_unsuspended: true
    process:
      - select_effect_choice:
          labels: ["Suspend this Tamer", "Decline"]
          bind_as: arisa_choice
          prompt: "Suspend Arisa Kinosaki to give the played Token/Puppet Rush?"
      - if:
          condition: { equals: [arisa_choice, 0] }
          then:
            - suspend: { target: source }
            - grant_keyword:
                target: event_target
                keyword: Rush
                expiry: end_of_turn
