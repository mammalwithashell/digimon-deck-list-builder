card: ST19-06
name: Doggymon
kind: digimon
level: 4
color: [yellow]
cost: 4
dp: 4000
traits: [Puppet]
alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 2

effects:
  - when: [on_play, on_deletion]
    summary: "1 opponent Digimon gains Security Attack -1 until their turn ends"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon to gain Security Attack -1"
      - add_modifier:
          target: target
          modifier: SecurityAttackChange
          value: -1
          expiry: end_of_opponents_turn
