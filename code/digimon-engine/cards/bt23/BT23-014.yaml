# BT23-014 Gallantmon — Digimon, Lv.6, Red, DP 11000, Cost 11.
# Traits: Holy Warrior, Royal Knight, CS
# Evo: Lv.5 + CS trait / Cost 3
#
# Printed card text:
#
# [On Play] [When Digivolving] Until your opponent's turn ends, their effects
# can't play Digimon or Tamers from the trash.
#
# [On Play] [When Digivolving] [When Attacking] Delete 1 of your opponent's
# Digimon with 8000 DP or less. For each of their Digimon and Tamers, add
# 2000 to this DP deletion effect's maximum.
#
# DCGO C# reference:
#   DCGO/Assets/Scripts/CardEffect/BT23/Red/BT23_014.cs
#
# Clause layout:
#   Clause 1: [On Play] [When Digivolving] floodgate → raw_rust step
#   Clause 2: [On Play] [When Digivolving] [When Attacking] delete → select + delete

card: BT23-014
name: Gallantmon
kind: digimon
level: 6
color: [red]
cost: 11
dp: 11000
traits: ["Holy Warrior", "Royal Knight", CS]

alt_paths:
  # Standard Lv.5 / cost 3 digivolve (printed on card as default).
  - kind: digivolve
    from: { level_eq: 5 }
    cost: 3
  # Alt-digivolve: Lv.5 with [CS] trait / cost 3 (from xros_req data).
  - kind: digivolve
    from: { level_eq: 5, trait_has: CS }
    cost: 3
    ignore_requirements: true

effects:
  # ─── Clause 1: [On Play] [When Digivolving] Floodgate ──────────────────────
  #
  # "Until your opponent's turn ends, their effects can't play Digimon or Tamers
  # from the trash."
  #
  # DCGO analysis (SharedFloodGateActivateCoroutine):
  #   - Creates CanNotPutFieldClass gating on:
  #       IsExistInAnyTrash(cardSource) && (cardSource.IsDigimon || cardSource.IsTamer)
  #   - CardEffectCondition: cardEffect.EffectSourceCard.Owner == card.Owner.Enemy
  #   - Added to UntilOwnerTurnEndEffects (opponent's perspective) = EndOfOpponentsTurn.
  #
  # Implementation: `add_player_modifier` installs the trash-scoped
  # `CannotPlayFromTrash` modifier on the opponent with `end_of_opponents_turn`
  # expiry. This blocks effect-initiated plays from the opponent's trash —
  # zone-faithful to the printed "from the trash". (The broad
  # `CannotPlayDigimonByEffect` / `CannotPlayTamerByEffect` modifiers also block
  # HAND plays, a much larger over-block.) `CannotPlayFromTrash` is not
  # kind-discriminating, so it also blocks the vanishingly rare effect-initiated
  # Option play from trash — a far narrower residual than the all-zones path.
  - when: [on_play, when_digivolving]
    summary: "Until opp's turn ends, their effects can't play Digimon/Tamers from trash"
    process:
      - add_player_modifier:
          target_player: opponent
          modifier: CannotPlayFromTrash
          expiry: end_of_opponents_turn

  # ─── Clause 2: [On Play] [When Digivolving] [When Attacking] Delete ─────────
  #
  # "Delete 1 of your opponent's Digimon with 8000 DP or less.
  # For each of their Digimon and Tamers, add 2000 to this DP deletion effect's maximum."
  #
  # DCGO analysis (SharedActivateCoroutine):
  #   - DPThreshold() = 8000 + 2000 × (count of opponent's battle area permanents).
  #     "Their Digimon and Tamers" = all permanents in opponent's battle area.
  #   - Selects 1 opponent Digimon with DP ≤ DPThreshold(). canNoSelect: false
  #     (mandatory if a valid target exists). Mode: Destroy.
  #
  # The DP cap is a pure-DSL `base + per × delta` formula: 8000 + 2000 ×
  # (count of permanents in the opponent's battle area). `card_count_in_zone`
  # with no kind filter counts all battle-area permanents = "their Digimon and
  # Tamers" (only Digimon and Tamers occupy battle-area slots). The `dp_lte`
  # formula is evaluated per-candidate by `eval_permanent_fields`.
  - when: [on_play, when_digivolving, when_attacking]
    summary: "Delete 1 opp Digimon (≤8000+2000×opp_count DP)"
    process:
      - select_opponent_permanent:
          bind_as: tgt
          filter:
            all_of:
              - kind: digimon
              - dp_lte:
                  base: 8000
                  per:
                    card_count_in_zone:
                      of: opponent
                      zone: battle_area
                  delta: 2000
          prompt: "Delete opponent Digimon (≤8000+2000×opp count DP)"
      - delete_permanent: { target: tgt }
