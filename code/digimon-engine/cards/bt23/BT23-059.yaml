card: BT23-059
name: "Justimon: Blitz Arm"
kind: digimon
level: 6
color: [black]
cost: 11
dp: 11000
traits: [Cyborg, Hudie, CS]
attribute: Vaccine
alt_paths:
  - kind: digivolve
    from: { level_eq: 5, trait_has: CS }
    cost: 3

effects:
  # ─── Declarative: <Blocker> ───────────────────────────────────────────────
  - kind: grant_keyword
    keyword: Blocker

  # ─── Clause A: [On Play][When Digivolving][When Attacking][Once Per Turn]
  #              By trashing 1 Option card in the battle area, delete 1 of your
  #              opponent's Digimon with the lowest play cost. ─────────────────
  #
  # Printed text (data/cards.json verbatim):
  # "[On Play] [When Digivolving] [When Attacking] [Once Per Turn]
  #  By trashing 1 Option card in the battle area, delete 1 of your opponent's
  #  Digimon with the lowest play cost."
  #
  # DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT23/Black/BT23_059.cs
  # (ActivateClass at OnEnterFieldAnyone+OnAllyAttack, SetHashString for OPT,
  #  SelectPermanentEffect: own battle_area kind==option → TrashPermanent,
  #  then SelectPermanentEffect: opp Digimon with IsMinCost → DestroyPermanent)
  #
  # Implementation notes:
  # - `optional: true`: "By trashing" is the cost gate — the clause is
  #   optional when no own Option card is in the battle area (select will
  #   early-return on an empty candidate set). Per DCGO `canNoSelect: true`
  #   on the outer option pick.
  # - `once_per_turn: true`: [Once Per Turn] maps to OPT slot enforcement.
  # - Three-timing `when: [on_play, when_digivolving, when_attacking]`.
  # - Step 1: `select_own_permanent` with `filter: { kind: option }` selects
  #   the option card to trash. `delete_permanent` trashes it (the engine
  #   routes `delete_permanent` on an Option permanent to the trash path;
  #   this is the same pattern used by AD1-025 for opponent Option cards).
  # - Step 2: `select_opponent_permanent` with `selector: lowest_play_cost`
  #   restricts candidates to the opponent Digimon with the minimum printed
  #   play cost, matching DCGO's `IsMinCost(perm, Enemy, true)` (true = Digimon
  #   only; `false` would include Tamers but printed text says "Digimon").
  #   G-PLAY-COST-AGGREGATE RESOLVED 2026-05-19: the `lowest_play_cost`
  #   FieldSelector variant is live on `select_opponent_permanent`.
  # - If opponent has no Digimon the `select_opponent_permanent` silently
  #   no-ops (no candidates → mandatory selection skips); the option card
  #   was still trashed.
  - when: [on_play, when_digivolving, when_attacking]
    optional: true
    once_per_turn: true
    summary: "[On Play/When Digivolving/When Attacking][OPT] By trashing 1 own Option in battle area, delete 1 opp Digimon with lowest play cost"
    condition:
      any_permanent:
        of: you
        zone: [battle_area]
        kind: option
    process:
      # Step 1: Select own Option card in battle area to trash (the cost).
      - select_own_permanent:
          bind_as: opt_cost
          filter: { kind: option }
          prompt: "Trash 1 of your Option cards in the battle area"
      - delete_permanent: { target: opt_cost }
      # Step 2: Delete 1 opponent Digimon with the lowest play cost.
      # `selector: lowest_play_cost` restricts the candidate set to those
      # at the minimum play cost. Only Digimon (not Tamers) per printed text.
      - select_opponent_permanent:
          bind_as: low_cost_target
          filter: { kind: digimon }
          selector: lowest_play_cost
          prompt: "Delete 1 of your opponent's Digimon with the lowest play cost"
      - delete_permanent: { target: low_cost_target }

  # ─── Clause B: [All Turns][Once Per Turn] When Option cards in the battle
  #              area are trashed, this Digimon unsuspends. Then, your
  #              opponent's Digimon's effects don't affect this Digimon for
  #              the turn. ────────────────────────────────────────────────────
  #
  # BLOCKED: G-ON-OPTION-TRASHED-DSL
  #
  # The engine fires `EffectTiming::OnOptionTrashed` via `Game::trash_field_option`
  # in `code/digimon-engine/src/option_lifecycle.rs:349`. However the DSL
  # `Timing` enum in `code/digimon-dsl/src/clause.rs` has no `on_option_trashed`
  # variant, so this timing cannot be expressed in a YAML `when:` field.
  #
  # The intended YAML once the gap is closed:
  #
  # - when: on_option_trashed
  #   active_when: { all_turns: true }
  #   once_per_turn: true
  #   summary: "[All Turns][OPT] When own option is trashed, unsuspend self and
  #             gain immunity from opponent Digimon effects for the turn"
  #   process:
  #     # Unsuspend this Digimon.
  #     - unsuspend: { target: source }
  #     # Opponent's Digimon's effects don't affect this Digimon for the turn.
  #     # `expiry: end_of_turn` covers "for the turn" (expires at end of either
  #     # player's turn — as printed "[All Turns]" means it can fire on either
  #     # player's turn, and "for the turn" means until the current turn ends).
  #     - grant_effect_immunity:
  #         target: source
  #         source_kind: digimon
  #         source_controller: opponent
  #         expiry: end_of_turn
  #
  # To close this gap:
  #   A. Add `OnOptionTrashed` variant to `code/digimon-dsl/src/clause.rs` Timing enum
  #      with `#[serde(rename = "on_option_trashed")]`.
  #   B. Add the mapping `S::OnOptionTrashed => CompiledTiming::OnOptionTrashed`
  #      in `code/digimon-dsl/src/compile.rs` lower_timing function.
  #   C. Ensure `CompiledTiming::OnOptionTrashed` maps to `EffectTiming::OnOptionTrashed`
  #      in `code/digimon-engine/src/dsl_cards/lower_triggered.rs`.
  #   D. Remove this comment block and author the clause above.
