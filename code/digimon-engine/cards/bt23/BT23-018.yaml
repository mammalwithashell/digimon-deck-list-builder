# BT23-018 Garurumon — Digimon, Lv.4, Blue, DP 5000, Cost 6.
# Traits: Beast, CS
# Attribute: Vaccine
# Evo (printed): Lv.3 Blue / Cost 2
# Alt-evo (DCGO BT23_018.cs:14-32): Lv.3 with [Gabumon] in name OR [CS] trait /
#   Cost 2 (color requirement waived).
#
# Printed card text (cards.json):
#
#   ＜Jamming＞ (This Digimon can't be deleted in battles against Security
#   Digimon.)
#   [Main] [Once Per Turn] By placing this Digimon's top stacked card as its
#   bottom digivolution card, you may play 1 [Agumon] or [Nokia Shiramine]
#   from your hand with the play cost reduced by 2.
#
# Inherited:
#   [Opponent's Turn] This Digimon gets +2000 DP.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT23/Blue/BT23_018.cs
#
# ─── Sister-card relationship ────────────────────────────────────────────────
#
# BT23-018 (Garurumon, Blue) is the structural sister of BT23-008 (Greymon,
# Red). Both share the same [Main][OPT] cost-as-source-shuffle shape; both are
# blocked on the same DSL gap, and both keep the inherited DP buff and the
# face-up keyword grant in the IMPLEMENTED set. The deltas vs BT23-008:
#
#   - Color: Blue (vs Red)
#   - Traits: Beast/CS (vs Dinosaur/CS)
#   - Face-up keyword: ＜Jamming＞ (vs ＜Raid＞)
#   - Hand-pick names: [Agumon]/[Nokia Shiramine] (vs [Gabumon]/[Nokia])
#   - Alt-digivolve lower form: [Gabumon]/[CS] (Garurumon's pre-evo)
#   - Inherited DP gate: [Opponent's Turn] (vs [Your Turn])
#
# ─── Clause layout ────────────────────────────────────────────────────────────
#
#   alt-path 1: Standard digivolve (Lv.3 Blue / Cost 2)             IMPLEMENTED
#   alt-path 2: Alt digivolve Lv.3 [Gabumon]/[CS] / Cost 2,         IMPLEMENTED
#               ignoring color requirement
#   Clause 1:  ＜Jamming＞                                           IMPLEMENTED via grant_keyword
#   Clause 2:  [Main][OPT] cost (place top stacked → bottom) +      authorable-now: G-DSL-PLACE-TOP-SOURCE-AS-BOTTOM RESOLVED (qa/resolved-gaps.md)
#               optional play Agumon/Nokia from hand at -2 cost
#   Clause 3:  [Inherited][Opponent's Turn] +2000 DP self-aura      IMPLEMENTED
#
# ─── DSL-GAP — Place own top stacked card as own bottom digivolution card ──────
#                                                              [G-DSL-PLACE-TOP-SOURCE-AS-BOTTOM]
#
# Same gap as BT23-008 (sister card). The DSL has `place_as_bottom_source
# { source, target }` (lowers to `EffectContext::place_as_bottom_source`), but
# it requires `source` to be a binding that resolves to a `CardSourceRef`
# (e.g. a card picked from hand or trash via `select_hand`/`select_trash`).
# It cannot bind "the top stacked card of <permanent>" — there is no
# `top_source_of` step / binding kind.
#
# `select_material { of_permanent, filter }` selects a stacked card with a
# selection prompt, which would faithfully model "any stacked card" but NOT
# the printed "top stacked card" semantic — the player would be exposed to a
# fake choice (DCGO grabs `card.PermanentOfThisCard().TopCard` directly with
# no prompt, and the printed text says "top stacked card", definite singular).
#
# The cost ("By placing this Digimon's top stacked card as its bottom
# digivolution card") is a hard activation gate: under the no-approximations
# policy, omitting the cost (free play) over-permits, and replacing the
# deterministic top-pick with a `select_material` choice over-restricts the
# action space (player would be asked to pick an arbitrary stacked card,
# violating printed text). Both directions break the contract; the entire
# clause is OMITTED pending a DSL verb such as:
#
#   - place_top_source_as_bottom: { target: source }
#
# that lowers to a sequence equivalent to:
#
#   let top = perm.top_card_source();
#   ctx.place_as_bottom_source(CardSourceRef::Material(perm, top_idx), perm);
#
# without a player-facing selection. Logged to qa/dsl-vocab-gaps.md from the
# BT23-008 worker; this card reuses the same gap entry.
#
# Companion gap: even with the cost step in place, the optional "play 1
# [Agumon]/[Nokia Shiramine] from hand at cost -2" body is straightforward —
# `select_hand` (optional) filtered by name + `play_from_hand: { cost_delta:
# { reduce: 2 } }`. The blocking element is solely the cost step.

card: BT23-018
name: Garurumon
kind: digimon
level: 4
color: [blue]
cost: 6
dp: 5000
traits: [Beast, CS]
attribute: Vaccine

# ─── Alt-paths ────────────────────────────────────────────────────────────────
#
# 1) Standard digivolve: Lv.3 Blue / Cost 2 (per evo_costs in cards.json).
# 2) Alt digivolve: Lv.3 with [Gabumon] in name OR [CS] trait / Cost 2,
#    ignoring color requirement (DCGO BT23_018.cs:14-32). Gabumon is
#    Garurumon's natural pre-evo lower form.
#
# DCGO `ignoreDigivolutionRequirement: false` for the alt clause is a slight
# misnomer — the alt clause itself adds a NEW digivolution recipe via
# `AddSelfDigivolutionRequirementStaticEffect`, and the predicate already
# encodes the requirement. To enable the alt path independently of the printed
# evo color (Blue) requirement, we set `ignore_requirements: true` (matches
# the BT23-008 sister-card pattern at the same DSL level).
alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: blue }
    cost: 2

  - kind: digivolve
    from:
      all_of:
        - level_eq: 3
        - any_of:
            - name_contains: "Gabumon"
            - trait_has: CS
    cost: 2
    ignore_requirements: true

effects:
  # ─── Clause 1 — ＜Jamming＞ (face-up declarative) ─────────────────────────────
  # "This Digimon can't be deleted in battles against Security Digimon."
  # DCGO: JammingSelfStaticEffect, isInheritedEffect: false (face-up only).
  # Same lowering shape as BT23-008's <Raid> grant.
  - kind: grant_keyword
    keyword: Jamming

  # ─── Clause 2 — [Main][OPT] place-top-as-bottom + play Agumon/Nokia ──────────
  #
  # Phase 2 Track F (2026-05-17) closes G-DSL-PLACE-TOP-SOURCE-AS-BOTTOM via
  # the new `place_top_source_as_bottom: { target: <perm> }` verb. Same
  # shape as BT23-008's Clause 2 except the optional-play filter is
  # [Agumon]-named (not [Gabumon]).
  - when: main_on_field
    once_per_turn: true
    optional: true
    summary: "[Main][OPT] Place top stacked card as bottom; may play [Agumon]/[Nokia Shiramine] from hand at -2"
    condition:
      materials_count_gte: 1
    process:
      - place_top_source_as_bottom: { target: source }
      - select_hand:
          of: you
          bind_as: pick
          optional: true
          filter:
            any_of:
              - all_of:
                  - kind: digimon
                  - name_is: "Agumon"
              - all_of:
                  - kind: tamer
                  - name_is: "Nokia Shiramine"
          prompt: "Play 1 [Agumon] or [Nokia Shiramine] from hand (cost -2)"
      - play_from_hand:
          of: you
          hand_index: pick
          cost_delta: { reduce: 2 }

  # ─── Clause 3 — [Inherited][Opponent's Turn] +2000 DP self-aura ──────────────
  # Mirrors BT23-008 Clause 3, but gated on the OPPONENT's turn instead of
  # the controller's. DCGO: ChangeSelfDPStaticEffect(2000, isInheritedEffect:
  # true, condition: IsExistOnBattleArea && IsOpponentTurn).
  # The DSL self-aura (empty target `{}`) with `scope: inherited` sets the
  # static `dp_modifier` field on the Effect. `Game::source_dp_contribution`
  # reads this field for tensor-layer DP computation, gated by `active_when`.
  - scope: inherited
    kind: aura
    active_when: { opponents_turn: true }
    target: {}
    dp_modifier: 2000
    summary: "[Opponent's Turn] This Digimon gets +2000 DP"
