card: BT23-058
name: Craniamon
kind: digimon
level: 6
color: [black]
cost: 11
dp: 11000
traits: ["Holy Warrior", "Royal Knight", CS]
attribute: Data

# Printed digivolve circle (official Bandai DB / data/card_bundles/BT23-058.md):
# Black Lv.5 / cost 3. (Previously mis-authored as WHITE; see
# tests/alt_path_printed_cost_guard.rs.)
alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: black }
    cost: 3
  - kind: digivolve
    from: { level_eq: 5, trait_has: CS }
    cost: 3

effects:
  - kind: grant_keyword
    keyword: Reboot

  - kind: grant_keyword
    keyword: Blocker

  # [All Turns] When any of your Digimon or Tamers would leave the battle area
  # by your opponent's effects, by suspending this Digimon, 1 of those Digimon
  # or Tamers doesn't leave.
  - kind: replacement
    trigger: when_would_leave_battle_area
    optional: true
    active_when:
      all_of:
        - replacement_subject_is_mine: true
        - replacement_cause: opponent_effect
        - any_of:
            - kind: digimon
            - kind: tamer
        - any_permanent:
            of: you
            zone: [battle_area]
            card_number_is: "BT23-058"
            is_unsuspended: true
    summary: "[All Turns] By suspending this Digimon, 1 of your Digimon or Tamers doesn't leave by opponent effects"
    process:
      - suspend: { target: source }
      - cancel_replacement: {}

  # ─── [All Turns][Once Per Turn] self-suspend lowest-play-cost delete-all ─────
  #
  # "When this Digimon is suspended, delete all of your opponent's Digimon with
  # the lowest play cost."
  #
  # event_permanent_is_source gates the OnSuspend observer to THIS exact
  # Craniamon being suspended (the BT23-077 Sistermon Ciel pattern); another
  # permanent suspending does not over-fire it. The delete-all is the verbatim
  # BT9-112 DeathXmon Clause C idiom: a for_each over opponent Digimon whose
  # play cost is <= the lowest play cost among the opponent's Digimon (the
  # `lowest_play_cost` aggregate scoped to the opponent), deleting each. This
  # is a deterministic sweep with no player choice, so no selection installs.
  - when: on_suspend
    active_when: { all_turns: true }
    once_per_turn: true
    condition:
      all_of:
        - event_permanent_is_source: true
        - any_permanent:
            of: opponent
            zone: [battle_area]
            kind: digimon
    summary: "[All Turns][Once Per Turn] When this Digimon suspends, delete all opponent Digimon with the lowest play cost"
    process:
      - for_each:
          over:
            of: opponent
            zone: [battle_area]
            kind: digimon
            play_cost_lte:
              aggregate:
                selector: lowest_play_cost
                scope: opponent
          bind_as: victim
          body:
            - delete_permanent: { target: victim }
