card: BT23-077
name: Sistermon Ciel
kind: digimon
level: 4
color: [white]
cost: 4
dp: 4000
traits: [Puppet, CS]
attribute: Data

# Printed identity line "Also Treated As [Sistermon Noir]" (DCGO
# ChangeCardNamesClass) — honored by generic name-matching predicates.
also_treated_as: [Sistermon Noir]

effects:
  - kind: grant_keyword
    keyword: Blocker

  - when: on_play
    summary: "Delete 1 opponent Digimon with play cost 4 or less"
    condition:
      any_permanent:
        of: opponent
        zone: [battle_area]
        kind: digimon
        play_cost_lte: 4
    process:
      - select_opponent_permanent:
          bind_as: target
          filter:
            all_of:
              - kind: digimon
              - play_cost_lte: 4
          prompt: "Delete 1 opponent Digimon with play cost 4 or less"
      - delete_permanent: { target: target }

  - when: on_suspend
    summary: "When this Digimon suspends, De-Digivolve 1 one opponent Digimon"
    condition:
      all_of:
        - event_permanent_is_source: true
        - any_permanent:
            of: opponent
            zone: [battle_area]
            kind: digimon
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon to De-Digivolve 1"
      - de_digivolve:
          target: target
          amount: 1
          stop_at_level: 3
