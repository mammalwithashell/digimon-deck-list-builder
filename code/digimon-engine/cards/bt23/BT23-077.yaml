card: BT23-077
name: Sistermon Ciel
kind: digimon
level: 4
color: [white]
cost: 4
dp: 4000
traits: [Puppet, CS]
attribute: Data

effects:
  - kind: grant_keyword
    keyword: Blocker

  - when: on_play
    summary: "Delete 1 opponent Digimon with play cost 4 or less"
    condition:
      any_permanent:
        of: opponent
        zone: [battle_area]
        kind: digimon
        play_cost_lte: 4
    process:
      - select_opponent_permanent:
          bind_as: target
          filter:
            all_of:
              - kind: digimon
              - play_cost_lte: 4
          prompt: "Delete 1 opponent Digimon with play cost 4 or less"
      - delete_permanent: { target: target }

  # Printed but omitted:
  # [All Turns] When this Digimon suspends, <De-Digivolve 1> 1 of your opponent's Digimon.
  #
  # Current OnSuspend/EventObserved dispatch can scan every battle-area
  # permanent when any permanent suspends, but the DSL does not expose the
  # PUPPETS-G029 predicate that gates the event subject to this source
  # permanent. Authoring this as a broad on_suspend trigger would over-fire when
  # another permanent suspends.
