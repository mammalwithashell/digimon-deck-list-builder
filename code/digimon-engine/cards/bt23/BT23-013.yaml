card: BT23-013
name: Jesmon
kind: digimon
level: 6
color: [red]
cost: 12
dp: 12000
traits: [Holy Warrior, Royal Knight, CS]
form: Mega
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: red }
    cost: 4
  - kind: digivolve
    from:
      any_color: true
      any_of:
        - name_is: SaviorHuckmon
        - { level_eq: 5, trait_has: CS }
    cost: 3
    ignore_requirements: true
  - kind: digivolve
    from: { name_is: Huckmon }
    cost: 5
    ignore_requirements: true
    condition:
      any_permanent: { of: opponent, kind: digimon, dp_gte: 10000 }

effects:
  - text: "＜Rush＞"
    kind: grant_keyword
    keyword: Rush
  - text: "＜Alliance＞"
    kind: grant_keyword
    keyword: Alliance

  - text: "[When Digivolving] [When Attacking] You may play 1 [Atho, René & Por] Token or, from your hand or trash, 1 Digimon card with [Sistermon] in its name without paying the cost. This effect can't play cards with the same names as any of your Digimon. (Digimon/white/6000 DP/＜Reboot＞ ＜Blocker＞ ＜Decoy (Red)/(Black)＞)"
    when: [when_digivolving, when_attacking]
    optional: true
    summary: "[When Digivolving][When Attacking] Play Atho/Rene/Por token or a name-safe Sistermon from hand/trash"
    process:
      - select_effect_choice:
          bind_as: play_choice
          labels:
            - "Play Atho, Rene & Por Token"
            - "Play Sistermon from hand or trash"
          legal_when:
            - no_permanent:
                of: you
                name_is: "Atho, René & Por"
            - count_gte:
                filter:
                  owner: you
                  zone: [hand, trash]
                  kind: digimon
                  name_contains: Sistermon
                  name_not_shared_by_field_digimon: you
                  # DCGO BT23_013.cs:116-117 gates the branch on IsValidSistermon,
                  # which includes CanPlayAsNewPermanent (no DUAL, a free slot, no
                  # prohibition, trash play not locked).
                  can_play_from_effect_without_cost: true
                n: 1
          prompt: "Choose what Jesmon plays"
      - if:
          condition: { equals: [play_choice, 0] }
          then:
            - play_token:
                controller: you
                token_name: atho_rene_por
      - if:
          condition: { equals: [play_choice, 1] }
          then:
            - select_union_zone:
                optional: false
                of: you
                zones: [hand, trash]
                bind_as: sistermon_pick
                filter:
                  all_of:
                    - kind: digimon
                    - name_contains: "Sistermon"
                    - name_not_shared_by_field_digimon: you
                    # DCGO IsValidSistermon CanPlayAsNewPermanent: a DUAL (Sistermon
                    # Blanc (Awakened) EX13-065) can't be played (CR 4.3 4-6-2).
                    - can_play_from_effect_without_cost: true
                prompt: "Play 1 Sistermon from hand or trash without paying the cost"
            - play_union_bound_free:
                binding: sistermon_pick

  - text: "[Your Turn] [Once Per Turn] When any of your other Digimon are played, this Digimon may attack."
    when: on_ally_played
    optional: true
    once_per_turn: true
    active_when: { your_turn: true }
    trigger_if:
      all_of:
        - event_target_owner: you
        - any_of:
            - event_card_kind: digimon
            - event_card_kind: token
        - event_target_is_source: false
    summary: "[Your Turn][Once Per Turn] When another Digimon is played, this Digimon may attack"
    process:
      - may_attack_now:
          attacker: source
          targets: any
          optional: true
          prompt: "Have this Jesmon attack?"
