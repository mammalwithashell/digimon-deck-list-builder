card: BT23-035
name: Dynasmon
kind: digimon
level: 6
color: [yellow, red]
cost: 12
dp: 12000
traits: [Holy Warrior, Royal Knight, CS]
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: yellow }
    cost: 4

effects:
  - kind: grant_keyword
    keyword: Barrier

  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Trash top security; all opponent Digimon get -6000 DP"
    process:
      - trash_top_security: { of: you }
      - for_each:
          over:
            all_of:
              - kind: digimon
              - of: opponent
              - zone: [battle_area]
          bind_as: victim
          body:
            - add_dp_modifier:
                target: victim
                value: -6000
                expiry: end_of_turn

  # ─── [All Turns][Once Per Turn] security-removed → Sec A.+1, then recover ────
  #
  # "When your security stack is removed from, this Digimon gains
  #  <Security A. +1> until your turn ends. Then, if you have 3 or fewer
  #  security cards, <Recovery +1 (Deck)>."
  #
  # DCGO (BT23_035.cs, EffectTiming.OnLoseSecurity, max-per-turn 1, gated by
  # IsYourSecurity): grant Security A. +1 to this permanent for
  # EffectDuration.UntilOwnerTurnEnd, then `if (SecurityCards.Count <= 3)`
  # Recovery +1.
  #
  # `on_own_security_removed` fires only when the controller's own security is
  # removed from (BT4-097 precedent). The grant uses `end_of_your_next_turn`:
  # this observer typically fires on the OPPONENT's turn (their attack removes
  # your security), so "until your turn ends" resolves to the end of your NEXT
  # turn. The Recovery is gated on `security_count_lte: 3`.
  - when: on_own_security_removed
    active_when: { all_turns: true }
    once_per_turn: true
    summary: "[All Turns][OPT] When your security is removed, this Digimon gains Security A. +1; then if 3 or fewer security, Recovery +1"
    process:
      - grant_keyword:
          target: source
          keyword: SecurityAttackPlus
          value: 1
          expiry: end_of_your_next_turn
      - if:
          condition: { security_count_lte: 3 }
          then:
            - recover: { of: you, count: 1 }
