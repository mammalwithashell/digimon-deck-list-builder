card: BT23-035
name: Dynasmon
kind: digimon
level: 6
color: [yellow, red]
cost: 12
dp: 12000
traits: [Holy Warrior, Royal Knight, CS]
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: yellow }
    cost: 4
  - kind: digivolve
    from: { level_eq: 5, color_is: red }
    cost: 4
  - kind: digivolve
    from: { level_eq: 5, trait_has: Witchelny }
    cost: 3
  - kind: digivolve
    from: { level_eq: 5, trait_has: CS }
    cost: 3


effects:
  - kind: grant_keyword
    keyword: Barrier

  # The benefit requires committed trash, not merely a requested payment.
  # Overall processing also covers later entrants (CR 4.3 15-11-2-1/2).
  - when: [on_play, when_digivolving]
    optional: true
    outer_prompt: true
    condition: { security_count_gte: 1 }
    summary: "[On Play][When Digivolving] By trashing top security, all opposing Digimon get -6000 DP for the turn"
    process:
      - trash_top_security: { of: you, bind_count_as: paid_security }
      - if:
          condition: { equals: [paid_security, 1] }
          then:
            - add_modifier:
                continuous: true
                target: { of: opponent, kind: digimon }
                modifier: ChangeDp
                value: -6000
                expiry: end_of_turn

  # Until your turn ends means this own turn, or the next own turn when
  # installed during the opponent's turn; it is not an extra next-turn skip.
  - when: on_own_security_removed
    active_when: { all_turns: true }
    once_per_turn: true
    summary: "[All Turns][OPT] Own security removed: Security A. +1 until your turn ends; then recover if at most 3 security"
    process:
      - grant_keyword:
          target: source
          keyword: SecurityAttackPlus
          value: 1
          expiry: end_of_your_turn
      - if:
          condition: { security_count_lte: 3 }
          then:
            - recover: { of: you, count: 1 }
