card: BT23-054
name: Magnamon
kind: digimon
level: 4
color: [black, blue]
cost: 7
dp: 7000
traits: ["Holy Warrior", "Royal Knight", CS]
form: "Armor Form"
attribute: Free

# Printed digivolve circles (official Bandai DB / data/card_bundles/BT23-054.md):
# Black Lv.3 / cost 4 and Blue Lv.3 / cost 4. (Previously mis-authored as a
# single WHITE circle; see tests/alt_path_printed_cost_guard.rs.)
alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: black }
    cost: 4
  - kind: digivolve
    from: { level_eq: 3, color_is: blue }
    cost: 4
  - kind: digivolve
    from:
      all_of:
        - level_eq: 3
        - any_of:
            - name_contains: "Veemon"
            - trait_has: CS
    cost: 3

effects:
  - kind: grant_keyword
    keyword: Blocker

  - kind: grant_keyword
    keyword: ArmorPurge

  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Draw 1; 1 Royal Knight/CS Digimon cannot be returned by opponent effects"
    process:
      - draw: { of: you, count: 1 }
      - select_own_permanent:
          bind_as: protected
          filter:
            all_of:
              - kind: digimon
              - any_of:
                  - trait_has: "Royal Knight"
                  - trait_has: CS
          prompt: "Choose a Royal Knight or CS Digimon to protect"
      - add_modifier:
          target: protected
          modifier: CannotBeReturnedToHand
          value: 1
          expiry: end_of_opponents_turn
      - add_modifier:
          target: protected
          modifier: CannotBeReturnedToDeck
          value: 1
          expiry: end_of_opponents_turn
