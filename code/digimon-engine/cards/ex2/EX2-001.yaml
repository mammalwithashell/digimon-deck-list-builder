card: EX2-001
name: Gigimon
kind: digi_egg
level: 2
form: In-Training
color: [red]
traits: [Lesser]

effects:
  - text: "[When Attacking][Once Per Turn] If this Digimon has [Guilmon], [Growlmon], or [Gallantmon] in its name, ＜Draw 1＞."
    scope: inherited
    when: when_attacking
    once_per_turn: true
    condition:
      any_of:
        - name_contains: Guilmon
        - name_contains: Growlmon
        - name_contains: Gallantmon
    summary: "[Inherited][When Attacking][OPT] If [Guilmon]/[Growlmon]/[Gallantmon] in name, <Draw 1>"
    process:
      - draw: { of: you, count: 1 }
