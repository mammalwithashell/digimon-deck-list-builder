card: BT4-023
name: Strabimon
kind: digimon
level: 3
color: [blue]
cost: 3
dp: 2000
form: Hybrid
attribute: Variable
traits: [Beastkin]

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: blue }
    cost: 0

effects:
  - text: "[On Play] Reveal the top 3 cards of your deck. Add 1 Digimon card with the [Hybrid] trait and 1 blue Tamer card among them to your hand. Place the remaining cards at the bottom of your deck in any order."
    when: on_play
    summary: "[On Play] Reveal top 3; add 1 [Hybrid] Digimon and 1 blue Tamer to hand; place remaining at bottom of deck in any order"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          no_duplicate_cards: true
          buckets:
            - bind_as: hybrid_digimon
              filter: { kind: digimon, trait_has: Hybrid }
              min: 1
              max: 1
            - bind_as: blue_tamer
              filter: { kind: tamer, color_is: blue }
              min: 1
              max: 1
          prompt: "Add 1 Digimon card with the [Hybrid] trait and 1 blue Tamer card to your hand"
      - add_to_hand_from_reveal: { of: you, card: hybrid_digimon }
      - add_to_hand_from_reveal: { of: you, card: blue_tamer }
      - place_remainder_on_deck: { of: you, position: bottom }
