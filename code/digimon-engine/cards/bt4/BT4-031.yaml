card: BT4-031
name: MarineChimairamon
kind: digimon
level: 5
color: [blue]
cost: 7
dp: 7000
form: Ultimate
attribute: Vaccine
traits: [Composite]
alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: blue }
    cost: 3

effects:
  - text: "[On Play] You may return 1 of your other Digimon to its owner's hand to return 1 of your opponent's Digimon with no digivolution cards to its owner's hand."
    when: on_play
    summary: "[On Play] May return 1 of your other Digimon to hand to return 1 opponent Digimon with no digivolution cards to hand"
    process:
      - select_own_permanent:
          optional: true
          bind_as: own_bounce
          filter:
            all_of:
              - kind: digimon
              - not: { is_source: true }
          prompt: "You may return 1 of your other Digimon to its owner's hand"
      - if:
          condition: { binding_present: own_bounce }
          then:
            - return_to_hand: { target: own_bounce }
            - select_opponent_permanent:
                optional: false
                bind_as: opp_bounce
                filter: { kind: digimon, materials_count_lte: 0 }
                prompt: "Return 1 of your opponent's Digimon with no digivolution cards to its owner's hand"
            - return_to_hand: { target: opp_bounce }
