card: BT4-072
name: Gogmamon
kind: digimon
level: 5
color: [black]
cost: 8
dp: 7000
traits: [Rock]
form: Ultimate
attribute: Vaccine
alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: black }
    cost: 3

effects:
  - when: main_on_field
    summary: "[Main] <Digi-Burst 1> 1 of your Digimon gets +2000 DP until the end of your opponent's next turn"
    process:
      - digi_burst:
          count: 1
          bind_as: burst_source
          prompt: "Choose 1 digivolution card under this Digimon to trash for <Digi-Burst 1>"
          then:
            - select_own_permanent:
                bind_as: dp_target
                filter: { kind: digimon }
                prompt: "Choose 1 of your Digimon to get +2000 DP"
            - add_dp_modifier:
                target: dp_target
                value: 2000
                expiry: end_of_opponents_turn

  - scope: inherited
    kind: aura
    active_when: { all_turns: true }
    target: {}
    dp_modifier: 1000
    summary: "[All Turns] This Digimon gets +1000 DP"
