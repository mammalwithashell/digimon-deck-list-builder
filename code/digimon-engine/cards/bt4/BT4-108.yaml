card: BT4-108
name: Cyclonic Kick
kind: option
color: [green]
cost: 4

effects:
  - text: "[Main] Unsuspend 1 of your Digimon and suspend 1 of your opponent's Digimon."
    when: main_from_hand
    summary: "[Main] Unsuspend 1 of your Digimon and suspend 1 of your opponent's Digimon"
    process:
      - select_own_permanent:
          optional: false
          bind_as: own_target
          filter: { kind: digimon }
          prompt: "Unsuspend 1 of your Digimon"
      - unsuspend: { target: own_target }
      - select_opponent_permanent:
          optional: false
          bind_as: opp_target
          filter: { kind: digimon }
          prompt: "Suspend 1 of your opponent's Digimon"
      - suspend: { target: opp_target }

  - text: "[Security] Activate this card's [Main] effects."
    when: on_security
    summary: "[Security] Activate this card's [Main] effects"
    process:
      - select_own_permanent:
          optional: false
          bind_as: own_target
          filter: { kind: digimon }
          prompt: "Unsuspend 1 of your Digimon"
      - unsuspend: { target: own_target }
      - select_opponent_permanent:
          optional: false
          bind_as: opp_target
          filter: { kind: digimon }
          prompt: "Suspend 1 of your opponent's Digimon"
      - suspend: { target: opp_target }
