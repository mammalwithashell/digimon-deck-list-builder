    summary: "[When Digivolving] Unsuspend this Digimon, then it may attack an opponent's Digimon (including unsuspended Digimon)"
    process:
      - unsuspend: { target: source }
      - may_attack_now:
          attacker: source
          targets: digimon
          can_attack_unsuspended: true
          optional: true
          prompt: "Attack 1 of your opponent's Digimon (including unsuspended Digimon)"
