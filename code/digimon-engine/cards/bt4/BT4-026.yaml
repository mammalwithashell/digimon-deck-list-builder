card: BT4-026
name: Gaogamon
kind: digimon
level: 4
color: [blue]
cost: 5
dp: 5000
form: Champion
attribute: Data
traits: [Beast]

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: blue }
    cost: 2

effects:
  - text: "[Main] ＜Digi-Burst 2＞ (You may trash 2 of this Digimon's digivolution cards to activate the effect below.) ＜Draw 1＞ (Draw 1 card from your deck.)"
    when: main_on_field
    summary: "[Main] <Digi-Burst 2> <Draw 1>"
    process:
      - digi_burst:
          count: 2
          bind_as: burst_sources
          prompt: "Choose 2 digivolution cards under this Digimon to trash for <Digi-Burst 2>"
          then:
            - draw: { of: you, count: 1 }
