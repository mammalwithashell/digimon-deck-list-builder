card: BT4-099
name: Heir of Dragons
kind: option
color: [red]
cost: 3

effects:
  - text: "[Main] ＜Draw 2＞ (Draw 2 cards from your deck.) Then, if one of your Digimon has [Greymon] in its name or [Dramon] in its name, delete 1 of your opponent's Digimon with 4000 DP or less."
    when: main_from_hand
    summary: "[Main] <Draw 2>; then if you have a [Greymon] or [Dramon] Digimon, delete 1 opponent Digimon with 4000 DP or less"
    process:
      - draw: { of: you, count: 2 }
      - if:
          condition:
            any_permanent:
              of: you
              zone: [battle_area]
              kind: digimon
              any_of:
                - name_contains: "Greymon"
                - name_contains: "Dramon"
          then:
            - select_opponent_permanent:
                optional: false
                bind_as: victim
                filter:
                  all_of:
                    - kind: digimon
                    - dp_lte: 4000
                prompt: "Delete 1 of your opponent's Digimon with 4000 DP or less"
            - delete_permanent: { target: victim }

  - text: "[Security] Activate this card's [Main] effects."
    when: on_security
    summary: "[Security] Activate this card's [Main] effects"
    process:
      - draw: { of: you, count: 2 }
      - if:
          condition:
            any_permanent:
              of: you
              zone: [battle_area]
              kind: digimon
              any_of:
                - name_contains: "Greymon"
                - name_contains: "Dramon"
          then:
            - select_opponent_permanent:
                optional: false
                bind_as: victim
                filter:
                  all_of:
                    - kind: digimon
                    - dp_lte: 4000
                prompt: "Delete 1 of your opponent's Digimon with 4000 DP or less"
            - delete_permanent: { target: victim }
