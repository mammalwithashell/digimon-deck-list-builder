card: BT4-095
name: Yoshino Fujieda
kind: tamer
color: [green]
cost: 3

effects:
  - text: "[On Play] Return 1 Digi-Egg card from your trash to the bottom of your Digi-Egg deck."
    when: on_play
    summary: "[On Play] Return 1 Digi-Egg card from your trash to the bottom of your Digi-Egg deck"
    process:
      - select_trash:
          of: you
          optional: false
          bind_as: egg_card
          filter: { kind: digi_egg }
          prompt: "Return 1 Digi-Egg card from your trash to the bottom of your Digi-Egg deck"
      - return_trash_list_to_deck_bottom:
          of: you
          cards: egg_card

  - text: "[Your Turn] When digivolving one of your Digimon into a Digimon card in your hand with ＜Digi-Burst＞, you may suspend this Tamer to reduce the digivolution cost by 1."
    kind: cost_reduction
    scope: face_up
    reduction_timing: before_pay_cost
    active_when: { your_turn: true }
    optional: true
    when_any_ally_digivolves_into:
      all_of:
        - cost_target_from_hand: true
        - kind: digimon
        - printed_keyword: digi_burst
    pay_cost:
      - suspend: { target: source }
    amount: 1
    summary: "[Your Turn] When digivolving into a hand Digimon card with <Digi-Burst>, suspend this Tamer to reduce digivolution cost by 1"

  - text: "[Security] Play this card without paying the cost."
    when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
