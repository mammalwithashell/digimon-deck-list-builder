card: BT4-103
name: Full Moon Blaster
kind: option
color: [blue]
cost: 5

effects:
  - text: "[Main] Return 1 of your opponent's level 5 or lower Digimon to its owner's hand. If your opponent has 8 or more cards in their hand, instead return 1 of your opponent's level 5 or lower Digimon to the bottom of its owner's deck."
    when: main_from_hand
    summary: "[Main] Return 1 opponent Lv.5 or lower Digimon to hand (or bottom of deck if opponent has 8+ cards in hand)"
    process:
      - if:
          condition:
            count_gte:
              filter:
                of: opponent
                zone: [hand]
              n: 8
          then:
            - select_opponent_permanent:
                optional: false
                bind_as: victim
                filter:
                  all_of:
                    - kind: digimon
                    - level_lte: 5
                prompt: "Return 1 of your opponent's level 5 or lower Digimon to the bottom of its owner's deck"
            - return_to_deck: { target: victim, position: bottom }
          else:
            - select_opponent_permanent:
                optional: false
                bind_as: victim
                filter:
                  all_of:
                    - kind: digimon
                    - level_lte: 5
                prompt: "Return 1 of your opponent's level 5 or lower Digimon to its owner's hand"
            - return_to_hand: { target: victim }

  - text: "[Security] Activate this card's [Main] effects."
    when: on_security
    summary: "[Security] Activate this card's [Main] effects"
    process:
      - if:
          condition:
            count_gte:
              filter:
                of: opponent
                zone: [hand]
              n: 8
          then:
            - select_opponent_permanent:
                optional: false
                bind_as: victim
                filter:
                  all_of:
                    - kind: digimon
                    - level_lte: 5
                prompt: "Return 1 of your opponent's level 5 or lower Digimon to the bottom of its owner's deck"
            - return_to_deck: { target: victim, position: bottom }
          else:
            - select_opponent_permanent:
                optional: false
                bind_as: victim
                filter:
                  all_of:
                    - kind: digimon
                    - level_lte: 5
                prompt: "Return 1 of your opponent's level 5 or lower Digimon to its owner's hand"
            - return_to_hand: { target: victim }
