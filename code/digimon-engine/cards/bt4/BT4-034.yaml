card: BT4-034
name: Regalecusmon
kind: digimon
level: 6
color: [blue]
cost: 11
dp: 11000
form: Mega
attribute: Virus
traits: [Aquatic]
alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: blue }
    cost: 3

effects:
  - text: "[When Attacking] Trash the bottom digivolution card of 1 of your opponent's Digimon. When you do, ＜Draw 1＞ (Draw 1 card from your deck.) and gain 1 memory."
    when: when_attacking
    summary: "[When Attacking] Trash the bottom digivolution card of 1 opponent Digimon; if trashed, <Draw 1> and gain 1 memory"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "Trash the bottom digivolution card of 1 of your opponent's Digimon"
      - trash_bottom_sources:
          target: target
          count: 1
          bind_trashed_as: trashed
      - if:
          condition: { binding_present: trashed }
          then:
            - draw: { of: you, count: 1 }
            - gain_memory: 1
