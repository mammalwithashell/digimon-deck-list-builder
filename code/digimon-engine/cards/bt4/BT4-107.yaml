card: BT4-107
name: Pollen Spray
kind: option
color: [green]
cost: 3

effects:
  - text: "[Main] Reveal the top 3 cards of your deck. Add all Digimon cards with ＜Digi-Burst＞ among them to your hand. Place the remaining cards at the bottom of your deck in any order. Then, suspend 1 of your opponent's Digimon for each card added to your hand by this effect."
    when: main_from_hand
    summary: "[Main] Reveal top 3; add all <Digi-Burst> Digimon to hand; bottom rest; suspend 1 opponent Digimon per card added"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          no_duplicate_cards: true
          buckets:
            - bind_as: added
              filter:
                all_of:
                  - kind: digimon
                  - printed_keyword: DigiBurst
              min: 3
              max: 3
          prompt: "Add all Digimon cards with <Digi-Burst> to your hand"
      - per_selected:
          selection: added
          bind_as: picked
          body:
            - add_to_hand_from_reveal: { of: you, card: picked }
      - place_remainder_on_deck: { of: you, position: bottom }
      - per_selected:
          selection: added
          bind_as: added_card
          body:
            - select_opponent_permanent:
                optional: false
                bind_as: target_opp
                filter: { kind: digimon }
                prompt: "Suspend 1 of your opponent's Digimon"
            - suspend: { target: target_opp }

  - text: "[Security] Activate this card's [Main] effects."
    when: on_security
    summary: "[Security] Activate this card's [Main] effects"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          no_duplicate_cards: true
          buckets:
            - bind_as: added
              filter:
                all_of:
                  - kind: digimon
                  - printed_keyword: DigiBurst
              min: 3
              max: 3
          prompt: "Add all Digimon cards with <Digi-Burst> to your hand"
      - per_selected:
          selection: added
          bind_as: picked
          body:
            - add_to_hand_from_reveal: { of: you, card: picked }
      - place_remainder_on_deck: { of: you, position: bottom }
      - per_selected:
          selection: added
          bind_as: added_card
          body:
            - select_opponent_permanent:
                optional: false
                bind_as: target_opp
                filter: { kind: digimon }
                prompt: "Suspend 1 of your opponent's Digimon"
            - suspend: { target: target_opp }
