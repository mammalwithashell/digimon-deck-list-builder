card: BT4-033
name: ZeedGarurumon
kind: digimon
level: 6
color: [blue]
cost: 11
dp: 12000
form: Mega
attribute: Data
traits: [Cyborg]
alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: blue }
    cost: 4

effects:
  - text: "[When Digivolving] ＜Digi-Burst 2＞ (You may trash 2 of this Digimon's digivolution cards to activate the effect below.) ・Return 1 of your opponent's level 5 or lower Digimon to its owner's hand."
    when: when_digivolving
    summary: "[When Digivolving] <Digi-Burst 2> Return 1 of your opponent's level 5 or lower Digimon to its owner's hand"
    process:
      - digi_burst:
          count: 2
          bind_as: burst_source
          prompt: "Choose 2 digivolution cards under this Digimon to trash for <Digi-Burst 2>"
          then:
            - select_opponent_permanent:
                optional: false
                bind_as: target
                filter: { kind: digimon, level_lte: 5 }
                prompt: "Return 1 of your opponent's level 5 or lower Digimon to its owner's hand"
            - return_to_hand: { target: target }
