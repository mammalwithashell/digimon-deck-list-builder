card: BT4-046
name: WarGrowlmon
kind: digimon
level: 5
color: [yellow]
cost: 8
dp: 7000
form: Ultimate
attribute: Data
traits: [Cyborg]
alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: yellow }
    cost: 3

effects:
  - text: "[Main] ＜Digi-Burst 2＞ (You may trash 2 of this Digimon's digivolution cards to activate the effect below.) ・1 of your opponent's Digimon gets -4000 DP for the turn."
    when: main_on_field
    summary: "[Main] <Digi-Burst 2> 1 of your opponent's Digimon gets -4000 DP for the turn"
    process:
      - digi_burst:
          count: 2
          bind_as: burst_source
          prompt: "Choose 2 digivolution cards under this Digimon to trash for <Digi-Burst 2>"
          then:
            - select_opponent_permanent:
                optional: false
                bind_as: target
                filter: { kind: digimon }
                prompt: "Choose 1 of your opponent's Digimon to get -4000 DP for the turn"
            - add_dp_modifier:
                target: target
                value: -4000
                expiry: end_of_turn

  - text: "[Your Turn] While you have 3 or fewer security cards, this Digimon gets +1000 DP."
    scope: inherited
    kind: aura
    active_when:
      all_of:
        - your_turn: true
        - security_count_lte: 3
    target: {}
    dp_modifier: 1000
    summary: "[Your Turn] While you have 3 or fewer security cards, this Digimon gets +1000 DP"
