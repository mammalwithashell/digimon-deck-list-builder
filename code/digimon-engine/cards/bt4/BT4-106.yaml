card: BT4-106
name: Purge Shine
kind: option
color: [yellow]
cost: 4

effects:
  - text: "[Main] All of your opponent's Digimon get -3000 DP for the turn."
    when: main_from_hand
    summary: "[Main] All of your opponent's Digimon get -3000 DP for the turn"
    process:
      - add_modifier:
          target: { owner: opponent, zone: [battle_area], kind: digimon }
          modifier: ChangeDp
          value: -3000
          expiry: end_of_turn

  - text: "[Security] Activate this card's [Main] effects."
    when: on_security
    summary: "[Security] Activate this card's [Main] effects"
    process:
      - add_modifier:
          target: { owner: opponent, zone: [battle_area], kind: digimon }
          modifier: ChangeDp
          value: -3000
          expiry: end_of_turn
