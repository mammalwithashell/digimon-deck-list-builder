card: BT4-063
name: Commandramon
kind: digimon
level: 3
color: [black]
cost: 3
dp: 1000
traits: [Cyborg, D-Brigade]
form: Rookie
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 0

effects:
  - text: "[On Deletion] Reveal the top 3 cards of your deck. You may play 1 [Commandramon] among them without paying its memory cost. Place the remaining cards at the bottom of your deck in any order."
    when: on_deletion
    summary: "[On Deletion] Reveal top 3; you may play 1 [Commandramon] without paying its cost; bottom the rest in any order"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          buckets:
            - bind_as: pick
              min: 0
              max: 1
              filter:
                all_of:
                  - can_play_from_effect_without_cost: true
                  - kind: digimon
                  - name_is: "Commandramon"
          prompt: "You may play 1 [Commandramon] without paying its memory cost"
      - play_from_revealed_free: { of: you, card: pick }
      - place_remainder_on_deck: { of: you, position: bottom }
