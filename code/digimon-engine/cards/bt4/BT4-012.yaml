card: BT4-012
name: GeoGreymon
kind: digimon
level: 4
color: [red]
cost: 5
dp: 5000
form: Champion
attribute: Vaccine
traits: [Dinosaur]

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: red }
    cost: 2

effects:
  - text: "[Main] ＜Digi-Burst 2＞ (You may trash 2 of this Digimon's digivolution cards to activate the effect below.) Delete 1 of your opponent's Digimon with 4000 DP or less."
    when: main_on_field
    summary: "[Main] <Digi-Burst 2> Delete 1 of your opponent's Digimon with 4000 DP or less"
    process:
      - digi_burst:
          count: 2
          bind_as: burst_sources
          prompt: "Choose 2 digivolution cards under this Digimon to trash for <Digi-Burst 2>"
          then:
            - select_opponent_permanent:
                optional: false
                bind_as: victim
                filter: { kind: digimon, dp_lte: 4000 }
                prompt: "Choose 1 of your opponent's Digimon with 4000 DP or less to delete"
            - delete_permanent: { target: victim }
