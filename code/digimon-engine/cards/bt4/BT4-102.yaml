card: BT4-102
name: Aqua Viper
kind: option
color: [blue]
cost: 3

effects:
  - text: "[Main] Return 1 of your Digimon to its owner's hand to return up to 2 of your opponent's level 4 or lower Digimon to their owners' hands."
    when: main_from_hand
    summary: "[Main] Return 1 of your Digimon to hand to return up to 2 of your opponent's Lv.4 or lower Digimon to hand"
    process:
      - if:
          condition:
            any_permanent:
              of: you
              zone: [battle_area]
              kind: digimon
          then:
            - select_own_permanent:
                optional: false
                bind_as: bounced_own
                filter: { kind: digimon }
                prompt: "Return 1 of your Digimon to its owner's hand"
            - return_to_hand: { target: bounced_own }
            - if:
                condition: { effect_returned_any_card: true }
                then:
                  - select_count_capped_multi:
                      of: opponent
                      zone: battle_area
                      max: 2
                      optional_zero: true
                      filter:
                        all_of:
                          - kind: digimon
                          - level_lte: 4
                      bind_as: bounced_opp
                      prompt: "Return up to 2 of your opponent's level 4 or lower Digimon to their owners' hands"
                  - per_selected:
                      selection: bounced_opp
                      bind_as: target
                      body:
                        - return_to_hand: { target: target }

  - text: "[Security] Add this card to the hand."
    when: on_security
    summary: "[Security] Add this card to the hand"
    process:
      - add_this_option_to_hand: {}
