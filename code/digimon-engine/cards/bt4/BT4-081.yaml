card: BT4-081
name: Devimon
kind: digimon
level: 4
color: [purple]
cost: 6
dp: 5000
traits: [Fallen Angel]
form: Champion
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: purple }
    cost: 2

effects:
  - text: "[Main] ＜Digi-Burst 2＞ (You may trash 2 of this Digimon's digivolution cards to activate the effect below.) ・Delete 1 of your opponent's level 3 Digimon."
    when: main_on_field
    summary: "[Main] <Digi-Burst 2> Delete 1 of your opponent's level 3 Digimon"
    process:
      - digi_burst:
          count: 2
          bind_as: burst_sources
          prompt: "Choose 2 digivolution cards under this Digimon to trash for <Digi-Burst 2>"
          then:
            - select_opponent_permanent:
                optional: false
                bind_as: del_target
                filter:
                  all_of:
                    - kind: digimon
                    - level_eq: 3
                prompt: "Delete 1 of your opponent's level 3 Digimon"
            - delete_permanent: { target: del_target }
