# BT4-111 Jack Raid — Option, Purple, Cost 0.
#
# Printed card text (official Bandai DB — data/card_bundles/BT4-111.md):
#   [Main] Gain 1 memory for every 10 cards in your trash.
#   [Security] Gain 2 memory.
#
# Official Q&A: Option cards go to the trash AFTER their effects activate, so
#   with 9 cards in trash when Jack Raid is used you still count 9 → gain 0.
#   The [Main] count therefore excludes this card (it is not yet in trash).
#
# Play requirement: standard Option colour requirement only (a purple Digimon
#   or Tamer on your field) — no extra printed use condition.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT4/Purple/BT4_111.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
# [Main] (OptionSkill, optional:false): AddMemory(TrashCards.Count / 10)
#   (integer division) → gain_memory floor_div(card_count_in_zone(you,
#   trash), 10).
# [Security] (SecuritySkill, optional:false): AddMemory(2) → inherited
#   on_security gain_memory 2.

card: BT4-111
name: "Jack Raid"
kind: option
color: [purple]
cost: 0
traits: []

effects:
  # ─── [Main] gain 1 memory per 10 cards in your trash ─────────────────────
  - when: main_from_hand
    optional: false
    summary: "[Main] Gain 1 memory for every 10 cards in your trash"
    process:
      - gain_memory:
          floor_div:
            - base: 0
              per:
                card_count_in_zone:
                  of: you
                  zone: trash
              delta: 1
            - 10

  # ─── [Security] gain 2 memory ────────────────────────────────────────────
  - when: on_security
    optional: false
    summary: "[Security] Gain 2 memory"
    process:
      - gain_memory: 2
