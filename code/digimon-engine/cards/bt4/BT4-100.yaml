card: BT4-100
name: Trident Revolver
kind: option
color: [red]
cost: 6

effects:
  - text: "[Main] Delete 1 of your opponent's Digimon with 6000 DP or less. Then, you may play 1 Tamer card with a play cost of 4 or less from your hand without paying its memory cost."
    when: main_from_hand
    summary: "[Main] Delete 1 opponent Digimon with 6000 DP or less; then you may play 1 Tamer card with play cost 4 or less from hand without paying cost"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: victim
          filter:
            all_of:
              - kind: digimon
              - dp_lte: 6000
          prompt: "Delete 1 of your opponent's Digimon with 6000 DP or less"
      - delete_permanent: { target: victim }
      - select_hand:
          of: you
          optional: true
          bind_as: tamer_card
          filter:
            all_of:
              - kind: tamer
              - play_cost_lte: 4
              - can_play_from_effect_without_cost: true
          prompt: "You may play 1 Tamer card with a play cost of 4 or less from your hand without paying its memory cost"
      - if:
          condition: { binding_present: tamer_card }
          then:
            - play_from_hand_free: { of: you, hand_index: tamer_card }

  - text: "[Security] Activate this card's [Main] effects."
    when: on_security
    summary: "[Security] Activate this card's [Main] effects"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: victim
          filter:
            all_of:
              - kind: digimon
              - dp_lte: 6000
          prompt: "Delete 1 of your opponent's Digimon with 6000 DP or less"
      - delete_permanent: { target: victim }
      - select_hand:
          of: you
          optional: true
          bind_as: tamer_card
          filter:
            all_of:
              - kind: tamer
              - play_cost_lte: 4
              - can_play_from_effect_without_cost: true
          prompt: "You may play 1 Tamer card with a play cost of 4 or less from your hand without paying its memory cost"
      - if:
          condition: { binding_present: tamer_card }
          then:
            - play_from_hand_free: { of: you, hand_index: tamer_card }
