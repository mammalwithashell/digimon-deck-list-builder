card: BT4-068
name: Baboongamon
kind: digimon
level: 4
color: [black]
cost: 5
dp: 4000
traits: [Beast]
form: Champion
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: black }
    cost: 2

effects:
  - text: "[Main] ＜Digi-Burst 2＞ (You may trash 2 of this Digimon's digivolution cards to activate the effect below.) ・＜De-Digivolve 1＞ 1 of your opponent's Digimon with a play cost of 7 or less. (Trash the top card. You can't trash past level 3 cards.)"
    when: main_on_field
    summary: "[Main] <Digi-Burst 2> <De-Digivolve 1> 1 of your opponent's Digimon with a play cost of 7 or less"
    process:
      - digi_burst:
          count: 2
          bind_as: burst_sources
          prompt: "Choose 2 digivolution cards under this Digimon to trash for <Digi-Burst 2>"
          then:
            - select_opponent_permanent:
                optional: false
                bind_as: de_digi_target
                filter:
                  all_of:
                    - kind: digimon
                    - play_cost_lte: 7
                prompt: "Choose 1 of your opponent's Digimon with a play cost of 7 or less to <De-Digivolve 1>"
            - de_digivolve: { target: de_digi_target, amount: 1, stop_at_level: 3 }
