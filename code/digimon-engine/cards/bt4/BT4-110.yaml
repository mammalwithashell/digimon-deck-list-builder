card: BT4-110
name: Dark Roar
kind: option
color: [black]
cost: 3

effects:
  - text: "[Main] Delete 1 of your opponent's Digimon with a play cost of 3 or less. For each of your Digimon with the [D-Brigade] trait, add +1 to the maximum play cost of the Digimon you can choose with this effect."
    when: main_from_hand
    summary: "[Main] Delete 1 opponent Digimon with play cost <= 3 + (# of your [D-Brigade] Digimon)"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: victim
          filter:
            all_of:
              - kind: digimon
              - play_cost_lte:
                  formula:
                    base: 3
                    per:
                      card_count_in_zone:
                        of: you
                        zone: battle_area
                        filter:
                          all_of:
                            - kind: digimon
                            - trait_has: "D-Brigade"
                    delta: 1
          prompt: "Delete 1 of your opponent's Digimon within the play cost limit"
      - delete_permanent: { target: victim }

  - text: "[Security] Activate this card's [Main] effects."
    when: on_security
    summary: "[Security] Activate this card's [Main] effects"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: victim
          filter:
            all_of:
              - kind: digimon
              - play_cost_lte:
                  formula:
                    base: 3
                    per:
                      card_count_in_zone:
                        of: you
                        zone: battle_area
                        filter:
                          all_of:
                            - kind: digimon
                            - trait_has: "D-Brigade"
                    delta: 1
          prompt: "Delete 1 of your opponent's Digimon within the play cost limit"
      - delete_permanent: { target: victim }
