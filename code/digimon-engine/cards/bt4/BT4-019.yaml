card: BT4-019
name: VictoryGreymon
kind: digimon
level: 6
color: [red]
cost: 11
dp: 12000
form: Mega
attribute: Vaccine
traits: [Dragonkin]

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: red }
    cost: 4

effects:
  - text: "[When Digivolving] ＜Digi-Burst 2＞ (You may trash 2 of this Digimon's digivolution cards to activate the effect below.) Delete 1 of your opponent's Digimon with 8000 DP or less."
    when: when_digivolving
    optional: true
    summary: "[When Digivolving] <Digi-Burst 2> Delete 1 of your opponent's Digimon with 8000 DP or less"
    process:
      - digi_burst:
          count: 2
          bind_as: burst_sources
          prompt: "Choose 2 digivolution cards under this Digimon to trash for <Digi-Burst 2>"
          then:
            - select_opponent_permanent:
                optional: false
                bind_as: victim
                filter: { kind: digimon, dp_lte: 8000 }
                prompt: "Choose 1 of your opponent's Digimon with 8000 DP or less to delete"
            - delete_permanent: { target: victim }
