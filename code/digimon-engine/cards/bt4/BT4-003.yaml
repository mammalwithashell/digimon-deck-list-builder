card: BT4-003
name: Koromon
kind: digi_egg
level: 2
color: [yellow]
cost: 0
form: In-Training
traits: [Lesser]

effects:
  - text: "[When Attacking] [Once Per Turn] If you have 3 or fewer security cards, 1 of your opponent's Digimon gets -1000 DP for the turn."
    scope: inherited
    when: when_attacking
    once_per_turn: true
    condition:
      security_count_lte: 3
    summary: "[Inherited][When Attacking][Once Per Turn] If you have 3 or fewer security cards, 1 opponent Digimon gets -1000 DP for the turn"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: victim
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to get -1000 DP for the turn"
      - add_dp_modifier:
          target: victim
          value: -1000
          expiry: end_of_turn
