card: EX10-025
name: Sunarizamon
kind: digimon
level: 3
color: [black]
cost: 3
dp: 1000
traits: [Reptile, LIBERATOR]
attribute: Virus
alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 0

effects:
  # ─── [On Play] clause ─────────────────────────────────────────────────────
  #
  # Printed text: "You may place 2 cards with the [Mineral] or [Rock] trait
  # from your trash as 1 of your [Mineral] or [Rock] trait Digimon's bottom
  # digivolution cards."
  #
  # Modelling rationale:
  #   - "You may" → optional: true; the first step is an optional
  #     select_own_permanent gate that doubles as the target pick.
  #   - Target: one of your own Digimon on the field with [Mineral] or [Rock].
  #   - Source: 2 cards from own trash with [Mineral] or [Rock] trait.
  #   - Sequence: pick target → pick 1st trash card + place → pick 2nd trash
  #     card + place.  The 1st card moves to the digivolution stack before the
  #     2nd pick, so the 2nd select_trash naturally excludes it (the card is
  #     no longer in trash).
  #   - Pattern matches BT24-016 (select_trash → place_as_bottom_source from
  #     trash) repeated twice.
  - when: on_play
    optional: true
    summary: "[On Play] You may place 2 [Mineral]/[Rock] cards from trash as a [Mineral]/[Rock] Digimon's bottom digivolution cards"
    condition:
      any_permanent:
        of: you
        zone: [battle_area]
        kind: digimon
        any_of:
          - trait_has: Mineral
          - trait_has: Rock
    process:
      # Gate + target selection: pick the destination Digimon (optional — PASS declines).
      - select_own_permanent:
          bind_as: dest
          optional: true
          filter:
            all_of:
              - kind: digimon
              - any_of:
                  - trait_has: Mineral
                  - trait_has: Rock
          prompt: "Choose 1 of your [Mineral] or [Rock] Digimon to place trash cards under"
      # First trash pick + placement.
      - select_trash:
          of: you
          bind_as: source1
          filter:
            any_of:
              - trait_has: Mineral
              - trait_has: Rock
          prompt: "Choose the first [Mineral] or [Rock] card from your trash (1/2)"
      - place_as_bottom_source:
          source: source1
          target: dest
      # Second trash pick + placement.
      - select_trash:
          of: you
          bind_as: source2
          filter:
            any_of:
              - trait_has: Mineral
              - trait_has: Rock
          prompt: "Choose the second [Mineral] or [Rock] card from your trash (2/2)"
      - place_as_bottom_source:
          source: source2
          target: dest
  - scope: inherited
    when: on_digivolution_card_trashed
    condition:
      all_of:
        - event_target_owner: you
        - trashed_source_card_id_is: EX10-025
        - any_of:
            - host_permanent_trait_has: Mineral
            - host_permanent_trait_has: Rock
        - any_permanent:
            of: opponent
            zone: [battle_area]
            kind: digimon
            play_cost_lte: 4
    summary: "When this source is trashed from a Mineral/Rock Digimon, delete an opponent Digimon cost 4 or less"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon, play_cost_lte: 4 }
          prompt: "Choose 1 opponent Digimon with play cost 4 or less"
      - delete_permanent: { target: target }
