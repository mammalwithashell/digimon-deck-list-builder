card: EX10-025
name: Sunarizamon
kind: digimon
level: 3
color: [black]
cost: 3
dp: 1000
traits: [Reptile, LIBERATOR, Mineral]
attribute: Virus
alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 0

effects:
  # ─── [On Play] clause ─────────────────────────────────────────────────────
  #
  # Printed text: "You may place 2 cards with the [Mineral] or [Rock] trait
  # from your trash as 1 of your [Mineral] or [Rock] trait Digimon's bottom
  # digivolution cards."
  #
  # Modelling rationale (DCGO EX10_025.cs ActivateCoroutine - the effect is
  # registered NON-optional; every "may" is a `canNoSelect` pick):
  #   1. ONE pick over the trash for [Mineral]/[Rock] cards: exactly
  #      min(2, eligible) of them, or none (`canEndNotMax: false`).
  #   2. Only if cards were picked, ONE pick of the destination Digimon
  #      ([Mineral]/[Rock], skippable); declining leaves the cards in the trash.
  #   3. The picked cards go under it as bottom digivolution cards.
  # `select_zone_cards` bounds are constants, so the "min(2, eligible)" is a
  # branch on the eligible count.
  - when: on_play
    summary: "[On Play] You may place 2 [Mineral]/[Rock] cards from trash as a [Mineral]/[Rock] Digimon's bottom digivolution cards"
    condition:
      all_of:
        - count_gte:
            filter:
              of: you
              zone: [trash]
              any_of:
                - trait_has: Mineral
                - trait_has: Rock
            n: 1
        - any_permanent:
            of: you
            zone: [battle_area]
            kind: digimon
            any_of:
              - trait_has: Mineral
              - trait_has: Rock
    process:
      - if:
          condition:
            count_gte:
              filter:
                of: you
                zone: [trash]
                any_of:
                  - trait_has: Mineral
                  - trait_has: Rock
              n: 2
          then:
            - select_zone_cards:
                zones: [trash]
                filter:
                  any_of:
                    - trait_has: Mineral
                    - trait_has: Rock
                min: 2
                max: 2
                optional_zero: true
                bind_as: sources
                prompt: "You may place 2 [Mineral] or [Rock] cards from your trash as bottom digivolution cards"
          else:
            - select_zone_cards:
                zones: [trash]
                filter:
                  any_of:
                    - trait_has: Mineral
                    - trait_has: Rock
                min: 1
                max: 1
                optional_zero: true
                bind_as: sources
                prompt: "You may place 1 [Mineral] or [Rock] card from your trash as a bottom digivolution card"
      - if:
          condition: { binding_present: sources }
          then:
            - select_own_permanent:
                bind_as: dest
                optional: true
                filter:
                  all_of:
                    - kind: digimon
                    - any_of:
                        - trait_has: Mineral
                        - trait_has: Rock
                prompt: "Choose 1 of your [Mineral] or [Rock] Digimon to place trash cards under"
            - if:
                condition: { binding_present: dest }
                then:
                  - place_cards_as_bottom_sources: { cards: sources, target: dest }
  - scope: inherited
    when: on_digivolution_card_trashed
    condition:
      all_of:
        - trashed_source_card_id_is: EX10-025
        - any_permanent:
            of: opponent
            zone: [battle_area]
            kind: digimon
            play_cost_lte: 4
    trigger_if:
      all_of:
        - event_target_owner: you
        - any_of:
            - host_permanent_trait_has: Mineral
            - host_permanent_trait_has: Rock
    summary: "When this source is trashed from a Mineral/Rock Digimon, delete an opponent Digimon cost 4 or less"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon, play_cost_lte: 4 }
          prompt: "Choose 1 opponent Digimon with play cost 4 or less"
      - delete_permanent: { target: target }
