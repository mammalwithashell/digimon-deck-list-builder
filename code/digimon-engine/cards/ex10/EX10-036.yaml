card: EX10-036
name: Magneticdramon
kind: digimon
level: 7
color: [black]
cost: 14
dp: 14000
traits: [Rock Dragon, LIBERATOR, Mineral]
attribute: Virus
alt_paths:
  - kind: digivolve
    from: { level_eq: 6, color_is: black }
    cost: 6

# Authoritative card text (data/cards.json):
#
#   ＜Fragment (3)＞
#   [When Digivolving] [When Attacking] By trashing 3 [Mineral] or [Rock]
#     trait cards from any of your Digimon's digivolution cards, delete 1 of
#     your opponent's Digimon and trash their top security card.
#   [When Digivolving] [When Attacking] [Once Per Turn] By placing 3 [Mineral]
#     or [Rock] trait cards from your trash as this Digimon's bottom
#     digivolution cards, it unsuspends.
#
# ─── Clause A: [WD][WA] trash 3 Mineral/Rock sources → delete + security ───
#
# Cost: select exactly 3 Mineral/Rock trait source cards from any of your own
# Digimon's digivolution stacks (no `from:` restricts to the carrier; all own
# Digimon's stacks are scanned). If fewer than 3 qualify, `select_own_sources`
# silently skips per the no-approximations silent-skip contract.
#
# Effect: delete 1 chosen opponent Digimon + trash opponent's top security card.
# Both are unconditional once the cost is paid; the effect sequence runs
# entirely inside the `then:` block of the cost selection.
#
# ─── Clause B: [WD][WA][OPT] place 3 Mineral/Rock from trash → unsuspend ──
#
# "By placing 3 [Mineral] or [Rock] trait cards from your trash as this
# Digimon's bottom digivolution cards, it unsuspends."
#
# Modelling rationale:
#   - `optional: true` on the clause: the player may decline the whole clause.
#   - The first `select_trash` also has `optional: true` so the player can
#     PASS at the first pick prompt to decline the cost.
#   - Three sequential `select_trash` steps (each removes the picked card from
#     trash before the next pick, naturally excluding already-chosen cards).
#   - `place_as_bottom_source: { source: srcN, target: source }` places each
#     picked card as this Digimon's (source permanent's) bottom digivolution
#     card.
#   - `once_per_turn: true` enforces the [Once Per Turn] OPT lockout.
#
# ─── Implementation status ───────────────────────────────────────────────────
#
# | Card-text element                                          | Status      |
# |------------------------------------------------------------|-------------|
# | <Fragment (3)> keyword                                     | IMPLEMENTED |
# | [WD][WA] trash 3 Mineral/Rock sources (cost)              | IMPLEMENTED |
# | [WD][WA] delete 1 opponent Digimon                        | IMPLEMENTED |
# | [WD][WA] trash opponent's top security card               | IMPLEMENTED |
# | [WD][WA][OPT] place 3 Mineral/Rock from trash (cost)      | IMPLEMENTED |
# | [WD][WA][OPT] unsuspend this Digimon                      | IMPLEMENTED |

effects:
  # ─── Printed keyword ──────────────────────────────────────────────────────
  - kind: grant_keyword
    keyword: Fragment
    value: 3

  # ─── Clause A: [WD][WA] source-trash delete + security-trash ─────────────
  #
  # Cost: trash exactly 3 Mineral/Rock trait cards from any of your Digimon's
  # digivolution stacks. Effect: delete 1 opponent Digimon + trash their top
  # security card (both inside the `then:` block so they only run if the cost
  # is fully paid).
  - when: [when_digivolving, when_attacking]
    summary: "[WD][WA] Trash 3 Mineral/Rock sources → delete 1 opp Digimon + trash opp top security"
    process:
      - select_own_sources:
          filter:
            any_of:
              - trait_has: Mineral
              - trait_has: Rock
          min: 3
          max: 3
          bind_as: cost_sources
          prompt: "Trash 3 [Mineral] or [Rock] cards from your Digimon's digivolution cards"
          then:
            - trash_selected_sources: { source_refs: cost_sources }
            - select_opponent_permanent:
                bind_as: victim
                filter: { kind: digimon }
                prompt: "Delete 1 of your opponent's Digimon"
            - delete_permanent: { target: victim }
            - trash_top_security: { of: opponent }

  # ─── Clause B: [WD][WA][OPT] trash-to-source unsuspend ───────────────────
  #
  # Cost: place 3 Mineral/Rock cards from own trash as THIS Digimon's bottom
  # digivolution cards. Effect: this Digimon unsuspends.
  # Optional at the clause level and the first select_trash step so the player
  # can PASS at the first prompt to decline the whole cost.
  - when: [when_digivolving, when_attacking]
    once_per_turn: true
    optional: true
    summary: "[WD][WA][OPT] Place 3 Mineral/Rock from trash as bottom sources → unsuspend"
    process:
      # Pick 1st Mineral/Rock card from trash (optional — PASS declines the clause).
      - select_trash:
          of: you
          bind_as: src1
          optional: true
          filter:
            any_of:
              - trait_has: Mineral
              - trait_has: Rock
          prompt: "Choose 1st [Mineral] or [Rock] card from your trash (1/3)"
      - place_as_bottom_source:
          source: src1
          target: source
      # Pick 2nd Mineral/Rock card from trash.
      - select_trash:
          of: you
          bind_as: src2
          filter:
            any_of:
              - trait_has: Mineral
              - trait_has: Rock
          prompt: "Choose 2nd [Mineral] or [Rock] card from your trash (2/3)"
      - place_as_bottom_source:
          source: src2
          target: source
      # Pick 3rd Mineral/Rock card from trash.
      - select_trash:
          of: you
          bind_as: src3
          filter:
            any_of:
              - trait_has: Mineral
              - trait_has: Rock
          prompt: "Choose 3rd [Mineral] or [Rock] card from your trash (3/3)"
      - place_as_bottom_source:
          source: src3
          target: source
      # Effect: unsuspend this Digimon.
      - unsuspend: { target: source }
