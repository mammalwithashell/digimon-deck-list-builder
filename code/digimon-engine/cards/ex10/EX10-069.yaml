card: EX10-069
name: "Unique Emblem: Gravel Hearts"
kind: option
color: [black]
cost: 3

# Printed text (cards.json effect_description_eng):
# [Main] You may play 1 [Sunarizamon] or [Close] from your hand or trash
# without paying the cost. Then, place this card in the battle area.
#
# [Your Turn] When any of your [Close]s suspend, <Delay> (By trashing
# this card after the placing turn, activate the effect below.)
# ・1 of your [Mineral] or [Rock] trait Digimon may digivolve into a Digimon
# card with the [Mineral] trait and [LIBERATOR] trait in the hand with the
# digivolution cost reduced by 3.
#
# Fully implemented:
# - [Main] hand/trash play, optional, filtered to [Sunarizamon] or [Close].
# - "Then, place this card in the battle area": EX10-069 carries a `kind: delay`
#   clause, so the Option pipeline classifies it as a Delay Option and places it
#   in the battle area automatically after the [Main] body resolves.
# - Event-gated Delay activation after the placing turn when your [Close]
#   suspends, with visible [Mineral]/[Rock] base and [Mineral]+[LIBERATOR]
#   hand-evolution selections before effect_initiated_digivolve with cost
#   reduced by 3. (Pattern: BT22-098 Unique Emblem: Fable Waltz, same shape.)
# - [Security] re-runs the [Main] play, then places this card in the battle
#   area via `place_self_as_delay_option`.
#
# Candidate legality (G-DSL-PLAY-OR-USE-CANDIDATE-LEGALITY):
# - [Main] / [Security] picks offer only a [Sunarizamon] / [Close] this effect
#   can actually play (free battle-area slot, no play prohibition; a trash card
#   is also refused under CannotPlayFromTrash) — `can_play_from_effect_without_
#   cost: true`. DCGO EX10_069.cs:33-37 CanSelectCardCondition reads
#   `EqualsCardName("Sunarizamon") || EqualsCardName("Close") &&
#   CanPlayAsNewPermanent(...)`: by C# precedence the playability check binds
#   only to [Close], so DCGO offers an unplayable [Sunarizamon]. That is looser
#   than the rules (CR 4.3 1-3-2: an impossible action is not carried out;
#   7-1-1), so the check applies to both names here.
# - The "From hand / From trash" choice offers only a zone holding such a card,
#   is skipped when exactly one zone does, and binds nothing when neither does
#   (DCGO EX10_069.cs:41-71 canSelectHand / canSelectTrash → SetBoolSelection,
#   SetBool(canSelectHand), or no selection) — `legal_when`.
# - <Delay> digivolve: the hand pick offers only a card that can digivolve onto
#   the chosen Digimon and whose cost (reduced by 3) can be paid. DCGO
#   CardEffectCommons.cs:858-880 DigivolveIntoHandOrTrashCard filters with
#   CanPlayCardTargetFrame(frame, PayCost: true, ...) (EX10_069.cs:243-253,
#   payCost: true, reduceCost: 3) — `can_digivolve_onto_with_cost`.

effects:
  # [Main] hand/trash play. No explicit placement step: EX10-069 is a Delay
  # Option (see the `kind: delay` clause below), so the Option pipeline places
  # it in the battle area automatically once this [Main] body resolves.
  - when: main_from_hand
    optional: true
    summary: "[Main] You may play 1 Sunarizamon or Close from hand or trash free"
    process:
      - select_effect_choice:
          labels: ["From hand", "From trash"]
          legal_when:
            - count_gte:
                filter:
                  of: you
                  zone: [hand]
                  all_of:
                    - any_of:
                        - name_is: Sunarizamon
                        - name_is: Close
                    - can_play_from_effect_without_cost: true
                n: 1
            - count_gte:
                filter:
                  of: you
                  zone: [trash]
                  all_of:
                    - any_of:
                        - name_is: Sunarizamon
                        - name_is: Close
                    - can_play_from_effect_without_cost: true
                n: 1
          bind_as: zone_choice
          prompt: "From which area do you play a card?"
      - if:
          condition: { equals: [zone_choice, 0] }
          then:
            - select_hand:
                of: you
                bind_as: picked_hand
                optional: true
                filter:
                  all_of:
                    - any_of:
                        - name_is: Sunarizamon
                        - name_is: Close
                    - can_play_from_effect_without_cost: true
                prompt: "Select Sunarizamon or Close from your hand"
            - play_from_hand_free: { of: you, hand_index: picked_hand }
      - if:
          condition: { equals: [zone_choice, 1] }
          then:
            - select_trash:
                of: you
                bind_as: picked_trash
                optional: true
                filter:
                  all_of:
                    - any_of:
                        - name_is: Sunarizamon
                        - name_is: Close
                    - can_play_from_effect_without_cost: true
                prompt: "Select Sunarizamon or Close from your trash"
            - play_from_trash_free: { of: you, hand_index: picked_trash }

  - scope: inherited
    when: on_security
    optional: false
    summary: "[Security] Activate [Main]: play Sunarizamon/Close from hand or trash, then place self in battle area"
    process:
      - select_effect_choice:
          labels: ["From hand", "From trash"]
          legal_when:
            - count_gte:
                filter:
                  of: you
                  zone: [hand]
                  all_of:
                    - any_of:
                        - name_is: Sunarizamon
                        - name_is: Close
                    - can_play_from_effect_without_cost: true
                n: 1
            - count_gte:
                filter:
                  of: you
                  zone: [trash]
                  all_of:
                    - any_of:
                        - name_is: Sunarizamon
                        - name_is: Close
                    - can_play_from_effect_without_cost: true
                n: 1
          bind_as: zone_choice
          prompt: "From which area do you play a card?"
      - if:
          condition: { equals: [zone_choice, 0] }
          then:
            - select_hand:
                of: you
                bind_as: picked_hand
                optional: true
                filter:
                  all_of:
                    - any_of:
                        - name_is: Sunarizamon
                        - name_is: Close
                    - can_play_from_effect_without_cost: true
                prompt: "Select Sunarizamon or Close from your hand"
            - play_from_hand_free: { of: you, hand_index: picked_hand }
      - if:
          condition: { equals: [zone_choice, 1] }
          then:
            - select_trash:
                of: you
                bind_as: picked_trash
                optional: true
                filter:
                  all_of:
                    - any_of:
                        - name_is: Sunarizamon
                        - name_is: Close
                    - can_play_from_effect_without_cost: true
                prompt: "Select Sunarizamon or Close from your trash"
            - play_from_trash_free: { of: you, hand_index: picked_trash }
      - place_self_as_delay_option: {}

  # [Your Turn] When any of your [Close]s suspend, <Delay>:
  # 1 of your [Mineral] or [Rock] trait Digimon may digivolve into a Digimon
  # card with [Mineral] and [LIBERATOR] traits in hand, cost reduced by 3.
  - kind: delay
    trigger: on_suspend
    active_when:
      your_turn: true
      event_target_owner: you
      event_card_name_contains: "Close"
    summary: "[Your Turn] When your Close suspends, Delay: Mineral/Rock may digivolve into Mineral+LIBERATOR in hand, cost -3"
    process:
      - select_own_permanent:
          bind_as: target
          optional: true
          filter:
            all_of:
              - kind: digimon
              - any_of:
                  - trait_has: Mineral
                  - trait_has: Rock
              - zone: [battle_area]
          prompt: "Choose 1 of your [Mineral] or [Rock] trait Digimon to digivolve"
      - select_hand:
          of: you
          bind_as: evo
          optional: false
          filter:
            all_of:
              - kind: digimon
              - trait_has: Mineral
              - trait_has: LIBERATOR
              - can_digivolve_onto_with_cost: { target: target, cost: { reduce: 3 } }
          prompt: "Choose a [Mineral] and [LIBERATOR] Digimon card to digivolve into"
      - effect_initiated_digivolve:
          target: target
          from_hand: evo
          cost: { reduce: 3 }
          ignore_requirements: false
