# EX10-032 Proganomon — Digimon, Black, Level 5, Cost 7, 7000 DP
# Traits: [Mineral, LIBERATOR]
#
# Printed card text (cards.json / authoritative):
#
#   [Hand] [Main] If you have [Close], by placing 1 [Landramon] from your
#     trash as any of your [Sunarizamon]'s bottom digivolution card, it
#     digivolves into this card for a digivolution cost of 3, ignoring
#     digivolution requirements.
#
#   [On Play] [When Digivolving] [When Attacking] By trashing any 1 [Mineral]
#     or [Rock] trait card from your Digimon's digivolution cards, 1 of your
#     such Digimon gains ＜Collision＞, ＜Piercing＞ and +3000 DP until your
#     opponent's turn ends.
#
#   Inherited: When effects trash this card from a [Mineral] or [Rock] trait
#     Digimon's digivolution cards, ＜De-Digivolve 1＞ 1 of your opponent's
#     Digimon.
#
# ─── Clause 1: [Hand][Main] alt-digivolve via placing Landramon from trash ──
#
# Condition:
#   - You control a Close (EX11-065) Tamer in your battle area.
#   - You control a Sunarizamon Digimon in your battle area.
#   - You have at least 1 Landramon in your trash (cost must be payable).
#
# Cost / body:
#   1. Select 1 Landramon from your trash.
#   2. Select 1 of your Sunarizamon Digimon.
#   3. Place the Landramon as Sunarizamon's bottom digivolution card.
#   4. Effect-initiated digivolve: Sunarizamon → EX10-032 from hand at cost 3,
#      ignoring requirements.
#
# `from_hand: self` resolves to ctx.source_card (this EX10-032 card in hand)
# via the hand-card path in resolve_card_source_ref. Pattern matches BT22-036
# Chaperomon's [Hand][Main] clause exactly.
#
# ─── Clause 2: [On Play][When Digivolving][When Attacking] source-trash buff ─
#
# "By trashing any 1 [Mineral] or [Rock] trait card from your Digimon's
# digivolution cards, 1 of your such Digimon gains <Collision> + <Piercing>
# + +3000 DP until your opponent's turn ends."
#
# Step layout:
#   1. select_own_sources — no `from:` restriction; filter: source card must
#      have Mineral or Rock trait. Scans ALL own Digimon's source stacks.
#   2. trash_selected_sources — trash the chosen source card.
#   3. select_own_permanent — choose 1 of your Mineral/Rock Digimon for buffs.
#   4. grant_keyword Collision (expiry: end_of_opponents_turn).
#   5. grant_keyword Piercing (expiry: end_of_opponents_turn).
#   6. add_dp_modifier +3000 (expiry: end_of_opponents_turn).
#
# Note: EX10-032 does NOT grant Reboot or return-immunity (unlike EX8-070).
# "1 of your such Digimon" = one of your Digimon with Mineral or Rock trait.
# If no Mineral/Rock source exists, select_own_sources returns early. If no
# Mineral/Rock Digimon exists after trashing, select_own_permanent returns
# early. Both are per the no-approximations silent-skip contract.
#
# ─── Clause 3: Inherited source-trash De-Digivolve ──────────────────────────
#
# Already implemented (prior pass).
#
# ─── Implementation status ───────────────────────────────────────────────────
#
# | Card-text element                                     | Status       |
# |-------------------------------------------------------|--------------|
# | [Hand][Main] Close gate + Landramon place + digivolve | IMPLEMENTED  |
# | [OP][WD][WA] trash Mineral/Rock source                | IMPLEMENTED  |
# | [OP][WD][WA] grant Collision until EoOT               | IMPLEMENTED  |
# | [OP][WD][WA] grant Piercing until EoOT                | IMPLEMENTED  |
# | [OP][WD][WA] +3000 DP until EoOT                     | IMPLEMENTED  |
# | Inherited De-Digivolve 1                              | IMPLEMENTED  |

card: EX10-032
name: Proganomon
kind: digimon
level: 5
color: [black]
cost: 7
dp: 7000
traits: [Mineral, LIBERATOR]
attribute: Virus
alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: black }
    cost: 3

effects:
  # ─── Clause 1: [Hand][Main] ──────────────────────────────────────────────
  #
  # Activate from hand: place 1 Landramon from trash as Sunarizamon's bottom
  # digivolution card, then effect-digivolve Sunarizamon into EX10-032 at
  # cost 3 ignoring requirements. Requires a Close Tamer on the field.
  - when: main_from_hand
    summary: "[Hand][Main] If you have Close, place Landramon from trash under Sunarizamon, digivolve into this card for 3 ignoring requirements"
    condition:
      all_of:
        - any_permanent:
            of: you
            zone: [battle_area]
            kind: tamer
            name_is: "Close"
        - any_permanent:
            of: you
            zone: [battle_area]
            kind: digimon
            name_is: "Sunarizamon"
        - count_gte:
            filter:
              owner: you
              zone: [trash]
              name_is: "Landramon"
            n: 1
    process:
      - select_trash:
          of: you
          bind_as: landramon
          filter: { name_is: "Landramon" }
          prompt: "Choose 1 Landramon from your trash"
      - select_own_permanent:
          bind_as: sunarizamon
          filter: { kind: digimon, name_is: "Sunarizamon" }
          prompt: "Choose 1 of your Sunarizamon to place Landramon under and digivolve"
      - place_as_bottom_source: { source: landramon, target: sunarizamon }
      - effect_initiated_digivolve:
          target: sunarizamon
          from_hand: self
          cost: 3
          ignore_requirements: true

  # ─── Clause 2: [On Play][When Digivolving][When Attacking] buff ──────────
  #
  # Cost: trash 1 Mineral/Rock trait source from any of your Digimon's
  # digivolution cards. Effect: 1 of your Mineral/Rock Digimon gains
  # Collision + Piercing + +3000 DP until end of opponent's turn.
  #
  # §15-7-1: "Optional processing conditions include text such as 'by X, Y.'"
  # — "By trashing any 1 [Mineral] or [Rock] trait card from your Digimon's
  # digivolution cards, 1 of your such Digimon gains <Collision>, <Piercing>
  # and +3000 DP" is exactly that shape. (The keywords are only the PAYOFF;
  # the trash is a real cost belonging to this clause, not a keyword's own
  # reminder-text cost, so the clause is in scope.) §15-7-4: "A player can
  # choose whether or not to execute the content of optional processing
  # conditions, regardless of whether or not the content of the conditions can
  # be executed." §15-7-2: declining skips BOTH the trash AND the
  # keyword/DP grant. Rule 17 requires the decline to reach the action space.
  #
  # DCGO agrees behaviourally, though it encodes the choice differently:
  # EX10_032.cs:336/359/382 pass isOptional=`false` to SetUpActivateClass, but
  # the FIRST step of `SharedActivateCoroutine` (EX10_032.cs:~205,
  # "Select Permanent to trash Digivolution Cards") is installed with
  # `canNoSelect: true`, and everything downstream is gated on
  # `if (selectedPermanment != null)`. So DCGO's decline path is the inner
  # PASS on that first selection, taken BEFORE any card is trashed — the same
  # semantics §15-7-2 requires.
  #
  # Our body's first step is `select_own_sources` with min: 1, which
  # `body_first_step_is_declinable` treats as NOT declinable
  # (`SelectOwnSources { min, .. } => *min == 0`), so the inner PASS DCGO
  # relies on does not exist here. `outer_prompt: true` supplies the
  # equivalent accept/decline before the cost is paid.
  #
  # NOTE: clause 1 ([Hand][Main] "by placing 1 [Landramon] ...") is deliberately
  # NOT marked optional — a `main_from_hand` clause is mask-offered (hand-[Main]
  # bits 30-59, `hand_main_match`), so activating it IS the player's opt-in and
  # an `optional:` flag would double-prompt. DCGO matches: EX10_032.cs:20 passes
  # isOptional=false and its first inner select uses `canNoSelect: () => false`.
  - when: [on_play, when_digivolving, when_attacking]
    optional: true
    outer_prompt: true
    summary: "[OP][WD][WA] MAY trash 1 Mineral/Rock source → 1 of your Mineral/Rock Digimon gains Collision + Piercing + +3000 DP until EoOT"
    process:
      # Step 1: Select 1 Mineral/Rock trait source card from any of your
      # Digimon's digivolution cards to trash (the cost).
      - select_own_sources:
          filter:
            any_of:
              - trait_has: Mineral
              - trait_has: Rock
          min: 1
          max: 1
          bind_as: chosen_source
          prompt: "Choose 1 [Mineral] or [Rock] trait card from your Digimon's digivolution cards to trash"

      # Step 2: Trash the chosen source card.
      - trash_selected_sources: { source_refs: chosen_source }

      # Step 3: Select 1 of your Mineral/Rock Digimon to receive the buffs.
      - select_own_permanent:
          bind_as: target_digi
          filter:
            all_of:
              - kind: digimon
              - any_of:
                  - trait_has: Mineral
                  - trait_has: Rock
          prompt: "Choose 1 of your [Mineral] or [Rock] trait Digimon to gain Collision + Piercing + +3000 DP"

      # Step 4: Grant Collision until end of opponent's turn.
      - grant_keyword:
          target: target_digi
          keyword: Collision
          expiry: end_of_opponents_turn

      # Step 5: Grant Piercing until end of opponent's turn.
      - grant_keyword:
          target: target_digi
          keyword: Piercing
          expiry: end_of_opponents_turn

      # Step 6: +3000 DP until end of opponent's turn.
      - add_dp_modifier:
          target: target_digi
          value: 3000
          expiry: end_of_opponents_turn

  # ─── Clause 3: Inherited source-trash De-Digivolve ───────────────────────
  #
  # When effects trash this card from a Mineral/Rock Digimon's digivolution
  # cards, De-Digivolve 1 one of your opponent's Digimon.
  - scope: inherited
    when: on_digivolution_card_trashed
    condition:
      all_of:
        - event_target_owner: you
        - trashed_source_card_id_is: EX10-032
        - any_of:
            - host_permanent_trait_has: Mineral
            - host_permanent_trait_has: Rock
        - any_permanent:
            of: opponent
            zone: [battle_area]
            kind: digimon
    summary: "When this source is trashed from a Mineral/Rock Digimon, De-Digivolve 1"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon to De-Digivolve 1"
      - de_digivolve:
          target: target
          amount: 1
          stop_at_level: 3
