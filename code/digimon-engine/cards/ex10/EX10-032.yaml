card: EX10-032
name: Proganomon
kind: digimon
level: 5
color: [black]
cost: 7
dp: 7000
traits: [Mineral, LIBERATOR]
attribute: Virus
alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: black }
    cost: 3

# Printed hand-main and face-up source-trash buff clauses are not authored in
# this pass. The inherited source-trash De-Digivolve clause is covered below.

effects:
  - scope: inherited
    when: on_digivolution_card_trashed
    condition:
      all_of:
        - event_target_owner: you
        - trashed_source_card_id_is: EX10-032
        - any_of:
            - host_permanent_trait_has: Mineral
            - host_permanent_trait_has: Rock
        - any_permanent:
            of: opponent
            zone: [battle_area]
            kind: digimon
    summary: "When this source is trashed from a Mineral/Rock Digimon, De-Digivolve 1"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon to De-Digivolve 1"
      - de_digivolve:
          target: target
          amount: 1
          stop_at_level: 3
