# BT13-065 PlatinumSukamon — Digimon, Lv.4, Black, DP 2000, Cost 3.
# Traits: Mutant. Form: Champion. Attribute: Virus.
#
# Printed text (official Bandai DB bundle data/card_bundles/BT13-065.md,
# authoritative; DCGO BT13_065.cs cross-checked):
#
#   Evo box: Black Lv.3 / cost 2.
#   [On Deletion] <De-Digivolve 1> 1 of your opponent's Digimon. (Trash 1 card
#   from the top of 1 of your opponent's Digimon. Stop trashing when you would
#   trash a level 3 card or the Digimon's last card.)
#   Inherited: [All Turns] When this Digimon would be deleted, by deleting 1
#   other Digimon with [Sukamon] in its name, prevent it from being deleted.
#
# ─── DCGO crosscheck ─────────────────────────────────────────────────────────
#
# [On Deletion] (OnDestroyedAnyone, isOptional: false, NOT inherited): the
#   pick of 1 opponent Digimon is mandatory (`canNoSelect: false`,
#   `CanEndSelectCondition` forces a selection), then
#   `IDegeneration(permanent, 1)` -> <De-Digivolve 1> with `stop_at_level: 3`
#   (BT19-026 idiom). `CanActivateCondition` requires the card to be in the
#   trash, which `on_deletion` (post-trash, rule 25) guarantees.
#
# Inherited [All Turns] (WhenPermanentWouldBeDeleted, isOptional: true): the
#   BT11-043 / BT11-040 substitute -- `kind: replacement` carrier only,
#   optional pick of 1 other Sukamon-name Digimon to delete, then
#   `cancel_replacement`.

card: BT13-065
name: PlatinumSukamon
kind: digimon
level: 4
color: [black]
cost: 3
dp: 2000
traits: [Mutant]
form: Champion
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: black }
    cost: 2

effects:
  - when: on_deletion
    summary: "[On Deletion] <De-Digivolve 1> 1 of your opponent's Digimon"
    condition:
      any_permanent:
        of: opponent
        zone: [battle_area]
        kind: digimon
    process:
      - select_opponent_permanent:
          bind_as: dedigi_target
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to <De-Digivolve 1>"
      - de_digivolve:
          target: dedigi_target
          amount: 1
          stop_at_level: 3

  - kind: replacement
    scope: inherited
    trigger: when_would_be_deleted
    optional: true
    active_when:
      all_of:
        - is_source: true
        - all_turns: true
    summary: "Inherited [All Turns] When this Digimon would be deleted, by deleting 1 other Digimon with [Sukamon] in its name, prevent it from being deleted"
    process:
      - select_any_permanent:
          bind_as: prevent_cost
          filter:
            all_of:
              - other: true
              - kind: digimon
              - name_contains: Sukamon
          prompt: "Delete 1 other Digimon with [Sukamon] in its name to prevent this Digimon's deletion"
      - delete_permanent: { target: prevent_cost }
      - cancel_replacement: {}
