card: BT13-110
name: "Royal Knights of the Purge"
kind: option
color: [white]
cost: 6
traits: ["Royal Knight"]

effects:
  - when: main_from_hand
    summary: "[Main] Draw 1; place this card in the battle area"
    process:
      - draw: { of: you, count: 1 }
      # BLOCKED: G-OPTIONAL-BREEDING-SELECTION — RK-G001 filter shipped (Phase 2
      # Track J PR 1) but `select_own_breeding_permanent` is hardcoded
      # `is_optional: false`, so the printed "you may" placement clause can't
      # surface a decline path. The placement step is omitted until that gap
      # closes.
      - place_self_as_delay_option: {}

  # BLOCKED: G-BREEDING-SOURCE-PLAY — Delay play from breeding digivolution
  # sources with On Play suppression and Rush requires breeding-source
  # selection/play substrate (out of Track J scope).

  - scope: inherited
    when: on_security
    summary: "[Security] Place this card in the battle area"
    process:
      - place_self_as_delay_option: {}
