card: BT13-112
name: Omnimon
kind: digimon
level: 7
color: [white]
cost: 14
dp: 14000
traits: [Holy Warrior, Royal Knight]
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 6, color_is: red }
    cost: 4

effects:
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] delete 1 opponent Digimon or play different-name Royal Knights from breeding sources"
    # "You may" — DCGO BT13_112.cs SetUpActivateClass(..., isOptional: true, ...).
    optional: true
    # DCGO CanActivateCondition: an opponent battle-area Digimon exists, OR a
    # breeding-area DIGIMON has >=1 [Royal Knight] trait Digimon among its
    # digivolution cards (CanSelectPermanentCondition1 /
    # DigivolutionCards.Count(IsDigimon && HasRoyalKnightTraits) >= 1).
    condition:
      any_of:
        - any_permanent:
            of: opponent
            kind: digimon
        - count_gte:
            filter:
              owner: you
              zone: [breeding]
              kind: digimon
              source_count:
                at_least: 1
                filter:
                  all_of:
                    - kind: digimon
                    - trait_has: "Royal Knight"
            n: 1
    process:
      # Each branch is offered only when it can do something (DCGO
      # canSelectDelete / canSelectPlay). Both legal -> prompt; exactly one
      # legal -> it runs without a prompt (DCGO SetBool(canSelectDelete)).
      - select_effect_choice:
          bind_as: branch
          labels:
            - "Delete 1 opponent Digimon"
            - "Play Royal Knights from breeding sources"
          legal_when:
            - any_permanent:
                of: opponent
                kind: digimon
            - count_gte:
                filter:
                  owner: you
                  zone: [breeding]
                  kind: digimon
                  source_count:
                    at_least: 1
                    filter:
                      all_of:
                        - kind: digimon
                        - trait_has: "Royal Knight"
                n: 1
          prompt: "Choose effect"
      - if:
          condition: { equals: [branch, 0] }
          then:
            - select_opponent_permanent:
                bind_as: delete_target
                filter: { kind: digimon }
                prompt: "Choose an opponent Digimon to delete"
            - delete_permanent: { target: delete_target }
      - if:
          condition: { equals: [branch, 1] }
          then:
            - select_own_breeding_permanent:
                bind_as: breeding_digimon
                prompt: "Choose your breeding Digimon"
                filter:
                  all_of:
                    - kind: digimon
                    - source_count:
                        at_least: 1
                        filter:
                          all_of:
                            - kind: digimon
                            - trait_has: "Royal Knight"
                then:
                  - select_materials:
                      of_permanent: breeding_digimon
                      max: 12
                      filter:
                        all_of:
                          - kind: digimon
                          - trait_has: "Royal Knight"
                      uniqueness: name
                      optional_zero: true
                      bind_as: royal_knights
                      prompt: "Choose Royal Knight sources with different names to play"
                  - play_from_materials:
                      target: breeding_digimon
                      source_index: royal_knights
                      cost_delta: free
                      # DCGO PlayPermanentCards(..., activateETB: true): played cards' [On Play] effects DO activate.
                      suppress_on_play: false
                  - if:
                      condition: { effect_played_any_digimon: true }
                      then:
                        - trash_breeding_permanent: { target: breeding_digimon }
                        - for_each:
                            over: { of: you, zone: [battle_area], kind: digimon }
                            bind_as: ally
                            body:
                              - grant_keyword:
                                  target: ally
                                  keyword: Rush
                                  expiry: end_of_turn
