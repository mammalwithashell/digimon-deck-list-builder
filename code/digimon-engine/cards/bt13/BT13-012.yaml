card: BT13-012
name: GeoGreymon
kind: digimon
level: 4
color: [red, yellow]
cost: 5
dp: 5000
traits: [Dinosaur]
attribute: Vaccine

# ─── Alt-path: Lv.3 w/[Agumon] in name and [Dinosaur] trait, cost 2 ──────────
# Printed in xros_req column / DCGO `AddSelfDigivolutionRequirementStaticEffect`
# (BT13_012.cs lines 14–22): "[Digivolve] Lv.3 w/[Agumon] in name and [Dinosaur]
# trait: Cost 2".
alt_paths:
  - kind: digivolve
    from:
      all_of:
        - level_eq: 3
        - name_contains: "Agumon"
        - trait_has: Dinosaur
    cost: 2

# ─────────────────────────────────────────────────────────────────────────────
# Clause 1 — [When Digivolving] Search your security stack, and you may play
# 1 red or yellow Tamer card among it without paying its cost.
# If you did, ＜Recovery +1 (Deck)＞. Then, shuffle your security stack.
#
# G-PLAY-SELECTED-SECURITY-CARD resolved 2026-05-20. The clause is three
# coordinated steps:
#   a. Search the controller's security stack and (optionally) PLAY one of
#      those cards (a red or yellow Tamer) without paying its cost.
#   b. Conditional Recovery +1 (Deck) — only if a Tamer was actually played.
#   c. Unconditional shuffle of the security stack.
#
# Step (a): `select_security` (optional) with a `filter` of red/yellow Tamer
# binds the chosen card as a `CardHandle`. The new `play_security_card:
# { of, card }` step verb resolves the bound handle's security index and
# plays exactly that card free (engine `EffectContext::play_from_security_card`
# → `play_from_security_index`, the same hand-transit path as
# `play_from_security`). The `select_security` `filter` field — previously
# ignored by `install_select_security` — is now evaluated per security card.
#
# Step (b): "If you did" is gated with `binding_present: sec_tamer` — when the
# player declines the optional `select_security`, no binding is set and the
# Recovery is skipped.
#
# Step (c): `shuffle_security` runs unconditionally outside the `if`.

effects:

  # ─────────────────────────────────────────────────────────────────────────
  # Clause 1 — [When Digivolving] search security for red/yellow Tamer;
  # play free; if played, Recovery +1; then shuffle.
  - when: when_digivolving
    summary: "[When Digivolving] search security; may play 1 red/yellow Tamer free; if played, Recovery +1; then shuffle security"
    process:
      - select_security:
          of: you
          bind_as: sec_tamer
          optional: true
          filter:
            all_of:
              - kind: tamer
              - any_of:
                  - color_is: red
                  - color_is: yellow
          prompt: "Play 1 red or yellow Tamer from security without paying its cost"
      - if:
          condition: { binding_present: sec_tamer }
          then:
            - play_security_card: { of: you, card: sec_tamer }
            - recover: { of: you, count: 1 }
      - shuffle_security: { of: you }

  # ─────────────────────────────────────────────────────────────────────────
  # Clause 2 — Inherited [Your Turn] [Once Per Turn]
  # When one of your red or yellow Tamers becomes suspended, you may delete
  # 1 of your opponent's Digimon with 3000 DP or less.
  #
  # Predicates available:
  #   - event_target_owner: you                  ✓ (DSL leaf)
  #   - event_target_kind: tamer                 ✓ (DSL leaf)
  #   - event_target_color_any_of: [red, yellow] ✓ (DSL leaf —
  #     G-EVENT-TARGET-COLOR resolved 2026-05-20; sibling of
  #     `event_target_kind` / `event_target_trait_has`, using the same
  #     `event_target_card` resolver)
  #   - your_turn: true                          ✓ ([Your Turn] scoping)
  #
  # Engine-side caveats (active, but tests scaffolded):
  #   - G-OPT-TRIGGERED: `once_per_turn: true` compiles to
  #     `Effect::max_per_turn=1` but triggered-effect OPT enforcement is
  #     not yet wired in `run_queued_effect_inner`. The clause may
  #     over-fire on multiple suspends in the same turn until that gap
  #     closes (same caveat as BT24-018 clause f).
  #   - G-PRED-DP-LTE: `dp_lte: 3000` is parsed and compiled but the
  #     predicate evaluator does not yet enforce it on permanents in
  #     non-security zones. All opponent Digimon will be selectable until
  #     the gap closes.
  #
  # The inherited clause is authored faithfully against printed text; the
  # gaps are documented and the affected behavioral assertions are
  # `#[ignore]`'d with their gap IDs in the test file.
  - scope: inherited
    when: on_suspend
    optional: true
    once_per_turn: true
    active_when: { your_turn: true }
    condition:
      all_of:
        - event_target_owner: you
        - event_target_kind: tamer
        - event_target_color_any_of: [red, yellow]
    summary: "[Your Turn][OPT] On own red/yellow Tamer suspending, may delete 1 opp Digimon DP≤3000"
    process:
      - select_opponent_permanent:
          bind_as: tgt
          optional: true
          filter:
            all_of:
              - kind: digimon
              - dp_lte: 3000
          prompt: "Delete 1 of your opponent's Digimon with 3000 DP or less"
      - delete_permanent: { target: tgt }
