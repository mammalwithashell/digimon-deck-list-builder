card: BT13-007
name: King Drasil_7D6
kind: digi_egg
color: [white]
cost: 0

effects:
  - kind: flood_gate
    scope: face_up
    # [Breeding][Your Turn] — gated on in_breeding AND the owner's turn so
    # opponent-turn digivolves (Blast/Counter) are NOT blocked (matches DCGO).
    active_when: { in_breeding: true, your_turn: true }
    modifier: CannotDigivolve
    target: { of: you, zone: [battle_area] }

  - kind: cost_reduction
    reduction_timing: before_pay_cost
    optional: true
    once_per_turn: true
    when_any_ally_played: { trait_has: "Royal Knight" }
    # Reduce play cost by 4, plus 1 more per digivolution card under this King
    # Drasil. `material_count` resolves against the effect carrier
    # (`source_permanent` = the breeding King Drasil), so it counts the cards
    # beneath its top card — i.e. its digivolution cards. Native formula
    # replaces the test-only `raw_rust: bt13_007_royal_knight_cost_reduction`,
    # which was never registered in the production raw_rust registry and so
    # silently evaluated to 0 (no reduction) in real games.
    amount_fn: { base: 4, per: material_count, delta: 1 }

  - when: start_of_your_main_phase
    scope: face_up
    active_when: { in_breeding: true }
    summary: "[Breeding][Start Main] Reveal top Digi-Egg, then tuck it and Royal Knights under this Digimon"
    process:
      - reveal_top_deck: { of: you, count: 1, zone: digi_egg_deck, bind_as: shown }
      - place_as_bottom_source:
          source: shown
          target: source
      - for_each:
          over: { of: you, zone: [battle_area], trait_has: "Royal Knight" }
          bind_as: rk
          body:
            - place_as_bottom_source:
                source: { permanent: rk }
                target: source

  # [Breeding][Inherited][OPT] When a Royal Knight Option is placed, gain 1 memory.
  # DCGO marks this SetIsInheritedEffect(true) but activates it purely on
  # IsExistOnBreedingArea + IsOwnerTurn (it fires while King Drasil is the
  # breeding egg). The Rust breeding dispatch (enqueue_from_breeding_permanent)
  # SKIPS inherited-flagged effects, so this must be a face-up breeding observer
  # gated on in_breeding + your_turn — otherwise it never fires.
  - scope: face_up
    when: on_option_placed
    active_when: { in_breeding: true, your_turn: true }
    once_per_turn: true
    condition: { event_card_trait_has: "Royal Knight" }
    summary: "[Breeding][Inherited] When a Royal Knight Option is placed on your turn, gain 1 memory"
    process:
      - gain_memory: 1
