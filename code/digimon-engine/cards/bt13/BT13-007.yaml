card: BT13-007
name: King Drasil_7D6
kind: digi_egg
color: [white]
cost: 0

effects:
  - kind: flood_gate
    scope: face_up
    active_when: { in_breeding: true }
    modifier: CannotDigivolve
    target: { of: you, zone: [battle_area] }

  - kind: cost_reduction
    reduction_timing: before_pay_cost
    optional: true
    once_per_turn: true
    when_any_ally_played: { trait_has: "Royal Knight" }
    # Reduce the Royal Knight's play cost by 4, plus 1 per digivolution card
    # under this Digimon (King Drasil). `per: material_count` resolves against
    # the cost-reduction source permanent (= this card), so this equals the
    # former raw_rust `4 + source_stack_source_count()` without an escape hatch.
    amount_fn: { base: 4, per: material_count, delta: 1 }

  - when: start_of_your_main_phase
    scope: face_up
    active_when: { in_breeding: true }
    summary: "[Breeding][Start Main] Reveal top Digi-Egg, then tuck it and Royal Knights under this Digimon"
    process:
      - reveal_top_deck: { of: you, count: 1, zone: digi_egg_deck, bind_as: shown }
      - place_as_bottom_source:
          source: shown
          target: source
      - for_each:
          over: { of: you, zone: [battle_area], trait_has: "Royal Knight" }
          bind_as: rk
          body:
            - place_as_bottom_source:
                source: { permanent: rk }
                target: source

  - scope: inherited
    when: on_option_placed
    active_when: { in_breeding: true }
    once_per_turn: true
    condition: { event_card_trait_has: "Royal Knight" }
    summary: "[Breeding][Inherited] When a Royal Knight Option is placed, gain 1 memory"
    process:
      - gain_memory: 1

  # The Royal Knight play cost reduction uses the existing raw_rust amount_fn
  # until formulas can count this source's digivolution cards.
