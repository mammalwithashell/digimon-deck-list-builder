card: BT13-101
name: Miki Kurosaki & Megumi Shirakawa
kind: tamer
color: [black, yellow]
cost: 4
traits: []

effects:
  - when: on_play
    optional: true
    summary: "[On Play] You may play 1 PawnChessmon Digimon from hand for free"
    process:
      - select_hand:
          of: you
          bind_as: pawn
          optional: true
          filter:
            all_of:
              - kind: digimon
              - name_contains: "PawnChessmon"
          prompt: "Play 1 PawnChessmon Digimon from hand"
      - play_from_hand_free: { of: you, hand_index: pawn }

  # [All Turns] When you play a 2-color black/yellow Digimon, by suspending
  # this Tamer, <Draw 1> and gain 1 memory.
  - when: on_any_digimon_played
    active_when: { all_turns: true }
    summary: "[All Turns] When you play a 2-color black/yellow Digimon, suspend this Tamer -> Draw 1 + gain 1 memory"
    condition:
      all_of:
        - event_target_owner: you
        - event_target_kind: digimon
        - event_card_color_only: [black, yellow]
        - event_card_color_count: 2
    process:
      - activation_cost: { suspend_self: true }
      - draw: { of: you, count: 1 }
      - gain_memory: 1

  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
