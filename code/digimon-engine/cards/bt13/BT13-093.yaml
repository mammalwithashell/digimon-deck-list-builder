card: BT13-093
name: Omekamon
kind: digimon
level: 4
color: [white]
cost: 4
dp: 4000
traits: [Puppet, X Antibody]
attribute: Data

# Printed [On Deletion] is intentionally omitted.
#
# It needs a filtered breeding-area permanent target:
#   select own breeding permanent where name is [King Drasil_7D6]
# then place a selected [Royal Knight] Digimon card from hand as the bottom
# source. `select_own_breeding_permanent` currently has no filter field, so
# authoring this clause would allow targeting a non-King-Drasil breeding
# permanent in nonstandard states. Tracked as RK-G001.

effects:
  - when: on_play
    summary: "[On Play] Draw 1"
    process:
      - draw: { of: you, count: 1 }
