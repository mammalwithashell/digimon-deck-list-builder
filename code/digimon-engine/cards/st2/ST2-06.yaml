card: ST2-06
name: Garurumon
kind: digimon
level: 4
color: [blue]
cost: 5
dp: 4000
traits: [Beast]
form: Champion
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: blue }
    cost: 2

effects:
  - scope: inherited
    when: when_attacking
    summary: "[Inherited][When Attacking] Trash bottom source of 1 opponent Digimon"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter:
            all_of:
              - kind: digimon
              - materials_count_gte: 1
          prompt: "Choose 1 opponent Digimon with a source"
      - trash_bottom_sources: { target: target, count: 1 }
