card: ST2-09
name: Zudomon
kind: digimon
level: 5
color: [blue]
cost: 6
dp: 7000
traits: [Sea Beast]
form: Ultimate
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: blue }
    cost: 3

effects:
  - when: when_digivolving
    summary: "[When Digivolving] Trash 2 bottom sources of 1 opponent Digimon"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter:
            all_of:
              - kind: digimon
              - materials_count_gte: 1
          prompt: "Choose 1 opponent Digimon with digivolution cards"
      - trash_bottom_sources: { target: target, count: 2 }
