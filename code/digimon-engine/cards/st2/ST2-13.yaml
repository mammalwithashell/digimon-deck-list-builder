card: ST2-13
name: Hammer Spark
kind: option
color: [blue]
cost: 0

effects:
  # ─── Clause 1: [Main] Gain 1 memory ──────────────────────────────────────
  - when: main_from_hand
    summary: "[Main] Gain 1 memory"
    process:
      - gain_memory: 1

  # ─── Clause 2: [Security] Gain 2 memory ──────────────────────────────────
  - when: on_security
    summary: "[Security] Gain 2 memory"
    process:
      - gain_memory: 2
