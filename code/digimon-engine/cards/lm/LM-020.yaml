# Current official errata: https://world.digimoncard.com/rule/revised/
# This Digimon's own effects (including inherited effects) are exempt.
# Printed original image + current official bundle supply both normal circles.
card: LM-020
name: Quantumon
kind: digimon
level: 6
color: [yellow, green]
cost: 13
dp: 13000
traits: [Fairy]
form: Mega
attribute: Data
alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: yellow }
    cost: 5
  - kind: digivolve
    from: { level_eq: 5, color_is: green }
    cost: 5
effects:
  - when: when_digivolving
    optional: true
    outer_prompt: true
    summary: "[When Digivolving] By placing 1 Digimon as its owner's top security, reveal all opposing security; place 1 on top of their deck and shuffle the rest"
    process:
      - select_any_permanent:
          bind_as: payer
          filter: { kind: digimon }
          prompt: "Place 1 Digimon as its owner's top security card"
      - place_on_security:
          source: { permanent: payer }
          to_owner: true
          position: top
          face_up: false
          bind_placed_as: paid
      - if:
          condition: { binding_present: paid }
          then:
            - reveal_security: { of: opponent }
            - select_security:
                of: opponent
                bind_as: selected_security
                filter: {}
                prompt: "Place 1 revealed opposing security card on top of their deck"
            - return_selected_security_to_deck:
                of: opponent
                card: selected_security
                position: top
            - shuffle_security: { of: opponent }
  - when: start_of_opponents_turn
    summary: "[Start of Opponent's Turn] Declare a category; matching opponent deck reveal grants immunity except to this Digimon's own effects for this turn; return top or bottom"
    process:
      - select_effect_choice:
          bind_as: category
          labels: [Digimon, Tamer, Option, Digi-Egg]
          prompt: "Declare 1 card category"
      - reveal_top_deck: { of: opponent, count: 1, bind_as: revealed }
      - if:
          condition:
            all_of:
              - { equals: [category, 0] }
              - { binding_card_kind: { binding: revealed, kind: digimon } }
          then:
            - grant_effect_immunity:
                target: self
                source_kind: digimon
                source_controller: any
                exclude_self: true
                expiry: end_of_turn
      - if:
          condition:
            all_of:
              - { equals: [category, 1] }
              - { binding_card_kind: { binding: revealed, kind: tamer } }
          then:
            - grant_effect_immunity:
                target: self
                source_kind: tamer
                source_controller: any
                exclude_self: true
                expiry: end_of_turn
      - if:
          condition:
            all_of:
              - { equals: [category, 2] }
              - { binding_card_kind: { binding: revealed, kind: option } }
          then:
            - grant_effect_immunity:
                target: self
                source_kind: option
                source_controller: any
                exclude_self: true
                expiry: end_of_turn
      - if:
          condition:
            all_of:
              - { equals: [category, 3] }
              - { binding_card_kind: { binding: revealed, kind: digi_egg } }
          then:
            - grant_effect_immunity:
                target: self
                source_kind: digi_egg
                source_controller: any
                exclude_self: true
                expiry: end_of_turn
      - if:
          condition: { binding_present: revealed }
          then:
            - select_effect_choice:
                bind_as: return_position
                labels: [Top of deck, Bottom of deck]
                prompt: "Return the revealed card to the top or bottom of the opponent's deck"
            - if:
                condition: { equals: [return_position, 0] }
                then:
                  - return_to_deck_from_reveal: { of: opponent, card: revealed, position: top }
            - if:
                condition: { equals: [return_position, 1] }
                then:
                  - return_to_deck_from_reveal: { of: opponent, card: revealed, position: bottom }
