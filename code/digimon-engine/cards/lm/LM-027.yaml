card: LM-027
name: "Red Scramble"
kind: option
color: [red]
cost: 2

# ─── Clause A: [Main] digivolve with cost -3 ──────────────────────────────────
#
# "[Main] 1 of your red Digimon may digivolve into a red Digimon card in the
# hand with the digivolution cost reduced by 3. Then, place this card in the
# battle area."
#
# DCGO (LM_027.cs, EffectTiming.OptionSkill):
#   1. SelectPermanentEffect over controller's battle area (canNoSelect: true —
#      the entire clause is optional via "may"). Filter: IsDigimon && IsRed(card).
#   2. If selected: DigivolveIntoHandOrTrashCard(
#          targetPermanent: selected,
#          cardCondition: IsRed,
#          isHand: true,
#          reduceCost: 3).
#   3. PlaceDelayOptionCards — moves LM-027 from hand to battle area as a
#      Delay permanent.
#
# DSL modelling:
#   - when: main_from_hand
#   - optional: true     (DCGO canNoSelect: true at the SelectPermanentEffect level)
#   - select_own_permanent (optional: true, filter: digimon + color_is: red)
#   - select_hand (filter: digimon + color_is: red)
#   - effect_initiated_digivolve { cost: { reduce: 3 }, ignore_requirements: false }
#
# "Then, place this card in the battle area" — option-as-permanent placement.
# G-PLACE-SELF-AS-OPTION-PERMANENT: No explicit DSL step verb for this sub-step.
# The engine infers Delay placement from the presence of the Delay clause
# (Clause B) together with main_from_hand timing, but the placement is not
# modelled as an explicit step. Tests asserting the option lands in battle area
# are #[ignore = "pending: G-PLACE-SELF-AS-OPTION-PERMANENT"].
#
# ─── Clause B: [Start of Your Turn] <Delay> ──────────────────────────────────
#
# "[Start of Your Turn] If your opponent has a Digimon, ＜Delay＞ (By trashing
# this card after the placing turn, activate the effect below.)
# ・Return 1 red Digimon card from your trash to the top of the deck.
#   Then, if you don't have a Digimon, you may play 1 red Digimon card with
#   2000 DP or less from your trash without paying the cost."
#
# DCGO (LM_027.cs, EffectTiming.OnStartTurn):
#   CanUseCondition: IsOwnerTurn + IsExistOnBattleArea(self) +
#     opponent HasAtLeastOneDigimon + CanDeclareOptionDelayEffect.
#   ActivateCoroutine:
#     1. Trash this Delay card (PlaceDelayOptionCards → trash self).
#     2. SelectTrashCardEffect: trash, IsRed && IsDigimon, canNoSelect: false.
#     3. AddLibraryTopCards — move the selected card to the TOP of the deck.
#     4. If HasNoDigimon(controller): SelectTrashCardEffect (IsRed && IsDigimon
#        && DP <= 2000, canNoSelect: true) -> PlayFromTrashEffect (free play).
#
# DSL modelling — `kind: delay`, all blocking gaps now resolved:
#   - trigger: start_of_your_turn -> CompiledTiming::StartOfYourTurn ->
#     DelayTrigger::StartOfYourNextTurn (G-DELAY-START-OF-TURN, resolved
#     2026-05-02). The Delay never auto-fires — the controller chooses to trash
#     the parked Option at the start of a later turn (RULES_CONTEXT 16-16).
#   - active_when: opponent has a Digimon (printed "If your opponent has a
#     Digimon").
#   - select_trash (mandatory) -> return_trash_list_to_deck_bottom with
#     `destination: top` (G-ZONE-SELECTED-TRASH-TO-DECK-TOP, resolved
#     2026-05-21 — `EffectContext::return_trash_cards_to_deck_top` plus the
#     `destination` DSL param move a selected trash card to the deck top).
#   - if (you have no Digimon): optional select_trash (dp_lte: 2000, resolved
#     by G-PRED-DP-LTE 2026-05-17) -> play_from_trash_free.
#
# ─── Clause C: [Security] ─────────────────────────────────────────────────────
#
# "Inherited: Security Effect [Security] You may play 1 red Digimon card with
# 2000 DP or less from your trash without paying the cost. Then, add this card
# to the hand."
#
# DCGO (LM_027.cs, EffectTiming.SecuritySkill):
#   1. SelectTrashCardEffect: controller's trash, filter IsRed && IsDigimon &&
#      DP <= 2000, canNoSelect: true (optional).
#   2. PlayFromTrashEffect (free play of selected card).
#   3. AddThisCardToHand — moves LM-027 from security-resolution staging to
#      controller's hand.
#
# DSL modelling:
#   - when: on_security
#   - optional: true     (DCGO canNoSelect: true at SelectTrashCardEffect)
#   - select_trash (filter: digimon + color_is: red + dp_lte: 2000)
#   - play_from_trash_free
#   - add_this_option_to_hand
#
# G-ADD-OPTION-SELF-TO-HAND RESOLVED — `add_this_option_to_hand: {}` lowers to
# `EffectContext::add_pending_security_to_hand`, which moves the resolving
# security Option (LM-027) to the controller's hand. G-PRED-DP-LTE RESOLVED —
# the `dp_lte: 2000` filter is enforced for trash card subjects. Clause C is
# fully expressed in pure DSL.

effects:
  # ─── Clause A: [Main] ───────────────────────────────────────────────────────
  # "1 of your red Digimon may digivolve into a red Digimon card in the hand
  # with the digivolution cost reduced by 3."
  # DCGO: SelectPermanentEffect(canNoSelect: true) → DigivolveIntoHandOrTrashCard.
  # optional: true — printed "may" gates the entire clause.
  - when: main_from_hand
    optional: true
    summary: "[Main] You may have 1 red Digimon digivolve into a red Digimon in hand, cost -3; place this in battle area"
    process:
      # Step 1: choose source Digimon (optional — "may").
      # DCGO: SelectPermanentEffect with canNoSelect: true over battle area.
      - select_own_permanent:
          bind_as: target
          optional: true
          filter:
            all_of:
              - kind: digimon
              - color_is: red
          prompt: "Choose 1 of your red Digimon to digivolve"
      # Step 2: choose the digivolve target from hand.
      # DCGO: DigivolveIntoHandOrTrashCard(isHand: true) — hand only.
      - if:
          condition: { binding_exists: target }
          then:
            - select_hand:
                of: you
                bind_as: evo
                filter:
                  all_of:
                    - kind: digimon
                    - color_is: red
                prompt: "Choose a red Digimon card to digivolve into"
            # Step 3: execute effect-initiated digivolve with cost -3.
            # DCGO: reduceCost: 3, payCost: true, ignore_requirements: false.
            - effect_initiated_digivolve:
                target: target
                from_hand: evo
                cost: { reduce: 3 }
                ignore_requirements: false

  # ─── Clause B: [Start of Your Turn] <Delay> ─────────────────────────────────
  # Standard printed <Delay> with a [Start of Your Turn] timing. The controller
  # may trash this parked Option at the start of a later turn (RULES 16-16 — the
  # processing of a <Delay> is optional) to activate the body. `active_when`
  # gates the activation on the opponent having a Digimon, per printed text.
  # trigger: start_of_your_turn → CompiledTiming::StartOfYourTurn →
  # DelayTrigger::StartOfYourNextTurn.
  - kind: delay
    trigger: start_of_your_turn
    active_when:
      any_permanent:
        of: opponent
        kind: digimon
    summary: "[Start of Your Turn]<Delay> If opp has a Digimon: return 1 red Digimon from trash to deck top; if you have no Digimon, optionally play a <=2000-DP red Digimon from trash free"
    process:
      # Step 1: return 1 red Digimon from trash to the TOP of the deck.
      # DCGO: SelectTrashCardEffect canNoSelect: false (mandatory when an
      # eligible card exists; the empty-candidate path short-circuits silently).
      - select_trash:
          of: you
          bind_as: to_return
          optional: false
          filter:
            all_of:
              - kind: digimon
              - color_is: red
          prompt: "Return 1 red Digimon card from your trash to the top of the deck"
      # G-ZONE-SELECTED-TRASH-TO-DECK-TOP — `destination: top` routes the bound
      # card to the deck top (the next card drawn), not the bottom.
      - return_trash_list_to_deck_bottom:
          of: you
          cards: to_return
          destination: top
      # Step 2: "Then, if you don't have a Digimon, you may play 1 red Digimon
      # card with 2000 DP or less from your trash without paying the cost."
      - if:
          condition:
            not:
              any_permanent:
                of: you
                kind: digimon
          then:
            # DCGO: SelectTrashCardEffect canNoSelect: true (optional).
            - select_trash:
                of: you
                bind_as: to_play
                optional: true
                filter:
                  all_of:
                    - kind: digimon
                    - color_is: red
                    - dp_lte: 2000
                prompt: "You may play 1 red Digimon with 2000 DP or less from your trash without paying its cost"
            - play_from_trash_free:
                of: you
                hand_index: to_play

  # ─── Clause C: [Security] ───────────────────────────────────────────────────
  # "You may play 1 red Digimon card with 2000 DP or less from your trash
  # without paying the cost. Then, add this card to the hand."
  # DCGO: SecuritySkill timing → SelectTrashCardEffect(canNoSelect: true) →
  #        PlayFromTrashEffect → AddThisCardToHand.
  # optional: true — "you may" gates the entire clause.
  - when: on_security
    optional: true
    summary: "[Security] You may play 1 red Digimon (≤2000 DP) from trash free; then add this card to hand"
    process:
      # Step 1: optional trash selection — red Digimon with DP ≤ 2000.
      # DCGO: canNoSelect: true; filter IsRed && IsDigimon && DP ≤ 2000.
      # G-PRED-DP-LTE RESOLVED 2026-05-17 — `dp_lte` is now evaluated against
      # CardData.dp for trash card subjects, so the ≤2000-DP filter is enforced
      # at selection time. Red Digimon with DP > 2000 are not offered.
      - select_trash:
          of: you
          bind_as: picked
          optional: true
          filter:
            all_of:
              - kind: digimon
              - color_is: red
              - dp_lte: 2000
          prompt: "You may play 1 red Digimon with 2000 DP or less from your trash without paying its cost"
      # Step 2: play the selected card from trash without paying the cost.
      - play_from_trash_free:
          of: you
          hand_index: picked
      # Step 3: add this card (LM-027) to the hand.
      - add_this_option_to_hand: {}
