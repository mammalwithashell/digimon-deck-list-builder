card: LM-055
name: "Sprint Dash Training"
kind: option
color: [green, red]
cost: 2
use_requirement:
  no_permanent:
    of: you
    zone: [battle_area]
    name_is: "Sprint Dash Training"

effects:
  - when: main_from_hand
    optional: false
    summary: "[Main] Reveal top 2; add 1 green or red card; bottom the rest; place self in battle area"
    process:
      - reveal_top_deck:
          of: you
          count: 2
      - select_reveal:
          of: you
          bind_as: picked
          optional: false
          filter:
            any_of:
              - color_is: green
              - color_is: red
          prompt: "Add 1 green or red card to your hand"
      - add_to_hand_from_reveal: { of: you, card: picked }
      - place_remainder_on_deck: { of: you, position: bottom }
      - place_self_as_delay_option: {}

  - kind: delay
    # TRIGGER CORRECTION (2026-08-24): was `on_play`, which the old lowering's
    # `_` catch-all turned into a turn-scheduled auto-fire. The printed timing
    # is "[Main] <Delay>", so this is the standard player-activated Delay:
    # `delayed` -> DelayTrigger::MainPhaseActivated, a [Main] mask bit, where
    # NOT activating is the §16-16-2 decline and §16-16-1 keeps the Option
    # available while it sits in the battle area.
    trigger: delayed
    summary: "[Main]<Delay> 1 of your Digimon may digivolve into a green or red Digimon in hand, cost -2"
    process:
      - select_own_permanent:
          bind_as: target
          optional: true
          filter:
            kind: digimon
            zone: [battle_area]
            has_digivolve_candidate:
              of: you
              zone: [hand]
              filter:
                all_of:
                  - kind: digimon
                  - any_of:
                      - color_is: green
                      - color_is: red
          prompt: "Choose 1 of your Digimon to digivolve"
      - select_hand:
          of: you
          bind_as: evo
          optional: true
          filter:
            all_of:
              - kind: digimon
              - can_digivolve_onto: target
              - any_of:
                  - color_is: green
                  - color_is: red
          prompt: "Choose a green or red Digimon card in your hand to digivolve into"
      - effect_initiated_digivolve:
          target: target
          from_hand: evo
          cost: { reduce: 2 }
          ignore_requirements: false

  - scope: inherited
    when: on_security
    optional: false
    summary: "[Security] Reveal top 2; add 1 green or red card; bottom the rest; place self in battle area"
    process:
      - reveal_top_deck:
          of: you
          count: 2
      - select_reveal:
          of: you
          bind_as: picked
          optional: false
          filter:
            any_of:
              - color_is: green
              - color_is: red
          prompt: "Add 1 green or red card to your hand"
      - add_to_hand_from_reveal: { of: you, card: picked }
      - place_remainder_on_deck: { of: you, position: bottom }
      - place_self_as_delay_option: {}
