# Official observation 3bbaa1e5101f6d02d8624f2d63f5c9f8597c347e5d268eed2d6a41825c7275f3
# and visually inspected LM-034.webp; general rules 4-19 and 16-16.
# DCGO: base Assets/Scripts/CardEffect/LM/Blue/LM_034.cs.
card: LM-034
name: "Wisteria Memory Boost!"
kind: option
color: [blue]
cost: 3

# "Red also meets this card's color requirements." DCGO's condition includes
# the breeding area (HasMatchConditionPermanent(..., true)). Option access
# must be available in hand: use_requirement installs the shared mask/use hook.
# A hatched Digi-Egg is treated as a breeding Digimon by this field predicate.
use_requirement:
  any_field_permanent:
    of: you
    any_of:
      - kind: digimon
      - kind: tamer
    color_is: red

effects:
  # Mandatory search when an eligible blue or red Digimon is revealed.
  # The Option lifecycle places this card in battle after Main resolves.
  - when: main_from_hand
    optional: false
    summary: "[Main] Reveal 3; add 1 blue/red Digimon; bottom the rest; place self as Delay"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          buckets:
            - bind_as: digi_pick
              min: 1
              max: 1
              filter:
                all_of:
                  - kind: digimon
                  - any_of:
                      - color_is: blue
                      - color_is: red
          prompt: "Select 1 blue or red Digimon card to add to hand"
      - add_to_hand_from_reveal: { of: you, card: digi_pick }
      - place_remainder_on_deck: { of: you, position: bottom }

  # Player-activated Main timing, after the placing turn. Trash self as cost.
  - kind: delay
    trigger: delayed
    summary: "[Main]<Delay> Gain 2 memory"
    process:
      - gain_memory: 2

  - scope: inherited
    when: on_security
    optional: false
    summary: "[Security] Place this card in the battle area"
    process:
      - place_self_as_delay_option: {}
