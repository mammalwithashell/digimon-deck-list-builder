card: BT20-056
name: Alphamon
kind: digimon
level: 6
color: [black, yellow]
cost: 0
dp: 11000
traits: [Holy Warrior, X Antibody, Royal Knight, Chronicle]
form: Mega
attribute: Vaccine

# Printed digivolve circles (official Bandai DB / data/card_bundles/BT20-056.md):
# Black Lv.5 / cost 3 and Yellow Lv.5 / cost 3. (Previously mis-authored as a
# single PURPLE circle — a colour the printed card doesn't gate on; see
# tests/alt_path_printed_cost_guard.rs.)
alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: black }
    cost: 3
  - kind: digivolve
    from: { level_eq: 5, color_is: yellow }
    cost: 3

effects:
  - kind: grant_keyword
    keyword: Barrier

  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Recovery +1 (Deck)"
    process:
      - recover: { of: you, count: 1 }

  # ─── [All Turns][OPT] security removed → 1 opp Digimon -8000 DP ──────────────
  #
  # DCGO BT20_056.cs:260-330 — single OnLoseSecurity clause, CanTriggerWhenLose
  # Security(_ => true) so it fires for EITHER security stack (own or opponent's),
  # gated by one SetHashString("RemovedSec_BT20_056") OPT key. Authored as a
  # multi-timing clause; the lowering clusters both timings under one shared
  # once-per-turn lockout (BT16-102 precedent). The selected opponent Digimon
  # gets ChangeDigimonDP(-8000, UntilEachTurnEnd) → add_dp_modifier -8000 with
  # expiry end_of_turn ("for the turn" = end of the current turn).
  - when: [on_own_security_removed, on_opponent_security_removed]
    active_when: { all_turns: true }
    once_per_turn: true
    summary: "[All Turns][OPT] When security stacks are removed from, 1 of your opponent's Digimon gets -8000 DP for the turn"
    process:
      - select_opponent_permanent:
          bind_as: dp_target
          filter: { kind: digimon }
          prompt: "Select 1 of your opponent's Digimon to get -8000 DP for the turn"
      - add_dp_modifier:
          target: dp_target
          value: -8000
          expiry: end_of_turn

  # ─── Inherited [All Turns][OPT] Alphamon: Ouryuken leave-prevention ──────────
  #
  # DCGO BT20_056.cs:337-386 — WhenRemoveField, SetIsInheritedEffect(true), OPT.
  # CanUseCondition: not by owner's own effect (IsByEffect IsOwnerEffect negated)
  #   → none_of: [replacement_cause: own_effect].
  # CanActivateCondition: TopCard.EqualsCardName("Alphamon: Ouryuken") AND
  #   SecurityCards.Count > 0 → name_is gate + security_count_gte: 1.
  # Cost = trash top security; willBeRemoveField = false → trash_top_security_and
  #   _cancel_replacement (BT24-101 precedent). name_is is exact-match per DCGO
  # EqualsCardName, so a plain "Alphamon" carrier is NOT protected.
  - kind: replacement
    scope: inherited
    trigger: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    active_when:
      all_of:
        - replacement_subject_is_mine: true
        - name_is: "Alphamon: Ouryuken"
        - security_count_gte: 1
        - none_of:
            - replacement_cause: own_effect
    summary: "[Inherited][All Turns][OPT] If [Alphamon: Ouryuken] would leave the battle area other than by your effects, by trashing your top security card, it doesn't leave"
    process:
      - trash_top_security_and_cancel_replacement: { of: you }

