card: BT20-048
name: Dorumon
kind: digimon
level: 3
color: [black, yellow]
cost: 3
dp: 1000
form: Rookie
attribute: Data
traits: [Beast, X Antibody, Chronicle]

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 1
  - kind: digivolve
    from: { level_eq: 2, color_is: yellow }
    cost: 1
  - kind: digivolve
    from: { level_eq: 2, color_is: black, trait_has: X Antibody }
    cost: 0

effects:
  - when: on_play
    summary: "Reveal 3; add an X Antibody card and a Chronicle Tamer or Option; bottom the rest"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          no_duplicate_cards: true
          buckets:
            - bind_as: x_antibody
              filter: { trait_has: X Antibody }
              min: 1
              max: 1
            - bind_as: chronicle
              filter:
                all_of:
                  - trait_has: Chronicle
                  - any_of:
                      - kind: tamer
                      - kind: option
              min: 1
              max: 1
          prompt: "Add 1 X Antibody card and 1 Chronicle Tamer or Option card"
      - add_to_hand_from_reveal: { of: you, card: x_antibody }
      - add_to_hand_from_reveal: { of: you, card: chronicle }
      - place_remainder_on_deck: { of: you, position: bottom }

  - scope: inherited
    kind: aura
    active_when: { opponents_turn: true }
    target: {}
    dp_modifier: 2000
    summary: "[Opponent's Turn] This Digimon gets +2000 DP"
