# BT20-031 Liamon — Digimon, Lv.4, Yellow/Black, DP 5000, Cost 4.
# Traits: Holy Beast, ACCEL. Form: Champion. Attribute: Vaccine.
#
# Printed text (official Bandai DB bundle data/card_bundles/BT20-031.md,
# authoritative; DCGO BT20_031.cs cross-checked):
#
#   Evo box: Lv.3 Yellow / cost 3 OR Lv.3 Black / cost 3 (two circles).
#   Evo box: "Digivolve Lv.3 w/[ACCEL] trait: Cost 2".
#
#   [On Play] [When Digivolving] 1 of your opponent's Digimon gets -3000 DP for
#   the turn.
#
#   Inherited Effect: <Barrier>
#
# DCGO: AddSelfDigivolutionRequirementStaticEffect(TopCard.HasLevel &&
#   Level == 3 && EqualsTraits("ACCEL"), digivolutionCost: 2) — any colour. A
#   Yellow/Black Lv.3 [ACCEL] base satisfies the circle (cost 3) AND the alt
#   (cost 2): the cost-choice prompt fires (rule 17; the cluster
#   alt-digivolve-xros-req-cards family: BT20-038 / BT22-046).
#   [On Play] / [When Digivolving]: mandatory (isOptional: false), the pick is
#   mandatory (canNoSelect: false), ChangeDigimonDP -3000 UntilEachTurnEnd.
#   Inherited <Barrier>: BarrierSelfEffect(isInheritedEffect: true).

card: BT20-031
name: Liamon
kind: digimon
level: 4
color: [yellow, black]
cost: 4
dp: 5000
traits: [Holy Beast, ACCEL]
attribute: Vaccine
form: Champion

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 3
  - kind: digivolve
    from: { level_eq: 3, color_is: black }
    cost: 3
  # Printed alt evo box: "Digivolve Lv.3 w/[ACCEL] trait: Cost 2".
  - kind: digivolve
    from: { level_eq: 3, trait_has: ACCEL }
    cost: 2

effects:
  - text: "[On Play] [When Digivolving] 1 of your opponent's Digimon gets -3000 DP for the turn."
    when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] 1 of your opponent's Digimon gets -3000 DP for the turn"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "1 of your opponent's Digimon gets -3000 DP for the turn"
      - add_dp_modifier:
          target: target
          value: -3000
          expiry: end_of_turn

  - text: "＜Barrier＞ (When this Digimon would be deleted in battle, by trashing your top security card, it isn't deleted)"
    scope: inherited
    kind: grant_keyword
    keyword: Barrier
    summary: "[Inherited] <Barrier>"
