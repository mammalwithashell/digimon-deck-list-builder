card: BT20-060
name: "Alphamon: Ouryuken"
kind: digimon
level: 7
color: [black, purple, red]
cost: 6
dp: 16000
traits: ["X Antibody", "Royal Knight", Chronicle]
attribute: Vaccine
ace_overflow: -5

alt_paths:
  - kind: digivolve
    from: { level_eq: 6, color_is: black }
    cost: 6
  - kind: dna_digivolve
    materials:
      - { name_contains: "Alphamon" }
      - { name_contains: "Ouryumon" }
    cost: 0
    stacks_unsuspended: true
  - kind: blast_dna_digivolve
    materials:
      - { kind: digimon, name_is: "Alphamon" }
      - { kind: digimon, name_is: "Ouryumon" }
    cost: 0
    stacks_unsuspended: true

effects:
  # [Hand][Counter] Blast DNA Digivolve ([Alphamon] + [Ouryumon]).
  - kind: grant_keyword
    keyword: BlastDigivolve

  # [On Play][When Digivolving] 1 opponent Digimon gets -15000 DP until the
  # end of their turn. Then, if DNA digivolving, trash the opponent's top
  # security card and Recovery +1 (Deck).
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] 1 opponent Digimon gets -15000 DP until the end of their turn; if DNA digivolving, trash 1 security and recover"
    process:
      - select_opponent_permanent:
          bind_as: dp_target
          filter: { kind: digimon }
          prompt: "Give 1 opponent Digimon -15000 DP"
      - add_dp_modifier:
          target: dp_target
          value: -15000
          expiry: end_of_opponents_turn
      - if:
          condition: { dna_origin: true }
          then:
            - trash_top_security: { of: opponent }
            - recover: { of: you, count: 1 }

  # [All Turns][OPT] When security stacks are removed from, gain 3 memory.
  #
  # DCGO BT20_060.cs:256-284 implements this as ONE `OnLoseSecurity` clause
  # gated by `CanTriggerWhenLoseSecurity(_, _ => true)` (fires for EITHER stack)
  # under a single OPT key `RemovedSec_BT20_060` -> one fire across both stacks
  # per turn. Listing both security-removed timings in one triggered clause makes
  # the lowering cluster them under a single shared once-per-turn lockout
  # (precedent: BT16-102.yaml:94). Memory gain is mandatory (no printed "may").
  - when: [on_own_security_removed, on_opponent_security_removed]
    active_when: { all_turns: true }
    once_per_turn: true
    summary: "[All Turns][OPT] When security stacks are removed from, gain 3 memory"
    process:
      - gain_memory: 3
