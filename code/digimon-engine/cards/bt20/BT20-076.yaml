card: BT20-076
name: "Imperialdramon: Dragon Mode"
kind: digimon
level: 6
color: [purple, red]
cost: 7
dp: 12000
traits: [Ancient Dragon]
attribute: Virus
ace_overflow: -4

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: purple }
    cost: 4
  - kind: blast_dna_digivolve
    materials:
      # Printed: <Blast DNA Digivolve ([Dinobeemon] + [Paildramon])>. All
      # printings (BT3-055 .. BT20-074) and DCGO spell it "Dinobeemon" -
      # `name_is` is an exact (case-sensitive) match, so the previous
      # "DinoBeemon" casing could never match any real card.
      - { kind: digimon, name_is: "Dinobeemon" }
      - { kind: digimon, name_is: "Paildramon" }
    cost: 0
    stacks_unsuspended: true

effects:
  - kind: grant_keyword
    keyword: BlastDigivolve

