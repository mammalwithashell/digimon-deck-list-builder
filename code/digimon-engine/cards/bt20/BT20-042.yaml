# Official observation b309ed7f7cea16508a47b2de2fc63fbd362725a9b3185205101bd6e029f80922; image verified.
# Q4358: independent targets. Q4359: field-only DNA identity. Q4360: mutual deletion does not trigger.
card: BT20-042
name: Groundramon
kind: digimon
level: 5
color: [green, red]
cost: 7
dp: 7000
traits: [Earth Dragon]
form: Ultimate
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: green }
    cost: 4
  - kind: digivolve
    from: { level_eq: 4, color_is: red }
    cost: 4
  - kind: digivolve
    from: { name_is: Coredramon }
    cost: 3

effects:
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Suspend 1 opponent Digimon or Tamer; then 1 opponent Digimon or Tamer can't unsuspend until the end of their turn"
    process:
      - select_opponent_permanent:
          bind_as: suspend_target
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          prompt: "Suspend 1 of your opponent's Digimon or Tamers"
      - if:
          condition: { binding_present: suspend_target }
          then:
            - suspend: { target: suspend_target }
      - select_opponent_permanent:
          bind_as: lock_target
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          prompt: "Choose 1 of your opponent's Digimon or Tamers that can't unsuspend until the end of their turn"
      - if:
          condition: { binding_present: lock_target }
          then:
            - add_modifier:
                target: lock_target
                modifier: CannotUnsuspend
                value: 1
                expiry: end_of_opponents_turn

  - kind: aura
    target: {}
    dna_material_identity:
      for_result: Examon
      level: 6
      name: Breakdramon
    summary: "[All Turns] This Digimon is also treated as Lv.6 [Breakdramon] for [Examon]'s DNA digivolution"

  - scope: inherited
    when: on_ally_won_battle
    once_per_turn: true
    condition:
      all_of:
        - event_winner_is_source: true
        - event_battle_deleter: { owner: you, kind: digimon }
    summary: "Inherited [All Turns][Once Per Turn] When this Digimon deletes your opponent's Digimon in battle, trash their top security card"
    process:
      - trash_top_security: { of: opponent }
