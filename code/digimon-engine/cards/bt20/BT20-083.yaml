card: BT20-083
name: Omekamon
kind: digimon
level: 4
color: [white]
cost: 5
dp: 5000
traits: [Puppet, X Antibody, LIBERATOR]
attribute: Data

# Printed clauses still gap-routed:
#
# - [On Deletion] You may place this card as the bottom digivolution card
#   of your [King Drasil_7D6] in the breeding area. RK-G001 filter shipped
#   in Phase 2 Track J PR 1 — but the surrounding "you may" optionality
#   needs an `optional: bool` field on `select_own_breeding_permanent`
#   (or a wrapper that exposes decline before opening the prompt). Today's
#   `select_own_breeding_permanent` is hardcoded `is_optional: false`, so
#   authoring the body would silently turn the printed "you may" into
#   "you must". Tracked as a follow-up to RK-G001.
#
# - Inherited [Breeding][Opponent's Turn] security-removed trigger: by
#   suspending the carrier, play 1 [Omekamon] from this Digimon's sources
#   for free. The fan-out timing wired 2026-05-08, but the printed body
#   (suspend the breeding carrier as a cost and play [Omekamon] from
#   that breeding stack's materials without paying the cost) still needs
#   card-local plumbing.

effects:
  - kind: grant_keyword
    keyword: Blocker

  - when: on_play
    optional: true
    condition: { security_count_lte: 1 }
    summary: "[On Play] At 1 or fewer security, may free digivolve into Omnimon (X Antibody)"
    process:
      - select_hand:
          of: you
          bind_as: omni_x
          filter: { name_is: "Omnimon (X Antibody)" }
          prompt: "Choose [Omnimon (X Antibody)] in hand"
      - effect_initiated_digivolve:
          target: self
          from_hand: omni_x
          cost: 0
          ignore_requirements: true
