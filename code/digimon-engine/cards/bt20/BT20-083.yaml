card: BT20-083
name: Omekamon
kind: digimon
level: 4
color: [white]
cost: 5
dp: 5000
traits: [Puppet, X Antibody, LIBERATOR]
attribute: Data

effects:
  - kind: grant_keyword
    keyword: Blocker

  - when: on_play
    optional: true
    condition: { security_count_lte: 1 }
    summary: "[On Play] At 1 or fewer security, may free digivolve into Omnimon (X Antibody)"
    process:
      - select_hand:
          of: you
          bind_as: omni_x
          filter: { name_is: "Omnimon (X Antibody)" }
          prompt: "Choose [Omnimon (X Antibody)] in hand"
      - effect_initiated_digivolve:
          target: self
          from_hand: omni_x
          cost: 0
          ignore_requirements: true

  - when: on_deletion
    summary: "[On Deletion] You may place this card under your breeding King Drasil_7D6"
    process:
      - select_own_breeding_permanent:
          bind_as: kd
          optional: true
          filter: { name_is: "King Drasil_7D6" }
          prompt: "Choose your [King Drasil_7D6] in the breeding area"
          then:
            - place_as_bottom_source:
                source: self
                target: kd

  - scope: inherited
    when: on_own_security_removed
    optional: true
    active_when:
      all_of:
        - opponents_turn: true
        - source_is_unsuspended: true
        - self_digivolution_sources_contain_name: "Omekamon"
    summary: "[Breeding][Opponent's Turn] Suspend this Digimon to play an Omekamon from its sources"
    process:
      - suspend: { target: carrier }
      - select_materials:
          of_permanent: carrier
          max: 1
          filter: { name_is: "Omekamon" }
          bind_as: omekamon_source
          prompt: "Choose an [Omekamon] source to play"
      - play_from_materials:
          target: carrier
          source_index: omekamon_source
          cost_delta: free
