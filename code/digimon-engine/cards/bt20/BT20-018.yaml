# Printed card image and official bundle; DCGO BT20_018.cs.
# CR 4.3 16-12: De-Digivolve declares 1..2; the attack-only tail is independent.
card: BT20-018
name: Ouryumon
kind: digimon
level: 6
color: [red, black]
cost: 12
dp: 11000
traits: [Beast Dragon, X Antibody, Chronicle]
form: Mega
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: red }
    cost: 3
  - kind: digivolve
    from: { level_eq: 5, color_is: black }
    cost: 3

effects:
  - kind: grant_keyword
    keyword: Piercing

  - when: [on_play, when_digivolving]
    summary: "De-Digivolve 2 an opponent's Digimon; then during an attack, a breeder may evolve into a Lv.6 or lower Chronicle from hand or trash for free"
    process:
      - select_opponent_permanent:
          bind_as: de_digivolve_target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon to De-Digivolve 2"
      - de_digivolve: { target: de_digivolve_target, amount: 2 }
      - if:
          condition: { during_attack: true }
          then:
            - select_own_breeding_permanent:
                bind_as: breeder
                optional: true
                filter:
                  all_of:
                    - kind: digimon
                    - has_digivolve_candidate:
                        of: you
                        zone: [hand, trash]
                        filter:
                          kind: digimon
                          level_lte: 6
                          trait_has: Chronicle
                prompt: "Digivolve your breeding Digimon into a level 6 or lower Chronicle for free?"
                then:
                  - select_union_zone:
                      of: you
                      zones: [hand, trash]
                      bind_as: evolution
                      optional: true
                      cost: false
                      filter:
                        kind: digimon
                        level_lte: 6
                        trait_has: Chronicle
                        can_digivolve_onto: breeder
                      prompt: "Choose a level 6 or lower Chronicle Digimon in hand or trash"
                  - effect_initiated_digivolve:
                      target: breeder
                      source: evolution
                      cost: free

  # Both security-removal timings belong to one clause and share one OPT key.
  - when: [on_own_security_removed, on_opponent_security_removed]
    active_when: { all_turns: true }
    once_per_turn: true
    summary: "[All Turns][Once Per Turn] When security stacks are removed from, delete 1 opponent Digimon with the lowest DP"
    process:
      - select_opponent_permanent:
          bind_as: lowest_dp_target
          selector: lowest_dp
          filter: { kind: digimon }
          prompt: "Delete 1 opponent Digimon with the lowest DP"
      - delete_permanent: { target: lowest_dp_target }

  - scope: inherited
    when: when_attacking
    once_per_turn: true
    condition: { name_is: "Alphamon: Ouryuken" }
    summary: "[Inherited][When Attacking][Once Per Turn] If this Digimon is Alphamon: Ouryuken, trash your opponent's top security card"
    process:
      - trash_top_security: { of: opponent }
