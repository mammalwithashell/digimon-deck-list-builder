card: BT20-102
name: Omnimon (X Antibody)
kind: digimon
level: 7
color: [red, blue]
cost: 16
dp: 16000
traits: [Holy Warrior, X Antibody, Royal Knight, LIBERATOR]

# ─── Alternate Digivolution Path ─────────────────────────────────────────────
#
# DCGO (BT20_102.cs, EffectTiming.None, AddSelfDigivolutionRequirementStaticEffect):
#   permanentCondition: targetPermanent.TopCard.EqualsCardName("Omnimon")
#   digivolutionCost: 2, ignoreDigivolutionRequirement: false
#
# Standard alt-path: when the digivolution source's top card name contains "Omnimon",
# you may digivolve into BT20-102 for a cost of 2 (normal requirements still apply).
alt_paths:
  - kind: digivolve
    from: { name_contains: "Omnimon" }
    cost: 2

effects:
  # ─── Clause (a): <Raid> ────────────────────────────────────────────────────
  # Declarative keyword grant.
  # GAP G-DECLARATIVE-KEYWORD: `EffectTiming::Declarative` is compiled but never
  # enqueued/fired. The grant_keyword modifier is not installed at runtime. Tests
  # for keyword-grant modifier presence were #[ignore]'d on G-DECLARATIVE-KEYWORD (now RESOLVED, qa/resolved-gaps.md).
  - kind: grant_keyword
    keyword: Raid

  # ─── Clause (b): <Piercing> ───────────────────────────────────────────────
  # Declarative keyword grant. Same G-DECLARATIVE-KEYWORD note as clause (a).
  - kind: grant_keyword
    keyword: Piercing

  # ─── Clause (c): <Blocker> ────────────────────────────────────────────────
  # Declarative keyword grant. Same G-DECLARATIVE-KEYWORD note as clause (a).
  - kind: grant_keyword
    keyword: Blocker

  # ─── Clause (d): [On Play][When Digivolving] board-wipe + return ──────────
  #
  # Printed text:
  #   "[On Play][When Digivolving] If [Omnimon] or [X Antibody] is in this
  #   Digimon's digivolution cards, choose 1 of both players' Digimon and
  #   delete all other Digimon. Then, return 1 of your opponent's Digimon to
  #   the bottom of the deck."
  #
  # DCGO analysis (BT20_102.cs, EffectTiming.OnEnterFieldAnyone):
  #   1. IsOmniOrXAntiSource(): DigivolutionCards.Count(name == "Omnimon" || "X Antibody") > 0
  #   2. If opp has Digimon: select 1 to NOT destroy (owner picks, canNoSelect: false)
  #   3. If own has Digimon: select 1 to NOT destroy (owner picks, canNoSelect: false)
  #   4. Destroy all Digimon not in the saved list
  #   5. (Unconditional, outside IsOmniOrXAntiSource check) If opp has Digimon:
  #      select 1 to return to bottom of deck (canNoSelect: false, mode: PutLibraryBottom)
  #
  # MIGRATED 2026-05-20 — clause (d) body is now PURE DSL. The previous
  # raw_rust escape (`bt20_102_boardwipe_and_return`) is removed.
  #
  # G-SELF-DIGIVOLUTION-CONTAINS-NAME-SOURCES-ONLY (RESOLVED 2026-05-19):
  #   The digivolution-stack condition "If [Omnimon] or [X Antibody] is in
  #   this Digimon's digivolution cards" checks only the SOURCE cards beneath
  #   the carrier — NOT the carrier's own top card. The pre-existing
  #   `self_digivolution_contains_name` predicate calls
  #   `Permanent::contains_card_name`, which scans the top card too — so a
  #   card NAMED "Omnimon (X Antibody)" always self-matches "Omnimon" /
  #   "X Antibody" and the negative case ("no Omnimon in the digivolution
  #   cards") was inexpressible. The new `self_digivolution_sources_contain_name`
  #   predicate scans ONLY the digivolution source cards (excluding the
  #   carrier's top card) — matching DCGO's `DigivolutionCards.Count(...)`.
  #   The clause `condition:` below uses it directly, so the board-wipe fires
  #   only when an Omnimon / X Antibody card is genuinely in the stack.
  #
  # G-FOR-EACH-EXCLUDE-BINDING (RESOLVED 2026-05-20 — pure DSL):
  #   "Delete all OTHER Digimon" (all Digimon except the two saved) is now a
  #   `for_each` over both players' battle-area Digimon (`of: any`) with a
  #   `not_in_binding` exclusion of the two protect-bindings. The subtlety:
  #   `not_in_binding` against an ABSENT binding currently evaluates to
  #   "subject IS in the (missing) set" → the candidate would be wrongly
  #   excluded from deletion. A protect-binding is absent whenever that
  #   player had no Digimon to protect (the `select_*_permanent` step
  #   silently short-circuits on an empty candidate set). To stay faithful
  #   WITHOUT an engine change, each exclusion is wrapped as
  #   `any_of: [{ binding_absent: <save> }, { not_in_binding: <save> }]`:
  #   when the save slot is unbound the `binding_absent` leaf passes (the
  #   exclude-set is empty → nothing protected on that side); when it is
  #   bound, `not_in_binding` excludes exactly the one saved permanent.
  #   This reproduces the raw_rust per-player branch logic precisely.
  #
  # Step ordering vs DCGO (BT20_102.cs OnEnterFieldAnyone):
  #   1-2. select_opponent_permanent / select_own_permanent — choose 1 to
  #        protect per player. Non-optional ("choose 1" is mandatory); the
  #        engine silently no-ops the select when that player has no Digimon
  #        (matches DCGO `canNoSelect: false` + the empty-set skip).
  #   3.   for_each delete — delete every battle-area Digimon not protected.
  #        `for_each` snapshots stable top-card identities, so the
  #        per-iteration removals do not invalidate the iteration
  #        (G-FOR-EACH-DELETE-INDEX-SHIFT).
  #   4.   select_opponent_permanent + return_to_deck bottom — DCGO step 5.
  #        After the board-wipe only the protected opponent Digimon remains;
  #        it is the return target. Non-optional, silently no-ops when the
  #        opponent has no surviving Digimon.
  #
  # PRINTED-TEXT NUANCE: step 4 ("Then, return …") is grammatically part of
  # the same conditional sentence as the board-wipe in the printed text
  # ("If [Omnimon] or [X Antibody] is in this Digimon's digivolution cards,
  # choose … and delete … . Then, return …"). DCGO places its step 5 outside
  # the source check, but the printed "Then," chains it to the conditional
  # clause — so gating the whole clause on the stack condition (the
  # `condition:` below) is faithful to the printed text. (If a divergence is
  # ever observed, printed text wins per the source-priority policy.)
  #
  # Same shape as AD1-025 Omnimon clause (d): `for_each` board mutation
  # followed by sequential `select_opponent_permanent` + body steps.
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] If Omnimon/X Antibody in digivolution cards → choose 1 to protect per player, delete rest; return 1 opp Digimon to bottom of deck"
    condition:
      any_of:
        - self_digivolution_sources_contain_name: "Omnimon"
        - self_digivolution_sources_contain_name: "X Antibody"
    process:
      # Step 1: choose 1 of the opponent's Digimon to protect.
      - select_opponent_permanent:
          bind_as: saved_opp
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to protect from deletion"
      # Step 2: choose 1 of your Digimon to protect.
      - select_own_permanent:
          bind_as: saved_own
          filter: { kind: digimon }
          prompt: "Choose 1 of your Digimon to protect from deletion"
      # Step 3: delete every battle-area Digimon that is not protected.
      - for_each:
          over:
            all_of:
              - kind: digimon
              - of: any
              - any_of:
                  - binding_absent: saved_opp
                  - not_in_binding: saved_opp
              - any_of:
                  - binding_absent: saved_own
                  - not_in_binding: saved_own
          bind_as: wipe_target
          body:
            - delete_permanent: { target: wipe_target }
      # Step 4: return 1 of the opponent's (surviving) Digimon to deck bottom.
      - select_opponent_permanent:
          bind_as: return_target
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to return to the bottom of their deck"
      - return_to_deck:
          target: return_target
          position: bottom

  # ─── Clause (e): [End of Your Turn][Once Per Turn] Rush + attack ──────────
  #
  # Printed text:
  #   "[End of Your Turn][Once Per Turn] 1 of your Digimon may gain <Rush> for
  #   the turn and attack without suspending."
  #
  # DCGO analysis (BT20_102.cs, EffectTiming.OnEndTurn):
  #   - SetUpActivateClass(maxUsableCount: 1, isOptional: true)
  #   - SelectPermanentEffect: pick 1 from own Digimon (canNoSelect: false)
  #   - GainRush(UntilEachTurnEnd) on selected
  #   - SelectAttackEffect.SetWithoutTap() — mandatory attack without suspending
  #
  # "You may" in printed text → optional: true (DCGO: isOptional=true).
  # After the trigger is accepted and a Digimon is selected, the attack is mandatory:
  # DCGO uses SelectAttackEffect.SetCanNotSelectNotAttack() + SetWithoutTap().
  # Rust expresses that as force_attack with without_suspending routed through AttackOpen.
  #
  # GAP G-OPT-TRIGGERED [already tracked]:
  #   `once_per_turn: true` on triggered clauses compiles to `Effect::max_per_turn=1`
  #   but `run_queued_effect_inner` does not enforce it for triggered effects. The clause
  #   will over-fire until this gap closes.
  - when: end_of_your_turn
    once_per_turn: true
    optional: true
    summary: "[EOT][OPT] 1 of your Digimon gains Rush for the turn; attack without suspending"
    process:
      - select_own_permanent:
          bind_as: tgt
          filter:
            kind: digimon
          prompt: "Choose 1 of your Digimon to gain Rush and attack without suspending"
      - grant_keyword:
          target: tgt
          keyword: Rush
          expiry: end_of_turn
      - force_attack:
          attacker: tgt
          targets: any
          without_suspending: true
