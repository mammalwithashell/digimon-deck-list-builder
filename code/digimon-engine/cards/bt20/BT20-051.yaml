# Printed card image and official bundle; DCGO BT20/Black/BT20_051.cs.
card: BT20-051
name: Raptordramon
kind: digimon
level: 4
color: [black, yellow]
cost: 5
dp: 6000
traits: [Cyborg, X Antibody, Chronicle]
form: Champion
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: black }
    cost: 3
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 3
  - kind: digivolve
    from:
      any_of:
        - name_is: Dorumon
        - all_of:
            - level_eq: 3
            - trait_has: Chronicle
    cost: 2

effects:
  - when: when_digivolving
    optional: true
    condition:
      count_lte:
        filter: { of: you, zone: [battle_area], kind: tamer }
        n: 1
    summary: "If you have 1 or fewer Tamers, you may play 1 Kota Domoto from your hand without paying the cost"
    process:
      - select_hand:
          of: you
          bind_as: kota
          optional: true
          filter:
            kind: tamer
            name_is: Kota Domoto
            can_play_from_effect_without_cost: true
          prompt: "Play 1 [Kota Domoto] from your hand without paying the cost"
      - play_from_hand_free: { of: you, hand_index: kota }

  - kind: aura
    scope: inherited
    active_when: { opponents_turn: true }
    target: {}
    dp_modifier: 2000
    summary: "[Opponent's Turn] This Digimon gets +2000 DP"
