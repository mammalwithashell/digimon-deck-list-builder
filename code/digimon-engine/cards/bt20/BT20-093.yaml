# Authority: official observation 074c2baf4836745b2e1d2faa6dc538674d4e5e5ae5c8686eb63f4c82231a3934,
# card image, Q4433-Q4436; general_rule.pdf 16-16. Base DCGO BT20_093.cs agrees.
card: BT20-093
name: Unleash the Dragon Gene
kind: option
color: [red]
cost: 2
#
# Pick legality (select-hand audit, 2026-11-13):
# - [Main] DCGO BT20_093.cs:34-39 offers only a Digimon that
#   `CanPlayAsNewPermanent` (play cost, free frame, no play lock; never a
#   DUAL: it has no play cost, so it can't be played, CR 4.3 7-1-1; it is
#   only digivolved or used, 4-6-2) = `can_play_from_effect_without_cost`. The play pays
#   the cost reduced by 3 (:136-142 `payCost: true`); DCGO's pick does not
#   check that this is payable, but CR 4.3 1-3-11-1 forbids declaring a play
#   whose cost can't be paid, so `affordable_with_cost: {reduce: 3}` (the
#   verb's own cost_delta) is added — stricter than DCGO, per the rules.
# - Delay DNA: the replacement lowering's DelayFieldDna flow
#   (lower_replacement.rs `delay_field_dna_pairs`) already offers only an
#   [Examon] with a recipe-satisfying, payable field pair and only pair
#   members that complete it (DCGO :184-189 `CanPlayJogress(true)`).
# - [Security] DCGO :233-238 `CanPlayAsNewPermanent(payCost: false)` =
#   `can_play_from_effect_without_cost` (zone-aware for the trash row).
effects:
  - when: main_from_hand
    process:
      - select_hand:
          of: you
          bind_as: played
          optional: true
          filter:
            all_of:
              - kind: digimon
              - any_of:
                  - in_text_contains: Dracomon
                  - in_text_contains: Examon
              - can_play_from_effect_without_cost: true
              - affordable_with_cost: {reduce: 3}
          prompt: "Play 1 Dracomon/Examon-text Digimon with cost reduced by 3"
      - play_from_hand:
          of: you
          hand_index: played
          cost_delta: {reduce: 3}
      - place_self_as_delay_option: {}
  - kind: replacement
    trigger: when_would_leave_battle_area
    optional: true
    active_when:
      all_of:
        - replacement_subject_is_mine: true
        - kind: digimon
        - any_of:
            - in_text_contains: Dracomon
            - in_text_contains: Examon
        - none_of: [{replacement_cause: battle}]
    process:
      # Delay pays by trashing this option before the optional DNA reward.
      - delete_permanent: {target: source}
      - select_hand:
          of: you
          bind_as: result
          optional: true
          filter: {kind: digimon, name_is: Examon}
          prompt: "DNA digivolve into Examon from hand"
      - select_dna_pair:
          left_filter: {kind: digimon, of: you}
          right_filter: {kind: digimon, of: you}
          bind_left_as: first
          bind_right_as: second
          optional: true
          prompt: "Choose 2 of your Digimon for DNA digivolution"
      - effect_initiated_dna_digivolve:
          target_a: first
          target_b: second
          from_hand: result
          cost: printed
          ignore_requirements: false
  - scope: inherited
    when: on_security
    process:
      - select_union_zone:
          of: you
          zones: [hand, trash]
          bind_as: played
          optional: true
          filter: {kind: digimon, name_contains: Dracomon, can_play_from_effect_without_cost: true}
          prompt: "Play 1 Dracomon-name Digimon from hand or trash without paying the cost"
      - play_union_bound_free: {binding: played}
      - place_self_as_delay_option: {}

