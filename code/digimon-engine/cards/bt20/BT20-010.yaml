# Printed card image and official bundle; DCGO BT20/Red/BT20_010.cs.
# Q4292: the cost reduction does not activate in the breeding area.
card: BT20-010
name: Ryudamon
kind: digimon
level: 3
color: [red, black]
cost: 3
dp: 1000
traits: [Beast, X Antibody, Chronicle]
form: Rookie
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: red }
    cost: 1
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 1
  - kind: digivolve
    from: { level_eq: 2, color_is: black, trait_has: X Antibody }
    cost: 0

effects:
  - kind: cost_reduction
    reduction_timing: before_pay_cost
    active_when:
      all_of:
        - your_turn: true
        - source_is_cost_target_permanent: true
        - cost_target:
            all_of:
              - kind: digimon
              - any_of:
                  - name_is: Ginryumon
                  - trait_has: Chronicle
    amount: 1
    summary: "[Your Turn] When this Digimon would digivolve into Ginryumon or a Chronicle Digimon, reduce the cost by 1"

  - kind: aura
    scope: inherited
    active_when: { your_turn: true }
    target: {}
    dp_modifier: 2000
    summary: "[Your Turn] This Digimon gets +2000 DP"
