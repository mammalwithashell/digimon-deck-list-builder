card: BT20-084
name: Sistermon Ciel (Awakened)
kind: digimon
level: 4
color: [white]
cost: 5
dp: 6000
traits: [Puppet]

alt_paths:
  - kind: digivolve
    from: { name_is: "Sistermon Ciel" }
    cost: 1

effects:
  - when: on_ally_played
    # Printed [Trash] zone scope: this observer is live ONLY while the card
    # sits in the owner's trash; the EnteredField trash scan enqueues only
    # trash-scoped clauses (dead cards' ordinary observers stay dormant).
    scope: trash
    optional: true
    active_when: { all_turns: true }
    summary: "[Trash] When any of your Digimon are played, may digivolve 1 Sistermon Ciel into this card for free"
    trigger_if:
      event_target_kind: digimon
    # "without paying the cost" waives the cost, not the digivolution
    # requirements: DCGO BT20_084.cs:156-166 passes `payCost: false,
    # ignoreDigivolutionRequirementFixedCost: -1` and the default
    # `IgnoreRequirement.None` (CardEffectCommons.cs:832, 842), so the route is
    # the printed "[Digivolve] [Sistermon Ciel]: Cost 1" alt-path, paid at 0.
    # The pick (BT20_084.cs:76-90) and the activation (`CanActivateCondition`,
    # BT20_084.cs:107-118) need `card.CanPlayCardTargetFrame(frame, false, ...,
    # root: Trash)`: `this_card_can_digivolve_onto { cost: free }` (route +
    # "can't digivolve" prohibitions; free, so no payment). With no such
    # [Sistermon Ciel] the pick is empty and nothing is asked.
    # G-DSL-THIS-CARD-CAN-DIGIVOLVE-ONTO.
    process:
      - select_own_permanent:
          bind_as: target
          optional: true
          filter:
            all_of:
              - kind: digimon
              - name_is: "Sistermon Ciel"
              - this_card_can_digivolve_onto: { cost: free }
          prompt: "Choose a Sistermon Ciel to digivolve into this card"
      - effect_initiated_digivolve:
          target: target
          source: self
          cost: free

  - when: [on_play, when_digivolving]
    summary: "1 opponent Digimon or Tamer can't suspend until the end of their turn"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          prompt: "Choose 1 opponent Digimon or Tamer that can't suspend"
      - add_modifier:
          target: target
          modifier: CannotSuspend
          value: 1
          expiry: end_of_opponents_turn

  - when: [end_of_your_turn, end_of_opponents_turn]
    summary: "[End of All Turns] Place this Digimon's top stacked card as your top security card"
    process:
      - security_place_top_stacked_card:
          carrier: source
          of: you
          position: top
          face: down
