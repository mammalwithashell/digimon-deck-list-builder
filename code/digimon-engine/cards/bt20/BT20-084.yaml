card: BT20-084
name: Sistermon Ciel (Awakened)
kind: digimon
level: 4
color: [white]
cost: 5
dp: 6000
traits: [Puppet]

alt_paths:
  - kind: digivolve
    from: { name_is: "Sistermon Ciel" }
    cost: 1

effects:
  - when: [on_play, when_digivolving]
    summary: "1 opponent Digimon or Tamer can't suspend until the end of their turn"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          prompt: "Choose 1 opponent Digimon or Tamer that can't suspend"
      - add_modifier:
          target: target
          modifier: CannotSuspend
          value: 1
          expiry: end_of_opponents_turn
