card: BT20-016
name: Paildramon
kind: digimon
level: 5
color: [red, purple]
cost: 8
dp: 8000
traits: [Dragonkin]

# Standard digivolve: Lv4 Red / Cost 4
# DNA digivolve: Lv4 Red + Lv4 Purple / Cost 0
alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color: red }
    cost: 4

  - kind: dna_digivolve
    materials:
      - { level_eq: 4, color: red }
      - { level_eq: 4, color: purple }
    cost: 0

effects:
  # ─── Clause 1 ────────────────────────────────────────────────────────────────
  # [On Play][When Digivolving]
  # 1 of your Digimon gains <Piercing> and gets +4000 DP for the turn.
  # Then, this Digimon may attack.
  #
  # DCGO: OnEnterFieldAnyone timing with CanTriggerOnPlay / CanTriggerWhenDigivolving.
  # Mandatory selection (canNoSelect: false). Grants:
  #   - GainPierce (via GrantKeywordEffect with UntilEachTurnEnd expiry)
  #   - ChangeDigimonDP(4000, UntilEachTurnEnd)
  # Then SelectAttackEffect (canNoSelect: true — optional attack) on THIS Digimon.
  #
  # "Then, this Digimon may attack." — BLOCKED: G-MAY-ATTACK-NOW
  # No DSL verb or engine primitive for optional mid-effect attack on a specific
  # Digimon. The DCGO fires SelectAttackEffect (canNoSelect: true) within the
  # coroutine. Omitted until gap closes. See qa/dsl-vocab-gaps.md.
  - when: [on_play, when_digivolving]
    summary: "1 of your Digimon gains Piercing and +4000 DP for the turn"
    condition:
      any_permanent:
        of: you
        zone: [battle_area]
        kind: digimon
    process:
      - select_own_permanent:
          bind_as: tgt
          filter: { kind: digimon }
          prompt: "Select 1 of your Digimon to gain Piercing and +4000 DP for the turn"
      - grant_keyword:
          target: tgt
          keyword: Piercing
          expiry: end_of_turn
      - add_dp_modifier:
          target: tgt
          value: 4000
          expiry: end_of_turn
      # "Then, this Digimon may attack."
      # BLOCKED: G-MAY-ATTACK-NOW — no DSL verb for optional mid-effect attack.
      # See qa/dsl-vocab-gaps.md.

  # ─── Clause 2 ────────────────────────────────────────────────────────────────
  # [All Turns] When any of your [Paildramon] or [Dinobeemon] would be deleted,
  # 2 of your Digimon may DNA digivolve into [Imperialdramon: Dragon Mode] in the hand.
  #
  # This clause is a CROSS-PERMANENT deletion observer: the carrier (this Paildramon)
  # watches for the deletion of OTHER Paildramon or Dinobeemon permanents it controls.
  #
  # DCGO uses ActivateClass at WhenPermanentWouldBeDeleted timing — deletion is NOT
  # cancelled, only an optional DNA digivolve is triggered. This is NOT a replacement
  # class (WillBeDeletedClass); the printed text says "would be deleted", but the DCGO
  # implementation proceeds with deletion regardless of DNA digivolve acceptance.
  #
  # DSL `kind: replacement` is BLOCKED for this pattern:
  # `lower_replacement.rs` (lines 83–91) enforces a `subject_matches` guard that only
  # fires when the subject IS the carrier permanent — cross-permanent subjects are silently
  # dropped. See code/digimon-engine/src/dsl_cards/lower_replacement.rs.
  #
  # BLOCKED (hybrid): G-EVENT-TARGET-OWNER
  # Engine gap: no predicate in ReplacementContext exposes the subject permanent's
  # controller. Without it, a hand-written WhenWouldBeDeleted effect cannot filter for
  # "your Paildramon/Dinobeemon" (cards controlled by the same player as the carrier).
  # DSL gap: no `event_target_controller_eq: you` predicate exists.
  # The raw_rust function `bt20_016_dna_on_deletion` returns an empty Vec<Effect>
  # (no-op placeholder) until this gap is resolved.
  # See qa/archetype-qa/engine-gaps.md — G-EVENT-TARGET-OWNER.
  - kind: raw_rust
    fn: bt20_016_dna_on_deletion

  # ─── Inherited: <Security A. +1> ─────────────────────────────────────────────
  #
  # Grants Security Attack +1 as a permanent inherited modifier.
  # DCGO: ChangeSelfSAttackStaticEffect(changeValue: 1, isInheritedEffect: true).
  #
  # Note G-DECLARATIVE-KEYWORD: `kind: grant_keyword` declarative clauses compile
  # correctly but EffectTiming::Declarative is never enqueued by the effect queue,
  # so this modifier is never installed at runtime. Tracked in qa/dsl-vocab-gaps.md.
  - kind: grant_keyword
    scope: inherited
    keyword: SecurityAttackPlus
    value: 1
