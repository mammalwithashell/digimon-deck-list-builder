card: BT20-016
name: Paildramon
kind: digimon
level: 5
color: [red, purple]
cost: 8
dp: 8000
traits: [Dragonkin]

# Standard digivolve: Lv4 Red / Cost 4
# DNA digivolve: Lv4 Red + Lv4 Purple / Cost 0
alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color: red }
    cost: 4

  - kind: dna_digivolve
    materials:
      - { level_eq: 4, color: red }
      - { level_eq: 4, color: purple }
    cost: 0

effects:
  # ─── Clause 1 ────────────────────────────────────────────────────────────────
  # [On Play][When Digivolving]
  # For the turn, 1 of your Digimon gains <Piercing> and gets +4000 DP.
  # Then, this Digimon may attack.
  #
  # DCGO (BT20_016.cs lines 101-273): OnEnterFieldAnyone timing with
  # CanTriggerOnPlay / CanTriggerWhenDigivolving. Mandatory selection
  # (canNoSelect: false). Grants:
  #   - GainPierce (via CardEffectCommons.GainPierce, UntilEachTurnEnd expiry)
  #   - ChangeDigimonDP(4000, UntilEachTurnEnd)
  # Then SelectAttackEffect (canNoSelect: true — optional attack) on THIS Digimon.
  #
  # "Then, this Digimon may attack." — effect-created optional attack on the
  # source permanent, routed through `may_attack_now`. Printed text does not say
  # "without suspending", so the attack suspends BT20-016 normally.
  - when: [on_play, when_digivolving]
    summary: "1 of your Digimon gains Piercing and +4000 DP for the turn; then this Digimon may attack"
    condition:
      any_permanent:
        of: you
        zone: [battle_area]
        kind: digimon
    process:
      - select_own_permanent:
          bind_as: tgt
          filter: { kind: digimon }
          prompt: "Select 1 of your Digimon to gain Piercing and +4000 DP for the turn"
      - grant_keyword:
          target: tgt
          keyword: Piercing
          expiry: end_of_turn
      - add_dp_modifier:
          target: tgt
          value: 4000
          expiry: end_of_turn
      - may_attack_now:
          attacker: source
          targets: any
          optional: true
          prompt: "Have this Digimon attack now?"

  # ─── Clause 2a ───────────────────────────────────────────────────────────────
  # [All Turns] When any of your [Paildramon] or [Dinobeemon] would be deleted,
  # 2 of your Digimon may DNA digivolve into [Imperialdramon: Dragon Mode] in
  # the hand.
  #
  # SELF-deletion arm. BT20-016 is itself named [Paildramon], so when the carrier
  # is deleted the clause must fire for it. `on_any_deletion` only scans
  # currently-LIVE permanents (the just-deleted carrier is already gone from
  # battle_area), so the carrier's own deletion is observed via the dedicated
  # self-deletion timing `on_deletion`, which fires while the carrier is still on
  # field (combat.rs commit_permanent_deletion enqueues OnDeletion before
  # Player::delete_permanent). No name condition is needed — the carrier is
  # always a Paildramon.
  #
  # DCGO BT20_016.cs lines 275-339: ActivateClass at WhenPermanentWouldBeDeleted,
  # `CanTriggerWhenPermanentRemoveField(hashtable, isPaildramonOrDinoBeemon)`.
  # Optional (`isOptional: true` in SetUpActivateClass — the printed "may").
  # Body: `DNADigivolvePermanentsIntoHandOrTrashCard` filtering the result card
  # to name "Imperialdramon: Dragon Mode", `isHand: true`, `payCost: true`.
  #
  # "2 of your Digimon may DNA digivolve into [Imperialdramon: Dragon Mode]" —
  # the 2 DNA materials are the controller's own field Digimon; the result card
  # is the Imperialdramon: Dragon Mode in hand. Same shape as AD1-009's
  # end-of-turn DNA clause.
  #
  # The printed "may" is surfaced through the FIRST step being an
  # `optional: true` `select_hand`: the player gets a hand-select prompt where
  # PASS declines the whole DNA digivolve. `select_hand` installs no prompt at
  # all when no Imperialdramon: Dragon Mode is in hand (zero candidates) — DCGO
  # likewise does not prompt for an optional ability with no legal target.
  # `body_first_step_is_declinable` (lower_triggered.rs) recognises the inner
  # PASS as the decline path, so no redundant outer accept/decline prompt is
  # installed — and the clause-level `optional` condition is not re-evaluated
  # without a live trigger context.
  - when: on_deletion
    optional: true
    summary: "[All Turns] When this Paildramon would be deleted, 2 of your Digimon may DNA digivolve into Imperialdramon: Dragon Mode in hand"
    process:
      # Step 1: pick the Imperialdramon: Dragon Mode card in hand. `optional`
      # makes PASS the decline path for the printed "may".
      - select_hand:
          of: you
          bind_as: dna_card
          optional: true
          filter:
            all_of:
              - kind: digimon
              - name_contains: "Imperialdramon: Dragon Mode"
          prompt: "Select Imperialdramon: Dragon Mode from hand to DNA digivolve into (or pass)"
      # Step 2: pick 2 of your Digimon as the DNA materials.
      - select_dna_pair:
          left_filter:
            all_of:
              - kind: digimon
              - of: you
          right_filter:
            all_of:
              - kind: digimon
              - of: you
          bind_left_as: dna_src_a
          bind_right_as: dna_src_b
          prompt: "Select 2 of your Digimon to DNA digivolve into Imperialdramon: Dragon Mode"
      # Step 3: execute the DNA digivolve. Cost paid normally per dna_costs
      # of the result card (Lv4 Red + Lv4 Purple / 0 memory).
      - effect_initiated_dna_digivolve:
          target_a: dna_src_a
          target_b: dna_src_b
          from_hand: dna_card
          cost: 0
          ignore_requirements: false

  # ─── Clause 2b ───────────────────────────────────────────────────────────────
  # [All Turns] When any of your [Paildramon] or [Dinobeemon] would be deleted,
  # 2 of your Digimon may DNA digivolve into [Imperialdramon: Dragon Mode] in
  # the hand.
  #
  # CROSS-PERMANENT deletion arm — fires when ANOTHER of the controller's
  # [Paildramon] or [Dinobeemon] permanents is deleted (the carrier BT20-016
  # observes the deletion of a sibling permanent).
  #
  # G-EVENT-TARGET-OWNER (RESOLVED 2026-05-02): `on_any_deletion` fires globally
  # for every deletion; `event_target_owner: you` matches when the deleted
  # permanent belonged to the carrier's controller, and `event_target_kind:
  # digimon` plus the name `any_of` gate restricts to [Paildramon]/[Dinobeemon].
  # `event_target_name_contains` reads the deleted top-card snapshot. Same
  # `on_any_deletion` + `event_target_owner` substrate as BT21-026 / BT21-029.
  #
  # The body is identical to clause 2a (the optional DNA digivolve). A clause-2a
  # SELF deletion does NOT also fire this arm: `on_any_deletion` only scans live
  # permanents, so a just-deleted carrier never observes its own deletion here —
  # no double-fire.
  - when: on_any_deletion
    active_when: { all_turns: true }
    optional: true
    summary: "[All Turns] When another of your [Paildramon]/[Dinobeemon] would be deleted, 2 of your Digimon may DNA digivolve into Imperialdramon: Dragon Mode in hand"
    condition:
      all_of:
        - event_target_owner: you
        - event_target_kind: digimon
        - any_of:
            - event_target_name_contains: "Paildramon"
            - event_target_name_contains: "Dinobeemon"
    process:
      # Same `optional: true` select_hand decline path as clause 2a.
      - select_hand:
          of: you
          bind_as: dna_card
          optional: true
          filter:
            all_of:
              - kind: digimon
              - name_contains: "Imperialdramon: Dragon Mode"
          prompt: "Select Imperialdramon: Dragon Mode from hand to DNA digivolve into (or pass)"
      - select_dna_pair:
          left_filter:
            all_of:
              - kind: digimon
              - of: you
          right_filter:
            all_of:
              - kind: digimon
              - of: you
          bind_left_as: dna_src_a
          bind_right_as: dna_src_b
          prompt: "Select 2 of your Digimon to DNA digivolve into Imperialdramon: Dragon Mode"
      - effect_initiated_dna_digivolve:
          target_a: dna_src_a
          target_b: dna_src_b
          from_hand: dna_card
          cost: 0
          ignore_requirements: false

  # ─── Inherited: <Security A. +1> ─────────────────────────────────────────────
  #
  # Grants Security Attack +1 as a permanent inherited modifier.
  # DCGO BT20_016.cs lines 341-346: ChangeSelfSAttackStaticEffect(changeValue: 1,
  # isInheritedEffect: true).
  #
  # G-DECLARATIVE-KEYWORD (RESOLVED 2026-05-02): declarative grant_keyword
  # clauses now install at runtime; the inherited SecurityAttackPlus(1) modifier
  # is visible to game.has_keyword() via the digivolution-stack walk (same
  # ST1-07 / AD1-009 idiom).
  - scope: inherited
    kind: grant_keyword
    keyword: SecurityAttackPlus
    value: 1
    summary: "Inherited <Security A. +1>"
