card: BT20-016
name: Paildramon
kind: digimon
level: 5
color: [red, purple]
cost: 8
dp: 8000
traits: [Dragonkin]

# Standard digivolve: Lv4 Red / Cost 4
# DNA digivolve: Lv4 Red + Lv4 Purple / Cost 0
alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color: red }
    cost: 4

  - kind: dna_digivolve
    materials:
      - { level_eq: 4, color: red }
      - { level_eq: 4, color: purple }
    cost: 0

effects:
  # ─── Clause 1 ────────────────────────────────────────────────────────────────
  # [On Play][When Digivolving]
  # 1 of your Digimon gains <Piercing> and gets +4000 DP for the turn.
  # Then, this Digimon may attack.
  #
  # DCGO: OnEnterFieldAnyone timing with CanTriggerOnPlay / CanTriggerWhenDigivolving.
  # Mandatory selection (canNoSelect: false). Grants:
  #   - GainPierce (via GrantKeywordEffect with UntilEachTurnEnd expiry)
  #   - ChangeDigimonDP(4000, UntilEachTurnEnd)
  # Then SelectAttackEffect (canNoSelect: true — optional attack) on THIS Digimon.
  #
  # "Then, this Digimon may attack." — effect-created optional attack on the
  # source permanent. The DCGO fires SelectAttackEffect (canNoSelect: true)
  # within the coroutine; Rust routes that through may_attack_now.
  - when: [on_play, when_digivolving]
    summary: "1 of your Digimon gains Piercing and +4000 DP for the turn"
    condition:
      any_permanent:
        of: you
        zone: [battle_area]
        kind: digimon
    process:
      - select_own_permanent:
          bind_as: tgt
          filter: { kind: digimon }
          prompt: "Select 1 of your Digimon to gain Piercing and +4000 DP for the turn"
      - grant_keyword:
          target: tgt
          keyword: Piercing
          expiry: end_of_turn
      - add_dp_modifier:
          target: tgt
          value: 4000
          expiry: end_of_turn
      - may_attack_now:
          attacker: source
          targets: any
          optional: true

  # ─── Clause 2 ────────────────────────────────────────────────────────────────
  # [All Turns] When any of your [Paildramon] or [Dinobeemon] would be deleted,
  # 2 of your Digimon may DNA digivolve into [Imperialdramon: Dragon Mode] in the hand.
  #
  # This clause is a CROSS-PERMANENT deletion observer: the carrier (this Paildramon)
  # watches for the deletion of OWN Paildramon or Dinobeemon permanents.
  #
  # G-EVENT-TARGET-OWNER resolved: the `replacement_subject_is_mine` predicate now
  # exposes the deletion subject's controller, so the cross-permanent subject can
  # be filtered to "your [Paildramon]/[Dinobeemon]" without the carrier-only
  # `subject_matches` gate.
  #
  # Non-cancelling observer: this is a `kind: replacement` clause on the
  # would-leave trigger, but it deliberately omits `outcome: prevent` — the body
  # runs (the optional DNA digivolve) and the original deletion still commits.
  # This mirrors DCGO's `ActivateClass` (not a `WillBeDeletedClass`): the printed
  # text says "would be deleted", but deletion proceeds regardless of whether the
  # DNA digivolve is accepted. Same non-cancelling-observer idiom as BT20-091
  # Cool Boy (Royal Knights RK-G004).
  #
  # `optional: true` — printed "may DNA digivolve"; the player may decline.
  # Body: pick the Imperialdramon: Dragon Mode card in hand, pick 2 own Digimon
  # as DNA materials, then `effect_initiated_dna_digivolve`. The whole body is
  # wrapped in `- optional: [...]` so the player gets a single accept/decline
  # prompt up front (the AD1-009 / AD1-012 idiom).
  - kind: replacement
    trigger: when_would_leave_battle_area
    optional: true
    active_when:
      all_of:
        - all_turns: true
        - replacement_subject_is_mine: true
        - kind: digimon
        - any_of:
            - name_contains: "Paildramon"
            - name_contains: "Dinobeemon"
    summary: "[All Turns] When own [Paildramon]/[Dinobeemon] would be deleted, may DNA digivolve 2 own Digimon into [Imperialdramon: Dragon Mode] in hand; the deletion proceeds"
    process:
      - optional:
          # Step 1: pick the Imperialdramon: Dragon Mode card in hand.
          - select_hand:
              of: you
              bind_as: dna_card
              filter:
                all_of:
                  - kind: digimon
                  - name_contains: "Imperialdramon: Dragon Mode"
              prompt: "Select Imperialdramon: Dragon Mode from hand to DNA digivolve into"
          # Step 2: pick the 2 own Digimon as DNA materials.
          - select_dna_pair:
              left_filter:
                all_of:
                  - kind: digimon
                  - of: you
              right_filter:
                all_of:
                  - kind: digimon
                  - of: you
              bind_left_as: dna_src_a
              bind_right_as: dna_src_b
              prompt: "Select 2 of your Digimon to DNA digivolve into Imperialdramon: Dragon Mode"
          # Step 3: execute the DNA digivolve. Cost paid normally per dna_costs.
          - effect_initiated_dna_digivolve:
              target_a: dna_src_a
              target_b: dna_src_b
              from_hand: dna_card
              cost: 0
              ignore_requirements: false

  # ─── Inherited: <Security A. +1> ─────────────────────────────────────────────
  #
  # Grants Security Attack +1 as a permanent inherited modifier.
  # DCGO: ChangeSelfSAttackStaticEffect(changeValue: 1, isInheritedEffect: true).
  #
  # G-DECLARATIVE-KEYWORD: inherited `kind: grant_keyword` declarative clauses
  # DO materialize at runtime — `Game::tick_declarative_effects` collects
  # buried digivolution sources (with `inherited_source = true`) and runs their
  # inherited declarative effects, calling `grant_declarative_keyword` on the
  # carrier. `Game::security_attack_keyword_bonus` then folds in the granted
  # `SecurityAttackPlus` keyword from the modifier registry. Verified by
  # `bt20_016_inherited_security_attack_plus_grants_modifier_at_runtime`.
  - kind: grant_keyword
    scope: inherited
    keyword: SecurityAttackPlus
    value: 1
