card: BT20-091
name: "Cool Boy"
kind: tamer
color: [white]
cost: 4
traits: [LIBERATOR]

effects:
  - when: [on_enter_field_anyone, on_digivolve]
    active_when: { your_turn: true }
    optional: true
    summary: "[Your Turn] When your Royal Knight is played or digivolves, suspend self to Draw 1 and gain 1 memory"
    condition:
      all_of:
        - event_target_owner: you
        - event_target_trait_has: "Royal Knight"
        - any_permanent:
            of: you
            zone: [battle_area]
            card_number_is: "BT20-091"
            is_unsuspended: true
    process:
      - suspend: { target: source }
      - draw: { of: you, count: 1 }
      - gain_memory: 1

  # [Opponent's Turn] [Once Per Turn] When any of your Digimon with the
  # [Royal Knight] trait would leave the battle area, you may play 1
  # [Omekamon] from your hand without paying the cost.
  #
  # DCGO subscribes at WhenRemoveField but does not clear willBeRemoveField;
  # this is a non-cancelling would-leave subscriber. In the Rust replacement
  # layer the accepted body deliberately leaves the replacement outcome as
  # Proceed/None, so the original leave event commits after the hand-play
  # selection resolves.
  - kind: replacement
    trigger: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    active_when:
      all_of:
        - opponents_turn: true
        - replacement_subject_is_mine: true
        - kind: digimon
        - trait_has: "Royal Knight"
    summary: "[Opponent's Turn][OPT] When own Royal Knight would leave, may play 1 [Omekamon] from hand; the leave proceeds"
    process:
      - select_hand:
          of: you
          bind_as: omekamon_pick
          optional: false
          filter:
            name_is: "Omekamon"
          prompt: "Play 1 [Omekamon] from hand"
      - play_from_hand_free:
          of: you
          hand_index: omekamon_pick

  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
