card: P-136
name: Arisa Kinosaki
kind: tamer
color: [yellow]
cost: 4
traits: [LIBERATOR]

# Printed text:
# [On Play] You may play 1 [Shoemon] from your hand without paying the cost.
#
# [Your Turn] [Once Per Turn] When one of your Digimon digivolves into a
# Digimon with the [Puppet] trait, by suspending this Tamer, gain 1 memory.
#
# Security Effect [Security] Play this card without paying the cost.
#
# Supported faithfully here:
# - Optional [On Play] exact-name [Shoemon] hand play without paying cost.
# - [Your Turn][OPT] Puppet-digivolve observer with source-bound suspend-cost
#   via Track B's `activation_cost: { suspend_self: true }`. The trigger is
#   mandatory once a same-controller Digimon digivolves into a Puppet on your
#   turn — if Arisa is unsuspended the engine pays the cost and grants +1
#   memory; if already suspended the cost-failure silently skips the body and
#   consumes the once_per_turn slot (per Working Rule 17). Since multi-Arisa
#   sources still resolve as a TriggerOrder bundle, the source-bound preflight
#   from Track B's substrate naturally surfaces only Arisas that can pay.
# - [Security] play this Tamer without paying cost.

effects:
  - when: on_play
    optional: true
    summary: "[On Play] You may play 1 Shoemon from hand for free"
    process:
      - select_hand:
          of: you
          bind_as: shoemon
          optional: true
          filter:
            all_of:
              - kind: digimon
              - name_is: Shoemon
          prompt: "Play 1 [Shoemon] from your hand without paying the cost"
      - play_from_hand_free: { of: you, hand_index: shoemon }

  - when: on_digivolve
    active_when: { your_turn: true }
    condition:
      all_of:
        - event_target_owner: you
        - event_target_trait_has: Puppet
    summary: "[Your Turn][OPT] On your Digimon digivolving into Puppet, suspend this Tamer -> +1 memory"
    process:
      - activation_cost: { suspend_self: true }
      - gain_memory: 1

  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
