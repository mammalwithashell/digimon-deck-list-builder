card: P-165
name: ShoeShoemon
kind: digimon
level: 4
color: [yellow]
cost: 4
dp: 4000
traits: [Puppet, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 2

effects:
  - text: "[Security] At the end of the battle, play this card without paying the cost."
    when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}

  - text: "[On Play] [When Digivolving] Play 1 [Familiar] Token. (Digimon/Yellow/3000 DP/\""
    when: [on_play, when_digivolving]
    summary: "Play 1 Familiar Token; at end of opponent's turn delete that token"
    process:
      - play_token:
          controller: you
          token_name: familiar
          bind_as: tok
      - schedule_delete_played_at_turn_end:
          binding: tok
          at: opponents_turn

  - text: "＜Barrier＞ (When this Digimon would be deleted in battle, by trashing your top security card, it isn't deleted.)"
    scope: inherited
    kind: grant_keyword
    keyword: Barrier
