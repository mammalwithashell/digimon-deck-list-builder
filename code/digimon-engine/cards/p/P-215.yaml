card: P-215
name: Icemon
kind: digimon
level: 4
color: [blue, black]
cost: 5
dp: 6000
traits: [Ice-Snow]
attribute: Data
alt_paths:
  # Printed standard evo box: Lv.3 from blue/black, cost 3 (the digivolve circle;
  # encoded explicitly like the Ice-Snow siblings so DSL-only loads carry the printed
  # cost table — cards.json evo_costs are not loaded on the DSL path).
  - kind: digivolve
    from: { level_eq: 3, color_is: blue }
    cost: 3
  - kind: digivolve
    from: { level_eq: 3, color_is: black }
    cost: 3
  # Printed alt evo box: "[Digivolve] Lv.3 w/[Ice-Snow]/[Mineral]/[Rock] trait: Cost 2".
  # TRAIT-gated (one alt_path per trait; same cost 2 so they dedup to one route) — NOT
  # colour-gated. The cheaper route requires the BASE to carry one of the three traits,
  # so a blue Lv.3 base that ALSO has the trait gets the {3,2} cost choice, while a
  # blue/black Lv.3 base WITHOUT the trait gets only the standard cost 3 (no longer the
  # over-permissive colour-gated cost 2).
  - kind: digivolve
    from: { level_eq: 3, trait_has: Ice-Snow }
    cost: 2
  - kind: digivolve
    from: { level_eq: 3, trait_has: Mineral }
    cost: 2
  - kind: digivolve
    from: { level_eq: 3, trait_has: Rock }
    cost: 2

# ─── Clause 0: [When Moving][On Play][When Digivolving] source-placement +
#              return/de-digivolve protection ────────────────────────────────
#
# Printed text:
#   [When Moving] [On Play] [When Digivolving] By placing 1 level 4 or lower
#   [Ice-Snow], [Mineral] or [Rock] trait card from your hand or trash as this
#   Digimon's bottom digivolution card, until your opponent's turn ends, their
#   effects can't return 1 of your [Ice-Snow], [Mineral] or [Rock] trait
#   Digimon to hands or decks or affect it with <De-Digivolve> effects.
#
# ─── Clause layout ───────────────────────────────────────────────────────────
#
# Step 0: select_union_zone (hand ∪ trash, own, level ≤ 4, Ice-Snow/Mineral/Rock)
#         → bind_as: cost_card   [cost: place it as bottom source of self]
# Step 1: place_as_bottom_source { source: cost_card, target: source }
#         (source = ctx.source_permanent = this Icemon permanent)
# Step 2: select_own_permanent (battle_area, Ice-Snow/Mineral/Rock Digimon)
#         → bind_as: protect_target
# Step 3: add_modifier CannotBeReturnedToHand  (expiry: end_of_opponents_turn)
# Step 4: add_modifier CannotBeReturnedToDeck  (expiry: end_of_opponents_turn)
# Step 5: add_modifier CannotBeDeDigivolved    (expiry: end_of_opponents_turn)
#
# ─── Implementation status ───────────────────────────────────────────────────
#
# | Card-text element                                              | Status        |
# |----------------------------------------------------------------|---------------|
# | [When Moving]/[On Play]/[When Digivolving] multi-timing        | IMPLEMENTED   |
# | Cost: place level≤4 Ice-Snow/Mineral/Rock from hand or trash   | IMPLEMENTED   |
# |   as this Digimon's bottom digivolution card                   |               |
# | Effect: select 1 own Ice-Snow/Mineral/Rock Digimon             | IMPLEMENTED   |
# | Grant CannotBeReturnedToHand until EoOT                        | IMPLEMENTED   |
# | Grant CannotBeReturnedToDeck until EoOT                        | IMPLEMENTED   |
# | Grant CannotBeDeDigivolved until EoOT                          | IMPLEMENTED   |
# | Inherited <Blocker>                                            | IMPLEMENTED   |

effects:
  # ─── Clause 0: [When Moving][On Play][When Digivolving] ──────────────────
  #
  # "By placing..." models a cost-gated optional effect.
  # The player picks a level-≤4 Ice-Snow/Mineral/Rock card from hand ∪ trash
  # and places it as Icemon's bottom digivolution source. If the player cannot
  # or will not pay this cost (no eligible card, or declines), nothing happens.
  # After paying the cost, select 1 own Ice-Snow/Mineral/Rock Digimon and
  # grant it return immunity + De-Digivolve immunity until end of opponent's turn.
  - when: [on_play, when_digivolving, on_move]
    optional: true
    summary: "[When Moving][On Play][When Digivolving] Place level≤4 Ice-Snow/Mineral/Rock from hand or trash as bottom digi-source; protect 1 Ice-Snow/Mineral/Rock Digimon until EoOT"
    process:
      # Step 0: Cost — pick a level 4 or lower Ice-Snow / Mineral / Rock card
      # from own hand or trash to place as this Digimon's bottom digi-source.
      # optional: true so the player may decline when no eligible card exists.
      - select_union_zone:
          of: you
          zones: [hand, trash]
          bind_as: cost_card
          optional: true
          filter:
            all_of:
              - level_lte: 4
              - any_of:
                  - trait_has: Ice-Snow
                  - trait_has: Mineral
                  - trait_has: Rock
          prompt: "Place 1 level 4 or lower [Ice-Snow], [Mineral] or [Rock] card from your hand or trash as this Digimon's bottom digivolution card"

      # Steps 1–5: Only run when the cost was actually paid (cost_card bound).
      # When the union-zone step short-circuits (no eligible card) or the player
      # declines, cost_card is absent from bindings and the if-block is skipped
      # entirely — no card is placed, no protection is granted.
      - if:
          condition: { binding_exists: cost_card }
          then:
            # Step 1: Place the selected card as this Digimon's bottom digi-source.
            # `target: source` resolves to ctx.source_permanent (this Icemon).
            - place_as_bottom_source:
                source: cost_card
                target: source

            # Step 2: Select 1 of your [Ice-Snow], [Mineral] or [Rock] Digimon
            # to receive the protection.
            - select_own_permanent:
                bind_as: protect_target
                filter:
                  all_of:
                    - kind: digimon
                    - any_of:
                        - trait_has: Ice-Snow
                        - trait_has: Mineral
                        - trait_has: Rock
                prompt: "Choose 1 of your [Ice-Snow], [Mineral] or [Rock] Digimon to protect until your opponent's turn ends"

            # Steps 3–5: Grant return immunity and De-Digivolve immunity until EoOT.
            - add_modifier:
                target: protect_target
                modifier: CannotBeReturnedToHand
                value: 1
                expiry: end_of_opponents_turn

            - add_modifier:
                target: protect_target
                modifier: CannotBeReturnedToDeck
                value: 1
                expiry: end_of_opponents_turn

            - add_modifier:
                target: protect_target
                modifier: CannotBeDeDigivolved
                value: 1
                expiry: end_of_opponents_turn

  # ─── Inherited: <Blocker> ─────────────────────────────────────────────────
  - scope: inherited
    kind: grant_keyword
    keyword: Blocker
    summary: "Inherited <Blocker>"
