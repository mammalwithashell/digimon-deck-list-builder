  # CanSelectPermanentCondition gates on:
  #   IsPermanentExistsOnOpponentBattleAreaDigimon(permanent, card)
  #   && permanent.DP <= card.PermanentOfThisCard().DP
  # SelectPermanentEffect with maxCount: 1, canNoSelect: false, mode: Destroy.
  #
  # BLOCKED: G-FORMULA-SOURCE-DP — see header docs. Mirrors BT17-102 Clause 1's
  # delete sub-clause exactly. Omitted from this clause body until the gap
  # closes; including a `kind: digimon` delete without the DP filter would
  # over-target opponents with arbitrary DP, violating no-approximations.
  #
  # Stub (commented — uncomment when G-FORMULA-SOURCE-DP closes):
  #
  # - when: when_digivolving
  #   summary: "[When Digivolving] Delete 1 opp Digimon with DP ≤ this Digimon"
  #   condition:
  #     any_permanent:
