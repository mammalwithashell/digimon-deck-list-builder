  # ─── Clause 4 — [All Turns] +1000 DP per distinct color  [BLOCKED] ──────────
  #
  # Printed text:
  #   "[All Turns] This Digimon gets +1000 DP for each color Digimon and Tamers
  #    have."
  #
  # DCGO P_182.cs lines 147-181: ChangeSelfDPStaticEffect(changeValue: count, ...)
  # at EffectTiming.None, where count() is a live closure evaluating
