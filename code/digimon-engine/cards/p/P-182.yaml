  # battle-area Digimon + Tamers.
  #
  # BLOCKED: G-DSL-DISTINCT-COLORS-BOTH-PLAYERS-FORMULA — see header docs.
  # `kind: aura` + `dp_modifier_fn` (Group 6 RESOLVED) provides the dynamic
  # continuous DP shell, but the `PerSelector` enum has no `distinct_colors_count`
  # variant over a zone+filter+player. Omitted entirely rather than represented
