card: P-229
name: "Unique Emblem: Narrative Ronde"
kind: option
color: [yellow]
cost: 2
traits: [LIBERATOR]

# Printed text:
# [Main] Reveal the top 3 cards of your deck. Add 1 [Puppet] trait Digimon card
# and 1 [LIBERATOR] trait card among them to the hand. Return the rest to the
# bottom of the deck. Then, place this card in the battle area.
#
# [Your Turn] When any of your [Mirai Kinosaki]s are played, <Delay> (By
# trashing this card after the placing turn, activate the effect below.)
# ・1 of your Digimon may digivolve into a level 6 or lower [LIBERATOR] trait
#   card in the hand with the digivolution cost reduced by 3.
#
# Security Effect [Security] Activate this card's [Main] effects.
#
# Fully implemented (no omitted slices) — PUPPETS-G004 closed 2026-05-21:
# - The top-3 dual-bucket reveal search, using no_duplicate_cards so one revealed
#   Puppet+LIBERATOR card cannot satisfy both printed additions.
# - "Then, place this card in the battle area": P-229 carries a `kind: delay`
#   clause, so the Option pipeline classifies it as a Delay Option and places it
#   in the battle area automatically once the [Main] body resolves (same shape
#   as BT22-098 / LM-054).
# - [Your Turn] event-gated <Delay>: when any of your [Mirai Kinosaki] are
#   played after the placing turn, the Delay activates — trashing P-229 as the
#   activation cost — and exposes the optional digivolve.
#   `trigger: on_ally_played` now lowers to `DelayTrigger::OnEvent(OnAllyPlayed)`
#   (`lower_delay.rs`), and the `OnAllyPlayed` / `EnteredField` dispatch now
#   fans out to `enqueue_event_gated_delayed_options` (`effect_queue.rs`).
# - The placed delayed Option parks indefinitely (`OnEvent(_)` →
#   `compute_delay_trash_turn` = u16::MAX) until a [Mirai Kinosaki] is played.
# - The security effect mirrors the supported [Main] search body, then places
#   this card in the battle area via `place_self_as_delay_option` (the security
#   pipeline does not auto-place, so the placement tail is authored explicitly).

effects:
  - when: main_from_hand
    optional: false
    summary: "[Main] Reveal top 3; add 1 Puppet Digimon and 1 LIBERATOR; bottom the rest; pipeline then places self in battle area"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          no_duplicate_cards: true
          buckets:
            - bind_as: puppet_pick
              min: 1
              max: 1
              filter:
                all_of:
                  - kind: digimon
                  - trait_has: Puppet
            - bind_as: liberator_pick
              min: 1
              max: 1
              filter: { trait_has: LIBERATOR }
          prompt: "Select 1 [Puppet] Digimon and 1 [LIBERATOR] card"
      - add_to_hand_from_reveal: { of: you, card: puppet_pick }
      - add_to_hand_from_reveal: { of: you, card: liberator_pick }
      - place_remainder_on_deck: { of: you, position: bottom }

  - scope: inherited
    when: on_security
    optional: false
    summary: "[Security] Activate [Main] search effects, then place self in battle area"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          no_duplicate_cards: true
          buckets:
            - bind_as: puppet_pick
              min: 1
              max: 1
              filter:
                all_of:
                  - kind: digimon
                  - trait_has: Puppet
            - bind_as: liberator_pick
              min: 1
              max: 1
              filter: { trait_has: LIBERATOR }
          prompt: "Select 1 [Puppet] Digimon and 1 [LIBERATOR] card"
      - add_to_hand_from_reveal: { of: you, card: puppet_pick }
      - add_to_hand_from_reveal: { of: you, card: liberator_pick }
      - place_remainder_on_deck: { of: you, position: bottom }
      - place_self_as_delay_option: {}

  # [Your Turn] event-gated <Delay> — activates when any of your [Mirai
  # Kinosaki] are played after the placing turn. `your_turn` enforces the
  # [Your Turn] tag; `event_target_owner: you` + `event_card_name_contains`
  # gate on the played card being one of YOUR Mirai Kinosaki. The placed Option
  # is trashed as the <Delay> activation cost; the digivolve body is the
  # printed optional "may".
  - kind: delay
    trigger: on_ally_played
    active_when:
      your_turn: true
      event_target_owner: you
      event_card_name_contains: "Mirai Kinosaki"
    summary: "[Your Turn] When your Mirai Kinosaki is played, Delay: 1 of your Digimon may digivolve into a level <=6 LIBERATOR card in hand, cost -3"
    process:
      - select_own_permanent:
          bind_as: target
          optional: true
          filter:
            all_of:
              - kind: digimon
              - zone: [battle_area]
          prompt: "Choose 1 of your Digimon to digivolve"
      - select_hand:
          of: you
          bind_as: evo
          optional: false
          filter:
            all_of:
              - kind: digimon
              - trait_has: LIBERATOR
              - level_lte: 6
          prompt: "Choose a level 6 or lower [LIBERATOR] card to digivolve into"
      - effect_initiated_digivolve:
          target: target
          from_hand: evo
          cost: { reduce: 3 }
          ignore_requirements: false
