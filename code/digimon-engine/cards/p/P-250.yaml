# P-250 Ogremon (X Antibody) — Digimon, Lv.4, Purple/Black, DP 7000, Cost 6.
# Traits: Demon, X Antibody. Form: Champion. Attribute: Virus.
# Printed digivolve box: Purple Lv.3 / cost 3; Black Lv.3 / cost 3;
#   [Digivolve] [Ogremon]/[Fugamon]/[Hyogamon]: Cost 1.
#
# Printed card text (official Bandai DB — data/card_bundles/P-250.md; no local
# card image — the card was ingested 2026-10-21 for the EX13 meta run):
#   {Trash} [End of Your Turn] If your hand has 5 or fewer cards, 1 of your
#     [Demon] trait Digimon may digivolve into this card.
#   [On Play] [When Digivolving] [When Attacking] [Once Per Turn] By trashing 1
#     card in your hand, 1 of your [Demon], [Shaman] or [Undead] trait Digimon
#     gains <Blocker> and <Retaliation> until your opponent's turn ends.
#   Inherited: [On Deletion] Delete 1 of your opponent's Digimon with a play
#     cost of 6 or less.
#   Official Q&A: a {Trash} effect can be triggered and activated only while
#     its card is in the trash.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/P/Purple/P_250.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
# Alt-digivolve: TopCard.EqualsCardName Ogremon || Fugamon || Hyogamon, cost 1
#   (no level gate). The two colour circles are authored as alt-paths too —
#   DSL fixtures read evo costs from alt-paths, and cards.json carries only one
#   circle from the API (data/card_overrides.json restores the Black one).
# {Trash}[End of Your Turn] (OnEndTurn; CanUse: IsOwnerTurn &&
#   IsExistOnTrashTrigger; CanActivate: IsExistOnTrashActivate && hand <= 5;
#   optional false, canNoSelect true): pick 1 own Digimon whose TopCard has
#   [Demon] and that this card can digivolve onto (CanPlayCardTargetFrame) →
#   DigivolveIntoHandOrTrashCard(isHand false, payCost true, no reduction).
#   → `scope: trash` + `when: end_of_your_turn` (engine scans the ending
#   player's trash for trash-scoped end-of-turn clauses —
#   G-ENGINE-TRASH-ZONE-END-OF-YOUR-TURN) + condition hand <= 5; optional
#   own-permanent pick filtered by `has_digivolve_candidate` over a P-250 in
#   the trash (every copy has the same digivolve routes, and this copy IS in
#   the trash while the clause runs) → `effect_initiated_digivolve { source:
#   self, cost: printed }` (normal requirements, normal cost).
# Shared OP / WD / WA (ActivateClassesForSharedEffects, hash "P_250_OP_WD_WA",
#   maxCountPerTurn 1, optional false, no additional activate condition):
#   SelectHand Discard 1 canNoSelect:true; if discarded, a mandatory pick of 1
#   own Digimon whose TopCard has [Demon]/[Shaman]/[Undead] → GainBlocker +
#   GainRetaliation UntilOpponentTurnEnd.
#   → ONE clause `when: [on_play, when_digivolving, when_attacking]` +
#   once_per_turn (one shared counter); select_hand optional cost:true +
#   trash; select_own_permanent; two grants expiring at the end of the
#   opponent's turn. DCGO never calls RemoveUse, so DECLINING the cost still
#   spends the once-per-turn (the activation happened; owner ruling #20's
#   "use spent on activation" reading). An EMPTY hand is different: CR 4.3
#   §15-7-4 / §15-8-4-4-1 — an unpayable optional condition can't be chosen
#   and the effect isn't activated, so the once-per-turn is kept. DCGO P-250
#   has no `hand >= 1` activate condition (DCGO offers the cost pick and
#   spends the use — dcgo_quirk; the PDF governs), so the gate is authored
#   here as `condition: count_gte hand 1`, the BT24-026 idiom.
# Inherited [On Deletion] (not optional): if an opponent Digimon with
#   TopCard.HasPlayCost && GetCostItself <= 6 exists, a mandatory pick → delete.

card: P-250
name: Ogremon (X Antibody)
kind: digimon
level: 4
color: [purple, black]
cost: 6
dp: 7000
traits: [Demon, X Antibody]
form: Champion
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: purple }
    cost: 3
  - kind: digivolve
    from: { level_eq: 3, color_is: black }
    cost: 3
  - kind: digivolve
    from:
      any_of:
        - name_is: "Ogremon"
        - name_is: "Fugamon"
        - name_is: "Hyogamon"
    cost: 1

effects:
  # ─── {Trash}[End of Your Turn] hand <= 5 → 1 of your [Demon] Digimon may
  #     digivolve into this card ─────────────────────────────────────────────
  - scope: trash
    when: end_of_your_turn
    condition:
      count_lte:
        filter: { of: you, zone: [hand] }
        n: 5
    summary: "{Trash} [End of Your Turn] If your hand has 5 or fewer cards, 1 of your [Demon] trait Digimon may digivolve into this card"
    process:
      - select_own_permanent:
          bind_as: demon
          optional: true
          filter:
            all_of:
              - kind: digimon
              - trait_has: Demon
              - has_digivolve_candidate:
                  of: you
                  zone: [trash]
                  filter: { card_number_is: "P-250" }
          prompt: "1 of your [Demon] trait Digimon may digivolve into this card"
      - if:
          condition: { binding_present: demon }
          then:
            - effect_initiated_digivolve:
                target: demon
                source: self
                cost: printed

  # ─── [On Play][When Digivolving][When Attacking][OPT] by trashing 1 hand
  #     card, 1 [Demon]/[Shaman]/[Undead] Digimon gains <Blocker> and
  #     <Retaliation> until your opponent's turn ends ─────────────────────────
  - when: [on_play, when_digivolving, when_attacking]
    once_per_turn: true
    # §15-7-4: an unpayable "by trashing 1 card in your hand" is not offered and
    # the once-per-turn is not spent (dcgo_quirk: DCGO offers it anyway).
    condition:
      count_gte:
        filter: { of: you, zone: [hand] }
        n: 1
    summary: "[On Play][When Digivolving][When Attacking][Once Per Turn] By trashing 1 card in your hand, 1 of your [Demon], [Shaman] or [Undead] trait Digimon gains <Blocker> and <Retaliation> until your opponent's turn ends"
    process:
      - select_hand:
          of: you
          bind_as: cost_card
          optional: true
          cost: true
          filter: {}
          prompt: "Trash 1 card in your hand: 1 of your [Demon]/[Shaman]/[Undead] Digimon gains <Blocker> and <Retaliation>"
      - trash_from_hand_by_index: { of: you, hand_index: cost_card }
      - select_own_permanent:
          bind_as: buff
          filter:
            all_of:
              - kind: digimon
              - any_of:
                  - trait_has: Demon
                  - trait_has: Shaman
                  - trait_has: Undead
          prompt: "1 of your [Demon]/[Shaman]/[Undead] Digimon gains <Blocker> and <Retaliation> until your opponent's turn ends"
      - grant_keyword:
          target: buff
          keyword: Blocker
          expiry: end_of_opponents_turn
      - grant_keyword:
          target: buff
          keyword: Retaliation
          expiry: end_of_opponents_turn

  # ─── Inherited [On Deletion] delete 1 opponent Digimon with play cost <= 6 ─
  - scope: inherited
    when: on_deletion
    summary: "[Inherited][On Deletion] Delete 1 of your opponent's Digimon with a play cost of 6 or less"
    process:
      - select_opponent_permanent:
          bind_as: victim
          filter:
            all_of:
              - kind: digimon
              - play_cost_lte: 6
          prompt: "Delete 1 of your opponent's Digimon with a play cost of 6 or less"
      - delete_permanent: { target: victim }
