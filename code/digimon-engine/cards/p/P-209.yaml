# P-209 Titamon — Digimon, Lv.6, Purple/Green, DP 11000, Cost 11.
# Traits: Shaman, Titan, TS + (Rule) Trait: Has [Demon] Type → Demon.
# Form: Mega. Attribute: Virus.
# Printed digivolve boxes: Purple Lv.5 / cost 3, Green Lv.5 / cost 3
#   (cards.json + card_overrides.json evo_costs); [Digivolve] Lv.5 w/[Demon]/
#   [TS] trait: Cost 3.
#
# Printed card text (official Bandai DB — data/card_bundles/P-209.md):
#   <Alliance>
#   [On Play] [When Digivolving] By trashing 1 card in your hand, suspend 1 of
#     your opponent's Digimon or Tamers. Then, 1 of their Digimon or Tamers
#     can't unsuspend until their turn ends.
#   [All Turns] [Once Per Turn] When your hand is trashed from, you may play 1
#     level 4 or lower [Demon] or [Titan] trait card from your trash without
#     paying the cost.
#   (Rule) Trait: Has [Demon] Type.
#
# Official Q&A: if you don't perform the "by" processing (trash 1 hand card),
#   the rest of the effect doesn't activate → `cost: true`.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/P/Purple/P_209.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
# Alt-digivolve: IsLevel5 && (EqualsTraits Demon || HasTSTraits), cost 3 →
#   alt_paths level_eq 5 + any_of(trait_has Demon, trait_has TS).
# Alliance: AllianceSelfEffect → `kind: grant_keyword, keyword: Alliance`.
# [OP] and [WD] (two ActivateClasses sharing one coroutine, optional false,
#   no per-turn cap): SelectHand Discard (canNoSelect:true). If discarded →
#   MANDATORY (canNoSelect:false) Tap pick of 1 opp Digimon/Tamer; then
#   MANDATORY pick of 1 opp Digimon/Tamer → GainCanNotUnsuspend(Until
#   OpponentTurnEnd).
#   → condition hand >= 1; select_hand optional cost:true + trash;
#   select_opponent_permanent (digimon|tamer) → suspend;
#   select_opponent_permanent (digimon|tamer) → add_modifier CannotUnsuspend
#   expiry end_of_opponents_turn.
# [All Turns][OPT] (OnDiscardHand, maxCount 1, optional:true,
#   CanTriggerOnTrashHand(owner == card.Owner)): optional trash pick (canNo
#   Select:true) of IsDigimon && Level <= 4 && (Demon || Titan) → Play
#   without paying the cost (activateETB).
#   → on_discard_hand + active_when all_turns + event_discard_player you;
#   once_per_turn; optional (the printed "you may" is the outer yes/no, as
#   DCGO's optional ActivateClass); select_trash kind digimon level_lte 4
#   (Demon|Titan) → play_from_trash_free. "level 4 or lower ... card" can
#   only be a leveled card; DCGO's IsDigimon restriction is the same set in
#   practice (Digi-Eggs cannot be played from trash).

card: P-209
name: Titamon
kind: digimon
level: 6
color: [purple, green]
cost: 11
dp: 11000
traits: [Shaman, Titan, TS, Demon]
form: Mega
attribute: Virus

alt_paths:
  - kind: digivolve
    from:
      all_of:
        - level_eq: 5
        - any_of:
            - trait_has: Demon
            - trait_has: TS
    cost: 3

effects:
  - kind: grant_keyword
    keyword: Alliance
    summary: "<Alliance>"

  # ─── [On Play][When Digivolving] by trashing 1 hand card, suspend 1 opp
  #     Digimon/Tamer; then 1 opp Digimon/Tamer can't unsuspend ───────────
  - when: [on_play, when_digivolving]
    condition:
      count_gte:
        filter: { of: you, zone: [hand] }
        n: 1
    summary: "[On Play][When Digivolving] By trashing 1 card in your hand, suspend 1 of your opponent's Digimon or Tamers. Then, 1 of their Digimon or Tamers can't unsuspend until their turn ends"
    process:
      - select_hand:
          of: you
          bind_as: cost_card
          optional: true
          cost: true
          filter: {}
          prompt: "Trash 1 card in your hand to suspend 1 of your opponent's Digimon or Tamers"
      - trash_from_hand_by_index: { of: you, hand_index: cost_card }
      - select_opponent_permanent:
          bind_as: suspend_target
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          prompt: "Suspend 1 of your opponent's Digimon or Tamers"
      - suspend: { target: suspend_target }
      - select_opponent_permanent:
          bind_as: lock_target
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          prompt: "1 of your opponent's Digimon or Tamers can't unsuspend until their turn ends"
      - add_modifier:
          target: lock_target
          modifier: CannotUnsuspend
          value: 1
          expiry: end_of_opponents_turn

  # ─── [All Turns][OPT] your hand is trashed from → you may play 1 level 4
  #     or lower [Demon]/[Titan] card from trash free ────────────────────────
  - when: on_discard_hand
    once_per_turn: true
    optional: true
    active_when:
      all_of:
        - all_turns: true
        - event_discard_player: you
    summary: "[All Turns][Once Per Turn] When your hand is trashed from, you may play 1 level 4 or lower [Demon] or [Titan] trait card from your trash without paying the cost"
    process:
      - select_trash:
          of: you
          bind_as: revive
          filter:
            all_of:
              - kind: digimon
              - level_lte: 4
              - any_of:
                  - trait_has: Demon
                  - trait_has: Titan
          prompt: "Play 1 level 4 or lower [Demon] or [Titan] trait card from your trash without paying the cost"
      - play_from_trash_free: { of: you, hand_index: revive }
