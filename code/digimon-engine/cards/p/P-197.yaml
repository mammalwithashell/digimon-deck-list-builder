card: P-197
name: Patamon
kind: digimon
level: 3
color: [yellow]
cost: 3
dp: 1000
traits: [Mammal, TS]
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: yellow }
    cost: 0
  - kind: digivolve
    from:
      all_of:
        - level_eq: 2
        - trait_has: TS
    cost: 0

effects:
  - when: start_of_your_main_phase
    optional: true
    condition: { memory_lte: 4 }
    summary: "[Start of Your Main Phase] If memory <=4, may digivolve this Digimon into [Angel]/[TS] in hand without paying cost"
    process:
      - select_hand:
          of: you
          bind_as: evo
          optional: true
          filter:
            all_of:
              - kind: digimon
              - can_digivolve_from_source: true
              - any_of:
                  - trait_has: Angel
                  - trait_has: TS
          prompt: "You may digivolve into an [Angel] or [TS] Digimon card in your hand"
      - effect_initiated_digivolve:
          target: source
          from_hand: evo
          cost: 0
          ignore_requirements: false

  - scope: inherited
    when: when_attacking
    once_per_turn: true
    summary: "[When Attacking][Once Per Turn] 1 opponent Digimon gets -2000 DP for the turn"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon to get -2000 DP"
      - add_dp_modifier:
          target: target
          value: -2000
          expiry: end_of_turn
