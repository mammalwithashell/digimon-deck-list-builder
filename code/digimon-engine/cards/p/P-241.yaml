# P-241 Yujin Ozora — Tamer, Green, Cost 4.
# Traits: App Driver / Appmon
#
# Printed card text (card image — authoritative):
#   [Start of Your Turn] If you have 2 or less memory, set it to 3.
#   [Your Turn] When any of your Digimon get linked, by suspending this Tamer,
#     1 of your Digimon with the [Appmon] trait gains <Vortex> (At the end of
#     your turn, this Digimon may attack an opponent's Digimon. With this
#     effect, it can attack the turn it was played.) and +3000 DP for the turn.
#     Then, 1 of your Digimon may app fuse into a Digimon card in the hand.
#   [Security] Play this card without paying the cost.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/P/Green/P_241.cs
# (base repo; earlier "ABSENT — promo with no DCGO file" note was stale — the
# file exists and was audited 2026-07-10).
#
# ─── DCGO crosscheck (per clause, vs P_241.cs) ───────────────────────────────
#
# Clause 1 — `[Start of Your Turn] if memory <= 2, set it to 3`:
#   P_241.cs OnStartTurn → `CardEffectFactory.SetMemoryTo3TamerEffect(card)`.
#   Maps to `when: start_of_your_turn` + `condition: { memory_lte: 2 }` + `set_memory: 3`.
#
# Clause 2 — `[Your Turn] When any of your Digimon get linked`:
#   P_241.cs WhenLinked ActivateClass:
#     CanUseCondition = on battle area + IsOwnerTurn + link HOST is owner's
#       battle-area Digimon → active_when.all_of: [your_turn: true,
#       event_target_owner: you]
#     CanActivateCondition = CanActivateSuspendCostEffect (Yujin unsuspended)
#       → condition: { source_is_unsuspended: true }
#     SetUpActivateClass(..., -1, true, ...) → optional: true; -1 = no
#       per-turn cap (no [Once Per Turn]; the suspend cost is the natural lock)
#     Body: SuspendPermanentsClass(self).Tap() → activation_cost: { suspend_self: true }
#   Buff pick — CanSelectBuffPermanentCondition = owner's battle-area Digimon
#     with trait "Appmon", canNoSelect: false (MANDATORY once cost paid; NOT
#     event_target — a free selection distinct from the linked host).
#     grant_keyword Vortex + add_dp_modifier +3000, DCGO EffectDuration
#     .UntilEachTurnEnd → expiry end_of_your_turn ([Your Turn]-gated, so the
#     current turn is always yours).
#   Guarded regions: DCGO wraps the buff pick in
#     `if (HasMatchConditionPermanent(...))` — with NO [Appmon] Digimon on the
#     field the buff is skipped but the app-fuse region STILL runs. The engine
#     matches: empty-candidate select_own_permanent → Continue (tail runs);
#     grant_keyword/add_dp_modifier skip on the unresolved `tgt` binding;
#     app_fuse still installs.
#   App-fuse rider — both DCGO selects (permanent, then hand card) are
#     canNoSelect: true (optional) → `app_fuse { from: hand, optional: true }`.
#
# Clause 3 — `[Security] Play this card without paying the cost`:
#   P_241.cs SecuritySkill → `CardEffectFactory.PlaySelfTamerSecurityEffect(card)`.
#   `when: on_security`, `play_from_security: {}`.
#
# ─── IMPLEMENTED (2026-06-13) ─────────────────────────────────────────────────
#
# The tail of Clause 2 — "Then, 1 of your Digimon may app fuse into a Digimon
# card in the hand." — now ships via the effect-initiated `app_fuse` step
# (`EffectContext::initiate_effect_app_fuse`, from: hand).

card: P-241
name: "Yujin Ozora"
kind: tamer
color: [green]
cost: 4
traits: ["App Driver", Appmon]

effects:
  # ─── Clause 1: [Start of Your Turn] if memory <= 2, set it to 3 ──────────────
  - when: start_of_your_turn
    summary: "[Start of Your Turn] If you have 2 or less memory, set it to 3"
    condition: { memory_lte: 2 }
    process:
      - set_memory: 3

  # ─── Clause 2: [Your Turn] When any of your Digimon get linked →
  #     suspend self, 1 Appmon Digimon gains <Vortex> + +3000 DP for the turn,
  #     then 1 of your Digimon may app fuse into a hand card.
  #
  # active_when.all_of:
  #   - your_turn: true            — [Your Turn] scope (P_241.cs IsOwnerTurn)
  #   - event_target_owner: you    — the link HOST must be our Digimon
  #                                  (P_241.cs LinkPermanentCondition)
  # optional: true — "by suspending this Tamer" is a declinable cost
  #   (P_241.cs SetUpActivateClass optional flag; -1 use cap = no OPT).
  # condition: { source_is_unsuspended: true } — Yujin must be unsuspended to pay
  #   (P_241.cs CanActivateSuspendCostEffect).
  # activation_cost: { suspend_self: true } — must be first body step.
  # select_own_permanent bind_as: tgt — choose 1 of our Digimon with [Appmon] trait.
  #   NOTE: this is NOT event_target (the linked host) — the printed text says
  #   "1 of your Digimon with the [Appmon] trait", which is a free selection.
  # grant_keyword Vortex to tgt, expiry end_of_your_turn.
  # add_dp_modifier +3000 to tgt, expiry end_of_your_turn.
  - when: on_any_link
    optional: true
    active_when:
      all_of:
        - your_turn: true
        - event_target_owner: you
    condition: { source_is_unsuspended: true }
    summary: "[Your Turn] When any of your Digimon get linked, suspend self → 1 [Appmon] Digimon gains <Vortex> and +3000 DP for the turn"
    process:
      - activation_cost: { suspend_self: true }
      - select_own_permanent:
          bind_as: tgt
          filter:
            all_of:
              - kind: digimon
              - trait_has: Appmon
          prompt: "Choose 1 of your Digimon with the [Appmon] trait to gain <Vortex> and +3000 DP"
      - grant_keyword:
          target: tgt
          keyword: Vortex
          expiry: end_of_your_turn
      - add_dp_modifier:
          target: tgt
          value: 3000
          expiry: end_of_your_turn
      # Then, 1 of your Digimon may app fuse into a Digimon card in the hand.
      - app_fuse: { from: hand, optional: true }

  # ─── Clause 3: [Security] play this card without paying the cost ──────────────
  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
