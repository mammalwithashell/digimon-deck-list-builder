# Official face and CR 16-42-3: Use Req. uses Digimon/Tamers, not Options.
card: P-238
name: Destruction Cannon
kind: option
color:
- purple
cost: 5
traits:
- CS
use_requirement:
  any_field_permanent:
    of: you
    trait_has: CS
    any_of:
    - kind: digimon
    - kind: tamer
effects:
- when: main_from_hand
  process:
  - &id001
    select_opponent_permanent:
      bind_as: victim
      filter:
        kind: digimon
        level_lte: 6
      prompt: Choose a Digimon
  - &id002
    delete_permanent:
      target: victim
  - place_self_as_delay_option: {}
- kind: delay
  trigger: on_ally_attack
  active_when:
    all_of:
    - your_turn: true
    - event_target_owner: you
    - event_target_trait_has: CS
  process:
  - *id001
  - *id002
- when: on_security
  process:
  - *id001
  - *id002
  - place_self_as_delay_option: {}
