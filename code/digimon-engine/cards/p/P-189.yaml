card: P-189
name: Dimetromon
kind: digimon
level: 4
color: [red]
cost: 6
dp: 6000
traits: [Reptile, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 3 }
    cost: 2

# Clause 1 — [Security] You may play 1 card with the [LIBERATOR] trait and a play
# cost of 4 or less from your hand or trash without paying the cost.
#
# DCGO: SecuritySkill timing → CanSelectCardCondition checks ContainsTraits("LIBERATOR")
# && !IsDigiEgg && HasPlayCost && GetCostItself <= 4. The DCGO UI presents a
# "From hand / From trash" pick when both zones have candidates, but that is a UI
# affordance over a single "pick 1 card from hand ∪ trash" choice — modelled
# directly by the DSL `select_union_zone` verb (one combined hand-or-trash pick).
#
# DSL modelling (matches ST19-08 ShoeShoemon — identical printed [Security] text):
#   - timing: on_security, optional: true ("You may")
#   - select_union_zone: zones [hand, trash], optional: true, filter
#     all_of [trait_has: LIBERATOR, play_cost_lte: 4]
#   - play_union_bound_free: plays the picked card free, origin-preserving
#     (the engine plays from whichever zone the card was selected from).
#
# G-PLAY-COST-LTE — RESOLVED 2026-05-01: `play_cost_lte` is parsed, compiled,
#   evaluated against `CardData::play_cost`, and wired into select_union_zone
#   valid-action filtering. The filter wires `trait_has: LIBERATOR` +
#   `play_cost_lte: 4` so only LIBERATOR cards costing 4 or less are legal
#   candidates at selection time.
#
# G-DECLARATIVE-KEYWORD — RESOLVED 2026-05-02 (Clause 2): EffectTiming::Declarative
#   is wired; declarative grant_keyword fires at runtime. The <Progress> grant
#   installs at runtime and is discovered by Game::has_keyword.
#
# Clause 3 inherited triggered: G-INHERITED-DISPATCH (closed 2026-05-17, Phase 2
#   Track D) and G-OPT-TRIGGERED (closed) — inherited triggered effects are
#   dispatched from the digivolution stack and OPT is enforced in the queue drain.

effects:
  # Clause 1 — [Security] optional play from hand or trash (LIBERATOR, cost ≤ 4)
  # "You may" → optional: true. The select_union_zone surfaces hand ∪ trash as a
  # single pick; play_union_bound_free plays the picked card free, preserving the
  # zone it was selected from.
  - when: on_security
    optional: true
    summary: "[Security] You may play 1 LIBERATOR (cost ≤ 4) from hand or trash free"
    process:
      - select_union_zone:
          of: you
          zones: [hand, trash]
          filter:
            # "1 card with the [LIBERATOR] trait and a play cost of 4 or less":
            # trait_has: LIBERATOR + play_cost_lte: 4 (G-PLAY-COST-LTE closed).
            all_of:
              - trait_has: LIBERATOR
              - play_cost_lte: 4
          bind_as: picked
          optional: true
          prompt: "You may play 1 [LIBERATOR] card (cost ≤ 4) from your hand or trash without paying the cost"
      - play_union_bound_free:
          binding: picked

  # Clause 2 — <Progress> (declarative keyword grant, face-up)
  # DCGO: ProgressSelfStaticEffect(false, card, null) — isInheritedEffect=false
  # G-DECLARATIVE-KEYWORD closed: installs at runtime; Game::has_keyword discovers it.
  - kind: grant_keyword
    keyword: Progress

  # Clause 3 — [Inherited] [Your Turn] [Once Per Turn]
  # When your opponent's security stack is removed from, gain 1 memory.
  # DCGO: CanTriggerWhenLoseSecurity checks player == card.Owner.Enemy (opponent's security),
  #       IsOwnerTurn, IsExistOnBattleAreaDigimon (must be top of a permanent on field while
  #       this card is inherited).
  # G-INHERITED-DISPATCH closed (Phase 2 Track D); G-OPT-TRIGGERED closed.
  - scope: inherited
    when: on_opponent_security_removed
    once_per_turn: true
    active_when: { your_turn: true }
    summary: "[Inherited][Your Turn][OPT] Opponent's security removed → gain 1 memory"
    process:
      - gain_memory: 1
