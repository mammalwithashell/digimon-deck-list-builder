card: P-167
name: Landramon
kind: digimon
level: 4
color: [black]
cost: 4
dp: 4000
traits: [Mineral, LIBERATOR]
attribute: Virus
alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: black }
    cost: 2

# Printed [Start of Your Main Phase]/[When Digivolving] source-trash reveal
# search/source-placement clause is not authored in this pass.

effects:
  - scope: inherited
    when: on_digivolution_card_trashed
    condition:
      all_of:
        - event_target_owner: you
        - trashed_source_card_id_is: P-167
        - any_of:
            - host_permanent_trait_has: Mineral
            - host_permanent_trait_has: Rock
        - any_permanent:
            of: opponent
            zone: [battle_area]
            kind: digimon
    summary: "When this source is trashed from a Mineral/Rock Digimon, De-Digivolve 1"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon to De-Digivolve 1"
      - de_digivolve:
          target: target
          amount: 1
          stop_at_level: 3
