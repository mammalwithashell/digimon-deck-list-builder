card: P-206
name: "Digital Gate Open"
kind: option
color: [white]
cost: 4

# Card-level Option-use requirement — G-IGNORE-COLOR-MASK closure.
# Printed: "You can ignore this card's color requirements." This is
# UNCONDITIONAL (no board / turn gate), so the requirement is an
# always-true predicate (`all_turns: true` is the explicit
# "passes during any turn" marker). It lowers onto the [Main] clause's
# `option_color_requirement_bypass` condition, which the action mask
# consults in `option_use_requirement_or_color_available` — exactly the
# FROM-HAND play-time bypass path closed for ST20-15. Card-scoped: only
# THIS card's color requirement is bypassed, mirroring DCGO
# `IgnoreColorConditionClass(cardCondition: cardSource == card)`.
use_requirement:
  all_turns: true

# ─── Clause 0: [Main] ──────────────────────────────────────────────────────────
#
# "Reveal the top 3 cards of your deck. Add 1 Digimon card and 1 Tamer card
# among them to the hand. Return the rest to the bottom of the deck.
# Then, place this card in the battle area."
#
# DCGO (EffectTiming.OptionSkill):
#   SimplifiedRevealDeckTopCardsAndSelect(
#     revealCount: 3,
#     simplifiedSelectCardConditions: [
#       { canTargetCondition: IsDigimon,   canNoSelect: true, maxCount: 1, mode: AddHand },
#       { canTargetCondition: IsTamer,     canNoSelect: true, maxCount: 1, mode: AddHand },
#     ],
#     remainingCardsPlace: RemainingCardsPlace.DeckBottom)
#   then PlaceDelayOptionCards(card, activateClass)
#
# DSL modelling:
#   - when: main_from_hand
#   - reveal_top_deck: { of: you, count: 3 }
#   - select_reveal: { filter: { kind: digimon }, optional: true } -> add_to_hand_from_reveal
#   - select_reveal: { filter: { kind: tamer   }, optional: true } -> add_to_hand_from_reveal
#   - place_remainder_on_deck: { of: you, position: bottom }
#   - "Then, place this card in the battle area" -> place_self_as_delay_option: {}
#     (EffectContext::place_self_as_delay_option_permanent). Pushes the Option
#     into the controller's battle area as an OptionState::Delayed permanent
#     carrying the Delay clause's EndOfYourNextTurn trigger — DCGO's
#     PlaceDelayOptionCards(card, activateClass).

# ─── Clause 1: [Main] <Delay> ──────────────────────────────────────────────────
#
# "[Main] ＜Delay＞ (By trashing this card after the placing turn, activate the
# effect below.) · You may play 1 Tamer card with the same color as any of your
# Digimon on the field from your hand with the play cost reduced by 4."
#
# DCGO (EffectTiming.OnDeclaration):
#   CanDeclareOptionDelayEffect(card) -> standard Delay
#   CanSelectCardCondition: cardSource.IsTamer && cardSource.BaseCardColors intersects
#     { all colors on field Digimon top cards } && CanPlayAsNewPermanent
#   cost_delta: reduce 4 (ChangeCostClass applied to selected card only, removed after play)
#   canNoSelect: true (optional — player may decline)
#
# G-COLOR-MATCH-AGAINST-BOARD [DSL vocab gap] — RESOLVED 2026-05-02:
#   "same color as any of your Digimon on the field" is the
#   `color_matches_any_field_digimon` predicate. It cross-references the live
#   colors of YOUR battle-area Digimon top cards at selection time — exactly
#   DCGO's `BaseCardColors intersects { field-Digimon colors }`. The Delay
#   `select_hand` filter wires `kind: tamer` + `color_matches_any_field_digimon`.
#
# DSL modelling:
#   - kind: delay  (maps to DelayTrigger::EndOfYourNextTurn)
#   - process:
#       select_hand:
#         filter: { all_of: [ kind: tamer, color_matches_any_field_digimon: {of: you} ] }
#         optional: true
#       play_from_hand: { cost_delta: { reduce: 4 } }
#
# Note: play_from_hand with cost_delta is the standard verb for reduced-cost plays
# from hand. The Delay clause is "you may" -> optional select_hand.

# ─── Clause 2: Unconditional ignore-color [flood_gate] ─────────────────────────
#
# "You can ignore this card's color requirements."
#
# DCGO (EffectTiming.None):
#   IgnoreColorConditionClass(cardCondition: cardSource == card)
#   -> unconditional; always active while this card is in hand (FaceUp is before-play state,
#     which is the relevant scope for a "can you play this?" check).
#
# G-IGNORE-COLOR-MASK [engine gap] — CLOSED 2026-05-19:
#   The action mask DOES consult `IgnoreColorRequirement`, but the `flood_gate`
#   declarative below only installs the modifier from BATTLE AREAS — it never
#   fires for a card sitting in HAND, which is where the color requirement is
#   checked at play time. The FROM-HAND bypass is carried by the card-level
#   `use_requirement: { all_turns: true }` above, which lowers onto the [Main]
#   clause's `option_color_requirement_bypass` condition. The `flood_gate`
#   clause is retained for the battle-area / face-up scope (harmless, declarative).
#
# DSL modelling:
#   - kind: flood_gate (declarative — applies while card is in a valid zone)
#     scope: face_up (applies while card is in hand / about to be played)
#     modifier: IgnoreColorRequirement
#     target: { card_number_is: "P-206" }  <- self-targeted; unconditional
#     active_when: { your_turn: true }      <- ignore-color only relevant on your turn.

# ─── Clause 3: [Security] (inherited) ──────────────────────────────────────────
#
# "Security Effect [Security] You may play 1 Digimon card with a play cost of 3
# or less from your hand or trash without paying the cost. Then, add this card
# to the hand."
#
# DCGO (EffectTiming.SecuritySkill):
#   CanSelectCardCondition: IsDigimon && HasPlayCost && BasePlayCostFromEntity <= 3
#     && CanPlayAsNewPermanent
#   If both hand and trash have candidates -> "From hand" / "From trash" EffectChoice
#   Otherwise auto-routes to the zone with candidates (SetBool)
#   canNoSelect: true (optional)
#   After play: AddThisCardToHand(card) — places the played Option in controller's hand.
#
# G-PLAY-COST-LTE [DSL vocab gap] — RESOLVED:
#   The `play_cost_lte` predicate enforces "play cost of 3 or less" at selection
#   time (`PredicateSpec.play_cost_lte`, evaluated against `CardData.play_cost`).
#   The select_hand / select_trash filters wire `kind: digimon` + `play_cost_lte: 3`.
#
# G-ADD-OPTION-SELF-TO-HAND [DSL vocab gap] — RESOLVED:
#   "Then, add this card to the hand" is the native DSL `add_this_option_to_hand`
#   step (EffectContext::add_pending_security_to_hand) — moves the pending
#   security Option card into its owner's hand.
#
# DSL modelling:
#   - scope: inherited
#   - when: on_security
#   - optional: true ("you may")
#   - process:
#       select_effect_choice: "From hand" / "From trash"
#       if (zone_choice == 0): select_hand + play_from_hand_free
#       if (zone_choice == 1): select_trash + play_from_trash_free
#       add_this_option_to_hand: {}
#
# Note: Same structural pattern as P-189's security clause, extended with the
#       "add this card to hand" tail.

effects:
  # ─── Clause 0: [Main] ────────────────────────────────────────────────────────
  # Reveal top 3, add 1 Digimon + 1 Tamer to hand, place rest at bottom.
  # "Then, place this card in the battle area" -> place_self_as_delay_option.
  - when: main_from_hand
    optional: false
    summary: "[Main] Reveal top 3; add 1 Digimon + 1 Tamer to hand; place rest at bottom; place self in battle area"
    process:
      - reveal_top_deck:
          of: you
          count: 3
      # DCGO: IsDigimon, canNoSelect: true (optional), maxCount: 1, mode: AddHand
      - select_reveal:
          of: you
          bind_as: digimon_pick
          optional: true
          filter:
            kind: digimon
          prompt: "Add 1 Digimon card to your hand"
      - add_to_hand_from_reveal: { of: you, card: digimon_pick }
      # DCGO: IsTamer, canNoSelect: true (optional), maxCount: 1, mode: AddHand
      - select_reveal:
          of: you
          bind_as: tamer_pick
          optional: true
          filter:
            kind: tamer
          prompt: "Add 1 Tamer card to your hand"
      - add_to_hand_from_reveal: { of: you, card: tamer_pick }
      # Return the rest to deck bottom (select_ordered_permutation auto-handled).
      - place_remainder_on_deck: { of: you, position: bottom }
      # "Then, place this card in the battle area" — pushes the Option into the
      # controller's battle area as an OptionState::Delayed permanent carrying
      # the Delay clause's EndOfYourNextTurn trigger.
      - place_self_as_delay_option: {}

  # ─── Clause 1: [Main] <Delay> ─────────────────────────────────────────────
  # Standard Delay: player may trash this card on or after the next turn.
  # "You may play 1 Tamer card with the same color as any of your Digimon on
  # the field from your hand with the play cost reduced by 4."
  # The select_hand filter wires kind:tamer + color_matches_any_field_digimon.
  - kind: delay
    # TRIGGER CORRECTION (2026-08-24): was `end_of_your_next_turn`, which
    # lowers to a turn-keyed AUTO-FIRE at the end of the controller's next
    # turn. The printed timing is `[Main]`, and DCGO registers this clause at
    # `EffectTiming.OnDeclaration` -- its [Main] activated-declaration timing --
    # so it is a player-activated §16-16 Delay, not a schedule. `trigger: delayed`
    # lowers to `DelayTrigger::MainPhaseActivated`, which surfaces a [Main]
    # mask bit; NOT activating is the §16-16-2 decline, and the option stays on
    # the field (§16-16-1: "while a card with this effect is in the battle area").
    # The old wiring both fired it at the wrong time and gave the player no say.
    trigger: delayed
    summary: "[Main]<Delay> You may play 1 Tamer from hand matching field Digimon color, cost -4"
    process:
      # DCGO: canNoSelect: true -> optional: true ("you may")
      # "1 Tamer card with the same color as any of your Digimon on the field":
      #   kind: tamer + color_matches_any_field_digimon: { of: you }. The
      #   predicate evaluates against the live colors of YOUR battle-area
      #   Digimon top cards at selection time.
      - select_hand:
          of: you
          bind_as: tamer_to_play
          optional: true
          filter:
            all_of:
              - kind: tamer
              - color_matches_any_field_digimon: { of: you }
          prompt: "You may play 1 Tamer card with the same color as any of your Digimon on the field"
      # DCGO: PlayPermanentCards with payCost: true and a ChangeCostClass
      # applying -4 to the selected card only. "play cost reduced by 4" is a
      # Reduce delta (cost - 4, floored at 0) — NOT a Fixed/Free play.
      - play_from_hand:
          of: you
          hand_index: tamer_to_play
          cost_delta: { reduce: 4 }

  # ─── Clause 2: Unconditional ignore-color ─────────────────────────────────
  # "You can ignore this card's color requirements." (unconditional; no board condition)
  # DCGO: IgnoreColorConditionClass(cardCondition: cardSource == card)
  # G-IGNORE-COLOR-MASK: from-hand bypass carried by use_requirement above;
  # this flood_gate covers the battle-area / face-up scope.
  - kind: flood_gate
    scope: face_up
    active_when: { your_turn: true }
    modifier: IgnoreColorRequirement
    target: { card_number_is: "P-206" }

  # ─── Clause 3: [Security] (inherited) ────────────────────────────────────
  # "You may play 1 Digimon card with a play cost of 3 or less from your
  # hand or trash without paying the cost. Then, add this card to the hand."
  # DCGO: CanSelectCardCondition: IsDigimon && HasPlayCost && BasePlayCostFromEntity <= 3
  #       "From hand" / "From trash" EffectChoice when both zones have candidates.
  #       AddThisCardToHand(card) afterwards — unconditionally at end of SecuritySkill.
  # play_cost_lte: 3 enforces the cost gate; add_this_option_to_hand adds self.
  #
  # DRIFT FIX (2026-05-22): Clause was previously `optional: true`, which with
  # G-OUTER-OPTIONAL-NOT-INSTALLED now resolved would allow the player to decline
  # the entire clause including the mandatory "Then, add this card to the hand"
  # tail. The tail is unconditional — DCGO calls AddThisCardToHand after the
  # optional play regardless of whether a Digimon was selected. Pattern follows
  # P-156 "Future Potential!":
  #   - outer clause is mandatory (optional: false)
  #   - optional Digimon play is guarded by count_gte and an explicit
  #     select_effect_choice ["Play Digimon", "Decline"] branch
  #   - add_this_option_to_hand is a sibling tail step that always fires
  - scope: inherited
    when: on_security
    optional: false
    summary: "[Inherited][Security] You may play 1 Digimon cost <=3 from hand or trash free; then add self to hand (mandatory)"
    process:
      # Guard: only install the play prompt when at least 1 eligible Digimon
      # exists in hand or trash. Without this guard, the select_effect_choice
      # would always show even when there is nothing to play.
      - if:
          condition:
            any_of:
              - count_gte:
                  filter:
                    of: you
                    zone: [hand]
                    kind: digimon
                    play_cost_lte: 3
                  n: 1
              - count_gte:
                  filter:
                    of: you
                    zone: [trash]
                    kind: digimon
                    play_cost_lte: 3
                  n: 1
          then:
            # "You may" — offer an explicit Play / Decline choice.
            - select_effect_choice:
                labels: ["Play Digimon", "Decline"]
                bind_as: play_choice
                prompt: "You may play 1 Digimon card (play cost 3 or less) without paying the cost"
            - if:
                condition: { equals: [play_choice, 0] }
                then:
                  # DCGO: "From which area?" EffectChoice when both zones have candidates.
                  - select_effect_choice:
                      labels: ["From hand", "From trash"]
                      bind_as: zone_choice
                      prompt: "From which area do you play a Digimon?"
                  - if:
                      condition: { equals: [zone_choice, 0] }
                      then:
                        - select_hand:
                            of: you
                            bind_as: picked_hand
                            optional: false
                            filter:
                              all_of:
                                - kind: digimon
                                - play_cost_lte: 3
                            prompt: "Select a Digimon card (cost <=3) to play from hand"
                        - play_from_hand_free:
                            of: you
                            hand_index: picked_hand
                  - if:
                      condition: { equals: [zone_choice, 1] }
                      then:
                        - select_trash:
                            of: you
                            bind_as: picked_trash
                            optional: false
                            filter:
                              all_of:
                                - kind: digimon
                                - play_cost_lte: 3
                            prompt: "Select a Digimon card (cost <=3) to play from trash"
                        - play_from_trash_free:
                            of: you
                            hand_index: picked_trash
      # "Then, add this card to the hand." — unconditional mandatory tail.
      # Fires whether the optional play was performed, declined, or skipped.
      - add_this_option_to_hand: {}
