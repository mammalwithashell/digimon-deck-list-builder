card: P-227
name: "Unique Emblem: Primal Impact"
kind: option
color: [red]
cost: 2
traits: [LIBERATOR]

# Printed text (official Bandai DB bundle data/card_bundles/P-227.md):
# [Main] Reveal the top 3 cards of your deck. Add 1 Digimon card with
# [Tyrannomon] in its name or the [Reptile] or [Dinosaur] trait and 1
# [LIBERATOR] trait card among them to the hand. Return the rest to the bottom
# of the deck. Then, place this card in the battle area.
#
# [Your Turn] When any of your [Ryutaro Williams] are played, <Delay> (By
# trashing this card after the placing turn, activate the effect below.)
# ・1 of your Digimon may digivolve into a level 6 or lower [LIBERATOR] trait
#   card in the hand with the digivolution cost reduced by 3.
#
# Security Effect [Security] Activate this card's [Main] effects.
#
# DCGO P_227.cs: first bucket `EqualsTraits("Reptile") || "Dinosaur" ||
# ContainsCardName("Tyrannomon")` (no kind test in the C# predicate; the printed
# text says "Digimon card" and governs), second `EqualsTraits("LIBERATOR")`,
# both AddHand maxCount 1 mandatory, remainder DeckBottom; <Delay> keyed to an
# own `EqualsCardName("Ryutaro Williams")` being PLAYED (OnEnterFieldAnyone).
# Same shape as P-229 / P-230 / P-232.

effects:
  - when: main_from_hand
    optional: false
    summary: "[Main] Reveal top 3; add 1 Tyrannomon/Reptile/Dinosaur Digimon and 1 [LIBERATOR] card; bottom the rest; pipeline then places self in battle area"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          no_duplicate_cards: true
          buckets:
            - bind_as: tyrannomon_pick
              min: 1
              max: 1
              filter:
                all_of:
                  - kind: digimon
                  - any_of:
                      - name_contains: Tyrannomon
                      - trait_has: Reptile
                      - trait_has: Dinosaur
            - bind_as: liberator_pick
              min: 1
              max: 1
              filter: { trait_has: LIBERATOR }
          prompt: "Select 1 [Tyrannomon]/[Reptile]/[Dinosaur] Digimon and 1 [LIBERATOR] card"
      - add_to_hand_from_reveal: { of: you, card: tyrannomon_pick }
      - add_to_hand_from_reveal: { of: you, card: liberator_pick }
      - place_remainder_on_deck: { of: you, position: bottom }

  - text: "[Security] Activate this card's [Main] effects."
    scope: inherited
    when: on_security
    optional: false
    summary: "[Security] Activate [Main] search effects, then place self in battle area"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          no_duplicate_cards: true
          buckets:
            - bind_as: tyrannomon_pick
              min: 1
              max: 1
              filter:
                all_of:
                  - kind: digimon
                  - any_of:
                      - name_contains: Tyrannomon
                      - trait_has: Reptile
                      - trait_has: Dinosaur
            - bind_as: liberator_pick
              min: 1
              max: 1
              filter: { trait_has: LIBERATOR }
          prompt: "Select 1 [Tyrannomon]/[Reptile]/[Dinosaur] Digimon and 1 [LIBERATOR] card"
      - add_to_hand_from_reveal: { of: you, card: tyrannomon_pick }
      - add_to_hand_from_reveal: { of: you, card: liberator_pick }
      - place_remainder_on_deck: { of: you, position: bottom }
      - place_self_as_delay_option: {}

  - text: "[Your Turn] When any of your [Ryutaro Williams]es are played, ＜Delay＞. ・1 of your Digimon may digivolve into a level 6 or lower [LIBERATOR] trait card in the hand with the digivolution cost reduced by 3."
    kind: delay
    trigger: on_ally_played
    active_when:
      your_turn: true
      event_target_owner: you
      event_card_name_is: "Ryutaro Williams"
    summary: "[Your Turn] When your Ryutaro Williams is played, Delay: 1 of your Digimon may digivolve into a level <=6 LIBERATOR card in hand, cost -3"
    process:
      - select_own_permanent:
          bind_as: target
          optional: true
          filter:
            all_of:
              - kind: digimon
              - zone: [battle_area]
          prompt: "Choose 1 of your Digimon to digivolve"
      - select_hand:
          of: you
          bind_as: evo
          optional: false
          filter:
            all_of:
              - kind: digimon
              - trait_has: LIBERATOR
              - level_lte: 6
              # DCGO DigivolveIntoHandOrTrashCard keeps only cards with a route
              # onto the chosen Digimon AND a payable reduced cost (CR 4.3
              # 1-3-11-1); see P-229 for the full note.
              - can_digivolve_onto_with_cost:
                  target: target
                  cost: { reduce: 3 }
          prompt: "Choose a level 6 or lower [LIBERATOR] card to digivolve into"
      - effect_initiated_digivolve:
          target: target
          from_hand: evo
          cost: { reduce: 3 }
          ignore_requirements: false
