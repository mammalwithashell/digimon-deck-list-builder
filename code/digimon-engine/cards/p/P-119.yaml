# P-119 Hawkmon — Lv.3 Red, cost 3, 1000 DP. Traits: Avian. Rookie / Free.
#
# Printed text (data/card_bundles/P-119.md, official Bandai DB):
#   Digivolves from red Lv.2 or yellow Lv.2 for 0 (standard circles in cards.json).
#   [On Play] Reveal the top 3 cards of your deck. Add 1 red or yellow card with
#     2 or more colors and 1 Tamer card with [Yolei Inoue] in its name among
#     them to the hand. Return the rest to the bottom of the deck.
#   Inherited: [End of Your Turn] This Digimon and another of your Digimon may
#     DNA digivolve into a Digimon card in your hand.
#   Official Q&A: when one card satisfies both pickers you add as many cards to
#   your hand as possible (a card can't be taken twice -> no_duplicate_cards).
#
# DCGO: DCGO/Assets/Scripts/CardEffect/P/Red/P_119.cs
#   - OnEnterFieldAnyone (On Play): SimplifiedRevealDeckTopCardsAndSelect, 3
#     cards, bucket 1 = >= 2 colors AND (red OR yellow), bucket 2 = Tamer with
#     [Yolei Inoue] in its name, remainder to the deck bottom. (BT16-029 /
#     BT17-020 select_reveal_buckets idiom.)
#   - OnEndTurn (inherited, optional): DNADigivolvePermanentsIntoHandOrTrashCard
#     payCost=true with this Digimon fixed as one material (BT17-007 idiom).
card: P-119
name: Hawkmon
kind: digimon
level: 3
color: [red]
cost: 3
dp: 1000
form: Rookie
attribute: Free
traits: [Avian]
effects:
  - when: on_play
    summary: "[On Play] Reveal top 3; add 1 red/yellow card with 2+ colors and 1 Tamer with [Yolei Inoue] in its name; bottom the rest"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          no_duplicate_cards: true
          buckets:
            - bind_as: multicolor_pick
              min: 1
              max: 1
              filter:
                all_of:
                  - self_color_count_gte: 2
                  - any_of:
                      - color_is: red
                      - color_is: yellow
            - bind_as: yolei_pick
              min: 1
              max: 1
              filter:
                all_of:
                  - kind: tamer
                  - name_contains: "Yolei Inoue"
          prompt: "Select 1 red or yellow card with 2 or more colors and 1 Tamer card with [Yolei Inoue] in its name"
      - add_to_hand_from_reveal: { of: you, card: multicolor_pick }
      - add_to_hand_from_reveal: { of: you, card: yolei_pick }
      - place_remainder_on_deck: { of: you, position: bottom }

  - when: end_of_your_turn
    scope: inherited
    optional: true
    summary: "[End of Your Turn] This Digimon and another of your Digimon may DNA digivolve into a Digimon card in your hand (paying its DNA cost) (inherited)"
    process:
      - may_dna_digivolve_now:
          partner_filter:
            all_of:
              - of: you
              - kind: digimon
          target_filter:
            all_of:
              - of: you
              - kind: digimon
          cost: 0
          ignore_requirements: false
          optional: true
          prompt: "DNA digivolve at end of turn?"
