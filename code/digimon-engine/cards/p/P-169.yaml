card: P-169
name: Close
kind: tamer
color: [black]
cost: 4

# Printed All Turns source-trash trigger that suspends this Tamer to place a
# Mineral/Rock card from trash as a bottom source is not authored in this pass.

effects:
  - when: start_of_your_main_phase
    condition:
      any_permanent:
        of: opponent
        zone: [battle_area]
        kind: digimon
    summary: "[Start of Your Main Phase] If your opponent has a Digimon, gain 1 memory"
    process:
      - gain_memory: 1

  - scope: inherited
    when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
