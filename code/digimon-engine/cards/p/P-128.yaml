card: P-128
name: Cody Hida
kind: tamer
color: [black]
cost: 3

effects:
  - when: start_of_your_main_phase
    condition:
      any_permanent:
        of: you
        zone: [battle_area]
        kind: digimon
        trait_has: Free
    summary: "[Start of Your Main Phase] If you have a Digimon with the [Free] trait, gain 1 memory"
    process:
      - gain_memory: 1

  - when: on_play
    summary: "[On Play] Choose: play Armadillomon from hand free, or digivolve one of your Digimon into Ankylomon in hand free"
    process:
      - select_effect_choice:
          labels: ["Play Armadillomon", "Digivolve into Ankylomon"]
          bind_as: mode
          prompt: "Choose 1 effect"
      - if:
          condition: { equals: [mode, 0] }
          then:
            - select_hand:
                of: you
                bind_as: armadillomon
                optional: true
                # DCGO P_128.cs:74-85: name + CanPlayAsNewPermanent(payCost:
                # false) — an empty slot and no play prohibition. CR 4.3
                # 1-3-11-1: a card can be declared for play only if it can be
                # played (7-1-1), so an unplayable Armadillomon is never offered.
                filter:
                  kind: digimon
                  name_is: Armadillomon
                  can_play_from_effect_without_cost: true
                prompt: "You may play 1 Armadillomon from your hand"
            - play_from_hand_free: { of: you, hand_index: armadillomon }
      - if:
          condition: { equals: [mode, 1] }
          then:
            # DCGO P_128.cs:87-104: only a Digimon some [Ankylomon] in hand
            # can digivolve onto (CanPlayCardTargetFrame). CR 4.3 1-3-11-1 also
            # covers digivolving: it can be declared only if it can be done.
            # The Ankylomon hand pick below gets `can_digivolve_onto: base`
            # from the compile pass.
            - select_own_permanent:
                bind_as: base
                optional: true
                filter:
                  kind: digimon
                  has_digivolve_candidate:
                    zone: [hand]
                    filter:
                      name_is: Ankylomon
                prompt: "Choose 1 of your Digimon to digivolve"
            - select_hand:
                of: you
                bind_as: ankylomon
                filter:
                  kind: digimon
                  name_is: Ankylomon
                prompt: "Choose Ankylomon in your hand"
            - effect_initiated_digivolve:
                target: base
                from_hand: ankylomon
                cost: 0
                ignore_requirements: false

  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
