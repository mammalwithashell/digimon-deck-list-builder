card: P-225
name: DigiLab
kind: option
color: [white]
cost: 2
traits: [CS]

use_requirement:
  any_field_permanent:
    of: you
    any_of:
      - kind: digimon
      - kind: tamer
    trait_has: CS

effects:
  - text: "While you have a [CS] trait Digimon or Tamer on the field, you can ignore this card's color requirements. [Main] ＜Draw 1＞. Then, place this card in the battle area."
    when: main_from_hand
    summary: "[Main] <Draw 1>, then place this card in the battle area"
    process:
      - draw: { of: you, count: 1 }
      - place_self_as_delay_option: {}

  - text: "[Main] ＜Delay＞ ・By placing the top stacked card of any of your level 4 or higher [CS] trait Digimon as its bottom digivolution card, gain 2 memory."
    kind: delay
    trigger: delayed
    summary: "[Main]<Delay> By placing top stacked card of a Lv.4+ [CS] Digimon as its bottom digivolution card, gain 2 memory"
    process:
      - select_own_permanent:
          optional: true
          bind_as: cs_host
          filter:
            all_of:
              - kind: digimon
              - level_gte: 4
              - trait_has: CS
              - materials_count_gte: 1
          prompt: "By placing the top stacked card of any of your level 4 or higher [CS] trait Digimon as its bottom digivolution card, gain 2 memory"
      - if:
          condition: { binding_present: cs_host }
          then:
            - place_top_source_as_bottom: { target: cs_host }
            - gain_memory: 2

  - text: "[Security] Place this card in the battle area."
    scope: inherited
    when: on_security
    summary: "[Security] Place this card in the battle area"
    process:
      - place_self_as_delay_option: {}
