card: P-035
name: "Red Memory Boost!"
kind: option
color: [red]
cost: 3

# ─── Clause 0: [Main] ─────────────────────────────────────────────────────────
#
# "[Main] Reveal the top 4 cards of your deck. Add 1 red Digimon card among
# them to the hand. Place the remaining cards at the bottom of your deck in
# any order. Then, place this card in your battle area."
#
# DCGO (EffectTiming.OptionSkill):
#   SimplifiedRevealDeckTopCardsAndSelect(
#     revealCount: 4,
#     simplifiedSelectCardConditions: [
#       { canTargetCondition: IsDigimon && HasCardColor(Red),
#         canNoSelect: true (optional — 0 eligible = no selection prompt),
#         message: "Select 1 red Digimon card.",
#         mode: AddHand, maxCount: 1 }
#     ],
#     remainingCardsPlace: RemainingCardsPlace.DeckBottom)
#   then PlaceDelayOptionCards(card, activateClass)
#
# DSL modelling:
#   - when: main_from_hand  (OptionSkill / MainFromHand timing)
#   - reveal_top_deck: { of: you, count: 4 }
#   - select_reveal: { filter: { all_of: [kind: digimon, color_is: red] }, optional: false }
#     Printed text "Add 1 red Digimon card among them" is mandatory — when ≥1
#     red Digimon is revealed you MUST add one. `install_select_reveal` enforces
#     the compiled filter when building valid_action_ids — only red Digimon
#     among the 4 revealed are selectable. When zero eligible the install
#     short-circuits (select_reveal returns false → no prompt, no card added),
#     regardless of the `optional` flag — so DCGO's canNoSelect (0-eligible
#     skip) is handled by the empty-valid_action_ids path. Matches sibling
#     P-037 Yellow Memory Boost!.
#   - add_to_hand_from_reveal: { of: you, card: picked }
#     No-ops when `picked` is unbound (no eligible card → select skipped).
#   - place_remainder_on_deck: { of: you, position: bottom }
#     (internally calls select_ordered_permutation — "any order" is auto-handled)
#   - place_self_as_delay_option: {}
#     "Then, place this card in the battle area" — places the currently-resolving
#     Option card into the owner's battle area as an OptionState::Delayed
#     permanent (G-PLACE-SELF-AS-OPTION-PERMANENT resolved 2026-05-02). In the
#     main-from-hand context the engine removes P-035 from the controller's hand.
#
# ─── Clause 1: [Main] <Delay> ────────────────────────────────────────────────
#
# "[Main] ＜Delay＞ (By trashing this card after the placing turn, activate
# the effect below.) · Gain 2 memory."
#
# DCGO (EffectTiming.OnDeclaration):
#   CanUseCondition: CanDeclareOptionDelayEffect(card)
#     → standard player-initiated <Delay> (trash on/after the placing turn).
#   ActivateCoroutine:
#     DeletePermanentAndProcessAccordingToResult → if success:
#       AddMemory(2)
#
# DSL modelling:
#   - kind: delay
#     trigger: delayed  → CompiledTiming::Delayed → DelayTrigger::MainPhaseActivated.
#     This is the standard printed <Delay> (RULES_CONTEXT 16-16): a
#     player-visible [Main]-phase activation action. The controller trashes the
#     parked Option on a later main phase to activate the body — it never
#     auto-fires. Matches sibling P-037 Yellow Memory Boost!.
#   - process: [ gain_memory: 2 ]
#
# ─── Clause 2: [Security] (inherited) ────────────────────────────────────────
#
# "Security Effect [Security] Place this card in the battle area."
#   (cards.json: inherited_effect_description_eng)
#
# DCGO (EffectTiming.SecuritySkill):
#   CardEffectFactory.PlaceSelfDelayOptionSecurityEffect(card)
#   → places the option card in battle area when it hits security (same
#     persistent placement as Main's PlaceDelayOptionCards).
#
# DSL modelling:
#   - scope: inherited  (inherited security effect)
#   - when: on_security
#   - process: [ place_self_as_delay_option: {} ]
#     In the security context `place_self_as_delay_option` consumes the
#     pending_security card and places it into the owner's battle area as an
#     OptionState::Delayed permanent (instead of disposing it to trash).

effects:
  # ─── Clause 0: [Main] ─────────────────────────────────────────────────────
  # Reveal top 4, add 1 red Digimon to hand, place rest at bottom in any order.
  # "Then, place this card in battle area" via place_self_as_delay_option.
  - when: main_from_hand
    optional: false
    summary: "[Main] Reveal top 4; add 1 red Digimon to hand; place rest at bottom; place self in battle area"
    process:
      - reveal_top_deck:
          of: you
          count: 4
      # DCGO: IsDigimon && HasCardColor(Red), maxCount: 1.
      # The compiled filter is enforced by install_select_reveal — only red
      # Digimon among the 4 revealed are selectable; 0 eligible → no prompt.
      # optional: false — "Add 1 red Digimon card" is mandatory when ≥1 is
      # revealed (matches sibling P-037 Yellow Memory Boost!).
      - select_reveal:
          of: you
          bind_as: picked
          optional: false
          filter:
            all_of:
              - kind: digimon
              - color_is: red
          prompt: "Add 1 red Digimon card to your hand"
      - add_to_hand_from_reveal: { of: you, card: picked }
      # place_remainder_on_deck internally calls select_ordered_permutation —
      # the "any order" requirement is auto-handled by the engine.
      - place_remainder_on_deck: { of: you, position: bottom }
      # "Then, place this card in the battle area" — places the resolving Option
      # card into the owner's battle area as an OptionState::Delayed permanent.
      - place_self_as_delay_option: {}

  # ─── Clause 1: [Main] <Delay> ─────────────────────────────────────────────
  # Standard printed <Delay>: the controller may trash this parked Option on a
  # later main phase (after the placing turn) to activate the body.
  # trigger: delayed → CompiledTiming::Delayed → DelayTrigger::MainPhaseActivated.
  - kind: delay
    trigger: delayed
    summary: "[Main]<Delay> Gain 2 memory"
    process:
      # DCGO: AddMemory(2)
      - gain_memory: 2

  # ─── Clause 2: [Security] (inherited) ─────────────────────────────────────
  # "Security Effect [Security] Place this card in the battle area."
  # DCGO: PlaceSelfDelayOptionSecurityEffect — places option as Delay permanent.
  # place_self_as_delay_option consumes the pending_security card and places it
  # in the owner's battle area as an OptionState::Delayed permanent.
  - scope: inherited
    when: on_security
    summary: "[Security][Inherited] Place this card in the battle area"
    process:
      - place_self_as_delay_option: {}
