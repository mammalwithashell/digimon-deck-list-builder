# P-193 The Wicked God Emerges! — Option, Cost 3, Purple.
# No printed traits box entry beyond type_eng ["Wicked God"] (card_overrides/
# cards.json list "Wicked God" as the card's own type — this is the printed
# [Wicked God] trait carried by the Option card itself, not a filter target).
# No standard digivolve circles (Option card).
#
# ─── Printed card text (official Bandai DB bundle — data/card_bundles/P-193.md) ─
#
# [Main] By trashing 1 card with the [Composite] or [Wicked God] trait from
#   your hand, ＜Draw 2＞ (Draw 2 cards from your deck.) Then, place this card
#   in the battle area.
# [End of All Turns] ＜Delay＞ (By trashing this card after the placing turn,
#   activate the effect below.)
#   ・By deleting 1 of your [Millenniummon], you may play 1 [Wicked God] trait
#     Digimon card from your hand or trash without paying the cost.
#
# Security Effect [Security] Activate this card's [Main] effects.
#
# Official Q&A (data/card_bundles/P-193.md): "No, you can't. If you don't
# trash 1 card with the [Composite] or [Wicked God] trait from your hand, you
# can't use the part after 'then' in this card's [Main] effect to place this
# card in the battle area." — confirms Clause A's "By trashing X, <Draw 2>.
# Then place..." grammar is a hard cost gate: declining/no-eligible-card means
# NEITHER the draw NOR the battle-area placement happens.
#
# ─── DCGO C# reference (DCGO/Assets/Scripts/CardEffect/P/Purple/P_193.cs) ──────
#
# Clause A — EffectTiming.OptionSkill:
#   CanUseCondition: CanTriggerOptionMainEffect (standard Main-from-hand gate).
#   ActivateCoroutine: if HasMatchConditionOwnersHand(Composite||WickedGod):
#     SelectHandEffect (maxCount = min(1, matchCount), canNoSelect: true,
#     mode: Discard). If discarded: Draw 2, then PlaceDelayOptionCards(card)
#     (places this card in the battle area as a Delay-Option permanent).
#     NOTE: the whole draw+place tail is gated on `discarded == true` — i.e.
#     the trash succeeding — matching the Q&A above.
#
# Clause B — EffectTiming.OnEndTurn (the printed "[End of All Turns] <Delay>"):
#   CanUseCondition: CanDeclareOptionDelayEffect(card) — standard printed
#     <Delay> declare-gate (RULES 16-16): the Option is on the field as a
#     Delay permanent, not the turn it was placed. Despite the "OnEndTurn"
#     C# timing label, DCGO's own doc-string for this clause (line 91) reads
#     "[End of All Turns] <Delay> (After this card is placed, by trashing it
#     the next turn or later, activate the effect below)" — this IS the
#     standard player-declared <Delay> Main-phase activation (glossary.pdf /
#     keyword-semantics.md: "<Delay> — Option in battle area; trash this card
#     to activate the linked effect; not the turn it entered the battle
#     area"), not an engine-automatic end-of-turn trigger. Modelled as the
#     standard `trigger: delayed` (→ DelayTrigger::MainPhaseActivated), the
#     same idiom BT13-110 / BT21-097 use for their "[End of Your/All Turns]
#     <Delay>" clauses.
#   CanActivateCondition: IsExistOnField(card) — automatically true whenever
#     `activate_delayed_option_main` is legal (the standard engine Delay gate
#     already requires the Option be seated on the field as
#     OptionState::Delayed with trigger MainPhaseActivated and
#     turn_count > placed_on_turn — no extra `active_when` needed).
#   ActivateCoroutine:
#     1. DeletePermanentAndProcessAccordingToResult(card.PermanentOfThisCard())
#        — this is the OUTER standard <Delay> activation cost: "by trashing
#        this card" (the engine's `activate_delayed_option_main` already
#        performs this trash unconditionally as the Delay body's activation
#        cost — see option_lifecycle.rs; no explicit
#        `activation_cost: { trash_self: true }` step is authored here,
#        matching the BT13-110/BT21-097 idiom for `trigger: delayed`).
#     2. SuccessProcess (self-trash succeeded — always true once this body
#        runs): if HasMatchConditionOwnersPermanent(own battle-area Digimon
#        named "Millenniummon"): SelectPermanentEffect (maxCount 1,
#        canNoSelect: true — DECLINABLE).
#     3. Only if a Digimon was actually selected AND deleted
#        (`deletedPermanents.Count > 0` →
#        DeletePeremanentAndProcessAccordingToResult succeeds) does
#        DeleteSuccessProcess run: choose hand-vs-trash (if both have
#        eligible [Wicked God] cards), select 1 such card (canNoSelect: true
#        — DECLINABLE), then PlayPermanentCards(payCost: false).
#     THE INNER "BY DELETING 1 MILLENNIUMMON, YOU MAY PLAY..." IS ITSELF A
#     COST-GATED REWARD: declining the delete pick, or having no eligible
#     Millenniummon, means DeleteSuccessProcess never runs — no free-play
#     prompt is ever offered. This is modelled below via
#     `select_own_permanent { optional: true, then: [...] }`: the DSL's
#     default `continue_on_decline: false` means a decline (or a no-op pick
#     with zero eligible candidates) drops the entire `then:` tail — the same
#     cost-gate idiom P-169 uses for "by suspending this Tamer"
#     (code/digimon-engine/src/dsl_cards/step/selections.rs, doc comment
#     above `continue_on_decline` — G-OPT-REFUND-ON-DECLINE). This closes the
#     over-exposure bug from the earlier draft, which used a flat
#     select_own_permanent -> delete_permanent -> select_union_zone (optional)
#     -> play_union_bound_free sequence with NO gate, letting the union-zone
#     free-play prompt install even when the deletion was declined or
#     impossible (select_union_zone installs whenever eligible candidates
#     exist, independent of the prior step's outcome).
#
# Clause C — EffectTiming.SecuritySkill:
#   AddActivateMainOptionSecurityEffect — re-runs the FULL Main
#   (EffectTiming.OptionSkill) coroutine verbatim (CardEffectCommons.cs
#   `AddActivateMainOptionSecurityEffect` -> `ActivateMainOfOptionSide` ->
#   `OptionMainEffect(card).Activate(...)`), i.e. the trash-cost-gated
#   Draw 2 AND the "then place this card in the battle area" tail. Modelled
#   below as `when: on_security` mirroring Clause A's full process (matching
#   the BT8-097 idiom for "[Security] Activate this card's [Main] effects").

card: P-193
name: "The Wicked God Emerges!"
kind: option
color: [purple]
cost: 3
traits: ["Wicked God"]

effects:
  # ─── Clause A — [Main] By trashing 1 [Composite]/[Wicked God] card, Draw 2;
  #     then place this card in the battle area ─────────────────────────────
  #
  # `select_hand { cost: true }` — declining (or the condition gate below
  # blocking activation when no eligible card exists) means neither the draw
  # NOR the battle-area placement happens, matching the official Q&A.
  - when: main_from_hand
    optional: true
    summary: "[Main] By trashing 1 [Composite]/[Wicked God] card from hand, Draw 2; then place this card in the battle area"
    condition:
      count_gte:
        filter:
          of: you
          zone: [hand]
          any_of:
            - trait_has: Composite
            - trait_has: "Wicked God"
        n: 1
    process:
      - select_hand:
          of: you
          bind_as: discard
          optional: true
          cost: true
          filter:
            any_of:
              - trait_has: Composite
              - trait_has: "Wicked God"
          prompt: "Trash 1 [Composite] or [Wicked God] trait card from your hand"
      - trash_from_hand_by_index: { of: you, hand_index: discard }
      - draw: { of: you, count: 2 }
      - place_self_as_delay_option: {}

  # ─── Clause B — [End of All Turns] <Delay> — By deleting 1 [Millenniummon],
  #     you may play 1 [Wicked God] trait Digimon card from hand/trash free ──
  #
  # Standard printed <Delay> (trigger: delayed → DelayTrigger::MainPhaseActivated).
  # The engine's `activate_delayed_option_main` performs the outer "by
  # trashing this card" activation cost automatically; no explicit
  # `activation_cost: { trash_self: true }` step is needed (matches
  # BT13-110 / BT21-097's `trigger: delayed` idiom for "[End of Your/All
  # Turns] <Delay>").
  #
  # Inner cost-gate: the Millenniummon delete pick is the printed "By
  # deleting 1 of your [Millenniummon]" COST that gates the "you may play"
  # reward. `select_own_permanent { optional: true, then: [...] }` with the
  # DSL default `continue_on_decline: false` means declining (or a zero-
  # candidate no-op) drops the ENTIRE `then:` tail — the free-play prompt is
  # never installed unless a Millenniummon is actually deleted, matching
  # DCGO's DeleteSuccessProcess gating.
  - kind: delay
    trigger: delayed
    summary: "[End of All Turns]<Delay> By deleting 1 [Millenniummon], you may play 1 [Wicked God] Digimon from hand/trash free"
    process:
      - select_own_permanent:
          bind_as: deleted
          optional: true
          filter:
            all_of:
              - kind: digimon
              - zone: [battle_area]
              - name_is: "Millenniummon"
          prompt: "Delete 1 of your [Millenniummon]"
          then:
            - delete_permanent: { target: deleted }
            - select_union_zone:
                of: you
                zones: [hand, trash]
                bind_as: wicked_god_pick
                optional: true
                filter:
                  all_of:
                    - kind: digimon
                    - trait_has: "Wicked God"
                prompt: "You may play 1 [Wicked God] trait Digimon card from your hand or trash without paying the cost"
            - play_union_bound_free:
                binding: wicked_god_pick

  # ─── Clause C — [Security] Activate this card's [Main] effects ────────────
  #
  # DCGO AddActivateMainOptionSecurityEffect re-runs the full Main coroutine
  # (trash-cost-gated Draw 2 AND "then place this card in the battle area"),
  # matching the BT8-097 idiom of mirroring the Main clause's full process
  # under `when: on_security`.
  - when: on_security
    optional: true
    summary: "[Security] Activate [Main] effects: by trashing 1 [Composite]/[Wicked God] card, Draw 2; then place this card in the battle area"
    condition:
      count_gte:
        filter:
          of: you
          zone: [hand]
          any_of:
            - trait_has: Composite
            - trait_has: "Wicked God"
        n: 1
    process:
      - select_hand:
          of: you
          bind_as: discard
          optional: true
          cost: true
          filter:
            any_of:
              - trait_has: Composite
              - trait_has: "Wicked God"
          prompt: "Trash 1 [Composite] or [Wicked God] trait card from your hand"
      - trash_from_hand_by_index: { of: you, hand_index: discard }
      - draw: { of: you, count: 2 }
      - place_self_as_delay_option: {}
