card: ST3-15
name: Holy Flame
kind: option
color: [yellow]
cost: 2
effects:
  - when: main_from_hand
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon to get Security Attack -3"
      - add_modifier:
          target: target
          modifier: SecurityAttackChange
          value: -3
          expiry: end_of_opponents_turn
  - when: on_security
    process:
      - add_modifier:
          target: { owner: opponent, zone: [battle_area], kind: digimon }
          modifier: SecurityAttackChange
          value: -1
          expiry: end_of_turn
