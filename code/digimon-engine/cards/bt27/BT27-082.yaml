card: BT27-082
name: Nosferamon
kind: dual
level: 6
color: [purple, yellow]
cost: 5
dp: 12000
traits: [Undead, Glowing Dawn, BEATBREAK]

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: purple }
    cost: 3
  - kind: digivolve
    from: { any_color: true, level_eq: 5, trait_has: Glowing Dawn }
    cost: 3

dual:
  digimon:
    level: 6
    dp: 12000
    colors: [purple, yellow]
    traits: [Undead, Glowing Dawn, BEATBREAK]
    effects:
      - text: "＜Execute＞"
        kind: grant_keyword
        keyword: Execute
      - text: "＜Ascension＞ (When this Digimon is deleted, you may place this card as the top security card.)"
        kind: grant_keyword
        keyword: Ascension
      - text: "[Security] [On Deletion] Delete 1 of your opponent's Digimon with the lowest level. If this effect didn't delete, trash their top security card."
        when: [on_security, on_deletion]
        process:
          - select_opponent_permanent:
              optional: false
              bind_as: lowest
              filter:
                kind: digimon
                level_matches_aggregate: { selector: lowest_level, of: opponent }
              prompt: Delete 1 opponent's Digimon with the lowest level
          - delete_permanent: { target: lowest }
          - if:
              condition: { effect_deleted_any_opponent_digimon: false }
              then:
                - trash_top_security: { of: opponent }
      - text: "[When Digivolving] [When Attacking] [Once Per Turn] By trashing 2 bottom face-down cards from under any of your Tamers, activate 1 [Main] effect on this card's Option side."
        when: [when_digivolving, when_attacking]
        once_per_turn: true
        optional: true
        as_option_effect: true
        condition: { face_down_sources_under_tamers_gte: 2 }
        process:
          - trash_bottom_face_down_sources_under_tamers: { of: you, count: 2 }
          - select_opponent_permanent:
              optional: false
              bind_as: to_delete
              filter: { kind: digimon, level_gte: 6 }
              prompt: Delete 1 opponent's level 6 or higher Digimon
          - delete_permanent: { target: to_delete }
          - select_trash:
              of: you
              bind_as: to_play
              optional: true
              filter: { trait_has: BEATBREAK, play_cost_lte: 4, can_play_from_effect_without_cost: true }
              prompt: You may play 1 BEATBREAK card with play cost 4 or less
          - play_from_trash_free: { of: you, hand_index: to_play }
  option:
    use_cost: 5
    colors: [purple]
    effect_text: "[Main] Delete 1 of your opponent's level 6 or higher Digimon. Then, you may play 1 play cost 4 or lower [BEATBREAK] trait card from your trash without paying the cost."
    use_requirement:
      any_field_permanent:
        of: you
        any_of: [{ kind: digimon }, { kind: tamer }]
        trait_has: Glowing Dawn
    arts_digivolve: true
    effects:
      - text: "[Main] Delete 1 of your opponent's level 6 or higher Digimon. Then, you may play 1 play cost 4 or lower [BEATBREAK] trait card from your trash without paying the cost."
        when: main
        process:
          - select_opponent_permanent:
              optional: false
              bind_as: to_delete
              filter: { kind: digimon, level_gte: 6 }
              prompt: Delete 1 opponent's level 6 or higher Digimon
          - delete_permanent: { target: to_delete }
          - select_trash:
              of: you
              bind_as: to_play
              optional: true
              filter: { trait_has: BEATBREAK, play_cost_lte: 4, can_play_from_effect_without_cost: true }
              prompt: You may play 1 BEATBREAK card with play cost 4 or less
          - play_from_trash_free: { of: you, hand_index: to_play }
