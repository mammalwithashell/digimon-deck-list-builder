card: BT27-064
name: Bearcatmon
kind: digimon
level: 5
color: [black]
cost: 7
dp: 7000
traits: [Beastkin, Glowing Dawn, BEATBREAK]

alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: black }
    cost: 3
  - kind: digivolve
    from: { any_color: true, level_eq: 4, trait_has: Glowing Dawn }
    cost: 3

effects:
  - text: "{Hand} [Main] If you have a Tamer with [Reina Sakuya] in its name, by placing 1 [Wolvermon] from your trash as any of your [Pristimon]'s bottom digivolution card, that Digimon digivolves into this card, ignoring level."
    when: main_from_hand
    condition:
      all_of:
        - any_permanent: { of: you, zone: [battle_area], kind: tamer, name_contains: Reina Sakuya }
        - any_permanent: { of: you, zone: [battle_area], kind: digimon, name_is: Pristimon }
        - count_gte:
            filter: { of: you, zone: [trash], kind: digimon, name_is: Wolvermon }
            n: 1
    process:
      - select_own_permanent:
          optional: false
          bind_as: base
          filter: { kind: digimon, name_is: Pristimon }
          prompt: Choose the Pristimon to digivolve
      - select_trash:
          optional: false
          of: you
          bind_as: material
          filter: { kind: digimon, name_is: Wolvermon }
          prompt: Choose the Wolvermon to place as a bottom digivolution card
      - place_as_bottom_source: { source: material, target: base }
      - effect_initiated_digivolve: { target: base, from_hand: self, cost: printed, ignore_level: true }
  - text: "[On Play] [When Digivolving] ＜De-Digivolve 1＞ 1 of your opponent's Digimon. Then, by trashing the bottom face-down card from under any of your Tamers, give 1 of their Digimon \"[Start of Your Main Phase] This Digimon attacks.\" until their turn ends."
    when: [on_play, when_digivolving]
    process:
      - select_opponent_permanent:
          bind_as: to_devolve
          optional: false
          filter: { kind: digimon }
          prompt: De-Digivolve 1 of your opponent's Digimon
      - de_digivolve: { target: to_devolve, amount: 1 }
      - trash_bottom_face_down_source_under_tamer: { of: you, optional: true }
      - select_opponent_permanent:
          bind_as: to_attack
          optional: false
          filter: { kind: digimon }
          prompt: Choose the Digimon that must attack
      - grant_triggered_effect:
          target: to_attack
          timing: start_of_your_main_phase
          expiry: end_of_opponents_turn
          body:
            - force_attack: { attacker: carrier, targets: any, prompt: This Digimon attacks }
  - text: "[All Turns] [Once Per Turn] When attack targets change, if this Digimon has the [Glowing Dawn] trait, by trashing the bottom face-down card from under any of your Tamers, trash your opponent's top security card."
    scope: inherited
    when: on_attack_target_change
    once_per_turn: true
    optional: true
    condition: { source_permanent_trait_has: Glowing Dawn, face_down_sources_under_tamers_gte: 1 }
    process:
      - trash_bottom_face_down_source_under_tamer: { of: you, optional: false }
      - trash_top_security: { of: opponent }
