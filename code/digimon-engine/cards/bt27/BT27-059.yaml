card: BT27-059
name: Clockmon
kind: digimon
level: 4
color: [black]
cost: 4
dp: 4000
form: Champion
attribute: Data
traits: [Machine]

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: black }
    cost: 2

effects:
  - text: "＜Blocker＞"
    kind: grant_keyword
    keyword: Blocker
  - text: "[On Play] [When Digivolving] Your opponent's ＜De-Digivolve＞ effects don't affect 1 of your Digimon until their turn ends. Then, if it's their turn, ＜De-Digivolve 1＞ 1 of their Digimon."
    when: [on_play, when_digivolving]
    process:
      - select_own_permanent:
          bind_as: protected
          optional: false
          filter: { kind: digimon }
          prompt: "Choose a Digimon to protect against opposing De-Digivolve"
      - add_modifier:
          target: protected
          modifier: CannotBeDeDigivolved
          value: 1
          expiry: end_of_opponents_turn
      - if:
          condition: { opponents_turn: true }
          then:
            - select_opponent_permanent:
                bind_as: victim
                optional: false
                filter: { kind: digimon }
                prompt: "Choose an opponent's Digimon to De-Digivolve"
            - de_digivolve: { target: victim, amount: 1, stop_at_level: 3 }
  - text: "[Opponent's Turn] [Once Per Turn] When any of your Digimon suspend, this Digimon may unsuspend."
    scope: inherited
    when: on_suspend
    once_per_turn: true
    optional: true
    active_when: { opponents_turn: true }
    condition: { source_is_unsuspended: false }
    trigger_if: { event_target_owner: you, event_target_kind: digimon }
    process:
      - unsuspend: { target: source }
