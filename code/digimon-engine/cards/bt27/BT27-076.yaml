card: BT27-076
name: "Gizmon: AT"
kind: digimon
level: 4
color: [purple]
cost: 6
dp: 6000
traits: ["Kurata's Army"]
form: Champion
attribute: Unknown

effects:
  - kind: cost_reduction
    when_playing_this: true
    optional: true
    text: "When this card would be played, by deleting 1 of your level 3 Digimon, reduce the cost by 4."
    pay_cost:
      - select_own_permanent:
          optional: false
          bind_as: payment
          filter: { kind: digimon, level_eq: 3 }
          prompt: "Choose 1 of your level 3 Digimon to delete"
      - delete_for_cost_reduction: { target: payment, fixed_amount: 4 }

  - when: on_play
    text: "[On Play] You may play 1 [Akihiro Kurata] from your hand without paying the cost."
    process:
      - select_hand:
          of: you
          optional: true
          bind_as: kurata
          filter: { kind: tamer, name_is: "Akihiro Kurata", can_play_from_effect_without_cost: true }
          prompt: "You may play 1 [Akihiro Kurata] from your hand without paying the cost"
      - play_from_hand_free: { of: you, hand_index: kurata }

  - kind: flood_gate
    modifier: CannotDigivolve
    target: { is_source_permanent: true }
    text: "[All Turns] This Digimon can't digivolve."
  - when: on_deletion
    optional: true
    condition:
      count_gte:
        filter: { owner: you, zone: [trash], name_contains: Gizmon }
        n: 2
    text: "[On Deletion] By returning 2 cards with [Gizmon] in their names from your trash to the bottom of the deck, you may play 1 [Gizmon: XT] from your trash without paying the cost."
    process:
      - select_count_capped_multi:
          of: you
          zone: trash
          min: 2
          max: 2
          optional_zero: false
          filter: { name_contains: Gizmon }
          bind_as: returns
          prompt: "Choose 2 [Gizmon] cards to return to the bottom of your deck"
      - return_trash_list_to_deck_bottom: { of: you, cards: returns }
      - select_trash:
          of: you
          optional: true
          bind_as: gizmon
          filter: { kind: digimon, name_is: "Gizmon: XT", can_play_from_effect_without_cost: true }
          prompt: "You may play 1 [Gizmon: XT] from your trash without paying the cost"
      - play_from_trash_free: { of: you, hand_index: gizmon }
