card: BT27-006
name: Gemmon
kind: digimon
level: 3
color: [red]
cost: 3
dp: 2000
traits: [Mythical Beast, ALYSION]
form: Rookie
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: red }
    cost: 0
  - kind: digivolve
    from: { any_color: true, level_eq: 2, in_text_contains: Gemmon }
    cost: 0

effects:
  - when: on_play
    text: "[On Play] Reveal the top 3 cards of your deck. Add 1 card with the [ALYSION] trait and 1 red Tamer card among them to the hand. Return the rest to the bottom of the deck."
    summary: "[On Play] Reveal 3; add a matching trait card and a red Tamer; bottom-deck the rest"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          no_duplicate_cards: true
          buckets:
            - bind_as: trait_pick
              min: 1
              max: 1
              filter: { trait_has: ALYSION }
            - bind_as: tamer_pick
              min: 1
              max: 1
              filter: { kind: tamer, color_is: red }
          prompt: "Add 1 matching trait card and 1 red Tamer to your hand"
      - add_to_hand_from_reveal: { of: you, card: trait_pick }
      - add_to_hand_from_reveal: { of: you, card: tamer_pick }
      - place_remainder_on_deck: { of: you, position: bottom }

  - scope: inherited
    text: "[Your Turn] This Digimon gets +2000 DP."
    kind: aura
    active_when: { your_turn: true }
    target: {}
    dp_modifier: 2000
    summary: "Inherited [Your Turn] This Digimon gets +2000 DP"
