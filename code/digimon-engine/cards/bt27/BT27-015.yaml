card: BT27-015
name: Ouryumon
kind: digimon
level: 6
color: [red, black]
cost: 12
dp: 12000
traits: [Beast Dragon, X Antibody, Chronicle]
form: Mega
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from:
      any_color: true
      any_of:
        - { name_is: Hisyaryumon }
        - { level_eq: 5, trait_has: Chronicle }
    cost: 3
  - kind: assembly
    cost: 5
    materials:
      - filter: { kind: digimon, level_eq: 5, trait_has: Chronicle }
        zones: [trash]
        stack_under: true
      - filter: { kind: digimon, level_eq: 4, trait_has: Chronicle }
        zones: [trash]
        stack_under: true
      - filter: { kind: digimon, level_eq: 3, trait_has: Chronicle }
        zones: [trash]
        stack_under: true

effects:
  - { text: "＜Piercing＞", kind: grant_keyword, keyword: Piercing }
  - { text: "＜Reboot＞", kind: grant_keyword, keyword: Reboot }
  - { text: "＜Blocker＞", kind: grant_keyword, keyword: Blocker }
  - text: "[On Play] [When Digivolving] Delete 1 of your opponent's Digimon with as much DP as 1 of your Digimon or less. Then, if during an attack, trash their top security card."
    when: [on_play, when_digivolving]
    process:
      - select_own_permanent:
          optional: false
          bind_as: comparison
          filter: { kind: digimon }
          prompt: "Choose 1 of your Digimon as the DP limit"
      - select_opponent_permanent:
          optional: false
          bind_as: victim
          filter: { kind: digimon, dp_lte: { formula: { binding_dp: comparison } } }
          prompt: "Delete 1 opponent Digimon within the DP limit"
      - delete_permanent: { target: victim }
      - if:
          condition: { during_attack: true }
          then:
            - trash_top_security: { of: opponent }
  - text: "[All Turns] [Once Per Turn] When security stacks are removed from, you may play or use 1 [Chronicle] trait Tamer or Option card from your hand without paying the cost."
    when: [on_own_security_removed, on_opponent_security_removed]
    once_per_turn: true
    process:
      - select_hand:
          of: you
          bind_as: selected
          optional: true
          filter:
            trait_has: Chronicle
            can_play_or_use_from_effect: true
            any_of: [{ kind: tamer }, { kind: option }, { kind: dual }]
          prompt: "Play or use a [Chronicle] Tamer or Option without paying the cost"
      - if:
          condition: { binding_present: selected }
          then:
            - play_or_use_from_hand: { of: you, hand_index: selected, cost_delta: free }
          else:
            - refund_opt: {}
  - text: "[All Turns] [Once Per Turn] When security stacks are removed from, this [Alphamon: Ouryuken] may unsuspend."
    scope: inherited
    when: [on_own_security_removed, on_opponent_security_removed]
    once_per_turn: true
    optional: true
    condition: { source_name_is: "Alphamon: Ouryuken", source_is_unsuspended: false }
    process:
      - unsuspend: { target: source }
