card: BT27-080
name: ScourgeChiropmon
kind: digimon
level: 5
color: [purple]
cost: 7
dp: 7000
traits: [Machine, Glowing Dawn, BEATBREAK]

alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: purple }
    cost: 3
  - kind: digivolve
    from: { any_color: true, level_eq: 4, trait_has: Glowing Dawn }
    cost: 3

effects:
  - text: "{Hand} [Main] If you have a Tamer with [Makoto Kuonji] in its name, by placing 1 [NightChiropmon] from your trash as any of your [Chiropmon]'s bottom digivolution card, that Digimon digivolves into this card, ignoring level."
    when: main_from_hand
    condition:
      all_of:
        - any_permanent: { of: you, zone: [battle_area], kind: tamer, name_contains: Makoto Kuonji }
        - any_permanent: { of: you, zone: [battle_area], kind: digimon, name_is: Chiropmon }
        - count_gte:
            filter: { of: you, zone: [trash], kind: digimon, name_is: NightChiropmon }
            n: 1
    process:
      - select_own_permanent:
          optional: false
          bind_as: base
          filter: { kind: digimon, name_is: Chiropmon }
          prompt: Choose the Chiropmon to digivolve
      - select_trash:
          optional: false
          of: you
          bind_as: material
          filter: { kind: digimon, name_is: NightChiropmon }
          prompt: Choose the NightChiropmon to place as a bottom digivolution card
      - place_as_bottom_source: { source: material, target: base }
      - effect_initiated_digivolve: { target: base, from_hand: self, cost: printed, ignore_level: true }
  - text: "[On Play] [When Digivolving] Delete 1 of your opponent's level 4 or lower Digimon. Then, by trashing the bottom face-down card from under any of your Tamers, this Digimon gains ＜Rush＞ and ＜Piercing＞ for the turn."
    when: [on_play, when_digivolving]
    process:
      - select_opponent_permanent:
          bind_as: to_delete
          optional: false
          filter: { kind: digimon, level_lte: 4 }
          prompt: Delete an opponent's level 4 or lower Digimon
      - delete_permanent: { target: to_delete }
      - trash_bottom_face_down_source_under_tamer: { of: you, optional: true }
      - grant_keyword: { target: source, keyword: Rush, expiry: end_of_turn }
      - grant_keyword: { target: source, keyword: Piercing, expiry: end_of_turn }
  - text: "[On Deletion] You may play 1 play cost 5 or lower [Glowing Dawn] trait card from your trash without paying the cost."
    scope: inherited
    when: on_deletion
    process:
      - select_trash:
          of: you
          bind_as: revival
          optional: true
          filter: { trait_has: Glowing Dawn, play_cost_lte: 5, can_play_from_effect_without_cost: true }
          prompt: You may play a Glowing Dawn card with play cost 5 or less
      - play_from_trash_free: { of: you, hand_index: revival }
