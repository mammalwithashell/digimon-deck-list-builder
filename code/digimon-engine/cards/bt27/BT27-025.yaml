    summary: "[On Play][When Digivolving] 1 of your Digimon can't be deleted in battle until your opponent's turn ends; if played by effects, it also gains <Blocker>"
    process:
      - select_own_permanent:
          optional: false
          bind_as: guarded
          filter: { kind: digimon }
          prompt: "Choose 1 of your Digimon that can't be deleted in battle until your opponent's turn ends"
      - add_modifier:
          target: guarded
          modifier: CannotBeDestroyedByBattle
          value: 1
          expiry: end_of_opponents_turn
      - if:
          condition: { played_by_effect: true }
          then:
            - grant_keyword:
                target: guarded
                keyword: Blocker
                expiry: end_of_opponents_turn

  - text: "＜Evade＞"
