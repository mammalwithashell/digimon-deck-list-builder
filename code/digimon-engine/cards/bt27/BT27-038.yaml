card: BT27-038
name: "Quetzalmon"
kind: digimon
level: 4
color: [yellow, purple]
cost: 5
dp: 6000
traits: ["Mythical Beast", "Kurata's Army", Bio]
form: Armor Form
attribute: Free

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 3
  - kind: digivolve
    from: { level_eq: 3, color_is: purple }
    cost: 3

effects:
  - kind: grant_keyword
    keyword: ArmorPurge
    text: "＜Armor Purge＞"

  - when: [on_play, when_digivolving, when_attacking]
    once_per_turn: true
    text: "[On Play] [When Digivolving] [When Attacking] [Once Per Turn] Give 1 of your opponent's Digimon ＜Security A. -1＞ until their turn ends. Then, by choosing 1 of your Digimon, delete the chosen Digimon, and 1 of their Digimon gets -6000 DP until their turn ends."
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: security_target
          filter: { kind: digimon }
          prompt: "Give 1 opposing Digimon Security A. -1 until their turn ends"
      - grant_keyword:
          target: security_target
          keyword: SecurityAttackMinus
          value: 1
          expiry: end_of_opponents_turn
      - select_own_permanent:
          optional: true
          continue_on_decline: true
          bind_as: sacrifice
          filter: { kind: digimon }
          prompt: "Choose 1 of your Digimon to delete"
      - if:
          condition: { binding_present: sacrifice }
          then:
            - select_opponent_permanent:
                optional: false
                bind_as: victim
                filter: { kind: digimon }
                prompt: "Choose 1 opposing Digimon to get -6000 DP"
            - delete_permanent: { target: sacrifice }
            - add_dp_modifier: { target: victim, value: -6000, expiry: end_of_opponents_turn }
      - if:
          condition:
            all_of:
              - not: { binding_present: sacrifice }
              - not: { binding_present: security_target }
          then:
            - refund_opt: {}
