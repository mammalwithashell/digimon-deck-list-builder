card: BT27-073
name: Chiropmon
kind: digimon
level: 3
color: [purple]
cost: 3
dp: 2000
traits: [Mammal, Glowing Dawn, BEATBREAK]

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: purple }
    cost: 0
  - kind: digivolve
    from: { any_color: true, level_eq: 2, trait_has: Glowing Dawn }
    cost: 0

effects:
  - text: "[Your Turn] When this Digimon would digivolve into a purple Digimon card with the [BEATBREAK] trait, reduce the cost by 1."
    kind: cost_reduction
    reduction_timing: before_pay_cost
    active_when:
      all_of:
        - your_turn: true
        - source_is_cost_target_permanent: true
        - not: { in_breeding: true }
        - cost_target: { kind: digimon, color_is: purple, trait_has: BEATBREAK }
    amount: 1
  - text: "[When Attacking] [Once Per Turn] ＜Draw 1＞ and trash 1 card in your hand."
    scope: inherited
    when: when_attacking
    once_per_turn: true
    process:
      - draw: { of: you, count: 1 }
      - select_hand:
          optional: false
          of: you
          bind_as: discard
          filter: {}
          prompt: Trash 1 card in your hand
      - trash_from_hand_by_index: { of: you, hand_index: discard }
