# Source: data/card_bundles/BT27-024.md (official Bandai text).
# DCGO C# reference: DCGO2 Assets/Scripts/CardEffect/BT27/Blue/BT27_024.cs
#   (Jamming; trash maxCount = opponent hand / 4 * 2 sources across their
#   Digimon; then, if any sourceless opposing Digimon exists, a mandatory pick
#   gains can't-suspend until their turn ends. Inherited OPT both draw 1.)
card: BT27-024
name: Gaogamon
kind: digimon
level: 4
color: [blue]
cost: 5
dp: 5000
traits: [Beast, DATA SQUAD]
form: Champion
attribute: Data

alt_paths:
  - kind: digivolve
    from: { any_color: true, level_eq: 3, trait_has: DATA SQUAD }
    cost: 2

effects:
  - text: "＜Jamming＞"
    kind: grant_keyword
    keyword: Jamming
    summary: "<Jamming>"

  - text: "[On Play] [When Digivolving] For every 4 cards your opponent's hand has, trash any 2 digivolution cards from their Digimon. Then, 1 of their Digimon with no digivolution cards can't suspend until their turn ends."
    when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] For every 4 cards in your opponent's hand, trash any 2 digivolution cards from their Digimon. Then 1 of their Digimon with no digivolution cards can't suspend until their turn ends"
    process:
      - select_opponent_sources:
          filter: { host_kind_is: digimon }
          min:
            formula:
              multiply:
                - 2
                - floor_div:
                    - { base: 0, per: { card_count_in_zone: { of: opponent, zone: hand } }, delta: 1 }
                    - 4
          max:
            formula:
              multiply:
                - 2
                - floor_div:
                    - { base: 0, per: { card_count_in_zone: { of: opponent, zone: hand } }, delta: 1 }
                    - 4
          clamp_to_available: true
          bind_as: stripped
          prompt: "Trash any 2 digivolution cards from your opponent's Digimon for every 4 cards in their hand"
          then:
            - trash_selected_sources: { source_refs: stripped }
      - select_opponent_permanent:
          optional: false
          bind_as: locked
          filter:
            kind: digimon
            not: { source_count: { filter: {}, at_least: 1 } }
          prompt: "Choose 1 of your opponent's Digimon with no digivolution cards that can't suspend until their turn ends"
      - add_modifier:
          target: locked
          modifier: CannotSuspend
          value: 1
          expiry: end_of_opponents_turn

  - text: "[When Attacking] [Once Per Turn] Both players ＜Draw 1＞."
    scope: inherited
    when: when_attacking
    once_per_turn: true
    summary: "[Inherited][When Attacking][Once Per Turn] Both players <Draw 1>"
    process:
      - draw: { of: you, count: 1 }
      - draw: { of: opponent, count: 1 }
