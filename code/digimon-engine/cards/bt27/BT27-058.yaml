card: BT27-058
name: Wolvermon
kind: digimon
level: 4
color: [black]
cost: 4
dp: 5000
traits: [Cyborg, Glowing Dawn, BEATBREAK]

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: black }
    cost: 2
  - kind: digivolve
    from: { any_color: true, level_eq: 3, trait_has: Glowing Dawn }
    cost: 2

effects:
  - text: "[Security] [When Digivolving] If you have 1 or fewer Tamers, you may play 1 Tamer card with [Reina Sakuya] in its name from your hand without paying the cost."
    when: [on_security, when_digivolving]
    condition:
      count_lte:
        filter: { of: you, zone: [battle_area], kind: tamer }
        n: 1
    process:
      - select_hand:
          of: you
          optional: true
          bind_as: tamer
          filter: { kind: tamer, name_contains: "Reina Sakuya", can_play_from_effect_without_cost: true }
          prompt: You may play a Tamer with Reina Sakuya in its name
      - play_from_hand_free: { of: you, hand_index: tamer }
  - text: "＜Blocker＞ (This Digimon can block in the blocker timing.)"
    kind: grant_keyword
    scope: inherited
    keyword: Blocker
