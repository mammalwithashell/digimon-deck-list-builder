card: BT27-094
name: Reina Sakuya
kind: tamer
color: [black]
cost: 4
traits: [Glowing Dawn, BEATBREAK]

effects:
  - text: "[Start of Your Turn] If you have 2 or less memory, set it to 3."
    when: start_of_your_turn
    condition: { memory_lte: 2 }
    process:
      - set_memory: 3
  - text: "[All Turns] When a Digimon attacks, by suspending this Tamer, you may place the top 2 cards of your deck face down under this Tamer. After, if it's your opponent's turn, by trashing 4 bottom face-down cards from under any of your Tamers, you may use 1 black [BEATBREAK] trait Option card from your hand without paying the cost."
    when: [on_ally_attack, on_opponent_attack]
    condition: { source_is_unsuspended: true, can_change_orientation: true }
    process:
      - select_effect_choice:
          bind_as: choice
          labels: [Suspend and place the top 2 cards, Only suspend, Do not suspend]
          prompt: Will you suspend this Tamer to stash the top 2 cards?
      - if:
          condition: { not: { equals: [choice, 2] } }
          then:
            - suspend: { target: source }
            - if:
                condition: { equals: [choice, 0], source_is_unsuspended: false }
                then:
                  - place_deck_top_under: { of: you, count: 2, target: source, face_down: true }
            - if:
                condition: { your_turn: false, face_down_sources_under_tamers_gte: 4, source_is_unsuspended: false }
                then:
                  - select_effect_choice:
                      bind_as: pay
                      labels: [Trash 4 and use an Option, Do not trash]
                      prompt: Will you trash 4 bottom face-down cards from under your Tamers?
                  - if:
                      condition: { equals: [pay, 0] }
                      then:
                        - trash_bottom_face_down_sources_under_tamers: { of: you, count: 4 }
                        - select_hand:
                            of: you
                            optional: true
                            bind_as: option_pick
                            filter: { kind: option, color_is: black, trait_has: BEATBREAK, can_play_or_use_from_effect: true }
                            prompt: You may use 1 black BEATBREAK Option from your hand
                        - use_option_bound: { binding: option_pick, cost: free }
  - text: "[Security] Play this card without paying the cost."
    when: on_security
    process:
      - play_from_security: {}
