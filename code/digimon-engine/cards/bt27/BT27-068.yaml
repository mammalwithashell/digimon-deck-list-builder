card: BT27-068
name: "Gankoomon (X Antibody)"
kind: dual
level: 6
dp: 13000
cost: 5
color: [black, white]
traits: [Holy Warrior, X Antibody, Royal Knight]
form: Mega
attribute: Data

alt_paths:
  - kind: digivolve
    from: { any_color: true, name_is: Gankoomon }
    cost: 2

dual:
  digimon:
    level: 6
    dp: 13000
    colors: [black, white]
    traits: [Holy Warrior, X Antibody, Royal Knight]
    effects:
      - { text: "＜Collision＞", kind: grant_keyword, keyword: Collision }
      - { text: "＜Reboot＞", kind: grant_keyword, keyword: Reboot }
      - { text: "＜Blocker＞", kind: grant_keyword, keyword: Blocker }
      - text: "[All Turns] When this Digimon would leave the battle area, by returning 1 of your other Digimon or 1 [Gankoomon] or [X Antibody] from this Digimon's digivolution cards to the bottom of the deck, it doesn't leave."
        kind: replacement
        trigger: when_would_leave_battle_area
        optional: true
        process:
          - select_effect_choice:
              labels: ["Return another Digimon", "Return a digivolution card", "Do not return a card"]
              legal_when:
                - any_permanent: { of: you, kind: digimon, other: true }
                - self_source_count: { filter: { any_of: [{ name_is: Gankoomon }, { name_is: X Antibody }] }, op: gte, value: 1 }
                - {}
              bind_as: payment_kind
              prompt: "Choose a card to return to the bottom of the deck"
          - if:
              condition: { equals: [payment_kind, 0] }
              then:
                - select_own_permanent:
                    optional: false
                    bind_as: returned
                    filter: { kind: digimon, other: true }
                    prompt: "Return 1 of your other Digimon to the bottom of the deck"
                - return_to_deck: { target: returned, position: bottom }
          - if:
              condition: { equals: [payment_kind, 1] }
              then:
                - select_union_zone:
                    of: you
                    optional: false
                    zones: [material]
                    material_of: source
                    bind_as: returned_source
                    filter: { any_of: [{ name_is: Gankoomon }, { name_is: X Antibody }] }
                    prompt: "Return a [Gankoomon] or [X Antibody] digivolution card to the bottom of the deck"
                - return_union_bound_to_deck: { binding: returned_source, position: bottom }
          - if:
              condition: { effect_returned_any_card: true }
              then:
                - cancel_replacement: {}
      - text: "[All Turns] [Once Per Turn] When any of your Digimon leave the battle area, you may activate 1 [Main] effect on this card's Option side."
        when: on_leave_field
        trigger_if: { event_target_owner: you, event_target_kind: digimon }
        once_per_turn: true
        optional: true
        process:
          - refire_effect: { source: source, timing: option_main, optional: false }
  option:
    use_cost: 5
    colors: [white]
    use_requirement:
      any_field_permanent:
        of: you
        any_of: [{ kind: digimon }, { kind: tamer }]
        in_text_contains: Huckmon
    arts_digivolve: true
    effect_text: "[Main] Return 1 of your opponent's 12000 DP or higher Digimon to the top of the deck. If this effect didn't return, delete 1 of your opponent's lowest play cost Digimon."
    effects:
      - text: "[Main] Return 1 of your opponent's 12000 DP or higher Digimon to the top of the deck. If this effect didn't return, delete 1 of your opponent's lowest play cost Digimon."
        when: main
        process:
          - select_opponent_permanent:
              optional: false
              bind_as: returned
              filter: { kind: digimon, dp_gte: 12000 }
              prompt: "Return 1 opponent Digimon with 12000 DP or more to the top of the deck"
          - return_to_deck: { target: returned, position: top }
          - if:
              condition: { effect_returned_any_card: false }
              then:
                - select_opponent_permanent:
                    optional: false
                    bind_as: victim
                    selector: lowest_play_cost
                    filter: { kind: digimon }
                    prompt: "Delete 1 opponent Digimon with the lowest play cost"
                - delete_permanent: { target: victim }
