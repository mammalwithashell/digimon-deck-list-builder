# Official English card image and category 522040, checked 2026-11-22:
# https://world.digimoncard.com/images/cardlist/card/BT27-047.png
# https://world.digimoncard.com/cards/index.php?category=522040&search=true
# No card-specific Q&A is attached to this entry in that category.
# Ordinary green/yellow Lv.3 cost 3; Gammamon OR Lv.3 VB cost 2.
# Inherited Piercing is mandatory (CR 4.3 16-7) and is not a face keyword.
# Native behavioral coverage is separate from canonical metadata/admission.
card: BT27-047
name: WezenGammamon
kind: digimon
level: 4
color: [green, yellow]
cost: 4
dp: 5000
form: Champion
attribute: Data
traits: [Ceratopsian, VB]

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: green }
    cost: 3
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 3
  - kind: digivolve
    from:
      any_of:
        - name_is: Gammamon
        - all_of:
            - level_eq: 3
            - trait_has: VB
    cost: 2

effects:
  - when: [on_move, on_play]
    timing_conditions:
      - when: on_move
        condition: { event_permanent_is_source: true }
    summary: "[When Moving] [On Play] Suspend 1 of your opponent's Digimon."
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Suspend 1 of your opponent's Digimon"
      - suspend: { target: target }

  - when: when_attacking
    once_per_turn: true
    summary: "[When Attacking] [Once Per Turn] This Digimon gets +5000 DP for the turn."
    process:
      - add_dp_modifier:
          target: source
          value: 5000
          expiry: end_of_turn

  - scope: inherited
    kind: grant_keyword
    keyword: Piercing
    summary: "[Inherited] <Piercing>"
