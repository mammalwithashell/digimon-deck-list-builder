# Source: data/card_bundles/BT27-096.md (official Bandai text + Q&A).
# DCGO C# reference: DCGO2 Assets/Scripts/CardEffect/BT27/Purple/BT27_096.cs
# Q&A: "with [Ravemon] in its text" covers name, traits, effects and requirements.
card: BT27-096
name: Keenan Crier
kind: tamer
color: [purple]
cost: 4
traits: [DATA SQUAD]

effects:
  - text: "[Start of Your Turn] If you have 2 or less memory, set it to 3."
    when: start_of_your_turn
    condition: { memory_lte: 2 }
    summary: "[Start of Your Turn] If you have 2 or less memory, set it to 3"
    process:
      - set_memory: 3

  - text: "[All Turns] When hands are trashed from, by suspending this Tamer, you may place the top 2 cards of your deck face down under this Tamer."
    when: on_discard_hand
    optional: true
    active_when: { all_turns: true }
    condition: { source_is_unsuspended: true }
    summary: "[All Turns] When hands are trashed from, by suspending this Tamer, you may place the top 2 cards of your deck face down under this Tamer"
    process:
      - activation_cost: { suspend_self: true }
      - place_deck_top_under:
          of: you
          count: 2
          target: source
          face_down: true

  - text: "[Main] [Once Per Turn] By trashing 5 bottom face-down cards from under any of your Tamers, you may use 1 Option card with [Ravemon] in its text from your trash without paying the cost."
    when: main_on_field
    once_per_turn: true
    condition: { face_down_sources_under_tamers_gte: 5 }
    summary: "[Main] [Once Per Turn] By trashing 5 bottom face-down cards from under your Tamers, you may use 1 Option card with [Ravemon] in its text from your trash without paying the cost"
    process:
      - trash_bottom_face_down_sources_under_tamers: { of: you, count: 5 }
      - use_option_from_trash:
          of: you
          optional: true
          filter:
            all_of:
              - kind: option
              - in_text_contains: Ravemon
          cost: free
          prompt: "You may use 1 Option card with [Ravemon] in its text from your trash without paying the cost"

  - text: "[Security] Play this card without paying the cost."
    when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
