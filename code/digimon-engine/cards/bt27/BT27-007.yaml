card: BT27-007
name: Solarmon
kind: digimon
level: 3
color: [red]
cost: 3
dp: 2000
form: Rookie
attribute: Vaccine
traits: [Machine, Flame]

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: red }
    cost: 0
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 0
  - kind: digivolve
    from: { level_eq: 2, any_color: true, trait_has: Flame }
    cost: 0

effects:
  - text: "[Start of Your Main Phase] By trashing 1 card with the [Flame] or [Machine] trait from your hand, ＜Draw 1＞ and gain 1 memory."
    when: start_of_your_main_phase
    process:
      - select_hand:
          of: you
          bind_as: payment
          optional: true
          filter: { any_of: [{ trait_has: Flame }, { trait_has: Machine }] }
          prompt: "Trash a Flame or Machine card to draw 1 and gain 1 memory?"
      - if:
          condition: { binding_present: payment }
          then:
            - trash_from_hand_by_index: { of: you, hand_index: payment }
            - draw: { of: you, count: 1 }
            - gain_memory: 1
  - text: "[On Deletion] Delete 1 of your opponent's Digimon with 6000 DP or less."
    scope: inherited
    when: on_deletion
    process:
      - select_opponent_permanent:
          bind_as: victim
          optional: false
          filter: { kind: digimon, dp_lte: 6000 }
          prompt: "Delete an opponent's Digimon with 6000 DP or less"
      - delete_permanent: { target: victim }
