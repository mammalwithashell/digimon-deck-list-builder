card: BT27-029
name: Sekkamon
kind: digimon
level: 5
color: [blue]
cost: 7
dp: 7000
traits: [Beastkin, Ice-Snow, ALYSION]
form: Ultimate
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: blue }
    cost: 3

effects:
  - kind: grant_keyword
    text: "＜Iceclad＞"
    keyword: Iceclad

  - when: [on_play, when_digivolving]
    text: "[On Play] [When Digivolving] Trash any 3 digivolution cards from your opponent's Digimon. Then, if they don't have a Digimon with digivolution cards, this Digimon gains ＜Blocker＞ and can't be deleted other than in battle until their turn ends."
    summary: "[On Play][When Digivolving] Trash any 3 opposing digivolution cards; if none remain, gain Blocker and non-battle deletion protection until their turn ends"
    process:
      - select_opponent_sources:
          min: 3
          max: 3
          clamp_to_available: true
          bind_as: materials
          prompt: "Trash any 3 digivolution cards from your opponent's Digimon"
          then:
            - trash_selected_sources: { source_refs: materials }
      - if:
          condition:
            not:
              any_permanent: { of: opponent, zone: [battle_area], kind: digimon, materials_count_gte: 1 }
          then:
            - grant_keyword: { target: source, keyword: Blocker, expiry: end_of_opponents_turn }
            - add_modifier:
                target: source
                modifier: CannotBeDestroyedOutsideBattle
                value: 1
                expiry: end_of_opponents_turn

  - scope: inherited
    text: "[End of Your Turn] [Once Per Turn] Trash the bottom 2 digivolution cards of 1 of your opponent's Digimon. If this effect didn't trash, this [Ice-Snow] trait Digimon may unsuspend."
    when: end_of_your_turn
    once_per_turn: true
    summary: "Inherited [End of Your Turn][OPT] Trash the bottom 2 sources of 1 opposing Digimon; if none were trashed, this Ice-Snow Digimon may unsuspend"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: victim
          filter: { kind: digimon }
          prompt: "Trash the bottom 2 digivolution cards of 1 of your opponent's Digimon"
      - trash_bottom_sources: { target: victim, count: 2, bind_trashed_as: trashed }
      - if:
          condition: { binding_absent: trashed }
          then:
            - select_own_permanent:
                bind_as: to_unsuspend
                optional: true
                filter: { is_source: true, trait_has: Ice-Snow, is_suspended: true, can_unsuspend: true }
                prompt: "You may unsuspend this Digimon"
            - unsuspend: { target: to_unsuspend }
