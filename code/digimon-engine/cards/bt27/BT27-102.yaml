card: BT27-102
name: "Bio Hybrid Digivolution"
kind: option
color: [purple]
cost: 3
traits: ["Kurata's Army"]

effects:
  - when: main_from_hand
    text: "[Main] You may play 1 [Kurata's Army] trait Tamer card from your hand or trash without paying the cost. Then, place this card in the battle area."
    process:
      - select_union_zone:
          of: you
          zones: [hand, trash]
          optional: true
          bind_as: played
          filter: { kind: tamer, trait_has: "Kurata's Army", can_play_from_effect_without_cost: true }
          prompt: "You may play 1 [Kurata's Army] Tamer from your hand or trash"
      - play_union_bound_free: { binding: played }
      - place_self_as_delay_option: {}

  - kind: delay
    trigger: on_any_deletion
    active_when: { all_turns: true, event_target_kind: digimon }
    text: "[All Turns] When any Digimon on the field are deleted, ＜Delay＞. ・1 of your Tamers may digivolve into a [Kurata's Army] trait Digimon card in the hand or trash without paying the cost."
    process:
      - select_own_permanent:
          optional: true
          bind_as: tamer
          filter: { kind: tamer }
          prompt: "You may choose 1 of your Tamers to digivolve"
      - select_union_zone:
          of: you
          zones: [hand, trash]
          bind_as: evolution
          optional: true
          filter:
            kind: digimon
            trait_has: "Kurata's Army"
            can_digivolve_onto_with_cost: { target: tamer, cost: free }
          prompt: "You may digivolve the Tamer into a [Kurata's Army] Digimon for free"
      - effect_initiated_digivolve:
          target: tamer
          source: evolution
          cost: free

  - when: on_security
    text: "[Security] You may play 1 play cost 5 or lower [Kurata's Army] trait card from your hand or trash without paying the cost."
    process:
      - select_union_zone:
          of: you
          zones: [hand, trash]
          optional: true
          bind_as: played
          filter: { trait_has: "Kurata's Army", play_cost_lte: 5, can_play_from_effect_without_cost: true }
          prompt: "You may play 1 [Kurata's Army] card with play cost 5 or lower"
      - play_union_bound_free: { binding: played }
