card: BT27-009
name: Ginryumon
kind: digimon
level: 4
color: [red, black]
cost: 5
dp: 5000
traits: [Beast Dragon, X Antibody, Chronicle]
form: Champion
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from:
      any_color: true
      any_of:
        - { name_is: Ryudamon }
        - { level_eq: 3, trait_has: Chronicle }
    cost: 2

effects:
  - text: "[On Play] [When Digivolving] 1 of your Digimon gets +3000 DP until your opponent's turn ends."
    when: [on_play, when_digivolving]
    process:
      - select_own_permanent:
          optional: false
          bind_as: boosted
          filter: { kind: digimon }
          prompt: "Give 1 of your Digimon +3000 DP until your opponent's turn ends"
      - add_dp_modifier: { target: boosted, value: 3000, expiry: end_of_opponents_turn }
  - text: "[When Attacking] This Digimon may digivolve into a Digimon card with the [Chronicle] trait in the hand or trash."
    when: when_attacking
    process:
      - select_union_zone:
          of: you
          zones: [hand, trash]
          bind_as: evolution
          optional: true
          filter: { kind: digimon, trait_has: Chronicle, can_digivolve_from_source: true }
          prompt: "Digivolve into a [Chronicle] Digimon in your hand or trash"
      - effect_initiated_digivolve: { target: source, source: evolution, cost: printed }
  - text: "[Your Turn] This Digimon gets +2000 DP."
    kind: aura
    scope: inherited
    active_when: { your_turn: true }
    target: {}
    dp_modifier: 2000
