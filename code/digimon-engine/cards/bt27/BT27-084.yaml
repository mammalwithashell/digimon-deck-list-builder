card: BT27-084
name: "LordKnightmon (X Antibody)"
kind: dual
level: 6
dp: 12000
cost: 5
color: [purple, black]
traits: [Holy Warrior, X Antibody, Royal Knight]
form: Mega
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { any_color: true, name_is: LordKnightmon }
    cost: 2

dual:
  digimon:
    level: 6
    dp: 12000
    colors: [purple, black]
    traits: [Holy Warrior, X Antibody, Royal Knight]
    effects:
      - { text: "＜Alliance＞", kind: grant_keyword, keyword: Alliance }
      - { text: "＜Collision＞", kind: grant_keyword, keyword: Collision }
      - { text: "＜Piercing＞", kind: grant_keyword, keyword: Piercing }
      - { text: "＜Blocker＞", kind: grant_keyword, keyword: Blocker }
      - text: "[When Digivolving] You may play up to 8 play cost's total worth of cards with [Knightmon] in their texts from your hand without paying the cost."
        when: when_digivolving
        process:
          - select_zone_cards:
              of: you
              zones: [hand]
              filter: { in_text_contains: Knightmon, can_play_from_effect_without_cost: true }
              play_cost_budget: 8
              bind_as: selected
              prompt: "Play up to 8 total play cost of [Knightmon]-text cards"
          - play_cards_free: { cards: selected }
      - text: "[All Turns] [Once Per Turn] When any of your other Digimon are played or deleted, by trashing 1 [LordKnightmon] or [X Antibody] from this Digimon's digivolution cards, activate 1 [Main] effect on this card's Option side."
        when: [on_any_digimon_played, on_any_deletion]
        trigger_if: { event_target_owner: you, event_target_kind: digimon, event_target_is_source: false }
        once_per_turn: true
        process:
          - select_own_sources:
              target: source
              bind_as: payment
              min: 0
              max: 1
              filter: { any_of: [{ name_is: LordKnightmon }, { name_is: X Antibody }] }
              prompt: "Trash a [LordKnightmon] or [X Antibody] digivolution card"
          - trash_selected_sources_as_cost: { source_refs: payment, min_count: 0 }
          - if:
              condition: { binding_count_eq: { binding: payment, n: 0 } }
              then:
                - refund_opt: {}
              else:
                - refire_effect: { source: source, timing: option_main, optional: false }
  option:
    use_cost: 5
    colors: [purple, black]
    arts_digivolve: true
    effect_text: "[Main] Delete 1 of your opponent's lowest level Digimon. If this effect didn't delete, until your turn ends, all of your Digimon with [Knightmon] in their texts gain ＜Blocker＞, your opponent's Digimon effects don't affect them and they get +3000 DP."
    effects:
      - text: "[Main] Delete 1 of your opponent's lowest level Digimon. If this effect didn't delete, until your turn ends, all of your Digimon with [Knightmon] in their texts gain ＜Blocker＞, your opponent's Digimon effects don't affect them and they get +3000 DP."
        when: main
        process:
          - select_opponent_permanent:
              optional: false
              bind_as: victim
              filter: { kind: digimon, level_matches_aggregate: { selector: lowest_level, of: opponent } }
              prompt: "Delete 1 opponent Digimon with the lowest level"
          - delete_permanent: { target: victim }
          - if:
              condition: { effect_deleted_any_opponent_digimon: false }
              then:
                - for_each:
                    over: { of: you, zone: [battle_area], kind: digimon, in_text_contains: Knightmon }
                    bind_as: recipient
                    body:
                      - grant_keyword: { target: recipient, keyword: Blocker, expiry: end_of_your_turn }
                      - grant_effect_immunity: { target: recipient, source_kind: digimon, source_controller: opponent, expiry: end_of_your_turn }
                      - add_dp_modifier: { target: recipient, value: 3000, expiry: end_of_your_turn }
