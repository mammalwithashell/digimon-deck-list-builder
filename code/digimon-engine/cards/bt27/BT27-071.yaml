card: BT27-071
name: "Darkdramon"
kind: digimon
level: 6
color: [black, purple]
cost: 11
dp: 11000
traits: [Cyborg, "Kurata's Army", Bio]
form: Mega
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { name_is: "Thunderbirdmon", trait_has: Bio }
    cost: 5

effects:
  - kind: grant_keyword
    keyword: Reboot
    text: "＜Reboot＞"
  - kind: grant_keyword
    keyword: Blocker
    text: "＜Blocker＞"
  - kind: grant_keyword
    keyword: ArmorPurge
    text: "＜Armor Purge＞"

  - when: when_digivolving
    text: "[When Digivolving] Your opponent's Digimon effects don't affect this Digimon until their turn ends."
    process:
      - grant_effect_immunity:
          target: source
          source_kind: digimon
          source_controller: opponent
          expiry: end_of_opponents_turn

  - when: [when_attacking, counter]
    once_per_turn: true
    text: "[When Attacking] [Counter] [Once Per Turn] ＜De-Digivolve 2＞ 1 of your opponent's Digimon."
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: victim
          filter: { kind: digimon }
          prompt: "De-Digivolve 2 one of your opponent's Digimon"
      - de_digivolve: { target: victim, amount: 2 }

  - kind: flood_gate
    modifier: CannotDigivolve
    target: { is_source_permanent: true }
    text: "[All Turns] This Digimon can't digivolve."
