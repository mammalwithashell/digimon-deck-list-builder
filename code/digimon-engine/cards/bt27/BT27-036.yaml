# Source: data/card_bundles/BT27-036.md (official Bandai text and Q&A).
# DCGO C# reference: DCGO2 Assets/Scripts/CardEffect/BT27/Yellow/BT27_036.cs
#   (SimplifiedRevealDeckTopCardsAndSelect: HasText("Chessmon") then
#   EqualsTraits("DATA SQUAD"), mutualConditions, rest to deck bottom.
#   Inherited When Attacking OPT: mandatory -2000 DP for the turn.)
# Overlap: per Q4704 a card matching both categories may fill the first pick
#   even when that leaves the second pick empty (BT3-093 / BT18-030 idiom).
card: BT27-036
name: PawnChessmon
kind: digimon
level: 3
color: [yellow, black]
cost: 3
dp: 2000
traits: [Puppet, DATA SQUAD]
form: Rookie
attribute: Virus

alt_paths:
  - kind: digivolve
    from:
      any_color: true
      all_of:
        - level_eq: 2
        - any_of:
            - in_text_contains: Chessmon
            - trait_has: DATA SQUAD
    cost: 0

effects:
  - text: "[On Play] Reveal the top 3 cards of your deck. Add 1 card with [Chessmon] in its text and 1 [DATA SQUAD] trait card among them to the hand. Return the rest to the bottom of the deck."
    when: on_play
    summary: "[On Play] Reveal 3; add 1 card with [Chessmon] in its text and 1 [DATA SQUAD] card; bottom the rest"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          buckets:
            - bind_as: chessmon_pick
              min: 1
              max: 1
              filter: { in_text_contains: Chessmon }
            - bind_as: data_squad_pick
              min: 1
              max: 1
              filter: { trait_has: DATA SQUAD }
          no_duplicate_cards: true
          prompt: "Add 1 card with [Chessmon] in its text and 1 [DATA SQUAD] trait card to the hand"
      - add_to_hand_from_reveal: { of: you, card: chessmon_pick }
      - add_to_hand_from_reveal: { of: you, card: data_squad_pick }
      - place_remainder_on_deck: { of: you, position: bottom }

  - text: "[When Attacking] [Once Per Turn] 1 of your opponent's Digimon gets -2000 DP for the turn."
    scope: inherited
    when: when_attacking
    once_per_turn: true
    summary: "[Inherited][When Attacking][Once Per Turn] 1 of your opponent's Digimon gets -2000 DP for the turn"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: dp_target
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to get -2000 DP for the turn"
      - add_dp_modifier:
          target: dp_target
          value: -2000
          expiry: end_of_turn
