card: BT27-049
name: Liamon
kind: digimon
level: 4
color: [green, yellow]
cost: 5
dp: 5000
form: Champion
attribute: Vaccine
traits: [Holy Beast, ACCEL]
also_treated_as: ["Liamon Leomon"]

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: green }
    cost: 3
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 3
  - kind: digivolve
    from: { any_color: true, any_of: [{ name_is: Elecmon }, { level_eq: 3, trait_has: Holy Beast }, { level_eq: 3, trait_has: ACCEL }] }
    cost: 2

effects:
  - text: "[When Attacking] This Digimon may digivolve into a Digimon card with [Leomon] in its name or the [ACCEL] trait in the hand. For each of your opponent's Digimon and Tamers, reduce this effect's paid cost by 1."
    when: when_attacking
    process:
      - select_hand:
          of: you
          bind_as: evolution
          optional: true
          filter:
            kind: digimon
            can_digivolve_onto_with_cost:
              target: source
              cost: &attack_cost
                reduce:
                  base: 0
                  per:
                    card_count_in_zone:
                      of: opponent
                      zone: battle_area
                      filter: { any_of: [{ kind: digimon }, { kind: tamer }] }
                  delta: 1
            any_of: [{ name_contains: Leomon }, { trait_has: ACCEL }]
          prompt: "Digivolve into a Leomon-name or ACCEL Digimon?"
      - effect_initiated_digivolve:
          target: source
          from_hand: evolution
          cost: *attack_cost
  - text: "＜Barrier＞ (When this Digimon would be deleted in battle, by trashing your top security card, it isn't deleted.)"
    scope: inherited
    kind: grant_keyword
    keyword: Barrier
