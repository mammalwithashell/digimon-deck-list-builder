  - kind: digivolve
    from: { level_eq: 5, color_is: black }
    cost: 4
effects:
  - when: on_play
    summary: Delete all opposing lowest-DP Digimon; if none are deleted, opponent cannot play Digimon with 5000 DP or less until their turn ends
    process:
      - delete_all_permanents:
          over: { of: opponent, zone: [battle_area], kind: digimon }
          selector: lowest_dp
