card: EX3-044
name: Breakdramon
kind: digimon
level: 6
color: [green]
cost: 12
dp: 12000
form: Mega
attribute: Virus
traits: [Machine Dragon]
alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: green }
    cost: 4
  - kind: digivolve
    from: { level_eq: 5, color_is: blue }
    cost: 4
  - kind: digivolve
    from: { name_in: [Groundramon, Wingdramon] }
    cost: 3
effects:
  - when: on_suspend
    once_per_turn: true
    condition: { event_target_is_source: true }
    summary: "[All Turns][Once Per Turn] When this Digimon becomes suspended, suspend 1 of your opponent's Digimon"
    process:
      - select_opponent_permanent:
          bind_as: suspended_target
          filter: { kind: digimon }
          prompt: "Suspend 1 of your opponent's Digimon"
      - suspend: { target: suspended_target }
  - when: on_ally_won_battle
    once_per_turn: true
    condition:
      event_battle_surviving_deleter:
        owner: you
        kind: digimon
        any_of:
          - name_contains: Dramon
          - name_contains: Examon
    summary: "[All Turns][Once Per Turn] When your Dramon or Examon deletes an opponent's Digimon in battle and survives, trash their top security card"
    process:
      - trash_top_security: { of: opponent }
  - scope: inherited
    when: on_ally_won_battle
    once_per_turn: true
    condition:
      event_battle_surviving_deleter:
        owner: you
        kind: digimon
        any_of:
          - name_contains: Dramon
          - name_contains: Examon
    summary: "Inherited [All Turns][Once Per Turn] When your Dramon or Examon deletes an opponent's Digimon in battle and survives, trash their top security card"
    process:
      - trash_top_security: { of: opponent }
