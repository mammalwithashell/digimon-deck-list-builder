card: BT2-051
name: RustTyrannomon
kind: digimon
level: 6
color: [green]
cost: 13
dp: 11000
traits: [Cyborg]
form: Mega
attribute: Virus

effects:
  - text: "[Your Turn] When you have a green Tamer in play, this Digimon can attack your opponent's unsuspended Digimon."
    kind: aura
    active_when:
      all_of:
        - your_turn: true
        - any_permanent:
            of: you
            zone: [battle_area]
            kind: tamer
            color_is: green
    target: {}
    modifier: CanAttackUnsuspended
    modifier_value: 1
    summary: "[Your Turn] While you have a green Tamer in play, this Digimon can attack opponent's unsuspended Digimon"

  - text: "[Your Turn] When this Digimon deletes one of your opponent's Digimon in battle and survives, suspend 1 of your opponent's Digimon."
    when: on_any_deletion
    active_when: { your_turn: true }
    condition: { source_deleted_battle_opponent: true }
    summary: "[Your Turn] When this Digimon deletes an opponent's Digimon in battle and survives, suspend 1 opponent Digimon"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to suspend"
      - suspend: { target: target }
