card: BT2-049
name: Puppetmon
kind: digimon
level: 6
color: [green]
cost: 11
dp: 10000
traits: [Puppet]
form: Mega
attribute: Virus

effects:
  - text: "[On Play] Suspend 1 of your opponent's Digimon. During your opponent's next unsuspend phase, none of your opponent's Digimon can unsuspend."
    when: on_play
    summary: "[On Play] Suspend 1 opponent Digimon; none of opponent's Digimon can unsuspend during their next unsuspend phase"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to suspend"
      - suspend: { target: target }
      - add_player_modifier:
          target_player: opponent
          modifier: CannotUnsuspendInUnsuspendPhase
          value: 1
          expiry: end_of_opponents_next_turn

  - text: "[When Attacking] Gain 1 memory."
    when: when_attacking
    summary: "[When Attacking] Gain 1 memory"
    process:
      - gain_memory: 1
