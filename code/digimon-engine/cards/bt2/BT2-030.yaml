card: BT2-030
name: MetalSeadramon
kind: digimon
level: 6
color: [blue]
cost: 11
dp: 10000
form: Mega
attribute: Data
traits: [Cyborg]

effects:
  - text: "[On Play] Return up to 2 of your opponent's level 4 or lower Digimon to their hand."
    when: on_play
    summary: "[On Play] Return up to 2 opponent level 4 or lower Digimon to hand"
    process:
      - select_count_capped_multi:
          of: opponent
          zone: battle_area
          max: 2
          filter: { kind: digimon, level_lte: 4 }
          bind_as: bounce_targets
          prompt: "Return up to 2 of your opponent's level 4 or lower Digimon to their hand"
          optional_zero: true
      - per_selected:
          selection: bounce_targets
          bind_as: tgt
          body:
            - return_to_hand: { target: tgt }

  - text: "[Your Turn] This Digimon can't be blocked by your opponent's Digimon with no digivolution cards."
    kind: aura
    active_when: { your_turn: true }
    target: { is_source_permanent: true }
    modifier: CannotBeBlockedByNoSources
    summary: "[Your Turn] Can't be blocked by opponent's Digimon with no digivolution cards"
