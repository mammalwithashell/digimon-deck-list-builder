card: BT2-091
name: Volcanic Flare
kind: option
color: [red]
cost: 3

effects:
  - text: "[Main] Delete 1 of your opponent's Digimon with 4000 DP or less."
    when: main
    summary: "[Main] Delete 1 of your opponent's Digimon with 4000 DP or less"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter:
            all_of:
              - kind: digimon
              - dp_lte: 4000
          prompt: "Choose 1 of your opponent's Digimon with 4000 DP or less to delete"
      - delete_permanent: { target: target }

  - text: "[Security] Activate this card's [Main] effects."
    when: on_security
    summary: "[Security] Activate this card's [Main] effects"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter:
            all_of:
              - kind: digimon
              - dp_lte: 4000
          prompt: "Choose 1 of your opponent's Digimon with 4000 DP or less to delete"
      - delete_permanent: { target: target }
