card: BT2-044
name: Tyrannomon
kind: digimon
level: 4
color: [green]
cost: 4
dp: 4000
traits: [Dinosaur]
form: Champion
attribute: Data

effects:
  - text: "[When Digivolving] Reveal 3 cards from the top of your deck. Add 1 level 5 Digimon card and 1 green Tamer card among them to your hand. Place the remaining cards at the bottom of your deck in any order."
    when: when_digivolving
    summary: "[When Digivolving] Reveal top 3; add 1 Lv.5 Digimon and 1 green Tamer to hand; rest to bottom of deck"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          buckets:
            - bind_as: lv5_pick
              min: 1
              max: 1
              filter:
                all_of:
                  - kind: digimon
                  - level_eq: 5
            - bind_as: tamer_pick
              min: 1
              max: 1
              filter:
                all_of:
                  - kind: tamer
                  - color_is: green
          no_duplicate_cards: true
          prompt: "Add 1 level 5 Digimon card and 1 green Tamer card to your hand"
      - add_to_hand_from_reveal: { of: you, card: lv5_pick }
      - add_to_hand_from_reveal: { of: you, card: tamer_pick }
      - place_remainder_on_deck: { of: you, position: bottom }
