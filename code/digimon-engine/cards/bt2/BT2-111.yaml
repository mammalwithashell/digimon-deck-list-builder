card: BT2-111
name: Beelzemon
kind: digimon
level: 6
color: [purple]
cost: 12
dp: 11000
form: Mega
attribute: Virus
traits: [Demon Lord, Seven Great Demon Lords]

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: purple }
    cost: 4
  - kind: digivolve
    from:
      any_color: true
      name_is: "Impmon"
    cost: 4
    ignore_requirements: true
    condition:
      count_gte:
        filter: { of: you, zone: [trash] }
        n: 10

effects:
  - text: "[When Digivolving] Delete 1 of your opponent's level 4 or lower Digimon."
    when: when_digivolving
    summary: "[When Digivolving] Delete 1 of your opponent's level 4 or lower Digimon"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter:
            all_of:
              - kind: digimon
              - level_lte: 4
          prompt: "Choose 1 of your opponent's level 4 or lower Digimon to delete"
      - delete_permanent: { target: target }
