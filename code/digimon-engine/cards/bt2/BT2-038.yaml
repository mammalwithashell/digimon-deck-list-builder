card: BT2-038
name: RizeGreymon
kind: digimon
level: 5
color: [yellow]
cost: 8
dp: 7000
traits: [Cyborg]
form: Ultimate
attribute: Vaccine

effects:
  - text: "[When Digivolving] You may play 1 yellow Tamer card from your hand without paying the cost. [On Play] effects of Tamers played by this effect don't activate."
    when: when_digivolving
    optional: true
    summary: "[When Digivolving] You may play 1 yellow Tamer card from your hand without paying the cost (suppressing its [On Play] effects)"
    process:
      - select_union_zone:
          of: you
          zones: [hand]
          bind_as: tamer_pick
          optional: true
          filter:
            all_of:
              - kind: tamer
              - color_is: yellow
              - can_play_from_effect_without_cost: true
          prompt: "You may play 1 yellow Tamer card from your hand without paying the cost"
      - if:
          condition: { binding_present: tamer_pick }
          then:
            - play_union_bound_free:
                binding: tamer_pick
                suppress_on_play: true

  - text: "[Your Turn] While you have 3 or more yellow Tamers, this Digimon gains ＜Security A. +1＞ (This Digimon checks 1 additional security card.)"
    scope: inherited
    kind: aura
    active_when:
      all_of:
        - your_turn: true
        - count_gte:
            filter:
              of: you
              zone: [battle_area]
              kind: tamer
              color_is: yellow
            n: 3
    target: {}
    security_attack: 1
    summary: "[Inherited][Your Turn] While you have 3 or more yellow Tamers, this Digimon gains <Security A. +1>"
