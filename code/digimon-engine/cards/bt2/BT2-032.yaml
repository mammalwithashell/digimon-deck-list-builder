card: BT2-032
name: UlforceVeedramon
kind: digimon
level: 6
color: [blue]
cost: 13
dp: 11000
form: Mega
attribute: Vaccine
traits: [Holy Warrior, Royal Knight]

effects:
  - text: "[Your Turn] When one of your blue Tamers becomes suspended, unsuspend this Digimon."
    when: on_suspend
    active_when: { your_turn: true }
    trigger_if:
      event_target_owner: you
      event_target_kind: tamer
      event_target_color_any_of: [blue]
    summary: "[Your Turn] When one of your blue Tamers suspends, unsuspend this Digimon"
    process:
      - unsuspend: { target: source }

  - text: "[Your Turn] [Once Per Turn] When this Digimon becomes unsuspended during your main phase, gain 1 memory."
    when: on_unsuspend
    active_when: { your_turn: true }
    once_per_turn: true
    trigger_if: { event_permanent_is_source: true }
    condition: { in_phase: main }
    summary: "[Your Turn][OPT] When unsuspended during main phase, gain 1 memory"
    process:
      - gain_memory: 1
