card: BT2-088
name: Taiga
kind: tamer
color: [green]
cost: 3

effects:
  - text: "[Your Turn] All of your Digimon with [Tyrannomon] in their name gain ＜Piercing＞ (When this Digimon attacks and deletes an opponent's Digimon and survives the battle, it performs any security checks it normally would.)."
    kind: aura
    active_when: { your_turn: true }
    target:
      owner: you
      zone: [battle_area]
      kind: digimon
      name_contains: Tyrannomon
    grant_keyword: { keyword: Piercing }
    summary: "[Your Turn] All of your Digimon with [Tyrannomon] in their name gain <Piercing>"

  - text: "[Your Turn] When one of your Digimon would digivolve into a Digimon card in your hand with [Tyrannomon] in its name, you may suspend this Tamer to reduce the memory cost of the digivolution by 1."
    kind: cost_reduction
    scope: face_up
    reduction_timing: before_pay_cost
    active_when: { your_turn: true }
    optional: true
    when_any_ally_digivolves_into:
      all_of:
        - cost_target_from_hand: true
        - kind: digimon
        - name_contains: Tyrannomon
    pay_cost:
      - suspend: { target: source }
    amount: 1
    summary: "[Your Turn] When one of your Digimon would digivolve into a [Tyrannomon]-named Digimon card in your hand, you may suspend this Tamer to reduce the digivolution cost by 1"

  - text: "[Security] Play this card without paying the cost."
    when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
