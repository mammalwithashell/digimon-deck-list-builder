card: BT2-102
name: Terrors Cluster
kind: option
color: [green]
cost: 7

effects:
  - text: "[Main] Return 1 of your opponent's suspended Digimon to the bottom of their deck."
    when: main
    summary: "[Main] Return 1 of your opponent's suspended Digimon to the bottom of their deck"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter:
            all_of:
              - kind: digimon
              - is_suspended: true
          prompt: "Choose 1 of your opponent's suspended Digimon to return to the bottom of their deck"
      - return_to_deck: { target: target, position: bottom }

  - text: "[Security] Activate this card's [Main] effects."
    when: on_security
    summary: "[Security] Activate this card's [Main] effects"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter:
            all_of:
              - kind: digimon
              - is_suspended: true
          prompt: "Choose 1 of your opponent's suspended Digimon to return to the bottom of their deck"
      - return_to_deck: { target: target, position: bottom }
