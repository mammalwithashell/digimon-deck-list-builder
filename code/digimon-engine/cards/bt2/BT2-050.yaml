    active_when: { your_turn: true }
    target: {}
    security_attack:
      base: 1
      per:
        card_count_in_zone:
          of: you
          zone: battle_area
          filter:
            all_of:
              - kind: digimon
              - other: true
              - is_suspended: true
      delta: 1
    summary: "[Your Turn] For each of your other suspended Digimon, this Digimon gains <Security A. +1>"
