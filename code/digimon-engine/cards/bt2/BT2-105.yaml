card: BT2-105
name: Spider Shooter
kind: option
color: [black]
cost: 3

effects:
  - text: "[Main] ＜De-Digivolve 1＞ 1 of your opponent's Digimon. (Trash the top card. You can't trash past level 3 cards.)"
    when: main
    summary: "[Main] <De-Digivolve 1> 1 of your opponent's Digimon"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to <De-Digivolve 1>"
      - de_digivolve: { target: target, amount: 1 }

  - text: "[Security] Activate this card's [Main] effects."
    when: on_security
    summary: "[Security] Activate this card's [Main] effects"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to <De-Digivolve 1>"
      - de_digivolve: { target: target, amount: 1 }
