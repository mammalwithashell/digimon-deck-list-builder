card: BT2-025
name: Ikkakumon
kind: digimon
level: 4
color: [blue]
cost: 5
dp: 3000
form: Champion
attribute: Vaccine
traits: [Sea Beast]

effects:
  - text: "[When Attacking] Trash the top digivolution card of 1 of your opponent's Digimon."
    scope: inherited
    when: when_attacking
    summary: "[Inherited][When Attacking] Trash the top digivolution card of 1 opponent Digimon"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: target
          filter:
            all_of:
              - kind: digimon
              - materials_count_gte: 1
          prompt: "Choose 1 opponent Digimon to trash its top digivolution card"
      - trash_top_stacked_sources: { target: target, count: 1 }
