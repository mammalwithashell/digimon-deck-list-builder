card: BT2-020
name: Gallantmon
kind: digimon
level: 6
color: [red]
cost: 12
dp: 11000
form: Mega
attribute: Virus
traits: [Holy Warrior, Royal Knight]

effects:
  - text: "[When Digivolving] If you have a red Tamer in play, delete 1 of your opponent's Digimon with 6000 DP or less."
    when: when_digivolving
    condition:
      any_permanent:
        of: you
        zone: [battle_area]
        kind: tamer
        color_is: red
    summary: "[When Digivolving] If you have a red Tamer, delete 1 opponent Digimon with 6000 DP or less"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: victim
          filter: { kind: digimon, dp_lte: 6000 }
          prompt: "Delete 1 of your opponent's Digimon with 6000 DP or less"
      - delete_permanent: { target: victim }

  - text: "[When Attacking] Trash 1 of your opponent's security cards for every 10 cards in their trash."
    when: when_attacking
    summary: "[When Attacking] Trash 1 opponent top security card for every 10 cards in opponent's trash"
    process:
      - trash_top_security:
          of: opponent
          count:
            floor_div:
              - base: 0
                per:
                  card_count_in_zone:
                    of: opponent
                    zone: trash
                delta: 1
              - 10
