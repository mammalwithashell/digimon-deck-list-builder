# BT7-081 Bokomon — Digimon, Lv.3, White, DP 2000, Cost 3.
# Traits: Mutant. Attribute: Vaccine. Form: Rookie.
# No digivolve circle (played from hand only). No inherited effect.
#
# Printed text (card image BT7-081.webp; official Bandai DB bundle
# data/card_bundles/BT7-081.md; DCGO BT7_081.cs):
#
#   [On Play] Reveal the top 5 cards of your deck. Add 1 card with [Hybrid] or
#   [Ten Warriors] in its traits and 1 Tamer card among them to your hand.
#   Place the remaining cards at the bottom of your deck in any order.
#   [Your Turn][Once Per Turn] When one of your Tamers digivolves, gain 2
#   memory.
#
# Official Q&A: "Yes. Even if you revealed only a card with [Hybrid] or [Ten
# Warriors] in its traits or a Tamer card, you still add that card to your
# hand." -> each pick is mandatory when a candidate exists, and a missing
# category does not stop the other.
#
# DCGO crosscheck (BT7_081.cs):
#   - [On Play] (OnEnterFieldAnyone + CanTriggerOnPlay, >= 1 card in the
#     library): `SimplifiedRevealDeckTopCardsAndSelect(revealCount 5,
#     [CardTraits contains Hybrid | Ten Warriors] then [IsTamer], AddHand,
#     maxCount 1 each, remaining -> DeckBottom)`. A card taken by the first pick
#     is removed from the pool before the second, so one card never fills both
#     slots. The remainder is ordered by the player (CR 4.3 3-1-3-4).
#     -> `reveal_top_deck` + `select_reveal_buckets { no_duplicate_cards }` +
#     two `add_to_hand_from_reveal` + `place_remainder_on_deck { bottom }`
#     (BT20-048 idiom). DCGO also accepts the spaceless "TenWarriors" trait,
#     a DCGO data variant; every printed card is "Ten Warriors".
#   - [Your Turn][OPT] (OnEnterFieldAnyone, hash "Memory+2_BT7_081", maxCount
#     1): this card on the battle area, own turn, `CanTriggerWhenPermanent-
#     Digivolving` for a permanent on the owner's battle area whose digivolution
#     roots (the top cards of the stack(s) it digivolved from) include a Tamer
#     -> `AddMemory(2)`. A Tamer digivolves by the Hybrid/Spirit "digivolve into
#     this card" effects, becoming a Digimon permanent, so the test is the card
#     it digivolved FROM, not the resulting top card:
#     `event_target_digivolved_from_kind: tamer` (G-DSL-EVENT-TARGET-DIGIVOLVED-
#     FROM-KIND). Mandatory ("gain 2 memory", no "may").

card: BT7-081
name: Bokomon
kind: digimon
level: 3
color: [white]
cost: 3
dp: 2000
form: Rookie
attribute: Vaccine
traits: [Mutant]

effects:
  - text: "[On Play] Reveal the top 5 cards of your deck. Add 1 card with [Hybrid] or [Ten Warriors] in its traits and 1 Tamer card among them to your hand. Place the remaining cards at the bottom of your deck in any order."
    when: on_play
    summary: "[On Play] Reveal 5; add 1 [Hybrid]/[Ten Warriors] card and 1 Tamer; bottom the rest in any order"
    process:
      - reveal_top_deck: { of: you, count: 5, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          no_duplicate_cards: true
          buckets:
            - bind_as: warrior
              filter:
                any_of:
                  - trait_has: Hybrid
                  - trait_has: Ten Warriors
              min: 1
              max: 1
            - bind_as: tamer
              filter: { kind: tamer }
              min: 1
              max: 1
          prompt: "Add 1 [Hybrid]/[Ten Warriors] card and 1 Tamer card to your hand"
      - add_to_hand_from_reveal: { of: you, card: warrior }
      - add_to_hand_from_reveal: { of: you, card: tamer }
      - place_remainder_on_deck: { of: you, position: bottom }

  - text: "[Your Turn][Once Per Turn] When one of your Tamers digivolves, gain 2 memory."
    when: on_digivolve
    active_when: { your_turn: true }
    once_per_turn: true
    summary: "[Your Turn][Once Per Turn] When one of your Tamers digivolves, gain 2 memory"
    trigger_if:
      all_of:
        - event_target_owner: you
        - event_target_digivolved_from_kind: tamer
    process:
      - gain_memory: 2
