card: BT7-107
name: Calling From the Darkness
kind: option
color: [purple]
cost: 1

effects:
  - when: main
    summary: "[Main] Delete 1 own Digimon; return up to 2 purple Digimon from trash"
    process:
      - select_own_permanent:
          bind_as: sacrifice
          filter: { kind: digimon }
          prompt: "Delete 1 of your Digimon"
      - delete_permanent: { target: sacrifice }
      - select_trash:
          of: you
          bind_as: first
          optional: true
          filter:
            all_of:
              - kind: digimon
              - color_is: purple
          prompt: "Return 1 purple Digimon from trash"
      - if:
          condition: { binding_present: first }
          then:
            - add_to_hand_from_trash: { of: you, card: first }
      - select_trash:
          of: you
          bind_as: second
          optional: true
          filter:
            all_of:
              - kind: digimon
              - color_is: purple
          prompt: "Return another purple Digimon from trash"
      - if:
          condition: { binding_present: second }
          then:
            - add_to_hand_from_trash: { of: you, card: second }

  - scope: inherited
    when: on_security
    summary: "[Security] Add this card to the hand"
    process:
      - add_this_option_to_hand: {}
