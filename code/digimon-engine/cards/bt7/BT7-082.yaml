card: BT7-082
name: "Sistermon Blanc (Awakened)"
kind: digimon
level: 3
form: Rookie
attribute: Vaccine
color: [white]
cost: 5
dp: 5000
traits: [Puppet]

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: white }
    cost: 2

effects:
  - text: "[On Play] You may place 1 [Sistermon Blanc] from your hand or trash at the bottom of this Digimon's digivolution cards to ＜Recovery +1 (Deck)＞."
    when: on_play
    optional: true
    summary: "[On Play] May place 1 [Sistermon Blanc] from hand or trash as bottom source to <Recovery +1>"
    process:
      - select_zone_cards:
          zones: [hand, trash]
          min: 0
          max: 1
          bind_as: blanc
          filter:
            name_is: "Sistermon Blanc"
          prompt: "You may place 1 [Sistermon Blanc] from your hand or trash at the bottom of this Digimon's digivolution cards to <Recovery +1>"
      - if:
          condition: { binding_present: blanc }
          then:
            - place_as_bottom_source: { source: blanc, target: source }
            - recover: { of: you, count: 1 }

  - text: "[On Deletion] Return 1 card with [Jesmon], [Huckmon], or [Sistermon] in its name other than [Sistermon Blanc (Awakened)] from your trash to your hand."
    when: on_deletion
    summary: "[On Deletion] Return 1 [Jesmon]/[Huckmon]/[Sistermon] card other than [Sistermon Blanc (Awakened)] from trash to hand"
    process:
      - select_trash:
          of: you
          bind_as: recovered
          optional: false
          filter:
            all_of:
              - any_of:
                  - name_contains: Jesmon
                  - name_contains: Huckmon
                  - name_contains: Sistermon
              - not:
                  name_is: "Sistermon Blanc (Awakened)"
          prompt: "Return 1 card with [Jesmon], [Huckmon], or [Sistermon] in its name other than [Sistermon Blanc (Awakened)] from your trash to your hand"
      - add_to_hand_from_trash: { of: you, card: recovered }
