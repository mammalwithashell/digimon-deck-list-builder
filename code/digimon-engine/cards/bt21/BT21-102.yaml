card: BT21-102
name: Tai Kamiya
kind: tamer
color: [white]
cost: 4
traits: [ADVENTURE, Hero]

# ─── Printed text (cards.json) ───────────────────────────────────────────────
#
# [Start of Your Turn] If you have 2 or less memory, set it to 3.
# [Your Turn] When one of your Digimon attacks, by suspending this Tamer,
#   ＜Draw 1＞ (Draw 1 card from your deck.)
# [Main] [Once Per Turn] You may play 1 [ADVENTURE] or [Hero] trait card with
#   a play cost of 2 or less from your hand without paying the cost. For each
#   of your Tamers' colors, add 1 to this effect's play cost maximum. Then,
#   return this Tamer to the bottom of the deck.
# Security Effect [Security] Play this card without paying the cost.
#
# DCGO reference: DCGO/Assets/Scripts/CardEffect/BT21/White/BT21_102.cs
#
# ─── Clause (a): [Start of Your Turn] memory floor 3 ─────────────────────────
#
# Same pattern as BT22-084 Nokia Shiramine and EX11-054 Owen Dreadnought.
# Mandatory ("If your memory ≤ 2, set it to 3" — no "you may"). DCGO uses
# CardEffectFactory.SetMemoryTo3TamerEffect which is mandatory at OnStartTurn.
#
# ─── Clause (b): [Your Turn] when one of your Digimon attacks ────────────────
#
# "by suspending this Tamer" is the activation cost -> optional: true with a
# payability gate (`source_is_unsuspended`) and `activation_cost: {
# suspend_self: true }` (BT18-092 / BT6-089 idiom; DCGO
# `CanActivateSuspendCostEffect`). active_when: { your_turn: true } scopes
# [Your Turn].
#
# Timing is `on_ally_attack`: Tai OBSERVES an attack by another permanent of
# his controller (DCGO BT21_102.cs registers on `EffectTiming.OnAllyAttack`;
# CanUseCondition = IsExistOnBattleArea(card) && IsOwnerTurn(card) &&
# CanActivateSuspendCostEffect(card) && CanTriggerOnPermanentAttack(hashtable,
# IsPermanentExistsOnOwnerBattleAreaDigimon)). `when_attacking` is NOT usable
# here: it is carrier-scoped ("when THIS Digimon attacks" -- the engine
# enqueues it only on the attacker's own stack), so on a Tamer it can never
# fire. An earlier revision of this card used `when_attacking` on the claim
# that the DSL had no `on_ally_attack`; it has (BT18-092, BT6-089, ...), and
# the old unit test enqueued the timing by hand so it never exercised real
# dispatch -- the DCGO PvP replay caught the Tamer never being offered.
# The "of the same controller / is a Digimon" half of DCGO's attacker check
# is implicit: `OnAllyAttack` fans out over the attacker's controller's
# battle area, and only Digimon declare attacks.
#
# ─── Clause (c): [Main][OPT] play ADVENTURE/Hero ─────────────────────────────
#
# DCGO BT21_102.cs Main body:
#   - SelectHandEffect: canTargetCondition CanSelectCard(source) =
#       source.HasPlayCost
#       && source.BasePlayCostFromEntity <= AdjustedPlayCostMax(source)
#       && (source.HasAdventureTraits || source.HasHeroTraits);
#   - AdjustedPlayCostMax(card) = 2 + Combinations.GetDifferenetColorCardCount(
#         card.Owner.GetBattleAreaPermanents().Filter(p => p.IsTamer)
#                    .Select(p => p.TopCard).ToList());
#   - PlayPermanentCards(payCost: false) on the chosen card.
#   - DeckBottomBounceClass([Tai's permanent]) — return self to deck bottom.
#
# Implemented through formula-valued `play_cost_lte` and the
# `distinct_colors_count` formula primitive.
#
# ─── Clause (d): [Security] play self free ───────────────────────────────────
#
# Standard play_from_security pattern shared by BT18-087, BT22-084, BT21-015.

effects:
  # ─── Clause (a): [Start of Your Turn] memory floor 3 ─────────────────────────
  - when: start_of_your_turn
    summary: "[Start of Your Turn] If memory <= 2, set it to 3"
    condition: { memory_lte: 2 }
    process:
      - set_memory: 3

  # ─── Clause (b): [Your Turn] on_ally_attack — suspend self, draw 1 ───────────
  # optional: true — "by suspending this Tamer" is the activation cost.
  # active_when: { your_turn: true } — [Your Turn] scope.
  # `source_is_unsuspended` gates the OFFER on the cost being payable (DCGO
  # `CanActivateSuspendCostEffect`); `activation_cost: { suspend_self: true }`
  # pays it as the leading body step.
  - when: on_ally_attack
    optional: true
    active_when: { your_turn: true }
    summary: "[Your Turn] When one of your Digimon attacks, by suspending this Tamer, draw 1"
    condition: { source_is_unsuspended: true }
    process:
      - activation_cost: { suspend_self: true }
      - draw: { of: you, count: 1 }

  # ─── Clause (c): [Main][OPT] play ADVENTURE/Hero free, dynamic cap ─────────
  - when: main_on_field
    once_per_turn: true
    optional: true
    summary: "[Main][OPT] Play ADVENTURE/Hero cost <= 2 + Tamer colors free; return Tai to deck bottom"
    process:
      - select_hand:
          of: you
          bind_as: pick
          optional: true
          filter:
            all_of:
              - any_of:
                  - trait_has: ADVENTURE
                  - trait_has: Hero
              # "play 1 ... card": only a card with a play cost (DCGO
              # BT21_102.cs:78 HasPlayCost — false for Options, and a Digi-Egg
              # has none, CR 4.3 7-1-1) that the free play can place (free
              # slot, no effect-play prohibition; DCGO omits this check,
              # the rules require it, CR 4.3 1-3-11-1).
              - any_of:
                  - kind: digimon
                  - kind: tamer
              - can_play_from_effect_without_cost: true
              - play_cost_lte:
                  formula:
                    base: 2
                    per:
                      distinct_colors_count:
                        of: you
                        zone: battle_area
                        filter: { kind: tamer }
                    delta: 1
          prompt: "Play 1 ADVENTURE/Hero card free"
      - play_from_hand_free: { of: you, hand_index: pick }
      - return_to_deck: { target: source, position: bottom }

  # ─── Clause (d): [Security] Play this card without paying the cost ──────────
  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
