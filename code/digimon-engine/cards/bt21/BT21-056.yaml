# BT21-056 Vemmon — Digimon, Lv.3, Black, DP 1000, Cost 3.
# Traits: Unknown / LIBERATOR. Attribute: Unknown.
# Evo costs: Lv.2 Black / cost 0 (cards.json evo_costs — single circle, no
# multi-colour drop for this card).
#
# Printed effect text (data/card_bundles/BT21-056.md — official Bandai DB):
#   [On Play] By trashing 1 card with [Vemmon] in its text from your hand,
#   you may return 1 non-Digi-Egg card with [Vemmon] in its text from your
#   trash to the hand.
#
# Printed inherited effect text:
#   [Your Turn] [Once Per Turn] When this Digimon would digivolve into a
#   Digimon card with [Vemmon] in its text, reduce the digivolution cost by 1.
#
# Official Q&A (data/card_bundles/BT21-056.md):
#   "It refers to a card that contains the specified text or icon in its
#   name, traits, effects, inherited effects, (Rule), digivolution
#   requirements, DNA digivolution, DigiXros requirements, burst digivolve,
#   App Fusion, Link, or Assembly requirements. For example, a card with
#   [Knightmon] in its text would include cards with the name [DarkKnightmon]
#   and cards with the text [Knightmon] in their effects."
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT21/Black/BT21_056.cs
#
# ─── "[Vemmon] in its text" — whole-card HasText, NOT body-text-only ────────
#
# DCGO's `CanSelectCardCondition` (Clause 1) and `CardSourceCondition`
# (Clause 2, the cost reducer) both gate on `cardSource.HasText("Vemmon")`.
# `CardSource.HasText` is a whole-card scan (name + traits + printed
# effect/inherited/security text + rule text + digivolution/DNA/DigiXros/
# App Fusion/Link/Assembly requirement text) — confirmed by this card's own
# official Q&A above. The DSL's `effect_text_contains` leaf ONLY scans the
# candidate's `effect_text` / `inherited_text` / `security_text`
# (code/digimon-engine/src/dsl_cards/predicate.rs — G-DSL-PREDICATE-TEXT-CONTAINS)
# — it does NOT scan name or traits. Modelling "[Vemmon] in its text" as
# `effect_text_contains: "Vemmon"` ALONE is therefore narrower than the
# printed semantics: a Vemmon-NAMED card (or a future Vemmon-trait card)
# whose own body text does not self-reference "[Vemmon]" would be silently
# dropped. Both text filters below are widened to
# `any_of: [effect_text_contains, trait_has, name_contains]` for "Vemmon" so
# the name/traits axes of DCGO's HasText are covered (traits: no Vemmon-trait
# card exists in the pool today, but the leaf is included for forward
# faithfulness per the card's own Q&A; qa/dsl-vocab-gaps.md does not yet
# model rule-text/digivolution-requirement-text scanning — that residual
# sliver is out of scope for a leaf predicate and is not reachable by any
# currently printed Vemmon-family card).
#
# ─── Clause 1 — [On Play] trash-cost hand→trash→hand recursion ─────────────
#
# DCGO (EffectTiming.OnEnterFieldAnyone, ActivateClass, SetUpActivateClass(...,
# -1, false, ...) = unlimited fires per turn, NOT declined at the top level):
#   CanActivateCondition: card is on own battle area AND owner has >=1 hand
#     card (a loose pre-check; the real gate is inside the coroutine).
#   ActivateCoroutine:
#     1. SelectHandEffect (mode Discard), canTargetCondition =
#        HasText("Vemmon") (own hand cards only), canNoSelect: true,
#        maxCount: 1 — the trash is itself declinable ("you may" is really
#        attached to the whole cost+reward here per DCGO's canNoSelect on
#        the cost pick).
#     2. If a card was discarded AND the owner has a matching non-Digi-Egg
#        card in trash: SelectCardEffect (mode AddHand, root Trash),
#        canTargetCondition = HasText("Vemmon") && !IsDigiEgg, canNoSelect:
#        true, maxCount: min(1, matches) — the return is separately
#        declinable ("you may return").
#
# DSL modelling: `select_hand { optional: true, cost: true }` for the
# trash-cost pick (declining aborts the whole clause —
# G-OPTIONAL-COST-DECLINE-ABORTS-CLAUSE, BT24-008 idiom). Then
# `trash_from_hand_by_index` pays the cost. Then a SEPARATE
# `select_trash { optional: true }` for the "you may return" half (declining
# just skips the return — no cost flag, matches DCGO's second independent
# canNoSelect: true). `condition: count_gte` on the outer clause gates
# activation on the hand actually containing an eligible Vemmon-text card
# (mirrors `HandCards.Count(CanSelectCardCondition) >= 1`).
#
# ─── Clause 2 — Inherited [Your Turn][OPT] digivolve-cost -1 ───────────────
#
# DCGO: TWO cooperating pieces, both `SetIsInheritedEffect(true)`:
#   - `activateClass2` (EffectTiming.OnEnterFieldAnyone, background/no-UI,
#     MaxCountPerTurn 1): gates on IsOwnerTurn + CanTriggerWhenDigivolving +
#     "this card is not among the evo-root tops" (i.e. this source is being
#     dug UNDER by the new digivolution, not itself the new top) + the NEW
#     top card's TopCard.HasText("Vemmon"). This is the OPT gate/tripwire —
#     it does not itself change cost, it feeds `isOverMaxCountPerTurn` below.
#   - `changeCostClass` (EffectTiming.None = BeforePayCost): CanUseCondition
#     = IsExistOnBattleArea + IsOwnerTurn + NOT isOverMaxCountPerTurn(gated
#     by activateClass2's counter). ChangeCost: -1 when CardSourceCondition
#     (the digivolving-FROM card source HasText("Vemmon") — trivially true,
#     it's this card itself checking its own identity as the material) AND
#     PermanentsCondition (targetPermanents contains THIS permanent, i.e.
#     "this Digimon" is the one being digivolved) — the ACTUAL text-match on
#     the new top card happens inside `activateClass2`'s CanUseCondition,
#     which gates whether the OPT counter's underlying trigger is even
#     eligible to increment; functionally the visible net effect is
#     "-1 when digivolving BT21-056 into a Vemmon-text card, once per turn".
#
# DSL: single `kind: cost_reduction` clause, `scope: inherited` (this is an
# INHERITED-only effect — `inherited_effect_description_eng`, not
# `effect_description_eng` — matching DCGO's dual SetIsInheritedEffect(true)
# on both activateClass2 and changeCostClass; no face-up counterpart exists
# for this card, so there is no shared-OPT cross-position concern like
# BT18-060's face_up+inherited duplication). Gated via
# `source_is_cost_target_permanent: true` (this permanent is the one being
# digivolved FROM) + `cost_target: { any_of: [...Vemmon text axes...] }` (the
# hand card being digivolved into has "[Vemmon]" in its text) — the proven
# Phase 2 Track H substrate (P-117 / BT21-011 / BT21-055 exemplars).
# `once_per_turn: true` matches `activateClass2.MaxCountPerTurn == 1`.

card: BT21-056
name: Vemmon
kind: digimon
level: 3
color: [black]
cost: 3
dp: 1000
traits: [Unknown, LIBERATOR]
attribute: Unknown

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 0

effects:
  # ─── Clause 1 — [On Play] trash a Vemmon-text hand card, may return a
  # non-Digi-Egg Vemmon-text card from trash to hand ──────────────────────
  - when: on_play
    optional: true
    summary: "[On Play] By trashing 1 [Vemmon]-text card from hand, may return 1 non-Digi-Egg [Vemmon]-text card from trash to hand"
    condition:
      count_gte:
        filter:
          of: you
          zone: [hand]
          any_of:
            - effect_text_contains: "Vemmon"
            - trait_has: "Vemmon"
            - name_contains: "Vemmon"
        n: 1
    process:
      # Cost: trash 1 [Vemmon]-text hand card. `cost: true` — declining this
      # pick aborts the whole clause (DCGO canNoSelect: true on the discard
      # select; G-OPTIONAL-COST-DECLINE-ABORTS-CLAUSE).
      - select_hand:
          of: you
          bind_as: discard
          optional: true
          cost: true
          filter:
            any_of:
              - effect_text_contains: "Vemmon"
              - trait_has: "Vemmon"
              - name_contains: "Vemmon"
          prompt: "Trash 1 [Vemmon]-text card from your hand"
      - trash_from_hand_by_index: { of: you, hand_index: discard }
      # Reward: may return 1 non-Digi-Egg [Vemmon]-text card from trash to
      # hand. Separately optional (DCGO's second, independent canNoSelect:
      # true on the AddHand-from-Trash select) — declining here only skips
      # the return, the trash cost above has already been paid.
      - select_trash:
          of: you
          bind_as: recovered
          optional: true
          filter:
            all_of:
              - any_of:
                  - effect_text_contains: "Vemmon"
                  - trait_has: "Vemmon"
                  - name_contains: "Vemmon"
              - none_of:
                  - kind: digi_egg
          prompt: "You may return 1 non-Digi-Egg [Vemmon]-text card from your trash to your hand"
      - add_to_hand_from_trash: { of: you, card: recovered }

  # ─── Clause 2 — Inherited [Your Turn][OPT] digivolve-cost -1 ──────────────
  - kind: cost_reduction
    scope: inherited
    reduction_timing: before_pay_cost
    active_when:
      all_of:
        - your_turn: true
        - source_is_cost_target_permanent: true
        - cost_target:
            any_of:
              - effect_text_contains: "Vemmon"
              - trait_has: "Vemmon"
              - name_contains: "Vemmon"
    once_per_turn: true
    amount: 1
    summary: "[Your Turn][OPT] Inherited: when this Digimon would digivolve into a [Vemmon]-text card, reduce the digivolution cost by 1"
