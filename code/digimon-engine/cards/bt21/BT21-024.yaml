card: BT21-024
name: Cyberdramon
kind: digimon
level: 5
color: [red]
cost: 7
dp: 7000
traits: [Cyborg, Dragonkin]
alt_paths:
  - kind: digivolve
    from: { level_eq: 4 }
    cost: 3

effects:
  # Clause 1: [On Play][When Digivolving]
  # "If your opponent has 5 or fewer security cards, they place 1 card from
  # their hand as the bottom security card. Then, trash their top security card."
  #
  # The printed card text gates the WHOLE clause (both the bottom-security
  # placement and the top-security trash) under "If your opponent has 5 or
  # fewer security cards". The native `opponent_security_count_lte` predicate
  # leaf (G-OPP-SECURITY-COUNT-LTE, resolved 2026-05-17) reads
  # `rctx.security_count(rctx.opponent_id())` directly — the right shape for
  # this aggregate count gate.
  #
  # DCGO (BT21_024.cs): the SelectHandEffect runs only when
  # `Enemy.SecurityCards.Count <= 5 && Enemy.HandCards.Count() >= 1`, with
  # `canNoSelect: false` — the opponent CANNOT decline the placement. The
  # `select_hand` step is therefore mandatory (not `optional`).
  #
  # `select_hand` + `place_on_security` are paired INSIDE the
  # `as_selecting_player` body so the `pick` hand-index binding (set by the
  # select_hand resolution callback) flows directly into the placement step
  # that consumes it. `trash_top_security` is the outer-tail sibling — it must
  # fire after the placement resolves. When the opponent has an empty hand the
  # engine's empty-candidate path (G-SELECT-EMPTY-OUTER-TAIL, resolved) skips
  # the select_hand install and runs the body synchronously, so the outer-tail
  # `trash_top_security` step still fires.
  - when: [on_play, when_digivolving]
    condition:
      opponent_security_count_lte: 5
    process:
      - as_selecting_player:
          of: opponent
          body:
            - select_hand:
                of: opponent
                bind_as: pick
                filter: {}
                prompt: "Place a card from your hand as your bottom security card"
            - place_on_security:
                of: opponent
                source: { card: { binding: pick, zone: hand } }
                position: bottom
                face_up: false
      - trash_top_security: { of: opponent }

  # Clause 2: Inherited [Your Turn] This Digimon gets +4000 DP.
  # Standard self-aura scoped to the carrier's controller's turn.
  - scope: inherited
    kind: aura
    active_when: { your_turn: true }
    target: {}
    dp_modifier: 4000
    summary: "[Your Turn] This Digimon gets +4000 DP"
