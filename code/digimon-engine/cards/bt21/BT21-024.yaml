card: BT21-024
name: Cyberdramon
kind: digimon
level: 5
color: [red]
cost: 7
dp: 7000
traits: [Cyborg]
alt_paths:
  - kind: digivolve
    from: { level_eq: 4 }
    cost: 3

effects:
  # Clause 1: [On Play][When Digivolving]
  # "If your opponent has 5 or fewer security cards, they place 1 card from
  # their hand as the bottom security card. Then, trash their top security card."
  #
  # PARTIAL — The clause-level "If opponent has ≤5 security" condition cannot
  # be expressed in the DSL. The DSL predicate `security_count_lte` checks the
  # CONTROLLER's security stack, not the opponent's. There is no
  # `opponent_security_count_lte` predicate in the current vocabulary.
  #
  # DSL vocab gap: `opponent_security_count_lte` — see qa/dsl-vocab-gaps.md
  # (G-OPP-SECURITY-COUNT-LTE). The predicate would lower to
  # `rctx.security_count(rctx.opponent())` with the same comparison logic
  # as the existing `security_count_lte` path.
  #
  # Following DCGO (BT21_024.cs): the DCGO implementation also runs the
  # trash_top_security step unconditionally (outside the inner if-block at
  # line 26); the security-count check only gates the "place from hand"
  # sub-step. The printed card text ("If … they place … Then, trash")
  # treats both as conditional but DCGO separates them. This implementation
  # follows DCGO: both steps run unconditionally. The gap tracker entry
  # documents the deviation from printed text.
  - when: [on_play, when_digivolving]
    process:
      - as_selecting_player:
          of: opponent
          body:
            - select_hand:
                of: opponent
                bind_as: pick
                optional: true
                filter: {}
                prompt: "Place a card from your hand as your bottom security card"
            - place_on_security:
                of: opponent
                source: { binding: pick, zone: hand }
                position: bottom
                face_up: false
      - trash_top_security: { of: opponent }

  # Clause 2: Inherited [Your Turn] This Digimon gets +4000 DP.
  # Standard self-aura scoped to the carrier's controller's turn.
  - scope: inherited
    kind: aura
    active_when: { your_turn: true }
    target: {}
    dp_modifier: 4000
    summary: "[Your Turn] This Digimon gets +4000 DP"
