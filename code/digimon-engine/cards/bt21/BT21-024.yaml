card: BT21-024
name: Cyberdramon
kind: digimon
level: 5
color: [red]
cost: 7
dp: 7000
traits: [Cyborg]
alt_paths:
  - kind: digivolve
    from: { level_eq: 4 }
    cost: 3

effects:
  # Clause 1: [On Play][When Digivolving]
  # "If your opponent has 5 or fewer security cards, they place 1 card from
  # their hand as the bottom security card. Then, trash their top security card."
  #
  # The printed card text gates both the bottom-security placement and the
  # top-security trash under "If your opponent has 5 or fewer security cards".
  # Print text wins over DCGO when they diverge, so this condition uses the
  # aggregate count predicate over the opponent's security stack.
  - when: [on_play, when_digivolving]
    condition:
      count_lte:
        filter: { zone: [security], owner: opponent }
        n: 5
    process:
      - as_selecting_player:
          of: opponent
          body:
            - select_hand:
                of: opponent
                bind_as: pick
                optional: true
                filter: {}
                prompt: "Place a card from your hand as your bottom security card"
            - place_on_security:
                of: opponent
                source: { binding: pick, zone: hand }
                position: bottom
                face_up: false
      - trash_top_security: { of: opponent }

  # Clause 2: Inherited [Your Turn] This Digimon gets +4000 DP.
  # Standard self-aura scoped to the carrier's controller's turn.
  - scope: inherited
    kind: aura
    active_when: { your_turn: true }
    target: {}
    dp_modifier: 4000
    summary: "[Your Turn] This Digimon gets +4000 DP"
