card: BT21-037
name: Lighdramon
kind: digimon
level: 4
color: [blue, green]
cost: 6
dp: 6000
traits: [Beast]
alt_paths:
  - kind: digivolve
    from: { level_eq: 3 }
    cost: 3

effects:
  # ─── Clause 1: <Piercing> ─────────────────────────────────────────────────
  # Printed text: "When this Digimon attacks and deletes an opponent's Digimon
  # and survives the battle, it performs any security checks it normally would."
  # DCGO: CardEffectFactory.PierceSelfEffect(isInheritedEffect: false, card: card, condition: null)
  # at EffectTiming.OnDetermineDoSecurityCheck.
  # Pattern: grant_keyword Piercing (same as BT24-018 clause (b), BT72 clause 2).
  - kind: grant_keyword
    keyword: Piercing
    summary: "<Piercing>"

  # ─── Clause 2: <Armor Purge> ──────────────────────────────────────────────
  # Printed text: "When this Digimon would be deleted, you may trash the top
  # card of this Digimon to prevent that deletion."
  # DCGO: CardEffectFactory.ArmorPurgeEffect(card: card) at EffectTiming.WhenPermanentWouldBeDeleted.
  # Pattern: grant_keyword ArmorPurge (same as BT24-018 clause (d), P-137 clause (a)).
  - kind: grant_keyword
    keyword: ArmorPurge
    summary: "<Armor Purge>"

  # ─── Clause 3: [When Digivolving] ────────────────────────────────────────
  # Printed text: "[When Digivolving] Suspend 1 of your opponent's Digimon.
  # Then, this Digimon gets +2000 DP until your opponent's turn ends."
  #
  # DCGO analysis (EffectTiming.OnEnterFieldAnyone):
  #   - CanUseCondition: CanTriggerWhenDigivolving(hashtable, card).
  #   - CanSelectPermanentCondition: IsPermanentExistsOnOpponentBattleAreaDigimon + CanSuspend.
  #   - CanActivateCondition: IsExistOnBattleAreaDigimon(card).
  #   - ActivateCoroutine:
  #       1. If opponent has suspendable Digimon, SetUp SelectPermanentEffect in Tap mode
  #          with maxCount=1, canNoSelect=false, canEndNotMax=false.
  #       2. ChangeDigimonDP(targetPermanent: card.PermanentOfThisCard(), changeValue: 2000,
  #          effectDuration: UntilOpponentTurnEnd).
  #   - SetUpActivateClass: isOptional=false (-1 isOpt param), EffectDescription in text.
  #
  # DSL mapping:
  #   - when: when_digivolving (mandatory, not optional — DCGO isOptional=-1 = false).
  #   - Condition on selection: opponent has at least 1 suspendable Digimon.
  #   - Step 1: select_opponent_permanent (kind: digimon, optional: false when targets exist).
  #   - Step 2: suspend { target: tgt }.
  #   - Step 3: add_dp_modifier (target: source, +2000, expiry: end_of_opponents_turn).
  #
  # Note on mandatory vs. no-target: DCGO HasMatchConditionPermanent gates the selection
  # block — if there are zero suspendable opp Digimon, the select is skipped entirely and
  # only the DP buff fires. We model this with optional: true on the select (so the engine
  # skips gracefully when there are no valid targets), matching DCGO behavior.
  # The DP buff fires unconditionally regardless of whether a target was selected.
  - when: when_digivolving
    summary: "[When Digivolving] Suspend 1 opp Digimon; this Digimon gets +2000 DP until opp turn ends"
    process:
      - select_opponent_permanent:
          bind_as: tgt
          optional: true
          filter: { kind: digimon }
          prompt: "Suspend 1 of your opponent's Digimon"
      - suspend: { target: tgt }
      - add_dp_modifier:
          target: source
          value: 2000
          expiry: end_of_opponents_turn
