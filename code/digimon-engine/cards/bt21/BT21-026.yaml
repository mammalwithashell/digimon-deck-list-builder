card: BT21-026
name: WarGreymon
kind: digimon
level: 6
color: [red]
cost: 11
dp: 11000
traits: [Dragonkin]
alt_paths:
  # Printed circle: Red Lv.5 / cost 3. The colour is part of the
  # requirement; a gate without `color_is` digivolves from any colour.
  - kind: digivolve
    from: { level_eq: 5, color_is: red }
    cost: 3

effects:
  # ─── Clause 1: When this card would be played, reduce the play cost by 2
  # for each of your opponent's Digimon.
  #
  # DCGO: ChangeCostClass with CardSourceCondition (cardSource == card) and
  # count() = 2 * GetBattleAreaPermanents().Count(permanent => permanent.IsDigimon).
  #
  # "for each of your opponent's Digimon": the count carries `filter: { kind:
  # digimon }` -- an unfiltered battle-area count would also count Tamers and
  # Option cards placed in the battle area (CR 4.3 4-4-1, 4-28-1). DCGO
  # BT21_026.cs: `2 * Enemy.GetBattleAreaPermanents().Count(p => p.IsDigimon)`.
  - kind: cost_reduction
    reduction_timing: before_pay_cost
    when_playing_this: true
    amount_fn:
      base: 0
      per:
        card_count_in_zone:
          of: opponent
          zone: battle_area
          filter: { kind: digimon }
      delta: 2
    summary: "-2 per opponent Digimon when played"

  # ─── Clause 2: <Rush>
  # DCGO: RushSelfStaticEffect(isInheritedEffect: false, card: card, condition: null)
  # G-DECLARATIVE-KEYWORD RESOLVED (2026-06-03): an unconditional FaceUp
  # grant_keyword declarative is surfaced as a native top-card keyword
  # (card_data_from_compiled), so `has_keyword` detects <Rush> on the field.
  # Verified: rules_faq::keyword_identity::mp26_* + bt21_026_rush_installed_on_field.
  - kind: grant_keyword
    keyword: Rush

  # ─── Clause 3: <Raid>
  # DCGO: RaidSelfEffect(isInheritedEffect: false, card: card, condition: null)
  # G-DECLARATIVE-KEYWORD RESOLVED — surfaced as a native keyword (see Clause 2).
  - kind: grant_keyword
    keyword: Raid

  # ─── Clause 4: <Blocker>
  # DCGO: BlockerSelfStaticEffect(isInheritedEffect: false, card: card, condition: null)
  # G-DECLARATIVE-KEYWORD RESOLVED — surfaced as a native keyword (see Clause 2).
  # Verified: bt21_026_blocker_installed_on_field.
  - kind: grant_keyword
    keyword: Blocker

  # ─── Clause 5: [All Turns] [Once Per Turn] When any of your opponent's Digimon
  # are deleted, this Digimon may unsuspend.
  #
  # G-EVENT-TARGET-OWNER is wired in the engine since Group 6 (2026-05-02);
  # `event_target_owner: opponent` matches when the deleted permanent
  # belonged to the opponent of the source permanent's controller.
  #
  # DCGO reference:
  #   timing: OnDestroyedAnyone
  #   CanUseCondition: IsExistOnBattleAreaDigimon(card) &&
  #                    CanTriggerOnPermanentDeleted(hashtable, IsOpponentsDigimon)
  #   CanActivateCondition: IsExistOnBattleAreaDigimon(card)
  #   ActivateCoroutine: IUnsuspendPermanents([card.PermanentOfThisCard()])
  #   SetHashString("Unsuspend_BT21-026")
  - when: on_any_deletion
    active_when: { all_turns: true }
    once_per_turn: true
    optional: true
    summary: "[All Turns][OPT] When any opp Digimon is deleted, may unsuspend self"
    trigger_if:
      all_of:
        - event_target_owner: opponent
        - event_target_kind: digimon
    process:
      - unsuspend: { target: source }
