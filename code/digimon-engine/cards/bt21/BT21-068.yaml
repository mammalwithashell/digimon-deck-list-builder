card: BT21-068
name: Growlmon
kind: digimon
level: 4
form: Champion
attribute: Virus
color: [purple, red]
cost: 5
dp: 5000
traits: [Dark Dragon]

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: purple }
    cost: 3
  - kind: digivolve
    from: { level_eq: 3, color_is: red }
    cost: 3
  - kind: digivolve
    from: { any_color: true, level_eq: 3, name_contains: Guilmon }
    cost: 2

effects:
  - text: "[On Play] [When Digivolving] Delete 1 of your opponent's Digimon with 4000 DP or less. If this effect didn't delete, trash the top 2 cards of your deck."
    when: [on_play, when_digivolving]
    summary: "[OP][WD] Delete 1 opponent Digimon with <=4000 DP; if didn't delete, mill 2"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: victim
          filter:
            all_of:
              - kind: digimon
              - dp_lte: 4000
          prompt: "Delete 1 of your opponent's Digimon with 4000 DP or less"
      - if:
          condition: { binding_present: victim }
          then:
            - delete_permanent: { target: victim }
      - if:
          condition: { effect_deleted_any_opponent_digimon: false }
          then:
            - trash_from_top: { of: you, count: 2 }

  - text: "[On Deletion] Gain 1 memory."
    scope: inherited
    when: on_deletion
    summary: "[Inherited][On Deletion] Gain 1 memory"
    process:
      - gain_memory: 1
