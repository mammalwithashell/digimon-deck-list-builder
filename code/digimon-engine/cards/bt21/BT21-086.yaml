card: BT21-086
name: Marcus Damon
kind: tamer
color: [yellow, red]
cost: 4
traits: [Hero]

effects:
  - when: start_of_your_main_phase
    summary: "[Start of Your Main Phase] If opponent has a Digimon, gain 1 memory"
    condition:
      any_permanent:
        of: opponent
        zone: [battle_area]
        kind: digimon
    process:
      - gain_memory: 1

  - when: on_play
    summary: "[On Play] 1 of your Marcus Damon Tamers may suspend"
    process:
      - select_own_permanent:
          bind_as: marcus
          optional: true
          filter:
            all_of:
              - kind: tamer
              - name_contains: "Marcus Damon"
              - is_unsuspended: true
          prompt: "Suspend 1 of your Marcus Damon Tamers"
      - suspend: { target: marcus }

  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}

  # Omitted:
  # [All Turns][Once Per Turn] When this Tamer suspends, 1 of your Digimon gains
  # Piercing and +3000 DP for the turn; then 1 opponent Digimon gets -3000 DP.
  # Current DSL cannot gate on the on_suspend event target being this exact
  # source Tamer without over-firing on other permanents suspending.
