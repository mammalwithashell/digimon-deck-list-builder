card: BT21-055
name: Sunarizamon
kind: digimon
level: 3
color: [black]
cost: 3
dp: 1000
traits: [Reptile, LIBERATOR, Mineral]
attribute: Virus
alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 0

# ─── Clause 0 — [Your Turn] CostReduction when digivolving into Mineral/Rock ──
#
# Printed text (cards.json):
#   "[Your Turn] When this Digimon would digivolve into a card with the
#   [Mineral] or [Rock] trait, reduce the digivolution cost by 1."
#
# Substrate: Phase 2 Track H (G-BEFORE-PAY-COST-DIGIVOLVE-TARGET — RESOLVED
# 2026-05-17). Pattern: `kind: cost_reduction` with `reduction_timing:
# before_pay_cost`, gated on `source_is_cost_target_permanent: true` (this
# permanent is the one being digivolved from) and `cost_target: { any_of:
# [{ trait_has: Mineral }, { trait_has: Rock }] }` (the target hand card
# has at least one of the required traits). No Tamer condition; no
# once_per_turn annotation in printed text.
#
# Proof-of-substrate exemplar: code/digimon-engine/cards/p/P-117.yaml
# (P-117 clause 0 uses the identical shape for [Free] trait).

effects:
  # ─── Clause 0 — [Your Turn] digivolve-cost reduction for Mineral/Rock target ─
  - kind: cost_reduction
    reduction_timing: before_pay_cost
    active_when:
      all_of:
        - your_turn: true
        - source_is_cost_target_permanent: true
        - cost_target:
            any_of:
              - trait_has: Mineral
              - trait_has: Rock
    amount: 1
    summary: "[Your Turn] When digivolving into Mineral or Rock, reduce digivolution cost by 1"

  - scope: inherited
    when: on_digivolution_card_trashed
    condition:
      all_of:
        - event_target_owner: you
        - trashed_source_card_id_is: BT21-055
        - any_of:
            - host_permanent_trait_has: Mineral
            - host_permanent_trait_has: Rock
        - any_permanent:
            of: opponent
            zone: [battle_area]
            kind: digimon
            play_cost_lte: 4
    summary: "When this source is trashed from a Mineral/Rock Digimon, delete an opponent Digimon cost 4 or less"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon, play_cost_lte: 4 }
          prompt: "Choose 1 opponent Digimon with play cost 4 or less"
      - delete_permanent: { target: target }
