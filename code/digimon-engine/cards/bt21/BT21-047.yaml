# BT21-047 Navimon — Digimon, Lv.3, Green, DP 1000, Play Cost 3.
# Trait line: Stnd./Appmon | Navi | Navi  →  traits: [Stnd., Appmon, Navi], attribute: Navi.
#
# DCGO BT21_047.cs (authoritative — read-only base repo):
#   - AddSelfLinkConditionStaticEffect(HasAppmonTraits, linkCost 1)
#       → kind: link_condition, cost 1, filter trait_has Appmon.
#   - AddSelfDigivolutionRequirementStaticEffect(HasAppmonTraits, 0, lvl 2)
#       → alt_paths digivolve from { level_eq: 2, trait_has: Appmon } cost 0.
#   - OnEnterFieldAnyone (On Play): reveal top 3, select 1 [Appmon] + 1 [App Driver]
#       to hand; rest to deck bottom.
#       DCGO SimplifiedRevealDeckTopCardsAndSelect, two SimplifiedSelectCardConditionClass
#       buckets (HasAppmonTraits maxCount:1; EqualsTraits("App Driver") maxCount:1),
#       remainingCardsPlace: DeckBottom.
#       → reveal_top_deck count 3 + select_reveal_buckets two mandatory min-1/max-1 buckets
#         (trait_has: Appmon; trait_has: "App Driver") + add_to_hand_from_reveal ×2
#         + place_remainder_on_deck bottom.
#   - OnDetermineDoSecurityCheck: PierceSelfEffect(isInheritedEffect: false,
#       isLinkedEffect: true, card, condition: null)
#       → scope: linked, kind: grant_keyword, keyword: Piercing.
#       (isLinkedEffect: true → this Piercing is a link-box ESS applied to the HOST,
#        not Navimon's own keyword.)
#
# Card image (authoritative for printed text):
#   Link box shows:  Link [Appmon] trait: Cost 1  |  +2000 DP  |  <Piercing>
#   The +2000 DP is a linked aura (shown in the link box), not in DCGO — modelled
#   as scope: linked, kind: aura, dp_modifier: 2000 (same pattern as BT25-101's
#   scope: linked kind: aura security_attack).

card: BT21-047
name: Navimon
kind: digimon
level: 3
color: [green]
cost: 3
dp: 1000
traits: [Stnd., Appmon, Navi]
attribute: Navi

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, trait_has: Appmon }
    cost: 0

effects:
  # ─── Self link-condition: link onto an [Appmon] host for cost 1 ─────────────
  - kind: link_condition
    cost: 1
    filter: { trait_has: Appmon }

  # ─── [On Play] reveal 3; add 1 [Appmon] + 1 [App Driver] ───────────────────
  # DCGO: SimplifiedRevealDeckTopCardsAndSelect, two buckets —
  #   bucket 1: HasAppmonTraits → add 1 to hand
  #   bucket 2: EqualsTraits("App Driver") → add 1 to hand
  #   remaining → deck bottom
  # "App Driver" is a Tamer trait; eligible reveals include Tamers and any card
  # carrying that trait.
  - when: on_play
    summary: "[On Play] Reveal 3; add 1 [Appmon] and 1 [App Driver] card to hand; bottom the rest"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          buckets:
            - bind_as: appmon_pick
              min: 1
              max: 1
              filter: { trait_has: Appmon }
            - bind_as: driver_pick
              min: 1
              max: 1
              filter: { trait_has: "App Driver" }
          no_duplicate_cards: true
          prompt: "Add 1 [Appmon] card and 1 [App Driver] card to the hand"
      - add_to_hand_from_reveal: { of: you, card: appmon_pick }
      - add_to_hand_from_reveal: { of: you, card: driver_pick }
      - place_remainder_on_deck: { of: you, position: bottom }

  # ─── Link ESS: +2000 DP (applies to the host while linked) ─────────────────
  # Shown in the link box on the card image; isLinkedEffect on the host.
  - scope: linked
    kind: aura
    target: {}
    dp_modifier: 2000
    summary: "[Link] +2000 DP"

  # ─── Link ESS: <Piercing> (applies to the host while linked) ────────────────
  # DCGO: PierceSelfEffect(isLinkedEffect: true) at OnDetermineDoSecurityCheck.
  # isLinkedEffect: true → this is an ESS granted to the host, not Navimon's own
  # keyword. Models as scope: linked, kind: grant_keyword (BT25-101 precedent).
  - kind: grant_keyword
    scope: linked
    keyword: Piercing
    summary: "[Link] <Piercing>"
