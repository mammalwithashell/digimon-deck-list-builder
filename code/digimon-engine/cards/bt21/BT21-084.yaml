# BT21-084 Haru Shinkai — Tamer, Red, Cost 4.
# Traits: App Driver / Appmon / Hero
#
# Printed card text (authoritative — card image):
#   [Start of Your Turn] If you have 2 or less memory, set it to 3.
#   [Your Turn] When your Digimon get linked, by suspending this Tamer,
#     <Draw 1>. Then, 1 of your Digimon may app fuse into a Digimon card
#     in the hand.
#   [Security] Play this card without paying the cost.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT21/Red/BT21_084.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
#
# Clause 1 — `EffectTiming.OnStartTurn` → `CardEffectFactory.SetMemoryTo3TamerEffect(card)`,
#   the canonical "[Start of Your Turn] if memory <= 2, set it to 3" ramp idiom
#   (same as BT1-085, BT21-102, BT22-084 Nokia). Mandatory (no "you may").
#
# Clause 2 — `EffectTiming.WhenLinked`:
#   `CanUseCondition`: IsExistOnBattleArea(card) AND
#   CanTriggerWhenLinked(hashtable, LinkPermanentCondition, null) where
#     LinkPermanentCondition = IsPermanentExistsOnOwnerBattleAreaDigimon(permanent, card)
#     → "the linked HOST is one of OUR Digimons" = event_target_owner: you
#   `CanActivateCondition`: IsExistOnBattleArea(card) AND
#     CanActivateSuspendCostEffect(card) [unsuspended] AND IsOwnerTurn(card)
#     → activation_cost: { suspend_self: true } + active_when.your_turn: true
#   No `maxUsableCount` limit in DCGO → fires once per link event (repeatable).
#   DCGO marks it optional (canNoSelect: true in the ActivateClass constructor).
#   Process: SuspendPermanent(self), DrawClass(1), then app-fuse rider (BLOCKED).
#
# Clause 3 — `EffectTiming.SecuritySkill` → `CardEffectFactory.PlaySelfTamerSecurityEffect(card)`,
#   the canonical "[Security] Play this card without paying the cost" idiom.
#
# ─── PARTIAL ──────────────────────────────────────────────────────────────────
#
# The tail of Clause 2 — "Then, 1 of your Digimon may app fuse into a Digimon
# card in the hand." — is OMITTED because there is no engine primitive for
# effect-initiated App Fusion (no `EffectContext::effect_initiated_app_fuse`,
# no DSL step). This is the same gap that keeps BT25-089 PARTIAL.
# Gap: effect-initiated app fuse — see docs/RUST_ENGINE_GAPS.md (App Fuse entry).
#
# Traits (from card image): App Driver, Appmon, Hero.

card: BT21-084
name: Haru Shinkai
kind: tamer
color: [red]
cost: 4
traits: ["App Driver", Appmon, Hero]

effects:
  # ─── Clause 1: [Start of Your Turn] if memory <= 2, set it to 3 ──────────────
  - when: start_of_your_turn
    summary: "[Start of Your Turn] If you have 2 or less memory, set it to 3"
    condition: { memory_lte: 2 }
    process:
      - set_memory: 3

  # ─── Clause 2 (partial): [Your Turn] When your Digimon get linked →
  #     suspend self, draw 1.
  # App-fuse rider OMITTED (engine gap: effect-initiated app fuse, docs/RUST_ENGINE_GAPS.md).
  #
  # active_when.all_of:
  #   - your_turn: true      — [Your Turn] scope (DCGO: CanActivateCondition.IsOwnerTurn)
  #   - event_target_owner: you — the link HOST must be our Digimon
  #                              (DCGO: LinkPermanentCondition in CanUseCondition)
  # optional: true — DCGO ActivateClass(canNoSelect: true); player may decline.
  # condition: { source_is_unsuspended: true } — DCGO: CanActivateSuspendCostEffect(card)
  #   checks Haru is unsuspended before offering the prompt. Without this the outer-
  #   optional prompt fires even when Haru can't pay, violating DCGO semantics.
  # activation_cost: { suspend_self: true } — DCGO: SuspendPermanentsClass([self]);
  #   must be first body step (compile-validated, lifts onto EffectBuilder::activation_cost).
  #   BT25-089:45 precedent.
  - when: on_any_link
    optional: true
    active_when:
      all_of:
        - your_turn: true
        - event_target_owner: you
    condition: { source_is_unsuspended: true }
    summary: "[Your Turn] When your Digimon get linked, suspend self → <Draw 1>"
    process:
      - activation_cost: { suspend_self: true }
      - draw: { of: you, count: 1 }

  # ─── Clause 3: [Security] play this card without paying the cost ──────────────
  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
