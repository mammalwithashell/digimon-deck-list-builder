# BT21-087 Zenith — Tamer, Black, Cost 4.
# Traits: LIBERATOR
#
# Printed card text (card image — authoritative):
#   [Start of Your Turn] If you have 2 or less memory, set it to 3.
#   [On Play] Reveal the top 3 cards of your deck. Among them, play 1
#     [Vemmon] without paying the cost or add 1 card with [Vemmon] in its
#     text to the hand. Trash the rest.
#   [Security] Play this card without paying the cost.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT21/Black/BT21_087.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
#
# Clause 1 — `EffectTiming.OnStartTurn` → `CardEffectFactory.SetMemoryTo3TamerEffect(card)`,
#   the canonical "[Start of Your Turn] if memory <= 2, set it to 3" ramp idiom
#   (same as BT1-085, BT21-084, BT21-102, BT22-084 Nokia). Mandatory (no "you may").
#
# Clause 2 — `EffectTiming.OnEnterFieldAnyone` (`CanUseCondition`:
#   `CardEffectCommons.CanTriggerOnPlay`). Body (`ActivateCoroutine`, lines
#   52-123):
#     1. `SimplifiedRevealDeckTopCardsAndSelect(revealCount: 3, ...,
#        remainingCardsPlace: Trash, canNoSelect: true)` with ONE
#        `SimplifiedSelectCardConditionClass` (`canTargetCondition:
#        cardSource.HasText("Vemmon")`, `maxCount: 1`, `mode: Custom`). This is
#        a SINGLE select-at-most-1 over the WHOLE 3-card reveal pool, pooling
#        both "named exactly Vemmon" and "has [Vemmon] in its printed text"
#        candidates together (DCGO `HasText` scans `CardName_ENG` +
#        `EffectDiscription_ENG` + `InheritedEffectDiscription_ENG` +
#        `SecurityEffectDiscription_ENG` — see `CardSource.cs:2120-2140`).
#     2. If a card was selected (line 81 `if (selectedCard != null)`):
#        a. If `selectedCard.EqualsCardName("Vemmon")` (line 83, EXACT name
#           match) → present a binary Play/Add-to-hand choice
#           (`SelectionElement<bool>` "Play" vs "Add to your hand", lines
#           85-98).
#        b. Else (has "Vemmon" in text but is NOT named exactly "Vemmon" —
#           e.g. Snatchmon/Destromon/Galacticmon/Tsumemon/Ragnarok Cannon/Xeno,
#           which all reference "[Vemmon]" in their own printed text without
#           being named Vemmon) → `playCard` stays `false`, no choice is
#           offered; the card is unconditionally added to hand (line 118-121,
#           `CardEffectCommons.AddThisCardToHand`).
#        c. If `playCard == true` (only reachable via 2a's Play branch):
#           `CardEffectCommons.CanPlayAsNewPermanent(...)` gates a free play
#           (`PlayPermanentCards(payCost: false)`); if that check fails (e.g.
#           no open battle-area slot) the card is TRASHED instead
#           (`ITrashDeckCards`, line 115) rather than added to hand or left in
#           the reveal pool.
#        d. If `playCard == false` (2b, or the "Add to hand" pick in 2a) →
#           add to hand (line 120).
#     3. Any revealed card never selected in step 1 is trashed by
#        `SimplifiedRevealDeckTopCardsAndSelect`'s `remainingCardsPlace: Trash`.
#
# Clause 3 — `EffectTiming.SecuritySkill` → `CardEffectFactory.PlaySelfTamerSecurityEffect(card)`,
#   the canonical "[Security] Play this card without paying the cost" idiom
#   (same as BT21-084, BT18-087, BT21-015, BT22-084).
#
# ─── BLOCKED — Clause 2 [On Play] — G-DSL-BINDING-CARD-NAME-EQUALS ──────────
#
# Verdict for this clause: BLOCKED (omitted from `effects:` below). Clauses 1
# and 3 are fully faithful and IMPLEMENTED; the card overall is PARTIAL.
#
# Printed text requires selecting AT MOST 1 card from a 3-card reveal pool
# where eligibility is the union of "named exactly Vemmon" and "has [Vemmon]
# in its printed text" (DCGO `HasText`), and THEN branching later behavior
# (offer a Play/Hand choice vs. unconditionally add to hand) on whether the
# SPECIFIC card that was picked is exactly named "Vemmon". This needs a
# predicate that reads the NAME of an already-bound `Card`/`CardList`
# binding (the reveal-bucket pick) inside a downstream `if:` condition —
# i.e. a `binding_card_name_is` (or `binding_card_name_contains`) leaf,
# analogous to the existing `binding_card_kind` leaf (which resolves a named
# card binding via `bindings.get_card(...)` and compares its `CardKind`; see
# `code/digimon-dsl/src/predicate.rs:207-212` /
# `code/digimon-engine/src/dsl_cards/predicate.rs:618-632`) but comparing
# `card_name` instead of `card_kind`. VERIFIED ABSENT (2026-07-02): grepped
# `code/digimon-dsl/src/predicate.rs` and `code/digimon-engine/src/dsl_cards/
# predicate.rs` for any binding-scoped name predicate — none exists; `git log
# --all -p -- code/digimon-dsl/src/predicate.rs | grep binding_card_name`
# returns nothing across the full repo history.
#
# Investigated and rejected workarounds (no new vocabulary):
#
#   1. Two `select_reveal_buckets` buckets — bucket A `name_is: Vemmon`
#      (min:0,max:1), bucket B `all_of: [{not:{name_is:Vemmon}},
#      {any_of:[name_contains:Vemmon, effect_text_contains:Vemmon]}]`
#      (min:0,max:1), `no_duplicate_cards: true`. REJECTED: buckets are
#      resolved fully independently and sequentially
#      (`install_reveal_bucket_step`, `code/digimon-engine/src/
#      effect_context/selections.rs:2260+`) — there is no cross-bucket total
#      cap. With 3 revealed cards it is structurally possible for one to
#      satisfy bucket A and a DIFFERENT one to satisfy bucket B, letting the
#      player pick from BOTH buckets (2 cards total) in a single resolution —
#      over-exposing an action the printed text does not allow ("play 1...
#      or add 1...", strictly at most 1 total, not up to 1 of each kind).
#      This is not a tolerable RL-mask over-exposure (sister to the
#      EX5-015 G-DSL-BIND-PRESENT case) because it changes a real game-legal
#      outcome, not just which of two already-legal branches gets picked.
#   2. A single `HasText`-equivalent bucket (`any_of: [name_contains: Vemmon,
#      effect_text_contains: Vemmon]`, min:0, max:1) correctly caps the whole
#      selection to >=0..1 total (faithful to DCGO's single `maxCount: 1`
#      select), but there is then no vocabulary to branch the FOLLOW-UP
#      Play-vs-Hand choice on whether the ONE picked card happens to be
#      exactly named "Vemmon" — `if:` conditions only support `equals` /
#      `not_equals` against INTEGER binding values (`select_effect_choice`
#      results, counts, etc. — `compare_binding_values`,
#      `code/digimon-engine/src/dsl_cards/predicate.rs:884-907`), not card
#      identity.
#   3. Unconditionally offering the Play/Hand `select_effect_choice` for
#      every picked card (dropping the name gate) was rejected: it would let
#      the RL action space illegally "play for free" a Snatchmon / Destromon
#      / Galacticmon / Tsumemon / Ragnarok Cannon / Xeno pick — cards that
#      reference "[Vemmon]" in their own text without being named Vemmon
#      (verified against `data/cards.json`) — which the real game forbids.
#      This is a faithfulness violation, not a benign RL-mask over-exposure.
#
# Suggested API (for whoever closes this): add `binding_card_name_is: {
# binding: <name>, name: "<literal>" }` (exact match, mirroring `name_is`
# semantics + `also_treated_as` aliasing) to `PredicateSpec`, evaluated the
# same way `binding_card_kind` is — resolve `bindings.get_card(&binding)`,
# look up its `CardData`, compare `card_name`. Logged to
# qa/dsl-vocab-gaps.md (G-DSL-BINDING-CARD-NAME-EQUALS) — consumer BT21-087.
#
# First test once unblocked: reveal pool containing an exact-name "Vemmon"
# card → assert a `SelectionKind::EffectChoice` (Play/Add to hand) installs;
# picking Play plays it as a free permanent; picking Add adds it to hand.
# Reveal pool containing a Vemmon-text-but-not-named card (e.g. a
# "Destromon"-shaped test fixture with `effect_text_contains: Vemmon`) →
# assert NO choice installs and the card is added to hand directly. A picked
# exact-name "Vemmon" that fails `CanPlayAsNewPermanent` (full battle area) →
# assert it lands in trash, not hand or the reveal pool.

card: BT21-087
name: Zenith
kind: tamer
color: [black]
cost: 4
traits: [LIBERATOR]

effects:
  # ─── Clause 1: [Start of Your Turn] if memory <= 2, set it to 3 ──────────────
  - when: start_of_your_turn
    summary: "[Start of Your Turn] If you have 2 or less memory, set it to 3"
    condition: { memory_lte: 2 }
    process:
      - set_memory: 3

  # ─── Clause 2: [On Play] BLOCKED — see G-DSL-BINDING-CARD-NAME-EQUALS above ──
  #
  # Omitted entirely (no partial/approximate version shipped — a half-correct
  # reveal-and-branch would either over-expose an illegal free play or
  # silently mis-route a legal one; both violate the no-approximations
  # policy). See the header block for the full DCGO crosscheck, rejected
  # workarounds, and the suggested predicate to unblock this.

  # ─── Clause 3: [Security] play this card without paying the cost ────────────
  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
