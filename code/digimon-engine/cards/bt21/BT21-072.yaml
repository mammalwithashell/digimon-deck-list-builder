card: BT21-072
name: "Arresterdramon: Superior Mode"
kind: digimon
level: 5
color: [red, purple]
cost: 9
dp: 10000
traits: [Dragon, Hero]
# Digivolution paths:
#   - Standard: from a Lv.4 Digimon, cost 4 (the printed `evo_costs`).
#   - xros_req: "[Digivolve] Lv.4 w/＜Save＞ in text or w/[Hero] trait: Cost 3" —
#     the printed alternate digivolution requirement. "w/＜Save＞ in text" is a
#     literal text-presence check (the requirement's own wording is "in text"),
#     modelled with the existing `effect_text_contains` predicate against the
#     source card's printed text; "w/[Hero] trait" uses `trait_has`.
#     `ignore_requirements: true` mirrors the AD1-012 xros_req pattern.
#     G-ALT-PATH-SAVE-IN-TEXT.
alt_paths:
  - kind: digivolve
    from: { level_eq: 4 }
    cost: 4
  - kind: digivolve
    from:
      any_of:
        - { level_eq: 4, effect_text_contains: "＜Save＞" }
        - { level_eq: 4, trait_has: Hero }
    cost: 3
    ignore_requirements: true

# Clause 1: <Raid>
# DCGO: RaidSelfEffect(isInheritedEffect: false, card: card, condition: null)
# Printed keyword. Declarative grant_keyword clause.
#
# Clause 2: <Piercing>
# DCGO: PierceSelfEffect(isInheritedEffect: false, card: card, condition: null)
# Printed keyword. Declarative grant_keyword clause.
#
# Clause 3: [When Digivolving] This Digimon may attack without suspending.
# DCGO: ActivateClass(EffectTiming.OnEnterFieldAnyone), CanTriggerWhenDigivolving,
#   SelectAttackEffect.SetWithoutTap(), canAttack(withoutTap: true).
# Rust maps this to the centralized effect-created attack flow via
# `may_attack_now` with `without_suspending: true` and `optional: true`.
#
# Clause 4: [All Turns] This Digimon gets +1000 DP for each of its digivolution cards.
# DCGO: CardEffectFactory.ChangeSelfDPStaticEffect(changeValue: 1000 * count(), ...) at
#   EffectTiming.None — a continuous declarative effect whose value recomputes each tick
#   as count() = PermanentOfThisCard().DigivolutionCards.Count().
# RESOLVED (G-AURA-DP-FORMULA, Group 6): `kind: aura` now accepts `dp_modifier_fn`, a
#   runtime formula closure that `Game::effective_dp` / `Game::source_dp_contribution`
#   re-evaluate at query time. The formula `base: 0, per: material_count, delta: 1000`
#   recomputes continuously — including after de_digivolve pops digivolution cards.
#   `material_count` (CompiledPerSelector::MaterialCount) = stack_size - 1 =
#   PermanentOfThisCard().DigivolutionCards.Count() exactly. Self-aura (`target: {}`)
#   so the formula reads the source permanent's own stack. The DCGO `count() >= 1`
#   condition is functionally redundant — at material_count 0 the formula yields 0 DP.
#   [All Turns] = no turn gate → active_when: { all_turns: true } (BT12-031 pattern).
#
# Clause 5 (Inherited): [Your Turn] This Digimon gets +2000 DP.
# DCGO: CardEffectFactory.ChangeSelfDPStaticEffect(changeValue: 2000, isInheritedEffect: true, ...)
#   condition: IsExistOnBattleArea(card) && IsOwnerTurn(card).
# Standard inherited self-aura with your_turn gate — BT23-005 pattern.
# NOTE (G-INHERITED-DISPATCH): DSL `scope: inherited` triggered clauses are not yet
# dispatched by enqueue_from_permanent (only the top card is scanned). However, this is a
# DECLARATIVE aura (not a triggered clause), so inherited declarative effects must still
# be verified to dispatch. The static DP path (`lower_aura.rs`) sets Effect.dp_modifier
# which `source_dp_contribution` reads — verify that declarative inherited effects are
# included in the scan.

effects:
  # ─── Clause 1: <Raid> ─────────────────────────────────────────────────────
  - kind: grant_keyword
    keyword: Raid
    summary: "<Raid>"

  # ─── Clause 2: <Piercing> ─────────────────────────────────────────────────
  - kind: grant_keyword
    keyword: Piercing
    summary: "<Piercing>"

  # ─── Clause 3: [When Digivolving] may attack without suspending ───────────
  - when: when_digivolving
    summary: "[When Digivolving] This Digimon may attack without suspending"
    process:
      - may_attack_now:
          attacker: source
          targets: any
          without_suspending: true
          optional: true

  # ─── Clause 4: [All Turns] +1000 DP per digivolution card ─────────────────
  # Self-aura with a runtime formula closure (G-AURA-DP-FORMULA resolved).
  # dp = base 0 + material_count * 1000, recomputed continuously by the DP
  # query path so it tracks the stack after de_digivolve / digivolve.
  - kind: aura
    target: {}
    active_when: { all_turns: true }
    dp_modifier_fn:
      base: 0
      per: material_count
      delta: 1000
    summary: "[All Turns] +1000 DP per digivolution card (material_count formula)"

  # ─── Clause 5 (Inherited): [Your Turn] +2000 DP ───────────────────────────
  - scope: inherited
    kind: aura
    active_when: { your_turn: true }
    target: {}
    dp_modifier: 2000
    summary: "[Your Turn] This Digimon gets +2000 DP"
