# BT21-078 WereGarurumon — Lv.5, Purple, DP 7000, Cost 7.
# Traits: Beastkin, ADVENTURE. Form: Ultimate. Attribute: Vaccine.
#
# Printed text (official Bandai DB, data/card_bundles/BT21-078.md; matches
# data/cards.json):
#   Digivolve: Purple Lv.4 / Cost 3
#   [Digivolve] Lv.4 w/[Garurumon] in name or w/[ADVENTURE] trait: Cost 3
#   [On Play] [When Digivolving] Delete 1 of your opponent's level 4 or lower
#     Digimon. If your Tamers have 2 or more total colors, add 1 to this
#     effect's level maximum.
#   [Your Turn] [Once Per Turn] When your other Digimon are played or
#     digivolve, if any of them have the [ADVENTURE] trait, 1 of your Digimon
#     gains <Alliance> for the turn. Then, 1 of your Digimon may attack.
#   Inherited: <Alliance>
#
# DCGO: DCGO/Assets/Scripts/CardEffect/BT21/Purple/BT21_078.cs
#   - OP / WD: mandatory delete pick (canNoSelect false) over opponent
#     Digimon with Level <= (distinct Tamer colours >= 2 ? 5 : 4).
#   - Your Turn OPT observer + inherited <Alliance>: identical to ST20-04.
#
# Authoring: the level maximum is an `if distinct_tamer_colors_gte: 2`
# branch (level_lte 5 / level_lte 4). The observer clause is the shared
# ADVENTURE Lv.5 idiom documented in ST20-04.yaml.
#
# | Clause                                              | Status      |
# | Purple Lv.4 / Cost 3 circle                         | IMPLEMENTED |
# | Lv.4 [Garurumon]-name or [ADVENTURE] / Cost 3 box   | IMPLEMENTED |
# | [OP][WD] delete 1 opp Lv.4- (Lv.5- with 2+ Tamer colours) | IMPLEMENTED |
# | [Your Turn][OPT] ADVENTURE observer → Alliance; may attack | IMPLEMENTED |
# | Inherited <Alliance>                                | IMPLEMENTED |

card: BT21-078
name: WereGarurumon
kind: digimon
level: 5
color: [purple]
cost: 7
dp: 7000
traits: [Beastkin, ADVENTURE]
attribute: Vaccine
form: Ultimate

alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: purple }
    cost: 3
  - kind: digivolve
    from:
      all_of:
        - level_eq: 4
        - any_of:
            - name_contains: "Garurumon"
            - trait_has: ADVENTURE
    cost: 3

effects:
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Delete 1 of your opponent's level 4 or lower Digimon (level 5 or lower if your Tamers have 2 or more total colors)"
    process:
      - if:
          condition: { distinct_tamer_colors_gte: 2 }
          then:
            - select_opponent_permanent:
                bind_as: delete_target
                filter:
                  all_of:
                    - kind: digimon
                    - level_lte: 5
                prompt: "Delete 1 of your opponent's level 5 or lower Digimon"
            - delete_permanent: { target: delete_target }
          else:
            - select_opponent_permanent:
                bind_as: delete_target
                filter:
                  all_of:
                    - kind: digimon
                    - level_lte: 4
                prompt: "Delete 1 of your opponent's level 4 or lower Digimon"
            - delete_permanent: { target: delete_target }

  - when: [on_ally_played, on_digivolve]
    active_when: { your_turn: true }
    once_per_turn: true
    summary: "[Your Turn][Once Per Turn] When your other Digimon are played or digivolve, if any of them have the [ADVENTURE] trait, 1 of your Digimon gains <Alliance> for the turn. Then, 1 of your Digimon may attack"
    trigger_if:
      all_of:
        - event_target_owner: you
        - event_target_kind: digimon
        - event_permanent_is_source: false
        - event_target_trait_has: ADVENTURE
    process:
      - select_own_permanent:
          bind_as: alliance_target
          filter: { kind: digimon }
          prompt: "Choose 1 of your Digimon to gain <Alliance> for the turn"
      - grant_keyword:
          target: alliance_target
          keyword: Alliance
          expiry: end_of_turn
      - select_own_permanent:
          bind_as: attacker
          optional: true
          filter: { kind: digimon, can_attack: { targets: any } }
          prompt: "Choose 1 of your Digimon that may attack"
      - may_attack_now:
          attacker: attacker
          targets: any
          optional: true
          prompt: "Attack with the selected Digimon?"

  - scope: inherited
    kind: grant_keyword
    keyword: Alliance
    summary: "Inherited <Alliance>"
