#
#   Region "Alternative Digivolution Condition" (None):
#     AddSelfDigivolutionRequirementStaticEffect(EqualsTraits("Sup."), cost 4, ignoreReqs: false).
#     → alt_paths: digivolve from { trait_has: "Sup." } cost 4 (no level gate).
#
#   Region "App Fusion" (None):
#     AddAppfuseMethodByName([Sociamon, Gossipmon]).
#     → alt_paths: kind: app_fusion, materials name_in [Sociamon, Gossipmon], cost 0.
#
#   Region "Blocker" (None):
#     BlockerSelfStaticEffect(isInheritedEffect: false).
#     → kind: grant_keyword, keyword: Blocker.
