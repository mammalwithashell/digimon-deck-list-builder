#     OPT maxCount 1, SetHashString("BT21_073_tauntOnLink"), CanUseCondition: IsOwnerTurn &&
#     CanTriggerWhenLinked(linked perm == card.PermanentOfThisCard()).
#     CanActivateCondition: isExistOnField. HasMatchConditionPermanent(opp Digimon, canNoSelect: false).
#     → when: when_card_linked_to_this, once_per_turn, active_when: { your_turn: true }.
#     Body: select 1 opponent Digimon (mandatory if any), then grant_triggered_effect to it:
#       timing: start_of_your_main_phase, expiry: end_of_opponents_turn,
