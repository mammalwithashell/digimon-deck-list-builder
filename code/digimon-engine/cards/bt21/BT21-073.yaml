#     OPT (once per turn), all-turns, when this Digimon would leave battle area:
#     SelectCardEffect from linked cards (SelectCardEffect.Root.Custom = linked cards, canNoSelect: true).
#     If trashed 1 link card: willBeRemoveField = false → Charismon stays.
#     → scope: linked, kind: replacement, trigger: when_would_leave_battle_area,
#       optional: true, cost: { trash_own_link_card: true }, outcome: prevent.
#     (BT25-101 precedent. SetIsLinkedEffect(true) → scope: linked.)
