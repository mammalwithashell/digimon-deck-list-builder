card: BT21-073
name: Charismon
kind: digimon
level: 5
color: [purple, black]
cost: 8
dp: 8000
traits: ["Ult.", Appmon, Social, "Mind Control"]
attribute: Social

alt_paths:
  # ─── Standard digivolve: Lv.4 Purple / Cost 4 (printed evo_costs) ──────────
  - kind: digivolve
    from: { level_eq: 4, color_is: purple }
    cost: 4

  # ─── Alt-digivolve: from a "Sup." form Digimon / Cost 4 ─────────────────────
  # DCGO: AddSelfDigivolutionRequirementStaticEffect(EqualsTraits("Sup."), cost 4).
  # "Sup." is the Appmon Grade: Superior form trait.
  - kind: digivolve
    from: { trait_has: "Sup." }
    cost: 4

  # ─── [App Fusion] [Sociamon] & [Gossipmon]: Cost 0 ──────────────────────────
  - kind: app_fusion
    materials:
      - filter:
          name_in: [Sociamon, Gossipmon]
    cost: 0

effects:
  # ─── Self link-condition: link onto an [Appmon] host for cost 3 ─────────────
  - kind: link_condition
    cost: 3
    filter: { trait_has: Appmon }
    summary: "[Link] [Appmon] trait: Cost 3"

  # ─── <Blocker> ─────────────────────────────────────────────────────────────
  # DCGO: BlockerSelfStaticEffect(isInheritedEffect: false).
  - kind: grant_keyword
    keyword: Blocker
    summary: "<Blocker>"

  # ─── Link box: +4000 DP aura (applied to the host while Charismon is linked) ─
  # DCGO: LinkEffect on OnDeclaration side + continuous; GameLink-B shape.
  # Briefing §1.2: scope:linked aura dp_modifier is the canonical link DP bonus.
  - scope: linked
    kind: aura
    target: {}
    dp_modifier: 4000
    summary: "[Link] This Digimon's host gets +4000 DP while Charismon is linked"

  # ─── Link box leave-replacement: trash 1 link card → Charismon doesn't leave ─
  # DCGO: Region "Link effect" (WhenRemoveField, SetIsLinkedEffect(true)).
  # SetIsLinkedEffect(true) → scope: linked. Modeling per BT25-101.
  - scope: linked
    kind: replacement
    trigger: when_would_leave_battle_area
    optional: true
    cost: { trash_own_link_card: true }
    outcome: prevent
    summary: "[Link][All Turns] When this Digimon would leave the battle area, by trashing 1 of this Digimon's link cards, it doesn't leave"

  # ─── [On Play][When Digivolving] may link Lv.4- Digimon from trash/sources ──
  # DCGO: Region "On Play"/"When Digivolving" (OnEnterFieldAnyone).
  # CanLinkCondition: level <= 4 && CanLinkToTargetPermanent.
  # Source choices: trash OR digivolution_sources. Optional (canNoSelect: true).
  # BT25-070 precedent: from [trash, digivolution_sources], filter all_of [kind:digimon, level_lte:4].
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] You may link 1 level 4 or lower Digimon card from your trash or this Digimon's digivolution cards to this Digimon without paying the cost"
    process:
      - link_cards:
          from: [trash, self_sources]
          filter:
            all_of:
              - kind: digimon
              - level_lte: 4
          to: self
          count: { up_to: 1 }
          cost: free

  # ─── [Your Turn][Once Per Turn] when_card_linked_to_this: taunt 1 opp Digimon ─
  # DCGO: Region "Your Turn" (WhenLinked), OPT maxCount 1.
  # CanUseCondition: IsOwnerTurn && CanTriggerWhenLinked(perm == this).
  # Selects 1 opp Digimon (canNoSelect: false — mandatory if any exist).
  # Grants: "[Start of Your Main Phase] This Digimon attacks." until opp turn ends.
  # BT25-054 GreatGrizzlymon idiom: select_opponent_permanent → grant_triggered_effect
  #   timing: start_of_your_main_phase, expiry: end_of_opponents_turn,
  #   body: [force_attack { attacker: carrier, targets: any }].
  - when: when_card_linked_to_this
    once_per_turn: true
    active_when: { your_turn: true }
    summary: "[Your Turn][Once Per Turn] When this Digimon gets linked, give 1 of your opponent's Digimon '[Start of Your Main Phase] This Digimon attacks.' until their turn ends"
    process:
      - select_opponent_permanent:
          bind_as: taunt_target
          filter: { kind: digimon }
          prompt: "Choose 1 of your opponent's Digimon to gain '[Start of Your Main Phase] This Digimon attacks.'"
      - grant_triggered_effect:
          target: taunt_target
          timing: start_of_your_main_phase
          expiry: end_of_opponents_turn
          body:
            - force_attack:
                attacker: carrier
                targets: any
                prompt: "This Digimon attacks"
