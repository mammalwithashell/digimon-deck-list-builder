# BLOCKED verdict — all clauses require mechanics not yet expressible in the DSL.
#
# Clause 1: Color bypass (conditional IgnoreColorRequirement)
#   DSL: flood_gate with modifier IgnoreColorRequirement can be authored,
#   but code/digimon-engine/src/action/mask.rs comment at line 596 explicitly
#   marks IgnoreColorRequirement enforcement as "residual §4.2b work; absent here."
#   The action mask does not check this modifier, so a flood_gate clause would
#   compile but have zero runtime effect.
#   Gap: engine (G-IGNORE-COLOR-MASK)
#
# Clause 2: [Security] delete 1 opponent Digimon with lowest DP
#   Requires dp_lte: { formula: { aggregate: { selector: lowest_dp, scope: opponent } } }
#   to filter candidates. The dp_lte predicate compiles but is NOT evaluated in
#   eval_permanent_fields — gap G-PRED-DP-LTE already documented in engine-gaps.md.
#   Gap: engine (G-PRED-DP-LTE)
#
# Clause 3: [Security] add this card to the hand
#   "Add this card to the hand" after security resolution requires raw_rust
#   (pattern: ex6_072_add_self_to_hand). No DSL step exists for returning the
#   played Option to the controller's hand post-security. However, this clause
#   is secondary to Clause 2 — both must be solved together.
#   Gap: dsl (G-ADD-OPTION-SELF-TO-HAND — sibling of G-ADD-TOP-SECURITY-TO-HAND)
#
# Clause 4: [Main] optionally link this card to 1 of your Digimon free of cost
#   The engine has link infrastructure (Effect::link_cost, OptionSubtype::Link,
#   attach_linked_card), but there is no DSL clause kind or step verb for
#   registering a link cost + filter. EX11-027 Maquinamon (the only existing
#   DSL link card) uses raw_rust for both link-requirements and the optional
#   link action step. No declarative link path exists in the DSL vocabulary.
#   Gap: dsl (G-DSL-LINK-VERB)
#
# Clause 5: [Main] delete 1 opponent Digimon with DP ≤ chosen own Digimon's DP
#   Requires: (a) select_own_permanent to bind a comparator Digimon, then
#   (b) select_opponent_permanent with filter dp_lte referencing the BOUND
#   Digimon's DP. The formula system has no "binding_dp: pick" primitive — it
#   can reference source_permanent's DP via { of: source_permanent, value: dp }
#   but cannot reference an arbitrary named binding. Furthermore, dp_lte is
#   not evaluated (G-PRED-DP-LTE). Both gaps apply.
#   Gap: hybrid (G-BINDING-DP-FORMULA + G-PRED-DP-LTE)
#
# Clause 6: Inherited — Link Requirements [Link] Lv.3 or higher: Cost 2
#   The inherited link-condition (level_gte: 3, cost: 2) is expressed in DCGO
#   via CardEffectFactory.AddSelfLinkConditionStaticEffect. There is no DSL
#   clause kind for declaring link requirements (no "kind: link_requirement"
#   or equivalent in clause.rs TypedDeclarativeBody variants).
#   Gap: dsl (G-DSL-LINK-VERB)
#
# Clause 7: Linked effect — [End of Your Turn] this Digimon may attack
#   DCGO shows an OnEndTurn effect that fires only when this card is linked
#   to a Digimon (activateClass.SetIsLinkedEffect(true)). The DSL has no
#   "scope: linked" clause kind — linked effects are a deployment scope not
#   represented in CompiledScope (FaceUp / Inherited / Linked is absent).
#   Gap: dsl (G-DSL-LINKED-SCOPE)
#
# Summary: BLOCKED (hybrid)
# Primary blocking gaps:
#   - G-DSL-LINK-VERB: no DSL verb/clause-kind for link registration or link action
#   - G-DSL-LINKED-SCOPE: no DSL scope for linked-card effects
#   - G-PRED-DP-LTE: dp_lte predicate not evaluated in eval_permanent_fields
#   - G-IGNORE-COLOR-MASK: IgnoreColorRequirement modifier not enforced in Rust action mask
#   - G-BINDING-DP-FORMULA: no formula primitive to read a named binding's DP
#
