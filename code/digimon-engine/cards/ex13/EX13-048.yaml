# EX13-048 Kotemon — Digimon, Lv.3, Black, DP 2000, Cost 3.
# Traits: Reptile. Form: Rookie. Attribute: Data.
#
# Printed text (per-card JSON; official Bandai DB bundle agrees):
#   Digivolve: Black Lv.2 / cost 0
#   [On Play] Reveal the top 3 cards of your deck. Add 1 card with [Knightmon]
#   in its text and 1 card with [Knightmon] in its name among them to the
#   hand. Return the rest to the bottom of the deck.
#   Inherited Effect: [All Turns] [Once Per Turn] When this Digimon would
#   leave the battle area other than by your effects, by deleting 1 of your
#   other Digimon with [Knightmon] in its text, it doesn't leave.
#   Official Q&A: "[X] in its text" = name, traits, effects, inherited,
#   (Rule), requirement text (e.g. [DarkKnightmon]) → `in_text_contains`.
#
# DCGO: no EX13_048.cs at b9a0638cd. Authored with the established idioms:
#   - Two `reveal_search` buckets, both to hand, resolved in printed order
#     with cross-bucket de-dup (EX13-038 Salamon). Each is mandatory when a
#     candidate exists.
#   - Inherited leave-prevention replacement (EX13-027 Chuumon / EX11-022):
#     optional "by deleting" cost, once per turn, not for own-effect removal.
#     `select_own_permanent` scopes the cost to YOUR Digimon; `other: true`
#     excludes the carrier.
# DCGO C# reference (present in the current submodule):
#   DCGO/Assets/Scripts/CardEffect/EX13/Black/EX13_048.cs. Its inherited clause
#   is followed exactly by owner ruling 2026-11-23 (W14 row (f)): declining the
#   deletion pick after accepting gives the [Once Per Turn] back
#   (`RemoveUse()`).

card: EX13-048
name: Kotemon
kind: digimon
level: 3
color: [black]
cost: 3
dp: 2000
traits: [Reptile]
form: Rookie
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 0

effects:
  - text: "[On Play] Reveal the top 3 cards of your deck. Add 1 card with [Knightmon] in its text and 1 card with [Knightmon] in its name among them to the hand. Return the rest to the bottom of the deck."
    when: on_play
    summary: "[On Play] Reveal 3; add 1 [Knightmon]-text card and 1 [Knightmon]-named card to hand; rest to deck bottom"
    process:
      - reveal_search:
          of: you
          count: 3
          buckets:
            - optional: false
              filter: { in_text_contains: Knightmon }
              to: hand
              max: 1
              prompt: "Add 1 card with [Knightmon] in its text to the hand"
            - optional: false
              filter: { name_contains: Knightmon }
              to: hand
              max: 1
              prompt: "Add 1 card with [Knightmon] in its name to the hand"
          remainder: bottom

  - text: "[All Turns] [Once Per Turn] When this Digimon would leave the battle area other than by your effects, by deleting 1 of your other Digimon with [Knightmon] in its text, it doesn't leave."
    kind: replacement
    scope: inherited
    trigger: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    active_when:
      none_of:
        - replacement_cause: own_effect
    summary: "Inherited [All Turns][OPT] By deleting 1 of your other [Knightmon]-text Digimon, this Digimon doesn't leave (not by your effects)"
    # DCGO flow (EX13_048.cs), followed by owner ruling 2026-11-23 ("parity
    # with DCGO", qa/rules/mechanics-gaps-2026-10.md W14 row (f)): offered only
    # while another of your [Knightmon]-text Digimon exists
    # (`CanActivateCondition`); after the accept, a pick with canNoSelect true.
    # None chosen -> `RemoveUse()`: the use is kept and the carrier leaves. One
    # chosen -> `isUsed` (spent); it doesn't leave only if that Digimon was
    # deleted.
    # Unpayable payers (owner ruling 2026-11-24, DCGO parity; quoted: "You
    # can pick a target that is immune from the removal, and it will fizzle.
    # Nothing is deleted, right? That is a valid choice."): DCGO's
    # `CanActivateCondition` is `HasMatchConditionPermanent` over the printed
    # predicate only, and the pick has no can-be-deleted filter, so a Digimon
    # that can't be deleted is offered and listed; `offer_unpayable_deletion_payers`
    # turns off the CR 4.3 15-7-4 payer filter for this clause only. Choosing
    # one: nothing is deleted, the removal is not cancelled (the paid-deletion
    # receipt stays empty), the carrier leaves, and the use stays SPENT (the
    # binding is present, so no refund). Loop check: the spent use cannot be
    # re-offered this turn; a pass gives the use back but the carrier then
    # leaves, which ends that would-leave event, so a re-offer needs a new
    # removal of a new carrier state.
    process:
      - select_own_permanent:
          bind_as: prevent_cost
          optional: true
          continue_on_decline: true
          offer_unpayable_deletion_payers: true
          filter:
            all_of:
              - other: true
              - kind: digimon
              - in_text_contains: Knightmon
          prompt: "Delete 1 of your other Digimon with [Knightmon] in its text"
      - delete_permanent: { target: prevent_cost }
      - cancel_replacement: {}
      - if:
          condition: { binding_absent: prevent_cost }
          then:
            # DCGO `if (!isUsed) activateClass.RemoveUse()`.
            - refund_opt: {}
