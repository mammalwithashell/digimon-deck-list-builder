# EX13-065 Sistermon Blanc (Awakened) — DUAL card (Digimon + Option).
# Digimon face: Lv.3 White/Yellow, DP 5000, Puppet / Rookie / Vaccine. The
# Digimon face has NO play cost (official DB "Play cost: D") — it is reached
# only by digivolving or by <Arts Digivolve>. Option face: White, use cost 5.
#
# Printed text (official Bandai DB bundle data/card_bundles/EX13-065.md):
#   DIGIMON FACE
#   [Digivolve] [Sistermon Blanc]: Cost 0
#   [Digivolve] Lv.2 w/[Huckmon] in text: Cost 1
#   <Decode ([Sistermon Blanc])> (When this Digimon would leave the battle area
#     other than in battle, you may play 1 specified Digimon card from its
#     digivolution cards without paying the cost.)
#   <Guard> (When any of your other Digimon would leave the battle area by your
#     opponent's effects, by deleting this Digimon, they don't leave.)
#   OPTION FACE
#   [Main] You may play 1 play cost 4 or lower card with [Sistermon] in its
#     name from your hand or trash without paying the cost. Then, to 1 of your
#     opponent's Digimon, give -3000 DP for the turn for each of your Digimon.
#   <Arts Digivolve> (Instead of trashing after use, your cards may digivolve
#     into this card without paying the cost.)
#
# DCGO C# reference: none at the submodule (no EX13_065.cs at b9a0638cd).
# Printed text + general_rule.pdf (16-35 Decode, 16-45 Guard) govern.
#
# ── Clause notes ─────────────────────────────────────────────────────────────
# Digivolve conditions: no standard colour circles exist, so ONLY the two
#   special conditions are authored (no colour form — a colour form would
#   invent an unprinted route). "[Sistermon Blanc]" is a NAME condition
#   (`name_is`, honours also_treated_as); "Lv.2 w/[Huckmon] in text" is the
#   broad text scan (`in_text_contains`, official Q&A: "text" = whole card).
# <Decode ([Sistermon Blanc])>: non-cancelling would-leave replacement, gated
#   other-than-battle, plays a [Sistermon Blanc]-named source free (BT25-025).
# <Guard>: engine keyword (16-45), static grant on the Digimon face.
# Option [Main]: optional hand-or-trash union pick (play cost <= 4, Sistermon
#   in name) → free play (EX12-074 idiom). Then a mandatory single-target
#   -3000 x (your Digimon count) DP for the turn; the count is read at
#   resolution, i.e. AFTER the optional play (the "Then" ordering).
# Arts Digivolve: `arts_digivolve: true` on the Option face.

card: EX13-065
name: "Sistermon Blanc (Awakened)"
kind: dual

level: 3
color: [white, yellow]
cost: 5
dp: 5000
traits: [Puppet]
form: Rookie
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { name_is: "Sistermon Blanc" }
    cost: 0
  - kind: digivolve
    from:
      all_of:
        - level_eq: 2
        - in_text_contains: Huckmon
    cost: 1

dual:
  digimon:
    level: 3
    dp: 5000
    colors: [white, yellow]
    traits: [Puppet]
    effect_text: |
      <Decode ([Sistermon Blanc])>
      <Guard> (When any of your other Digimon would leave the battle area by your opponent's effects, by deleting this Digimon, they don't leave.)
    effects:
      - kind: grant_keyword
        keyword: Guard
        summary: "<Guard>"

      - kind: replacement
        trigger: when_would_leave_battle_area
        optional: true
        active_when:
          none_of:
            - replacement_cause: battle
        summary: "<Decode ([Sistermon Blanc])> play 1 [Sistermon Blanc] from sources when this would leave outside battle"
        process:
          - select_material:
              of_permanent: replacement_subject
              bind_as: decode_source
              filter:
                all_of:
                  - kind: digimon
                  - name_is: "Sistermon Blanc"
              prompt: "Choose a [Sistermon Blanc] digivolution card to play"
          - play_from_materials:
              target: replacement_subject
              source_index: decode_source
              cost_delta: free
  option:
    use_cost: 5
    colors: [white]
    effect_text: |
      [Main] You may play 1 play cost 4 or lower card with [Sistermon] in its name from your hand or trash without paying the cost. Then, to 1 of your opponent's Digimon, give -3000 DP for the turn for each of your Digimon.
    arts_digivolve: true
    effects:
      - when: main
        summary: "[Main] May play 1 play cost <=4 [Sistermon] card from hand/trash free; then 1 opp Digimon -3000 DP per your Digimon for the turn"
        process:
          - select_union_zone:
              of: you
              zones: [hand, trash]
              optional: true
              bind_as: sistermon_free
              filter:
                all_of:
                  - any_of:
                      - kind: digimon
                      - kind: tamer
                  - name_contains: Sistermon
                  - play_cost_lte: 4
              prompt: "You may play 1 play cost 4 or lower card with [Sistermon] in its name from your hand or trash without paying the cost"
          - play_union_bound_free:
              binding: sistermon_free
          - select_opponent_permanent:
              bind_as: dp_target
              filter: { kind: digimon }
              prompt: "Give 1 of your opponent's Digimon -3000 DP for the turn for each of your Digimon"
          - add_dp_modifier:
              target: dp_target
              value:
                formula:
                  base: 0
                  per:
                    card_count_in_zone:
                      of: you
                      zone: battle_area
                      filter: { kind: digimon }
                  delta: -3000
              expiry: end_of_turn
