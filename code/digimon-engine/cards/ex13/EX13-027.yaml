# EX13-027 Chuumon — Digimon, Lv.3, Yellow, DP 1000, Cost 3.
# Traits: Beast. Form: Rookie. Attribute: Virus.
#
# Printed text (per-card JSON; official Bandai DB bundle agrees):
#   Digivolve: Yellow Lv.2 / cost 0; Black Lv.2 / cost 0
#   [When Moving] [On Play] Reveal the top 3 cards of your deck. Among them,
#   add 1 card with [Sukamon] or [Etemon] in its name to the hand and trash 1
#   such card. Return the rest to the bottom of the deck.
#   Inherited Effect: [All Turns] [Once Per Turn] When this Digimon would leave
#   the battle area other than by your effects, by deleting 1 other Digimon
#   with [Sukamon] in its name, it doesn't leave.
#   Official Q&A: with only 1 qualifying card, that card is added to the hand.
#
#   Official Q&A Q7287: the inherited effect may delete either player's
#   [Sukamon]-named Digimon.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/EX13/Yellow/EX13_027.cs
# (absent at b9a0638cd, present in the current submodule). Its inherited
# clause is followed exactly by owner ruling 2026-11-23 (W14 row (f)):
# declining the deletion pick after accepting gives the [Once Per Turn] back
# (`RemoveUse()`); the pick spans both battle areas.
#
# Reveal: `reveal_search` with a HAND bucket first and a TRASH bucket second.
# Buckets resolve in order with cross-bucket de-dup, so a lone match always
# lands in the hand (Official Q&A). Both picks are mandatory when available
# ("add 1 ... and trash 1"); the player chooses WHICH card goes where.
#
# Inherited: EX11-022 Karakurumon's inherited leave-prevention idiom. The
# `active_when` deliberately reads ONLY the replacement cause (no subject
# predicate), so the replacement stays self-scoped to the carrier ("this
# Digimon"). The first step is the cost selection, so the offer is gated on
# at least one OTHER [Sukamon]-named Digimon existing, on either side.

card: EX13-027
name: Chuumon
kind: digimon
level: 3
color: [yellow]
cost: 3
dp: 1000
traits: [Beast]
form: Rookie
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: yellow }
    cost: 0
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 0

effects:
  - when: [on_play, on_move]
    timing_conditions:
      - when: on_move
        condition: { event_permanent_is_source: true }
    summary: "[When Moving][On Play] Reveal 3; add 1 [Sukamon]/[Etemon]-named card to hand and trash 1 such card; rest to deck bottom"
    process:
      - reveal_search:
          of: you
          count: 3
          buckets:
            - optional: false
              filter:
                any_of:
                  - name_contains: Sukamon
                  - name_contains: Etemon
              to: hand
              max: 1
              prompt: "Add 1 card with [Sukamon] or [Etemon] in its name to the hand"
            - optional: false
              filter:
                any_of:
                  - name_contains: Sukamon
                  - name_contains: Etemon
              to: trash
              max: 1
              prompt: "Trash 1 card with [Sukamon] or [Etemon] in its name"
          remainder: bottom

  - text: "[All Turns] [Once Per Turn] When this Digimon would leave the battle area other than by your effects, by deleting 1 other Digimon with [Sukamon] in its name, it doesn't leave."
    kind: replacement
    scope: inherited
    trigger: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    active_when:
      none_of:
        - replacement_cause: own_effect
    summary: "Inherited [All Turns][OPT] By deleting 1 other [Sukamon]-named Digimon, this Digimon doesn't leave (not by your effects)"
    # DCGO flow (EX13_027.cs), followed by owner ruling 2026-11-23 ("parity
    # with DCGO", qa/rules/mechanics-gaps-2026-10.md W14 row (f)): offered only
    # while another [Sukamon]-named Digimon is on EITHER battle area
    # (`CanActivateCondition`; Q7287: "1 other Digimon" may be the opponent's);
    # after the accept, a pick with canNoSelect true. None chosen ->
    # `RemoveUse()`: the use is kept and the carrier leaves. One chosen ->
    # `isUsed` (spent); it doesn't leave only if that Digimon was deleted
    # (the paid-deletion pair `delete_permanent` + `cancel_replacement`).
    # Unpayable payers (owner ruling 2026-11-24, DCGO parity; quoted: "You
    # can pick a target that is immune from the removal, and it will fizzle.
    # Nothing is deleted, right? That is a valid choice."): DCGO's
    # `CanActivateCondition` is `HasMatchConditionPermanent` over the printed
    # predicate only, and the pick has no can-be-deleted filter, so a Digimon
    # that can't be deleted is offered and listed; `offer_unpayable_deletion_payers`
    # turns off the CR 4.3 15-7-4 payer filter for this clause only. Choosing
    # one: nothing is deleted, the removal is not cancelled (the paid-deletion
    # receipt stays empty), the carrier leaves, and the use stays SPENT (the
    # binding is present, so no refund). Loop check: the spent use cannot be
    # re-offered this turn; a pass gives the use back but the carrier then
    # leaves, which ends that would-leave event, so a re-offer needs a new
    # removal of a new carrier state. Not modelled: DCGO also drops an
    # opponent-owned candidate under "can't be chosen by your opponent's
    # effects" (`CanSelectBySkill`), which the engine does not enforce in any
    # DSL selection (engine-wide gap).
    process:
      - select_any_permanent:
          bind_as: prevent_cost
          optional: true
          continue_on_decline: true
          offer_unpayable_deletion_payers: true
          filter:
            all_of:
              - other: true
              - kind: digimon
              - name_contains: Sukamon
          prompt: "Delete 1 other Digimon with [Sukamon] in its name"
      - delete_permanent: { target: prevent_cost }
      - cancel_replacement: {}
      - if:
          condition: { binding_absent: prevent_cost }
          then:
            # DCGO `if (!isUsed) activateClass.RemoveUse()`.
            - refund_opt: {}
