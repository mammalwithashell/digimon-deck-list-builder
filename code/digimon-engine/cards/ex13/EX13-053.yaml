# EX13-053 Thundermon — Digimon, Lv.4, Black, DP 4000, Cost 4.
# Traits: Mutant. Attribute: Data.
#
# Printed text (official Bandai DB, data/card_bundles/EX13-053.md):
#   [On Play] [On Deletion] You may return up to 3 Digimon cards with [Mamemon]
#   in their texts from your trash to the top of the deck. Then, delete 1 of
#   your opponent's Digimon with a play cost of 3 or less. For each one this
#   effect returned, add 1 to this effect's play cost maximum.
#   (Rule) Name: Treated as including [Mamemon].
#   Inherited: [On Deletion] <De-Digivolve 1> 1 of your opponent's Digimon.
#   Digivolve: Black Lv.3 / 2; Yellow Lv.3 / 2.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/EX13/Black/EX13_053.cs
#   Shared [On Play]/[On Deletion] (`ActivateClassesForSharedEffects`, not
#   optional): ONE `SelectCardEffect` from the trash over [Mamemon]-text
#   Digimon cards, `maxCount = min(3, matches)`, `canNoSelect`, `canEndNotMax`
#   (any number 0..max, finished early or auto-finished at max). The picked
#   list is reversed and `AddLibraryTopCards`'d (each `Insert(0)`), so the
#   FIRST card picked ends on top of the deck. `returnedCount` = the picked
#   cards that ended in the library. Then `SelectPermanentEffect` (mandatory,
#   `canNoSelect: false`) over opponent Digimon with play cost
#   <= 3 + returnedCount, Mode.Destroy.
#   The (Rule) name mirrors DCGO's EX12_041 "Also treated as including
#   [Mamemon]", which rewrites each name to "Mamemon <name>": an alias that
#   CONTAINS [Mamemon] (name_contains matches) while the card is not a
#   [Mamemon] by exact name.
#
# DSL notes:
#   - "up to 3 ... to the top of the deck": ONE `select_count_capped_multi`
#     (zone trash, max 3, `optional_zero`: any count 0..3, PASS after >= 0
#     picks) — NOT three chained optional picks: DCGO asks one multi-select,
#     so a chain parks a (2/3) prompt where DCGO has already moved on to the
#     delete (raw-20261113T011922Z#g1). The bound list returns to the deck top
#     in pick order (`return_trash_list_to_deck_bottom { destination: top }`:
#     first pick on top, as DCGO's reverse + insert-at-0).
#   - "Then, delete ..." is mandatory regardless of the return. The cap is
#     `3 + <cards actually returned>` (`per: returned_card_count`).
#   - "[Mamemon] in their texts" → `in_text_contains` (broad text scan: name,
#     aliases, traits, all printed text — official Q&A).

card: EX13-053
name: Thundermon
kind: digimon
level: 4
color: [black]
cost: 4
dp: 4000
traits: [Mutant]
attribute: Data
also_treated_as: ["Mamemon Thundermon"]

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: black }
    cost: 2
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 2

effects:
  - text: "[On Play] [On Deletion] You may return up to 3 Digimon cards with [Mamemon] in their texts from your trash to the top of the deck. Then, delete 1 of your opponent's Digimon with a play cost of 3 or less. For each one this effect returned, add 1 to this effect's play cost maximum."
    when: [on_play, on_deletion]
    summary: "[On Play][On Deletion] You may return up to 3 [Mamemon]-text Digimon cards from trash to the deck top; then delete 1 opponent Digimon with play cost <= 3 (+1 per returned card)"
    process:
      - select_count_capped_multi:
          of: you
          zone: trash
          max: 3
          optional_zero: true
          filter:
            all_of:
              - kind: digimon
              - in_text_contains: Mamemon
          bind_as: returned
          prompt: "You may return up to 3 Digimon cards with [Mamemon] in their texts from your trash to the top of the deck"
      - return_trash_list_to_deck_bottom:
          of: you
          cards: returned
          destination: top
      - select_opponent_permanent:
          optional: false
          bind_as: victim
          filter:
            all_of:
              - kind: digimon
              - play_cost_lte: { base: 3, per: returned_card_count, delta: 1 }
          prompt: "Delete 1 of your opponent's Digimon with a play cost of 3 or less (+1 for each card returned)"
      - delete_permanent: { target: victim }

  - scope: inherited
    when: on_deletion
    summary: "Inherited [On Deletion] <De-Digivolve 1> 1 of your opponent's Digimon"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: dedigi
          filter: { kind: digimon }
          prompt: "<De-Digivolve 1> 1 of your opponent's Digimon"
      - de_digivolve:
          target: dedigi
          amount: 1
          stop_at_level: 3
