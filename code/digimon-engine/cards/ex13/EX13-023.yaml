# EX13-023 UlforceVeedramon — Digimon, Lv.6, Blue, DP 12000, Cost 12.
# Traits: Holy Warrior / Royal Knight / CS. Attribute: Vaccine.
#
# Printed text (official Bandai DB bundle data/card_bundles/EX13-023.md):
#   Digivolve: Blue Lv.5 / cost 3; [Digivolve] Lv.5 w/[CS] trait: Cost 3
#   Assembly -5: Lv.5 × Lv.4 × Lv.3, all w/[Veemon]/[Veedramon] in name
#   <Blocker> <Evade>
#   [On Play] [When Digivolving] [When Attacking] [Once Per Turn] 1 of your
#   Digimon may change orientation.
#   [On Play] [When Digivolving] You may return all of your opponent's Digimon
#   with the fewest digivolution cards to the bottom of the deck.
#   [All Turns] Your opponent's effects can't reduce this unsuspended
#   Digimon's DP, return its stacked cards to the hand or deck, or trash them.
#   Official Q&A: it prevents "(perform XX on) stacked cards" — top-stack
#   trashing (<De-Digivolve>), "trash a digivolution card", returning stacked
#   cards — but XX on the Digimon itself is still allowed.
#
# DCGO EX13_023.cs:
#   - Change orientation: SelectPermanentEffect over own Digimon with
#     `CanChangeOrientation`, canNoSelect: true; no pick → `RemoveUse()` (OPT
#     refunded); suspended → IUnsuspendPermanents, else SuspendPermanentsClass.
#     → select_own_permanent { can_change_orientation } (optional,
#       continue_on_decline) + refund_opt on decline + suspend/unsuspend by
#       the pick's current orientation.
#   - Deck bounce: optional; all opponent Digimon with `IsMinDigivolutionCards`
#     → DeckBottomBounceClass. → BT24-030 idiom (`materials_count_matches_
#       aggregate: fewest_materials` + return_to_deck bottom, sources included).
#   - All Turns: ImmuneFromDPMinusStaticEffect + CanNotBeTrashedBySkill +
#     CanNotBeReturnedToLibraryBySkill, each `IsOpponentEffect` and gated
#     `!IsSuspended`. → three self-auras `modifier: ImmuneFromDPMinus` /
#     `ImmuneFromStackTrashing` / `ImmuneFromStackReturn`, `modifier_from:
#     opponent`, `active_when: { source_is_unsuspended: true }`.
#
# ─── Status: IMPLEMENTED (all clauses) ─────────────────────────────────────
# The [All Turns] clause was BLOCKED on G-ENGINE-STACKED-CARD-RETURN-PROTECTION
# (RESOLVED 2026-10-01): new `ModifierType::ImmuneFromStackReturn` (consulted
# by the source → hand / deck movers), controller-scoped
# `ImmuneFromStackTrashing` (also consulted by selected-source trashing and
# <De-Digivolve>), and the aura `modifier_from:` slot that installs a named
# modifier opponent-scoped on each declarative tick.

card: EX13-023
name: UlforceVeedramon
kind: digimon
level: 6
color: [blue]
cost: 12
dp: 12000
traits: ["Holy Warrior", "Royal Knight", CS]
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: blue }
    cost: 3
  - kind: digivolve
    from: { level_eq: 5, trait_has: CS }
    cost: 3
  # ─── Assembly -5: Lv.5 × Lv.4 × Lv.3, all w/[Veemon]/[Veedramon] in name ───
  - kind: assembly
    materials:
      - filter:
          all_of:
            - level_eq: 5
            - any_of: [ { name_contains: Veemon }, { name_contains: Veedramon } ]
        zones: [trash]
        stack_under: true
      - filter:
          all_of:
            - level_eq: 4
            - any_of: [ { name_contains: Veemon }, { name_contains: Veedramon } ]
        zones: [trash]
        stack_under: true
      - filter:
          all_of:
            - level_eq: 3
            - any_of: [ { name_contains: Veemon }, { name_contains: Veedramon } ]
        zones: [trash]
        stack_under: true
    cost: 5

effects:
  - kind: grant_keyword
    keyword: Blocker
    summary: "<Blocker>"

  - kind: grant_keyword
    keyword: Evade
    summary: "<Evade>"

  # ─── [OP][WD][WA][OPT] 1 of your Digimon may change orientation ────────────
  - when: [on_play, when_digivolving, when_attacking]
    once_per_turn: true
    condition:
      any_permanent:
        of: you
        zone: [battle_area]
        kind: digimon
        can_change_orientation: true
    summary: "[On Play][When Digivolving][When Attacking][Once Per Turn] 1 of your Digimon may change orientation"
    process:
      - select_own_permanent:
          bind_as: orient_target
          optional: true
          continue_on_decline: true
          filter:
            all_of:
              - kind: digimon
              - can_change_orientation: true
          prompt: "1 of your Digimon may change orientation"
      - if:
          condition: { binding_absent: orient_target }
          then:
            # DCGO `activateClass.RemoveUse()` — no pick, no OPT use.
            - refund_opt: {}
          else:
            - if:
                condition:
                  any_permanent:
                    of: you
                    zone: [battle_area]
                    is_suspended: true
                    none_of:
                      - not_in_binding: orient_target
                then:
                  - unsuspend: { target: orient_target }
                else:
                  - suspend: { target: orient_target }

  # ─── [OP][WD] may return all opp Digimon with the fewest sources ───────────
  - when: [on_play, when_digivolving]
    optional: true
    condition:
      any_permanent: { of: opponent, zone: [battle_area], kind: digimon }
    summary: "[On Play][When Digivolving] You may return all of your opponent's Digimon with the fewest digivolution cards to the bottom of the deck"
    process:
      - for_each:
          over:
            of: opponent
            zone: [battle_area]
            kind: digimon
            materials_count_matches_aggregate:
              selector: fewest_materials
              of: opponent
          bind_as: fewest_target
          body:
            - return_to_deck:
                target: fewest_target
                position: bottom
                include_sources: true

  # ─── [All Turns] opponent-effect protections while unsuspended ─────────────
  - kind: aura
    target: {}
    active_when: { source_is_unsuspended: true }
    modifier: ImmuneFromDPMinus
    modifier_from: opponent
    summary: "[All Turns] Your opponent's effects can't reduce this unsuspended Digimon's DP"

  - kind: aura
    target: {}
    active_when: { source_is_unsuspended: true }
    modifier: ImmuneFromStackReturn
    modifier_from: opponent
    summary: "[All Turns] Your opponent's effects can't return this unsuspended Digimon's stacked cards to the hand or deck"

  - kind: aura
    target: {}
    active_when: { source_is_unsuspended: true }
    modifier: ImmuneFromStackTrashing
    modifier_from: opponent
    summary: "[All Turns] Your opponent's effects can't trash this unsuspended Digimon's stacked cards"
