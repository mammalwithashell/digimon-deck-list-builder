# EX13-028 Sukamon — Digimon, Lv.4, Yellow, DP 2000, Cost 3.
# Traits: Abnormal. Form: Champion. Attribute: Virus.
#
# Printed text (per-card JSON; official Bandai DB bundle agrees):
#   Digivolve: Yellow Lv.3 / cost 2; Black Lv.3 / cost 2
#   <Blocker>
#   [On Deletion] Reveal the top 3 cards of your deck. You may play 1 play cost
#   3 or lower Digimon card with [Chuumon] or [Sukamon] in its name among them
#   without paying the cost. Trash the rest.
#   Inherited Effect: [All Turns] [Once Per Turn] When this Digimon would leave
#   the battle area other than by your effects, by deleting 1 other Digimon
#   with [Sukamon] in its name, it doesn't leave.
#   Official Q&A Q7288: the inherited effect may delete either player's
#   [Sukamon]-named Digimon.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/EX13/Yellow/EX13_028.cs
# (absent at b9a0638cd, present in the current submodule). Its inherited
# clause is followed exactly by owner ruling 2026-11-23 (W14 row (f)):
# declining the deletion pick after accepting gives the [Once Per Turn] back
# (`RemoveUse()`); the pick spans both battle areas.
#
# [On Deletion]: EX13-059 BigMamemon idiom — the reveal and "trash the rest"
# are mandatory; only the play is a may (bucket min 0 / max 1).
# Inherited: identical to EX13-027 Chuumon (self-scoped leave-prevention,
# cost-gated on another [Sukamon]-named Digimon existing on either side).

card: EX13-028
name: Sukamon
kind: digimon
level: 4
color: [yellow]
cost: 3
dp: 2000
traits: [Abnormal]
form: Champion
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 2
  - kind: digivolve
    from: { level_eq: 3, color_is: black }
    cost: 2

effects:
  - kind: grant_keyword
    keyword: Blocker
    summary: "<Blocker>"

  - when: on_deletion
    summary: "[On Deletion] Reveal top 3; you may play 1 cost<=3 [Chuumon]/[Sukamon]-named Digimon free; trash the rest"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          buckets:
            - bind_as: play_pick
              min: 0
              max: 1
              filter:
                all_of:
                  - can_play_from_effect_without_cost: true
                  - kind: digimon
                  - play_cost_lte: 3
                  - any_of:
                      - name_contains: Chuumon
                      - name_contains: Sukamon
          prompt: "You may play 1 play cost 3 or lower Digimon card with [Chuumon] or [Sukamon] in its name without paying the cost"
      - play_from_revealed_free: { of: you, card: play_pick }
      - per_selected:
          selection: revealed
          bind_as: rest
          body:
            - trash_from_reveal:
                of: you
                card: rest

  - kind: replacement
    scope: inherited
    trigger: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    active_when:
      none_of:
        - replacement_cause: own_effect
    summary: "Inherited [All Turns][OPT] By deleting 1 other [Sukamon]-named Digimon, this Digimon doesn't leave (not by your effects)"
    # DCGO flow (EX13_028.cs, same body as EX13_027.cs), followed by owner
    # ruling 2026-11-23 ("parity with DCGO", qa/rules/mechanics-gaps-2026-10.md
    # W14 row (f)): offered only while another [Sukamon]-named Digimon is on
    # EITHER battle area (`CanActivateCondition`; Q7288); after the accept, a
    # pick with canNoSelect true. None chosen -> `RemoveUse()`: the use is
    # kept and the carrier leaves. One chosen -> `isUsed` (spent); it doesn't
    # leave only if that Digimon was deleted.
    process:
      - select_any_permanent:
          bind_as: prevent_cost
          optional: true
          continue_on_decline: true
          filter:
            all_of:
              - other: true
              - kind: digimon
              - name_contains: Sukamon
          prompt: "Delete 1 other Digimon with [Sukamon] in its name"
      - delete_permanent: { target: prevent_cost }
      - cancel_replacement: {}
      - if:
          condition: { binding_absent: prevent_cost }
          then:
            # DCGO `if (!isUsed) activateClass.RemoveUse()`.
            - refund_opt: {}
