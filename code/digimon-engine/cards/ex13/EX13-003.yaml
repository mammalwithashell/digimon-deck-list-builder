# EX13-003 Kyaromon — Digi-Egg, Lv.2, Yellow. Traits: Lesser / DATA SQUAD.
# Form: In-Training.
#
# Printed text (per-card JSON; official Bandai DB bundle agrees):
#   Inherited Effect: [Your Turn] [Once Per Turn] When your security stack is
#   removed from, this Digimon may digivolve into a Digimon card with
#   [Kentaurosmon] in its name or the [Holy Beast] trait in the hand with the
#   cost reduced by 1.
#
# DCGO: DCGO/Assets/Scripts/CardEffect/EX13/Yellow/EX13_003.cs (absent at
# b9a0638cd, present now). `SelectSourceCard` (:30-35) = IsDigimon && ([Holy
# Beast] || [Kentaurosmon] name) && CanPlayCardTargetFrame(carrier, PayCost:
# true) -- the pick filter AND the CanActivate gate (:44-48). Idiom: ST24-01
# Koromon + AD1-017 `on_own_security_removed` observer.
#
# - `active_when: { your_turn: true }`  — [Your Turn].
# - `condition` mirrors the CanActivate gate: a card that can actually digivolve
#   onto the carrier at the reduced cost must be in hand, so the OPT is not
#   burned on a trigger that can offer nothing.
# - KNOWN DCGO DIVERGENCE (rules over DCGO) on affordability, in BOTH the gate
#   and the pick: DCGO prices neither. For the occupied carrier frame,
#   `CanPlayCardTargetFrame(frame, PayCost: true)` is route-only -- its
#   `MaxMemoryCost < cost` check (CardSource.cs:1150-1162) runs only for an
#   EMPTY frame, and `CanEvolve` (CardSource.cs:1269-1290) / `EvoCosts` never
#   compare cost to memory. So with only unaffordable [Holy Beast]/[Kentaurosmon]
#   cards in hand DCGO still activates (using the [Once Per Turn] if accepted)
#   and offers them. We require the reduced cost to be payable in both places:
#   CR 4.3 1-3-11-1 forbids declaring a digivolve that can't be paid, and our
#   effect digivolve refuses it (Game::can_effect_digivolve_from_source_with_cost,
#   game_actions/digivolve.rs), so offering it would be an illegal choice. The
#   no-route exclusion matches DCGO. A DCGO recording that activates/offers on an
#   unaffordable-only hand is a known `dcgo_quirk`, not an engine bug.
# - "may" lives on the `select_hand` (optional: PASS declines); a declined pick
#   leaves `evo` unbound and the digivolve step no-ops.
# - `cost: { reduce: 1 }` — the target's printed digivolution cost minus 1;
#   requirements (level/colour circle) are enforced (not "ignoring").

card: EX13-003
name: Kyaromon
kind: digi_egg
level: 2
color: [yellow]
cost: 0
traits: [Lesser, DATA SQUAD]
form: In-Training

effects:
  - scope: inherited
    when: on_own_security_removed
    once_per_turn: true
    active_when: { your_turn: true }
    condition:
      count_gte:
        filter:
          of: you
          zone: [hand]
          all_of:
            - kind: digimon
            - any_of:
                - name_contains: "Kentaurosmon"
                - trait_has: "Holy Beast"
            - can_digivolve_onto_with_cost: { target: source, cost: { reduce: 1 } }
        n: 1
    summary: "Inherited [Your Turn][OPT] When your security stack is removed from, this Digimon may digivolve into a [Kentaurosmon]-name or [Holy Beast] Digimon card in hand, cost -1"
    process:
      - select_hand:
          of: you
          bind_as: evo
          optional: true
          filter:
            all_of:
              - kind: digimon
              - any_of:
                  - name_contains: "Kentaurosmon"
                  - trait_has: "Holy Beast"
              - can_digivolve_onto_with_cost: { target: source, cost: { reduce: 1 } }
          prompt: "This Digimon may digivolve into a Digimon card with [Kentaurosmon] in its name or the [Holy Beast] trait in your hand, with the cost reduced by 1"
      - if:
          condition: { binding_present: evo }
          then:
            - effect_initiated_digivolve:
                target: source
                from_hand: evo
                cost: { reduce: 1 }
