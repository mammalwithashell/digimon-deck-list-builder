# EX13-035 KingEtemon — Digimon, Lv.6, Yellow, DP 13000, Play Cost 13.
# Traits: Puppet. Form: Mega. Attribute: Virus.
#
# Printed text (official Bandai DB bundle data/card_bundles/EX13-035.md):
#   Digivolve: Yellow Lv.5 / 5, Black Lv.5 / 5;
#     [Digivolve] Lv.5 w/[Sukamon]/[Etemon] in name: Cost 4
#   [On Play] [When Digivolving] You may play up to 2 Digimon cards with
#     [Chuumon], [Sukamon] or [Etemon] in their names and up to 6 total play
#     cost from your hand or trash without paying the costs. By returning 10
#     such cards from your trash to the bottom of the deck, add 6 to the play
#     cost maximum.
#   [All Turns] While there are 3 or more Digimon with [Sukamon] or [Etemon] in
#     their names, give all of your opponent's Digimon <Security A. -1> and
#     -3000 DP.
#
# Official Q&A: "If activated, first choose if you are going to return 10
#   specified cards from your trash to the bottom of your deck. If you do, this
#   effect's play cost maximum is increased by 6. Afterwards, you can play up
#   to 6 total play cost worth of specified cards ..."
#
# DCGO C# reference: none at the submodule (no EX13_035.cs at b9a0638cd).
# Printed text + the official Q&A + general_rule.pdf govern.
#
# ── Clause notes ─────────────────────────────────────────────────────────────
# [OP][WD] — ordered per the Q&A:
#   1. Return-10 choice. Offered only when >= 10 "such cards" (Digimon cards
#      with Chuumon/Sukamon/Etemon in their names) are in your trash; a 2-way
#      EffectChoice (the decline is in the action space), then an exact-10
#      count-capped multi-select returned to the deck bottom.
#   2. Budget B = 6, or 12 when the 10 were returned (two literal branches,
#      keyed on the returned-card binding count).
#   3. "Up to 2 ... up to B total play cost": optional pick 1 (play cost <= B)
#      → free play; then optional pick 2 with play cost <= B - (pick 1's play
#      cost) (binding_play_cost over the union binding + subtract).
#      Both picks come from hand OR trash (select_union_zone). The two plays
#      are sequential within one effect resolution; pick 1's own [On Play]
#      triggers queue and resolve after this effect, so trigger timing matches
#      a simultaneous play.
# [All Turns] — "there are" without "your" counts BOTH battle areas (BT25-020
#   idiom: `owner: any`; count_gte's owner defaults to `you`). KingEtemon itself has [Etemon]
#   in its name and counts. Aura over all opponent Digimon: -3000 DP and
#   Security A. -1 (`security_attack: -1` → SecurityAttackChange).

card: EX13-035
name: KingEtemon
kind: digimon
level: 6
color: [yellow]
cost: 13
dp: 13000
traits: [Puppet]
form: Mega
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: yellow }
    cost: 5
  - kind: digivolve
    from: { level_eq: 5, color_is: black }
    cost: 5
  - kind: digivolve
    from:
      all_of:
        - level_eq: 5
        - any_of:
            - name_contains: Sukamon
            - name_contains: Etemon
    cost: 4

effects:
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] May return 10 named cards from trash (+6 max); then play up to 2 [Chuumon]/[Sukamon]/[Etemon] Digimon, up to 6 (or 12) total play cost, from hand/trash free"
    process:
      # ── 1. Optional return-10 (offered only when payable) ──────────────
      - if:
          condition:
            count_gte:
              filter:
                of: you
                zone: [trash]
                all_of:
                  - kind: digimon
                  - any_of:
                      - name_contains: Chuumon
                      - name_contains: Sukamon
                      - name_contains: Etemon
              n: 10
          then:
            - select_effect_choice:
                bind_as: return_choice
                labels:
                  - "Return 10 such cards from your trash to the bottom of the deck (+6 play cost maximum)"
                  - "Don't return"
                prompt: "Return 10 [Chuumon]/[Sukamon]/[Etemon] Digimon cards from your trash to add 6 to the play cost maximum?"
            - if:
                condition: { equals: [return_choice, 0] }
                then:
                  - select_count_capped_multi:
                      of: you
                      zone: trash
                      min: 10
                      max: 10
                      optional_zero: false
                      filter:
                        all_of:
                          - kind: digimon
                          - any_of:
                              - name_contains: Chuumon
                              - name_contains: Sukamon
                              - name_contains: Etemon
                      bind_as: returned_cards
                      prompt: "Return 10 [Chuumon]/[Sukamon]/[Etemon] Digimon cards from your trash to the bottom of the deck"
                  - return_trash_list_to_deck_bottom:
                      of: you
                      cards: returned_cards
                      destination: bottom

      # ── 2a. Budget 12 (returned 10) ────────────────────────────────────
      - if:
          condition:
            binding_count_eq:
              binding: returned_cards
              n: 10
          then:
            - select_union_zone:
                of: you
                zones: [hand, trash]
                optional: true
                bind_as: first_pick_12
                filter:
                  all_of:
                    - kind: digimon
                    - any_of:
                        - name_contains: Chuumon
                        - name_contains: Sukamon
                        - name_contains: Etemon
                    - play_cost_lte: 12
                prompt: "You may play a [Chuumon]/[Sukamon]/[Etemon] Digimon card (up to 12 total play cost) from your hand or trash without paying the cost"
            - if:
                condition:
                  binding_count_eq:
                    binding: first_pick_12
                    n: 1
                then:
                  - play_union_bound_free:
                      binding: first_pick_12
                  - select_union_zone:
                      of: you
                      zones: [hand, trash]
                      optional: true
                      bind_as: second_pick_12
                      filter:
                        all_of:
                          - kind: digimon
                          - any_of:
                              - name_contains: Chuumon
                              - name_contains: Sukamon
                              - name_contains: Etemon
                          - play_cost_lte:
                              subtract:
                                - 12
                                - binding_play_cost: first_pick_12
                      prompt: "You may play a second [Chuumon]/[Sukamon]/[Etemon] Digimon card within the remaining play cost maximum"
                  - play_union_bound_free:
                      binding: second_pick_12

      # ── 2b. Budget 6 (did not return) ──────────────────────────────────
      - if:
          condition:
            none_of:
              - binding_count_eq:
                  binding: returned_cards
                  n: 10
          then:
            - select_union_zone:
                of: you
                zones: [hand, trash]
                optional: true
                bind_as: first_pick_6
                filter:
                  all_of:
                    - kind: digimon
                    - any_of:
                        - name_contains: Chuumon
                        - name_contains: Sukamon
                        - name_contains: Etemon
                    - play_cost_lte: 6
                prompt: "You may play a [Chuumon]/[Sukamon]/[Etemon] Digimon card (up to 6 total play cost) from your hand or trash without paying the cost"
            - if:
                condition:
                  binding_count_eq:
                    binding: first_pick_6
                    n: 1
                then:
                  - play_union_bound_free:
                      binding: first_pick_6
                  - select_union_zone:
                      of: you
                      zones: [hand, trash]
                      optional: true
                      bind_as: second_pick_6
                      filter:
                        all_of:
                          - kind: digimon
                          - any_of:
                              - name_contains: Chuumon
                              - name_contains: Sukamon
                              - name_contains: Etemon
                          - play_cost_lte:
                              subtract:
                                - 6
                                - binding_play_cost: first_pick_6
                      prompt: "You may play a second [Chuumon]/[Sukamon]/[Etemon] Digimon card within the remaining play cost maximum"
                  - play_union_bound_free:
                      binding: second_pick_6

  - kind: aura
    summary: "[All Turns] While there are 3+ Digimon with [Sukamon]/[Etemon] in their names, all opponent Digimon get <Security A. -1> and -3000 DP"
    active_when:
      count_gte:
        filter:
          owner: any
          zone: [battle_area]
          kind: digimon
          any_of:
            - name_contains: Sukamon
            - name_contains: Etemon
        n: 3
    target:
      owner: opponent
      zone: [battle_area]
      kind: digimon
    dp_modifier: -3000
    security_attack: -1
