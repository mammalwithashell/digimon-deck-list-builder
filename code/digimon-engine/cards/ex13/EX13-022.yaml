# EX13-022 AeroVeedramon — Digimon, Lv.5, Blue, DP 7000, Cost 7.
# Traits: Holy Dragon, CS. Form: Ultimate. Attribute: Vaccine.
#
# Printed text (per-card JSON / official Bandai DB bundle):
#   Digivolve: Blue Lv.4 / 3.  [Digivolve] Lv.4 w/[CS] trait: Cost 3
#   [On Play] [When Digivolving] [When Attacking] [Once Per Turn] You may play 1
#   Tamer card with [Veedramon] in its text from your hand without paying the
#   cost.
#   [All Turns] [Once Per Turn] When any of your Tamers are played, 1 of your
#   opponent's Digimon or Tamers can't suspend until their turn ends.
#   Inherited: [All Turns] [Once Per Turn] When this Digimon with [Veedramon] in
#   its name suspends, it may unsuspend.
#
# DCGO: DCGO/Assets/Scripts/CardEffect/EX13/Blue/EX13_022.cs
#   - Alt digivolve HasCSTraits, level 4, cost 3.
#   - Shared [OP]/[WD]/[WA] (one hash "EX13_022_OP_WD_WA", maxCountPerTurn 1,
#     skippable, gated on an eligible hand Tamer): optional SelectHandEffect →
#     PlayPermanentCards(payCost: false); nothing picked → RemoveUse(). One
#     multi-timing clause with once_per_turn shares the lock across timings;
#     refund_opt on decline (BT25-085 idiom).
#   - [All Turns] OnEnterFieldAnyone (OPT, mandatory): an own Tamer entered
#     play → SelectPermanentEffect(opponent Digimon or Tamer, canNoSelect false)
#     → GainCantSuspendUntilOpponentTurnEnd → CannotSuspend modifier, expiry
#     end_of_opponents_turn (EX12-032 lock idiom).
#   - Inherited OnTappedAnyone (OPT, optional): carrier top card
#     ContainsCardName("Veedramon"), THIS permanent suspended, CanUnsuspend →
#     IUnsuspendPermanents (BT24-030 idiom + name gate).

card: EX13-022
name: AeroVeedramon
kind: digimon
level: 5
color: [blue]
cost: 7
dp: 7000
traits: [Holy Dragon, CS]
form: Ultimate
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: blue }
    cost: 3
  - kind: digivolve
    from: { level_eq: 4, trait_has: CS }
    cost: 3

effects:
  - when: [on_play, when_digivolving, when_attacking]
    once_per_turn: true
    condition:
      count_gte:
        filter:
          of: you
          zone: [hand]
          kind: tamer
          in_text_contains: Veedramon
        n: 1
    summary: "[On Play][When Digivolving][When Attacking][OPT] You may play 1 [Veedramon]-text Tamer from hand without paying the cost"
    process:
      - select_hand:
          of: you
          bind_as: tamer_pick
          optional: true
          filter:
            all_of:
              - kind: tamer
              - in_text_contains: Veedramon
          prompt: "You may play 1 Tamer card with [Veedramon] in its text from your hand without paying the cost"
      - play_from_hand_free: { of: you, hand_index: tamer_pick }
      - if:
          condition: { binding_absent: tamer_pick }
          then:
            - refund_opt: {}

  - when: on_ally_played
    active_when: { all_turns: true }
    once_per_turn: true
    condition:
      all_of:
        - event_target_owner: you
        - event_target_kind: tamer
    summary: "[All Turns][OPT] When any of your Tamers are played, 1 opponent Digimon or Tamer can't suspend until their turn ends"
    process:
      - select_opponent_permanent:
          bind_as: lock_target
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          prompt: "Choose 1 of your opponent's Digimon or Tamers that can't suspend until their turn ends"
      - add_modifier:
          target: lock_target
          modifier: CannotSuspend
          value: 1
          expiry: end_of_opponents_turn

  - scope: inherited
    when: on_suspend
    active_when: { all_turns: true }
    once_per_turn: true
    optional: true
    condition:
      all_of:
        - event_permanent_is_source: true
        - source_name_contains: Veedramon
    summary: "Inherited [All Turns][OPT] When this [Veedramon]-name Digimon suspends, it may unsuspend"
    process:
      - unsuspend: { target: source }
