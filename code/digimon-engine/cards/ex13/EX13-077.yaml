# EX13-077 Omnimon: Merciful Mode — Digimon, Lv.7, White, DP 16000, Cost 16.
# Traits: Holy Warrior / ADVENTURE. Form: Mega. Attribute: Vaccine.
#
# Printed text (official Bandai DB, data/card_bundles/EX13-077.md):
#   [On Play] [When Digivolving] 1 of your Digimon may attack without
#   suspending. Then, for every 2 of your Digimon and Tamers' colors, activate
#   1 effect below:
#   ・This Digimon may battle 1 of your opponent's Digimon.
#   ・By returning 5 cards from your opponent's trash to the bottom of the
#     deck, <Recovery +1>.
#   [All Turns] This Digimon gains all colors in its digivolution cards, and
#   +1000 DP for each of your Digimon and Tamers' colors.
#   Assembly -8: 6 [ADVENTURE] trait Digimon cards w/different colors
#   Digivolve: [Omnimon]: Cost 2.
#   Digivolve circle: rainbow (any colour) Lv.6 / cost 6. The bundle listed no
#   circle until 2026-11-21 because the mirror builder dropped "Multicolor".
#   Official Q&A: the battle starts immediately and follows the standard
#   battle rules.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/EX13/White/EX13_077.cs
#   - Shared [On Play]/[When Digivolving]: optional attack without suspending,
#     then `effectLoops = OwnerColorCount() / 2`; each loop checks `canBattle`
#     (`IsExistOnBattleAreaDigimon && opp has Digimon`) and `canRecover`
#     (`opp trash >= 5`), breaks immediately when `!canBattle && !canRecover`,
#     and offers a `SetIntSelection` menu over playable modes (`1 = Battle`,
#     `2 = Return 5`, `3 = Don't activate`, breaking on `3`). Return-5 goes
#     directly to `SelectCardEffect(maxCount: 5, canEndNotMax: false,
#     canNoSelect: true)` with no extra yes/no prompt.
#
# DSL notes:
#   - Assembly "w/different colors": `distinct_by: color`
#     (G-ASSEMBLY-DISTINCT-BY-COLOR) — a SET-level constraint: the six cards
#     must admit an injective card → printed-color assignment (a multicolor
#     card stands for exactly one of its colors). Eligibility (and thus the
#     mask's hidden −8 availability) is a bipartite matching; each pick masks
#     candidates that would break the matching.
#   - [OP][WD] attack: optional own-Digimon pick (`continue_on_decline` — a
#     declined attack must not skip the "Then") + `may_attack_now
#     { without_suspending: true }` (EX12-014 / BT21-072 idioms). The attack
#     is declared inline; its triggers, battle and security checks wait until
#     the complete effect (including the "Then" choices) finishes. Q7474 fixes
#     the repeat count when the effect activates.
#   - "for every 2 of your Digimon and Tamers' colors, activate 1 effect":
#     `repeat_effect_choice` with `labels: []` (so count is read once) wrapping
#     a gated `select_effect_choice` with `legal_when` mirroring DCGO's
#     `canBattle` / `canRecover` / `Don't activate` (indices 0, 1, 2 → DCGO
#     1-based values 1, 2, 3); skips remaining loops once neither mode is
#     payable or `"Don't activate"` (2) was picked.
#   - Battle mode: optional opp-Digimon pick + `battle: { attacker: this }`
#     (BT25-058 idiom — an effect battle, not an attack; Q&A: standard rules).
#   - Return mode: "By returning 5 cards …, <Recovery +1>" — direct
#     `select_count_capped_multi` (`min: 5, max: 5, optional_zero: true`:
#     declinable at 0 picks, all-or-nothing once started) →
#     `return_trash_list_to_deck_bottom` + `<Recovery +1>` when all 5 picked.
#   - [All Turns]: self-aura `modifier: AddColor` with no payload = "gains the
#     colors of its digivolution cards" (BT8-084 idiom, read live), plus a
#     `dp_modifier_fn` of +1000 per distinct color across own Digimon + Tamers
#     (AD1-004 idiom).

card: EX13-077
name: "Omnimon: Merciful Mode"
kind: digimon
level: 7
color: [white]
cost: 16
dp: 16000
traits: ["Holy Warrior", ADVENTURE]
attribute: Vaccine

alt_paths:
  # Printed RAINBOW circle: any-colour Lv.6 / cost 6 (card image; official EN DB
  # "Multicolor 6 from Lv.6", JP 「全 Lv.6から6」 = all colours; DCGO asset: one
  # EvoCosts row per colour). A rainbow circle is ANY colour, so the gate carries
  # no `color_is` — the Ukkomon (BT16-082) idiom. cards.json holds it as seven rows.
  - kind: digivolve
    from: { any_color: true, level_eq: 6 }
    cost: 6
  # Printed black text: "[Digivolve] [Omnimon]: Cost 2".
  - kind: digivolve
    from: { name_is: Omnimon }
    cost: 2
  # ─── Assembly -8: 6 [ADVENTURE] trait Digimon cards w/different colors ─────
  - kind: assembly
    materials:
      - filter:
          all_of:
            - kind: digimon
            - trait_has: ADVENTURE
        repeat: { min: 6, max: 6 }
        distinct_by: color
        zones: [trash]
        stack_under: true
    cost: 8

effects:
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] 1 of your Digimon may attack without suspending; then per 2 of your Digimon/Tamer colors activate 1: this Digimon may battle 1 opp Digimon, or return 5 opp trash cards to deck bottom for <Recovery +1>"
    process:
      - select_own_permanent:
          bind_as: attacker
          optional: true
          continue_on_decline: true
          # DCGO `CanAttack(withoutTap: true)`: only a Digimon that could
          # actually attack without suspending is offered; none ⇒ no prompt.
          filter: { kind: digimon, can_attack: { without_suspending: true } }
          prompt: "1 of your Digimon may attack without suspending"
      - may_attack_now:
          attacker: attacker
          targets: any
          without_suspending: true
          optional: true
      - repeat_effect_choice:
          count:
            floor_div:
              - base: 0
                per:
                  distinct_colors_count:
                    of: you
                    zone: battle_area
                    filter:
                      any_of:
                        - kind: digimon
                        - kind: tamer
                delta: 1
              - 2
          labels: []
          bind_as: mode
          body:
            - if:
                condition:
                  all_of:
                    - none_of:
                        - equals: [mode, 2]
                    - any_of:
                        - all_of:
                            - on_field: true
                            - any_permanent:
                                of: opponent
                                zone: [battle_area]
                                kind: digimon
                        - count_gte:
                            filter:
                              of: opponent
                              zone: [trash]
                            n: 5
                then:
                  - select_effect_choice:
                      labels:
                        - "This Digimon may battle 1 of your opponent's Digimon"
                        - "Return 5 cards from your opponent's trash to the bottom of the deck: <Recovery +1>"
                        - "Don't activate"
                      legal_when:
                        - all_of:
                            - on_field: true
                            - any_permanent:
                                of: opponent
                                zone: [battle_area]
                                kind: digimon
                        - count_gte:
                            filter:
                              of: opponent
                              zone: [trash]
                            n: 5
                        - {}
                      bind_as: mode
                      prompt: "Activate 1 effect (1 per 2 of your Digimon and Tamers' colors)"
                  - if:
                      condition: { equals: [mode, 0] }
                      then:
                        - select_opponent_permanent:
                            bind_as: battle_target
                            optional: true
                            continue_on_decline: true
                            filter: { kind: digimon }
                            prompt: "This Digimon may battle 1 of your opponent's Digimon"
                        - battle:
                            attacker: this
                            defender: battle_target
                  - if:
                      condition: { equals: [mode, 1] }
                      then:
                        - select_count_capped_multi:
                            of: opponent
                            zone: trash
                            min: 5
                            max: 5
                            filter: {}
                            bind_as: returned
                            optional_zero: true
                            prompt: "Return 5 cards from your opponent's trash to the bottom of their deck"
                        - if:
                            condition: { binding_count_eq: { binding: returned, n: 5 } }
                            then:
                              - return_trash_list_to_deck_bottom:
                                  of: opponent
                                  cards: returned
                              - recover: { of: you, count: 1 }

  # ─── [All Turns] gains the digivolution cards' colors ─────────────────────
  - kind: aura
    target: {}
    active_when: { all_turns: true }
    modifier: AddColor
    summary: "[All Turns] This Digimon gains all colors in its digivolution cards"

  # ─── [All Turns] +1000 DP per color across your Digimon and Tamers ─────────
  - kind: aura
    target: {}
    active_when: { all_turns: true }
    dp_modifier_fn:
      base: 0
      per:
        distinct_colors_count:
          of: you
          zone: battle_area
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
      delta: 1000
    summary: "[All Turns] +1000 DP for each of your Digimon and Tamers' colors"
