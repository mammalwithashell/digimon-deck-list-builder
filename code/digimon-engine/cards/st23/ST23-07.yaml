# ST23-07 Armalizamon — Digimon, Lv.4, Green, DP 6000, Cost 5.
# Traits: Reptile, Glowing Dawn, BEATBREAK. Attribute: Data.
# Printed digivolve box: [Digivolve] Lv.3 w/[Glowing Dawn] trait: Cost 2.
#
# Printed card text (data/cards.json — verbatim):
#   [On Play] [When Digivolving] If you have 1 or fewer Tamers, you may play 1
#     Tamer card with the [Glowing Dawn] trait from your hand without paying the
#     cost.
#   Inherited: ＜Piercing＞ (When this Digimon attacks and deletes an opponent's
#     Digimon in battle, it checks security before the attack ends.)
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/ST23/Green/ST23_07.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
#
# Alt-digivolve (timing None): AddSelfDigivolutionRequirementStaticEffect(
#   level 3, TopCard EqualsTraits("Glowing Dawn"), cost 2). → alt_paths
#   digivolve from level 3 + Glowing Dawn trait, cost 2.
# Shared OP/WD (ActivateClassesForSharedEffects, optional false at the activate
#   level, AdditionalActivateCondition: own Tamer count <= 1):
#   "If you have 1 or fewer Tamers, you may play 1 Tamer card with the [Glowing
#   Dawn] trait from your hand without paying the cost." The SelectHandEffect is
#   canNoSelect:true (Mode.PlayForFree) over Glowing-Dawn Tamers — so the "may"
#   is carried by the optional select_hand. → when [on_play, when_digivolving],
#   active_when count_lte Tamer count 1, optional select_hand { kind: tamer,
#   trait_has: Glowing Dawn } + play_from_hand_free.
# ESS Piercing (OnDetermineDoSecurityCheck): PierceSelfEffect(isInheritedEffect)
#   → scope: inherited + grant_keyword Piercing.

card: ST23-07
name: "Armalizamon"
kind: digimon
level: 4
color: [green]
cost: 5
dp: 6000
traits: [Reptile, Glowing Dawn, BEATBREAK]
attribute: Data

# Alt-digivolve: Lv.3 with the [Glowing Dawn] trait / cost 2.
alt_paths:
  - kind: digivolve
    from: { level_eq: 3, trait_has: "Glowing Dawn" }
    cost: 2

effects:
  # ─── [On Play][When Digivolving] if <=1 Tamer, may play 1 [Glowing Dawn] Tamer
  #     from hand without paying the cost ──────────────────────────────────────
  - when: [on_play, when_digivolving]
    active_when:
      count_lte:
        filter:
          of: you
          zone: [battle_area]
          kind: tamer
        n: 1
    summary: "[On Play][When Digivolving] If you have 1 or fewer Tamers, you may play 1 [Glowing Dawn] Tamer from your hand without paying the cost"
    process:
      # "you may play" — optional select_hand carries the "may"; declining
      # (PASS) leaves the binding unset so play_from_hand_free is a no-op.
      - select_hand:
          of: you
          bind_as: tamer_pick
          optional: true
          filter:
            all_of:
              - kind: tamer
              - trait_has: "Glowing Dawn"
          prompt: "You may play 1 [Glowing Dawn] Tamer from your hand without paying the cost"
      - play_from_hand_free:
          of: you
          hand_index: tamer_pick

  # ─── Inherited <Piercing> ──────────────────────────────────────────────────
  - scope: inherited
    kind: grant_keyword
    keyword: Piercing
    summary: "Inherited <Piercing>"
