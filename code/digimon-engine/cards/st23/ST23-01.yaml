# ST23-01 Kekkomon — Digi-Egg, Lv.2, Green, Cost 0.
# Traits: Lesser, Glowing Dawn, BEATBREAK.
#
# Printed card text (data/cards.json — verbatim):
#   The FACE has NO effect.
#   Inherited Effect [When Attacking] [Once Per Turn] By trashing the bottom
#     face-down card from under any of your Tamers, this Digimon may digivolve
#     into a [Glowing Dawn] trait Digimon card in the hand with the cost reduced
#     by 2.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/ST23/Green/ST23_01.cs
#
# ─── DCGO crosscheck ─────────────────────────────────────────────────────────
#
# Inherited OnAllyAttack ActivateClass (maxPerTurn 1, isOptional true, hash
# ST23_01_WA — ST23_01.cs:20):
#   - CanActivate (:33-37): only a Tamer with a face-down digivolution source
#     (HasFaceDownDigivolutionCards). There is NO hand gate on activation.
#   - The optional activation is the "By trashing ..." choice: once accepted,
#     ActivateCoroutine (:56-96) picks the Tamer (a pick only with >1 eligible
#     Tamer) and trashes its bottom face-down source unconditionally, THEN — if
#     a [Glowing Dawn] card is in hand — runs DigivolveIntoHandOrTrashCard
#     (payCost: true, reduceCost 2, isHand: true, isOptional default true).
#     CR 4.3 15-7-5: the player may pay the "By X" condition whether or not the
#     digivolve after it can be executed, so the cost is never gated on a
#     payoff in hand; 15-7-4: it can't be chosen when no Tamer has a face-down
#     source (the condition below + the verb's unpayable abort).
#   - Here: clause-level `optional: true` = the DCGO yes/no activation
#     (declining pays nothing and keeps the [Once Per Turn]); the mandatory
#     trash_bottom_face_down_source_under_tamer = the cost (Tamer pick
#     surfaced); then the optional select_hand = "may digivolve".
#   - Payoff: effect-initiated digivolve of THIS permanent (target: source)
#     into a hand [Glowing Dawn] card with cost: { reduce: 2 }, requirements
#     honored (ignore_requirements stays false).

card: ST23-01
name: "Kekkomon"
kind: digi_egg
level: 2
color: [green]
cost: 0
traits: [Lesser, Glowing Dawn, BEATBREAK]
form: In-Training

effects:
  # ─── Inherited [When Attacking][OPT] trash bottom FD under a Tamer → may
  #     digivolve into a [Glowing Dawn] hand card with the cost reduced by 2 ───
  - scope: inherited
    when: when_attacking
    once_per_turn: true
    # "By trashing ..." is an optional processing condition (DCGO isOptional):
    # the player chooses whether to pay it (CR 4.3 15-7-5).
    optional: true
    # DCGO CanActivate (ST23_01.cs:33-37): the cost must be payable (CR 4.3
    # 15-7-4). No hand gate — the cost may be paid with no payoff (15-7-5).
    condition:
      any_permanent:
        of: you
        zone: [battle_area]
        kind: tamer
        has_face_down_source: true
    summary: "Inherited [When Attacking][OPT] By trashing the bottom face-down card under a Tamer, may digivolve into a [Glowing Dawn] hand card with the cost reduced by 2"
    process:
      # "By trashing the bottom face-down card from under any of your Tamers" —
      # the activation cost (multi-Tamer pick surfaced), paid first and
      # unconditionally once the effect is activated (ST23_01.cs:90-93).
      - trash_bottom_face_down_source_under_tamer: { of: you }
      # "this Digimon may digivolve into a [Glowing Dawn] trait Digimon card in
      # the hand" — the optional select_hand carries the "may".
      - select_hand:
          of: you
          bind_as: gd_evo
          optional: true
          # DCGO DigivolveIntoHandOrTrashCard (CardEffectCommons.cs:858-881)
          # adds IsDigimon && !CanNotEvolve && CanPlayCardTargetFrame(PayCost:
          # true, reduce 2) to ST23_01.cs:39-42's trait filter: only a card this
          # Digimon can digivolve into AND whose reduced cost is payable is
          # offered (CR 4.3 1-3-11-1, 8-1-2-6).
          filter:
            all_of:
              - kind: digimon
              - trait_has: "Glowing Dawn"
              - can_digivolve_onto_with_cost: { target: source, cost: { reduce: 2 } }
          prompt: "Digivolve into a [Glowing Dawn] trait Digimon card in your hand with the cost reduced by 2"
      - if:
          condition: { binding_present: gd_evo }
          then:
            # "with the cost reduced by 2" — paid, requirements honored.
            - effect_initiated_digivolve:
                target: source
                from_hand: gd_evo
                cost: { reduce: 2 }
