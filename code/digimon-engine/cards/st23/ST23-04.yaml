# ST23-04 Murasamemon — Digimon, Lv.5, Yellow, DP 7000, Cost 7.
# Traits: Beastkin, Glowing Dawn, BEATBREAK. Attribute: Virus.
# Printed digivolve box: [Digivolve] Lv.4 w/[Glowing Dawn] trait: Cost 3
# (plus the standard Lv.4 yellow / cost 3 corner cost).
#
# Printed card text (data/cards.json — verbatim, confirmed vs DCGO):
#   <Alliance> (When this Digimon attacks, by suspending 1 of your other
#     Digimon, add the suspended Digimon's DP to this Digimon and it gains
#     <Security A. +1> for the attack.)
#   [On Play] [When Digivolving] 1 of your opponent's Digimon gets -5000 DP for
#     the turn. Then, if it's your turn, by trashing the bottom face-down card
#     from under any of your Tamers, you may play or use 1 [Glowing Dawn] trait
#     card from your hand with the cost reduced by 3.
#   Inherited: [End of Attack] [Once Per Turn] By trashing the bottom face-down
#     card from under any of your Tamers, this [Glowing Dawn] trait Digimon
#     unsuspends.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/ST23/Yellow/ST23_04.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
#
# Alt-digivolve (timing None): AddSelfDigivolutionRequirementStaticEffect(
#   level: 4, TopCard.EqualsTraits("Glowing Dawn"), digivolutionCost: 3).
#   → alt_paths digivolve from level 4 + Glowing Dawn trait, cost 3.
# Alliance (OnAllyAttack): AllianceSelfEffect → grant_keyword Alliance.
# Shared OP/WD (ActivateClassesForSharedEffects, optional: false, onPlay +
#   whenDigivolving) — SharedActivateCoroutine:
#   1. Select 1 opponent Digimon (maxCount = min(1, count), canNoSelect:false)
#      → -5000 DP UntilEachTurnEnd. (Mandatory pick when one exists.)
#   2. THEN if IsOwnerTurn(card) AND a Tamer carries a face-down source: a
#      `canNoSelect:true` Tamer pick (the "may" — decline = don't engage) →
#      TrashDigivolutionCardsFromTopOrBottom(bottom, face-down). If trashed, a
#      `canNoSelect:true` SelectHandEffect over [Glowing Dawn] cards
#      (`IsOption && !CanNotPlayThisOption` OR HasPlayCost & CanPlayAsNewPermanent
#      at fixedCost = cost-3) → ChangeCostClass -3 over the picked card, then
#      PlayOptionCards / PlayPermanentCards (payCost: true).
#   → Modelled as two clauses on the same trigger:
#     Clause A (mandatory): select_opponent_permanent (1 Digimon) →
#       add_dp_modifier -5000 expiry end_of_turn.
#     Clause B (optional, your-turn): the OUTER optional accept/decline gate IS
#       DCGO's trash-pick canNoSelect (decline = don't trash / don't play). On
#       accept: trash_bottom_face_down_source_under_tamer (process cost — aborts
#       if no eligible Tamer), then an OPTIONAL select_hand over [Glowing Dawn]
#       cards (the hand-pick canNoSelect — trashed but may still decline the
#       play/use), then play_or_use_from_hand cost_delta reduce 3. The unified
#       verb inspects kind: Digimon/Tamer play, Option use, Dual face-choice.
#       (Substrate: G-PLAY-OR-USE-FROM-HAND — EffectContext::play_or_use_from_hand_with_cost.)
# Inherited [End of Attack][OPT]: trash bottom FD under a Tamer (process
#   activation cost), then if this Digimon has [Glowing Dawn], unsuspend self.
#   → scope: inherited, when: end_of_attack, once_per_turn, optional,
#   active_when source_permanent_trait_has "Glowing Dawn"; process:
#   trash_bottom_face_down_source_under_tamer + unsuspend self.

card: ST23-04
name: "Murasamemon"
kind: digimon
level: 5
color: [yellow]
cost: 7
dp: 7000
traits: [Beastkin, Glowing Dawn, BEATBREAK]
attribute: Virus

# Alt-digivolve: Lv.4 with the [Glowing Dawn] trait / cost 3.
alt_paths:
  - kind: digivolve
    from: { level_eq: 4, trait_has: "Glowing Dawn" }
    cost: 3

effects:
  # ─── <Alliance> ────────────────────────────────────────────────────────────
  - kind: grant_keyword
    keyword: Alliance
    summary: "<Alliance>"

  # ─── [On Play][When Digivolving] (A) 1 opp Digimon -5000 DP for the turn ────
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] 1 of your opponent's Digimon gets -5000 DP for the turn"
    process:
      - select_opponent_permanent:
          bind_as: dp_target
          filter: { kind: digimon }
          prompt: "1 of your opponent's Digimon gets -5000 DP for the turn"
      - add_dp_modifier:
          target: dp_target
          value: -5000
          expiry: end_of_turn

  # ─── [On Play][When Digivolving] (B) if your turn, by trashing a bottom
  #     face-down card under a Tamer, you may play or use 1 [Glowing Dawn] card
  #     from hand with the cost reduced by 3 ────────────────────────────────────
  - when: [on_play, when_digivolving]
    optional: true
    active_when: { your_turn: true }
    summary: "[On Play][When Digivolving] If your turn, by trashing a bottom face-down card under a Tamer, you may play or use 1 [Glowing Dawn] card from hand with the cost reduced by 3"
    process:
      # Pay cost: trash the bottom face-down card under a chosen Tamer (process
      # activation cost — aborts the rest if no eligible Tamer exists).
      - trash_bottom_face_down_source_under_tamer: { of: you }
      # "you may play or use" — the OPTIONAL select_hand carries the inner
      # decline (trashed, but may still decline the play/use). Filter by the
      # [Glowing Dawn] trait only; the play-or-use verb routes by kind.
      - select_hand:
          of: you
          bind_as: gd_pick
          optional: true
          filter: { trait_has: "Glowing Dawn" }
          prompt: "You may play or use 1 [Glowing Dawn] card from your hand with the cost reduced by 3"
      - play_or_use_from_hand:
          of: you
          hand_index: gd_pick
          cost_delta: { reduce: 3 }

  # ─── Inherited [End of Attack][OPT] trash FD under Tamer → unsuspend self ──
  - scope: inherited
    when: end_of_attack
    once_per_turn: true
    optional: true
    active_when:
      source_permanent_trait_has: "Glowing Dawn"
    summary: "[Inherited][End of Attack][OPT] By trashing a bottom face-down card under a Tamer, this [Glowing Dawn] Digimon unsuspends"
    process:
      - trash_bottom_face_down_source_under_tamer: { of: you }
      - unsuspend: { target: source }
