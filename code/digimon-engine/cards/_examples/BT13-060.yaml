card: BT13-060
name: "Rosemon: Burst Mode"
kind: digimon
level: 7
color: [green]
cost: 15
dp: 15000
traits: [Fairy]
alt_paths:
  - kind: digivolve
    from: { level_eq: 6, name_is: "Rosemon" }
    cost: 5
  - kind: burst_digivolve
    from: { level_eq: 6, name_is: "Rosemon" }
    cost: 0
    extra_cost:
      - select_own_permanent:
          bind_as: yoshi
          filter: { kind: tamer, name_is: "Yoshino Fujieda" }
          prompt: "Return Yoshino Fujieda"
      - return_to_hand: { target: yoshi }
    on_burst_turn_end:
      - trash_top_source: { target: self }

effects:
  - when: when_digivolving
    process:
      - select_opponent_permanent:
          bind_as: d
          filter: { kind: digimon }
          prompt: "Suspend opponent Digimon"
      - suspend: { target: d }
      - select_opponent_permanent:
          bind_as: t
          filter: { kind: tamer }
          prompt: "Suspend opponent Tamer"
      - suspend: { target: t }
      - add_modifier:
          target:
            of: opponent
            zone: [battle_area]
            any_of:
              - kind: digimon
              - kind: tamer
          modifier: CannotUnsuspend
          value: 1
          expiry: end_of_opponents_turn

  # NOTE: The [When Attacking] "trash for every 2 suspended" clause uses
  # lose_count_bound sugar which is NOT in StepSpec for Phase 0.
  # This clause is OMITTED per task instructions — flagged for Phase 3
  # when for_each-over-bounded-iterator is added to the DSL.
