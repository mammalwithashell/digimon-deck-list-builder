card: BT18-102
name: Susanoomon
kind: digimon
level: 7
color: [white]
cost: 9
dp: 16000
traits: [Shaman, Hybrid]
ace_overflow: -5
alt_paths:
  - kind: assembly
    from:
      any_of:
        - { name_is: "Takuya Kanbara", level_eq: 6 }
        - { name_is: "Koji Minamoto", level_eq: 6 }
    materials:
      - filter: { trait_has: "Hybrid" }
        repeat: { min: 10, max: 10 }
        stack_under: true
    cost: 6
  - kind: burst_digivolve
    marker: true
    cost: 0

effects:
  - when: [when_digivolving, when_attacking]
    process:
      - select_opponent_permanent:
          bind_as: tgt
          filter:
            dp_lte:
              base: 10000
              per: digivolution_color_count
              delta: 2000
          prompt: "Delete"
      - delete_permanent: { target: tgt }

  # [When Attacking] "By placing up to 5 Tamer cards from this Digimon's
  # digivolution cards as your bottom security cards, for each one, trash your
  # opponent's top security card." DCGO BT18_102.cs: SelectCardEffect over the
  # Tamer digivolution cards (maxCount min(5, #Tamers), canNoSelect false,
  # canEndNotMax true) -> AddSecurityCard(toTop: false) each -> IDestroySecurity
  # x cardSources.Count.
  #
  # W1 (2026-10-01): this used `select_count_capped_multi { zone: material }`,
  # which the DSL count-capped step does not support (it silently installs
  # nothing for the material zone), followed by `for_each.over: { binding }`
  # (`binding` is not a predicate key — silently dropped, so it scanned EVERY
  # permanent and trashed one opponent security per permanent on the field).
  # `select_own_sources` is the supported source picker; `per_selected` over
  # its source refs runs once per placed card.
  - when: when_attacking
    optional: true
    process:
      - select_own_sources:
          target: source
          filter: { kind: tamer }
          min: 1
          max: 5
          bind_as: placed
          prompt: "Place up to 5 Tamer cards from this Digimon's digivolution cards as your bottom security cards"
          then:
            - per_selected:
                selection: placed
                bind_as: m
                body:
                  - place_on_security:
                      of: you
                      source: { card: { binding: m } }
                      position: bottom
                      face_up: false
                  - trash_top_security: { of: opponent }
