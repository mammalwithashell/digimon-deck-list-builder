card: EX6-072
name: "Mega Digimon Assembly!"
kind: option
color: [white]
cost: 4

# Card-specific color bypass, shared by the action mask and Option execution.
use_requirement:
  any_permanent:
    of: opponent
    zone: [battle_area]
    kind: digimon
    level_gte: 6

effects:
  # ─── [Main] DNA digivolve a L6 field Digimon + 1 hand card into a L7 hand card
  # Printed: "[Main] 1 of your level 6 Digimon and 1 card in the hand may DNA
  # digivolve into a level 7 Digimon card in your hand."
  # Each optional choice requires a complete legal DNA combination. Missing
  # bindings after a decline exclude all subsequent choices, ending this DNA.
  - when: main_from_hand
    summary: "[Main] You may DNA digivolve 1 of your L6 Digimon + 1 hand card into a L7 Digimon card in hand"
    process:
      # Result card — a level-7 Digimon card in hand (DCGO IsLevel7Card).
      # Declining here aborts the whole DNA (DCGO: dnaTarget==null -> yield break).
      - select_hand:
          of: you
          bind_as: dna_result
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_eq: 7
              - dna_hand_candidate:
                  role: result
                  field_filter:
                    all_of:
                      - kind: digimon
                      - level_eq: 6
                  cost: printed
                  ignore_requirements: false
          prompt: "Select a level 7 Digimon card in hand to DNA digivolve into"
      # Only field materials compatible with the chosen result and a hand card.
      - select_own_permanent:
          bind_as: dna_field_material
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_eq: 6
              - dna_hand_candidate:
                  role: field
                  result: dna_result
                  field_filter:
                    all_of:
                      - kind: digimon
                      - level_eq: 6
                  cost: printed
                  ignore_requirements: false
          prompt: "Select 1 of your level 6 Digimon as a DNA digivolution material"
      # Any hand card meeting the recipe, excluding the physical result card.
      - select_hand:
          of: you
          bind_as: dna_hand_material
          optional: true
          filter:
            dna_hand_candidate:
              role: partner
              result: dna_result
              field: dna_field_material
              field_filter:
                all_of:
                  - kind: digimon
                  - level_eq: 6
              cost: printed
              ignore_requirements: false
          prompt: "Select 1 card in hand as the other DNA digivolution material"
      # Declare both materials, pay the printed DNA cost through its reducer
      # windows, then merge in recipe order and perform the normal DNA lifecycle.
      - effect_initiated_dna_digivolve_hand_partner:
          target: dna_field_material
          hand_partner: dna_hand_material
          from_hand: dna_result
          cost: printed
          ignore_requirements: false

  # ─── [Security] return a L6+ Digimon from trash, then add self ──
  # Printed: "[Security] Return 1 level 6 or higher Digimon card from your trash
  # to the hand. Then, add this card to the hand."
  # select_trash is NON-optional (DCGO canNoSelect: () => false); it auto-skips
  # when no eligible card exists, so add_this_option_to_hand always fires.
  - when: on_security
    summary: "[Security] Return 1 L6+ Digimon from trash to hand, then add this card to hand"
    process:
      - select_trash:
          of: you
          bind_as: pick
          filter:
            all_of:
              - kind: digimon
              - level_gte: 6
          prompt: "Return a level 6 or higher Digimon"
      - add_to_hand_from_trash: { of: you, card: pick }
      - add_this_option_to_hand: {}
