card: BT24-016
name: Lamiamon
kind: digimon
level: 5
color: [red]
cost: 7
dp: 7000
traits: [Dragonkin, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 4 }
    cost: 3
  - kind: activated_digivolve
    from:
      of: you
      zone: [battle_area]
      name_contains: "Elizamon"
    cost: 3
    ignore_requirements: true
    extra_cost:
      - select_trash:
          of: you
          bind_as: source
          filter: { name_contains: "Dimetromon" }
          prompt: "Place Dimetromon from trash as bottom source"
      - place_as_bottom_source:
          source: source
          target: { binding: activated_digivolve_target }

effects:
  - when: [when_digivolving, when_attacking]
    once_per_turn: true
    process:
      - as_selecting_player:
          of: opponent
          body:
            - select_hand:
                of: opponent
                bind_as: pick
                filter: {}
                prompt: "Place a card as your bottom security card"
      - place_on_security:
          of: opponent
          source: { binding: pick }
          position: bottom
          face_up: false
      - trash_top_security: { of: opponent }

  - scope: inherited
    when: on_opponent_security_removed
    once_per_turn: true
    optional: true
    active_when: { all_turns: true }
    process:
      - select_hand:
          of: you
          bind_as: pick
          filter:
            all_of:
              - kind: digimon
              - dp_lte: 5000
              - any_of:
                  - trait_has: Reptile
                  - trait_has: Dragonkin
          prompt: "Play a Reptile / Dragonkin Digimon free"
      - play_from_hand_free: { of: you, hand_index: pick }
