card: BT17-007
name: Agumon
kind: digimon
level: 3
color: [red]
cost: 3
dp: 1000
traits: [Reptile]
alt_paths:
  - kind: digivolve
    from: { name_is: Koromon }
    cost: 0

effects:
  - when: start_of_your_main_phase
    optional: true
    condition:
      any_permanent:
        of: you
        zone: [battle_area]
        kind: tamer
        name_contains: "Tai Kamiya"
    process:
      - select_trash:
          of: you
          bind_as: pick
          filter:
            any_of:
              - name_contains: "Garurumon"
              - name_contains: "Greymon"
              - name_contains: "Omnimon"
          prompt: "Return a card to hand"
      - add_to_hand_from_trash: { of: you, card: pick }

  - kind: alt_path_registration
    scope: inherited
    trigger: end_of_your_turn
    registers:
      kind: dna_digivolve
    applies_to:
      of: you
      zone: [battle_area]
