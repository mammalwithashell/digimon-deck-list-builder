card: EX11-060
name: Arisa Kinosaki
kind: tamer
color: [yellow]
cost: 4
traits: [LIBERATOR]

effects:
  - when: start_of_your_turn
    summary: "[Start of Your Turn] If memory is 2 or less, set it to 3"
    condition: { memory_lte: 2 }
    process:
      - set_memory: 3

  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}

  - when: on_any_deletion
    active_when: { all_turns: true }
    summary: "[All Turns] When your Token/Puppet is deleted, suspend self -> Draw 1; if by Overclock, may play a level 4 Puppet"
    condition:
      all_of:
        - event_target_owner: you
        - any_of:
            - event_target_kind: token
            - all_of:
                - event_target_kind: digimon
                - event_target_trait_has: Puppet
        - any_permanent:
            of: you
            zone: [battle_area]
            card_number_is: "EX11-060"
            is_unsuspended: true
    process:
      - select_effect_choice:
          labels: ["Suspend this Tamer", "Decline"]
          bind_as: arisa_choice
          prompt: "Suspend Arisa Kinosaki to Draw 1?"
      - if:
          condition: { equals: [arisa_choice, 0] }
          then:
            - suspend: { target: source }
            - draw: { of: you, count: 1 }
            - if:
                condition: { event_cause: overclock }
                then:
                  - select_hand:
                      of: you
                      bind_as: puppet
                      optional: true
                      filter:
                        all_of:
                          - kind: digimon
                          - level_lte: 4
                          - trait_has: Puppet
                      prompt: "Play 1 level 4 or lower Puppet Digimon from hand"
                  - play_from_hand_free: { of: you, hand_index: puppet }
