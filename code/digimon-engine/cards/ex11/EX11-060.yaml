card: EX11-060
name: Arisa Kinosaki
kind: tamer
color: [yellow]
cost: 4
traits: [LIBERATOR]

effects:
  - when: start_of_your_turn
    summary: "[Start of Your Turn] If memory is 2 or less, set it to 3"
    condition: { memory_lte: 2 }
    process:
      - set_memory: 3

  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}

  - when: on_any_deletion
    active_when: { all_turns: true }
    summary: "[All Turns] When your Token/Puppet is deleted, suspend self -> Draw 1; if by Overclock, may play a level 4 Puppet"
    condition:
      source_is_unsuspended: true
    trigger_if:
      all_of:
        - event_target_owner: you
        - any_of:
            - event_target_kind: token
            - all_of:
                - event_target_kind: digimon
                - event_target_trait_has: Puppet
    process:
      - select_effect_choice:
          labels: ["Suspend this Tamer", "Decline"]
          bind_as: arisa_choice
          prompt: "Suspend Arisa Kinosaki to Draw 1?"
      - if:
          condition: { equals: [arisa_choice, 0] }
          then:
            - suspend: { target: source }
            - draw: { of: you, count: 1 }
            - if:
                condition: { event_cause: overclock }
                then:
                  - select_hand:
                      of: you
                      bind_as: puppet
                      optional: true
                      filter:
                        all_of:
                          - kind: digimon
                          - level_lte: 4
                          - trait_has: Puppet
                          # DCGO EX11_060.cs:50-56 has no playability check and
                          # its IsDigimon is true for a DUAL (CardSource.cs:3519),
                          # so it offers a [Puppet] DUAL (Sistermon Blanc/Noir
                          # (Awakened) EX13-065/066) that PlayPermanentCards then
                          # refuses. Under the rules a DUAL is digivolved or used
                          # as an Option (CR 4.3 4-6-1, 4-6-2), is a Digimon only
                          # once on the field (4-6-3), and its play cost reads
                          # "Can't play to the field" (7-1-1); the play would not
                          # be carried out (1-3-2). The pick is optional, so
                          # dropping it changes no outcome. Also excludes a pick
                          # with no free slot (engine rules.field_slots; DCGO
                          # CanPlayAsNewPermanent) or under a play prohibition.
                          - can_play_from_effect_without_cost: true
                      prompt: "Play 1 level 4 or lower Puppet Digimon from hand"
                  - play_from_hand_free: { of: you, hand_index: puppet }
