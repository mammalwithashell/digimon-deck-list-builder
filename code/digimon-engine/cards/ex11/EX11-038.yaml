card: EX11-038
name: Sunarizamon
kind: digimon
level: 3
color: [black]
cost: 3
dp: 1000
traits: [Reptile, LIBERATOR]
attribute: Virus
alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 0

# ─── Clause 0: [When Moving] [On Play] ──────────────────────────────────────
#
# Printed card text (cards.json / authoritative):
#   "[When Moving] [On Play] By trashing 1 [Mineral] or [Rock] trait card from
#    your hand or your Digimon's digivolution cards, <Draw 1>."
#
# Implemented via the same union-zone cost primitive as EX11-065: one
# player-visible selection over hand ∪ own Digimon source cards, preserving the
# origin so `trash_union_bound` moves the selected card from the correct zone.
# DCGO includes "Do not trash"; `optional: true` models declining the cost.
#
# The timings are split instead of using one multi-timing clause: `on_play`
# fires directly from the played permanent, while `on_move` is an observer over
# the move event and must be gated with `event_permanent_is_source: true` so an
# already-fielded Sunarizamon does not react to a different Digimon moving.

effects:
  - when: on_play
    summary: "[On Play] Trash 1 Mineral/Rock from hand or own Digimon sources to Draw 1"
    process:
      - select_union_zone:
          of: you
          zones: [hand, material]
          optional: true
          bind_as: cost_card
          filter:
            any_of:
              - trait_has: Mineral
              - trait_has: Rock
          prompt: "Trash 1 [Mineral] or [Rock] card from hand or your Digimon's digivolution cards?"
          then:
            - trash_union_bound:
                binding: cost_card
            - draw: { of: you, count: 1 }

  - when: on_move
    condition:
      event_permanent_is_source: true
    summary: "[When Moving] Trash 1 Mineral/Rock from hand or own Digimon sources to Draw 1"
    process:
      - select_union_zone:
          of: you
          zones: [hand, material]
          optional: true
          bind_as: cost_card
          filter:
            any_of:
              - trait_has: Mineral
              - trait_has: Rock
          prompt: "Trash 1 [Mineral] or [Rock] card from hand or your Digimon's digivolution cards?"
          then:
            - trash_union_bound:
                binding: cost_card
            - draw: { of: you, count: 1 }

  - scope: inherited
    when: on_digivolution_card_trashed
    condition:
      all_of:
        - event_target_owner: you
        - trashed_source_card_id_is: EX11-038
        - any_of:
            - host_permanent_trait_has: Mineral
            - host_permanent_trait_has: Rock
    summary: "When this source is trashed from a Mineral/Rock Digimon, Draw 1"
    process:
      - draw: { of: you, count: 1 }
