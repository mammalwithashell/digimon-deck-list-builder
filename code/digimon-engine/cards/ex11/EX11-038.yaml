card: EX11-038
name: Sunarizamon
kind: digimon
level: 3
color: [black]
cost: 3
dp: 1000
traits: [Reptile, LIBERATOR]
attribute: Virus
alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: black }
    cost: 0

# ─── Clause 0: [When Moving] [On Play] — OMITTED (BLOCKED) ──────────────────
#
# Printed card text (cards.json / authoritative):
#   "[When Moving] [On Play] By trashing 1 [Mineral] or [Rock] trait card from
#    your hand or your Digimon's digivolution cards, <Draw 1>."
#
# The cost is a union of two zones: (a) own hand filtered by Mineral/Rock
# trait, and (b) any of own Digimon's digivolution card stacks filtered by
# Mineral/Rock trait. No DSL verb exists that presents both zones as a single
# player-visible selection pool from which exactly one card is trashed:
#
#   - `select_union_zone` supports {hand, trash} only — digivolution-card
#     sources are not a valid `zones:` entry.
#   - `select_own_sources` (filter: now supported) selects from own sources
#     only — cannot include hand cards in the same selection.
#   - Two separate `select_*` steps with an `if/else` zone choice would force
#     the player to declare the zone before seeing candidates, which is
#     unfaithful: the printed text presents the choice as a single "from hand
#     or digivolution cards" menu, not a two-step zone-then-card flow.
#
# This is the same gap as EX11-065 Clause 0 and the Rocks pool pass rollup
# entry (qa/dsl-vocab-gaps.md § "Rocks pool pass residual", "hand-or-source
# costs beyond own-source filtering"). Gap tag used in ignored tests:
# G-DSL-SELECT-OWN-SOURCES-FILTER (consistent with EX11-065's ignore tags).
# A hand-only or source-only proxy would be unfaithful; the clause is omitted
# until the union-cost verb lands.

effects:
  - scope: inherited
    when: on_digivolution_card_trashed
    condition:
      all_of:
        - event_target_owner: you
        - trashed_source_card_id_is: EX11-038
        - any_of:
            - host_permanent_trait_has: Mineral
            - host_permanent_trait_has: Rock
    summary: "When this source is trashed from a Mineral/Rock Digimon, Draw 1"
    process:
      - draw: { of: you, count: 1 }
