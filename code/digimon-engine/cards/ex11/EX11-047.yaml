# EX11-047 Impmon — Digimon, Lv.3, Purple/Red, DP 1000, Cost 3.
# Traits: Evil, LIBERATOR. Form: Rookie. Attribute: Virus. Rarity: C.
#
# Printed card text (card image EX11-047.webp + official Bandai DB bundle
# data/card_bundles/EX11-047.md, authoritative):
#
#   Evo box: Lv.2 from purple OR red: Cost 1 — one purple/red SPLIT circle
#     (official DB: "Purple Lv.2 / cost 1" AND "Red Lv.2 / cost 1").
#   Evo box: "Digivolve [Yaamon]: Cost 0"
#
#   [Start of Your Main Phase] Trash 1 card in your hand. Then, gain 1 memory.
#
#   Inherited Effect: [Your Turn] This Digimon gets +2000 DP.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/EX11/Purple/EX11_047.cs
#
# ─── DCGO crosscheck ─────────────────────────────────────────────────────────
#
# Alternate Digivolution Requirement (EffectTiming.None):
#   AddSelfDigivolutionRequirementStaticEffect(TopCard.EqualsCardName("Yaamon"),
#   cost 0, ignoreDigivolutionRequirement: false) — exact name, no level/colour
#   restriction. [Yaamon] (EX11-005) is a Digi-Egg that exists only in the
#   breeding area, so the route must work on a breeding-area base.
#
# [Start of Your Main Phase] (OnStartMainPhase, OPT = -1/unlimited, no hash):
#   CanUse: self on battle area && owner's turn. Body: if the hand is non-empty
#   a SelectHandEffect (maxCount 1, canNoSelect false → MANDATORY, no PASS)
#   discards 1; then `if (CanAddMemory) AddMemory(1)` — the memory gain does NOT
#   depend on a card actually having been trashed ("Then"), so an empty hand
#   still gains 1 memory.
#
# Inherited (EffectTiming.None): ChangeSelfDPStaticEffect(+2000, inherited,
#   condition: on battle area as Digimon && owner's turn).

card: EX11-047
name: Impmon
kind: digimon
level: 3
color: [purple, red]
cost: 3
dp: 1000
traits: [Evil, LIBERATOR]
form: Rookie
attribute: Virus

alt_paths:
  # Printed standard evo box: purple/red SPLIT circle, Lv.2, cost 1.
  - kind: digivolve
    from: { level_eq: 2, color_is: purple }
    cost: 1
  - kind: digivolve
    from: { level_eq: 2, color_is: red }
    cost: 1
  # Printed alt evo box: "Digivolve [Yaamon]: Cost 0" (EqualsCardName).
  - kind: digivolve
    from: { name_is: Yaamon }
    cost: 0

effects:
  # ─── Clause 1: [Start of Your Main Phase] trash 1 hand card, then +1 memory ──
  - when: start_of_your_main_phase
    active_when: { your_turn: true }
    summary: "[Start of Your Main Phase] Trash 1 card in your hand. Then, gain 1 memory"
    process:
      - select_hand:
          of: you
          bind_as: discard
          filter: {}
          prompt: "Trash 1 card in your hand"
      - trash_from_hand_by_index: { of: you, hand_index: discard }
      - gain_memory: 1

  # ─── Clause 2: Inherited [Your Turn] +2000 DP ────────────────────────────────
  - scope: inherited
    kind: aura
    active_when: { your_turn: true }
    target: {}
    dp_modifier: 2000
    summary: "[Inherited][Your Turn] This Digimon gets +2000 DP"
