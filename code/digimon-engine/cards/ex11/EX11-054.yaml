card: EX11-054
name: Owen Dreadnought
kind: tamer
color: [red]
cost: 4
traits: [LIBERATOR]

# Clause 1 — [Start of Your Turn] If your memory is 2 or less, set it to 3.
#
# Identical pattern to BT22-084 Nokia Shiramine and BT18-087 Owen Dreadnought (BT18).
# DSL: when: start_of_your_turn, condition: memory_lte: 2, process: set_memory: 3.
#
# Clause 2 — [All Turns] When your Digimon are played or digivolve, if any of them
# have the [Reptile] or [Dragonkin] trait, by suspending this Tamer, <Draw 1>.
# After, 1 of your Digimon with <Progress> gets +3000 DP for the turn.
#
# Event context now carries the played/digivolved permanent as event_target, so
# this clause can gate natively with event_target_owner/event_target_trait_has.
# The +3000 DP tail still selects a Progress Digimon. If none exists, the
# selection naturally has no candidates.
#
# Clause 3 — [Security] Play this card without paying the cost.
# DSL: when: on_security, process: play_from_security: {}
# Same pattern as BT18-087, BT22-084, BT21-015.

effects:
  # ─── Clause 1: [Start of Your Turn] Memory gate ────────────────────────────
  - when: start_of_your_turn
    summary: "[Start of Your Turn] If memory ≤ 2, set it to 3"
    condition: { memory_lte: 2 }
    process:
      - set_memory: 3

  # ─── Clause 2: [All Turns] Reptile/Dragonkin observer ─────────────────────
  - when: [on_enter_field_anyone, on_digivolve]
    active_when: { all_turns: true }
    optional: true
    summary: "[All Turns] When your Reptile/Dragonkin is played or digivolves, suspend self -> Draw 1; Progress Digimon gets +3000 DP"
    condition:
      all_of:
        - event_target_owner: you
        - any_of:
            - event_target_trait_has: Reptile
            - event_target_trait_has: Dragonkin
        - any_permanent:
            of: you
            zone: [battle_area]
            card_number_is: "EX11-054"
            is_unsuspended: true
    process:
      - suspend: { target: source }
      - draw: { of: you, count: 1 }
      - select_own_permanent:
          bind_as: progress_target
          filter:
            all_of:
              - kind: digimon
              - has_keyword: Progress
          prompt: "Choose a Digimon with Progress to get +3000 DP"
      - add_dp_modifier:
          target: progress_target
          value: 3000
          expiry: end_of_turn

  # ─── Clause 3: [Security] Play without paying the cost ─────────────────────
  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
