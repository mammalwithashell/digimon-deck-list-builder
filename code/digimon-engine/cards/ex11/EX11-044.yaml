# EX11-044 Pyramidimon — Digimon, Black, Level 6, Cost 11, DP 12000.
# Traits: [Mineral, LIBERATOR]
#
# Printed card text (data/cards.json — verbatim):
#
#   ＜Reboot＞ (Unsuspend this Digimon during your opponent's unsuspend phase.)
#   ＜Fragment (3)＞ (When this Digimon would be deleted, by trashing any 3 of
#   its digivolution cards, it isn't deleted.)
#
#   [On Play] [When Digivolving] [When Attacking] [Once Per Turn]
#   By trashing any 3 [Mineral] or [Rock] trait cards from your Digimon's
#   digivolution cards, delete 1 of your opponent's highest play cost
#   Digimon or Tamers.
#
#   [All Turns] [Once Per Turn]
#   When effects trash any of this Digimon's digivolution cards, you may
#   place 3 [Mineral] or [Rock] trait cards from your trash as this
#   Digimon's bottom digivolution cards.
#
# ─── Implementation status ───────────────────────────────────────────────────
#
# | Card-text element                                       | Status       |
# |---------------------------------------------------------|--------------|
# | <Reboot> keyword                                        | IMPLEMENTED  |
# | <Fragment (3)> keyword                                  | IMPLEMENTED  |
# | [OP][WD][WA][OPT] trash 3 Mineral/Rock sources (cost)  | IMPLEMENTED  |
# | [OP][WD][WA][OPT] delete 1 opp highest-play-cost perm  | IMPLEMENTED  |
# | [All Turns][OPT] on_source_trashed trigger (this card)  | IMPLEMENTED  |
# | [All Turns][OPT] place 3 Mineral/Rock from trash        | IMPLEMENTED  |

card: EX11-044
name: Pyramidimon
kind: digimon
level: 6
color: [black]
cost: 11
dp: 12000
traits: [Mineral, LIBERATOR]
attribute: Virus
alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: black }
    cost: 4

effects:
  # ─── Printed keywords ─────────────────────────────────────────────────────
  - kind: grant_keyword
    keyword: Reboot

  - kind: grant_keyword
    keyword: Fragment
    value: 3

  # ─── Clause A: [OP][WD][WA][OPT] source-trash → delete highest-play-cost ──
  - when: [on_play, when_digivolving, when_attacking]
    once_per_turn: true
    optional: true
    summary: "[OP][WD][WA][OPT] Trash 3 Mineral/Rock sources → delete opponent highest-play-cost Digimon/Tamer"
    process:
      - select_own_sources:
          filter:
            any_of:
              - trait_has: Mineral
              - trait_has: Rock
          min: 3
          max: 3
          bind_as: cost_sources
          prompt: "Trash 3 [Mineral] or [Rock] cards from your Digimon's digivolution cards"
          then:
            - trash_selected_sources: { source_refs: cost_sources }
            - select_opponent_permanent:
                bind_as: victim
                filter:
                  any_of:
                    - kind: digimon
                    - kind: tamer
                selector: highest_play_cost
                prompt: "Delete 1 of your opponent's highest play cost Digimon or Tamers"
            - delete_permanent: { target: victim }

  # ─── Clause B: [All Turns][OPT] on_digivolution_card_trashed → trash-to-source
  - when: on_digivolution_card_trashed
    active_when: { all_turns: true }
    once_per_turn: true
    optional: true
    summary: "[All Turns][OPT] When effects trash this Digimon's source, place 3 Mineral/Rock from trash as bottom sources"
    condition:
      event_host_permanent_is_source: true
    process:
      - select_trash:
          of: you
          bind_as: src1
          optional: true
          filter:
            any_of:
              - trait_has: Mineral
              - trait_has: Rock
          prompt: "Choose 1st [Mineral] or [Rock] card from your trash (1/3)"
      - place_as_bottom_source:
          source: src1
          target: source
      - select_trash:
          of: you
          bind_as: src2
          filter:
            any_of:
              - trait_has: Mineral
              - trait_has: Rock
          prompt: "Choose 2nd [Mineral] or [Rock] card from your trash (2/3)"
      - place_as_bottom_source:
          source: src2
          target: source
      - select_trash:
          of: you
          bind_as: src3
          filter:
            any_of:
              - trait_has: Mineral
              - trait_has: Rock
          prompt: "Choose 3rd [Mineral] or [Rock] card from your trash (3/3)"
      - place_as_bottom_source:
          source: src3
          target: source
