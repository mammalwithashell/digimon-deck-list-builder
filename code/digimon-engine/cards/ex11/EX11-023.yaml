card: EX11-023
name: Kaguyamon
kind: digimon
level: 6
color: [yellow, purple]
cost: 12
dp: 12000
traits: [Puppet, LIBERATOR]
attribute: Data
alt_paths:
  # Printed split circle: Yellow|Purple Lv.5 / cost 4 — one entry per colour.
  - kind: digivolve
    from: { level_eq: 5, color_is: yellow }
    cost: 4
  - kind: digivolve
    from: { level_eq: 5, color_is: purple }
    cost: 4
  - kind: digivolve
    from: { any_color: true, level_eq: 5, trait_has: Puppet }
    cost: 3
    ignore_requirements: true

effects:
  - kind: grant_keyword
    keyword: Alliance

  # <Scapegoat>
  # Native Keyword::Scapegoat (G-DSL-SCAPEGOAT-GRANT-KEYWORD): deduplicates
  # cleanly with the printed keyword parsed from data/cards.json while still
  # synthesizing the native replacement in standalone DSL fixtures.
  - kind: grant_keyword
    keyword: Scapegoat
    summary: "<Scapegoat>"

  - when: [when_digivolving, end_of_opponents_turn]
    once_per_turn: true
    summary: "Delete 1 opponent Digimon with the lowest level"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: victim
          filter:
            all_of:
              - kind: digimon
              - level_matches_aggregate:
                  selector: lowest_level
                  of: opponent
          prompt: "Delete 1 opponent Digimon with the lowest level"
      - delete_permanent: { target: victim }

  # [All Turns] [Once Per Turn] When other Digimon are deleted, you may play
  # 1 level 4 or lower Puppet Digimon from trash without paying the cost.
  - when: on_any_deletion
    active_when: { all_turns: true }
    once_per_turn: true
    summary: "When other Digimon are deleted, you may play 1 level 4 or lower Puppet Digimon from trash"
    # A Familiar Token is a Digimon (Digimon/Yellow/3000 DP), so a token
    # deletion must trigger this recursion — DCGO gates on `permanent.IsDigimon`
    # (true for Digimon tokens). Tokens are CardKind::Token in the engine, so
    # the kind match must list both, exactly like sibling cards BT22-040 /
    # EX11-060. (G-EX11-023-TOKEN-DELETION.)
    trigger_if:
      all_of:
        - any_of:
            - event_target_kind: digimon
            - event_target_kind: token
        - event_permanent_is_source: false
    process:
      - select_trash:
          of: you
          bind_as: puppet
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_lte: 4
              - trait_has: Puppet
          prompt: "Play 1 level 4 or lower Puppet Digimon from trash"
      - play_from_trash_free:
          of: you
          hand_index: puppet
