card: EX11-053
name: Omekamon
kind: digimon
level: 4
color: [black]
cost: 5
dp: 5000
traits: [Puppet, X Antibody, LIBERATOR]
attribute: Data
# Printed (official Bandai DB): "(Rule) Name: Also treated as [X Antibody]." An
# identity alias in every zone (CR 4.3 2-3-1-2). DCGO EX11_053.cs:
# unconditional `ChangeCardNamesClass` adding "X Antibody".
also_treated_as: [X Antibody]

effects:
  - text: "[On Play] By placing 1 [Royal Knight] trait Digimon card from your hand as the bottom digivolution card of any of your [King Drasil_7D6]s on the field, ＜Draw 1＞."
    when: on_play
    optional: true
    summary: "[On Play] Place 1 Royal Knight from hand under fielded King Drasil_7D6 to Draw 1"
    # Printed text & DCGO EX11_053.cs:56-145: "on the field" covers BOTH
    # battle area and breeding area (BT13-007 King Drasil_7D6 sits in breeding),
    # and the [Royal Knight] hand card is chosen BEFORE the [King Drasil_7D6].
    condition:
      all_of:
        - any_field_permanent:
            of: you
            all_of:
              - kind: digimon
              - name_is: "King Drasil_7D6"
        - count_gte:
            filter:
              of: you
              zone: [hand]
              kind: digimon
              trait_has: "Royal Knight"
            n: 1
    process:
      - select_hand:
          optional: false
          of: you
          bind_as: royal_knight
          filter:
            all_of:
              - kind: digimon
              - trait_has: "Royal Knight"
          prompt: "Choose a Royal Knight card to place under King Drasil_7D6"
      - if:
          condition:
            all_of:
              - any_permanent:
                  of: you
                  kind: digimon
                  name_is: "King Drasil_7D6"
              - count_gte:
                  filter:
                    owner: you
                    zone: [breeding]
                    kind: digimon
                    name_is: "King Drasil_7D6"
                  n: 1
          then:
            - select_effect_choice:
                bind_as: kd_zone
                labels: ["Battle area King Drasil_7D6", "Breeding area King Drasil_7D6"]
                prompt: "Choose the area of your King Drasil_7D6"
            - if:
                condition: { equals: [kd_zone, 0] }
                then:
                  - select_own_permanent:
                      optional: false
                      bind_as: king_drasil
                      filter:
                        all_of:
                          - kind: digimon
                          - name_is: "King Drasil_7D6"
                      prompt: "Choose your King Drasil_7D6"
                else:
                  - select_own_breeding_permanent:
                      optional: false
                      bind_as: king_drasil
                      filter:
                        all_of:
                          - kind: digimon
                          - name_is: "King Drasil_7D6"
                      prompt: "Choose your King Drasil_7D6"
          else:
            - if:
                condition:
                  any_permanent:
                    of: you
                    kind: digimon
                    name_is: "King Drasil_7D6"
                then:
                  - select_own_permanent:
                      optional: false
                      bind_as: king_drasil
                      filter:
                        all_of:
                          - kind: digimon
                          - name_is: "King Drasil_7D6"
                      prompt: "Choose your King Drasil_7D6"
                else:
                  - select_own_breeding_permanent:
                      optional: false
                      bind_as: king_drasil
                      filter:
                        all_of:
                          - kind: digimon
                          - name_is: "King Drasil_7D6"
                      prompt: "Choose your King Drasil_7D6"
      - place_as_bottom_source:
          source: royal_knight
          target: king_drasil
      - draw: { of: you, count: 1 }

  # [On Deletion] If you have 1 or fewer security cards, you may play 1
  # [Omnimon (X Antibody)] from your hand OR from under your [King Drasil_7D6]s
  # on the field without paying the cost. Then, place this card as the played
  # Digimon's bottom digivolution card.
  #
  # Modeled as ONE optional union selection over {hand} ∪ {field-carrier
  # digivolution sources}, where the material scan is restricted to fielded
  # [King Drasil_7D6] carriers via `material_carrier_filter`
  # (G-UNION-HAND-SOURCE-PLAY). Both halves filter candidates to
  # [Omnimon (X Antibody)]. The chosen card is played free from its origin zone,
  # then this Omekamon (now in trash post-deletion) is tucked as the played
  # Digimon's bottom digivolution source. DCGO EX11_053.cs splits this into a
  # hand/field/decline int prompt then a card pick; we expose the full candidate
  # union directly so the RL action space sees every option (CLAUDE.md §17).
  - text: "[On Deletion] If you have 1 or fewer security cards, you may play 1 [Omnimon (X Antibody)] from your hand or under your [King Drasil_7D6]s on the field without paying the cost. Then, place this card as the played Digimon's bottom digivolution card."
    when: on_deletion
    optional: true
    condition: { security_count_lte: 1 }
    summary: "[On Deletion] At <=1 security, may free-play [Omnimon (X Antibody)] from hand or under a fielded King Drasil_7D6, then attach this card under it"
    process:
      - select_union_zone:
          of: you
          zones: [hand, material]
          # material_of omitted → scan all field permanents (battle area +
          # breeding area per CR §3-4-7-4 "on the field"), restricted to
          # [King Drasil_7D6] carriers:
          material_carrier_filter:
            name_is: "King Drasil_7D6"
            zone: [battle_area, breeding]
          optional: true
          bind_as: pick
          filter:
            all_of:
              - kind: digimon
              - name_is: "Omnimon (X Antibody)"
              # DCGO EX11_053.cs:173-177 HasPlayCost && CanPlayAsNewPermanent
              # (both halves): DCGO offers no unplayable pick (slot cap =
              # engine rules.field_slots, not a CR limit, CR 4.3 3-4-8-2).
              - can_play_from_effect_without_cost: true
          prompt: "You may play 1 [Omnimon (X Antibody)] from your hand or under a fielded King Drasil_7D6, without paying the cost"
      - play_union_bound_free: { binding: pick, bind_as: played }
      - place_as_bottom_source: { source: self, target: played }
