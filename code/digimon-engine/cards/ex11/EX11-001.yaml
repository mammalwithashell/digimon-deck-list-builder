# EX11-001 Koromon — Digi-Egg, Lv.2, Red, cost 0. Traits: Lesser. Form: In-Training.
#
# Printed text (cards.json; DCGO CardEffect/EX11/Red/EX11_001.cs):
#   Inherited Effect
#   [When Attacking] [Once Per Turn] This Digimon may digivolve into a Digimon
#   card with [Tyrannomon] in its name or the [Dinosaur] trait in the hand.
#
# DCGO: OnAllyAttack inherited, maxCount 1 (OPT), isOptional TRUE (outer
#   Yes/No -> `outer_prompt: true`). CanActivate = carrier on the battle area
#   AND hand >= 1. The body only runs when a legal candidate is in hand
#   (`HandCards.Exists(CanSelectCardCondition)`: Digimon, trait EQUALS Dinosaur
#   or name contains Tyrannomon, and CanPlayCardTargetFrame with the printed
#   cost paid), then DigivolveIntoHandOrTrashCard(payCost: true, isOptional:
#   true -> the card pick may be declined).

card: EX11-001
name: Koromon
kind: digi_egg
level: 2
color: [red]
cost: 0
traits: [Lesser, LIBERATOR]
form: In-Training

effects:
  - text: "[When Attacking] [Once Per Turn] This Digimon may digivolve into a Digimon card with [Tyrannomon] in its name or the [Dinosaur] trait in the hand."
    scope: inherited
    when: when_attacking
    once_per_turn: true
    optional: true
    outer_prompt: true
    condition:
      count_gte:
        filter: { of: you, zone: [hand] }
        n: 1
    summary: "[When Attacking] [Once Per Turn] This Digimon may digivolve into a Digimon card with [Tyrannomon] in its name or the [Dinosaur] trait in the hand."
    process:
      - select_hand:
          of: you
          bind_as: evo
          optional: true
          filter:
            all_of:
              - kind: digimon
              - any_of:
                  - trait_has: "Dinosaur"
                  - name_contains: "Tyrannomon"
              - can_digivolve_onto: source
          prompt: "This Digimon may digivolve into a Digimon card with [Tyrannomon] in its name or the [Dinosaur] trait in the hand"
      - if:
          condition: { binding_present: evo }
          then:
            - effect_initiated_digivolve:
                target: source
                from_hand: evo
                cost: printed
