card: EX11-008
name: Elizamon
kind: digimon
level: 3
color: [red]
cost: 3
dp: 1000
traits: [Reptile, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 2 }
    cost: 0

effects:
  - when: [on_play, on_move]
    summary: "Grant Raid + 3000 DP to a Reptile/Dragonkin Digimon for the turn"
    # [When Moving] is self-scoped ("when THIS Digimon moves from breeding");
    # the engine's on_move dispatch is a board-wide observer scan, so gate the
    # on_move timing on the moved permanent being this Digimon (EX11-038 idiom).
    timing_conditions:
      - when: on_move
        condition: { event_permanent_is_source: true }
    condition:
      any_permanent:
        of: you
        zone: [battle_area]
        kind: digimon
        any_of:
          - trait_has: Reptile
          - trait_has: Dragonkin
    process:
      - select_own_permanent:
          bind_as: tgt
          filter:
            all_of:
              - kind: digimon
              - any_of:
                  - trait_has: Reptile
                  - trait_has: Dragonkin
          prompt: "Choose a Digimon to gain Raid and +3000 DP"
      - add_dp_modifier:
          target: tgt
          value: 3000
          expiry: end_of_turn
      - grant_keyword:
          target: tgt
          keyword: Raid
          expiry: end_of_turn

  - scope: inherited
    when: on_opponent_security_removed
    once_per_turn: true
    active_when: { your_turn: true }
    process:
      - gain_memory: 1
