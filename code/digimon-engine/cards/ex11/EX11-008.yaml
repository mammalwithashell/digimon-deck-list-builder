card: EX11-008
name: Elizamon
kind: digimon
level: 3
color: [red]
cost: 3
dp: 1000
traits: [Reptile, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 2 }
    cost: 0

effects:
  - when: [on_play]
    # NOTE: The printed card text also says [When Moving] (fires when THIS Digimon
    # moves from breeding area to battle area). DCGO uses EffectTiming.OnMove for
    # this, which has no equivalent in the Rust engine yet. The on_hatch DSL timing
    # maps to EffectTiming::OnHatch (fires when any egg hatches from digitama→breeding,
    # not breeding→battle), so it does not cover [When Moving]. The [When Moving]
    # clause is tracked as an engine gap in qa/dsl-vocab-gaps.md.
    summary: "Grant Raid + 3000 DP to a Reptile/Dragonkin Digimon for the turn"
    condition:
      any_permanent:
        of: you
        zone: [battle_area]
        kind: digimon
        any_of:
          - trait_has: Reptile
          - trait_has: Dragonkin
    process:
      - select_own_permanent:
          bind_as: tgt
          filter:
            all_of:
              - kind: digimon
              - any_of:
                  - trait_has: Reptile
                  - trait_has: Dragonkin
          prompt: "Choose a Digimon to gain Raid and +3000 DP"
      - add_dp_modifier:
          target: tgt
          value: 3000
          expiry: end_of_turn
      - grant_keyword:
          target: tgt
          keyword: Raid
          expiry: end_of_turn

  - scope: inherited
    when: on_opponent_security_removed
    once_per_turn: true
    active_when: { your_turn: true }
    process:
      - gain_memory: 1
