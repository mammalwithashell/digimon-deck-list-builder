card: EX11-024
name: Cendrillmon
kind: digimon
level: 6
color: [yellow]
cost: 11
dp: 12000
traits: [Puppet, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: yellow }
    cost: 3

effects:
  - kind: grant_keyword
    keyword: Alliance

  - kind: grant_keyword
    keyword: Overclock
    overclock_cost_filter:
      any_of:
        - kind: token
        - all_of:
            - kind: digimon
            - trait_has: Puppet

  - when: [on_play, when_digivolving]
    summary: "You may play 1 level 4 or lower Puppet Digimon from hand, then may play Familiar Tokens per opponent Digimon"
    # DCGO EX11_024.cs:50-103: the "you may play" is the hand pick itself
    # (SelectHandEffect canNoSelect: true), opened only when a candidate is in
    # hand (EX11_024.cs:52) -- there is no separate yes/no -- then a Yes/No for
    # the Familiar Tokens. The previous YAML asked "Play a Puppet?" first, which
    # offered a play decision even with nothing playable in hand.
    process:
      - select_hand:
          of: you
          bind_as: puppet
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_lte: 4
              - trait_has: Puppet
              # DCGO EX11_024.cs:42-48 has no playability check and its
              # IsDigimon is true for a DUAL (CardSource.cs:3519), so it offers
              # a [Puppet] DUAL (Sistermon Blanc/Noir (Awakened) EX13-065/066)
              # that PlayPermanentCards then refuses. Under the rules a DUAL is
              # digivolved or used as an Option (CR 4.3 4-6-1, 4-6-2), is a
              # Digimon only once on the field (4-6-3), and its play cost reads
              # "Can't play to the field", so it is not played (7-1-1); the play
              # would not be carried out (1-3-2). The pick is optional, so
              # dropping it changes no outcome. Also excludes a pick with no free
              # slot (engine rules.field_slots; DCGO CanPlayAsNewPermanent) or
              # under a play prohibition.
              - can_play_from_effect_without_cost: true
          prompt: "You may play 1 level 4 or lower Puppet Digimon from hand without paying the cost"
      - play_from_hand_free: { of: you, hand_index: puppet }
      - select_effect_choice:
          labels: ["Play Familiar Tokens", "Decline"]
          bind_as: token_choice
          prompt: "Play 1 Familiar Token for each opponent Digimon?"
      - if:
          condition: { equals: [token_choice, 0] }
          then:
            - for_each:
                over:
                  all_of:
                    - kind: digimon
                    - owner: opponent
                    - zone: [battle_area]
                bind_as: opponent_digimon
                body:
                  - play_token:
                      controller: you
                      token_name: familiar

  - when: [when_digivolving, when_attacking]
    summary: "Give 1 opponent Digimon -3000 DP for each of your Digimon"
    process:
      - select_opponent_permanent:
          bind_as: dp_target
          filter: { kind: digimon }
          prompt: "Give -3000 DP per own Digimon"
      - add_dp_modifier:
          target: dp_target
          value:
            formula:
              base: 0
              per:
                card_count_in_zone:
                  of: you
                  zone: battle_area
                  filter: { kind: digimon }
              delta: -3000
          expiry: end_of_turn
