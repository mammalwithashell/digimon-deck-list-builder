card: EX11-021
name: Kokeshimon
kind: digimon
level: 4
color: [yellow, purple]
cost: 5
dp: 6000
traits: [Puppet, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 3
  - kind: digivolve
    from:
      all_of:
        - level_eq: 3
        - trait_has: Puppet
    cost: 2

effects:
  - when: when_digivolving
    optional: true
    summary: "If you have 1 or fewer Tamers, you may play Mirai Kinosaki from hand free"
    condition:
      count_lte:
        filter: { of: you, zone: [battle_area], kind: tamer }
        n: 1
    process:
      - select_hand:
          of: you
          bind_as: mirai
          optional: true
          filter: { name_contains: "Mirai Kinosaki" }
          prompt: "Play 1 Mirai Kinosaki from hand"
      - play_from_hand_free: { of: you, hand_index: mirai }

  - scope: inherited
    when: on_opponent_attack
    once_per_turn: true
    active_when: { opponents_turn: true }
    summary: "Opponent's Turn OPT: by deleting this Digimon, end the attack"
    process:
      - select_effect_choice:
          labels: ["Delete this Digimon and end the attack", "Decline"]
          bind_as: cancel_choice
          prompt: "Delete this Digimon to end the attack?"
      - if:
          condition: { equals: [cancel_choice, 0] }
          then:
            - delete_permanent: { target: this }
            - end_attack: true
