card: EX11-021
name: Kokeshimon
kind: digimon
level: 4
color: [yellow, purple]
cost: 5
dp: 6000
traits: [Puppet, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 3, color_is: yellow }
    cost: 3
  - kind: digivolve
    from:
      all_of:
        - level_eq: 3
        - trait_has: Puppet
    cost: 2

effects:
  - when: when_digivolving
    optional: true
    summary: "If you have 1 or fewer Tamers, you may play Mirai Kinosaki from hand free"
    condition:
      count_lte:
        filter: { of: you, zone: [battle_area], kind: tamer }
        n: 1
    process:
      - select_hand:
          of: you
          bind_as: mirai
          optional: true
          filter: { name_contains: "Mirai Kinosaki" }
          prompt: "Play 1 Mirai Kinosaki from hand"
      - play_from_hand_free: { of: you, hand_index: mirai }

  - scope: inherited
    when: on_opponent_attack
    once_per_turn: true
    active_when: { opponents_turn: true }
    summary: "Opponent's Turn OPT: by deleting 1 other Digimon, end the attack"
    process:
      - select_own_permanent:
          bind_as: sacrifice
          optional: true
          filter:
            all_of:
              - kind: digimon
              - other: true
          prompt: "Delete 1 of your other Digimon to end the attack"
      # Ending the attack is the PAID payoff of deleting an other Digimon.
      # When the controller has no other Digimon, select_own_permanent
      # short-circuits without binding `sacrifice`; gating the payoff on the
      # binding prevents a lone carrier from ending the attack for free.
      - if:
          condition: { binding_present: sacrifice }
          then:
            - delete_permanent: { target: sacrifice }
            - end_attack: true
