card: EX11-020
name: Hanimon
kind: digimon
level: 3
color: [yellow, purple]
cost: 3
dp: 1000
traits: [Puppet, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: yellow }
    cost: 1
  - kind: digivolve
    from: { name_contains: "Kyaromon" }
    cost: 0

effects:
  - when: on_deletion
    optional: true
    condition:
      not:
        event_cause: battle_deletion
    summary: "[On Deletion] If deleted other than in battle, you may play 1 [Shoemon] from hand free"
    process:
      # Printed (card image + official Bandai DB data/card_bundles/EX11-020.md):
      # "you may play 1 [Shoemon] from your hand" -- a card NAME, not a trait.
      # cards.json's "[Shoemon] trait" is an API-ingest error. DCGO
      # EX11_020.cs:62-65 CanSelectCardCondition = EqualsCardName("Shoemon").
      # DCGO adds no playability check, which is looser than the rules (CR 4.3
      # 1-3-2: an impossible action is not carried out; 7-1-1), so only a
      # [Shoemon] this effect can actually play is offered (free battle-area
      # slot, no play prohibition, never a Digi-Egg / DUAL).
      # G-DSL-PLAY-OR-USE-CANDIDATE-LEGALITY.
      - select_hand:
          of: you
          bind_as: shoemon
          optional: true
          filter:
            all_of:
              - name_is: Shoemon
              - can_play_from_effect_without_cost: true
          prompt: "Play 1 [Shoemon] from your hand without paying the cost"
      - play_from_hand_free: { of: you, hand_index: shoemon }

  - scope: inherited
    when: on_opponent_attack
    once_per_turn: true
    active_when: { opponents_turn: true }
    summary: "Opponent's Turn OPT: by deleting 1 other Digimon, end the attack"
    process:
      - select_own_permanent:
          bind_as: sacrifice
          optional: true
          filter:
            all_of:
              - kind: digimon
              - other: true
          prompt: "Delete 1 of your other Digimon to end the attack"
      - if:
          condition: { binding_present: sacrifice }
          then:
            - delete_permanent: { target: sacrifice }
            - end_attack: true
