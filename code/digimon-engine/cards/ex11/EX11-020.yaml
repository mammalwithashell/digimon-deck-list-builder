card: EX11-020
name: Hanimon
kind: digimon
level: 3
color: [yellow, purple]
cost: 3
dp: 1000
traits: [Puppet, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: yellow }
    cost: 1
  - kind: digivolve
    from: { name_contains: "Kyaromon" }
    cost: 0

effects:
  - when: on_deletion
    optional: true
    condition:
      not:
        event_cause: battle_deletion
    summary: "[On Deletion] If deleted other than in battle, you may play 1 [Shoemon] trait Digimon from hand free"
    process:
      - select_hand:
          of: you
          bind_as: shoemon
          optional: true
          filter:
            all_of:
              - kind: digimon
              - trait_has: Shoemon
          prompt: "Play 1 [Shoemon] trait Digimon from your hand without paying its cost"
      - play_from_hand_free: { of: you, hand_index: shoemon }

  - scope: inherited
    when: on_opponent_attack
    once_per_turn: true
    active_when: { opponents_turn: true }
    summary: "Opponent's Turn OPT: by deleting 1 other Digimon, end the attack"
    process:
      - select_own_permanent:
          bind_as: sacrifice
          optional: true
          filter:
            all_of:
              - kind: digimon
              - other: true
          prompt: "Delete 1 of your other Digimon to end the attack"
      - delete_permanent: { target: sacrifice }
      - end_attack: true
