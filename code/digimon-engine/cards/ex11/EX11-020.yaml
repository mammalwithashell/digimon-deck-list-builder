card: EX11-020
name: Hanimon
kind: digimon
level: 3
color: [yellow, purple]
cost: 3
dp: 1000
traits: [Puppet, LIBERATOR]
alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: yellow }
    cost: 1
  - kind: digivolve
    from: { name_contains: "Kyaromon" }
    cost: 0

effects:
  # BLOCKED: the printed On Deletion slice is omitted rather than approximated.
  #
  # Printed text:
  # [On Deletion] If deleted other than in battle, you may play 1 [Shoemon]
  # trait from your hand without paying the cost.
  #
  # Required reusable capability:
  # Triggered on_deletion predicates need a DSL leaf that reads
  # EffectContext::deletion_cause() so YAML can express "other than in battle".
  # The existing `replacement_cause` predicate is replacement-context only and
  # does not inspect deletion observer cause.

  - scope: inherited
    when: on_opponent_attack
    once_per_turn: true
    active_when: { opponents_turn: true }
    summary: "Opponent's Turn OPT: by deleting 1 other Digimon, end the attack"
    process:
      - select_own_permanent:
          bind_as: sacrifice
          optional: true
          filter:
            all_of:
              - kind: digimon
              - other: true
          prompt: "Delete 1 of your other Digimon to end the attack"
      - delete_permanent: { target: sacrifice }
      - end_attack: true
