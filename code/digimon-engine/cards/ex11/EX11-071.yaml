card: EX11-071
name: Cool Boy
kind: tamer
color: [white]
cost: 3
traits: [LIBERATOR]

# [Main] clause authored Phase 2 Track J PR 2 (RK-G002 closure). The
# source-bound return cost lifts through Phase 2 Track B's
# `activation_cost: { return_self_to_deck_bottom: true }` onto
# `EffectBuilder::activation_cost(ctx.return_self_to_deck_bottom_as_cost)`;
# after the Tamer leaves the field the chained body fires the hand
# selection + reduced-cost play.

effects:
  - when: on_play
    summary: "[On Play] Reveal top 3; add Omekamon/Omnimon X and Royal Knight/LIBERATOR"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          no_duplicate_cards: true
          buckets:
            - bind_as: omeka_or_omni_x
              min: 1
              max: 1
              filter:
                any_of:
                  - name_is: "Omekamon"
                  - name_is: "Omnimon (X Antibody)"
            - bind_as: rk_or_liberator
              min: 1
              max: 1
              filter:
                any_of:
                  - trait_has: "Royal Knight"
                  - trait_has: LIBERATOR
          prompt: "Select 1 Omekamon/Omnimon X and 1 Royal Knight/LIBERATOR"
      - add_to_hand_from_reveal: { of: you, card: omeka_or_omni_x }
      - add_to_hand_from_reveal: { of: you, card: rk_or_liberator }
      - place_remainder_on_deck: { of: you, position: bottom }

  - when: main_on_field
    optional: true
    summary: "[Main] By returning self to deck bottom, may play 1 cost-4+ Royal Knight/LIBERATOR from hand at cost -2"
    process:
      - activation_cost: { return_self_to_deck_bottom: true }
      - select_hand:
          of: you
          bind_as: pick
          filter:
            all_of:
              - play_cost_gte: 4
              - any_of:
                  - trait_has: "Royal Knight"
                  - trait_has: LIBERATOR
          prompt: "Play 1 cost-4+ Royal Knight/LIBERATOR Digimon from hand at cost -2"
      - play_from_hand:
          of: you
          hand_index: pick
          cost_delta: { reduce: 2 }
