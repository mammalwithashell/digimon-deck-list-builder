card: EX11-022
name: Karakurumon
kind: digimon
level: 5
color: [yellow, purple]
cost: 7
dp: 7000
traits: [Puppet, LIBERATOR]
attribute: Data
alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: yellow }
    cost: 4
  - kind: digivolve
    from: { level_eq: 4, color_is: purple }
    cost: 4
  # Printed alt: "[Digivolve] Yellow/purple Lv.4 w/[Puppet] trait: Cost 3".
  # Faithful gate: Lv.4 AND [Puppet] trait AND (yellow OR purple).
  - kind: digivolve
    from:
      all_of:
        - level_eq: 4
        - trait_has: Puppet
        - any_of:
            - color_is: yellow
            - color_is: purple
    cost: 3

effects:
  # <Scapegoat>
  # Native Scapegoat exists in the engine, but DSL `grant_keyword` does not
  # currently accept/lookup Scapegoat. Model the exact replacement shape
  # directly: optional accept, choose another own Digimon, substitute it as
  # the deletion subject, and suppress own-effect deletions.
  - kind: replacement
    timing: when_would_be_deleted
    optional: true
    active_when:
      none_of:
        - replacement_cause: own_effect
    summary: "<Scapegoat>"
    process:
      - select_own_permanent:
          bind_as: scapegoat_cost
          filter:
            all_of:
              - other: true
              - kind: digimon
          prompt: "Delete 1 of your other Digimon to prevent this deletion"
      - substitute_replacement:
          subject: scapegoat_cost

  # [On Play] [When Digivolving] You may play 1 [Puppet] trait Digimon card
  # with 4000 DP or less from your hand or trash without paying the cost.
  # At turn end, delete the Digimon this effect played.
  #
  # PUPPETS-G021 (DP filter) — RESOLVED: select_union_zone now evaluates the
  # compiled predicate (dp_lte + trait_has) against hidden-zone CardData.
  #
  # PUPPETS-G014 / Task 7 — RESOLVED: `play_union_bound_free` plays the picked
  # card free from its true origin zone (hand vs trash), recovered from the
  # `select_union_zone` binding, and `bind_as` exposes the played permanent.
  #
  # PUPPETS-G003 / Task 11 — RESOLVED: `schedule_delete_played_at_turn_end`
  # schedules the bound permanent for deletion at the end of the turn, keyed
  # to its stable provenance identity (survives field-index shifts; a no-op
  # if it already left).
  - when: [on_play, when_digivolving]
    optional: true
    summary: "[On Play / When Digivolving] You may play 1 Puppet Digimon (DP ≤ 4000) from hand or trash free; delete it at turn end"
    process:
      - select_union_zone:
          of: you
          zones: [hand, trash]
          bind_as: puppet_pick
          optional: true
          filter:
            all_of:
              - kind: digimon
              - trait_has: Puppet
              - dp_lte: 4000
          prompt: "You may play 1 Puppet Digimon (DP 4000 or less) from your hand or trash without paying the cost"
      # Play the picked card free from its true origin zone; bind the result.
      - play_union_bound_free:
          binding: puppet_pick
          bind_as: puppet_played
      # At turn end, delete the Digimon this effect played. No-op if the
      # union pick was declined (the binding is absent).
      - schedule_delete_played_at_turn_end:
          binding: puppet_played

  # Inherited [All Turns] [Once Per Turn]
  # When this Digimon would leave the battle area other than by your effects,
  # delete 1 Token or other Puppet trait Digimon so it doesn't leave.
  - kind: replacement
    scope: inherited
    trigger: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    active_when:
      all_of:
        - replacement_subject_is_mine: true
        - kind: digimon
        - none_of:
            - replacement_cause: own_effect
    summary: "[All Turns][OPT] Delete 1 Token or other Puppet Digimon so this Digimon doesn't leave"
    process:
      - select_own_permanent:
          bind_as: prevent_cost
          filter:
            all_of:
              - other: true
              - any_of:
                  - kind: token
                  - all_of:
                      - kind: digimon
                      - trait_has: Puppet
          prompt: "Delete 1 of your Tokens or other Puppet Digimon"
      - delete_permanent: { target: prevent_cost }
      - cancel_replacement: {}
