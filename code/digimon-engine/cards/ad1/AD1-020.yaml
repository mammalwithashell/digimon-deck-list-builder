# AD1-020 Tommy, Takuya, & Zoe — Tamer, Blue+Red+Green, Cost 5, no traits.
# Text: official bundle data/card_bundles/AD1-020.md + card image (the
# "[End of Your Turn]..." box is the INHERITED effect; cards.json mislabels it
# "Security Effect"). Q&A: multi-colour cards differ if any part differs.
# DCGO: AD1/Blue/AD1_020.cs — NameIsAlso(Tommy Himi, Takuya Kanbara, Zoe Orimoto);
# shared OP/SOMP coroutine (non-optional; per-pick "Do not place"; draw iff any
# placed; independent >=4 Hybrid-sources memory check) — same shape as sister
# card AD1-023; OnEndTurn inherited (isOptional, 1/turn, CanActivate = carrier
# Digimon with Hybrid/Ten Warriors top && CanAttack; SelectAttack with
# SetCanNotSelectNotAttack, then S-Attack +1 UntilEndAttack);
# PlaySelfTamerSecurityEffect.
card: AD1-020
name: "Tommy, Takuya, & Zoe"
kind: tamer
color: [blue, red, green]
cost: 5
also_treated_as: [Tommy Himi, Takuya Kanbara, Zoe Orimoto]
effects:
  # [Start of Your Main Phase] [On Play] You may place up to 2 [Hybrid] trait
  # cards with different colors from your hand or trash under this Tamer. If
  # this effect placed, <Draw 1>. Then, if there are 4 or more [Hybrid] trait
  # cards under this Tamer, gain 2 memory.
  - when: [on_play, start_of_your_main_phase]
    summary: "[Start of Your Main Phase][On Play] Place up to 2 different-colour Hybrid cards under; if placed Draw 1; then 4+ Hybrid under → +2 memory"
    process:
      - select_zone_cards:
          zones: [hand, trash]
          filter: {trait_has: Hybrid}
          min: 0
          max: 2
          distinct_by: color
          bind_as: materials
          prompt: You may place up to 2 Hybrid cards with different colors under this Tamer
      - if:
          condition: {binding_present: materials}
          then:
            - place_cards_as_bottom_sources: {cards: materials, target: source}
            - draw: {of: you, count: 1}
      - if:
          condition:
            any_permanent:
              of: you
              is_source: true
              source_count: {filter: {trait_has: Hybrid}, at_least: 4}
          then:
            - gain_memory: 2

  # Inherited: [End of Your Turn] [Once Per Turn] By attacking with this Digimon
  # with the [Hybrid] or [Ten Warriors] trait, it gains <Security A. +1> for the
  # attack. "By attacking" is the cost: offered only when the carrier can attack
  # (DCGO CanAttack in CanActivate); once activated the attack is mandatory
  # (SetCanNotSelectNotAttack); the +1 is an EndOfAttack modifier
  # (may_attack_now cost_upgrade).
  - scope: inherited
    when: end_of_your_turn
    optional: true
    outer_prompt: true
    once_per_turn: true
    summary: "Inherited [End of Your Turn][OPT] By attacking with this Hybrid/Ten Warriors Digimon, it gains Security A. +1 for the attack"
    condition:
      any_permanent:
        of: you
        zone: [battle_area]
        is_source: true
        kind: digimon
        any_of: [{trait_has: Hybrid}, {trait_has: Ten Warriors}]
        can_attack: {targets: any}
    process:
      - may_attack_now:
          attacker: source
          targets: any
          cost_upgrade: {security_attack: 1}

  # [Security] Play this card without paying the cost.
  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}
