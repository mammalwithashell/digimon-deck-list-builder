card: AD1-018
name: LordKnightmon
kind: digimon
level: 6
color: [purple, black]
cost: 11
dp: 11000
traits: [Holy Warrior, Royal Knight]
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: purple }
    cost: 3

effects:
  # ─── Cost reduction: 4+ [Knightmon]/[Lucemon]-text cards in trash → -5 ──────
  #
  # "When this card would be played, if you have 4 or more cards with
  # [Knightmon] or [Lucemon] in its text in your trash, reduce the play cost by
  # 5." `count_gte` over own trash cards whose printed text contains Knightmon
  # OR Witchelny — identical to AD1-017's cost clause (BT24-088 idiom:
  # effect_text_contains inside a count filter; BT24-040 cost_reduction shape).
  #
  # SOURCE-PRIORITY NOTE: DCGO AD1_018.cs's Reduce Play Cost region instead
  # checks FIELD Digimon whose TopCard name contains Knightmon/Lucemon
  # (HasMatchConditionOwnersPermanent) — a divergence from both the printed
  # card face AND the sibling AD1-017 (whose DCGO uses
  # MatchConditionOwnersCardCountInTrash >= 4). The printed card text governs
  # "what the card says" (CLAUDE.md source priority), so the trash-text-count
  # reading is implemented here, matching AD1-017.
  - kind: cost_reduction
    reduction_timing: before_pay_cost
    when_playing_this: true
    condition:
      count_gte:
        filter:
          of: you
          zone: [trash]
          any_of:
            - effect_text_contains: "Knightmon"
            - effect_text_contains: "Lucemon"
        n: 4
    amount: 5
    summary: "-5 play cost if 4+ [Knightmon]/[Lucemon]-text cards are in your trash"

  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Opponent Digimon effects don't affect 1 of your Digimon"
    process:
      - select_own_permanent:
          bind_as: protected
          filter: { kind: digimon }
          prompt: "Choose 1 of your Digimon to protect from opponent Digimon effects"
      - grant_effect_immunity:
          target: protected
          source_kind: digimon
          source_controller: opponent
          expiry: end_of_opponents_turn

  - scope: inherited
    when: on_security
    summary: "[Security] De-Digivolve 1, then delete opponent Digimon with play cost 3 or less"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon to De-Digivolve 1"
      - de_digivolve:
          target: target
          amount: 1
          stop_at_level: 3
      # Mandatory "delete 1 ... with play cost 3 or less" (FAQ MP-29; DCGO
      # AD1_018.cs SecuritySkill delete uses canEndNotMax: false). Not optional:
      # when a cost-≤3 target exists the controller must delete it. With no valid
      # target the select no-ops (delete is the final step, so nothing is lost).
      - select_opponent_permanent:
          bind_as: victim
          filter:
            all_of:
              - kind: digimon
              - play_cost_lte: 3
          prompt: "Delete 1 opponent Digimon with play cost 3 or less"
      - delete_permanent: { target: victim }

  # Omitted (GAP — G-DSL-EVENT-CARD-TEXT-CONTAINS):
  # [All Turns][Once Per Turn] "When any of your Digimon with [Knightmon] or
  # [Lucemon] in its text are played, <De-Digivolve 2> 1 of your opponent's
  # Digimon." This observer must key on the TRIGGERING (played) card's printed
  # effect TEXT containing [Knightmon]/[Lucemon]. The DSL has
  # `event_card_name_contains` (AD1-001 / AD1-016) but no event-card TEXT-contains
  # sibling, so the clause is OMITTED rather than approximated on the played
  # card's NAME (which would under-fire vs the printed "in its text").
  # Propose the leaf id G-DSL-EVENT-CARD-TEXT-CONTAINS.
