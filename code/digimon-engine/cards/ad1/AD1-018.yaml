card: AD1-018
name: LordKnightmon
kind: digimon
level: 6
color: [purple, black]
cost: 11
dp: 11000
traits: [Holy Warrior, Royal Knight]
attribute: Virus

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: purple }
    cost: 3

effects:
  # ─── Cost reduction: own field Digimon named [Knightmon]/[Lucemon] → -5 ─────
  #
  # Printed (card face is authoritative, CLAUDE.md source priority): "When this
  # card would be played, if you have a Digimon with [Knightmon] or [Lucemon] in
  # its NAME, reduce the play cost by 5." Presence check (>=1) over own
  # battle-area Digimon whose NAME contains Knightmon OR Lucemon — matches DCGO
  # AD1_018.cs (HasMatchConditionOwnersPermanent on field TopCard name).
  # CORRECTED 2026-06-15: the prior trash-text-count reading came from an
  # inaccurate cards.json effect string and contradicted the printed card image.
  - kind: cost_reduction
    reduction_timing: before_pay_cost
    when_playing_this: true
    condition:
      count_gte:
        filter:
          of: you
          zone: [battle_area]
          kind: digimon
          any_of:
            - name_contains: "Knightmon"
            - name_contains: "Lucemon"
        n: 1
    amount: 5
    summary: "-5 play cost if you have a [Knightmon]/[Lucemon]-named Digimon in play"

  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Opponent Digimon effects don't affect 1 of your Digimon"
    process:
      - select_own_permanent:
          bind_as: protected
          filter: { kind: digimon }
          prompt: "Choose 1 of your Digimon to protect from opponent Digimon effects"
      - grant_effect_immunity:
          target: protected
          source_kind: digimon
          source_controller: opponent
          expiry: end_of_opponents_turn

  - scope: inherited
    when: on_security
    summary: "[Security] De-Digivolve 1, then delete opponent Digimon with play cost 3 or less"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon to De-Digivolve 1"
      - de_digivolve:
          target: target
          amount: 1
          stop_at_level: 3
      # Mandatory "delete 1 ... with play cost 3 or less" (FAQ MP-29; DCGO
      # AD1_018.cs SecuritySkill delete uses canEndNotMax: false). Not optional:
      # when a cost-≤3 target exists the controller must delete it. With no valid
      # target the select no-ops (delete is the final step, so nothing is lost).
      - select_opponent_permanent:
          bind_as: victim
          filter:
            all_of:
              - kind: digimon
              - play_cost_lte: 3
          prompt: "Delete 1 opponent Digimon with play cost 3 or less"
      - delete_permanent: { target: victim }

  # [All Turns][Once Per Turn] "When any of your Digimon with [Knightmon] or
  # [Lucemon] in their texts are played, <De-Digivolve 2> 1 of your opponent's
  # Digimon." Keys on the TRIGGERING (played) card's printed TEXT via the
  # event_card_text_contains leaf (G-DSL-EVENT-CARD-TEXT-CONTAINS, closed
  # 2026-06-15). Mandatory (printed has no "you may"); Once Per Turn; All Turns.
  - when: on_any_digimon_played
    once_per_turn: true
    summary: "[All Turns][OPT] When you play a [Knightmon]/[Lucemon]-text Digimon, De-Digivolve 2 an opponent Digimon"
    condition:
      all_of:
        - event_target_owner: you
        - any_of:
            - event_card_text_contains: "Knightmon"
            - event_card_text_contains: "Lucemon"
    process:
      - select_opponent_permanent:
          bind_as: target
          filter: { kind: digimon }
          prompt: "Choose 1 opponent Digimon to De-Digivolve 2"
      - de_digivolve:
          target: target
          amount: 2
