# Official add28324e4ff3904188252fa1c5a80b63ac63977395d48ffbfa023982073f572;
# image and base DCGO AD1_023 checked. Q6113: injective colors; Q6114: independent Then.
card: AD1-023
name: "J.P., Koji, & Koichi"
kind: tamer
color: [black, yellow, purple]
cost: 5
also_treated_as: [J.P. Shibayama, Koji Minamoto, Koichi Kimura]
effects:
  - when: [on_play, start_of_your_main_phase]
    process:
      - select_zone_cards:
          zones: [hand, trash]
          filter: {trait_has: Hybrid}
          min: 0
          max: 2
          distinct_by: color
          bind_as: materials
          prompt: You may place up to 2 Hybrid cards with different colors under this Tamer
      - if:
          condition: {binding_present: materials}
          then:
            - place_cards_as_bottom_sources: {cards: materials, target: source}
            - draw: {of: you, count: 1}
      - if:
          condition:
            any_permanent:
              of: you
              is_source: true
              source_count: {filter: {trait_has: Hybrid}, at_least: 4}
          then:
            - gain_memory: 2
  - kind: replacement
    scope: inherited
    trigger: when_would_leave_battle_area
    optional: true
    once_per_turn: true
    active_when:
      all_of:
        - kind: digimon
        - any_of: [{trait_has: Hybrid}, {trait_has: Ten Warriors}]
        - security_count_gte: 1
    process:
      - add_top_security_to_hand: {of: you}
      - if:
          condition: {effect_added_any_card_to_hand: true}
          then:
            - cancel_replacement: {}
  - when: on_security
    process:
      - play_from_security: {}