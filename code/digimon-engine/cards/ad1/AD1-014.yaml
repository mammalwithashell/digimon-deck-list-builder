card: AD1-014
name: MetalGarurumon
kind: digimon
level: 6
color: [blue]
cost: 12
dp: 12000
traits: [Cyborg, ADVENTURE, Hero]

# ─── Alternate Digivolution Paths ────────────────────────────────────────────
#
# DCGO (AD1_014.cs, EffectTiming.None, AddSelfDigivolutionRequirementStaticEffect):
#   permanentCondition: TopCard.ContainsCardName("Garurumon")
#                    || TopCard.EqualsTraits("ADVENTURE")
#                    || TopCard.EqualsTraits("HERO")
#   level: 5, digivolutionCost: 3
#
# We split into two alt-paths because the DSL `from:` predicate does not
# express OR over name_contains + trait_has on a single source today; the
# `any_of` form keeps both branches explicit.
alt_paths:
  - kind: digivolve
    from:
      all_of:
        - level_eq: 5
        - any_of:
            - name_contains: "Garurumon"
            - trait_has: ADVENTURE
            - trait_has: Hero
    cost: 3

effects:
  # ─── Clause (a): <Blocker> ────────────────────────────────────────────────
  # Declarative keyword grant.
  # GAP G-DECLARATIVE-KEYWORD: declarative grant_keyword compiles to
  # Effect::declarative which is never enqueued/fired by the engine, so the
  # runtime modifier is not installed for self-target keywords. Structural
  # assertion ad1_014_declares_blocker_and_evade_keyword_grants covers this.
  - kind: grant_keyword
    keyword: Blocker

  # ─── Clause (b): <Evade> ──────────────────────────────────────────────────
  # Same G-DECLARATIVE-KEYWORD note.
  - kind: grant_keyword
    keyword: Evade

  # ─── Clause (c): [On Play][When Digivolving][When Attacking][OPT] body ────
  #
  # Printed text:
  #   "Delete 1 of your opponent's level 5 or lower Digimon. Then, for every
  #   2 of your Tamers' colors, 1 of your opponent's Digimon or Tamers can't
  #   suspend until their turn ends."
  #
  # DCGO (AD1_014.cs, SharedHashString = "AD1_014_OP_WD_WA"): one shared
  # ActivateClass body fired by three ActivateClass shells (one per timing),
  # all gated by `maxUsableCount: 1` AND the same hash so the three timings
  # share a single OPT lockout per turn.
  #
  # Implementation note (faithful slice):
  #
  #   1. Delete-1-L5- target picker: `select_opponent_permanent` with
  #      `level_lte: 5` filter (G-PRED-LEVEL is evaluated). Optionality
  #      matches DCGO `canNoSelect: false` — the step prompts mandatorily
  #      when an eligible target exists.
  #
  #   2. Lock branch: "for every 2 of your Tamers' colors" — DCGO
  #      `Combinations.GetDifferenetColorCardCount(tamerCards) / 2`. The
  #      lock count = floor(distinct colors across own battle-area Tamers
  #      / 2). `select_count_capped_multi` over the opponent's battle area
  #      installs N distinct picks, where N is a formula-valued `max`:
  #        floor_div(distinct_colors_count(your Tamers), 2).
  #      Each picked opponent Digimon/Tamer receives `CannotSuspend`
  #      expiring at end_of_opponents_turn ("until their turn ends") via
  #      `per_selected` + `add_modifier`. When the formula evaluates to 0
  #      (0–1 tamer colors) the multi-select completes synchronously with
  #      no prompt and no modifier — DCGO's `Math.Max(0, count)`.
  #
  # G-OPT-MULTI-TIMING-SHARED-LOCKOUT — CLOSED 2026-05-19:
  # Each timing in `when: [...]` still lowers to a separate `Effect`, but a
  # once-per-turn clause spanning >1 timing now stamps every lowered effect
  # with a shared `Effect::shared_opt_group` so the three timings draw on a
  # SINGLE per-turn counter — DCGO's `SharedHashString: "AD1_014_OP_WD_WA"`.
  # `effect_queue::opt_slot_key` keys OPT bookkeeping on the shared group
  # when present, else on the per-slot index. Verified by
  # ad1_014_on_play_then_when_attacking_share_one_opt_lockout_per_turn.
  - when: [on_play, when_digivolving, when_attacking]
    once_per_turn: true
    summary: "[OP][WD][WA][OPT] Delete 1 opp L5- Digimon, then lock floor(tamer-colors/2) opp Digimon/Tamers"
    process:
      - select_opponent_permanent:
          bind_as: del_target
          filter:
            all_of:
              - kind: digimon
              - level_lte: 5
          prompt: "Delete 1 of your opponent's level 5 or lower Digimon"
      - delete_permanent: { target: del_target }
      # Lock branch — floor(distinct tamer colors / 2) opp Digimon/Tamers
      # can't suspend until their turn ends.
      - select_count_capped_multi:
          of: opponent
          zone: battle_area
          max:
            formula:
              floor_div:
                - base: 0
                  per:
                    distinct_colors_count:
                      of: you
                      zone: battle_area
                      filter: { kind: tamer }
                  delta: 1
                - 2
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          bind_as: locked_perms
          prompt: "Choose 1 opponent Digimon or Tamer per 2 of your Tamers' colors — can't suspend until their turn ends"
          optional_zero: false
      - per_selected:
          selection: locked_perms
          bind_as: locked
          body:
            - add_modifier:
                target: { binding: locked }
                modifier: CannotSuspend
                value: 1
                expiry: end_of_opponents_turn

  # ─── Clause (d): [All Turns][OPT] on_suspend → may unsuspend self ─────────
  #
  # Printed text:
  #   "[All Turns] [Once Per Turn] When any of your Digimon suspend, this
  #    Digimon may unsuspend."
  #
  # DCGO (AD1_014.cs, EffectTiming.OnTappedAnyone, hash "AD1_014_AT"):
  #   CanTriggerWhenPermanentSuspends gated by
  #   IsPermanentExistsOnOwnerBattleAreaDigimon — i.e. the suspended permanent
  #   belongs to AD1-014's controller AND is a Digimon.
  #
  # We use:
  #   - active_when: { all_turns: true } — both-player firing scope
  #   - condition: event_target_owner = you (closes the "your Digimon" filter)
  #     plus event_target_kind: digimon (closes the kind filter)
  #   - process: optional unsuspend self via target: source
  #
  # Note on target: `target: source` resolves to `ctx.source_permanent` (the
  # AD1-014 permanent on the battle area). `target: self` would resolve to the
  # source CARD handle which is silently dropped by the unsuspend lowering
  # (see permanent_mutations.rs).
  - when: on_suspend
    active_when: { all_turns: true }
    once_per_turn: true
    optional: true
    summary: "[All Turns][OPT] When any of your Digimon suspend, this Digimon may unsuspend"
    condition:
      all_of:
        - event_target_owner: you
        - event_target_kind: digimon
    process:
      - unsuspend: { target: source }

  # ─── Inherited Clause (e): [When Attacking][OPT] name-gated lock ──────────
  #
  # Printed text:
  #   "[When Attacking] [Once Per Turn] If this Digimon has [Garurumon] or
  #    [Omnimon] in its name, 1 of your opponent's Digimon or Tamers can't
  #    suspend until their turn ends."
  #
  # DCGO (AD1_014.cs, OnAllyAttack, hash "AD1_014_ESS_WA", isInheritedEffect:
  # true): CanActivateCondition gates on
  #   PermanentOfThisCard().TopCard.ContainsCardName("Garurumon")
  #   || PermanentOfThisCard().TopCard.ContainsCardName("Omnimon")
  # The check is on the CARRIER permanent's TOP CARD name — not on the
  # AD1-014 source card (which is hidden under a digivolution stack when this
  # inherited effect is active).
  #
  # `source_name_contains` evaluates the carrier permanent's TOP-card name in
  # an inherited context (`predicate.rs::subject_or_source_permanent` ->
  # `perm.top_card().card_name`). The `any_of` gate over the two names
  # ("Garurumon" OR "Omnimon") exactly mirrors DCGO's two-way name check.
  # Same idiom as BT12-028's inherited [End of Attack] clause.
  #
  # The lock body is a single mandatory pick (printed "1 of your opponent's
  # Digimon or Tamers") via `select_opponent_permanent` over the
  # Digimon-or-Tamer filter + `add_modifier: CannotSuspend` expiring at
  # end_of_opponents_turn ("until their turn ends").
  - scope: inherited
    when: when_attacking
    once_per_turn: true
    summary: "[Inherited][When Attacking][OPT] If carrier name has Garurumon/Omnimon, lock 1 opp Digimon/Tamer"
    condition:
      all_of:
        - any_of:
            - source_name_contains: "Garurumon"
            - source_name_contains: "Omnimon"
        - any_of:
            - any_permanent:
                of: opponent
                zone: [battle_area]
                kind: digimon
            - any_permanent:
                of: opponent
                zone: [battle_area]
                kind: tamer
    process:
      - select_opponent_permanent:
          bind_as: inh_lock
          filter:
            any_of:
              - kind: digimon
              - kind: tamer
          prompt: "Choose 1 opponent Digimon or Tamer — can't suspend until their turn ends"
      - add_modifier:
          target: inh_lock
          modifier: CannotSuspend
          value: 1
          expiry: end_of_opponents_turn
