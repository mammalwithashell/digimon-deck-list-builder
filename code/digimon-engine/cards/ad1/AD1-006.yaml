card: AD1-006
name: Shoutmon X7
kind: digimon
level: 6
color: [red, purple]
cost: 13
dp: 13000
traits: [Composite, Xros Heart, Blue Flare]

alt_paths:
  - kind: digivolve
    from:
      all_of:
        - level_eq: 5
        - any_of:
            - trait_has: "Xros Heart"
            - trait_has: "Blue Flare"
    cost: 2

effects:
  - when: [on_play, when_digivolving, when_attacking]
    once_per_turn: true
    summary: "[OP][WD][WA][OPT] May bottom-deck 1 opponent Digimon with DP <= this Digimon, then unsuspend"
    process:
      - select_opponent_permanent:
          bind_as: target
          optional: true
          filter:
            all_of:
              - kind: digimon
              - dp_lte: { formula: { source_dp: {} } }
          prompt: "Return 1 opponent Digimon with DP <= this Digimon to deck bottom"
      - return_to_deck:
          target: target
          position: bottom
      - unsuspend: { target: source }
