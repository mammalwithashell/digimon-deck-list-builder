# Official observation 63ebc7effb67480770acaa46cb7452e91de8b704df75b8c49ca57c291ad2c31f;
# checked against AD1-015.webp and base DCGO AD1/Yellow/AD1_015.cs.
card: AD1-015
name: Beowolfmon
kind: digimon
level: 5
color: [yellow]
cost: 8
dp: 8000
form: Hybrid
attribute: Variable
traits: [Warrior]
alt_paths:
  - kind: digivolve
    from: {kind: digimon, level_eq: 4, color_is: yellow}
    cost: 3
  - kind: digivolve
    from:
      kind: tamer
      name_is: Koji Minamoto
      source_count: {filter: {trait_has: Hybrid}, at_least: 2}
    cost: 3
effects:
  - kind: grant_keyword
    keyword: Jamming
  - when: [when_digivolving, when_attacking]
    process:
      - select_opponent_permanent:
          filter: {kind: digimon}
          bind_as: victim
          prompt: Give 1 opponent Digimon -4000 DP for the turn
      - add_dp_modifier: {target: victim, value: -4000, expiry: end_of_turn}
  - when: [end_of_attack, on_deletion]
    process:
      - select_zone_cards:
          zones: [hand, trash]
          min: 0
          max: 1
          filter:
            all_of:
              - kind: tamer
              - has_inherited: {}
              - can_play_from_effect_without_cost: true
              - any_of:
                  - color_is: yellow
                  - color_is: black
                  - color_is: purple
          bind_as: tamer
          prompt: You may play 1 yellow, black or purple Tamer with inherited effects for free
      - play_cards_free: {cards: tamer}
      - select_own_permanent:
          optional: true
          filter:
            any_of:
              - is_source: true
              - kind: tamer
          bind_as: host
          prompt: You may place a Hybrid or Ten Warriors card under this Digimon or one of your Tamers
          then:
            - select_hand:
                of: you
                optional: true
                cost: true
                filter:
                  any_of:
                    - trait_has: Hybrid
                    - trait_has: Ten Warriors
                bind_as: material
                prompt: Place 1 Hybrid or Ten Warriors card from your hand
                then:
                  - place_as_bottom_source: {source: material, target: host, bind_placed_as: placed}
                  - if:
                      condition: {binding_present: placed}
                      then:
                        - draw: {of: you, count: 2}
  - scope: inherited
    when: when_attacking
    process:
      - select_opponent_permanent:
          filter: {kind: digimon}
          bind_as: victim
          prompt: Give 1 opponent Digimon -4000 DP for the turn
      - add_dp_modifier: {target: victim, value: -4000, expiry: end_of_turn}
