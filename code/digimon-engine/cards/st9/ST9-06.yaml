# ST9-06 Imperialdramon Dragon Mode — Digimon, Lv.6, Blue+Green, DP 12000, Cost 13.
# Traits: Ancient Dragon.
# Evo: Lv.5 Blue / Cost 4 (per evo_costs in cards.json).
#
# Printed card text (data/cards.json — verbatim):
#
#   [When Digivolving] You may play 1 level 4 or lower blue Digimon card and
#     1 level 4 or lower green Digimon card from this Digimon's digivolution
#     cards without paying their memory costs.
#
# Inherited / Security: (none)
#
# DCGO C# reference:
#   DCGO/Assets/Scripts/CardEffect/ST9/Blue/ST9_06.cs
#
# ─── Source-priority cross-check (printed text + RULES_CONTEXT.md > DCGO) ───
#
# Printed text governs. DCGO ST9_06.cs matches the printed text exactly:
#
# Block 1 (DCGO OnEnterFieldAnyone + CanTriggerWhenDigivolving) —
#   ActivateClass with isOptional: true (outer "you may" on the whole effect).
#   CanActivateCondition gates on IsExistOnBattleArea AND the digivolution
#   stack having at least one card that satisfies CanSelectCardCondition (blue
#   Lv<=4 Digimon) OR CanSelectCardCondition1 (green Lv<=4 Digimon).
#
#   Body (ActivateCoroutine):
#     1. If any blue Lv<=4 Digimon exists in THIS permanent's DigivolutionCards:
#        SelectCardEffect over DigivolutionCards filtered by:
#          - IsDigimon, Level <= 4, HasCardColor(Blue), HasLevel,
#            CanPlayAsNewPermanent(payCost: false)
#        canNoSelect: () => false (mandatory pick IF the outer optional was accepted
#        and a candidate exists).
#        max: 1, canEndNotMax: false.
#     2. After the blue pick, the remaining cards (DigivolutionCards minus
#        the already-selected card) are checked for any green Lv<=4 candidate.
#        `canNoSelect` for the green pick is `true` only in the special case
#        where the first-selected card ALSO satisfies the green condition AND
#        was the only card that could satisfy the blue condition (i.e. it was
#        consumed for the blue slot and is no longer available for the green
#        pick). In standard setups this evaluates to `false` (mandatory pick
#        if any green Lv<=4 exists).
#     3. PlayPermanentCards over selectedCards, payCost: false, activateETB: true.
#
#   "you may" applies to the OUTER ActivateClass (isOptional: true). The
#   internal picks within the accepted activation are mandatory given their
#   conditions; the canNoSelect guard is complex edge-case logic (see item 2
#   above) but the default case (mandatory once accepted) is what the printed
#   "you may" governs.
#
# Source priority note: printed text says "you may play 1 level 4 or lower
# blue Digimon card and 1 level 4 or lower green Digimon card". The "you may"
# is on the whole clause (accepting = committing to both picks when both exist).
# DCGO confirms outer optional + mandatory inner selections once accepted.
#
card: ST9-06
name: Imperialdramon Dragon Mode
kind: digimon
level: 6
color: [blue, green]
cost: 13
dp: 12000
traits: [Ancient Dragon]

alt_paths:
  # Standard digivolve: Lv.5 Blue / Cost 4 (per evo_costs in cards.json).
  - kind: digivolve
    from: { level_eq: 5, color_is: blue }
    cost: 4

effects:
  - when: when_digivolving
    optional: true
    summary: "[When Digivolving] You may play 1 Lv.4 or lower blue and 1 Lv.4 or lower green source free"
    process:
      - select_own_sources:
          from: source
          filter:
            kind: digimon
            color_is: blue
            level_lte: 4
          min: 0
          max: 1
          bind_as: blue_source
          prompt: "Play 1 level 4 or lower blue Digimon card from this Digimon's digivolution cards"
          then:
            - play_selected_sources_free: { source_refs: blue_source }
      - select_own_sources:
          from: source
          filter:
            kind: digimon
            color_is: green
            level_lte: 4
          min: 0
          max: 1
          bind_as: green_source
          prompt: "Play 1 level 4 or lower green Digimon card from this Digimon's digivolution cards"
          then:
            - play_selected_sources_free: { source_refs: green_source }
