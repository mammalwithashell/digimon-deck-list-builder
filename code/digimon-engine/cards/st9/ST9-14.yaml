card: ST9-14
name: Megadeath
kind: option
color: [blue, green]
cost: 5

effects:
  - text: "[Main] Suspend 1 of your opponent's Digimon. Then, return 1 of your opponent's suspended Digimon to its owner's hand."
    when: main_from_hand
    summary: "[Main] Suspend 1 opponent Digimon, then return 1 opponent suspended Digimon to hand"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: susp_target
          filter: { kind: digimon }
          prompt: "Suspend 1 of your opponent's Digimon"
      - suspend: { target: susp_target }
      - select_opponent_permanent:
          optional: false
          bind_as: bounce_target
          filter:
            all_of:
              - kind: digimon
              - is_suspended: true
          prompt: "Return 1 of your opponent's suspended Digimon to its owner's hand"
      - return_to_hand: { target: bounce_target }

  - text: "[Security] Activate this card's [Main] effect."
    scope: inherited
    when: on_security
    summary: "[Security] Activate this card's [Main] effect"
    process:
      - select_opponent_permanent:
          optional: false
          bind_as: susp_target
          filter: { kind: digimon }
          prompt: "Suspend 1 of your opponent's Digimon"
      - suspend: { target: susp_target }
      - select_opponent_permanent:
          optional: false
          bind_as: bounce_target
          filter:
            all_of:
              - kind: digimon
              - is_suspended: true
          prompt: "Return 1 of your opponent's suspended Digimon to its owner's hand"
      - return_to_hand: { target: bounce_target }
