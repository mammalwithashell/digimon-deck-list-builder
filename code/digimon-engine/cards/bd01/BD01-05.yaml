    active_when: { your_turn: true }
    trigger_if: { event_target_owner: opponent, event_target_kind: digimon }
    summary: "Inherited [Your Turn][OPT] When an opposing Digimon is deleted, this Digimon gains <Security A. +1> for the turn"
    process:
      - add_modifier:
          target: source
          modifier: SecurityAttackChange
          value: 1
          expiry: end_of_turn
