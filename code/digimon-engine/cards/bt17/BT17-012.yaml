# BT17-012 BurningGreymon — Digimon Lv.4, Red/Purple, DP 6000, Cost 6.
# Traits: Dark Dragon. Form: Hybrid. Attribute: Variable.
#
# Printed text (official Bandai DB bundle data/card_bundles/BT17-012.md, card
# image, DCGO BT17_012.cs):
#   [Digivolve] Red Lv.3 / Cost 3, Purple Lv.3 / Cost 3
#   [Digivolve] [Takuya Kanbara]: Cost 2 / [Agunimon]: Cost 1
#   This card may digivolve from the hand onto one of your red Tamers as if
#     that Tamer is a level 3 red Digimon.
#   <Raid>
#   [When Attacking] This Digimon may digivolve into a Digimon card with the
#     [Hybrid] trait in the hand with the digivolution cost reduced by 1.
#   Inherited: [Your Turn] This Digimon gets +2000 DP.
#
# Sister card BT17-023 KendoGarurumon (same set, same Hybrid-Tamer + named
# routes + hand-Hybrid [When Attacking] digivolve); every route below mirrors
# its official-ruling-backed shape:
#   - Standard circles: Red Lv.3 / Cost 3 and Purple Lv.3 / Cost 3 (cards
#     override: the API ingest dropped Purple; the bundle prints both).
#   - Any red Tamer, treated as a Lv.3 red Digimon, only while this card is in
#     hand (DCGO: PermanentCondition = IsTamer && red top card, Condition =
#     `card.Owner.HandCards.Contains(card)`), Cost 3 (the Red Lv.3 circle).
#   - [Takuya Kanbara] Cost 2: name route (DCGO EqualsCardName "Takuya Kanbara"
#     or "TakuyaKanbara"; `name_is` is alias-aware), plus the red-Tamer
#     treated variant (Takuya is a red Tamer) so the Tamer counts as a Digimon
#     that digivolves (official Q&A on this card: "it treats it as a Digimon
#     that digivolves ... 'when a Digimon digivolves' effects trigger").
#   - [Agunimon] Cost 1: name route on a Digimon (DCGO EqualsCardName).
#
# [When Attacking] (DCGO isOptional: true, ActivateClass maxCount -1): the whole
# clause is optional; the hand pick is itself skippable. Only Hybrid Digimon
# cards that CAN digivolve onto this Digimon with the cost reduced by 1 (route
# exists and the reduced cost is payable) are offered — CR 4.3 1-3-11-1: a
# digivolution whose cost cannot be paid cannot be declared (same rules-over-DCGO
# affordability note as BT12-016 / BT17-023).
#
# Inherited +2000 DP is an `[Your Turn]` self-aura (EX9-012 idiom).

card: BT17-012
name: BurningGreymon
kind: digimon
level: 4
color: [red, purple]
cost: 6
dp: 6000
form: Hybrid
attribute: Variable
traits: [Dark Dragon]

alt_paths:
  # Printed circles.
  - kind: digivolve
    from: { level_eq: 3, color_is: red }
    cost: 3
  - kind: digivolve
    from: { level_eq: 3, color_is: purple }
    cost: 3
  # "onto one of your red Tamers as if that card is a level 3 red Digimon".
  - kind: digivolve
    from: { kind: tamer, color_is: red }
    source_treated_as: level_3_red_digimon_from_hand
    cost: 3
  # [Takuya Kanbara]: Cost 2 (native named Tamer, and the treated-as-Digimon
  # variant — BT17-023 / Q2764 shape).
  - kind: digivolve
    from: { kind: tamer, name_is: Takuya Kanbara }
    cost: 2
  - kind: digivolve
    from: { kind: tamer, name_is: Takuya Kanbara, color_is: red }
    source_treated_as: level_3_red_digimon_from_hand
    cost: 2
  # [Agunimon]: Cost 1.
  - kind: digivolve
    from: { kind: digimon, name_is: Agunimon }
    cost: 1

effects:
  - kind: grant_keyword
    keyword: Raid

  # DCGO (`BT17_012.cs` [When Attacking], isOptional TRUE): the always-shown outer
  # yes/no is offered whenever a Hybrid Digimon card is in hand (CanActivate =
  # `HandCards.Count(IsDigimon && ContainsTraits("Hybrid")) >= 1`), WITHOUT
  # checking that one of them can actually digivolve; the inner pick
  # (`DigivolveIntoHandOrTrashCard`, canNoSelect) then lists only the cards that
  # can. Rules-compatible: a player may choose to activate an effect whose
  # processing then can't be executed (CR 4.3 15-14-1-4 counts such a use), so
  # the outer confirm is the player's own decision and an accepted pick with no
  # legal card simply ends.
  - text: "[When Attacking] This Digimon may digivolve into a Digimon card with the [Hybrid] trait in the hand with the digivolution cost reduced by 1."
    when: when_attacking
    optional: true
    outer_prompt: true
    condition:
      count_gte:
        filter:
          of: you
          zone: [hand]
          kind: digimon
          trait_has: Hybrid
        n: 1
    summary: "[When Attacking] This Digimon may digivolve into a Hybrid card in hand with the digivolution cost reduced by 1"
    process:
      - select_hand:
          of: you
          bind_as: evolution
          optional: true
          filter:
            all_of:
              - kind: digimon
              - trait_has: Hybrid
              - can_digivolve_onto_with_cost: { target: source, cost: { reduce: 1 } }
          prompt: "You may digivolve into a Hybrid card with the cost reduced by 1"
      - effect_initiated_digivolve:
          target: source
          from_hand: evolution
          cost: { reduce: 1 }
          ignore_requirements: false

  - text: "[Your Turn] This Digimon gets +2000 DP."
    scope: inherited
    kind: aura
    active_when: { your_turn: true }
    target: {}
    dp_modifier: 2000
    summary: "[Inherited][Your Turn] This Digimon gets +2000 DP"
