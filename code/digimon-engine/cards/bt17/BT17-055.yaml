# BT17-055 Infermon — Digimon, Lv.5, Black, 7000 DP, play cost 7.
# Traits: Unidentified. Ultimate / Unknown. Digivolve: Black Lv.4 / cost 3.
#
# Printed text (official Bandai DB, data/card_bundles/BT17-055.md):
#   [When Digivolving] <De-Digivolve 1> 1 of your opponent's Digimon. (Trash the
#   top card. You can't trash past level 3 cards.) Then, 1 of your opponent's
#   Digimon with a play cost 8 or less can't attack players until the end of
#   their turn.
#   Inherited: [All Turns] [Once Per Turn] When you play another Digimon with
#   [Diaboromon] in its name, <De-Digivolve 1> 1 of your opponent's Digimon.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT17/Black/BT17_055.cs
#   - [When Digivolving], not optional: mandatory pick of 1 opponent Digimon ->
#     IDegeneration(1); THEN (independently, even if the first had no target)
#     a mandatory pick of 1 opponent Digimon with HasPlayCost && cost <= 8 ->
#     GainCanNotAttack (DefenderCondition: Defender == null = players only,
#     UntilOpponentTurnEnd) -> `CannotAttackPlayer`, `end_of_opponents_turn`
#     (BT13-075 idiom).
#   - Inherited OnEnterFieldAnyone OPT (maxCount 1): own Digimon whose top card
#     ContainsCardName "Diaboromon" is PLAYED -> mandatory De-Digivolve 1.

card: BT17-055
name: Infermon
kind: digimon
level: 5
color: [black]
cost: 7
dp: 7000
traits: [Unidentified]
form: Ultimate
attribute: Unknown

alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: black }
    cost: 3

effects:
  - when: when_digivolving
    summary: "[When Digivolving] <De-Digivolve 1> 1 opponent Digimon; then 1 opponent Digimon with play cost <= 8 can't attack players until the end of their turn"
    process:
      - select_opponent_permanent:
          bind_as: dedigi
          filter: { kind: digimon }
          prompt: "<De-Digivolve 1> 1 of your opponent's Digimon"
      - de_digivolve:
          target: dedigi
          amount: 1
          stop_at_level: 3
      - select_opponent_permanent:
          bind_as: no_attack
          filter:
            all_of:
              - kind: digimon
              - play_cost_lte: 8
          prompt: "1 of your opponent's Digimon with a play cost of 8 or less can't attack players"
      - add_modifier:
          target: no_attack
          modifier: CannotAttackPlayer
          value: 1
          expiry: end_of_opponents_turn

  - when: on_ally_played
    scope: inherited
    once_per_turn: true
    active_when: { all_turns: true }
    trigger_if:
      all_of:
        - event_target_kind: digimon
        - event_target_name_contains: "Diaboromon"
        - event_permanent_is_source: false
    summary: "Inherited [All Turns][OPT] When you play another Digimon with [Diaboromon] in its name, <De-Digivolve 1> 1 of your opponent's Digimon"
    process:
      - select_opponent_permanent:
          bind_as: dedigi
          filter: { kind: digimon }
          prompt: "<De-Digivolve 1> 1 of your opponent's Digimon"
      - de_digivolve:
          target: dedigi
          amount: 1
          stop_at_level: 3
