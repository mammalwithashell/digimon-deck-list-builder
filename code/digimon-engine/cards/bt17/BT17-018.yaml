card: BT17-018
name: "Gallantmon: Crimson Mode"
kind: digimon
level: 7
color: [red]
cost: 8
dp: 15000
traits: [Holy Warrior]

# ─── Inherited: Ace Overflow <-5> ────────────────────────────────────────────
# "Ace Overflow <-5> (As this card moves from the field or under a card to an
#  area other than those, lose 5 memory.)"
ace_overflow: -5

# ─── Alt-paths ────────────────────────────────────────────────────────────────
# Standard digivolve: Lv.6 Red / Cost 5.
# Special digivolve: Lv.6 with [Gallantmon] in name / Cost 4.
# Blast Digivolve ([Hand][Counter]): burst_digivolve with marker:true, cost 0.
alt_paths:
  - kind: digivolve
    from: { level_eq: 6, color_is: red }
    cost: 5

  - kind: digivolve
    from:
      all_of:
        - level_eq: 6
        - name_contains: "Gallantmon"
    cost: 4
    ignore_requirements: true

  - kind: burst_digivolve
    marker: true
    cost: 0

effects:
  # ─── Clause 1 — [Hand][Counter] <Blast Digivolve> ────────────────────────────
  # "Blast Digivolve (Your Digimon may digivolve into this card without paying
  #  the cost.)"
  # DCGO: BlastDigivolveEffect at OnCounterTiming.
  - kind: grant_keyword
    keyword: BlastDigivolve

  # ─── Clause 2 — [On Play][When Digivolving] DP-budget multi-delete ───────────
  # "Choose any number of your opponent's Digimon whose total DP adds up to 15000
  #  or less and delete them."
  #
  # Mandatory (DCGO: canNoSelect: false in SetUpActivateClass, meaning must pick
  # at least one when eligible targets exist; canEndNotMax: true allows ending
  # early with fewer than the maximum picks).
  #
  # Implemented via raw_rust step `bt17_018_delete_opp_digimon_dp_budget`.
  # The step uses the engine's DP-budget multi-select primitive, matching DCGO's
  # `canTargetConditionByPreSelectedList` + `canEndSelectCondition` pattern:
  # after each pick, the remaining DP budget is reduced and candidates above the
  # remainder are removed. PASS is available after the mandatory first pick.
  #
  #   Condition: ≥1 opponent Digimon in battle area (mirrors DCGO CanActivateCondition).
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Delete opp Digimon with total DP ≤ 15000"
    condition:
      any_permanent:
        of: opponent
        zone: [battle_area]
        kind: digimon
    process:
      - raw_rust: { fn: bt17_018_delete_opp_digimon_dp_budget }

  # ─── Clause 3 — [When Attacking][Once Per Turn] security trash ───────────────
  # "For every 10 cards in both players' trash, trash 1 card from the top of your
  #  opponent's security stack."
  #
  # Formula: floor((P0_trash_count + P1_trash_count) / 10) iterations of
  # trash_top_security(opponent).
  #
  # No player choice involved — purely deterministic (count-driven loop).
  # Implemented via raw_rust step `bt17_018_trash_security_per_ten_trash`.
  #
  # DSL gap note: The `lose_count_bound` verb described in the DSL spec is not
  # yet implemented in `digimon-dsl/src/step.rs`. When closed, replace this
  # raw_rust step with:
  #   - lose_count_bound:
  #       count: { floor_div: [{ card_count_in_zone: { zone: trash, of: any } }, 10] }
  #       of: opponent
  # Tracked in qa/dsl-vocab-gaps.md.
  #
  # GAP G-OPT-TRIGGERED: once_per_turn: true is compiled to Effect::max_per_turn=1
  # but triggered OPT lockout is not yet enforced by run_queued_effect_inner.
  # The clause will over-fire until that gap closes.
  - when: when_attacking
    once_per_turn: true
    summary: "[When Attacking][Once Per Turn] Trash 1 security per 10 combined trash cards"
    process:
      - raw_rust: { fn: bt17_018_trash_security_per_ten_trash }
