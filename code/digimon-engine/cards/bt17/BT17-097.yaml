# BT17-097 Return to the Primogenitor — Option, Cost 2, Blue+Green.
# Traits: (none printed).
#
# Printed card text (data/cards.json, authoritative):
#
#   [Main] 1 of your Digimon may digivolve into a level 5 or higher Digimon
#   card with the [Free] trait in your hand with the digivolution cost reduced
#   by 4. Then, place this card in the battle area.
#
#   [All Turns] When one of your Digimon with the [Free] trait would be deleted
#   other than by one of your effects, ＜Delay＞ (By trashing this card after
#   the placing turn, activate the effect below.)
#   ・By digivolving that Digimon into a Digimon card with [Imperialdramon] in
#   its name in your hand without paying the cost, prevent that deletion.
#
# Inherited (Security):
#   Security Effect [Security] You may play 1 Tamer card with [Davis Motomiya]
#   or [Ken Ichijoji] in its name from your hand or trash without paying the
#   cost. Then, place this card in the battle area.
#
# DCGO C# reference:
#   DCGO/Assets/Scripts/CardEffect/BT17/Blue/BT17_097.cs
#
# ─── DCGO crosscheck ──────────────────────────────────────────────────────────
#
# Clause A — `EffectTiming.OptionSkill` (Main play). DCGO prompts a Digimon
#   selection (select 1 own battle-area Digimon that has a hand-card eligible to
#   digivolve onto it from the filtered set Lv5+, [Free] trait, reduced cost 4),
#   then calls `CardEffectCommons.DigivolveIntoHandOrTrashCard` with
#   `reduceCost: 4`, `isHand: true`. After the digivolve, calls
#   `CardEffectCommons.PlaceDelayOptionCards(card)` — which moves this Option
#   from the hand to the battle area as a Delay-Option permanent.
#   `canNoSelect: true` on BOTH the Digimon pick and the hand-card pick — the
#   entire effect is optional.
#
# Clause B — `EffectTiming.WhenPermanentWouldBeDeleted`. Cross-permanent
#   replacement observer. CanUseCondition checks:
#     • `CanDeclareOptionDelayEffect(card)` — this Option is on the field as a
#       Delay permanent (after the placing turn).
#     • `CanTriggerWhenPermanentRemoveField(hashtable, IsOwnerPermanentCondition)`
#       — the leaving permanent is an own Digimon with [Free] trait and at
#       least one Imperialdramon-name hand card that can digivolve onto it.
#     • `!CardEffectCommons.IsByEffect(hashtable, cardEffect => IsOwnerEffect(cardEffect, card))`
#       — deletion must NOT be by the controller's own effects. This is the
#       printed "other than by one of your effects" gate.
#   `SetUpActivateClass(null, ActivateCoroutine, -1, true, ...)` — the
#   activation is OPTIONAL (isOptional = true; CR 4.3 16-17-2): the player is
#   asked before the Delay cost is paid.
#   ActivateCoroutine:
#     1. `DeletePermanentAndProcessAccordingToResult(card.PermanentOfThisCard())`
#        — pays the Delay cost (trash this Option from the battle area).
#     2. On success: `SelectPermanentEffect` over qualifying own Digimon with
#        [Free] trait (the would-be-deleted subject), `canNoSelect: true`.
#     3. `DigivolveIntoHandOrTrashCard` with `isHand: true`, `payCost: false`
#        (free digivolve), filtered to Imperialdramon-name Digimon; its hand
#        pick is optional (`isOptional = true` → `canNoSelect: true`). DCGO then
#        clears `willBeRemoveField` whenever a Digimon was selected, even if
#        the hand pick was declined; the engine follows the printed "By
#        digivolving ..., prevent" instead (CR 4.3 15-7-2: if the "by"
#        condition isn't executed, the prevention isn't either), so a declined
#        hand pick lets the deletion proceed.
#     4. Formally: DCGO's `DeletePermanentAndProcessAccordingToResult` on the
#        delay card trashes it (paying the cost), then `DigivolveIntoHandOrTrashCard`
#        performs the free digivolve on the subject. The printed "prevent that
#        deletion" is implemented by the replacement machinery: choosing to
#        activate this replacement + paying the Delay cost = the deletion is
#        replaced by the digivolve.
#
# Clause C — `EffectTiming.SecuritySkill` (Security/Inherited). Same
#   hand-or-trash optional Tamer play (Davis Motomiya OR Ken Ichijoji name
#   filter). After optional play:
#   `CardEffectCommons.PlaceDelayOptionCards(card)` — "Then, place this card in
#   the battle area."
#
# ─── Implementation status (faithfulness diff) ────────────────────────────────
#
# | Card-text element                                                   | Status |
# |---------------------------------------------------------------------|--------|
# | [Main] select own Digimon + digivolve from hand Lv5+ [Free] cost-4 | IMPLEMENTED via select_own_permanent + select_hand + effect_initiated_digivolve |
# | [Main] "Then, place this card in the battle area"                   | IMPLEMENTED via place_self_as_delay_option |
# | [All Turns] subject is own Digimon with [Free] trait                | IMPLEMENTED via trait_has: Free + replacement_subject_is_mine |
# | [All Turns] "other than by one of your effects"                     | IMPLEMENTED via none_of: [replacement_cause: own_effect] |
# | [All Turns] <Delay> cost (trash this card)                          | IMPLEMENTED via cost: delay_self: true |
# | [All Turns] digivolve subject into Imperialdramon-name hand card    | IMPLEMENTED via choose: from: hand + digivolve_without_cost |
# | [All Turns] prevent the deletion                                    | IMPLEMENTED via outcome: prevent |
# | [Security] play Davis/Ken Tamer from hand or trash, free            | IMPLEMENTED via select_union_zone (hand∪trash) + play_union_bound_free |
# | [Security] "Then, place this card in the battle area"               | IMPLEMENTED via place_self_as_delay_option |
#
# ─── DSL gap: G-DSL-UNION-PLAY-FREE — RESOLVED ───────────────────────────────
#
# Clause C prints "from your hand or trash". This is now authored natively
# with `select_union_zone` (zones: [hand, trash]) feeding `play_union_bound_free`
# — the union binding carries the origin zone, so the free play replays the
# card from its true zone. The union selection auto-collapses to the single
# populated zone when only one holds an eligible card. No zone-choice
# workaround is needed. Same idiom as ST19-08 / EX11-022 / BT17-095.
#
# ─── option_flow/replacement_integration.rs compatibility ─────────────────────
#
# The existing tests in option_flow/replacement_integration.rs use
# `dsl_card("BT17-097")` and exercise the Clause B shape (trait_has, Delay
# cost, choose, digivolve_without_cost, prevent). Those tests continue to
# pass against this YAML because the Clause B structure is preserved
# faithfully. The three key changes from the old fixture:
#   1. `replacement_cause: opponent_effect` (old, too-restrictive) →
#      `none_of: [replacement_cause: own_effect]` (new, faithful to printed
#      "other than by one of your effects" — allows battle, security_check,
#      cost, and opponent_effect triggers).
#   2. The card is now the real card (cost 2, blue+green, correct name).
#   3. Two new clauses (A and C) are added.

card: BT17-097
name: "Return to the Primogenitor"
kind: option
color: [blue, green]
cost: 2
traits: []

effects:
  # ─── Clause A — [Main] digivolve into Lv5+ [Free] hand card, cost -4, place self ──
  #
  # Printed: "[Main] 1 of your Digimon may digivolve into a level 5 or higher
  # Digimon card with the [Free] trait in your hand with the digivolution cost
  # reduced by 4. Then, place this card in the battle area."
  #
  # `optional: true` — DCGO `canNoSelect: true` on both picks; the player may
  # decline entirely (and even skip the Delay-Option placement, per the printed
  # "may digivolve" grammar — the placement is a tail of the same "may"
  # action; however, per DCGO, `PlaceDelayOptionCards` runs unconditionally
  # after the (possibly no-op) digivolve attempt, so the card always becomes a
  # Delay permanent when the Main effect activates). We model the outer
  # activate as `optional: true` (the player may decline the trigger), but
  # once activated, `place_self_as_delay_option` runs unconditionally.
  #
  - when: main_from_hand
    optional: true
    summary: "[Main] 1 of your Digimon may digivolve into a Lv5+ [Free] hand card, cost -4; then place self in battle area as Delay permanent"
    process:
      # Candidate legality (a pick the digivolve would refuse is a choice
      # with no legal outcome, CR 4.3 1-3-2):
      #   * own-Digimon pick: only a Digimon some Lv.5+ [Free] hand card can
      #     digivolve onto (DCGO BT17_097.cs:39-43). DCGO checks the route
      #     only (`CanPlayCardTargetFrame(frame, false, ...)`); the engine
      #     also requires the -4 digivolution to be payable, since choosing a
      #     Digimon whose every candidate is unpayable leads to an empty hand
      #     pick (narrows past DCGO, rules-side).
      #   * hand pick: route AND payment with the -4 installed, exactly
      #     DCGO `DigivolveIntoHandOrTrashCard` (CardEffectCommons.cs:859-881,
      #     `CanPlayCardTargetFrame(PayCost: true)`); official Q&A: this
      #     [Main] doesn't ignore digivolution requirements.
      - select_own_permanent:
          bind_as: digi_target
          optional: true
          filter:
            all_of:
              - kind: digimon
              - has_digivolve_candidate:
                  of: you
                  zone: [hand]
                  filter:
                    all_of:
                      - kind: digimon
                      - level_gte: 5
                      - trait_has: "Free"
                  cost: { reduce: 4 }
          prompt: "Select 1 of your Digimon to digivolve"
      - select_hand:
          of: you
          bind_as: digi_card
          optional: true
          filter:
            all_of:
              - kind: digimon
              - level_gte: 5
              - trait_has: "Free"
              - can_digivolve_onto_with_cost:
                  target: digi_target
                  cost: { reduce: 4 }
          prompt: "Select a Lv5+ [Free] trait hand card to digivolve (cost -4)"
      - effect_initiated_digivolve:
          target: digi_target
          from_hand: digi_card
          cost: { reduce: 4 }
          ignore_requirements: false
      # Place this Option in the battle area as a Delay permanent.
      # DCGO: `CardEffectCommons.PlaceDelayOptionCards` always fires after the
      # digivolve attempt.
      - place_self_as_delay_option: {}

  # ─── Clause B — [All Turns] Delay replacement on own [Free] deletion ──────────
  #
  # Printed: "[All Turns] When one of your Digimon with the [Free] trait would
  # be deleted other than by one of your effects, ＜Delay＞ (By trashing this
  # card after the placing turn, activate the effect below.)
  # ・By digivolving that Digimon into a Digimon card with [Imperialdramon] in
  # its name in your hand without paying the cost, prevent that deletion."
  #
  # Implementation:
  #   - `kind: replacement`, `timing: when_would_be_deleted` — observes ALL
  #     would-be-deleted events, then filters via `active_when`.
  #   - `trait_has: "Free"` — the replacement subject must have the [Free] trait
  #     (evaluated against the leaving permanent's top card, per
  #     `predicate_reads_replacement_subject` path).
  #   - `replacement_subject_is_mine: true` — gate to "your Digimon".
  #   - `none_of: [replacement_cause: own_effect]` — the printed "other than
  #     by one of your effects" gate. Allows battle, opponent_effect,
  #     security_check, cost-driven deletion (DCGO: `!IsByEffect(hashtable,
  #     cardEffect => IsOwnerEffect(cardEffect, card))`).
  #   - `optional: true` — <Delay> processing is optional (CR 4.3 16-17-2;
  #     DCGO BT17_097.cs:105 `SetUpActivateClass(null, ActivateCoroutine, -1,
  #     true, ...)`). The player is asked first (SelectionKind::Replacement:
  #     REPLACEMENT_ACCEPT / PASS); declining keeps this Option on the field
  #     (Delay cost unpaid) and the deletion proceeds. Accepting pays the cost.
  #   - `cost: delay_self: true` — pays the Delay cost by trashing this Option
  #     from the battle area.
  #   - `choose: from: hand, card_filter: ..., min: 1, max: 1` — the hand card
  #     to digivolve onto the subject. The compiled replacement `choose` is an
  #     OPTIONAL `select_hand` (it can be passed), matching DCGO
  #     `DigivolveIntoHandOrTrashCard` (`isOptional = true` → `canNoSelect:
  #     true`). Passing it leaves the "by digivolving" condition unexecuted,
  #     so the deletion is not prevented (CR 4.3 15-7-2).
  #   - `then: digivolve_without_cost: target: replacement_subject, card: chosen`
  #     — performs the free digivolve of the subject into the chosen hand card.
  #   - `outcome: prevent` — cancel the replacement; the subject is not deleted.
  #
  # `all_turns: true` — the [All Turns] printed tag. This fires on both
  # players' turns, not only your own.
  #
  # Compatibility note: the `option_flow/replacement_integration.rs` tests use
  # `dsl_card("BT17-097")` and pass `ReplacementCause::OpponentEffect` as the
  # deletion cause. Under the new `none_of: [replacement_cause: own_effect]`
  # predicate, `OpponentEffect` is NOT in the excluded set, so those tests
  # continue to pass. Tests using `ReplacementCause::OwnEffect` (i.e., own-
  # effect deletions) should NOT trigger this replacement — those are the
  # newly-faithful gate.
  - kind: replacement
    timing: when_would_be_deleted
    optional: true
    active_when:
      all_of:
        - all_turns: true
        - trait_has: "Free"
        - replacement_subject_is_mine: true
        - none_of:
            - replacement_cause: own_effect
        # DCGO `IsOwnerPermanentCondition` (BT17_097.cs:133-137): the <Delay>
        # is offered only while some [Imperialdramon] Digimon card in the
        # hand can digivolve onto the would-be-deleted Digimon; otherwise
        # paying the Delay would buy nothing.
        - has_digivolve_candidate:
            of: you
            zone: [hand]
            filter:
              all_of:
                - kind: digimon
                - name_contains: "Imperialdramon"
    summary: "[All Turns] Delay: when own [Free] Digimon would be deleted (not by own effect), pay Delay cost → digivolve subject into Imperialdramon-name hand card → prevent deletion"
    cost:
      delay_self: true
    # Only a card that can digivolve onto the subject (requirements apply:
    # DCGO BT17_097.cs:126-137 + `DigivolveIntoHandOrTrashCard` with
    # `ignoreDigivolutionRequirementFixedCost: -1`). The compiled
    # `digivolve_without_cost` ignores requirements, so this filter is the
    # requirement check. G-DSL-CAN-DIGIVOLVE-ONTO-REPLACEMENT-SUBJECT.
    choose:
      from: hand
      card_filter:
        all_of:
          - kind: digimon
          - name_contains: "Imperialdramon"
          - can_digivolve_onto: replacement_subject
      min: 1
      max: 1
    outcome: prevent
    then:
      - digivolve_without_cost:
          target: replacement_subject
          card: chosen

  # ─── Clause C — [Security] (inherited) play Davis/Ken Tamer + place self ───────
  #
  # Printed (inherited): "Security Effect [Security] You may play 1 Tamer card
  # with [Davis Motomiya] or [Ken Ichijoji] in its name from your hand or trash
  # without paying the cost. Then, place this card in the battle area."
  #
  # `optional: true` — DCGO `canNoSelect: true`; player may decline without
  # playing any Tamer.
  #
  # G-DSL-UNION-PLAY-FREE resolved: the hand-or-trash union play is authored
  # natively with `select_union_zone` (zones: [hand, trash]) followed by
  # `play_union_bound_free`. The union binding carries the origin zone, so
  # `play_union_bound_free` replays the picked card from its true zone for
  # free. When only one zone holds an eligible Tamer, the union selection
  # auto-collapses to that zone — no explicit zone-choice prompt is needed.
  # Same idiom as ST19-08 / EX11-022 / BT17-095.
  #
  # "Then, place this card in the battle area." — `place_self_as_delay_option: {}`
  # is the correct verb (cf. BT17-095 Clause A). This seats this Option as a
  # Delay permanent on the field, enabling Clause B's cross-permanent observer.
  # DCGO: `CardEffectCommons.PlaceDelayOptionCards(card, cardEffect)`.
  #
  # Note: DCGO restricts the eligible Tamer to `IsTamer` AND ContainsCardName.
  # The printed text says "1 Tamer card with [Davis Motomiya] or [Ken Ichijoji]
  # in its name" — in the current card pool there are no non-Tamer cards with
  # these names, so the name filter is equivalent in practice. Mirrored as
  # name filter only to match printed text.
  - scope: inherited
    when: on_security
    optional: true
    summary: "[Security][Inherited] You may play 1 [Davis Motomiya]/[Ken Ichijoji] Tamer from hand or trash free; then place self in battle area"
    process:
      # Native hand∪trash union selection — auto-collapses to the single
      # populated zone when only one holds an eligible Tamer.
      - select_union_zone:
          of: you
          zones: [hand, trash]
          bind_as: picked_tamer
          optional: true
          filter:
            all_of:
              - kind: tamer
              - any_of:
                  - name_contains: "Davis Motomiya"
                  - name_contains: "Ken Ichijoji"
              # DCGO BT17_097.cs:226 `CanPlayAsNewPermanent`: free frame, no
              # effect-play prohibition; a trash card also needs its owner
              # able to play from the trash.
              - can_play_from_effect_without_cost: true
          prompt: "You may play 1 [Davis Motomiya] or [Ken Ichijoji] Tamer from your hand or trash without paying the cost"
      - play_union_bound_free:
          binding: picked_tamer
      # Final step: place this Option in controller's battle area as a Delay
      # permanent. DCGO: `CardEffectCommons.PlaceDelayOptionCards(card, ...)`.
      - place_self_as_delay_option: {}
