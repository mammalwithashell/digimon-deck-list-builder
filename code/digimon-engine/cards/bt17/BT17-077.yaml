# BT17-077 Imperialdramon: Paladin Mode — Digimon, Lv.7, White/Blue, DP 16000, Cost 9.
# Traits: Ancient Holy Warrior.
# Evo: Lv.6 Blue / Cost 6 (standard, per cards.json evo_costs).
#
# Printed card text (data/cards.json, authoritative):
#
# [Hand] [Counter] <Blast Digivolve>
#   (Your Digimon may digivolve into this card without paying the cost.)
#
# [On Play] [When Digivolving]
#   Trash all digivolution cards of all of your opponent's Digimon. Then,
#   return all cards from your or your opponent's trash to the bottom of the
#   deck. If this effect returned a white level 7 card, gain 3 memory.
#
# [When Attacking]
#   By returning 1 of your opponent's Digimon with no digivolution cards to
#   the bottom of the deck, unsuspend this Digimon.
#
# Inherited: Ace Overflow <-5>
#   (As this card moves from the field or under a card to an area other than
#    those, lose 5 memory.)
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT17/White/BT17_077.cs
#
# ─── DCGO crosscheck ─────────────────────────────────────────────────────────
#
# Alt-path 1: Standard digivolve from Lv.6 Blue / Cost 6 (cards.json
#   evo_costs: card_color=1, level=6, memory_cost=6).
#
# Alt-path 2: DCGO `AddSelfDigivolutionRequirementStaticEffect` at
#   EffectTiming.None — digivolve from Lv.6 [Imperialdramon]-named at cost 5,
#   ignoreDigivolutionRequirement: false. This is a named-ancestor bonus
#   digivolve path that many Imperialdramon variants carry.
#
# Alt-path 3: Blast Digivolve (`[Hand][Counter]`) via
#   `CardEffectFactory.BlastDigivolveEffect` at EffectTiming.OnCounterTiming.
#   Modelled as `kind: burst_digivolve, marker: true, cost: 0` per BT17-018
#   (Gallantmon: Crimson Mode) canonical pattern.
#
# Clause 0 — [Hand][Counter] <Blast Digivolve>
#   grant_keyword: BlastDigivolve — IMPLEMENTABLE.
#   `marker: true` on the burst_digivolve alt-path records the keyword marker
#   in the compiled card. BT17-018 is the canonical example.
#
# Clause 1 — [On Play][When Digivolving] mass source trash + trash return + conditional memory
#
#   Clause 1a: "Trash all digivolution cards of all of your opponent's Digimon."
#   IMPLEMENTED with `for_each` over opponent battle-area Digimon plus
#   `trash_all_sources` for each matching stack. This is an automatic sweep, not
#   a player choice.
#
#   Clause 1b: "Return all cards from your or your opponent's trash to the bottom
#   of the deck."
#   IMPLEMENTED with an explicit `select_effect_choice` prompt. The controller
#   chooses either their trash or the opponent's trash, then
#   `return_all_trash_to_deck_bottom` drains only that chosen trash.
#
#   Clause 1c: "If this effect returned a white level 7 card, gain 3 memory."
#   IMPLEMENTED by pre-checking the chosen trash with `count_gte` for a white
#   Lv.7 card, then returning that whole trash and gaining memory afterward.
#   Because the effect returns every card in the chosen trash, the pre-check is
#   equivalent to a returned-card predicate for this card and does not inspect
#   the unchosen trash.
#
# Clause 2 — [When Attacking] by-return-opp-no-digi unsuspend self
#   IMPLEMENTABLE. See process body below.
#   `optional: true` — DCGO `SelectPermanentEffect.SetUp(canNoSelect: true)` means
#   the player may choose to return no targets (i.e., decline the cost/effect).
#   Per printed text "By returning ... unsuspend" — this is an optional by-cost
#   construction. The condition requires at least one eligible target to even
#   present the choice.
#
#   "No digivolution cards" = stack_size_lte: 1
#   (perm.card_sources.len() is the total stack including the top card; a
#    Digimon with no sources below equals 1 total card in card_sources).
#
# Clause 3 — Inherited Ace Overflow <-5>
#   IMPLEMENTABLE via top-level `ace_overflow: -5` field.
#
card: BT17-077
name: "Imperialdramon: Paladin Mode"
kind: digimon
level: 7
color: [white, blue]
cost: 9
dp: 16000
traits: [Ancient Holy Warrior]

attribute: Vaccine
# ─── Inherited: Ace Overflow <-5> ────────────────────────────────────────────
# Printed: "Ace Overflow <-5> (As this card moves from the field or under a
#  card to an area other than those, lose 5 memory.)"
# Modelled via top-level `ace_overflow` field per Group 8 closure (2026-05-02).
ace_overflow: -5

# ─── Alt-paths ────────────────────────────────────────────────────────────────
alt_paths:
  # 1) Standard digivolve: Lv.6 Blue / Cost 6 (per cards.json evo_costs).
  - kind: digivolve
    from: { level_eq: 6, color_is: blue }
    cost: 6

  # 2) Named-ancestor bonus: Lv.6 [Imperialdramon]-named / Cost 5.
  #    DCGO BT17_077.cs, EffectTiming.None, AddSelfDigivolutionRequirementStaticEffect:
  #    permanentCondition: Level == 6 && ContainsCardName("Imperialdramon")
  #    digivolutionCost: 5, ignoreDigivolutionRequirement: false.
  - kind: digivolve
    from:
      all_of:
        - level_eq: 6
        - name_contains: "Imperialdramon"
    cost: 5

  # 3) Blast Digivolve: [Hand][Counter], cost 0, no digivolve requirements.
  #    DCGO: CardEffectFactory.BlastDigivolveEffect at EffectTiming.OnCounterTiming.
  #    `marker: true` records the <Blast Digivolve> keyword marker on the card.
  #    Canonical reference: BT17-018 (Gallantmon: Crimson Mode).
  - kind: burst_digivolve
    marker: true
    cost: 0

effects:
  # ─── Clause 0 — [Hand][Counter] <Blast Digivolve> ────────────────────────────
  # "Blast Digivolve (Your Digimon may digivolve into this card without paying
  #  the cost.)"
  # DCGO: BlastDigivolveEffect at OnCounterTiming.
  # Face-up declarative keyword grant per BT17-018 canonical pattern.
  - kind: grant_keyword
    keyword: BlastDigivolve

  # ─── Clause 1 — [On Play][When Digivolving] mass trash + return trash + memory ─
  #
  # Printed: "Trash all digivolution cards of all of your opponent's Digimon.
  # Then, return all cards from your or your opponent's trash to the bottom of
  # the deck. If this effect returned a white level 7 card, gain 3 memory."
  #
  # Step 1a is an automatic sweep: every opponent battle-area Digimon is visited
  # and all of its digivolution cards are trashed. `trash_all_sources` preserves
  # the top card of each stack.
  #
  # Step 1b is a player-visible choice. The effect controller chooses whose
  # trash is returned; only the chosen trash is drained.
  #
  # Step 1c uses a faithful pre-check per the audit: since the chosen trash is
  # returned in full, "chosen trash contains a white Lv.7" is equivalent to
  # "this effect returned a white Lv.7." The unchosen trash is not inspected.
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] Trash all opp digi sources; choose a trash to bottom-deck; +3 memory if chosen trash returned white Lv.7"
    process:
      - for_each:
          over:
            all_of:
              - of: opponent
              - zone: [battle_area]
              - kind: digimon
          bind_as: opp_digimon
          body:
            - trash_all_sources: { target: opp_digimon }

      - select_effect_choice:
          bind_as: whose_trash
          labels: ["Your Trash", "Opponent's Trash"]
          prompt: "Return all cards from your or your opponent's trash to the bottom of the deck"

      - if:
          condition: { equals: [whose_trash, 0] }
          then:
            - if:
                condition:
                  count_gte:
                    filter:
                      of: you
                      zone: [trash]
                      color_is: white
                      level_eq: 7
                    n: 1
                then:
                  - return_all_trash_to_deck_bottom: { of: you }
                  - gain_memory: 3
                else:
                  - return_all_trash_to_deck_bottom: { of: you }

      - if:
          condition: { equals: [whose_trash, 1] }
          then:
            - if:
                condition:
                  count_gte:
                    filter:
                      of: opponent
                      zone: [trash]
                      color_is: white
                      level_eq: 7
                    n: 1
                then:
                  - return_all_trash_to_deck_bottom: { of: opponent }
                  - gain_memory: 3
                else:
                  - return_all_trash_to_deck_bottom: { of: opponent }

  # ─── Clause 2 — [When Attacking] return opp Digimon (no digi cards) → unsuspend ─
  #
  # Printed: "[When Attacking] By returning 1 of your opponent's Digimon with no
  #  digivolution cards to the bottom of the deck, unsuspend this Digimon."
  #
  # DCGO: EffectTiming.OnAllyAttack, SetUpActivateClass(..., isOptional=false),
  #   SelectPermanentEffect.SetUp(canNoSelect: true, maxCount: 1).
  #   CanActivateCondition: IsExistOnBattleAreaDigimon(card) &&
  #     HasMatchConditionPermanent(IsOpponentsDigimon) — where IsOpponentsDigimon
  #     filters to: IsOnOpponentBattleArea && DigivolutionCards.Count == 0.
  #   On successful return: IUnsuspendPermanents([card.PermanentOfThisCard()]).
  #
  # `optional: true` — DCGO canNoSelect: true means player may skip (pay no cost
  #   and skip the unsuspend). Per "By returning ... unsuspend" printed grammar,
  #   the whole effect is a by-cost optional idiom.
  #
  # "No digivolution cards" = stack_size_lte: 1
  #   (perm.card_sources.len() includes the top card; stack_size_lte: 1 means
  #    at most 1 card total → no sources below the top card).
  #
  # Condition: at least 1 eligible opponent Digimon must exist to present the
  #   choice. CanActivateCondition in DCGO checks HasMatchConditionPermanent
  #   before offering the selection.
  - when: when_attacking
    optional: true
    summary: "[When Attacking] By returning 1 opp Digimon (no digi cards) to deck bottom, unsuspend self"
    condition:
      any_permanent:
        of: opponent
        zone: [battle_area]
        kind: digimon
        stack_size_lte: 1
    process:
      # Select 1 opponent Digimon with no digivolution cards.
      - select_opponent_permanent:
          bind_as: bounce_target
          filter:
            all_of:
              - kind: digimon
              - stack_size_lte: 1
          prompt: "Select 1 opponent Digimon with no digivolution cards to return to the bottom of the deck"
      # Return selected Digimon to the bottom of the deck (cost + movement).
      - return_to_deck:
          target: bounce_target
          position: bottom
      # Unsuspend this Digimon (the effect source — Imperialdramon: Paladin Mode).
      - unsuspend: { target: source }
