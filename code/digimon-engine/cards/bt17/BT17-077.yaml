    summary: "[On Play][When Digivolving] Trash all sources of all opponent Digimon"
    process:
      - for_each:
          over:
            all_of:
              - kind: digimon
              - of: opponent
              - zone: [battle_area]
          bind_as: stack
          body:
            - trash_all_sources: { target: stack }

