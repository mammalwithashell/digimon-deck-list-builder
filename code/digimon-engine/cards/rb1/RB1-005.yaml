# RB1-005 Gammamon — Digimon, Lv.3, Red, DP 1000, Cost 3.
# Traits: Ceratopsian. Attribute: Virus. Form: Rookie.
# Digivolve: Red Lv.2 / cost 0 (the single printed circle, carried by the card
# data; no alt path is needed).
#
# Printed text (card image RB1-005.webp; official Bandai DB bundle
# data/card_bundles/RB1-005.md; DCGO RB1_005.cs):
#
#   [On Play] Reveal the top 3 cards of your deck. Add 1 card with [Gammamon]
#   in its text and 1 [Hiro Amanokawa] among them to the hand. Place the rest
#   at the bottom of the deck in any order.
#
#   Inherited: [Your Turn] While this Digimon has [Gammamon] in its text, it
#   gets +2000 DP.
#
# Official Q&A: "XX in its text" on the inherited effect reads only the TOP
# card of the stack. When this card is a digivolution card it is not the top
# card, so it cannot reference its own text — the aura below is evaluated
# against the carrier's top card (the `in_text_contains` card scan on the
# carrier permanent), never against RB1-005's own text.
#
# DCGO crosscheck (RB1_005.cs):
#   - OnEnterFieldAnyone + CanTriggerOnPlay, gated on >= 1 card in the library:
#     `SimplifiedRevealDeckTopCardsAndSelect(revealCount: 3, two conditions
#     [HasText("Gammamon")] and [name Hiro Amanokawa], AddHand, maxCount 1 each,
#     remaining -> DeckBottom)`. The helper's picks are mandatory when a
#     candidate exists (canNoSelect false) and a card taken by the first pick is
#     removed from the pool before the second, so one card never fills both
#     slots; the official BT7-081 Q&A (same shape) confirms a lone matching card
#     is still added. The remainder is ordered by the player (CR 4.3 3-1-3-4).
#     -> `reveal_top_deck` + `select_reveal_buckets { no_duplicate_cards }` +
#     two `add_to_hand_from_reveal` + `place_remainder_on_deck { bottom }`
#     (BT20-048 idiom). DCGO also accepts the spaceless "HiroAmanokawa" name,
#     which is a DCGO data variant; every printed card is "Hiro Amanokawa".
#   - Inherited: EffectTiming.None static DP +2000, IsOwnerTurn && the stack's
#     TopCard.HasText("Gammamon") (`HasText` = name + traits + printed text,
#     the broad `in_text_contains` scan).

card: RB1-005
name: Gammamon
kind: digimon
level: 3
color: [red]
cost: 3
dp: 1000
form: Rookie
attribute: Virus
traits: [Ceratopsian]

effects:
  - when: on_play
    summary: "[On Play] Reveal 3; add 1 [Gammamon]-text card and 1 [Hiro Amanokawa]; bottom the rest in any order"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal_buckets:
          from: revealed
          no_duplicate_cards: true
          buckets:
            - bind_as: gammamon_text
              filter: { in_text_contains: Gammamon }
              min: 1
              max: 1
            - bind_as: hiro
              filter: { name_is: Hiro Amanokawa }
              min: 1
              max: 1
          prompt: "Add 1 card with [Gammamon] in its text and 1 [Hiro Amanokawa] to your hand"
      - add_to_hand_from_reveal: { of: you, card: gammamon_text }
      - add_to_hand_from_reveal: { of: you, card: hiro }
      - place_remainder_on_deck: { of: you, position: bottom }

  - scope: inherited
    kind: aura
    active_when:
      all_of:
        - your_turn: true
        - in_text_contains: Gammamon
    target: {}
    dp_modifier: 2000
    summary: "[Inherited][Your Turn] While this Digimon has [Gammamon] in its text, it gets +2000 DP"
