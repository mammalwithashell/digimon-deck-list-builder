# RB1-010 Siriusmon — Digimon, Lv.6, Red, DP 11000, Cost 11.
# Traits: Light Dragon. Attribute: Vaccine. Form: Mega.
#
# Printed card text (official Bandai DB — data/card_bundles/RB1-010.md):
#
#   Digivolve: Red Lv.5 / cost 3
#   [Digivolve] 3 from Lv.5 w/[Gammamon] in text
#
#   [When Digivolving] By placing 1 Digimon card with [Gammamon] in its text
#   from your hand as this Digimon's bottom digivolution card, delete 1 of your
#   opponent's Digimon with DP less than or equal to this Digimon's DP.
#   [Your Turn][Once Per Turn] When an opponent's Digimon is deleted, you may
#   unsuspend this Digimon.
#
# Official Q&A: if the placed card's inherited effect raises DP (e.g. a
# [Your Turn] DP boost), the deletion threshold is the DP AFTER the increase —
# i.e. "this Digimon's DP" is read after the placement.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/RB1/Red/RB1_010.cs
#
# ─── DCGO crosscheck ─────────────────────────────────────────────────────────
#
# Alt digivolve (EffectTiming.None, AddSelfDigivolutionRequirementStaticEffect):
#   top card HasText("Gammamon") && Level == 5, cost 3 → alt_paths below.
#   The printed red Lv.5 / cost 3 circle is the first alt_paths entry.
#
# [When Digivolving] (OnEnterFieldAnyone, CanTriggerWhenDigivolving, optional):
#   SelectHandEffect over IsDigimon && HasText("Gammamon"), maxCount 1,
#   canNoSelect: true. Only when a card was picked:
#   AddDigivolutionCardsBottom, then SelectPermanentEffect (Destroy) over
#   opponent battle-area Digimon with permanent.DP <= this permanent's DP
#   (read live AFTER the placement), maxCount Min(1, matches),
#   canNoSelect: false.
#   → `select_hand { optional: true, cost: true }` (declining aborts the
#     delete — "By placing X, do Y") whose `then:` places the pick as the
#     bottom source, then picks + deletes an opponent Digimon whose DP is
#     `<= source_dp` (the carrier's live effective DP, evaluated at the
#     selection, i.e. after placement).
#
# [Your Turn][Once Per Turn] (OnDestroyedAnyone, optional, OPT hash
# "Unsuspend_RB1_010"):
#   CanUse: on battle area && IsOwnerTurn && an opponent battle-area Digimon
#   was deleted. CanActivate: CanUnsuspend(this) — i.e. this Digimon is
#   suspended → `source_is_unsuspended: false` in the condition so an
#   already-unsuspended Siriusmon neither prompts nor spends its OPT.

card: RB1-010
name: Siriusmon
kind: digimon
level: 6
color: [red]
cost: 11
dp: 11000
traits: ["Light Dragon"]
attribute: Vaccine

alt_paths:
  - kind: digivolve
    from: { level_eq: 5, color_is: red }
    cost: 3
  - kind: digivolve
    from:
      all_of:
        - level_eq: 5
        - in_text_contains: Gammamon
    cost: 3

effects:
  - when: when_digivolving
    summary: "[When Digivolving] By placing 1 [Gammamon]-text Digimon card from hand as bottom source, delete 1 opponent Digimon with DP <= this Digimon's DP"
    process:
      - select_hand:
          of: you
          bind_as: placed
          optional: true
          cost: true
          filter:
            all_of:
              - kind: digimon
              - in_text_contains: Gammamon
          prompt: "You may place 1 Digimon card with [Gammamon] in its text from your hand as this Digimon's bottom digivolution card to delete 1 of your opponent's Digimon with DP less than or equal to this Digimon's DP"
          then:
            - place_as_bottom_source:
                source: placed
                target: source
            - select_opponent_permanent:
                bind_as: victim
                filter:
                  all_of:
                    - kind: digimon
                    - dp_lte: { formula: { source_dp: {} } }
                prompt: "Delete 1 of your opponent's Digimon with DP less than or equal to this Digimon's DP"
            - delete_permanent: { target: victim }

  - when: on_any_deletion
    active_when: { your_turn: true }
    once_per_turn: true
    optional: true
    summary: "[Your Turn][OPT] When an opponent's Digimon is deleted, you may unsuspend this Digimon"
    condition:
      all_of:
        - event_target_owner: opponent
        - event_target_kind: digimon
        - source_is_unsuspended: false
    process:
      - unsuspend: { target: source }
