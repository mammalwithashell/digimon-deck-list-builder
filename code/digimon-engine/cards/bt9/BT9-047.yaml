# BT9-047 Pomumon — Digimon, Lv.3, Green, DP 2000, Cost 3.
# Traits: Vegetation. Form: Rookie. Attribute: Data.
# Digivolve: green Lv.2 / cost 0 (official DB + card image + DCGO BT9_047.asset).
#
# Printed text (official Bandai DB, data/card_bundles/BT9-047.md; image agrees):
#   [All Turns] Players can't play Digimon by effects.
# No inherited effect, no security effect.
#
# DCGO: no per-card BT9_047.cs exists. The text is the BT9-033 Pillomon /
# BT14-009 Gotsumon reprint; this is the same `flood_gate` shape.
#
# Official Q&A (data/card_qa.json):
#   Q1844 moving out of the breeding area is not playing → still legal.
#   Q1845 pure cost reductions still work (no play happens).
#   Q1846 Option-card effects can't play Digimon either.
#   Q5206 effects can't play Digimon into the breeding area either
#         (`can_play_to_breeding_from_hand` reads the same modifier).
# §3-4-7-4: a Pomumon in the breeding area has no active effect — gated with
# `not: { in_breeding: true }` (the EX2-007 idiom), because the declarative
# tick also materializes breeding-area sources.

card: BT9-047
name: Pomumon
kind: digimon
level: 3
color: [green]
cost: 3
dp: 2000
traits: [Vegetation]
form: Rookie
attribute: Data

alt_paths:
  - kind: digivolve
    from: { level_eq: 2, color_is: green }
    cost: 0

effects:
  - kind: flood_gate
    scope: face_up
    # §3-4-7-4: a Pomumon in the breeding area has no active effect. The
    # declarative tick scans the breeding area too (for [Breeding] cards), so
    # the gate is closed there explicitly (the EX2-007 idiom).
    active_when:
      all_of:
        - all_turns: true
        - not: { in_breeding: true }
    modifier: CannotPlayDigimonByEffect
    target_player: any
    summary: "[All Turns] Players can't play Digimon by effects"
