card: BT9-092
name: Cool Boy
kind: tamer
color: [white]
cost: 2

effects:
  - when: on_play
    summary: "[On Play] Reveal 3; add 1 X Antibody Digimon and 1 X Antibody Option"
    process:
      - reveal_top_deck: { of: you, count: 3, bind_as: revealed }
      - select_reveal:
          of: you
          bind_as: digimon
          optional: true
          filter:
            all_of:
              - kind: digimon
              - trait_has: "X Antibody"
          prompt: "Add 1 X Antibody Digimon card"
      - add_to_hand_from_reveal: { of: you, card: digimon }
      - select_reveal:
          of: you
          bind_as: option
          optional: true
          filter:
            all_of:
              - kind: option
              - trait_has: "X Antibody"
          prompt: "Add 1 X Antibody Option card"
      - add_to_hand_from_reveal: { of: you, card: option }
      - place_remainder_on_deck: { of: you, position: bottom }

  - when: on_security
    summary: "[Security] Play this card without paying the cost"
    process:
      - play_from_security: {}

  # ─── Clause 2: [Your Turn] same-level [X Antibody] digivolve observer ─────
  #
  # Printed text (image-authoritative — Card/BT9-092.webp):
  #   "[Your Turn] When one of your Digimon digivolves into a same-level
  #   Digimon with [X Antibody] in its traits, you may suspend this Tamer to
  #   gain 1 memory and <Draw 1>."
  #
  # DCGO BT9_092.cs clause 2 (EffectTiming.OnEnterFieldAnyone):
  #   PermanentCondition = IsPermanentExistsOnOwnerBattleAreaDigimon &&
  #     TopCard.HasXAntibodyTraits && IsDigivolvedFromSameLevelFromEnterField;
  #   CanUseCondition    = IsExistOnBattleArea && IsOwnerTurn(card) &&
  #     CanTriggerWhenPermanentDigivolving(PermanentCondition);
  #   CanActivateCondition = CanActivateSuspendCostEffect(card) — the Tamer
  #     must be UNSUSPENDED to pay the cost;
  #   body = SuspendPermanents(this Tamer).Tap() → Draw 1 → AddMemory(1).
  #
  # Maps verbatim onto AD1-019 clause 2 (on_digivolve + suspend-self + trait
  # gate) with (a) the trait gate "X Antibody" instead of ADVENTURE, (b) one
  # extra leaf `event_target_same_level_as_previous: true` (proven live by
  # tests/dsl/phase3d_event_context.rs `digivolve_event_can_match_same_level
  # _x_antibody_transition`), and (c) a simpler body (gain_memory + draw).
  # The optional `optional: true` is the printed "you may".
  - when: on_digivolve
    active_when: { your_turn: true }
    optional: true
    summary: "[Your Turn] When your Digimon digivolves into a same-level [X Antibody] Digimon, by suspending this Tamer gain 1 memory and draw 1"
    condition:
      all_of:
        - event_target_owner: you
        - event_target_kind: digimon
        - event_target_trait_has: "X Antibody"
        - event_target_same_level_as_previous: true
        - source_is_unsuspended: true
    process:
      - activation_cost: { suspend_self: true }
      - gain_memory: 1
      - draw: { of: you, count: 1 }
