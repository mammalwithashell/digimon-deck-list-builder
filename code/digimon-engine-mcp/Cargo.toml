[package]
name = "digimon-engine-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP (Model Context Protocol) stdio server for the Digimon TCG engine — lets AI agents debug cards, investigate smoke-test failures, and inspect training-run recordings"

[dependencies]
digimon-engine = { path = "../digimon-engine" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[[bin]]
name = "digimon-engine-mcp"
path = "src/main.rs"
