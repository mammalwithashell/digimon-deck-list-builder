# Interaction qa:Q6813 -- a [Security] effect and Shishimamon's "opponent's
# security stack is removed from" trigger fire on the same security check.
# p1's top security card is Genshi Continent (EX12-074, [Security]) and p1
# controls Gatomon (BT15-037, "[All Turns] [Once Per Turn] When a card is removed
# from your security stack, gain 1 memory", mandatory). One security check
# therefore triggers THREE effect types at once: the [Security] effect (p1 plays
# EX12-004), Shishimamon's removal trigger (turn player p0, optional digivolve
# prompt) and Gatomon's removal trigger (non-turn player p1, mandatory, no
# prompt). The ruling: the [Security] effect activates first, immediately and
# unpended; then the TURN PLAYER's removal trigger (Shishimamon) before the
# non-turn player's (Gatomon). No card in the pool is both implemented and
# printed "when [...] performs a security check", so that third effect type
# is not exercised.
# Base: EX12-046 (Shishimamon), clause effect#2 -- "[Your Turn] When
# your opponent's security stack is removed from, this Digimon may digivolve
# into a [TB] trait Digimon card in the hand with the cost reduced by 2."
#
# The line: p0 plays Shishimamon from hand, then two turns later attacks p1's
# security. The single check trashes p1's top security card -- a removal from
# the security stack on p0's own turn -- and the clause parks its optional
# digivolve prompt. p0 answers with Kaguyamon (EX12-065), the pool's only
# [TB] trait Digimon that can sit on a level 5:
#   - its standard purple/green circles miss the yellow/red Shishimamon, so
#     the ONLY matching route is the "Lv.5 w/[Shambala]: Cost 3" alt path --
#     one distinct cost, no cost-choice prompt;
#   - reduced by 2, the digivolve costs 1: memory 3 -> 2 is the cost witness.
#
# DCGO's trigger is skippable (SetIsSkippable) and its only prompt is the
# hand-card pick (SelectHandEffect), so the line answers that pick directly.
#
# Kaguyamon's own [When Digivolving] ("play 1 play cost 5 or lower [Puppet]/
# [Shambala] card from your trash") stays silent: p0's trash is empty. Its
# [All Turns] keyword grant is an aura, not a prompt. Amaterasumon's card face
# prints [TB] too, but no EX12-047 copy is in p0's hand, so Kaguyamon stays the
# pick's only candidate on both sides.
#
# p1's security is stacked with plain low-DP Digimon so the check resolves as
# a silent security battle the 7000 DP attacker survives.
