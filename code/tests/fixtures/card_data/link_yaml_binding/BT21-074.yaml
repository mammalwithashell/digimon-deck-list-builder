# BT21-074 Satellamon — Digimon (Appmon), Lv.5, Purple/Black, DP 7000, Cost 7.
# Traits: Ult. / Appmon / GPS. Attribute: Navi.
#
# Printed card text (data/card_bundles/BT21-074.md — official Bandai DB,
# confirmed against the card image BT21-074.webp):
#
#   [On Play] [When Digivolving] By placing 1 [Appmon] or [Three Musketeers]
#   trait card from your hand or trash as any of your Digimon's bottom
#   digivolution card, until your opponent's turn ends, their effects can't
#   return that Digimon to hands or decks or affect it with ＜De-Digivolve＞
#   effects. [When Digivolving] [When Attacking] [Once Per Turn] By trashing
#   1 card with the [Appmon] or [Three Musketeers] trait from your Digimon's
#   digivolution cards, ＜De-Digivolve 1＞ 1 of your opponent's Digimon.
#   Special Rule: +4000 DP  (the Appmon link box)
#   Inherited Effect: ＜Link＞ [Appmon] trait: Cost 3  [When Linking] Delete 1
#   of your opponent's level 4 or lower Digimon.
#
# Digivolution requirements (official Bandai DB + card image):
#   Standard circles: Purple Lv.4 / cost 4; Black Lv.4 / cost 4.
#   [Sup.] trait / cost 4 — printed as a small trait circle on the card image
#   (the DB bundle's circle list omits it; DCGO registers it) — the Appmon
#   Ult.-form "Sup." route.
#   [Digivolve] Lv.4 w/[Three Musketeers] in text: Cost 3.
#
# DCGO C# reference: DCGO/Assets/Scripts/CardEffect/BT21/Purple/BT21_074.cs
#
# ─── DCGO crosscheck (per clause) ────────────────────────────────────────────
#
# Alt digivolution: Level == 4 && TopCard.HasText("Three Musketeers"), cost 3;
#   EqualsTraits("Sup."), cost 4 → two `kind: digivolve` alt-paths plus the
#   two standard colour circles.
#
# Link: AddSelfLinkConditionStaticEffect(HasAppmonTraits, linkCost 3) →
#   `kind: link_condition, cost: 3`; link box "+4000 DP" → `scope: linked`
#   DP aura 4000.
#
# On Play / When Digivolving (`-1, false` = MANDATORY clause; CanActivate:
#   hand or trash non-empty AND an own non-token Digimon exists): hand-or-
#   trash SetBoolSelection (forced when only one zone qualifies), then
#   SelectHandEffect / SelectCardEffect(Root.Trash) (canNoSelect: true) over
#   EqualsTraits("Appmon") || HasThreeMusketeersTraits; then
#   SelectPermanentEffect (canNoSelect: true) over own battle-area Digimon
#   with `!permanent.IsToken` → AddDigivolutionCardsBottom; then
#   GainCanNotReturnToHand + GainCanNotReturnToDeck (cardEffectCondition:
#   IsOpponentEffect, UntilOpponentTurnEnd) + ImmuneFromDeDigivolveClass
#   registered in the target's UntilOpponentTurnEndEffects.
#   → `select_union_zone { zones: [hand, trash], optional: true, then: [...] }`
#     (one union pick = DCGO's zone-then-card two-step; the whole tail is
#     nested in `then:` so declining / no candidate = nothing placed, nothing
#     protected) → `select_own_permanent { kind: digimon,
#     none_of: [kind: token], optional: true }` (DCGO's second canNoSelect —
#     declining aborts the tail) → `place_as_bottom_source` → three
#     `add_modifier`s: `CannotBeReturnedToHand` / `CannotBeReturnedToDeck` /
#     `CannotBeDeDigivolved`, all with `expiry: end_of_opponents_turn`. These
#     modifier types default to an OpponentEffect cause filter
#     (`modifiers.rs::default_passive_cause_filter`), matching "THEIR effects".
#
# When Digivolving / When Attacking (`1, true` = OPT + OPTIONAL, one shared
#   hash "BT21_074De-digivolve" → a single `[when_digivolving, when_attacking]`
#   OPT clause): SelectTrashDigivolutionCards over ANY own Digimon
#   (isFromOnly1Permanent: false, canNoTrash: false) filtered Appmon-or-TM;
#   `if (trashed)` mandatory SelectPermanentEffect over opponent Digimon →
#   IDegeneration(1).
#   → `optional: true`, `once_per_turn: true`, `select_union_zone { zones:
#     [material] }` (material_of omitted = every own Digimon's stack) +
#     `trash_union_bound` → `select_opponent_permanent` → `de_digivolve 1`.
#
# WhenLinked: mandatory Destroy select over opponent Digimon with HasLevel &&
#   Level ≤ 4 → `scope: linked, when: when_linked`, `level_lte: 4`.
#
# ─── Implementation status ───────────────────────────────────────────────────
#
# | Card-text element                                                    | Status      |
# |------------------------------------------------------------------------|-----------|
# | Alt-sources: Purple/Black Lv.4 / 4, [Sup.] / 4, Lv.4 w/TM in text / 3  | IMPLEMENTED |
# | [On Play][WD] place Appmon/TM card from hand/trash as any own Digimon's bottom source | IMPLEMENTED |
# | … until opp's turn ends: their effects can't return it to hand/deck or De-Digivolve it | IMPLEMENTED |
# | [WD][WA][OPT] trash Appmon/TM source from own Digimon → De-Digivolve 1 | IMPLEMENTED |
# | Link box +4000 DP / <Link> [Appmon] cost 3                             | IMPLEMENTED |
# | [When Linking] delete 1 opp level ≤4 Digimon                           | IMPLEMENTED |

card: BT21-074
name: Satellamon
kind: digimon
level: 5
color: [purple, black]
cost: 7
dp: 7000
traits: ["Ult.", Appmon, GPS]
attribute: Navi

alt_paths:
  - kind: digivolve
    from: { level_eq: 4, color_is: purple }
    cost: 4
  - kind: digivolve
    from: { level_eq: 4, color_is: black }
    cost: 4
  - kind: digivolve
    from: { trait_has: "Sup." }
    cost: 4
  - kind: digivolve
    from: { level_eq: 4, in_text_contains: "Three Musketeers" }
    cost: 3

effects:
  # ─── <Link> [Appmon] trait: Cost 3 ────────────────────────────────────────
  - kind: link_condition
    cost: 3
    filter: { trait_has: Appmon }
    summary: "<Link> [Appmon] trait: Cost 3"

  # ─── Link box: +4000 DP to the host while linked ──────────────────────────
  - scope: linked
    kind: aura
    target: {}
    dp_modifier: 4000
    summary: "[Link] +4000 DP to the linked Digimon"

  # ─── [On Play][WD] tuck Appmon/TM card from hand/trash → protection ───────
  - when: [on_play, when_digivolving]
    summary: "[On Play][When Digivolving] By placing 1 [Appmon] or [Three Musketeers] card from hand/trash as any of your Digimon's bottom digivolution card, until your opponent's turn ends their effects can't return that Digimon to hand/deck or De-Digivolve it"
    process:
      # The whole tail lives in the union pick's `then:` so it runs ONLY
      # once a card was actually picked (BT25-083 idiom) — with no eligible
      # card the pick self-skips and nothing downstream is offered.
      - select_union_zone:
          of: you
          zones: [hand, trash]
          optional: true
          bind_as: tuck_card
          filter:
            any_of:
              - trait_has: Appmon
              - trait_has: "Three Musketeers"
          prompt: "Place 1 [Appmon] or [Three Musketeers] trait card from your hand or trash as any of your Digimon's bottom digivolution card"
          then:
            - select_own_permanent:
                bind_as: protected
                optional: true
                filter:
                  all_of:
                    - kind: digimon
                    - none_of:
                        - kind: token
                prompt: "Choose 1 of your Digimon to receive the card as its bottom digivolution card"
            - place_as_bottom_source:
                source: tuck_card
                target: protected
            - add_modifier:
                target: protected
                modifier: CannotBeReturnedToHand
                value: 1
                expiry: end_of_opponents_turn
            - add_modifier:
                target: protected
                modifier: CannotBeReturnedToDeck
                value: 1
                expiry: end_of_opponents_turn
            - add_modifier:
                target: protected
                modifier: CannotBeDeDigivolved
                value: 1
                expiry: end_of_opponents_turn

  # ─── [WD][WA][OPT] trash Appmon/TM source from own Digimon → De-Digivolve 1 ─
  - when: [when_digivolving, when_attacking]
    once_per_turn: true
    optional: true
    # DCGO CanActivateConditionAtkShared: some own Digimon's digivolution
    # cards hold an [Appmon]/[Three Musketeers] card. (`source_count`'s nested
    # filter is card-leaf-only — no combinators — so the OR is two legs.)
    condition:
      any_of:
        - any_permanent:
            of: you
            zone: [battle_area]
            kind: digimon
            source_count:
              filter: { trait_has: Appmon }
              at_least: 1
        - any_permanent:
            of: you
            zone: [battle_area]
            kind: digimon
            source_count:
              filter: { trait_has: "Three Musketeers" }
              at_least: 1
    summary: "[When Digivolving][When Attacking][OPT] By trashing 1 [Appmon] or [Three Musketeers] card from your Digimon's digivolution cards, <De-Digivolve 1> 1 of your opponent's Digimon"
    process:
      - select_union_zone:
          of: you
          zones: [material]
          filter:
            any_of:
              - trait_has: Appmon
              - trait_has: "Three Musketeers"
          bind_as: fodder
          prompt: "Trash 1 card with the [Appmon] or [Three Musketeers] trait from your Digimon's digivolution cards"
      - trash_union_bound:
          binding: fodder
      - select_opponent_permanent:
          bind_as: dd_target
          filter: { kind: digimon }
          prompt: "<De-Digivolve 1> 1 of your opponent's Digimon"
      - de_digivolve:
          target: dd_target
          amount: 1
          stop_at_level: 3

  # ─── [When Linking] delete 1 opp level 4 or lower Digimon ─────────────────
  - scope: linked
    when: when_linked
    summary: "[When Linking] Delete 1 of your opponent's level 4 or lower Digimon"
    process:
      - select_opponent_permanent:
          bind_as: link_target
          filter:
            all_of:
              - kind: digimon
              - level_lte: 4
          prompt: "Delete 1 of your opponent's level 4 or lower Digimon"
      - delete_permanent: { target: link_target }
