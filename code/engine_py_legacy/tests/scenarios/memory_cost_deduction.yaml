name: "Memory Cost Deduction: playing a card deducts correct memory"
description: |
  Start with 10 memory and play EX9-024 (Hanimon, play cost 3).
  Verify memory is exactly 7 after playing (10 - 3 = 7).

setup:
  deck1_archetype: "Puppets"
  deck2_archetype: "Puppets"
  memory: 10
  first_player: 1
  starting_hand1: ["EX9-024"]

actions:
  - find: "Play Hanimon from hand"
    expect_memory_change: -3
  - auto_resolve: true

assertions:
  - memory_exact: 7
  - not_game_over: true
