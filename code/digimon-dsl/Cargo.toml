[package]
name = "digimon-dsl"
version = "0.1.0"
edition = "2021"
description = "Declarative YAML card-scripting DSL for the Digimon TCG engine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
schemars = { version = "0.8", features = ["indexmap2"] }
thiserror = "1"
indexmap = { version = "2", features = ["serde"] }
bincode = "1.3"
