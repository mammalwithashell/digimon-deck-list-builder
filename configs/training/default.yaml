# Canonical pilot-training hyperparameter set.
# Override individual fields via --set key=value at the CLI.

algorithm: mlp
timesteps: 500000
seed: 0
n_envs: 1
learning_rate: 3.0e-4
n_steps: 2048
batch_size: 64
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

lstm_hidden_size: 256

opponent: greedy
opponent_pool_manifest: null
opponent_pool_mode: pfsp

deck_pool_variants: false
gauntlet_path: null

eval_freq: 25000
eval_episodes: 50
eval_suite: configs/training/eval_suite.yaml

checkpoint_every: 50000
keep_last_checkpoints: 3
resume_from: null

models_dir: models
tensorboard_log: runs/pilot_ppo
run_name: null
