[project]
name = "digimon-gym"
version = "0.1.0"
description = "Reinforcement learning environment for Digimon Trading Card Game"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
    "torch>=2.0",
    "fastapi>=0.100",
    "httpx>=0.24",
    "uvicorn>=0.20",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pypdf>=4.2",
]

[project.optional-dependencies]
train = [
    "stable-baselines3>=2.0",
    "sb3-contrib>=2.0",
]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/test_rl_gym.py --ignore=tests/ai_pipeline --ignore=engine_py_legacy -v"
norecursedirs = ["engine_py_legacy"]
asyncio_mode = "auto"
markers = [
    "ai_pipeline: AI pipeline tests (digimon_gym.ai.* and DB deps)",
    "behavioral: Behavioral tests using DebugRunner with real card effects",
    "scenario: YAML scenario-based tests",
    "slow: Tests that take >10s (greedy baselines)",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
