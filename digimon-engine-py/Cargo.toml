[package]
name = "digimon-engine-py"
version = "0.1.0"
edition = "2021"
description = "PyO3 bindings for the Rust digimon-engine"

[lib]
name = "digimon_engine"
crate-type = ["cdylib"]

[dependencies]
digimon-engine = { path = "../digimon-engine" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
numpy = "0.22"
serde_json = "1"
