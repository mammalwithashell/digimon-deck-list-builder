# Exam scenario: Violet Inboots (BT18-093), clause BT18-093#effect#2 --
# "[Security] Play this card without paying the cost."
#
# THE SECURITY-TRIGGER SKELETON: the card under exam sits at p0's stack[9] --
# the TOP of the security stack (stack[5..9] is the pile, reversed; see
# docs/DCGO_EXAM.md "What each stack position becomes") -- and p1's Biyomon
# (ST1-02, played on T2, off summoning sickness by T4) attacks the player on
# T4. The check flips Violet Inboots and the [Security] plays her onto the
# DEFENDER's field (DCGO `PlaySelfTamerSecurityEffect`, mandatory, no prompt;
# ours `play_from_security`). A Tamer has no DP, so no battle follows and
# Biyomon survives, suspended. Violet Inboots has no [On Play], so nothing
# else opens; her two triggers are [Start of Your Turn] / [Start of Your Main
# Phase] and the line ends before p0's next turn.
#
# THE WITNESS: the Tamer stands on p0's field with p0's security at 4 and
# p0's trash EMPTY (a flipped Tamer that was NOT played would be in the trash
# instead).
#
# Book: qa/dcgo-exams/BT18/tm_bt18_093_pool.json (--decks). p0's deck is Violet
# Inboots BT18-093 x4 + Shadow Wing ST1-13 x4 (a red Option, the [Start of
# Your Main Phase] fodder) over the quiet ST-1 filler; p1 is the quiet ST-1
# opponent.
card: BT18-093
clause: BT18-093#effect#2
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4): inert filler
      - ST1-04
      - ST1-04
      - BT1-009
      - ST1-05
      - BT1-014
      # security (5-9): stack[9] is the TOP -- the Tamer under exam
      - BT1-014
      - BT4-014
      - BT4-014
      - ST1-10
      - BT18-093
      # (10+): p0's T3 turn draw
      - BT4-010
    rest: tm-inboots
  p1:
    stack:
      # hand (0-4): the Biyomon, inert filler
      - ST1-02
      - ST1-03
      - ST1-04
      - BT1-009
      - BT3-007
      # security (5-9): stack[9] is the TOP
      - ST1-05
      - BT1-014
      - BT4-010
      - ST1-04
      - ST1-02
      # (10+): p1's turn draws, in order
      - BT4-014
      - ST1-08
      - ST1-10
      - BT1-014
    rest: quiet-opponent
steps:
  # T1 (p0, memory 0): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (p1, memory 3): play Biyomon (3 -> 1), pass out.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (p0, memory 3): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (p1, memory 3): Biyomon attacks the player. THE CLAUSE flips and plays
  # the Tamer with no prompt on either side.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  # One step past the clause: attacking spent no memory, p1 keeps the turn.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 9
    that:
      turn: 4
      p0.memory: -3
      p0.security: 4
      p0.trash: []
      p0.field:
        - { card_id: BT18-093, dp: -1, suspended: false, sources: [] }
      p1.field:
        - { card_id: ST1-02, dp: 3000, suspended: true, sources: [] }
      p1.security: 5
