# Exam scenario: Imperialdramon: Fighter Mode (BT20-020), clause
# BT20-020#effect#1 -- <Raid>.
#
# "When this Digimon attacks, you may switch the target of attack to 1 of your
#  opponent's unsuspended Digimon with the highest DP" (16-22, Optional).
#
# THE WITNESS. The attack is declared on the PLAYER; p1's only Digimon,
# Biyomon (ST1-02), is unsuspended and so cannot be attacked directly. Biyomon
# leaving the board for the trash off that attack is therefore proof the
# <Raid> switch happened. (Security also falls by one -- that is <Piercing>,
# measured on its own in BT20-020-effect2.yaml over this same line.)
#
# NOTHING ELSE STACKS ON THE ATTACK. Fighter Mode has no [When Attacking];
# Dragon Mode BT20-076's inherited text is only Ace Overflow (a leave-area
# rider), so DCGO has a single trigger at attack declaration and opens no
# MultipleSkills order prompt -- unlike the BT24-017 Raid line, whose Tokomon
# egg forced one.
#
# THE LINE reuses BT20-020-effect0.yaml's prefix (Dragon Mode hard-played on
# T3, Fighter Mode digivolved for 2 on T5), idles a round, and attacks on T7.
#
# Book: qa/dcgo-exams/BT20/tm_bt20_020_pool.json (--decks). p0's deck is
# Fighter Mode x4 + Dragon Mode BT20-076 x4 over the quiet ST-1 filler; p1 is
# the quiet ST-1 opponent.
card: BT20-020
clause: BT20-020#effect#1
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4): Dragon Mode (hard-played), Fighter Mode, inert filler
      - BT20-076
      - BT20-020
      - ST1-04
      - ST1-04
      - BT1-009
      # security (5-9): stack[9] is the TOP
      - BT1-014
      - BT1-014
      - BT4-014
      - BT4-014
      - ST1-10
      # (10+): p0's turn draws, in order
      - BT4-010
      - BT4-010
      - BT3-007
      - BT3-007
    rest: tm-imperialdramon
  p1:
    stack:
      # hand (0-4): the Biyomon that gets Raided, inert filler. stack[9] is trashed on T5, stack[8] flipped by <Piercing>
      - ST1-02
      - ST1-03
      - ST1-04
      - BT1-009
      - BT3-007
      # security (5-9): stack[9] is the TOP
      - ST1-05
      - BT1-014
      - BT4-010
      - ST1-04
      - ST1-02
      # (10+): p1's turn draws, in order
      - BT4-014
      - ST1-08
      - ST1-10
      - BT1-014
    rest: quiet-opponent
steps:
  # T1 (p0, memory 0): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (p1, memory 3): all-pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (p0, memory 3): hard-play Imperialdramon: Dragon Mode (BT20-076) for 7
  # (3 -> -5). Its [On Play] "delete 1 of your opponent's Digimon with 11000 DP
  # or less" has no target on p1's empty board (BT20_076.cs guards the pick with
  # HasMatchConditionPermanent; ours with `if: any_permanent`), and the "if DNA
  # digivolving" rider is off for a hard play. Silent.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT20-076, from: hand } }
    expect: { prompt: main_phase }
  # T4 (p1, memory 5): all-pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (p0, memory 3): digivolve Fighter Mode onto Dragon Mode for 2 (3 -> 1)
  # via "[Digivolve] [Imperialdramon: Dragon Mode]: Cost 2". The printed Red /
  # Purple Lv.5 circles do not apply to a Lv.6 source, so this is the only
  # legal path -- one cost, no cost-choice prompt. [When Digivolving] then
  # installs the can't-play-by-effect gate on p1 and, because Dragon Mode is in
  # the digivolution cards, trashes p1's top security card.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT20-020 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T6 (p1, memory 3): play Biyomon for 2 (3 -> 1), pass out. Played AFTER
  # Fighter Mode's [When Digivolving] trash, so the [All Turns] observer
  # (#effect#4) had no target then.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T7 (p0, memory 3): Fighter Mode attacks the PLAYER; <Raid> opens on
  # declaration (16-22-2).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  # THE FOLD: DCGO asks OptionalSkill (Raid's `isOptional: true`) then the
  # SelectPermanentEffect target pick (RaidProcess, canNoSelect: true, always
  # asked even with one candidate); ours surfaces ONE declinable pick that is
  # gate and target at once. `expect: OptionalSkill` over the live pick is the
  # declared fold marker. Biyomon is p1's only unsuspended Digimon, so it is the
  # highest-DP candidate.
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: OptionalSkill }
  # One step past the clause. The battle (13000 vs 3000) deleted Biyomon, and
  # <Piercing> then checked security: p1's stack[8] (Dracomon ST1-04, 4000 DP)
  # lost the battle. The [All Turns] observer fired on that second removal too,
  # with no Digimon left on p1's board to delete.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 17
    that:
      turn: 7
      p0.memory: 3
      p1.security: 3
      p1.field: []
      p1.trash: [ST1-02, ST1-02, ST1-04]
      p0.field:
        - card_id: BT20-020
          dp: 13000
          suspended: true
          sources: [BT20-076]
