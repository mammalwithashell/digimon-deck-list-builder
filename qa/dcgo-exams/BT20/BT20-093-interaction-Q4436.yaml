# qa:Q4436 (2025-01-24) -- "If I use this card's [Delay] to DNA digivolve using 2 Digimon including one
# that would leave the battle area, does the DNA digivolved Digimon leave the battle area?" -> "No, it
# doesn't leave the battle area. DNA digivolution results in a digivolution into a new Digimon that is
# considered a different Digimon from the one that would leave the battle area."
# P0 fields Dracomon BT20-007, places Unleash the Dragon Gene BT20-093 as a Delay Option (its [Main]
# plays Wingdramon BT20-025 for 3 less), then plays Groundramon BT20-042 (its [On Play] needs P1's
# WarGreymon ST1-11 as a target). On P1's turn 4 Gaia Force ST1-16 targets WINGDRAMON: it "would leave
# the battle area other than in battle", P0 activates the Delay, and DNA digivolves Groundramon +
# WINGDRAMON (the would-leave Digimon itself) into Examon BT20-045 from hand. The final row (step 21)
# shows Examon on P0's field with sources [BT20-025, BT20-042]: the new Digimon did not leave.
# Representational rows (engine vs DCGO prompt classes for the SAME three decisions; the end state
# compares): our Delay field-pair DNA lowers to EffectChoice prompts labelled by CARD NAME in three
# stages -- result, first material, second material (lower_replacement.rs DelayFieldDnaDigivolveFlow /
# install_delay_field_dna_stage, EffectChoiceEntry.label = card_name) -- authored as `choice:` rows,
# which are sim-only by construction. DCGO (DNADigivolveEffects.cs DNADigivolvePermanentsIntoHandOrTrashCard)
# asks a SelectHandEffect for the Examon result ("Select 1 card to DNA digivolve.") and then the
# SelectJogressEffect material picks, answered here by identity as dcgo_only rows in DCGO's recipe
# order (Groundramon, then Wingdramon). Same choreography as the oracle-confirmed
# BT20-093-effect1-repair.yaml (backfilled through step 21).
# Step 5: P0 declines Dracomon BT20-007's [Start of Your Main Phase] optional trash-and-draw cost.
# Step 14: the Delay replacement window (DCGO OptionalSkill; our Replacement prompt, 1:1).
# Draft: sim-only legality is not oracle confirmation. expect_ruling is authored later.
