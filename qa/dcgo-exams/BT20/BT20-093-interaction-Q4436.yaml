    stack: [ST1-11, ST1-16, BT1-090, BT1-090, BT3-093, ST1-03, ST1-03, ST1-03, ST1-03, ST2-03, BT3-093, BT3-093, ST1-02, ST1-02, ST2-04, ST2-04]
    rest: BT20-093-effect1-repair-p1
