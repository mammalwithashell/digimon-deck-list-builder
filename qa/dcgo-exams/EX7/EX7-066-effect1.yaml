# Exam scenario: Chaos Triangular (EX7-066), clause EX7-066#effect#1 --
# "[Main] Delete 1 of your opponent's Digimon with 9000 DP or less. For each
#  of your [Three Musketeers] trait Digimon with different names, add 3000 to
#  this DP-deletion effect's maximum. Then, place this card as the bottom
#  digivolution card of 1 of your [Three Musketeers] trait Digimon."
#
# THE LINE exercises the SCALING half on purpose: the only opponent Digimon
# is Phoenixmon ST1-10 (12000 DP, vanilla), which is deletable ONLY because
# P0 controls one [Three Musketeers] trait Digimon (BeelStarmon (X Antibody)
# EX7-073: 9000 + 3000 x 1 = 12000). An engine that ignores the scaling has
# no legal target, skips the pick, and desynchronises at the delete row --
# which is the finding this line is built to surface. EX7-066 is a RED Option
# and BeelStarmon (X) is PURPLE: the use is legal only through clause
# effect#0's "While you have a [Three Musketeers] trait Digimon, you may
# ignore this card's color requirements" (EX7_066.cs IgnoreColorConditionClass,
# EqualsTraits on a battle-area Digimon), exercised implicitly here.
#
#   T1 (P0): pass everything.
#   T2 (P1): pass everything.
#   T3 (P0, memory 3): play BeelStarmon (X Antibody) EX7-073 (12: 3 -> -9).
#            No [On Play]; its effects are [When Digivolving] / [When
#            Attacking] only, so nothing fires.
#   T4 (P1, memory 9): play Phoenixmon ST1-10 (10: 9 -> -1, turn over).
#   T5 (P0, memory 1): draw EX7-066 (stack[11]); use it (6: 1 -> -5). THE
#            CLAUSE: pick Phoenixmon (deleted), then pick BeelStarmon (X) to
#            receive EX7-066 as its bottom digivolution card. Memory -5: the
#            turn passes once the Option has resolved.
#   T6 (P1, memory 5): the trailing step.
#
# REPAIRED 2026-09-18. The crashed draft hosted the line on BeelStarmon
# BT25-085 played from hand. BT25-085 is a DUAL card whose Digimon face
# "can't play to the field" (data fix 20df249e6; ../BT25/NOTES-BT25-083.md),
# so `play: BT25-085` no longer lowers as a Digimon play. EX7-073 is the only
# other [Three Musketeers]-TRAIT Digimon in the book that can be hard-played;
# the memory arithmetic moved with it (P1 now has 9 to spend on T4, P0 has 1
# on T5) and the stale P0 pass after the Option was dropped (-5 ends the turn).
#
# PROMPT SHAPE (EX7_066.cs, region "Main"): SetUpActivateClass(null, ...,
# -1, false, ...) -- mandatory, no OptionalSkill. Two independent guarded
# picks: SelectPermanentEffect(Mode.Destroy, canNoSelect: false) over
# opponent Digimon with DP <= MaxDP_DeleteEffect(9000 + 3000 x count()),
# then SelectPermanentEffect(Custom, canNoSelect: false) over own
# [Three Musketeers]-trait Digimon -> AddDigivolutionCardsBottom(this card).
# Under the harness both rows are consumed even with a single candidate
# (the AI branch routes through SetTargetFrames -> TryAnswerStep); our engine
# parks both picks too.
card: EX7-066
clause: EX7-066#effect#1
seed: 424242
decks:
  p0:
    # [0..4] hand; [5..9] security (never flipped); [10] T3 draw; [11] T5 draw.
    stack: [EX7-073, BT24-088, BT24-088, BT24-088, BT25-092,
            BT25-082, BT25-082, BT25-082, BT25-082, BT25-058,
            BT25-092, EX7-066]
    rest: tm-chaos-triangular
  p1:
    # [10], [11], [12] = the T2 / T4 / T6 draws.
    stack: [ST1-10, ST1-03, ST1-03, ST1-03, ST1-04,
            ST1-02, ST1-02, ST1-02, ST1-02, ST1-04,
            BT1-009, BT1-009, BT1-009]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, memory 3)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, memory 3): BeelStarmon (X) -- the [Three Musketeers] trait Digimon.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: EX7-073, from: hand } }
    expect: { prompt: main_phase }
  # T4 (P1, memory 9): Phoenixmon, 12000 DP -- above the unscaled 9000 cap.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-10, from: hand } }
    expect: { prompt: main_phase }
  # T5 (P0, memory 1): THE CLAUSE.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: EX7-066, from: hand } }
    expect: { prompt: main_phase }
  # 12000 <= 9000 + 3000 (one differently-named TM Digimon): Phoenixmon.
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # The tuck target: BeelStarmon (X).
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # Memory -5: the seat is P1 (T6).
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  # The delete row: Phoenixmon is OFFERED (the scaling) and still standing.
  - at: 10
    that:
      turn: 5
      p0.memory: -5
      p1.field:
        - { card_id: ST1-10, dp: 12000, suspended: false, sources: [] }
  - at: 12
    that:
      turn: 6
      p0.memory: -5
      p0.security: 5
      p1.security: 5
      p1.trash: [ST1-10]
      p0.trash: []
      p0.hand: [BT24-088, BT24-088, BT24-088, BT25-092, BT25-092]
      p0.field:
        - { card_id: EX7-073, dp: 12000, suspended: false, sources: [EX7-066] }
      p1.field: []
