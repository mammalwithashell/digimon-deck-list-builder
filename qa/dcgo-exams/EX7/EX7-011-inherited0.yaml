# Exam scenario: Megadramon (EX7-011), clause EX7-011#inherited#0 -- inherited
# <Piercing> "(When this Digimon attacks and deletes your opponent's Digimon
# in battle, it checks security before the attack ends.)" -- Mandatory
# (docs/digimon-rules/keyword-semantics.md, 16-6). DCGO: PierceSelfEffect(
# isInheritedEffect: true) at OnDetermineDoSecurityCheck in EX7_011.cs -- no
# prompt in either engine.
#
# THE LINE. Megadramon must be a DIGIVOLUTION CARD, so P0 hard-plays it on T3
# and digivolves it into BeelStarmon ACE (EX7-059) on T5 -- Megadramon prints
# "[Three Musketeers]" so the ACE's "Lv.5 w/[Three Musketeers] in text: Cost
# 3" line applies (its Purple Lv.5 circle does not: Megadramon is Red), one
# distinct cost, no cost prompt. The ACE's [When Digivolving] is inert:
# "Return 1 Option card from your trash" finds no Option (the trash holds
# only the security Digimon P1's attack trashed) and "you may use 1 [Three
# Musketeers] trait Option from your hand" finds no candidate, and
# EX7_059.cs wraps each half in its own candidate check. Its [When
# Attacking] is gated on an Option among its own digivolution cards -- there
# is none.
#
# Biyomon (ST1-02) attacked P0's security on T4 and is SUSPENDED on T5. The
# ACE (11000) attacks it and deletes it in battle; THE CLAUSE then checks one
# security card (Biyomon #2 at 3000, silently lost). P1's security 5 -> 4
# with the attack having been declared at a Digimon is the witness.
#
# THE ACE STAYS OUT OF P0'S HAND UNTIL T5. EX7-059 prints [Hand] [Counter]
# <Blast Digivolve>: held in hand while P1's Biyomon attacks on T4, with a
# Lv.5 [Three Musketeers]-text Digimon on P0's field, it would open the
# counter window (OptionalSkill on DCGO; a CounterTiming park on ours) and
# drag a different clause's prompt surface into this line. It is the T5
# draw (stack[11]).
#
#   T1 (P0, 0): pass.        T2 (P1, 3): play Biyomon (3 -> 1), pass.
#   T3 (P0, 3): Megadramon (7 -> -4). No prompt: no TM Option in hand/trash.
#   T4 (P1, 4): Biyomon attacks security (Sparrowmon EX7-051, 1000 DP, to
#               P0's trash -- no [Security] effect, inherited text inert).
#               Pass.
#   T5 (P0, 3): draw the ACE; digivolve Megadramon into it (3 -> 0); attack
#               the suspended Biyomon. THE CLAUSE: <Piercing> checks 1
#               security. Memory 0: the trailing step is P0's pass.
#
# Book: qa/dcgo-exams/EX7/tm_ex7_011_pool.json (--decks).
card: EX7-011
clause: EX7-011#inherited#0
seed: 424242
decks:
  p0:
    # stack[9] = Sparrowmon (the security card P1's T4 attack trashes).
    # Draws: T3 (ToyAgumon), T5 (the ACE), then the digivolution draw.
    stack: [EX7-011, ST1-02, EX7-008, BT25-082, EX7-010,
            BT25-078, BT25-078, EX7-008, EX7-051, EX7-051,
            EX7-008, EX7-059, ST1-02]
    rest: tm-megadramon
  p1:
    # stack[9] = Biyomon: the card <Piercing> checks.
    stack: [ST1-02, ST1-03, ST1-04, BT1-009, BT3-007,
            ST1-03, ST1-04, BT1-009, ST1-02, ST1-02,
            ST1-05, ST1-05]
    rest: tm-red-opponent-011
steps:
  # T1 (P0, 0)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, 3): Biyomon.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, 3): Megadramon (7 -> -4).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: EX7-011, from: hand } }
    expect: { prompt: main_phase }
  # T4 (P1, 4): Biyomon attacks P0's security and stays suspended.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, 3): BeelStarmon ACE over Megadramon for 3 (3 -> 0).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: EX7-059 } }
    expect: { prompt: main_phase }
  # THE CLAUSE: attack the suspended Biyomon; the battle deletes it and the
  # inherited <Piercing> checks 1 security card.
  - actor: 0
    do: { attack: { attacker: field.0, target: field.0 } }
    expect: { prompt: main_phase }
  # One step past the clause (memory 0: still P0's turn).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 13
    that:
      turn: 5
      p0.memory: 0
      p0.security: 4
      p0.trash: [EX7-051]
      p0.field:
        - { card_id: EX7-059, dp: 11000, suspended: true, sources: [EX7-011] }
      p1.field: []
      p1.trash: [ST1-02, ST1-02]
      p1.security: 4
