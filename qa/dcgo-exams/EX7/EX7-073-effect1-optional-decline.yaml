    # Musketeers] in text), this line digivolves into EX7-073 instead, and an
    # unused copy left in hand would be a second candidate of THE CLAUSE's own
    # `IsOption && HasText("Three Musketeers")` hand scan on whichever engine
    # counts a dual card as an Option -- not a question this line should have
    # to answer. P-180 is the ONLY Option-faced card P0 ever holds.
