    # never attacks); stack[10..] = draws in order. EVERY digivolution draws a
    # card, so the draw budget is: T3 turn draw, T3 Sparrowmon draw, T5 turn
    # draw, T5 BlackGatomon draw, T5 grant-digivolve draw, T7 turn draw, ...
    # NO BeelStarmon BT25-085 anywhere in this stack (the prefix's stack[3] and
