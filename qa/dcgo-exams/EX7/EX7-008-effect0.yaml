# Exam scenario: ToyAgumon (EX7-008), clause EX7-008#effect#0 --
# "[Digivolve] Lv.2 w/[Three Musketeers] in text: Cost 0"
#
# The printed alt-circle, measured as LEGALITY: ToyAgumon is RED and its
# standard circle is "Red Lv.2 / cost 0", so digivolving it onto a BLACK Lv.2
# is legal on either engine only through the clause under exam.
#
# WHY KAPURIMON (EX7-005) IS THE EGG, AND WHY THIS FILE NEEDS ITS OWN BOOK.
# The printed alt-circle "Lv.2 w/[Three Musketeers] in text: Cost 0" costs
# exactly what the standard circle costs, so a base that satisfies BOTH is
# indistinguishable (no cost prompt on either engine, same memory). Only two
# Lv.2 cards in the whole pool print "[Three Musketeers]" -- Kapurimon EX7-005
# and Pagumon BT25-005 -- and both are BLACK, which is the point: a RED ToyAgumon
# can reach a black Lv.2 ONLY through the clause under exam. DCGO's
# AddSelfDigivolutionRequirementStaticEffect for this circle passes no
# `cardColor`, so its GetEvoCost applies no colour check (the
# `ignoreDigivolutionRequirement: false` argument only means the circle does
# not need a "may ignore requirements" grant); our alt_path likewise carries
# no `color_is`. Kapurimon's own text ([Your Turn][Once Per Turn] gain 1
# memory when an effect places a [Three Musketeers] Option under it) never
# fires on this line -- nothing is placed under it -- and it has no [On
# Deletion], unlike the shared book's Pagumon ST6-01. Kapurimon is implemented
# on both sides (code/digimon-engine/cards/ex7/EX7-005.yaml, landed 61fc7c7d9;
# DCGO EX7/Black/EX7_005.cs), and neither fires its trigger on a digivolution:
# DCGO's OnAddDigivolutionCards needs a placing cardEffect, and our
# `on_add_digivolution_cards` deliberately does not fire from normal
# digivolution. Book: qa/dcgo-exams/EX7/tm_ex7_008_pool.json.
#
#   T1 (P0): hatch Kapurimon.        T2 (P1): pass.
#   T3 (P0): THE CLAUSE -- ToyAgumon onto Kapurimon in the breeding area for 0
#            (draw 1; [On Play] does not fire on a digivolve).
#   T4 (P1): pass.
#   T5 (P0, 3): promote the stack, then pass. ToyAgumon is the TOP card, so its
#            own inherited "[Your Turn] +2000 DP" does NOT apply: printed 1000.
#
# PROMPT SHAPE: none. Both engines see exactly one open circle (cost 0), so
# there is no cost prompt; ToyAgumon has no [When Digivolving].
clause: EX7-008#effect#0
card: EX7-008
seed: 424242
decks:
  p0:
    # stack[0..4] = opening hand; stack[5..9] = security (never flipped: P1
    # never attacks); stack[10..] = draws: T3 turn draw, T3 digivolve draw,
    # T5 turn draw.
    stack: [EX7-008, BT21-071, BT24-088, BT24-088, BT24-088,
            BT25-082, BT25-082, BT25-082, BT25-082, BT25-058,
            BT25-092, BT25-092, EX7-051]
    rest: tm-kapurimon-egg
  p1:
    stack: [ST1-03, ST1-04, ST1-04, BT1-009, BT3-007,
            ST1-02, ST1-02, ST1-04, ST1-02, ST1-02,
            BT3-007, BT3-007]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0): hatch Kapurimon.
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1): nothing.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, 3): THE CLAUSE -- breeding-digivolve EX7-008 onto the BLACK
  # Kapurimon for 0 (draw 1). No breeding-action step this turn: the breeding
  # area holds a Lv.2 (cannot be moved) and is occupied (cannot hatch), so
  # neither engine asks (the BT21-071-effect0 / BT21-029 shape).
  - actor: 0
    do: { digivolve: { from: breeding, using: EX7-008 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1): nothing.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, 3): promote, so the digivolved stack is visible on the battle area
  # (the projection dumps the battle area, not the breeding area).
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  # One step past the clause: P0 still holds memory 3.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 9
    that:
      turn: 5
      p0.memory: 3
      p0.trash: []
      p0.hand: [BT21-071, BT24-088, BT24-088, BT24-088, BT25-092, BT25-092, EX7-051]
      p0.field:
        - { card_id: EX7-008, dp: 1000, suspended: false, sources: [EX7-005] }
      p1.field: []
