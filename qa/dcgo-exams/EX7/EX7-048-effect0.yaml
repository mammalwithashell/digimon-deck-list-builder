# Exam scenario: Gundramon (EX7-048), clause EX7-048#effect#0 -- the special
# digivolution condition "[Digivolve] Lv.5 w/[Three Musketeers] in text:
# Cost 4".
#
# WHY MEGADRAMON. Gundramon's printed circle is Black Lv.5 / 4 -- the SAME
# cost as the special line -- so a black Lv.5 base cannot separate the two.
# Megadramon (EX7-011) is a RED Lv.5 whose printed effect text names [Three
# Musketeers]: the black circle fails on colour and the ONLY legal route is
# the clause under exam. One open route: no cost prompt on either engine.
# The witness is DCGO accepting the digivolve at all (an illegal action
# aborts the job as a finding) plus the projected state: Gundramon over
# Megadramon, memory 3 -> -1.
#
# THE [When Digivolving] REVEAL CANNOT BE AVOIDED (it is mandatory and
# unconditional -- EX7_048.cs ActivateClassesForSharedEffects(optional:
# false)), so it is kept as SMALL as it can be: the six revealed cards
# (stack[13..18]: the T3 / T5 / digivolution draws are stack[10..12]) hold NO
# [Three Musketeers] trait Option, so the "you may use" pick is never asked
# (RevealLibrary.cs: `maxCount = Math.Min(1, revealed.Count(cond))` = 0 ->
# the SelectCardEffect is skipped; ours: `select_reveal_buckets` with no
# candidate parks nothing). What is left is "Return the rest to the top or
# bottom of the deck". The use arm is EX7-048-effect2.yaml.
#
#   T1 (P0, 0): pass.            T2 (P1, 3): pass.
#   T3 (P0, 3): play Megadramon (7: 3 -> -4). No prompt (no TM Option held).
#   T4 (P1, 4): pass.
#   T5 (P0, 3): THE CLAUSE -- Gundramon over Megadramon for 4 (3 -> -1, draw
#               1); the reveal; all six to the deck BOTTOM. Memory -1 hands
#               the turn over.
#   T6 (P1, 1): breeding decision -- the trailing step.
#
# PROMPT SHAPE.
#  * EX7_048.cs "Alternate Digivolution":
#    AddSelfDigivolutionRequirementStaticEffect(TopCard.HasText("Three
#    Musketeers"), digivolutionCost: 4, ignoreDigivolutionRequirement: false,
#    level: 5) -- no cardColor, so no colour check.
#  * RemainingCardsPlace.DeckTopOrBottom (RevealLibrary.cs
#    ReturnRevealedCardsToLibraryTopOrBottom): a generic_bool ("Deck Top" =
#    true / "Deck Bottom" = false) via UserSelectionManager.SetBoolSelection,
#    then, with 2+ cards, ONE ordering SelectCardEffect over the remainder
#    (maxCount = all six, canNoSelect false). Ours asks the same question as
#    an EffectChoice named by LABEL (`choice:` is sim-only by construction)
#    and then orders the remainder position by position (OrderedPermutation
#    -- N picks against DCGO's one). So: `choice:` sim-only + `decline:`
#    DCGO-only (select_bool false = "Deck Bottom" -- the confirmed
#    BT25-078-effect1.yaml idiom), then the ordering as one sim-only row and
#    one DCGO-only row. Deck order is not in the projection and the line ends
#    before anything is drawn from it.
#
# Book: qa/dcgo-exams/EX7/tm_ex7_048_pool.json (--decks).
card: EX7-048
clause: EX7-048#effect#0
seed: 424242
decks:
  p0:
    # stack[0..4] hand, stack[5..9] security (never flipped), stack[10..12]
    # draws (T3, T5, digivolution), stack[13..18] THE REVEALED SIX -- all
    # Digimon, no Option. No Option ever reaches P0's hand or trash.
    stack: [EX7-011, EX7-048, ST1-02, EX7-008, BT25-082,
            BT25-078, BT25-078, EX7-008, EX7-051, EX7-051,
            EX7-010, EX7-010, ST1-02,
            BT25-083, BT25-083, BT25-082, BT25-082, EX7-051, EX7-008]
    rest: tm-gundramon
  p1:
    stack: [ST1-02, ST1-03, ST1-04, BT1-009, BT3-007,
            ST1-03, ST1-04, BT1-009, ST1-02, ST1-02,
            ST1-05, ST1-05]
    rest: tm-red-opponent-048
steps:
  # T1 (P0, 0)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, 3)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, 3): Megadramon (7: 3 -> -4).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: EX7-011, from: hand } }
    expect: { prompt: main_phase }
  # T4 (P1, 4)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, 3): THE CLAUSE -- the BLACK Gundramon over the RED Megadramon.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: EX7-048 } }
    expect: { prompt: main_phase }
  # [When Digivolving]: no candidate among the six -> no "use" pick. The
  # remainder goes to the BOTTOM. Ours by label (sim-only); DCGO's
  # generic_bool false (wire-only).
  - actor: 0
    do: { select: { choice: "Bottom of deck", sim_only: true } }
  - actor: 0
    do: { select: { decline: true, dcgo_only: true } }
    expect: { prompt: generic_bool }
  # The remainder's order. Ours: one position at a time. DCGO: one row.
  - actor: 0
    do: { select: { cards: [BT25-083, BT25-083, BT25-082, BT25-082, EX7-051, EX7-008], sim_only: true } }
  - actor: 0
    do: { select: { cards: [BT25-083, BT25-083, BT25-082, BT25-082, EX7-051, EX7-008], dcgo_only: true } }
    expect: { prompt: SelectCardEffect }
  # T6 (P1, 1): one step past the clause.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 14
    that:
      turn: 6
      p0.memory: -1
      p0.field:
        - { card_id: EX7-048, dp: 12000, suspended: false, sources: [EX7-011] }
      p0.hand: [BT25-082, EX7-008, EX7-010, EX7-010, ST1-02, ST1-02]
      p0.trash: []
      p1.field: []
