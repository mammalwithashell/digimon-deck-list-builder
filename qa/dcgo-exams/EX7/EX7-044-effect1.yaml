# Exam scenario: Gigadramon (EX7-044), clause EX7-044#effect#1 --
# "[On Play] [When Digivolving] Reveal the top 4 cards of your deck. Place 1
#  Option card with the [Three Musketeers] trait among them as this
#  Digimon's bottom digivolution card. Return the rest to the top or bottom
#  of the deck. If this effect placed, delete 1 of your opponent's Digimon
#  or Tamers with a play cost of 3 or less."
#
# This file exercises the [On Play] arm (EX7_044.cs registers two identical
# bodies). The revealed four (stack[11..14]; stack[10] is the T3 draw) hold
# exactly ONE [Three Musketeers]-trait Option -- Der Blitz EX7-070 -- beside
# three Digimon, so the placement pick has a single candidate and the
# "if this effect placed" delete fires on P1's Biyomon ST1-02 (play cost 2).
#
#   T1 (P0): pass everything.
#   T2 (P1, 3): play Biyomon (3 -> 1), pass.
#   T3 (P0, 3): play Gigadramon (cost 7: 3 -> -4). THE CLAUSE.
#   T4 (P1): the trailing step.
#
# PROMPT SHAPE (EX7_044.cs "On Play": SetUpActivateClass(..., -1, FALSE,
# ...) -> mandatory, no OptionalSkill).
#   1. SimplifiedRevealDeckTopCardsAndSelect(4, one Custom slot, maxCount 1,
#      canNoSelect false): with a candidate revealed, ONE SelectCardEffect
#      (Root.Library over the revealed cards) -- SHARED with our
#      `select_reveal` (Reveal -> SelectCardEffect, 1:1).
#   2. RemainingCardsPlace.DeckTopOrBottom: a generic_bool ("Deck Top" =
#      true / "Deck Bottom" = false) via UserSelectionManager.SetBoolSelection,
#      then ReturnRevealedCardsToLibraryBottom: with >= 2 cards, ONE ordering
#      SelectCardEffect over the remainder. Our engine asks the same
#      top/bottom question as an EffectChoice (value 0 = top, 1 = bottom)
#      and then orders the remainder position by position (OrderedPermutation
#      -- N picks against DCGO's one), so those rows are split sim_only /
#      dcgo_only (docs/DCGO_EXAM.md "The table": EffectChoice,
#      OrderedPermutation).
#   3. SelectPermanentEffect(Mode.Destroy, canNoSelect: false) over
#      opponent Digimon/Tamers with printed play cost <= 3 -- SHARED.
card: EX7-044
clause: EX7-044#effect#1
seed: 424242
decks:
  p0:
    stack: [EX7-044, BT24-088, BT24-088, BT24-088, BT25-092,
            BT25-082, BT25-082, BT25-082, BT25-082, BT25-058,
            BT25-092, EX7-070, BT21-071, BT21-071, BT21-074]
    rest: tm-gigadramon
  p1:
    stack: [ST1-02, ST1-03, ST1-03, ST1-03, ST1-04,
            ST1-04, ST1-04, ST1-02, ST1-02, ST1-02,
            BT1-009, BT1-009]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, 3): Biyomon -- play cost 2, the delete target.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, 3): THE CLAUSE.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: EX7-044, from: hand } }
    expect: { prompt: main_phase }
  # SHARED: the one [Three Musketeers] Option among the revealed four.
  - actor: 0
    do: { select: { cards: [EX7-070] } }
    expect: { prompt: SelectCardEffect }
  # Remainder to the BOTTOM. Ours: the EffectChoice "Top of deck" / "Bottom
  # of deck", named by LABEL (`choice:`, sim-only by construction -- a
  # `value:` is matched against the label's digits and these labels carry
  # none). DCGO: generic_bool, select_bool false = "Deck Bottom".
  - actor: 0
    do: { select: { choice: "Bottom of deck", sim_only: true } }
  - actor: 0
    do: { select: { decline: true, dcgo_only: true } }
    expect: { prompt: generic_bool }
  # The remainder's order. Ours: one position at a time. DCGO: one row.
  - actor: 0
    do: { select: { cards: [BT21-071], sim_only: true } }
  - actor: 0
    do: { select: { cards: [BT21-071], sim_only: true } }
  - actor: 0
    do: { select: { cards: [BT21-074], sim_only: true } }
  - actor: 0
    do: { select: { cards: [BT21-071, BT21-071, BT21-074], dcgo_only: true } }
    expect: { prompt: SelectCardEffect }
  # SHARED: "If this effect placed" -- delete Biyomon (play cost 2).
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # Memory -4: the seat is P1 (T4).
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 15
    that:
      turn: 4
      p0.memory: -4
      p0.trash: []
      p0.hand: [BT24-088, BT24-088, BT24-088, BT25-092, BT25-092]
      p0.field:
        - { card_id: EX7-044, dp: 7000, suspended: false, sources: [EX7-070] }
      p1.field: []
      p1.trash: [ST1-02]
      p1.security: 5
