# Exam scenario: MagnaKidmon (EX7-013), clause EX7-013#effect#0 --
# "[Digivolve] Lv.5 w/[Three Musketeers] in text: Cost 4"
#
# The printed red circle is "Red Lv.5 / cost 4", so a red base cannot tell
# the two apart. The base must be a NON-red Lv.5 that prints "[Three
# Musketeers]" somewhere in its text: LadyDevimon BT25-083 (PURPLE Lv.5,
# cost 7; its [On Play]/[When Digivolving] names the trait). Only the clause
# under exam makes MagnaKidmon's digivolution onto it legal.
#
# LadyDevimon's [On Play] is kept INERT on both engines: BT25_083.cs gates
# it on a [Three Musketeers]-TRAIT card in hand or trash, and P0's hand
# holds none when she is played (the Tamers carry [TS]; MagnaKidmon -- a
# trait carrier -- is drawn only on T5, stack[11]).
#
#   T1 (P0): pass everything.   T2 (P1): pass everything.
#   T3 (P0, 3): play LadyDevimon (cost 7: 3 -> -4, turn over).
#   T4 (P1, 4): pass everything.
#   T5 (P0, 3): draw MagnaKidmon; THE CLAUSE -- digivolve it onto
#            LadyDevimon for 4 (3 -> -1, draw 1). Its [When Digivolving]
#            (EX7_013.cs: mandatory, SetUpActivateClass(..., -1, false,
#            ...)) then runs with nothing to ask: no [Three Musketeers]-
#            trait Option in hand (the SelectHandEffect is skipped:
#            `HandCards.Count(CanSelectCardCondition) >= 1` is false; our
#            `use_option_from_hand` has no candidate) and the hand is
#            already at 6 after the digivolution draw, so "draw until 6"
#            draws nothing (DCGO `HandCards.Count < 6` false; our
#            max(6 - 6, 0) = 0). Memory -1 hands the turn over.
#   T6 (P1): the trailing step. P1 starts at 1 memory (p0.memory -1): the
#            turn ended by OVERSHOOT, not by a pass, and there is no
#            start-of-turn reset (NOTES-BT25-083.md "The memory-reset rule";
#            re-lowered 2026-09-18 -- the first draft asserted -3).
card: EX7-013
clause: EX7-013#effect#0
seed: 424242
decks:
  p0:
    stack: [BT25-083, BT24-088, BT24-088, BT24-088, BT25-092,
            BT25-082, BT25-082, BT25-082, BT25-082, BT25-058,
            BT25-092, EX7-013, BT25-092]
    rest: tm-magnakidmon
  p1:
    stack: [ST1-03, ST1-03, ST1-03, ST1-04, ST1-04,
            BT1-009, BT1-009, ST1-02, ST1-02, ST1-02,
            ST1-04, ST1-04]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, memory 3)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, memory 3): LadyDevimon -- the purple Lv.5 with the trait in
  # its text. Her [On Play] has no candidate, so nothing is asked.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT25-083, from: hand } }
    expect: { prompt: main_phase }
  # T4 (P1, memory 4)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, memory 3): THE CLAUSE.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: EX7-013 } }
    expect: { prompt: main_phase }
  # T6 (P1): the trailing step (memory -1 ended P0's turn).
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 10
    that:
      turn: 6
      p0.memory: -1
      p0.trash: []
      p0.hand: [BT24-088, BT24-088, BT24-088, BT25-092, BT25-092, BT25-092]
      p0.field:
        - { card_id: EX7-013, dp: 12000, suspended: false, sources: [BT25-083] }
      p1.field: []
