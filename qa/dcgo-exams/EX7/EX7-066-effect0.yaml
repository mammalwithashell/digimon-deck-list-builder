# Exam scenario: Chaos Triangular (EX7-066), clause EX7-066#effect#0 --
# "When effects trash this card from digivolution cards, 1 of your Digimon
#  gets +3000 DP until the end of your opponent's turn. While you have a
#  [Three Musketeers] trait Digimon, you may ignore this card's color
#  requirements."
#
# THE LINE -- a ONE-Digimon board (slot-safe, ../BT25/NOTES-BT25-083.md) and a
# trasher whose effect asks NOTHING after the trash:
#   T1 (P0) / T2 (P1): pass everything.
#   T3 (P0, 3): play Deputymon EX7-010 (6: 3 -> -3). No [On Play].
#   T4 (P1, 3): pass everything.
#   T5 (P0, 3): use Chaos Triangular (6: 3 -> -3). Its [Main] delete has no
#            target (P1's board is empty: EX7_066.cs guards the pick with
#            HasMatchConditionPermanent; ours skips it), then the tuck pick --
#            Deputymon, which carries the [Three Musketeers] TRAIT on P0's
#            turn ("[Your Turn] This Digimon gains the [Three Musketeers]
#            trait": EX7_010.cs ChangeTraitsClass; the grant
#            EX7-010-effect2.yaml measures). Memory -3: turn over.
#   T6 (P1, 3): pass everything.
#   T7 (P0, 3): Deputymon attacks the player. Its [When Attacking] [Once Per
#            Turn] "You may trash any 1 Option card from 1 Digimon's
#            digivolution cards" trashes Chaos Triangular. THE CLAUSE fires:
#            Deputymon gets +3000 DP (6000 -> 9000) BEFORE the security check,
#            and P1's top security card is Vermilimon BT4-014 (8000 DP,
#            vanilla, stack[9]). 9000 beats 8000: Deputymon survives. Without
#            the clause 6000 loses and Deputymon is deleted. P0 passes at 3.
#   T8 (P1): the trailing step -- "until the end of your opponent's turn":
#            Deputymon still reads 9000 on P1's turn.
#
# WHY THIS TRASHER. Our engine resolves a "when effects trash this card from
# digivolution cards" trigger IMMEDIATELY after the trash, mid-effect; DCGO
# stacks it (ITrashDigivolutionCards -> StackSkillInfos) and resolves it after
# the trashing effect finishes (../P/NOTES-P-180.md -- real, logged, not
# fixed). Deputymon's effect has nothing left to do or ask after the trash,
# so both orders give the SAME prompt sequence and the SAME state at every
# row: the line measures this clause, not the engine's trigger timing.
#
# The ignore-colour sentence is NOT exercised here (Deputymon is red, like the
# Option); EX7-066-effect1.yaml uses the red Option with only a PURPLE
# [Three Musketeers] Digimon on the board, which is legal solely through it.
#
# PROMPT SHAPE at T7, re-derived from the C#:
#   * EX7_010.cs "Shared WD / WA": SetUpActivateClass(..., 1, TRUE, ...) ->
#     OptionalSkill (SHARED with our `optional: true` gate); then
#     SelectTrashDigivolutionCards: SelectPermanentEffect over every
#     battle-area Digimon (one here; consumed under the harness; SHARED with
#     our AnyField pick); then SelectCardEffect over the host's digivolution
#     cards filtered IsOption, by identity -- DCGO-ONLY; ours is a
#     single-candidate source pick `cards:` cannot address, answered through
#     the single-accept-id `yes:` path SIM-ONLY (the EX7-010-effect1.yaml
#     idiom, rows copied from that file).
#   * THE CLAUSE (EX7_066.cs "When Trashed from digivolutions"):
#     SetUpActivateClass(..., -1, FALSE, ...) -- mandatory, no OptionalSkill
#     (SetIsOptionEffect(true) only tags it as an Option card's effect);
#     CanActivate = the card is in the trash and P0 has a battle-area Digimon;
#     ONE SelectPermanentEffect(Custom, canNoSelect: false) over own
#     battle-area Digimon -> ChangeDigimonDP(+3000, UntilOpponentTurnEnd).
#     SHARED with our OwnField pick. It is the only stacked trigger -> no
#     MultipleSkills.
#   * The security battle asks nothing (vanilla Vermilimon, no blocker on P1's
#     empty board).
card: EX7-066
clause: EX7-066#effect#0
seed: 424242
decks:
  p0:
    # [0..4] hand; [5..9] security (never flipped); [10], [11], [12] = the
    # T3 / T5 / T7 draws.
    stack: [EX7-010, EX7-066, BT24-088, BT24-088, BT24-088,
            BT25-082, BT25-082, BT25-082, BT25-082, BT25-058,
            BT25-092, BT25-092, BT25-092]
    rest: tm-chaos-triangular
  p1:
    # stack[9] = the TOP security card: Vermilimon, 8000 DP. [10..13] = the
    # T2 / T4 / T6 / T8 draws.
    stack: [ST1-03, ST1-03, ST1-03, ST1-04, ST1-04,
            ST1-02, ST1-02, ST1-02, ST1-02, BT4-014,
            ST1-04, ST1-04, BT1-009, BT1-009]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, memory 3)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, 3): Deputymon (3 -> -3).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: EX7-010, from: hand } }
    expect: { prompt: main_phase }
  # T4 (P1, 3)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, 3): Chaos Triangular's [Main] (3 -> -3). No delete target; the
  # tuck pick is SHARED (one candidate, asked on both sides).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: EX7-066, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # T6 (P1, 3)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T7 (P0, 3): Deputymon attacks the player.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  # Deputymon's [When Attacking]: the optional gate -- SHARED.
  - actor: 0
    do: { select: { yes: true } }
    expect: { prompt: OptionalSkill }
  # The host Digimon -- Deputymon itself. SHARED.
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # The Option to trash. Ours: single-accept-id, sim-only. DCGO: by identity.
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  - actor: 0
    do: { select: { cards: [EX7-066], dcgo_only: true } }
    expect: { prompt: SelectCardEffect }
  # THE CLAUSE: 1 of your Digimon gets +3000 DP -- Deputymon. SHARED.
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # After the security battle (9000 vs Vermilimon 8000): P0 passes at 3.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T8 (P1): the trailing step.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  # The clause's pick row: the Option is in the trash, the boost not yet applied.
  - at: 19
    that:
      turn: 7
      p0.trash: [EX7-066]
      p0.field:
        - { card_id: EX7-010, dp: 6000, suspended: true, sources: [] }
      p1.security: 5
  # After the security battle: Deputymon survived at 9000.
  - at: 20
    that:
      turn: 7
      p0.memory: 3
      p0.field:
        - { card_id: EX7-010, dp: 9000, suspended: true, sources: [] }
      p1.security: 4
      p1.trash: [BT4-014]
  # P1's turn: "until the end of your opponent's turn".
  - at: 21
    that:
      turn: 8
      p0.memory: -3
      p0.trash: [EX7-066]
      p0.hand: [BT24-088, BT24-088, BT24-088, BT25-092, BT25-092, BT25-092]
      p0.field:
        - { card_id: EX7-010, dp: 9000, suspended: true, sources: [] }
      p1.security: 4
      p1.field: []
