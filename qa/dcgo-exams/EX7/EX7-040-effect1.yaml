# Exam scenario: ToyAgumon (EX7-040), clause EX7-040#effect#1 --
# "[On Play] By trashing 1 card with the [Three Musketeers] trait in your
#  hand, <Draw 2>."
#
#   T1 (P0): pass everything.   T2 (P1): pass everything.
#   T3 (P0, memory 3): play ToyAgumon EX7-040 (3 -> 0). THE CLAUSE: the
#            only [Three Musketeers] TRAIT card in hand is Bind Red Trigger
#            P-180 (the Tamers BT24-088 carry the [TS] trait, not this one);
#            trash it, <Draw 2> (Mandatory, keyword-semantics 16-7). Memory
#            is 0, so P0 passes; the trailing step is P1's turn 4.
#
# PROMPT SHAPE (EX7_040.cs, region "On Play"): SetUpActivateClass(...,
# -1, TRUE, ...) with CanActivateCondition = a [Three Musketeers]-trait card
# in hand -> DCGO asks an OptionalSkill yes/no and THEN a
# SelectHandEffect(Mode.Discard, maxCount 1, canNoSelect: true). Our engine
# surfaces ONE declinable hand pick (the clause's `optional: true` rides the
# `select_hand { optional: true, cost: true }` PASS), so the pick row is
# authored with `expect: { prompt: OptionalSkill }` -- the OptionalSkill+pick
# FOLD marker (docs/DCGO_EXAM.md "Surface mappings"): it emits
# OptionalSkill(yes) followed by the SelectHandEffect answer.
card: EX7-040
clause: EX7-040#effect#1
seed: 424242
decks:
  p0:
    stack: [EX7-040, P-180, BT24-088, BT24-088, BT24-088,
            BT25-082, BT25-082, BT25-082, BT25-082, BT25-058,
            BT25-092, BT25-092, BT25-092]
    rest: tm-toyagumon-black
  p1:
    stack: [ST1-03, ST1-03, ST1-03, ST1-04, ST1-04,
            BT1-009, BT1-009, ST1-02, ST1-02, ST1-02,
            ST1-04, ST1-04]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, memory 3)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, memory 3): THE CLAUSE.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: EX7-040, from: hand } }
    expect: { prompt: main_phase }
  # The fold: DCGO's OptionalSkill(yes) + SelectHandEffect; our one pick.
  - actor: 0
    do: { select: { cards: [P-180] } }
    expect: { prompt: OptionalSkill }
  # <Draw 2> asks nothing. Memory 0: pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1): the trailing step.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 8
    that:
      turn: 4
      p0.memory: -3
      p0.trash: [P-180]
      p0.hand: [BT24-088, BT24-088, BT24-088, BT25-092, BT25-092, BT25-092]
      p0.field:
        - { card_id: EX7-040, dp: 1000, suspended: false, sources: [] }
      p1.field: []
