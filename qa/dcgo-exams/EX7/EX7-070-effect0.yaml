# Exam scenario: Der Blitz (EX7-070), clause EX7-070#effect#0 --
# "When effects trash this card from digivolution cards, <De-Digivolve 1> 1 of
#  your opponent's Digimon. While you have a [Three Musketeers] trait Digimon,
#  you may ignore this card's color requirements."
#
# BOTH halves are exercised: the ignore-colour half is what lets a BLACK
# Option be used in a PURPLE deck at T5 (BeelStarmon BT25-085 prints the
# trait); the trigger half is the measurement -- EX7-070 sits under
# BeelStarmon (its own [Main] put it there), LadyDevimon BT25-083's [When
# Attacking] effect trashes it from those digivolution cards, and the trigger
# De-Digivolves P1's Kokatorimon stack (Lv.4 over Biyomon) back to Biyomon.
#
# WHY P1 HAS TWO DIGIMON AND A STACK. EX7-070's [Main] at T5 MUST delete P1's
# lowest-play-cost Digimon (mandatory), so P1 needs a second body to lose --
# Monodramon BT1-009 (cost 2) -- while the Kokatorimon stack (Kokatorimon's
# play cost is 3) survives to be the De-Digivolve target. Kokatorimon BT1-014
# is chosen because it is vanilla: no [When Digivolving] prompt on P1's side.
#
# THE REUSE IS DECLINED ON PURPOSE (same reason as P-180-effect0.yaml): DCGO
# stacks the trigger and gates it on IsExistOnTrash, so re-using EX7-070 from
# the trash would void it. Declining keeps it in the trash.
#
# PREDICTED DIVERGENCE (prompt ORDER + a spurious optional gate on our side;
# see the step comment): the line is authored in our engine's order so it
# lowers; the oracle abort at the trigger row IS the finding.
#
#   T1 (P0): pass.
#   T2 (P1, 3): play Biyomon ST1-02 (3 -> 1), play Monodramon BT1-009 (1 -> -1).
#   T3 (P0, 3): play BeelStarmon (3 -> -3).
#   T4 (P1, 3): digivolve Biyomon into Kokatorimon BT1-014 (3 -> 1), pass.
#   T5 (P0, 3): use EX7-070 (3 -> -3): delete Monodramon (lowest play cost),
#            tuck under BeelStarmon.
#   T6 (P1): pass.
#   T7 (P0, 3): play LadyDevimon (3 -> -4); [On Play] inert.
#   T8 (P1): pass.
#   T9 (P0, 3): LadyDevimon attacks security; [When Attacking] trashes
#            EX7-070; decline the reuse. THE CLAUSE: De-Digivolve 1 on the
#            Kokatorimon stack (Kokatorimon to trash, Biyomon remains). The
#            attack then checks 1 security card (Agumon 2000 vs 7000).
#
# PROMPT SHAPE (EX7_070.cs, region "When Trashed from Digivolution Cards"):
# SetUpActivateClass(..., isOptional: false) -- mandatory, no OptionalSkill;
# one SelectPermanentEffect(Custom, canNoSelect: false) over opponent
# Digimon, then IDegeneration(permanent, 1).
card: EX7-070
clause: EX7-070#effect#0
seed: 424242
decks:
  p0:
    stack: [BT25-085, BT25-083, BT24-088, BT24-088, BT24-088,
            BT25-082, BT25-082, BT25-082, BT25-082, BT25-058,
            BT25-092, EX7-070, BT25-092, EX7-051]
    rest: three-musketeers
  p1:
    stack: [ST1-02, BT1-009, BT1-014, ST1-03, ST1-03,
            ST1-02, ST1-02, ST1-02, ST1-04, ST1-03,
            ST1-04, ST1-04, ST1-04, BT3-007]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, 3): two bodies.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { play: { card: BT1-009, from: hand } }
    expect: { prompt: main_phase }
  # T3 (P0, 3): BeelStarmon.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT25-085, from: hand } }
    expect: { prompt: main_phase }
  # T4 (P1, 3): Kokatorimon over Biyomon -- the future De-Digivolve target.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { digivolve: { from: field.0, using: BT1-014 } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, 3): EX7-070's [Main] (ignore-colour half of the clause).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: EX7-070, from: hand } }
    expect: { prompt: main_phase }
  # Lowest play cost: Monodramon (2) under the Kokatorimon stack (3).
  - actor: 0
    do: { select: { targets: [opp.field.1] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # T6 (P1)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T7 (P0, 3): LadyDevimon.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT25-083, from: hand } }
    expect: { prompt: main_phase }
  # T8 (P1)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T9 (P0, 3): LadyDevimon attacks; [When Attacking] trashes EX7-070.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { attack: { attacker: field.1, target: security } }
    expect: { prompt: main_phase }
  # DCGO: which Digimon's digivolution cards (wire-only).
  # OUR engine parks a yes/no gate here for the effect's `optional: true`
  # (SelectionKind::Replacement); DCGO's ActivateClass is optional: false and
  # asks nothing -- its picks are individually declinable instead. A
  # prompt-EXISTENCE difference (both decision spaces are equivalent), so the
  # gate is answered sim-side only and puts nothing on the wire.
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
    expect: { prompt: OptionalSkill }
  - actor: 0
    do: { select: { cards: [BT25-085], dcgo_only: true } }
    expect: { prompt: SelectPermanentEffect }
  # The Option to trash: EX7-070.
  # OUR union-material pick names the Option directly; its only candidate is
  # EX7-070, and the harness resolves a card identity against a UnionZone prompt
  # by scanning HAND and TRASH only (selection_resolve.rs, the
  # `Hand | UnionZone` arm) -- a digivolution-card candidate cannot be named
  # by `cards:`. So the pick is answered sim-side through the resolver's
  # single-accept-id `yes:` path, and DCGO's own card row rides the wire
  # alone below.
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  - actor: 0
    do: { select: { cards: [EX7-070], dcgo_only: true } }
    expect: { prompt: SelectCardEffect }
  # THE CLAUSE: <De-Digivolve 1> the Kokatorimon stack.
  #
  # TWO PREDICTED FINDINGS SIT HERE (see NOTES-EX7-070.md):
  #  (1) ORDER. Our engine fires EX7-070's trigger IMMEDIATELY after the
  #      trash, mid-way through LadyDevimon's effect; DCGO stacks it
  #      (StackSkillInfos) and asks LadyDevimon's use-from-trash
  #      SelectCardEffect first -- the rules-correct order per
  #      general_rule.pdf 15-8-3-2 (trigger-type effects wait as pending
  #      activation during effect processing).
  #  (2) OPTIONALITY. Our DSL spec marks this clause `optional: true` and
  #      parks a yes/no gate (SelectionKind::Replacement) before the pick.
  #      The printed text has no "may"; EX7_070.cs registers it with
  #      isOptional: false (SetIsOptionEffect only tags it as an Option
  #      card's effect). The gate is answered sim-side only.
  # The line is authored in OUR order because it must lower here to run at
  # all; the oracle is expected to abort at the pick row, and that abort is
  # the measurement.
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
    expect: { prompt: OptionalSkill }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # Decline the reduced-cost reuse so EX7-070 stays in the trash (in DCGO's
  # order this row comes first).
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: SelectCardEffect }
  # Security check (Agumon 2000 vs 7000) resolves with no prompt; memory 3.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 29
    that:
      turn: 9
      p0.memory: 3
      p0.trash: [EX7-070]
      p0.hand: [BT24-088, BT24-088, BT24-088, BT25-092, BT25-092, EX7-051]
      p0.field:
        - { card_id: BT25-085, dp: 12000, suspended: false, sources: [] }
        - { card_id: BT25-083, dp: 7000, suspended: true, sources: [] }
      p1.field:
        - { card_id: ST1-02, dp: 3000, suspended: false, sources: [] }
      p1.security: 4
      p1.trash: [BT1-009, BT1-014, ST1-03]
