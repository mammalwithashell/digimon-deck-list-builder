    stack: [BT25-082, EX7-011, ST1-02, EX7-008, EX7-010,
            BT25-078, BT25-078, EX7-008, EX7-051, EX7-051,
            EX7-008, EX7-010, ST1-02]
    rest: tm-megadramon
  p1:
    stack: [ST1-02, ST1-03, ST1-04, BT1-009, BT3-007,
            ST1-03, ST1-04, BT1-009, ST1-02, ST1-02,
            ST1-05, ST1-05]
    rest: tm-red-opponent-011
steps:
  # T1 (P0, 0)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, 3)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, 3): BlackGatomon (6 -> -3). No Tamer in hand: no [On Play] prompt.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT25-082, from: hand } }
    expect: { prompt: main_phase }
  # T4 (P1, 3)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, 3): THE CLAUSE -- Megadramon over BlackGatomon for 3.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: EX7-011 } }
    expect: { prompt: main_phase }
  # One step past the clause (memory 0: still P0's turn).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
