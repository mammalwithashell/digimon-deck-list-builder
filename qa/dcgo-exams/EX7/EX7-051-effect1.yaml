# Exam scenario: Sparrowmon (EX7-051), clause EX7-051#effect#1 --
# "[Start of Your Main Phase] By placing 1 Option card with the [Three
#  Musketeers] trait from your hand or trash as 1 of your Digimon's bottom
#  digivolution card, <Draw 1>."
#
# THE LINE. Sparrowmon is breeding-digivolved on T3 (onto the shared book's
# purple Pagumon ST6-01: the standard circle) and promoted on T5; the
# breeding phase precedes the main phase, so THE CLAUSE fires at the very
# start of T5's main phase with Bind Red Trigger P-180 (a [Three Musketeers]
# trait Option) in hand. It is placed under Sparrowmon -- the only Digimon
# P0 has -- and 1 card is drawn. Memory is untouched (the cost is the
# placement, not memory), so the trailing step is P0's own pass.
#
# WHY NO KAPURIMON HERE. The EX7-051-effect0 / inherited0 lines use the black
# Kapurimon EX7-005 egg; this line places a [Three Musketeers] Option under
# the stack, which is exactly what Kapurimon's own "[Your Turn][Once Per
# Turn] ... gain 1 memory" reacts to. Kapurimon is implemented on both sides
# now (EX7-005.yaml, 61fc7c7d9) and has its own scenario
# (EX7-005-inherited0.yaml); keeping it out of THIS line keeps a second
# card's trigger -- and its +1 memory -- out of a measurement of Sparrowmon.
# Pagumon ST6-01 has only an [On Deletion], which never fires here.
#
# PROMPT SHAPE (EX7_051.cs, region "Start of Your Main Phase"):
#   1. SetUpActivateClass(..., -1, TRUE, ...) -> OptionalSkill (yes). Our
#      engine's clause is `optional: true` over a body whose FIRST step is
#      the declinable union pick, so its ONE prompt is gate and pick at once
#      (the `Replacement` row of docs/DCGO_EXAM.md's surface table); the
#      union kind is not fold-shaped, so DCGO's gate is a DCGO-ONLY row.
#   2. Only the hand holds a candidate (the trash is empty), so DCGO's
#      hand-or-trash choice is `userSelectionManager.SetBool(canSelectHand)`
#      -- a direct set, not the SetBoolForPlayer RPC the driver hooks: no row.
#   3. SelectHandEffect (maxCount 1, canNoSelect: true) over `IsOption &&
#      ContainsTraits("Three Musketeers")` -- SHARED with our union pick.
#   4. SelectPermanentEffect (canNoSelect: true) over own non-token Digimon
#      -- Sparrowmon is the lone candidate; SHARED with our mandatory host
#      pick (under the harness the AI branch's SetTargetFrames hook consumes
#      the row).
#   5. AddDigivolutionCardsBottom + DrawClass(1) -- no prompt.
card: EX7-051
clause: EX7-051#effect#1
seed: 424242
decks:
  p0:
    # stack[0..4] = opening hand; stack[5..9] = security (never flipped);
    # stack[10..] = draws: T3 turn draw, T3 digivolve draw, T5 turn draw, and
    # stack[13] = the card THE CLAUSE draws.
    stack: [EX7-051, P-180, BT24-088, BT24-088, BT24-088,
            BT25-082, BT25-082, BT25-082, BT25-082, BT25-058,
            BT25-092, BT25-092, BT25-083, BT21-071]
    rest: three-musketeers
  p1:
    stack: [ST1-03, ST1-04, ST1-04, BT1-009, BT3-007,
            ST1-02, ST1-02, ST1-04, ST1-02, ST1-02,
            BT3-007, BT3-007]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0): hatch Pagumon.
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1): nothing.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, 3): breeding-digivolve Sparrowmon (Purple Lv.2 / 0). No breeding
  # prompt: Pagumon is a Lv.2 in an occupied breeding area. [Start of Your
  # Main Phase] needs Sparrowmon on the BATTLE area (DCGO CanUseCondition:
  # IsExistOnBattleAreaDigimon), so nothing fires this turn on either side.
  - actor: 0
    do: { digivolve: { from: breeding, using: EX7-051 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1): nothing.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, 3): promote Sparrowmon; the main phase then opens with THE CLAUSE.
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  # DCGO-ONLY: the OptionalSkill gate (see header, item 1).
  - actor: 0
    do: { select: { yes: true, dcgo_only: true } }
    expect: { prompt: OptionalSkill }
  # SHARED: the [Three Musketeers] Option to place -- Bind Red Trigger.
  - actor: 0
    do: { select: { cards: [P-180] } }
    expect: { prompt: SelectHandEffect }
  # SHARED: the Digimon that receives it -- Sparrowmon, P0's only Digimon.
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # <Draw 1> resolves with no prompt. One step past the clause: memory 3.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 12
    that:
      turn: 5
      p0.memory: 3
      p0.trash: []
      p0.hand: [BT21-071, BT24-088, BT24-088, BT24-088, BT25-083, BT25-092, BT25-092]
      p0.field:
        - { card_id: EX7-051, dp: 1000, suspended: false, sources: [P-180, ST6-01] }
      p1.field: []
