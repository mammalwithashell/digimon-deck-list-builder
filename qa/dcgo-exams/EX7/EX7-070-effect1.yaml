# Exam scenario: Der Blitz (EX7-070), clause EX7-070#effect#1 --
# "[Main] Delete 1 of your opponent's Digimon with the lowest play cost. Then,
#  place this card as the bottom digivolution card of 1 of your [Three
#  Musketeers] trait Digimon."
#
# THE LINE. EX7-070 is a BLACK Option in a PURPLE deck; it is usable only
# because P0 controls a [Three Musketeers] TRAIT Digimon (BeelStarmon
# BT25-085, the only trait carrier in this pool besides EX7-073). The
# opponent fields TWO vanilla Digimon with DIFFERENT play costs so "lowest
# play cost" is a real selection: Biyomon ST1-02 (cost 2) and Dracomon ST1-04
# (cost 3) -- Biyomon is the unique legal target.
#
#   T1 (P0): pass everything.
#   T2 (P1, memory 3): play Biyomon (3 -> 1), play Dracomon (1 -> -2, over).
#   T3 (P0, memory 3): play BeelStarmon BT25-085 (3 -> -3, over).
#   T4 (P1): pass everything.
#   T5 (P0, memory 3): use EX7-070 (3 -> -3). THE CLAUSE: pick Biyomon
#            (deleted), then pick BeelStarmon to receive EX7-070 as its bottom
#            digivolution card.
#
# PROMPT SHAPE (EX7_070.cs, region "Main"): mandatory (isOptional: false);
# two independent SelectPermanentEffect(canNoSelect: false) picks -- the
# Destroy-mode pick over IsMinCost opponents, then the Custom-mode pick over
# own [Three Musketeers] Digimon. Each consumes one wire row.
card: EX7-070
clause: EX7-070#effect#1
seed: 424242
decks:
  p0:
    stack: [BT25-085, EX7-070, BT24-088, BT24-088, BT24-088,
            BT25-082, BT25-082, BT25-082, BT25-082, BT25-058,
            BT25-092, BT25-092]
    rest: three-musketeers
  p1:
    stack: [ST1-02, ST1-04, ST1-03, ST1-03, ST1-03,
            ST1-02, ST1-02, ST1-02, BT1-009, BT1-009,
            ST1-03, BT1-009]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, memory 3): two vanilla bodies, costs 2 and 3.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { play: { card: ST1-04, from: hand } }
    expect: { prompt: main_phase }
  # T3 (P0, memory 3): BeelStarmon.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT25-085, from: hand } }
    expect: { prompt: main_phase }
  # T4 (P1, memory 3)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, memory 3): THE CLAUSE.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: EX7-070, from: hand } }
    expect: { prompt: main_phase }
  # Lowest play cost: Biyomon (cost 2), not Dracomon (cost 3).
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # The tuck target: BeelStarmon.
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # One step past the clause: memory -3, seat P1 (T6).
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 13
    that:
      turn: 6
      p0.memory: -3
      p1.security: 5
      p1.trash: [ST1-02]
      p0.trash: []
      p0.hand: [BT24-088, BT24-088, BT24-088, BT25-092, BT25-092]
      p0.field:
        - { card_id: BT25-085, dp: 12000, suspended: false, sources: [EX7-070] }
      p1.field:
        - { card_id: ST1-04, dp: 4000, suspended: false, sources: [] }
