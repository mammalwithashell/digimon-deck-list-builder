# Exam scenario: ToyAgumon (EX7-008), clause EX7-008#effect#1 --
# "[On Play] Reveal the top 3 cards of your deck. Add 1 card with [Three
#  Musketeers] in its text and 1 Option card with a use cost of 6 among them
#  to the hand. Return the rest to the bottom of the deck."
#
# THE LINE. ToyAgumon is PLAYED from hand on T3 (cost 3: memory 3 -> 0, still
# P0's turn). The three revealed cards are stacked so that EACH bucket is a
# real decision with a witness:
#   * Sparrowmon EX7-051 -- "[Three Musketeers]" in its text, NOT an Option;
#   * Hurricane Screw Shot EX7-071 -- an Option with use cost 6 that ALSO
#     prints "[Three Musketeers]" (it fits both buckets);
#   * Titamon + SkullBaluchimon BT24-081 -- fits neither, so it is the card
#     that goes to the bottom.
# Bucket 1 (TM-text) therefore offers TWO candidates and the line picks
# Sparrowmon; bucket 2 (cost-6 Option) then has exactly one candidate,
# Hurricane Screw Shot. Picking Hurricane Screw Shot for bucket 1 would have
# starved bucket 2 (DCGO's second SelectCardEffect runs over the REMAINING
# revealed cards); the official Q&A "you must add as many cards to your hand
# as possible" is why the line does not do that.
#
# PROMPT SHAPE (EX7_008.cs, region "On Play", -> CardEffectCommons.
# SimplifiedRevealDeckTopCardsAndSelect -> RevealDeckTopCardsAndSelect):
# ActivateClass(isOptional: false) -- no OptionalSkill; `canNoAction` is
# not passed, so the ">= 2 conditions" generic_bool "Will you select cards?"
# gate is NOT asked; then ONE SelectCardEffect per condition whose candidate
# count is >= 1 (maxCount 1, canNoSelect false, root Library over the
# revealed list), in condition order. Under the harness the AI branch of
# SelectCardEffect always routes through SetTargetCardAndIndicies, so the
# single-candidate second pick still consumes a wire row. The remainder goes
# to the deck bottom with no prompt. Our engine parks one `RevealBucket`
# pick per bucket (max 1 each), answered by identity.
card: EX7-008
clause: EX7-008#effect#1
seed: 424242
decks:
  p0:
    # stack[0..4] = opening hand; stack[5..9] = security (never flipped);
    # stack[10] = the T3 turn draw; stack[11..13] = the three cards ToyAgumon
    # reveals, in reveal order.
    stack: [EX7-008, BT24-088, BT24-088, BT24-088, BT25-092,
            BT25-082, BT25-082, BT25-082, BT25-082, BT25-058,
            BT25-092, EX7-051, EX7-071, BT24-081]
    rest: three-musketeers
  p1:
    stack: [ST1-03, ST1-04, ST1-04, BT1-009, BT3-007,
            ST1-02, ST1-02, ST1-04, ST1-02, ST1-02,
            BT3-007]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0): nothing.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1): nothing.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, 3): THE CLAUSE -- play ToyAgumon (3 -> 0).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: EX7-008, from: hand } }
    expect: { prompt: main_phase }
  # Bucket 1: "1 card with [Three Musketeers] in its text" -- Sparrowmon
  # (Hurricane Screw Shot also qualifies; see the header).
  - actor: 0
    do: { select: { cards: [EX7-051] } }
    expect: { prompt: SelectCardEffect }
  # Bucket 2: "1 Option card with a use cost of 6" -- Hurricane Screw Shot.
  - actor: 0
    do: { select: { cards: [EX7-071] } }
    expect: { prompt: SelectCardEffect }
  # SIM-ONLY: Titamon + SkullBaluchimon returns to the bottom. DCGO asks
  # nothing (one remaining card has one order); our engine parks a
  # one-choice, non-declinable `OrderedPermutation { remaining: 1 }` prompt
  # -- the documented "OrderedPermutation at N=1 -- ours" finding in
  # docs/DCGO_EXAM.md ("Rows where one side looks rules-wrong"): a prompt
  # with a single valid action and no decline is not a choice under rule 17,
  # and DCGO skips it. Answered sim-side only; zero wire rows.
  - actor: 0
    do: { select: { cards: [BT24-081], sim_only: true } }
  # One step past the clause: memory 0 is still P0's turn.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 9
    that:
      turn: 3
      p0.memory: 0
      p0.trash: []
      p0.hand: [BT24-088, BT24-088, BT24-088, BT25-092, BT25-092, EX7-051, EX7-071]
      p0.field:
        - { card_id: EX7-008, dp: 1000, suspended: false, sources: [] }
      p1.field: []
