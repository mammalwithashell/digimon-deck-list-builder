# Exam scenario: Tankmon (EX7-043), clause EX7-043#effect#0 --
# "[Digivolve] Lv.3 w/[Three Musketeers] in text: Cost 2"
#
# The printed black circle is ALSO "Lv.3 / cost 2", so a black base cannot
# tell the two apart. The base must be a NON-black Lv.3 that prints "[Three
# Musketeers]" somewhere in its text: ToyAgumon EX7-008 (RED Lv.3, its [On
# Play] names "[Three Musketeers]"). Only the clause under exam makes
# Tankmon's digivolution onto it legal. Same construction as the oracle
# line qa/dcgo-exams/BT21/BT21-071-effect0.yaml.
#
# ToyAgumon's [On Play] would prompt (a 3-card reveal), so it is never
# PLAYED: it is DIGIVOLVED in the breeding area from a RED Digi-Egg
# (Koromon ST1-01) -- which is why the book tm_ex7_043_pool.json gives the
# Tankmon deck ST1-01 x4 as its egg deck. Each digivolution draws 1 (T3 and
# T5), so the stack carries four draws.
#
#   T1 (P0): hatch Koromon, pass.          T2 (P1): pass.
#   T3 (P0): digivolve the egg into ToyAgumon (cost 0, draw 1; [On Play]
#            does NOT fire on a digivolve).
#   T4 (P1): pass.
#   T5 (P0, 3): promote ToyAgumon, then THE CLAUSE -- digivolve it into
#            Tankmon for 2 (3 -> 1, draw 1). Tankmon's [When Digivolving]
#            needs THREE [Three Musketeers]-trait cards in hand + trash
#            (EX7_043.cs SharedCanActivateCondition: cardCount() >= 3; our
#            clause condition is the same gate); the hand holds none, so
#            neither engine offers it. Pass (turn over).
#
# The assert sits on P1's turn so ToyAgumon's inherited "[Your Turn] +2000
# DP" is off and Tankmon reads its printed 5000.
card: EX7-043
clause: EX7-043#effect#0
seed: 424242
decks:
  p0:
    stack: [EX7-008, EX7-043, BT24-088, BT24-088, BT24-088,
            BT25-082, BT25-082, BT25-082, BT25-082, BT25-058,
            BT25-092, BT25-092, BT25-092, BT21-071]
    rest: tm-tankmon
  p1:
    stack: [ST1-03, ST1-03, ST1-03, ST1-03, ST1-04,
            ST1-02, ST1-02, ST1-02, ST1-04, ST1-04,
            BT1-009, BT1-009, BT1-009]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0): hatch Koromon.
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, 3): breeding-digivolve into ToyAgumon (red Lv.3, cost 0). NO
  # breeding-action step this turn: the breeding area holds a Lv.2 (cannot be
  # moved) and is occupied (cannot hatch), so neither engine asks -- the same
  # shape as the oracle-confirmed BT21-029 lines at their T3.
  - actor: 0
    do: { digivolve: { from: breeding, using: EX7-008 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, 3): promote, then THE CLAUSE.
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: EX7-043 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T6 (P1): the trailing step.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 11
    that:
      turn: 6
      p0.memory: -3
      p0.trash: []
      p0.hand: [BT24-088, BT24-088, BT24-088, BT25-092, BT25-092, BT25-092, BT21-071]
      p0.field:
        - { card_id: EX7-043, dp: 5000, suspended: false, sources: [EX7-008, ST1-01] }
      p1.field: []
