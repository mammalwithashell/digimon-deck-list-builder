# qa:Q1139 (2024-03-28) -- "During the same turn I used this card, I digivolve a green Digimon into a
# non-green Digimon. Can I use this card's effect to reduce the digivolution cost?" -> "Yes, you can. As long
# as you're digivolving from a green Digimon, the effect applies."
# Sources: data/card_bundles/BT3-103.md + official observation 013e0883... + card image; DCGO
# BT3/Green/BT3_103.cs (PermanentCondition reads the DIGIVOLVING permanent's TopCard.CardColors at
# BeforePayCost -- Kunemon = green -- never the result card; optional ActivateClass -> SelectPermanentEffect
# Mode.Tap canNoSelect true -> Cost -= 5); ours BT3-103.yaml `arm_digivolve_cost_reducer target_color: green`.
# Coredramon EX3-018: data/card_bundles/EX3-018.md (BLUE Lv.4; circles Blue Lv.3 / cost 3, GREEN Lv.3 / cost 3,
# [Dracomon] name cost 2 -- from Kunemon only the green circle applies, so no cost-choice prompt), DCGO
# EX3/Blue/EX3_018.cs, ours EX3-018.yaml (<Evade> keyword only; no trigger on digivolving).
# Line: Biyomon ST1-02 (T1), Agumon ST1-03 + Kunemon ST4-05 (T3; Kunemon = the GREEN Lv.3 that digivolves,
# third-entered -> index 2 on both wires, README "Slot safety"). T5 (3): BT3-103, then Kunemon (field.2)
# digivolves into Coredramon EX3-018 -- a GREEN Digimon into a NON-green one. The reducer prompt IS offered
# and accepted; the suspend pick names Biyomon (own.field.0, identity ST1-02), a Digimon other than the
# digivolving one. Discriminator: Coredramon (blue) ends on P0's third slot with sources [ST4-05],
# unsuspended; Biyomon is suspended; memory is still 3 (printed cost 3 - 5 floors at 0). Without the
# reduction the cost would read 3 -> 0 memory and no Digimon would be suspended.
# Prompt shape: both engines ask accept/decline then the suspend pick (DCGO OptionalSkill +
# SelectPermanentEffect; ours accept/decline + OwnField) -- the oracle-confirmed BT3-103-tail-main shape, so no
# expect is pinned on those rows. P1 never acts.
# Draft: sim-only legality is not oracle confirmation. expect_ruling is authored later.
