# qa:Q1137 (2024-03-28) -- "Can I digivolve from a Digimon that was suspended by this card's effect?" ->
# "Yes, you can."
# Sources: data/card_bundles/BT3-103.md + official observation 013e0883... + card image BT3-103.webp; DCGO
# BT3/Green/BT3_103.cs (BeforePayCost observer, isOptional true -> SelectPermanentEffect Mode.Tap over the
# owner's unsuspended battle-area Digimon, canNoSelect true -> ChangeCostClass Cost -= 5 for the digivolution
# being paid); ours BT3-103.yaml `arm_digivolve_cost_reducer` (accept/decline prompt, then an OwnField suspend
# pick, before the cost is paid). general_rule.pdf 8-1-2-4 (a digivolved Digimon carries over its suspended
# state) -- nothing in 8-1 requires the base Digimon to be unsuspended.
# Line: P0 fields Biyomon ST1-02 (T1), then Agumon ST1-03 and Kunemon ST4-05 (T3; 3 -> 0 -> -4) so that
# Kunemon -- the GREEN Lv.3 that will digivolve -- is the THIRD-entered Digimon (index 2 on both wires, README
# "Slot safety"). T5 (3): Hidden Potential Discovered! BT3-103, then Kunemon digivolves into Kuwagamon ST4-07
# (Green Lv.3 -> Lv.4, printed cost 2). The reducer is accepted and the suspend pick names Kunemon ITSELF
# (own.field.2, identity ST4-05) although Biyomon and Agumon are equally legal picks -- that choice IS the
# ruling's situation. Discriminator: the digivolution still completes: the trailing rows show Kuwagamon on
# P0's third slot with sources [ST4-05], SUSPENDED (carried over, 8-1-2-4), Biyomon and Agumon unsuspended,
# and memory still 3 (cost 2 - 5 -> 0). If suspending the digivolving Digimon voided or blocked the
# digivolution, Kuwagamon would not be on the field (or the pick would be refused).
# Prompt shape: both engines ask accept/decline, then the suspend pick (DCGO OptionalSkill +
# SelectPermanentEffect; ours accept/decline + OwnField) -- exactly the two rows the oracle-confirmed
# BT3-103-tail-main line answers, so no expect is pinned on them. P1 never acts.
# Draft: sim-only legality is not oracle confirmation. expect_ruling is authored later.
