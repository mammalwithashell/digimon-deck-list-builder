    stack: [ST1-03, ST1-04, ST2-03, ST2-04, ST1-05, ST1-02, ST1-02, ST1-02, ST1-02, ST1-03, ST1-04, ST1-04, ST1-04]
    rest: BT3-103-interaction-Q1138-p1
