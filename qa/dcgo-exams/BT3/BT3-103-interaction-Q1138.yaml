# qa:Q1138 (2024-03-28) -- "During the same turn I used this card, I digivolve a non-green Digimon into a
# green Digimon. Can I use this card's effect to reduce the digivolution cost?" -> "No, this card's effect only
# applies when digivolving a Digimon that's already green."
# Sources: data/card_bundles/BT3-103.md + official observation 013e0883... + card image; DCGO
# BT3/Green/BT3_103.cs (PermanentCondition tests the DIGIVOLVING permanent's TopCard.CardColors for Green at
# BeforePayCost -- i.e. the base before the new top card is placed; the result card's colour is never read);
# ours BT3-103.yaml `arm_digivolve_cost_reducer target_color: green` keyed on the digivolving permanent's top
# card. Groundramon BT20-042: data/card_bundles/BT20-042.md (GREEN/red Lv.5; circles Green Lv.4 / cost 4, Red
# Lv.4 / cost 4, [Coredramon] cost 3), DCGO BT20/Green/BT20_042.cs and qa/dcgo-exams/BT20/BT20-042-interaction-
# Q4358.yaml (two mandatory SelectPermanentEffect picks for its [When Digivolving]).
# Line: Kunemon ST4-05 (green, T1 -- the green permanent that makes the green Option playable, and a green
# Digimon that is present but NOT the one digivolving), Biyomon ST1-02 + Birdramon ST1-05 (T3; Birdramon is a
# RED Lv.4 and the THIRD-entered Digimon -> index 2 on both wires, README "Slot safety"). P1 plays Agumon (T2)
# so Groundramon's mandatory picks have a target on both engines. T5 (3): BT3-103, then Birdramon (field.2)
# digivolves into Groundramon BT20-042 -- a NON-green Digimon into a GREEN one; from Birdramon only the "Red
# Lv.4 / cost 4" circle applies, so no cost-choice prompt arises.
# Discriminator: there is NO accept/decline row between the digivolve row and Groundramon's first target pick
# -- an engine that offered the reducer for a red-into-green digivolution would park a yes/no there and the
# `targets:` answer would fail to lower (ours) / abort as a prompt mismatch (DCGO); and the FULL cost is paid:
# memory 3 -> -1, which ends P0's turn (next row = P1 breeding_action, turn 6) with Kunemon, Biyomon and
# Groundramon (sources [ST1-05]) all unsuspended on P0's side.
# Draft: sim-only legality is not oracle confirmation. expect_ruling is authored later.
