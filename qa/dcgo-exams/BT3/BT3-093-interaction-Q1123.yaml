    # hand: BT3-093, ST1-04 x3, ST1-06 | security bottom->top: ST1-02 x4, ST1-03 | deck top (the reveal): ST2-03, ST2-04, ST4-03 | then ST1-05, ST1-05
    stack: [BT3-093, ST1-04, ST1-04, ST1-04, ST1-06, ST1-02, ST1-02, ST1-02, ST1-02, ST1-03, ST2-03, ST2-04, ST4-03, ST1-05, ST1-05]
    rest: bt3-093-tail
  p1:
    stack: [ST1-03, ST1-06, ST1-04, ST1-04, ST1-04, ST1-02, ST1-02, ST1-02, ST1-02, ST1-04, ST2-04, ST1-08]
    rest: bt3-093-tail
steps:
- { actor: 0, do: { pass: {} }, expect: { prompt: breeding_action } }
# [On Play]: reveal ST2-03, ST2-04, ST4-03.
- { actor: 0, do: { play: { card: BT3-093, from: hand } }, expect: { prompt: main_phase } }
# Blue Digimon bucket: candidates ST2-03 and ST2-04; exactly one is added.
- { actor: 0, do: { select: { cards: [ST2-03] } }, expect: { prompt: SelectCardEffect } }
# Green Digimon bucket: ST4-03. (DCGO's row here already holds ST2-03 in hand -- the documented quirk.)
- { actor: 0, do: { select: { cards: [ST4-03] } }, expect: { prompt: SelectCardEffect } }
