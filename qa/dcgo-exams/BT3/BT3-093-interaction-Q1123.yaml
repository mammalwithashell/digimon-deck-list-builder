# Q1123 (2024-09-20): "What cards are added by this card's [On Play] effect?" -> 1 blue Digimon card
# AND 1 green Digimon card. P0 plays Davis from hand on turn 1 (cost 4 at memory 0, legal); the
# reveal is [ST2-03 Gabumon (blue Lv.3), ST2-04 Bearmon (blue Lv.3), ST4-03 Tentomon (green Lv.3)].
# Blue bucket has TWO candidates and only one may be taken; the green bucket takes Tentomon; the
# second blue Digimon is the one remaining card and goes to the deck bottom.
# Final-row observable: p0.hand = ST1-04 x3, ST1-06, ST2-03, ST4-03 (one blue, one green added).
#
# KNOWN DCGO QUIRK (docs/DCGO_EXAM.md, RevealBucket add timing; RevealLibrary.cs:310-328 with
# Mode.AddHand): DCGO moves the blue pick to hand when its prompt CLOSES, so DCGO's row at step 3
# already shows ST2-03 in p0.hand while ours (collect all buckets, then add; §15-15-10-1) does not.
# Expect a one-field p0.hand divergence at step 3 with the end state agreeing. Triage it as the
# documented DCGO quirk; do NOT hide it with an adapter and do NOT change the engine to add per bucket.
#
# Step 4 is sim-only: our engine parks a one-choice OrderedPermutation for the single remaining
# card (selections.rs select_ordered_permutation: singleton permutations still surface); DCGO's
# ReturnRevealedCardsToLibraryBottom (RevealLibrary.cs:478-483) bottoms ONE remaining card silently.
# Sources: data/card_bundles/BT3-093.md; base DCGO BT3/Blue/BT3_093.cs (two SimplifiedSelectCard
# conditions, maxCount 1 each, mutualConditions: true, RemainingCardsPlace.DeckBottom).
# Draft: sim-only legality is not oracle confirmation. expect_ruling is authored later.
card: BT3-093
clause: BT3-093#effect#1
covers: [BT3-093#effect#1]
interaction: { id: "qa:Q1123", source: qa, kind: positive }
seed: 424242
