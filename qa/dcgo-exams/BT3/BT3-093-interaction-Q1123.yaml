- { actor: 0, do: { select: { cards: [ST2-04], sim_only: true } }, expect: { prompt: SelectCardEffect } }
# Memory -4 handed the turn to P1; this row is the post-resolution observation.
- { actor: 1, do: { pass: {} }, expect: { prompt: breeding_action } }
