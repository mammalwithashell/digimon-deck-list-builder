# qa:Q1140 (2024-03-28) -- "After using this card, can I reduce the digivolution cost of my green Digimon
# digivolving by suspending 1 of my Digimon when an effect to digivolve one of my Digimon is activated?" ->
# "Yes, you can."
# Sources: data/card_bundles/BT3-103.md + official observation 013e0883... + card image; DCGO
# BT3/Green/BT3_103.cs (the reducer is a PLAYER effect at EffectTiming.BeforePayCost, isOptional true ->
# SelectPermanentEffect Mode.Tap canNoSelect true -> Cost -= 5). Effect digivolution used: Green Scramble
# LM-030, "[Main] 1 of your green Digimon may digivolve into a green Digimon card in the hand with the
# digivolution cost reduced by 3. Then, place this card in the battle area." (data/card_bundles/LM-030.md;
# DCGO LM/Green/LM_030.cs -> SelectPermanentEffect canNoSelect true -> CardEffectCommons.
# DigivolveIntoHandOrTrashCard(payCost: true, reduceCost 3) -> SelectHandEffect -> PlayCardClass.PlayCard(),
# whose cost path collects the player's BeforePayCost skills (CardController.cs ~783-788) -- the very seam
# BT3_103.cs hooks, so DCGO offers the suspend-for-5 on this EFFECT digivolution). Oracle-confirmed sibling
# shape: qa/dcgo-exams/LM/LM-028-tail-main.yaml (permanent pick, hand pick, nothing else, Option then seated).
# Groundramon BT20-042 (green/red Lv.5; "Green Lv.4 / cost 4" is the only circle Kuwagamon satisfies; two
# mandatory [When Digivolving] picks -- qa/dcgo-exams/BT20/BT20-042-interaction-Q4358.yaml).
# Line: Kunemon ST4-05 (T1) -> Kuwagamon ST4-07 (T3, a plain hand digivolution BEFORE any reducer exists),
# Biyomon ST1-02 (T3, a second Digimon = a suspend candidate other than the digivolver). P1 plays Agumon (T2)
# so Groundramon's picks have a target. T5 (3): BT3-103 (0), Green Scramble (2 -> 1): pick Kuwagamon
# (own.field.0, the only green Digimon), pick Groundramon from hand; LM-030 reduces 4 -> 1. THE RULING: the
# BT3-103 reducer fires on this effect-activated digivolution -- accept, suspend Biyomon -> cost 0, memory
# stays 1; then Groundramon's [When Digivolving] picks; LM-030 is seated in the battle area; pass.
# Discriminator: memory 1 (not 0) at the pass row and Biyomon suspended, with Groundramon (sources [ST4-05,
# ST4-07]) on P0's first slot.
# Both engines now expose the effect-evolution reducer choice. Accept and suspend are shared
# scenario actions; the expected result remains derived from official Q1140 and printed costs.
# Draft: sim-only legality is not oracle confirmation. expect_ruling is authored later.
