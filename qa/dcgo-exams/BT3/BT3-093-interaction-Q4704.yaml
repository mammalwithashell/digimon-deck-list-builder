# Green bucket: Lighdramon is already taken (mutualConditions / no_duplicate_cards) and nothing
# else is green, so BOTH engines skip it silently. Veemon and Birdramon (2 cards) are bottomed via
# ONE ordering prompt on both sides (RevealLibrary.cs:485-512; same shape as the confirmed
# BT3-093-tail-single-hit step 7). Final-row observable: p0.hand holds BT8-053 and NOT P-117.
# Only one bucket adds a card, so the multi-bucket intermediate-hand quirk does not arise here.
# Sources: data/card_bundles/BT3-093.md; base DCGO BT3/Blue/BT3_093.cs + RevealLibrary.cs
# RevealDeckTopCardsAndSelect (a picked card is removed from revealedCards, second bucket
# maxCount = 0 -> no prompt); BT8/Green/BT8_053.cs and P/Blue/P_117.cs exist in DCGO.
