# Exam scenario: Asuna Shiroki (BT24-088), clause BT24-088#effect#1 --
# "[On Play] By trashing 1 card with [Three Musketeers] in its text or the [TS]
#  trait from your hand, <Draw 2>."
#
# THE LINE: P0 plays the Tamer from hand on turn 1. The first player opens at
# memory 0, so paying 3 lands on -3 and the turn hands over as soon as the [On
# Play] has resolved -- which is why "one step past the clause" is P1's turn-2
# breeding decision. The cost is paid by trashing Sparrowmon (EX7-051 -- [Three
# Musketeers] in its text, no trait) and two cards are drawn. The first player does
# not draw on turn 1, so the two drawn cards are exactly stack[10..11].
#
# PROMPT SHAPE, from BT24_088.cs: SetUpActivateClass(..., -1, TRUE, ...) -- DCGO
# parks an OptionalSkill yes/no gate, then a SelectHandEffect (maxCount 1,
# canNoSelect: true, Mode.Discard). Our YAML is `optional: true` with a declinable
# `select_hand` as the FIRST body step, so our engine surfaces ONE prompt that is
# gate and pick at once. That is the documented `optional_gate_fold`: the pick row
# is authored with `expect: {prompt: OptionalSkill}` and the emitter writes
# OptionalSkill(yes) + the hand pick on the wire. <Draw 2> is Mandatory
# (keyword-semantics.md, 16-7) -- no prompt.
card: BT24-088
clause: BT24-088#effect#1
seed: 424242
decks:
  p0:
    stack: [BT24-088, EX7-051, BT21-074, BT21-074, BT25-085,
            BT25-082, BT25-082, BT25-082, BT25-082, BT25-083,
            BT25-083, BT25-083]
    rest: three-musketeers
  p1:
    stack: [ST1-02, ST1-03, ST1-04, BT1-009, BT3-007,
            ST1-05, ST1-05, ST1-05, ST1-05, BT1-014]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0): no hatch.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  # THE CLAUSE: play Asuna Shiroki (BT24-088). Memory 0 -> -3; [On Play] fires.
  - actor: 0
    do: { play: { card: BT24-088, from: hand } }
    expect: { prompt: main_phase }
  # THE FOLD: DCGO asks OptionalSkill then the hand pick; our engine asks one
  # declinable pick. Trash Sparrowmon (EX7-051) as the cost, then <Draw 2>.
  - actor: 0
    do: { select: { cards: [EX7-051] } }
    expect: { prompt: OptionalSkill }
  # Memory -3 ended P0's turn; one step past the clause is P1's turn-2 breeding
  # decision.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  # Pre-step state of P1's trailing breeding pass: Sparrowmon is in P0's trash,
  # the two draws (stack[10..11], both LadyDevimon) joined P0's hand, the Tamer is
  # on P0's field (a Tamer projects dp -1), and memory reads -3 from P0's side.
  - at: 3
    that:
      turn: 2
      p0.memory: -3
      p0.hand: [BT21-074, BT21-074, BT25-083, BT25-083, BT25-085]
      p0.trash: [EX7-051]
      p0.field:
        - card_id: BT24-088
          dp: -1
          suspended: false
          sources: []
