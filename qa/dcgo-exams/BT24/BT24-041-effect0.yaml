# Exam scenario: Minervamon (BT24-041), clause BT24-041#effect#0 --
# the special digivolution condition "[Digivolve] Lv.5 w/[Beastkin]/[Dark
# Dragon]/[TS] trait: Cost 3".
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). PROVISIONAL: assert block is our engine's result, not
# backfilled from DCGO -- unconfirmed until the oracle pass.
#
# WHY P-213. Minervamon's printed circles are Yellow Lv.5 / 4 and Black
# Lv.5 / 4. Aegiochusmon P-213 is a RED Lv.5 with the [TS] trait: neither
# circle accepts it, so the only legal route is the trait condition under
# exam, and the memory delta pins its cost at 3. One route -> no cost-choice
# prompt on either side. P-213 is quiet when hard-played (<Raid>, <Decode>
# and a [When Digivolving] only).
#
# THE LINE.
#   T1 (P0, 0): hard-play P-213 (7): 0 -> -7.
#   T2 (P1, 7): Biyomon ST1-02 (2): 7 -> 5; pass -> P0 3.
#   T3 (P0, 3): THE CLAUSE -- digivolve Minervamon onto P-213: 3 -> 0.
#       Minervamon's [When Digivolving] (#effect#2): P0's hand holds NO
#       play-cost <=5 [Iliad] card (stacked on purpose), so the optional free
#       play has no candidate; then <De-Digivolve 1> x 1 (one own Digimon) on
#       Biyomon -- ONE mandatory pick, nothing trashed (bare Lv.3).
#   Trailing pass.
#
# WITNESS: p0.memory 3 -> 0 and Minervamon on the field over P-213.
# PROMPT SHAPE: no cost prompt (one route). WD: the optional hand pick has no
# candidate -- ours skips it; if DCGO still raises an OptionalSkill for the
# "you may" with an empty pool, the oracle aborts at the de-digivolve row
# (add a dcgo_only decline). Then ONE SelectPermanentEffect.
card: BT24-041
clause: BT24-041#effect#0
seed: 424242
decks:
  p0:
    stack: [P-213, BT24-041, BT26-029, BT25-044, BT26-081,
            BT25-030, BT24-031, BT26-073, BT26-081, BT24-101,
            BT26-103, BT26-083, BT24-031, BT25-033, BT25-030]
    rest: ts-jupitermon
  p1:
    stack: [ST1-02, ST1-03, ST1-04, BT1-009, BT3-007,
            BT1-014, BT4-010, BT3-007, ST1-02, BT1-009,
            ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: P-213, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  # THE CLAUSE: the [TS] Lv.5 route, cost 3.
  - actor: 0
    do: { digivolve: { from: field.0, using: BT24-041 } }
    expect: { prompt: main_phase }
  # Minervamon's WD: <De-Digivolve 1> x 1 on Biyomon.
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 6
    that:
      p0.memory: 3
  - at: 8
    that:
      turn: 3
      p0.memory: 0
      p0.field:
        - { card_id: BT24-041, dp: 12000, suspended: false, sources: [P-213] }
      p1.field:
        - { card_id: ST1-02, dp: 3000, suspended: false, sources: [] }
