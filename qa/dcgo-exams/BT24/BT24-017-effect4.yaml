# Exam scenario: Medusamon (BT24-017), clause BT24-017#effect#4 --
# "... After, this Digimon gets +2000 DP for each of your opponent's Digimon
#  until their turn ends."
#
# (The clause also carries the trailing fragment of the [Petrification] Token's
# parenthetical, "Trash your top security card.)", which clause_coverage splits
# here; the DP tail is the measurable half and is what this line witnesses.)
#
# SAME LINE as BT24-017-effect3.yaml, which is oracle-CONFIRMED. That file
# measures the delete + trash-return cost; this one measures the DP tail that
# 15-7-2 gates behind paying it.
#
# THE WITNESS is Medusamon (BT24-017) reading 23000 rather than 19000. Printed
# 11000, +8000 from its three DP-granting inherited sources on its controller's
# turn, and +2000 for EACH of the opponent's two freshly-played [Petrification]
# Tokens = +4000. Had this clause not fired -- or had it counted the opponent's
# Digimon before the Tokens landed -- the number would be 19000.
card: BT24-017
clause: BT24-017#effect#4
seed: 424242
decks:
  p0:
    stack: [BT23-005, BT21-015, BT21-024, BT24-017, BT21-007,
            BT21-008, BT24-008, EX11-008, BT24-012, BT21-017]
    rest: medusamon-liberator
  p1:
    stack: [BT23-005, BT21-007, BT24-008, EX11-008, BT24-012,
            BT21-015, BT21-017, BT21-008, BT21-025, BT21-024]
    rest: medusamon-liberator
steps:
  # T1 (P0): hatch.
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1): hatch.
  - actor: 1
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0): breeding-digivolve -> Elizamon BT21-008.
  - actor: 0
    do: { digivolve: { from: breeding, using: BT23-005 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1): breeding-digivolve -> Elizamon BT23-005.
  - actor: 1
    do: { digivolve: { from: breeding, using: BT23-005 } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, memory 3): promote, then two digivolutions in the one turn.
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT21-015 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT21-024 } }
    expect: { prompt: main_phase }
  # Cyberdramon BT21-024's own [When Digivolving]: the OPPONENT places 1 card
  # from hand as their bottom security card, then their top security card is
  # trashed. Net security is unchanged at 5. Medusamon is not on the field yet,
  # so this security removal does NOT trigger the clause under exam.
  - actor: 1
    do: { select: { cards: [BT21-007] } }
  # T6 (P1, memory 2): promote Elizamon to the battle area.
  - actor: 1
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T7 (P0): digivolve into Medusamon -- THE CLAUSE.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT24-017 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
  # SIM-ONLY. This accept/decline gate is OUR engine's rendering of the
  # "by returning 2 cards" optional processing condition (15-7-1). DCGO has no
  # such gate: BT24_017.cs builds the effect NON-optional and carries the
  # refusal on the trash pick's `canNoSelect: () => true` instead, so it asks
  # ONE cancellable prompt where we ask two. The row answers our prompt and
  # emits no wire row; the pick below is the shared decision both engines make.
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  - actor: 0
    do: { select: { cards: [BT23-005, BT25-001] } }
  # DCGO-ONLY: the deck-bottom ORDERING prompt.
  #
  # With 2 cards, DCGO's `ReturnRevealedCardsToLibraryBottom` takes its
  # `remainingCards.Count == 1` ELSE branch and opens a SECOND
  # SelectCardEffect -- "Specify the order to place the card at the bottom of
  # the deck" (RevealLibrary.cs:469+, canNoSelect: false, canEndNotMax:
  # false). Our engine has no such prompt: `return_trash_list_to_deck_bottom`
  # takes the bound list and orders it itself, so this row is DCGO's alone.
  #
  # DO NOT answer it with `decline: true`. Cancelling the ORDER prompt leaves
  # the cards in the trash while the caller goes on to play both tokens and
  # grant the DP boost -- which reads as "DCGO plays the tokens without
  # paying the cost" and is an artifact of the answer, not DCGO behaviour.
  # That mis-answer is exactly what produced the first `diverged` verdict on
  # this clause; the only surviving field was p1.trash.
  - actor: 0
    do: { select: { cards: [BT23-005, BT25-001], dcgo_only: true } }
  - actor: 0
    do: { pass: {} }
assert:
  - at: 19
    that:
      turn: 7
      phase: Main
      p0.field:
        - card_id: BT24-017
          # 11000 printed + 8000 inherited + 2000 x 2 opponent Digimon.
          dp: 23000
          suspended: false
          sources: [BT21-015, BT21-024, BT23-005, BT25-001]
      p1.field:
        - card_id: TOKEN_PETRIFICATION
          dp: 3000
          suspended: false
          sources: []
        - card_id: TOKEN_PETRIFICATION
          dp: 3000
          suspended: false
          sources: []
