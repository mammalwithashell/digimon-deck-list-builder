# Exam scenario: Neptunemon (BT24-030), clause BT24-030#effect#2 -- "[On Play]
# [When Digivolving] Return all of your opponent's Digimon with the fewest
#  digivolution cards to the bottom of the deck." (the [On Play] arm).
#
# DECK NOTE. `tm-neptune` (qa/dcgo-exams/BT24/tm_bt24_030_pool.json) is a black
# vanilla shell carrying 4x Neptunemon BT24-030 (see BT24-030-effect0.yaml);
# `tm-quiet-red` is the quiet ST1 shell.
#
# THE BOARD MAKES "FEWEST" DISCRIMINATE. (The crashed draft fielded two
# hard-played Digimon, both at zero digivolution cards, so "all of them" and
# "the fewest group" were the same set and the comparison was never exercised.)
# Here P1 fields
#   - Birdramon ST1-05 over Biyomon ST1-02  -> ONE digivolution card, and
#   - Fugamon BT4-010, hard-played          -> ZERO digivolution cards,
# so only Fugamon is in the lowest group: it goes to the bottom of P1's deck
# and Birdramon STAYS with its source. All three P1 cards are vanillas with no
# DCGO script (no prompt, no trigger).
#
#   T1 (P0, 0): pass -> P1 3.
#   T2 (P1, 3): Biyomon (2): 3 -> 1; digivolve Birdramon (Red Lv.3 / 2): 1 -> -1
#            (P1 has ONE Digimon, so `field.0` is slot-safe on DCGO's
#            centre-out frames) -> P0 1.
#   T3 (P0, 1): pass -> P1 3.
#   T4 (P1, 3): Fugamon (3): 3 -> 0; pass -> P0 3.
#   T5 (P0, 3): THE CLAUSE. Neptunemon: P1 has 2 Digimon, so the play costs
#            12 - 5 = 7 (effect#1, measured in BT24-030-effect1.yaml):
#            3 -> -4 -> P1's turn at 4.
#
# PROMPT SHAPE (BT24_030.cs "On Play"): SetUpActivateClass(..., -1, FALSE, ...)
# -> mandatory, no OptionalSkill; a lone trigger -> no MultipleSkills. The
# coroutine groups GetBattleAreaDigimons() by DigivolutionCards.Count, takes
# the whole lowest group and hands it to DeckBouncePeremanentAndProcess-
# AccordingToResult -- no target pick, and a ONE-card group needs no ordering
# prompt. Ours: a `for_each` over `fewest_materials`, no selection.
#
# WITNESS: one step later p1.field holds only Birdramon (source Biyomon
# intact); Fugamon is in neither p1.trash nor p1.hand.
card: BT24-030
clause: BT24-030#effect#2
seed: 424242
decks:
  p0:
    stack: [BT24-030, BT2-052, BT3-059, BT2-056, BT3-067,
            BT5-066, BT2-064, BT4-065, BT2-052, BT3-059,
            BT2-056, BT3-067, BT5-066]
    rest: tm-neptune
  p1:
    # [10] T2 draw, [11] the digivolve draw, [12] T4 draw, [13] T6 draw.
    stack: [ST1-02, ST1-05, BT4-010, ST1-03, ST1-04,
            BT1-009, BT1-014, BT3-007, BT1-009, BT4-014,
            BT3-007, ST1-04, ST1-03, BT1-014]
    rest: tm-quiet-red
steps:
  # T1 (P0): decline breeding; pass -> P1 3.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, memory 3): Biyomon (3 -> 1), Birdramon on top (1 -> -1) -> P0 1.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { digivolve: { from: field.0, using: ST1-05 } }
    expect: { prompt: main_phase }
  # T3 (P0, memory 1): nothing -> P1 3.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1, memory 3): Fugamon BT4-010 (3 -> 0); pass -> P0 3.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: BT4-010, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, memory 3): decline breeding; THE CLAUSE -- play Neptunemon.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT24-030, from: hand } }
    expect: { prompt: main_phase }
  # T6 (P1): trailing breeding decision.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 11
    that:
      p1.field:
        - { card_id: ST1-05, dp: 5000, suspended: false, sources: [ST1-02] }
        - { card_id: BT4-010, dp: 3000, suspended: false, sources: [] }
  - at: 12
    that:
      turn: 6
      p0.memory: -4
      p1.trash: []
      p1.field:
        - { card_id: ST1-05, dp: 5000, suspended: false, sources: [ST1-02] }
      p0.field:
        - { card_id: BT24-030, dp: 12000, suspended: false, sources: [] }
