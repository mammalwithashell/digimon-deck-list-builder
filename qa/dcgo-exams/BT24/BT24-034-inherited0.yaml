# Exam scenario: Aegiomon (BT24-034), clause BT24-034#inherited#0 --
# the INHERITED "<Barrier> (When this Digimon would be deleted in battle, by
#  trashing your top security card, it isn't deleted.)"
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). PROVISIONAL: assert block is our engine's result, not
# backfilled from DCGO -- unconfirmed until the oracle pass.
#
# THE CARRIER is Aegiochusmon: Blue BT25-025, which prints NO <Barrier> of its
# own, digivolved onto Aegiomon through its "[Digivolve] [Aegiomon]: Cost 3"
# condition (yellow Aegiomon fails the blue/black Lv.4 circles, so ONE route,
# one cost: no cost prompt). The only <Barrier> in play is the inherited one.
#
# THE LINE.
#   T1 (P0, 0): hard-play Aegiomon (5): 0 -> -5 (no [TS] Tamer in hand -> its
#       [On Play] is silent).
#   T2 (P1, 5): hard-play Phoenixmon ST1-10 (vanilla Lv.6, 12000): 5 -> -5.
#   T3 (P0, 5): digivolve Aegiochusmon onto Aegiomon (3): 5 -> 2. Its [When
#       Digivolving] (BT25-025#effect#3/#4) asks ONE mandatory pick: <De-
#       Digivolve 1> on Phoenixmon (no digivolution cards: nothing trashed);
#       security is 5 (> 3), so the unsuspend half is skipped. Aegiochusmon
#       attacks P1's security (Aegiomon was in play since the start of turn):
#       p1 stack[9] Biyomon ST1-02 (3000) loses. Aegiochusmon is SUSPENDED.
#       Pass -> P1 3.
#   T4 (P1, 3): Phoenixmon (12000) attacks the suspended Aegiochusmon (8000).
#       THE CLAUSE: it would be deleted in battle; P0 accepts the inherited
#       <Barrier>, trashing p0 stack[9] = Mervamon BT26-081, and it is NOT deleted.
#   Trailing P1 main-phase pass.
#
# WITNESS: p0.security 5 -> 4, BT26-081 in p0.trash, the Aegiochusmon stack
# (source Aegiomon) still on the field.
#
# WHY MERVAMON ON TOP OF SECURITY (not Jupitermon BT24-101): measured while
# authoring, our engine fires a security-TRASHED BT24-101's "[All Turns]
# [Once Per Turn] When your security stack is removed from, trash your
# opponent's top security card" FROM THE TRASH (P1's security went 4 -> 3,
# BT1-009 trashed) -- a suspected engine bug, reported separately. The
# `p1.security: 4` assert guards that nothing else rode the Barrier trash.
#
# PROMPT SHAPE: SelectPermanentEffect for the de-digivolve (one candidate;
# DCGO's pick is mandatory per BT25-025.yaml's crosscheck notes). Barrier:
# ours Replacement accept / DCGO OptionalSkill.
card: BT24-034
clause: BT24-034#inherited#0
seed: 424242
decks:
  p0:
    stack: [BT24-034, BT25-030, BT24-031, BT26-029, BT25-044,
            BT25-030, BT24-031, BT26-073, BT24-101, BT26-081,
            BT25-025, BT25-030, BT4-104, BT24-031, BT25-033]
    rest: ts-jupitermon
  p1:
    stack: [ST1-10, ST1-03, ST1-04, BT1-009, BT3-007,
            BT1-014, BT4-010, BT3-007, BT1-009, ST1-02,
            ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08]
    rest: tm-quiet-red
steps:
  # T1 (P0): hard-play Aegiomon (0 -> -5).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT24-034, from: hand } }
    expect: { prompt: main_phase }
  # T2 (P1, 5): Phoenixmon (5 -> -5).
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-10, from: hand } }
    expect: { prompt: main_phase }
  # T3 (P0, 5): Aegiochusmon onto Aegiomon (5 -> 2); WD de-digivolve; attack.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT25-025 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1, 3): Phoenixmon attacks the suspended Aegiochusmon.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { attack: { attacker: field.0, target: field.0 } }
    expect: { prompt: main_phase }
  # THE CLAUSE: accept the inherited <Barrier>.
  - actor: 0
    do: { select: { yes: true } }
    expect: { prompt: OptionalSkill }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 10
    that:
      p0.security: 5
      p1.security: 4
      p0.field:
        - { card_id: BT25-025, dp: 8000, suspended: true, sources: [BT24-034] }
  - at: 12
    that:
      turn: 4
      p0.security: 4
      p0.trash: [BT26-081]
      p1.security: 4
      p0.field:
        - { card_id: BT25-025, dp: 8000, suspended: true, sources: [BT24-034] }
      p1.field:
        - { card_id: ST1-10, dp: 12000, suspended: true, sources: [] }
