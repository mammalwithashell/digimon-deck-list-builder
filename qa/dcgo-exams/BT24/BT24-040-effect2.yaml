# Exam scenario: Venusmon (BT24-040), clause BT24-040#effect#2 --
# "[On Play] [When Digivolving] Trash all digivolution cards of 1 of your
#  opponent's Digimon. Then, until your opponent's turn ends, 2 of their
#  Digimon or Tamers can't suspend or activate [When Digivolving] effects."
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json (`bt26-ts-mervamon` vs
# `tm-quiet-red`). No variant.
#
# THE LINE (the [When Digivolving] branch; same opening as BT24-040-effect0):
#   T1 (P0, 0): hard-play Aegiochusmon: Dark BT26-073 (8): 0 -> -8; its cost
#       menu -> "Don't pay".
#   T2 (P1, 8): Agumon ST1-03 (3) -> 5; digivolve Birdramon ST1-05 onto it
#       (2) -> 3; Monodramon BT1-009 (2) -> 1; pass -> P0 3.
#   T3 (P0, 3): digivolve Venusmon onto BT26-073 ([TS] route, 3): 3 -> 0.
#       THE CLAUSE: pick Birdramon -> its only source Agumon ST1-03 is
#       trashed; lock #1 Birdramon, lock #2 Monodramon. Pass -> P1 3.
#   T4 (P1, 3): digivolve Garudamon ST1-08 onto the LOCKED Birdramon (3) ->
#       0. Garudamon's printed [When Digivolving] ("1 of your Digimon gets
#       +3000 DP for the turn") must NOT activate: no prompt, Garudamon stays
#       7000. Pass.
#
# WITNESS: at 10 Birdramon carries [ST1-03], P1 trash empty; at 15 Birdramon
# bare and ST1-03 in P1's trash (sources trashed); at 18 Garudamon at its
# printed 7000 with no WD pick asked (the "can't activate [When Digivolving]"
# half of the lock).
# PARTIAL: the "can't suspend" half of the lock is not witnessed -- an
# impossible attack/block cannot be scripted (it would not lower), and P1 has
# no blocker opportunity in this line. The [On Play] timing is not exercised
# here (BT24-040-effect1 hard-plays Venusmon and walks the same body against a
# sourceless board).
#
# PROMPT SHAPE: ours = THREE single SelectPermanentEffect picks (sources
# target, lock #1, lock #2 -- the YAML's three `select_opponent_permanent`).
# DCGO very likely asks the two locks as ONE SelectPermanentEffect with
# maxCount 2 (BT24-040.yaml carries no DCGO crosscheck notes; C# not readable
# here) -- a cardinality mismatch the oracle pass will surface at step 13.
# BT26-073's cost menu: sim_only `choice:` + dcgo_only generic_int 3 (guess;
# see BT24-040-effect0).
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
