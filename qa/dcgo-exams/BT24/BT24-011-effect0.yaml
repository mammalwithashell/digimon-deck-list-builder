# Exam scenario: Cyclonemon (BT24-011), clause BT24-011#effect#0 -- the special
# digivolution condition "Lv.3 w/[TS] trait: Cost 2".
# 
# DECK NOTE. Both seats use the ToyAgumon books' decks (`tm-toy-black` /
# `tm-quiet-red`, see BT25-064-effect0.yaml for the shell). Cyclonemon is red;
# it lives in the black shell only as the card under exam.
# 
# ISOLATION. Cyclonemon's printed circle is Red Lv.3 / cost 2. The base here is
# ToyAgumon BT25-064 -- BLACK, Lv.3, [TS] -- so the standard circle cannot apply
# and the T5 digivolve is legal ONLY through the special condition (BT24_011.cs:
# AddSelfDigivolutionRequirementStaticEffect(IsLevel3 && HasTSTraits, 2, ...)).
# The egg is purple Tsunomon BT24-007, itself [TS], so ToyAgumon reached the
# breeding area through its own special route (BT25-064-effect0.yaml).
# 
# WITNESS: the digivolve lowers; Cyclonemon stands over [ToyAgumon, Tsunomon] and
# P0 paid exactly 2 (memory 3 -> 1).
card: BT24-011
clause: BT24-011#effect#0
seed: 424242
decks:
  p0:
    stack: [BT25-064, BT24-011, BT8-061, BT2-052, BT3-059, BT3-067, BT5-066, BT2-064, BT4-065, BT2-052, BT2-056, BT3-067, BT5-066, BT2-064]
    rest: tm-toy-black
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08, BT4-014]
    rest: tm-quiet-red
steps:
  # T1 (P0): hatch; pass.
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1): nothing.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0): breeding-digivolve ToyAgumon (free).
  - actor: 0
    do: { digivolve: { from: breeding, using: BT25-064 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1): nothing.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, memory 3): promote; THE CLAUSE -- digivolve Cyclonemon off a black
  # [TS] Lv.3 for 2; pass.
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT24-011 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 10
    that:
      turn: 5
      p0.memory: 1
      p0.field:
        - card_id: BT24-011
          dp: 5000
          suspended: false
          sources: [BT24-007, BT25-064]
