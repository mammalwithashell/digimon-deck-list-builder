# Exam scenario: Venusmon (BT24-040), clause BT24-040#effect#1 --
# "When this card would be played, if you have 3 or fewer security cards,
#  reduce the play cost by 5."
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json (`bt26-ts-mervamon` vs
# `tm-quiet-red`). No variant.
#
# THE WITNESS is the memory delta of a HARD-PLAY at 3 security: Venusmon
# prints 12; reduced it costs 7, so P0's 3 memory goes to -4 (12 would be -9).
#
# THE LINE:
#   T1 (P0, 0): pass -> P1 3.
#   T2 (P1, 3): Monodramon BT1-009 (2) -> 1; Biyomon ST1-02 (2) -> -1 -> P0 1.
#   T3 (P0, 1): pass -> P1 3.
#   T4 (P1, 3): both attack P0's security. Top two security cards are
#       Coronamon BT25-008 (1000 DP, no [Security] effect): each loses its
#       battle and is trashed. P0 security 5 -> 3. Pass -> P0 3.
#   T5 (P0, 3): THE CLAUSE -- hard-play Venusmon for 12 - 5 = 7: 3 -> -4.
#       Its [On Play] (#effect#2) asks the sources pick (Monodramon; it has
#       none) and the two lock picks (Monodramon, Biyomon). Turn ends (-4).
#
# WITNESS: at 12 (before the play) memory 3, security 3, both Coronamon in
# trash; at 17 (P1's T6 breeding) memory -4 and Venusmon on the field.
# The >3-security negative case is not walked (one line); the before-state
# pins the condition true.
#
# PROMPT SHAPE: the reduction asks nothing on our side. DCGO's play-cost
# reduction for "when this card would be played" is normally a silent
# static cost modifier -- expected no row. [On Play]: three single
# SelectPermanentEffect picks on ours; DCGO likely asks the two locks as ONE
# maxCount-2 SelectPermanentEffect (see BT24-040-effect2).
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
