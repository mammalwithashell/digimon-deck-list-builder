# Exam scenario: Merukimon (BT24-051), clause BT24-051#effect#2 --
# "[On Play] [When Digivolving] Suspend 2 of your opponent's Digimon or
#  Tamers. Then, 1 of your Digimon may get +5000 DP for the turn and attack
#  your opponent's Digimon."
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json (`bt26-ts-mervamon` vs
# `tm-quiet-red`). No variant.
#
# THE LINE (the [When Digivolving] branch -- the [On Play] branch is walked,
# with the attack declined, in BT24-051-effect1):
#   T1 (P0, 0): hard-play Aegiochusmon: Dark BT26-073 (8) -> -8; cost menu ->
#       "Don't pay".
#   T2 (P1, 8): Agumon ST1-03 (3), Monodramon BT1-009 (2), Biyomon ST1-02
#       (2): 8 -> 1; pass -> P0 3.
#   T3 (P0, 3): digivolve Merukimon onto BT26-073 ([TS] route, 3) -> 0.
#       THE CLAUSE: suspend Agumon + Monodramon (Biyomon stays up); then
#       Merukimon takes +5000 (12000 -> 17000) and attacks the SUSPENDED
#       Agumon. Merukimon's [When Attacking] [OPT] unsuspend (#effect#3) is
#       offered and declined; the [When Digivolving] arm of the same clause is
#       then offered and accepted, unsuspending Merukimon. Agumon (2000) is
#       deleted; <Piercing> (granted by #effect#4 to [Iliad] Digimon) checks
#       security -- 2 cards, via BT26-073's inherited <Security A. +1>: P1
#       5 -> 3 (two Dracomon ST1-04 beaten).
#
# WITNESS: at 10 three unsuspended P1 Digimon; at 13 Agumon + Monodramon
# suspended, Biyomon not, Merukimon 12000 unsuspended; at 17 (end of the
# effect) Merukimon 17000 and unsuspended (it attacked, then the WD arm
# unsuspended it), Agumon in P1's trash, P1 security 3.
# PARTIAL: "Tamers" targets not walked (P1 has none); the decline branch of
# the optional attack is in BT24-051-effect1.
#
# PROMPT SHAPE: suspend = two single SelectPermanentEffect picks on ours;
# DCGO likely ONE maxCount-2 prompt (cardinality risk). Attacker pick =
# SelectPermanentEffect (canNoSelect); attack target = SelectAttackEffect
# (ours: kind Target, not sim-asserted). On the attack OUR engine now asks
# ONE prompt for Merukimon's [When Attacking] [OPT] unsuspend (#effect#3):
# a declinable OwnField pick (the clause is `optional: true` with a
# declinable first step, so no separate outer confirm) -- authored as the
# OptionalSkill fold (decline -> DCGO OptionalSkill "no"). Repaired
# 2026-10-04: before main's G-ENGINE-OPT-SPENT-TRIGGER-IN-TRIGGER-ORDER fix
# our engine stacked [BT24-051, BT24-051] in a TriggerOrder here (step 15
# `ordinal:` row); that row is gone. Re-authored 2026-10-04 after the
# G-ENGINE-OPT-DECLINE-CONSUMES-SIBLING-TIMING fix: declining the folded pick
# declines the activation (rules 15-9-2) and no longer records the [Once Per
# Turn] (15-14-1 counts activations; DCGO RemoveUse), so the still-pending
# [When Digivolving] entry of the same clause is offered next (step 16, the
# accept fold) and Merukimon ends unsuspended. Before the fix the decline
# spent the OPT and that entry was dropped silently. If DCGO does NOT
# re-offer the WD arm here, step 16 is the first divergence.
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
card: BT24-051
clause: BT24-051#effect#2
seed: 424242
decks:
  p0:
    stack: [BT26-073, BT24-051, BT25-008, BT25-022, BT24-034,
            BT25-008, BT25-022, BT24-031, BT25-034, BT26-067,
            BT24-102, BT24-102, BT25-022]
    rest: bt26-ts-mervamon
  p1:
    stack: [ST1-03, BT1-009, ST1-02, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, ST1-04, ST1-04, ST1-04, ST1-03, BT1-014]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT26-073, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { choice: "Don't pay", sim_only: true } }
  - actor: 0
    do: { select: { value: 3, dcgo_only: true } }
    expect: { prompt: generic_int }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-03, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { play: { card: BT1-009, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT24-051 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { select: { targets: [opp.field.1] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectAttackEffect }
  # Merukimon's [When Attacking] [OPT] unsuspend (#effect#3): ours = ONE
  # declinable OwnField pick (the clause's outer yes/no is folded into it);
  # the OptionalSkill marker emits DCGO's gate "no".
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: OptionalSkill }
  # The declined [When Attacking] arm did not spend the [Once Per Turn], so
  # the queued [When Digivolving] arm of the same clause is now offered:
  # accept it and unsuspend Merukimon (suspended by its attack). Fold marker
  # (`expect: OptionalSkill` on a pick) = DCGO OptionalSkill "yes" + the pick.
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: OptionalSkill }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 10
    that:
      turn: 3
      p0.memory: 3
      p1.field:
        - { card_id: BT1-009, dp: 3000, suspended: false, sources: [] }
        - { card_id: ST1-02, dp: 3000, suspended: false, sources: [] }
        - { card_id: ST1-03, dp: 2000, suspended: false, sources: [] }
  - at: 13
    that:
      turn: 3
      p0.memory: 0
      p0.field:
        - { card_id: BT24-051, dp: 12000, suspended: false, sources: [BT26-073] }
      p1.field:
        - { card_id: BT1-009, dp: 3000, suspended: true, sources: [] }
        - { card_id: ST1-02, dp: 3000, suspended: false, sources: [] }
        - { card_id: ST1-03, dp: 2000, suspended: true, sources: [] }
  - at: 17
    that:
      turn: 3
      p0.memory: 0
      p0.field:
        - { card_id: BT24-051, dp: 17000, suspended: false, sources: [BT26-073] }
      p1.field:
        - { card_id: BT1-009, dp: 3000, suspended: true, sources: [] }
        - { card_id: ST1-02, dp: 3000, suspended: false, sources: [] }
      p1.security: 3
      p1.trash: [ST1-03, ST1-04, ST1-04]
