# Exam scenario: Jupitermon (BT24-101), clause BT24-101#effect#0 -- the special
# digivolution condition "[Digivolve] Lv.5 w/[TS] trait: Cost 5".
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`).
#
# ISOLATION -- CORRECTED 2026-10-04: Jupitermon's printed circle is Yellow
# Lv.5 / cost 5, and its second special condition is "Lv.5 w/[Aegiochusmon]
# in name: Cost 1 per security card". The base here is P-213 -- RED Lv.5
# [Shaman/Iliad/TS] -- and P-213's card NAME IS "Aegiochusmon"
# (data/cards.json card_name_eng; BT24_101.cs's second route tests
# `TopCard.ContainsCardName("Aegiochusmon")`). So BOTH special routes apply:
# this clause (5) and effect#1's route (1 x 5 security = 5). The Yellow
# circle does not. The memory delta (exactly 5) is therefore consistent with
# either special route -- this line does NOT isolate effect#0 from effect#1
# while P0 sits at 5 security. (To isolate: a non-Aegiochusmon red/black
# [TS] Lv.5, or the same base at security != 5 with the cost choice
# answered 5.) No route prompt on DCGO's side: CardController.cs
# PlayCardClass SelectCost builds CostList, applies `.Distinct()`, and only
# opens SelectCountEffect for >= 2 DISTINCT costs -- {5, 5} -> one.
#
# THE LINE:
#   T1 (P0, memory 0): hard-play P-213 (cost 7: 0 -> -7; P-213 has no [On
#      Play] -- only [When Digivolving] -- and passive <Raid>/<Decode>).
#   T2 (P1, memory 7): all-pass -> P0 3.
#   T3 (P0, memory 3): THE CLAUSE -- digivolve Jupitermon over P-213 for 5:
#      3 -> -2 (digivolve draw stack[11]). Jupitermon's [When Digivolving]
#      (effect#2) then trashes P0's top security (5 -> 4); P1 has no Digimon
#      so its -13000 has no target; 4 > 1 so no Recovery. That security
#      removal fires effect#3 (trash P1's top security, 5 -> 4). The turn
#      passes to P1 at 2.
#
# WITNESS: memory 3 -> -2 (paid exactly 5); Jupitermon stands over P-213.
#
# PROMPT SHAPE: the digivolve itself asks nothing. Jupitermon's WD is
# mandatory and its -13000 target pick is empty here (no P1 Digimon):
# measured -- our engine asks nothing; VERIFIED DCGO skips it too:
# BT24_101.cs passes maxCount = min(1, candidates) and
# SelectPermanentEffect.active() returns false with zero candidates. The WD
# is non-optional (SetUpActivateClass(..., -1, false, ...)) -> no
# OptionalSkill. effect#3 (OnLoseSecurity, once per turn, isOptional false)
# is the only trigger stacked by the trash -> no MultipleSkills, no prompt.
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO --
# unconfirmed until the oracle pass.
card: BT24-101
clause: BT24-101#effect#0
seed: 424242
decks:
  p0:
    stack: [P-213, BT24-101, BT25-030, BT4-104, BT24-083,
            BT25-022, BT24-031, BT25-030, BT24-102, BT26-090,
            BT24-031, BT25-022, BT24-084]
    rest: ts-jupitermon
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014, BT4-010]
    rest: tm-quiet-red
steps:
  # T1 (P0, memory 0)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: P-213, from: hand } }
    expect: { prompt: main_phase }
  # T2 (P1, memory 7)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, memory 3)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  # THE CLAUSE: Jupitermon over the red [TS] Lv.5 for 5.
  - actor: 0
    do: { digivolve: { from: field.0, using: BT24-101 } }
    expect: { prompt: main_phase }
  # T4 (P1): trailing breeding decision.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 6
    that:
      turn: 4
      p0.memory: -2
      p0.field:
        - { card_id: BT24-101, dp: 13000, suspended: false, sources: [P-213] }
      p0.security: 4
      p1.security: 4
