# Exam scenario: Asuna Shiroki (BT24-088), clause BT24-088#effect#0 --
# "[Start of Your Turn] If you have 4 or less memory, by returning this Tamer to the
#  bottom of the deck, you may play 1 [Asuna Shiroki] or 1 level 4 or lower Digimon
#  card with the [TS] trait or [Three Musketeers] in its text from your trash without
#  paying the cost."
#
# THE LINE.
#   T1 (P0, memory 0): play Asuna #1 (memory 0 -> -3, which ends the turn once the
#            [On Play] resolves). That [On Play] (the other clause, exercised in
#            BT24-088-effect1.yaml) is used here only to SEED THE TRASH: the cost
#            trashes Asuna #2 -- a second BT24-088, which qualifies because it
#            carries the [TS] trait -- and draws 2. Two copies sit in the opening
#            hand, so the play is pinned to `hand.0`.
#   T2 (P1): nothing.
#   T3 (P0): memory is 3 (<= 4), so THE CLAUSE fires at the start of the turn:
#            accept, Asuna #1 goes to the deck bottom, and Asuna #2 is played from
#            the trash free -- the "[Asuna Shiroki]" name branch of the printed
#            text. Asuna #2's own [On Play] then triggers; it is ACCEPTED and paid
#            (Gazimon BT25-078, [TS], is trashed; 2 cards drawn) so that both
#            engines take the same, fully-specified branch.
#
# WHY THE REVIVED ASUNA'S [On Play] IS PAID RATHER THAN DECLINED. Sim-only showed
# that our engine draws 2 even when the "by trashing 1 card" cost is declined --
# BT24-088.yaml's `draw` is not gated on the pick, where BT24_088.cs draws only
# `if (discarded)`. That is a finding about clause #effect#1's body (recorded in
# NOTES-BT24-088.md); routing THIS line through the declined branch would let it
# surface here as a hand divergence attributed to the wrong clause.
#
# PROMPT SHAPE, from BT24_088.cs (Start of Your Turn region):
#   SetUpActivateClass(CanActivate: on battle area && memory <= 4, ..., -1, TRUE)
#   -> OptionalSkill gate. Then DeckBouncePeremanentAndProcessAccordingToResult
#   (no prompt), then on success a SelectCardEffect over the trash (maxCount 1,
#   canNoSelect: () => true, Root.Trash), then PlayPermanentCards(activateETB: true).
#   Our YAML: `optional: true` whose FIRST body step is the mandatory
#   `activation_cost` (return self to deck bottom) -> our engine parks a
#   single-candidate declinable TriggerOrder that lines up 1:1 with DCGO's
#   OptionalSkill, then the declinable `select_trash` lines up with the
#   SelectCardEffect. The revived Asuna's [On Play] is the `optional_gate_fold`
#   again (see BT24-088-effect1.yaml).
card: BT24-088
clause: BT24-088#effect#0
seed: 424242
decks:
  p0:
    # stack[10..11]: the T1 [On Play] draws; [12]: the T3 draw; [13..14]: the
    # revived Asuna's [On Play] draws.
    stack: [BT24-088, BT24-088, BT25-078, BT21-074, BT21-074,
            BT25-082, BT25-082, BT25-082, BT25-082, BT25-085,
            BT25-083, BT25-083, BT25-083, BT25-092, BT25-092]
    rest: three-musketeers
  p1:
    stack: [ST1-02, ST1-03, ST1-04, BT1-009, BT3-007,
            ST1-05, ST1-05, ST1-05, ST1-05, BT1-014]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0): no hatch; play Asuna #1 (pinned: two copies in hand).
  # Memory 0 -> -3.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT24-088, from: hand.0 } }
    expect: { prompt: main_phase }
  # Asuna #1's [On Play] (fold: OptionalSkill yes + hand pick): trash Asuna #2 as
  # the cost -- it has the [TS] trait -- and <Draw 2>. This seeds the trash. The
  # turn then ends on memory -3.
  - actor: 0
    do: { select: { cards: [BT24-088] } }
    expect: { prompt: OptionalSkill }
  # T2 (P1): nothing.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, memory 3): THE CLAUSE fires at the start of the turn. Accept the gate:
  # Asuna #1 returns to the deck bottom.
  - actor: 0
    do: { select: { yes: true } }
    expect: { prompt: OptionalSkill }
  # Pick Asuna #2 from the trash; it is played without paying the cost.
  - actor: 0
    do: { select: { cards: [BT24-088] } }
    expect: { prompt: SelectCardEffect }
  # Asuna #2's [On Play] (fold): pay it -- trash Gazimon (BT25-078, [TS]), draw 2.
  - actor: 0
    do: { select: { cards: [BT25-078] } }
    expect: { prompt: OptionalSkill }
  # The breeding area is empty (an egg can hatch), so the breeding decision is
  # asked; then the Main phase. One step past the clause.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  # Pre-step state of the trailing Main-phase pass on turn 3: one Asuna Shiroki on
  # the field (the revived #2; a Tamer projects dp -1); the trash holds ONLY the
  # Gazimon paid for the revived Asuna's [On Play] -- Asuna #2 left the trash and
  # Asuna #1 went to the deck bottom, not the trash; memory untouched at 3 (played
  # free); the hand is the opening five minus both Asunas and Gazimon, plus the
  # two T1 draws, the T3 draw and the two T3 [On Play] draws.
  - at: 9
    that:
      turn: 3
      p0.memory: 3
      p0.hand: [BT21-074, BT21-074, BT25-083, BT25-083, BT25-083, BT25-092, BT25-092]
      p0.trash: [BT25-078]
      p0.field:
        - card_id: BT24-088
          dp: -1
          suspended: false
          sources: []
