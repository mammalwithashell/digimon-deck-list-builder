# Exam scenario: Homeros (BT24-102), clause BT24-102#effect#0 --
# "[Start of Your Main Phase] Gain 1 memory. Then, if you have 5 or more
#  memory, suspend this Tamer and <Draw 1>."
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`).
#
# THE LINE (drives the "5 or more" branch, not just the +1):
#   T1 (P0, 0): hard-play Homeros (5): 0 -> -5 -> P1 5.
#   T2 (P1, 5): hard-play Phoenixmon ST1-10 (vanilla, 10): 5 -> -5 -> P0 5.
#   T3 (P0, 5): draw stack[10] (BT25-033); breeding pass; [Start of Your Main
#            Phase] THE CLAUSE: +1 memory (5 -> 6); 6 >= 5 -> Homeros suspends
#            and P0 draws stack[11] (BT24-084).
#
# WITNESS (asked at P0's first main-phase decision on T3): p0.memory 6,
# Homeros suspended, BT24-084 in hand.
#
# PROMPT SHAPE (VERIFIED against DCGO C# 2026-10-04): BT24/White/BT24_102.cs
# OnStartMainPhase region is `SetUpActivateClass(..., -1, false, ...)` --
# mandatory -> no OptionalSkill; body is AddMemory(1) then, at
# MemoryForPlayer >= 5, SuspendPermanentsClass + DrawClass -- no selection. It
# is P0's only SOMP trigger -> MultipleSkills short-circuits at 1 active skill
# (MultipleSkills.cs `skillInfos_active.Count == 1`), no row.
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO --
# unconfirmed until the oracle pass.
# FIXED 2026-10-04 (G-CARD-BY-X-GATE-NEEDS-PAYOFF): Homeros' [End of Your
# Turn] gate now opens whenever it can suspend, so T1's end carries a shared
# declined OptionalSkill row (asserts shifted +1).
card: BT24-102
clause: BT24-102#effect#0
seed: 424242
decks:
  p0:
    stack: [BT24-102, BT24-034, BT25-030, BT24-101, BT26-090,
            BT25-022, BT24-083, BT26-029, BT25-033, BT24-031,
            BT25-033, BT24-084, BT4-104, BT25-030, BT24-034]
    rest: ts-jupitermon
  p1:
    stack: [ST1-10, ST1-04, BT1-009, BT3-007, ST1-08,
            BT1-014, BT4-010, BT3-007, BT1-009, ST1-02,
            ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08, BT4-014]
    rest: tm-quiet-red
steps:
  # T1 (P0, 0): Homeros -> -5.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT24-102, from: hand } }
    expect: { prompt: main_phase }
  # T1's end (memory -5): Homeros [End of Your Turn] "By suspending this
  # Tamer" OptionalSkill gate -- offered with no [Olympos XII] Digimon
  # (BT24_102.cs:121-135, §15-7-5); declined.
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: OptionalSkill }
  # T2 (P1, 5): Phoenixmon -> -5.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-10, from: hand } }
    expect: { prompt: main_phase }
  # T3 (P0, 5): breeding pass; THE CLAUSE resolves at Start of Main.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  # Start of T3, before Start of Main: 5 memory, Homeros unsuspended.
  - at: 5
    that:
      turn: 3
      p0.memory: 5
      p0.field:
        - { card_id: BT24-102, dp: -1, suspended: false, sources: [] }
  # First main-phase decision of T3: +1 memory, suspended, drew BT24-084.
  - at: 6
    that:
      turn: 3
      p0.memory: 6
      p0.hand: [BT24-034, BT25-030, BT24-101, BT26-090, BT25-033, BT24-084]
      p0.field:
        - { card_id: BT24-102, dp: -1, suspended: true, sources: [] }
