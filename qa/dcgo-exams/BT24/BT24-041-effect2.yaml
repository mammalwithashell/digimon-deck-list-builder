# Exam scenario: Minervamon (BT24-041), clause BT24-041#effect#2 --
# "[On Play] [When Digivolving] [On Deletion] You may play 1 play cost 5 or
#  lower [Iliad] trait card from your hand without paying the cost. Then, to
#  1 of your opponent's Digimon, <De-Digivolve 1> for each of your Digimon."
#  (the [On Play] arm, both halves live)
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). PROVISIONAL: assert block is our engine's result, not
# backfilled from DCGO -- unconfirmed until the oracle pass.
#
# THE LINE.
#   T1 (P0, 0): hard-play Aegiomon BT24-034 (5): 0 -> -5 (silent on OUR side:
#       no [TS] Tamer in hand; DCGO asks it -- dcgo_only decline row).
#   T2 (P1, 5): Biyomon ST1-02 (2): 5 -> 3; digivolve Birdramon ST1-05 (2):
#       3 -> 1; digivolve Garudamon ST1-08 (3): 1 -> -2 (P1 has one Digimon
#       -> slot-safe). Garudamon's own [When Digivolving] "+3000 DP to 1 of
#       your Digimon" asks P1 one pick (itself; it expires with the turn).
#       -> P0 2.
#   T3 (P0, 2): hard-play Minervamon for 12 - 5 = 7 (#effect#1): 2 -> -5.
#       THE CLAUSE:
#         (a) "you may play" -> P0 plays Elecmon BT25-030 (cost 3, [Iliad],
#             no [On Play]) from hand for free -- the ONLY play-cost <=5
#             [Iliad] card in hand at that moment;
#         (b) P0 now has THREE Digimon (Aegiomon, Minervamon, Elecmon), so
#             Garudamon takes <De-Digivolve 3>: Garudamon AND Birdramon are
#             trashed and it stops at Biyomon (Lv.3 -- "can't trash past
#             level 3"). A count of 1 would have left Birdramon; the TWO
#             trashed cards are what pin "for each of your Digimon".
#       -> P1 5.
#   Trailing P1 breeding pass.
#
# WITNESS: Elecmon on P0's field with memory still -5 (free play), P1's
# field = bare Biyomon, Birdramon + Garudamon in p1.trash.
#
# PROMPT SHAPE: ours = an optional Hand pick (SelectHandEffect; the "may"
# folds into the declinable pick) then ONE mandatory OppField pick
# (SelectPermanentEffect). DCGO -- VERIFIED (2026-10-04): BT24_041.cs registers [On Play]/[When
# Digivolving]/[On Deletion] with SetUpActivateClass(..., -1, false, ...) --
# NOT optional, so no OptionalSkill; the "you may" lives in the
# SelectHandEffect (canNoSelect true) whose maxCount is
# min(1, HandCards.Count(play cost <= 5 [Iliad] & CanPlayAsNewPermanent)),
# and SelectHandEffect.active() returns false at maxCount <= 0 -> NO hand
# row when nothing qualifies. Then, if the opponent has a Digimon, ONE
# SelectPermanentEffect (maxCount 1, canNoSelect false) whose callback runs
# IDegeneration(permanent, 1) once per own battle-area Digimon (count taken
# AFTER the free play).
# So: SelectHandEffect (Elecmon the only candidate) then SelectPermanentEffect
# -- 1:1 with ours, no OptionalSkill. Elecmon BT25-030 is played with
# activateETB: true but has no [On Play] (its triggers are [Start of Your
# Main Phase] and inherited [When Attacking]). Garudamon ST1_08.cs's WD is
# non-optional with one SelectPermanentEffect (verified). The count of 3
# exceeds the trashable depth (2) and is clamped at Lv.3 by the rule (16-11).
# FIXED 2026-10-04 (G-CARD-BY-X-GATE-NEEDS-PAYOFF): BT24-034.yaml now gates
# Aegiomon's [When Moving]/[On Play]/[When Digivolving] on security > 0 only
# (BT24_034.cs SharedCanActivateCondition; §15-7-5), so our engine asks the
# same OptionalSkill as DCGO: the former `dcgo_only` decline row(s) for that
# gate are shared rows now. (Header text below predates the fix.)
card: BT24-041
clause: BT24-041#effect#2
seed: 424242
decks:
  p0:
    stack: [BT24-034, BT24-041, BT25-030, BT26-029, BT26-081,
            BT25-030, BT24-031, BT26-073, BT26-081, BT24-101,
            BT26-103, BT26-083, BT24-031, BT25-033, BT25-030]
    rest: ts-jupitermon
  p1:
    stack: [ST1-02, ST1-05, ST1-08, BT1-009, BT3-007,
            BT1-014, BT4-010, BT3-007, ST1-02, BT1-009,
            ST1-03, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT24-034, from: hand } }
    expect: { prompt: main_phase }
  # Aegiomon BT24-034's [On Play] OptionalSkill (shared since the
  # 2026-10-04 fix: both engines gate on security > 0 only), declined.
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: OptionalSkill }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { digivolve: { from: field.0, using: ST1-05 } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { digivolve: { from: field.0, using: ST1-08 } }
    expect: { prompt: main_phase }
  # Garudamon's own [When Digivolving]: +3000 DP to 1 of P1's Digimon (itself).
  - actor: 1
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT24-041, from: hand } }
    expect: { prompt: main_phase }
  # THE CLAUSE (a): play Elecmon from hand for free.
  - actor: 0
    do: { select: { cards: [BT25-030] } }
    expect: { prompt: SelectHandEffect }
  # THE CLAUSE (b): <De-Digivolve 1> x 3 on Birdramon.
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 8
    that:
      p0.memory: 2
      p1.field:
        - { card_id: ST1-08, dp: 7000, suspended: false, sources: [ST1-02, ST1-05] }
  - at: 12
    that:
      turn: 4
      p0.memory: -5
      p0.field:
        - { card_id: BT24-034, dp: 5000, suspended: false, sources: [] }
        - { card_id: BT24-041, dp: 12000, suspended: false, sources: [] }
        - { card_id: BT25-030, dp: 2000, suspended: false, sources: [] }
      p1.field:
        - { card_id: ST1-02, dp: 3000, suspended: false, sources: [] }
      p1.trash: [ST1-05, ST1-08]
