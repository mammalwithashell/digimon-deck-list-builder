# Exam scenario: Elecmon (BT24-031), clause BT24-031#effect#0 -- the special
# digivolution condition "[Digivolve] Lv.2 w/[TS] trait: Cost 0".
#
# Book: EXTRA book qa/dcgo-exams/BT24/tsj_extra_BT24-031.json, deck
# `tsj-bt24-031-pagumon` = the `ts-jupitermon` main deck verbatim (50) with
# the eggs swapped to 4x Pagumon BT25-005 (BLACK Lv.2, [Lesser/Iliad/TS]).
# P1 = `tm-quiet-red` from ts_jupitermon_pool.json. (Run sim-only with the
# extra book merged into the pool; the orchestrator merges it.)
#
# WHY THE EXTRA BOOK (isolation): Elecmon's only printed circle is Yellow
# Lv.2 / cost 0. ts-jupitermon's own eggs are YELLOW Tsunomon BT24-003, which
# satisfy the circle AND the [TS] condition at the same cost -- so a digivolve
# off Tsunomon cannot tell the special condition from the circle. A BLACK
# [TS] Lv.2 fails the Yellow circle, so the digivolve below is legal ONLY via
# "[Digivolve] Lv.2 w/[TS] trait: Cost 0" (single route => no route prompt).
# Pagumon's inherited trigger keys on [Three Musketeers] cards entering its
# sources -- inert here.
#
# THE LINE:
#   T1 (P0, memory 0): hatch Pagumon; THE CLAUSE -- digivolve Elecmon over it
#      in breeding for 0 (memory stays 0, P0 keeps the turn; digivolve draw =
#      stack[10]). Elecmon's [On Play] does not fire on a digivolve. Pass.
#   T2 (P1): all-pass -> P0 3.
#   T3 (P0): move the stack out so its sources are assertable; pass.
#
# WITNESS: after the digivolve, P0 is still in main at memory 0 holding the
# pinned stack[10] draw; on T3 the battle area holds Elecmon over Pagumon.
#
# PROMPT SHAPE: no selection on our side. VERIFIED (DCGO C#, 2026-10-04): none
# on DCGO's either -- BT24_031.cs's alt condition is a plain
# AddSelfDigivolutionRequirementStaticEffect (Lv.2 + [TS], cost 0); a BLACK
# Pagumon fails the Yellow circle so CostList has ONE entry and
# CardController.cs PlayCardClass SelectCost takes it without a
# SelectCountEffect. Elecmon's [On Play] needs CanTriggerOnPlay (not a
# digivolve); Pagumon BT25-005's only trigger is OnAddDigivolutionCards for
# [Three Musketeers] cards -- inert.
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO --
# unconfirmed until the oracle pass.
card: BT24-031
clause: BT24-031#effect#0
seed: 424242
decks:
  p0:
    stack: [BT24-031, BT24-034, BT25-030, BT24-101, BT26-090,
            BT25-022, BT24-083, BT26-029, BT24-102, BT26-092,
            BT24-084, BT25-033, BT4-104]
    rest: tsj-bt24-031-pagumon
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014, BT4-010]
    rest: tm-quiet-red
steps:
  # T1 (P0, memory 0)
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  # THE CLAUSE: Elecmon over the black [TS] Lv.2 for 0.
  - actor: 0
    do: { digivolve: { from: breeding, using: BT24-031 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, memory 3)
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 2
    that:
      turn: 1
      p0.memory: 0
      p0.hand: [BT24-034, BT25-030, BT24-101, BT26-090, BT24-084]
      p0.field: []
  - at: 6
    that:
      turn: 3
      p0.memory: 3
      p0.field:
        - { card_id: BT24-031, dp: 1000, suspended: false, sources: [BT25-005] }
