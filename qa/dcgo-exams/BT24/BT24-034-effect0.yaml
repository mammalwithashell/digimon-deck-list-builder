# Exam scenario: Aegiomon (BT24-034), clause BT24-034#effect#0 --
# the special digivolution condition "[Digivolve] [Elecmon]/Lv.3 w/[TS]
# trait: Cost 2".
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). PROVISIONAL: assert block is our engine's result, not
# backfilled from DCGO -- unconfirmed until the oracle pass.
#
# WHY LUNAMON. Aegiomon's printed circle is Yellow Lv.3 / cost 2 -- the same
# cost as the alt condition -- so digivolving onto a yellow Elecmon cannot
# attribute the cost to the alt path. Lunamon BT25-022 is a BLUE Lv.3 with the
# [TS] trait: the printed yellow circle does not accept it, so the ONLY route
# that makes the digivolve legal is "Lv.3 w/[TS] trait: Cost 2". One route,
# one cost -> no cost-choice prompt on either side.
#
# THE LINE.
#   T1 (P0, 0): hard-play Lunamon (3): 0 -> -3. Its [On Play] reveals
#       stack[10..12] = BT25-033 Aegiomon / BT25-030 Elecmon / BT4-104 Blinding
#       Ray: [Iliad] bucket -> BT25-033, [TS] bucket -> BT25-030, Blinding Ray
#       to the bottom (OrderedPermutation N=1, sim-only row).
#   T2 (P1, 3): pass -> P0 3.
#   T3 (P0, 3): THE CLAUSE -- digivolve Aegiomon BT24-034 onto Lunamon for 2:
#       3 -> 1. Aegiomon's own [When Digivolving] (#effect#2): ours is gated
#       on a [TS] Tamer in hand (none) and stays silent; DCGO asks it anyway
#       (see PREDICTED DIVERGENCE) -> a dcgo_only decline row.
#   Trailing pass -> P1.
#
# WITNESS: p0.memory 3 -> 1 (the alt cost is exactly 2) and Aegiomon on the
# field with Lunamon as its only source.
#
# PROMPT SHAPE: two SelectCardEffect bucket picks for Lunamon's reveal
# (RevealBucket; DCGO adds per bucket -- a one-field p0.hand diff on the 2nd
# pick row is the documented DCGO quirk), one sim-only bottom row; the
# digivolve itself asks nothing. VERIFIED (DCGO C#, 2026-10-04): Lunamon
# BT25_022.cs = SimplifiedRevealDeckTopCardsAndSelect, 2 conditions, no
# canNoAction -> no leading generic_bool, one SelectCardEffect per bucket, a
# 1-card remainder is bottomed with no prompt (RevealLibrary.cs). Single cost
# route (BT24_034.cs alt condition, cost 2; Blue Lunamon fails the Yellow
# circle) -> no SelectCountEffect (CardController.cs SelectCost).
#
# PREDICTED DIVERGENCE (prompt only on this line; DCGO C# read 2026-10-04):
# BT24_034.cs gates Aegiomon's [When Moving]/[On Play]/[When Digivolving] on
# `IsExistOnBattleAreaDigimon && SecurityCards.Count() > 0` ONLY, asks it as
# an OptionalSkill (isOptional true), pays the cost (top security -> hand)
# and only THEN looks for a [TS] Tamer in hand (`HandCards.Count(ValidTamer)
# >= 1` -> SelectHandEffect, canNoSelect true). Our BT24-034.yaml requires a
# [TS] Tamer in hand BEFORE the cost (`condition: count_gte ... kind: tamer`)
# and is silent otherwise. Rules side with DCGO: digest.md 15-7 ("By X, Y" --
# the player may choose X even if the result can't be executed, 15-7-5), and
# a [TS] Tamer that arrives FROM the security card is playable in DCGO but
# not in ours. The DCGO gate is carried as a `dcgo_only` decline row; the
# end state is unchanged (declined).
card: BT24-034
clause: BT24-034#effect#0
seed: 424242
decks:
  p0:
    stack: [BT25-022, BT24-034, BT25-030, BT24-031, BT26-029,
            BT25-030, BT24-031, BT25-044, BT26-081, BT24-101,
            BT25-033, BT25-030, BT4-104, BT24-031, BT26-073]
    rest: ts-jupitermon
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08, BT4-014]
    rest: tm-quiet-red
steps:
  # T1 (P0): decline breeding; hard-play Lunamon (0 -> -3).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT25-022, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { cards: [BT25-033] } }
    expect: { prompt: SelectCardEffect }
  - actor: 0
    do: { select: { cards: [BT25-030] } }
    expect: { prompt: SelectCardEffect }
  # SIM-ONLY: the single leftover to the deck bottom (OrderedPermutation N=1).
  - actor: 0
    do: { select: { cards: [BT4-104], sim_only: true } }
  # T2 (P1, 3): pass -> P0 3.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, 3): THE CLAUSE -- Aegiomon onto blue Lunamon via the [TS] path.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT24-034 } }
    expect: { prompt: main_phase }
  # DCGO-ONLY: Aegiomon BT24-034's [When Digivolving] OptionalSkill, declined. BT24_034.cs
  # SharedCanActivateCondition checks only `SecurityCards.Count() > 0` (no
  # [TS]-Tamer-in-hand gate, unlike our BT24-034.yaml `condition`), and the
  # effect is optional (SetUpActivateClass(..., -1, true, ...)) -> DCGO asks;
  # our engine is silent.
  - actor: 0
    do: { select: { decline: true, dcgo_only: true } }
    expect: { prompt: OptionalSkill }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 10
    that:
      turn: 3
      p0.memory: 1
      p0.field:
        - { card_id: BT24-034, dp: 5000, suspended: false, sources: [BT25-022] }
