# Exam scenario: Jupitermon (BT24-101), clause BT24-101#effect#1 -- the special
# digivolution condition "[Digivolve] Lv.5 w/[Aegiochusmon] in name: Cost 1
# for each of your security cards".
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`).
#
# BASE: Aegiochusmon: Blue BT25-025 -- BLUE/BLACK Lv.5 [Shaman/Iliad/TS], so
# Jupitermon's Yellow Lv.5 circle does NOT apply. It is [TS], so effect#0's
# "Lv.5 w/[TS]: Cost 5" route DOES also apply. To make THIS clause's cost
# observable and different from 5, P0's security is first brought to 4 by an
# opponent attack, so this route costs 4 vs the [TS] route's 5.
#
# THE LINE:
#   T1 (P0, memory 0): hard-play BT25-025 (cost 8: 0 -> -8). Its [On Play]
#      (<De-Digivolve 1> 1 opp Digimon; then unsuspend at <= 3 security) has
#      no target / does not apply.
#   T2 (P1, memory 8): play Biyomon ST1-02 (vanilla 3000, cost 2); pass ->
#      P0 3.
#   T3 (P0, memory 3): pass everything -> P1 3.
#   T4 (P1, memory 3): Biyomon attacks P0's security. BT25-025 has <Blocker>:
#      P0 declines the block. The check flips stack[9] = BT25-030 Elecmon (2000
#      DP, no [Security] effect), which loses and is trashed: P0 security 4.
#   T5 (P0, memory 3): THE CLAUSE -- digivolve Jupitermon over Aegiochusmon:
#      Blue via the Aegiochusmon route at 1 x 4 security = 4: 3 -> -1.
#      Jupitermon's [When Digivolving] then trashes P0's top security (4 -> 3),
#      gives Biyomon -13000 (deleted), no Recovery (3 > 1); effect#3 trashes
#      P1's top security (5 -> 4); BT25-025's inherited unsuspend is
#      declined. Turn passes to P1 at 1.
#
# WITNESS: memory 3 -> -1 (paid exactly 4 = 1 per security card, not the
# [TS] route's 5); Jupitermon stands over BT25-025.
#
# PROMPT SHAPE: our engine asks an EffectChoice "Choose which digivolution
# cost to pay" between the two applicable special conditions (4 vs 5),
# answered by VALUE 4 against DCGO's SelectCountEffect (the documented
# digivolution-cost route mapping, as EX12-076-effect5.yaml).
#
# VERIFIED against DCGO C# (2026-10-04):
#   * Cost route: CardController.cs PlayCardClass SelectCost -> CostList
#     {5 ([TS] route), 4 (Aegiochusmon route, CostEquation =
#     SecurityCards.Count)}, Distinct -> 2 entries -> SelectCountEffect
#     ("Which digivolution cost do you pay?"), still raised under the harness;
#     SelectCountEffect.SetCount's hook takes select_value as the cost VALUE.
#     DCGO does NOT auto-take the cheapest route.
#   * T4 block decline: AttackProcess.cs BlockTiming -> SelectPermanentEffect
#     (canNoSelect true) -> select_cancel. BT25-025's "[All Turns] ... may
#     unsuspend" is INHERITED (SetIsInheritedEffect(true)) and dead while it is
#     the top card, so the T4 security loss stacks nothing.
#   * WD order: BT24_101.cs trashes the top security FIRST (IDestroySecurity),
#     then the -13000 SelectPermanentEffect (canNoSelect false), then the
#     Recovery check -- same order as ours.
#   * The trash stacks TWO OnLoseSecurity triggers (BT24-101 effect#3 and the
#     now-inherited BT25-025 one) -> MultipleSkills (2 active, not the
#     hand/optional "blast" shape) with candidates [BT24-101, BT25-025]
#     (EffectSourceCard ids; order is DCGO's) -- answered by identity.
#   * The inherited unsuspend is NON-optional (SetUpActivateClass(..., 1,
#     false, ...)): no OptionalSkill. Its CanActivate only needs an own
#     [Shaman] Digimon (Jupitermon qualifies while unsuspended), so DCGO
#     opens a SelectPermanentEffect (Mode.UnTap, canNoSelect TRUE) -> the
#     decline row; a declined pick calls RemoveUse().
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO --
# unconfirmed until the oracle pass.
card: BT24-101
clause: BT24-101#effect#1
seed: 424242
decks:
  p0:
    stack: [BT25-025, BT24-101, BT4-104, BT24-083, BT25-022,
            BT24-031, BT25-022, BT24-102, BT26-090, BT25-030,
            BT24-084, BT24-031, BT25-030, BT24-083]
    rest: ts-jupitermon
  p1:
    stack: [ST1-02, ST1-04, BT1-009, BT3-007, ST1-08,
            BT1-014, BT4-010, BT3-007, BT1-009, BT4-014,
            ST1-04, ST1-03, BT1-014]
    rest: tm-quiet-red
steps:
  # T1 (P0, memory 0)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT25-025, from: hand } }
    expect: { prompt: main_phase }
  # T2 (P1, memory 8)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, memory 3)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1, memory 3): attack -> P0 security 5 -> 4.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  # P0 declines to block with BT25-025's <Blocker>.
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, memory 3)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  # THE CLAUSE: Jupitermon over Aegiochusmon: Blue for 1 x 4 security.
  - actor: 0
    do: { digivolve: { from: field.0, using: BT24-101 } }
    expect: { prompt: main_phase }
  # The cost-route choice: THIS clause (1 x 4 security = 4) vs effect#0's
  # [TS] route (5). Answered by VALUE.
  - actor: 0
    do: { select: { value: 4 } }
    expect: { prompt: SelectCountEffect }
  # Jupitermon's [When Digivolving] (effect#2): -13000 on Biyomon.
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # The WD's security trash fires TWO triggers: Jupitermon's effect#3 and the
  # now-inherited BT25-025 "[All Turns][OPT] When your security stack is
  # removed from, 1 of your [Shaman] Digimon may unsuspend". effect#3 first.
  - actor: 0
    do: { select: { cards: [BT24-101] } }
    expect: { prompt: MultipleSkills }
  # BT25-025's inherited unsuspend: Jupitermon is not suspended -- declined.
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 10
    that:
      turn: 4
      p0.security: 4
      p0.trash: [BT25-030]
  - at: 17
    that:
      turn: 6
      p0.memory: -1
      p0.security: 3
      p1.security: 4
      p1.field: []
      p0.field:
        - { card_id: BT24-101, dp: 13000, suspended: false, sources: [BT25-025] }
