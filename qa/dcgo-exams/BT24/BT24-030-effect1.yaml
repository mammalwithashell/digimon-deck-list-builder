# Exam scenario: Neptunemon (BT24-030), clause BT24-030#effect#1 -- "When this
# card would be played, if your opponent has 2 or more Digimon, reduce the play
# cost by 5."
# 
# DECK NOTE. `tm-neptune` is a black vanilla shell (Hagurumon/Commandramon/Numemon/
# Tankmon/WaruMonzaemon/Megadramon BT2-060/HiAndromon/Gotsumon/Bearmon -- no printed
# text) carrying 4x Neptunemon BT24-030, 4x Aegiochusmon BT24-014 (red/yellow Lv.5 [TS]),
# 4x Thundermon BT8-061 (black Lv.4 vanilla) and 4x ToyAgumon BT25-064; eggs 4x
# Pagumon BT25-005 (black [TS] Lv.2 whose inherited trigger needs a [Three
# Musketeers] card placed under it -- never here). `tm-quiet-red` is the quiet ST1
# shell plus 4x Tai Kamiya ST1-12 and 4x Gaia Force ST1-16.
# 
# THE LADDER. P1 fields TWO vanillas so the reduction condition ("if your opponent
# has 2 or more Digimon") holds: Phoenixmon ST1-10 on T2 (10 from 3 -> -7, handing
# P0 7 -- unused, P0 just passes) and Fugamon BT4-010 on T4 (3 from 3 -> 0, then
# pass -> P0 3). On T5 P0 hard-plays Neptunemon from memory 3: the mask admits the
# play against the PRINTED 12 (3 - 12 = -9 >= -10) and the reduction is applied at
# pay time.
# 
# MANDATORY on both sides (DCGO: MandatorySelfPlayCostReduction(5, card, Condition);
# ours: cost_reduction before_pay_cost) -- no prompt.
# 
# WITNESS: memory. Neptunemon's printed cost is 12, so an unreduced play from 3
# would read -9 (or clamp at -10). The reduced play costs 7: p0.memory reads -4 at
# the trailing step, i.e. P1 holds 4.
# 
# (The [On Play] that fires on this same play returns both of P1's Digimon to the
# deck bottom -- measured in BT24-030-effect2.yaml; this file pins only the memory.)
card: BT24-030
clause: BT24-030#effect#1
seed: 424242
decks:
  p0:
    stack: [BT24-030, BT2-052, BT3-059, BT2-056, BT3-067, BT5-066, BT2-064, BT4-065, BT2-052, BT3-059, BT2-056, BT3-067, BT5-066]
    rest: tm-neptune
  p1:
    stack: [ST1-10, BT4-010, ST1-03, ST1-04, BT1-009, BT1-014, BT3-007, BT1-009, BT4-014, ST1-02, BT3-007, ST1-04, ST1-03, BT1-014, ST1-05, ST1-08]
    rest: tm-quiet-red
steps:
  # T1 (P0): decline breeding; pass -> P1 3.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, memory 3): decline breeding; Phoenixmon (10 -> -7) -> P0 7.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-10, from: hand } }
    expect: { prompt: main_phase }
  # T3 (P0, memory 7): nothing -> P1 3.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1, memory 3): decline breeding; Fugamon BT4-010 (3 -> 0); pass -> P0 3.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: BT4-010, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, memory 3): decline breeding; THE CLAUSE -- play Neptunemon.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT24-030, from: hand } }
    expect: { prompt: main_phase }
  # T6 (P1): trailing breeding decision.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 11
    that:
      turn: 6
      p0.memory: -4
      p0.field:
        - card_id: BT24-030
          dp: 12000
          suspended: false
          sources: []
