# Exam scenario: Homeros (BT24-102), clause BT24-102#effect#2 --
# "[Security] Play this card without paying the cost."
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`).
#
# THE LINE: Homeros is stacked as P0's TOP security card (stack[9]).
#   T1 (P0, 0): pass -> P1 3.
#   T2 (P1, 3): Biyomon ST1-02 (vanilla, 2): 3 -> 1; pass -> P0 3.
#   T3 (P0, 3): pass -> P1 3.
#   T4 (P1, 3): Biyomon attacks security -> THE CLAUSE: Homeros is checked and
#            played to P0's battle area for free; then P1 passes -> P0 3.
#
# WITNESS: after the attack, p0.field holds Homeros (unsuspended), p0.security
# is 4, and the gauge did not move (P1 still holds 3: p0.memory -3).
#
# PROMPT SHAPE (VERIFIED against DCGO C# 2026-10-04): the [Security] effect
# is CardEffectFactory.PlaySelfTamerSecurityEffect (CardEffectFactory.cs:132)
# -- `SetUpActivateClass(..., false, ...)`, mandatory, body PlayPermanentCards
# with payCost false -> no OptionalSkill, no selection. AttackProcess.cs
# CounterTiming stacks only OnCounterTiming effects (none in P0's pool) and
# BlockTiming opens SelectPermanentEffect only when a Blocker exists (P0's
# field is empty) -> DCGO logs nothing between the attack and P1's pass.
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO --
# unconfirmed until the oracle pass.
card: BT24-102
clause: BT24-102#effect#2
seed: 424242
decks:
  p0:
    stack: [BT24-031, BT24-034, BT25-030, BT24-101, BT26-090,
            BT25-022, BT24-083, BT26-029, BT25-033, BT24-102,
            BT25-033, BT24-084, BT4-104, BT25-030, BT24-034]
    rest: ts-jupitermon
  p1:
    stack: [ST1-02, ST1-04, BT1-009, BT3-007, ST1-08,
            BT1-014, BT4-010, BT3-007, BT1-009, ST1-02,
            ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08, BT4-014]
    rest: tm-quiet-red
steps:
  # T1 (P0)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, 3): Biyomon -> 1; pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, 3): pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1, 3): attack security -> Homeros [Security] (THE CLAUSE).
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  # Before the attack: P0 has 5 security, an empty field.
  - at: 8
    that:
      turn: 4
      p0.security: 5
      p0.field: []
  # After the attack (asked at P1's pass): Homeros played for free -- P1 still
  # holds all 3 memory (p0.memory -3), security 4, nothing trashed.
  - at: 9
    that:
      turn: 4
      p0.memory: -3
      p0.security: 4
      p0.trash: []
      p0.field:
        - { card_id: BT24-102, dp: -1, suspended: false, sources: [] }
      p1.field:
        - { card_id: ST1-02, dp: 3000, suspended: true, sources: [] }
