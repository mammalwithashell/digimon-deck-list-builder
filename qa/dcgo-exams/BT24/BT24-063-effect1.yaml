# Exam scenario: Locomon (BT24-063), clause BT24-063#effect#1 -- <Collision>
# ("During this Digimon's attack, all of your opponent's Digimon gain
#  <Blocker>, and must block if possible.")
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json (`bt26-ts-mervamon` vs
# `tm-quiet-red`). No variant.
#
# THE LINE:
#   T1 (P0, 0): hard-play Wizardmon BT26-067 (4): 0 -> -4. Its [On Play]
#       <Draw 1> (stack[10]) and trashes 1 hand card (Homeros BT24-102).
#   T2 (P1, 4): Agumon ST1-03 (3) -> 1; pass -> P0 3.
#   T3 (P0, 3): digivolve Locomon onto Wizardmon (cost 3): 3 -> 0 (+1
#       digivolve draw). Locomon's [When Digivolving] (#effect#2) reveals
#       Minervamon / Mervamon / Marsmon (all cost 12+, nothing eligible: no
#       pick on ours) and sends them to the BOTTOM.
#       THE CLAUSE: Locomon (7000; Wizardmon was played T1, so no summoning
#       sickness) attacks P1's SECURITY. P1's Agumon ST1-03 -- no printed
#       <Blocker> -- gains <Blocker> and MUST block: our engine parks a
#       non-declinable "Declare a blocker" prompt for P1. Agumon (2000) is
#       deleted in battle; the attack never reaches security.
#
# WITNESS: at 14 (before the attack) Agumon unsuspended on P1's field, P1
# security 5; at 16 (after) P1 field empty, Agumon in P1's trash, P1
# security STILL 5 (the blocked attack checked nothing), Locomon suspended.
# PARTIAL: the "all of your opponent's Digimon" plural (several gaining
# <Blocker>) is not walked -- P1 has one Digimon.
#
# PROMPT SHAPE: the blocker declaration = SelectPermanentEffect for actor 1
# (the EX12-019-effect3 Collision idiom). DCGO may instead force the block
# with no row when exactly one blocker exists. Reveal remainder: sim_only
# choice + dcgo_only generic_bool false ("Deck Bottom") + our 3
# OrderedPermutation picks (sim_only) vs DCGO's one ordering SelectCardEffect
# (dcgo_only) -- the EX7-044 idiom. Wizardmon's trash pick: SelectHandEffect.
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
