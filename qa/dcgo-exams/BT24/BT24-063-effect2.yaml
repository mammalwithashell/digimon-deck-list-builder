# Exam scenario: Locomon (BT24-063), clause BT24-063#effect#2 --
# "[On Play] [When Digivolving] Reveal the top 3 cards of your deck. You may
#  play 1 play cost 5 or lower [Machine], [Cyborg] or [TS] trait card among
#  them without paying the cost. Return the rest to the top or bottom of the
#  deck."
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json (`bt26-ts-mervamon` vs
# `tm-quiet-red`). No variant.
#
# THE LINE (the [On Play] branch; the [When Digivolving] branch is walked in
# BT24-063-effect0 / effect1, where it is declined):
#   T1 (P0, 0): hard-play Locomon (7): 0 -> -7. THE CLAUSE: reveal stack[10..12]
#       = Coronamon BT25-008 ([TS], cost 3 -- the only eligible card),
#       Minervamon BT24-041 (cost 12), Mervamon BT26-081 (cost 13). Play
#       Coronamon free; remainder to the TOP, ordered Minervamon then
#       Mervamon. Coronamon's own [On Play] hand-trash pick is declined.
#       Turn ends (-7).
#   T2 (P1, 7): pass -> P0 3.
#   T3 (P0, 3): draws the top card.
#
# WITNESS: at 3 memory -7 (Locomon paid, nothing else); at 11 (P0's T3
# breeding) memory 3, Coronamon on the field next to Locomon with P0's memory
# untouched by its play (free), and the T3 draw is Minervamon BT24-041 -- a
# revealed card, i.e. the remainder went back on TOP (the undisturbed deck
# top was Homeros BT24-102, stack[13]).
# PARTIAL: the "bottom" branch is not walked; Mervamon's position (2nd from
# top) is not observed.
#
# PROMPT SHAPE: reveal pick = SelectCardEffect (single bucket, canNoSelect
# true per the BT24-063.yaml DCGO notes) on both. Top/bottom: ours = an
# EffectChoice by label (sim_only); DCGO RemainingCardsPlace.DeckTopOrBottom =
# generic_bool (true = "Deck Top", per the EX7-044 idiom) -- dcgo_only. Order:
# ours one OrderedPermutation pick per position (2, sim_only); DCGO one
# multi-pick SelectCardEffect (dcgo_only). ASSUMED: the first card in DCGO's
# click order lands on top (as our first pick does); if the oracle draws
# Mervamon at T3, the order convention differs. Coronamon's [On Play]:
# SelectHandEffect canNoSelect (BT25-008.yaml DCGO notes) -> decline. Our
# engine resolves the remainder placement BEFORE Coronamon's [On Play] (the
# played card's trigger waits for Locomon's effect to finish), as DCGO should.
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
