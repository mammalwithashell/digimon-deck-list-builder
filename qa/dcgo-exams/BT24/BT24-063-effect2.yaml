clause: BT24-063#effect#2
seed: 424242
decks:
  p0:
    stack: [BT24-063, BT25-022, BT25-022, BT24-034, BT26-067,
            BT25-022, BT24-031, BT25-034, BT26-067, BT25-022,
            BT25-008, BT24-041, BT26-081, BT24-102, BT24-102]
    rest: bt26-ts-mervamon
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT24-063, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { cards: [BT25-008] } }
    expect: { prompt: SelectCardEffect }
  - actor: 0
    do: { select: { choice: "Top of deck", sim_only: true } }
  - actor: 0
    do: { select: { yes: true, dcgo_only: true } }
    expect: { prompt: generic_bool }
  - actor: 0
    do: { select: { cards: [BT24-041], sim_only: true } }
  - actor: 0
    do: { select: { cards: [BT26-081], sim_only: true } }
  - actor: 0
    do: { select: { cards: [BT24-041, BT26-081], dcgo_only: true } }
    expect: { prompt: SelectCardEffect }
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: SelectHandEffect }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
