  # was played". The eight-card trash is the Assembly declaration's menu -- one
  # trash-cost card per EX12-061/EX12-070 play, nothing else -- and P1 still has
  # both Digimon here.
  #
  # All four EX12-070 are on the field, interleaved with the four EX12-061 in
  # play order. Each is a <Delay> whose window is an EVENT owned by its
  # replacement clause ("[All Turns] When any of your level 5 or higher [TB]
  # trait Digimon would leave the battle area"), so 16-16-1 keeps it available
  # for as long as it is in the battle area. None has been activated: nothing
  # of P0's has left the battle area on this line.
  - at: 34
    that:
      turn: 11
      p0.memory: 10
      p0.field:
        - { card_id: EX12-061, dp: 2000, suspended: false, sources: [] }
        - { card_id: EX12-070, dp: -1, suspended: false, sources: [] }
        - { card_id: EX12-061, dp: 2000, suspended: false, sources: [] }
        - { card_id: EX12-070, dp: -1, suspended: false, sources: [] }
        - { card_id: EX12-061, dp: 2000, suspended: false, sources: [] }
        - { card_id: EX12-070, dp: -1, suspended: false, sources: [] }
        - { card_id: EX12-061, dp: 2000, suspended: false, sources: [] }
        - { card_id: EX12-070, dp: -1, suspended: false, sources: [] }
