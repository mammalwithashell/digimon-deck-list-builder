      p1.security: 5
  # AFTER the play, BEFORE the attack. Susanoomon is on the board UNSUSPENDED
  # with its eight declared materials underneath. `p0.memory: 3` is the cost
  # witness (10 - 7 = the Assembly -9 applied to a printed 16). 20000 DP is
  # 16000 plus the two `[Your Turn] +2000` source auras. P1's board is empty --
