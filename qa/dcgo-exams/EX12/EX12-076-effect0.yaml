  # the four EX12-070 were silently auto-trashed before turn 11, collapsing the
  # field to five slots. They now persist (16-16-1), so the index moves by 3.
  - actor: 0
    do: { attack: { attacker: field.8, target: security } }
    expect: { prompt: main_phase }
assert:
  # Hand-authored, NOT oracle-backfilled -- read off our engine's projection on
  # 2026-08-26. Deliberately narrow: only facts this line actually pins.
  #
  # BEFORE the play. Susanoomon is absent from P0's field, so its presence at 36
