# Exam scenario: EX12-047 (Amaterasumon), clause effect#4 -- "[On Deletion]
# You may return 1 [TB] trait card from your trash to the hand. Then, you may
# play 1 level 5 or lower [TB] trait Digimon card from your hand without
# paying the cost."
#
# Both halves are exercised with REAL candidates and answered by identity:
#   - p0 seeds its own trash with Gasamon (EX12-020, [TB]) by paying
#     Sanmyojin Arrival's "trash 1 [TB] card from hand" draw-2 cost at T5;
#   - at T7 p0's Kokeshimon deletes p0's OWN Amaterasumon as its "by
#     deleting 1 of your Digimon" cost -- an effect deletion with no
#     follow-up window on the opponent's side -- and the [On Deletion] body
#     returns Gasamon from trash to hand, then plays it for free.
#
# Kokeshimon (not a second Amaterasumon) is the deleter on purpose: the
# mirror's "by returning 2 cards from their trash" clause parks a 2-pick
# count-capped multiselect for the OPPONENT the moment the deleted card
# lands in a 2-card trash, and identity picks against that prompt kind are
# outside the current `select:` vocabulary. Kokeshimon's kit is fully
# answerable, and p1's fielded Gasamon gives its second delete a real
# level-4-or-lower target.
#
# Each [On Deletion] pick has exactly one qualifying candidate SIM-side.
# (TRAIT-DATA NOTE, review 2026-08-22: the trashed Amaterasumon's card face
# DOES print [TB] -- cards.json is stale -- so DCGO offers TWO return
# candidates [EX12-020, EX12-047]; the identity pick EX12-020 is still
# offered and disambiguates. The free-play pick stays single-candidate on
# both sides: EX12-036 in hand is level 6.) The two
# `cards:` answers are the clause's own choices, not tie-breaks. The
# carrier's <Ascension> rides the same mandatory TriggerOrder bundle
# (our branch 0 = the clause, resolved first; our branch 1 = the Ascension
# yes/no gate, accepted -- its EffectChoice offers no decline-shaped PASS).
# DCGO stacks the same two triggers in the OPPOSITE order; see the
# BLOCKED note below.
# BLOCKED ON THE ORACLE -- TRIGGER-LIST INVERSION (reconciled 2026-08-24
# against the failed oracle recordings 20260824T175253Z / 20260824T175315Z).
# The two engines present the deleted Amaterasumon's two simultaneous
# triggers in OPPOSITE order, and the `select:` vocabulary has no way to
# name a trigger across that inversion, so this line cannot be made to
# satisfy both wires at once.
#
#   OURS  (probed via the exam's own lowering note): branch 0 = [On Deletion],
#         branch 1 = <Ascension>.
#   DCGO  (READ OFF THE WIRE, not inferred): `EX12_047.CardEffects` adds the
#         <Ascension> keyword in the "Static Keywords" region BEFORE the
#         "On Deletion" region, and `MultipleSkills.skillInfos_active`
#         preserves that order -- so index 0 = <Ascension>, index 1 =
#         [On Deletion]. Proof: in the effect4 recording DCGO answered
#         `MultipleSkills` with int_value 0 and the VERY NEXT prompt was
#         `generic_bool`, which is `AscensionProcess`'s
#         SetBoolSelection("Will you place this card in security?").
#
# `select: {cards:, ordinal:}` carries ONE ordinal that each engine resolves
# against its OWN candidate list (`match_one_with_ordinal` /
# `SelectionAnswer.MatchOneWithOrdinal`), and `value:` is a single raw index
# on both sides -- so whichever value is authored, exactly one engine
# resolves <Ascension> first and the other resolves [On Deletion] first.
# The two orders do NOT produce the same wire, and cannot be made to:
#
#   * <Ascension> first: it moves the carrier out of the trash, and DCGO then
#     DROPS the [On Deletion] outright, because
#     `CanActivateOnDeletion = card.IsToken || IsTopCardStillInTrash(...)`
#     is now false (CanUseEffects/OnDeletion.cs:114). Rows: [MultipleSkills,
#     generic_bool].
#   * [On Deletion] first: its trash pick ALWAYS opens, because the carrier
#     itself is a [TB] card sitting in the trash
#     (`HasMatchConditionOwnersCardInTrash` = `Owner.TrashCards.Some(...)`,
#     no self-exclusion), so there is no board state that starves it. Rows:
#     [MultipleSkills, SelectCardEffect, (SelectHandEffect), (generic_bool)].
#
# Neither trigger can be made to emit ZERO rows either -- the only lever on
# <Ascension> is `Player.CanAddSecurity`, which needs an
# `ICannotAddSecurityEffect` on the board and the Toho pool has none. So the
# gate row lands in position 1 on one wire and in the last position on the
# other, and the strict cursor aborts there.
#
# The ordinal below is therefore chosen to keep the SIM side honest (it is
# OUR branch index; `--sim-only` lowers and asserts clean). The oracle pass
# will abort at the row named above with a prompt mismatch -- that abort IS
# the finding, and it is a substrate gap in the exam wire, not evidence that
# either engine resolves the card wrongly: simultaneous triggers are
# resolved one at a time by the player who controls them (general_rule.pdf
# 15-4-2-3 / 15-4-3-5), so the list ORDER is a presentation detail and BOTH
# candidate orders are legal. Unblocking needs the wire to name a
# trigger by something order-independent (e.g. a per-engine ordinal, or the
# effect's clause id) -- a harness change, not an authoring one.
card: EX12-047
clause: EX12-047#effect#4
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4): Amaterasumon, the Gasamon to trash/return/play, the
      # Sanmyojin Arrival that does the trashing, Kokeshimon, filler
      - EX12-047
      - EX12-020
      - EX12-070
      - EX12-062
      - EX12-075
      # security (5-9) -- never touched
      - EX12-009
      - EX12-011
      - EX12-062
      - EX12-063
      - EX12-036
      # draws (Options / non-TB-Digimon only -- the free-play pick must
      # keep exactly one candidate): T3 turn (10), T5 turn (11),
      # T5 draw-2 (12-13), T7 turn (14)
      - EX12-074
      - EX12-075
      - EX12-074
      - EX12-075
      - EX12-036
    rest: toho-braves
  p1:
    stack:
      # hand (0-4): exactly one Gasamon (Kokeshimon's level-4-or-lower
      # target); inert fillers
      - EX12-020
      - EX12-070
      - EX12-074
      - EX12-075
      - EX12-065
      # security (5-9) -- never touched
      - EX12-009
      - EX12-011
      - EX12-062
      - EX12-063
      - EX12-036
      # draws: T2 turn (10), T4 turn (11), T6 turn (12)
      - EX12-070
      - EX12-074
      - EX12-075
    rest: toho-braves
steps:
  # T1 (p0): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (p1): all-pass (Gasamon waits until AFTER Amaterasumon's mandatory
  # [On Play] delete so it survives to be Kokeshimon's target).
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (p0): play Amaterasumon (cost 12, memory 3 -> -9). Its [On Play] is
  # silent: p1 has no Digimon and no trash.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: EX12-047, from: hand } }
    expect: { prompt: main_phase }
  # T4 (p1): play Gasamon (cost 3, memory 9 -> 6), keep the turn, pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: EX12-020, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (p0): Sanmyojin Arrival (cost 3, memory 3 -> 0; the yellow
  # Amaterasumon satisfies its color requirement). Pay its optional "trash
  # 1 [TB] card from hand" with Gasamon -- seeding p0's trash -- draw 2,
  # and the Option places itself in the battle area.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: EX12-070, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { cards: [EX12-020] } }
    expect: { prompt: SelectHandEffect }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T6 (p1): all-pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T7 (p0): Kokeshimon (cost 4, memory 3 -> -1). Its "by deleting 1 of
  # your Digimon" cost takes the Amaterasumon at slot 0 (Kokeshimon itself
  # is the other candidate).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: EX12-062, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # The corrected [TB] data (task_69f10a66 EX12-070 triage) makes the
  # deleted Amaterasumon (Lv6, now [TB]) match the fielded Sanmyojin
  # Arrival delay-Option's "when your Lv5+ [TB] Digimon would leave"
  # replacement window on BOTH engines -- decline it (this exam is the
  # [On Deletion] body, not the Delay).
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: OptionalSkill }
  # Kokeshimon's second delete resolves BEFORE the queued deletion
  # triggers: p1's Gasamon is the one level-4-or-lower candidate.
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # The deletion bundle: resolve [On Deletion] first -- OUR branch 0.
  # DCGO's index 0 is <Ascension>, which is the blocker documented above.
  - actor: 0
    do: { select: { cards: [EX12-047], ordinal: 0 } }
    expect: { prompt: MultipleSkills, count: 1, candidates: [EX12-047, EX12-047] }
  # THE CLAUSE, half 1: return a [TB] card from trash to hand. The trash
  # holds TWO qualifying cards -- Gasamon (seeded at T5) and the just-deleted
  # Amaterasumon, whose printed face carries [TB] (cards.json drops it) --
  # so this is a real choice, answered by identity rather than a
  # single-candidate walkover.
  - actor: 0
    do: { select: { cards: [EX12-020] } }
    expect: { prompt: SelectCardEffect }
  # THE CLAUSE, half 2: play the returned Gasamon (level 3, [TB]) from hand
  # without paying the cost.
  - actor: 0
    do: { select: { cards: [EX12-020] } }
    expect: { prompt: SelectHandEffect }
  # <Ascension>: accept -- the deleted card tops p0's security. DCGO
  # surfaces this gate as `generic_bool`, NOT `OptionalSkill`:
  # `CardEffectCommons.AscensionProcess` raises it with
  # `userSelectionManager.SetBoolSelection(...)` ("Will you place this card
  # in security?"), whose response lands on
  # `UserSelectionManager.SetBoolForPlayer` -- the fallback channel the
  # recorder writes as `generic_bool`. Corrected from the failed oracle
  # recording 20260824T175315Z, whose abort message
  # ("step 21 expected prompt 'SelectCardEffect' but DCGO asked
  # 'generic_bool'") is that gate arriving early because DCGO took
  # <Ascension> as MultipleSkills index 0 -- see the header note.
  - actor: 0
    do: { select: { yes: true } }
    expect: { prompt: generic_bool }
  # The -1 memory overshoot ends p0's turn; p1's breeding decision closes.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  # The clause's witness: Gasamon FRESH on p0's field beside Kokeshimon,
  # Amaterasumon on security via Ascension (5 -> 6), and the returned-and-
  # played EX12-020 nowhere in the trash. (Sim-side oddity, left visible for
  # the differ: our engine trashes the placed Sanmyojin Arrival delay Option
  # at the T7 turn-end boundary, so p0.trash reads [EX12-070] here rather
  # than [] -- the printed Delay text keeps it in the battle area.)
  - at: 25
    that:
      p0.field:
        - { card_id: EX12-020, dp: 2000, suspended: false, sources: [] }
        - { card_id: EX12-062, dp: 5000, suspended: false, sources: [] }
      p0.trash: [EX12-070]
      p0.security: 6
      p1.field: []
      p1.trash: [EX12-020]
