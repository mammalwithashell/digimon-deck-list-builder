# Exam scenario: EX12-063 (Karakurumon), clause effect#1 -- "[On Deletion] You
# may play 1 level 4 or lower [Puppet] or [TB] trait Digimon card from your
# trash without paying the cost." -- the ON-CARD copy (Karakurumon is the top
# card when it dies).
#
# RECONCILED against the DCGO wire (recording 20260824T175420Z_513e85f...).
# The previous line put TWO permanents on p0's board (Karakurumon T1, Hanimon
# T3) and then attacked with `field.0`. Slot 0 is NOT the same permanent on the
# two sides: our battle_area is in PLAY order, while DCGO's compact index is
# ascending FrameID and its digimon are placed centre-out (1st -> frame 4, 2nd
# -> frame 3, ...), so with two bodies DCGO's slot 0 is the SECOND card played.
# The recorded run therefore attacked with HANIMON (board_p0 dumps as
# ["EX12-061","EX12-063"]), which died without an [On Deletion] and handed the
# scripted line a `main_phase` where it expected the trash pick.
#
# The fix is structural, not cosmetic: p0 now holds EXACTLY ONE permanent for
# the whole game, so slot 0 is unambiguous in both engines. The level<=4
# [Puppet]/[TB] card the clause needs in the trash is delivered WITHOUT a
# second body -- by p1 attacking p0's security and the checked security
# Digimon (Gasamon) going to p0's trash.
#
# Ingredients, all reached by legal play:
#   1. Karakurumon on the field: T1 p0 plays it from hand (overshoot 0 -> -7).
#      Playing it while the trash is still EMPTY matters -- DCGO's Assembly
#      condition (EX12_063.cs, SelectAssemblyClass reads `Owner.TrashCards`)
#      would park a material prompt if a level<=4 [Puppet]/[TB] card were
#      already in the trash. Its [On Play] suspend fizzles on p1's empty board.
#   2. A trash target: T2 p1 plays Gasamon (EX12-020, level 3, [TB]; no [On
#      Play], so it parks nothing) and on T4 attacks p0's security. The checked
#      card is p0's own EX12-020 -- a 2000 DP mirror, so both are deleted in
#      the check -- and it lands in p0's TRASH. p0's board never changes.
#   3. A deletion: T5 Karakurumon (7000 DP, in play since T1, the ONLY
#      permanent p0 owns) attacks security; p1's top security card is
#      Susanoomon (16000 DP, no [Security] text), so the attacker dies.
# The clause then parks the trash pick. The only candidate is the security
# Gasamon (Karakurumon itself is level 5 and fails the filter), and Gasamon has
# no [On Play], so the revival parks nothing after it.
#
# Prompt shape (EX12_063.cs): the [On Deletion] ActivateClass is registered
# with `optional: false` + `SetIsSkippable(true)` and resolves through
# `CardEffectCommons.PlayByEffect(..., SelectCardEffect.Root.Trash, payCost:
# false)` -- a cancelable SelectCardEffect, NO OptionalSkill gate. Our
# EX12-063.yaml matches it with a declinable `select_trash` pick.
card: EX12-063
clause: EX12-063#effect#1
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4): Karakurumon plus four Option cards. The Options are inert
      # here -- nothing in this line reads p0's hand -- and keeping the hand
      # free of Digimon keeps it free of accidental digivolve/place costs.
      - EX12-063
      - EX12-070
      - EX12-070
      - EX12-074
      - EX12-075
      # security (5-9) -- REVERSED into the security stack, so slot 9 is the
      # TOP card and the one p1's T4 attack checks. That card is the clause's
      # revival target: Gasamon, level 3, [TB], no [On Play].
      # Nothing here carries [Security] text or a security-area passive.
      - EX12-009
      - EX12-011
      - EX12-026
      - EX12-031
      - EX12-020
      # draws: T3 (10), T5 (11)
      - EX12-075
      - EX12-031
    rest: toho-braves
  p1:
    stack:
      # hand (0-4): Gasamon is the only Digimon -- it is played T2 and attacks
      # p0's security on T4.
      - EX12-020
      - EX12-070
      - EX12-074
      - EX12-075
      - EX12-046
      # security (5-9): slot 9 is the TOP card, the one p0's T5 attack checks.
      # Susanoomon, 16000 DP and blank security text, deletes the 7000 DP
      # attacker outright.
      - EX12-009
      - EX12-011
      - EX12-026
      - EX12-031
      - EX12-076
      # draws: T2 (10), T4 (11)
      - EX12-046
      - EX12-031
    rest: toho-braves
steps:
  # Turn 1 (p0): play Karakurumon (overshoot 0 -> -7); the [On Play] suspend
  # fizzles on the empty board; the turn ends.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: EX12-063, from: hand } }
    expect: { prompt: main_phase }
  # Turn 2 (p1): play Gasamon (7 -> 4 in p1's favour), then end the turn.
  # Gasamon has no [On Play], so nothing parks.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: EX12-020, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # Turn 3 (p0): nothing to do -- Gasamon must wait a turn before it can
  # attack, so p0 simply hands the turn back.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # Turn 4 (p1): Gasamon attacks p0's security. p0 has no blocker, so the check
  # flips p0's top security card (EX12-020) straight into a 2000-vs-2000
  # battle: both are deleted and the security Gasamon lands in p0's TRASH --
  # the clause's revival target, delivered without ever giving p0 a second
  # permanent.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # Turn 5 (p0): Karakurumon -- still p0's ONLY permanent, so `field.0` names
  # it on both sides -- attacks security and dies to the 16000 DP Susanoomon.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  # THE CLAUSE: revive the trashed Gasamon (the only level<=4 [Puppet]/[TB]
  # Digimon card in the trash; Karakurumon itself is level 5 and filtered out).
  # The printed "You may" is the pick's own PASS -- no gate row.
  - actor: 0
    do: { select: { cards: [EX12-020] } }
    expect: { prompt: SelectCardEffect }
  # Attack over; still p0's turn at memory 3; close it.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  # The clause's observable, read immediately after the pick resolves: the
  # security Gasamon is back on p0's field (played, so unsuspended and with no
  # digivolution cards) and Karakurumon lies in the trash it was revived from.
  - at: 13
    that:
      p0.field:
        - { card_id: EX12-020, dp: 2000, suspended: false, sources: [] }
      p0.trash: [EX12-063]
