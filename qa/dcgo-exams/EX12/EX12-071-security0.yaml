# Exam scenario: EX12-071 (Saneiketsu Invitation), clause
# EX12-071#security#0 -- "[Security] Activate this card's [Main] effect."
#
# NOTE ON THE CLAUSE ID: the extractor emits this slot as an
# `image-required` placeholder with EMPTY text, because cards.json's
# `security_effect_description_eng` is a dead field and EX12-071 has no
# official-DB bundle yet. The clause is nonetheless REAL, not a phantom:
# EX12_071.cs registers exactly one `EffectTiming.SecuritySkill` effect
# (AddActivateMainOptionSecurityEffect, description "[Security] Activate
# this card's [Main] effect.") and our EX12-071.yaml carries a matching
# `when: on_security`. EX12-071 is one of only four EX12 cards with a
# real SecuritySkill (with -070/-074/-075); the other 27 EX12
# `#security#0` ids in the pool ARE phantoms. Until the denominator is
# rebound to real text, the stored `text_sha256` for this verdict pins
# the empty string -- the LINE is the evidence, the BINDING is not yet.
#
# THE SECURITY-TRIGGER SKELETON (see EX1-066-effect2.yaml for the full
# derivation). A seat's `stack:` is a draw-order prefix on both engines and the
# security pile is laid AFTER the mulligan from that same ordered deck, so:
#
#     stack[0..4]  -> the opening hand, drawn in that order
#     stack[5..9]  -> the SECURITY stack, REVERSED:
#                        stack[9] = TOP (flipped first) ... stack[5] = bottom
#     stack[10..]  -> subsequent draws, in order
#
# Both engines are pinned to KEEP under a scripted line (our ScenarioAdapter
# `construct()` calls `game.start_game()`; DCGO's `SetRedraw` forces
# `isRedraw=false` while `InputDriver.IsActive`), so the pile is deterministic.
# A scenario mulligan verb would break this -- mulligan is a true reshuffle
# (§5-2-1-5).
#
# The card under exam therefore sits at P0's stack[9] and is the FIRST card the
# single security check of the line flips.
#
# P1's line is the proven attacker skeleton (EX12-075-security0.yaml): Gasamon
# (EX12-020, Lv.3, cost 3) is played on P1's first turn at memory 3 (3 -> 0, so
# the turn continues and P1 passes out), sheds summoning sickness over T3, and
# attacks security on T4. Gasamon's only printed effect is a [Your Turn]
# would-digivolve cost reduction -- passive -- and its inherited [When
# Attacking] <Draw 1> belongs to whatever digivolves OVER it, not to itself, so
# neither the play nor the attack opens a prompt. P0's battle area stays empty
# until the flip, so no blocker window precedes the check.
#
# BOTH seats' security stacks are fully pinned. EX12-074 must never sit in
# either -- its "[Security] [Your Turn] [Once Per Turn] When one of your
# [Shambala] trait Digimon attacks" functions FROM the security stack and
# Gasamon IS [Shambala], so an unpinned P1 security pile would bury the line
# under a TriggerOrder roughly a third of the time under DCGO's shuffle. The
# EX12-074-free `toho-security-*` decks plus the pinned piles close that off on
# both sides.
#
# EX12-071's <Delay> clause ("[All Turns] When any of your [SW] trait
# Digimon are played...") cannot fire inside this line: the option is only
# placed on the LAST resolution step, and DCGO gates it on
# CanDeclareOptionDelayEffect (not the placing turn) anyway.
card: EX12-071
clause: EX12-071#security#0
seed: 424242
decks:
  p0:
    stack:
      # hand [0-4]: cost 12/16 bricks -- unplayable at memory 3, no hand [Main]
      - EX12-047
      - EX12-047
      - EX12-065
      - EX12-065
      - EX12-076
      # security [5-8]: quiet filler, never flipped (one check only)
      - EX12-009
      - EX12-009
      - EX12-009
      - EX12-009
      # security [9]: THE TOP CARD -- the clause under exam
      - EX12-071
      # [10]: P0's T3 turn draw
      - EX12-011
      # [11-12]: the <Draw 2> the [Main] body pays out
      - EX12-046
      - EX12-046
    rest: toho-security-options
  p1:
    stack:
      # hand [0-4]: the attacker plus inert filler
      - EX12-020
      - EX12-011
      - EX12-011
      - EX12-026
      - EX12-026
      # security [5-9]: pinned and quiet; never flipped, and EX12-074-free
      - EX12-031
      - EX12-031
      - EX12-031
      - EX12-031
      - EX12-062
    rest: toho-braves
steps:
  # T1 (P0, memory 0): all-pass; the main pass hands P1 3 memory.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, memory 3): play Gasamon (3 -> 0, turn continues), then pass out.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: EX12-020, from: hand.0 } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0): all-pass; Gasamon sheds summoning sickness. P0 draws stack[10].
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1, memory 3): THE CLAUSE. Gasamon attacks security; the check flips
  # P0's stack[9].
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  # THE CLAUSE's body: "By trashing 1 [SW] trait card from your hand,
  # <Draw 2>. After, place this card in the battle area." The optional
  # cost pick parks for P0 (the DEFENDER -- an off-turn selection). P0's
  # hand at this point is [EX12-047 x2, EX12-065 x2, EX12-076, EX12-011]
  # and EX12-076 Susanoomon is the ONLY [SW] card in it, so the choice is
  # pay-or-decline over a single candidate on both sides (DCGO:
  # SelectHandEffect, mode Discard, maxCount 1, canNoSelect true).
  # PAY -- declining would leave the clause with no observable at all.
  - actor: 0
    do: { select: { cards: [EX12-076] } }
    expect: { prompt: SelectHandEffect }
  # Attacking spends no memory; P1 keeps the turn. One step past the clause.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  # Minimal, and only over facts the stack prefix pins. All three halves of
  # the [Main] body are witnessed: the [SW] cost is the ONLY card in P0's
  # trash, the <Draw 2> is the two pinned EX12-046 in P0's hand, and
  # "place this card in the battle area" is EX12-071 on P0's FIELD rather
  # than in the trash the security check would otherwise send it to.
  - at: 10
    that:
      p0.memory: -3
      p0.security: 4
      p0.trash: [EX12-076]
      p0.hand: [EX12-011, EX12-046, EX12-046, EX12-047, EX12-047, EX12-065, EX12-065]
      p0.field:
        - { card_id: EX12-071, dp: -1, suspended: false, sources: [] }
      p1.field:
        - { card_id: EX12-020, dp: 2000, suspended: true, sources: [] }
