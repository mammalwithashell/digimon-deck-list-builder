# Exam scenario: EX12-025 Gawappamon effect clause #2 -- the alternate
# digivolution path "[Digivolve] Lv.3 w/[Shambala] trait: Cost 2".
#
# Line shape copied from the confirmed EX12-026-effect2.yaml (Shellmon is the
# same blue Lv.4 [Shambala] shell). The observable is a digivolve that ONLY
# the alt path can explain: Gawappamon's standard circle is blue Lv.3, so the
# line puts a RED Lv.3 with the [Shambala] trait under it -- Wankomon
# (EX12-009) -- and the digivolve that lowers is necessarily the alt path, a
# single cost-2 action with no EffectChoice (only one distinct cost exists).
#
# The whole line stays in the BREEDING area, which is what makes it clean:
#   - Gawappamon's shared clause is [On Play]/[On Deletion], NOT
#     [When Digivolving], so the breeding digivolve triggers nothing at all
#     (cleaner even than the Shellmon original, whose WD arm is suppressed
#     rather than absent);
#   - Wankomon's [On Play] reveal is likewise not a digivolve trigger; and
#   - Onibimon's <Execute>-granting inherited is inactive in breeding, so the
#     end-of-turn passes prompt nothing.
#
#   T1 (memory 0): hatch Onibimon (purple), digivolve Wankomon over it
#       (alt path, cost 0 -- Onibimon is not red, so again only the alt
#       circle matches).
#   T2: P1 passes everything.
#   T3 (memory 3): digivolve Gawappamon over the red Wankomon in breeding
#       (alt path only, cost 2, memory 3 -> 1). Trailing pass one step after
#       the clause fires.
#
# P1 never acts and is never attacked, so its seat needs no stack.
#
# Deck: `sw-shambala` (appended to toho_pool.json for this batch) -- the
# toho-braves shell with EX12-025 / EX12-043 / EX12-039 swapped in;
# toho-braves itself has no Gawappamon.
card: EX12-025
clause: EX12-025#effect#2
seed: 424242
decks:
  p0: { stack: [EX12-009, EX12-025, EX12-031, EX12-031, EX12-031, EX12-011, EX12-011, EX12-011, EX12-011, EX12-046, EX12-046], rest: sw-shambala }
  p1: { stack: [], rest: toho-braves }
steps:
  # T1 (P0, memory 0): hatch, then the free alt-path digivolve in breeding.
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: breeding, using: EX12-009 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, memory 3): the clause under exam -- Gawappamon's alt path over
  # the red Wankomon, the only legal digivolve circle, at cost 2 (3 -> 1).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: breeding, using: EX12-025 } }
    expect: { prompt: main_phase }
  # Trailing pass: one step after the clause fires.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  # Cost-2 witness for the alt circle: memory 3 -> 1, stack still in breeding.
  - at: 7
    that: { p0.memory: 1, p0.field: [], p0.trash: [] }
