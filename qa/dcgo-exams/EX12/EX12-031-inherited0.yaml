# Exam scenario: EX12-031 (MarineBullmon), clause inherited#0 -- the INHERITED
# "<Decode (Lv.4 or lower w/[Aqua]/[Sea Animal] in any trait or w/[TB] trait)>"
# that is live while MarineBullmon sits in a permanent's digivolution cards:
# "(When this Digimon would leave the battle area other than in battle, you may
#  play 1 specified Digimon card from its digivolution cards without paying the
#  cost.)"
#
# For the inherited half to be measurable the carrier needs BOTH (a) EX12-031
# among its digivolution cards and (b) a SEPARATE Lv.4-or-lower [Aqua]/
# [Sea Animal]/[TB] card there for Decode to play (EX12-031 itself is Lv.5,
# above its own filter). That is at least two sources, which rules out reaching
# the window with MarineBullmon's own bounce (it only takes targets with "1 or
# fewer digivolution cards"), so the carrier is built on the battle area and
# then DELETED outside battle:
#   T3 (p0, memory 3): play Shellmon EX12-026 (Lv.4, [Mollusk/Shambala/TB],
#       cost 5 -> memory -2, turn ends). Its [On Play] is target-starved --
#       p1 never puts anything on the board on this line.
#   T5 (p0, memory 3): digivolve MarineBullmon over it. TWO distinct costs are
#       on offer (the printed blue Lv.4 circle at 4, and the printed
#       "Lv.4 w/[Aquatic]/[Shambala]: Cost 3" alt that Shellmon's [Shambala]
#       satisfies), so the rule-17 cost choice parks and the VALUE 3 takes the
#       alt (memory 3 -> 0). MarineBullmon's own [When Digivolving] (effect#1)
#       then parks its placement prompt -- Kaguyamon and Kokeshimon in hand are
#       both Lv.<=6 [TB] Digimon, so it is live on BOTH engines -- and is
#       DECLINED: leaving the stack at exactly [EX12-026] keeps Decode's later
#       pick single-candidate. Declining also forfeits the bounce
#       (EX12_031.cs:119), which is target-starved anyway.
#   T7 (p0, memory 3): digivolve Kaguyamon EX12-065 over MarineBullmon. Its
#       printed circles are purple/green Lv.5 and miss blue/yellow
#       MarineBullmon, so the ONLY matching route is its
#       "Lv.5 w/[Puppet]/[Shambala]: Cost 3" alt -- one distinct cost, no cost
#       prompt (memory 3 -> 0). Its [OP][WD][WA] trash revive stays silent:
#       p0's trash is empty. The carrier is now top EX12-065 over
#       [EX12-026, EX12-031].
#   T9 (p0, memory 3): play Kokeshimon EX12-062 (cost 4 -> -1, turn ends). Its
#       [On Play] "By deleting 1 of your Digimon, ..." is the removal: the
#       payment prompt takes ANY of your Digimon regardless of level, so it
#       takes the carrier. That deletion is not a battle, so THE CLAUSE opens.
#       The enemy half of Kokeshimon's effect then finds no target.
#
# WHY KAGUYAMON IS THE CARRIER TOP. Every other Lv.6 in the DCGO-legal toho
# pool that can sit on a Lv.5 [Shambala] brings its own competing "would
# leave" machinery, which would bury the clause under exam:
#   - EX12-036 Ryugumon carries <Barrier>, <Evade> AND its own <Decode>
#     (verified by building this line on it: the deletion is intercepted by an
#     <Evade> replacement prompt before the inherited window is even reached);
#   - EX12-047 Amaterasumon carries [On Deletion] + <Ascension>, i.e. the
#     duplicate-identity MultipleSkills that got the previous version of this
#     file rejected.
# Kaguyamon's only deletion-time additions are its [On Deletion] (target
# starved here) and its MANDATORY <Fortitude> (general_rule.pdf 16-26: a
# deleted Digimon WITH digivolution cards is played back from the trash for
# free). Both are triggers of the same card, so step 25 is exactly the
# stacked-trigger prompt `ordinal:` exists for: our TriggerOrder offers
# [EX12-065, EX12-065] and DCGO offers the same two as MultipleSkills.
# ORDINAL CAVEAT: 0 here is OUR branch order, not one read off a DCGO abort
# message. It is safe to author blind in this one line because both triggers
# are mandatory and the [On Deletion] is target-starved, so the reachable
# state is identical either way -- but if DCGO stacks them the other way the
# row still surfaces that as a finding rather than silently agreeing.
#
# ORACLE HISTORY. This line has aborted on the DCGO oracle twice, for two
# DIFFERENT reasons, and both are now addressed in this file:
#
#   A. The LAST recorded abort (verdict store: measured against DCGO
#      scripted-v12, dcgo_commit 4db6ee409) and the earliest failure of any
#      scenario in the corpus: "prompt mismatch: step 3 expected actor 1 but
#      DCGO asked actor 0" -- p1's ENTIRE main phase was skipped by DCGO, so
#      the row went unconsumed and actor 0's next breeding prompt landed on
#      it. Nothing to do with the card under exam. Cause and fix are written
#      up on p1's `stack:` below; in one line, p1's hand was all Options whose
#      colour requirement an empty field can never meet, which makes all five
#      of DCGO's `CanSelect()` clauses false, and DCGO then ends the turn
#      WITHOUT asking (TurnStateMachine.cs:1298-1308). One cheap Digimon
#      (EX12-009, cost 3) in p1's hand is the whole fix -- UNVERIFIED against
#      the oracle, because sim-only cannot see this class of mismatch at all.
#      Only a DCGO re-run settles it.
#
#      NOT AN ENGINE BUG EITHER WAY. Our engine exposing PASS as a real
#      decision point is required by the no-approximations policy, and the
#      outcome (turn ends) is identical on both sides; DCGO's silent auto-end
#      is a UI convenience, not a rules difference. Changing our opening
#      sequencing to match would invalidate every confirmed verdict in the
#      store to buy nothing. This is a SCENARIO-AUTHORING constraint that
#      `--sim-only` structurally cannot see: our engine always offers the
#      pass, so the line always lowers clean.
#
#   B. step 24, Decode's source pick -- see item 2 below. CLOSED: the Material
#      prompt now takes an identity payload.
#
# RE-DERIVED 2026-08-25 (gap-closing lane; sim-only probes on the prebuilt
# harness -- no cargo, no Unity):
#
# 1. THE RECORDED CAUSE IS STALE. The verdict store says "MultipleSkills
#    value-space mismatch: our TriggerOrder slot values vs DCGO 0-based
#    skillInfos index; out-of-range silently clears the trigger stack"
#    (recorded 2026-08-22). That was fixed by the `ordinal:` payload landed
#    2026-08-23: step 25 no longer ships an index at all. It lowers as
#    `Select(SelectWire { card_ids: ["EX12-065"], ordinal: Some(0) })`, i.e.
#    an IDENTITY plus a within-card trigger ordinal, resolved on each side
#    against that side's own candidate list
#    (`match_one_with_ordinal` here / `SelectionAnswer.MatchOneWithOrdinal`
#    on DCGO's). A disagreement about trigger order now surfaces as a
#    divergence instead of silently clearing a stack. The stacked-trigger
#    row is no longer a blocker for this clause.
#
# 2. THIS ONE IS NOW CLOSED TOO -- kept because the probe table below is the
#    record of what each payload shape does, and because the `value:` and
#    `decline:` rows are still true. Re-probed 2026-08-26 against the live
#    prompt: `cards: [EX12-026]` now RESOLVES at step 24 and the line walks
#    past it, so step 24 is authored as an identity pick and the `yes: true`
#    row DCGO would have refused is gone. The analysis as it stood on
#    2026-08-25 follows.
#
#    WHAT BLOCKED IT THEN was step 24, Decode's source pick, and the gap was
#    entirely on OUR side. Our engine parks it as SelectionKind::Material
#    with SOURCE-INDEX action ids (EffectContext::select_material,
#    effect_context/selections.rs:431-490; here `valid == [2000]`), while
#    DCGO's chokepoint wants IDENTITIES --
#    SelectCardEffect.SetTargetCardAndIndicies matches `select_card_ids`
#    against ScriptedCandidateIds() and sets `Indicies = null`
#    (SelectCardEffect.cs:923-938), so nothing on the wire wants indexes.
#    `resolve_next`'s card-identity block
#    (runners/selection_resolve.rs:326-373) covers Hand / UnionZone / Trash /
#    Reveal / RevealBucket / OrderedPermutation / Security and drops Material
#    through `_ => None`, so the payload DCGO wants cannot be produced.
#
#    All four payload shapes probed at THIS step, verbatim:
#      * `cards: [EX12-026]` -> refused at LOWERING (nothing reaches Unity):
#          "step 24: ... card pick 'EX12-026' not found in Material prompt
#           'Choose a level 4 or lower [Aqua]/[Sea Animal]/[TB] source to
#           play' (zone owner 0, valid [2000])".
#      * `value: 0` -> refused at LOWERING: "count payload 0 has no
#        candidate set, so it cannot be mapped onto the Material prompt".
#      * `yes: true` -> the ONLY shape that lowers, and only because
#        valid.len() == 1 (selection_resolve.rs:396-399). It rides as
#        select_has_bool/select_bool (dcgo-harness/src/main.rs:1495-1496),
#        which DCGO ABORTS on: "SelectCardEffect prompt needs
#        select_card_ids or select_cancel" (SelectCardEffect.cs:941-944).
#        This is the committed line, so the oracle pass dies AT step 24 --
#        after the inherited window has opened on both sides, before the
#        play is compared. Verdict `unreachable`, never `confirmed`.
#      * `decline: true` -> refused at LOWERING: "step 24: ... recorded
#        cancel on a non-optional Material prompt". It would be refused on
#        purpose regardless: a declined Decode never runs the clause body,
#        so measuring it would confirm the GATE and launder the clause into
#        a pass.
#
#    One match arm resolving `SelectionKind::Material` by identity against
#    the carrier's `card_sources` turns step 24 into `cards: [EX12-026]` and
#    changes nothing else in this file; it unblocks EX12-031#effect#0 and
#    EX12-036#effect#2 at the same time.
#    -- That arm has since landed; step 24 is the identity pick now.
#
# DCGO shape this is authored against: the inherited copy is the SAME factory
# call as the printed one with isInheritedEffect: true
# (EX12_031.cs:196-210 -> CardEffectFactory.DecodeSelfEffect), so it is
# isOptional: true (Decode.cs:41) gated by CanTriggerWhenRemoveField &&
# !IsByBattle (:53-56), and CanActivateDecode requires a source passing the
# filter AND CanPlayAsNewPermanent (CardEffectCommons/KeyWordEffects/
# Decode.cs:16-21) -- i.e. DCGO asks OptionalSkill (step 23) then
# SelectCardEffect (step 24), 1:1 with our Replacement gate then Material pick.
card: EX12-031
clause: EX12-031#inherited#0
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4): the four cards the line plays, in play order, plus one
      # levelless Option filler.
      - EX12-026
      - EX12-031
      - EX12-065
      - EX12-062
      - EX12-074
      # security (5-9): never checked -- there is no attack on this line.
      - EX12-009
      - EX12-011
      - EX12-063
      - EX12-062
      - EX12-047
      # draws, all levelless Options so no later draw can widen a prompt:
      # T3 turn (10), T5 turn (11), T5 digivolve (12), T7 turn (13),
      # T7 digivolve (14), T9 turn (15).
      - EX12-070
      - EX12-074
      - EX12-075
      - EX12-070
      - EX12-074
      - EX12-075
    rest: toho-braves
  p1:
    stack:
      # p1 passes every turn and its board stays EMPTY all game, which is what
      # keeps Shellmon's [On Play], Kokeshimon's enemy delete and Kaguyamon's
      # [On Deletion] silent on both engines.
      #
      # hand (0-4). EX12-009 Wankomon (Lv.3, cost 3) is LOAD-BEARING, not
      # filler: it is the only card in this hand DCGO considers playable, and
      # without it DCGO never asks p1 a main_phase question AT ALL, so the p1
      # main-phase rows (steps 3 / 7 / 14) are consumed by nobody and the line
      # desyncs. That is what the previous all-Option hand did -- the oracle
      # aborted at "step 3 expected actor 1 but DCGO asked actor 0", where
      # actor 0 is p0's NEXT breeding prompt, i.e. p1's whole main phase had
      # been skipped.
      #
      # DCGO's MainPhase() runs EndTurnProcess() and `goto EndMainPhase`
      # WITHOUT consulting InputDriver when CanSelect() is false
      # (TurnStateMachine.cs:1298-1308) -- the one code path that can produce
      # "our engine asks a main-phase decision and DCGO never does".
      # CanSelect()'s hand clause is HandCards.Some(
      # CanPlayFromHandDuringMainPhase). For an OPTION that is false whenever
      # CanNotPlayThisOption holds (CardSource.cs:158-163), which it does on
      # every turn of this line via !MatchColorRequirement
      # (CardSource.cs:238-243 + 308-311: every card colour must be covered by
      # Owner.GetFieldPermanents(), and p1's field -- battle AND breeding --
      # is empty all game). So an all-Option p1 hand makes all five CanSelect()
      # clauses false: no permanents to declare or attack with, no trash, and
      # no Option playable.
      #
      # Wankomon takes the Digimon branch instead (CardSource.cs:147-152 ->
      # CanPutFieldThisPermanentCard(true, null) -> CanPlayCardTargetFrame,
      # CardSource.cs:1145-1155): p1 has empty battle frames, and cost 3 is
      # inside Owner.MaxMemoryCost under EITHER reading of DCGO's memory sign
      # (Player.cs:1131-1148 gives 7 or 13 for p1 at 3 memory; both >= 3), so
      # the cost gate cannot reject it. CanSelect() is therefore true and DCGO
      # asks.
      #
      # It is never PLAYED -- every p1 main-phase step still answers `pass`, so
      # p1's board stays empty -- and it is inert in hand: [On Play] only
      # (EX12_009.cs:26, OnEnterFieldAnyone), no OnDeclaration effect, and no
      # prompt in this line reads p1's hand.
      #
      # POSITIVE CONTROL for the claim above: 54 main-phase `pass` steps across
      # the corpus have PASS as our engine's ONLY legal action and are
      # confirmed against the oracle; every one of them has at least one
      # Digimon card in the acting seat's hand. The three that do not -- steps
      # 3 / 7 / 14 of THIS file -- are the only ones that ever aborted.
      - EX12-009
      - EX12-074
      - EX12-075
      - EX12-070
      - EX12-074
      # security (5-9): never checked.
      - EX12-009
      - EX12-011
      - EX12-063
      - EX12-036
      - EX12-047
      # draws: T2 (10), T4 (11), T6 (12), T8 (13).
      - EX12-075
      - EX12-074
      - EX12-070
      - EX12-009
    rest: toho-braves
steps:
  # T1 (p0, memory 0): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (p1): all-pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  # T3 (p0, memory 3): the stack's bottom card and Decode's eventual payload.
  - actor: 0
    do: { play: { card: EX12-026, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  # T5 (p0, memory 3): MarineBullmon over Shellmon -- printed blue circle (4)
  # vs the [Aquatic]/[Shambala] alt (3); the VALUE 3 takes the alt.
  - actor: 0
    do: { digivolve: { from: field.0, using: EX12-031 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { value: 3 } }
    expect: { prompt: SelectCountEffect }
  # effect#1's placement prompt is live (Kaguyamon and Kokeshimon in hand both
  # pass its Lv.<=6 [TB] filter). DECLINED: the stack must stay [EX12-026] so
  # Decode's later pick has exactly one candidate.
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: SelectHandEffect }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  # T7 (p0, memory 3): Kaguyamon over MarineBullmon. Only its
  # "Lv.5 w/[Puppet]/[Shambala]: Cost 3" alt matches, so no cost prompt; its
  # [WD] trash revive is silent (p0's trash is empty). MarineBullmon is now a
  # SOURCE, and its inherited <Decode> is live.
  - actor: 0
    do: { digivolve: { from: field.0, using: EX12-065 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  # T9 (p0, memory 3): Kokeshimon -- the removal engine.
  - actor: 0
    do: { play: { card: EX12-062, from: hand } }
    expect: { prompt: main_phase }
  # Kokeshimon's payment: "By deleting 1 of your Digimon" takes any level, so
  # it takes the carrier at slot 0 (Kokeshimon itself is slot 1). The enemy
  # half then finds no target and asks nothing.
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # THE CLAUSE, half 1 -- the inherited Decode window on a non-battle leave.
  - actor: 0
    do: { select: { yes: true } }
    expect: { prompt: OptionalSkill }
  # THE CLAUSE, half 2 -- the source pick, answered by IDENTITY. One accept id
  # (Shellmon; the stack's other card is MarineBullmon itself at Lv.5, above
  # the filter), but the identity payload is what rides the wire as
  # `select_card_ids` -- the shape DCGO's SelectCardEffect requires
  # (SelectCardEffect.cs:923-938 matches `select_card_ids` against
  # ScriptedCandidateIds() and sets Indicies = null; :941-944 ABORTS on a bool).
  # This used to be `yes: true` because Material prompts could not be addressed
  # by identity -- that gap is CLOSED, verified here by lowering both payloads
  # against the live prompt: `cards: [EX12-026]` resolves and the line walks on,
  # while `value: 2000` is still refused ("count payload 2000 has no candidate
  # set"). Same shape as the confirmed sibling EX12-031-effect0.yaml.
  - actor: 0
    do: { select: { cards: [EX12-026] } }
    expect: { prompt: SelectCardEffect }
  # The deleted carrier's own bundle: Kaguyamon's [On Deletion] and its
  # mandatory <Fortitude>, both offering EX12-065 -- the stacked-trigger case
  # `ordinal:` exists for. See the ORDINAL CAVEAT above.
  - actor: 0
    do: { select: { cards: [EX12-065], ordinal: 0 } }
    expect: { prompt: MultipleSkills }
  # Trailing step: the cost-4 play left memory at -1, so p0's turn ended with
  # the clause; p1's breeding decision closes the line.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  # The Decode play is the witness: Shellmon is on p0's board with NO
  # digivolution cards (it was PLAYED out of the stack, not moved), and
  # MarineBullmon -- whose inherited clause did the playing -- is the only
  # card in the trash. Kaguyamon's own mandatory <Fortitude> put IT back on
  # the battle area with an empty stack, which is why the trash holds one
  # card and the board holds three.
  - at: 26
    that:
      p0.memory: -1
      p0.trash: [EX12-031]
      p1.field: []
      p0.field:
        - { card_id: EX12-026, dp: 5000, suspended: false, sources: [] }
        - { card_id: EX12-062, dp: 5000, suspended: false, sources: [] }
        - { card_id: EX12-065, dp: 12000, suspended: false, sources: [] }
