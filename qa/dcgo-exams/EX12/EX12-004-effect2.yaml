# Exam scenario: EX12-004 Onibimon, clause EX12-004#effect#2 -- the <Execute>
# keyword body: "(At the end of your turn, this Digimon may attack. At the end
# of that attack, delete this Digimon. Your opponent's unsuspended Digimon can
# also be attacked with this effect.)"
#
# To watch the END-OF-ATTACK SELF-DELETE separately from ordinary battle
# deletion, the carrier must WIN its battle: build Onibimon -> Wankomon ->
# Shellmon (EX12-026, [TB], both digivolves via the [Shambala] alt circles,
# entirely in breeding where nothing triggers), then move. On the owner's
# turn Shellmon reads 7000 DP (5000 + Wankomon's inherited +2000), the
# defender is P1's unsuspended 2000 DP Wankomon: the defender loses the
# battle, then <Execute> deletes the surviving attacker at the end of that
# attack -- both deletions are the keyword body's own observables.
#
# P1 mirrors the cheap Wankomon build as the target. Both carriers become
# attack-capable the turn they MOVE out of breeding (DCGO's `MovePermanent`
# never stamps `EnterFieldTurnCount`, so the moved stack passes the
# entered-this-turn attack gate; our engine agrees), so the <Execute> gate
# opens at the end of EVERY owner turn while a carrier can attack:
# P1's T4/T6 (declined) and P0's T5 (declined) and T7 (the exam's YES).
#
# RESOLVED (task_69f10a66 Family 1): the engine-gap note that used to live
# here is fixed -- conditionally granted keywords now synthesize their
# triggered auto-effects (game/mod.rs build_effects_for_card), so the
# EndOfTurnAction park is LIVE sim-side at each of those boundaries. The
# gate rows below are authored in OUR vocabulary (`pass` = decline the
# park, `attack` = spend it); the job emitter maps them to DCGO's surface
# (OptionalSkill no / OptionalSkill yes + SelectAttackEffect). The
# OptionalSkill decline bridge in DCGO's harness mod (select_cancel = "no",
# OptionalSkill.cs) is landed, so declines no longer abort the job.
card: EX12-004
clause: EX12-004#effect#2
seed: 424242
decks:
  p0:
    stack: [EX12-009, EX12-026, EX12-011, EX12-031, EX12-046,   # opening hand
            EX12-046, EX12-046, EX12-061, EX12-062, EX12-070,   # security
            EX12-011, EX12-031, EX12-061]                       # T3 / T5 / T7 draws
    rest: toho-braves
  p1:
    stack: [EX12-009, EX12-011, EX12-031, EX12-046, EX12-061,   # opening hand
            EX12-046, EX12-046, EX12-062, EX12-070, EX12-070,   # security
            EX12-011, EX12-031, EX12-061]                       # T2 / T4 / T6 draws
    rest: toho-braves
steps:
  # Turn 1 (P0): hatch Onibimon, digivolve Wankomon (alt circle, cost 0).
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: breeding, using: EX12-009 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # Turn 2 (P1): the target's build, one turn behind.
  - actor: 1
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { digivolve: { from: breeding, using: EX12-009 } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # Turn 3 (P0, memory 3): digivolve Shellmon over the breeding Wankomon via
  # its alt circle "Lv.3 w/[Shambala]: Cost 2" (3 -> 1; the standard blue
  # circle does not match the red Wankomon, so the path is unambiguous, and
  # no [When Digivolving] trigger fires in breeding).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: breeding, using: EX12-026 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # Turn 4 (P1): move the target to battle; it stays unsuspended for good.
  - actor: 1
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # P1's own <Execute> gate opens at T4's end (moved stacks can attack the
  # move turn). Decline it to keep P1 inert.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: OptionalSkill }
  # Turn 5 (P0): move the Shellmon stack to battle.
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # P0's <Execute> gate at T5's end -- decline (the exam spends T7's).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: OptionalSkill }
  # Turn 6 (P1): pass -- and decline P1's OWN <Execute> gate again.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: OptionalSkill }
  # Turn 7 (P0): pass everything -- the exam window opens at end of turn.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # Spend the gate: attack the UNSUSPENDED Wankomon (the keyword's widened
  # defender set). 7000 vs 2000: the defender is deleted by battle, then
  # <Execute> deletes the surviving Shellmon at the end of that attack. On
  # the wire this one row becomes OptionalSkill(yes) + SelectAttackEffect.
  - actor: 0
    do: { attack: { attacker: field.0, target: field.0 } }
    expect: { prompt: OptionalSkill }
  # Sim-only phase exit: our engine stays parked in EndOfTurnAction until a
  # PASS even after the carrier self-deleted; DCGO rotates on its own, so
  # this row emits nothing on the wire.
  - actor: 0
    do: { pass: {} }
  # Trailing pass: P1's next breeding decision.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  # Pre-attack setup, at the T7 main-phase pass (turn 7, P0's turn; step 19
  # after the three gate rows): the attacker reads 7000 DP -- Wankomon's
  # inherited [Your Turn] +2000 over the printed 5000 -- with both sources
  # under it; the defender sits unsuspended at its printed 2000.
  - at: 19
    that:
      turn: 7
      p0.field: [{ card_id: EX12-026, dp: 7000, suspended: false, sources: [EX12-004, EX12-009] }]
      p1.field: [{ card_id: EX12-009, dp: 2000, suspended: false, sources: [EX12-004] }]
