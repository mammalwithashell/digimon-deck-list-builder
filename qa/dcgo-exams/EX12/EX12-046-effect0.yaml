# Exam scenario: EX12-046 (Shishimamon), clause effect#0 -- "[On Play] [When
# Digivolving] Give 1 of your opponent's Digimon" (the targeting head of the
# Security A. -1 / -3000 DP sentence; the payload halves are clause #1).
#
# The witness is the TARGETED give resolving: p0 plays Shishimamon from hand
# with p1's freshly played Gasamon (2000 DP) on the field, answers the
# field-permanent prompt with OUR slot reference, and the granted -3000 DP
# takes Gasamon to -1000 <= 0 -- rule 17-1-3-1 deletes it on the spot. A
# deleted target is an observable no static aura can fake.
#
# Gasamon is chosen as the target deliberately: it has no [On Play] and no
# [On Deletion] text, so both its arrival and its deletion are silent -- the
# only parked prompt on the whole line is the clause's own target pick.
#
# Memory: T1/T2 all-pass hands p1 then p0 the pass-granted 3. p1's cost-3
# Gasamon (3 -> 0) keeps p1's turn; p0's cost-7 Shishimamon (3 -> -4) ends
# p0's turn after resolution, so the trailing pass is p1's next breeding
# decision.
#
# Stacks pin hand (0-4), security (5-9, never touched) and each seat's draws
# so no duplicate of a referenced card reaches the acting hand.
card: EX12-046
clause: EX12-046#effect#0
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4): the Option/Tamer-free fillers never act
      - EX12-046
      - EX12-070
      - EX12-074
      - EX12-075
      - EX12-065
      # security (5-9) -- never touched
      - EX12-009
      - EX12-011
      - EX12-062
      - EX12-063
      - EX12-036
      # draws: T3 turn (10)
      - EX12-074
    rest: toho-braves
  p1:
    stack:
      # hand (0-4): exactly one EX12-020 so the play intent is unambiguous
      - EX12-020
      - EX12-070
      - EX12-074
      - EX12-075
      - EX12-065
      # security (5-9) -- never touched
      - EX12-009
      - EX12-011
      - EX12-062
      - EX12-063
      - EX12-036
      # draws: T2 turn (10), T4 turn (11)
      - EX12-074
      - EX12-075
    rest: toho-braves
steps:
  # T1 (p0): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (p1): play Gasamon (cost 3, memory 3 -> 0), keep the turn, pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: EX12-020, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (p0): the clause -- play Shishimamon (cost 7, memory 3 -> -4); its
  # [On Play] parks the "give 1 of your opponent's Digimon ..." target pick.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: EX12-046, from: hand } }
    expect: { prompt: main_phase }
  # The target: p1's lone Gasamon. -3000 DP takes it to -1000 -> deleted.
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # The overshooting play ended p0's turn; p1's breeding decision closes.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  # Gasamon deleted by the granted -3000 DP: p1's field empty, its card in
  # trash, Shishimamon standing alone on p0's field.
  - at: 9
    that: { p1.field: [], p1.trash: [EX12-020] }
