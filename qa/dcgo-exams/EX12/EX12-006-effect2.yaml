# Exam scenario: EX12-006 Kakamon, clause EX12-006#effect#2 --
# "Digivolve: Lv.2 w/[Shambala] trait: Cost 0" (the printed ALTERNATE
#  digivolution requirement in the card's digivolve circle).
#
# The witness is that the digivolve is LEGAL AT ALL. Kakamon is RED and its
# standard circle reads "Lv.2 / 0", so a red Lv.2 base would satisfy it without
# the alt path. The base here is EX12-002 Mococomon -- a YELLOW Lv.2 Digi-Egg
# with the [Shambala] trait -- so the standard circle's colour requirement
# fails and ONLY "Lv.2 w/[Shambala]: Cost 0" can license the digivolve. Exactly
# one path matches, so neither engine opens a cost EffectChoice.
#
# A Digi-Egg cannot leave the breeding area at Lv.2, and the projection has no
# breeding zone, so the digivolve is made VISIBLE by stacking one more level on
# top of it in breeding and then moving the whole stack out:
#
#   T1 (P0, memory 0): hatch Mococomon; digivolve Kakamon over it in breeding
#       (THE CLAUSE, cost 0 -- memory is unchanged); then digivolve Apemon
#       EX12-012 over Kakamon via ITS alt circle (Lv.3 w/[Shambala]: Cost 2),
#       which overshoots 0 -> -2 and ends the turn.
#   T2 (P1, memory 2): all-pass, handing P0 3 memory.
#   T3 (P0, memory 3): move the stack to the battle area, where the projection
#       finally shows it: Apemon over sources [EX12-002, EX12-006].
#
# Apemon's own "[On Play][When Digivolving] By trashing 1 [SW] card from hand,
# <Draw 2>" is deliberately starved: after the two digivolves the hand holds
# EX12-009 / EX12-011 / EX12-026, none of them [SW], so BOTH engines skip the
# effect on their condition (DCGO AdditionalActivateCondition ->
# HasMatchConditionOwnersHand; ours `count_gte SW >= 1`) and no prompt parks.
#
# Kakamon never becomes the TOP card of a battle-area permanent on this line,
# so its own "[Start of Your Main Phase]" trigger never fires and no hand
# prompt interrupts the T3 breeding/main boundary.#
# EVERY DIGIVOLVE DRAWS 1 (the core rule, before any [When Digivolving] effect
# resolves), so both T1 digivolves pull from the stack: stack[10] and stack[11]
# are those draws and are pinned to non-[SW] cards deliberately -- an unpinned
# tail card landing in hand there could be [SW] and would open Apemon's
# trash-for-<Draw 2> prompt, desynchronizing the line for a reason that is not
# the clause.
card: EX12-006
clause: EX12-006#effect#2
seed: 424242
decks:
  p0:
    stack: [EX12-006, EX12-012, EX12-009, EX12-011, EX12-026,   # opening hand
            EX12-020, EX12-031, EX12-039, EX12-043, EX12-046,   # security
            EX12-020,                                           # [10] Kakamon digivolve-draw
            EX12-031,                                           # [11] Apemon digivolve-draw
            EX12-026]                                           # [12] T3 turn draw
    rest: toho-mococo
  p1: { stack: [], rest: toho-mococo }
steps:
  # T1 (P0, memory 0): hatch the Digi-Egg.
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  # THE CLAUSE: Kakamon over the yellow [Shambala] egg for 0.
  - actor: 0
    do: { digivolve: { from: breeding, using: EX12-006 } }
    expect: { prompt: main_phase }
  # One more level so the stack can legally leave breeding; the cost-2
  # overshoot ends the turn.
  - actor: 0
    do: { digivolve: { from: breeding, using: EX12-012 } }
    expect: { prompt: main_phase }
  # T2 (P1, memory 2): nothing.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, memory 3): move the stack out, making the digivolution cards
  # visible in the projection.
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  # Right after the T1 digivolve: cost 0 was paid (memory unchanged at 0).
  - at: 2
    that:
      p0.memory: 0
  # Pre-step state of the T3 main-phase pass, still P0's turn: the stack the
  # clause built is on the field -- Apemon over [EX12-002, EX12-006]. Apemon's
  # 6000 DP is its printed 4000 plus Kakamon's [Your Turn] inherited +2000
  # (that half is EX12-006#inherited#0's own exam).
  - at: 6
    that:
      p0.memory: 3
      p0.field: [{ card_id: EX12-012, dp: 6000, suspended: false, sources: [EX12-002, EX12-006] }]
