# Exam scenario: BT11-089 (Akiho Rindou), clause BT11-089#effect#3 --
# "[Security] Play this card without paying the cost."
#
# THE SECURITY-TRIGGER SKELETON (see EX1-066-effect2.yaml for the full
# derivation). A seat's `stack:` is a draw-order prefix on both engines and the
# security pile is laid AFTER the mulligan from that same ordered deck, so:
#
#     stack[0..4]  -> the opening hand, drawn in that order
#     stack[5..9]  -> the SECURITY stack, REVERSED:
#                        stack[9] = TOP (flipped first) ... stack[5] = bottom
#     stack[10..]  -> subsequent draws, in order
#
# Both engines are pinned to KEEP under a scripted line (our ScenarioAdapter
# `construct()` calls `game.start_game()`; DCGO's `SetRedraw` forces
# `isRedraw=false` while `InputDriver.IsActive`), so the pile is deterministic.
# A scenario mulligan verb would break this -- mulligan is a true reshuffle
# (§5-2-1-5).
#
# The card under exam therefore sits at P0's stack[9] and is the FIRST card the
# single security check of the line flips.
#
# P1's line is the proven attacker skeleton (EX12-075-security0.yaml): Gasamon
# (EX12-020, Lv.3, cost 3) is played on P1's first turn at memory 3 (3 -> 0, so
# the turn continues and P1 passes out), sheds summoning sickness over T3, and
# attacks security on T4. Gasamon's only printed effect is a [Your Turn]
# would-digivolve cost reduction -- passive -- and its inherited [When
# Attacking] <Draw 1> belongs to whatever digivolves OVER it, not to itself, so
# neither the play nor the attack opens a prompt. P0's battle area stays empty
# until the flip, so no blocker window precedes the check.
#
# BOTH seats' security stacks are fully pinned. EX12-074 must never sit in
# either -- its "[Security] [Your Turn] [Once Per Turn] When one of your
# [Shambala] trait Digimon attacks" functions FROM the security stack and
# Gasamon IS [Shambala], so an unpinned P1 security pile would bury the line
# under a TriggerOrder roughly a third of the time under DCGO's shuffle. The
# EX12-074-free `toho-security-*` decks plus the pinned piles close that off on
# both sides.
#
# THE REVEAL IS ENGINEERED VACUOUS ON PURPOSE, and this is the one place
# this line could have manufactured a false divergence. BT11-089's [On
# Play] adds "1 red Digimon card with the [Vaccine] trait", and the two
# engines do NOT read "trait" the same way:
#   * DCGO  -- CardSource.CardTraits = Form_ENG + ATTRIBUTE_ENG + Type_ENG,
#     so `CardTraits.Contains("Vaccine")` matches the ATTRIBUTE line.
#   * ours  -- BT11-089.yaml filters `trait_has: Vaccine`, and our CardData
#     has no attribute field at all (predicate.rs: `attribute_is` is a
#     no-op stub), so only the Type line is scanned.
# Every red Vaccine Digimon in the toho pool (EX12-009 / -011 / -046 /
# -047) carries Vaccine as its ATTRIBUTE and not in its Type line, so a
# reveal containing one would make DCGO ask a pick our engine never parks
# -- a divergence about clause #0, landing in the middle of a line scoped
# to clause #3. The four revealed cards are therefore chosen to be
# ineligible under BOTH readings (three yellow/Data Digimon and one
# Option), where DCGO's `if (maxCount >= 1)` gate and our
# `choose_from_reveal` fizzle agree that there is nothing to ask.
# (The trait-vs-attribute gap itself is a genuine finding against
# BT11-089#effect#0; it is out of this file's scope and is reported
# separately rather than fixed here.)
card: BT11-089
clause: BT11-089#effect#3
seed: 424242
decks:
  p0:
    stack:
      # hand [0-4]: cost 12/16 bricks -- unplayable at memory 3, no hand [Main]
      - EX12-047
      - EX12-047
      - EX12-065
      - EX12-065
      - EX12-076
      # security [5-8]: quiet filler, never flipped (one check only)
      - EX12-009
      - EX12-009
      - EX12-009
      - EX12-009
      # security [9]: THE TOP CARD -- the clause under exam
      - BT11-089
      # [10]: P0's T3 turn draw
      - EX12-011
      # [11-14]: the 4 cards BT11-089's [On Play] reveals. NONE of them is a
      # red Digimon with Vaccine -- see the note above -- so the add-to-hand
      # pick is empty on BOTH engines and only the ordering prompt remains.
      - EX12-061      # yellow Digimon, Data
      - EX12-062      # yellow Digimon, Data
      - EX12-063      # yellow Digimon, Data
      - EX12-070      # Option, not a Digimon at all
    rest: toho-security-tamers
  p1:
    stack:
      # hand [0-4]: the attacker plus inert filler
      - EX12-020
      - EX12-011
      - EX12-011
      - EX12-026
      - EX12-026
      # security [5-9]: pinned and quiet; never flipped, and EX12-074-free
      - EX12-031
      - EX12-031
      - EX12-031
      - EX12-031
      - EX12-062
    rest: toho-braves
steps:
  # T1 (P0, memory 0): all-pass; the main pass hands P1 3 memory.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, memory 3): play Gasamon (3 -> 0, turn continues), then pass out.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: EX12-020, from: hand.0 } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0): all-pass; Gasamon sheds summoning sickness. P0 draws stack[10].
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1, memory 3): THE CLAUSE. Gasamon attacks security; the check flips
  # P0's stack[9].
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  # The played Tamer's OWN [On Play] fires: reveal 4, add 1 red [Vaccine]
  # Digimon (no candidate -- see the note), then "place the rest at the
  # bottom of your deck IN ANY ORDER". That ordering is a real decision on
  # both sides and is answered here as one row of 4 identities: our
  # `order_remainder` -> `select_ordered_permutation` re-installs itself
  # per pick over a shrinking list, and DCGO's
  # ReturnRevealedCardsToLibraryBottom opens ONE SelectCardEffect with
  # maxCount = remaining (4) and canEndNotMax false. Same single wire row,
  # same four identities, resolved by each engine against its own
  # candidate list. The chosen order is unobservable here (the line ends
  # before P0 draws again), so any order is as good as another -- reveal
  # order is used.
  - actor: 0
    do: { select: { cards: [EX12-061, EX12-062, EX12-063, EX12-070] } }
    expect: { prompt: SelectCardEffect }
  # Attacking spends no memory; P1 keeps the turn. One step past the clause.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  # Minimal, and only over facts the stack prefix pins. The clause's witness
  # is the Tamer standing on P0's FIELD (played, not trashed) with P1's
  # memory untouched at 3. P0's hand is unchanged apart from the T3 turn
  # draw -- the reveal added nothing (no eligible card) and trashed nothing
  # (the remainder goes to the deck BOTTOM, not the trash).
  - at: 10
    that:
      p0.memory: -3
      p0.security: 4
      p0.trash: []
      p0.hand: [EX12-011, EX12-047, EX12-047, EX12-065, EX12-065, EX12-076]
      p0.field:
        - { card_id: BT11-089, dp: -1, suspended: false, sources: [] }
      p1.field:
        - { card_id: EX12-020, dp: 2000, suspended: true, sources: [] }
