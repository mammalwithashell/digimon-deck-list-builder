# Exam scenario: EX12-015 (Gokuumon), clause effect#1 --
# "[On Play][When Digivolving] 1 of your opponent's Digimon gets -4000 DP
#  until their turn ends. Then, 1 of your other Digimon with the [SW] trait
#  may gain <Alliance> for the turn and attack."
#
# Reached on the [When Digivolving] half, in the BATTLE area. That is not a
# style choice: a breeding-area digivolve fires NEITHER engine's
# [When Digivolving] -- DCGO's `WhenDigivolvingClass` gates on
# `IsExistOnBattleAreaTrigger` (CardEffectFactory.cs:1029) and ours agrees
# (probed: Seasarmon's own [When Digivolving] delete stays silent at T3 with
# p1's Gasamon on the board). So Seasarmon is MOVED to the battle area at T5
# and Gokuumon digivolves on top of it there, in the same turn.
#
# The witness is p1's Gasamon (2000 DP) taking -4000 and hitting 0 DP, which
# deletes it (rule 17-1-3-1): p1.field empties and p1.trash gains EX12-020 at
# step 15. A survivor would show the DP delta more directly, but every way to
# put a >4000 DP Digimon on p1's board inside 3 memory routes through
# EX12-026 Shellmon, whose own [When Digivolving] would then trash two of
# Seasarmon's digivolution cards and park two more prompts -- noise on top of
# the clause under exam rather than evidence about it.
#
# The clause's SECOND half ("1 of your other Digimon with the [SW] trait may
# gain <Alliance> ... and attack") has NO candidate here: Gokuumon is p0's only
# battle-area Digimon, and the filter excludes itself. DCGO guards that half
# with `HasMatchConditionPermanent(CanSelectOwnerPermanentCondition)` and ours
# with an empty candidate set, so neither engine opens a prompt -- symmetric,
# and deliberately out of this file's scope.
#
# TRAIT DIVERGENCE, FLAGGED NOT EXERCISED: the printed card and our DSL filter
# that second half on the [SW] trait; DCGO filters it on [Shambala]
# (EX12_015.cs `CanSelectOwnerPermanentCondition` -> `EqualsTraits("Shambala")`,
# and its effect description prints "[Shambala]" too). Every [SW] card in EX12
# also carries [Shambala], so an [SW] pick is safe in both engines, but a
# [Shambala]-only Digimon (EX12-009 / -011 / -020 ...) would be offered by DCGO
# and refused by ours. Reaching that half at all is left to a follow-on file so
# this one cannot fail for a reason that is not the -4000 DP.
#
# Highway: the proven red breeding line from EX12-047-effect1.yaml --
#   T1 hatch + Wankomon (alt [Shambala], 0) / T3 Seasarmon (2) /
#   T5 move + Gokuumon over it (alt [Shambala], 3).
# Seasarmon's [When Digivolving] delete never has a target: p1's board is empty
# until T4, and by then Seasarmon is already digivolved.
card: EX12-015
clause: EX12-015#effect#1
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4)
      - EX12-009
      - EX12-011
      - EX12-015
      - EX12-070
      - EX12-075
      # security (5-9) -- never checked; Digimon only, no [Security] text
      - EX12-026
      - EX12-062
      - EX12-031
      - EX12-065
      - EX12-046
      # draws: T1 dv (10), T3 turn (11), T3 dv (12), T5 turn (13), T5 dv (14).
      # No draw repeats EX12-009/011/015 -- a second copy in hand would make
      # the `using:` intent ambiguous and lowering would refuse.
      - EX12-070
      - EX12-061
      - EX12-075
      - EX12-031
      - EX12-061
    rest: toho-sw
  p1:
    stack:
      # hand (0-4): Gasamon pinned at slot 0, the only card p1 ever plays
      - EX12-020
      - EX12-075
      - EX12-065
      - EX12-031
      - EX12-046
      # security (5-9) -- never checked
      - EX12-009
      - EX12-020
      - EX12-026
      - EX12-011
      - EX12-062
    rest: toho-braves
steps:
  # T1 (p0, memory 0): hatch, then Wankomon over the egg (alt [Shambala], 0).
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: breeding, using: EX12-009 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (p1, memory 3): all-pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (p0, memory 3): Seasarmon over Wankomon IN BREEDING (cost 2 -> 1). Its
  # [When Digivolving] delete does not fire there, and p1 has no board anyway.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: breeding, using: EX12-011 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (p1, memory 3): play Gasamon -- the -4000 DP target (3 -> 0).
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: EX12-020, from: hand.0 } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (p0, memory 3): move Seasarmon out, then THE CLAUSE -- Gokuumon
  # digivolves onto it in the battle area (alt [Shambala] circle, cost 3).
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: EX12-015 } }
    expect: { prompt: main_phase }
  # Both circles are open from the red Lv.4 [Shambala] Seasarmon, so both
  # engines ask which cost to pay (ours EffectChoice, DCGO SelectCountEffect
  # over the distinct cost list). The answer is the VALUE.
  - actor: 0
    do: { select: { value: 3 } }
    expect: { prompt: SelectCountEffect }
  # THE CLAUSE resolving: the mandatory -4000 DP pick.
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  # MINIMAL and prefix-pinned. 2000 DP - 4000 <= 0 deletes Gasamon, so the
  # -4000 shows up as p1's board emptying into p1's trash.
  - at: 15
    that:
      p1.field: []
      p1.trash: [EX12-020]
