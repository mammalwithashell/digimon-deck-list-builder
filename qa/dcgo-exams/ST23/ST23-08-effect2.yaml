# Exam scenario: Monarchlizamon (ST23-08), clause ST23-08#effect#2 --
# "[On Play] [When Digivolving] This Digimon gets +3000 DP until your
#  opponent's turn ends. Then, if it's your turn, by trashing the bottom
#  face-down card from under any of your Tamers, you may play or use 1 [Glowing
#  Dawn] trait card from your hand with the cost reduced by 3."
#  (Measured through the [On Play] arm.)
#
# PROVISIONAL: asserts are OUR engine's result, not DCGO's.
#
# THE LINE (deck gd-bt26-7th): T1 p0 hard-plays Kyo Sawashiro BT26-089 (0 ->
# -3). It has no [On Play] and -- unlike ST23-13/14 -- no "when effects trash
# cards from under this Tamer" trigger, which keeps the clause's own trash
# free of interleaved prompts. T2 p1 all-pass. T3 (3): BT26-089's [Start of
# Your Main Phase] places BT26-070 from hand face down under it, <Draw 1>
# (ST23-03) and +1 memory (3 -> 4). p0 hard-plays Monarchlizamon for 7
# (4 -> -3). THE CLAUSE: +3000 (7000 -> 10000), then the face-down BT26-070 is
# trashed and Liollmon (ST23-02, cost 3) is played for 3 - 3 = 0: memory stays
# -3 (asserted), the Tamer has no sources, BT26-070 is in the trash.
#
# PROMPT SHAPE (card YAML crosscheck of ST23_08.cs): DCGO runs the clause as
# ONE shared ActivateClass: +3000, then a canNoSelect Tamer SelectPermanentEffect
# (the "may"), then a canNoSelect SelectHandEffect, then the play.
# Ours splits it into two triggers on the same timing, so:
#   - our TriggerOrder over [ST23-08, ST23-08] has no DCGO counterpart ->
#     sim_only (ordinal 0 = the mandatory +3000 half, verified: picking it
#     resolves silently and leaves the optional half);
#   - our "You may activate" accept gate for the optional half is DCGO's
#     canNoSelect Tamer pick -> sim_only yes, then the shared Tamer pick;
#   - the hand pick is SelectHandEffect on both.
card: ST23-08
clause: ST23-08#effect#2
seed: 424242
decks:
  p0:
    stack: [BT26-089, ST23-08, ST23-02, BT25-035, BT26-070,
            ST23-15, ST23-15, BT25-057, BT25-057, BT25-043,
            ST23-06, ST23-03, ST23-04, ST23-09]
    rest: gd-bt26-7th
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08, BT4-014]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT26-089, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { select: { cards: [BT26-070] } }
    expect: { prompt: SelectHandEffect }
  - actor: 0
    do: { play: { card: ST23-08, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { cards: [ST23-08], ordinal: 0, sim_only: true } }
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { select: { cards: [ST23-02] } }
    expect: { prompt: SelectHandEffect }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 6
    that:
      turn: 3
      p0.memory: 4
      p0.hand: [BT25-035, ST23-02, ST23-03, ST23-06, ST23-08]
      p0.trash: []
      p0.field:
        - card_id: BT26-089
          dp: -1
          suspended: false
          sources: [BT26-070]
  - at: 11
    that:
      turn: 4
      p0.memory: -3
      p0.hand: [BT25-035, ST23-03, ST23-06]
      p0.trash: [BT26-070]
      p0.field:
        - card_id: BT26-089
          dp: -1
          suspended: false
          sources: []
        - card_id: ST23-02
          dp: 2000
          suspended: false
          sources: []
        - card_id: ST23-08
          dp: 10000
          suspended: false
          sources: []
