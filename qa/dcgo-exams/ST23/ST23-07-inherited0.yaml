# Exam scenario: Armalizamon (ST23-07), clause ST23-07#inherited#0 --
# <Piercing> "(When this Digimon deletes your opponent's Digimon in battle while
#  attacking, it checks security before the attack ends.)"
#
# PROVISIONAL: asserts are OUR engine's result, not DCGO's.
#
# THE LINE (the whole climb stays in BREEDING so no [When Digivolving] fires --
# breeding-area Digimon can't activate effects, and Monarchlizamon's shared
# OP/WD would otherwise open sim-only trigger-order rows):
#   T1 hatch + ST23-12 (0).  T2 p1 plays Agumon BT3-007 (2).
#   T3 ST23-12 -> Armalizamon in breeding (2; 3 -> 1).  T4 p1 all-pass.
#   T5 Armalizamon -> Monarchlizamon ST23-08 in breeding (3; 3 -> 0).
#   T6 p1's Agumon attacks p0's security (top BT26-025, 1000 DP, no
#      [Security] text -> Agumon survives) and stays suspended.
#   T7 p0 moves Monarchlizamon (7000, Armalizamon in its sources) out and
#      attacks the suspended Agumon (4000): Agumon is deleted and the
#      inherited <Piercing> checks p1's top security (ST1-02) -> p1.security
#      5 -> 4, p1.trash [BT3-007, ST1-02] (asserted). Without Piercing the
#      security would stay 5.
#   Monarchlizamon's <Alliance> has no other Digimon to suspend: no prompt.
#
# PROMPT SHAPE: none -- Piercing is mandatory (16-6, keyword-semantics.md);
# DCGO PierceSelfEffect(isInheritedEffect) (card YAML crosscheck).
