# Exam scenario: Atratusmon (ST23-09), clause ST23-09#effect#3 --
# "<Blocker> (This Digimon can block in the blocker timing.)"
#
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO. It stays unconfirmed until the oracle pass.
#
# THE WITNESS. P1's Agumon BT3-007 attacks P0's security; P0 blocks with
# Atratusmon (suspending it), wins the battle 12000 vs 4000 and Agumon is
# deleted. P0's security stays at 5 and Atratusmon reads suspended -- the
# block happened.
#
# THE LINE is ST23-09-effect4.yaml's (memory ledger there) handed over to P1:
#   T1 P0 hard-plays Murasamemon BT25-041 (0 -> -7); T2 P1 plays Biyomon and
#   Agumon (7 -> 3); T3 P0 digivolves Atratusmon (3 -> 0), its [When
#   Digivolving] deletes Biyomon (lowest DP); P0 passes (P1 -> 3);
#   T4 P1 attacks with Agumon, P0 blocks.
#
# PROMPT SHAPE: Blocker is a static self keyword (ST23_09.cs, ST23-09.yaml
# crosscheck); the block window is DCGO's SelectPermanentEffect over own
# blockers (as BT25-058-effect2.yaml). Atratusmon's own [When Attacking] does
# not fire on a block. The one sim_only row is an ENGINE FINDING (BT25-041's
# inherited [End of Attack] offered on the OPPONENT's attack) -- see the row.
card: ST23-09
clause: ST23-09#effect#3
seed: 424242
decks:
  p0:
    stack: [BT25-041, ST23-09, BT16-082, BT16-082, BT25-090,
            ST23-03, ST23-03, ST23-03, ST23-04, ST23-04,
            BT25-049, BT25-049, BT25-049]
    rest: gd-bt26-1st
  p1:
    stack: [ST1-02, BT3-007, ST1-04, BT1-009, ST1-03,
            BT1-014, BT4-010, BT3-007, BT1-009, ST1-02,
            ST1-04, ST1-03, BT1-014, BT4-010]
    rest: tm-quiet-red
steps:
  # T1 (P0, 0): hard-play Murasamemon for 7 (0 -> -7).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT25-041, from: hand } }
    expect: { prompt: main_phase }
  # T2 (P1, 7): Biyomon and Agumon (7 -> 3), then pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { play: { card: BT3-007, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, 3): digivolve Atratusmon for 3 (3 -> 0) -- [When Digivolving].
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: ST23-09 } }
    expect: { prompt: main_phase }
  # [When Digivolving] (#effect#4): delete the lowest-DP opponent Digimon.
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect, count: 1 }
  # End T3 (P0 0 -> P1 3). Atratusmon never attacked: it stays unsuspended.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1, 3): Agumon (played T2, so it may attack) attacks P0's security --
  # the blocker window opens for P0.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  # THE CLAUSE: P0 blocks with Atratusmon. Battle 12000 vs 4000: Agumon is
  # deleted; P0's security is untouched.
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # SIM-ONLY -- ENGINE FINDING: BT25-041's inherited "[End of Attack] [Once
  # Per Turn] By trashing the bottom face-down card from under any of your
  # Tamers, this Digimon ... unsuspends" is offered to P0 at the end of P1's
  # attack. Our EndOfAttack is an observer timing fanned out to every battle
  # area (combat/mod.rs end-of-attack cleanup) and BT25-041.yaml carries no
  # "this Digimon attacked" gate, nor a payability gate (P0 has no Tamer).
  # [End of Attack] reads as THIS Digimon's attack ending; DCGO is expected to
  # stack nothing here -> sim_only decline. Expected oracle agreement on state.
  - actor: 0
    do: { select: { decline: true, sim_only: true } }
  # One step past the clause; attacking spent no memory, P1 keeps the turn.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 14
    that:
      turn: 4
      p1.memory: 3
      p0.security: 5
      p0.field:
        - card_id: ST23-09
          dp: 12000
          suspended: true
          sources: [BT25-041]
      p1.field: []
      p1.trash: [BT3-007, ST1-02]
