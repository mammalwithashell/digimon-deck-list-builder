# Exam scenario: Armalizamon (ST23-07), clause ST23-07#effect#1 --
# "[On Play] [When Digivolving] If you have 1 or fewer Tamers, you may play 1
#  Tamer card with the [Glowing Dawn] trait from your hand without paying the
#  cost."  (Measured through the [When Digivolving] arm, 0 Tamers.)
#
# PROVISIONAL: asserts are OUR engine's result, not DCGO's.
#
# THE LINE: T1 hatch + ST23-12 (0). T3 (3) move ST23-12 out, digivolve
# Armalizamon on it via the [Glowing Dawn] condition (2; 3 -> 1). THE CLAUSE:
# p0 has 0 Tamers; it picks Tomoro & Kyo (ST23-13, cost 4) from hand and plays
# it free -- memory stays 1 (asserted). ST23-13's own [On Play] "You may place
# the top card of your deck face down" is accepted (stack[13] ST23-03 goes
# under it); p1 has no Digimon, so no memory is gained.
#
# PROMPT SHAPE: DCGO ST23_07.cs shared OP/WD: SelectHandEffect canNoSelect:true
# Mode.PlayForFree over [Glowing Dawn] Tamers (card YAML crosscheck) -- one
# SelectHandEffect, matching our optional Hand pick. ST23-13's place is an
# optional yes/no on both sides (as in ST23-06-effect2.yaml).
card: ST23-07
clause: ST23-07#effect#1
seed: 424242
decks:
  p0:
    stack: [ST23-12, ST23-07, ST23-13, BT25-035, BT26-070,
            ST23-15, ST23-15, BT25-057, BT25-057, BT25-043,
            ST23-09, BT25-041, ST23-06, ST23-03]
    rest: gd-bt26-7th
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08, BT4-014]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: breeding, using: ST23-12 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: ST23-07 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { cards: [ST23-13] } }
    expect: { prompt: SelectHandEffect }
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  # DCGO asks this ST23-13 "you may" as SetIntSelection (Yes=1 / No=2) on the
  # generic_int channel, not as an OptionalSkill (ST23_13.cs SharedActivateCoroutine,
  # optional: false), so its answer rides a separate dcgo_only row.
  - actor: 0
    do: { select: { value: 1, dcgo_only: true } }
    expect: { prompt: generic_int }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 9
    that:
      turn: 3
      p0.memory: 1
      p0.hand: [BT25-035, BT25-041, BT26-070, ST23-06, ST23-09]
      p0.field:
        - card_id: ST23-07
          dp: 6000
          suspended: false
          sources: [ST23-01, ST23-12]
        - card_id: ST23-13
          dp: -1
          suspended: false
          sources: [ST23-03]
