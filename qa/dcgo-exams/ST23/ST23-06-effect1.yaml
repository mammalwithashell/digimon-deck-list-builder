# Exam scenario: Gekkomon (ST23-06), clause ST23-06#effect#1 -- the
# "[When Moving]" timing fragment of
# "[When Moving] [On Play] Reveal the top 3 cards of your deck. Among them, add
#  1 [Glowing Dawn] trait card to the hand and place 1 such card face down
#  under any of your [Glowing Dawn] trait Tamers. Return the rest to the
#  bottom of the deck."
# The clause extractor splits the timing header: #effect#1 is "[When Moving]"
# (empty body) and #effect#2 is the [On Play] + body (measured separately in
# ST23-06-effect2.yaml). This line triggers the SAME body through the
# breeding -> battle MOVE, so it witnesses the [When Moving] arm.
#
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO. It stays unconfirmed until the oracle pass (NOTES-GLOWING-DAWN.md).
#
# THE LINE (memory ledger in brackets):
#   T1 P0 [0]: hatch Kekkomon (ST23-01); digivolve it in the breeding area into
#       Gekkomon (cost 0) [0], draw stack[10] (BT16-082). Hard-play Tomoro &
#       Kyo ST23-13 (cost 4) [-4]; its [On Play] "You may place the top card
#       of your deck face down under this Tamer" -> yes, places stack[11]
#       (ST23-03). Turn ends on the overshoot.
#   T2 P1 [4]: all-pass.
#   T3 P0 [3]: draw stack[12] (BT25-049). Breeding phase: MOVE Gekkomon to the
#       battle area -> THE CLAUSE. Revealed stack[13..15] = ST23-09, ST23-04,
#       ST23-12, all [Glowing Dawn]. Bucket 1 (hand) = ST23-09, bucket 2 (under
#       a Tamer) = ST23-04 placed under the only [Glowing Dawn] Tamer; ST23-12
#       to the bottom. Then the Tamer's [Start of Your Main Phase] places the
#       next deck card (stack[16], BT26-089) under it (yes) -- no memory: P1
#       has no Digimon. Trailing pass.
#   Witness: ST23-09 in hand, the Tamer carries [ST23-03, ST23-04, BT26-089],
#   memory still 3 (a move costs nothing), Gekkomon in the battle area.
#
# PROMPT SHAPE (ST23-06.yaml DCGO crosscheck of ST23_06.cs): the WM/OP body is
# ONE shared ActivateClass on OnMove + OnEnterFieldAnyone, optional: false.
# With a GD Tamer: SimplifiedRevealDeckTopCardsAndSelect, two buckets (AddHand
# + Custom) -> two SelectCardEffect rows, then SelectPermanentEffect over GD
# Tamers (canNoSelect: false). Our one-card remainder ordering is the
# OrderedPermutation-at-N=1 prompt DCGO never asks -> sim_only row. The two
# OptionalSkill rows answer ST23-13's "You may place" ([On Play] on T1,
# [Start of Your Main Phase] on T3). Same shape as the passing
# ST23-06-effect2.yaml.
card: ST23-06
clause: ST23-06#effect#1
seed: 424242
decks:
  p0:
    stack: [ST23-06, ST23-13, BT16-082, BT25-090, ST23-15,
            ST23-15, ST23-15, BT25-057, BT25-057, BT25-043,
            BT16-082, ST23-03, BT25-049, ST23-09, ST23-04,
            ST23-12, BT26-089]
    rest: gd-bt26-1st
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08,
            BT1-014, BT4-010, BT3-007, BT1-009, ST1-02,
            ST1-04, ST1-03]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: breeding, using: ST23-06 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { play: { card: ST23-13, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  # DCGO asks this ST23-13 "you may" as SetIntSelection (Yes=1 / No=2) on the
  # generic_int channel, not as an OptionalSkill (ST23_13.cs SharedActivateCoroutine,
  # optional: false), so its answer rides a separate dcgo_only row.
  - actor: 0
    do: { select: { value: 1, dcgo_only: true } }
    expect: { prompt: generic_int }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3: THE CLAUSE -- the breeding -> battle move.
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { select: { cards: [ST23-09] } }
    expect: { prompt: SelectCardEffect }
  - actor: 0
    do: { select: { cards: [ST23-04] } }
    expect: { prompt: SelectCardEffect }
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect, count: 1 }
  # SIM-ONLY: our OrderedPermutation at N=1; DCGO asks nothing.
  - actor: 0
    do: { select: { cards: [ST23-12], sim_only: true } }
  # ST23-13 [Start of Your Main Phase]: "You may place ..." -> yes.
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  # DCGO asks this ST23-13 "you may" as SetIntSelection (Yes=1 / No=2) on the
  # generic_int channel, not as an OptionalSkill (ST23_13.cs SharedActivateCoroutine,
  # optional: false), so its answer rides a separate dcgo_only row.
  - actor: 0
    do: { select: { value: 1, dcgo_only: true } }
    expect: { prompt: generic_int }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 13
    that:
      turn: 3
      p0.memory: 3
      p0.hand: [BT16-082, BT16-082, BT25-049, BT25-090, ST23-09, ST23-15]
      p0.trash: []
      p0.field:
        - card_id: ST23-06
          dp: 1000
          suspended: false
          sources: [ST23-01]
        - card_id: ST23-13
          dp: -1
          suspended: false
          sources: [BT26-089, ST23-03, ST23-04]
