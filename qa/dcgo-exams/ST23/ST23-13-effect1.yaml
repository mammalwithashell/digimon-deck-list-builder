# Exam scenario: Tomoro Tenma & Kyo Sawashiro (ST23-13), clause
# ST23-13#effect#1 -- "[Your Turn] When effects trash cards from under this
# Tamer, by suspending this Tamer, 1 of your [Glowing Dawn] trait Digimon gets
# +3000 DP until your opponent's turn ends."
#
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO. It stays unconfirmed until the oracle pass.
#
# The trasher is Kekkomon's inherited [When Attacking] (the ST23-01-inherited0
# line, identical through the attack). ST23-12-effect1.yaml shows the same
# trigger off Chiropmon's [On Play].
#
# THE LINE (memory, P0's view):
#   T1 P0 (0): hatch Kekkomon; digivolve it in breeding into Chiropmon (cost 0,
#      draws stack[10]); hard-play Tomoro & Kyo (0 -> -4), place yes:
#      stack[11] BT25-043 under it.
#   T2 P1 (4): pass -> P0 3.
#   T3 P0 (3): draw stack[12]; move Chiropmon; SOMP place yes: stack[13]
#      ST23-04 to the bottom. Chiropmon attacks -> Kekkomon's inherited: pick
#      BT25-049, trash ST23-04 from under the Tamer -> THE CLAUSE triggers:
#      suspend the Tamer, +3000 to the only [Glowing Dawn] Digimon; the
#      digivolve completes (cost 0; draws stack[14]); P1 checks BT1-009.
#      Pass (3 -> P1 3).
#   T4 P1: all-pass (draws stack[11]).  T5 P0: draws stack[15]; SOMP place
#      yes (stack[16]).
# WITNESS: Tamer suspended + 7000 on Armalizamon through P1's turn, 4000 on
# P0's next turn (expiry "until your opponent's turn ends").
#
# PROMPT SHAPE (ST23-13.yaml DCGO crosscheck of ST23_13.cs):
# OnDigivolutionCardDiscarded, CanUse IsOwnerTurn, suspend-cost ->
# SelectPermanentEffect over own [Glowing Dawn] Digimon (canNoSelect:false)
# -> ChangeDigimonDP +3000 UntilOpponentTurnEnd.
# NOTE (printed text): the official DB prints "[Your Turn]"; the YAML header's
# "[All Turns]" quote is stale -- behaviour (your-turn gate) matches the print.
card: ST23-13
clause: ST23-13#effect#1
seed: 424242
decks:
  p0:
    stack: [ST23-13, ST23-12, BT25-049, BT16-082, BT16-082,
            BT25-041, BT25-041, BT25-041, BT25-032, BT25-032,
            BT25-043, BT25-043, BT25-057, ST23-04, BT25-057,
            ST23-06, ST23-09]
    rest: gd-bt26-1st
  p1:
    stack: [ST1-03, ST1-05, BT1-009, BT3-007, ST1-08,
            ST1-02, ST1-04, BT1-014, BT4-010, BT1-009,
            ST1-04, ST1-04]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: breeding, using: ST23-12 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { play: { card: ST23-13, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  # DCGO asks this ST23-13 "you may" as SetIntSelection (Yes=1 / No=2) on the
  # generic_int channel, not as an OptionalSkill (ST23_13.cs SharedActivateCoroutine,
  # optional: false), so its answer rides a separate dcgo_only row.
  - actor: 0
    do: { select: { value: 1, dcgo_only: true } }
    expect: { prompt: generic_int }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  # DCGO asks this ST23-13 "you may" as SetIntSelection (Yes=1 / No=2) on the
  # generic_int channel, not as an OptionalSkill (ST23_13.cs SharedActivateCoroutine,
  # optional: false), so its answer rides a separate dcgo_only row.
  - actor: 0
    do: { select: { value: 1, dcgo_only: true } }
    expect: { prompt: generic_int }
  - actor: 0
    do: { attack: { attacker: field.1, target: security } }
    expect: { prompt: main_phase }
  # The trasher: Kekkomon's inherited (ST23-01#inherited#0). optional_gate_fold:
  # DCGO's optional ActivateClass asks
  # OptionalSkill, our engine carries the "may" on the declinable hand pick.
  # PROMPT-ORDER RISK: ours picks the hand card BEFORE paying the trash cost;
  # DCGO pays the cost (Tamer pick) first, then DigivolveIntoHandOrTrashCard
  # asks SelectHandEffect. If the oracle aborts here on "expected
  # SelectPermanentEffect", that is this ordering, not the line.
  - actor: 0
    do: { select: { cards: [BT25-049] } }
    expect: { prompt: OptionalSkill }
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect, count: 1 }
  # THE CLAUSE: the cost trash above fired Tomoro & Kyo's "[Your Turn] When
  # effects trash cards from under this Tamer". One declinable trigger ->
  # DCGO OptionalSkill (TriggerOrder at bundle length 1).
  # ENGINE FINDING (expected oracle divergence in prompt ORDER): ours resolves
  # it HERE, mid-way through Kekkomon's effect, before the digivolve.
  # general_rule.pdf 15-8-3-2: a trigger-type effect can't activate during
  # effect processing -- it waits until Kekkomon's effect finishes. DCGO is
  # expected to ask this AFTER the digivolve, with BT25-049 as the target.
  # Outcome-neutral here: the DP modifier rides the same permanent either way.
  - actor: 0
    do: { select: { cards: [ST23-13] } }
    expect: { prompt: OptionalSkill }
  # "1 of your [Glowing Dawn] trait Digimon" -- the only one is the attacker
  # (own.field.1; the Tamer is not a Digimon). DCGO: SelectPermanentEffect
  # maxCount min(1,count), canNoSelect:false.
  - actor: 0
    do: { select: { targets: [own.field.1] } }
    expect: { prompt: SelectPermanentEffect, count: 1 }
  # Attack resolved; P0 passes at 3 -> P1 3.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1): all-pass; "until your opponent's turn ends" keeps the +3000 live.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0): the modifier has expired. Breeding pass (empty area, hatch
  # declined), then the Tamer's [Start of Your Main Phase] place -> yes.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  # DCGO asks this ST23-13 "you may" as SetIntSelection (Yes=1 / No=2) on the
  # generic_int channel, not as an OptionalSkill (ST23_13.cs SharedActivateCoroutine,
  # optional: false), so its answer rides a separate dcgo_only row.
  - actor: 0
    do: { select: { value: 1, dcgo_only: true } }
    expect: { prompt: generic_int }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  # T3, attack resolved: Tomoro & Kyo suspended to pay the trigger; the
  # Chiropmon that got +3000 became Armalizamon mid-effect and the modifier
  # rode the permanent: 4000 + 3000 = 7000.
  - at: 15
    that:
      turn: 3
      p0.memory: 3
      p0.trash: [ST23-04]
      p0.field:
        - card_id: BT25-049
          dp: 7000
          suspended: true
          sources: [ST23-01, ST23-12]
        - card_id: ST23-13
          dp: -1
          suspended: true
          sources: [BT25-043]
  # T4, during the opponent's turn: still 7000.
  - at: 17
    that:
      turn: 4
      p0.field:
        - card_id: BT25-049
          dp: 7000
          suspended: true
          sources: [ST23-01, ST23-12]
        - card_id: ST23-13
          dp: -1
          suspended: true
          sources: [BT25-043]
  # T5, P0's breeding phase: "until your opponent's turn ends" has expired.
  - at: 18
    that:
      turn: 5
      p0.field:
        - card_id: BT25-049
          dp: 4000
          suspended: false
          sources: [ST23-01, ST23-12]
        - card_id: ST23-13
          dp: -1
          suspended: false
          sources: [BT25-043]
