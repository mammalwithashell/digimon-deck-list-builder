# Exam scenario: Wolvermon (ST23-11), clause ST23-11#effect#2 --
# "[Your Turn] When this Digimon would digivolve into a [Glowing Dawn] trait
#  Digimon card, by trashing the bottom face-down card from under any of your
#  Tamers, reduce the cost by 2."
#
# PROVISIONAL: asserts are OUR engine's result, not DCGO's.
#
# THE LINE (deck gd-bt26-8th -- its only Tamers, ST23-13/ST23-14, both carry a
# "when effects trash cards from under this Tamer" trigger, hence the declines): T1 hatch + ST23-12 (0). T3 (3) move ST23-12 out, digivolve
# Wolvermon on it (alt, 2; 3 -> 1) -- the Digimon enters BEFORE the Tamer, so
# `field.0` is Wolvermon on both wires (README "Slot safety" rule 2) -- then
# hard-play Tomoro & Kyo ST23-13 (1 -> -3), whose [On Play] places ST23-06
# face down. T5 (3): ST23-13's [Start of Your Main Phase] places BT25-032 at
# the BOTTOM (official Q&A). THE CLAUSE: Wolvermon digivolves into
# Monarchlizamon (alt, printed 3); the reducer trashes the bottom face-down
# BT25-032 and the digivolve costs 1: memory 3 -> 2 (asserted at 17; Tamer
# sources [ST23-06], trash [BT25-032]). Monarchlizamon's [When Digivolving]
# then resolves (+3000; its optional half trashes ST23-06 and plays BT25-049
# for 4 - 3 = 1: 2 -> 1), ST23-13's trash trigger is declined both times.
#
# PROMPT SHAPE (card YAML crosscheck of ST23_11.cs): DCGO's reducer is a
# BeforePayCost ActivateClass whose Tamer pick is canNoSelect:true -- ONE
# SelectPermanentEffect. Ours asks an EffectChoice "Use Cost reduction?" gate
# first -> that row is sim_only, the Tamer pick is shared.
# ENGINE/ORDER NOTE (expected oracle divergence risk): ours opens ST23-13's
# "[Your Turn] When effects trash cards from under this Tamer" trigger
# (step 16, TriggerOrder of 1 -> OptionalSkill) BEFORE the digivolution
# completes (memory still 3, Wolvermon still on top at step 16), and later
# (step 20) between Monarchlizamon's trash and its hand pick, i.e. in the
# middle of an effect. Rules-wise the trigger should wait until the
# digivolve / the effect finishes resolving; DCGO may ask it later or batch it.
# Monarchlizamon's split triggers: see ST23-08-effect2.yaml.
