# Exam scenario: Gekkomon (ST23-06), clause ST23-06#inherited#0 --
# INHERITED "<Piercing> (When this Digimon deletes your opponent's Digimon in
#  battle while attacking, it checks security before the attack ends.)"
#
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO. It stays unconfirmed until the oracle pass (NOTES-GLOWING-DAWN.md).
#
# THE LINE (memory ledger in brackets):
#   T1 P0 [0]: hatch Kekkomon (ST23-01); digivolve it in the breeding area into
#       Gekkomon ST23-06 (cost 0) [0], draw stack[10]; pass.
#   T2 P1 [3]: plays Agumon ST1-03 (cost 3) [0], passes.
#   T3 P0 [3]: draw stack[11]; MOVE Gekkomon. Its own [When Moving] fires
#       (that is ST23-06#effect#1, not under exam here): with no
#       [Glowing Dawn] Tamer only the add-to-hand bucket runs -- reveal
#       stack[12..14] = ST23-09 / BT16-082 / BT25-090, add ST23-09 (the only
#       [Glowing Dawn] card), bottom the other two. Digivolve into Armalizamon
#       BT25-049 (cost 2) [1], draw stack[15]. Its [When Digivolving] suspends
#       Agumon. Armalizamon (4000) attacks the suspended Agumon (2000) ->
#       deleted in battle.
#   THE CLAUSE: Armalizamon's own printed <Piercing> is a TOP card's inherited
#       effect and does not apply; the only <Piercing> in play is inherited
#       from ST23-06 in its sources (Kekkomon's inherited is a Tamer-cost
#       [When Attacking] digivolve with no Tamer on board -> silent). P1's
#       security drops 5 -> 4 (top ST1-02, 3000, trashed) although the attack
#       targeted a Digimon.
#
# PROMPT SHAPE (ST23-06.yaml DCGO crosscheck): PierceSelfEffect(
# isInheritedEffect: true) -- no prompt. The [When Moving] reveal with no GD
# Tamer is SimplifiedRevealDeckTopCardsAndSelect with one AddHand bucket ->
