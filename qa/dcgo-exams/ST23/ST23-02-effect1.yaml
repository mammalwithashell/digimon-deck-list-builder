# Exam scenario: Liollmon (ST23-02), clause ST23-02#effect#1 --
# "[Your Turn] When this Digimon would digivolve into a Digimon card with the
#  [Glowing Dawn] trait, reduce the cost by 1."
#
# PROVISIONAL: asserts are OUR engine's result, not DCGO's.
#
# THE LINE: T1 hatch Kekkomon + Liollmon via its alt condition (0). T3 (memory
# 3) Liollmon is MOVED to the battle area first -- a breeding-area Digimon
# "can't activate effects" (digest, 6-4 / glossary), and our engine agrees: a
# probe that digivolved in BREEDING paid the full 2. On the battle area p0
# digivolves Armalizamon (ST23-07, [Glowing Dawn]) onto it. Armalizamon's only
# route from yellow Liollmon is its "Lv.3 w/[Glowing Dawn]: Cost 2" condition
# (corner circle is GREEN Lv.3), so the printed cost is 2; the clause takes 1
# off: memory 3 -> 2 (asserted). Armalizamon's [When Digivolving] finds no
# [Glowing Dawn] Tamer in hand and opens nothing.
#
# PROMPT SHAPE: none. DCGO ST23_02.cs: ChangeDigivolutionCostStaticEffect
# changeValue -1, PermanentCondition = this permanent, CardSourceCondition =
# Glowing Dawn, Condition IsOwnerTurn -- a static, no prompt (card YAML
# crosscheck). ST23_07.cs's shared OP/WD SelectHandEffect has no candidate.
