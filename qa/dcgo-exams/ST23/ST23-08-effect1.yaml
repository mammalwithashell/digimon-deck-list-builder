# T3 hard-play Monarchlizamon, whose [On Play] plays Liollmon from hand for
# 0). T4 p1 all-pass. T5 (3): BT26-089's [Start of Your Main Phase] hand pick
# is DECLINED. Monarchlizamon attacks p1's security; THE CLAUSE: p0 suspends
