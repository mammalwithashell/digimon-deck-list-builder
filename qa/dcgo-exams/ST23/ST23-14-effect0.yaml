# Exam scenario: Reina Sakuya & Makoto Kuonji (ST23-14, purple/black Tamer,
# cost 4), clause ST23-14#effect#0 -- "[Start of Your Main Phase] [On Play]
# You may place the top card of your deck face down under this Tamer. Then,
# if your opponent has a Digimon, gain 1 memory."
#
# Both arms are walked: [On Play] on T1 (P1 has no Digimon -> place only, no
# memory) and [Start of Your Main Phase] on T3 (P1 now has Agumon -> place
# AND +1 memory). The assert pins the T3 arm, where both halves are visible.
#
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO. It stays unconfirmed until the oracle pass.
#
# THE LINE (memory ledger, P0 perspective):
#   T1 (0): pass breeding; hard-play ST23-14 (4) -> -4 (turn will end).
#       [On Play]: place yes -> deck top stack[10] ST23-03 face down under
#       it; P1 has no Digimon -> no memory.
#   T2 (P1, 4): play Agumon ST1-03 (3) -> 1; pass -> P0 at 3.
#   T3 (3): draw stack[11] ST23-13. THE CLAUSE ([SOMP] arm): place yes ->
#       stack[12] ST23-02 face down under ST23-14; P1 has Agumon -> +1 -> 4.
#   Witness: at T1-end memory -4 and 1 source (the [On Play] arm gave no
#   memory); at T3 main memory 4 and sources {ST23-03, ST23-02}.
#
# PROMPT SHAPE (cards/st23/ST23-14.yaml DCGO crosscheck of ST23_14.cs):
#   "IDENTICAL to ST23-13: internal Yes/No place top deck card FD under self
#   (gated on deck non-empty), then unconditional gain 1 memory if the
#   opponent has a battle-area Digimon." Ours: a 2-label EffectChoice,
#   answered `yes` exactly as the passing ST23-06-effect2 line answers
#   ST23-13's identical prompt (no expect: the EffectChoice class is
#   unasserted sim-side).
