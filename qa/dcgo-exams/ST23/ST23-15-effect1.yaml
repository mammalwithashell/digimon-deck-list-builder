# "[Main] You may play 1 [BEATBREAK] trait card with a play cost of 4 or less
#  from your hand or trash without paying the cost. Then, place this card in
#  the battle area."
#
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO. It stays unconfirmed until the oracle pass.
#
# THE LINE (memory, P0's view):
#   T1 P0 (0): hard-play Tomoro & Kyo (0 -> -4); place yes: stack[10] ST23-03.
#   T2 P1 (4): pass -> P0 3.
#   T3 P0 (3): draw stack[11]; Tamer SOMP place yes: stack[12] ST23-04. Use
