# WITNESS: BT25-049 on the field at no memory cost; ST23-15 on the field.
# (The "or trash" branch is not exercised: an empty trash keeps DCGO's zone
# menu out of the line.) ST23-15-effect2.yaml continues this line to T5.
#
# PROMPT SHAPE (ST23-15.yaml DCGO crosscheck): OptionSkill -> Hand/Trash/
