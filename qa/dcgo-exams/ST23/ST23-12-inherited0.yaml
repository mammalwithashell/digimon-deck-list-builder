# Exam scenario: Chiropmon (ST23-12), clause ST23-12#inherited#0 --
# "<Retaliation> (When only this Digimon is deleted in battle, delete the
#  Digimon it battled.)"  (inherited: live on whatever digivolves over it)
#
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO. It stays unconfirmed until the oracle pass.
#
# THE LINE (memory ledger, P0's view):
#   T1 P0 (0): hatch Kekkomon; digivolve it in breeding into Chiropmon through
#      the "Lv.2 w/[Glowing Dawn]: Cost 0" route (0 -> 0, draws stack[10]); pass
#      -> P1 3.
#   T2 P1 (3): play Agumon ST1-03 (3 -> 0); pass -> P0 3.
#   T3 P0 (3): move Chiropmon to the battle area; digivolve it into Armalizamon
#      BT25-049 (Lv.3 w/[Glowing Dawn]: cost 2; 3 -> 1, draws stack[11]). Its
#      [When Digivolving] "You may suspend 1 of your opponent's Digimon" takes
#      Agumon (a pick, not a decline -- the cleaner row for DCGO). Armalizamon
#      (4000) attacks security and stays SUSPENDED; P1 checks BT1-009 (no
#      security effect). Pass -> P1 3.
#   T4 P1 (3): digivolve Agumon into Birdramon ST1-05 (cost 2; 3 -> 1).
#      Birdramon 5000 + Agumon's inherited [Your Turn] +1000 = 6000 attacks the
#      suspended Armalizamon. 6000 vs 4000 deletes ONLY Armalizamon -> the
#      inherited <Retaliation> from Chiropmon deletes Birdramon.
# WITNESS: p1.field empty and ST1-05 in P1's trash. Without the keyword
# Birdramon would survive the battle it won.
#
# Kekkomon's own inherited [When Attacking] (also live under Armalizamon on T3)
# is gated on a Tamer with a face-down source, and P0 has no Tamer, so it
# never fires.
#
# PROMPT SHAPE: DCGO RetaliationSelfEffect(isInherited) is a mandatory keyword
# (ST23-12.yaml crosscheck) -> no prompt on either side. BT25-049's suspend is
# SelectPermanentEffect canNoSelect:true (BT25-049.yaml crosscheck), answered
# with a target. P1's post-battle hand still holds Digimon, so DCGO's
# CanSelect() stays true and the trailing P1 pass is a real decision.
card: ST23-12
clause: ST23-12#inherited#0
seed: 424242
decks:
  p0:
    stack: [ST23-12, BT25-049, BT16-082, BT16-082, ST23-13,
            BT25-041, BT25-041, BT25-041, BT25-032, BT25-032,
            BT25-043, BT25-043, BT25-043]
    rest: gd-bt26-1st
  p1:
    stack: [ST1-03, ST1-05, BT1-009, BT3-007, ST1-08,
            ST1-02, ST1-04, BT1-014, BT4-010, BT1-009,
            ST1-04, BT1-014, BT4-010]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: breeding, using: ST23-12 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-03, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT25-049 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect, count: 1 }
  - actor: 0
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { digivolve: { from: field.0, using: ST1-05 } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { attack: { attacker: field.0, target: field.0 } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  # Before the trailing pass: the 6000-DP Birdramon beat the 4000-DP
  # Armalizamon, and Retaliation (inherited from Chiropmon under it) deleted
  # Birdramon too -- both battle areas are empty.
  - at: 14
    that:
      turn: 4
      p0.memory: -1
      p0.security: 5
      p1.security: 4
      p0.field: []
      p1.field: []
      p0.trash: [BT25-049, ST23-01, ST23-12]
      p1.trash: [BT1-009, ST1-03, ST1-05]
