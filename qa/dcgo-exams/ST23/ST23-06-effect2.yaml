# Exam scenario: Gekkomon (ST23-06), clause ST23-06#effect#2 --
# "[When Moving] [On Play] Reveal the top 3 cards of your deck. Among them, add
#  1 [Glowing Dawn] trait card to the hand and place 1 such card face down
#  under any of your [Glowing Dawn] trait Tamers. Return the rest to the
#  bottom of the deck."  (Measured through the [On Play] arm.)
#
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO. It stays unconfirmed until the oracle pass (NOTES-GLOWING-DAWN.md).
#
# THE LINE: T1 P0 hard-plays Tomoro & Kyo (ST23-13, 0 -> -4); its [On Play]
# places stack[10] (ST23-03) under it. T3 (memory 3): the Tamer's [Start of
# Your Main Phase] places stack[12] (BT26-089) under it (stack[11] BT25-049 was
# the T3 draw). P0 plays Gekkomon for 3 (3 -> 0). Revealed stack[13..15]:
#   ST23-09, ST23-04, ST23-12 -- all [Glowing Dawn].
# Bucket 1 (hand) = ST23-09, bucket 2 (under a Tamer) = ST23-04, placed under
# the only [Glowing Dawn] Tamer; ST23-12 goes to the bottom.
#
# PROMPT SHAPE (from the YAML's DCGO crosscheck of ST23_06.cs): DCGO runs
# SimplifiedRevealDeckTopCardsAndSelect with two buckets (AddHand + Custom),
# then a SelectPermanentEffect over [Glowing Dawn] Tamers (canNoSelect: false).
# Ours: two RevealBucket picks + an OwnField pick. The one-card remainder is
# our OrderedPermutation-at-N=1 prompt, which DCGO never asks -> sim_only row.
# The OptionalSkill rows answer ST23-13's "You may place" on both turns.
