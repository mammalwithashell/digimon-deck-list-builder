# Exam scenario: EX10-028 Landramon, clause EX10-028#inherited#0 --
# "When effects trash this card from a [Mineral] or [Rock] trait Digimon's
#  digivolution cards, delete 1 of your opponent's Digimon with a play cost of
#  4 or less."
#
# THE LINE: Landramon A (EX10-028) must become a digivolution card of a Mineral/Rock
# Digimon, then an effect must trash it from there.
#   T1  EX11-038 #A played, cost-trashes Landramon A from hand (trash: [EX10-028])
#   T3  EX11-038 #B played, cost-trashes Gotsumon BT14-009     (trash: [EX10-028, BT14-009])
#       EX10-025 played: places both as its bottom sources     (sources: [EX10-028, BT14-009])
#   T5  EX11-038 #A (field.0) digivolves into Landramon B (the T1 draw, cost 2); B's
#       [When Digivolving] cost trashes Landramon A FROM EX10-025's sources -> A's
#       inherited delete hits p1's BT16-082 Ukkomon (play cost 3).
# NOTE (known engine finding, G-ENGINE-SOURCE-TRASH-TRIGGER-RESOLVES-MID-EFFECT): the
# trashing effect is Landramon B's own [When Digivolving], which still has its grant
# pick to make after the cost, so the stacked inherited trigger is expected to reorder
# against that pick exactly as on the EX10-025 sibling exam. A first attempt used
# EX11-038 (only "Draw 1" after the cost) as the trasher to dodge that, but our
# UnionZone prompt resolves a digivolution-SOURCE pick neither by identity nor by
# value (valid ids [2024, 2025] are positional; `cards:` only searches hand/trash,
# `value:` is a count payload), so with 2 qualifying sources it cannot be authored.
# Landramon B's cost is a SourceMulti prompt, which does resolve sources by identity.
card: EX10-028
clause: EX10-028#inherited#0
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4)
      - EX11-038
      - EX11-038
      - EX10-025
      - EX10-028
      - BT14-009
      # security (5-9): never checked
      - EX10-032
      - EX10-032
      - EX10-032
      - EX10-032
      - EX10-033
      # (10) T1 draw by EX11-038 #A  == Landramon B
      - EX10-028
      # (11) T3 turn draw, (12) T3 draw by EX11-038 #B
      - BT16-082
      - BT16-082
      # (13) T5 turn draw
      - BT16-082
    rest: rocks-exam-tumble
  p1:
    stack:
      # hand (0-4)
      - BT16-082
      - BT16-082
      - BT16-082
      - BT16-082
      - EX10-033
      # security (5-9)
      - EX10-032
      - EX10-032
      - EX10-032
      - EX10-032
      - EX10-033
      # (10) p1's T2 draw
      - EX10-036
    rest: rocks-exam-tumble
steps:
  # T1 (p0): play EX11-038 #A (cost 3 -> memory -3), cost-trashing Landramon A from hand.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: EX11-038, from: hand.0 } }
    expect: { prompt: main_phase }
  # EX11-038 [On Play] cost: DCGO opens a zone menu first (generic_int: 0 = "From
  # hand", 1 = "From digivolution cards", 2 = "Do not trash"); our single UnionZone
  # prompt folds it.
  - actor: 0
    do: { select: { value: 0, dcgo_only: true } }
  - actor: 0
    do: { select: { cards: [EX10-028] } }
    expect: { prompt: SelectHandEffect }
  # T2 (p1): play Ukkomon BT16-082 (cost 3 -> memory 0), the delete target.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: BT16-082, from: hand.0 } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (p0, memory 3): EX11-038 #B (-> 0), cost-trashing Gotsumon from hand.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: EX11-038, from: hand.0 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { value: 0, dcgo_only: true } }
  - actor: 0
    do: { select: { cards: [BT14-009] } }
    expect: { prompt: SelectHandEffect }
  # EX10-025 (-> memory -3): place [EX10-028, BT14-009] from trash onto itself.
  # PROMPT ORDER (as measured on the EX10-025 sibling exam): DCGO asks ONE
  # SelectCardEffect (2 cards) first and the host SelectPermanentEffect second; ours
  # asks the host first then two sequential trash picks.
  - actor: 0
    do: { play: { card: EX10-025, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { targets: [own.field.2], sim_only: true } }
  - actor: 0
    do: { select: { cards: [EX10-028, BT14-009], dcgo_only: true } }
    expect: { prompt: SelectCardEffect }
  - actor: 0
    do: { select: { cards: [EX10-028], sim_only: true } }
  - actor: 0
    do: { select: { cards: [BT14-009], sim_only: true } }
  - actor: 0
    do: { select: { cards: [EX10-025], dcgo_only: true } }
    expect: { prompt: SelectPermanentEffect }
  # T4 (p1): nothing.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (p0, memory 3): EX11-038 #A (field.0) digivolves into Landramon B (cost 2).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: EX10-028 } }
    expect: { prompt: main_phase }
  # Landramon B [When Digivolving] optional gate: yes.
  - actor: 0
    do: { select: { yes: true } }
    expect: { prompt: OptionalSkill }
  # THE COST: trash Landramon A from EX10-025's sources. DCGO: carrier
  # SelectPermanentEffect (EX10-025), then SelectCardEffect over its sources; ours:
  # one SourceMulti pick naming the source.
  - actor: 0
    do: { select: { cards: [EX10-025], dcgo_only: true } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { select: { cards: [EX10-028], sim_only: true } }
  - actor: 0
    do: { select: { cards: [EX10-028], dcgo_only: true } }
    expect: { prompt: SelectCardEffect }
  # Landramon B's grant pick (itself): DCGO asks it FIRST (after the cost), ours LAST
  # (after the stacked inherited delete) -- split into dcgo_only / sim_only copies.
  - actor: 0
    do: { select: { cards: [EX10-028], dcgo_only: true } }
    expect: { prompt: SelectPermanentEffect }
  # THE CLAUSE: Landramon A's inherited delete -- p1's Ukkomon (play cost 3).
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { select: { targets: [own.field.0], sim_only: true } }
  # One step past the clause.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
