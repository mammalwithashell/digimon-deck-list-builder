# Exam scenario: EX10-025 Sunarizamon, clause EX10-025#effect#0 --
# "[On Play] You may place 2 cards with the [Mineral] or [Rock] trait from your
#  trash as 1 of your [Mineral] or [Rock] trait Digimon's bottom digivolution
#  cards. (Rule) Trait: Has [Mineral] Type."
#
# THE LINE: nothing legal puts cards in the trash from game start except an
# effect, so EX11-038 Sunarizamon ("[On Play] By trashing 1 [Mineral]/[Rock]
# card from your hand ..., Draw 1") is played twice (T1 and T3), each time
# trashing one Rock/Mineral hand card. That leaves exactly 2 qualifying cards
# in trash [EX8-047, EX8-048] when EX10-025 is played on T3 (memory 3 -> 0 -> -3).
card: EX10-025
clause: EX10-025#effect#0
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4)
      - EX11-038
      - EX11-038
      - EX10-025
      - EX8-047
      - EX8-048
      # security (5-9): never checked
      - EX10-032
      - EX10-032
      - EX10-032
      - EX10-032
      - EX10-033
      # (10) T1 draw by EX11-038, (11) T3 draw
      - BT16-082
      - BT16-082
      # (12) T3 draw by EX11-038 #2
      - BT16-082
    rest: rocks-exam
  p1:
    stack:
      - BT16-082
      - BT16-082
      - BT16-082
      - BT16-082
      - EX10-033
      - EX10-032
      - EX10-032
      - EX10-032
      - EX10-032
      - EX10-033
      - EX10-036
    rest: rocks-exam
steps:
  # T1 (p0): play EX11-038 #1 (cost 3 -> memory -3).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: EX11-038, from: hand.0 } }
    expect: { prompt: main_phase }
  # EX11-038 [On Play] cost: DCGO opens a zone menu first (generic_int: 0 = "From
  # hand", 1 = "From digivolution cards", 2 = "Do not trash"); our single UnionZone
  # prompt folds it.
  - actor: 0
    do: { select: { value: 0, dcgo_only: true } }
  - actor: 0
    do: { select: { cards: [EX8-047] } }
    expect: { prompt: SelectHandEffect }
  # T2 (p1): nothing.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (p0, memory 3): EX11-038 #2 (-> 0), trashing EX8-048 from hand.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: EX11-038, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { value: 0, dcgo_only: true } }
  - actor: 0
    do: { select: { cards: [EX8-048] } }
    expect: { prompt: SelectHandEffect }
  # THE CLAUSE: play EX10-025 (-> memory -3).
  - actor: 0
    do: { play: { card: EX10-025, from: hand } }
    expect: { prompt: main_phase }
  # PROMPT ORDER: OUR clause opens with the host pick (its optional gate doubles as
  # the target pick), then two sequential trash picks; DCGO's EX10_025.cs asks ONE
  # SelectCardEffect (maxCount 2, from trash) FIRST and the host SelectPermanentEffect
  # second. Authored as sim_only / dcgo_only pairs so the end state is compared.
  # Host = EX10-025 itself (unique id: two EX11-038 would be an occurrence-order coin
  # flip on the DCGO side; field slot 2 = third Digimon played).
  - actor: 0
    do: { select: { targets: [own.field.2], sim_only: true } }
  - actor: 0
    do: { select: { cards: [EX8-047, EX8-048], dcgo_only: true } }
    expect: { prompt: SelectCardEffect }
  - actor: 0
    do: { select: { cards: [EX8-047], sim_only: true } }
  - actor: 0
    do: { select: { cards: [EX8-048], sim_only: true } }
  - actor: 0
    do: { select: { cards: [EX10-025], dcgo_only: true } }
    expect: { prompt: SelectPermanentEffect }
  # One step past the clause (memory -3: the turn passes on its own, so p1 acts).
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
