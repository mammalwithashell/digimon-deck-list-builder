# Exam scenario: Dinobeemon (BT16-077), clause BT16-077#effect#1 -- <Raid>.
#
# "When this Digimon attacks, you may switch the target of attack to 1 of
#  your opponent's unsuspended Digimon with the highest DP." (16-22)
#
# WHY NOT DNA. Dinobeemon prints "[DNA Digivolve] purple Lv.4 + red Lv.4:
# Cost 0" but the exam format has no DNA verb (`exam::lower::matches_intent`
# has no `DnaDigivolve` arm) and DCGO's `InputDriver.BuildMainPhaseAction`
# refuses the DNA range outright ("Anything else -- DNA digivolve ... returns
# null ... and the job aborts"). So this line reaches Dinobeemon through its
# ORDINARY circle, "purple Lv.4: cost 4" (official DB), from a vanilla purple
# line: Pagumon (ST6-01) -> Elecmon (ST6-05, cost 0) -> Youkomon (ST6-07,
# cost 2) -> Dinobeemon (cost 4). Memory: turn 1 starts at 0; each pass with
# memory on one's own side hands the opponent 3.
#
# T7 (memory 3): digivolving into Dinobeemon costs 4 -> memory -1, the turn
# hands over on its own. DCGO's [When Digivolving] (`SetUpActivateClass(...,
# -1, true, ...)` -- isOptional TRUE) asks an OptionalSkill yes/no first; the
# line DECLINES it so nothing else fires. OUR engine never opens that window
# because BT16-077.yaml gates the whole clause on `dna_origin: true` -- that
# mismatch is BT16-077#effect#3's business (see BT16-077-effect3.yaml); here
# the decline row answers no live prompt on our side and is kept for the wire.
#
# T9 (memory 3): P1 holds an unsuspended Agumon (ST1-03, 2000 DP) promoted on
# T6. Dinobeemon attacks the player; THE CLAUSE offers the switch. general_rule
# 16-22-3 makes it optional: DCGO renders that as OptionalSkill(yes) followed
# by the SelectPermanentEffect pick, while our engine surfaces one declinable
# pick -- `expect: {prompt: OptionalSkill}` on the pick row is the declared
# fold marker (emitter splits it into the two wire rows). Witness: the attack
# was declared on the player yet Agumon is deleted (8000 vs 2000) and P1's
# security stays at 5.
#
# BREEDING PROMPTS (fixed on the resumed audit, 2026-09-18). A Lv.2 in an
# occupied breeding area can neither hatch nor move, so NEITHER engine asks a
# breeding decision that turn -- the turn opens on main_phase (the confirmed
# P-180-effect1.yaml convention). The crashed draft expected `breeding_action`
# on the two breeding digivolves (T3, T4); DCGO asserts `expect:` strictly and
# would have aborted the line at step 4.
#
# Deck accounting: P0 (no T1 draw) draws T3 = stack[10], T5 = [11], T7 = [12],
# T9 = [13]. P1 draws T2 = [10], T4 = [11], T6 = [12], T8 = [13].
card: BT16-077
clause: BT16-077#effect#1
seed: 424242
decks:
  p0:
    stack: [ST6-05, ST6-07, BT16-077, ST6-02, ST6-09,
            ST6-02, ST6-03, ST6-09, ST1-03, ST1-05,
            ST1-02, ST1-04, ST6-03, ST1-05, ST1-02]
    rest: tm-purple-line
  p1:
    stack: [ST1-03, ST1-02, ST1-04, ST1-05, ST1-08,
            ST1-02, ST1-04, ST1-05, ST1-08, ST1-03,
            ST1-13, ST1-14, ST1-10, ST1-13, ST1-14]
    rest: tm-quiet-red
steps:
  # T1 (P0, memory 0): hatch.
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1): hatch.
  - actor: 1
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0): breeding-digivolve -> Elecmon (cost 0).
  - actor: 0
    do: { digivolve: { from: breeding, using: ST6-05 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1): breeding-digivolve -> Agumon.
  - actor: 1
    do: { digivolve: { from: breeding, using: ST1-03 } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, memory 3): promote, digivolve Youkomon (cost 2 -> memory 1).
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: ST6-07 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T6 (P1): promote Agumon.
  - actor: 1
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T7 (P0, memory 3): digivolve Dinobeemon (cost 4 -> memory -1).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT16-077 } }
    expect: { prompt: main_phase }
  # DCGO's [When Digivolving] OptionalSkill gate (isOptional: true): decline.
  # Our engine parks nothing here (dna_origin gate); the row rides the wire.
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: OptionalSkill }
  # Memory -1: P1's turn. T8 (P1, memory 1): nothing.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T9 (P0, memory 3): attack the player with Dinobeemon.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  # THE CLAUSE: take the <Raid> switch onto Agumon (the only unsuspended
  # opponent Digimon, so also the highest DP). OptionalSkill+pick fold.
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: OptionalSkill }
  # One step past the clause.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  # At the attack declaration (step 19): Dinobeemon stands over the vanilla
  # purple line, P1's Agumon is unsuspended.
  - at: 19
    that:
      turn: 9
      p0.memory: 3
      p1.security: 5
      p0.field:
        - { card_id: BT16-077, dp: 8000, suspended: false, sources: [ST6-01, ST6-05, ST6-07] }
      p1.field:
        - { card_id: ST1-03, dp: 2000, suspended: false, sources: [ST1-01] }
  # After the switch: Agumon died in battle, security untouched.
  - at: 21
    that:
      turn: 9
      p1.security: 5
      p1.field: []
      p1.trash: [ST1-01, ST1-03]
      p0.field:
        - { card_id: BT16-077, dp: 8000, suspended: true, sources: [ST6-01, ST6-05, ST6-07] }

