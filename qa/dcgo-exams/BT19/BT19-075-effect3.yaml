# Exam scenario: MoonMillenniummon (BT19-075), clause BT19-075#effect#3 --
# "[All Turns] [Once Per Turn] When other Digimon or Tamers are deleted, trash
#  your opponent's top security card."
#
# THE DELETION happens on p1's OWN turn -- which is what [All Turns] buys --
# and it is p1's Digimon: Biyomon (ST1-02) attacks p0's security on T6 and
# flips Dracomon (ST1-04, 4000 DP, p0's stack[9]) as a Security Digimon; 3000
# loses the battle and Biyomon is deleted. MoonMillenniummon, on p0's board
# since T5, sees it and trashes p1's top security card. Mandatory on both
# sides (BT19_075.cs `SetUpActivateClass(..., 1, false, ...)`; ours has no
# `optional`) and the `IDestroySecurity` / `trash_top_security` takes no pick
# -- no prompt.
#
# THE WITNESS. p1's security reads 4 with its top card (Biyomon ST1-02, the
# unflipped stack[9]) in p1's trash next to the deleted attacker; p0's
# security also reads 4, with Dracomon in p0's trash (a security Digimon is
# trashed after its battle whatever the result).
#
# MILLENNIUMMON'S OWN TEXT ALONG THE WAY. Its [On Play] "delete 1 of your
# opponent's Digimon" is mandatory on both sides (BT18_019.cs shared effect
# `optional: false`, one SelectPermanentEffect with canNoSelect: false; ours
# `if: any_permanent` + a plain pick) and deletes the Phoenixmon p1 hard-played
# to fund the line; the "if DNA digivolving" rider is off for a hard play. Its
# [On Deletion] never fires (it is never deleted). It is a Lv.7 red/black
# [Composite], so MoonMillenniummon's printed Purple Lv.6 circle cannot apply
# and "[Digivolve] [Millenniummon]: Cost 2" is the only legal path -- one cost,
# no cost-choice prompt.
#
# THE LINE is BT19-075-effect0.yaml's (Phoenixmon funds it on T2, Millenniummon
# on T3, Biyomon on T4, MoonMillenniummon on T5), then p1 attacks on T6.
#
# Book: qa/dcgo-exams/BT19/tm_bt19_075_pool.json (--decks). p0's deck is
# MoonMillenniummon x4 + Millenniummon BT18-019 x4 + Deltamon BT6-012 x4 over
# the quiet ST-1 filler; p1 (`quiet-opponent-mm`) is the quiet ST-1 opponent
# with 2x Bind Red Trigger (P-180) and 2x Tai Kamiya (ST1-12) in for the
# Options.
card: BT19-075
clause: BT19-075#effect#3
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4): Millenniummon, MoonMillenniummon, inert filler. stack[9] = Dracomon, the 4000 DP security Digimon
      - BT18-019
      - BT19-075
      - ST1-04
      - ST1-04
      - BT1-009
      # security (5-9): stack[9] is the TOP
      - BT1-014
      - BT1-014
      - BT4-014
      - BT4-014
      - ST1-04
      # (10+): p0's turn draws, in order
      - BT4-010
      - BT4-010
      - BT3-007
      - BT3-007
    rest: tm-moonmillenniummon
  p1:
    stack:
      # hand (0-4): Phoenixmon (the T2 overshoot), the Biyomon that attacks and dies, filler
      - ST1-10
      - ST1-02
      - ST1-03
      - ST1-04
      - BT1-009
      # security (5-9): stack[9] is the TOP
      - ST1-05
      - BT1-014
      - BT4-010
      - ST1-04
      - ST1-02
      # (10+): p1's turn draws, in order
      - BT4-014
      - ST1-08
      - BT3-007
      - BT1-014
    rest: quiet-opponent-mm
steps:
  # T1 (p0, memory 0): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (p1, memory 3): hard-play Phoenixmon ST1-10 for 10 (3 -> -7). p0 opens
  # T3 on 7 -- the only way a 14-cost play fits under the -10 floor.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-10, from: hand } }
    expect: { prompt: main_phase }
  # T3 (p0, memory 7): hard-play Millenniummon BT18-019 for 14 (7 -> -7). Its
  # [On Play] deletes Phoenixmon.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT18-019, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # T4 (p1, memory 7): play Biyomon for 2 (7 -> 5) -- keeping p1's hand on 5 --
  # then pass out.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (p0, memory 3): digivolve MoonMillenniummon for 2 (3 -> 1); p1's hand is
  # 5, nothing to trash. Pass out.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT19-075 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T6 (p1, memory 3): Biyomon attacks p0's security and loses to Dracomon --
  # THE CLAUSE fires on its deletion.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  # One step past the clause; attacking spent no memory, p1 keeps the turn.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 15
    that:
      turn: 6
      p0.security: 4
      p0.trash: [ST1-04]
      p1.security: 4
      p1.field: []
      p1.trash: [ST1-10, ST1-02, ST1-02]
      p0.field:
        - card_id: BT19-075
          dp: 15000
          suspended: false
          sources: [BT18-019]
