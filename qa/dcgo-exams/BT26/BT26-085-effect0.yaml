#   T1 (P0, 0): pass.
#   T2 (P1, 3): play Monodramon BT1-009 (2: 3 -> 1); pass (P0 gets 3).
#   T3 (P0, 3): hard-play Giant Slayer BT26-085 (12: 3 -> -9).
