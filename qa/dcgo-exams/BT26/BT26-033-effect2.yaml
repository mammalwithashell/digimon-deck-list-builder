# Exam scenario: Jupitermon (BT26-033, DUAL), clause BT26-033#effect#2 --
# "<Alliance> (When this Digimon attacks, by suspending 1 of your other
#  Digimon, add the suspended Digimon's DP to this Digimon and it gains
#  <Security A. +1> for the attack.)"
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). No DCGO checkout in the authoring container: prompt shapes
# below are inferred from the YAML's DCGO crosscheck block + sibling exams.
#
# THE LINE: T1 P-213 (0 -> -7); T2 P1 passes; T3 Jupitermon onto P-213 (cost
# 4, 3 -> -1); T4 P1 passes (P1's board stays EMPTY so <Raid> has no
# candidate); T5 (P0, 3) play Elecmon BT25-030 (3 -> 0) -- its [Start of Your
# Main Phase] has already passed and its [When Attacking] is its own attack
# only, so it is silent -- then Jupitermon attacks security and the <Alliance>
# window suspends Elecmon.
#
# WITNESS (at 15): ONE attack checks TWO security cards (p1.security 5 -> 3,
# both vanilla Digimon ST1-02 / BT1-009 in p1.trash) and Elecmon is SUSPENDED
# though it never attacked (it was played this turn). Nothing else in the
# line grants <Security A. +1>.
#
# PROMPT SHAPE: ours parks the AllianceTiming window as an OwnField pick
# answered by target; mirrored on EX12-015-effect2.yaml (expect
# SelectPermanentEffect). That file's Alliance clause is NOT yet confirmed, so
# if DCGO gates the window behind an OptionalSkill yes/no first, the oracle
# will abort on this row -- re-author with `expect: OptionalSkill` (the fold)
# then. Elecmon BT25-030 is the card Jupitermon's T3 [When Digivolving]
# moved from the top of security to the hand.
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO -- unconfirmed until the oracle pass.
card: BT26-033
clause: BT26-033#effect#2
seed: 424242
decks:
  p0:
    # hand (0-4): P-213 Aegiochusmon (red Lv.5 [TS], the digivolve base),
    # Jupitermon, Inori Misono (the cost-reduced play), two quiet TS cards.
    # security (5-9), stack[9] = TOP = the card the [When Digivolving] takes.
    # draws (10..): T3 turn draw, the digivolve-bonus draw, T5 turn draw.
    stack: [P-213, BT26-033, BT24-084, BT25-033, BT26-092,
            BT24-031, BT24-034, BT26-029, BT24-083, BT25-030,
            BT25-022, BT24-034, BT25-033]
    rest: ts-jupitermon
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08, BT4-014]
    rest: tm-quiet-red
steps:
  # T1 (P0, memory 0): decline breeding; hard-play P-213 Aegiochusmon
  # (cost 7: 0 -> -7). It has no [On Play]; its [When Digivolving] never
  # fires (it is played, not digivolved). -> P1 at 7.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: P-213, from: hand } }
    expect: { prompt: main_phase }
  # T2 (P1, memory 7): all-pass -> P0 at 3.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, memory 3): Jupitermon onto P-213 in the battle area. Both the
  # printed Red Lv.5 circle (5) and the [Digivolve] Lv.5 w/[TS] circle (4)
  # are open, so both engines ask which cost to pay (ours EffectChoice, DCGO
  # SelectCountEffect over the distinct cost list) -- answered by VALUE 4.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT26-033 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { value: 4 } }
    expect: { prompt: SelectCountEffect }
  # Jupitermon's [When Digivolving] (effect#4, measured in its own file):
  # top security -> hand (mandatory), then the optional "play or use 1
  # [Iliad]/[TS] card with the cost reduced by 5" hand pick -- DECLINED.
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: SelectHandEffect }
  # T3's end (memory -1 -> the turn ends): Jupitermon (on P-213, in play
  # since T1, unsuspended) has <Engage>, so the end-of-turn attack window
  # opens in BOTH engines -- ours parks EndOfTurnAction, DCGO's EndTurnProcess
  # asks the <Engage> OptionalSkill gate. Declined (a `pass` at the park folds
  # to OptionalSkill "no"). This row was dcgo_only until
  # G-ENGINE-DUAL-END-OF-TURN-WINDOW was fixed (2026-10-04): our engine used
  # to skip the park for a DUAL top card (CardKind::Dual).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: OptionalSkill }
  # T4 (P1, memory 1): all-pass -> P0 at 3.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, memory 3): Elecmon (3 -> 0), then THE CLAUSE.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT25-030, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  # The <Alliance> cost: suspend Elecmon (slot 1).
  - actor: 0
    do: { select: { targets: [own.field.1] } }
    expect: { prompt: SelectPermanentEffect }
  # Both P0 Digimon are suspended: no <Engage> gate at T5's end on either side.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 15
    that:
      p1.security: 3
      p1.trash: [BT1-009, ST1-02]
      p0.field:
        - { card_id: BT25-030, dp: 2000, suspended: true, sources: [] }
        - { card_id: BT26-033, dp: 13000, suspended: true, sources: [P-213] }
  - at: 17
    that:
      turn: 6
