#   T3 (P0, 3): digivolve BT26-029 -> Junomon BT25-044 (Yellow Lv.5 cost 4 vs
#        "Lv.5 w/[Angel]/[Archangel]/[TS]" cost 3 -> cost choice, value 3;
#        3 -> 0). Junomon's WD ("By placing 1 other Digimon as the top security
#        card"): ours has no OWN other Digimon -> no prompt; DCGO offers P1's
#        Birdramon -> declined (dcgo_only row). Blinding Ray
#        BT4-104 (0; Junomon is yellow): trash top security (stack[9] = Kanan
#        Yuki BT26-090), gain 2 (0 -> 2). Two P0 triggers fire on the removal:
#        Junomon's own [All Turns][OPT] (may play a cost<=8 Angel/Archangel/
#        Iliad card from hand) and THE CLAUSE (BT26-029, now a source).
#        Resolve THE CLAUSE first: De-Digivolve 1 on Birdramon. Junomon's
#        trigger then has no legal card (P0's hand is TS-only Tamers: Hiroko
#        x2, Inori, Shota -- deliberately stacked, no Iliad) -> no prompt.
#        Trailing pass.
#
# WITNESS: P1's Birdramon loses its top card -- P1's field is a bare Biyomon
# ST1-02 and Birdramon ST1-05 sits in P1's trash.
#
# PROMPT SHAPE (VERIFIED against DCGO C# 2026-10-04):
#   - Cost route: our EffectChoice vs DCGO SelectCountEffect over the distinct
#     cost list (CardController.cs SelectCost ~720), by VALUE 3.
#   - Junomon's [When Digivolving] (BT25/Yellow/BT25_044.cs "Shared OP / WD"):
#     DCGO's OtherDigimon filter is `permanent != this &&
#     IsPermanentExistsOnBattleAreaDigimon(permanent)` -- ANY player's battle
#     area Digimon -- so P1's Birdramon makes AdditionalActivateCondition true
#     and DCGO opens a SelectPermanentEffect (canNoSelect true, no OptionalSkill:
#     optional false) offering Birdramon. Ours gates on `any_permanent` (DSL
#     default `of: you`, BT25-044.yaml) and asks nothing -> a `dcgo_only`
#     decline row (answered "place nothing").
#     PREDICTED DIVERGENCE only if accepted (not on this line): the printed
#     "By placing 1 other Digimon as the top security card" carries no "your",
#     and an unqualified "Digimon" conventionally means any Digimon -- DCGO's
#     reading is the literal one; ours restricts the cost to your own Digimon
#     in the condition while its select_any_permanent filter is side-agnostic.
#     Needs a ruling / engine follow-up; the line declines so state agrees.
#   - SIM-ONLY row: 9-1-5 used-Option-disposal order. DCGO trashes the used
#     Option inside UseOptionClass (CardController.cs, AddTrashCard after the
#     OptionSkill effect) BEFORE the main stack's triggers resolve -- it asks
#     nothing; we answer "Trash the used Option" to take DCGO's order.
#   - NO MultipleSkills on DCGO's side: Junomon's [All Turns] trigger is stacked
#     (CanUseCondition does not look at cards) but MultipleSkills filters
#     skillInfos_active by CanActivate, and Junomon's CanActivateCondition needs
#     a cost<=8 [Angel]/[Archangel]/[Iliad] card in hand OR trash -- hand is
#     TS-only Tamers, trash is Kanan Yuki BT26-090 (ADAMAS/TS) + Blinding Ray.
#     With one active skill DCGO short-circuits (MultipleSkills.cs
#     `Count == 1`). Our TriggerOrder still offers the un-activatable Junomon
#     trigger beside the clause -> our row is now `sim_only`. (Ours offering a
#     trigger that cannot activate is a phantom choice; minor engine note.)
#   - De-Digivolve target: the inherited clause's SelectPermanentEffect
#     (Mode.Degenerate, mandatory) over Birdramon, 1:1.
# FIXED 2026-10-04 (G-ENGINE-TRIGGER-ORDER-UNACTIVATABLE): Junomon's
# [All Turns] now carries DCGO's CanActivateCondition (a cost<=8
