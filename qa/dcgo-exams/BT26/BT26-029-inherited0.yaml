# the former `sim_only` TriggerOrder row is gone (asserts shifted -1).
# FIXED 2026-10-04 (G-CARD-BT25-044-PLACE-OTHER-DIGIMON): BT25-044.yaml now
# gates Junomon's [On Play]/[When Digivolving] on ANY other Digimon (either
# side, BT25_044.cs:48-57) and places into the card owner's security, so the
# former `dcgo_only` Junomon pick row is a shared row. (Header text below
# predates the fix.)
