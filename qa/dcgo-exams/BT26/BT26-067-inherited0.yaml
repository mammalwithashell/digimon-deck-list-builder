# Exam scenario: Wizardmon (BT26-067), clause BT26-067#inherited#0 --
# Inherited "<Retaliation> (When only this Digimon is deleted in battle,
#  delete the Digimon it battled.)"
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json (`bt26-ts-mervamon` vs
# `tm-quiet-red`). No DCGO checkout in the authoring container.
#
# THE LINE:
#   T1 (P0, 0): pass breeding; play Wizardmon (4: 0 -> -4); [On Play] draw
#      stack[10], trash BT26-088.
#   T2 (P1, 4): pass breeding; play ST1-10 (Lv.6 12000, cost 10: 4 -> -6).
#   T3 (P0, 6): digivolve Wizardmon -> BT25-039 (Yellow/Green Lv.5 6000; only
#      the Lv.4 w/[TS] route applies to a purple/red Lv.4: 6 -> 3); attack
#      security with it (Wizardmon in play since T1) -- ST1-02 (3000) flips
#      and loses; P1 security 5 -> 4. Pass (BT25-039 now SUSPENDED).
#   T4 (P1): pass breeding; ST1-10 (12000) attacks the suspended BT25-039
#      (6000). Only BT25-039 is deleted in battle -> THE CLAUSE (inherited from
#      Wizardmon): Retaliation deletes ST1-10. BT25-039's own [On Deletion]
#      (may place itself as bottom security) triggers simultaneously -> P0
#      orders: Retaliation first; then decline the [On Deletion].
#
# WITNESS: at 10 (before the attack) ST1-10 on P1's field; at 12 (after the
# Retaliation resolves) P1 field empty, ST1-10 in P1 trash; at 13 BT25-039 +
# Wizardmon in P0 trash (the [On Deletion] declined).
#
# PROMPT SHAPE: trigger order = ours TriggerOrder over [BT25-039 (On
# Deletion), BT26-067 <Retaliation>] -> DCGO MultipleSkills, answered with
# `trigger: Retaliation` (portable). The [On Deletion] gate = ours
# Replacement -> DCGO OptionalSkill (declined). NOTE: our engine names the
# Retaliation candidate by the SOURCE card (BT26-067), not the top card; if
# DCGO's MultipleSkills lists the inherited effect under BT25-039 the
# oracle will abort here with "not on card" -- re-author `cards:` from the
# abort message (a representation difference, not a rules finding).
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
