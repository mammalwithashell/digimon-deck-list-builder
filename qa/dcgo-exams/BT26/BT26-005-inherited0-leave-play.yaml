# Pinamon inherited On Deletion: revive its just-deleted carrier, then let
# Keenan target that NEW permanent with the reaction to Pinamon's cost.
# Extends BT26-005-inherited0.yaml and the oracle-confirmed Keenan SOMP prefix
# in BT26-094-effect0.yaml. The Pinamon base itself is not oracle-confirmed.
#
# Adversarial boundary: Falcomon leaves play in security battle, taking Pinamon
# to trash. Pay Pinamon's cost with Keenan's ONLY face-down source, accept
# Keenan's reaction, and revive that same Falcomon. No other Digimon is present.
# DCGO BT26_005.cs completes SuccessProcess/PlayByEffect before the derived
# BT26_094.cs reaction resolves. Keenan can therefore grant Execute to Falcomon.
# Our sim instead suspends Keenan BEFORE the revival, when no Digimon exists,
# losing the grant. inspect_step: 16 witnesses the suspended Tamer, empty
# Digimon field, and Falcomon/Pinamon in trash at Pinamon's revival prompt.
# This is a predicted timing/target-eligibility divergence, not an oracle result.
# Rules reference: docs/digimon-rules/digest.md, 15-8-3-2 (triggered effects
# wait during effect processing), 15-4-5 (derived triggers), 15-7-5 (paying a
# cost is allowed even if its result cannot currently be performed).
#
# Explicit split rows retain the two engines' observed prompt ordering so the
# shared revival row can expose the premature suspension. Falcomon's On Play
# cannot pay its cost after the last face-down card was spent: DCGO's
# ST24_12.cs CanActivateCondition rejects it; decline our extra gate explicitly.
# Execute does not override summoning sickness: the revived Falcomon cannot
# attack this turn. The line ends with a normal turn handoff, not a fake attack.
card: BT26-005
clause: BT26-005#inherited#0
interaction: {id: "probe:BT26-005#inherited#0:leave_play", source: probe, kind: positive}
covers:
  - BT26-005#inherited#0
  - BT26-094#effect#0
  - BT26-094#effect#1
  - ST24-12#effect#0
  - ST24-12#effect#1
meta: {produced_by: 20261006T144922925448Z-pilot-data-squad-2c8f4e}
seed: 424242
decks:
  p0:
    stack: [BT26-094, ST24-12, ST24-04, ST24-15, BT26-076,
            ST24-05, BT26-091, BT26-049, BT26-050, ST24-14,
            ST24-04, BT26-091, ST24-05, BT26-072, ST24-04]
    rest: bt26-dats
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08,
            BT1-014, BT4-010, BT3-007, BT1-009, ST1-02,
            ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08, BT4-014]
    rest: tm-quiet-red
steps:
  # T1: hatch Pinamon, evolve in breeding, play Keenan.
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: breeding, using: ST24-12 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { play: { card: BT26-094, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3: promote; stash exactly one face-down card under Keenan.
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { select: { cards: [ST24-04] } }
    expect: { prompt: SelectHandEffect }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5: decline the second stash. Falcomon (2000) loses to ST1-02 (3000).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: SelectHandEffect }
  - actor: 0
    do: { attack: { attacker: field.1, target: security } }
    expect: { prompt: main_phase }
  # Inherited On Deletion from the now-trashed Pinamon source.
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect, count: 1 }
  # Our premature Keenan reaction: accept even though no Digimon remains.
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  # Step 16: revive the deleted carrier, not an unrelated pre-seeded card.
  - actor: 0
    do: { select: { cards: [ST24-12] } }
    expect: { prompt: SelectCardEffect }
  # No face-down sources remain; DCGO never offers Falcomon's On Play cost.
  - actor: 0
    do: { select: { decline: true, sim_only: true } }
  # DCGO's deferred Keenan reaction can now see the revived Falcomon.
  - actor: 0
    do: { select: { yes: true, dcgo_only: true } }
    expect: { prompt: OptionalSkill }
  - actor: 0
    do: { select: { cards: [ST24-12], dcgo_only: true } }
    expect: { prompt: SelectPermanentEffect, count: 1 }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert: []
