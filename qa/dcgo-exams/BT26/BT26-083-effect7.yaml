# Exam scenario: Junomon: Hysteric Mode (BT26-083), clause BT26-083#effect#7 --
# "Special Play Condition: Assembly -4: [Junomon]"
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). PROVISIONAL: assert block is our engine's result, not
# backfilled from DCGO -- unconfirmed until the oracle pass.
#
# THE LINE. The Assembly element ([Junomon] = BT25-044) must be in P0's TRASH.
# It is put there from HAND by Asuna Shiroki (BT24-088)'s [On Play] discard
# cost -- NOT via security (Blinding Ray / a security battle), because our
# engine wrongly fires BT25-044's own [All Turns] "when your security stack is
# removed from" trigger from the card that is LEAVING security (see report),
# which would park an engine-only prompt.
#   T1 (P0, 0): Asuna (3): 0 -> -3. [On Play]: trash Junomon from hand, Draw 2.
#   T2 (P1, 3): Agumon ST1-03 (3 -> 0), Phoenixmon ST1-10 (0 -> -10) -> P0 10.
#   T3 (P0, 10): THE CLAUSE. Play BT26-083 from hand; Assembly picks BT25-044
#            from the trash; cost 14 - 4 = 10 (10 -> 0) and Junomon is stacked
#            under it. Its [On Play] (effect#5) then trashes P0's 5 security,
#            deletes both P1 Digimon (forced pick of exactly min(5, 2) = 2),
#            Recovery +3. Pass at 0; the <Execute> end-of-turn gate opens and
#            is declined (documented end-of-turn fold: `pass:` + OptionalSkill).
#
# WITNESS: at 7 P0 has 10 memory, BT26-083 in hand, BT25-044 alone in trash;
# at 9 (right after the Assembly pick) BT26-083 is on the field with
# sources [BT25-044] and P0 memory is 0 -- i.e. 14 - 4 was paid, and the
# Junomon left the trash. (A printed-cost play of 14 is impossible from 10.)
#
# PROMPT SHAPE (VERIFIED against DCGO C# 2026-10-04 (b9a0638cd)):
#   - Asuna [On Play] is optional (BT24_088.cs:112) -> OptionalSkill, then
#     SelectHandEffect canNoSelect (BT24_088.cs:143): authored as the
#     optional_gate_fold (`expect: OptionalSkill` over our Hand pick).
#     FIXED 2026-10-04: was a bare `expect: SelectHandEffect` row.
#   - Asuna [Start of Your Turn] at 10 memory: not activatable -> no prompt.
#   - Assembly is ONE SelectCardEffect over the trash (root Trash,
#     canNoSelect true, maxCount = elementCount 1) from
#     SelectAssemblyClass.SelectTrashCard, called from the play flow
#     (CardController.cs:928-932). There is NO separate "use Assembly?"
#     gate: if the trash can fulfil the element the pick just opens.
#   - The delete pick is ONE SelectPermanentEffect maxCount = min(trashed,
#     opp Digimon), canNoSelect false (BT26_083.cs:85-99); asked even when
#     candidates == maxCount (the forced auto-pick is human-UI only,
#     SelectPermanentEffect.cs ~376-407). 0 candidates -> no prompt
#     (`if (deleteCount >= 1)`). The OP/WD is optional:false
#     (BT26_083.cs:115): no OptionalSkill.
#   - <Execute> (KeyWordEffects/Execute.cs) is an optional OnEndTurn
#     ActivateClass gated on CanActivateExecute == CanAttack -> OptionalSkill,
#     then SelectAttackEffect on yes (CardEffectCommons Execute.cs:18-70):
#     the documented end-of-turn fold. Declined here.
