# Exam scenario: Ceresmon (BT26-032, DUAL), clause BT26-032#effect#1 --
# "<Alliance>" (When this Digimon attacks, by suspending 1 of your other
#  Digimon, add the suspended Digimon's DP to this Digimon and it gains
#  <Security A. +1> for the attack.)
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json (`bt26-chronomon` vs
# `tm-quiet-red`). No DCGO checkout in the authoring container.
#
# THE LINE:
#   T1 (P0, 0): pass breeding; play BT26-015 (7: 0 -> -7).
#   T2 (P1): pass, pass -> P0 at 3.
#   T3 (P0, 3): digivolve Ceresmon onto BT26-015 (Yellow Lv.5 circle, 5:
#      3 -> -2). Its [When Digivolving] "by suspending 1 Digimon" pick is
#      declined (P1 has no Digimon -> nothing else happens).
#   T4 (P1): pass, pass -> P0 at 3.
#   T5 (P0, 3): play Hyokomon BT26-009 (Lv.3 2000, 3 -> 0; no [On Play]).
#      Ceresmon attacks security. THE CLAUSE: the <Alliance> window suspends
#      Hyokomon (own.field.1) -> 13000 + 2000 and <Security A. +1>: ONE attack
#      checks TWO cards (ST1-03, BT1-009 -- vanilla, both lose).
#
# WITNESS: at 12 (the Alliance window) P1 security 5, Hyokomon unsuspended;
# at 13 P1 security 3 (two checks from one attack; nothing else grants
# <Security A. +1>), Hyokomon SUSPENDED though it never attacked, both
# checked cards in P1's trash. The +DP half is not observable after the
# attack (the boost ends with it).
#
# PROMPT SHAPE: ours AllianceTiming OwnField pick -> DCGO
# SelectPermanentEffect (mirrors BT26-033-effect2 / EX12-015-effect2). If
# DCGO gates the window behind an OptionalSkill first, the oracle aborts on
# that row -- re-author with the fold.
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
card: BT26-032
clause: BT26-032#effect#1
seed: 424242
decks:
  p0:
    stack: [BT26-015, BT26-032, BT26-009, BT25-008, BT26-011,
            BT26-092, BT26-092, BT26-087, BT26-078, BT26-073,
            BT26-085, BT26-060, BT24-034, BT26-011, BT26-087]
    rest: bt26-chronomon
  p1:
    stack: [ST1-02, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-03, ST1-04, ST1-03, BT1-014]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT26-015, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT26-032 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT26-009, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { targets: [own.field.1] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 12
    that:
      turn: 5
      p0.memory: 0
      p1.security: 5
      p0.field:
        - { card_id: BT26-009, dp: 2000, suspended: false, sources: [] }
        - { card_id: BT26-032, dp: 13000, suspended: true, sources: [BT26-015] }
  - at: 13
    that:
      turn: 5
      p1.security: 3
      p1.trash: [BT1-009, ST1-03]
      p0.field:
        - { card_id: BT26-009, dp: 2000, suspended: true, sources: [] }
        - { card_id: BT26-032, dp: 13000, suspended: true, sources: [BT26-015] }
