# Exam scenario: Mervamon (BT26-081), clause BT26-081#effect#4 -- Special
# Play Condition "Assembly -5: [Minervamon]".
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`; the deck runs 1x Minervamon BT24-041). PROVISIONAL: assert
# block is our engine's result, not backfilled from DCGO -- unconfirmed until
# the oracle pass.
#
# THE LINE:
#   T1 (P0, 0): hard-play Asuna Shiroki BT24-088 (3: 0 -> -3). Her optional
#       [On Play] trashes Minervamon (a [TS] card) from the hand -- the
#       Assembly material -- and draws 2 (stack[10..11]).
#   T2 (P1, 3): hard-play Phoenixmon ST1-10 (10: 3 -> -7) -> P0 7 (keeps P0
#       above Asuna's "4 or less memory" [Start of Your Turn] gate on T3).
#   T3 (P0, 7): THE CLAUSE -- play Mervamon from hand via Assembly: material
#       pick = Minervamon from the trash; cost 13 - 5 = 8 (7 -> -1). Then
#       Mervamon's [On Play] (effect#2): see the SUSPECTED ENGINE BUG below --
#       ours never parks the free-play pick on this line; DCGO's decline is a
#       dcgo_only row. The -4000 x 2 DP pick takes Phoenixmon (only target).
#       Turn passes at -1.
#   T4 (P1, 1): the trailing step.
#
# WITNESS: P1 starts T4 with exactly 1 (8 paid, not the printed 13);
# Minervamon moved from P0's trash to Mervamon's sources.
#
# SUSPECTED ENGINE BUG (flagged, not fixed): after the ASSEMBLY play, our
# engine skips Mervamon's [On Play] "may play up to 8 cost of [Iliad] from
# hand or trash" pick (PlayCostBudget) entirely, although the hand holds
# eligible [Iliad] cards (Elecmon BT25-030 cost 3, Aegiomon BT24-034 cost 5).
# The SAME hand + Asuna-on-field board with a HARD play (Minervamon left in
# hand instead of trashed) parks the pick normally, as does the hard play in
# BT26-081-effect2.yaml. A `select: {decline, sim_only}` row here fails with
# "recorded cancel on a non-optional OppField prompt" -- the next parked
# prompt is already the DP pick.
#
# PROMPT SHAPE / DCGO quirks to triage:
#   - Asuna [On Play]: optional_gate_fold (OptionalSkill + SelectHandEffect).
#   - Assembly: ours = CountCappedMultiSelect {0..1} over the trash; DCGO =
#     SelectCardEffect (may also ask "use Assembly?" first).
#   - Mervamon OP pick: dcgo_only SelectHandEffect decline, GUESSING DCGO skips
#     its hand/trash/stop zone menu (trash empty after the Assembly). Expect
#     a mismatch here if the engine bug above is real and later fixed (then
#     add the sim_only decline row back).
#   - DP pick: one candidate, mandatory -- DCGO may auto-resolve it.
card: BT26-081
clause: BT26-081#effect#4
seed: 424242
decks:
  p0:
    stack: [BT24-088, BT24-041, BT26-081, BT24-101, BT26-090,
            BT25-022, BT24-083, BT26-029, BT24-102, BT26-092,
            BT24-034, BT25-030, BT24-034, BT25-030, BT24-034]
    rest: ts-jupitermon
  p1:
    stack: [ST1-10, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08, BT4-014]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT24-088, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { cards: [BT24-041] } }
    expect: { prompt: OptionalSkill }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-10, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT26-081, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { cards: [BT24-041] } }
    expect: { prompt: SelectCardEffect }
  - actor: 0
    do: { select: { decline: true, dcgo_only: true } }
    expect: { prompt: SelectHandEffect }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect, count: 1 }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  # Before the Assembly material pick: P0 at 7, Minervamon in the trash.
  - at: 7
    that:
      turn: 3
      p0.memory: 7
      p0.trash: [BT24-041]
  # P1's T4 breeding decision: the Assembly play cost 13 - 5 = 8 (7 -> -1,
  # so P1 starts with 1); Minervamon left the trash to sit under Mervamon;
  # Phoenixmon took -4000 x 2 (Mervamon + Asuna, a [TS] Tamer) -> 4000.
  - at: 10
    that:
      turn: 4
      p1.memory: 1
      p0.trash: []
      p0.field:
        - { card_id: BT24-088, dp: -1, suspended: false, sources: [] }
        - { card_id: BT26-081, dp: 15000, suspended: false, sources: [BT24-041] }
      p0.hand: [BT24-034, BT24-034, BT24-101, BT25-030, BT26-090]
      p1.field:
        - { card_id: ST1-10, dp: 4000, suspended: false, sources: [] }
