# Exam scenario: Buraimon (BT26-011), clause BT26-011#inherited#0 --
# inherited "<Raid> (When this Digimon attacks, you may change the attack
# target to 1 of your opponent's unsuspended Digimon with the highest DP.)"
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json + this pass's variant
# book (variants-A.json). P0 = VARIANT `cm-chronomon-iso` (`bt26-chronomon`
# with BT9-103 -> BT25-022, BT25-092 -> BT25-039 Sirenmon, BT26-033 -> BT25-034,
# eggs 4x BT24-003;
# Sirenmon is the swap that matters here). P1 = `tm-quiet-red`.
#
# CARRIER: Sirenmon BT25-039 (yellow/green Lv.5 [Shaman]/[TS], 6000 DP) has
# NO <Raid> of its own and no [When Digivolving]/[When Attacking], so a Raid
# window on its attack can only come from Buraimon's INHERITED box. It
# reaches the red Buraimon only through its "Lv.4 w/[TS]: Cost 3" alt (its
# circles are yellow/green) -> one route, no cost prompt.
#
# THE LINE:
#   T1 (P0, 0): pass breeding; hard-play Buraimon (0 -> -5); [On Play]
#      STARVED (no [Chronomon]-text/[Shaman] card in the stacked hand).
#   T2 (P1, 5): play Biyomon ST1-02 (3000) and Agumon ST1-03 (2000); pass.
#   T3 (P0, 3): draw stack[10] Sirenmon (drawn now so it is NOT in hand at
#      T1, where its [Shaman] trait would have woken Buraimon's [On Play]).
#      Digivolve Sirenmon over Buraimon (3 -> 0; digivolve-draw stack[11]
#      BT26-101). Attack P1's SECURITY. THE CLAUSE: inherited <Raid>
#      switches to Biyomon (highest-DP unsuspended); 6000 vs 3000, Biyomon
#      deleted, no security check.
#
# WITNESS (at 10 vs at 8): P1 security stays 5; Biyomon ST1-02 in P1's trash;
# Agumon untouched; Sirenmon (sources [BT26-011]) suspended.
#
# PROMPT SHAPE: the <Raid> fold -- DCGO OptionalSkill + SelectPermanentEffect
# (canNoSelect); ours one declinable OppField pick; `expect: OptionalSkill`
# marks the fold (as BT26-011-effect1.yaml / BT20-020-effect1.yaml).
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
