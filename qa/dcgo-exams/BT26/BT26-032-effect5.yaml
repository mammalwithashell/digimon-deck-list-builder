# Exam scenario: Ceresmon (BT26-032, DUAL), clause BT26-032#effect#5 --
# DUAL Effect "[Main] You may suspend 2 of your opponent's Digimon or Tamers.
#  Then, 3 of their Digimon or Tamers can't unsuspend until their turn ends."
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json (`bt26-chronomon` vs
# `tm-quiet-red`). No DCGO checkout in the authoring container.
#
# THE LINE (shared by BT26-032-effect4 / -effect5):
#   T1 (P0, 0): pass breeding; play Shota BT26-092 (BLACK [TS] Tamer, 3:
#      0 -> -3) -> P1 at 3.
#   T2 (P1, 3): pass breeding; play Biyomon ST1-02 (2: 3 -> 1), then ST1-10
#      (Lv.6 12000, cost 10: 1 -> -9; legal, the cap is memory + 10) -> P0 9.
#   T3 (P0, 9): pass breeding; Shota's [Start of Your Main Phase] hand pick
#      declined. USE Ceresmon's Option face from hand (use cost 5: 9 -> 4).
#      P0's only permanent is the black Shota: the Option is GREEN, so the
#      colour requirement fails and <Use Req. ([TS] trait)> alone admits the
#      use. [Main]: suspend Biyomon + ST1-10 (opp.field.0/1); then "3 of their
#      Digimon or Tamers can't unsuspend" clamps to the 2 present -- both
#      picked. No P0 Digimon -> no <Arts Digivolve> target -> the Option is
#      trashed. Pass (P1 starts T4 at 3 by the pass rule).
#   T4 (P1): unsuspend phase -- both stay SUSPENDED; pass breeding.
#
# WITNESS: at 8 (the first pick) P1's two Digimon unsuspended, memory 4;
# at 10 both SUSPENDED, BT26-032 in P0's trash; at 12 (T4, P1's main phase,
# AFTER P1's unsuspend phase) both are STILL suspended -- the lock held.
#
# PARTIAL: the lock is witnessed only on Digimon that the first half
# suspended; a lock on an already-unsuspended target and the "3" cap with
# >3 candidates are not exercised (P1 has 2 permanents).
#
# PROMPT SHAPE: suspend pick = ours budgeted 2-pick -> DCGO ONE
# SelectPermanentEffect (maxCount 2, canNoSelect:true, canEndNotMax:false);
# lock pick = ours budgeted pick clamped to 2 -> DCGO SelectPermanentEffect
# maxCount min(3,2)=2, mandatory. If DCGO auto-selects when the candidate
# count equals maxCount, the lock row will abort as "DCGO never asked" --
# re-author it `sim_only` then. Shota's SOMP pick = SelectHandEffect,
# declined (canNoSelect:true per BT26-092-effect0's notes).
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
