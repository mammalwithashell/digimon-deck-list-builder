# Q7097: trash a face-down card actually placed by Peckmon.
# Extends the oracle-confirmed BT26-072-effect2 and BT26-094-effect0
# prefixes (NOTES-BT26-DATA-SQUAD.md, oracle pass 2026-10-05).
# Keenan first stores Falcomon; Peckmon then stores Ravemon beneath it.
# Crowmon's cost must remove the bottom face-down card, not the older card.
# Ravemon is deliberately a legal evolution in the trash: stale face-down
# state can affect its availability to Crowmon's newly triggered effect.
# Finish the source-trash effect, decline evolution, and decline Keenan.
# No later recovery hides the trash card.
# DCGO BT26_072.cs: placement menu value 2, Tamer pick, hand pick, deletion.
# DCGO BT26_076.cs: optional Tamer pick, bottom face-down trash, opponent pick.
card: BT26-072
clause: BT26-072#effect#2
interaction: {id: "qa:Q7097", source: qa, kind: positive}
covers:
  - BT26-072#effect#2
  - BT26-094#effect#0
  - BT26-076#effect#1
  - BT26-076#effect#2
  - BT26-094#effect#1
meta: {produced_by: 20261007T005821561019Z-pilot-data-squad-fd173c}
seed: 424242
decks:
  p0:
    stack: [BT26-094, BT26-072, BT26-076, BT26-082, ST24-12,
            ST24-05, ST24-10, BT26-049, BT26-050, ST24-14,
            ST24-04, BT26-091, ST24-15]
    rest: bt26-dats
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08,
            BT1-014, BT4-010, BT3-007, BT1-009, ST1-02,
            ST1-04, ST1-03]
    rest: tm-quiet-red
steps:
  # T1: Keenan, 0 -> -3.
  - actor: 0
    do: {pass: {}}
    expect: {prompt: breeding_action}
  - actor: 0
    do: {play: {card: BT26-094, from: hand}}
    expect: {prompt: main_phase}
  # T2: provide Peckmon's deletion target, then pass.
  - actor: 1
    do: {pass: {}}
    expect: {prompt: breeding_action}
  - actor: 1
    do: {play: {card: ST1-03, from: hand}}
    expect: {prompt: main_phase}
  - actor: 1
    do: {pass: {}}
    expect: {prompt: main_phase}
  # T3: Keenan stores the older card and raises memory to 4.
  - actor: 0
    do: {pass: {}}
    expect: {prompt: breeding_action}
  - actor: 0
    do: {select: {cards: [ST24-12]}}
    expect: {prompt: SelectHandEffect}
  - actor: 0
    do: {play: {card: BT26-072, from: hand}}
    expect: {prompt: main_phase}
  # Label on our engine; card-defined integer on DCGO.
  - actor: 0
    do: {select: {choice: "Place 1 card", sim_only: true}}
  - actor: 0
    do: {select: {value: 2, dcgo_only: true}}
    expect: {prompt: generic_int}
  - actor: 0
    do: {select: {targets: [own.field.0]}}
    expect: {prompt: SelectPermanentEffect}
  - actor: 0
    do: {select: {cards: [BT26-082]}}
    expect: {prompt: SelectHandEffect}
  - actor: 0
    do: {select: {targets: [opp.field.0]}}
    expect: {prompt: SelectPermanentEffect, count: 1}
  # No opponent Digimon remain; Crowmon still offers the independent cost.
  - actor: 0
    do: {digivolve: {from: field.1, using: BT26-076}}
    expect: {prompt: main_phase}
  # Q7097 happens here. Select the Tamer, never a hidden source identity.
  - actor: 0
    do: {select: {targets: [own.field.0]}}
    expect: {prompt: SelectPermanentEffect, count: 1}
  - actor: 1
    do: {select: {cards: [ST1-08]}}
    expect: {prompt: SelectHandEffect}
  - actor: 0
    do: {select: {cards: [BT26-076]}}
    expect: {prompt: MultipleSkills}
  # Selecting Crowmon's trigger opens our trash pick directly. DCGO has
  # a separate activation gate (BT26_076.cs, optional:true). Accept it,
  # then decline the optional evolution so the examined card stays in trash.
  - actor: 0
    do: {select: {yes: true, dcgo_only: true}}
    expect: {prompt: OptionalSkill}
  - actor: 0
    do: {select: {decline: true}}
    expect: {prompt: SelectCardEffect}
  # Keenan can react to both the Tamer-source trash and the hand trash.
  - actor: 0
    do: {select: {decline: true}}
    expect: {prompt: OptionalSkill}
  - actor: 0
    do: {select: {decline: true}}
    expect: {prompt: OptionalSkill}
