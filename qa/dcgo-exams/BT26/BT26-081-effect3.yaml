# Exam scenario: Mervamon (BT26-081), clause BT26-081#effect#3 --
# "[All Turns] All of your [Iliad] trait Digimon gain <Alliance>, <Reboot>,
#  <Blocker> and +2000 DP."
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). PROVISIONAL: assert block is our engine's result, not
# backfilled from DCGO -- unconfirmed until the oracle pass.
#
# THE LINE:
#   T1 (P0, 0): pass -> P1 3.
#   T2 (P1, 3): hard-play Phoenixmon ST1-10 (10: 3 -> -7) -> P0 7.
#   T3 (P0, 7): hard-play Mervamon (13: 7 -> -6). Its [On Play] (effect#2):
#       free-play pick DECLINED; then the mandatory -4000 x 1 (Mervamon is the
#       only [Iliad]/[TS]) on Phoenixmon until P1's turn ends -> 8000.
#   T4 (P1, 6): THE CLAUSE, on the opponent's turn -- Phoenixmon attacks P0's
#       security; Mervamon (printed: NO <Blocker>; the grant is this clause's,
#       Mervamon being [Iliad] itself) opens P0's blocker window and blocks.
#       15000 (13000 + this clause's +2000) vs 8000: Phoenixmon deleted.
#   Trailing: P1's main-phase pass.
#
# WITNESS: the <Blocker> half -- the block select lowers at all (no blocker
# window exists without the grant) and P0's security stays 5; the +2000
# half -- Mervamon projects 15000 on BOTH turns (T3/T4). <Alliance> and
# <Reboot> are not separately observed on this line (Alliance needs a second
# attacker on P0's turn; Reboot would need P1's NEXT unsuspend phase).
#
# PROMPT SHAPE / DCGO quirks to triage:
#   - Mervamon OP pick decline: ours parks a PlayCostBudget per-pick trampoline over HAND
#     cards only (trash empty). FIXED 2026-10-04
#     (G-TOOLING-EXAM-PLAYCOSTBUDGET-ZONE): the adapter now maps a budget pick
#     by its candidates' zone, so this is ONE shared row asserting
#     SelectHandEffect (was a sim_only + dcgo_only pair). Still a GUESS that
#     DCGO skips its hand/trash/stop zone menu when only the hand qualifies;
#     if DCGO asks the menu, add its "stop"/zone generic_int value as a
#     dcgo_only row from the oracle abort message.
#   - The DP pick: one candidate, mandatory -- DCGO may auto-resolve it.
#   - Blocker window: SelectPermanentEffect on both sides (EX12-026-effect0
#     shape).
card: BT26-081
clause: BT26-081#effect#3
seed: 424242
decks:
  p0:
    stack: [BT26-081, BT24-034, BT25-030, BT24-101, BT26-090,
            BT25-022, BT24-083, BT26-029, BT24-102, BT26-092,
            BT24-034, BT25-030, BT24-034, BT25-030, BT24-034]
    rest: ts-jupitermon
  p1:
    stack: [ST1-10, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08, BT4-014]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-10, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT26-081, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: SelectHandEffect }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect, count: 1 }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  # P0's blocker window: block with Mervamon (its <Blocker> comes only from
  # its own [All Turns] grant to [Iliad] Digimon).
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  # Before P1's attack: Mervamon at 15000 (13000 + the clause's +2000 on
  # itself), Phoenixmon at 8000 (12000 - 4000 x 1 from effect#2).
  - at: 9
    that:
      turn: 4
      p0.field:
        - { card_id: BT26-081, dp: 15000, suspended: false, sources: [] }
      p1.field:
        - { card_id: ST1-10, dp: 8000, suspended: false, sources: [] }
  # After the block: P0's security untouched, Phoenixmon (8000) lost to the
  # 15000 blocker, Mervamon suspended from blocking.
  - at: 11
    that:
      turn: 4
      p0.security: 5
      p1.field: []
      p1.trash: [ST1-10]
      p0.field:
        - { card_id: BT26-081, dp: 15000, suspended: true, sources: [] }
