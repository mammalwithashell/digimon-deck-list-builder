    stack: [BT26-073, BT24-084, BT25-030, BT24-101, BT26-090,
            BT25-022, BT24-083, BT26-029, BT24-102, BT26-092,
            BT24-034, BT25-030, BT24-034, BT25-030, BT24-034]
    rest: ts-jupitermon
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08, BT4-014]
    rest: tm-quiet-red
