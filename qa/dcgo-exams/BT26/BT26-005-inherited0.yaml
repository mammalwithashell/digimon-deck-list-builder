#            inherited [On Deletion] fires: trash the bottom face-down card
#            (ST24-04) from under Keenan, then play Pinamon (BT26-005, cost 0)
#            from the trash for free.
# PROMPT SHAPE (BT26_005.cs): not DCGO-optional (no leading yes/no); a
# SelectPermanentEffect (canNoSelect) for the Tamer, then PlayByEffect's
# SelectCardEffect over the trash.
