#   T1 (P0): hatch Pinamon, digivolve it in breeding into ST24-12 (Lv.2
#            [DATA SQUAD] route, cost 0), play Keenan Crier BT26-094 (0 -> -3).
#   T2 (P1): pass.                               -> P0 at 3
#   T3 (P0): move ST24-12 to the battle area (summoning-sick); Keenan's
#            [Start of Your Main Phase] places ST24-04 face down under it.
#   T4 (P1): pass.
#   T5 (P0): Keenan places ST24-05 face down (a second card, so the BOTTOM one
#            is ST24-04). ST24-12 (2000 DP) attacks security and loses to P1's
