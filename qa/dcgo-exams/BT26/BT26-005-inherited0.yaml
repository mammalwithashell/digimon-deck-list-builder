# Exam scenario: Pinamon (BT26-005), clause BT26-005#inherited#0 --
# "[On Deletion] By trashing the bottom face-down card from under any of your
#  Tamers, you may play 1 play cost 5 or lower [Avian] or [DATA SQUAD] trait
#  card from your trash without paying the cost."
