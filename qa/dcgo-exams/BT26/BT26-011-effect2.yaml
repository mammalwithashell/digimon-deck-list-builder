#  text or the [Shaman] trait from your hand, <Draw 2>."
# BOTH timings are witnessed in one line (two copies of Buraimon).
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json (`bt26-chronomon` vs
# `tm-quiet-red`).
#
