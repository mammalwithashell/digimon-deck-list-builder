#
# PARTIAL: the [Shaman]-trait-only branch of the filter (a [Shaman] card
# WITHOUT [Chronomon] text, e.g. Aegiomon BT24-034) and the decline branch
# are not witnessed.
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
