#      stack[12] BT26-087). Memory -5 -> P1.
#   T2 (P1, 5): pass, pass (P0 -> 3).
#   T3 (P0, 3): draw stack[13] BT25-100. Move the Coronamon stack out
#      (field.1; its [When Moving] pick declined). Digivolve Buraimon #2 over
#      it (2 -> memory 1; digivolve-draw stack[14] BT26-090): [WHEN
#      DIGIVOLVING] -- trash the 2nd BT26-016 -> <Draw 2> (stack[15]
#      BT26-101, stack[16] BT9-103).
#
# WITNESS:
#   [On Play]  at 4 vs at 3: hand loses BT26-016, gains BT26-087 + BT8-097;
#              trash = [BT26-016].
#   [When Dig] at 10 vs at 9: hand loses BT26-016, gains BT26-101 + BT9-103;
#              trash = [BT26-016, BT26-016]; memory 1; the 2nd Buraimon over
#              [BT25-008, BT26-001] (7000 = 5000 + Coronamon's [Your Turn]
#              inherited +2000).
#
# PROMPT SHAPE: DCGO (BT26-011.yaml notes) = ActivateClassesForSharedEffects
# optional:false -> no OptionalSkill; ONE SelectHandEffect (Mode.Discard,
# canNoSelect:true) over HasText("Chronomon") || EqualsTraits("Shaman"). Ours
# = one optional Hand pick. 1:1 both times. The [When Moving] decline is
