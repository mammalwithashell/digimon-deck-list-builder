# "[Security] You may play 1 play cost 4 or lower [TS] trait card from your
#  hand or trash without paying the cost."
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json (`bt26-chronomon` vs
# `tm-quiet-red`). PROVISIONAL: assert block is our engine's result, not
# backfilled from DCGO -- unconfirmed until the oracle pass.
#
# Cross Arts is pinned at P0's stack[9] = TOP security card.
#
# THE LINE:
#   T1 (P0, 0): all-pass -> P1 3.
#   T2 (P1, 3): play Agumon ST1-03 (3) -> 0, pass -> P0 3.
#   T3 (P0, 3): all-pass (no Hyokomon in play, nothing triggers) -> P1 3.
