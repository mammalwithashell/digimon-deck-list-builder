# Exam scenario: Chronomon: Holy Mode (BT26-016), clause BT26-016#effect#2 --
# "<Engage> (At the end of your turn, this Digimon may attack.)"
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json + the group-B variant
# `cm-chronomon-offcolor` (bt26-chronomon with 1x BT26-090 -> BT24-059 and
# 1x BT25-100 -> BT26-021) vs `tm-quiet-red`. Merge the variant from
# variants-B.json into the book before running.
#
# THE LINE (T1-T5 main = BT26-016-effect3.yaml verbatim):
#   T1 BT25-008 (trash BT26-092 + BT26-087, draw 2); T2 P1 Dracomon; T3
#   BT24-059 (De-Digivolve pick on Dracomon); T4 P1 Biyomon + Dracomon
#   attacks (BT26-009 to P0 trash); T5 Holy Mode onto BT24-059 (cost 3); its
#   [When Digivolving] deletes Dracomon and returns P0's 3 trash cards ->
#   <Recovery +1> (this spends the shared [Once Per Turn]).
#   THE CLAUSE: P0 passes the main phase with Holy Mode unsuspended -> the
#   end-of-turn <Engage> window -> Holy Mode attacks P1's security.
#   On that attack only BT24-059's inherited [When Attacking] "by placing 1 of
#   your other Digimon as this Digimon's bottom digivolution card, it
#   unsuspends" is offered (optional -> DECLINED); Holy Mode's own #effect#3
#   is not, its [Once Per Turn] being spent (DCGO maxCountPerTurn; ours since
#   G-ENGINE-OPT-SPENT-TRIGGER-IN-TRIGGER-ORDER was resolved on main -- the
#   former `sim_only` TriggerOrder row was removed 2026-10-04). After the
#   attack our EndOfTurnAction park lingers with PASS only; P0's phase-exit
#   `pass` (step 20) emits nothing on the wire.
#   Security check: Vermilimon BT4-014 (8000) loses to 12000.
#
# WITNESS: at 17 (main phase, before the pass) Holy Mode unsuspended and
# p1.security 5; at 20 Holy Mode suspended and p1.security 4 -- an attack
# declared only after the main phase was passed (step 18 lowers to
# EndOfTurnGate { attack: Some(..) }, not a Main-phase action).
#
# PROMPT SHAPE: <Engage> = DCGO OptionalSkill yes + SelectAttackEffect (the
# emitter folds the EndOfTurnGate attack into that pair); BT24-059 inherited
# = OptionalSkill (declined).
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
card: BT26-016
clause: BT26-016#effect#2
seed: 424242
decks:
  p0:
    stack: [BT25-008, BT24-059, BT26-016, BT26-092, BT26-087,
            BT26-011, BT26-011, BT26-015, BT26-015, BT26-009,
            BT26-060, BT26-078, BT26-078, BT26-060, BT24-034, BT24-034]
    rest: cm-chronomon-offcolor
  p1:
    stack: [ST1-04, ST1-02, BT1-009, BT3-007, ST1-08,
            BT1-014, BT4-010, BT3-007, BT1-009, BT4-014,
            BT1-014, ST1-03, ST1-05, ST1-05]
    rest: tm-quiet-red
steps:
  # T1
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT25-008, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { cards: [BT26-092, BT26-087] } }
    expect: { prompt: SelectHandEffect }
  # T2
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-04, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT24-059, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # T4
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.1, using: BT26-016 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { select: { cards: [BT26-092, BT26-087, BT26-009] } }
    expect: { prompt: SelectCardEffect }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { attack: { attacker: field.1, target: security } }
    expect: { prompt: OptionalSkill }
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: OptionalSkill }
  # Post-attack phase exit: our EndOfTurnAction park lingers (PASS only, no
  # gate left); the emitter sends nothing on the wire for this pass.
  - actor: 0
    do: { pass: {} }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 17
    that:
      turn: 5
      p0.memory: 0
      p1.security: 5
      p0.field:
        - { card_id: BT25-008, dp: 1000, suspended: false, sources: [] }
        - { card_id: BT26-016, dp: 12000, suspended: false, sources: [BT24-059] }
  - at: 20
    that:
      p1.security: 4
      p1.trash: [BT4-014, ST1-04]
      p0.field:
        - { card_id: BT25-008, dp: 1000, suspended: false, sources: [] }
        - { card_id: BT26-016, dp: 12000, suspended: true, sources: [BT24-059] }
