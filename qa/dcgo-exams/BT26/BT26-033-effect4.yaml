# Exam scenario: Jupitermon (BT26-033, DUAL), clause BT26-033#effect#4 --
# "[When Digivolving] Add your top security card to the hand. Then, if it's
#  your turn, you may play or use 1 [Iliad] or [TS] trait card from your hand
#  with the cost reduced by 5."
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). DCGO-VERIFIED 2026-10-04: the prompt shapes below were
# read off DCGO C# at the pinned submodule (b9a0638cd) -- BT26_033.cs plus the
# shared classes it calls; each row's comment cites the file/method.
#
# THE LINE: T1 P-213 (0 -> -7); T2 P1 passes; T3 (memory 3) Jupitermon onto
# P-213 (cost 4 -> -1). The clause: top security (stack[9] = Elecmon BT25-030)
# goes to the hand; then P0 plays Inori Misono BT24-084 ([TS] Tamer, cost 3)
# from hand with the cost reduced by 5 (floored at 0).
#
# WITNESS (at 8): p0.security 5 -> 4 and BT25-030 in p0.hand (first half);
# Inori on the field and p0.memory still -1 -- paid 0, not 3 (unreduced would
# read -4) (second half).
#
# Inori (not Homeros BT24-102, cost 5) is the pick on purpose: Homeros has an
# [End of Your Turn] trigger that stacks beside <Engage>'s end-of-turn effect
# and parks a TriggerOrder (probed). Inori has no [On Play] / end-of-turn text.
#
# PROMPT SHAPE: SelectHandEffect (ours optional select_hand; DCGO
# canNoSelect:true over cards playable/usable at cost-5 -- the candidate SETS
# may differ, e.g. if DCGO filters by affordability, but the answer is by
# identity). No OptionalSkill gate (the WD is not optional).
# VERIFIED vs DCGO C# (BT26_033.cs:56-199): isOptional false; the top security
# card is added unconditionally; then, on the owner's turn, ONE SelectHandEffect
# (canNoSelect true, maxCount 1) over [Iliad]/[TS] cards passing CanPlayOrUse
# at fixedCost max(0, cost - 5); the pick gets a -5 ChangeCostClass and is
# played via PlayPermanentCards(payCost true, activateETB true). BT24_084.cs
# (Inori) has only [Start of Your Main Phase] / OnLoseSecurity / [Security]
# effects, so its play opens nothing.
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO -- unconfirmed until the oracle pass.
card: BT26-033
clause: BT26-033#effect#4
seed: 424242
decks:
  p0:
    # hand (0-4): P-213 Aegiochusmon (red Lv.5 [TS], the digivolve base),
    # Jupitermon, Inori Misono (the cost-reduced play), two quiet TS cards.
    # security (5-9), stack[9] = TOP = the card the [When Digivolving] takes.
    # draws (10..): T3 turn draw, the digivolve-bonus draw, T5 turn draw.
    stack: [P-213, BT26-033, BT24-084, BT25-033, BT26-092,
            BT24-031, BT24-034, BT26-029, BT24-083, BT25-030,
            BT25-022, BT24-034, BT25-033]
    rest: ts-jupitermon
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08, BT4-014]
    rest: tm-quiet-red
steps:
  # T1 (P0, memory 0): decline breeding; hard-play P-213 Aegiochusmon
  # (cost 7: 0 -> -7). It has no [On Play]; its [When Digivolving] never
  # fires (it is played, not digivolved). -> P1 at 7.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: P-213, from: hand } }
    expect: { prompt: main_phase }
  # T2 (P1, memory 7): all-pass -> P0 at 3.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, memory 3): Jupitermon onto P-213 in the battle area. Both the
  # printed Red Lv.5 circle (5) and the [Digivolve] Lv.5 w/[TS] circle (4)
  # are open, so both engines ask which cost to pay (ours EffectChoice, DCGO
  # SelectCountEffect over the distinct cost list) -- answered by VALUE 4.
  # Verified: CardController.cs PlayCardClass.SelectCost (~:620-740) builds
  # CostList.Distinct() = [5, 4] and, at Count >= 2, opens SelectCountEffect
  # "Which digivolution cost do you pay?" (CanNoSelect false).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT26-033 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { value: 4 } }
    expect: { prompt: SelectCountEffect }
  # THE CLAUSE: top security -> hand (automatic), then play Inori at cost
  # 3 - 5 -> 0.
  - actor: 0
    do: { select: { cards: [BT24-084] } }
    expect: { prompt: SelectHandEffect }
  # T3's end (memory -1 -> the turn ends): Jupitermon (on P-213, in play
  # since T1, unsuspended) has <Engage>, so the end-of-turn attack window
  # opens in BOTH engines -- ours parks EndOfTurnAction, DCGO's EndTurnProcess
  # asks the <Engage> OptionalSkill gate. Declined (a `pass` at the park folds
  # to OptionalSkill "no"). This row was dcgo_only until
  # G-ENGINE-DUAL-END-OF-TURN-WINDOW was fixed (2026-10-04): our engine used
  # to skip the park for a DUAL top card (CardKind::Dual).
  # Verified, including on this NEGATIVE-memory turn end:
  # AutoProcessing.cs EndTurnCheck (:635) runs EndTurnProcess as soon as the
  # non-turn player has >= 1 memory, and EndTurnProcess (:679) stacks
  # EffectTiming.OnEndTurn BEFORE moving to phase.End -- the same path as a
  # pass. <Engage> is CardEffectFactory EngageEffect (Engage.cs:37,
  # isOptional true -> OptionalSkill as the lone stacked effect), CanUse =
  # owner's turn + IsPermanentExistsOnBattleAreaDigimon (Permanent.IsDigimon
  # is true for the DUAL top card: CardSource.IsDigimon = cardKind contains
  # Digimon), CanActivate = CanActivateEngage (CanAttack && !IsAttacking).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: OptionalSkill }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 7
    that:
      p0.security: 4
      p0.hand: [BT24-034, BT24-084, BT25-022, BT25-030, BT25-033, BT26-092]
  - at: 8
    that:
      p0.memory: -1
      p0.hand: [BT24-034, BT25-022, BT25-030, BT25-033, BT26-092]
      p0.field:
        - { card_id: BT24-084, dp: -1, suspended: false, sources: [] }
        - { card_id: BT26-033, dp: 13000, suspended: false, sources: [P-213] }
  - at: 10
    that:
      turn: 4
