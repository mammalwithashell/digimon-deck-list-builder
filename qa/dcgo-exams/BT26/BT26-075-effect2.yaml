# Exam scenario: ScourgeChiropmon (BT26-075), clause BT26-075#effect#2 --
# "<Ascension> (When this Digimon is deleted, you may place this card as the
# top security card.)" (The extractor splits the <Execute> <Ascension> line:
# effect#1 = <Execute> (empty text), effect#2 = the <Ascension> reminder.)
#
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO. It stays unconfirmed until the oracle pass.
#
# THE LINE (memory ledger in brackets):
#   T1 P0 hatches Kekkomon, digivolves it in breeding into Liollmon [0 -> 0]
#      (draw stack[10] ST23-12), plays Kyo Sawashiro (BT26-089) [0 -> -3].
#   T2 p1 hard-plays Phoenixmon (ST1-10, 12000) [3 -> -7] -> p0 gets 7.
#   T3 P0 draws stack[11] ST23-06; moves Liollmon (declines its [When
#      Moving]); Kyo's SoMP places ST23-15 face down, Draw 1, +1 [7 -> 8];
#      Liollmon -> Armalizamon (BT25-049, [Glowing Dawn] route 2) [8 -> 6],
#      whose [When Digivolving] suspends Phoenixmon; Armalizamon ->
#      ScourgeChiropmon ([Glowing Dawn] route 3; printed purple/yellow
#      circles miss the green Armalizamon) [6 -> 3]. Scourge attacks the
#      suspended Phoenixmon and loses (8000 < 12000) -> deleted in battle.
#      <Ascension> resolves first: Scourge becomes the top security card
#      (5 -> 6), and its [On Deletion] fizzles (the card left the trash).
# WITNESS: p0.security 6, BT26-075 absent from p0.trash (only Armalizamon,
# Liollmon, Kekkomon there), Kyo still holds ST23-15 (the [On Deletion]
# "by trashing" never ran).
#
# PROMPT SHAPE (BT26-075.yaml DCGO crosscheck: AscensionSelfEffect
# (OnDestroyedAnyone)): DCGO stacks <Ascension> + [On Deletion] in one
# MultipleSkills; `trigger: Ascension` is the portable keyword answer. The
# Ascension placement is our EffectChoice <-> DCGO's OptionalSkill (yes).
card: BT26-075
clause: BT26-075#effect#2
seed: 424242
decks:
  p0:
    stack: [BT26-025, BT26-089, BT25-049, BT26-075, ST23-15,
            ST23-15, BT25-090, BT26-089, ST23-06, ST23-09,
            ST23-12, ST23-06, BT25-046, BT25-057, ST23-12,
            BT26-026, BT25-090, BT25-043]
    rest: gd-bt26-4th
  p1:
    stack: [ST1-10, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014, BT4-010]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: breeding, using: BT26-025 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { play: { card: BT26-089, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-10, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  # Liollmon's [When Moving] (Kyo is a [Glowing Dawn] Tamer): decline the
  # cancellable Tamer pick -- keeps the security stack and Kyo untouched.
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: SelectPermanentEffect }
  # Kyo's [Start of Your Main Phase]: ST23-15 face down under Kyo, Draw 1,
  # +1 memory (7 -> 8).
  - actor: 0
    do: { select: { cards: [ST23-15] } }
    expect: { prompt: SelectHandEffect }
  - actor: 0
    do: { digivolve: { from: field.1, using: BT25-049 } }
    expect: { prompt: main_phase }
  # Armalizamon [When Digivolving] "you may suspend": suspend Phoenixmon so
  # it can be attacked.
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect, count: 1 }
  - actor: 0
    do: { digivolve: { from: field.1, using: BT26-075 } }
    expect: { prompt: main_phase }
  # ENGINE FINDING: Armalizamon's "[Your Turn][OPT] When you would USE a
  # [Glowing Dawn] Option card ... reduce the cost by 3" is offered on a
  # DIGIVOLVE into the DUAL ScourgeChiropmon (its `kind: option` filter
  # matches a DUAL). DCGO keys it on option USE only -> declined here; no
  # DCGO counterpart expected -> sim_only.
  - actor: 0
    do: { select: { decline: true, sim_only: true } }
  - actor: 0
    do: { attack: { attacker: field.1, target: field.0 } }
    expect: { prompt: main_phase }
  # [When Attacking]: Kekkomon's and Liollmon's inherited texts stack.
  # Kekkomon first: its "by trashing ... may digivolve" -> declined.
  - actor: 0
    do: { select: { cards: [ST23-01] } }
  - actor: 0
    do: { select: { decline: true } }
  # Liollmon's inherited "may add top security": our 2-way EffectChoice
  # (no decline form) answered by label sim-side; DCGO's Yes/No as a
  # dcgo_only "no".
  - actor: 0
    do: { select: { choice: "Don't add", sim_only: true } }
  - actor: 0
    do: { select: { decline: true, dcgo_only: true } }
  # Battle: Scourge 8000 < Phoenixmon 12000 -> Scourge deleted. <Ascension>
  # and [On Deletion] stack (official Q&A: player orders them).
  # THE CLAUSE: <Ascension> first (named by keyword), then "you may place
  # this card as the top security card" -> yes. The card left the trash, so
  # the pending [On Deletion] can no longer activate (Q&A) -- no more prompts.
  - actor: 0
    do: { select: { cards: [BT26-075], trigger: Ascension } }
  - actor: 0
    do: { select: { yes: true } }
  - actor: 0
    do: { pass: {} }
assert:
  - at: 19
    that:
      turn: 3
      p0.memory: 3
      p0.security: 6
      p0.trash: [BT25-049, BT26-025, ST23-01]
      p0.hand: [BT25-046, BT25-057, ST23-06, ST23-12, ST23-12]
      p0.field:
        - card_id: BT26-089
          dp: -1
          suspended: false
          sources: [ST23-15]
      p1.field:
        - card_id: ST1-10
          dp: 12000
          suspended: true
          sources: []
