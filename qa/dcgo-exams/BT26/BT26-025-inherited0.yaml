# Exam scenario: Liollmon (BT26-025), clause BT26-025#inherited#0 --
# "[When Attacking] [Once Per Turn] You may add your top security card to the
# hand. Then, if you have 0 security cards, <Recovery +1>."
#
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO. It stays unconfirmed until the oracle pass.
#
# THE LINE (memory ledger in brackets):
#   T1 P0 hatches Kekkomon and digivolves it in breeding into Liollmon
#      (Lv.2 [Glowing Dawn] route) [0 -> 0], draw stack[10] BT26-089. Pass.
#   T2 p1 passes both phases (p0 gets 3).
#   T3 P0 draws stack[11] ST23-06, moves Liollmon (its [When Moving] is
#      silent -- no [Glowing Dawn] Tamer), digivolves it into Armalizamon
#      (BT25-049, green: only the "Lv.3 w/[Glowing Dawn]: Cost 2" route
#      matches) [3 -> 1], draw stack[12] BT25-046. Armalizamon's [When
#      Digivolving] "may suspend" has no target (p1 has no Digimon).
#      Armalizamon attacks security: Liollmon's inherited text fires; with 5
#      security the "add" is answered YES -> top security stack[9] ST23-09
#      goes to hand (security 5 -> 4); 4 != 0, so no <Recovery>. The check
#      flips p1's top security ST1-02 (3000) which loses to 4000 DP.
#   Kekkomon's inherited [When Attacking] is silent (no Tamer with a
#   face-down card -- its "by trashing" cost cannot be paid).
# WITNESS: ST23-09 in p0's hand, p0 security 4.
# NOT WITNESSED here: the "Then, if 0 security, <Recovery +1>" tail (needs a
# 0- or 1-security line; out of reach in a short line).
#
# PROMPT SHAPE (BT26-025.yaml DCGO crosscheck: OnAllyAttack, not optional;
# "if security >= 1 a Yes/No"): our engine parks a 2-way EffectChoice
# ("Add" / "Don't add"); DCGO's Yes/No is likely a generic_bool or
# OptionalSkill row -- the sim side cannot assert the EffectChoice mapping,
# so no `expect:` is pinned on that row. If the oracle aborts on the answer
# form, re-author it as a `choice:` sim_only row + a dcgo_only row.
