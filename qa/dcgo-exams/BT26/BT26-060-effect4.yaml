# Exam scenario: Chronomon: Destroy Mode (BT26-060), clause BT26-060#effect#4 --
# "<Succession (Lv.6 w/[Chronomon] in name)> (This Digimon gains all effects
#  other than <Succession> on its topmost specified digivolution card.)"
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json (`bt26-chronomon` vs `tm-quiet-red`;
# no variant). Every card the line names is stacked.
#
# THE LINE:
#   T1 (P0, 0): pass.   T2 (P1, 3): pass.
#   T3 (P0, 3): hard-play Chronomon: Holy Mode BT26-016 (12: 3 -> -9). Its
#      [On Play] is silent: P1 has no Digimon and both trashes are empty.
#   T4 (P1, 9): Monodramon BT1-009 (2), -> Kokatorimon BT1-014 (2, draw 1),
#      Phoenixmon ST1-10 (10): 9 -> -5. P0 gets 5.
#   T5 (P0, 5): digivolve Holy Mode -> Destroy Mode. Both the red Lv.6 circle
#      (cost 6) and the "Lv.6 w/[Chronomon] in text" condition (cost 5) apply:
#      take cost 5 (5 -> 0). TWO [When Digivolving] triggers stack: Destroy
#      Mode's own effect#5 and Holy Mode's "[On Play][When Digivolving][When
#      Attacking][OPT] You may delete 1 of your opponent's Digimon with as much
#      DP as this Digimon or less. Then, by returning 3 cards in trashes ..."
#      -- GAINED through <Succession>. Resolve the gained one first: delete
#      Phoenixmon (12000 <= 16000). Its recovery half has no payable cost (P0
#      trash empty, P1 trash 1) and asks nothing. Then effect#5 returns
#      Kokatorimon; effect#6's gate is declined. Pass at 0: the gained <Engage>
#      opens the end-of-turn gate -> attack P1's security.
#   T6 (P1): breeding pass.
#
# WITNESS (three independent marks of the gained Holy Mode text):
#   1. step 14's trigger-order prompt offers a BT26-016 candidate beside
#      BT26-060 (`expect.candidates`) -- a Holy Mode [When Digivolving] firing
#      off DESTROY MODE's digivolution.
#   2. at 16 Phoenixmon ST1-10 is in P1's trash (deleted by that gained effect,
#      before effect#5 ran -- Kokatorimon is still on the field); at 17
#      effect#5 has peeled Kokatorimon.
#   3. at 19 (the end-of-turn gate, after the main-phase PASS) Destroy Mode is
#      unsuspended and P1 has 5 security; at 20 it is suspended and P1 has 3 --
#      an END-OF-TURN attack, i.e. <Engage>, printed only on Holy Mode. At 21
#      (T6) <Reboot> has unsuspended it again.
#
# SLOT HYGIENE: P0 has one permanent throughout (`digivolve from: field.0`);
# P1's two Digimon are only ever picked by identity; the end-of-turn attack
# targets the player.
#
# PROMPT SHAPE (ours vs expected DCGO):
#   * Cost choice: ours EffectChoice "Digivolve for cost 5 | cost 6" answered
#     sim-only with `choice: "cost 5"`; DCGO's digivolution-cost route is
#     SelectCountEffect (docs/DCGO_EXAM.md table, EffectChoice row) -> a
#     dcgo_only `value: 5` row. If DCGO picks the path differently, re-author.
#   * Trigger order: ours TriggerOrder [BT26-060, BT26-016]; DCGO
#     MultipleSkills. RISK: DCGO's Succession may attribute the gained effect
#     to BT26-060 (the carrier) rather than BT26-016 -- then DCGO's candidate
#     set reads [BT26-060, BT26-060] and this row needs `ordinal:` instead.
#   * The gained delete: optional pick -> DCGO OptionalSkill + SelectPermanent
#     (folded pick).
#   * effect#5: one SelectPermanentEffect (Kokatorimon is the only Digimon left).
#   * <Engage>: end-of-turn OptionalSkill + SelectAttackEffect (the documented
#     end-of-turn fold); the trailing sim-only PASS exits our EndOfTurnAction.
# Step 20 on: P1 security 5 -> 3 (<Security A. +1> = 2 checks). Before the
# 2026-10-04 card-data fix (G-ENGINE-SECURITY-ATTACK-AURA-PLUS-FACE-DOUBLE-COUNT,
# see BT26-060-effect1.yaml) our engine double-counted the keyword (5 -> 2).
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
card: BT26-060
clause: BT26-060#effect#4
seed: 424242
