# Exam scenario: Chronomon: Holy Mode (BT26-016), clause BT26-016#effect#3 --
# "[On Play] [When Digivolving] [When Attacking] [Once Per Turn] You may
#  delete 1 of your opponent's Digimon with as much DP as this Digimon or less.
#  Then, by returning 3 cards in trashes to the bottom of the deck,
#  <Recovery +1>."
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json + the group-B variant
# `cm-chronomon-offcolor` (bt26-chronomon with 1x BT26-090 -> BT24-059 and
# 1x BT25-100 -> BT26-021) vs `tm-quiet-red`. Merge the variant from
# variants-B.json into the book before running.
#
# THE LINE:
#   T1 (P0, 0): play BT25-008 (3: 0 -> -3); its [On Play] trashes BT26-092 and
#      BT26-087 ([TS]) -> <Draw 1> x2.
#   T2 (P1, 3): play Dracomon ST1-04 (3: 3 -> 0), pass -> P0 3.
#   T3 (P0, 3): play BT24-059 (Black/Blue Lv.5 [TS], 7: 3 -> -4); its [On Play]
#      <De-Digivolve 1> picks Dracomon (no sources -> no change).
#   T4 (P1, 4): play Biyomon ST1-02 (2: 4 -> 2); Dracomon attacks security:
#      P0's top security Hyokomon BT26-009 (2000) loses the battle -> P0 trash
#      (3 cards now); pass -> P0 3.
#   T5 (P0, 3): draw; digivolve Holy Mode onto BT24-059 (off-colour base: only
#      the [TS] condition, cost 3: 3 -> 0; bonus draw BT24-034). THE CLAUSE
#      ([When Digivolving]): delete Dracomon (4000 <= 12000), then return all
#      3 cards of P0's trash to the deck bottom -> <Recovery +1> (top deck card
#      BT24-034 onto security).
#
# WITNESS: at 14 security 4, P0 trash [BT26-009, BT26-087, BT26-092], Dracomon
# on P1's field; at 17 Dracomon in P1's trash (the delete), P0 trash empty
# (the 3-card return) and security 4 -> 5 (Recovery +1).
#
# PARTIAL: witnesses the [When Digivolving] timing with an own-trash-only
# 3-card return. Not witnessed: [On Play] / [When Attacking] timings (the
# effect1/2/4 lines show the spent OPT suppressing [When Attacking] on the
# same turn); a cross-trash split (own k + opponent 3-k) -- authorable since
# main's e2a69509 (a 2+1 probe gives Recovery +1 correctly), not yet added;
# "0 own + 3 opponent" (reachable since the 2026-10-04 YAML fix gave the own
# pick `optional_zero`; covered by cards_behavioral, not by a scenario yet);
# the partial-return "pays nothing" Q&A branch; the RemoveUse refund.
#
# PROMPT SHAPE: optional delete pick (DCGO SelectPermanentEffect,
# canNoSelect:true); then the return. DCGO: an area choice ("your trash" /
# "enemy's trash" / Cancel -- generic_int or SelectCountEffect, unverified)
# followed by a canEndNotMax SelectCardEffect multi-pick; ours: one
# CountCappedMultiSelect over own trash (3 picks, auto-commit at max). The
# oracle pass will likely need a dcgo_only area-choice row before step 16.
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
card: BT26-016
clause: BT26-016#effect#3
seed: 424242
