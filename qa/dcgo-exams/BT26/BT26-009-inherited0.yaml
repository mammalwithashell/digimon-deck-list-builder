# Exam scenario: Hyokomon (BT26-009), clause BT26-009#inherited#0 -- the
# head of the inherited "[When Attacking] [Once Per Turn] <Draw 1>. Then, if
# your hand has 6 or more cards, return 1 card in your hand to the bottom of
# the deck." (clause_coverage splits at the <Draw 1> keyword: #inherited#0 =
# [When Attacking][OPT] <Draw 1>; #inherited#1 = the hand >= 6 tail, covered
# by BT26-009-inherited1.yaml.) This line draws with a SMALL hand, so it also
# pins the tail's NEGATIVE branch (hand 5 < 6 -> nothing returned, no pick).
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json + this pass's variant
# book (variants-A.json). P0 = VARIANT `cm-chronomon-iso` (eggs 4x BT24-003
# Tsunomon -> no Yokomon add-to-deck observer; BT26-033 -> BT25-034 Angemon,
# the quiet Lv.4 carrier). P1 = `tm-quiet-red`.
#
# THE LINE:
#   T1 (P0, 0): hatch Tsunomon; digivolve Hyokomon over it in breeding (alt,
#      cost 0); digivolve-draw stack[10] BT25-100. Pass.
#   T2 (P1, 3): play Biyomon ST1-02 (3 -> 1) and Phoenixmon ST1-10
#      (1 -> -9): the overspend hands P0 9 memory, which P0 needs to shrink
#      its hand below 6 before the attack. (Neither has <Blocker>; Angemon
#      has no <Raid>, so P1's Digimon open no window on the attack.)
#   T3 (P0, 9): draw stack[11] BT26-090. Move the stack out (Hyokomon's own
#      [Start of Your Main Phase] STARVED: no [Chronomon]-text/[Shaman] card
#      in hand). Digivolve Angemon over Hyokomon (cost 2 -> 7; digivolve-draw
#      stack[12] BT26-101). Play Shota Kuroi BT26-092 twice (3 + 3 -> 1; no
#      [On Play]) -> hand 4. Attack P1's security: THE CLAUSE -- inherited
#      <Draw 1> (stack[13] BT26-087) -> hand 5 < 6, so no return. P1's top
#      security is Tai Kamiya ST1-12 ([Security] play) -- no battle.
#
# WITNESS (at 11 vs at 10): hand 4 -> 5, exactly + BT26-087; p0.trash still
# empty (nothing returned/trashed); memory unchanged (1); Angemon suspended
# over [BT24-003, BT26-009]; P1 security 5 -> 4.
#
# PROMPT SHAPE: none for the clause on either side (DCGO: non-optional
# OnAllyAttack; the hand >= 6 pick is behind `HandCards.Count >= 6`).
#
# PARTIAL: [Once Per Turn] (a 2nd attack the same turn) is not witnessed.
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
