# Exam scenario: Chronomon: Destroy Mode (BT26-060), clause BT26-060#effect#2 --
# "<Reboot>" (This Digimon also unsuspends in your opponent's unsuspend phase).
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json (`bt26-chronomon` vs `tm-quiet-red`;
# no variant). Every card the line names is stacked.
#
# THE PREFIX (Destroy Mode reaches the field through Giant Slayer's would-leave
# replacement -- the BT26-085-effect4.yaml line):
#   T1 (P0, 0): pass.
#   T2 (P1, 3): play Agumon ST1-03 (3: 3 -> 0); pass (P0 gets 3).
#   T3 (P0, 3): hard-play Giant Slayer BT26-085 (12: 3 -> -9).
#   T4 (P1, 9): Agumon attacks P0 security first (Giant Slayer's
#      blocker window: declined; P0's top security Coronamon BT25-008, 1000,
#      loses; Agumon stays SUSPENDED). Then Gaia Force ST1-16 (8: 9 -> 1; Agumon pays the red
#      requirement) on Giant Slayer -> Giant Slayer's replacement: accept,
#      digivolve into Destroy Mode BT26-060 from hand for free. Destroy Mode's
#      [When Digivolving] picks the lone Agumon (one card -> nothing returned,
#      so effect#6 stays silent). P1 passes (P0 gets 3).
#   T5 (P0, 3): Destroy Mode attacks the SUSPENDED Agumon (16000 vs 2000:
#      deleted, no security check -- so the <Security A. +1> double count of
#      BT26-060-effect1.yaml cannot leak in). P0 passes.
#   T6 (P1, 3): unsuspend phase -> breeding decision.
# P0's security stack[9] (TOP) is Coronamon BT25-008 so Agumon survives T4.
#
# WITNESS: at 18 (after its T5 attack) Destroy Mode is suspended: true; at 19
# (P1's T6 breeding decision, i.e. after P1's unsuspend phase, still P1's
# turn) it is suspended: false. Giant Slayer has no inherited text, so the
# keyword is Destroy Mode's own.
#
# SLOT HYGIENE: every slot-addressed step (`digivolve from:`, `attack:`) is
# taken while the addressed side has exactly ONE permanent in its battle area
# (no Tamers), because `field.N` reaches DCGO as a compact frame index and DCGO
# seats permanents centre-out (NOTES-BT24-081.md "Slot hygiene"). Every
# selection is answered by card identity.
#
# PROMPT SHAPE: blocker window (T4) -> ours an OwnField "Declare a blocker"
# pick declined with `decline:`; DCGO SelectPermanentEffect (EX12-019 /
# EX12-065 idiom). Rest as BT26-085-effect4.yaml.
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
card: BT26-060
clause: BT26-060#effect#2
seed: 424242
decks:
  p0:
    stack: [BT26-085, BT26-060, BT26-011, BT26-015, BT25-008,
