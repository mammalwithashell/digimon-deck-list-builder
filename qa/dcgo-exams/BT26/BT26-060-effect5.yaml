# Exam scenario: Chronomon: Destroy Mode (BT26-060), clause BT26-060#effect#5 --
# "[On Play] [When Digivolving] Return the top 5 stacked cards of 3 of your
#  opponent's Digimon to the top of the deck."
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json (`bt26-chronomon` vs `tm-quiet-red`;
# no variant). Every card the line names is stacked.
#
# THE LINE (the "Giant Slayer -> Destroy Mode" spine, shared by BT26-060
# effect0 / effect5 / effect6):
#   T1 (P0, 0): pass.
#   T2 (P1, 3): play Monodramon BT1-009 (2: 3 -> 1); pass (P0 gets 3).
#   T3 (P0, 3): hard-play Giant Slayer BT26-085 (12: 3 -> -9). Its [On Play]
#      protection grant asks nothing.
#   T4 (P1, 9): Monodramon -> Kokatorimon BT1-014 (2: 9 -> 7, draw 1); play
#      Phoenixmon ST1-10 (10: 7 -> -3). P0 gets 3.
#   T5 (P0, 3): digivolve Giant Slayer -> Chronomon: Destroy Mode BT26-060 for
#      5 through the "[Giant Slayer]" special condition (3 -> -2; digivolve
#      draw 1). [When Digivolving] (effect#5): pick BOTH of P1's Digimon
#      (min(3, 2)); Kokatorimon's stack returns its top min(stack-1, 5) = 1
#      card (Kokatorimon) to the TOP of P1's deck, Phoenixmon (one card) gives
#      nothing. That deck-add is P0's own effect -> effect#6 ("[All Turns][OPT]
#      When your effects add to decks, you may delete ...") opens its gate.
#      The turn then passes (memory -2).
#   T6 (P1, 2): breeding decision -- P1 has drawn the returned Kokatorimon.
#   (effect#6's gate is declined here.)
#
# WITNESS (the [When Digivolving] half):
#   at 12  (pick pending) P1 has Kokatorimon BT1-014 over Monodramon BT1-009,
#          and Phoenixmon ST1-10; BT1-014 is in no zone we can see.
#   at 13  Kokatorimon is gone (not in P1's trash or hand), Monodramon is left
#          alone, Phoenixmon is untouched (top card never returned: DCGO
#          returns top min(stack - 1, 5)).
#   at 14  P1's T6 draw put BT1-014 in P1's hand: it went to the TOP of the deck.
# PARTIAL: the [On Play] half (a 16-cost hard play is beyond the 13-memory
# ceiling on any short line), the "3 of" cap (only 2 opposing Digimon), the
# 5-card cap and the 2+-card owner ordering (only a 2-card stack) are not
# witnessed.
#
# SLOT HYGIENE: every slot-addressed step (`digivolve from:`, `attack:`) is
# taken while the addressed side has exactly ONE permanent in its battle area
# (no Tamers), because `field.N` reaches DCGO as a compact frame index and DCGO
# seats permanents centre-out (NOTES-BT24-081.md "Slot hygiene"). Every
# selection is answered by card identity.
#
# PROMPT SHAPE (ours vs expected DCGO, BT26-060.yaml DCGO notes):
#   * Digivolve onto Giant Slayer: ONE applicable path (no printed Lv.6 circle
#     can apply to a level-less white Digimon) -> no cost-choice prompt.
#   * effect#5: mandatory pick of min(3, n) -> ours one OppField multi-pick
#     answered with both targets (by identity); DCGO one SelectPermanentEffect
#     (maxCount 2). One card returned -> no ordering prompt on either side
#     (DCGO orders only 2+ cards).
#   * effect#6: optional + canNoSelect pick -> ours an outer gate (Replacement
#     kind -> OptionalSkill) then the OppField pick; DCGO OptionalSkill then
#     SelectPermanentEffect (canNoSelect).
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
card: BT26-060
clause: BT26-060#effect#5
seed: 424242
decks:
  p0:
    stack: [BT26-085, BT26-060, BT26-011, BT26-015, BT25-008,
            BT26-078, BT26-078, BT26-078, BT26-073, BT26-073,
            BT26-011, BT26-015, BT25-008, BT26-009, BT26-009]
