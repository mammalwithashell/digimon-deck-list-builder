#   T5 (P0, 3): pass (3 -> P1 gets 3).
#   T6 (P1, 3): Agumon (played T2) attacks P0's security; Destroy Mode BLOCKS;
#      Agumon (2000) is deleted. P1 passes.
#   T7 (P0): the trailing state.
#
