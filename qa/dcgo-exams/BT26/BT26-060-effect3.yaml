# selection is answered by card identity.
#
# PROMPT SHAPE: blocker window -> ours an OwnField "Declare a blocker" pick
# answered `targets: [own.field.0]`; DCGO SelectPermanentEffect (EX12-019 /
# EX12-065 idiom).
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
