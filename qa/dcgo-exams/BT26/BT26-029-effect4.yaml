# Exam scenario: Aegiochusmon: Holy (BT26-029), clause BT26-029#effect#4 --
# "[All Turns] [Once Per Turn] When your security stack is removed from, 3 of
#  your opponent's Digimon get -5000 DP for the turn." (The extractor folds the
#  trailing "(Rule) Trait: Has [Angel] Type." into this clause's text; the
#  Angel grant is not what this line witnesses.)
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). PROVISIONAL: assert block is our engine's result, not
# backfilled from DCGO -- unconfirmed until the oracle pass.
#
# THE LINE.
#   T1 (P0, 0): hard-play BT26-029 (0 -> -8); decline its [On Play] (so the
#        security removal comes from a clean, separate source).
#   T2 (P1, 8): Vermilimon BT4-014 (8 -> 3), Biyomon ST1-02 (3 -> 1),
#        Monodramon BT1-009 (1 -> -1) -> P0 1.
#   T3 (P0, 1): Blinding Ray BT4-104 (cost 0; yellow, BT26-029 is yellow):
#        trash top security (stack[9] = Kanan Yuki BT26-090), gain 2 (1 -> 3).
#        THE CLAUSE fires off the security removal: pick all three P1
#        Digimon -> -5000 each. Trailing pass.
#
# WITNESS: Biyomon (3000) and Monodramon (3000) are deleted to P1's trash;
# Vermilimon (8000) survives at 3000 DP -- the -5000 read directly.
#
# PROMPT SHAPE / anticipated oracle quirks:
#   - SIM-ONLY row: our 9-1-5 TriggerOrder between the used Option's disposal
#     and BT26-029's trigger (G-ENGINE-OPTION-TRASH-TURN-PLAYER-ORDER); DCGO
#     hard-codes the disposal first and asks nothing -> we answer "Trash the
#     used Option" to take DCGO's order (BT3-096-effect0 precedent).
#   - The 3-target pick: ours is a count-capped multi-select answered in one
#     `targets:` row; DCGO is one SelectPermanentEffect(maxCount 3). If DCGO
#     re-parks per pick (or ours does on the wire), expect a cardinality
#     mismatch, not a rules finding.
