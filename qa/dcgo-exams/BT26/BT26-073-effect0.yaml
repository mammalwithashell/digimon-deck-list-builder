# Exam scenario: Aegiochusmon: Dark (BT26-073), clause BT26-073#effect#0 --
# the special digivolution condition "[Digivolve] [Aegiomon]: Cost 3".
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). PROVISIONAL: assert block is our engine's result, not
# backfilled from DCGO -- unconfirmed until the oracle pass.
#
# ISOLATION. Dark is PURPLE/RED; its printed circles are Purple Lv.4 / 4 and
# Red Lv.4 / 4. The base is Aegiomon BT25-033 (YELLOW Lv.4), so neither circle
# applies and the T3 digivolve is legal ONLY through the [Aegiomon] name
# condition, at cost 3. One legal route -> no cost-choice prompt.
#
# THE LINE:
#   T1 (P0, 0): hard-play Aegiomon BT25-033 (0 -> -5). Its optional
#       [On Play] ("By adding your top security card to the hand, 1 opp
#       Digimon -5000") is declined (OptionalSkill no).
#   T2 (P1, 5): pass -> P0 3.
#   T3 (P0, 3): THE CLAUSE -- digivolve Aegiomon -> Dark for 3 (3 -> 0).
#       Dark's [When Digivolving] (effect#1) then asks its cost menu; the
#       trash holds no [Shaman]/[TS] card, so ours offers the two-branch
#       EffectChoice ["Delete this Digimon" | "Don't pay the cost"] and this
#       line declines ("Don't pay"). Pass at 0 (memory stays with P0).
#
# WITNESS: the digivolve lowers off a yellow Aegiomon at all; Dark stands over
# BT25-033 and P0 paid exactly 3 (memory 3 -> 0).
#
# PROMPT SHAPE / DCGO quirks to triage:
#   - T1: DCGO may skip Aegiomon's optional gate when the opponent has no
#     Digimon (ours asks; our condition is only `security_count_gte: 1`).
#   - T3: our EffectChoice is sim-only; DCGO's SetIntSelection over the payable
#     costs is a dcgo_only generic_int row. The value 3 ("Don't use") is a
#     GUESS by analogy with the BT25-083 menu (Delete=1, Return=2, Don't=3) --
#     DCGO C# was not readable in the authoring container; correct it from
#     the oracle abort message if it differs.
