# Exam scenario: Aegiochusmon: Holy (BT26-029), clause BT26-029#effect#1 --
# "<Decode ([Aegiomon])>" (When this Digimon would leave the battle area other
# than in battle, you may play 1 [Aegiomon] from its digivolution cards
# without paying the cost.)
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). PROVISIONAL: assert block is our engine's result, not
# backfilled from DCGO -- unconfirmed until the oracle pass.
#
# THE LINE.
#   T1 (P0, 0): hard-play Aegiomon BT25-033 (0 -> -5); decline its [On Play].
#   T2 (P1, 5): Biyomon ST1-02 (5 -> 3) -- a RED Digimon so Gaia Force's
#        colour requirement is met; pass -> P0 3.
#   T3 (P0, 3): digivolve Aegiomon -> BT26-029 via the [Aegiomon] cost-3 route
#        (value 3; see effect0); decline the WD; pass (0) -> P1 3.
#   T4 (P1, 3): Gaia Force ST1-16 (3 -> -5) "Delete 1 of your opponent's
#        Digimon" -> target BT26-029. A deletion by effect is a leave "other
#        than in battle": THE CLAUSE -- accept the Decode gate, pick the
#        Aegiomon source -> it is played free. Its own [On Play] and
#        BT26-029's <Ascension> (BT26-029 deleted) then wait together:
#        order them (<Ascension> first), decline <Ascension> via our "No"
#        <Ascension> via our "No" branch. Turn passes; P0's T5 breeding pass closes the line.
#
# WITNESS: P0's field holds a fresh Aegiomon BT25-033 with NO sources (it came
# out of BT26-029's stack, unpaid -- P0 memory untouched by the play); BT26-029
# alone is in P0's trash; security still 5 (Ascension declined, Aegiomon's
# "by adding your top security card" declined).
#
# PROMPT SHAPE (VERIFIED against DCGO C# 2026-10-04):
#   - Gaia Force ST1-16: mandatory SelectPermanentEffect (Mode.Destroy).
#   - Decode: DecodeSelfEffect (CardEffectFactory/KeyWordEffects/Decode.cs)
#     is an optional ActivateClass on the CUT-IN stack (CardController.cs
#     WhenRemoveField -> autoProcessing_CutIn) -> OptionalSkill(yes), then
#     DecodeProcess's SelectCardEffect over DigivolutionCards (canNoSelect
#     true; one candidate is still asked) -> 1:1 with our gate + pick.
#   - The played Aegiomon's [On Play] is stacked on the MAIN autoProcessing
#     (PlayCardClass, CardController.cs ~1925), NOT resolved inside the cut-in
#     batch, so it waits until Gaia Force finishes; BT26-029's <Ascension>
#     (OnDestroyedAnyone) joins it there -> one MultipleSkills over
#     [BT25-033 On Play, BT26-029 Ascension] (On Play stacked first). Our
#     identity answer BT26-029 resolves on both sides. This matches our
#     post-G-ENGINE-DECODE-ON-PLAY-BEFORE-CARRIER-LEAVES ordering.
#   - <Ascension>: AscensionEffect is MANDATORY (isOptional false, no
#     OptionalSkill) and asks Yes/No through userSelectionManager
#     .SetBoolSelection (CardEffectCommons/KeyWordEffects/Ascension.cs
#     AscensionProcess) -> `generic_bool`; ours is an EffectChoice answered
#     sim-only by `choice: "No"` + the paired `dcgo_only` decline.
#   - Then the lone Aegiomon [On Play] (optional) -> OptionalSkill (decline).
card: BT26-029
clause: BT26-029#effect#1
seed: 424242
decks:
  p0:
    stack: [BT25-033, BT26-029, BT24-031, BT25-030, BT24-083,
            BT24-102, BT24-084, BT25-022, BT24-034, BT26-090,
            BT25-030, BT24-034, BT24-031, BT25-022]
    rest: ts-jupitermon
  p1:
    stack: [ST1-02, ST1-16, ST1-03, BT1-009, BT3-007,
            BT1-014, BT4-010, BT3-007, BT1-009, ST1-04,
            ST1-04, ST1-03, BT1-014, BT4-010, ST1-05]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT25-033, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: OptionalSkill }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT26-029 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { value: 3 } }
    expect: { prompt: SelectCountEffect }
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: OptionalSkill }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-16, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { select: { yes: true } }
    expect: { prompt: OptionalSkill }
  - actor: 0
    do: { select: { cards: [BT25-033] } }
    expect: { prompt: SelectCardEffect }
  # BT26-029 has now left (Decode processing complete), so the played
  # Aegiomon's [On Play] and BT26-029's <Ascension> wait together: order
  # them -- <Ascension> (BT26-029) first. (Picking an optional entry from
  # our TriggerOrder activates it, so the [On Play] is ordered second to keep
  # its own decline gate.)
  - actor: 0
    do: { select: { cards: [BT26-029] } }
    expect: { prompt: MultipleSkills }
  - actor: 0
    do: { select: { choice: "No", sim_only: true } }
  - actor: 0
    do: { select: { decline: true, dcgo_only: true } }
    expect: { prompt: generic_bool }
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: OptionalSkill }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 20
    that:
      turn: 5
      p1.memory: -5
      p0.field:
        - { card_id: BT25-033, dp: 5000, suspended: false, sources: [] }
      p0.trash: [BT26-029]
      p0.security: 5
      p1.trash: [ST1-16]
