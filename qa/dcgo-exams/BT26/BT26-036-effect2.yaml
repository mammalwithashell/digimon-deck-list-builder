# Exam scenario: Lalamon (BT26-036), clause BT26-036#effect#2 --
# "[On Play] Reveal the top 3 cards of your deck. Add 1 card with the
#  [Vegetation], [Fairy] or [DATA SQUAD] trait or 1 green Tamer card among them
#  to the hand. Return the rest to the bottom of the deck."
#
# DECK NOTE. `bt26-dats` has no Lalamon (the list is the Ravemon build), so the
# stack supplies it; the rest of the deck is the real 1st-place list (see
# BT26-065-effect1.yaml).
#
# THE LINE: P0 hard-plays Lalamon on T1 (0 -> -3). Revealed stack[10..12]:
#   [10] ST24-04  -- [DATA SQUAD] Agumon       -> legal
#   [11] BT26-091 -- green [DATA SQUAD] Tamer  -> legal
#   [12] ST24-15  -- white [DATA SQUAD] Option -> legal
# One pick (BT26-091); the other two go to the deck bottom. DCGO asks for the
# bottom order of a 2-card remainder; ours parks an OrderedPermutation.
card: BT26-036
clause: BT26-036#effect#2
seed: 424242
decks:
  p0:
    stack: [BT26-036, ST24-12, BT26-072, BT26-076, ST24-15,
            ST24-05, ST24-10, BT26-049, BT26-050, ST24-14,
            ST24-04, BT26-091, ST24-15, ST24-05, BT26-094]
    rest: bt26-dats
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08, BT4-014]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT26-036, from: hand } }
    expect: { prompt: main_phase }
  # THE CLAUSE: the single pick -> Yoshino (green Tamer / [DATA SQUAD]).
  - actor: 0
    do: { select: { cards: [BT26-091] } }
    expect: { prompt: SelectCardEffect }
  # Bottom order for the two leftovers (ST24-04 then ST24-15).
  - actor: 0
    do: { select: { cards: [ST24-04, ST24-15] } }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 4
    that:
      turn: 2
      p0.hand: [ST24-12, BT26-072, BT26-076, ST24-15, BT26-091]
      p0.field:
        - card_id: BT26-036
          dp: 1000
          suspended: false
          sources: []
      p0.trash: []
