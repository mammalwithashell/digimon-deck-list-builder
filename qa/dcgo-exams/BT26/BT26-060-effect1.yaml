# Exam scenario: Chronomon: Destroy Mode (BT26-060), clause BT26-060#effect#1 --
# "<Security A. +1>".
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json (`bt26-chronomon` vs `tm-quiet-red`;
# no variant). Every card the line names is stacked.
#
# THE PREFIX (Destroy Mode reaches the field through Giant Slayer's would-leave
# replacement -- the BT26-085-effect4.yaml line):
#   T1 (P0, 0): pass.
#   T2 (P1, 3): play Agumon ST1-03 (3: 3 -> 0); pass (P0 gets 3).
#   T3 (P0, 3): hard-play Giant Slayer BT26-085 (12: 3 -> -9).
#   T4 (P1, 9): Gaia Force ST1-16 (8: 9 -> 1; Agumon pays the red
#      requirement) on Giant Slayer -> Giant Slayer's replacement: accept,
#      digivolve into Destroy Mode BT26-060 from hand for free. Destroy Mode's
#      [When Digivolving] picks the lone Agumon (one card -> nothing returned,
#      so effect#6 stays silent). P1 passes (P0 gets 3).
#   T5 (P0, 3): Destroy Mode (on the field since T3 as Giant Slayer) attacks
#      P1's security; Agumon has no <Blocker>. P0 passes.
#   T6 (P1): breeding pass.
#
# WITNESS: at 15 P1 has 5 security; at 16 (after the one attack) P1 has 3
# security and the two flipped vanilla Digimon (BT1-009, ST1-02: both lose to
# 16000) are in P1's trash; BT3-007, the third card down, stays in security.
#
# The printed keyword makes Destroy Mode check 1 + 1 = 2 cards (5 -> 3), as
# DCGO (SecurityAttackSelfEffect, +1) does. This scenario is the real-text
# regression guard for G-ENGINE-SECURITY-ATTACK-AURA-PLUS-FACE-DOUBLE-COUNT:
# BT26-060.yaml used to encode <Security A. +1> as a self `aura` with
# `security_attack: 1` while the engine ALSO parses the printed keyword off the
# face text (Game::security_attack_keyword_bonus -> face_keywords), so real-text
# games checked THREE (5 -> 2). Fixed 2026-10-04 by switching the YAML to
# `grant_keyword: SecurityAttackPlus` (skipped when already printed); the
# step-16 asserts now read 5 -> 3. (cards_behavioral
# `security_attack_real_text` pins the same count for all six affected cards.)
#
# SLOT HYGIENE: every slot-addressed step (`digivolve from:`, `attack:`) is
# taken while the addressed side has exactly ONE permanent in its battle area
# (no Tamers), because `field.N` reaches DCGO as a compact frame index and DCGO
# seats permanents centre-out (NOTES-BT24-081.md "Slot hygiene"). Every
# selection is answered by card identity.
#
# PROMPT SHAPE: the prefix as in BT26-085-effect4.yaml; the attack itself asks
# nothing (no blocker on P1's side).
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
card: BT26-060
clause: BT26-060#effect#1
seed: 424242
decks:
  p0:
    stack: [BT26-085, BT26-060, BT26-011, BT26-015, BT25-008,
            BT26-078, BT26-078, BT26-078, BT26-073, BT26-073,
            BT26-011, BT26-015, BT25-008, BT26-009, BT26-009]
    rest: bt26-chronomon
  p1:
    stack: [ST1-16, ST1-03, ST1-04, BT3-007, ST1-02,
            ST1-03, ST1-04, BT3-007, ST1-02, BT1-009,
            BT3-007, ST1-04, ST1-03, ST1-02]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-03, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT26-085, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-16, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { select: { yes: true } }
    expect: { prompt: OptionalSkill }
  - actor: 0
    do: { select: { cards: [BT26-060] } }
    expect: { prompt: SelectHandEffect }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 15
    that:
      turn: 5
      p0.field:
        - { card_id: BT26-060, dp: 16000, suspended: false, sources: [BT26-085] }
      p1.security: 5
      p1.trash: [ST1-16]
  - at: 16
    that:
      turn: 5
      p0.field:
        - { card_id: BT26-060, dp: 16000, suspended: true, sources: [BT26-085] }
      p1.security: 3
      p1.trash: [BT1-009, ST1-02, ST1-16]
