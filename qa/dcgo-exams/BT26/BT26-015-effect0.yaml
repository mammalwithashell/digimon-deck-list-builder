# Exam scenario: Butenmon (BT26-015), clause BT26-015#effect#0 -- Special
# Digivolution Condition "[Digivolve] Lv.4 w/[TS] trait: Cost 3".
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json + the group-B variant
# `cm-chronomon-offcolor` (bt26-chronomon with 1x BT26-090 -> BT24-059 and
# 1x BT25-100 -> BT26-021) vs `tm-quiet-red`. Merge the variant from
# variants-B.json into the book before running (it is not in the committed pool).
#
# THE LINE:
#   T1 (P0, 0): no hatch; hard-play Gekomon BT26-021 (Blue/Purple Lv.4 [TS],
#      cost 4: 0 -> -4). Its [On Play] "1 of your [TS] Digimon's attack target
#      can't change" picks Gekomon itself (mandatory, sole candidate).
#   T2 (P1, 4): pass -> P0 3.
#   T3 (P0, 3): draw BT26-060; THE CLAUSE: digivolve Butenmon onto Gekomon.
#      Butenmon's printed circles are Red Lv.4 / Yellow Lv.4 (cost 4) -- a
#      Blue/Purple base satisfies neither, so the ONLY legal path is the
#      [TS]-trait condition, and it costs exactly 3 (3 -> 0). One path, so no
#      cost-choice prompt opens. Digivolve bonus draw BT26-085. Butenmon's own
#      [When Digivolving] is silent: P1 has no Digimon and P0's trash is empty.
#
# WITNESS: at 6 memory 3 with Gekomon on field; at 7 memory 0 (cost 3, not 4)
# and Butenmon on top of [BT26-021].
#
# PROMPT SHAPE: step 2 = Gekomon's own [On Play] own-Digimon pick (ours
# OwnField -> DCGO SelectPermanentEffect). If DCGO auto-picks the sole
# candidate without a row, mark that row dcgo-absent in the oracle pass.
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
card: BT26-015
clause: BT26-015#effect#0
seed: 424242
decks:
  p0:
    stack: [BT26-021, BT26-015, BT26-092, BT26-092, BT26-087,
            BT26-009, BT26-009, BT25-008, BT25-008, BT26-011,
            BT26-060, BT26-085]
    rest: cm-chronomon-offcolor
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT26-021, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT26-015 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 6
    that:
      turn: 3
      p0.memory: 3
      p0.field:
        - { card_id: BT26-021, dp: 4000, suspended: false, sources: [] }
  - at: 7
    that:
      turn: 3
      p0.memory: 0
      p0.hand: [BT26-060, BT26-085, BT26-087, BT26-092, BT26-092]
      p0.field:
        - { card_id: BT26-015, dp: 7000, suspended: false, sources: [BT26-021] }
