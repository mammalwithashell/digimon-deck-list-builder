# Exam scenario: Gekomon (BT26-021), clause BT26-021#inherited#0 --
# "[All Turns] [Once Per Turn] When a Digimon attacks, by trashing 1 card in
#  your hand, trash the bottom 2 digivolution cards of 1 of your opponent's
#  Digimon."
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json (`bt26-chronomon-b` vs
# `tm-quiet-red`). PROVISIONAL: assert block is our engine's result, not
# backfilled from DCGO -- unconfirmed until the oracle pass.
#
# THE LINE:
#   T1 (P0, 0): play Gekomon (4) -> -4; its [On Play] lock picks itself.
#   T2 (P1, 4): play Monodramon BT1-009 (2) -> 2; digivolve Kokatorimon
#      BT1-014 (2) -> 0; digivolve Vermilimon BT4-014 (3) -> -3. Vermilimon
#      carries EXACTLY 2 sources [BT1-009, BT1-014].
#   T3 (P0, 3): draw; digivolve Gekomon -> Butenmon BT26-015 via its
#      Lv.4 w/[TS] route (3; Gekomon is blue/purple, Butenmon's circles are
#      red/yellow) -> 0. Butenmon [When Digivolving]: Vermilimon -4000.
#      Butenmon (the stack has been in play since T1) attacks security. THE
#      CLAUSE (Gekomon is now a digivolution card): trash Coronamon from hand,
#      pick Vermilimon -> both its sources are trashed. Security ST1-02 (3000)
#      loses to 7000.
#
# WITNESS: at 10 (before the attack) Vermilimon sources [BT1-009, BT1-014],
# Coronamon in hand; at 14 Vermilimon sources [], p1.trash holds BT1-009 +
# BT1-014 (+ the checked ST1-02), Coronamon in p0.trash.
#
# PARTIAL: only the "your own Digimon attacks" branch (the carrier itself) is
# exercised; an opponent's attack / another own Digimon's attack (the other
# two timings authored under the same [Once Per Turn]) is not. [Once Per
# Turn] is not asserted.
#
# PROMPT SHAPE (BT26-021.yaml DCGO notes): DCGO OnAllyAttack, skippable but
# NOT optional at activation -> no OptionalSkill; ours an outer Replacement
# gate -> `yes:` sim_only (zero wire rows). Then DCGO SelectHandEffect
# (canNoSelect: true) -> ours Hand pick (1:1); then DCGO mandatory
# SelectPermanentEffect -> ours OppField (1:1). If DCGO turns out to gate it
# with an OptionalSkill, re-author the sim_only row as a shared
# `expect: OptionalSkill` row.
card: BT26-021
clause: BT26-021#inherited#0
seed: 424242
decks:
  p0:
    stack: [BT26-021, BT26-015, BT26-092, BT26-087, BT25-008,
            P-198, BT26-073, BT26-073, BT26-016, BT26-016,
            BT26-088, BT24-058, P-198, BT26-092]
    rest: bt26-chronomon-b
  p1:
    stack: [BT1-009, BT1-014, BT4-014, ST1-03, ST1-04,
            BT1-014, BT4-010, BT3-007, BT1-009, ST1-02,
            ST1-04, ST1-03, BT3-007, ST1-05]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT26-021, from: hand } }
    expect: { prompt: main_phase }
  # Gekomon's [On Play] (effect#1): mandatory lock pick -- itself.
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  # T2 (P1, 4): build a 2-source Digimon: Monodramon -> Kokatorimon -> Vermilimon.
  - actor: 1
    do: { play: { card: BT1-009, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { digivolve: { from: field.0, using: BT1-014 } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { digivolve: { from: field.0, using: BT4-014 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  # T3 (P0, 3): Gekomon -> Butenmon through Butenmon's Lv.4 w/[TS] route (3).
  - actor: 0
    do: { digivolve: { from: field.0, using: BT26-015 } }
    expect: { prompt: main_phase }
  # Butenmon [When Digivolving]: mandatory -4000 pick (Vermilimon). Its
  # trash-return half is silent (P0's trash is empty).
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # Butenmon attacks: THE CLAUSE (inherited from Gekomon) triggers.
  - actor: 0
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  # SIM-ONLY: our outer accept gate (DCGO: not optional at activation, the
  # "by trashing" cost rides the hand pick's canNoSelect).
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  # The cost: trash Coronamon from hand.
  - actor: 0
    do: { select: { cards: [BT25-008] } }
    expect: { prompt: SelectHandEffect }
  # The opponent Digimon: Vermilimon -> its bottom 2 sources are trashed.
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 10
    that:
      turn: 3
      p0.memory: 0
      p1.security: 5
      p0.trash: []
      p0.hand: [BT24-058, BT25-008, BT26-087, BT26-088, BT26-092]
      p0.field:
        - { card_id: BT26-015, dp: 7000, suspended: false, sources: [BT26-021] }
      p1.field:
        - { card_id: BT4-014, dp: 4000, suspended: false, sources: [BT1-009, BT1-014] }
  - at: 14
    that:
      turn: 3
      p0.memory: 0
      p1.security: 4
      p0.trash: [BT25-008]
      p0.hand: [BT24-058, BT26-087, BT26-088, BT26-092]
      p1.trash: [BT1-009, BT1-014, ST1-02]
      p0.field:
        - { card_id: BT26-015, dp: 7000, suspended: true, sources: [BT26-021] }
      p1.field:
        - { card_id: BT4-014, dp: 4000, suspended: false, sources: [] }
