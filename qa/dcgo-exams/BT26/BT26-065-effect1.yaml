# Exam scenario: Falcomon (BT26-065), clause BT26-065#effect#1 --
# "[On Play] Reveal the top 3 cards of your deck. Add 1 [Keenan Crier] or card
#  with the [DATA SQUAD] trait and 1 purple card with [Ravemon] in its name or
#  [Avian] or [Bird] in any of its traits among them to the hand. Return the
#  rest to the bottom of the deck."
#
# DECK NOTE. `bt26-dats` is a real 1st-place BT26 Data Squad list (DCG Nexus,
# Eagle's Nest S10W6.5 BT26 webcam locals, 2026-09-13,
# https://dcg-nexus.com/decklist/ae29fdb6-8896-485d-adf8-6e2c65d7a697).
# `tm-quiet-red` is the shared quiet ST1 shell; P1 only holds security here.
#
# THE LINE is one action: P0 hard-plays Falcomon on T1 (memory 0 -> -3; the
# effect resolves before the turn hands over). The first player takes no T1
# draw, so the revealed three are stack[10..12]:
#   [10] ST24-04  -- yellow/red [DATA SQUAD] Agumon -> bucket 1 only
#   [11] BT26-082 -- purple [DATA SQUAD] Ravemon    -> either bucket
#   [12] BT26-091 -- green [DATA SQUAD] Yoshino     -> bucket 1 only
# Bucket 1 takes ST24-04, bucket 2 must then take BT26-082 (the only purple
# Ravemon/Avian/Bird card left); BT26-091 goes to the deck bottom.
#
# PROMPT SHAPE (BT26_065.cs -> SimplifiedRevealDeckTopCardsAndSelect, two
# conditions, canNoSelect false): one SelectCardEffect per condition, in order.
# Ours: select_reveal_buckets, two min:1/max:1 buckets -> one RevealBucket park
# per pick. DCGO auto-places a lone remainder; our engine parks a one-item
# permutation, answered `sim_only`.
card: BT26-065
clause: BT26-065#effect#1
seed: 424242
decks:
  p0:
    stack: [BT26-065, ST24-12, BT26-072, BT26-076, ST24-15,
            ST24-05, ST24-10, BT26-049, BT26-050, ST24-14,
            ST24-04, BT26-082, BT26-091, ST24-05, BT26-094]
    rest: bt26-dats
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08, BT4-014]
    rest: tm-quiet-red
steps:
  # T1 (P0, memory 0): decline breeding; hard-play Falcomon (3 -> -3).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT26-065, from: hand } }
    expect: { prompt: main_phase }
  # THE CLAUSE, pick 1: [Keenan Crier]/[DATA SQUAD] bucket -> ST24-04.
  - actor: 0
    do: { select: { cards: [ST24-04] } }
    expect: { prompt: SelectCardEffect }
  # THE CLAUSE, pick 2: purple Ravemon/Avian/Bird bucket -> BT26-082.
  - actor: 0
    do: { select: { cards: [BT26-082] } }
    expect: { prompt: SelectCardEffect }
  # SIM-ONLY: the single leftover (BT26-091) to the deck bottom.
  - actor: 0
    do: { select: { cards: [BT26-091], sim_only: true } }
  # Memory -3 ended P0's turn after resolution: P1's breeding decision.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 5
    that:
      turn: 2
      p0.hand: [ST24-12, BT26-072, BT26-076, ST24-15, ST24-04, BT26-082]
      p0.field:
        - card_id: BT26-065
          dp: 1000
          suspended: false
          sources: []
      p0.trash: []
