# Exam scenario: Buraimon (BT26-011), clause BT26-011#effect#1 -- its own
# <Raid> ("When this Digimon attacks, you may change the attack target to 1 of
# your opponent's unsuspended Digimon with the highest DP").
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json (`bt26-chronomon` vs
# `tm-quiet-red`).
#
# THE LINE:
#   T1 (P0, 0): pass breeding; hard-play Buraimon (0 -> -5). Its [On Play] is
#      STARVED (no [Chronomon]-text / [Shaman] card in the stacked hand), so
#      nothing is asked. Buraimon has NO digivolution cards: the <Raid> under
#      test can only be its own.
#   T2 (P1, 5): play Biyomon ST1-02 (3000; 5 -> 3) and Agumon ST1-03 (2000;
#      3 -> 0); pass -> P0 3.
#   T3 (P0, 3): draw stack[10]; pass breeding; Buraimon attacks P1's
#      SECURITY. THE CLAUSE: <Raid> switches the target to Biyomon -- the
#      highest-DP unsuspended Digimon (Agumon 2000 is not a legal candidate).
#      5000 vs 3000: Biyomon is deleted; no security check happens.
#
# WITNESS (at 9 vs at 7): P1 security stays 5 (the security attack was
# re-targeted); Biyomon ST1-02 in P1's trash; Agumon untouched; Buraimon
# suspended.
#
# PROMPT SHAPE -- the documented <Raid> FOLD (docs/DCGO_EXAM.md
# "OptionalSkill+pick fold"; BT20-020-effect1.yaml, NOTES-BT16-077.md): DCGO
# RaidSelfEffect asks OptionalSkill, then SelectPermanentEffect
# (canNoSelect:true) over the highest-DP unsuspended Digimon; ours surfaces
# ONE declinable OppField pick. `expect: OptionalSkill` over the live pick is
# the fold marker.
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
card: BT26-011
clause: BT26-011#effect#1
seed: 424242
decks:
  p0:
    stack: [BT26-011, BT26-092, BT26-087, BT8-097, BT25-100,
            BT26-092, BT26-092, BT26-087, BT26-078, BT26-073,
            BT26-090]
    rest: bt26-chronomon
  p1:
    stack: [ST1-02, ST1-03, BT1-009, BT3-007, ST1-08,
            BT1-014, BT4-010, BT3-007, BT1-009, ST1-04,
            ST1-04, ST1-03, BT1-014]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT26-011, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { play: { card: ST1-03, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: OptionalSkill }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 7
    that:
      turn: 3
      p0.memory: 3
      p1.security: 5
      p1.field:
        - { card_id: ST1-02, dp: 3000, suspended: false, sources: [] }
        - { card_id: ST1-03, dp: 2000, suspended: false, sources: [] }
  - at: 9
    that:
      turn: 3
      p0.memory: 3
      p1.security: 5
      p1.trash: [ST1-02]
      p1.field:
        - { card_id: ST1-03, dp: 2000, suspended: false, sources: [] }
      p0.field:
        - { card_id: BT26-011, dp: 5000, suspended: true, sources: [] }
