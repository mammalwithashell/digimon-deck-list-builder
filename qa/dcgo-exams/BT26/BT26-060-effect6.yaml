    expect: { prompt: OptionalSkill }
  - actor: 0
    do: { select: { targets: [opp.field.1] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 13
    that:
      turn: 5
      p1.field:
        - { card_id: BT1-009, dp: 3000, suspended: false, sources: [] }
        - { card_id: ST1-10, dp: 12000, suspended: false, sources: [] }
      p1.trash: []
  - at: 14
    that:
      turn: 5
      p1.field:
        - { card_id: BT1-009, dp: 3000, suspended: false, sources: [] }
        - { card_id: ST1-10, dp: 12000, suspended: false, sources: [] }
      p1.trash: []
  - at: 15
    that:
      turn: 6
      p0.field:
        - { card_id: BT26-060, dp: 16000, suspended: false, sources: [BT26-085] }
      p1.field:
        - { card_id: BT1-009, dp: 3000, suspended: false, sources: [] }
      p1.trash: [ST1-10]
