# Exam scenario: Keenan Crier (BT26-094), clause BT26-094#effect#0 --
# "[Start of Your Main Phase] By placing 1 [DATA SQUAD] trait card from your
#  hand face down under this Tamer, <Draw 1> and gain 1 memory."
#
# THE LINE:
#   T1 (P0): play Keenan (0 -> -3).          -> P1's turn
#   T2 (P1): pass.                           -> P0 at 3
#   T3 (P0): draw; [Start of Your Main Phase] THE CLAUSE -- place ST24-12 face
#            down under Keenan, draw 1, +1 memory (3 -> 4); then pass.
# PROMPT SHAPE (BT26_094.cs): SelectHandEffect, canNoSelect:true, Mode.Custom.
# The SOMP trigger is not DCGO-optional (no leading yes/no); ours: optional
# select_hand.
card: BT26-094
clause: BT26-094#effect#0
seed: 424242
decks:
  p0:
    stack: [BT26-094, ST24-12, BT26-076, ST24-15, BT26-082,
            ST24-05, ST24-10, BT26-049, BT26-050, ST24-14,
            ST24-04, BT26-091, ST24-05, BT26-065, ST24-04]
    rest: bt26-dats
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08, BT4-014]
    rest: tm-quiet-red
steps:
  # T1 (P0, memory 0): Keenan (cost 3 -> -3; the turn ends).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT26-094, from: hand } }
    expect: { prompt: main_phase }
  # T2 (P1, memory 3)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, memory 3): draws ST24-04 (stack[10]).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  # THE CLAUSE: place ST24-12 face down under Keenan.
  - actor: 0
    do: { select: { cards: [ST24-12] } }
    expect: { prompt: SelectHandEffect }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 6
    that:
      turn: 3
      p0.memory: 4
      p0.hand: [BT26-076, ST24-15, BT26-082, ST24-04, BT26-091]
