# Exam scenario: ScourgeChiropmon (BT26-075), clause BT26-075#effect#6 --
# DUAL Rule "<Arts Digivolve> (Instead of trashing after use, your cards may
# digivolve into this card without paying the cost.)"
#
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO. It stays unconfirmed until the oracle pass.
#
# THE LINE (memory ledger in brackets):
#   T1 P0 hatches Kekkomon, digivolves it in breeding into Liollmon
#      [0 -> 0] (draw stack[10] BT26-089). Pass.
#   T2 p1 passes (p0 gets 3).
#   T3 P0 draws stack[11] ST23-06, moves Liollmon (silent: no Tamer),
#      digivolves it into Armalizamon (BT25-049, [Glowing Dawn] route 2)
#      [3 -> 1] (draw stack[12] BT25-046; its "may suspend" has no target).
#      P0 USES ScourgeChiropmon's Option face [1 -> -3] (Use Req satisfied by
#      the [Glowing Dawn] Armalizamon). [Main]: p1 has no Digimon -> no-op.
#      <Arts Digivolve>: Armalizamon (Lv.4, [Glowing Dawn] -- a legal
#      digivolution base for Scourge) digivolves into it at no cost; the
#      digivolve draw takes stack[13] BT25-057. The overspend ends the turn.
#   UPDATED 2026-10-04 (post-#708): at the end of T3 ScourgeChiropmon's
#      <Execute> window now opens (G-ENGINE-DUAL-END-OF-TURN-WINDOW, RESOLVED
#      2026-10-04: end-of-turn attack keywords no longer skip a DUAL top
#      card). DCGO asks it too (BT26_075.cs ExecuteSelfEffect, OnEndTurn,
#      optional), so the line declines it with one shared row; before #708
#      the turn rotated straight to p1 and the next row (p1's pass) is what
#      the harness's actor check refused. The assert moved from `at: 10`
#      to 11.
# WITNESS: memory -3 (= the use cost only), BT26-075 on top of Armalizamon,
# P0's trash empty.
#
# PROMPT SHAPE (BT26-075.yaml: Use Req + <Arts Digivolve>, BT26-050 idiom;
# ArtsDigivolve.cs is an OptionResolutionClass asking SelectPermanentEffect
# "Select 1 Digimon to Arts Digivolve." canNoSelect:true -- see
# BT25-085-effect6.yaml) <-> our OwnField pick, 1:1.
card: BT26-075
clause: BT26-075#effect#6
seed: 424242
decks:
  p0:
    stack: [BT26-025, BT25-049, BT26-075, ST23-12, ST23-15,
            ST23-15, BT25-090, BT26-089, ST23-06, ST23-09,
            BT26-089, ST23-06, BT25-046, BT25-057, ST23-12]
    rest: gd-bt26-4th
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: breeding, using: BT26-025 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT25-049 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { play: { card: BT26-075, from: hand } }
    expect: { prompt: main_phase }
  # ENGINE FINDING: Armalizamon's "[Your Turn][OPT] When you would use a
  # [Glowing Dawn] Option card, by trashing the bottom face-down card under
  # any of your Tamers, reduce the cost by 3" is OFFERED with no Tamer in
  # play (its cost is unpayable). DCGO gates the ActivateClass on a Tamer
  # carrying a face-down source (BT25-049.yaml crosscheck), so it asks
  # nothing -> sim_only decline.
  - actor: 0
    do: { select: { decline: true, sim_only: true } }
  # [Main]: no opponent Digimon -> nothing to delete, no prompt.
  # THE CLAUSE: instead of being trashed, the Option digivolves Armalizamon
  # into ScourgeChiropmon for free.
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # The overspend ends T3, and the freshly digivolved DUAL ScourgeChiropmon
  # opens its <Execute> end-of-turn window (see header): decline it (our
  # EndOfTurnAction PASS; DCGO OptionalSkill "no" on the wire -- the
  # BT8-097-effect0.yaml convention).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: OptionalSkill }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 11
    that:
      turn: 4
      # 1 - 4 for the USE and nothing else: the digivolution was free.
      p0.memory: -3
      # THE WITNESS: the used Option is NOT in the trash -- it is the Digimon.
      p0.trash: []
      p0.hand: [BT25-046, BT25-057, BT26-089, ST23-06, ST23-12, ST23-15]
      p0.field:
        - card_id: BT26-075
          dp: 8000
          suspended: false
          sources: [BT25-049, BT26-025, ST23-01]
