# Exam scenario: Jupitermon: Wrath Mode (BT26-103), clause BT26-103#effect#0 --
# Special Digivolution Condition "[Digivolve] Lv.6 w/[Olympos XII] trait:
#  Cost 5".
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`).
#
# THE LINE (base is Minervamon BT24-041 -- a Lv.6 [Olympos XII] that is NOT
# named [Jupitermon], so <Succession> copies nothing and the WD stack stays
# a single trigger; it is also Yellow/Black, so the printed cost-6 circle is
# ALSO legal and the route choice is real):
#   T1 (P0, 0): pass -> P1 3.
#   T2 (P1, 3): hard-play Phoenixmon ST1-10 (vanilla, 10): 3 -> -7 -> P0 7.
#   T3 (P0, 7): hard-play Minervamon (12; no [Iliad] on board -> no
#            reduction): 7 -> -5. Its [On Play]: the "may play a cost<=5
#            [Iliad] card" pick has NO candidate (P0's hand is all Lv.6/7 /
#            cost-8 / Option), then <De-Digivolve 1> on Phoenixmon (no
#            sources -> no-op) -> P1 5.
#   T4 (P1, 5): pass -> P0 3.
#   T5 (P0, 3): THE CLAUSE -- digivolve Minervamon -> Wrath Mode choosing the
#            cost-5 trait route: 3 -> -2. (The cost-6 circle would read -3.)
#            Wrath Mode's [When Digivolving] then trashes the top security and
#            Recovers +2 (effect#5), and that removal fires effect#6
#            (-15000 on Phoenixmon -> deleted). The turn ends.
#
# WITNESS: p0.memory 3 before the digivolve, -2 after; Wrath Mode stands on
# exactly [BT24-041].
#
# PROMPT SHAPE:
#   * T3 De-Digivolve target: SelectPermanentEffect over Phoenixmon (sole
#     candidate). Minervamon's optional hand pick has no candidate -> ours
#     asks nothing; if DCGO still shows an OptionalSkill / empty
#     SelectHandEffect there, that is a gate-shape row, not a rules finding.
#   * T5 cost route: answered by VALUE 5 (`SelectCountEffect`, same idiom as
#     EX12-076-effect5.yaml); ours is an EffectChoice.
#   * T5 effect#6 target: SelectPermanentEffect over Phoenixmon (sole
#     candidate; DCGO's script is a mandatory pick).
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO --
# unconfirmed until the oracle pass.
