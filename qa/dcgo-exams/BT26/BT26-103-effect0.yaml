# Exam scenario: Jupitermon: Wrath Mode (BT26-103), clause BT26-103#effect#0 --
# Special Digivolution Condition "[Digivolve] Lv.6 w/[Olympos XII] trait:
#  Cost 5".
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`).
#
# THE LINE (base is Minervamon BT24-041 -- a Lv.6 [Olympos XII] that is NOT
# named [Jupitermon], so <Succession> copies nothing and the WD stack stays
# a single trigger; it is also Yellow/Black, so the printed cost-6 circle is
# ALSO legal and the route choice is real):
#   T1 (P0, 0): pass -> P1 3.
#   T2 (P1, 3): hard-play Phoenixmon ST1-10 (vanilla, 10): 3 -> -7 -> P0 7.
#   T3 (P0, 7): hard-play Minervamon (12; no [Iliad] on board -> no
#            reduction): 7 -> -5. Its [On Play]: the "may play a cost<=5
#            [Iliad] card" pick has NO candidate (P0's hand is all Lv.6/7 /
#            cost-8 / Option), then <De-Digivolve 1> on Phoenixmon (no
#            sources -> no-op) -> P1 5.
#   T4 (P1, 5): pass -> P0 3.
#   T5 (P0, 3): THE CLAUSE -- digivolve Minervamon -> Wrath Mode choosing the
#            cost-5 trait route: 3 -> -2. (The cost-6 circle would read -3.)
#            Wrath Mode's [When Digivolving] then trashes the top security and
#            Recovers +2 (effect#5), and that removal fires effect#6
#            (-15000 on Phoenixmon -> deleted). The turn ends.
#
# WITNESS: p0.memory 3 before the digivolve, -2 after; Wrath Mode stands on
# exactly [BT24-041].
#
# PROMPT SHAPE (VERIFIED against DCGO C# 2026-10-04):
#   * T3 Minervamon [On Play] (BT24/Yellow/BT24_041.cs shared OP/WD/OD,
#     optional false): its "may play" SelectHandEffect has maxCount 0 (no
#     cost<=5 [Iliad] card in hand) -> SelectHandEffect.active() returns false
#     (`_maxCount <= 0`), NO prompt and no OptionalSkill; then the mandatory
#     De-Digivolve SelectPermanentEffect (HasMatchConditionPermanent true) ->
#     1:1 with our pick.
#   * T5 cost route: CardController.cs SelectCost asks SelectCountEffect
#     over the DISTINCT cost list [6 (Yellow Lv.6 circle), 5 (Olympos XII
#     route)] (~720) -> answered by VALUE 5; ours is an EffectChoice.
#   * Wrath Mode's WD (BT26_103.cs ActivateClassesForSharedEffects, optional:
#     false, OPT hash "BT26_103_WD_Counter") is the lone WD trigger
#     (<Succession> copies nothing off a non-[Jupitermon] source) -> no
#     MultipleSkills, no OptionalSkill. Its IDestroySecurity queues effect#6
#     ([All Turns][OPT], fires on EITHER player's removal), which resolves
#     after the WD: mandatory SelectPermanentEffect (maxCount 1, canNoSelect
#     false; a sole candidate is still asked).
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO --
# unconfirmed until the oracle pass.
card: BT26-103
clause: BT26-103#effect#0
seed: 424242
decks:
  p0:
    stack: [BT24-041, BT26-103, BT24-101, BT25-044, BT25-025,
            BT25-022, BT24-083, BT26-029, BT25-033, BT24-031,
            BT26-029, BT26-081, BT4-104, BT25-030, BT24-034]
    rest: ts-jupitermon
  p1:
    stack: [ST1-10, ST1-04, BT1-009, BT3-007, ST1-08,
            BT1-014, BT4-010, BT3-007, BT1-009, ST1-02,
            ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08, BT4-014]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-10, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT24-041, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT26-103 } }
    expect: { prompt: main_phase }
  # THE CLAUSE: the cost route -- the trait route (5), not the circle (6).
  - actor: 0
    do: { select: { value: 5 } }
    expect: { prompt: SelectCountEffect }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  # T5, before the digivolve: 3 memory, Minervamon alone.
  - at: 10
    that:
      turn: 5
      p0.memory: 3
      p0.field:
        - { card_id: BT24-041, dp: 12000, suspended: false, sources: [] }
  # P1's T6 breeding decision: the cost-5 route resolved (3 -> -2).
  - at: 13
    that:
      turn: 6
      p0.memory: -2
      p0.field:
        - { card_id: BT26-103, dp: 16000, suspended: false, sources: [BT24-041] }
