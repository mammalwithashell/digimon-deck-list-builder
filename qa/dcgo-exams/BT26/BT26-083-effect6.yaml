# "[On Deletion] Give all of your opponent's Digimon <Security A. -1> until
#  their turn ends."
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). PROVISIONAL: assert block is our engine's result, not
# backfilled from DCGO -- unconfirmed until the oracle pass.
#
# THE LINE. Steps 0..23 are BT26-083-effect3.yaml verbatim: BT26-083 is
# Assembly-played on T5, P1 plays BT4-014 on T6, and at the end of T7
# BT26-083 spends its <Execute> window on P1's security and is deleted by
