#   T8 (P1, 3): BT4-014 attacks P0's security. Under <Security A. -1> it
#            checks 1 - 1 = 0 cards: P0 security stays at 3.
#
# WITNESS: p0.security is 3 at 25 (before the attack) AND at 26 (after it --
# BT4-014 is suspended, so the attack did happen). NATURAL CONTROL: in
# BT26-083-effect2.yaml the SAME BT4-014 attacks P0's security on T8 with no
# [On Deletion] in play and takes P0 from 3 to 2 (its at 21 -> at 24).
#
# PROMPT SHAPE. [On Deletion] is mandatory and targetless on both sides (DCGO
# ChangeDigimonSAttackPlayerEffect(-1) over the opponent's battle area, per
# our YAML crosscheck). A 0-check attack: DCGO should simply skip the check --
# watch for a divergence in how a <Security A.> total of 0 is handled.
