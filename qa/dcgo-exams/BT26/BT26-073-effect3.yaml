# Exam scenario: Aegiochusmon: Dark (BT26-073), clause BT26-073#effect#3 --
# Special Play Condition "Assembly -2: Lv.4 or lower Digimon card w/[Chronomon]
# in text or w/[TS] trait".
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). PROVISIONAL: assert block is our engine's result, not
# backfilled from DCGO -- unconfirmed until the oracle pass.
#
# THE LINE:
#   T1 (P0, 0): hard-play Asuna Shiroki BT24-088 (3: 0 -> -3). Her optional
#       [On Play] trashes Elecmon BT24-031 (Lv.3 [TS] -- the Assembly
#       material) from the hand and draws 2 (stack[10..11]).
#   T2 (P1, 3): hard-play Phoenixmon ST1-10 (10: 3 -> -7) -> P0 at 7. This
#       overspend keeps P0 above 4 memory on T3 so Asuna's [Start of Your
#       Turn] (memory <= 4 gate) does NOT trigger -- one fewer prompt.
#   T3 (P0, 7): THE CLAUSE -- play Dark from hand via Assembly: material pick
#       = Elecmon from the trash; cost 8 - 2 = 6 (7 -> 1). Dark's [On Play]
#       (effect#1) then asks its cost menu (trash now empty -> two-branch
#       EffectChoice); declined ("Don't pay") -- Phoenixmon is Lv.6, no legal
#       victim anyway. Pass at 1 -> P1 3.
#
# WITNESS: memory 7 -> 1 (6 = 8 - 2 paid, not the printed 8); Elecmon moved
# from P0's trash to Dark's sources.
#
# PROMPT SHAPE (VERIFIED against DCGO C# 2026-10-04 (b9a0638cd)):
#   - Asuna [On Play] is optional (BT24_088.cs:112) -> OptionalSkill, then
#     SelectHandEffect canNoSelect (BT24_088.cs:143): authored as the
#     optional_gate_fold (`expect: OptionalSkill` over our Hand pick).
#   - Asuna [Start of Your Turn] on T3: CanActivate is `memory <= 4`
#     (BT24_088.cs:31-35); MultipleSkills drops non-activatable triggers
#     before prompting (MultipleSkills.cs ~218), so no OptionalSkill at 7.
#   - Assembly is ONE SelectCardEffect over the trash (root Trash,
#     canNoSelect true, maxCount = elementCount 1) from
#     SelectAssemblyClass.SelectTrashCard, called from the play flow
#     (CardController.cs:928-932). There is NO separate "use Assembly?"
#     gate: if the trash can fulfil the element the pick just opens.
#   - Dark's cost menu is UserSelectionManager.SetIntSelection (BT26_073.cs:116-118)
#     -> one generic_int row whose wire value is the element's VALUE, not its
#     index: Delete=1 / Return=2 / Don't use=3 (values are fixed even when
#     the Return element is omitted for an empty trash). The menu is gated
#     only on `!CanDeleteSelf() && !CanReturnFromTrash()` (BT26_073.cs:109):
#     it IS asked even when the opponent has no Lv.<=5 Digimon. The On Play/
#     WD is optional:false (BT26_073.cs:215; isSkippable only affects
#     MultipleSkills), so no OptionalSkill precedes the menu.
#     Elecmon is under Dark by the time the On Play resolves (sources are
#     added during the play, CardController.cs:1869), so the trash is empty
#     -> menu {1,3}; this line answers value 3.
