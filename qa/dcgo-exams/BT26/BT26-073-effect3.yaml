  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT24-088, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { cards: [BT24-031] } }
    expect: { prompt: OptionalSkill }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-10, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT26-073, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { cards: [BT24-031] } }
