  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  # Before the material pick: P0 at 7 (P1 overspent on Phoenixmon).
  - at: 7
    that:
      turn: 3
      p0.memory: 7
      p0.trash: [BT24-031]
  # Before the closing pass: the Assembly play cost 8 - 2 = 6 (7 -> 1), and
  # Elecmon left the trash to sit under Dark as its digivolution source.
  - at: 10
    that:
      turn: 3
      p0.memory: 1
      p0.trash: []
      p0.field:
        - { card_id: BT24-088, dp: -1, suspended: false, sources: [] }
        - { card_id: BT26-073, dp: 8000, suspended: false, sources: [BT24-031] }
      p0.hand: [BT24-034, BT24-034, BT24-101, BT25-030, BT26-090]
      p1.field:
        - { card_id: ST1-10, dp: 12000, suspended: false, sources: [] }
