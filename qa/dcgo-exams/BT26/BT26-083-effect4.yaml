# per docs/DCGO_EXAM.md "Replacement on <Decode>". Junomon [On Play]: ours =
# one declinable AnyField pick; DCGO may ask OptionalSkill first
# (optional_gate_fold candidate) or SelectPermanentEffect canNoSelect.
#
# ENGINE FINDING (see report): our Junomon [On Play] pick is offered WHILE
# BT26-083 is still on the field (at 24 both are on P0's field) and BT26-083
# is a legal "other Digimon" candidate (AnyField ids [100, 115] = own slot 0 +
# opp slot 0). Rules order the triggered [On Play] after the leave completes;
# DCGO should offer only BT4-014. Picking BT26-083 there also makes the
# pending <Execute> deletion land on JUNOMON (measured 2026-10-04 on a scratch
# copy, not committed). This scenario declines, so it does not depend on it.
