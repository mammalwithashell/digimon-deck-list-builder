# Exam scenario: Junomon: Hysteric Mode (BT26-083), clause BT26-083#effect#4 --
# "<Decode ([Junomon]/Lv.5 or lower w/[Iliad] trait)> (When this Digimon would
#  leave the battle area other than in battle, you may play 1 specified
#  Digimon card from its digivolution cards without paying the cost.)"
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). PROVISIONAL: assert block is our engine's result, not
# backfilled from DCGO -- unconfirmed until the oracle pass.
#
# THE LINE. Steps 0..21 are BT26-083-effect3.yaml verbatim: BT26-083 is
# Assembly-played on T5 (so its ONE digivolution card is the [Junomon]
# BT25-044 Assembly material), P1 plays BT4-014 on T6, and at the end of T7
# BT26-083 spends its <Execute> window on P1's security. <Execute>'s
# self-delete at the end of that attack is a non-battle leave, so:
#   THE CLAUSE: the Decode window opens -> YES -> pick BT25-044 from
#   BT26-083's sources -> Junomon BT25-044 is played free; BT26-083 goes to
#   the trash. Its [On Deletion] (effect#6) and Junomon's [On Play] then
#   wait together -> MultipleSkills ordering row (Junomon first).
#   Junomon's own [On Play] ("by placing 1 other Digimon as the top security
#   card, trash both players' top security cards") offers its optional
#   pick -- DECLINED, so the board reads the Decode result alone.
#
# WITNESS: at 22 BT26-083 (sources [BT25-044]) is on the field, P0 memory -3
# (end of T7); at 27 Junomon BT25-044 is on P0's field unsuspended with no
# sources, BT26-083 is in P0's trash WITHOUT BT25-044, and P0 memory is still
# -3 (the play was free).
#
# PROMPT SHAPE. Decode: ours = Replacement gate (OptionalSkill) then a
# Material pick over BT26-083's sources (SelectCardEffect); DCGO = OptionalSkill
# then SelectCardEffect over DigivolutionCards (canNoSelect true) -- 1:1:1:1
# per docs/DCGO_EXAM.md "Replacement on <Decode>". Junomon [On Play]: ours =
# one declinable AnyField pick; DCGO may ask OptionalSkill first
# (optional_gate_fold candidate) or SelectPermanentEffect canNoSelect.
#
# FIXED 2026-10-04 (G-ENGINE-DECODE-ON-PLAY-BEFORE-CARRIER-LEAVES): our
# Junomon [On Play] pick used to open WHILE BT26-083 was still on the field
# and offered it as an "other Digimon" (AnyField [100, 115]); picking it made
# the pending <Execute> deletion land on JUNOMON. A parked replacement's
# commit (the carrier leaving) now completes inside the same processing as
# the Decode play (§16-35 immediate effect), so the triggered [On Play] waits
# until BT26-083 has left and offers only BT4-014. The new MultipleSkills row
# is the turn player ordering the two waiting triggers; if DCGO resolves the
# mandatory [On Deletion] silently first, that row is a prompt-presence
# surface difference to triage.
