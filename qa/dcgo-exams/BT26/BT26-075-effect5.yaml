# Exam scenario: ScourgeChiropmon (BT26-075), clause BT26-075#effect#5 --
# DUAL Option "[Main] Delete 1 of your opponent's Digimon with the lowest
# level."
#
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO. It stays unconfirmed until the oracle pass.
#
# THE LINE (memory ledger in brackets):
#   T1 P0 hard-plays Tomoro & Kyo (ST23-13) [0 -> -4], [On Play] yes.
#   T2 p1 plays BT1-014 (Lv.4, 4000) [4 -> 1] and ST1-02 (Lv.3, 3000)
#      [1 -> -1] -> p0 gets 1.
#   T3 P0: ST23-13's SoMP (yes) places a card and gains 1 (p1 has Digimon)
#      [1 -> 2]; P0 uses ScourgeChiropmon's Option face (Use Req via the
#      [Glowing Dawn] Tamer) [2 -> -2]. The [Main] pick offers ONLY ST1-02
#      (the lowest level, 3) -- `expect: count: 1` with two opponent
#      Digimon on board -- and deletes it. <Arts Digivolve>: no Lv.4 of ours,
#      no prompt; the card is trashed. The overspend ends the turn.
# WITNESS: ST1-02 in p1's trash, BT1-014 (Lv.4) still on p1's field.
#
# PROMPT SHAPE (BT26-075.yaml DCGO crosscheck: mandatory pick of 1 opponent
# Digimon with IsMinLevel -> destroy): SelectPermanentEffect, 1 candidate,
# 1:1 with our OppField pick (level_matches_aggregate lowest_level).
card: BT26-075
clause: BT26-075#effect#5
seed: 424242
decks:
  p0:
    stack: [ST23-13, BT26-075, BT25-046, ST23-12, ST23-15,
            ST23-15, BT25-090, BT26-089, ST23-06, ST23-09,
            ST23-06, BT25-049, BT26-025, BT25-057]
    rest: gd-bt26-4th
  p1:
    stack: [BT1-014, ST1-02, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014, BT4-010]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: ST23-13, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  # DCGO asks this ST23-13 "you may" as SetIntSelection (Yes=1 / No=2) on the
  # generic_int channel, not as an OptionalSkill (ST23_13.cs SharedActivateCoroutine,
  # optional: false), so its answer rides a separate dcgo_only row.
  - actor: 0
    do: { select: { value: 1, dcgo_only: true } }
    expect: { prompt: generic_int }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: BT1-014, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  # DCGO asks this ST23-13 "you may" as SetIntSelection (Yes=1 / No=2) on the
  # generic_int channel, not as an OptionalSkill (ST23_13.cs SharedActivateCoroutine,
  # optional: false), so its answer rides a separate dcgo_only row.
  - actor: 0
    do: { select: { value: 1, dcgo_only: true } }
    expect: { prompt: generic_int }
  - actor: 0
    do: { play: { card: BT26-075, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { targets: [opp.field.1] } }
    expect: { prompt: SelectPermanentEffect, count: 1 }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  # Before the Option: p1 has a Lv.4 (BT1-014) AND a Lv.3 (ST1-02).
  - at: 9
    that:
      turn: 3
      p0.memory: 2
      p1.field:
        - card_id: BT1-014
          dp: 4000
          suspended: false
          sources: []
        - card_id: ST1-02
          dp: 3000
          suspended: false
          sources: []
  # After: only the Lv.3 was offered (count 1) and deleted; the Lv.4 stays.
  - at: 12
    that:
      turn: 4
      p0.memory: -2
      p0.trash: [BT26-075]
      p1.trash: [ST1-02]
      p1.field:
        - card_id: BT1-014
          dp: 4000
          suspended: false
          sources: []
