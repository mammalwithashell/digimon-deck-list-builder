# Exam scenario: ScourgeChiropmon (BT26-075), clause BT26-075#effect#1 --
# "<Execute>" (the extractor emits it with EMPTY text; effect#2 is the
# <Ascension> reminder). Rule 16-37: at the end of your turn this Digimon
# may attack (incl. an opponent's unsuspended Digimon); at the end of that
# attack it is deleted.
#
# ENGINE FINDING -- EXPECTED ORACLE DIVERGENCE. This file does NOT witness
# <Execute> working; it pins our engine's actual behaviour: the end-of-turn
# window never opens for ScourgeChiropmon. Root cause (read, not fixed):
# `Game::has_end_of_turn_keywords` (game_phases.rs) skips every permanent
# whose `perm.top_card().is_digimon(..)` is false, and `CardSource::
# is_digimon` (card_source.rs) is `card_kind == Digimon` -- a DUAL top card
# (CardKind::Dual) fails it. The <Execute> EndOfYourTurn body still grants
# MayAttack/CanAttackUnsuspended, but the phase never parks in
# EndOfTurnAction, so the granted attack is unreachable. Same skip applies
# to Vortex / Overclock / Engage on any DUAL Digimon. (`Permanent::
# is_digimon` -- the permanent-level helper -- does include Dual.)
# Probed three ways: memory -2 overspend end of T3 (field, after Kyo SoMP),
# explicit pass at memory 4 end of T5 after a move, and this line.
#
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO.
#
# THE LINE: BT26-075-effect0.yaml (Scourge built in breeding via the
# [Glowing Dawn] routes [3 -> 1 -> -2], moved on T5 [memory 3]); then P0
# passes T5's main phase with Scourge unsuspended in the battle area and p1
# holding 5 security and no Digimon.
# WHAT THE PRINTED TEXT SAYS SHOULD HAPPEN: an optional <Execute> attack
# (DCGO: OptionalSkill, then SelectAttackEffect -- BT24-081-effect2.yaml's
# fold: one `attack:` row with `expect: OptionalSkill`); after the attack
# Scourge is deleted, firing <Ascension> + [On Deletion].
# ONCE FIXED: replace the final two rows with
#   - { actor: 0, do: { attack: { attacker: field.0, target: security } },
#       expect: { prompt: OptionalSkill } }
# plus the post-attack Ascension/On Deletion rows and a sim-only EOT pass.
