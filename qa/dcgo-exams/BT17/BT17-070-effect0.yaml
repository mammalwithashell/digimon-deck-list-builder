# Exam scenario: Gulfmon (BT17-070), clause BT17-070#effect#0 --
# "[Digivolve] Lv.5 w/[Dark Masters] in text: Cost 3"
#
# The printed purple circle is ALSO "Lv.5 / cost 3", so a purple base cannot
# tell the two apart. The base must be a NON-purple Lv.5 that prints "[Dark
# Masters]" somewhere in its text: WaruMonzaemon P-216 (BLACK Lv.5, cost 6;
# both its [On Play] and its [On Deletion] name the [Dark Masters] trait).
# Only the clause under exam makes Gulfmon's digivolution onto it legal.
#
# WHY WARUMONZAEMON. Every Lv.5 card that prints "[Dark Masters]"
# (BT15-027, BT15-050, BT15-062, BT15-077, BT17-068, P-216) is outside the
# engine's authored pool -- none has a YAML spec -- so our engine plays
# P-216 as a body with no scripted effect. That is safe HERE because the
# line never lets its effects matter on the oracle side either: P_216.cs
# gates the [On Play] on a [Dark Masters]-trait Digimon card in hand
# (HasMatchConditionOwnersHand), and P0's hand holds none, so DCGO asks
# nothing; the inherited <Blocker> is static; the [On Deletion] never
# fires. Gulfmon's own [When Digivolving] needs a Lv.5 [Dark Masters] card
# in hand or trash (BT17_070.cs CanActivateCondition; our clause condition
# is the same gate) -- WaruMonzaemon is now a digivolution card, so it is
# not offered by either engine.
#
#   T1 (P0): pass everything.   T2 (P1): pass everything.
#   T3 (P0, 3): play WaruMonzaemon (cost 6: 3 -> -3, turn over).
#   T4 (P1, 3): pass everything.
#   T5 (P0, 3): draw Gulfmon (stack[11]); THE CLAUSE -- digivolve it onto
#            WaruMonzaemon for 3 (3 -> 0, draw 1). Pass.
#   T6 (P1): the trailing step.
card: BT17-070
clause: BT17-070#effect#0
seed: 424242
decks:
  p0:
    stack: [P-216, BT24-088, BT24-088, BT24-088, BT25-092,
            BT25-082, BT25-082, BT25-082, BT25-082, BT25-058,
            BT25-092, BT17-070, BT25-092]
    rest: tm-gulfmon
  p1:
    stack: [ST1-03, ST1-03, ST1-03, ST1-04, ST1-04,
            BT1-009, BT1-009, ST1-02, ST1-02, ST1-02,
            ST1-04, ST1-04]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, memory 3)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, memory 3): WaruMonzaemon -- the black Lv.5 with [Dark Masters]
  # in its text. Its [On Play] has no candidate, so nothing is asked.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: P-216, from: hand } }
    expect: { prompt: main_phase }
  # T4 (P1, memory 3)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, memory 3): THE CLAUSE.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT17-070 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T6 (P1): the trailing step.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 11
    that:
      turn: 6
      p0.memory: -3
      p0.trash: []
      p0.hand: [BT24-088, BT24-088, BT24-088, BT25-092, BT25-092, BT25-092]
      p0.field:
        - { card_id: BT17-070, dp: 11000, suspended: false, sources: [P-216] }
      p1.field: []
