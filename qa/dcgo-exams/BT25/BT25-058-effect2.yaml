# Exam scenario: Callismon (BT25-058), clause BT25-058#effect#2 -- <Blocker>.
#
# "This Digimon can block in the blocker timing" (16-4, Persistent). Measured
# by blocking: p1's Biyomon (ST1-02, 3000 DP) attacks p0's security on T8, the
# blocker window opens for p0, Callismon takes it, and the battle (13000 vs
# 3000) deletes Biyomon while p0's security stays at 5.
#
# PROMPT SHAPE. Both engines ask the DEFENDER one permanent pick: DCGO's
# `AttackProcess.cs` "select blocker" is a `SelectPermanentEffect` over
# `HasBlocker` Digimon with `canNoSelect: !HasCollision` (declinable here --
# Biyomon has no <Collision>); our engine parks its "Declare a blocker"
# OwnField pick with a decline. Answered by p0 -- actor 0 -- while it is p1's
# turn.
#
# THE LINE reuses BT25-058-effect0.yaml's prefix. p1 plays Biyomon only on T6,
# AFTER Callismon has digivolved, so the shared [When Digivolving] clause
# (#effect#4) had no target and opened nothing; Biyomon sheds summoning
# sickness over T7 and attacks on T8. Callismon never attacked, so it is
# unsuspended and can block.
#
# Memory ledger past the shared prefix: T5 ends 3 -> -1 (p1 1); T6 p1 plays
# Biyomon (2): 1 -> -1 (p0 1); T7 p0 passes -> p1 3; T8 p1 attacks (free).
#
# Book: qa/dcgo-exams/BT25/tm_bt25_058_pool.json (--decks).
card: BT25-058
clause: BT25-058#effect#2
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4): the Lv.5 to hard-play, the Callismon, inert filler
      - BT24-014
      - BT25-058
      - ST1-04
      - ST1-04
      - BT1-009
      # security (5-9): stack[9] is the TOP
      - ST1-05
      - ST1-05
      - BT1-014
      - BT1-014
      - ST1-02
      # (10+): p0's turn draws, in order
      - BT4-014
      - BT4-014
      - BT4-010
      - BT4-010
    rest: tm-callismon
  p1:
    stack:
      # hand (0-4): the Biyomon that attacks into the block, inert filler
      - ST1-02
      - ST1-03
      - ST1-04
      - BT1-009
      - BT3-007
      # security (5-9): stack[9] is the TOP
      - ST1-05
      - BT1-014
      - BT4-010
      - ST1-04
      - ST1-02
      # (10+): p1's turn draws, in order
      - BT4-014
      - ST1-08
      - ST1-10
      - BT1-014
    rest: quiet-opponent-tm
steps:
  # T1 (p0, memory 0): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (p1, memory 3): all-pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (p0, memory 3): hard-play Aegiochusmon for 8 (3 -> -5). No [On Play].
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT24-014, from: hand } }
    expect: { prompt: main_phase }
  # T4 (p1, memory 5): all-pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (p0, memory 3): digivolve Callismon onto the [TS] Lv.5 for 4 (3 -> -1,
  # the turn hands over). p1's board is empty, so #effect#4 opens no prompt.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT25-058 } }
    expect: { prompt: main_phase }
  # T6 (p1, memory 1): play Biyomon for 2 (1 -> -1, the turn hands over).
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  # T7 (p0, memory 1): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T8 (p1, memory 3): Biyomon attacks p0's security -- THE CLAUSE opens the
  # blocker window for p0.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  # p0 blocks with Callismon. Battle 13000 vs 3000: Biyomon is deleted.
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # One step past the clause; attacking spent no memory, p1 keeps the turn.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 17
    that:
      turn: 8
      p0.security: 5
      p1.field: []
      p1.trash: [ST1-02]
      p0.field:
        - card_id: BT25-058
          dp: 13000
          suspended: true
          sources: [BT24-014]
