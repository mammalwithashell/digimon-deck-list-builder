# Exam scenario: BeelStarmon (BT25-085), clause BT25-085#effect#0 --
# "[Digivolve] Lv.5 w/[Three Musketeers] in text or w/[TS] trait: Cost 3".
#
# Measured as the COST ACTUALLY PAID: answering the digivolution-cost prompt
# with 3 takes memory 3 -> 0 and leaves the turn with P0; the printed circle
# (4) would take it to -1 and hand the turn over. Answering 4 would measure
# nothing about this clause (that is what BT25-083-inherited0.yaml does).
#
# THE PREFIX (shared by BT25-085-effect0..3). BeelStarmon "can't play to the
# field", so the Digimon face is reached by digivolving. LadyDevimon BT25-083
# (Purple Lv.5, [TS]) is PLAYED for 7 on T3 and BeelStarmon digivolves onto it:
#   * LadyDevimon's [On Play] tuck is dormant on both sides: BT25_083.cs gates
#     it on a [Three Musketeers] TRAIT card in hand or trash
#     (AdditionalActivateCondition), and P0 holds only [TS] Tamers at T3 -- which
#     is why BeelStarmon (a [Three Musketeers] trait card) is stacked as a LATER
#     draw, never into the opening hand (the BT25-083-inherited0.yaml prefix).
#   * From LadyDevimon BOTH of BeelStarmon's routes are open at DIFFERENT costs
#     -- the printed Purple Lv.5 / 4 circle and the clause-0 alt route, cost 3 --
#     so both engines ask which cost to pay: DCGO through PlayCardClass's
#     "Which digivolution cost do you pay?" SelectCountEffect over the distinct
#     CostList {4, 3} (CardController.cs; BT25_085.cs registers the alt route
#     with ignoreDigivolutionRequirement: TRUE, level: 5), ours through the
#     rule-17 distinct-cost EffectChoice. Answered by VALUE (EX12-015 idiom).
#
#   T1 (P0): pass.  T2 (P1): pass.
#   T3 (P0, 3): play LadyDevimon (3 -> -4). [On Play] dormant.
#   T4 (P1, 4): pass.
#   T5 (P0, 3): draw BeelStarmon; digivolve, pay 3 (3 -> 0); the digivolution
#            draws 1. BeelStarmon's two [When Digivolving] effects are both gated
#            on an Option (CanActivateUseOption: a [Three Musketeers]/[TS] Option
#            in hand or under THIS Digimon; CanActivateUnsuspend: an Option under
#            ANY own Digimon) and there is no Option anywhere on this line, so
#            neither activates on either side -- no MultipleSkills, no prompt.
#            Memory 0 is still P0's turn: the trailing step is P0's pass.
card: BT25-085
clause: BT25-085#effect#0
seed: 424242
decks:
  p0:
    # stack[0..4] opening hand; [5..9] security (never flipped); [10] the T3
    # draw; [11] the T5 draw (BeelStarmon); [12] the digivolution's draw.
    stack: [BT25-083, BT24-088, BT24-088, BT24-088, BT25-092,
            BT25-082, BT25-082, BT25-082, BT25-082, BT25-058,
            BT25-092, BT25-085, BT25-092]
    rest: three-musketeers
  p1:
    stack: [ST1-03, ST1-03, ST1-03, ST1-03, ST1-04,
            ST1-02, ST1-02, ST1-02, ST1-04, ST1-04,
            BT1-009, BT1-009, BT1-009, BT1-009]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, 3): LadyDevimon, [On Play] dormant (no trait card in hand/trash).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT25-083, from: hand } }
    expect: { prompt: main_phase }
  # T4 (P1, 4)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, 3): THE CLAUSE -- digivolve BeelStarmon onto LadyDevimon and pay
  # the alt route's 3.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT25-085 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { value: 3 } }
    expect: { prompt: SelectCountEffect }
  # One step past the clause: memory 0, still P0's turn.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  # Pre-step state of the trailing pass. Memory 0 (3 - 3) is the witness; the
  # printed circle would have left -1 and ended the turn.
  - at: 11
    that:
      turn: 5
      p0.memory: 0
      p0.hand: [BT24-088, BT24-088, BT24-088, BT25-092, BT25-092, BT25-092]
      p0.trash: []
      p0.field:
        - { card_id: BT25-085, dp: 12000, suspended: false, sources: [BT25-083] }
