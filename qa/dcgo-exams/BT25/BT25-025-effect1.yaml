# Exam scenario: Aegiochusmon: Blue (BT25-025), clause BT25-025#effect#1 --
# "<Blocker> (This Digimon can block in the blocker timing.)"
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). PROVISIONAL: assert block is our engine's result, not
# backfilled from DCGO -- unconfirmed until the oracle pass.
#
# THE OBSERVABLE IS THE BLOCK. P0's battle area holds Aegiochusmon and nothing
# else, so the blocker window that opens on P1's security attack exists only
# because Aegiochusmon prints <Blocker> (no Tamer/aura grants one here).
#
# THE LINE.
#   T1 (P0, 0): pass -> P1 3.
#   T2 (P1, 3): Biyomon ST1-02 (2): 3 -> 1; pass -> P0 3.
#   T3 (P0, 3): hard-play Aegiochusmon (8): 3 -> -5. Its [On Play] asks ONE
#       mandatory pick: <De-Digivolve 1> on Biyomon (a bare Lv.3: nothing
#       trashed); security 5 > 3, so no unsuspend pick. -> P1 5.
#   T4 (P1, 5): THE CLAUSE -- Biyomon attacks P0's security; P0 blocks with
#       Aegiochusmon (SelectPermanentEffect blocker window on DCGO; our
#       blocker prompt, OwnField). Biyomon (3000) loses to 8000 and is
#       deleted; security is never checked.
#   Trailing P1 main-phase pass (P1's hand still holds Digimon -> DCGO's
#   CanSelect() keeps the decision point).
#
# WITNESS: p0.security stays 5, Aegiochusmon SUSPENDED (from blocking),
# Biyomon in p1.trash, P1's field empty.
# PROMPT SHAPE: T3 one mandatory SelectPermanentEffect (de-digivolve). T4 the
# blocker window: DCGO SelectPermanentEffect, ours the OwnField "Declare a
# blocker" prompt, answered own.field.0 (P0 has one Digimon -> slot-safe).
# VERIFIED (DCGO C#, 2026-10-04): AttackProcess.cs BlockTiming = ONE
# SelectPermanentEffect over the defender's Blocker Digimon; BT25_025.cs
# [On Play] = one mandatory Degenerate SelectPermanentEffect, unsuspend half
# off at 5 security.
