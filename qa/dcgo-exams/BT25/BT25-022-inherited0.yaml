# Exam scenario: Lunamon (BT25-022), clause BT25-022#inherited#0 -- inherited
# <Jamming> "(This Digimon can't be deleted in battles against Security
# Digimon.)"
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`).
#
# THE LINE:
#   T1 (P0, memory 0): hard-play Lunamon (0 -> -3). Its [On Play] reveal
#      (BT25-022#effect#1, same reveal as BT25-022-effect1.yaml) adds Aegiomon
#      BT25-033 + Inori BT24-084; Blinding Ray to the bottom. -> P1 3.
#   T2 (P1): all-pass -> P0 3.
#   T3 (P0, memory 3): digivolve Aegiomon BT25-033 over Lunamon (Lunamon is
#      BLUE, so only Aegiomon's "[Digivolve] Lv.3 w/[TS]: Cost 2" route applies:
#      3 -> 1; digivolve draw). Aegiomon's [When Digivolving] ("By adding your
#      top security card to the hand, 1 of your opponent's Digimon gets -5000")
#      is declined / has no target (P1 has no Digimon). Then THE CLAUSE: attack
#      P1's security with Aegiomon (5000 DP, Lunamon inherited <Jamming>). P1's
#      top security is pinned to stack[9] = BT4-014 Vermilimon (8000 DP, no
#      [Security] effect). Aegiomon loses the security battle but <Jamming>
#      prevents its deletion.
#
# WHY THIS DISCRIMINATES: without <Jamming>, Aegiomon would be deleted; its own
# <Barrier> ("when this Digimon would be deleted in battle, by trashing your top
# security card, it isn't deleted") would then open an optional window. With
# <Jamming> nothing would be deleted, so Barrier never opens: no prompt, P0's
# security stays at 5, Aegiomon stays (suspended) over Lunamon, and Vermilimon
# goes to P1's trash as a checked security card.
#
# PROMPT SHAPE: T1 = RevealBucket x2 + OrderedPermutation N=1 (sim_only) -- see
# BT25-022-effect1.yaml for the DCGO quirks of that block. T3: Aegiomon's WD
# is an optional cost-gated trigger; our engine asks it even with no P1 Digimon
# (Replacement kind -> OptionalSkill) and it is declined. VERIFIED (DCGO C#,
# 2026-10-04): DCGO asks it too -- BT25_033.cs ActivateClassesForSharedEffects
# (optional: true) with additionalActivateCondition `SecurityCards.Any()`
# only; the -5000 target is checked inside the body. Single cost route (Blue
# Lunamon: only the level-3 [TS] alt condition, cost 2). Jamming is a static
# CanNotBeDestroyedByBattleClass (KeyWordEffects/Jamming.cs) -> no prompt,
# so Aegiomon's <Barrier> never opens.
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO --
# unconfirmed until the oracle pass.
