#      -> 0, pass.
#   T3 p0 (mem 3): move Ukkomon; ST23-13 [SOMP] places BT26-089 face down and,
#      p1 having a Digimon, +1 -> 4. Armalizamon (BT25-049, GREEN Lv.4) over
