# Exam scenario: Kyo Sawashiro (BT25-088, yellow Tamer, cost 4), clause
# BT25-088#effect#0 -- "[Start of Your Turn] If you have 2 or less memory,
# set it to 3."
#
# (cards.json play cost for BT25-088 was corrected 0 -> 4 on this branch; the
# T1 hard-play below spends the corrected 4.)
#
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO. It stays unconfirmed until the oracle pass.
#
# THE LINE (memory ledger, P0 perspective):
#   T1 (0): pass breeding; hard-play BT25-088 (4) -> -4, turn ends.
#   T2 (P1, 4): play Monodramon BT1-009 (2) -> 2, then Agumon ST1-03 (3) ->
#       -1: P1 overshoots and the turn ends with P0 at 1.
#   T3: THE CLAUSE at the start of P0's turn: memory 1 <= 2 -> set to 3.
#   Witness: P0 enters the T3 breeding question with memory 3 (not 1).
#   A second assert one step later (main phase) pins it after the draw.
#
# PROMPT SHAPE (cards/bt25/BT25-088.yaml DCGO crosscheck of BT25_088.cs):
#   SetMemoryTo3TamerEffect (OnStartTurn, mandatory) -- no prompt either side.
