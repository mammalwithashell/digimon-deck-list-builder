# Decline probe for the DUAL rule <Arts Digivolve> (BT25-085#effect#6).
# Same prefix as BT25-085-effect6.yaml, but at the "Select 1 Digimon to Arts
# Digivolve." pick (canNoSelect: true) P0 DECLINES. "Instead of trashing after
# use, your cards MAY digivolve" -- declining must fall back to the ordinary
# disposal: Fly Bullet goes to the trash, SkullMeramon stays un-digivolved
# (sources: []), memory is 3 - 6 = -3 (no digivolve cost either way).
# A wrong engine would either force the digivolve, or lose the Option card
# (neither trashed nor digivolved).
