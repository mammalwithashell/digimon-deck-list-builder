# Exam scenario: Habakirimon (BT25-043), clause BT25-043#effect#0 --
# the special digivolution condition "[Digivolve] Lv.5 w/[Glowing Dawn] trait:
# Cost 3".
#
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO. It stays unconfirmed until the oracle pass.
#
# THE WITNESS. Habakirimon digivolves onto Murasamemon BT25-041 (Yellow Lv.5,
# [Glowing Dawn]). Both routes are open from that source -- the printed circle
# Yellow Lv.5 / cost 4 AND the clause under exam, Lv.5 w/[Glowing Dawn] /
# cost 3 -- so both engines ask which cost to pay (DCGO SelectCountEffect over
# the distinct CostList, ours the rule-17 EffectChoice; same shape as
# BT25-085-effect0.yaml). The answer is VALUE 3 and memory goes 3 -> 0: the
# clause's route was offered and paid at exactly 3. (The only non-yellow
# [Glowing Dawn] Lv.5 in the pool, Monarchlizamon ST23-08, drags in two [On
# Play] triggers and an unpayable optional, so the single-route witness was
# rejected in favour of this explicit cost pick.)
#
# Habakirimon's own [When Digivolving] (#effect#1/#2) then runs: <Recovery +1>
# (P0 security 5 -> 6; the card is stack[12], ST23-06, since stack[11] ST23-12
# was the digivolution-bonus draw) and the "by trashing ... this Digimon
# unsuspends" menu, DECLINED here (the body is measured in
# BT25-043-effect2.yaml).
#
# THE LINE (memory ledger):
#   T1 P0 (0): hard-play Murasamemon BT25-041 (7): 0 -> -7    -> P1 7
#   T2 P1 (7): passes                                          -> P0 3
#   T3 P0 (3): digivolve Habakirimon, cost route 3: 3 -> 0.
#
# PROMPT SHAPE.
#   * Cost pick: SelectCountEffect value 3 (see above).
#   * [When Digivolving]: no OptionalSkill (BT25-043.yaml clause is not
#     optional). Recovery is silent. The "1 player with the most security"
#     menu: ours is a 3-way EffectChoice (always all three labels -- the
#     invalid player resolves to nothing); DCGO is expected to ask a
#     SetIntSelection (generic_int) over the VALID players + "Don't trash"
#     (the BT26-031.yaml / ST23-05.yaml crosscheck of the same "most security"
#     idiom). Ours is a sim_only `choice:`; DCGO's is a dcgo_only `value:`.
#     The VALUE 3 for "Don't trash" is a GUESS by analogy with BT25-041.yaml's
#     crosscheck (BT25 menus number 1 / 2 / 3 with 3 = decline): if the oracle
#     aborts on that row, read the real value off the abort message.
card: BT25-043
clause: BT25-043#effect#0
seed: 424242
decks:
  p0:
    # hand (0-4); security (5-9, stack[9] top); stack[10] T3 draw,
    # stack[11] digivolve-bonus draw, stack[12] the <Recovery +1> card.
    stack: [BT25-041, BT25-043, BT16-082, BT16-082, BT25-090,
            ST23-03, ST23-03, ST23-03, ST23-04, ST23-04,
            BT25-049, ST23-12, ST23-06, ST23-13]
    rest: gd-bt26-1st
  p1:
    stack: [ST1-02, BT3-007, ST1-04, BT1-009, ST1-03,
            BT1-014, BT4-010, BT3-007, BT1-009, ST1-02,
            ST1-04, ST1-03, BT1-014, BT4-010]
    rest: tm-quiet-red
steps:
  # T1 (P0, 0): hard-play Murasamemon for 7 (0 -> -7). No [On Play].
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT25-041, from: hand } }
    expect: { prompt: main_phase }
  # T2 (P1, 7): all-pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, 3): THE CLAUSE -- digivolve Habakirimon, paying the [Glowing
  # Dawn] route's 3.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT25-043 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { value: 3 } }
    expect: { prompt: SelectCountEffect }
  # [When Digivolving] after <Recovery +1>: decline the security trash.
  - actor: 0
    do: { select: { choice: "Don't trash", sim_only: true } }
  - actor: 0
    do: { select: { value: 3, dcgo_only: true } }
    expect: { prompt: generic_int }
  # One step past the clause; P0 still holds the turn on 0.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 9
    that:
      turn: 3
      p0.memory: 0
      p0.security: 6
      p0.hand: [BT16-082, BT16-082, BT25-049, BT25-090, ST23-12]
      p0.trash: []
      p0.field:
        - card_id: BT25-043
          dp: 12000
          suspended: false
          sources: [BT25-041]
      p1.security: 5
