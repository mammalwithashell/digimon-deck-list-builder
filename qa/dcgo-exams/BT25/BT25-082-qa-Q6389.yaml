# Q6389: Asuna's effect-driven evolution must see BlackGatomon's granted route.
# Extend BT25-082-effect2's prefix, replacing the ordinary digivolve action.
# Adversarial branch: pay Asuna's Option cost with the DUAL BeelStarmon,
# then choose that SAME card from trash as the level-6 result. Asuna has
# already suspended, but remains a Tamer with [Three Musketeers] in her text.
# This crosses hand -> trash during resolution, then tests the grant in both
# candidate filtering and effect-initiated evolution, with cost reduction.
# EX7-073 remains a legal hand alternative, so DCGO must ask the result zone.
# End after declining BeelStarmon's newly triggered use-an-Option effect.
# Timing: inspect_step 18 is BEFORE the result-card pick; BlackGatomon is
# still the top card there. inspect_step 20 is AFTER the evolution and draw,
# with BeelStarmon's optional follow-up pending. Do not read step 18 as the
# evolved board. Assertions are intentionally left for independent backfill.
interaction: {id: "qa:Q6389", source: qa, kind: positive}
meta: {produced_by: 20261006T205647660394Z-pilot-three-musketeers-f9d71f}
covers:
  - BT25-082#effect#0
  - BT25-082#effect#1
  - BT25-082#effect#2
  - BT25-092#effect#1
  - BT25-085#effect#2
  - EX7-051#effect#1
card: BT25-082
clause: BT25-082#effect#2
seed: 424242
decks:
  p0:
    # stack[0..4] = opening hand; stack[5..9] = security (never flipped: P1
    # never attacks); stack[10..] = draws in order. EVERY digivolution draws a
    # card, so the draw budget is: T3 turn draw, T3 Sparrowmon draw, T5 turn
    # draw, T5 BlackGatomon draw, T5 BeelStarmon draw, T7 turn draw, ...
    # BeelStarmon #2 sits at stack[14] -- drawn BY the grant digivolve -- so
    # the opening copy is trashed as Asuna's cost and evolved from trash; the
    # drawn copy makes BeelStarmon's use-an-Option clause live.
    stack: [EX7-051, BT25-082, BT25-092, BT25-085, EX7-073,
            BT25-078, BT25-078, BT25-078, EX7-008, EX7-008,
            BT25-083, BT21-071, BT21-074, BT25-083, BT25-085,
            BT21-071, BT25-078, BT21-074, EX7-008, BT25-083]
    rest: three-musketeers
  p1:
    # Security is five vanilla low-DP Digimon so every security check on the
    # EX7-073 lines built on this prefix is a prompt-free battle the attacker
    # wins. Draws are vanilla bodies that stay in hand.
    stack: [ST1-03, ST1-04, ST1-04, BT1-009, BT1-009,
            ST1-02, ST1-02, ST1-04, ST1-02, ST1-02,
            BT1-009, BT1-009, BT3-007, BT3-007, BT3-007]
    rest: quiet-opponent
steps:
  # T1 (P0): hatch.
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1): hatch, play Agumon (3 -> 0), pass.
  - actor: 1
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-03, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0): breeding-digivolve -> Sparrowmon. No breeding prompt this turn:
  # Pagumon is a Lv.2 (cannot move) and the egg slot is occupied.
  - actor: 0
    do: { digivolve: { from: breeding, using: EX7-051 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1): Koromon is a Lv.2 in an occupied breeding area -- no breeding
  # prompt -- so the turn is a single main-phase pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, memory 3): promote Sparrowmon.
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  # SHARED (fold): Sparrowmon's [Start of Your Main Phase]. BeelStarmon
  # (BT25-085) in hand is a DUAL card -- a [Three Musketeers] trait Option -- so
  # the cost is payable on BOTH sides (see the header). DCGO asks an
  # OptionalSkill, ours the declinable cost pick itself; `expect: OptionalSkill`
  # over our live pick is the fold marker, and `decline:` emits one
  # OptionalSkill(no) row.
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: OptionalSkill }
  # Digivolve BlackGatomon onto Sparrowmon, paying the alt-circle cost of 2.
  - actor: 0
    do: { digivolve: { from: field.0, using: BT25-082 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { value: 2 } }
    expect: { prompt: SelectCountEffect }
  # [When Digivolving]: SIM-ONLY outer gate (our `Replacement` accept/decline
  # park -- DCGO builds this effect non-optional and carries the "may" on the
  # pick's canNoSelect), then the shared hand pick.
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  - actor: 0
    do: { select: { cards: [BT25-092] } }
    expect: { prompt: SelectHandEffect }
  # Asuna is field.1, beside BlackGatomon in field.0.
  - actor: 0
    do: { main: { on: field.1 } }
    expect: { prompt: main_phase }
  # BeelStarmon's Option face pays the mandatory cost; it moves to trash.
  - actor: 0
    do: { select: { cards: [BT25-085] } }
    expect: { prompt: SelectHandEffect }
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # Both hand and trash have legal results. DCGO false = From trash;
  # our union selection encodes origin directly in its card pick.
  - actor: 0
    do: { select: { decline: true, dcgo_only: true } }
    expect: { prompt: generic_bool }
  - actor: 0
    do: { select: { cards: [BT25-085] } }
    expect: { prompt: SelectCardEffect }
  # The evolution draw supplies BeelStarmon #2 as an Option in hand.
  - actor: 0
    do: { select: { value: 1, dcgo_only: true } }
    expect: { prompt: generic_int }
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: SelectHandEffect }
assert: []
expect_ruling:
  q_id: Q6389
  assert:
  - at: 20
    that:
      p0.field: [BT25-085, BT25-092]
