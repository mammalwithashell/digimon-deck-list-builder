# once-per-turn allowance (BT25_085.cs: !executed -> RemoveUse()).
# Then trash that Option to unsuspend and attack again with a second P-180
# still in hand: successfully using the first must consume that allowance.
# Thus this tests both a missing decline/refund and an overbroad refund.
# The first cancellation is at DCGO's hand picker AFTER choosing the hand
# branch, not an empty-candidate shortcut. It matches our optional union pick.
# DCGO's zone-menu rows alone are dcgo_only; no missing engine trigger is hidden.
# P-180 finishes its Main/tuck before the pending unsuspend sibling is chosen.
# No opponent Digimon exist, so P-180's source-trash removal has no target.
# Expected oracle witness before the final pass: T7, memory 0, BeelStarmon
# suspended with only LadyDevimon underneath, one P-180 in hand and one in
# trash, opponent security 2 (one effect trash and two security checks).
