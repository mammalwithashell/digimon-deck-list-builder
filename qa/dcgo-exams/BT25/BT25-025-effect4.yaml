# Exam scenario: Aegiochusmon: Blue (BT25-025), clause BT25-025#effect#4 --
# "<De-Digivolve 1> 1 of your opponent's Digimon. Then, if you have 3 or fewer
#  security cards, 1 of your Digimon unsuspends. (Rule) Trait: Has [Cyborg]
#  Type."  (the keyword body of the [On Play]/[When Digivolving] clause; this
#  file drives it through the [When Digivolving] arm with security at 3, so
#  the "Then" half is LIVE. The trailing "(Rule) Trait: Has [Cyborg]" has no
#  observable on this line -- nothing in either deck book reads [Cyborg].)
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). PROVISIONAL: assert block is our engine's result, not
# backfilled from DCGO -- unconfirmed until the oracle pass.
#
# THE LINE.
#   T1 (P0, 0): hard-play Aegiomon BT24-034 (5): 0 -> -5 (no [TS] Tamer in
#       hand -> silent).
#   T2 (P1, 5): Biyomon ST1-02 (2) + Agumon ST1-03 (3): 5 -> 0; pass -> P0 3.
#   T3 (P0, 3): all-pass -> P1 3.
#   T4 (P1, 3): Biyomon and Agumon each attack P0's security. Both checks flip
#       Elecmon BT24-031 (1000, no [Security] text; p0 stack[9] then [8]),
#       which lose and are trashed. P0 security 5 -> 3. Trailing pass -> P0 3.
#   T5 (P0, 3): Aegiomon attacks P1's security (p1 stack[9] = Biyomon ST1-02,
#       3000, loses) and is SUSPENDED. Then THE CLAUSE: digivolve
#       Aegiochusmon onto the suspended Aegiomon via "[Aegiomon]: Cost 3"
#       (3 -> 0). [When Digivolving]: <De-Digivolve 1> pick -> P1's
#       field.0 (a bare Lv.3, nothing trashed); security is 3 (<= 3) so the
#       unsuspend pick opens -> Aegiochusmon (P0's only Digimon) unsuspends.
#   Trailing pass.
#
# WITNESS: before the digivolve the Aegiomon is suspended with p0.security 3;
# after the WD body Aegiochusmon (the same permanent) is UNSUSPENDED.
#
# PROMPT SHAPE: two mandatory SelectPermanentEffect rows (DCGO: Mode
# Degenerate canNoSelect false, then Mode UnTap canNoSelect false, per the
# BT25-025.yaml crosscheck notes); ours: select_opponent_permanent then
# select_own_permanent. 1:1. P1's two-Digimon board makes the de-digivolve a
# real 2-candidate pick -- `opp.field.0` is resolved to a card id (identity),
# both P1 Digimon are bare Lv.3s so either answer leaves the same state; if
# DCGO's centre-out frame order makes opp.field.0 name the other Digimon, the
# state is unchanged.
