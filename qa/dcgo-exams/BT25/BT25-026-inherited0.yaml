# Exam scenario: Crescemon (BT25-026), clause BT25-026#inherited#0 --
# the inherited "[Your Turn] This Digimon's attack target can't change."
#
# PRINTED TEXT NOTE. data/cards.json prints this inherited effect as
# "<Security A. +1>"; the card image (BT25-026.webp) and BT25_026.cs both
# print "[Your Turn] This Digimon's attack target can't change", and the
# image is authoritative (CLAUDE.md, "Look at the actual card"). That is the
# clause examined here.
#
# THE WITNESS is a block that CANNOT happen. Crescemon is hard-played on T3
# and Dianamon BT25-028 digivolves onto it FROM HAND on T5, so Crescemon is a
# digivolution card. p1 hard-plays Grizzlymon ST2-07 -- a <Blocker> -- on T4,
# and on T7 Dianamon attacks p1's security. DCGO's Permanent.CanBlock returns
# false when the attacker's CanSwitchAttackTarget is false (Permanent.cs, the
# CanNotSwitchAttackTargetClass walk), so no blocker prompt opens; our engine
# drops Grizzlymon from the block candidates through
# validate_attack_redirect_target (CanNotSwitchAttackTarget on the attacker)
# and opens no window either. The check then flips p1's stack[9] Biyomon
# (3000) into 12000: p1's security 5 -> 4, Grizzlymon still unsuspended on
# the field. Without the clause a block window would open on both sides
# (the scripted `pass` after the attack would then land on a blocker prompt
# and abort -- the line cannot stay green if the clause is dropped).
#
# SLOT SAFETY (NOTES-BT25-083.md rule): p0 only ever has ONE Digimon, so
# `field.0` names the same permanent on both engines. (The first draft of
# this file reused the BT25-026-effect2.yaml trash-digivolve line, which
# leaves a second Digimon beside Dianamon; `attack: field.0` would then name
# Agumon on DCGO's centre-out frames.) p1 has two Digimon but never addresses
# a slot.
#
# GRIZZLYMON SURVIVES DIANAMON'S ARRIVAL because p1 also has a bare Agumon
# ST1-03 for the [When Digivolving] delete to take (a real 2-candidate pick,
# answered by identity). Grizzlymon (0 digivolution cards) is locked by that
# body until the end of p1's T6 -- the lock has expired by T7, so the ONLY
# reason it cannot block on T7 is the clause under exam.
#
# THE DIGIVOLVE COST. Crescemon is Blue AND [TS], so Dianamon has two open
# routes -- the printed Blue Lv.5 circle (4) and "[Digivolve] Lv.5 w/[TS]
# trait: Cost 3". Both engines ask (ours: the rule-17 distinct-cost
# EffectChoice; DCGO: SelectCountEffect over {3, 4}); `value: 3` names the
# [TS] route on both sides (BT25-083-inherited0.yaml idiom).
#
# DIANAMON'S TWO SAME-CARD TRIGGERS ([When Digivolving] + the [All Turns]
# "when any Digimon ... digivolve") follow the BT25-028-effect0.yaml shape:
# a `dcgo_only` MultipleSkills row, the shared delete pick, then our
# `sim_only` yes/no gate for the [All Turns] body. That body is silent on
# DCGO: SelectTrashDigivolutionCards breaks out at once when the opponent's
# Digimon hold no digivolution cards (maxDigivolutionDiscardCount = 0) and
# p0 has no [GraceNovamon] / second Digimon for the DNA half.
#
# KNOWN DATA FINDING (measured at lowering, 2026-09-18; NOTES-BT25-026.md).
# data/cards.json carries BT25-026's inherited text as "<Security A. +1>",
# and card_data.rs parses printed keywords out of that text, so on OUR side
# Dianamon-on-Crescemon checks TWO security cards (p1.security 3, a second
# card in p1.trash). The card image, data/card_bundles/BT25-026.md and
# BT25_026.cs all print "attack target can't change" and grant no Security
# A. Re-running this file against a scratch cards.json with the inherited
# text corrected gives security 4 / trash [ST1-02, ST1-03]. Expected oracle
# outcome until the data is fixed: a one-field `p1.security` divergence on
# the final row (ours 3, DCGO 4) -- OUR BUG (card data), not a clause
# finding. The block-window witness above is unaffected by it.
#
# Memory ledger:
#   T1 p0 passes                                      -> p1 3
#   T2 p1 plays Agumon (3): 3 -> 0, passes            -> p0 3
#   T3 p0 plays Crescemon (6): 3 -> -3                -> p1 3
#   T4 p1 plays Grizzlymon (5): 3 -> -2               -> p0 2
#   T5 p0 digivolves Dianamon (3): 2 -> -1            -> p1 1
#   T6 p1 passes                                      -> p0 3
#   T7 p0 attacks (free), passes                      -> p1 3
#
# Book: qa/dcgo-exams/BT25/tm_bt25_026_pool.json (--decks).
card: BT25-026
clause: BT25-026#inherited#0
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4): Crescemon, Dianamon, inert filler
      - BT25-026
      - BT25-028
      - ST1-04
      - ST1-04
      - BT1-009
      # security (5-9): never flipped
      - ST1-05
      - ST1-05
      - BT3-007
      - BT3-007
      - ST1-02
      # (10+): p0's T3 / T5 turn draws, the digivolve draw, the T7 draw
      - BT4-010
      - BT3-007
      - BT3-007
      - BT4-010
    rest: tm-ts-line
  p1:
    stack:
      # hand (0-4): Agumon (the T5 delete target), Grizzlymon (the <Blocker>),
      # inert filler
      - ST1-03
      - ST2-07
      - ST1-04
      - BT1-009
      - BT3-007
      # security (5-9): stack[9] is the TOP -- the vanilla Biyomon Dianamon hits
      - ST1-05
      - ST1-08
      - ST1-04
      - ST1-04
      - ST1-02
      # (10+): p1's T2 / T4 / T6 / T8 turn draws
      - BT1-009
      - ST1-08
      - ST1-10
      - ST1-05
    rest: tm-ts-opponent
steps:
  # T1 (p0, memory 0): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (p1, memory 3): Agumon (3 -> 0), pass out.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-03, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (p0, memory 3): hard-play Crescemon for 6 (3 -> -3); both [On Play]
  # picks take p1's bare Agumon (nothing to trash; the lock).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT25-026, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # T4 (p1, memory 3): hard-play Grizzlymon for 5 (3 -> -2).
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST2-07, from: hand } }
    expect: { prompt: main_phase }
  # T5 (p0, memory 2): Dianamon onto Crescemon; the [TS] route, 3 (2 -> -1).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT25-028 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { value: 3 } }
    expect: { prompt: SelectCountEffect }
  # DCGO-ONLY: Dianamon's two same-card triggers stack into MultipleSkills;
  # ours bundles nothing on a digivolve (BT25-028-effect0.yaml shape).
  - actor: 0
    do: { select: { cards: [BT25-028], ordinal: 0, dcgo_only: true } }
    expect: { prompt: MultipleSkills, count: 2, candidates: [BT25-028, BT25-028] }
  # Its mandatory delete: Agumon (p1's slot 0 on OUR side; the wire carries
  # the identity ST1-03), sparing Grizzlymon. Both are unsuspended.
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # SIM-ONLY: our yes/no gate for the [All Turns] body (`optional: true` in
  # BT25-028.yaml); DCGO's is isOptional: false and silent here.
  - actor: 0
    do: { select: { decline: true, sim_only: true } }
    expect: { prompt: OptionalSkill }
  # T6 (p1, memory 1): all-pass. Grizzlymon's lock expires with this turn.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T7 (p0, memory 3): THE CLAUSE -- Dianamon attacks the player. No block
  # window opens on either side; the check flips Biyomon (3000 < 12000).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  # One step past the clause.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 21
    that:
      turn: 7
      p0.memory: 3
      # p1.security / p1.trash are deliberately NOT pinned here -- see the
      # KNOWN DATA FINDING in the header. Rules-correct values are
      # security 4, trash [ST1-02, ST1-03]; the oracle row will carry them.
      p1.field:
        - card_id: ST2-07
          dp: 6000
          suspended: false
          sources: []
      p0.field:
        - card_id: BT25-028
          dp: 12000
          suspended: true
          sources: [BT25-026]
