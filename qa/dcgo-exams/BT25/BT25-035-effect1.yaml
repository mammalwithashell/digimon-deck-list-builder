# Exam scenario: Cougarmon (BT25-035), clause BT25-035#effect#1 --
# "[On Play] [When Digivolving] 1 of your opponent's Digimon gets -3000 DP for
#  the turn. Then, by trashing 2 bottom face-down cards from under any of your
#  Tamers, this Digimon may digivolve into a [Glowing Dawn] trait Digimon card
#  in the hand without paying the cost."  (Measured through [When Digivolving].)
#
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO. It stays unconfirmed until the oracle pass (NOTES-GLOWING-DAWN.md).
#
# THE LINE (memory ledger in brackets):
#   T1 P0 [0]: hatch Kekkomon; digivolve it in the breeding area into Gekkomon
#       ST23-06 (cost 0) [0], draw stack[10]. Hard-play Tomoro & Kyo ST23-13
#       (cost 4) [-4]; its [On Play] places stack[11] (ST23-03) under it.
#   T2 P1 [4]: plays Agumon BT3-007 (cost 2, 4000 DP) [2], passes.
#   T3 P0 [3]: draw stack[12]. Move Gekkomon: [When Moving] reveals
#       stack[13..15], adds ST23-09, places ST23-04 under the Tamer, bottoms
#       ST23-12. Tamer's [Start of Your Main Phase] places stack[16]
#       (BT25-043) under it and, P1 having a Digimon, gains 1 memory [4].
#       Tamer face-down cards, top -> bottom: ST23-03, ST23-04, BT25-043.
#       Digivolve Gekkomon into Cougarmon BT25-035 (alt, cost 2) [2], draw
#       stack[17].
#   THE CLAUSE: Agumon gets -3000 (4000 -> 1000). Then the optional free
#       digivolve: pick Murasamemon BT25-041 from the hand, trash the Tamer's
#       two bottom face-down cards (BT25-043, ST23-04), and Cougarmon
#       digivolves into Murasamemon for NO cost [2]. ST23-13's trash trigger
#       and BT25-041's optional [When Digivolving] are declined.
#   Witness (asserted before the trailing pass): Agumon at 1000 DP;
#   Murasamemon over [Cougarmon, Gekkomon, Kekkomon]; memory still 2 (free);
#   P0 trash [BT25-043, ST23-04]; the Tamer down to [ST23-03].
#
# ENGINE FINDINGS on this clause (asserted as OUR behaviour, flagged):
#   1. The digivolve pick offers EVERY [Glowing Dawn] Digimon in hand --
#      here also ST23-09 / BT25-043, both Lv.6, which cannot digivolve onto a
#      Lv.4. Probed: picking ST23-09 trashes both face-down cards and then no
#      digivolution happens (cost paid for nothing). The printed "may
#      digivolve into" only admits cards this Digimon can digivolve into;
#      expect DCGO's candidate list to omit the Lv.6s.
#   2. ST23-13's "When effects trash cards from under this Tamer" fires once
#      PER CARD (twice here) and the first copy resolves BETWEEN the two
#      trashes (mid-effect). One effect trashing two cards is one event, and
#      a trigger waits until the effect finishes. Probed: if the first copy is
#      accepted (Tamer suspended), the second is still offered and does
#      nothing. Second copy is a sim_only row; the first may sit at a
#      different position in DCGO's sequence (after the digivolve, possibly
#      batched with BT25-041's [When Digivolving] as MultipleSkills).
#
# PROMPT SHAPE (BT25-035.yaml DCGO crosscheck): -3000 pick is
# SelectPermanentEffect canNoSelect: false. The "Then" is a trash-2 cost over
# Tamers with CanEndSelectCondition ("2 from one Tamer" / "1 from each of
# two") + a hand digivolve pick (payCost: false). DCGO's ORDER of the
# optional gate / Tamer pick / hand pick is not recorded in the YAML; ours is
# hand pick (declinable = the "may") -> Tamer pick per card. This line is the
# likeliest of the group to need re-authoring after the first oracle run.
card: BT25-035
clause: BT25-035#effect#1
seed: 424242
decks:
  p0:
    stack: [ST23-06, ST23-13, BT25-035, BT25-041, BT16-082,
            ST23-15, ST23-15, BT16-082, BT26-089, BT26-089,
            BT26-089, ST23-03, BT25-090, ST23-09, ST23-04,
            ST23-12, BT25-043, BT25-043, BT26-089, BT16-082]
    rest: gd-bt26-1st
  p1:
    stack: [BT3-007, ST1-04, BT1-009, ST1-03, ST1-08,
            BT1-014, BT4-010, BT3-007, BT1-009, ST1-02,
            ST1-04, ST1-03]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: breeding, using: ST23-06 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { play: { card: ST23-13, from: hand } }
    expect: { prompt: main_phase }
  # ST23-13 [On Play] "You may place the top card ..." -> yes (stack[11]).
  # ST23-13 [On Play] place -> yes (stack[11]).
  # ST23-13 [On Play] place -> yes (stack[11]).
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  # DCGO asks this ST23-13 "you may" as SetIntSelection (Yes=1 / No=2) on the
  # generic_int channel, not as an OptionalSkill (ST23_13.cs SharedActivateCoroutine,
  # optional: false), so its answer rides a separate dcgo_only row.
  - actor: 0
    do: { select: { value: 1, dcgo_only: true } }
    expect: { prompt: generic_int }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: BT3-007, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  # Gekkomon's [When Moving] (GD Tamer present: two buckets + Tamer pick).
  # Gekkomon's [When Moving] (GD Tamer present).
  # Gekkomon's [When Moving] (GD Tamer present).
  - actor: 0
    do: { select: { cards: [ST23-09] } }
    expect: { prompt: SelectCardEffect }
  - actor: 0
    do: { select: { cards: [ST23-04] } }
    expect: { prompt: SelectCardEffect }
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect, count: 1 }
  - actor: 0
    do: { select: { cards: [ST23-12], sim_only: true } }
  # ST23-13 [Start of Your Main Phase] place -> yes (stack[16]).
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  # DCGO asks this ST23-13 "you may" as SetIntSelection (Yes=1 / No=2) on the
  # generic_int channel, not as an OptionalSkill (ST23_13.cs SharedActivateCoroutine,
  # optional: false), so its answer rides a separate dcgo_only row.
  - actor: 0
    do: { select: { value: 1, dcgo_only: true } }
    expect: { prompt: generic_int }
  - actor: 0
    do: { digivolve: { from: field.1, using: BT25-035 } }
    expect: { prompt: main_phase }
  # THE CLAUSE, first sentence: -3000 to Agumon (4000 -> 1000).
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # THE CLAUSE, "Then": the optional pick of the [Glowing Dawn] Digimon to
  # digivolve into (declining here would skip the trash cost entirely).
  - actor: 0
    do: { select: { cards: [BT25-041] } }
    expect: { prompt: SelectHandEffect }
  # The cost: our engine asks the Tamer once per trashed card.
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # ST23-13 "[Your Turn] When effects trash cards from under this Tamer, by
  # suspending this Tamer, ..." fires off the FIRST trashed card, mid-cost.
  # Declined.
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: OptionalSkill }
  # SIM-ONLY: the 2nd per-card Tamer pick. With one Tamer holding >=2
  # face-down cards DCGO's single Tamer selection covers both (BT25-035.yaml:
  # CanEndSelectCondition "2 from one Tamer").
  - actor: 0
    do: { select: { targets: [own.field.0], sim_only: true } }
  # SIM-ONLY: ST23-13 fires AGAIN for the second card (one effect trashing two
  # cards is one trigger event) -- see ENGINE FINDING in the header.
  - actor: 0
    do: { select: { decline: true, sim_only: true } }
  # Free digivolve into Murasamemon done; BT25-041's optional [When
  # Digivolving] -> decline.
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: OptionalSkill }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 23
    that:
      turn: 3
      p0.memory: 2
      p0.trash: [BT25-043, ST23-04]
      p0.hand: [BT16-082, BT25-043, BT25-090, BT26-089, BT26-089, ST23-09]
      p1.field:
        - card_id: BT3-007
          dp: 1000
          suspended: false
          sources: []
      p0.field:
        - card_id: BT25-041
          dp: 7000
          suspended: false
          sources: [BT25-035, ST23-01, ST23-06]
        - card_id: ST23-13
          dp: -1
          suspended: false
          sources: [ST23-03]
