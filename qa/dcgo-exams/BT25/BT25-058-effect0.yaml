# Exam scenario: Callismon (BT25-058), clause BT25-058#effect#0 --
# the special digivolution condition "[Digivolve] Lv.5 w/[TS] trait: Cost 4".
#
# THE WITNESS. Callismon digivolves onto Aegiochusmon (BT24-014, a RED/YELLOW
# Lv.5 with the [TS] trait). Callismon's printed circles are Green Lv.5 / cost 5
# and Black Lv.5 / cost 5, and a red/yellow source satisfies NEITHER -- so the
# only path that makes this digivolve legal at all is the alt condition under
# exam, and the memory delta (3 -> -1) pins its cost at exactly 4. Both engines
# see a single applicable path, so no cost-choice prompt opens (our
# `EffectChoice` / DCGO's `SelectCountEffect` only appear with >1 distinct
# cost). BT24_014.cs's own text is silent along the way: no [On Play], its
# <Decode> only fires on a non-battle leave, and its [When Digivolving] is
# never reached because Aegiochusmon is HARD-PLAYED (cost 8, overshooting 3 ->
# -5).
#
# WHY THIS BOOK, NOT `three_musketeers_pool.json`. The shared pool's only [TS]
# Lv.5 is LadyDevimon (BT25-083), whose inherited [On Deletion] is
# `isOptional: true` in DCGO with no candidate precheck -- it would open an
# OptionalSkill beside <Fortitude> in the deletion line (BT25-058-effect3) and
# a `MultipleSkills` order prompt on top. Aegiochusmon carries no such
# inherited trigger, so one book serves all six Callismon clauses:
# `qa/dcgo-exams/BT25/tm_bt25_058_pool.json` (--decks).
#
# P1's board is EMPTY when Callismon digivolves, so the shared
# [On Play][When Digivolving][When Attacking] clause (#effect#4) has no legal
# target on either side -- DCGO's `HasMatchConditionPermanent` guard and our
# `condition: any_permanent` agree -- and opens no prompt. That clause is
# measured on its own in BT25-058-effect4.yaml.
#
# Memory ledger (the whole line):
#   T1 p0 passes                         -> p1 3
#   T2 p1 passes                         -> p0 3
#   T3 p0 plays Aegiochusmon (8): 3 -> -5 -> p1 5
#   T4 p1 passes                         -> p0 3
#   T5 p0 digivolves Callismon (4): 3 -> -1, the turn hands over -> p1 1
card: BT25-058
clause: BT25-058#effect#0
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4): the Lv.5 to hard-play, the Callismon, inert filler
      - BT24-014
      - BT25-058
      - ST1-04
      - ST1-04
      - BT1-009
      # security (5-9): never flipped in this line
      - ST1-05
      - ST1-05
      - BT1-014
      - BT1-014
      - ST1-02
      # (10-11): p0's T3 / T5 draws
      - BT4-014
      - BT4-014
    rest: tm-callismon
  p1:
    stack:
      # hand (0-4): inert; p1 never plays a card here
      - ST1-02
      - ST1-03
      - ST1-04
      - BT1-009
      - BT3-007
      # security (5-9): never flipped
      - ST1-05
      - BT1-014
      - BT4-010
      - ST1-04
      - ST1-02
      # (10-12): p1's T2 / T4 / T6 draws
      - BT4-014
      - ST1-08
      - ST1-10
    rest: quiet-opponent-tm
steps:
  # T1 (p0, memory 0): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (p1, memory 3): all-pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (p0, memory 3): hard-play Aegiochusmon for 8 (3 -> -5). No [On Play].
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT24-014, from: hand } }
    expect: { prompt: main_phase }
  # T4 (p1, memory 5): all-pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (p0, memory 3): THE CLAUSE -- digivolve Callismon onto the [TS] Lv.5
  # for 4. 3 -> -1 ends the turn.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT25-058 } }
    expect: { prompt: main_phase }
  # T6 (p1): one step past the clause. The turn has already handed over.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  # Pre-step state of the trailing pass: Callismon sits on Aegiochusmon, and
  # the cost paid was exactly 4 (3 -> -1).
  - at: 10
    that:
      p0.memory: -1
      p0.field:
        - card_id: BT25-058
          dp: 13000
          suspended: false
          sources: [BT24-014]
      p1.field: []
