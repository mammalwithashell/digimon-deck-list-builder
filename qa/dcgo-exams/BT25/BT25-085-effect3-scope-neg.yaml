# NEGATIVE scope probe, BeelStarmon (BT25-085), clause BT25-085#effect#3 --
# "[When Attacking] ... By trashing 1 Option card from any of your Digimon's
#  digivolution cards or link cards, this Digimon unsuspends."
#
# The cost may come from ANY of your Digimon, but the unsuspend is "this
# Digimon" only. The only Option sits under a SECOND Digimon (Scopemon
# BT21-071), never under BeelStarmon. Scopemon attacks first on T9 and stays
# suspended; BeelStarmon then attacks, pays the cost out of Scopemon's
# digivolution cards and unsuspends ITSELF. Scopemon must still be suspended
# afterwards -- the unsuspend must not leak to the Digimon that held the Option.
# #effect#2 has no candidate at the attack (no Option in hand or under
# BeelStarmon), so #effect#3 is the only trigger: no MultipleSkills row.
#
#   T3: LadyDevimon (BT25-083) played.
#   T5: draw BeelStarmon; digivolve onto LadyDevimon (cost 3) while she is the
#       ONLY permanent (no slot ambiguity). The digivolve draw is a filler
#       Tamer, so no Option is in hand and neither [When Digivolving] clause
#       has a candidate.
#   T6 (P1): play WarGreymon ST1-10 (cost 10) -> hands P0 seven memory. Its 12000
#       DP is outside P-180's "7000 DP or lower" delete range.
#   T7: draw P-180; play Scopemon and tuck P-180 under IT ([On Play]).
#   T9: Scopemon attacks (P1's top security is a 3000 DP Biyomon, so Scopemon
#       survives, suspended), BeelStarmon attacks -> THE CLAUSE.
