# Exam scenario: Crescemon (BT25-026), clause BT25-026#effect#1 --
# "[On Play] [When Digivolving] Trash the bottom 3 digivolution cards of 1 of
#  your opponent's Digimon. Then, 1 of their Digimon with no digivolution
#  cards can't suspend until their turn ends."
#
# This file exercises the [When Digivolving] arm against a STACK, so the
# trash is visible: p1 breeds Tsunomon ST2-01 -> Gabumon ST2-03 -> promotes ->
# Garurumon ST2-06 (all vanilla apart from inherited [When Attacking] text
# that never fires: the stack never attacks). Garurumon carries two
# digivolution cards; "trash the bottom 3" takes both, and Garurumon -- now
# with no digivolution cards -- is the unique candidate for the lock.
#
# PROMPT SHAPE (BT25_026.cs, region "Shared OP/WD", `optional: false`): no
# OptionalSkill. Pick 1: SelectPermanentEffect (canNoSelect: false) over
# opponent Digimon -> TrashDigivolutionCardsFromTopOrBottom(3, from bottom).
# Pick 2, only if an opponent Digimon with 0 digivolution cards exists:
# SelectPermanentEffect (canNoSelect: false) -> GainCanNotSuspendPlayerEffect
# until the opponent's turn ends. Ours: two mandatory
# `select_opponent_permanent`s around `trash_bottom_sources: 3`. 1:1.
# The lock itself is not projected; the trash is the witness.
#
# Crescemon is digivolved onto a hard-played Lekismon BT25-024 (T3; <Draw 1>,
# and its red-gated [Your Turn] trigger is silent on a blue play) so the
# [When Digivolving] arm is the one measured. p1's T4 is a breeding-area
# digivolve (no breeding prompt that turn: the area holds a Lv.2 and is
# occupied, so neither engine asks -- the BT21-029/BT21-071 shape); on T6
# Gabumon is promoted and digivolved.
#
# Memory ledger:
#   T1 p0 passes                                    -> p1 3
#   T2 p1 hatches, passes                           -> p0 3
#   T3 p0 plays Lekismon (4): 3 -> -1               -> p1 1
#   T4 p1 digivolves Gabumon in breeding (0), passes -> p0 3
#   T5 p0 passes                                    -> p1 3
#   T6 p1 promotes, digivolves Garurumon (2): 3 -> 1, passes -> p0 3
#   T7 p0 digivolves Crescemon (3): 3 -> 0 (THE CLAUSE), passes -> p1 3
#
# Book: qa/dcgo-exams/BT25/tm_bt25_026_pool.json (--decks).
card: BT25-026
clause: BT25-026#effect#1
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4): Lekismon, Crescemon, inert filler
      - BT25-024
      - BT25-026
      - ST1-04
      - ST1-04
      - BT1-009
      # security (5-9): never flipped
      - ST1-05
      - ST1-05
      - BT3-007
      - BT3-007
      - ST1-02
      # (10+): T3 turn draw, Lekismon [On Play] draw, T5 draw, T7 draw
      - BT4-010
      - BT3-007
      - BT3-007
      - BT4-010
    rest: tm-ts-line
  p1:
    stack:
      # hand (0-4): Gabumon, Garurumon, inert filler
      - ST2-03
      - ST2-06
      - ST1-04
      - BT1-009
      - BT3-007
      # security (5-9): never flipped
      - ST1-05
      - ST1-08
      - ST1-04
      - ST1-04
      - ST1-02
      # (10+): p1 T2 / T4 / T6 / T8 turn draws
      - BT1-009
      - ST1-08
      - ST1-10
      - ST1-03
    rest: tm-ts-opponent
steps:
  # T1 (p0, memory 0): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (p1, memory 3): hatch Tsunomon, pass.
  - actor: 1
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (p0, memory 3): hard-play Lekismon for 4 (3 -> -1). <Draw 1>, no prompt.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT25-024, from: hand } }
    expect: { prompt: main_phase }
  # T4 (p1, memory 1): breeding-digivolve Gabumon (cost 0). No breeding
  # prompt this turn (Lv.2 in the area). Pass out.
  - actor: 1
    do: { digivolve: { from: breeding, using: ST2-03 } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (p0, memory 3): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T6 (p1, memory 3): promote Gabumon, digivolve Garurumon (2): 3 -> 1.
  - actor: 1
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { digivolve: { from: field.0, using: ST2-06 } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T7 (p0, memory 3): digivolve Crescemon (3): 3 -> 0 -- THE CLAUSE.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT25-026 } }
    expect: { prompt: main_phase }
  # Trash the bottom 3 of the Garurumon stack (both cards go).
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # The lock: Garurumon, now with no digivolution cards.
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # Memory 0: p0 still holds the turn; pass out.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T8 (p1): one step past the clause.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 19
    that:
      turn: 8
      p0.field:
        - card_id: BT25-026
          dp: 7000
          suspended: false
          sources: [BT25-024]
      p1.field:
        - card_id: ST2-06
          dp: 4000
          suspended: false
          sources: []
      p1.trash: [ST2-01, ST2-03]
