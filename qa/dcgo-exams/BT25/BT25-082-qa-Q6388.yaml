# Q6388: BlackGatomon in the BREEDING area, Asuna (a Tamer with [Three Musketeers] in text) on the field.
# The ruling is "No, you can't. The effect doesn't activate in the breeding area." Since the
# 2026-11 breeding-area fix (CR 4.3 3-4-7-4: an Into-direction alt path is the breeding card's
# own effect and is off there) our engine no longer offers `digivolve: { from: breeding,
# using: BT25-085 }`, so that step cannot be lowered any more and is gone: the line stops at
# the main phase in which the grant would have been used, and the ruling claim is the hand
# as it stands there (BeelStarmon BT25-085 still in it, no digivolution draw). That the
# action is absent from the mask is pinned by
# cards_behavioral bt25_082_warp_is_not_available_in_the_breeding_area.
meta: {produced_by: 20261006T163745972402Z-pilot-three-musketeers-93a263}
interaction: {id: "qa:Q6388", source: qa, kind: positive}
covers: [BT25-082#effect#2]
card: BT25-082
clause: BT25-082#effect#2
seed: 424242
decks:
  p0:
    # stack[0..4] = opening hand; stack[5..9] = security (never flipped: P1
    # never attacks); stack[10..] = draws in order. EVERY digivolution draws a
    # card, so the draw budget is: T3 turn draw, T3 Sparrowmon draw, T5 turn
    # draw, T5 BlackGatomon draw, T5 BeelStarmon draw, T7 turn draw, ...
    # BeelStarmon #2 sits at stack[14] -- drawn BY the grant digivolve -- so
    # exactly one copy is in hand when `using: BT25-085` is lowered, and the
    # drawn copy is what makes BeelStarmon's use-an-Option clause live.
