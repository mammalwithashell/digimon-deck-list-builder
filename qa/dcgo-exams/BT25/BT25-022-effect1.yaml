# Exam scenario: Lunamon (BT25-022), clause BT25-022#effect#1 --
# "[On Play] Reveal the top 3 cards of your deck. Add 1 [Iliad] trait card and
#  1 [TS] trait card among them to the hand. Return the rest to the bottom of
#  the deck."
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). Same shape as BT24-031-effect1.yaml (Elecmon prints the
# identical reveal).
#
# THE LINE: T1, P0 hard-plays Lunamon (cost 3: 0 -> -3, turn passes to P1 at 3
# once the effect resolves). Revealed stack[10..12], in deck order:
#   [10] BT24-084 Inori Misono -- [TS] only (Tamer)
#   [11] BT25-033 Aegiomon     -- [Iliad] + [TS]
#   [12] BT4-104  Blinding Ray -- neither
# The ONLY legal split is Iliad bucket -> Aegiomon, TS bucket -> Inori (the
# TS-only card cannot fill the Iliad bucket; no_duplicate_cards forbids
# Aegiomon in both), Blinding Ray to the bottom. The TS-only card is revealed
# FIRST here (the Elecmon pilot revealed the dual-trait card first), so the
# bucket candidate filtering is exercised from the other side.
#
# WITNESS: one step after resolution (P1's breeding decision, turn 2) P0's hand
# is the 4 unspent opening cards + Aegiomon + Inori; Blinding Ray is neither in
# hand nor trash; Lunamon on the field with no sources.
#
# PROMPT SHAPE: ours = RevealBucket, re-parked per PICK (2 picks) + one
# OrderedPermutation N=1 for the single leftover (sim_only row). DCGO
# (SimplifiedRevealDeckTopCardsAndSelect, 2 conditions) = one SelectCardEffect
# per bucket, possibly a leading generic_bool gate, and NO prompt for a 1-card
# bottom order. Expect the documented RevealBucket per-bucket add-timing quirk
# (one-field p0.hand diff on the 2nd pick row) at the oracle.
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO --
# unconfirmed until the oracle pass.
card: BT25-022
clause: BT25-022#effect#1
seed: 424242
decks:
  p0:
    stack: [BT25-022, BT24-034, BT25-030, BT24-101, BT26-090,
            BT24-031, BT24-083, BT26-029, BT24-102, BT26-092,
            BT24-084, BT25-033, BT4-104, BT25-030, BT24-034]
    rest: ts-jupitermon
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08, BT4-014]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT25-022, from: hand } }
    expect: { prompt: main_phase }
  # THE CLAUSE, pick 1: [Iliad] bucket -> Aegiomon.
  - actor: 0
    do: { select: { cards: [BT25-033] } }
    expect: { prompt: SelectCardEffect }
  # THE CLAUSE, pick 2: [TS] bucket -> Inori Misono.
  - actor: 0
    do: { select: { cards: [BT24-084] } }
    expect: { prompt: SelectCardEffect }
  # SIM-ONLY: the single leftover to the deck bottom (OrderedPermutation N=1).
  - actor: 0
    do: { select: { cards: [BT4-104], sim_only: true } }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 5
    that:
      turn: 2
      p0.hand: [BT24-034, BT25-030, BT24-101, BT26-090, BT25-033, BT24-084]
      p0.field:
        - { card_id: BT25-022, dp: 2000, suspended: false, sources: [] }
      p0.trash: []
