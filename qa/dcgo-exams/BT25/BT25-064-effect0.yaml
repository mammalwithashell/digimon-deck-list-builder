# Exam scenario: ToyAgumon (BT25-064), clause BT25-064#effect#0 -- the special
# digivolution condition "Lv.2 w/[TS] trait: Cost 0".
# 
# DECK NOTE. `tm-toy-black` is a black vanilla shell (Hagurumon/Commandramon/
# Numemon/Tankmon/WaruMonzaemon/HiAndromon/Gotsumon -- no printed text) carrying
# 4x ToyAgumon BT25-064, 4x Thundermon BT8-061 (black Lv.4 vanilla), 4x Cyclonemon
# BT24-011, 4x Vermilimon BT4-014, 4x EX7-070 and 2x BT25-100 (the Options the
# [On Play] reveal needs); eggs 4x Tsunomon BT24-007 -- a PURPLE Lv.2 with the [TS]
# trait whose only text is an inherited trigger on Demon/Titan hand-trashes,
# which never fires here. `tm-quiet-red` is the shared quiet ST1 shell plus Tai /
# Gaia Force for the Neptunemon lines; in these lines P1 does nothing but hold
# security.
# 
# ISOLATION. ToyAgumon's printed circle is Black Lv.2 / cost 0. The egg here is
# Tsunomon BT24-007 -- PURPLE, Lv.2, [TS] -- so the standard circle cannot apply
# and the breeding-area digivolve on T3 is legal ONLY through the special
# condition (DCGO: AddSelfDigivolutionRequirementStaticEffect(HasTSTraits, 0, ...,
# level: 2)). Same cost on both routes is irrelevant here: only one route exists.
# Breeding-area effects are inert (rules 6-4 / glossary), so the [On Play] does not
# fire on a digivolve.
# 
# WITNESS: the digivolve lowers and, after the T5 promote, ToyAgumon stands in the
# battle area over Tsunomon.
card: BT25-064
clause: BT25-064#effect#0
seed: 424242
decks:
  p0:
    stack: [BT25-064, BT8-061, BT2-052, BT3-059, BT2-056, BT3-067, BT5-066, BT2-064, BT4-065, BT2-052, BT3-059, BT2-056, BT3-067, BT5-066]
    rest: tm-toy-black
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08, BT4-014]
    rest: tm-quiet-red
steps:
  # T1 (P0): hatch Tsunomon BT24-007; pass.
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1): nothing.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0): THE CLAUSE -- breeding-digivolve into ToyAgumon (purple Lv.2 base).
  - actor: 0
    do: { digivolve: { from: breeding, using: BT25-064 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1): nothing.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0): promote so the stack is projectable, then pass.
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 9
    that:
      turn: 5
      p0.field:
        - card_id: BT25-064
          dp: 2000
          suspended: false
          sources: [BT24-007]
