# Exam scenario: Tomoro Tenma (BT25-090), clause BT25-090#effect#1 --
# "[All Turns] When any Digimon suspend, by suspending this Tamer, you may
#  place the top 2 cards of your deck face down under this Tamer."
#
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO. It stays unconfirmed until the oracle pass.
#
# THE LINE (memory, P0's view):
#   T1 P0 (0): hard-play Tomoro Tenma (0 -> -4).
#   T2 P1 (4): play Agumon ST1-03 (4 -> 1); pass -> P0 3.
#   T3 P0 (3): [Start of Your Turn] 3 > 2, no change; draw stack[10]; pass
#      -> P1 3.
#   T4 P1 (3): Agumon attacks security -- an OPPONENT's Digimon suspending, on
#      the opponent's turn ("any Digimon", "[All Turns]"). P0 accepts: the
#      Tamer suspends and stack[11] BT25-043 + stack[12] BT25-057 go face down
#      under it. The check flips stack[9] BT25-032 (2000 vs 2000: Agumon is
#      deleted, the security Digimon is trashed).
# WITNESS: Tamer suspended with exactly the two pinned deck-top cards under it.
#
# WHY THE PLACED CARDS ARE BT25-043 / BT25-057: with ST23-03 / ST23-04 placed
# instead, our engine offers <Barrier> (to P1!) and ST23-04's inherited
# [End of Attack] (to P0) from the FACE-DOWN cards under the Tamer -- an
# ENGINE FINDING (see frag-C / the group fragment), kept out of this line so
# the clause stays measurable.
card: BT25-090
clause: BT25-090#effect#1
seed: 424242
decks:
  p0:
    stack: [BT25-090, BT25-049, BT16-082, BT16-082, BT25-043,
            BT25-041, BT25-041, BT25-041, BT25-032, BT25-032,
            BT25-057, BT25-043, BT25-057]
    rest: gd-bt26-1st
  p1:
    stack: [ST1-03, BT1-009, ST1-05, BT3-007, ST1-08,
            ST1-02, ST1-04, BT1-014, BT4-010, BT1-009,
            ST1-04, BT1-014]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT25-090, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-03, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  # THE CLAUSE: Agumon suspending to attack triggers Tomoro Tenma for P0 on
  # P1's turn. One declinable trigger -> DCGO OptionalSkill-shaped row.
  # PROMPT-SHAPE RISK: BT25-090.yaml notes DCGO asks a 3-WAY menu
  # (place-2 / suspend-only / no), likely a generic_int or SelectCountEffect,
  # not a yes/no. If the oracle aborts here, re-author this row as a
  # dcgo_only `value:` row + a sim_only yes.
  - actor: 0
    do: { select: { cards: [BT25-090] } }
    expect: { prompt: OptionalSkill }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  # T4, after the attack (before P1's trailing pass): Tomoro Tenma is
  # SUSPENDED (the cost) and holds the top 2 deck cards face down; the check
  # still happened (security 5 -> 4, BT25-032 trashed after its tie with
  # Agumon, which was deleted).
  - at: 10
    that:
      turn: 4
      p0.memory: -3
      p0.security: 4
      p0.trash: [BT25-032]
      p0.hand: [BT16-082, BT16-082, BT25-043, BT25-049, BT25-057]
      p0.field:
        - card_id: BT25-090
          dp: -1
          suspended: true
          sources: [BT25-043, BT25-057]
      p1.field: []
