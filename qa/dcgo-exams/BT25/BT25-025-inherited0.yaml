# Exam scenario: Aegiochusmon: Blue (BT25-025), clause BT25-025#inherited#0 --
# "[All Turns] [Once Per Turn] When your security stack is removed from, 1 of
#  your [Shaman] trait Digimon may unsuspend."
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). PROVISIONAL: assert block is our engine's result, not
# backfilled from DCGO -- unconfirmed until the oracle pass.
#
# THE CARRIER is Minervamon BT24-041 (Shaman) digivolved onto Aegiochusmon:
# Blue, so Aegiochusmon is a digivolution card and its inherited text is live.
#
# THE LINE.
#   T1 (P0, 0): pass -> P1 3.
#   T2 (P1, 3): Biyomon ST1-02 (2): 3 -> 1; pass -> P0 3.
#   T3 (P0, 3): hard-play Aegiochusmon (8): 3 -> -5. [On Play]: ONE mandatory
#       <De-Digivolve 1> pick -> Biyomon (bare Lv.3); security 5 -> no
#       unsuspend. -> P1 5.
#   T4 (P1, 5): pass -> P0 3.
#   T5 (P0, 3): digivolve Minervamon onto Aegiochusmon. Two routes are open
#       (black Lv.5 circle = 4, "Lv.5 w/[TS] trait" = 3) -> the cost choice
#       (ours: EffectChoice; DCGO: SelectCountEffect) answered `value: 3`:
#       3 -> 0. Minervamon's [When Digivolving]: P0's hand holds NO play-cost
#       <=5 [Iliad] card (stacked on purpose), so the optional free play has
#       no candidate and is skipped; then <De-Digivolve 1> x (1 Digimon) on
#       Biyomon -- ONE mandatory pick, nothing trashed.
#       Minervamon attacks P1's security (p1 stack[9] Monodramon BT1-009,
#       3000, loses) and is SUSPENDED.
#       Blinding Ray BT4-104 (cost 0, yellow req met by Minervamon): trash the
#       top security card (p0 stack[9] = Mervamon BT26-081), gain 2 -> memory 2.
#       (NOT Jupitermon BT24-101 on top: our engine fires a security-trashed
#       BT24-101's "[All Turns] When your security stack is removed from"
#       trigger FROM THE TRASH -- a suspected engine bug, measured while
#       authoring; the line steers around it so this clause is measured alone.)
#       THE CLAUSE: the security stack was removed from -> P0 unsuspends
#       Minervamon (its only [Shaman] Digimon).
#   Trailing pass.
#
# WITNESS: Minervamon suspended after the attack, UNSUSPENDED after Blinding
# Ray; p0.security 4; BT26-081 + BT4-104 in p0.trash.
#
# PROMPT SHAPE: ours = ONE optional OwnField pick (the effect's optionality
# folds into the declinable pick), preceded by a sim-only TriggerOrder between
# Blinding Ray's trash disposal and the trigger. DCGO (BT25-025.yaml
# crosscheck): canNoSelect: true SelectPermanentEffect. If DCGO also raises an
# OptionalSkill gate in front of the pick, the oracle aborts at the pick row
# and it needs an `optional_gate_fold` / dcgo_only yes row.
card: BT25-025
clause: BT25-025#inherited#0
seed: 424242
decks:
  p0:
    stack: [BT25-025, BT24-041, BT4-104, BT26-029, BT25-044,
            BT25-030, BT24-031, BT26-073, BT24-101, BT26-081,
            BT26-103, BT26-083, BT24-101, BT24-031, BT25-033]
    rest: ts-jupitermon
  p1:
    stack: [ST1-02, ST1-03, ST1-04, BT1-009, BT3-007,
            BT1-014, BT4-010, BT3-007, ST1-02, BT1-009,
            ST1-04, ST1-03, BT1-014, BT4-010, ST1-05, ST1-08]
    rest: tm-quiet-red
steps:
  # T1 (P0): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, 3): Biyomon, pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, 3): hard-play Aegiochusmon; [On Play] de-digivolve on Biyomon.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT25-025, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # T4 (P1, 5): all-pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, 3): Minervamon onto Aegiochusmon ([TS] route, 3).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT24-041 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { value: 3 } }
    expect: { prompt: SelectCountEffect }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { play: { card: BT4-104, from: hand } }
    expect: { prompt: main_phase }
  # SIM-ONLY: our 9-1-5 ordering between Blinding Ray's disposal and the
  # inherited trigger (TriggerOrder [BT4-104, BT25-025]); DCGO hard-codes the
  # disposal and asks nothing, so this row takes DCGO's order.
  - actor: 0
    do: { select: { cards: [BT4-104], sim_only: true } }
  # THE CLAUSE: unsuspend Minervamon.
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 15
    that:
      p0.memory: 0
      p0.security: 5
      p0.field:
        - { card_id: BT24-041, dp: 12000, suspended: true, sources: [BT25-025] }
  - at: 18
    that:
      turn: 5
      p0.memory: 2
      p0.security: 4
      p0.trash: [BT26-081, BT4-104]
      p0.field:
        - { card_id: BT24-041, dp: 12000, suspended: false, sources: [BT25-025] }
