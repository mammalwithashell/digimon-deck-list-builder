# Exam scenario: Lunamon (BT25-022), clause BT25-022#effect#0 -- the special
# digivolution condition "[Digivolve] Lv.2 w/[TS] trait: Cost 0".
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). ts-jupitermon's eggs are 4x Tsunomon BT24-003 -- YELLOW,
# Lv.2, [Lesser/Iliad/TS].
#
# ISOLATION: Lunamon's printed circles are Blue Lv.2 / 0 and Red Lv.2 / 0
# (official bundle). A YELLOW egg satisfies neither, so the digivolve below is
# legal ONLY through the [TS] special condition. A single legal route => no
# cost-route choice prompt on either side.
#
# THE LINE:
#   T1 (P0, memory 0): hatch Tsunomon; THE CLAUSE -- digivolve Lunamon over it
#      in the breeding area for 0 (memory stays 0, P0 keeps the turn; the
#      digivolve bonus draws stack[10]). Lunamon's [On Play] does not fire on a
#      digivolve; Tsunomon's inherited trigger (security removed) is not live in
#      breeding. Pass -> P1 3.
#   T2 (P1): all-pass -> P0 3.
#   T3 (P0): move the stack to the battle area so its sources are assertable.
#
# WITNESS: after the digivolve P0 is still in its main phase at memory 0 and
# holds the pinned stack[10] draw; on T3 the moved stack is Lunamon over
# Tsunomon.
#
# PROMPT SHAPE: no selection at all on our side. DCGO: none expected (single
# route; a cost-route SelectCountEffect would be a finding).
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO --
# unconfirmed until the oracle pass.
card: BT25-022
clause: BT25-022#effect#0
seed: 424242
decks:
  p0:
    stack: [BT25-022, BT24-034, BT25-030, BT24-101, BT26-090,
            BT24-031, BT24-083, BT26-029, BT24-102, BT26-092,
            BT24-084, BT25-033, BT4-104]
    rest: ts-jupitermon
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014, BT4-010]
    rest: tm-quiet-red
steps:
  # T1 (P0, memory 0)
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  # THE CLAUSE: Lunamon over the yellow [TS] Lv.2 for 0.
  - actor: 0
    do: { digivolve: { from: breeding, using: BT25-022 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, memory 3): move out, then end.
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 2
    that:
      turn: 1
      p0.memory: 0
      p0.hand: [BT24-034, BT25-030, BT24-101, BT26-090, BT24-084]
      p0.field: []
  - at: 6
    that:
      turn: 3
      p0.memory: 3
      p0.field:
        - { card_id: BT25-022, dp: 2000, suspended: false, sources: [BT24-003] }
