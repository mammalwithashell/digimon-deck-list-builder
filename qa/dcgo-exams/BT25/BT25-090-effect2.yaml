# Exam scenario: Tomoro Tenma (BT25-090), clause BT25-090#effect#2 --
# "[Your Turn] [Once Per Turn] When you would use [Glowing Dawn] trait Option
#  cards, by trashing the bottom face-down card from under any of your Tamers,
#  reduce the cost by 1."
#
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO. It stays unconfirmed until the oracle pass.
#
# THE LINE (memory, P0's view):
#   T1 P0 (0): hard-play Tomoro & Kyo ST23-13 (0 -> -4); place yes: stack[10]
#      ST23-03 under it.
#   T2 P1 (4): pass -> P0 3.
#   T3 P0 (3): draw stack[11]; ST23-13 SOMP place yes: stack[12] ST23-04.
#      Use e-Pulse #1 (3 -> 0): its [Main] plays Tomoro Tenma BT25-090 free.
#      Pass -> P1 3.
#   T4 P1 (3): pass -> P0 3.
#   T5 P0 (3): BT25-090 [Start of Your Turn]: 3 > 2, no change. Draw
#      stack[13]. SOMP: Tamer place yes (stack[14] BT25-041 -> bottom),
#      e-Pulse #1 relocate declined. Use e-Pulse #2 ([Glowing Dawn] Option,
#      cost 3) -> THE CLAUSE: trash BT25-041 from under ST23-13, cost 3 -> 2
#      (3 -> 1). Its [Main] free play has no candidate (hand BT16-082 x3,
#      trash BT25-041 cost 7).
# WITNESS: memory 1 after a 3-cost Option; BT25-041 in the trash.
card: BT25-090
clause: BT25-090#effect#2
seed: 424242
decks:
  p0:
    stack: [ST23-13, ST23-15, BT25-090, ST23-15, BT16-082,
            BT25-032, BT25-032, BT25-032, BT25-043, BT25-043,
            ST23-03, BT16-082, ST23-04, BT16-082, BT25-041]
    rest: gd-bt26-1st
  p1:
    stack: [ST1-03, BT1-009, ST1-05, BT3-007, ST1-08,
            ST1-02, ST1-04, BT1-014, BT4-010, BT1-009,
            ST1-04, BT1-014]
    rest: tm-quiet-red
steps:
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: ST23-13, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { yes: true } }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { select: { yes: true } }
  - actor: 0
    do: { play: { card: ST23-15, from: hand.0 } }
    expect: { prompt: main_phase }
  # T3 e-Pulse #1 [Main]: play Tomoro Tenma free from hand (trash empty ->
  # DCGO's zone menu collapses to SelectHandEffect). BT25-090 enters AFTER
  # this Option's use, so its reducer is not live for it.
  - actor: 0
    do: { select: { cards: [BT25-090] } }
    expect: { prompt: SelectHandEffect }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  # T5 SOMP: the Tamer's place (accepted: stack[14] BT25-041 goes to the
  # BOTTOM) and e-Pulse #1's relocate (declined: SelectPermanentEffect
  # canNoSelect:true -> cancel), so e-Pulse #1 stays on the field.
  - actor: 0
    do: { select: { cards: [ST23-13] } }
    expect: { prompt: MultipleSkills, count: 2, candidates: [ST23-13, ST23-15] }
  - actor: 0
    do: { select: { yes: true } }
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { play: { card: ST23-15, from: hand } }
    expect: { prompt: main_phase }
  # THE CLAUSE. Ours: an EffectChoice accept gate, then the Tamer pick.
  # DCGO (BT25-090.yaml crosscheck): one skippable/canNoSelect Tamer pick is
  # the accept, so OUR gate is a sim-only row and the pick is the shared row.
  # Only Tomoro & Kyo (own.field.0) holds face-down cards.
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect, count: 1 }
  # The trash fires Tomoro & Kyo's [Your Turn] trash trigger (ST23-13#effect#1).
  # P0 has NO Digimon, so the +3000 has no target; declined. (Ours offers it
  # anyway; DCGO's CanActivate only checks the suspend cost, so it is expected
  # to ask too. It resolves before the Option's [Main] in our engine -- if
  # DCGO defers it past the [Main], this row moves; the [Main] has no
  # candidate so no state differs.)
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: OptionalSkill }
  - actor: 0
    do: { pass: {} }
assert:
  # T5 after the second e-Pulse resolved (before P0's pass): it cost 2, not 3
  # (memory 3 -> 1); the bottom face-down card under Tomoro & Kyo (BT25-041,
  # placed by this turn's SOMP) is the only card in the trash; both e-Pulses
  # sit in the battle area; the [Main]'s free play had no candidate.
  - at: 20
    that:
      turn: 5
      p0.memory: 1
      p0.trash: [BT25-041]
      p0.hand: [BT16-082, BT16-082, BT16-082]
      p0.field:
        - card_id: BT25-090
          dp: -1
          suspended: false
          sources: []
        - card_id: ST23-13
          dp: -1
          suspended: false
          sources: [ST23-03, ST23-04]
        - card_id: ST23-15
          dp: -1
          suspended: false
          sources: []
        - card_id: ST23-15
          dp: -1
          suspended: false
          sources: []
