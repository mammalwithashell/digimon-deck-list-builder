# Exam scenario: Monarchlizamon (BT25-057), clause BT25-057#effect#4 --
# DUAL Option face "[Main] 1 of your Digimon gains <Rush>, <Security A. +1>
#  and +5000 DP until your opponent's turn ends. Then, it may attack."
#  (official Bandai DB text, data/card_bundles/BT25-057.md) -- WHEN the used
# Option finishes relative to the attack its [Main] declared.
#
# The same line as BT25-057-effect4.yaml up to the attack declaration
# (Cougarmon ST23-03 buffed to 9000, attacks the player), but the <Arts
# Digivolve> offer is ACCEPTED onto the attacking Cougarmon.
#
# It discriminates the two orders:
#   Order A (DCGO; the engine since 2026-11-25): the Option finishes at the
#     DECLARATION. The very next decision is the Arts SelectPermanentEffect
#     (step 18, pinned), with p1's security still 5 and nothing in p1's trash
#     (assert at 18). Accepted, Cougarmon becomes Monarchlizamon (13000 DP,
#     still suspended as the attacker) before any security check (assert at
#     19). Its two [When Digivolving] effects then order together with
#     ST23-01's inherited [When Attacking] (steps 19 and 23), and the attack
#     checks two security cards (assert at 26).
#   Order B (the removed "hold until the attack ends"): step 18 would meet
#     ST23-01's OptionalSkill instead, and the security checks would come
#     before any Arts offer -- the line aborts at step 18.
# DCGO basis: AttackProcess.cs:242 (`State = AttackState.Counter`, Attack()
# returns at the declaration), SelectAttackEffect.cs:547,
# CardController.cs:2026-2129 (Arts resolution / trash in UseOption),
# TurnStateMachine.cs:1277-1286 ([When Attacking] and the attack run after);
# ArtsDigivolve.cs (SelectPermanentEffect, canNoSelect: true, PlayCard with
# activateETB). Official Q4962 / Q4346; Q6344: Monarchlizamon's own [When
# Attacking] does NOT activate for this attack -- only its [When
# Digivolving] pair is offered (the TriggerOrder lists [ST23-01, BT25-057,
# BT25-057]). Owner default "Generally let's look to match dcgo", applied to
# this card by the orchestrator (G-ENGINE-OPTION-BODY-ATTACK-NOT-HELD,
# resolved by reversal).
#
# PROVISIONAL: every assert below is OUR engine's result (sim-only), not
# backfilled from DCGO. It stays unconfirmed until an oracle pass.
#
# Prompt notes: step 19 and step 23 pick from OUR TriggerOrder list by card
# identity (DCGO: MultipleSkills); step 20 is our sim-only you-may gate on
# the optional De-Digivolve (see BT25-057-effect5.yaml); the De-Digivolve
# trashes BT26-089's bottom face-down card (step 21) and targets Biyomon
# (step 22); the optional battle (step 24) and ST23-01's [When Attacking]
# (step 25) are declined.
