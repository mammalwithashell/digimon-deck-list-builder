# Exam scenario: Callismon (BT25-058), clause BT25-058#effect#4 --
# "[On Play] [When Digivolving] [When Attacking] [Once Per Turn] You may suspend
#  1 of your opponent's Digimon or Tamers. Then, 1 of their Digimon or Tamers
#  can't unsuspend until their turn ends."
#
# This file exercises the [When Digivolving] arm.
#
# PROMPT SHAPE. BT25_058.cs registers the shared body with `optional: false`,
# so DCGO opens NO OptionalSkill gate; the "may" lives on the FIRST pick
# (`SelectPermanentEffect`, Mode.Tap, `canNoSelect: true`) and the second pick
# is mandatory (`canNoSelect: false`, the can't-unsuspend lock). Our YAML is
# the same shape: no effect-level `optional`, a declinable first
# `select_opponent_permanent`, a mandatory second one. Two picks, 1:1.
#
# THE WITNESS. p1's Biyomon (ST1-02), played on T2, is suspended by the first
# pick and locked by the second. At p1's T6 breeding step -- AFTER p1's
# unsuspend phase -- it still reads suspended. That is the lock; a merely
# suspended Digimon would have unsuspended there.
#
# THE LINE is BT25-058-effect0.yaml's prefix with p1 playing Biyomon on T2
# (3 -> 1, then passing out) so a target exists when Callismon digivolves.
#
# Book: qa/dcgo-exams/BT25/tm_bt25_058_pool.json (--decks).
card: BT25-058
clause: BT25-058#effect#4
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4): the Lv.5 to hard-play, the Callismon, inert filler
      - BT24-014
      - BT25-058
      - ST1-04
      - ST1-04
      - BT1-009
      # security (5-9): stack[9] is the TOP
      - ST1-05
      - ST1-05
      - BT1-014
      - BT1-014
      - ST1-02
      # (10+): p0's turn draws, in order
      - BT4-014
      - BT4-014
      - BT4-010
      - BT4-010
    rest: tm-callismon
  p1:
    stack:
      # hand (0-4): the Biyomon that gets suspended and locked, inert filler
      - ST1-02
      - ST1-03
      - ST1-04
      - BT1-009
      - BT3-007
      # security (5-9): stack[9] is the TOP
      - ST1-05
      - BT1-014
      - BT4-010
      - ST1-04
      - ST1-02
      # (10+): p1's turn draws, in order
      - BT4-014
      - ST1-08
      - ST1-10
      - BT1-014
    rest: quiet-opponent-tm
steps:
  # T1 (p0, memory 0): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (p1, memory 3): play Biyomon for 2 (3 -> 1), pass out.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (p0, memory 3): hard-play Aegiochusmon for 8 (3 -> -5). No [On Play].
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT24-014, from: hand } }
    expect: { prompt: main_phase }
  # T4 (p1, memory 5): all-pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (p0, memory 3): digivolve Callismon for 4 (3 -> -1) -- THE CLAUSE.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT25-058 } }
    expect: { prompt: main_phase }
  # First pick ("you may suspend"): Biyomon.
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # Second pick (mandatory lock): Biyomon again.
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # T6 (p1): THE WITNESS. p1's unsuspend phase has run and Biyomon is still
  # suspended.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 13
    that:
      turn: 6
      p0.memory: -1
      p1.field:
        - card_id: ST1-02
          dp: 3000
          suspended: true
          sources: []
      p0.field:
        - card_id: BT25-058
          dp: 13000
          suspended: false
          sources: [BT24-014]
