#   T1 (P0, 0): hatch Tsunomon BT24-003; digivolve Coronamon over it in the
#      breeding area -- THE CLAUSE (cost 0, memory stays 0); digivolve-draw
#      stack[10] BT26-085. Pass.
#   T2 (P1, 3): pass, pass.
#   T3 (P0, 3): move the stack out (Coronamon's [When Moving] pick declined)
#      so the stack becomes observable on p0.field.
#
# WITNESS: at 2 (after the digivolve) memory still 0, Coronamon left the hand
# and the digivolve-draw BT26-085 arrived; at 7 p0.field shows Coronamon with
# exactly [BT24-003] under it.
#
# PROMPT SHAPE: one route at one cost -> no cost-choice prompt on either side.
# The [When Moving] decline: ours = declinable Hand pick; DCGO =
# SelectHandEffect canNoSelect (optional:false shared effect, no OptionalSkill).
#
# PARTIAL: the cost (0) is not distinguishable from the circles' cost (also
# 0) -- only the colour/route is isolated. Negative control (a non-[TS] Lv.2
# of a foreign colour being refused) is not in the line.
#
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
