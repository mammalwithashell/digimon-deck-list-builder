# Exam scenario: Coronamon (BT25-008), clause BT25-008#effect#0 --
# "[Digivolve] Lv.2 w/[TS] trait: Cost 0" (special digivolution condition).
#
# Book: qa/dcgo-exams/BT26/chronomon_mervamon_pool.json + this pass's variant
# book (variants-A.json). P0 = VARIANT `cm-chronomon-iso`: `bt26-chronomon`
# with 1-for-1 swaps BT9-103 -> BT25-022 Lunamon (blue Lv.3 [TS]), BT25-092 ->
# BT25-039 Sirenmon, BT26-033 -> BT25-034 Angemon, and the egg deck 4x
# BT26-001 -> 4x BT24-003 Tsunomon (YELLOW Lv.2, [TS] trait). P1 = `tm-quiet-red`.
