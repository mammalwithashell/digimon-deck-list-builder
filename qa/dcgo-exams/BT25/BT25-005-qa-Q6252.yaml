# Exam scenario (adversarial, qa:Q6252): Pagumon (BT25-005), clause
# BT25-005#inherited#0 -- "a Digimon card with [Three Musketeers] in its text
# or the [TS] trait". Official ruling Q6252: "X in its text" covers name,
# traits, effects, inherited effects, (Rule) and digivolution requirements.
#
# Same line as BT25-005-inherited0.yaml, but the ONLY hand card that can
# answer the clause is Scopemon BT21-071: Lv.4, trait [Monitoring] (NOT [TS]),
# so it qualifies purely through "[Three Musketeers] in its text" (its effect
# text "[Three Musketeers] trait" and its alt digivolution requirement
# "Lv.3 w/[Three Musketeers] in text"). The ToyAgumon base is RED, so Scopemon's
# purple circle fails and its alt-circle (cost 2, reduced to 0) is the one
# route. No hand card carries [Appmon] / [Three Musketeers] trait, so
# Scopemon's [When Digivolving] cost has no candidate.
interaction: {id: "qa:Q6252", source: qa, kind: positive}
meta: {produced_by: 20261006T205355914713Z-pilot-three-musketeers-1fcf61}
covers: [BT25-005#inherited#0]
card: BT25-005
clause: BT25-005#inherited#0
seed: 424242
decks:
  p0:
    # stack[0..4] = opening hand: ToyAgumon, LadyDevimon, Bind Red Trigger,
    # Scopemon (text-only match), BT24-081 (Lv.7 filler; never played).
    # stack[5..9] = security (never flipped: P1 never attacks).
    # stack[10..] = draws in order: T3 turn draw, T3 digivolve draw, T5 turn
    # draw, LadyDevimon's <Draw 1>, the clause's digivolve draw. All Lv.3
    # Gazimon / a Lv.6 -- none is a Lv.4 [TS] / TM-text card, so the clause's
    # hand pick has exactly ONE candidate, and no TM-text Tamer ever reaches
    # the hand.
    stack: [EX7-008, BT25-083, P-180, BT21-071, BT24-081,
            BT21-074, BT21-074, BT25-085, BT25-085, BT25-085,
            BT25-078, BT25-078, BT25-078, BT25-078, BT25-058]
    rest: tm-pagumon-bt25-005-egg
  p1:
    stack: [ST1-03, ST1-04, ST1-04, BT1-009, BT3-007,
            ST1-02, ST1-02, ST1-04, ST1-02, ST1-02,
            BT3-007, BT3-007, BT3-007]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0): hatch Pagumon.
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1): nothing.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, 3): breeding-digivolve ToyAgumon onto the BLACK Pagumon through
  # its "[Three Musketeers] in text" alt-circle for 0 (draw 1). No breeding
  # prompt: Pagumon is a Lv.2 in an occupied breeding area. ToyAgumon has
  # only an [On Play], which a digivolve does not fire.
  - actor: 0
    do: { digivolve: { from: breeding, using: EX7-008 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1): nothing.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, 3): promote the ToyAgumon stack (no [When Moving]; nothing fires).
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  # The PLACING EFFECT: play LadyDevimon (3 -> -4); her [On Play] resolves
  # before the turn passes.
  - actor: 0
    do: { play: { card: BT25-083, from: hand } }
    expect: { prompt: main_phase }
  # DCGO's zone menu: 1 = "Hand". Wire-only -- our engine folds the zone into
  # the pick below.
  - actor: 0
    do: { select: { value: 1, dcgo_only: true } }
    expect: { prompt: generic_int }
  # SHARED: the [Three Musketeers] trait card from hand -- Bind Red Trigger.
  - actor: 0
    do: { select: { cards: [P-180] } }
    expect: { prompt: SelectHandEffect }
  # SHARED: the Digimon that receives it -- the ToyAgumon stack over Pagumon
  # (P0's field.0; LadyDevimon is field.1). <Draw 1> then resolves, and the
  # OnAddDigivolutionCards window fires THE CLAUSE.
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # THE CLAUSE, decision 1: "it may digivolve" -- DCGO's OptionalSkill on the
  # lone stacked trigger; our outer yes/no. Accepted.
  - actor: 0
    do: { select: { yes: true } }
    expect: { prompt: OptionalSkill }
  # THE CLAUSE, decision 2: the hand card -- Scopemon (no [TS] trait; TM only
  # in its text), the only candidate; alt-circle cost 2 is reduced to 0.
  # The stack digivolves; memory stays -4.
  - actor: 0
    do: { select: { cards: [BT21-071] } }
    expect: { prompt: SelectHandEffect }
  # DCGO-only: Scopemon's own optional [When Digivolving] is still offered
  # (its activation check does not look for a legal [Appmon]/[Three Musketeers]
  # trait card; the hand holds only [TS] cards and the trash is empty), then
  # does nothing. Our engine skips the prompt. Declined.
  - actor: 0
    do: { select: { decline: true, dcgo_only: true } }
    expect: { prompt: OptionalSkill }
  # One step past the clause: memory -4 -> seat P1 (T6; P1's breeding area
  # is empty, so its breeding prompt opens).
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert: []
