# Exam scenario: Marsmon (BT25-020), clause BT25-020#effect#0 --
# "[Digivolve] Lv.5 w/[TS] trait: Cost 3"   (special digivolution condition)
#
# Book: $S/book-F.json = chronomon_mervamon_pool.json + variants-F.json.
# P0 = VARIANT `cm-ts-mervamon-cresc` (bt26-ts-mervamon with BT24-051
# Merukimon x1 -> BT25-026 Crescemon x1); P1 = `tm-quiet-red`.
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO -- unconfirmed until the oracle pass.
#
# ISOLATION. Marsmon's circles are Red Lv.5 / 4 and Green Lv.5 / 4. Every
# Lv.5 in the real list is red or green (Sirenmon, Aegiochusmon: Dark) except
# Locomon, whose [On Play] reveal opens a reveal pick + top/bottom ordering.
# Crescemon BT25-026 is a BLUE Lv.5 [TS] with a vacuous [On Play] against an
# empty board, so both circles FAIL and the only legal route is the clause:
# one path, one cost, no cost-choice prompt; the memory delta (3 -> 0) pins
# the cost at 3. `ignore_requirements` on the route is not separately
# witnessable here (the [TS] base meets no other requirement anyway).
#
# THE LINE:
#   T1 (P0, 0): hard-play Crescemon (6) -> -6.
#   T2 (P1, 6): all-pass -> P0 3.
#   T3 (P0, 3): draw stack[10]; THE CLAUSE: digivolve Crescemon -> Marsmon
#      for 3 (3 -> 0), draw stack[11]. Marsmon's [When Digivolving]
#      (#effect#2) gives +3000 to itself (12000 -> 15000); its optional
#      battle has no target, so neither side asks. Pass.
#
# WITNESS (at 7, before T3's pass): memory 0, Marsmon (15000) over Crescemon.
#
# PROMPT SHAPE: the +3000 pick is ours OwnField (mandatory) vs DCGO
# SelectPermanentEffect canNoSelect:false; no attacker pick on either side
# (empty opponent board).
card: BT25-020
clause: BT25-020#effect#0
seed: 424242
decks:
  p0:
    stack: [BT25-026, BT25-020, BT8-097, BT24-083, BT26-088,   # hand
            BT24-102, BT24-102, BT24-102, BT24-102, BT8-097,   # security (never flipped)
            BT26-092, BT26-092]                                # T3 draw, T3 digivolve-draw
    rest: cm-ts-mervamon-cresc
  p1:
    stack: [ST1-03, ST1-04, BT1-009, BT3-007, ST1-08, BT1-014, BT4-010, BT3-007, BT1-009, ST1-02, ST1-04, ST1-03, BT1-014]
    rest: tm-quiet-red
steps:
  # T1 (P0, memory 0): hard-play Crescemon (0 -> -6); its [On Play] is
  # vacuous (P1 has no Digimon) and prompts nothing.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT25-026, from: hand } }
    expect: { prompt: main_phase }
  # T2 (P1, memory 6): all-pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, memory 3): THE CLAUSE -- Crescemon -> Marsmon via the [TS]
  # route only (3 -> 0); digivolve-draw stack[11].
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT25-020 } }
    expect: { prompt: main_phase }
  # Marsmon [When Digivolving] (#effect#2): +3000 to Marsmon.
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # No "may battle" attacker pick: P1 has no Digimon, and (like DCGO) our
  # engine opens it only when the opponent has a Digimon to target. (Until
  # the 2026-10-04 BT25-020.yaml fix this needed a sim-only decline row.)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 7
    that:
      turn: 3
      p0.memory: 0
      p0.hand: [BT24-083, BT26-088, BT26-092, BT26-092, BT8-097]
      p0.field:
        - { card_id: BT25-020, dp: 15000, suspended: false, sources: [BT25-026] }
