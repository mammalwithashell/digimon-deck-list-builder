# Exam scenario: Dianamon (BT25-028), clause BT25-028#effect#0 --
# the special digivolution condition "[Digivolve] Lv.5 w/[TS] trait: Cost 3".
#
# THE WITNESS. Dianamon digivolves onto Aegiochusmon (BT24-014, a RED/YELLOW
# Lv.5 with the [TS] trait). Dianamon's printed circle is Blue Lv.5 / cost 4,
# which a red/yellow source cannot satisfy, so the only path that makes the
# digivolve legal is the alt condition under exam, and the memory delta
# (3 -> 0) pins its cost at exactly 3. One applicable path on both sides, so
# no cost-choice prompt opens. Aegiochusmon is HARD-PLAYED on T3 (cost 8, an
# overshoot to -5) so its own [When Digivolving] is never reached; it has no
# [On Play], and its <Decode> only fires on a non-battle leave.
#
# TRIGGERS AFTER THE DIGIVOLVE. Two of Dianamon's own effects fire in the same
# window: the shared [On Play][When Digivolving] body (#effect#2) and
# "[All Turns] When any Digimon are played or digivolve" (#effect#3), whose
# DCGO CanUseCondition is satisfied by Dianamon's OWN digivolve. Both are
# CanActivate-true, so DCGO opens MultipleSkills over two candidates that
# share one card id; the row is answered by ORDINAL (no keyword names either
# branch). ordinal 0 is predicted to be the [When Digivolving] body on both
# sides -- registration order in BT25_028.cs, effect order in BT25-028.yaml.
# If DCGO orders them the other way the run aborts at this row and THAT is
# the finding (see NOTES-BT25-028.md).
#   1. MultipleSkills (p0): pick the [When Digivolving] body.
#   2. Its lock ("None of your opponent's Digimon with 1 or fewer digivolution
#      cards can suspend") is installed with no prompt; then ONE
#      SelectPermanentEffect (canNoSelect: false) deletes 1 unsuspended
#      opponent Digimon -- Biyomon ST1-02, played by p1 on T2 so the body has
#      a target (a bare Lv.3, so it is also locked; the lock itself is not
#      projected).
#   3. The lone remaining [All Turns] body activates without a second
#      MultipleSkills row and is silent: p1's board is empty after the delete
#      (SelectTrashDigivolutionCards breaks out with no permanents) and p0 has
#      a single Digimon (the DNA helper needs two).
#
# Memory ledger:
#   T1 p0 passes                          -> p1 3
#   T2 p1 plays Biyomon (2): 3 -> 1, pass -> p0 3
#   T3 p0 plays Aegiochusmon (8): 3 -> -5 -> p1 5
#   T4 p1 passes                          -> p0 3
#   T5 p0 digivolves Dianamon (3): 3 -> 0, passes -> p1 3
#
# Book: qa/dcgo-exams/BT25/tm_bt25_028_pool.json (--decks).
card: BT25-028
clause: BT25-028#effect#0
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4): the Lv.5 to hard-play, the Dianamon, inert filler
      - BT24-014
      - BT25-028
      - ST1-04
      - ST1-04
      - BT1-009
      # security (5-9): never flipped
      - ST1-05
      - ST1-05
      - BT3-007
      - BT3-007
      - ST1-02
      # (10+): p0's T3 / T5 turn draws
      - BT4-010
      - BT3-007
    rest: tm-ts-line
  p1:
    stack:
      # hand (0-4): the Biyomon the delete pick takes, inert filler
      - ST1-02
      - ST1-03
      - ST1-04
      - BT1-009
      - BT3-007
      # security (5-9): never flipped
      - ST1-05
      - ST1-08
      - ST1-04
      - ST1-04
      - ST1-02
      # (10+): p1's T2 / T4 / T6 turn draws
      - BT1-009
      - ST1-08
      - ST1-10
    rest: tm-ts-opponent
steps:
  # T1 (p0, memory 0): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (p1, memory 3): play Biyomon for 2 (3 -> 1), pass out.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (p0, memory 3): hard-play Aegiochusmon for 8 (3 -> -5). No [On Play].
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT24-014, from: hand } }
    expect: { prompt: main_phase }
  # T4 (p1, memory 5): all-pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (p0, memory 3): THE CLAUSE -- digivolve Dianamon onto the [TS] Lv.5
  # for 3 (3 -> 0).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT25-028 } }
    expect: { prompt: main_phase }
  # DCGO-ONLY: DCGO stacks Dianamon's two same-card triggers and asks
  # MultipleSkills; on a DIGIVOLVE our engine bundles nothing and parks the
  # [When Digivolving] delete pick directly (observed at lowering -- see
  # NOTES-BT25-028.md). ordinal 0 is answered against DCGO's own list; whichever
  # body it names, the other runs right after, and the [All Turns] body is
  # silent here, so the wire and the end state are the same either way.
  # `count:` on a MultipleSkills row is the PICKS THE PROMPT ASKS FOR (always 1 --
  # MultipleSkills.cs:597-599 passes the literal 1 to TryAnswerStep), NOT the number
  # of stacked bodies. The stack size is asserted by `candidates:` below. Authored as
  # `count: 2` until 2026-09-21, which aborted this line before the candidate multiset
  # was ever compared ('expected count 2 but DCGO asked for count 1').
  - actor: 0
    do: { select: { cards: [BT25-028], ordinal: 0, dcgo_only: true } }
    expect: { prompt: MultipleSkills, count: 1, candidates: [BT25-028, BT25-028] }
  # The mandatory delete: Biyomon, p1's only Digimon.
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # SIM-ONLY: our engine then parks a yes/no gate for the [All Turns] body
  # (`optional: true` in BT25-028.yaml) although there is nothing it could
  # trash and no [GraceNovamon] in hand; DCGO runs that body with no prompt.
  # Declined here -- zero wire rows.
  - actor: 0
    do: { select: { decline: true, sim_only: true } }
    expect: { prompt: OptionalSkill }
  # Memory 0: p0 still holds the turn; pass out.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T6 (p1): one step past the clause.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 14
    that:
      p0.memory: 0
      p0.field:
        - card_id: BT25-028
          dp: 12000
          suspended: false
          sources: [BT24-014]
      p1.field: []
      p1.trash: [ST1-02]
  - at: 15
    that:
      turn: 6
      p0.field:
        - card_id: BT25-028
          dp: 12000
          suspended: false
          sources: [BT24-014]
      p1.field: []
      p1.trash: [ST1-02]
