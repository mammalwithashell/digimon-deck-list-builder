# Exam scenario: Armalizamon (BT25-049), clause BT25-049#inherited#0 --
# INHERITED "<Piercing> (When this Digimon deletes your opponent's Digimon in
#  battle while attacking, it checks security before the attack ends.)"
#
# PROVISIONAL: the assert block is OUR engine's result, not backfilled from
# DCGO. It stays unconfirmed until the oracle pass (NOTES-GLOWING-DAWN.md).
#
# THE LINE (memory ledger in brackets):
#   T1 P0 [0]: hatch Kekkomon (ST23-01); digivolve in the breeding area into
#       Chiropmon ST23-12 (alt "Lv.2 w/[Glowing Dawn]", cost 0) [0] and on into
#       Armalizamon (alt "Lv.3 w/[Glowing Dawn]" -- purple Chiropmon misses
#       the green circle -- cost 2) [-2]. Breeding: nothing activates.
#   T2 P1 [2]: plays Monodramon BT1-009 (cost 2) [0], passes.
#   T3 P0 [3]: move Armalizamon to the battle area; pass (no attack).
#   T4 P1 [3]: Monodramon attacks P0's security; the top card (stack[9],
#       Ukkomon BT16-082, 2000, no [Security] effect) loses the security
#       battle. Monodramon ends the turn SUSPENDED. P1 passes.
#   T5 P0 [3]: digivolve Armalizamon into Murasamemon BT25-041 (yellow circle
#       misses green -> only the "Lv.4 w/[Glowing Dawn]" alt, cost 3) [0].
#       BT25-041's "[When Digivolving][When Attacking][Once Per Turn] ... you
#       may play or use ..." is DECLINED at both timings (declining does not
#       spend the once-per-turn). <Alliance> has no other Digimon to suspend.
#       Murasamemon (7000) attacks the suspended Monodramon (3000) -> deleted.
#   THE CLAUSE: the only <Piercing> in play is inherited from Armalizamon in
#       the sources -> security check: P1's top (ST1-02, 3000) is trashed.
#   Witness: P1 security 5 -> 4 on an attack that targeted a Digimon, P1 trash
#   [BT1-009, ST1-02].
#
# WHY CHIROPMON, NOT LIOLLMON, AT LV.3: built first on Liollmon BT25-032
# (inherited <Barrier>). ENGINE FINDING: with a <Barrier> source under the
# ATTACKER, deleting the defender parks a "May accept replacement: <Barrier>"
# prompt owned by PLAYER 1 (the defender's controller), and whichever way P1
# answers, Monodramon is deleted but Armalizamon's inherited <Piercing> check
# never happens (P1 security stays 5). See frag-D findings; repro =
# this file with ST23-12 -> BT25-032 plus an actor-1 select row after the
# attack. Chiropmon's inherited <Retaliation> only fires when IT is deleted.
#
# PROMPT SHAPE (BT25-049.yaml DCGO crosscheck): PierceSelfEffect(
# isInheritedEffect: true) -- no prompt. BT25-041's optional WD/WA: our
# Replacement gate "You may activate BT25-041's triggered effect" vs DCGO's
# OptionalSkill (1:1), declined twice.
