# The inherited [When Attacking] effect applies to the Digimon that carries
# BlackGatomon as a digivolution card, NOT to BlackGatomon as the top card
# (BT25_082.cs registers it SetIsInheritedEffect(true)). Here BlackGatomon stays
# the TOP card of its permanent and attacks on T7 with [Three Musketeers] cards
# in hand: no OptionalSkill prompt, no cost, no draw may occur.
