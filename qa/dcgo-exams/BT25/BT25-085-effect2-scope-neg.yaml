# Probe scope:neg: BT25-085#effect#2 -- "You may use 1 [Three Musketeers] or [TS]
# trait Option card from your hand or this Digimon's digivolution cards without
# paying the cost." Same prefix as BT25-085-effect2.yaml, but P-180 (the Option)
# is NOT in the opening/drawn cards: at the [When Digivolving] timing the hand
# holds ONLY non-Option [TS] trait cards (Asuna Shiroki Tamers BT25-092 /
# BT24-088) and BeelStarmon's digivolution cards hold only LadyDevimon.
# DCGO gates the clause on CanActivateUseOption (IsOption && trait && usable) in
# hand or under this Digimon, so with no Option the effect is not activatable:
# NO zone menu (generic_int) and NO hand pick are asked. An engine whose scope
# is "any [TS]/[Three Musketeers] card" rather than Options would offer the
# Tamers, spend no memory, or open a prompt here. Memory must stay 0 after the
# 3-cost digivolve and no cost is paid for anything; BeelStarmon's #effect#3
# (needs an Option under a Digimon) is also dormant.
