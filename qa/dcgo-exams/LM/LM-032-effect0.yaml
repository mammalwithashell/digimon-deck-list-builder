# Exam scenario: Purple Scramble (LM-032), clause LM-032#effect#0 --
# "[Main] 1 of your purple Digimon may digivolve into a purple Digimon card in
#  the hand with the digivolution cost reduced by 3. Then, place this card in
#  the battle area."
#
# THE LINE: P0 hatches Pagumon (ST6-01), breeding-digivolves Elecmon (ST6-05,
# purple Lv.3, cost 0) on T3, promotes it on T5 (memory 3) and plays LM-032
# (cost 2 -> memory 1). Youkomon (ST6-07, purple Lv.4, "purple Lv.3: cost 2")
# is in hand: 2 - 3 floors at 0, a single cost, so no cost prompt.
#
# PROMPT SHAPE (LM_032.cs, OptionSkill region): SelectPermanentEffect over own
# purple Digimon that some purple hand card can legally digivolve
# (canNoSelect: true), then `DigivolveIntoHandOrTrashCard(isHand: true)` ->
# SelectHandEffect (canNoSelect: isOptional=true), then PlayCardClass. Then
# `PlaceDelayOptionCards` parks LM-032 in the battle area.
#
# Every support card is quiet: Pagumon has only an [On Deletion] inherited,
# Elecmon and Youkomon are vanilla; P1 (ST1) hatches Koromon and
# breeding-digivolves Agumon, nothing more.
#
# MEMORY: turn 1 starts at 0 in both engines; the 3-memory reset happens only
# when a player passes with memory on their side. Every pass below is such a
# pass, so each turn from T2 on starts at 3.
#
# Deck accounting for P0 (first player, no T1 draw): draws T3 = stack[10],
# the T3 breeding digivolve = stack[11] (digivolving draws even in the
# breeding area), T5 = stack[12], the T5 Youkomon digivolve = stack[13].
card: LM-032
clause: LM-032#effect#0
seed: 424242
decks:
  p0:
    stack: [LM-032, ST6-05, ST6-07, ST6-02, ST6-09,
            ST6-02, ST6-03, ST6-09, ST1-03, ST1-05,
            ST1-02, ST1-04, ST6-03, ST1-05, ST1-02]
    rest: tm-purple-line
  p1:
    stack: [ST1-03, ST1-02, ST1-04, ST1-05, ST1-08,
            ST1-10, ST1-13, ST1-14, ST1-02, ST1-04,
            ST1-05, ST1-08, ST1-10, ST1-13, ST1-14]
    rest: tm-quiet-red
steps:
  # T1 (P0, memory 0): hatch.
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, memory 3): hatch.
  - actor: 1
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0): breeding-digivolve -> Elecmon (cost 0). Pagumon is a Lv.2 in an
  # occupied breeding area, so no breeding action exists and the turn opens on
  # the main phase (same shape as BT21-029-effect2.yaml's confirmed T3).
  - actor: 0
    do: { digivolve: { from: breeding, using: ST6-05 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1): breeding-digivolve -> Agumon (Koromon is a Lv.2: main phase directly).
  - actor: 1
    do: { digivolve: { from: breeding, using: ST1-03 } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, memory 3): promote Elecmon, then THE CLAUSE.
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: LM-032, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { select: { cards: [ST6-07] } }
    expect: { prompt: SelectHandEffect }
  # One step past the clause (memory 1, still P0's turn).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  # Pre-step state of the trailing pass: Youkomon stands over Elecmon and
  # Pagumon (the reduced-cost digivolve happened), Purple Scramble sits in
  # P0's battle area as a placed <Delay> Option, and P0 is on 1 (2 paid for
  # the Option, 0 for the digivolve). The Youkomon digivolve also drew
  # stack[13].
  - at: 12
    that:
      turn: 5
      p0.memory: 1
      p0.trash: []
      p0.hand: [ST6-02, ST6-09, ST1-02, ST1-04, ST6-03, ST1-05]
      p0.field:
        - card_id: ST6-07
          dp: 6000
          suspended: false
          sources: [ST6-01, ST6-05]
        - card_id: LM-032
          dp: -1
          suspended: false
          sources: []
