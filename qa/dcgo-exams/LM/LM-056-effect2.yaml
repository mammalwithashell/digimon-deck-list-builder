# Exam scenario: Image Training (LM-056), clause LM-056#effect#2 --
# "[Main] <Delay> - 1 of your Digimon may digivolve into a purple or blue
#  Digimon card in the hand with the digivolution cost reduced by 2."
#
# ===== SLOT SAFETY -- why the Digimon is promoted BEFORE the Option is played
# `main: { on: field.N }` is a MAIN-PHASE ACTION, so its slot is NOT
# identity-resolved: DCGO turns it into `ActivatePermanentAction(slot, ...)`
# and reads `actor.GetFieldPermanents()[slot]`
# (Harness/InputDriver.cs:425-463). `GetFieldPermanents()` walks
# `FieldPermanents[0..15]` in FRAME-ID order (Player.cs:669), and a Digimon
# and an Option never share a row: `CardSource.PreferredFrame()` sorts Digimon
# by y DESCENDING (the Digimon row, centre-out 4, 3, 5, 2, 6, ...) and Tamers
# / Options by y ASCENDING (the Tamer row, 11, 10, 12, 9, ...) -- the enemy
# seat's explicit `correctOrder` {4,3,5,2,6,1,7,0,8, 11,10,12,9,13,14,15}
# spells both rows out. So in DCGO's compact list EVERY Digimon precedes EVERY
# placed Option, while ours is plain entry order.
# Until 2026-09-21 this file played LM-056 on T1 and promoted Patamon on T5,
# so the Option was OUR index 0 and DCGO's index 1 and `main: { on: field.0 }`
# would have reached PATAMON on the oracle -- an abort ("[Main] sub-slot on
# field slot 0 (BT25-031) names no activatable [Main] effect"), not a finding.
# The line now promotes Patamon FIRST and plays LM-056 SECOND, on the same
# turn, so the Option is index 1 on BOTH wires and the step is
# `main: { on: field.1 }`. (The same repair was made to the sister line
# ../P/P-108-effect1.yaml.)
#
# PREFIX. T1 hatch the YELLOW Tsunomon BT24-003; T3 breeding-digivolve it into
# Patamon BT25-031 (yellow, [TS], cost 0 -- its [On Play] never fires on a
# breeding digivolve); T5 promote Patamon and only then play LM-056. The play
# is still legal ONLY through the ignore-colour clause (#effect#0): P0's board
# is a single YELLOW Digimon, so the ordinary purple/blue colour requirement
# is not met, and no [Image Training] is in the battle area yet. The [Main]
# reveal (#effect#1) then takes Lekismon BT25-024 (blue) and bottoms Patamon
# BT25-031 (yellow), and LM-056 is PLACED.
#
# <Delay> may not fire on the placing turn (general_rule.pdf 16-16; DCGO
# `CanDeclareOptionDelayEffect` compares EnterFieldTurnCount), so the
# activation waits for T7 -- by which time DCGO's `CanSelectPermanentCondition`
# (own BATTLE-AREA Digimon a hand card can legally digivolve onto) already has
# its candidate.
#
# THE CLAUSE: DCGO trashes the Option (no prompt), asks SelectPermanentEffect
# (canNoSelect: true) for the Digimon, then `DigivolveIntoHandOrTrashCard`
# with isHand: true -> SelectHandEffect (canNoSelect: isOptional=true) for the
# card. LM_056.cs's OnDeclaration is `SetUpActivateClass(null, ..., -1, false,
# ...)`: no OptionalSkill. Lekismon digivolves from Patamon through
# "[Digivolve] Lv.3 w/[TS] trait: Cost 2"; the -2 makes it 0, a single cost,
# so no cost prompt. Its own [When Digivolving] <Draw 1> is mandatory and
# silent.
#
# Deck accounting for P0 (first player, no T1 draw): hand [0..4]; security
# [5..9]; T3 turn draw = stack[10] and the T3 breeding-digivolve draw =
# stack[11]; T5 turn draw = stack[12], and the T5 reveal takes stack[13] to
# hand and bottoms stack[14]; T7 turn draw = stack[15], the <Delay>
# digivolve draw = stack[16], Lekismon's [When Digivolving] <Draw 1> =
# stack[17] (every digivolution draws 1, 5-8-4).
#
# P1 never hatches in this line -- it declines the breeding decision and
# passes every turn, so each of its turns is exactly two steps and its board
# stays empty. Nothing in the clause reads P1's side.
#
# Book: qa/dcgo-exams/LM/tm_lm_056_pool.json (--decks).
card: LM-056
clause: LM-056#effect#2
seed: 424242
decks:
  p0:
    stack: [LM-056, BT25-031, ST1-02, ST1-04, ST1-08,
            ST1-02, ST1-04, ST1-08, ST1-10, ST1-13,
            ST1-14, ST1-14, ST1-10, BT25-024, BT25-031,
            ST1-13, ST1-05, ST1-03]
    rest: tm-lm056-yellow-line
  p1:
    stack: [ST1-03, ST1-02, ST1-04, ST1-05, ST1-08,
            ST1-10, ST1-13, ST1-14, ST1-02, ST1-04,
            ST1-05, ST1-08, ST1-10, ST1-13, ST1-14]
    rest: tm-lm056-quiet-red
steps:
  # T1 (P0, memory 0): hatch the yellow Tsunomon, pass out on 0 -> P1 3.
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, memory 3): all-pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, memory 3): a Lv.2 fills the breeding area, so it can neither hatch
  # nor move and the turn opens straight on the main phase (the campaign
  # convention -- NOTES-LM-056.md "Oracle pass ... breeding-label fix").
  # Breeding-digivolve into Patamon for 0, then pass out on 3.
  - actor: 0
    do: { digivolve: { from: breeding, using: BT25-031 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1, memory 3): all-pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, memory 3): promote Patamon FIRST -- battle-area index 0 on both
  # wires -- and only THEN play LM-056 (2 -> 1), which lands at index 1 on
  # both wires (see SLOT SAFETY). Take the 1 blue card from the reveal.
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: LM-056, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { cards: [BT25-024] } }
    expect: { prompt: SelectCardEffect }
  # SIM-ONLY: our `OrderedPermutation { remaining: 1 }` prompt for the single
  # bottomed card; DCGO asks nothing at N=1 (see LM-056-effect0.yaml).
  - actor: 0
    do: { select: { cards: [BT25-031], sim_only: true } }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T6 (P1, memory 3): all-pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T7 (P0, memory 3): the breeding area is empty again, so a hatch decision
  # IS offered -- decline it. Then THE CLAUSE: activate the placed <Delay>
  # Option, field slot 1 on both wires.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { main: { on: field.1 } }
    expect: { prompt: main_phase }
  # Since engine fix 70694334d (<Delay> pays its trash-this-card cost BEFORE
  # the body, general_rule 16-16-1) our engine also trashes LM-056 before
  # parking the Digimon pick, so Patamon is `own.field.0` on both wires --
  # and this row travels by card identity in any case.
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { select: { cards: [BT25-024] } }
    expect: { prompt: SelectHandEffect }
  # One step past the clause.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  # Pre-clause, at the `main:` step: Patamon at index 0, the placed Option at
  # index 1 -- the ordering the oracle must agree with.
  - at: 16
    that:
      turn: 7
      p0.memory: 3
      p0.trash: []
      p0.field:
        - { card_id: BT25-031, dp: 2000, suspended: false, sources: [BT24-003] }
        - { card_id: LM-056, dp: -1, suspended: false, sources: [] }
  # Pre-step state of the trailing P0 pass: LM-056 is in the trash (the
  # <Delay> cost), Lekismon caps the Patamon/Tsunomon stack, and the -2 made
  # the digivolution free (memory still 3).
  - at: 19
    that:
      turn: 7
      phase: Main
      p0.memory: 3
      p0.trash: [LM-056]
      p0.field:
        - { card_id: BT25-024, dp: 5000, suspended: false, sources: [BT24-003, BT25-031] }
      p1.field: []
      p1.security: 5
