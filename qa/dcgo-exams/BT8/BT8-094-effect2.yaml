# Exam scenario: Digimon Emperor (BT8-094), clause BT8-094#effect#2 --
# "[Security] Play this card without paying the cost."
#
# THE SECURITY-TRIGGER SKELETON: the card under exam sits at p0's stack[9] --
# the TOP of the security stack (stack[5..9] is the pile, reversed) -- and p1's
# Biyomon (ST1-02, played on T2, off summoning sickness by T4) attacks the
# player on T4. The check flips Digimon Emperor and the [Security] plays it
# (DCGO `PlaySelfTamerSecurityEffect`, mandatory; ours `play_from_security`).
# A Tamer has no DP, so no battle follows (13-1-7-3-2) and Biyomon survives.
# Digimon Emperor has no [On Play], so nothing else opens.
#
# p0's battle area is empty until the flip, so no blocker window precedes the
# check; p0's hand is filler that never plays.
#
# Book: qa/dcgo-exams/BT8/tm_bt8_094_pool.json (--decks). p0's deck is Digimon
# Emperor x4 over the quiet ST-1 filler; p1 is the quiet ST-1 opponent.
card: BT8-094
clause: BT8-094#effect#2
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4): inert filler. stack[9] = THE TOP security card, the Tamer under exam
      - ST1-04
      - ST1-04
      - BT1-009
      - ST1-05
      - BT1-014
      # security (5-9): stack[9] is the TOP
      - BT1-014
      - BT4-014
      - BT4-014
      - ST1-10
      - BT8-094
      # (10+): p0's turn draws, in order
      - BT4-010
      - BT4-010
      - BT3-007
      - BT3-007
    rest: tm-emperor
  p1:
    stack:
      # hand (0-4): the Biyomon that attacks, inert filler
      - ST1-02
      - ST1-03
      - ST1-04
      - BT1-009
      - BT3-007
      # security (5-9): stack[9] is the TOP
      - ST1-05
      - BT1-014
      - BT4-010
      - ST1-04
      - ST1-02
      # (10+): p1's turn draws, in order
      - BT4-014
      - ST1-08
      - ST1-10
      - BT1-014
    rest: quiet-opponent
steps:
  # T1 (p0, memory 0): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (p1, memory 3): play Biyomon for 2 (3 -> 1), pass out.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (p0, memory 3): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (p1, memory 3): THE CLAUSE. Biyomon attacks security; the check flips
  # p0's stack[9].
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  # One step past the clause.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 9
    that:
      turn: 4
      p0.security: 4
      p0.trash: []
      p1.field:
        - card_id: ST1-02
          dp: 3000
          suspended: true
          sources: []
      p0.field:
        - card_id: BT8-094
          dp: -1
          suspended: false
          sources: []
