# Exam scenario: Digimon Emperor (BT8-094), clause BT8-094#effect#1 --
# "[Opponent's Turn] When any of your opponent's level 3 Digimon move from the
#  breeding area to the battle area, gain 2 memory."
#
# THE LINE. p0 plays the Tamer on T1 (0 -> -3, the turn hands over on 3). p1
# hatches Koromon ST1-01 on T2, digivolves it into Biyomon ST1-02 (Lv.3, cost
# 0) in the breeding area on T4, and MOVES it to the battle area in T6's
# breeding phase. That move is the trigger; it is mandatory on both sides
# (BT8_094.cs `SetUpActivateClass(..., -1, false, ...)`; ours a plain
# `gain_memory`) so no prompt opens, and the witness is the gauge: p1 opened
# T6 on 3 and reads 1 after the move (p0.memory -1).
#
# Both Koromon ST1-01 and Biyomon ST1-02 are vanilla in play (Koromon's
# inherited DP text needs 4+ sources); nothing else is live.
#
# Book: qa/dcgo-exams/BT8/tm_bt8_094_pool.json (--decks). p0's deck is Digimon
# Emperor x4 over the quiet ST-1 filler; p1 is the quiet ST-1 opponent.
card: BT8-094
clause: BT8-094#effect#1
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4): the Tamer, inert filler
      - BT8-094
      - ST1-04
      - ST1-04
      - BT1-009
      - ST1-05
      # security (5-9): stack[9] is the TOP
      - BT1-014
      - BT1-014
      - BT4-014
      - BT4-014
      - ST1-10
      # (10+): p0's turn draws, in order
      - BT4-010
      - BT4-010
      - BT3-007
      - BT3-007
    rest: tm-emperor
  p1:
    stack:
      # hand (0-4): the Biyomon that digivolves in breeding, inert filler
      - ST1-02
      - ST1-03
      - ST1-04
      - BT1-009
      - BT3-007
      # security (5-9): stack[9] is the TOP
      - ST1-05
      - BT1-014
      - BT4-010
      - ST1-04
      - ST1-02
      # (10+): p1's turn draws, in order
      - BT4-014
      - ST1-08
      - ST1-10
      - BT1-014
    rest: quiet-opponent
steps:
  # T1 (p0, memory 0): play Digimon Emperor for 3 (0 -> -3, the turn hands over).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT8-094, from: hand } }
    expect: { prompt: main_phase }
  # T2 (p1, memory 3): hatch Koromon, pass.
  - actor: 1
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (p0, memory 3): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (p1, memory 3): the breeding area holds a Lv.2, so the turn opens on the
  # main phase. Digivolve Koromon into Biyomon for 0, pass.
  - actor: 1
    do: { digivolve: { from: breeding, using: ST1-02 } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (p0, memory 3): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T6 (p1, memory 3): move Biyomon to the battle area -- THE CLAUSE.
  - actor: 1
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  # One step past the clause.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 11
    that:
      turn: 6
      p0.memory: -1
      p1.field:
        - card_id: ST1-02
          dp: 3000
          suspended: false
          sources: [ST1-01]
