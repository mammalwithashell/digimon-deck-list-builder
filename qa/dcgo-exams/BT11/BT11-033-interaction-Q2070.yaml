clause: BT11-033#effect#0
covers: [BT11-033#effect#0, BT11-033#effect#1]
interaction: { id: "qa:Q2070", source: qa, kind: positive }
seed: 424242
decks:
  p0:
    stack: [ST2-09, BT11-033, BT1-090, BT3-093, ST1-02, ST1-03, ST1-03, ST1-03, ST1-03, ST2-03, BT3-093, ST1-02, ST2-04, ST2-04]
    rest: bt11-033-tail-fallback-p0
  p1:
    # hand: ST1-11, BT1-090 x2, ST1-02 x2 | security bottom->top: ST1-03 x4, BT3-093 (TOP) | draws: ST2-04, ST2-04, ST2-03, ST2-03
    stack: [ST1-11, BT1-090, BT1-090, ST1-02, ST1-02, ST1-03, ST1-03, ST1-03, ST1-03, BT3-093, ST2-04, ST2-04, ST2-03, ST2-03]
    rest: bt11-033-tail-fallback-p1
