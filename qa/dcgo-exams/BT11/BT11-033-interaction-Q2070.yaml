# Q2070 (2024-03-28): the card BT11-033's fallback adds to the opponent's hand from the top of
# their security stack was NOT revealed by a security check, so its [Security] effect can't be
# activated. Line = the confirmed tail-fallback line with P1's TOP security card (stack[9]) swapped
# to BT3-093 Davis Motomiya ("[Security] Play this card without paying its memory cost") and the
# two Davis copies removed from P1's opening hand so the hand add is unambiguous.
# Observable at the final row: BT3-093 is in p1.hand, p1.field is still only ST1-11, p1.security 4,
# and P0 gained 1 memory from effect#1 (6 cards in P1's hand / 4).
# Sources: data/card_bundles/BT11-033.md; base DCGO BT11/Blue/BT11_033.cs (fallback =
# CardObjectController.AddHandCards + IReduceSecurity, never IBreakSecurity.SecurityCheck);
# BT3_093.cs plays itself only from EffectTiming.SecuritySkill.
# Draft: sim-only legality is not oracle confirmation. expect_ruling is authored later.
