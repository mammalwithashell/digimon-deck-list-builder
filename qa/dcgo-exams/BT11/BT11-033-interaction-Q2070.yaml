- { actor: 0, do: { pass: {} }, expect: { prompt: breeding_action } }
- { actor: 0, do: { play: { card: ST2-09, from: hand } }, expect: { prompt: main_phase } }
- { actor: 1, do: { pass: {} }, expect: { prompt: breeding_action } }
# WarGreymon is Lv.6: no level-5-or-lower bounce target exists, so the fallback must fire.
- { actor: 1, do: { play: { card: ST1-11, from: hand } }, expect: { prompt: main_phase } }
- { actor: 0, do: { pass: {} }, expect: { prompt: breeding_action } }
# [When Digivolving]: no bounce -> P1 adds the top security card (BT3-093) to hand; its [Security]
# must NOT activate (no security check revealed it). effect#1: P1 hand 6 -> +1 memory.
- { actor: 0, do: { digivolve: { from: field.0, using: BT11-033 } }, expect: { prompt: main_phase } }
- { actor: 0, do: { pass: {} }, expect: { prompt: main_phase } }
