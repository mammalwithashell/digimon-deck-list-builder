# Exam scenario: Bind Red Trigger (P-180), clause P-180#effect#1 --
# "[Main] Trash your opponent's top security card. Then, place this card as
#  the bottom digivolution card of 1 of your [Three Musketeers] trait Digimon."
#
# THE LINE. P-180 is a RED Option in a PURPLE deck: its use is only legal
# because P0 controls a [Three Musketeers] TRAIT Digimon (clause #effect#0's
# ignore-colour half, exercised implicitly here). In this pool only the two
# BeelStarmon print that trait, so the line puts BeelStarmon (BT25-085, play
# cost 6, no [On Play]) onto the field first.
#
#   T1 (P0, memory 0): pass everything.
#   T2 (P1): pass everything.
#   T3 (P0, memory 3): play BeelStarmon BT25-085 from hand (3 -> -3, turn over).
#   T4 (P1): pass everything.
#   T5 (P0, memory 3): use P-180 (3 -> -3). THE CLAUSE: P1's top security card
#            is trashed (no prompt on either engine), then P0 picks the
#            [Three Musketeers] Digimon that receives P-180 as its bottom
#            digivolution card.
#
# PROMPT SHAPE (P_180.cs, region "Main"): SetUpActivateClass(..., isOptional:
# false) -- mandatory, no OptionalSkill. IDestroySecurity(fromTop) asks
# nothing. The tuck target is ONE SelectPermanentEffect(canNoSelect: false,
# maxCount 1). Under the harness every SelectPermanentEffect.Activate() routes
# through SetTargetFrames -> TryAnswerStep, so the row is consumed even with a
# single candidate.
#
# P1's security is stacked so the trashed card is known: stack[9] = ST1-04.
card: P-180
clause: P-180#effect#1
seed: 424242
decks:
  p0:
    stack: [BT25-085, P-180, BT24-088, BT24-088, BT24-088,
            BT25-082, BT25-082, BT25-082, BT25-082, BT25-058,
            BT25-092, BT25-092]
    rest: three-musketeers
  p1:
    stack: [ST1-03, ST1-03, ST1-03, ST1-03, ST1-04,
            ST1-02, ST1-02, ST1-02, ST1-02, ST1-04,
            BT1-009, BT1-009]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, memory 3)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, memory 3): BeelStarmon BT25-085 -- the [Three Musketeers] Digimon.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT25-085, from: hand } }
    expect: { prompt: main_phase }
  # T4 (P1, memory 3)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, memory 3): THE CLAUSE.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: P-180, from: hand } }
    expect: { prompt: main_phase }
  # Security trashed with no prompt; now the tuck target.
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # One step past the clause: memory is -3, so the seat is P1 (T6).
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 11
    that:
      turn: 6
      p0.memory: -3
      p1.security: 4
      p1.trash: [ST1-04]
      p0.trash: []
      p0.hand: [BT24-088, BT24-088, BT24-088, BT25-092, BT25-092]
      p0.field:
        - { card_id: BT25-085, dp: 12000, suspended: false, sources: [P-180] }
      p1.field: []
