# Exam scenario: Wisdom Training (P-108), clause P-108#effect#1 --
# "[Main] <Delay> (By trashing this card after the placing turn, activate the
#  effect.) - 1 of your Digimon may digivolve into a purple Digimon card in the
#  hand with the digivolution cost reduced by 2."
#
# ===== SLOT SAFETY -- why the Digimon is promoted BEFORE the Option is played
# `main: { on: field.N }` is a MAIN-PHASE ACTION, so its slot is not
# identity-resolved: DCGO turns it into `ActivatePermanentAction(slot, ...)`
# and reads `actor.GetFieldPermanents()[slot]`
# (Harness/InputDriver.cs:425-463). `GetFieldPermanents()` walks
# `FieldPermanents[0..15]` in FRAME-ID order (Player.cs:669), and a Digimon
# and an Option never share a row: `CardSource.PreferredFrame()` sorts Digimon
# by y DESCENDING (the Digimon row, centre-out 4, 3, 5, 2, 6, ...) and Tamers
# / Options by y ASCENDING (the Tamer row, 11, 10, 12, 9, ...) -- the enemy
# seat's explicit `correctOrder` {4,3,5,2,6,1,7,0,8, 11,10,12,9,13,14,15}
# spells both rows out. So in DCGO's compact list EVERY Digimon precedes EVERY
# placed Option, while ours is plain entry order.
# Until 2026-09-21 this file played P-108 on T3 and promoted Elecmon on T5, so
# the Option was OUR index 0 and DCGO's index 1: `main: { on: field.0 }` would
# have reached Elecmon on the oracle and aborted with "[Main] sub-slot on
# field slot 0 (ST6-05) names no activatable [Main] effect". (The 2026-09-18
# oracle run never got that far -- it aborted earlier on the breeding label --
# so the defect was latent, not measured.) The line now promotes Elecmon
# FIRST and plays P-108 SECOND, on the same turn, which puts the Option at
# index 1 on BOTH wires, and the step is `main: { on: field.1 }`.
#
# PREFIX. Hatch the purple Pagumon ST6-01 on T1; breeding-digivolve it into
# Elecmon ST6-05 (vanilla purple Lv.3, cost 0) on T3 -- a purple DIGIMON,
# which is what our engine needs for P-108's colour requirement (see
# NOTES-P-108.md: a bare Digi-Egg satisfies it in DCGO but not in ours);
# promote Elecmon and play P-108 (3 -> 1) on T5, taking Youkomon ST6-07 from
# the reveal. <Delay> may not fire on the placing turn (keyword-semantics
# 16-16; DCGO `CanDeclareOptionDelayEffect`), so the activation waits for T7.
# P_108.cs's `CanSelectPermanentCondition` only admits own BATTLE-AREA Digimon
# that a purple hand Digimon can legally digivolve onto -- Elecmon is already
# there, which is exactly what the re-ordering above also buys.
#
# THE CLAUSE. P_108.cs OnDeclaration is SetUpActivateClass(null, ..., -1,
# false, ...): no OptionalSkill. DCGO trashes the Option
# (DeletePeremanentAndProcessAccordingToResult, no prompt), asks
# SelectPermanentEffect (maxCount 1, canNoSelect: true; the single candidate
# Elecmon is still asked) and then `DigivolveIntoHandOrTrashCard(isHand: true,
# payCost: true, reduceCost 2)` -> ONE SelectHandEffect (canNoSelect:
# isOptional = true). Ours: a declinable `select_own_permanent` then a
# `select_hand`. 1:1:1 (the sister line is ../LM/LM-056-effect2.yaml).
# Youkomon ST6-07 is the ONLY purple Digimon in p0's hand; its one circle is
# Purple Lv.3 / 2, so the -2 makes it 0 -- a single cost, no cost-choice
# prompt -- and p0's memory stays 3. Every Digimon in the stack is vanilla
# (ST6-05 / ST6-07 have no DCGO script at all), so nothing triggers on the
# digivolve; Pagumon ST6-01's inherited is [On Deletion] only.
#
# Deck accounting for p0 (first player, no T1 draw): hand [0..4]; security
# [5..9]; T3 turn draw = stack[10], T3 breeding-digivolve draw = stack[11];
# T5 turn draw = stack[12] and the T5 reveal takes stack[13] to hand and
# bottoms stack[14]; T7 turn draw = stack[15] and the <Delay> digivolve draw
# = stack[16] (every digivolution draws 1, 5-8-4).
#
# Book: qa/dcgo-exams/P/tm_p_108_pool.json (--decks). p0 (`tm-wisdom`) is the
# quiet ST-1 list with P-108 x4 + Elecmon ST6-05 x4 + Youkomon ST6-07 x4 in
# for its Options / Phoenixmon, purple Pagumon ST6-01 eggs; p1 is the quiet
# ST-1 opponent.
card: P-108
clause: P-108#effect#1
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4): the Option, Elecmon, inert red filler
      - P-108
      - ST6-05
      - ST1-02
      - ST1-04
      - ST1-08
      # security (5-9): stack[9] is the TOP. Never flipped -- nobody attacks.
      - ST1-02
      - ST1-04
      - ST1-08
      - ST1-05
      - BT1-009
      # (10,11): T3 turn draw, T3 breeding-digivolve draw
      - BT1-014
      - BT1-014
      # (12): T5 turn draw
      - BT4-014
      # (13,14): the T5 reveal -- Youkomon (purple) and Dracomon (red)
      - ST6-07
      - ST1-04
      # (15,16): T7 turn draw, the <Delay> digivolve draw
      - BT4-014
      - BT3-007
    rest: tm-wisdom
  p1:
    stack:
      # hand (0-4): inert; p1 never plays a card in this line
      - ST1-03
      - ST1-02
      - ST1-04
      - ST1-05
      - ST1-08
      # security (5-9): stack[9] is the TOP
      - ST1-10
      - ST1-13
      - ST1-14
      - ST1-02
      - ST1-04
      # (10+): the T2 / T4 / T6 turn draws
      - ST1-05
      - ST1-08
      - ST1-10
    rest: quiet-opponent
steps:
  # T1 (p0, memory 0): hatch the purple egg, pass.
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (p1, memory 3): all-pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (p0, memory 3): a Lv.2 fills the breeding area, so it can neither hatch
  # nor move and the turn opens straight on the main phase (the campaign
  # convention -- see NOTES-P-108.md "Oracle pass ... breeding-label fix").
  # Breeding-digivolve into Elecmon for 0, then pass out on 3.
  - actor: 0
    do: { digivolve: { from: breeding, using: ST6-05 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (p1, memory 3): all-pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (p0, memory 3): promote Elecmon FIRST -- it takes battle-area index 0
  # on both wires -- and only THEN play P-108 (3 -> 1), which lands at index 1
  # on both wires (see SLOT SAFETY). Take Youkomon from the reveal.
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: P-108, from: hand } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { cards: [ST6-07] } }
    expect: { prompt: SelectCardEffect }
  # SIM-ONLY: our `OrderedPermutation { remaining: 1 }` prompt for the single
  # bottomed card; DCGO asks nothing at N=1 (see P-108-effect0.yaml).
  - actor: 0
    do: { select: { cards: [ST1-04], sim_only: true } }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T6 (p1, memory 3): all-pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T7 (p0, memory 3): the breeding area is empty again, so a hatch decision
  # IS offered -- decline it. Then THE CLAUSE: activate the placed <Delay>
  # Option, which is field slot 1 on both wires.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { main: { on: field.1 } }
    expect: { prompt: main_phase }
  # Since engine fix 70694334d (<Delay> pays its trash-this-card cost BEFORE
  # the body, general_rule 16-16-1) our engine also trashes P-108 before
  # parking the Digimon pick, so Elecmon is `own.field.0` on both wires --
  # and this row travels by card identity in any case.
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  - actor: 0
    do: { select: { cards: [ST6-07] } }
    expect: { prompt: SelectHandEffect }
  # One step past the clause.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  # Pre-clause, at the `main:` step: Elecmon at index 0, the placed Option at
  # index 1 -- the ordering the oracle must agree with.
  - at: 16
    that:
      turn: 7
      p0.memory: 3
      p0.trash: []
      p0.field:
        - { card_id: ST6-05, dp: 5000, suspended: false, sources: [ST6-01] }
        - { card_id: P-108, dp: -1, suspended: false, sources: [] }
  # Pre-step state of the trailing pass: P-108 is in the trash (the <Delay>
  # cost), Youkomon caps the Elecmon/Pagumon stack, and the -2 made the
  # digivolution free (memory still 3).
  - at: 19
    that:
      turn: 7
      phase: Main
      p0.memory: 3
      p0.trash: [P-108]
      p0.field:
        - { card_id: ST6-07, dp: 6000, suspended: false, sources: [ST6-01, ST6-05] }
      p1.field: []
      p1.security: 5
