# Exam scenario: Bind Red Trigger (P-180), clause P-180#effect#2 --
# "[Security] Delete 1 of your opponent's Digimon with the highest DP."
#
# P-180 is pinned as P0's TOP security card (stack[9]). P1 fields Biyomon
# ST1-02 (3000 DP) and Dracomon ST1-04 (4000 DP) and attacks security with
# BIYOMON, so the flipped clause has a unique highest-DP target that is NOT
# the attacker: Dracomon. P-180 is an Option, so no security battle follows;
# Biyomon stays suspended on the field.
#
#   T1 (P0): pass everything.
#   T2 (P1, memory 3): play Biyomon (3 -> 1), play Dracomon (1 -> -2, over).
#   T3 (P0): pass everything.
#   T4 (P1, memory 3): Biyomon attacks security. THE CLAUSE: P-180 flips, P0
#            (the defender) picks Dracomon. Attacking costs no memory, so the
#            trailing step is P1's main prompt.
#
# PROMPT SHAPE (P_180.cs, region "Security"): mandatory; one
# SelectPermanentEffect(Destroy, canNoSelect: false) over IsMaxDP for
# card.Owner = P0.
card: P-180
clause: P-180#effect#2
seed: 424242
decks:
  p0:
    stack: [BT24-088, BT24-088, BT24-088, BT25-092, BT25-092,
            BT25-082, BT25-082, BT25-082, BT25-082, P-180,
            BT25-058]
    rest: three-musketeers
  p1:
    stack: [ST1-02, ST1-04, ST1-03, ST1-03, ST1-03,
            ST1-02, ST1-02, ST1-02, BT1-009, BT1-009,
            ST1-03, BT1-009]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, memory 3)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { play: { card: ST1-04, from: hand } }
    expect: { prompt: main_phase }
  # T3 (P0, memory 3)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1, memory 3): THE CLAUSE -- Biyomon (field.0) into security.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  # The flipped Option's [Security]: P0 deletes P1's highest-DP Digimon.
  - actor: 0
    do: { select: { targets: [opp.field.1] } }
    expect: { prompt: SelectPermanentEffect }
  # Attacking costs no memory; P1 keeps the turn.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 10
    that:
      turn: 4
      p0.memory: -3
      p0.security: 4
      p0.trash: [P-180]
      p0.field: []
      p1.security: 5
      p1.trash: [ST1-04]
      p1.field:
        - { card_id: ST1-02, dp: 3000, suspended: true, sources: [] }
