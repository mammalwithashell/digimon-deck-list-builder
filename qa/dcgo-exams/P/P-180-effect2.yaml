# Exam scenario: Bind Red Trigger (P-180), clause P-180#effect#2 --
# "[Security] Delete 1 of your opponent's Digimon with the highest DP."
#
# P-180 is pinned as P0's TOP security card (stack[9]). P1 fields Biyomon
# ST1-02 (3000 DP), Dracomon ST1-04 (4000 DP) and Agumon ST1-03 (2000 DP) and
# attacks security with AGUMON, so the flipped clause has a unique highest-DP
# target that is NOT the attacker: Dracomon. P-180 is an Option, so no security
# battle follows; Agumon stays suspended on the field.
#
#   T1 (P0): pass everything.
#   T2 (P1, memory 3): play Biyomon (3 -> 1), play Dracomon (1 -> -2, over).
#   T3 (P0, memory 2): pass everything.
#   T4 (P1, memory 3): play Agumon (3 -> 0); pass (P0 gets 3).
#   T5 (P0): pass everything (Agumon shakes summoning sickness).
#   T6 (P1, memory 3): Agumon attacks security. THE CLAUSE: P-180 flips, P0
#            (the defender) picks Dracomon. Attacking costs no memory, so the
#            trailing step is P1's main prompt.
#
# WHY THREE DIGIMON AND THE THIRD ONE ATTACKS (r2, 2026-09-18). `attack:
# attacker: field.N` reaches DCGO as a COMPACT index over
# Player.FieldPermanents in FRAME order, and CardSource.PreferredFrame seats
# Digimon centre-out (4, 3, 5, ...). On r1's two-Digimon board ours was
# [Biyomon, Dracomon] but DCGO's [Dracomon, Biyomon], so `field.0` sent
# DRACOMON into security on DCGO (recording 20260918T075040Z_9d639715...: lead
# divergence = swapped `suspended` flags only; both engines still deleted
# ST1-04). The THIRD-entered Digimon sits at frame 5 = field.2 on BOTH sides
# -- the reusable rule from ../BT25/NOTES-BT25-083.md, same re-author as
# ../EX7/EX7-070-effect2.yaml.
#
# PROMPT SHAPE (P_180.cs, region "Security"): mandatory; one
# SelectPermanentEffect(Destroy, canNoSelect: false) over IsMaxDP for
# card.Owner = P0.
card: P-180
clause: P-180#effect#2
seed: 424242
decks:
  p0:
    stack: [BT24-088, BT24-088, BT24-088, BT25-092, BT25-092,
            BT25-082, BT25-082, BT25-082, BT25-082, P-180,
            BT25-058]
    rest: three-musketeers
  p1:
    # ONE ST1-03 in hand through T4 (a second copy makes `play: ST1-03`
    # ambiguous); both draws (stack[10], [11]) are BT1-009.
    stack: [ST1-02, ST1-04, ST1-03, BT1-009, BT1-009,
            ST1-02, ST1-02, ST1-02, ST1-03, ST1-03,
            BT1-009, BT1-009]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, memory 3)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { play: { card: ST1-04, from: hand } }
    expect: { prompt: main_phase }
  # T3 (P0, memory 2)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1, memory 3): the third Digimon -- the slot-safe attacker.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-03, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, memory 3)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T6 (P1, memory 3): THE CLAUSE -- Agumon (field.2 on both sides) into security.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { attack: { attacker: field.2, target: security } }
    expect: { prompt: main_phase }
  # The flipped Option's [Security]: P0 deletes P1's highest-DP Digimon.
  - actor: 0
    do: { select: { targets: [opp.field.1] } }
    expect: { prompt: SelectPermanentEffect }
  # Attacking costs no memory; P1 keeps the turn.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 15
    that:
      turn: 6
      p0.memory: -3
      p0.security: 4
      p0.trash: [P-180]
      p0.field: []
      p1.security: 5
      p1.trash: [ST1-04]
      p1.field:
        - { card_id: ST1-02, dp: 3000, suspended: false, sources: [] }
        - { card_id: ST1-03, dp: 2000, suspended: true, sources: [] }
