# Exam scenario: Aegiochusmon (P-213), clause P-213#effect#1 -- "<Raid>"
# (When this Digimon attacks, you may switch the target of attack to 1 of your
# opponent's unsuspended Digimon with the highest DP.)
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). PROVISIONAL: assert block is our engine's result, not
# backfilled from DCGO -- unconfirmed until the oracle pass.
#
# THE LINE.
#   T1 (P0, 0): hard-play Aegiomon BT25-033 (0 -> -5); decline its [On Play].
#   T2 (P1, 5): Agumon BT3-007 (4000; 5 -> 3), Biyomon ST1-02 (3000; 3 -> 1);
#        pass -> P0 3. Two unsuspended Digimon with DIFFERENT DP, so "the
#        highest DP" discriminates (Agumon, field.0).
#   T3 (P0, 3): digivolve Aegiomon -> P-213 ([Aegiomon] route, 3 -> 0, single
#        route); WD: 5 security, no buff; decline its "may attack". Then a
#        normal main-phase attack: P-213 -> P1's SECURITY. THE CLAUSE: <Raid>
#        -> switch to Agumon. 7000 vs 4000: Agumon deleted. Trailing pass is
#        the asserted step.
#
# WITNESS: the attack declared on the PLAYER never checks security (P1 still
# 5) and instead P1's 4000-DP Agumon is in trash; the 3000-DP Biyomon stays.
# P-213 is suspended from attacking.
#
# PROMPT SHAPE / anticipated oracle quirks:
#   - Raid: authored `expect: OptionalSkill` over our live declinable OppField
#     pick -- the documented <Raid>-family FOLD (DCGO gates OptionalSkill yes,
#     then the pick; the emitter splits the row). EX12-076-effect1 precedent.
#   - WD "may attack" decline: ours `Target` decline vs DCGO SelectAttackEffect
#     "no attack" (see P-213-effect0 note).
#   - SIM-ONLY row (actor 1): a phantom `<Barrier>` Replacement prompt our
#     engine parks for P1 when P1's Agumon "would be deleted in battle". The
#     Barrier is P0's -- P-213's inherited <Barrier> from the Aegiomon source
#     -- and its body self-scopes only inside replacement_process, not at
#     candidate collection (keyword_effects.rs Keyword::Barrier; compare the
#     Evade arm, which self-scopes at candidate collection). Measured: yes or
#     no makes no difference (Agumon is deleted, P1 security stays 5). DCGO
#     asks nothing here. SUSPECTED ENGINE BUG, reported, not fixed.
