#     OptionalSkill(yes) + the pick. EX12-076-effect1 precedent.
#   - WD "may attack" decline: P_213.cs runs SelectAttackEffect directly behind CanAttack -- NO OptionalSkill gate
#     (P/Red/P_213.cs "When Digivolving" region); the decline is that widget's
#     cancel (SelectAttackEffect.cs SetAttackTarget harness hook, -2).
#   - No other prompts: P1 has no OnCounterTiming effects
