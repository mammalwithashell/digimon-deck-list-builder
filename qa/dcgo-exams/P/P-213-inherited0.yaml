# Exam scenario: Aegiochusmon (P-213), clause P-213#inherited#0 -- inherited
# "<Decode ([Aegiomon])>" (When this Digimon would leave the battle area other
# than in battle, you may play 1 [Aegiomon] from its digivolution cards
# without paying the cost.)
#
# Book: qa/dcgo-exams/BT26/ts_jupitermon_pool.json (`ts-jupitermon` vs
# `tm-quiet-red`). PROVISIONAL: assert block is our engine's result, not
# backfilled from DCGO -- unconfirmed until the oracle pass.
#
# THE LINE.
#   T1 (P0, 0): hard-play Aegiomon BT25-033 (0 -> -5); decline its [On Play].
#   T2 (P1, 5): Biyomon ST1-02 (5 -> 3; red, for Gaia Force); pass -> P0 3.
#   T3 (P0, 3): digivolve Aegiomon -> P-213 ([Aegiomon] route, 3 -> 0); WD:
#        decline "may attack". Digivolve P-213 -> Junomon BT25-044 (P-213 is
#        RED, so only Junomon's "Lv.5 w/[Angel]/[Archangel]/[TS]" cost-3 route
#        opens: no cost prompt; 0 -> -3, turn ends). Junomon's WD ("By placing
#        1 other Digimon as the top security card") has no other Digimon ->
#        no prompt. Stack now Junomon / P-213 / Aegiomon.
#   T4 (P1, 3): Gaia Force ST1-16 (3 -> -5) deletes Junomon. THE CLAUSE: the
#        inherited Decode on P-213 (now a source) fires for the TOP permanent's
#        non-battle leave: accept, pick the Aegiomon source -> played free;
#        its [On Play] triggers (decline). P0's T5 breeding pass closes.
#
# WITNESS: at step 10 Junomon stands on [Aegiomon, P-213]; after Gaia Force a
# source-less Aegiomon BT25-033 is on P0's field and Junomon + P-213 are in
# P0's trash. Junomon prints no Decode of its own, so the play can only come
# from P-213's inherited text.
#
# PROMPT SHAPE / anticipated oracle quirks:
#   - Decode (inherited): Replacement gate (OptionalSkill yes) +
#     SelectCardEffect source pick over the leaving permanent's sources
#     (DCGO DecodeSelfEffect, isInheritedEffect true); DCGO's pick is
#     skippable -- same row count since we pick.
#   - WD "may attack" decline: ours `Target` decline vs DCGO
#     SelectAttackEffect "no attack" (see P-213-effect0 note).
