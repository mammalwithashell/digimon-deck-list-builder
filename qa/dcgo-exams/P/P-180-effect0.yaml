# Exam scenario: Bind Red Trigger (P-180), clause P-180#effect#0 --
# "When effects trash this card from digivolution cards, delete 1 of your
#  opponent's 7000 DP or lower Digimon. While you have a [Three Musketeers]
#  trait Digimon, you can ignore this card's color requirements."
#
# THE LINE -- a trasher whose effect asks NOTHING after the trash.
#   T1 (P0): hatch Pagumon.
#   T2 (P1, 3): hatch; play Agumon ST1-03 (3 -> 0); pass.
#   T3 (P0, 3): Sparrowmon EX7-051 onto Pagumon in the breeding area (0); pass.
#   T4 (P1, 3): pass.
#   T5 (P0, 3): promote; DCGO-only decline of Sparrowmon's vacuous [Start of
#            Your Main Phase]; BlackGatomon BT25-082 for 2 (cost prompt
#            answered 2; the digivolve draws P-180); its [When Digivolving]
#            free-plays Asuna Shiroki BT25-092; pass at memory 1.
#   T6 (P1, 3): pass.
#   T7 (P0, 3): decline Asuna; play LadyDevimon BT25-083 (3 -> -4). Her [On
#            Play] "By placing 1 [Three Musketeers] trait card from your hand
#            or trash as any of your Digimon's bottom digivolution cards,
#            <Draw 1>" seats P-180 under LADYDEVIMON HERSELF (not under
#            BlackGatomon: see "why under LadyDevimon" below).
#   T8 (P1, 4): pass.
#   T9 (P0, 3): decline Asuna; BlackGatomon digivolves into BeelStarmon
#            BT25-085 for 4 through BlackGatomon's [All Turns] grant
#            (3 -> -1). BeelStarmon's [When Digivolving] "By trashing 1 Option
#            card from any of your Digimon's digivolution cards or link cards,
#            this Digimon unsuspends" trashes P-180 from LadyDevimon's
#            digivolution cards. THE CLAUSE fires. Agumon (2000 DP) is
#            deleted. Memory -1: the turn passes to P1 (T10).
#
# WHY THIS TRASHER (it supersedes the LadyDevimon-[When Attacking] line this
# file held before 2026-09-18). Our engine resolves a "when effects trash this
# card from digivolution cards" trigger IMMEDIATELY after the trash, in the
# middle of the trashing effect; DCGO stacks it (ITrashDigivolutionCards ->
# StackSkillInfos) and resolves it after the trashing effect finishes, which
# is the rules-correct order (general_rule.pdf 15-8-3-2). With LadyDevimon's
# [When Attacking] as the trasher, her effect still has a prompt to ask after
# the trash ("you may use 1 ... Option card from your trash"), so the two
# engines order that prompt and this clause differently, and an oracle run
# can only abort on prompt sequence (or, for a prompt-free clause body, read
# a state difference at LadyDevimon's reuse row) -- measuring the ENGINE's
# trigger timing, never this card. That finding is real, is NOT fixed, and
# stays recorded in qa/dcgo-exams/P/NOTES-P-180.md. BeelStarmon's
# trash-to-unsuspend effect asks nothing after the trash and the rest of its
# body is a no-op here (BeelStarmon has just digivolved and is already
# unsuspended), so both orders produce the SAME prompt sequence and the SAME
# state at every row: this line measures the clause itself.
#
# WHY UNDER LADYDEVIMON. BeelStarmon's OTHER [When Digivolving] ("you may use
# 1 [Three Musketeers] or [TS] trait Option card from your hand or THIS
# Digimon's digivolution cards without paying the cost") is gated in
# BT25_085.cs by CanActivateUseOption (such an Option in hand or under
# BeelStarmon itself) and in our YAML by the matching `condition:`. With the
# Option under LadyDevimon and none in hand, that effect is inactive on both
# sides: exactly ONE [When Digivolving] trigger, no MultipleSkills /
# TriggerOrder. The clause's ignore-colour sentence is not needed by this
# line (the Option is never USED); P-180-effect1.yaml exercises it.
#
# PROMPT SHAPE, re-derived from the C# (2026-09-18):
#   * LadyDevimon [On Play] (BT25_083.cs "OP/WD Shared", optional: false, gated
#     on a [Three Musketeers] TRAIT card in hand or trash -- P-180 and the
#     dual BeelStarmon BT25-085 both qualify): generic_int zone menu
#     ("Hand" = 1; DCGO-only, our union pick folds the zone), SelectHandEffect
#     (canNoSelect: true) -> P-180 by identity, SelectPermanentEffect over own
#     battle-area Digimon (BlackGatomon, LadyDevimon) -> LadyDevimon; draw 1.
#   * BeelStarmon [When Digivolving] (BT25_085.cs "Shared WD / WA / Counter",
#     optional: false, isSkippable: true -> NO OptionalSkill; our YAML authors
#     it `optional: true`, so OUR gate is a sim-only row): SelectPermanentEffect
#     (canNoSelect: true) over own Digimon holding an Option -- LadyDevimon,
#     SHARED with our OwnField pick; SelectCardEffect over her digivolution
#     cards -- DCGO-only by identity; our side is a single-candidate
#     EffectChoice ("Choose 1 Option to trash (activation cost)") answered
#     through the resolver's single-accept-id `yes:` path, because
#     selection_resolve.rs cannot name a digivolution-card candidate by
#     `cards:`. ITrashDigivolutionCards(cardEffect) -> the clause.
#     IUnsuspendPermanents on an unsuspended Digimon: no prompt, no change.
#   * THE CLAUSE (P_180.cs "When Trashed from digivolutions cards"):
#     SetUpActivateClass(..., -1, FALSE, ...) -- mandatory, no OptionalSkill
#     (SetIsOptionEffect(true) only tags it as an Option card's effect);
#     CanActivate = the card is in the trash and an opponent Digimon with
#     DP <= 7000 exists; ONE SelectPermanentEffect(Destroy, canNoSelect:
#     false). SHARED with our OppField pick.
#
# Under the harness every SelectPermanentEffect.Activate() takes the AI branch
# (`_selectPlayer.isYou && !HarnessAuto.DrivesLocalSeat` is false), which
# calls SetTargetFrames -> InputDriver.TryAnswerStep: a single-candidate pick
# still consumes one wire row.
card: P-180
clause: P-180#effect#0
seed: 424242
decks:
  p0:
    # stack[0..4] = opening hand; stack[5..9] = security (never flipped: P1
    # never attacks); stack[10..] = draws: T3 turn, T3 Sparrowmon digivolve,
    # T5 turn, T5 BlackGatomon digivolve = P-180 (so it reaches the hand AFTER
    # Sparrowmon's T5 [Start of Your Main Phase] window), T7 turn, LadyDevimon's
    # <Draw 1>, T9 turn, T9 BeelStarmon digivolve. ONE copy each of LadyDevimon
    # and BeelStarmon ever reaches the hand (`play:` / `using:` stay
    # unambiguous), and no Option other than P-180 does, so BeelStarmon's
    # use-an-Option [When Digivolving] stays inactive on both sides.
    stack: [EX7-051, BT25-082, BT25-092, BT25-085, BT25-083,
            BT25-078, BT25-078, BT25-078, EX7-008, EX7-008,
            BT21-071, BT21-074, BT25-078, P-180, BT24-088,
            EX7-008, BT21-071, BT21-074]
    rest: three-musketeers
  p1:
    stack: [ST1-03, ST1-04, ST1-04, BT1-009, BT3-007,
            ST1-02, ST1-02, ST1-04, ST1-02, ST1-02,
            BT3-007, BT3-007, BT3-007, ST1-05, ST1-05]
    rest: quiet-opponent
steps:
  # T1 (P0): hatch Pagumon.
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, 3): hatch, play Agumon (3 -> 0), pass.
  - actor: 1
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-03, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, 3): breeding-digivolve Sparrowmon (Purple Lv.2 / 0). No breeding
  # prompt: Pagumon is a Lv.2 in an occupied breeding area.
  - actor: 0
    do: { digivolve: { from: breeding, using: EX7-051 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1, 3): Koromon sits in the breeding area -> no breeding prompt.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, 3): promote Sparrowmon.
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  # DCGO-ONLY: Sparrowmon's vacuous [Start of Your Main Phase] OptionalSkill
  # (EX7_051.cs: isOptional TRUE, CanActivate = hand-or-trash non-empty and a
  # Digimon on the battle area). No [Three Musketeers] Option is in hand yet
  # -- P-180 is the card the BlackGatomon digivolve draws, AFTER this window --
  # so our engine (gated on a payable Option) parks nothing.
  # CORRECTION (2026-09-18, BT25-082#effect#2 triage): this row is SHARED, not
  # DCGO-only. BeelStarmon (BT25-085) in hand is a DUAL card -- a [Three
  # Musketeers] trait Option -- so the cost IS payable; our engine stayed silent
  # only because data/cards.json carried BT25-085 as a plain Digimon (fixed).
  # `expect: OptionalSkill` over our declinable cost pick is the fold marker;
  # the wire row (OptionalSkill select_cancel) is unchanged.
  - actor: 0
    do: { select: { decline: true } }
    expect: { prompt: OptionalSkill }
  # BlackGatomon onto Sparrowmon: alt-circle 2 vs printed Purple Lv.3 / 3.
  - actor: 0
    do: { digivolve: { from: field.0, using: BT25-082 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { select: { value: 2 } }
    expect: { prompt: SelectCountEffect }
  # [When Digivolving]: SIM-ONLY outer gate (DCGO builds it non-optional and
  # carries the "may" on the pick's canNoSelect), then the shared hand pick.
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  - actor: 0
    do: { select: { cards: [BT25-092] } }
    expect: { prompt: SelectHandEffect }
  # Memory 1: still P0's turn. Pass (P1 gets 3).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T6 (P1, 3): Koromon sits in the breeding area -> no breeding prompt.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T7 (P0, 3): empty breeding area -> breeding prompt; pass it.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  # Asuna's [Start of Your Main Phase], declined -- two rows for one decision
  # (BT25_092.cs: optional: false + ONE cancellable SelectHandEffect; ours: an
  # outer `Replacement` gate before the hand pick).
  - actor: 0
    do: { select: { decline: true, sim_only: true } }
  - actor: 0
    do: { select: { decline: true, dcgo_only: true } }
    expect: { prompt: SelectHandEffect }
  # LadyDevimon (cost 7: 3 -> -4). Her [On Play] seats P-180.
  - actor: 0
    do: { play: { card: BT25-083, from: hand } }
    expect: { prompt: main_phase }
  # DCGO-ONLY: the zone menu. 1 = "Hand" (the VALUE, not an index).
  - actor: 0
    do: { select: { value: 1, dcgo_only: true } }
    expect: { prompt: generic_int }
  # SHARED: the [Three Musketeers] trait card to place.
  - actor: 0
    do: { select: { cards: [P-180] } }
    expect: { prompt: SelectHandEffect }
  # SHARED: the Digimon that receives it -- LadyDevimon (P0's field.2;
  # BlackGatomon is field.0, Asuna field.1). <Draw 1>, then the turn is over.
  - actor: 0
    do: { select: { targets: [own.field.2] } }
    expect: { prompt: SelectPermanentEffect }
  # T8 (P1, 4): pass.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T9 (P0, 3): breeding prompt; Asuna declined again.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { select: { decline: true, sim_only: true } }
  - actor: 0
    do: { select: { decline: true, dcgo_only: true } }
    expect: { prompt: SelectHandEffect }
  # BlackGatomon (Lv.4) -> BeelStarmon (Lv.6) for 4 through the [All Turns]
  # grant: the only open route (BeelStarmon's own circles want a Lv.5), so no
  # cost prompt. Memory 3 -> -1.
  - actor: 0
    do: { digivolve: { from: field.0, using: BT25-085 } }
    expect: { prompt: main_phase }
  # SIM-ONLY: our `optional: true` gate on BeelStarmon's trash-to-unsuspend
  # effect (DCGO: optional: false, the "may" rides the picks' canNoSelect).
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  # SHARED: which Digimon to trash an Option from -- LadyDevimon.
  - actor: 0
    do: { select: { targets: [own.field.2] } }
    expect: { prompt: SelectPermanentEffect }
  # The Option to trash. Ours: a single-candidate EffectChoice, answered
  # through the `yes:` single-accept-id path, sim-only. DCGO: SelectCardEffect
  # over LadyDevimon's digivolution cards, by identity, wire-only.
  - actor: 0
    do: { select: { yes: true, sim_only: true } }
  - actor: 0
    do: { select: { cards: [P-180], dcgo_only: true } }
    expect: { prompt: SelectCardEffect }
  # THE CLAUSE: delete 1 of the opponent's 7000 DP or lower Digimon -- Agumon.
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect }
  # One step past the clause: memory -1, so the seat is P1 (T10; Koromon still
  # sits in the breeding area -> no breeding prompt).
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 33
    that:
      turn: 10
      p0.memory: -1
      p0.security: 5
      p0.trash: [P-180]
      p0.hand: [BT21-071, BT21-071, BT21-074, BT21-074, BT24-088, BT25-078, EX7-008]
      p0.field:
        - { card_id: BT25-083, dp: 7000, suspended: false, sources: [] }
        - { card_id: BT25-085, dp: 12000, suspended: false, sources: [BT25-082, EX7-051, ST6-01] }
        - { card_id: BT25-092, dp: -1, suspended: false, sources: [] }
      p1.field: []
      p1.trash: [ST1-03]
      p1.security: 5
