# Exam scenario: Aegiochusmon (P-213), clause P-213#effect#4 -- "[Rule]
# Trait: Has [Dragonkin] Type."
#
# Book: EXTRA book qa/dcgo-exams/P/tsj_extra_P-213.json, deck
# `tsj-p-213-dragonkin` = `ts-jupitermon` with -1 BT26-103 +1 Agumon BT21-007
# (50 main, 4x BT24-003 eggs; tournament-legal). Nothing in the TS Jupitermon
# pool reads [Dragonkin], so a Dragonkin-gated reader had to be added; the
# orchestrator merges the extra book into ts_jupitermon_pool.json. Run with a
# --decks file that contains both books. p1 is `tm-quiet-red`.
# PROVISIONAL: assert block is our engine's result, not backfilled from DCGO
# -- unconfirmed until the oracle pass.
#
# THE READER: Agumon BT21-007 "[On Play] You may return 1 Digimon card with
# the [Reptile] or [Dragonkin] trait from your trash to the hand." P-213's
# printed trait line is Shaman/Iliad/TS -- it qualifies ONLY through the
# [Rule] Dragonkin grant.
#
# THE LINE.
#   T1 (P0, 0): hard-play P-213 (0 -> -7). (Played, not digivolved: no WD.)
#   T2 (P1, 7): Biyomon ST1-02 (7 -> 5; red, for Gaia Force's colour req);
#        Gaia Force ST1-16 (5 -> -3) deletes P-213 -> P0's trash. Its own
#        <Decode> has no [Aegiomon] source -> no prompt (measured).
#   T3 (P0, 3): play Agumon BT21-007 (red, 3 -> 0). THE CLAUSE observable: its
#        [On Play] trash pick OFFERS P-213 (the only Digimon in P0's trash) ->
#        pick it -> back to hand. Trailing pass.
#
# WITNESS: at step 6 P-213 is alone in P0's trash; at step 9 it is in P0's
# hand and the trash is empty -- the Dragonkin-only filter accepted it.
#
# PROMPT SHAPE (VERIFIED against DCGO C# 2026-10-04):
#   - T2 Gaia Force on P-213: its own <Decode> (DecodeSelfEffect, cut-in
#     stack) is stacked but CanActivateDecode fails with no [Aegiomon] source,
#     so MultipleSkills' CanActivate filter drops it -> no prompt on DCGO
#     either.
#   - BT21-007's [On Play] is `SetUpActivateClass(..., -1, true, ...)`
#     (BT21/Red/BT21_007.cs) -> OptionalSkill(yes) FIRST, then the body's
#     SelectCardEffect (Root.Trash, canNoSelect true, Mode.AddHand). Ours is
#     ONE declinable trash pick -> authored as the optional_gate_fold marker
#     (`expect: {prompt: OptionalSkill}`): OptionalSkill(yes) + the pick.
#   - RISK (data, not prompt shape): DCGO's trait filter is
#     `cardSource.CardTraits.Find(x => x.Equals("Dragonkin"))` -- the raw
#     trait list of DCGO's card data. P-213's Dragonkin is a "(Rule) Trait:
#     Has [Dragonkin] Type" grant; if DCGO's entity data omits it,
#     HasMatchConditionOwnersCardInTrash is false, DCGO asks OptionalSkill
#     and NO SelectCardEffect, and the oracle aborts on the pick row. That
#     would be a DCGO data gap (official DB grants the trait), not our bug.
