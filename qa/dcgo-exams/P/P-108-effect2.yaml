# Exam scenario: Wisdom Training (P-108), clause P-108#effect#2 --
# "[Security] Place this card in the battle area."
#
# THE SECURITY-TRIGGER SKELETON: the card under exam sits at p0's stack[9] --
# the TOP of the security stack (stack[5..9] is the pile, reversed; see
# docs/DCGO_EXAM.md "What each stack position becomes") -- and p1's Biyomon
# (ST1-02, played on T2) attacks the player on T4. The check flips Wisdom
# Training; P_108.cs's SecuritySkill is `PlaceSelfDelayOptionSecurityEffect`
# (SetUpActivateClass(..., -1, false, ...) -> mandatory, no prompt,
# `PlaceDelayOptionCards`); ours `place_self_as_delay_option`. Unlike the
# later Training cards (LM-056) the [Security] does NOT run the [Main]: no
# reveal, no pick -- the card is only placed. No colour requirement applies
# to a security effect, so p0 owns no purple card here. An Option flip is no
# battle, so Biyomon survives, suspended.
#
# THE WITNESS: P-108 stands on p0's battle area with p0's security at 4, p0's
# trash EMPTY (a flipped Option that did NOT resolve this clause would be in
# the trash) and p0's hand untouched (nothing revealed or added).
#
# Book: qa/dcgo-exams/P/tm_p_108_pool.json (--decks).
card: P-108
clause: P-108#effect#2
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4): inert red filler
      - ST1-03
      - ST1-02
      - ST1-04
      - ST1-08
      - ST1-05
      # security (5-9): stack[9] is the TOP -- the Option under exam
      - ST1-02
      - ST1-04
      - ST1-08
      - BT1-009
      - P-108
      # (10+): the T3 turn draw
      - BT1-014
    rest: tm-wisdom
  p1:
    stack:
      # hand (0-4): the Biyomon, inert filler
      - ST1-02
      - ST1-03
      - ST1-04
      - BT1-009
      - ST1-05
      # security (5-9): stack[9] is the TOP
      - ST1-05
      - BT1-014
      - BT4-010
      - ST1-04
      - ST1-02
      # (10+): the T2 / T4 turn draws
      - BT4-014
      - ST1-08
    rest: quiet-opponent
steps:
  # T1 (p0, memory 0): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (p1, memory 3): play Biyomon (3 -> 1), pass out.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (p0, memory 3): all-pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (p1, memory 3): Biyomon attacks the player. THE CLAUSE.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  # One step past the clause: attacking spent no memory, p1 keeps the turn.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 9
    that:
      turn: 4
      p0.memory: -3
      p0.security: 4
      p0.trash: []
      p0.hand: [ST1-03, ST1-02, ST1-04, ST1-08, ST1-05, BT1-014]
      p0.field:
        - { card_id: P-108, dp: -1, suspended: false, sources: [] }
      p1.field:
        - { card_id: ST1-02, dp: 3000, suspended: true, sources: [] }
      p1.security: 5
