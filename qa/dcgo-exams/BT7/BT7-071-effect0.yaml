# Exam scenario: Loweemon (BT7-071), clause BT7-071#effect#0 --
# "You may digivolve this card from your hand onto one of your purple Tamers
#  as if the Tamer is a level 3 purple Digimon."
#
# DECK NOTE. `tm-mimi-purple` (qa/dcgo-exams/BT7/tm_bt7_071_pool.json) is the
# ST-6 purple vanilla shell plus red ST-1 vanillas, carrying 4x Mimi Tachikawa
# BT3-096 (a purple Tamer whose only trigger needs an Option use -- none
# happens here), 4x Loweemon BT7-071, 4x KaiserLeomon BT7-073, 4x Psychemon
# BT8-071 and 4x Purple Scramble LM-032; eggs 4x Pagumon ST6-01, never
# hatched. P1 is the shared quiet ST-1 opponent and does nothing.
#
# THE LINE. T1: P0 hard-plays Mimi (0 -> -2). T3 (memory 3): THE CLAUSE --
# P0 digivolves Loweemon from hand ONTO MIMI, paying the printed Purple Lv.3
# circle's cost of 2 (3 -> 1), and passes.
#
# WHY THE DIGIVOLVE IS SINGLE-ROUTE. Loweemon's only printed circle is Purple
# Lv.3 / cost 2; Mimi is a Tamer with no level, so that circle cannot apply
# and the digivolve is legal ONLY through the clause (BT7_071.cs:
# AddSelfDigivolutionRequirementStaticEffect(TopCard purple && IsTamer,
# digivolutionCost: 2, ignoreDigivolutionRequirement: false, condition: card
# in owner's hand); ours: the `from: { kind: tamer, color_is: purple }` +
# `source_treated_as: level_3_purple_digimon` alt-path at cost 2). One route
# => no SelectCountEffect / EffectChoice cost prompt on either side. Loweemon
# has no [When Digivolving], and Mimi as a digivolution card has no inherited
# text, so the digivolve opens nothing.
#
# WITNESS at P1's T4 breeding decision: Loweemon (5000) stands over Mimi as
# its digivolution card, P0 holds the two cards the T3 turn draw and the
# digivolve draw delivered, and P1 opened T4 on 3 (P0 -3).
card: BT7-071
clause: BT7-071#effect#0
seed: 424242
decks:
  p0:
    stack: [BT3-096, BT7-071, ST6-02, ST1-02, ST1-04,
            ST6-03, ST6-05, ST6-07, ST6-09, ST6-02,
            ST1-02, ST1-04, ST6-03]
    rest: tm-mimi-purple
  p1:
    stack: [ST1-03, ST1-02, ST1-04, BT1-009, BT3-007,
            ST1-05, BT1-014, BT4-010, ST1-04, ST1-02,
            BT4-014, ST1-08, ST1-10, BT1-014]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0): decline breeding; Mimi (0 -> -2).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT3-096, from: hand } }
    expect: { prompt: main_phase }
  # T2 (P1, memory 2): nothing.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0, memory 3): THE CLAUSE -- Loweemon onto Mimi for 2 (3 -> 1); pass.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT7-071 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1): trailing breeding decision.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  - at: 7
    that:
      turn: 4
      p0.memory: -3
      p0.hand: [ST6-02, ST1-02, ST1-04, ST1-02, ST1-04]
      p0.trash: []
      p0.field:
        - card_id: BT7-071
          dp: 5000
          suspended: false
          sources: [BT3-096]
