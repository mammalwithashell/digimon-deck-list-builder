# Exam scenario: ST1-12 (Tai Kamiya), [Your Turn] All of your Digimon get +1000 DP.
#
# The first exam scenario that PLAYS A CARD rather than passing. The prefix is
# eleven passes, which is not padding: with both seats declining everything, the
# memory gauge only reaches this Tamer's cost-2 threshold on the sixth turn.
# That is the honest cost of DCGO reaching a position by legally playing to it
# instead of having a board materialised for it.
#
# Both seats are scripted. `first_player: 0` is honoured by DCGO as of the
# 2026-08-22 fix, so this actor sequence is authored against OUR engine's
# convention rather than against whatever DCGO happened to roll.
#
# Steps alternate breeding / main within a turn, and turns alternate in pairs:
# actors 0,0, 1,1, 0,0, ... Even steps are the breeding decision (hatch or
# decline); odd steps are the main phase. A card can only be played on an odd
# step -- probing an even one only ever offers Hatch/Pass.
card: ST1-12
clause: ST1-12#effect#0
seed: 424242
# STATUS: this is the proof-of-concept scenario (the first exam line that ever
# played a card), NOT a tracked clause -- ST1-12 has no entry in
# qa/qa-reports/dcgo_exam_verdicts.json. Its job is to keep the sim-only CI gate
# honest. The slot pin below was re-derived for sim-only; a fresh ORACLE run of
# this changed line does not yet pass (the stacked deck shifts the turn
# structure and the tail desyncs), so do not read it as oracle-verified. The
# oracle-verified card-play evidence lives in the EX12 campaign scenarios.
#
# The stack is PINNED, not empty. With `stack: []` the two run modes disagree
# about the deck order -- sim-only uses the decklist order while an oracle run
# takes DCGO's recorded post-shuffle order -- so a `hand.N` pin resolved against
# one mode fails in the other. (That is exactly what happened here: `hand.6` was
# read off the oracle lowering and the sim-only CI gate went red.) Pinning the
# card under test to the top of the draw makes the slot mode-independent.
decks:
  p0: { stack: [ST1-12], rest: starter_st1_gaia_red }
  p1: { stack: [], rest: starter_st1_gaia_red }
steps:
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  # Turn 6 main phase: memory has finally reached 2, so the Tamer is affordable.
  - actor: 1
    do: { play: { card: ST1-12, from: hand.7 } }
    expect: { prompt: main_phase }
  # Playing a card does NOT end the turn -- DCGO returns to the main phase and
  # asks the same seat again. Without this trailing pass the line runs out and
  # the job aborts on "line exhausted", which is the driver working correctly
  # and the LINE being wrong.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
