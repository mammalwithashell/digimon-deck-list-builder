# Cloud Oracle candidate: Giga Destroyer deletes two distinct legal targets.
# Extends the existing one-target line with Dracomon at the exact DP ceiling.
# Both players follow legal actions from game start; no staged board state.
# Assertions below are authored expectations, NOT DCGO-observed backfill.
# A green --sim-only result does not establish an Oracle verdict.
card: ST1-15
clause: ST1-15#effect#0
seed: 424242
decks:
  p0:
    stack: [ST1-15, ST1-02, ST1-04, ST1-05, ST1-06,   # opening hand
            ST1-13, ST1-13, ST1-14, ST1-14, ST1-12,   # security
            ST1-03, ST1-03]                            # turn-3 / turn-5 draws
    rest: starter_st1_gaia_red
  p1:
    stack: [ST1-02, ST1-04, ST1-05, ST1-06, ST1-07,   # opening hand
            ST1-09, ST1-09, ST1-12, ST1-12, ST1-13,   # security
            ST1-08, ST1-08]                            # turn-2 / turn-4 draws
    rest: starter_st1_gaia_red
steps:
  # Turn 1 (p0): hatch, digivolve the breeding Koromon into Biyomon, pass.
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: breeding, using: ST1-02 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # Turn 2 (p1): the same.
  - actor: 1
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { digivolve: { from: breeding, using: ST1-02 } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # Turn 3 (p0): move Biyomon to the battle area (red presence for the Option).
  - actor: 0
    do: { move: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # Turn 4: Biyomon (3000 DP) moves out; play Dracomon (4000 DP) at 3 -> 0.
  - actor: 1
    do: { move: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-04, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # Turn 5 (p0): decline the breeding phase, play the Option, answer its prompt.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: ST1-15, from: hand } }
    expect: { prompt: main_phase }
  # Select both legal targets, including Dracomon exactly at the 4000 DP limit.
  - actor: 0
    do: { select: { targets: [opp.field.0, opp.field.1] } }
    expect: { prompt: SelectPermanentEffect }
  # The cost-6 play took memory to -3, ending p0's turn after resolution, so
  # the next prompt is p1's breeding decision.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
assert:
  # Prove the two targets exist before answering; the second is at the DP ceiling.
  - at: 13
    that:
      p1.field:
        - { card_id: ST1-02, dp: 3000, sources: [ST1-01], suspended: false }
        - { card_id: ST1-04, dp: 4000, sources: [], suspended: false }
  # Snapshot 14 is before the next decision, after step 13 resolves both deletions.
  - at: 14
    that:
      p0.memory: -3
      p0.trash: [ST1-15]
      p1.field: []
      p1.trash: [ST1-01, ST1-02, ST1-04]
      p0.field:
        - { card_id: ST1-02, dp: 3000, sources: [ST1-01], suspended: false }
