    stack: [EX13-045, BT20-007, BT1-090, BT1-090, BT3-093, ST1-03, ST1-03, ST1-03, ST1-03, ST2-03, BT3-093, BT3-093, ST1-02, ST1-02, ST2-04, ST2-04]
    rest: EX13-045-raid-repair-p0
  p1:
    # hand: ST1-11, BT1-090 x2, BT3-093 x2 | security bottom->top: ST1-03 x4, ST2-03 (TOP: first Security Digimon) | draws: BT3-093, BT3-093, ST1-02, ST1-02, ST2-04, ST2-04
    stack: [ST1-11, BT1-090, BT1-090, BT3-093, BT3-093, ST1-03, ST1-03, ST1-03, ST1-03, ST2-03, BT3-093, BT3-093, ST1-02, ST1-02, ST2-04, ST2-04]
    rest: EX13-045-raid-repair-p1
steps:
- { actor: 0, do: { pass: {} }, expect: { prompt: breeding_action } }
- { actor: 0, do: { pass: {} }, expect: { prompt: main_phase } }
- { actor: 1, do: { pass: {} }, expect: { prompt: breeding_action } }
# T2: WarGreymon (12) at 3 memory -> P0 starts T3 with 9.
- { actor: 1, do: { play: { card: ST1-11, from: hand } }, expect: { prompt: main_phase } }
- { actor: 0, do: { pass: {} }, expect: { prompt: breeding_action } }
# T3: hard-play Examon (15) at 9 -> -6. No sources, so the win effect can only pick from hand.
- { actor: 0, do: { play: { card: EX13-045, from: hand } }, expect: { prompt: main_phase } }
- { actor: 1, do: { pass: {} }, expect: { prompt: breeding_action } }
- { actor: 1, do: { pass: {} }, expect: { prompt: main_phase } }
- { actor: 0, do: { pass: {} }, expect: { prompt: breeding_action } }
# T5: Examon attacks the player.
- { actor: 0, do: { attack: { attacker: field.0, target: security } }, expect: { prompt: main_phase } }
# <Raid> window (WarGreymon is the unsuspended highest-DP target): DECLINE. Fold marker: DCGO asks
# OptionalSkill (Raid.cs isOptional true) and a declined gate emits OptionalSkill(no) only.
- { actor: 0, do: { select: { decline: true } }, expect: { prompt: OptionalSkill } }
# Check 1: ST2-03 Gabumon is a Security Digimon; Examon wins the battle -> effect#7 triggers.
# Only hand candidates exist, so DCGO opens SelectHandEffect directly (no generic_int zone menu).
- { actor: 0, do: { select: { cards: [BT20-007] } }, expect: { prompt: SelectHandEffect } }
# Check 2 (<Security A. +1>): ST1-03 Agumon loses; OPT already used -> no prompt. End the turn.
- { actor: 0, do: { pass: {} }, expect: { prompt: main_phase } }
