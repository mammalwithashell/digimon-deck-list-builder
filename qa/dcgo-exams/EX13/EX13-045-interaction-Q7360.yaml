# Q7360 (2026-09-18): a "when this Digimon wins a battle" effect also triggers when the battle won
# is against a Security Digimon. Prefix is the oracle-confirmed EX13-045-raid-repair line (P1's
# WarGreymon funds the hard play: P0 at 9 memory pays 15 -> -6; pay_memory refuses to go below -10).
# On turn 5 Examon attacks the PLAYER: <Raid> is offered (WarGreymon is an unsuspended target) and is
# DECLINED so the attack stays on the player. Security check 1 flips ST2-03 Gabumon (2000 DP): a
# Security Digimon battle Examon (15000) wins -> [Your Turn][Once Per Turn] "wins a battle" triggers
# -> hand pick of BT20-007 Dracomon (the only [Dracomon]/[Examon] text card in hand), played free.
# <Security A. +1> gives a second check: ST1-03 Agumon loses too, but the OPT is spent -> no prompt.
# Final-row observable: p0.field has BT20-007 (1000 DP) + EX13-045 suspended; p1.security 3;
# p1.trash = ST1-03, ST2-03.
# DCGO: the security battle is IBattle(Attacking, DefendingPermanent: null, DefendingCard: broken)
# (CardController.cs:4480), so OnEndBattle + CanTriggerWhenWinBattle (LoserCard present) fire;
# a lone non-optional trigger goes straight to Activate (MultipleSkills.cs:273-277) and EX13_045.cs
# opens SelectHandEffect directly (isOptional false, canNoSelect true; no zone menu because a
# hard-played Examon has no digivolution cards). Pierce cannot stack: CanTriggerPierce needs an
# opponent PERMANENT deleted by battle.
# Sources: data/card_bundles/EX13-045.md; base DCGO EX13/Green/EX13_045.cs; Raid.cs (isOptional
# true -> OptionalSkill gate, folded); Pierce.cs; WhenWinBattle.cs.
# Draft: sim-only legality is not oracle confirmation. expect_ruling is authored later.
card: EX13-045
clause: EX13-045#effect#7
covers: [EX13-045#effect#7, EX13-045#effect#3, EX13-045#effect#1]
