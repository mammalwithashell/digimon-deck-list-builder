    # [0..4] hand; [5..9] security (never touched); [10], [11] = the T3 / T5 draws.
    stack: [ST4-12, BT13-060, ST4-02, ST4-02, ST4-02,
            ST4-04, ST4-04, ST4-04, ST4-04, ST4-05,
            ST4-02, ST4-05]
    rest: tm-rosemon-bm
  p1:
    # [0..4] hand; security stack[9] = BT1-009 (trashed by the clause),
    # stack[8] = Dracomon ST1-04 (the check); [10], [11] = the T2 / T4 draws.
    stack: [ST1-02, ST1-12, ST1-03, ST1-08, ST1-05,
            BT1-009, BT1-009, BT1-009, ST1-04, BT1-009,
            ST1-05, ST1-05]
    rest: tm-rosemon-opponent
steps:
