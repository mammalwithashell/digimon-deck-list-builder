# Exam scenario: Rosemon: Burst Mode (BT13-060), clause BT13-060#effect#2 --
# "[When Attacking] Trash the top card of your opponent's security stack for
#  every 2 of your opponent's suspended Digimon and/or Tamers."
#
# The count needs TWO suspended opposing Digimon/Tamers at declaration. The
# card's own [When Digivolving] supplies exactly that: it suspends 1 opposing
# Digimon and 1 opposing Tamer, so the count is 2 / 2 = 1 and ONE security card
# is trashed (the top one, stack[9]); the security check then reads stack[8].
#
# MEMORY. BT13-060 digivolves from a Lv.6 Green for 5. P0 arrives at T5 with
# whatever P1 left it, and the turn ends the moment memory goes below 0, so
# the attack needs P0 to hold >= 5 going in. P1 gets there by overspending on
# T4 (7 -> -6: Biyomon 2, Tai 2, ST1-03 3, ST1-08 6), which hands P0 6.
# After the digivolve P0 sits at 1 -- still P0's turn -- and attacks.
#
#   T1 (P0): pass everything.
#   T2 (P1, 3): pass everything.
#   T3 (P0, 3): play Rosemon ST4-12 (10: 3 -> -7). It has no [On Play].
#   T4 (P1, 7): Biyomon ST1-02, Tai Kamiya ST1-12 (a Tamer), ST1-03, ST1-08
#            (13 total: 7 -> -6); the turn hands over on its own.
#   T5 (P0, 5): digivolve ST4-12 into BT13-060 (cost 5: 6 -> 1).
#            [When Digivolving] (BT13_060.cs, OnEnterFieldAnyone): NOT optional
#            (SetUpActivateClass(..., -1, false, ...)), so no yes/no gate.
#            1. SelectPermanentEffect(Mode.Tap, maxCount 1) over opposing
#               Digimon -- three candidates (Biyomon, ST1-03, ST1-08); we pick
#               Biyomon by slot (distinct id, so DCGO's centre-out frame order
#               cannot make the pick ambiguous).
#            2. SelectPermanentEffect(Mode.Tap, maxCount 1) over opposing
#               Tamers -- Tai Kamiya, the only one.
#            Then the can't-unsuspend modifier; nothing asked.
#            THE CLAUSE: Rosemon attacks the player. [When Attacking]
#            (OnAllyAttack) is mandatory (isOptional false) and live when
#            security >= 1 and count() >= 1 (2 suspended / 2 = 1): no prompt on
#            either side; IDestroySecurity trashes P1's top security card, the
#            BT1-009 at stack[9]. The check then reads Dracomon ST1-04 (4000)
#            at stack[8], which loses to Rosemon. P1 security 5 -> 3.
#   T5 trailing: P0 passes at 0; P1 gets 3.
card: BT13-060
clause: BT13-060#effect#2
