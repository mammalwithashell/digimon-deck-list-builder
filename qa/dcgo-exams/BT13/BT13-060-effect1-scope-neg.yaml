# Interaction exam (NEGATIVE probe, family `scope`): Rosemon: Burst Mode
# (BT13-060), clause BT13-060#effect#1 --
# "[When Digivolving] Suspend 1 of your opponent's Digimon and 1 of their
#  Tamers. Until the end of your opponent's turn, all of their Digimon and
#  Tamers don't unsuspend."
#
# WHAT THE NEGATIVE SHOWS. The "don't unsuspend" rider is scoped by two things:
# WHOSE permanents (the opponent's, never the digivolving player's) and HOW
# LONG ("until the end of your opponent's turn" -- exactly ONE opponent turn).
# The line reaches the clause, lets it fire, and then watches the two edges:
#
#   * T4 (P1's turn right after the digivolve): the suspended Biyomon
#     ST1-02 and Tai Kamiya ST1-12 stay suspended through P1's unsuspend phase.
#     That is the clause's positive half and the baseline for the negative.
#   * T6 (P1's NEXT turn): the rider has expired, so P1's unsuspend phase DOES
#     unsuspend Biyomon and Tai again. A rider that wrongly outlived "the end of
#     your opponent's turn" (or latched onto the permanents for good) leaves
#     them suspended here and the oracle differ reports it.
#   * Agumon ST1-03, never selected, is unsuspended throughout: the suspend half
#     takes exactly 1 Digimon + 1 Tamer, not "all of them".
#   * P0's own Rosemon (BT1-082 -> BT13-060) is untouched by the rider; it is
#     unsuspended all line (nothing here ever suspends it).
#
# THE LINE DOES NOT ATTACK: Rosemon: Burst Mode's [When Attacking] ("trash the
# top card of your opponent's security stack for every 2 suspended Digimon /
# Tamers") is a different clause (#effect#2) and attacking would put noise in
# this one's observation.
#
# PROMPTS. Both picks are real prompts on both wires: DCGO's harness always
# takes the AI branch of SelectPermanentEffect (the "forced selection" shortcut
# lives only in the human-UI branch), and the clause's SetUpActivateClass is
# `isOptional: false` so there is no OptionalSkill gate. Order is Digimon pick
# then Tamer pick (BT13_060.cs). The picks travel by top-card identity; P1's
# Biyomon/Agumon/Tai are three distinct ids so slot order cannot mislead DCGO.
# P0 has exactly ONE Digimon so `field.0` is the same slot on both wires
# (DCGO seats centre-out; see BT19-075-effect2.yaml "SLOT SAFETY").
#
# Memory: T1 P0 Rosemon BT1-082 hard-played for 12: 0 -> -12 -> P1 on 12.
#   T2 P1 Biyomon (2) + Agumon (3) + Tai (2) = 7: 12 -> 5, pass -> P0 on 3.
#   T3 P0 digivolve to BT13-060 for 5: 3 -> -2 (turn ends after the trigger).
#   T4 P1 on 2: all-pass -> P0 on 3.   T5 P0 all-pass -> P1 on 3.
#   T6 P1: unsuspend phase (the observation), then pass.
# BT1-082's own text ("[Opponent's Turn] ... if this Digimon is suspended")
# never applies: P1 never attacks and Rosemon is never suspended.
#
# Book: qa/dcgo-exams/BT13/bt13_060_pool.json (--decks).
