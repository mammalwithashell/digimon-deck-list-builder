- actor: 0
  do: { pass: {} }
  expect: { prompt: breeding_action }
- actor: 0
  do: { play: { card: BT13-096, from: hand } }
  expect: { prompt: main_phase }
- actor: 0
  do: { pass: {} }
  expect: { prompt: main_phase }
