# Interaction draft for Q2342 (no oracle result claimed; no expect_ruling yet).
# Homer Yushima's [All Turns] "When you play a blue Digimon, by suspending this
# Tamer, you may ..." when the played Digimon is deleted by the 0-DP rule check at
# the moment it is played (general_rule 17-1-3-1) because an OPPONENT'S effect that
# had already activated gives all of P0's Digimon -5000 DP.
# Opponent effect: ShineGreymon: Ruin Mode (EX4-074) "[On Deletion] Until the end of
# your opponent's next turn, all of your opponent's Digimon get -5000DP". P1
# hard-plays it (cost 14 needs 4 memory: both engines floor memory at -10 --
# mask.rs:155, Player.cs:1131 MaxMemoryCost), attacks P0's security on its next
# turn, and its own [End of Attack] deletes it, firing [On Deletion]. DCGO installs
# that as a player-level ChangeDigimonDPPlayerEffect with a live permanentCondition
# (EX4_074.cs:92-104), ours as a continuous ChangeDp modifier (cards/ex4/EX4-074.yaml
# clause 1), so a Digimon ENTERING during the window is debuffed on both sides.
# P0 then plays Gabumon (ST2-03, blue Lv.3, 2000 DP): DP <= 0, deleted as played.
# The ruling observation is the trigger itself: Homer's optional-cost yes/no is
# asked and accepting it suspends the Tamer (15-7-4: the cost may be paid even
# though the placement can no longer execute). P0's hand holds no blue Lv.4-or-
# lower card at that point, so neither engine has a placement pick to ask.
# Ikkakumon (ST2-05, vanilla, cost 4) is P0's T1 play only to hand P1 the 4 memory
# the 14-cost hard play needs; Ruin Mode's [End of Attack] "delete 1 of your
# opponent's Digimon" then takes it (P1's pick).
card: BT13-096
clause: BT13-096#effect#1
covers:
- BT13-096#effect#1
interaction:
  id: qa:Q2342
  source: qa
  kind: positive
