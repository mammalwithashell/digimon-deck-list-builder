    - EX4-074    # opening hand
    - ST1-02
    - ST1-04
    - ST1-05
    - ST1-06
    - ST1-03     # security
    - ST1-03
    - ST1-07
    - ST1-07
    - ST1-08
    - ST2-04     # T2 draw
    - ST2-05     # T4 draw
    - ST2-06     # T4 <Recovery +1 (Deck)>
    - ST2-06     # T6 draw
    rest: BT13-096-interaction-Q2342-p1
