    - ST2-07
    - ST2-07
    - ST2-02     # security TOP: checked by Ruin Mode's attack (vanilla 3000 DP)
    - ST2-08     # T3 draw
    - ST1-05     # T5 draw
    - ST1-02
    - ST1-02
    rest: BT13-096-interaction-Q2342-p0
  p1:
