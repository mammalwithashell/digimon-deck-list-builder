# Exam scenario: Medusamon (BT21-029), clause BT21-029#effect#3 --
# "[All Turns] [Once Per Turn] When any of your opponent's Digimon are deleted
#  or their security stack is removed from, they play 1 [Petrification] Token."
#
# THE QUESTION THIS LINE ASKS. The printed clause carries ONE [Once Per Turn]
# governing TWO trigger conditions joined by "or", so satisfying both in a single
# turn should still yield exactly ONE Token. DCGO models it that way: BT21_029.cs
# registers the two arms under different timings (OnDestroyedAnyone at line 162,
# OnLoseSecurity at line 210) but gives them the SAME lockout key --
# SetHashString("PlayToken_BT21_029") at lines 167 and 215.
#
# Our BT21-029.yaml instead declares them as TWO separate clauses, each with its
# own `once_per_turn: true`, so each keeps its own counter and both can fire in
# one turn. PREDICTION: our engine plays 2 Tokens where DCGO plays 1. The
# assertions below record OUR behaviour, so a divergence here is the finding --
# and per source priority the printed card text outranks DCGO anyway, and it
# agrees with DCGO.
#
# HOW ONE TURN SATISFIES BOTH CONDITIONS:
#   * The attack removes from the opponent's security -> condition 2.
#   * The [End of Attack] delete (clause (c)) then deletes one of the opponent's
#     [Petrification] Tokens -> condition 1.
# The deleted Token's own [On Deletion] also trashes a security card, which is
# why the security delta below is 3 rather than the 2 that BT21-029-effect0.yaml
# measures for <Security A. +1> alone.
#
# THE LINE reuses the oracle-CONFIRMED prefix from BT21-029-effect2.yaml; see
# that file's header for the Red LIBERATOR chain and the memory accounting.
card: BT21-029
clause: BT21-029#effect#3
seed: 424242
decks:
  p0:
    stack: [BT23-005, BT21-015, BT21-024, BT21-029, BT21-007,
            BT21-008, BT24-008, EX11-008, BT24-012, BT21-017]
    rest: medusamon-liberator
  p1:
    stack: [BT23-005, BT21-007, BT24-008, EX11-008, BT24-012,
            BT21-015, BT21-017, BT21-008, BT21-025, BT21-024]
    rest: medusamon-liberator
steps:
  # T1 (P0): hatch.
  - actor: 0
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1): hatch.
  - actor: 1
    do: { hatch: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T3 (P0): breeding-digivolve -> Elizamon BT21-008.
  - actor: 0
    do: { digivolve: { from: breeding, using: BT23-005 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1): breeding-digivolve -> Elizamon BT23-005.
  - actor: 1
    do: { digivolve: { from: breeding, using: BT23-005 } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, memory 3): promote, then two digivolutions in the one turn.
  - actor: 0
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT21-015 } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT21-024 } }
    expect: { prompt: main_phase }
  # Cyberdramon BT21-024's own [When Digivolving]: the OPPONENT places 1 card
  # from hand as their bottom security card, then their top security card is
  # trashed. Net security is unchanged at 5. Medusamon is not on the field yet,
  # so this security removal does NOT trigger the clause under exam.
  - actor: 1
    do: { select: { cards: [BT21-007] } }
  # T6 (P1, memory 2): promote Elizamon to the battle area.
  - actor: 1
    do: { move: { from: breeding } }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T7 (P0): digivolve into Medusamon -- THE CLAUSE.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { digivolve: { from: field.0, using: BT21-029 } }
    expect: { prompt: main_phase }
  # The clause is "You may ..." -- take the optional gate, then pick the target.
  - actor: 0
    do: { select: { yes: true } }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
  # One step past the clause. Paying 4 for Medusamon took memory to -1, so the
  # turn has ALREADY handed over by the time this step is answered -- the seat
  # here is P1, not P0. (Our engine does not enforce the declared actor; DCGO
  # does, and rejected `actor: 0` here on the second oracle run.)
  - actor: 1
    do: { pass: {} }
  # T8 (P1): nothing.
  - actor: 1
    do: { pass: {} }
  # T9 (P0): skip the breeding action, then attack the player.
  - actor: 0
    do: { pass: {} }
  # THE CLAUSE. Medusamon (BT21-029) has <Security A. +1>, so this attack must
  # check TWO security cards, not one.
  - actor: 0
    do: { attack: { attacker: field.0, target: security } }
  # THE CLAUSE. Take the [End of Attack] delete and aim it at one of the
  # opponent's [Petrification] Tokens. That deletion is an OPPONENT'S DIGIMON
  # BEING DELETED, so it satisfies clause (d)'s FIRST trigger condition -- while
  # this same attack has already satisfied its SECOND (their security stack was
  # removed from). Both conditions of one [Once Per Turn] clause, inside one turn.
  - actor: 0
    do: { select: { yes: true } }
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
assert:
  # Final state. Security 5 -> 2 across the attack: two cards from the attack
  # itself (base + <Security A. +1>) and one from the deleted Token's
  # [On Deletion].
  #
  # p1.field is the measurement. Our engine leaves TWO Tokens: the security-
  # removal arm played one, the [End of Attack] delete removed one of the two
  # then on the board, and the deletion arm played another. If clause (d)'s
  # [Once Per Turn] were shared across both arms -- as the card prints it and as
  # DCGO implements it -- the deletion arm would be locked out and exactly ONE
  # Token would remain.
  - at: 24
    that:
      turn: 9
      p1.security: 2
      p1.field:
        - card_id: TOKEN_PETRIFICATION
          dp: 3000
          suspended: false
          sources: []
        - card_id: TOKEN_PETRIFICATION
          dp: 3000
          suspended: false
          sources: []
