# Probe scope (negative): BT21-074#effect#2 [When Attacking] [Once Per Turn]
# "By trashing 1 card with the [Appmon] or [Three Musketeers] trait from your
#  Digimon's digivolution cards, <De-Digivolve 1> 1 of your opponent's Digimon."
#
# The clause is guarded by its cost: it needs an eligible card among a Digimon's
# digivolution cards. Here P0 DECLINES the [On Play] tuck (as in
# BT21-074-effect1-optional-decline.yaml), so Satellamon holds no digivolution
# cards at all even though Scopemon (BT21-071, an [Appmon] card) sits in hand.
# Satellamon then attacks while P1 has a Kokatorimon stack (Lv.4 over Biyomon)
# that a wrongly-firing clause would De-Digivolve. Expected: no OptionalSkill,
# no material pick, no target pick -- the attack goes straight to the security
# check and Kokatorimon is untouched.
