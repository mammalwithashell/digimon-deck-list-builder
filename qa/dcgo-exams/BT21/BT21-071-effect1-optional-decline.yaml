# Interaction exam: probe:BT21-071#effect#1:optional_decline
# Scopemon (BT21-071) [On Play] "By placing 1 [Appmon]/[Three Musketeers] card
# from hand or trash as a Digimon's bottom digivolution card, gain 1 memory."
#
# Same setup as BT21-071-effect1.yaml (P1 overspends so P0 has 5 memory on T3;
# Scopemon takes it to 1). Here the player ACCEPTS the OptionalSkill gate
# (DCGO-only row) and then DECLINES the card pick (SelectHandEffect is
# canNoSelect: true in BT21_071.cs). The "By placing" cost is therefore never
# paid: no card is tucked, no host prompt, and NO memory is gained -- memory
# must stay at 1, Scopemon has no sources, P-180 stays in hand. A divergence
# would be an engine that still gains the memory (or tucks) after an empty pick.
