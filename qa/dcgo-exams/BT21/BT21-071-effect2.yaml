# Exam scenario: Scopemon (BT21-071), clause BT21-071#effect#2 --
# "+3000 DP" (the link box: the DP the HOST gains while Scopemon is linked).
#
# DCGO carries this as card DATA, not script: CEntity_Base.LinkDP ->
# Permanent.AddLinkCard does `LinkedDP += addedLinkCard.LinkDP`, and
# Permanent.DP adds LinkedDP (Permanent.cs:470/639/1278). Ours is a
# `scope: linked` aura, dp_modifier 3000.
#
# Same opening as BT21-071-inherited0.yaml (read its header for the T1-T4
# reasoning and the full link prompt shape). On T5 a second Scopemon is
# linked from hand into Scopemon A: A reads 4000 before, 7000 after. The
# BEHAVIOURAL witness is the attack that follows: A attacks security and
# flips Birdramon ST1-05 (vanilla, 5000 DP, pinned at P1 stack[9] = security
# TOP). At 7000 A wins the security battle and survives; at its printed 4000
# it would be deleted. Attacks cost nothing; memory stays 1.
#
# PROMPT SHAPE after the link rows: attack declaration = one main_phase row;
# P1 holds no <Blocker> (Biyomon, Garudamon ST1-08) and nobody has a [When
# Attacking] / counter effect, so neither side asks anything until the
# trailing pass. Birdramon has no [Security] effect.
card: BT21-071
clause: BT21-071#effect#2
seed: 424242
decks:
  p0:
    # stack[0..4] hand; [5..9] security; [10] T3 draw; [11] T5 draw (the
    # linked Scopemon); [12],[13] the [When Linking] <Draw 2>.
    stack: [BT21-071, BT24-088, BT24-088, BT24-088, BT24-088,
            BT25-082, BT25-082, BT25-082, BT25-082, BT25-058,
            BT25-092, BT21-071, P-180, EX7-051]
    rest: three-musketeers
  p1:
    # stack[9] = Birdramon ST1-05 = TOP of security (the flipped card).
    stack: [ST1-02, ST1-08, ST1-03, ST1-03, ST1-03,
            ST1-02, ST1-02, ST1-02, ST1-04, ST1-05,
            ST1-03, BT1-009]
    rest: quiet-opponent
steps:
  # T1 (P0, memory 0)
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (P1, 3): overspend to 5 on P0's side.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { play: { card: ST1-08, from: hand } }
    expect: { prompt: main_phase }
  # T3 (P0, 5): Scopemon A, the host.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT21-071, from: hand } }
    expect: { prompt: main_phase }
  # DCGO-ONLY vacuous OptionalSkill (no eligible trait card in hand/trash).
  - actor: 0
    do: { select: { decline: true, dcgo_only: true } }
    expect: { prompt: OptionalSkill }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T4 (P1, 3)
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T5 (P0, 3): link Scopemon B from hand into A (3 -> 1).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { link: { card: BT21-071, from: hand } }
    expect: { prompt: main_phase }
  # DCGO-ONLY: LinkEffect is SetUpActivateClass(..., isOptional: true)
  # (CardEffectFactory/KeyWordEffects/Link.cs), so DCGO confirms the declared
  # <Link> with an OptionalSkill yes/no BEFORE the host pick. Our engine treats
  # the declaration itself as the decision and parks nothing. Measured
  # 2026-09-18: the first oracle run aborted here ("expected prompt
  # 'SelectPermanentEffect' but DCGO asked 'OptionalSkill'").
  - actor: 0
    do: { select: { yes: true, dcgo_only: true } }
    expect: { prompt: OptionalSkill }
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect, count: 1 }
  # Mandatory [When Linking]: <Draw 2>, then trash 2 (one DCGO prompt).
  - actor: 0
    do: { select: { cards: [P-180, EX7-051] } }
    expect: { prompt: SelectHandEffect, count: 2 }
  # THE CLAUSE's witness: A (7000 with the link box) attacks security.
  - actor: 0
    do: { attack: { attacker: field.0, target: security } }
    expect: { prompt: main_phase }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 12
    that:
      turn: 5
      p0.field:
        - { card_id: BT21-071, dp: 4000, suspended: false, sources: [] }
  - at: 16
    that:
      turn: 5
      p0.memory: 1
      p0.field:
        - { card_id: BT21-071, dp: 7000, suspended: false, sources: [] }
      p1.security: 5
  - at: 17
    that:
      turn: 5
      phase: Main
      p0.memory: 1
      p0.trash: [P-180, EX7-051]
      p0.hand: [BT24-088, BT24-088, BT24-088, BT24-088, BT25-092]
      p0.field:
        - { card_id: BT21-071, dp: 7000, suspended: true, sources: [] }
      p1.security: 4
      p1.trash: [ST1-05]
