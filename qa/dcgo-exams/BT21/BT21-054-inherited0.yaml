# Exam scenario: Shotmon (BT21-054), clause BT21-054#inherited#0 --
# "<Link> [Appmon] trait: Cost 1 (Plug this card from the hand or battle area
#  sideways into the specified Digimon in the battle area.) [When Linking]
#  Delete 1 of your opponent's Digimon with a play cost of 3 or less."
#
# THE LINE. p1 overspends on T2 (Biyomon ST1-02, play cost 2, then Garudamon
# ST1-08, play cost 6: 3 -> 1 -> -5), which hands p0 five memory and leaves
# exactly one LEGAL [When Linking] target (Biyomon) beside one the play-cost
# gate must exclude (Garudamon, 6). On T3 p0 plays the host Shotmon (5 -> 2;
# its optional [On Play] is silent -- no own Digimon has a digivolution card,
# DCGO CanActivateCondition false, our `condition:` false), then the second
# Shotmon declares its <Link> from the HAND into it (cost 1: 2 -> 1). The
# mandatory [When Linking] deletes Biyomon.
#
# PROMPT SHAPE (BT21_054.cs, regions "Link" / "When Linking"):
#   1. main_phase -- the HAND_EFFECT link bit (Shotmon has no [Hand][Main]).
#   2. OptionalSkill, DCGO-ONLY -- CardEffectFactory.LinkEffect is
#      SetUpActivateClass(..., isOptional: true) (KeyWordEffects/Link.cs), so
#      DCGO confirms the declared <Link> before the host pick; our engine
#      treats the declaration as the decision. Measured on BT21-071 /
#      BT21-074 (NOTES-BT21-074.md, "Update 2026-09-18 (oracle)").
#   3. SelectPermanentEffect -- the host ("Select 1 Digimon to link.",
#      maxCount 1, canNoSelect: false, asked with a single candidate) -- both
#      sides.
#   4. SelectPermanentEffect -- WhenLinked is SetUpActivateClass(..., -1,
#      false, ...) = MANDATORY, so NO OptionalSkill; Mode.Destroy, maxCount 1,
#      canNoSelect: false over opponent Digimon with HasPlayCost &&
#      GetCostItself <= 3 -> the single candidate Biyomon, still asked. Ours:
#      `select_opponent_permanent { play_cost_lte: 3 }`, parked with one
#      candidate. `candidates:` pins the gate: Garudamon is on the board and
#      must NOT be offered.
# Linking from hand is not a play (Permanent.AddLinkCard, root Hand): the
# linking Shotmon's [On Play] does not fire. One trigger only -> no
# MultipleSkills. Biyomon / Garudamon are vanilla -> no [On Deletion].
#
# The from-FIELD origin of the same keyword is measured on the sister card by
# BT21-071-inherited1.yaml (same LinkEffect / FIELD_EFFECT_SLOT_FOR_LINK
# path); the link-box DP by BT21-054-effect2.yaml.
#
# Book: qa/dcgo-exams/BT21/tm_bt21_054_pool.json (--decks).
card: BT21-054
clause: BT21-054#inherited#0
seed: 424242
decks:
  p0:
    stack:
      # hand (0-4): the host Shotmon, inert filler
      - BT21-054
      - ST1-04
      - ST1-04
      - BT1-009
      - ST1-05
      # security (5-9): stack[9] is the TOP
      - BT1-014
      - BT1-014
      - BT4-014
      - BT4-014
      - ST1-10
      # (10+): T3 turn draw = the linking Shotmon
      - BT21-054
    rest: tm-shotmon
  p1:
    stack:
      # hand (0-4): Biyomon (the legal target), Garudamon (the excluded one)
      - ST1-02
      - ST1-08
      - ST1-03
      - ST1-04
      - BT1-009
      # security (5-9): stack[9] is the TOP
      - ST1-05
      - BT1-014
      - BT4-010
      - ST1-04
      - ST1-02
      # (10+): p1's T2 turn draw
      - BT4-014
    rest: quiet-opponent
steps:
  # T1 (p0, memory 0): all-pass (no hatch).
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
  # T2 (p1, memory 3): Biyomon (3 -> 1), Garudamon (1 -> -5). p0 gets 5.
  - actor: 1
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 1
    do: { play: { card: ST1-02, from: hand } }
    expect: { prompt: main_phase }
  - actor: 1
    do: { play: { card: ST1-08, from: hand } }
    expect: { prompt: main_phase }
  # T3 (p0, memory 5): the host Shotmon (5 -> 2); its [On Play] is silent.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: breeding_action }
  - actor: 0
    do: { play: { card: BT21-054, from: hand.0 } }
    expect: { prompt: main_phase }
  # THE CLAUSE: the second Shotmon declares its <Link> from the hand (2 -> 1).
  - actor: 0
    do: { link: { card: BT21-054, from: hand } }
    expect: { prompt: main_phase }
  # DCGO-ONLY: "Will you use 'Link (Cost: 1)'?".
  - actor: 0
    do: { select: { yes: true, dcgo_only: true } }
    expect: { prompt: OptionalSkill }
  # The host (Shotmon #1, p0's slot 0).
  - actor: 0
    do: { select: { targets: [own.field.0] } }
    expect: { prompt: SelectPermanentEffect, count: 1 }
  # [When Linking]: mandatory delete, play cost <= 3 -> Biyomon only.
  - actor: 0
    do: { select: { targets: [opp.field.0] } }
    expect: { prompt: SelectPermanentEffect, count: 1, candidates: [ST1-02] }
  # One step past the clause: p0 still holds the turn on 1.
  - actor: 0
    do: { pass: {} }
    expect: { prompt: main_phase }
assert:
  - at: 10
    that:
      turn: 3
      p0.memory: 1
      p0.hand: [ST1-04, ST1-04, BT1-009, ST1-05]
      p1.trash: []
      p1.field:
        - { card_id: ST1-02, dp: 3000, suspended: false, sources: [] }
        - { card_id: ST1-08, dp: 7000, suspended: false, sources: [] }
  - at: 11
    that:
      turn: 3
      phase: Main
      p0.memory: 1
      p0.trash: []
      p0.field:
        - { card_id: BT21-054, dp: 3000, suspended: false, sources: [] }
      p1.trash: [ST1-02]
      p1.field:
        - { card_id: ST1-08, dp: 7000, suspended: false, sources: [] }
