# qa:Q3396 (2024-03-28) -- "At what timing does my opponent choose the Digimon that attacks by this
# card's [Start of Opponent's Main Phase] effect?" -> "Immediately after this effect activates and
# you suspend 1 of your Digimon with [Dramon] or [Examon] in its name by this card's effect."
# P0 pays the cost by suspending Slayerdramon ITSELF, so the timing is visible from the board:
# (a) at the attacker-pick row (step 11) Slayerdramon is already suspended -- the opponent's pick
# comes AFTER the cost is paid, not before it; (b) Slayerdramon's own "[All Turns][Once Per Turn]
# When this Digimon becomes suspended, unsuspend it" trigger has NOT yet resolved at that row
# (general_rule.pdf 15-8-3-2: a triggered effect waits for the resolving effect to finish), so
# Zudomon can legally be sent into the still-suspended Slayerdramon at step 12. A choice taken
# before the suspend, or deferred until after the unsuspend trigger, would leave no suspended
# target and step 12 would not lower. After the forced attack resolves (Zudomon 7000 vs 12000 is
# deleted) the final row shows Slayerdramon unsuspended by its own effect.
# Step 10 carries the OptionalSkill fold marker (DCGO gate + pick; ours one declinable pick).
# The line is the confirmed EX3-024-effect1-repair.yaml line, bound here to qa:Q3396.
# Draft: sim-only legality is not oracle confirmation. expect_ruling is authored later.
card: EX3-024
clause: EX3-024#effect#1
covers: [EX3-024#effect#1, EX3-024#effect#0]
interaction: { id: "qa:Q3396", source: qa, kind: positive }
seed: 424242
decks:
  p0:
    # hand: BT20-025, EX3-024, BT1-090, BT1-090, BT3-093 | security bottom->top: ST1-03 x4, ST2-03 | draws: BT3-093, BT3-093, ST1-02, ST1-02, ST2-04, ST2-04
    stack: [BT20-025, EX3-024, BT1-090, BT1-090, BT3-093, ST1-03, ST1-03, ST1-03, ST1-03, ST2-03, BT3-093, BT3-093, ST1-02, ST1-02, ST2-04, ST2-04]
    rest: EX3-024-effect1-repair-p0
  p1:
    # hand: ST2-09, BT1-090, BT1-090, BT3-093, BT3-093 | security bottom->top: ST1-03 x4, ST2-03 | draws: BT3-093, BT3-093, ST1-02, ST1-02, ST2-04, ST2-04
    stack: [ST2-09, BT1-090, BT1-090, BT3-093, BT3-093, ST1-03, ST1-03, ST1-03, ST1-03, ST2-03, BT3-093, BT3-093, ST1-02, ST1-02, ST2-04, ST2-04]
    rest: EX3-024-effect1-repair-p1
steps:
# T1 P0: Wingdramon BT20-025 (7) -> -7 (no opponent Digimon, so no [On Play] prompt).
- { actor: 0, do: { pass: {} }, expect: { prompt: breeding_action } }
- { actor: 0, do: { play: { card: BT20-025, from: hand } }, expect: { prompt: main_phase } }
# T2 P1 (7): Zudomon ST2-09 (6) -> 1, pass.
- { actor: 1, do: { pass: {} }, expect: { prompt: breeding_action } }
- { actor: 1, do: { play: { card: ST2-09, from: hand } }, expect: { prompt: main_phase } }
- { actor: 1, do: { pass: {} }, expect: { prompt: main_phase } }
# T3 P0 (3): Wingdramon -> Slayerdramon via "3 from [Wingdramon]" (-> 0), pass.
- { actor: 0, do: { pass: {} }, expect: { prompt: breeding_action } }
- { actor: 0, do: { digivolve: { from: field.0, using: EX3-024 } }, expect: { prompt: main_phase } }
- { actor: 0, do: { select: { value: 3 } }, expect: { prompt: SelectCountEffect } }
- { actor: 0, do: { pass: {} }, expect: { prompt: main_phase } }
# T4 P1 (3): start of main phase. P0 pays the cost: suspend Slayerdramon itself.
- { actor: 1, do: { pass: {} }, expect: { prompt: breeding_action } }
- { actor: 0, do: { select: { targets: [own.field.0] } }, expect: { prompt: OptionalSkill } }
# THE RULING'S TIMING: P1 picks the attacker right after the suspension -- Slayerdramon is suspended on this row.
- { actor: 1, do: { select: { targets: [own.field.0] } } }
# Attack target: the STILL-suspended Slayerdramon (legal only because the unsuspend trigger has not resolved yet).
- { actor: 1, do: { select: { targets: [opp.field.0] } } }
# Observation: Zudomon in P1's trash, Slayerdramon unsuspended by its own [All Turns] effect.
- { actor: 1, do: { pass: {} }, expect: { prompt: main_phase } }
expect_ruling:
  q_id: Q3396
  assert:
  - at: 11
    that:
      p0.field:
      - card_id: EX3-024
        suspended: true
