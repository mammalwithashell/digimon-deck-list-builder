  note: "The Option information's [Main] is an Option card effect: blocked by 'not affected by your opponent's Option cards' effects', like a plain Option's (control)."
"4-7-7":
  status: gap
  tests: ["ch15_08_effect_categories::battle_winner_trait_is_the_top_cards_trait", "ch15_08_effect_categories::permanent_trait_is_the_top_cards_trait", "ch15_08_effect_categories::digimon_name_is_the_top_cards_name"]
  note: "Controller ruling, OWNER-DECIDED 2026-10-19 (the project's reading): the bottom cards are part of the top card's information -- they contribute inherited effects (4-7-4) -- but a Digimon's traits are its top card's (with its (Rule) Trait grants, 2-3-4-2); a [TS] digivolution card does not make the Digimon a [TS] Digimon. The manual has no explicit 'traits are the top card's' sentence; official Q&A Q3225 (EX1-038: trashing the top card leaves a Digimon 'without [Free] in its traits' while the [Free] EX1-038 is still a digivolution card) and DCGO (BT25_020.cs / EX8_047.cs read permanent.TopCard) are the ruling. Counted: the battle-winner trait qualifier ('any of your [TS] trait Digimon win a battle') and the host-Digimon trait predicate ('trash this card from a [TS] trait Digimon's digivolution cards') read the top card, each with a top-card control (G-ENGINE-BATTLE-WINNER-TRAIT-READS-DIGIVOLUTION-CARDS resolved). Status (review round 1): the tests pin the Q3225 / DCGO top-card reading of the characteristics consequence; neither sentence is proven as written; the second sentence (bottom cards not on the field; place-under removes) is untested. EX1-038's own inherited text ('[Imperialdramon] in its name or [Free] in its traits', while EX1-038 itself is [Free]) is the strongest card-text evidence for the top-card reading. Name: Controller ruling (Tasks 31 / 35; owner-decided 2026-10-19): 4-7-7 governs stack membership; a Digimon's characteristics (name, traits) are its top card's -- official Q&A Q3225 (EX1-038: after its top card is trashed the Digimon is 'without [Free] in its traits or [Imperialdramon] in its name' although EX1-038 [Free] stays in the stack; EX1-038's own 'While this Digimon has [Imperialdramon] in its name or [Free] in its traits' would always hold under a stack scan) and DCGO TopCard reads. digimon_name_is_the_top_cards_name pins the NAME half ('While this Digimon has [Greymon] in its name': a [Greymon] digivolution card under a non-[Greymon] top card gives no +1000; G-DSL-CARRIER-NAME-READS-DIGIVOLUTION-CARDS). Neither sentence is proven as written; the second sentence (not on the field / place-under removes from the field) is untested. Status stays `gap` on purpose: the tests prove the signed-off characteristics reading, not this rule unit's own two sentences -- a cheap follow-up test (bottom cards contribute inherited effects per 4-7-4; placing a card under a Tamer removes it from the field) would flip it."
