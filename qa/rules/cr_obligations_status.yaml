  note: "In the hand a DUAL is offered both as an Option (use) and as a Digimon (digivolve), and matches both 'Digimon card' and 'Option card' trait searches; an unqualified reference (no category named) reads the Digimon information only (owner ruling W5 (b), 2026-10-17; Task 29 superseded the provisional reading (a)): 'red card' finds the red-Digimon / purple-Option DUAL, 'purple card', 'blue card', 'purple Lv.6 card' and 'card that is not red' do not (test renamed from dual_unqualified_colour_reference_matches_either_information)."
