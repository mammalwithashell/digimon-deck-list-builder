  tests: ["ch15_08_effect_categories::activation_type_declarable_only_when_optional_condition_payable", "ch15_07_optional_conditions::unpayable_optional_condition_cannot_be_chosen"]
  note: "Printed <Training> (parsed from the printed text; the DSL grant_keyword: Training clause is declaration-only by design) is correct and its test passes: not in the action mask while suspended; declared while unsuspended, it suspends with no skip prompt and places the deck top face down. The general case is not: '[Main] By trashing your top security card, <Draw 1>' is in the action mask with 0 security cards and declaring it draws for free (ch15_07 test, #[ignore]d). Only self-cost activation_cost kinds and <Digi-Burst> gate the mask."
