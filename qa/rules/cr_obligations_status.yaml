"4-6-6-2":
  status: proven
  tests: ["ch16_new_keywords::dual_use_declares_digimon_or_option_information", "ch16_new_keywords::dual_option_information_referenced_as_option_card", "ch16_new_keywords::dual_digivolution_card_referenced_as_option_card_for_digivolution_card_search", "ch16_new_keywords::dual_digivolution_card_referenced_as_option_card_reads_option_information", "ch16_new_keywords::dual_digivolution_card_counts_through_the_referenced_information"]
  note: "Option USE reads the Option information (purple color requirement, use cost 2). Card-zone searches now reference the Option information when the search is for an Option card: 'purple Option card' finds the DUAL, 'red Option card' and 'purple Digimon card' don't (both directions pinned, so a both-faces-union fix fails). Also for a DUAL card lying in a Digimon's digivolution cards (official Q&A Q6395, LadyDevimon BT25-083 / BeelStarmon BT25-085): 'By trashing 1 Option card from any of your Digimon's digivolution cards, you may use 1 [Artsy] trait Option card from your trash with the cost reduced by 1' finds the DUAL card, trashes it, and uses that same card from the trash (use cost 2 - 1 paid, its [Main] resolves); an 'Option card' self-source count counts it; and it reads the Option INFORMATION there too: 'purple Option card from the digivolution cards' finds the red-Digimon / purple-Option DUAL, 'red Option card' and 'purple Digimon card' don't (the digivolution-zone twin of the hand pins). The hard-coded stack Option searches (trash_option_from_own_stacks, EX7-048's digivolution-card Option trash) and the 15-7-4 union-zone payability guard read it the same way."
