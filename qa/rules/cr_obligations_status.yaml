  tests: ["ch16_processing_keywords::trashing_a_top_card_is_not_a_digivolution_card_trash"]
  note: "A digivolution card is a card UNDER a Digimon: an effect that trashes a Digimon's top card ('trash the top card of 1 of your Digimon', the Burst Digivolve turn-end idiom; 'trash the top 2 stacked cards', BT21-030) trashes no digivolution card -- the source-trash observer does not trigger and the top-card-trashed observer triggers once per event (once for a 2-card batch); <De-Digivolve> is the same case (16-12-1, ch16_processing_keywords::de_digivolve_trashes_top_cards_not_digivolution_cards). G-ENGINE-TRASH-TOP-SOURCE-FIRES-DIGIVOLUTION-CARD-TRASHED resolved 2026-10-17."
