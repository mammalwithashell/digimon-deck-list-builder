"9-1-4":
  status: proven
  tests: ["ch18_pending_overwrite::used_option_is_in_no_area_during_its_main"]
  note: "While the used Option's [Main] waits on its hand pick, the Option is in neither the hand, the trash nor the battle area."
"9-1-5":
  status: proven
  tests: ["ch18_pending_overwrite::used_option_trashed_immediately_after_first_main_uninterrupted", "ch18_pending_overwrite::option_used_by_an_effect_is_trashed_before_the_rule_check_its_main_caused", "ch18_pending_overwrite::option_with_two_mains_is_trashed_after_the_first"]
  note: "The used Option is disposed in the step that finishes its [Main] body (drain_effect_queue_inner right after the OptionMain entry; the top of drain_effect_queue when the body's last selection has just resolved), before the rules check and any trigger, and logs a GameEvent::Trash. Both halves green: a 0 DP rule-check deletion's would-be-deleted decision parks with the Option already trashed, and a triggered [On Play]'s decision is the next one (no 'Trash the used Option' TriggerOrder branch); the event log orders the Option's Trash before the rule check's effect and deletion and before the [On Play]'s memory gain (F-ENGINE-EFFECT-USED-OPTION-MAIN-IS-ORDERABLE, G-ENGINE-OPTION-TRASH-NO-EVENT resolved). Proven for a player-used Option only: an Option used by an effect from inside a selection callback can still see a rules check before its trash, and only the last queued [Main] (not the 1st) ends the period; both are recorded as residuals in the F- entry, untested. Update (2026-10-17): both residuals closed -- an Option an effect uses from inside its selection callback is trashed before the rule check its [Main] caused (the disposal gate compares to the deferred-depth baseline the body started under), and an Option with two [Main] effects is trashed after the FIRST, the second resolving afterwards from the trash; hand / deck redirects log GameEvent::CardToHand / CardToDeck."
"18-3-1":
  status: proven
  tests: ["ch18_pending_overwrite::infinite_loop_is_stopped_not_silently_cleared", "ch18_pending_overwrite::long_finite_chain_is_not_an_infinite_loop", "ch18_pending_overwrite::dp_progress_chain_is_not_an_infinite_loop"]
  note: "Definition; pinned with 18-3-2. From LOOP_WATCH_START (20) steps on, the drainer records a loop signature (pending entries + board: zones' card handles, suspension, effective DP, per-turn activation counts, memory) before each resolution step; the same state seen LOOP_SIGNATURE_REPEATS (3) times with no declinable decision in between is a loop. A 60-card self-chaining trigger (~120 chained resolutions that end when the deck empties) and a chain whose only progress is DP (+1000 per cycle up to 30000) both run to their end with no loop event."
"18-3-2":
  status: proven
  tests: ["ch18_pending_overwrite::infinite_loop_is_stopped_not_silently_cleared", "ch18_pending_overwrite::forced_prompt_loop_still_ends_in_a_draw", "ch18_pending_overwrite::forced_multi_option_pick_loop_still_ends_in_a_draw", "ch18_pending_overwrite::forced_replacement_order_loop_still_ends_in_a_draw", "ch18_pending_overwrite::infinite_loop_draw_during_an_attack_is_final", "ch18_pending_overwrite::forced_prompt_loop_with_growing_state_still_ends_in_a_draw"]
  note: "A mandatory suspend/unsuspend loop: GameEvent::InfiniteLoop then GameOver { winner: None, reason: InfiniteLoopDraw }. Forced decisions do not reset the loop watch, so a loop whose repetitions only ask a mandatory pick (one option or two) or an immediate-replacement order also draws. The draw is final: one declared inside an attack stops the attack (no later security check, no second GameOver; the first terminal outcome stands). MAX_CHAIN_DEPTH (10_000) remains a far backstop that ends in the same draw, counted both on the chain depth and on the loop watch's age (steps since the last optional decision), so a forced-prompt loop whose DP grows without bound also draws; nothing is cleared with the game going on. Update (2026-10-17): the watch now spans outermost drains -- it resets only on a player decision (a declinable prompt, a runner action, end_turn, a declared attack or a play from hand), never when a drain merely settles, so a loop that runs through several drains with no decision between them (an effect-started attack, a re-fired turn-structure trigger) also draws (game::infinite_loop::loop_watch_tests)."
"18-3-3":
  status: proven
  tests: ["ch18_pending_overwrite::stoppable_loop_repeats_until_its_owner_stops_it"]
  note: "A loop with 'you may suspend it' is offered once per repetition (ruling W10): every resolved declinable decision resets the loop watch and every decision restarts the chain count, so P0 repeats it 40 times, stops it, the Digimon stays unsuspended, the game goes on, and P1's trigger pending since the play activates once. (The test's final MemoryChange expectation was corrected to the turn-player-signed delta -1 by controller ruling; the test had never reached it.)"
