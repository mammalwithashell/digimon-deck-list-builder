  tests: ["ch15_04_effect_states::turn_player_orders_first_then_non_turn_player"]
  note: "The turn-player half behaves correctly in the test (P0 orders only its own effects and resolves all of them first), but the test is #[ignore]d because the non-turn-player half fails; proven once the gap is fixed and the test un-ignored."
"15-4-3-5-2":
  status: gap
  blocks_training: true
  gap_id: G-ENGINE-WHEN-ATTACKING-PARK-DROPS-ALLY-ATTACK-OBSERVERS
  tests: ["ch15_04_effect_states::turn_player_orders_first_then_non_turn_player"]
  note: "When the turn player's [When Attacking] effects park on a TriggerOrder prompt, the non-turn player's 'when an opponent's Digimon attacks' effects are never enqueued. Test is #[ignore]d."
"15-4-4-3":
  status: proven
