  tests: ["ch15_15_unaffected::digimon_only_immunity_is_affected_by_opponent_option_main", "ch15_15_unaffected::digimon_only_immunity_is_affected_by_option_security_activation", "ch15_15_unaffected::digimon_only_immunity_is_affected_by_opponent_tamer_and_own_effects", "ch15_15_unaffected::full_opponent_immunity_blocks_option_tamer_digimon_and_token_effects", "ch15_15_unaffected::full_opponent_immunity_does_not_block_rule_processing", "ch15_15_unaffected::effect_applied_before_immunity_stops_affecting_when_immunity_starts", "ch15_15_unaffected::immunity_granted_mid_effect_covers_later_steps", "ch15_15_unaffected::granted_keyword_stops_being_had_when_immunity_starts", "ch15_15_unaffected::immunity_suppresses_an_opponent_formula_aura_while_it_lasts"]
  note: "Scope matrix: an opponent-Digimon-effect immunity (Atratusmon ST23-09 idiom) is affected by Option [Main] and [Security]-activated [Main] effects, Tamer effects and its own controller's effects, not by opponent Digimon effects; a full opponent-effect immunity (Magnamon (X Antibody) BT16-102 idiom) blocks opponent Option ([Main] and [Security]), Tamer, Digimon and token effects but not its own controller's; battles and the 0-DP rule check are not effects (Q6279). An immunity that starts mid-effect covers that effect's later steps; one that starts after a -DP effect stops it affecting the card (Q6178; read-time suppression in ModifierRegistry::get). Update (2026-10-17): a keyword gained BEFORE the immunity stops being had when it starts (Q6178), and an opponent's live formula aura stops reaching the card (G-ENGINE-PROGRESS-SHIELD-BYPASSED-BY-TIMING-DISABLE-AND-FORMULA-AURAS resolved)."
"15-15-5-2":
  status: proven
  tests: ["ch15_15_unaffected::effect_applied_while_immune_starts_affecting_when_immunity_lapses", "ch15_15_unaffected::progress_attacker_effect_applied_during_attack_applies_after_it", "ch15_15_unaffected::progress_lost_mid_attack_applies_held_opponent_effects_immediately", "ch15_15_unaffected::progress_shield_follows_the_attacker_through_compaction", "ch15_15_unaffected::granted_keyword_not_considered_had_while_immune_had_once_immunity_lapses", "ch15_15_unaffected::progress_attacker_not_affected_by_opponent_formula_aura_while_attacking", "ch15_15_unaffected::immunity_suppresses_an_opponent_formula_aura_while_it_lasts"]
  note: "Record-and-suppress (2026-10-16): a modifier applied to an immune card is recorded (ModifierEntry::affecting_source_kind) and hidden while a covering CannotBeAffected entry exists; it applies as soon as the immunity lapses (the rule's 'while suspended' example: -3000 DP applies on unsuspend) or expires (Atratusmon shape, Q831), for the rest of its own duration. Previously EffectContext::add_modifier skipped the install, so the effect never applied. <Progress> (2026-10-17): an opponent's -3000 DP hidden while the attacker has <Progress> applies the moment it loses <Progress> mid-attack (it battles at 3000 DP and loses), not at the end of the attack; the hidden -3000 DP on the attacker never moves to the Digimon that slides into its slot. Update (2026-10-17): the same for a gained keyword (registry grant) and for a live FORMULA aura (summed inside effective_dp, no stored entry): both apply again the moment the immunity lapses or the attack ends."
"15-15-5-3":
  status: proven
  tests: ["ch15_15_unaffected::immune_permanent_is_still_choosable_and_offered_as_only_candidate", "ch16_attack_keywords::progress_persistent_only_while_attacking", "ch16_attack_keywords::progress_kind_matches_rule"]
  note: "An immune Digimon is offered by an opponent's 'choose 1' (beside another Digimon, and as the only candidate), can be chosen, and is not affected (Q6176, Q3788)."
"15-15-5-4":
  status: proven
  tests: ["ch15_15_unaffected::granted_effect_not_considered_had_while_immune", "ch15_15_unaffected::granted_keyword_not_considered_had_while_immune_had_once_immunity_lapses", "ch15_15_unaffected::progress_attacker_does_not_have_a_keyword_an_opponent_granted_while_attacking"]
  note: "A <Security A. -1> gained from an opponent's Digimon effect while immune is not counted (1 check); once the immunity ends with the grant still in its duration the Digimon checks 0 cards (Q6179). A granted '[End of Your Turn] Delete this Digimon' (EX6-057 idiom) given while immune activates at the end of the carrier's next turn once the immunity has ended (Q2120 / Q3871). Covers modifier-backed gains (the production SecurityAttackChange idiom) and granted triggered effects; keyword-registry grants (grant_keyword; no authored opponent-side use, reachable only under an own-effect immunity) are still an install-time skip in both directions -- a keyword gained while immune is lost, and one gained BEFORE the immunity keeps applying through it, against Q6178 -- non-blocking (G-ENGINE-UNAFFECTED-KEYWORD-GRANT-INSTALL-SKIP). Update (2026-10-17): keyword-registry grants (grant_keyword) are now recorded and read-time gated exactly like modifiers (KeywordEntry::affecting_source_kind; G-ENGINE-UNAFFECTED-KEYWORD-GRANT-INSTALL-SKIP resolved): a <Security A. -1> gained as a KEYWORD while immune is not had (1 check) and is had once the immunity ends (0 checks); one an opponent granted to a <Progress> attacker is not had while it attacks (§16-39-1)."

"15-2-1-1":
  status: proven
  tests: ["ch15_15_unaffected::digimon_only_immunity_blocks_a_digimon_tokens_effect", "ch15_15_unaffected::departed_tokens_deferred_effect_is_still_a_digimon_effect"]
  note: "A token is a Digimon (§4-21-1), so its effect is a Digimon effect: the Familiar Token's [On Deletion] -3000 DP does not affect a Digimon immune to its opponent's Digimon effects (Atratusmon idiom; 12000 DP). Token effects carry EffectSourceKind::Digimon (EffectSourceKind::for_card_kind); Rule is kept for card-less processing only. Attribution witness: effect_source_kind::token_attribution. Update (2026-10-17): still a Digimon effect after the token has left the game -- a YAML token's [On Deletion] that chooses, then applies -3000 DP from a rebuilt context, does not affect the immune Digimon (G-ENGINE-DEPARTED-TOKEN-CONTEXT-FALLS-BACK-TO-RULE resolved)."

