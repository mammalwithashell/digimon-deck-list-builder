"4-9-5":
  status: proven
  tests: ["ch16_processing_keywords::link_max_base_is_one", "ch16_processing_keywords::declared_link_at_limit_replaces_existing_link_card_by_choice", "ch16_processing_keywords::effect_link_at_limit_replaces_existing_link_card_by_choice", "ch16_processing_keywords::effect_relink_at_limit_offers_the_same_choice"]
  note: "Base limit 1 (Game::link_limit). Every link at the limit replaces existing link cards in the link itself: a declared link (link_max_base_is_one, declared_link_at_limit_replaces_existing_link_card_by_choice), an effect's link_cards pick (effect_link_at_limit_replaces_existing_link_card_by_choice) and an effect relinking its own Digimon (effect_relink_at_limit_offers_the_same_choice). With 2+ existing link cards and fewer to replace, the linking player chooses which (one shared LinkCardTrashChoice frame; §10-1-3-1, W12); the new card is never an option and no later 17-1-3-2-5 trim follows. With nothing to choose the replaced cards are trashed directly. The rule-check trims excess_link_cards_* are ch17's 17-1-3-2-5."
