# Hand-maintained status sidecar for the Comprehensive Rules obligation denominator.
# Consumed by `python -m tools.rules.build_obligations` to generate cr_obligations.json.
#
# Schema: a mapping of rule id -> entry. An id that is ABSENT here is `gap` with
# `blocks_training: false`; heading-only units (no sentence terminator and at most
# 6 words, or a bare keyword icon such as <Blocker>) are seeded `not-testable`
# automatically and need no entry. An entry overrides those defaults.
#
#   "<rule-id>":
#     status: gap | proven | not-testable     # required
#     tests: ["<module>::<test_fn>", ...]     # optional; proving tests (status: proven)
#     gap_id: "<tracker id>"                  # optional; entry in the gap tracker
#     blocks_training: true | false           # optional; default false
#     note: "free text"                       # optional
#
# Ids must exist in the rules source; unknown ids make the build fail. Each entry
# must be a mapping.
#
# Heuristic exception: the enumerated leaves under 17-1-3 (ids 17-1-3-<n>-<m>,
# depth >= 5; the deletion/trash targets of the rule checks) are normative, so the
# heading heuristic never seeds them `not-testable` (e.g. 17-1-3-2-4 "Face-down
# cards placed on the field"). They default to `gap`. The depth-4 sub-headings
# 17-1-3-1 "Deletion Targets" and 17-1-3-2 "Trash Targets" stay `not-testable`.
"17-1-3-2-4":
  status: gap
  note: "Rule-check trash target (normative); explicit so the short text is never read as a heading."
"16-4":
  status: not-testable
  note: "Keyword icon <Security A.> with a formerly-named parenthetical (※formerly <Security Attack>); a keyword label, not a testable rule."

