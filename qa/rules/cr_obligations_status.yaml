"16-39-1":
  status: proven
  tests: ["ch16_attack_keywords::progress_persistent_only_while_attacking", "ch15_15_unaffected::progress_attacker_effect_applied_during_attack_applies_after_it", "ch15_15_unaffected::progress_attacker_not_affected_by_earlier_opponent_effect_while_attacking", "ch15_15_unaffected::progress_shield_follows_the_attacker_through_compaction", "ch15_15_unaffected::progress_attacker_does_not_have_a_keyword_an_opponent_granted_while_attacking", "ch15_15_unaffected::progress_attacker_not_affected_by_opponent_formula_aura_while_attacking"]
  note: "The opponent's 'when an opponent's Digimon attacks, 1 of your opponent's Digimon gets -3000 DP' CAN choose the attacking <Progress> Digimon (§15-15-5-3) and doesn't affect it while it attacks; the -3000 DP applies when the attack ends. An opponent's -12000 DP applied during the attack applies when the attack ends. An opponent's -3000 DP applied BEFORE the attack stops affecting it while it attacks (it battles at its printed 6000 DP and wins) and affects it again after (Q6178). Read-time shield (2026-10-17): ModifierRegistry::progress_shield, refreshed by Game::refresh_progress_shield, hides every opponent effect's entry on the attacker, which it follows through battle-area compaction by identity. Update (2026-10-17): the shield also hides a keyword an opponent's effect granted (not had while attacking, had again after) and an opponent's live formula aura (battles at full DP, affected again after); timing disables and the raw modifier scans read through the same gate (registry unit tests)."
"16-39-2":
  status: proven
  tests: ["ch16_attack_keywords::progress_kind_matches_rule"]
  note: "A <Progress> gained by [When Attacking] protects at once from the opponent's effect resolving after it: the attacker is still offered by the opponent's pick (§15-15-5-3; re-pinned 2026-10-16, the earlier pin excluded it) and, chosen, battles unaffected; the -3000 DP applies when the attack ends."
"16-39-3":
  status: proven
  tests: ["ch16_attack_keywords::progress_persistent_only_while_attacking"]
  note: "Not attacking (another Digimon attacks), it can be chosen and gets -3000 DP."
"11-2-7-1":
  status: proven
  tests: ["ch16_attack_keywords::vortex_attack_target_is_a_suspended_digimon", "ch16_attack_keywords::raid_attacker_declares_on_a_legal_target_then_may_switch"]
  note: "At the end of P0's turn a <Vortex> attack is offered against P1's suspended Digimon but not its UNSUSPENDED one (only a suspended Digimon or the opponent is a legal target; <Vortex> adds no target permission, contrast <Execute> 16-38-1). In the Main phase a <Raid> attacker may declare on the opponent or a suspended Digimon, never on an unsuspended one (the highest-DP ones included); <Raid> adds no declaration target."
"11-4-1":
  status: proven
  tests: ["ch16_attack_keywords::vortex_attack_has_block_timing"]
  note: "A <Vortex> attack at the end of P0's turn offers P1 the block timing: P1's <Blocker> blocks and battles instead of the target (the counter timing also opens: combat::counter_interrupt::vortex_attack_has_counter_timing). Ordinary attacks' block timing is proven in ch11_14 (one_block_per_attack et al.)."

