"4-6-3":
  status: proven
  tests: ["ch16_new_keywords::dual_on_field_is_a_digimon_not_an_option", "ch16_new_keywords::dual_digivolution_card_on_field_reads_digimon_information", "ch16_new_keywords::dual_digivolution_card_counts_through_the_referenced_information"]
  note: "The rule's example: 'trash 1 of your opponent's Option cards in the battle area' never takes the DUAL stack (trashes a real field Option instead, or nothing); 'delete 1 Digimon' deletes it. Zone split (Task 37, official Q&A Q6395 / Q6404): the rule governs the DUAL card AS the permanent -- the TOP card of a battle-area or breeding stack (Game::card_is_permanent_top_card) is a Digimon whatever the reference. A DUAL card lying in a permanent's digivolution or link cards is read by what the reference names: an unqualified reference reads the Digimon information (red found, purple not; W5 (b)), a 'Digimon card' reference finds it, and an 'Option card' reference finds it too and reads its Option information (4-6-6-2). Task 18's reading that every DUAL card on the field, digivolution cards included, can't be referenced as an Option card was contradicted by Q6395 and re-pinned (the 'Option card' self-source count now counts it; test renamed from dual_digivolution_card_counts_as_digimon_only)."
