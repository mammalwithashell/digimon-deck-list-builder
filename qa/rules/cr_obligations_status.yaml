  note: "The deck carries its own face (every deck card is face-down); a card entering it keeps no face-down state it had as a digivolution card (3-1-3-1-2), so a later placement under a permanent that sets no face does not count it as a face-down card (4-7-9). Every deck entry goes through Player::put_on_deck_top / insert_in_deck / put_all_on_deck_top / insert_all_in_deck / put_in_deck_or_digi_egg_deck; player::tests::zone_entries_go_through_the_player_helpers keeps direct pushes (and local &mut aliases) out of src/."
