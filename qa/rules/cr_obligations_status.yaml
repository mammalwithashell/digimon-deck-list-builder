  note: "As 3-2-2 for the Digi-Egg deck: Player::put_on_digi_egg_deck_top / insert_in_digi_egg_deck / insert_all_in_digi_egg_deck / put_in_deck_or_digi_egg_deck drop the face-down state; a Digi-Egg card returned 'to the deck' goes to the Digi-Egg deck."
"3-4-2":
