# REPRO (not an exam scenario; lives outside qa/dcgo-exams on purpose).
# G-ENGINE-BARRIER-CONDITION-NOT-CARRIER-SCOPED, found authoring the Glowing
# Dawn exam (NOTES-GLOWING-DAWN.md). Murasamemon BT25-041 carries inherited
# <Barrier> (BT25-032) and <Piercing> (BT25-049). On T5 it attacks P1's
# Biyomon BT1-009 and deletes it. Our engine then parks a <Barrier>
