# REPRO (not an exam scenario; lives outside qa/dcgo-exams on purpose).
# Found authoring the Glowing Dawn exam (NOTES-GLOWING-DAWN.md): NightChiropmon
# BT26-070 [On Play] "By trashing 2 bottom face-down cards from under any of
# your Tamers, you may use 1 [Glowing Dawn] Option from your trash..." with
# ST23-13 as the Tamer. ST23-13's "[Your Turn] When effects trash cards from
# under this Tamer, by suspending this Tamer, +3000" fires and resolves
# BETWEEN the two trashed cards (assert at 14: one card still under the
# Tamer), i.e. mid-cost, before the Option use. Rule 15-8-3-2: a trigger
# raised mid-effect waits until the effect finishes. Asserts pin the CURRENT
# behaviour. The committed exam line (BT26-070-effect3) uses BT26-089 instead.
# Run: dcgo-harness exam --scenario <this> --sim-only --cards-json data/cards.json
#      --decks qa/dcgo-exams/ST23/glowing_dawn_pool.json
