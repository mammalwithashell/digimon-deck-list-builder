name: "Field Placement: played card moves from hand to field"
description: |
  Ensure BT16-055 (Namakemon) is in P1 starting hand, play it, and verify
  it appears on the field and is no longer in hand.

setup:
  deck1_archetype: "Puppets"
  deck2_archetype: "Puppets"
  memory: 10
  first_player: 1
  starting_hand1: ["BT16-055"]

actions:
  - find: "Play Namakemon from hand"
  - auto_resolve: true

assertions:
  - zone_contains:
      player: 1
      zone: field
      card: "BT16-055"
  - zone_not_contains:
      player: 1
      zone: hand
      card: "BT16-055"
  - not_game_over: true
