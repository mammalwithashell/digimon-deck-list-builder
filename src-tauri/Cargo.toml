[package]
name = "digimon-tcg"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
digimon-engine = { path = "../digimon-engine" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Build the desktop app without the Python sidecar — the frontend talks to
# the in-process Rust engine via Tauri `invoke()` commands only.
# Pair with `VITE_ENGINE=rust` on the frontend build and the
# `tauri.rust.conf.json` bundle config (which drops `externalBin`).
no-sidecar = []
