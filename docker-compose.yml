version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: digimon
      POSTGRES_PASSWORD: digimon
      POSTGRES_DB: digimon
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digimon"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.hosted
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      SECRET_KEY: local-dev-secret-do-not-use-in-prod
      DATABASE_URL: postgresql+asyncpg://digimon:digimon@postgres:5432/digimon
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      INVITE_CODES_REQUIRED: "false"
      MODEL_STORAGE_BACKEND: local
      MODEL_STORAGE_LOCAL_ROOT: /home/app/data/models_store
    ports:
      - "8000:8000"
    volumes:
      - modeldata:/home/app/data/models_store

volumes:
  pgdata:
  modeldata:
